# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 8
verses:
  - n: 1
    text:
      la: "Eliseus autem locutus est ad mulierem, cujus vivere fecerat filium, dicens: Surge, vade tu et domus tua, et peregrinare ubicumque repereris: vocavit enim Dominus famem, et veniet super terram septem annis."
      en: "And Eliseus spoke to the woman, whose son he had restored to life, saying: Arise, and go thou and thy household, and sojourn wheresoever thou canst find: for the Lord hath exiled a famine, and it shall come upon the land seven years."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quae surrexit, et fecit juxta verbum hominis Dei: et vadens cum domo sua, peregrinata est in terra Philisthiim diebus multis."
      en: "And she arose, and did according to the word of the man of God: and going with her household, she sojourned in the land of the Philistines many days."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cumque finiti essent anni septem, reversa est mulier de terra Philisthiim: et egressa est ut interpellaret regem pro domo sua, et pro agris suis."
      en: "And when the seven years were ended, the woman returned out of the land of the Philistines, and she went forth to speak to the king for her house, and for her lands."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Rex autem loquebatur cum Giezi puero viri Dei, dicens: Narra mihi omnia magnalia quae fecit Eliseus."
      en: "And the king talked with Giezi, the servant of the man of God, saying: Tell me all the great things that Eliseus hath done."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cumque ille narraret regi quomodo mortuum suscitasset, apparuit mulier, cujus vivificaverat filium, clamans ad regem pro domo sua, et pro agris suis. Dixitque Giezi: Domine mi rex, haec est mulier, et hic est filius ejus quem suscitavit Eliseus."
      en: "And when he was telling the king how he had raised one dead to life, the woman appeared, whose son he had restored to life, crying to the king for her house, and her lands. And Giezi said: My lord O king, this is the woman, and this is her son, whom Eliseus raised to life."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et interrogavit rex mulierem: quae narravit ei. Deditque ei rex eunuchum unum, dicens: Restitue ei omnia quae sua sunt, et universos reditus agrorum, a die qua reliquit terram usque ad praesens."
      en: "And the king asked the woman: and she told him. And the king appointed her an eunuch, saying: Restore her all that is hers, and all the revenues of the lands, from the day that she left the land, to this present."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Venit quoque Eliseus Damascum, et Benadad rex Syriae aegrotabat: nuntiaveruntque ei, dicentes: Venit vir Dei huc."
      en: "Eliseus also came to Damascus, and Benadad king of Syria was sick: and they told him, saying: The man of God is come hither."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et ait rex ad Hazael: Tolle tecum munera, et vade in occursum viri Dei, et consule Dominum per eum, dicens: Si evadere potero de infirmitate mea hac?"
      en: "And the king said to Hazael: Take with thee presents, and go to meet the man of God, and consult the Lord by him, saying: Can I recover of this my illness?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ivit igitur Hazael in occursum ejus, habens secum munera, et omnia bona Damasci, onera quadraginta camelorum. Cumque stetisset coram eo, ait: Filius tuus Benadad rex Syriae misit me ad te, dicens: Si sanari potero de infirmitate mea hac?"
      en: "And Hazael went to meet him, taking with him presents, and all the good things of Damascus, the burdens of forty camels. And when he stood before him, he said: Thy son Benadad the king of Syria hath sent me to thee, saying: Can I recover of this my illness?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dixitque ei Eliseus: Vade, dic ei: Sanaberis: porro ostendit mihi Dominus quia morte morietur."
      en: "And Eliseus said to him: Go tell him: Thou shalt recover: but the Lord hath shewn me that he shall surely die."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Stetique cum eo, et conturbatus est usque ad suffusionem vultus: flevitque vir Dei."
      en: "And he stood with him, and was troubled so far as to blush: and the man of God wept."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cui Hazael ait: Quare dominus meus flet? At ille dixit: Quia scio quae facturus sis filiis Israel mala. Civitates eorum munitas igne succendes, et juvenes eorum interficies gladio, et parvulos eorum elides, et praegnantes divides."
      en: "And Hazael said to him: Why doth my lord weep? And he said: Because I know the evil that thou wilt do to the children of Israel. Their strong cities thou wilt burn with fire, and their young men thou wilt kill with the sword, and thou wilt dash their children, and rip up their pregnant women."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dixitque Hazael: Quid enim sum servus tuus canis, ut faciam rem istam magnam? Et ait Eliseus: Ostendit mihi Dominus te regem Syriae fore."
      en: "And Hazael said: But what am I thy servant a dog, that I should do this great thing? And Eliseus said: The Lord hath shewn me that thou shalt be king of Syria."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Qui cum recessisset ab Eliseo, venit ad dominum suum. Qui ait ei: Quid dixit tibi Eliseus? At ille respondit: Dixit mihi: Recipies sanitatem."
      en: "And when he was departed from Eliseus, he came to his master, who said to him: What saith Eliseus to thee? And he answered: He told me: Thou shalt recover."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cumque venisset dies altera, tulit stragulum, et infudit aquam, et expandit super faciem ejus: quo mortuo, regnavit Hazael pro eo."
      en: "And on the next day he took a blanket, and poured water on it, and spread it upon his face: and he died, and Hazael reigned in his stead."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Anno quinto Joram filii Achab regis Israel, et Josaphat regis Juda, regnavit Joram filius Josaphat rex Juda."
      en: "In the fifth year of Joram son of Achab king of Israel, and of Josaphat king of Juda, reigned Joram son of Josaphat king of Juda."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Triginta duorum annorum erat cum regnare coepisset, et octo annis regnavit in Jerusalem."
      en: "He was two and thirty years old when he began to reign, and he reigned eight years in Jerusalem."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ambulavitque in viis regum Israel, sicut ambulaverat domus Achab: filia enim Achab erat uxor ejus: et fecit quod malum est in conspectu Domini."
      en: "And he walked in the ways of the kings of Israel, as the house of Achab had walked: for the daughter of Achab was his wife: and he did that which was evil in the sight of the Lord."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Noluit autem Dominus disperdere Judam, propter David servum suum, sicut promiserat ei, ut daret illi lucernam, et filiis ejus cunctis diebus."
      en: "But the Lord would not destroy Juda, for David his servant's sake, as he had promised him, to give him a light, and to his children always."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "In diebus ejus recessit Edom, ne esset sub Juda, et constituit sibi regem."
      en: "In his days Edom revolted, from being under Juda, and made themselves a king."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Venitque Joram Seira, et omnes currus cum eo: et surrexit nocte, percussitque Idumaeos, qui eum circumdederant, et principes curruum, populus autem fugit in tabernacula sua."
      en: "And Joram came to Seira, and all the chariots with him: and he arose in the night, and defeated the Edomites that had surrounded him, and the captains of the chariots, but the people fled into their tents."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Recessit ergo Edom ne esset sub Juda, usque ad diem hanc. Tunc recessit et Lobna in tempore illo."
      en: "So Edom revolted from being under Juda, unto this day. Then Lobna also revolted at the same time."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Reliqua autem sermonum Joram, et universa quae fecit, nonne haec scripta sunt in libro verborum dierum regum Juda?"
      en: "But the rest of the acts of Joram, and all that he did, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et dormivit Joram cum patribus suis, sepultusque est cum eis in civitate David, et regnavit Ochozias filius ejus pro eo."
      en: "And Joram slept with his fathers, and was buried with them in the city of David, and Ochozias his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Anno duodecimo Joram filii Achab regis Israel regnavit Ochozias filius Joram regis Judae."
      en: "In the twelfth year of Joram son of Achab king of Israel, reigned Ochozias son of Joram king of Juda."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Viginti duorum annorum erat Ochozias cum regnare coepisset, et uno anno regnavit in Jerusalem: nomen matris ejus Athalia filia Amri regis Israel."
      en: "Ochozias was two and twenty years old when he began to reign, and he reigned one year in Jerusalem: the name of his mother was Athalia the daughter of Amri king of Israel."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et ambulavit in viis domus Achab: et fecit quod malum est coram Domino, sicut domus Achab: gener enim domus Achab fuit."
      en: "And he walked in the ways of the house of Achab: and he did evil before the Lord, as did the house of Achab: for he was the son in law of the house of Achab."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Abiit quoque cum Joram filio Achab, ad praeliandum contra Hazael regem Syriae in Ramoth Galaad, et vulneraverunt Syri Joram:"
      en: "He went also with Joram son of Achab, to fight against Hazael king of Syria in Ramoth Galaad, and the Syrians wounded Joram:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "qui reversus est ut curaretur, in Jezrahel: quia vulneraverant eum Syri in Ramoth praeliantem contra Hazael regem Syriae. Porro Ochozias filius Joram rex Juda descendit invisere Joram filium Achab in Jezrahel, quia aegrotabat ibi."
      en: "And he went back to be healed, in Jezrahel: because the Syrians had wounded him in Ramoth when he fought against Hazael king of Syria. And Ochozias the son of Joram king of Juda, went down to visit Joram the son of Achab in Jezrahel, because he was sick there."
    status: { la: verified, en: verified }
