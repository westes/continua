book: 4reg
chapter: 8
verses:
  - n: 1
    text:
      la: "Heliseus autem locutus est ad mulierem cuius vivere fecerat filium dicens surge vade tu et domus tua et peregrinare ubicumque reppereris vocavit enim Dominus famem et veniet super terram septem annis"
      en: "And Eliseus spoke to the woman, whose son he had restored to life, saying: Arise, and go thou and thy household, and sojourn wheresoever thou canst find: for the Lord hath exiled a famine, and it shall come upon the land seven years."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quae surrexit et fecit iuxta verbum hominis Dei et vadens cum domo sua peregrinata est in terra Philisthim diebus multis"
      en: "And she arose, and did according to the word of the man of God: and going with her household, she sojourned in the land of the Philistines many days."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cumque finiti essent anni septem reversa est mulier de terra Philisthim et egressa est ut interpellaret regem pro domo sua et agris suis"
      en: "And when the seven years were ended, the woman returned out of the land of the Philistines, and she went forth to speak to the king for her house, and for her lands."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "rex autem loquebatur cum Giezi puero viri Dei dicens narra mihi omnia magnalia quae fecit Heliseus"
      en: "And the king talked with Giezi, the servant of the man of God, saying: Tell me all the great things that Eliseus hath done."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cumque ille narraret regi quomodo mortuum suscitasset apparuit mulier cuius vivificaverat filium clamans ad regem pro domo sua et pro agris suis dixitque Giezi domine mi rex haec est mulier et hic filius eius quem suscitavit Heliseus"
      en: "And when he was telling the king how he had raised one dead to life, the woman appeared, whose son he had restored to life, crying to the king for her house, and her lands. And Giezi said: My lord O king, this is the woman, and this is her son, whom Eliseus raised to life."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et interrogavit rex mulierem quae narravit ei deditque ei rex eunuchum unum dicens restitue ei omnia quae sua sunt et universos reditus agrorum a die qua reliquit terram usque ad praesens"
      en: "And the king asked the woman: and she told him. And the king appointed her an eunuch, saying: Restore her all that is hers, and all the revenues of the lands, from the day that she left the land, to this present."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "venit quoque Heliseus Damascum et Benadad rex Syriae aegrotabat nuntiaveruntque ei dicentes venit vir Dei huc"
      en: "Eliseus also came to Damascus, and Benadad king of Syria was sick: and they told him, saying: The man of God is come hither."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et ait rex ad Azahel tolle tecum munera et vade in occursum viri Dei et consule Dominum per eum dicens si evadere potero de infirmitate mea hac"
      en: "And the king said to Hazael: Take with thee presents, and go to meet the man of God, and consult the Lord by him, saying: Can I recover of this my illness?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ivit igitur Azahel in occursum eius habens secum munera et omnia bona Damasci onera quadraginta camelorum cumque stetisset coram eo ait filius tuus Benadad rex Syriae misit me ad te dicens si sanari potero de infirmitate mea hac"
      en: "And Hazael went to meet him, taking with him presents, and all the good things of Damascus, the burdens of forty camels. And when he stood before him, he said: Thy son Benadad the king of Syria hath sent me to thee, saying: Can I recover of this my illness?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dixitque ei Heliseus vade dic ei sanaberis porro ostendit mihi Dominus quia morte morietur"
      en: "And Eliseus said to him: Go tell him: Thou shalt recover: bat the Lord hath shewn me that he shall surely die."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "stetitque cum eo et conturbatus est usque ad suffusionem vultus flevitque vir Dei"
      en: "And he stood with him, and was troubled so far as to blush: and the man of God wept."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cui Azahel ait quare dominus meus flet at ille respondit quia scio quae facturus sis filiis Israhel mala civitates eorum munitas igne succendes et iuvenes eorum interficies gladio et parvulos eorum elides et praegnantes divides"
      en: "And Hazael said to him: Why doth my lord weep? And he said: Because I know the evil that thou wilt do to the children of Israel. Their strong cities then wilt burn with fire, and their young men thou wilt kill with the sword, and thou wilt dash their children, and rip up their pregnant women."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixitque Azahel quid enim sum servus tuus canis ut faciam rem istam magnam et ait Heliseus ostendit mihi Dominus te regem Syriae fore"
      en: "And Hazael said: But what am I thy servant a dog, that I should do this great thing? And Eliseus said: The Lord hath shewn me that thou shalt be king of Syria."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui cum recessisset ab Heliseo venit ad dominum suum qui ait ei quid tibi dixit Heliseus at ille respondit dixit mihi recipiet sanitatem"
      en: "And when he was departed from Eliseus, he came to his master, who said to him: What saith Eliseus to thee? And he answered: He told me: Thou shalt recover."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cumque venisset dies altera tulit sagulum et infudit aqua et expandit super faciem eius quo mortuo regnavit Azahel pro eo"
      en: "And on the next day he took a blanket, and pouted water on it, and spread it upon his face: and he died, and Hazael reigned in his stead."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "anno quinto Ioram filii Ahab regis Israhel et Iosaphat regis Iuda regnavit Ioram filius Iosaphat rex Iuda"
      en: "In the fifth year of Joram son of Achab king of Israel, and of Josaphat king of Juda, reigned Joram son of Josaphat king of Juda."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "triginta duorum erat annorum cum regnare coepisset et octo annis regnavit in Hierusalem"
      en: "He was two and thirty years old when he began to reign, and he reigned eight years in Jerusalem."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ambulavitque in viis regum Israhel sicut ambulaverat domus Ahab filia enim Ahab erat uxor eius et fecit quod malum est coram Domino"
      en: "And he walked in the ways of the kings of Israel, as the house of Achab had walked: for the daughter of Achab was his wife: and he did that which was evil in the sight of the Lord."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "noluit autem Dominus disperdere Iudam propter David servum suum sicut promiserat ei ut daret illi lucernam et filiis eius cunctis diebus"
      en: "But the Lord would not destroy Juda, for David his servant's sake, as he had promised him, to give him a light, and to his children always."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "in diebus eius recessit Edom ne esset sub Iuda et constituit sibi regem"
      en: "In his days Edom revolted, from being under Juda, and made themselves a king."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "venitque Ioram Seira et omnis currus cum eo et surrexit nocte percussitque Idumeos qui eum circumdederant et principes curruum populus autem fugit in tabernacula sua"
      en: "And Joram came to Seira, and all the chariots with him: and he arose in the night, and defeated the Edomites that had surrounded him, and the captains of the chariots, but the people fled into their tents."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "recessit ergo Edom ne esset sub Iuda usque ad diem hanc tunc recessit et Lobna in tempore illo"
      en: "So Edom revolted from being under Juda, unto this day. Then Lobna also revolted at the same time."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "reliqua autem sermonum Ioram et universa quae fecit nonne haec scripta sunt in libro verborum dierum regum Iuda"
      en: "But the rest of the acts of Joram, and all that he did, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et dormivit Ioram cum patribus suis sepultusque est cum eis in civitate David et regnavit Ahazias filius eius pro eo"
      en: "And Joram slept with his fathers, and was buried with them in the city of David, and Ochozias his son reigned in Iris stead."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "anno duodecimo Ioram filii Ahab regis Israhel regnavit Ahazias filius Ioram regis Iudae"
      en: "In the twelfth year of Joram son of Achab king of Israel, reigned Ochozias son of Joram king of Juda."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "viginti duorum annorum erat Ahazias cum regnare coepisset et uno anno regnavit in Hierusalem nomen matris eius Athalia filia Amri regis Israhel"
      en: "Ochozias was two and twenty years old when he began to reign, and he reigned one year in Jerusalem: the name of his mother was Athalia the daughter of Amri king of Israel."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et ambulavit in viis domus Ahab et fecit quod malum est coram Domino sicut domus Ahab gener enim domus Ahab fuit"
      en: "And he walked in the ways of the house of Achab: and he did evil before the Lord, as did the house of Achab: for he was the son in law of the house of Achab."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "abiit quoque cum Ioram filio Ahab ad proeliandum contra Azahel regem Syriae in Ramoth Galaad et vulneraverunt Syri Ioram"
      en: "He went also with Joram son of Achab, to fight against Hazael king of Syria in Ramoth Galaad, and the Syrians wounded Joram:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "qui reversus est ut curaretur in Hiezrahel quia vulneraverant eum Syri in Rama proeliantem contra Azahel regem Syriae porro Ahazias filius Ioram rex Iuda descendit invisere Ioram filium Ahab in Hiezrahel quia aegrotabat"
      en: "And he went back to be healed, in Jezrahel: because the Syrians had wounded him in Ramoth when he fought against Hazael king of Syria. And Ochozias the son of Joram king of Juda, went down to visit Joram the son of Achab in Jezrahel, because he was sick there."
    status: { la: verified, en: verified }
