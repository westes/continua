# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1par
chapter: 8
verses:
  - n: 1
    text:
      la: "Benjamin autem genuit Bale primogenitum suum, Asbel secundum, Ahara tertium,"
      en: "Now Benjamin beget Bale his firstborn, Asbel the second, Ahara the third,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Nohaa quartum, et Rapha quintum."
      en: "Nohaa the fourth, and Rapha the fifth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Fueruntque filii Bale: Addar, et Gera, et Abiud,"
      en: "And the sons of Bale were Addar, and Gera, and Abiud,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Abisue quoque et Naaman, et Ahoe,"
      en: "And Abisue, and Naamar, and Ahoe,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "sed et Gera, et Sephuphan, et Huram."
      en: "And Gera, and Sephuphan, and Huram."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Hi sunt filii Ahod, principes cognationum habitantium in Gabaa, qui translati sunt in Manahath."
      en: "These are the sons of Ahod, heads of families that dwelt in Gabaa, who were removed into Mrtnahsth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Naaman autem, et Achia, et Gera ipse transtulit eos, et genuit Osa, et Ahiud."
      en: "And Naaman, and Achia, and Gera he removed them, and beget Oza, and Ahiud."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Porro Saharaim genuit in regione Moab, postquam dimisit Husim et Bara uxores suas."
      en: "And Saharim begot in the land of Moab, after he sent away Husim and Bara his wives."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Genuit autem de Hodes uxore sua Jobab, et Sebia, et Mosa, et Molchom,"
      en: "And he beget of Hodes his wife Jobab, and Sebia, and Mesa, and Molchom,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Jehus quoque, et Sechia, et Marma: hi sunt filii ejus principes in familiis suis."
      en: "And Jehus and Sechia, and Marma. These were his sons heads of their families."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Mehusim vero genuit Abitob, et Elphaal."
      en: "And Mehusim beget Abitob, and Elphaal."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Porro filii Elphaal: Heber, et Misaam, et Samad: hic aedificavit Ono, et Lod, et filias ejus."
      en: "And the sons of Elphaal were Heber, and Misaam, and Samad: who built One, and Led, and its daughters."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Baria autem, et Sama principes cognationum habitantium in Ajalon: hi fugaverunt habitatores Geth."
      en: "And Baria, and Sama were heads of their kindreds that dwelt in Aialon: these drove away the inhabitants of Geth."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et Ahio, et Sesac, et Jerimoth,"
      en: "And Ahio, and Sesac, and Jerimoth,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et Zabadia, et Arod, et Heder,"
      en: "And Zabadia, and Arod, and Heder,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Michael quoque, et Jespha, et Joha filii Baria."
      en: "And Michael, and Jespha, and Joha, the sons of Baria."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et Zabadia, et Mosollam, et Hezeci, et Heber,"
      en: "And Zabadia, and Mosollam, and Hezeci, and Heber,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et Jesamari, et Jezlia, et Jobab filii Elphaal,"
      en: "And Jesamari, and Jezlia, and Jobab, sons of Elphaal,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et Jacim, et Zechri, et Zabdi,"
      en: "And Jacim, and Zechri, and Zabdi,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et Elioenai, et Selethai, et Eliel,"
      en: "And Elioenai, and Selethai, and Elial,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et Adaia, et Baraia, et Samarath filii Semei."
      en: "And Adaia, and Baraia, and Samareth, the sons of Semei."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et Jespham, et Heber, et Eliel,"
      en: "And Jespham, and Heber, and Eliel,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et Abdon, et Zechri, et Hanan,"
      en: "And Abdon, and Zechri, and Hanan,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et Hanania, et Aelam, et Anathothia,"
      en: "And Hanania, and Elam, and Anathothia."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et Jephdaia, et Phanuel filii Sesac."
      en: "And Jephdaia, and Phanuel the sons of Sesac."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et Samsari, et Sohoria, et Otholia,"
      en: "And Samsari, and Sohoria and Otholia,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et Jersia, et Elia, et Zechri, filii Jeroham."
      en: "And Jersia, and Elia, and Zechri, the sons of Jeroham."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Hi patriarchae, et cognationum principes, qui habitaverunt in Jerusalem."
      en: "These were the chief fathers, and heads of their families who dwelt in Jerusalem."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "In Gabaon autem habitaverunt Abigabaon, et nomen uxoris ejus Maacha:"
      en: "And at Gabaon dwelt Abigabaon, and the name of his wife was Maacha:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "filiusque ejus primogenitus Abdon, et Sur, et Cis, et Baal, et Nadab,"
      en: "And his firstborn son Abdon, and Sur, and Cia, and Baal, and Nadab,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Gedor quoque, et Ahio, et Zacher, et Macelloth:"
      en: "And Gedor, and Ahio, and Zacher, and Macelloth:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et Macelloth genuit Samaa: habitaveruntque ex adverso fratrum suorum in Jerusalem cum fratribus suis."
      en: "And Macelloth beget Samaa: and they dwelt over against their brethren in Jerusalem with their brethren."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Ner autem genuit Cis, et Cis genuit Saul. Porro Saul genuit Jonathan, et Melchisua, et Abinadab, et Esbaal."
      en: "And Ner beget Cia, and Cia beget Saul. And Saul begot Jonathan and Melchisua, and Abinadab, and Esbaal."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Filius autem Jonathan, Meribbaal: et Meribbaal genuit Micha."
      en: "And the son of Jonathan was Meribbaal: and Meribbaal begot Micha."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Filii Micha, Phithon, et Melech, et Tharaa, et Ahaz."
      en: "And the sons of Micha were Phithon, and Melech, and Tharaa, and Ahaz."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et Ahaz genuit Joada: et Joada genuit Alamath, et Azmoth, et Zamri: porro Zamri genuit Mosa,"
      en: "And Ahaz beget Joada: and Joada beget Alamath, and Azmoth, and Zamri: and Zamri beget Mesa,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et Mosa genuit Banaa, cujus filius fuit Rapha, de quo ortus est Elasa, qui genuit Asel."
      en: "And Mesa beget Banaa, whose son was Rapha, of whom was born Elasa, who beget Asel."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Porro Asel sex filii fuerunt his nominibus: Ezricam, Bocru, Ismahel, Saria, Obdia, et Hanan: omnes hi filii Asel."
      en: "And Asel had six sons whose names were Ezricam, Bochru, Ismahel, Saria, Obdia, and Hanan. All these were the sons of Asel."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Filii autem Esec fratris ejus, Ulam primogenitus, et Jehus secundus, et Eliphalet tertius."
      en: "And the sons of Esec, his brother, were Ulam the firstborn, and Jehus the second, and Eliphelet the third."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Fueruntque filii Ulam viri robustissimi, et magno robore tendentes arcum: et multos habentes filios ac nepotes, usque ad centum quinquaginta. Omnes hi, filii Benjamin."
      en: "And the sons of Ulam were most valiant men, and archers of great strength: and they had many sons and grandsons, even to a hundred and fifty. All these were children of Benjamin."
    status: { la: verified, en: verified }
