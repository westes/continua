book: 1par
chapter: 8
verses:
  - n: 1
    text:
      la: "Beniamin autem genuit Bale primogenitum suum Asbal secundum Ohora tertium"
      en: "Now Benjamin beget Bale his firstborn, Asbel the second, Ahara the third,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Nuaha quartum et Rapha quintum"
      en: "Nohaa the fourth, and Rapha the fifth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "fueruntque filii Bale Addaor et Gera et Abiud"
      en: "And the sons of Bale were Addar, and Gera, and Abiud,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Abisue quoque et Neman et Ahoe"
      en: "And Abisue, and Naamar, and Ahoe,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "sed et Gera et Sephuphan et Uram"
      en: "And Gera, and Sephuphan, and Huram."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "hii sunt filii Aod principes cognationum habitantium in Gabaa qui translati sunt in Manath"
      en: "These are the sons of Ahod, heads of families that dwelt in Gabaa, who were removed into Mrtnahsth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nooman autem et Achia et Gera ipse transtulit eos et genuit Oza et Ahiud"
      en: "And Naaman, and Achia, and Gera he removed them, and beget Oza, and Ahiud."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "porro Saarim genuit in regione Moab postquam dimisit Usim et Bara uxores suas"
      en: "And Saharim begot in the land of Moab, after he sent away Husim and Bara his wives."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "genuit autem de Edes uxore sua Iobab et Sebia et Mosa et Molchom"
      en: "And he beget of Hodes his wife Jobab, and Sebia, and Mesa, and Molchom,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Iehus quoque et Sechia et Marma hii sunt filii eius principes in familiis suis"
      en: "And Jehus and Sechia, and Marma. These were his sons heads of their families."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Meusim vero genuit Abitob et Elphaal"
      en: "And Mehusim beget Abitob, and Elphaal."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "porro filii Elphaal Heber et Misaam et Samad hic aedificavit Ono et Lod et filias eius"
      en: "And the sons of Elphaal were Heber, and Misaam, and Samad: who built One, and Led, and its daughters."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Bara autem et Samma principes cognationum habitantium in Aialon hii fugaverunt habitatores Geth"
      en: "And Baria, and Sama were heads of their kindreds that dwelt in Aialon: these drove away the inhabitants of Geth."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et Haio et Sesac et Ierimoth"
      en: "And Ahio, and Sesac, and Jerimoth,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et Zabadia et Arod et Eder"
      en: "And Zabadia, and Arod, and Heder,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Michahel quoque et Iespha et Ioaa filii Baria"
      en: "And Michael, and Jespha, and Joha, the sons of Baria."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et Zabadia et Mosollam et Ezeci et Heber"
      en: "And Zabadia, and Mosollam, and Hezeci, and Heber,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et Iesamari et Iezlia et Iobab filii Elphaal"
      en: "And Jesamari, and Jezlia, and Jobab, sons of Elphaal,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et Iacim et Zechri et Zabdi"
      en: "And Jacim, and Zechri, and Zabdi,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et Helioenai et Selethai et Helihel"
      en: "And Elioenai, and Selethai, and Elial,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et Adaia et Baraia et Samarath filii Semei"
      en: "And Adaia, and Baraia, and Samareth, the sons of Semei."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et Iesphan et Heber et Helihel"
      en: "And Jespham, and Heber, and Eliel,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et Abdon et Zechri et Hanan"
      en: "And Abdon, and Zechri, and Hanan,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et Anania et Ailam et Anathothia"
      en: "And Hanania, and Elam, and Anathothia."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et Iephdaia et Phanuhel filii Sesac"
      en: "And Jephdaia, and Phanuel the sons of Sesac."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et Samsari et Sooria et Otholia"
      en: "And Samsari, and Sohoria and Otholia,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et Iersia et Helia et Zechri filii Ieroam"
      en: "And Jersia, and Elia, and Zechri, the sons of Jeroham."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "hii patriarchae et cognationum principes qui habitaverunt in Hierusalem"
      en: "These were the chief fathers, and heads of their families who dwelt in Jerusalem."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "in Gabaon autem habitaverunt Abigabaon et nomen uxoris eius Maacha"
      en: "And at Gabaon dwelt Abigabaon, and the name of his wife was Maacha:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "filiusque eius primogenitus Abdon et Sur et Cis et Baal et Nadab"
      en: "And his firstborn son Abdon, and Sur, and Cia, and Baal, and Nadab,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Gedor quoque et Ahio et Zacher"
      en: "And Gedor, and Ahio, and Zacher, and Macelloth:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et Macelloth genuit Samaa habitaveruntque ex adverso fratrum suorum in Hierusalem cum fratribus suis"
      en: "And Macelloth beget Samaa: and they dwelt over against their brethren in Jerusalem with their brethren."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Ner autem genuit Cis et Cis genuit Saul porro Saul genuit Ionathan et Melchisuae et Abinadab et Esbaal"
      en: "And Ner beget Cia, and Cia beget Saul. And Saul begot Jonathan and Melchisua, and Abinadab, and Esbaal."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "filius autem Ionathan Meribbaal et Meribbaal genuit Micha"
      en: "And the son of Jonathan was Meribbaal: and Meribbaal begot Micha."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "filii Micha Phithon et Melech et Thara et Ahaz"
      en: "And the sons of Micha were Phithon, and Melech, and Tharaa, and Ahaz."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et Ahaz genuit Ioada et Ioada genuit Almoth et Azmoth et Zamari porro Zamari genuit Mosa"
      en: "And Ahaz beget Joada: and Joada beget Alamath, and Azmoth, and Zamri: and Zamri beget Mesa,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et Mosa genuit Baana cuius filius fuit Rapha de quo ortus est Elasa qui genuit Asel"
      en: "And Mesa beget Banaa, whose son was Rapha, of whom was born Elasa, who beget Asel."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "porro Asel sex filii fuere his nominibus Ezricam Bochru Ismahel Saria Abadia Anan omnes hii filii Asel"
      en: "And Asel had six sons whose names were Ezricam, Bochru, Ismahel, Saria, Obdia, and Hanan. All these were the sons of Asel."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "filii autem Esec fratris eius Ulam primogenitus et Us secundus et Eliphalet tertius"
      en: "And the sons of Esec, his brother, were Ulam the firstborn, and Jehus the second, and Eliphelet the third."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "fueruntque filii Ulam viri robustissimi et magno robore tendentes arcum et multos habentes filios ac nepotes usque ad centum quinquaginta omnes hii filii Beniamin"
      en: "And the sons of Ulam were most valiant men, and archers of great strength: and they had many sons and grandsons, even to a hundred and fifty. All these were children of Benjamin."
    status: { la: verified, en: verified }
