# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: luc
chapter: 15
verses:
  - n: 1
    text:
      la: "Erant autem appropinquantes ei publicani, et peccatores ut audirent illum."
      en: "Now the publicans and sinners drew near unto him to hear him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et murmurabant pharisaei, et scribae, dicentes: Quia hic peccatores recipit, et manducat cum illis."
      en: "And the Pharisees and the scribes murmured, saying: This man receiveth sinners, and eateth with them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et ait ad illos parabolam istam dicens:"
      en: "And he spoke to them this parable, saying:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quis ex vobis homo, qui habet centum oves, et si perdiderit unam ex illis, nonne dimittit nonaginta novem in deserto, et vadit ad illam quae perierat, donec inveniat eam?"
      en: "What man of you that hath an hundred sheep: and if he shall lose one of them, doth he not leave the ninety-nine in the desert, and go after that which was lost, until he find it?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et cum invenerit eam, imponit in humeros suos gaudens:"
      en: "And when he hath found it, lay it upon his shoulders, rejoicing:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et veniens domum convocat amicos et vicinos, dicens illis: Congratulamini mihi, quia inveni ovem meam, quae perierat."
      en: "And coming home, call together his friends and neighbours, saying to them: Rejoice with me, because I have found my sheep that was lost?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dico vobis quod ita gaudium erit in caelo super uno peccatore poenitentiam agente, quam super nonaginta novem justis, qui non indigent poenitentia."
      en: "I say to you, that even so there shall be joy in heaven upon one sinner that doth penance, more than upon ninety-nine just who need not penance."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Aut quae mulier habens drachmas decem, si perdiderit drachmam unam, nonne accendit lucernam, et everrit domum, et quaerit diligenter, donec inveniat?"
      en: "Or what woman having ten groats; if she lose one groat, doth not light a candle, and sweep the house, and seek diligently until she find it?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et cum invenerit convocat amicas et vicinas, dicens: Congratulamini mihi, quia inveni drachmam quam perdideram."
      en: "And when she hath found it, call together her friends and neighbours, saying: Rejoice with me, because I have found the groat which I had lost."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ita, dico vobis, gaudium erit coram angelis Dei super uno peccatore poenitentiam agente."
      en: "So I say to you, there shall be joy before the angels of God upon one sinner doing penance."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ait autem: Homo quidam habuit duos filios:"
      en: "And he said: A certain man had two sons:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et dixit adolescentior ex illis patri: Pater, da mihi portionem substantiae, quae me contingit. Et divisit illis substantiam."
      en: "And the younger of them said to his father: Father, give me the portion of substance that falleth to me. And he divided unto them his substance."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et non post multos dies, congregatis omnibus, adolescentior filius peregre profectus est in regionem longinquam, et ibi dissipavit substantiam suam vivendo luxuriose."
      en: "And not many days after, the younger son, gathering all together, went abroad into a far country: and there wasted his substance, living riotously."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et postquam omnia consummasset, facta est fames valida in regione illa, et ipse coepit egere."
      en: "And after he had spent all, there came a mighty famine in that country; and he began to be in want."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et abiit, et adhaesit uni civium regionis illius: et misit illum in villam suam ut pasceret porcos."
      en: "And he went and cleaved to one of the citizens of that country. And he sent him into his farm to feed swine."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et cupiebat implere ventrem suum de siliquis, quas porci manducabant: et nemo illi dabat."
      en: "And he would fain have filled his belly with the husks the swine did eat; and no man gave unto him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "In se autem reversus, dixit: Quanti mercenarii in domo patris mei abundant panibus, ego autem hic fame pereo!"
      en: "And returning to himself, he said: How many hired servants in my father's house abound with bread, and I here perish with hunger?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "surgam, et ibo ad patrem meum, et dicam ei: Pater, peccavi in caelum, et coram te:"
      en: "I will arise, and will go to my father, and say to him: Father, I have sinned against heaven, and before thee:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "jam non sum dignus vocari filius tuus: fac me sicut unum de mercenariis tuis."
      en: "I am not worthy to be called thy son: make me as one of thy hired servants."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et surgens venit ad patrem suum. Cum autem adhuc longe esset, vidit illum pater ipsius, et misericordia motus est, et accurrens cecidit super collum ejus, et osculatus est eum."
      en: "And rising up he came to his father. And when he was yet a great way off, his father saw him, and was moved with compassion, and running to him fell upon his neck, and kissed him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dixitque ei filius: Pater, peccavi in caelum, et coram te: jam non sum dignus vocari filius tuus."
      en: "And the son said to him: Father, I have sinned against heaven, and before thee, I am not now worthy to be called thy son."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Dixit autem pater ad servos suos: Cito proferte stolam primam, et induite illum, et date annulum in manum ejus, et calceamenta in pedes ejus:"
      en: "And the father said to his servants: Bring forth quickly the first robe, and put it on him, and put a ring on his hand, and shoes on his feet:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et adducite vitulum saginatum, et occidite, et manducemus, et epulemur:"
      en: "And bring hither the fatted calf, and kill it, and let us eat and make merry:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "quia hic filius meus mortuus erat, et revixit: perierat, et inventus est. Et coeperunt epulari."
      en: "Because this my son was dead, and is come to life again: was lost, and is found. And they began to be merry."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Erat autem filius ejus senior in agro: et cum veniret, et appropinquaret domui, audivit symphoniam et chorum:"
      en: "Now his elder son was in the field, and when he came and drew nigh to the house, he heard music and dancing:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et vocavit unum de servis, et interrogavit quid haec essent."
      en: "And he called one of the servants, and asked what these things meant."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Isque dixit illi: Frater tuus venit, et occidit pater tuus vitulum saginatum, quia salvum illum recepit."
      en: "And he said to him: Thy brother is come, and thy father hath killed the fatted calf, because he hath received him safe."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Indignatus est autem, et nolebat introire. Pater ergo illius egressus, coepit rogare illum."
      en: "And he was angry, and would not go in. His father therefore coming out began to entreat him."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "At ille respondens, dixit patri suo: Ecce tot annis servio tibi, et numquam mandatum tuum praeterivi: et numquam dedisti mihi haedum ut cum amicis meis epularer."
      en: "And he answering, said to his father: Behold, for so many years do I serve thee, and I have never transgressed thy commandment, and yet thou hast never given me a kid to make merry with my friends:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Sed postquam filius tuus hic, qui devoravit substantiam suam cum meretricibus, venit, occidisti illi vitulum saginatum."
      en: "But as soon as this thy son is come, who hath devoured his substance with harlots, thou hast killed for him the fatted calf."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "At ipse dixit illi: Fili, tu semper mecum es, et omnia mea tua sunt:"
      en: "But he said to him: Son, thou art always with me, and all I have is thine."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "epulari autem, et gaudere oportebat, quia frater tuus hic mortuus erat, et revixit; perierat, et inventus est."
      en: "But it was fit that we should make merry and be glad, for this thy brother was dead and is come to life again; he was lost, and is found."
    status: { la: verified, en: verified }
