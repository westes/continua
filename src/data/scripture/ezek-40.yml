book: ezek
chapter: 40
verses:
  - n: 1
    text:
      la: "in vicesimo et quinto anno transmigrationis nostrae in exordio anni decima mensis quartodecimo anno postquam percussa est civitas in ipsa hac die facta est super me manus Domini et adduxit me illuc"
      en: "In the five and twentieth year of our captivity, in the beginning of the year, the tenth day of the month, the fourteenth year after the city was destroyed: in the selfsame day the hand of the Lord was upon me, and he brought me thither."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in visionibus Dei adduxit me in terram Israhel et dimisit me super montem excelsum nimis super quem erat quasi aedificium civitatis vergentis ad austrum"
      en: "In the visions of God he brought me into the land of Israel, and set me upon a very high mountain: upon which there was as the building of a city, bending towards the south."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et introduxit me illuc et ecce vir cuius erat species quasi species aeris et funiculus lineus in manu eius et calamus mensurae in manu eius stabat autem in porta"
      en: "And he brought me in thither, and behold a man, whose appearance was like the appearance of brass, with a line of flax in his hand, and a measuring reed in his hand, and he stood in the gate."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et locutus est ad me idem vir fili hominis vide oculis tuis et auribus tuis audi et pone cor tuum in omnia quae ego ostendam tibi quia ut ostendantur tibi adductus es huc adnuntia omnia quae tu vides domui Israhel"
      en: "And this man said to me: Son of man, see with thy eyes, and hear with thy ears, and set thy heart upon all that I shall shew thee: for thou art brought hither that they may be shewn to thee: declare all that thou seest, to the house of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et ecce murus forinsecus in circuitu domus undique et in manu viri calamus mensurae sex cubitorum et palmo et mensus est latitudinem aedificii calamo uno altitudinem quoque calamo uno"
      en: "And behold there was a wall on the outside of the house round about, and in the man's hand a measuring reed of six cubits and a handbreadth: and he measured the breadth of the building one reed, and the height one reed."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et venit ad portam quae respiciebat viam orientalem et ascendit per gradus eius et mensus est limen portae calamo uno latitudinem id est limen unum calamo uno in latitudine"
      en: "And he came to the gate that looked toward the east, and he went up the steps thereof: and he measured the breadth of the threshold of the gate one reed, that is, one threshold was one reed broad:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et thalamum uno calamo in longum et uno calamo in latum et inter thalamos quinque cubitos"
      en: "And every little chamber was one reed long, and one reed broad: and between the little chambers were five cubits:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et limen portae iuxta vestibulum portae intrinsecus calamo uno"
      en: "And the threshold of the gate by the porch of the gate within, was one reed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et mensus est vestibulum portae octo cubitorum et frontem eius duobus cubitis vestibulum autem portae erat intrinsecus"
      en: "And he measured the porch of the gate eight cubits, and the front thereof two cubits: and the porch of the gate was inward."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "porro thalami portae ad viam orientalem tres hinc et tres inde mensura una trium et mensura una frontium ex utraque parte"
      en: "And the little chambers of the gate that looked eastward were three on this side, and three on that side: all three were of one measure, and the fronts of one measure, on both parts."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et mensus est latitudinem liminis portae decem cubitorum et longitudinem portae tredecim cubitorum"
      en: "And he measured the breadth of the threshold of the gate ten cubits: and the length of the gate thirteen cubits:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et marginem ante thalamos cubiti unius et cubitus unus finis utrimque thalami autem sex cubitorum erant hinc et inde"
      en: "And the border before the little chambers one cubit: and one cubit was the border on both sides: and the little chambers were six cubits on this side and that side."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et mensus est portam a tecto thalami usque ad tectum eius latitudinem viginti et quinque cubitorum ostium contra ostium"
      en: "And he measured the gate from the roof of one little chamber to the roof of another, in breadth five and twenty cubits: door against door."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et fecit frontes per sexaginta cubitos et ad frontem atrium portae undique per circuitum"
      en: "He made also fronts of sixty cubits: and to the front the court of the gate on every side round about."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ante faciem portae quae pertingebat usque ad faciem vestibuli portae interioris quinquaginta cubitos"
      en: "And before the face of the gate which reached even to the face of the porch of the inner gate, fifty cubits."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et fenestras obliquas in thalamis et in frontibus eorum quae erant intra portam undique per circuitum similiter autem erant et in vestibulis fenestrae per gyrum intrinsecus et ante frontes pictura palmarum"
      en: "And slanting windows in the little chambers, and in their fronts, which were within the gate on every side round about: and in like, manner there wore also in the porches windows round about within, and before the fronts the representation of palm trees."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et eduxit me ad atrium exterius et ecce gazofilacia et pavimentum stratum lapide in atrio per circuitum triginta gazofilacia in circuitu pavimenti"
      en: "And he brought me into the outward court, and behold there were chambers, and a pavement of stone in the court round about: thirty chambers encompassed the pavement."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et pavimentum in fronte portarum secundum longitudinem portarum erat inferius"
      en: "And the pavement in the front of the gates according to the length of the gates was lower."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et mensus est latitudinem a facie portae inferioris usque ad frontem atrii interioris extrinsecus centum cubitos ad orientem et ad aquilonem"
      en: "And he measured the breadth from the face of the lower gate to the front of the inner court without, a hundred cubits to the east, and to the north."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "portam quoque quae respiciebat viam aquilonis atrii exterioris mensus est tam in longitudine quam in latitudine"
      en: "He measured also both the length and the breadth of the gate of the outward court, which looked northward."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et thalamos eius tres hinc et tres inde et frontem eius et vestibulum eius secundum mensuram portae prioris quinquaginta cubitorum longitudinem eius et latitudinem viginti quinque cubitorum"
      en: "And the little chambers thereof three on this side, and three on that side: and the front thereof, and the porch thereof according to the measure of the former gate, fifty cubits long, and five and twenty cubits broad."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "fenestrae autem eius et vestibulum et scalpturae secundum mensuram portae quae respiciebat ad orientem et septem graduum erat ascensus eius et vestibulum ante eam"
      en: "And the windows thereof, and the porch, and the gravings according to the measure of the gate that looked to the east, and they went up to it by seven steps, and a porch was before it."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et porta atrii interioris contra portam aquilonis et orientalem et mensus est a porta usque ad portam centum cubitos"
      en: "And the gate of the inner court was over against the gate of the north, and that of the ease: and he measured from gate to gate a hundred cubits."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et duxit me ad viam australem et ecce porta quae respiciebat ad austrum et mensus est frontem eius et vestibulum eius iuxta mensuras superiores"
      en: "And he brought me out to the way of the south, and behold the gate that looked to the south : and he measured the front thereof, and the porch thereof according to the former measures."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et fenestras eius et vestibula in circuitu sicut fenestras ceteras quinquaginta cubitorum longitudine et latitudine viginti quinque cubitorum"
      en: "And the windows thereof, and the porches round about, as the other windows: the length was fifty cubits, and the breadth five and twenty cubits."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et in gradibus septem ascendebatur ad eam et vestibulum ante fores eius et celatae palmae erant una hinc et altera inde in fronte eius"
      en: "And there were seven steps to go up to it: and a porch before the doors thereof: and there were graven palm trees, one on this side, and another on that side in the front thereof."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et porta atrii interioris in via australi et mensus est a porta usque ad portam in via australi centum cubitos"
      en: "And there was a gate of the inner court towards the south: and he measured from gate to gate towards the south, a hundred cubits."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et introduxit me in atrium interius ad portam australem et mensus est portam iuxta mensuras superiores"
      en: "And he brought me into the inner court at the south gate : and he measured the gate according to the former measures."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "thalamum eius et frontem eius et vestibulum eius hisdem mensuris et fenestras eius et vestibulorum eius in circuitu quinquaginta cubitos longitudinis et latitudinis viginti quinque cubitos"
      en: "The little chamber thereof, and the front thereof, and the porch thereof with the same measures: and the windows thereof, and the porch thereof round about it was fifty cubits in length, and five and twenty cubits in breadth."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et vestibulum per gyrum longitudine viginti quinque cubitorum et latitudine quinque cubitorum"
      en: "And the porch round about was five and twenty cubits long, and five cubits broad."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et vestibulum eius ad atrium exterius et palmas eius in fronte et octo gradus erant quibus ascendebatur per eam"
      en: "And the porch thereof to the outward court, and the palm trees thereof in the front: and there were eight steps to go up to It."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et introduxit me in atrium interius per viam orientalem et mensus est portam secundum mensuras superiores"
      en: "And he brought me into the inner court by the way of the east: and he measured the gate according to the former measures."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "thalamum eius et frontem eius et vestibula eius sicut supra et fenestras eius et vestibuli eius in circuitu longitudine quinquaginta cubitorum et latitudine viginti quinque cubitorum"
      en: "The little chamber thereof, and the front thereof, and the porch thereof as before: and the windows thereof, and the porches thereof round about it was fifty cubits long, and five and twenty cubits broad."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et vestibulum eius id est atrii exterioris et palmae celatae in fronte eius hinc et inde et in octo gradibus ascensus eius"
      en: "And the porch thereof, that is, of the outward court: and the graven palm trees in the front thereof on this side and on that side: and the going up thereof was by eight steps."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et introduxit me ad portam quae respiciebat ad aquilonem et mensus est secundum mensuras superiores"
      en: "And he brought me into the gate that looked to the north: and he measured according to the former measures."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "thalamum eius frontem eius vestibulum eius et fenestras eius per circuitum longitudine quinquaginta cubitorum et latitudine viginti quinque cubitorum"
      en: "The little chamber thereof, and the front thereof, and the porch thereof, and the windows thereof round about it was fifty cubits long, and five and twenty cubits broad."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "vestibulum eius in atrium exterius et celatura palmarum in fronte illius hinc et inde et in octo gradibus ascensus eius"
      en: "And the porch thereof looked to the outward court: and the graving of palm trees in the front thereof was on this side and on that side: and the going up to it was by eight steps."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et per singula gazofilacia ostium in frontibus portarum ibi lavabunt holocaustum"
      en: "And at every chamber was a door in the forefronts of the gates: there they washed the holocaust."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et in vestibulo portae duae mensae hinc et duae mensae inde ut immoletur super eas holocaustum et pro peccato et pro delicto"
      en: "And in the porch of the gate were two tables on this side, and two tables on that side: that the holocaust, and the sin offering, and the trespass offering might be slain thereon."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et ad latus exterius quod ascendit ad ostium portae quae pergit ad aquilonem duae mensae et ad latus alterum ante vestibulum portae duae mensae"
      en: "And on the outward side, which goeth up to the entry of the gate that looketh toward the north, were two tables. and at the other side before the porch of the gate were two tables."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "quattuor mensae hinc et quattuor mensae inde per latera portae octo mensae erunt super quas immolabunt"
      en: "Four tables were on this side, and four tables on that side: at the sides of the gate were eight tables, upon which they slew the victims."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "quattuor autem mensae ad holocaustum de lapidibus quadris extructae longitudine cubiti unius et dimidii et latitudine cubiti unius et dimidii et altitudine cubiti unius super quas ponant vasa in quibus immolatur holocaustum et victima"
      en: "And the four tables for the holocausts were made of square stones: one cubit and a half long, and one cubit and a half broad, and one cubit high: to lay the vessels upon, in which the holocaust and the victim is slain."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et labia earum palmi unius reflexa intrinsecus per circuitum super mensas autem carnes oblationis"
      en: "And the borders of them were of one handbreadth, turned inwards round about: and upon the tables was the flesh of the offering."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et extra portam interiorem gazofilacia cantorum in atrio interiori quod erat in latere portae respicientis ad aquilonem et facies eorum contra viam australem una ex latere portae orientalis quae respiciebat ad viam aquilonis"
      en: "And without the inner gate were the chambers of the singing men in the inner court, which was on the side of the gate that looketh to the north: and their prospect was towards the south, one at the side of the east gate, which looketh toward the north."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et dixit ad me hoc est gazofilacium quod respicit viam meridianam sacerdotum qui excubant in custodiis templi"
      en: "And he said to me: This chamber, which looketh toward the south shall be for the priests that watch in the wards of the temple."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "porro gazofilacium quod respicit ad viam aquilonis sacerdotum erit qui excubant ad ministerium altaris isti sunt filii Sadoc qui accedunt de filiis Levi ad Dominum ut ministrent ei"
      en: "But the chamber that looketh towards the north shall be for the priests that watch over the ministry of the altar. These are the sons of Sadoc, who among the sons of Levi, come near to the Lord, to minister to him."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et mensus est atrium longitudine centum cubitorum et latitudine centum cubitorum per quadrum et altare ante faciem templi"
      en: "And he measured the court a hundred cubits long, and a hundred cubits broad foursquare: and the altar that was before the face of the temple."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et introduxit me in vestibulum templi et mensus est vestibulum quinque cubitis hinc et quinque cubitis inde et latitudinem portae trium cubitorum hinc et trium cubitorum inde"
      en: "And he brought me into the porch of the temple: and he measured the porch five cubits on this side, and five cubits on that side: and the breadth of the gate three cubits on this side, and three cubits on that side."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "longitudinem autem vestibuli viginti cubitorum et latitudinem undecim cubitorum et octo gradibus ascendebatur ad eam et columnae erant in frontibus una hinc et altera inde"
      en: "And the length of the porch was twenty cubits, and the breadth eleven cubits, and there were eight, steps to go up to it. And there were pillars in the fronts: one on this side, and another on that side."
    status: { la: verified, en: verified }
