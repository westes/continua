# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1cor
chapter: 11
verses:
  - n: 1
    text:
      la: "imitatores mei estote sicut et ego Christi"
      en: "Be ye followers of me, as I also am of Christ."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "laudo autem vos fratres quod omnia mei memores estis et sicut tradidi vobis praecepta mea tenetis"
      en: "Now I praise you, brethren, that in all things you are mindful of me: and keep my ordinances as I have delivered them to you."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "volo autem vos scire quod omnis viri caput Christus est caput autem mulieris vir caput vero Christi Deus"
      en: "But I would have you know, that the head of every man is Christ; and the head of the woman is the man; and the head of Christ is God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "omnis vir orans aut prophetans velato capite deturpat caput suum"
      en: "Every man praying or prophesying with his head covered, disgraceth his head."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "omnis autem mulier orans aut prophetans non velato capite deturpat caput suum unum est enim atque si decalvetur"
      en: "But every woman praying or prophesying with her head not covered, disgraceth her head: for it is all one as if she were shaven."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "nam si non velatur mulier et tondeatur si vero turpe est mulieri tonderi aut decalvari velet caput suum"
      en: "For if a woman be not covered, let her be shorn. But if it be a shame to a woman to be shorn or made bald, let her cover her head."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "vir quidem non debet velare caput quoniam imago et gloria est Dei mulier autem gloria viri est"
      en: "The man indeed ought not to cover his head, because he is the image and glory of God; but the woman is the glory of the man."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "non enim vir ex muliere est sed mulier ex viro"
      en: "For the man is not of the woman, but the woman of the man."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "etenim non est creatus vir propter mulierem sed mulier propter virum"
      en: "For the man was not created for the woman, but the woman for the man."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ideo debet mulier potestatem habere supra caput propter angelos"
      en: "Therefore ought the woman to have a power over her head, because of the angels."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "verumtamen neque vir sine muliere neque mulier sine viro in Domino"
      en: "But yet neither is the man without the woman, nor the woman without the man, in the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nam sicut mulier de viro ita et vir per mulierem omnia autem ex Deo"
      en: "For as the woman is of the man, so also is the man by the woman: but all things of God."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "vos ipsi iudicate decet mulierem non velatam orare Deum"
      en: "You yourselves judge: doth it become a woman, to pray unto God uncovered?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "nec ipsa natura docet vos quod vir quidem si comam nutriat ignominia est illi"
      en: "Doth not even nature itself teach you, that a man indeed, if he nourish his hair, it is a shame unto him?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "mulier vero si comam nutriat gloria est illi quoniam capilli pro velamine ei dati sunt"
      en: "But if a woman nourish her hair, it is a glory to her; for her hair is given to her for a covering."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "si quis autem videtur contentiosus esse nos talem consuetudinem non habemus neque ecclesiae Dei"
      en: "But if any man seem to be contentious, we have no such custom, nor the church of God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "hoc autem praecipio non laudans quod non in melius sed in deterius convenitis"
      en: "Now this I ordain: not praising you, that you come together not for the better, but for the worse."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "primum quidem convenientibus vobis in ecclesia audio scissuras esse et ex parte credo"
      en: "For first of all I hear that when you come together in the church, there are schisms among you; and in part I believe it."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "nam oportet et hereses esse ut et qui probati sunt manifesti fiant in vobis"
      en: "For there must be also heresies: that they also, who are approved, may be made manifest among you."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "convenientibus ergo vobis in unum iam non est dominicam cenam manducare"
      en: "When you come therefore together into one place, it is not now to eat the Lord's supper."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "unusquisque enim suam cenam praesumit ad manducandum et alius quidem esurit alius autem ebrius est"
      en: "For every one taketh before his own supper to eat. And one indeed is hungry and another is drunk."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "numquid domos non habetis ad manducandum et bibendum aut ecclesiam Dei contemnitis et confunditis eos qui non habent quid dicam vobis laudo vos in hoc non laudo"
      en: "What, have you not houses to eat and to drink in? Or despise ye the church of God; and put them to shame that have not ? What shall I say to you? Do I praise you? In this I praise you not."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ego enim accepi a Domino quod et tradidi vobis quoniam Dominus Iesus in qua nocte tradebatur accepit panem"
      en: "For I have received of the Lord that which also I delivered unto you, that the Lord Jesus, the same night in which he was betrayed, took bread."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et gratias agens fregit et dixit hoc est corpus meum pro vobis hoc facite in meam commemorationem"
      en: "And giving thanks, broke, and said: Take ye, and eat: this is my body, which shall be delivered for you: this do for the commemoration of me."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "similiter et calicem postquam cenavit dicens hic calix novum testamentum est in meo sanguine hoc facite quotienscumque bibetis in meam commemorationem"
      en: "In like manner also the chalice, after he had supped, saying: This chalice is the new testament in my blood: this do ye, as often as you shall drink, for the commemoration of me."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "quotienscumque enim manducabitis panem hunc et calicem bibetis mortem Domini adnuntiatis donec veniat"
      en: "For as often as you shall eat this bread, and drink the chalice, you shall shew the death of the Lord, until he come."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "itaque quicumque manducaverit panem vel biberit calicem Domini indigne reus erit corporis et sanguinis Domini"
      en: "Therefore whosoever shall eat this bread, or drink the chalice of the Lord unworthily, shall be guilty of the body and of the blood of the Lord."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "probet autem se ipsum homo et sic de pane illo edat et de calice bibat"
      en: "But let a man prove himself: and so let him eat of that bread, and drink of the chalice."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "qui enim manducat et bibit indigne iudicium sibi manducat et bibit non diiudicans corpus"
      en: "For he that eateth and drinketh unworthily, eateth and drinketh judgment to himself, not discerning the body of the Lord."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ideo inter vos multi infirmes et inbecilles et dormiunt multi"
      en: "Therefore are there many inform and weak among you, and many sleep."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "quod si nosmet ipsos diiudicaremus non utique iudicaremur"
      en: "But if we would judge ourselves, we should not be judged."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "dum iudicamur autem a Domino corripimur ut non cum hoc mundo damnemur"
      en: "But whilst we are judged, we are chastised by the Lord, that we be not condemned with this world."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "itaque fratres mei cum convenitis ad manducandum invicem expectate"
      en: "Wherefore, my brethren, when you come together to eat, wait for one another."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "si quis esurit domi manducet ut non in iudicium conveniatis cetera autem cum venero disponam"
      en: "If any man be hungry, let him eat at home; that you come not together unto judgment. And the rest I will set in order, when I come."
    status: { la: verified, en: verified }
