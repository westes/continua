# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 37
verses:
  - n: 1
    text:
      la: "Super hoc expavit cor meum, et emotum est de loco suo."
      en: "At this my heart trembleth, and is moved out of its place."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Audite auditionem in terrore vocis ejus, et sonum de ore illius procedentem."
      en: "Hear ye attentively the terror of his voice, and the sound that cometh out of his mouth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Subter omnes caelos ipse considerat, et lumen illius super terminos terrae."
      en: "He beholdeth under all the heavens, and his light is upon the ends of the earth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Post eum rugiet sonitus, tonabit voce magnitudinis suae: et non investigabitur, cum audita fuerit vox ejus."
      en: "After it a noise shall roar, he shall thunder with the voice of his majesty, and shall not be found out, when his voice shall be heard."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Tonabit Deus in voce sua mirabiliter, qui facit magna et inscrutabilia,"
      en: "God shall thunder wonderfully with his voice, he that doth great and unsearchable things."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui praecipit nivi ut descendat in terram, et hiemis pluviis, et imbri fortitudinis suae:"
      en: "He commandeth the snow to go down upon the earth, and the winter rain, and the shower of his strength."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui in manu omnium hominum signat, ut noverint singuli opera sua."
      en: "He sealeth up the hand of all men, that every one may know his works."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ingredietur bestia latibulum, et in antro suo morabitur."
      en: "Then the beast shall go into his covert, and shall abide in his den."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ab interioribus egredietur tempestas, et ab Arcturo frigus."
      en: "Out of the inner parts shall a tempest come, and cold out of the north."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Flante Deo, concrescit gelu, et rursum latissimae funduntur aquae."
      en: "When God bloweth there cometh frost, and again the waters are poured out abundantly."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Frumentum desiderat nubes, et nubes spargunt lumen suum."
      en: "Corn desireth clouds, and the clouds spread their light:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quae lustrant per circuitum, quocumque eas voluntas gubernantis duxerit, ad omne quod praeceperit illis super faciem orbis terrarum:"
      en: "Which go round about, whithersoever the will of him that governeth them shall lead them, to whatsoever he shall command them upon the face of the whole earth:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sive in una tribu, sive in terra sua, sive in quocumque loco misericordiae suae eas jusserit inveniri."
      en: "Whether in one tribe, or in his own land, or in what place soever of his mercy he shall command them to be found."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ausculta haec, Job: sta, et considera mirabilia Dei."
      en: "Hearken to these things, Job: Stand, and consider the wondrous works of God."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Numquid scis quando praeceperit Deus pluviis, ut ostenderent lucem nubium ejus?"
      en: "Dost thou know when God commanded the rains, to shew his light of his clouds?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Numquid nosti semitas nubium magnas, et perfectas scientias?"
      en: "Knowest thou the great paths of the clouds, and the perfect knowledges?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Nonne vestimenta tua calida sunt, cum perflata fuerit terra austro?"
      en: "Are not thy garments hot, when the south wind blows upon the earth?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Tu forsitan cum eo fabricatus es caelos, qui solidissimi quasi aere fusi sunt."
      en: "Thou perhaps hast made the heavens with him, which are most strong, as if they were of molten brass."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ostende nobis quid dicamus illi: nos quippe involvimur tenebris."
      en: "shew us what we may say to him: for we are wrapped up in darkness."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quis narrabit ei quae loquor? etiam si locutus fuerit homo, devorabitur."
      en: "Who shall tell him the things I speak? even if a man shall speak, he shall be swallowed up."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "At nunc non vident lucem: subito aer cogetur in nubes, et ventus transiens fugabit eas."
      en: "But now they see not the light: the air on a sudden shall be thickened into clouds, and the wind shall pass and drive them away."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ab aquilone aurum venit, et ad Deum formidolosa laudatio."
      en: "Cold cometh out of the north, and to God praise with fear."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Digne eum invenire non possumus: magnus fortitudine, et judicio, et justitia: et enarrari non potest."
      en: "We cannot find him worthily: he is great in strength, and in judgment, and in justice, and he is ineffable."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ideo timebunt eum viri, et non audebunt contemplari omnes qui sibi videntur esse sapientes."
      en: "Therefore men shall fear him, and all that seem to themselves to be wise, shall not dare to behold him."
    status: { la: verified, en: verified }
