# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: bar
chapter: 1
verses:
  - n: 1
    text:
      la: "et haec verba libri quae scripsit Baruch filius Neeri filius Maasei filii Sedechiae filii Sedei filii Helchiae in Babylonia"
      en: "Wherefore the Lord our God hath made good his word, that he spoke to us, and to our judges that have judged Israel, and to our kings, and to our princes, and to all Israel and Juda:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in anno quinto in septima die mensis in tempore quo ceperunt Chaldei Hierusalem et succenderunt eam igni"
      en: "That the Lord would bring upon us great evils, such as never happened under heaven, as they have come to pass in Jerusalem, according to the things that are written in the law of Moses:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et legit Baruch verba libri huius ad aures Iechoniae filii Ioachim regis Iuda et ad aures universi populi venientis ad librum"
      en: "That a man should eat the flesh of his own son, and the flesh of his own daughter."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ad aures potentium filiorum regum et ad aures presbyterorum et ad aures populi a minimo usque ad magnum eorum omnium habitantium in Babylonia ad flumen Sudi"
      en: "And he hath delivered them up to be under the hand of all the kings that are round about us, to be a reproach, and desolation among all the people, among whom the Lord hath scattered us."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "qui audientes plorabant et ieiunabant et orabant in conspectu Domini"
      en: "And we are brought under, and are not uppermost: because we have sinned against the Lord our God, by not obeying his voice."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et collegerunt pecuniam secundum quod potuit uniuscuiusque manus"
      en: "To the Lord our God belongeth justice: but to us, and to our fathers confusion of face, as at this day."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et miserunt in Hierusalem ad Ioachim filium Helchiae filii Salom sacerdotem et ad sacerdotes et ad omnem populum qui inventi sunt cum eo in Hierusalem"
      en: "For the Lord hath pronounced against us all these evils that are come upon us:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cum acciperet vasa templi Domini quae ablata fuerant de templo revocare in terram Iuda decima die illius sivan vasa argentea quae fecit Sedechias filius Iosiae rex Iuda"
      en: "And we have not entreated the face of the Lord our God, that we might return every one of us from our most wicked ways."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "posteaquam cepisset Nabuchodonosor rex Babylonum Iechoniam et principes et vinctos et potentes et populum terrae ab Hierusalem et duxit eos in Babyloniam"
      en: "And the Lord hath watched over us for evil, and hath brought it upon us: for the Lord is just in all his works which he hath commanded us:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et dixerunt ecce misimus ad vos pecunias de quibus emite holocaustomata et tus et facite manna et offerte pro peccato ad aram Domini Dei nostri"
      en: "And we have not hearkened to his voice to walk in the commandments of the Lord which he hath set before us."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et orate pro vita Nabuchodonosor regis Babyloniae et pro vita Balthasar filii eius ut sint dies ipsorum sicut dies caeli super terram"
      en: "And now, O Lord God of Israel, who hast brought thy people out of the land of Egypt with a strong hand, and with signs, and with wonders, and with thy great power, and with a mighty arm, and hast made thee a name as at this day,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et det Dominus virtutem nobis et inluminet oculos nostros ut vivamus sub umbra Nabuchodonosor regis Babyloniae et sub umbra Balthasar filii eius et serviamus eis multis diebus et inveniamus gratiam in conspectu eorum"
      en: "We have sinned, we have done wickedly, we have acted unjustly, O Lord our God, against all thy justices."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et pro nobis ipsis orate ad Dominum Deum nostrum quia peccavimus Domino Deo nostro et non est aversus furor eius a nobis usque in hunc diem"
      en: "Let thy wrath be turned away from us: for we are left a few among the nations where thou hast scattered us."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et legite librum istum quem misimus ad vos recitari in templo Domini in die sollemni et in die oportuno"
      en: "Hear, O Lord, our prayers, and our petitions, and deliver us for thy own sake: and grant that we may find favour in the sight of them that have led us away:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et dicetis Domino Deo nostro iustitia nobis autem confusio faciei nostrae sicut dies haec omni Iuda et habitantibus in Hierusalem"
      en: "That all the earth may know that thou art the Lord our God, and that thy name is called upon Israel, and upon his posterity."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "regibus nostris et principibus nostris sacerdotibus nostris et prophetis nostris et patribus nostris"
      en: "Look down upon us, O Lord, from thy holy house, and incline thy ear, and hear us."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "peccavimus ante Dominum nostrum et non credidimus diffidentes in eum"
      en: "Open thy eyes, and behold: for the dead that are in hell, whose spirit is taken away from their bowels, shall not give glory and justice to the Lord:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et non fuimus subiectibiles illi et non obaudivimus vocem Domini Dei nostri ut ambularemus in mandatis eius quibus dedit nobis"
      en: "But the soul that is sorrowful for the greatness of evil she hath done, and goeth bowed down, and feeble, and the eyes that fail, and the hungry soul giveth glory and justice to thee the Lord."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "a die qua eduxit patres nostros de terra Aegypti usque in hunc diem eramus incredibiles ad Dominum Deum nostrum et dissipati recessimus ne audiremus vocem ipsius"
      en: "For it is not for the justices of our fathers that we pour out our prayers, and beg mercy in thy sight, O Lord our God:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et adheserunt nobis mala multa et maledictiones quae constituit Dominus Moysi servo suo qui eduxit patres nostros de terra Aegypti dare nobis terram fluentem lac et mel sicut hodierna die"
      en: "But because thou hast sent out thy wrath, and thy indignation upon us, as thou hast spoken by the hand of thy servants the prophets, saying:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et non audivimus vocem Domini Dei nostri secundum omnia verba prophetarum quos misit ad nos"
      en: "Thus saith the Lord: Bow down your shoulder, and your neck, and serve the king of Babylon: and you shall remain in the land which I have given to your fathers."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et abivimus unusquisque in sensum cordis nostri maligni operari diis alienis facientes mala ante oculos Domini Dei nostri"
      en: "But if you will not hearken to the voice of the Lord your God, to serve the king of Babylon: I will cause you to depart out of the cities of Juda, and from without Jerusalem."
    status: { la: verified, en: verified }
