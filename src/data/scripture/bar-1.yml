# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: bar
chapter: 1
verses:
  - n: 1
    text:
      la: "Et haec verba libri quae scripsit Baruch filius Neriae, filii Maasiae, filii Sedeciae, filii Sedei, filii Helciae, in Babylonia,"
      en: "And these are the words of the book, which Baruch the son of Nerias, the son of Maasias, the son of Sedecias, the son of Sedei, the son of Helcias, wrote in Babylonia."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in anno quinto, in septimo die mensis, in tempore quo ceperunt Chaldaei Jerusalem, et succenderunt eam igni."
      en: "In the fifth year, in the seventh day of the month, at the time that the Chaldeans took Jerusalem, and burnt it with fire."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et legit Baruch verba libri hujus ad aures Jechoniae filii Joakim regis Juda, et ad aures universi populi venientis ad librum,"
      en: "And Baruch read the words of this book in the hearing of Jechonias the son of Joakim king of Juda, and in the hearing of all the people that came to hear the book."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ad aures potentium, filiorum regum, et ad aures presbyterorum, et ad aures populi, a minimo usque ad maximum eorum, omnium habitantium in Babylonia, ad flumen Sodi."
      en: "And in the hearing of the nobles, the sons of the kings, and in the hearing of the ancients, and in the hearing of the people, from the least even to the greatest of them that dwelt in Babylonia, by the river Sedi."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Qui audientes plorabant, et jejunabant, et orabant in conspectu Domini."
      en: "And when they heard it they wept, and fasted, and prayed before the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et collegerunt pecuniam, secundum quod potuit uniuscujusque manus,"
      en: "And they made a collection of money, according to every man's power."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et miserunt in Jerusalem ad Joakim filium Helciae filii Salom sacerdotem, et ad sacerdotes, et ad omnem populum qui inventi sunt cum eo in Jerusalem:"
      en: "And they sent it to Jerusalem to Joakim the priest, the son of Helcias, the son of Salom, and to the priests, and to all the people, that were found with him in Jerusalem:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cum acciperet vasa templi Domini, quae ablata fuerant de templo, revocare in terram Juda, decima die mensis Sivan, vasa argentea quae fecit Sedecias filius Josiae rex Juda,"
      en: "At the time when he received the vessels of the temple of the Lord, which had been taken away out of the temple, to return them into the land of Juda the tenth day of the month Sivan, the silver vessels, which Sedecias the son of Josias king of Juda had made,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "posteaquam cepisset Nabuchodonosor rex Babylonis Jechoniam, et principes, et cunctos potentes, et populum terrae, ab Jerusalem, et duxit eos vinctos in Babylonem."
      en: "After that Nabuchodonosor the king of Babylon had carried away Jechonias, and the princes, and all the powerful men, and the people of the land from Jerusalem, and brought them bound to Babylon."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et dixerunt: Ecce misimus ad vos pecunias, de quibus emite holocautomata et thus: et facite manna, et offerte pro peccato, ad aram Domini Dei nostri:"
      en: "And they said: Behold we have sent you money, buy with it holocausts, and frankincense, and make meat offerings, and offerings for sin at the altar of the Lord our God:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et orate pro vita Nabuchodonosor regis Babylonis, et pro vita Baltassar filii ejus, ut sint dies eorum sicut dies caeli super terram:"
      en: "And pray ye for the life of Nabuchodonosor the king of Babylon, and for the life of Balthasar his son, that their days may be upon earth as the days of heaven:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et ut det Dominus virtutem nobis, et illuminet oculos nostros, ut vivamus sub umbra Nabuchodonosor regis Babylonis, et sub umbra Baltassar filii ejus, et serviamus eis multis diebus, et inveniamus gratiam in conspectu eorum."
      en: "And that the Lord may give us strength, and enlighten our eyes, that we may live under the shadow of Nabuchodonosor the king of Babylon, and under the shadow of Balthasar his son, and may serve them many days, and may find favour in their sight."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et pro nobis ipsis orate ad Dominum Deum nostrum, quia peccavimus Domino Deo nostro, et non est aversus furor ejus a nobis usque in hunc diem."
      en: "And pray ye for us to the Lord our God: for we have sinned against the Lord our God, and his wrath is not turned away from us even to this day."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et legite librum istum quem misimus ad vos recitari in templo Domini, in die solemni et in die opportuno:"
      en: "And read ye this book, which we have sent to you to be read in the temple of the Lord, on feasts, and proper days."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et dicetis: Domino Deo nostro justitia, nobis autem confusio faciei nostrae, sicut est dies haec omni Juda, et habitantibus in Jerusalem:"
      en: "And you shall say: To the Lord our God belongeth justice, but to us confusion of our face: as it is come to pass at this day to all Juda, and to the inhabitants of Jerusalem,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "regibus nostris, et principibus nostris, et sacerdotibus nostris, et prophetis nostris, et patribus nostris."
      en: "To our kings, and to our princes, and to our priests, and to our prophets, and to our fathers."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Peccavimus ante Dominum Deum nostrum, et non credidimus, diffidentes in eum:"
      en: "We have sinned before the Lord our God, and have not believed him, nor put our trust in him:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et non fuimus subjectibiles illi, et non audivimus vocem Domini Dei nostri, ut ambularemus in mandatis ejus, quae dedit nobis."
      en: "And we were not obedient to him, and we have not hearkened to the voice of the Lord our God, to walk in his commandments, which he hath given us."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "A die qua eduxit patres nostros de terra Aegypti, usque ad diem hanc, eramus incredibiles ad Dominum Deum nostrum: et dissipati recessimus, ne audiremus vocem ipsius:"
      en: "From the day that he brought our fathers out of the land of Egypt, even to this day, we were disobedient to the Lord our God: and going astray we turned away from hearing his voice."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et adhaeserunt nobis multa mala et maledictiones quae constituit Dominus Moysi servo suo, qui eduxit patres nostros de terra Aegypti, dare nobis terram fluentem lac et mel, sicut hodierna die."
      en: "And many evils have cleaved to us, and the curses which the Lord foretold by Moses his servant: who brought our fathers out of the land of Egypt, to give us a land flowing with milk and honey, as at this day."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et non audivimus vocem Domini Dei nostri, secundum omnia verba prophetarum quos misit ad nos:"
      en: "And we have not hearkened to the voice of the Lord our God according to all the words of the prophets whom he sent to us:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et abivimus unusquisque in sensum cordis nostri maligni, operari diis alienis, facientes mala ante oculos Domini Dei nostri."
      en: "And we have gone away every man after the inclinations of his own wicked heart, to serve strange gods, and to do evil in the sight of the Lord our God."
    status: { la: verified, en: verified }
