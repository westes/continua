# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 4
verses:
  - n: 1
    text:
      la: "Et apprehendent septem mulieres virum unum in die illa, dicentes: Panem nostrum comedemus, et vestimentis nostris operiemur: tantummodo invocetur nomen tuum super nos; aufer opprobrium nostrum."
      en: "And in that day seven women shall take hold of one man, saying: We will eat our own bread, and wear our own apparel: only let us be called by thy name, take away our reproach."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "In die illa, erit germen Domini in magnificentia et gloria, et fructus terrae sublimis, et exsultatio his qui salvati fuerint de Israel."
      en: "In that day the bud of the Lord shall be in magnificence and glory, and the fruit of the earth shall be high, and a great joy to them that shall have escaped of Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et erit: omnis qui relictus fuerit in Sion, et residuus in Jerusalem, Sanctus vocabitur, omnis qui scriptus est in vita in Jerusalem."
      en: "And it shall come to pass, that every one that shall be left in Sion, and that shall remain in Jerusalem, shall be called holy, every one that is written in life in Jerusalem."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Si abluerit Dominus sordes filiarum Sion, et sanguinem Jerusalem laverit de medio ejus, in spiritu judicii, et spiritu ardoris."
      en: "If the Lord shall wash away the filth of the daughters of Sion, and shall wash away the blood of Jerusalem out of the midst thereof, by the spirit of judgment, and by the spirit of burning."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et creabit Dominus super omnem locum montis Sion, et ubi invocatus est, nubem per diem et fumum, et splendorem ignis flammantis in nocte: super omnem enim gloriam protectio."
      en: "And the Lord will create upon every place of mount Sion, and where he is called upon, a cloud by day, and a smoke and the brightness of a flaming fire in the night: for over all the glory shall be a protection."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et tabernaculum erit in umbraculum, diei ab aestu, et in securitatem et absconsionem a turbine et a pluvia."
      en: "And there shall be a tabernacle for a shade in the daytime from the heat, and for a security and covert from the whirlwind, and from rain."
    status: { la: verified, en: verified }
