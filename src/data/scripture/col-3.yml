# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: col
chapter: 3
verses:
  - n: 1
    text:
      la: "igitur si conresurrexistis Christo quae sursum sunt quaerite ubi Christus est in dextera Dei sedens"
      en: "Therefore, if you be risen with Christ, seek the things that are above; where Christ is sitting at the right hand of God:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quae sursum sunt sapite non quae supra terram"
      en: "Mind the things that are above, not the things that are upon the earth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "mortui enim estis et vita vestra abscondita est cum Christo in Deo"
      en: "For you are dead; and your life is hid with Christ in God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cum Christus apparuerit vita vestra tunc et vos apparebitis cum ipso in gloria"
      en: "When Christ shall appear, who is your life, then you also shall appear with him in glory."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "mortificate ergo membra vestra quae sunt super terram fornicationem inmunditiam libidinem concupiscentiam malam et avaritiam quae est simulacrorum servitus"
      en: "Mortify therefore your members which are upon the earth; fornication, uncleanness, lust, evil concupiscence, and covetousness, which is the service of idols."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "propter quae venit ira Dei super filios incredulitatis"
      en: "For which things the wrath of God cometh upon the children of unbelief,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in quibus et vos ambulastis aliquando cum viveretis in illis"
      en: "In which you also walked some time, when you lived in them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "nunc autem deponite et vos omnia iram indignationem malitiam blasphemiam turpem sermonem de ore vestro"
      en: "But now put you also all away: anger, indignation, malice, blasphemy, filthy speech out of your mouth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "nolite mentiri invicem expoliantes vos veterem hominem cum actibus eius"
      en: "Lie not one to another: stripping yourselves of the old man with his deeds,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et induentes novum eum qui renovatur in agnitionem secundum imaginem eius qui creavit eum"
      en: "And putting on the new, him who is renewed unto knowledge, according to the image of him that created him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ubi non est gentilis et Iudaeus circumcisio et praeputium barbarus et Scytha servus et liber sed omnia et in omnibus Christus"
      en: "Where there is neither Gentile nor Jew, circumcision nor uncircumcision, Barbarian nor Scythian, bond nor free. But Christ is all, and in all."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "induite vos ergo sicut electi Dei sancti et dilecti viscera misericordiae benignitatem humilitatem modestiam patientiam"
      en: "Put ye on therefore, as the elect of God, holy, and beloved, the bowels of mercy, benignity, humility, modesty, patience:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "subportantes invicem et donantes vobis ipsis si quis adversus aliquem habet querellam sicut et Dominus donavit vobis ita et vos"
      en: "Bearing with one another, and forgiving one another, if any have a complaint against another: even as the Lord hath forgiven you, so do you also."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "super omnia autem haec caritatem quod est vinculum perfectionis"
      en: "But above all these things have charity, which is the bond of perfection:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et pax Christi exultet in cordibus vestris in qua et vocati estis in uno corpore et grati estote"
      en: "And let the peace of Christ rejoice in your hearts, wherein also you are called in one body: and be ye thankful."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "verbum Christi habitet in vobis abundanter in omni sapientia docentes et commonentes vosmet ipsos psalmis hymnis canticis spiritalibus in gratia cantantes in cordibus vestris Deo"
      en: "Let the word of Christ dwell in you abundantly, in all wisdom: teaching and admonishing one another in psalms, hymns, and spiritual canticles, singing in grace in your hearts to God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "omne quodcumque facitis in verbo aut in opere omnia in nomine Domini Iesu gratias agentes Deo et Patri per ipsum"
      en: "All whatsoever you do in word or in work, do all in the name of the Lord Jesus Christ, giving thanks to God and the Father by him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "mulieres subditae estote viris sicut oportet in Domino"
      en: "Wives, be subject to your husbands, as it behoveth in the Lord."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "viri diligite uxores et nolite amari esse ad illas"
      en: "Husbands, love your wives, and be not bitter towards them."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "filii oboedite parentibus per omnia hoc enim placitum est in Domino"
      en: "Children, obey your parents in all things: for this is well pleasing to the Lord."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "patres nolite ad indignationem provocare filios vestros ut non pusillo animo fiant"
      en: "Fathers, provoke not your children to indignation, lest they be discouraged."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "servi oboedite per omnia dominis carnalibus non ad oculum servientes quasi hominibus placentes sed in simplicitate cordis timentes Dominum"
      en: "Servants, obey in all things your masters according to the flesh, not serving to the eye, as pleasing men, but in simplicity of heart, fearing God."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quodcumque facitis ex animo operamini sicut Domino et non hominibus"
      en: "Whatsoever you do, do it from the heart, as to the Lord, and not to men:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "scientes quod a Domino accipietis retributionem hereditatis Domino Christo servite"
      en: "Knowing that you shall receive of the Lord the reward of inheritance. Serve ye the Lord Christ."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "qui enim iniuriam facit recipiet id quod inique gessit et non est personarum acceptio"
      en: "For he that doth wrong, shall receive for that which he hath done wrongfully: and there is no respect of persons with God."
    status: { la: verified, en: verified }
