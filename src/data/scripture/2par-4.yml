# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 4
verses:
  - n: 1
    text:
      la: "fecit quoque altare aeneum viginti cubitorum longitudinis et viginti cubitorum latitudinis et decem cubitorum altitudinis"
      en: "He made also an altar of brass twenty cubits long, and twenty cubits broad, and ten cubits high."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "mare etiam fusile decem cubitis a labio usque ad labium rotundum per circuitum quinque cubitos habebat altitudinis et funiculus triginta cubitorum ambiebat gyrum eius"
      en: "Also a molten sea of ten cubits from brim to brim, round in compass: it was five cubits high, and a line of thirty cubits compassed it round about."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "similitudo quoque boum erat subter illud et decem cubitis quaedam extrinsecus celaturae quasi duobus versibus alvum maris circuibant boves autem erant fusiles"
      en: "And under it there was the likeness of oxen, and certain engravings on the outside of ten cubits compassed the belly of the sea, as it were with two rows."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ipsum mare super duodecim boves inpositum erat quorum tres respiciebant aquilonem et alii tres occidentem porro tres alii meridiem et tres qui reliqui erant orientem mare habentes superpositum posteriora autem boum erant intrinsecus sub mari"
      en: "And the oxen were cast: and the sea itself was set upon the twelve oxen, three of which looked toward the north, and other three toward the west: and other three toward the south, and the other three that remained toward the east, and the sea stood upon them: and the hinder parts of the oxen were in- ward under the sea."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "porro vastitas eius habebat mensuram palmi et labium illius erat quasi labium calicis vel repandi lilii capiebatque mensurae tria milia metretas"
      en: "Now the thickness of it was a handbreadth, and the brim of it was like the brim of a cup, or of a crisped lily: and it held three thousand measures."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "fecit quoque concas decem et posuit quinque a dextris et quinque a sinistris ut lavarent in eis omnia quae in holocaustum oblaturi erant porro in mari sacerdotes lavabantur"
      en: "He made also ten lavers: and he see five on the right hand, and five on the left, to wash in them all such things as they mere to offer for holocausts: but the sea was for the priests to wash in."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "fecit autem et candelabra aurea decem secundum speciem qua iussa erant fieri et posuit ea in templo quinque a dextris et quinque a sinistris"
      en: "And he made ten golden candlesticks, according to the form which they were commanded to be made by: and he set them in the temple, five on the right hand, and five on the left."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "necnon et mensas decem posuitque eas in templo quinque a dextris et quinque a sinistris fialas quoque aureas centum"
      en: "Moreover also ten tables: and he set them in the temple, five on the right side, and five on the left. Also a hundred bowls of gold."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "fecit etiam atrium sacerdotum et basilicam grandem et ostia in basilica quae texit aere"
      en: "He made also the court of the priests, and a great hall, and doors in the hall, which he covered with brass."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "porro mare posuit in latere dextro contra orientem ad meridiem"
      en: "And he set the sea on the right side over against the east toward the south."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "fecit autem Hiram lebetas quoque et creagras et fialas et conplevit omne opus regis in domo Dei"
      en: "And Hiram made caldrons, and fleshhooks, and bowls: and finished all the king's work in the house of God:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "hoc est columnas duas et epistylia et capita et quasi quaedam retiacula quae capita tegerent super epistylia"
      en: "That is to say, the two pillars, and the pommels, and the chapiters, and the network, to cover the chapiters over the pommels."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "malagranata quoque quadringenta et retiacula duo ita ut bini ordines malagranatorum singulis retiaculis iungerentur quae protegerent epistylia et capita columnarum"
      en: "And four hundred pomegranates, and two wreaths of network, so that two rows of pomegranates were joined to each wreath, to cover the pommels, and the chapiters of the pillars."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "bases etiam fecit et concas quas superposuit basibus"
      en: "He made also bases, and lavers, which he set upon the bases:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "mare unum bovesque duodecim sub mari"
      en: "One sea, and twelve oxen under the sea;"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et lebetas et creagras et fialas omnia vasa fecit Salomoni Hiram pater eius in domo Domini ex aere mundissimo"
      en: "And the caldrons, and fleshhooks, and bowls. All the vessels did Hiram his father make for Solomon in the house of the Lord of the finest brass."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "in regione Iordanis fudit ea rex in argillosa terra inter Socchoth et Saredatha"
      en: "In the country near the Jordan did the king cast them, in a clay ground between Sochot and Saredatha."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "erat autem multitudo vasorum innumerabilis ita ut ignoraretur pondus aeris"
      en: "And the multitude of vessels was innumerable, so that the weight of the brass was not known."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "fecitque Salomon omnia vasa domus Dei et altare aureum et mensas et super eas panes propositionis"
      en: "And Solomon made all the vessels for the house of God, and the golden altar, and the tables, upon which were the leaves of proposition,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "candelabra quoque cum lucernis suis ut lucerent ante oraculum iuxta ritum ex auro purissimo"
      en: "The candlesticks also of most pure gold with their lamps to give light before the oracle, according to the manner."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et florentia quaedam et lucernas et forcipes aureos omnia de auro mundissimo facta sunt"
      en: "And certain flowers, and lamps, and golden tongs: all were made of the finest gold."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "thymiamateria quoque et turibula et fialas et mortariola ex auro purissimo et ostia celavit templi interioris id est in sancto sanctorum et ostia templi forinsecus aurea sicque conpletum est omne opus quod fecit Salomon in domo Domini"
      en: "The vessels also for the perfumes, and the censers, and the bowls, and the mortars, of pure gold. And he graved the doors of the inner temple, that is, for the holy of holies: and the doors of the temple without were of gold. And thus all the work was finished which Solomon made in the house of the Lord."
    status: { la: verified, en: verified }
