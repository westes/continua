# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 18
verses:
  - n: 1
    text:
      la: "apparuit autem ei Dominus in convalle Mambre sedenti in ostio tabernaculi sui in ipso fervore diei"
      en: "and my lord is an old man, shall I give myself to pleasure?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "cumque elevasset oculos apparuerunt ei tres viri stantes propter eum quos cum vidisset cucurrit in occursum eorum de ostio tabernaculi et adoravit in terra"
      en: "And when he had lifted up his eyes, there appeared to him three men standing near him: and as soon as he saw them he ran to meet them from the door of his tent, and adored down to the ground."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dixit Domine si inveni gratiam in oculis tuis ne transeas servum tuum"
      en: "And he said: Lord, if I have found favour in thy sight, pass not away from thy servant:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sed adferam pauxillum aquae et lavate pedes vestros et requiescite sub arbore"
      en: "But I will fetch a little water, and wash ye your feet, and rest ye under the tree."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ponam buccellam panis et confortate cor vestrum postea transibitis idcirco enim declinastis ad servum vestrum qui dixerunt fac ut locutus es"
      en: "And I will set a morsel of bread, and strengthen ye your heart, afterwards you shall pass on: for therefore are you come aside to your servant. And they said: Do as thou hast spoken."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "festinavit Abraham in tabernaculum ad Sarram dixitque ei adcelera tria sata similae commisce et fac subcinericios panes"
      en: "Abraham made haste into the tent to Sera, and said to her: Make haste, temper together three measures of flour, and make cakes upon the hearth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ipse vero ad armentum cucurrit et tulit inde vitulum tenerrimum et optimum deditque puero qui festinavit et coxit illum"
      en: "And he himself ran to the herd, and took from thence a calf very tender and very good, and gave it to a young man: who made haste and boiled it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "tulit quoque butyrum et lac et vitulum quem coxerat et posuit coram eis ipse vero stabat iuxta eos sub arbore"
      en: "He took also butter and milk, and the calf which he had boiled, and set before them: but he stood by them under the tree."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cumque comedissent dixerunt ad eum ubi est Sarra uxor tua ille respondit ecce in tabernaculo est"
      en: "And when they had eaten, they said to him: Where is Sara thy wife? He answered: Lo, she is in the tent."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cui dixit revertens veniam ad te tempore isto vita comite et habebit filium Sarra uxor tua quo audito Sarra risit post ostium tabernaculi"
      en: "And he said to him: I will return and come to thee at this time, life accompanying and Sara thy wife shall have a son. Which when Sara heard, she laughed behind the door of the tent."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "erant autem ambo senes provectaeque aetatis et desierant Sarrae fieri muliebria"
      en: "Now they were both old, and far advanced in years, and it had ceased to be with Sara after the manner of women."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quae risit occulte dicens postquam consenui et dominus meus vetulus est voluptati operam dabo"
      en: "And she laughed secretly, saying: After I am grown old"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixit autem Dominus ad Abraham quare risit Sarra dicens num vere paritura sum anus"
      en: "And the Lord said to Abraham: Why did Sera laugh, saying: Shall I who am an old woman bear a child indeed ?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "numquid Deo est quicquam difficile iuxta condictum revertar ad te hoc eodem tempore vita comite et habebit Sarra filium"
      en: "Is there any thing hard to God? according to appointment I will return to thee at this same time, life accompanying, and Sara shall have a son."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "negavit Sarra dicens non risi timore perterrita Dominus autem non est inquit ita sed risisti"
      en: "Sara denied, saying: I did not laugh: for she was afraid. But the Lord said, Nay: but thou didst laugh:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cum ergo surrexissent inde viri direxerunt oculos suos contra Sodomam et Abraham simul gradiebatur deducens eos"
      en: "And when the men rose up from thence, they turned their eyes towards Sodom: and Abraham walked with them, bringing them on the way."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dixitque Dominus num celare potero Abraham quae gesturus sum"
      en: "And the Lord said: Can I hide from Abraham what I am about to do:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cum futurus sit in gentem magnam ac robustissimam et benedicendae sint in illo omnes nationes terrae"
      en: "\"Seeing he shall become a great and mighty nation, and in him all the nations of the earth shall be blessed?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "scio enim quod praecepturus sit filiis suis et domui suae post se ut custodiant viam Domini et faciant iustitiam et iudicium ut adducat Dominus propter Abraham omnia quae locutus est ad eum"
      en: "For I know that he will command his children, and his household after him to keep the way of the Lord, and do judgment and justice: that for Abraham's sake the Lord may bring to effect all the things he hath spoken unto him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dixit itaque Dominus clamor Sodomorum et Gomorrae multiplicatus est et peccatum earum adgravatum est nimis"
      en: "And the Lord said: The cry of Sodom and Gomorrha is multiplied, and their sin is become exceedingly grievous."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "descendam et videbo utrum clamorem qui venit ad me opere conpleverint an non est ita ut sciam"
      en: "I will go down and see whether they have done according to the cry that is come to me: or whether it be not so, that I may know."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "converteruntque se inde et abierunt Sodomam Abraham vero adhuc stabat coram Domino"
      en: "And they turned themselves from thence, and went their way to Sodom: but Abraham as yet stood before the Lord."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et adpropinquans ait numquid perdes iustum cum impio"
      en: "And drawing nigh he said: Wilt thou destroy the just with the wicked?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "si fuerint quinquaginta iusti in civitate peribunt simul et non parces loco illi propter quinquaginta iustos si fuerint in eo"
      en: "If there be fifty just men in the city, shall they perish withal? and wilt thou not spare that place for the sake of the fifty just, if they be therein?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "absit a te ut rem hanc facias et occidas iustum cum impio fiatque iustus sicut impius non est hoc tuum qui iudicas omnem terram nequaquam facies iudicium"
      en: "Far be it from thee to do this thing, and to slay the just with the wicked, and for the just to be in like case as the wicked, this is not beseeming thee: thou who judgest all the earth, wilt not make this judgment."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "dixitque Dominus ad eum si invenero Sodomis quinquaginta iustos in medio civitatis dimittam omni loco propter eos"
      en: "And the Lord said to him: If I And in Sodom fifty just within the city, I will spare the whole place for their sake."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "respondens Abraham ait quia semel coepi loquar ad Dominum meum cum sim pulvis et cinis"
      en: "And Abraham answered, and said: Seeing I have once begun, I will speak to my Lord, whereas I am dust and ashes."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "quid si minus quinquaginta iustis quinque fuerint delebis propter quinque universam urbem et ait non delebo si invenero ibi quadraginta quinque"
      en: "What if there be Ave less than fifty just persons? wilt thou for five and forty destroy the whole city? And he said: I will not destroy it, if I find five and forty."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "rursumque locutus est ad eum sin autem quadraginta inventi fuerint quid facies ait non percutiam propter quadraginta"
      en: "And again he said to him: But if forty be found there, what wilt thou do? He said: I will not destroy it for the sake of forty."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ne quaeso inquit indigneris Domine si loquar quid si inventi fuerint ibi triginta respondit non faciam si invenero ibi triginta"
      en: "Lord, saith he, be not angry, I beseech thee, if I speak: What if thirty shall be found there? He answered: I will not do it, if I And thirty there."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "quia semel ait coepi loquar ad Dominum meum quid si inventi fuerint ibi viginti dixit non interficiam propter viginti"
      en: "Seeing, saith he, I have once begun, I will speak to my Lord. What if twenty be found there? He said: I will not destroy it for the sake of twenty."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "obsecro inquit ne irascaris Domine si loquar adhuc semel quid si inventi fuerint ibi decem dixit non delebo propter decem"
      en: "I beseech thee, saith he, be not angry, Lord, if I speak yet once more: What if tell should be found there ? And he said: I will not destroy it for the sake of ten."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "abiit Dominus postquam cessavit loqui ad Abraham et ille reversus est in locum suum"
      en: "And the Lord departed, after he had left speaking to Abraham: and Abraham returned to his place."
    status: { la: verified, en: verified }
