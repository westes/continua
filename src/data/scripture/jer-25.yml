# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 25
verses:
  - n: 1
    text:
      la: "Verbum quod factum est ad Jeremiam, de omni populo Juda, in anno quarto Joakim, filii Josiae, regis Juda ( ipse est annus primus Nabuchodonosor regis Babylonis),"
      en: "The word that came to Jeremias concerning all the people of Juda, in the fourth year of Joakim the son of Josias king of Juda, (the same is the first year of Nabuchodonosor king of Babylon,)"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quod locutus est Jeremias propheta ad omnem populum Juda, et ad universos habitatores Jerusalem, dicens:"
      en: "Which Jeremias the prophet spoke to all the people of Juda, and to all the inhabitants of Jerusalem, saying:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "A tertiodecimo anno Josiae, filii Amon, regis Juda, usque ad diem hanc, iste tertius et vigesimus annus, factum est verbum Domini ad me, et locutus sum ad vos de nocte consurgens, et loquens, et non audistis."
      en: "From the thirteenth year of Josias the son of Ammon king of Juda until this day: this is the three and twentieth year, the word of the Lord hath come to me, and I have spoken to you, rising before day, and speaking, and you have not hearkened."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et misit Dominus ad vos omnes servos suos prophetas, consurgens diluculo, mittensque: et non audistis, neque inclinastis aures vestras ut audiretis,"
      en: "And the Lord hath sent to you all his servants the prophets, rising early, and sending, and you have not hearkened, nor inclined your ears to hear."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cum diceret: Revertimini unusquisque a via sua mala, et a pessimis cogitationibus vestris, et habitabitis in terra quam dedit Dominus vobis et patribus vestris, a saeculo usque in saeculum:"
      en: "When he said: Return ye, every one from his evil way, and from your wicked devices, and you shall dwell in the land which the Lord hath given to you, and your fathers for ever and ever."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et nolite ire post deos alienos, ut serviatis eis adoretisque eos, neque me ad iracundiam provocetis in operibus manuum vestrarum, et non affligam vos."
      en: "And go not after strange gods to serve them, and adore them: nor provoke me to wrath by the works of your hands, and I will not afflict you."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et non audistis me, dicit Dominus, ut me ad iracundiam provocaretis in operibus manuum vestrarum, in malum vestrum."
      en: "And you have not heard me, saith the Lord, that you might provoke me to anger with the works of your hands, to your own hurt."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Propterea haec dicit Dominus exercituum: Pro eo quod non audistis verba mea,"
      en: "Therefore thus saith the Lord of hosts: Because you have not heard my words:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ecce ego mittam et assumam universas cognationes aquilonis, ait Dominus, et Nabuchodonosor regem Babylonis servum meum, et adducam eos super terram istam, et super habitatores ejus, et super omnes nationes quae in circuitu illius sunt: et interficiam eos, et ponam eos in stuporem et in sibilum, et in solitudines sempiternas."
      en: "Behold I will send, and take all the kindreds of the north, saith the Lord, and Nabuchodonosor the king of Babylon my servant: and I will bring them against this land, and against the inhabitants thereof, and against all the nations that are round about it: and I will destroy them, and make them an astonishment and a hissing, and perpetual desolations."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Perdamque ex eis vocem gaudii et vocem laetitiae, vocem sponsi et vocem sponsae, vocem molae et lumen lucernae."
      en: "And I will take away from them the voice of mirth, and the voice of gladness, the voice of the bridegroom, and the voice of the bride, the sound of the mill, and the light of the lamp."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et erit universa terra haec in solitudinem, et in stuporem: et servient omnes gentes istae regi Babylonis septuaginta annis."
      en: "And all this land shall be a desolation, and an astonishment: and all these nations shall serve the king of Babylon seventy years."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cumque impleti fuerint septuaginta anni, visitabo super regem Babylonis et super gentem illam, dicit Dominus, iniquitatem eorum, et super terram Chaldaeorum, et ponam illam in solitudines sempiternas."
      en: "And when the seventy years shall be expired, I will punish the king of Babylon, and that nation, saith the Lord, for their iniquity, and the land of the Chaldeans: and I will make it perpetual desolations."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et adducam super terram illam omnia verba mea, quae locutus sum contra eam, omne quod scriptum est in libro isto, quaecumque prophetavit Jeremias adversum omnes gentes:"
      en: "And I will bring upon the land all my words, that I have spoken against it, all that is written in this book, all that Jeremias hath prophesied against all nations:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quia servierunt eis, cum essent gentes multae, et reges magni: et reddam eis secundum opera eorum, et secundum facta manuum suarum."
      en: "For they have served them, whereas they were many nations, and great kings: and I will repay them according to their deeds, and according to the works of their hands."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quia sic dicit Dominus exercituum, Deus Israel: Sume calicem vini furoris hujus de manu mea, et propinabis de illo cunctis gentibus, ad quas ego mittam te."
      en: "For thus saith the Lord of hosts the God of Israel: Take the cup of wine of this fury at my hand: and thou shalt make all the nations to drink thereof, unto which I shall send thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et bibent, et turbabuntur et insanient a facie gladii quem ego mittam inter eos."
      en: "And they shall drink, and be troubled, and be mad because of the sword, which I shall send among them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et accepi calicem de manu Domini, et propinavi cunctis gentibus ad quas misit me Dominus:"
      en: "And I took the cup at the hand of the Lord, and I presented it to all the nations to drink of it, to which the Lord sent me:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Jerusalem, et civitatibus Juda, et regibus ejus, et principibus ejus, ut darem eos in solitudinem, et in stuporem, et in sibilum, et in maledictionem, sicut est dies ista:"
      en: "To wit, Jerusalem, and the cities of Juda, and the kings thereof, and the princes thereof: to make them a desolation, and an astonishment, and a hissing, and a curse, as it is at this day."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Pharaoni regi Aegypti, et servis ejus, et principibus ejus, et omni populo ejus:"
      en: "Pharao the king of Egypt, and his servants, and his princes, and all his people,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et universis generaliter cunctis regibus terrae Ausitidis, et cunctis regibus terrae Philisthiim, et Ascaloni, et Gazae, et Accaron, et reliquiis Azoti:"
      en: "And all in general: all the kings of the land of Ausitis, and all the kings of the land of the Philistines, and Ascalon, and Gaza, and Accaron, and the remnant of Azotus."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et Idumaeae, et Moab, et filiis Ammon:"
      en: "And Edom, and Moab, and the children of Ammon."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et cunctis regibus Tyri, et universis regibus Sidonis, et regibus terrae insularum qui sunt trans mare:"
      en: "And all the kings of Tyre, and all the kings of Sidon: and the kings of the land of the islands that are beyond the sea."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et Dedan, et Thema, et Buz, et universis qui attonsi sunt in comam:"
      en: "And Dedan, and Thema, and Buz, and all that have their hair cut round."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et cunctis regibus Arabiae, et cunctis regibus occidentis, qui habitant in deserto:"
      en: "And all the kings of Arabia, and all the kings of the west, that dwell in the desert."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et cunctis regibus Zambri, et cunctis regibus Elam, et cunctis regibus Medorum:"
      en: "And all the kings of Zambri, and all the kings of Elam, and all the kings of Medes:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "cunctis quoque regibus aquilonis, de prope et de longe, unicuique contra fratrem suum: et omnibus regnis terrae quae super faciem ejus sunt: et rex Sesach bibet post eos."
      en: "And all the kings of the north far and near, every one against his brother: and all the kingdoms of the earth, which are upon the face thereof: and the king of Sesac shall drink after them."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et dices ad eos: Haec dicit Dominus exercituum, Deus Israel: Bibite, et inebriamini, et vomite: et cadite, neque surgatis a facie gladii quem ego mittam inter vos."
      en: "And thou shalt say to them: Thus saith the Lord of hosts the God of Israel: Drink ye, and be drunken, and vomit: and fall, and rise no more, because of the sword, which I shall send among you."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Cumque noluerint accipere calicem de manu tua ut bibant, dices ad eos: Haec dicit Dominus exercituum: Bibentes bibetis:"
      en: "And if they refuse to take the cup at thy hand to drink, thou shalt say to them: Thus saith the Lord of hosts: Drinking you shall drink:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quia ecce in civitate in qua invocatum est nomen meum ego incipiam affligere, et vos quasi innocentes et immunes eritis? Non eritis immunes: gladium enim ego voco super omnes habitatores terrae, dicit Dominus exercituum."
      en: "For behold I begin to bring evil on the city wherein my name is called upon: and shall you be as innocent and escape free? you shall not escape free: for I will call for the sword upon all the inhabitants of the earth, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et tu prophetabis ad eos omnia verba haec, et dices ad illos: Dominus de excelso rugiet, et de habitaculo sancto suo dabit vocem suam: rugiens rugiet super decorem suum: celeuma quasi calcantium concinetur adversus omnes habitatores terrae."
      en: "And thou shalt prophesy unto them all these words, and thou shalt say to them: The Lord shall roar from on high, and shall utter his voice from his holy habitation: roaring he shall roar upon the place of his beauty: the shout as it were of them that tread grapes shall be given out against all the inhabitants of the earth."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Pervenit sonitus usque ad extrema terrae, quia judicium Domino, cum gentibus: judicatur ipse cum omni carne. Impios tradidi gladio, dicit Dominus."
      en: "The noise is come even to the ends of the earth: for the Lord entereth into judgment with the nations: he entereth into judgment with all flesh; the wicked I have delivered up to the sword, saith the Lord."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Haec dicit Dominus exercituum: Ecce afflictio egredietur de gente in gentem, et turbo magnus egredietur a summitatibus terrae."
      en: "Thus saith the Lord of hosts: Behold evil shall go forth from nation to nation: and a great whirlwind shall go forth from the ends of the earth."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et erunt interfecti Domini in die illa, a summo terrae usque ad summum ejus: non plangentur, et non colligentur, neque sepelientur: in sterquilinium super faciem terrae jacebunt."
      en: "And the slain of the Lord shall be at that day from one end of the earth even to the other end thereof: they shall not be lamented, and they shall not be gathered up, nor buried: they shall lie as dung upon the face of the earth."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Ululate, pastores, et clamate: et aspergite vos cinere, optimates gregis, quia completi sunt dies vestri, ut interficiamini, et dissipationes vestrae: et cadetis quasi vasa pretiosa."
      en: "Howl, ye shepherds, and cry: and sprinkle yourselves with ashes, ye leaders of the flock: for the days of your slaughter and your dispersion are accomplished, and you shall fall like precious vessels."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et peribit fuga a pastoribus, et salvatio ab optimatibus gregis."
      en: "And the shepherds shall have no way to flee, nor the leaders of the flock to save themselves."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Vox clamoris pastorum et ululatus optimatum gregis, quia vastavit Dominus pascua eorum:"
      en: "A voice of the cry of the shepherds, and a howling of the principal of the flock: because the Lord hath wasted their pastures."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et conticuerunt arva pacis a facie irae furoris Domini."
      en: "And the fields of peace have been silent, because of the fierce anger of the Lord."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Dereliquit quasi leo umbraculum suum, quia facta est terra eorum in desolationem a facie irae columbae, et a facie irae furoris Domini."
      en: "He has forsaken his covert as the lion, for the land is laid waste because of the wrath of the dove, and because of the fierce anger of the Lord."
    status: { la: verified, en: verified }
