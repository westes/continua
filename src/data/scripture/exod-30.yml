# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 30
verses:
  - n: 1
    text:
      la: "facies quoque altare in adolendum thymiama de lignis setthim"
      en: "Thou shalt make also an altar to burn incense, of setim wood."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "habens cubitum longitudinis et alterum latitudinis id est quadrangulum et duos cubitos in altitudine cornua ex ipso procedent"
      en: "It shall be a cubit in length, and another in breadth, that is, foursquare, and two in height. Horns shall go out of the same."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "vestiesque illud auro purissimo tam craticulam eius quam parietes per circuitum et cornua faciesque ei coronam aureolam per gyrum"
      en: "And thou shalt overlay it with the purest gold, as well as the grate thereof, as the walls round about and the horns. And thou shalt make to it a crown of gold round about,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et duos anulos aureos sub corona per singula latera ut mittantur in eos vectes et altare portetur"
      en: "And two golden rings under the crown on either side, that the bars may be put into them, and the altar be carried."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ipsos quoque vectes facies de lignis setthim et inaurabis"
      en: "And thou shalt make the bars also of setim wood, and shalt overlay them with gold."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ponesque altare contra velum quod ante arcam pendet testimonii coram propitiatorio quo tegitur testimonium ubi loquar tibi"
      en: "And thou shalt set the altar over against the veil, that hangeth before the ark of the testimony before the propitiatory wherewith the testimony is covered, where I will speak to thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et adolebit incensum super eo Aaron suave fraglans mane quando conponet lucernas incendet illud"
      en: "And Aaron shall burn sweet smelling incense upon it in the morning. When he shall dress the lamps, he shall burn it:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et quando conlocat eas ad vesperum uret thymiama sempiternum coram Domino in generationes vestras"
      en: "And when he shall place them in the evening, he shall burn an everlasting incense before the Lord throughout your generations."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "non offeretis super eo thymiama conpositionis alterius nec oblationem et victimam nec liba libabitis"
      en: "You shall not offer upon it incense of another composition nor oblation, and victim, neither shall you offer libations."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et deprecabitur Aaron super cornua eius semel per annum in sanguine quod oblatum est pro peccato et placabit super eo in generationibus vestris sanctum sanctorum erit Domino"
      en: "And Aaron shall pray upon the horns thereof once a year, with the blood of that which was offered for sin, and shall make atonement upon it in your generations. It shall be most holy to the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "locutusque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quando tuleris summam filiorum Israhel iuxta numerum dabunt singuli pretium pro animabus suis Domino et non erit plaga in eis cum fuerint recensiti"
      en: "When thou shalt take the sum of the children of Israel according to their number, every one of them shall give a price for their souls to the Lord, and there shall be no scourge among them, when they shall be reckoned."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "hoc autem dabit omnis qui transit ad nomen dimidium sicli iuxta mensuram templi siclus viginti obolos habet media pars sicli offeretur Domino"
      en: "And this shall every one give that passeth at the naming, half a sicle according to the standard of the temple. A sicle hath twenty obols. Half a sicle shall be offered to the Lord."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui habetur in numero a viginti annis et supra dabit pretium"
      en: "He that is counted in the number from twenty years and upwards, shall give the price."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "dives non addet ad medium sicli et pauper nihil minuet"
      en: "The rich man shall not add to half a sicle, and the poor man shall diminish nothing."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "susceptamque pecuniam quae conlata est a filiis Israhel trades in usus tabernaculi testimonii ut sit monumentum eorum coram Domino et propitietur animabus illorum"
      en: "And the money received which was contributed by the children of Israel, thou shalt deliver unto the uses of the tabernacle of the testimony, that it may be a memorial of them before the Lord, and he may be merciful to their souls."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "locutusque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "facies et labium aeneum cum basi sua ad lavandum ponesque illud inter tabernaculum testimonii et altare et missa aqua"
      en: "Thou shalt make also a brazen laver with its foot, to wash in: and thou shalt set it between the tabernacle of the testimony and the altar. And water being put into it,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "lavabunt in eo Aaron et filii eius manus suas ac pedes"
      en: "Aaron and his sons shall wash their hands and feet in it:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quando ingressuri sunt tabernaculum testimonii et quando accessuri ad altare ut offerant in eo thymiama Domino"
      en: "When they are going into the tabernacle of the testimony, and when they are to come to the altar, to offer on it incense to the Lord,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ne forte moriantur legitimum sempiternum erit ipsi et semini eius per successiones"
      en: "Lest perhaps they die. It shall be an everlasting law to him, and to his seed by successions."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "locutusque est Dominus ad Mosen"
      en: "And the Lord spoke to Moses,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "dicens sume tibi aromata prima et zmyrnae electae quingentos siclos et cinnamomi medium id est ducentos quinquaginta calami similiter ducentos quinquaginta"
      en: "Saying: Take spices, of principal and chosen myrrh five hundred sicles, and of cinnamon half so much, that is, two hundred and fifty sicles, of calamus in like manner two hundred and fifty."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "cassiae autem quingentos siclos in pondere sanctuarii olei de olivetis mensuram hin"
      en: "And of cassia five hundred sicles by the weight of the sanctuary, of oil of olives the measure hin:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "faciesque unctionis oleum sanctum unguentum conpositum opere unguentarii"
      en: "And thou shalt make the holy oil of unction, an ointment compounded after the art of the perfumer,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et ungues ex eo tabernaculum testimonii et arcam testamenti"
      en: "And therewith thou shalt anoint the tabernacle of the testimony, and the ark of the testament,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "mensamque cum vasis suis candelabrum et utensilia eius altaria thymiamatis"
      en: "And the table with the vessels thereof, the candlestick and furniture thereof, the altars of incense,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et holocausti et universam supellectilem quae ad cultum eorum pertinent"
      en: "And of holocaust, and all the furniture that belongeth to the service of them."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "sanctificabisque omnia et erunt sancta sanctorum qui tetigerit ea sanctificabitur"
      en: "And thou shalt sanctify all, and they shall be most holy: he that shall touch them shall be sanctified."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Aaron et filios eius ungues sanctificabisque eos ut sacerdotio fungantur mihi"
      en: "Thou shalt anoint Aaron and his sons, and shalt sanctify them, that they may do the office of priesthood unto me."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "filiis quoque Israhel dices hoc oleum unctionis sanctum erit mihi in generationes vestras"
      en: "And thou shalt say to the children of Israel: This oil of unction shall be holy unto me throughout your generations."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "caro hominis non unguetur ex eo et iuxta conpositionem eius non facietis aliud quia sanctificatum est et sanctum erit vobis"
      en: "The flesh of man shall not be anointed therewith, and you shall make none other of the same composition, because it is sanctified, and shall be holy unto you."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "homo quicumque tale conposuerit et dederit ex eo alieno exterminabitur de populo suo"
      en: "What man soever shall compound such, and shall give thereof to a stranger, he shall be cut off from his people."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "dixitque Dominus ad Mosen sume tibi aromata stacten et onycha galbanen boni odoris et tus lucidissimum aequalis ponderis erunt omnia"
      en: "And the Lord said to Moses: Take unto thee spices, stacte, and onycha, galbanum of sweet savour, and the clearest frankincense, all shall be of equal weight."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "faciesque thymiama conpositum opere unguentarii mixtum diligenter et purum et sanctificatione dignissimum"
      en: "And thou shalt make incense compounded by the work of the perfumer, well tempered together, and pure, and most worthy of sanctification."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "cumque in tenuissimum pulverem universa contuderis pones ex eo coram testimonio tabernaculi in quo loco apparebo tibi sanctum sanctorum erit vobis thymiama"
      en: "And when thou has beaten all into very small powder, thou shalt set of it before the tabernacle of the testimony, in the place where I will appear to thee. Most holy shall this incense be to you."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "talem conpositionem non facietis in usus vestros quia sanctum est Domino"
      en: "You shall not make such a composition for your own uses, because it is holy to the Lord."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "homo quicumque fecerit simile ut odore illius perfruatur peribit de populis suis"
      en: "What man soever shall make the like, to enjoy the smell thereof, he shall perish out of his people."
    status: { la: verified, en: verified }
