# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 34
verses:
  - n: 1
    text:
      la: "verbum quod factum est ad Hieremiam a Domino quando Nabuchodonosor rex Babylonis et omnis exercitus eius universaque regna terrae quae erant sub potestate manus eius et omnes populi bellabant contra Hierusalem et contra omnes urbes eius dicens"
      en: "The word that came to Jeremias from the Lord, (when Nabuchodonosor king of Babylon, and all his army, and all the kingdoms of the earth, that were under the power of his hand, and all the people fought against Jerusalem and against all the cities thereof,) saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "haec dicit Dominus Deus Israhel vade et loquere ad Sedeciam regem Iuda et dices ad eum haec dicit Dominus ecce ego tradam civitatem hanc in manu regis Babylonis et succendet eam igni"
      en: "Thus saith the Lord, the God of Israel: Go, and speak to Sedecias king of Juda, and say to him: Thus saith the Lord: Behold I will deliver this city into the hands of the king of Babylon, and he shall burn it with fire."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et tu non effugies de manu eius sed conprehensione capieris et in manu eius traderis et oculi tui oculos regis Babylonis videbunt et os eius cum ore tuo loquetur et Babylonem introibis"
      en: "And thou shalt not escape out of his hand: but thou shalt surely be taken, and thou shalt be delivered into his hand: and thy eyes shall see the eyes of the king of Babylon, and his mouth shall speak with thy mouth, and thou shalt go to Babylon."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "attamen audi verbum Domini Sedecia rex Iuda haec dicit Dominus ad te non morieris in gladio"
      en: "Yet hear the word of the Lord, O Sedecias king of Juda: Thus saith the Lord to thee: Thou shalt not die by the sword."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "sed in pace morieris et secundum conbustiones patrum tuorum regum priorum qui fuerunt ante te sic conburent te et vae domine plangent te quia verbum ego locutus sum dicit Dominus"
      en: "But thou shalt die in peace, and according to the burnings of thy fathers, the former kings that were before thee, so shall they burn thee: and they shall mourn for thee, saying: Alas, Lord: for I have spoken the word, saith the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et locutus est Hieremias propheta ad Sedeciam regem Iuda universa verba haec in Hierusalem"
      en: "And Jeremias the prophet spoke all these words to Sedecias the king of Juda in Jerusalem."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et exercitus regis Babylonis pugnabat contra Hierusalem et contra omnes civitates Iuda quae reliquae erant contra Lachis et contra Azeca haec enim supererant de civitatibus Iuda urbes munitae"
      en: "And the army of the king of Babylon fought against Jerusalem, and against all the cities of Juda that were left, against Lachis, and against Azecha: for these remained of the cities of Juda, fenced cities."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "verbum quod factum est ad Hieremiam a Domino postquam percussit rex Sedecias foedus cum omni populo in Hierusalem praedicans"
      en: "The word that came to Jeremias from the Lord, after that king Sedecias had made a covenant with all the people in Jerusalem making a proclamation:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ut dimitteret unusquisque servum suum et unusquisque ancillam suam hebraeum et hebraeam liberos et nequaquam dominarentur eis id est in Iudaeo et fratre suo"
      en: "That every man should let his manservant, and every man his maidservant, being a Hebrew man or a Hebrew woman, go free: and that they should not lord it over them, to wit, over the Jews their brethren."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "audierunt ergo omnes principes et universus populus qui inierant pactum ut dimitteret unusquisque servum suum et unusquisque ancillam suam liberos et ultra non dominarentur in eis audierunt igitur et dimiserunt"
      en: "And all the princes, and all the people who entered into the covenant, heard that every man should let his manservant, and every man his maidservant go free, and should no more have dominion over them: and they obeyed, and let them go free."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et conversi sunt deinceps et retraxerunt servos et ancillas suas quos dimiserant liberos et subiugaverunt in famulos et in famulas"
      en: "But afterwards they turned: and brought back again their servants and their handmaids, whom they had let go free, and brought them into subjection as menservants and maidservants."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et factum est verbum Domini ad Hieremiam a Domino dicens"
      en: "And the word of the Lord came to Jeremias from the Lord, saying:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "haec dicit Dominus Deus Israhel ego percussi foedus cum patribus vestris in die qua eduxi eos de terra Aegypti de domo servitutis dicens"
      en: "Thus saith the Lord the God of Israel: I made a covenant with your fathers in the day that I brought them out of the land of Egypt, out of the house of bondage, saying:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "cum conpleti fuerint septem anni dimittat unusquisque fratrem suum hebraeum qui venditus est ei et serviet tibi sex annis et dimittes eum a te liberum et non audierunt patres vestri me nec inclinaverunt aurem suam"
      en: "At the end of seven years, let ye go every man his brother being a Hebrew, who hath been sold to thee, so he shall serve thee six years: and thou shalt let him go free from thee: and your fathers did not hearken to me, nor did they incline their ear."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et conversi estis vos hodie et fecistis quod rectum est in oculis meis ut praedicaretis libertatem unusquisque ad amicum suum et inistis pactum in conspectu meo in domo in qua invocatum est nomen meum super eam"
      en: "And you turned to day, and did that which was right in my eyes, in proclaiming liberty every one to his brother: and you made a covenant in my sight, in the house upon which my name is invocated."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et reversi estis et commaculastis nomen meum et reduxistis unusquisque servum suum et unusquisque ancillam suam quos dimiseratis ut essent liberi et suae potestatis et subiugastis eos ut sint vobis servi et ancillae"
      en: "And you are fallen back, and have defiled my name: and you have brought back again every man his manservant, and every man his maidservant, whom you had let go free, and set at liberty: and you have brought them into subjection to be your servants and handmaids."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "propterea haec dicit Dominus vos non audistis me ut praedicaretis libertatem unusquisque fratri suo et unusquisque amico suo ecce ego praedico libertatem ait Dominus ad gladium et pestem et famem et dabo vos in commotionem cunctis regnis terrae"
      en: "Therefore thus saith the Lord: You have not hearkened to me, in proclaiming liberty every man to his brother and every man to his friend: behold I proclaim a liberty for you, saith the Lord, to the sword, to the pestilence, and to the famine: and I will cause you to be removed to all the kingdoms of the earth."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et dabo viros qui praevaricantur foedus meum et non observaverunt verba foederis quibus adsensi sunt in conspectu meo vitulum quem ceciderunt in duas partes et transierunt inter divisiones eius"
      en: "And I will give the men that have transgressed my covenant, and have not performed the words of the covenant which they agreed to in my presence, when they cut the calf in two and passed between the parts thereof:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "principes Iuda et principes Hierusalem eunuchi et sacerdotes et omnis populus terrae qui transierunt inter divisiones vituli"
      en: "The princes of Juda, and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land that passed between the parts of the calf:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et dabo eos in manu inimicorum suorum et in manu quaerentium animam eorum et erit morticinum eorum in escam volucribus caeli et bestiis terrae"
      en: "And I will give them into the hands of their enemies, and into the hands of them that seek their life : and their dead bodies shall be for meat to the fowls of the air, and to the beasts of the earth."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et Sedeciam regem Iuda et principes eius dabo in manu inimicorum suorum et in manu quaerentium animam eorum et in manu exercituum regis Babylonis qui recesserunt a vobis"
      en: "And Sedecias the king of Juda, and his princes, I will give into the hands of their enemies, and into the hands of them that seek their lives, and into the hands of the armies of the king of Babylon, which are gone from you."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ecce ego praecipio dicit Dominus et reducam eos in civitatem hanc et proeliabuntur adversum eam et capient eam et incendent igni et civitates Iuda dabo in solitudinem eo quod non sit habitator"
      en: "Behold I will command, saith the Lord, and I will bring them again to this city, and they shall fight against it, and take it, and burn it with fire: and I will make the cities of Juda a desolation, without an inhabitant."
    status: { la: verified, en: verified }
