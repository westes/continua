# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 21
verses:
  - n: 1
    text:
      la: "visitavit autem Dominus Sarram sicut promiserat et implevit quae locutus est"
      en: "And the Lord visited Sara, as he had promised: and fulfilled what he had spoken."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "concepitque et peperit filium in senectute sua tempore quo praedixerat ei Deus"
      en: "And she conceived and bore a son in her old age, at the time that God had foretold her."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "vocavitque Abraham nomen filii sui quem genuit ei Sarra Isaac"
      en: "And Abraham called the name of his son, whom Sara bore him, Isaac."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et circumcidit eum octavo die sicut praeceperat ei Deus"
      en: "And he circumcised him the eighth day, as God had commanded him,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cum centum esset annorum hac quippe aetate patris natus est Isaac"
      en: "When he was a hundred years old: for at this age of his father was Isaac born."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixitque Sarra risum fecit mihi Deus quicumque audierit conridebit mihi"
      en: "And Sara said: God hath made a laughter for me: whosoever shall hear of it will laugh with me."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "rursumque ait quis auditurum crederet Abraham quod Sarra lactaret filium quem peperit ei iam seni"
      en: "And again she said: Who would believe that Abraham should hear that Sara gave suck to a son, whom she bore to him in his old age."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "crevit igitur puer et ablactatus est fecitque Abraham grande convivium in die ablactationis eius"
      en: "And the child grew and was weaned: and Abraham made a great feast on the day of his weaning."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cumque vidisset Sarra filium Agar Aegyptiae ludentem dixit ad Abraham"
      en: "And when Sara had seen the son of Agar the Egyptian playing with Isaac her son, she said to Abraham:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "eice ancillam hanc et filium eius non enim erit heres filius ancillae cum filio meo Isaac"
      en: "Cast out this bondwoman, and her son: for the son of the bondwoman shall not be heir with my son Isaac."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dure accepit hoc Abraham pro filio suo"
      en: "Abraham took this grievously for his son."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cui dixit Deus non tibi videatur asperum super puero et super ancilla tua omnia quae dixerit tibi Sarra audi vocem eius quia in Isaac vocabitur tibi semen"
      en: "And God said to him: Let it not seem grievous to thee for the boy, and for thy bondwoman: in all that Sara hath said to thee, hearken to her voice: for in Isaac shall thy seed be called."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sed et filium ancillae faciam in gentem magnam quia semen tuum est"
      en: "But I will make the son also of the bondwoman a great nation, because he is thy seed."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "surrexit itaque Abraham mane et tollens panem et utrem aquae inposuit scapulae eius tradiditque puerum et dimisit eam quae cum abisset errabat in solitudine Bersabee"
      en: "So Abraham rose up in the morning, and taking bread and a bottle of water, put it upon her shoulder, and delivered the boy, and sent her away. And she departed, and wandered in the wilderness of Bersabee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cumque consumpta esset aqua in utre abiecit puerum subter unam arborum quae ibi erant"
      en: "And when the water in the bottle was spent, she cast the boy under one of the trees that were there."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et abiit seditque e regione procul quantum potest arcus iacere dixit enim non videbo morientem puerum et sedens contra levavit vocem suam et flevit"
      en: "And she went her way, and sat over against him a great way off as far as a bow can carry, for she said: I will not see the boy die: and sitting over against, she lifted up her voice and wept."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "exaudivit autem Deus vocem pueri vocavitque angelus Domini Agar de caelo dicens quid agis Agar noli timere exaudivit enim Deus vocem pueri de loco in quo est"
      en: "And God heard the voice of the boy: and an angel of God called to Agar from heaven, saying: What art thou doing, Agar? fear not: for God hath heard the voice of the boy, from the place wherein he is."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "surge tolle puerum et tene manum illius quia in gentem magnam faciam eum"
      en: "Arise, take up the boy, and hold him by the hand: for I will make him a great nation."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "aperuitque oculos eius Deus quae videns puteum aquae abiit et implevit utrem deditque puero bibere"
      en: "And God opened her eyes: and she saw a well of water, and went and filled the bottle, and gave the boy to drink."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et fuit cum eo qui crevit et moratus est in solitudine et factus est iuvenis sagittarius"
      en: "And God was with him: and he grew, and dwelt in the wilderness, and became a young man, an archer."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "habitavitque in deserto Pharan et accepit illi mater sua uxorem de terra Aegypti"
      en: "And he dwelt in the wilderness of Pharan, and his mother took a wife for him out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "eodem tempore dixit Abimelech et Fichol princeps exercitus eius ad Abraham Deus tecum est in universis quae agis"
      en: "At the same time Abimelech, and Phicol the general of his army said to Abraham: God is with thee in all that thou dost."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "iura ergo per Dominum ne noceas mihi et posteris meis stirpique meae sed iuxta misericordiam quam feci tibi facies mihi et terrae in qua versatus es advena"
      en: "Swear therefore by God, that thou wilt not hurt me, nor my posterity, nor my stock: but according to the kindness that I have done to thee, thou shalt do to me, and to the land wherein thou hast lived a stranger."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "dixitque Abraham ego iurabo"
      en: "And Abraham said: I will swear."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et increpavit Abimelech propter puteum aquae quem vi abstulerant servi illius"
      en: "And he reproved Abimelech for a well of water, which his servants had taken away by force."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "respondit Abimelech nescivi quis fecerit hanc rem sed et tu non indicasti mihi et ego non audivi praeter hodie"
      en: "And Abimelech answered: I knew not who did this thing: and thou didst not tell me, and I heard not of it till today."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "tulit itaque Abraham oves et boves et dedit Abimelech percusseruntque ambo foedus"
      en: "And Abraham took sheep and oxen and gave them to Abimelech: and both of them made a league."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et statuit Abraham septem agnas gregis seorsum"
      en: "And Abraham set apart seven ewe lambs of the flock."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "cui dixit Abimelech quid sibi volunt septem agnae istae quas stare fecisti seorsum"
      en: "And Abimelech said to him: What mean these seven ewe lambs which thou hast set apart?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "at ille septem inquit agnas accipies de manu mea ut sint in testimonium mihi quoniam ego fodi puteum istum"
      en: "But he said: Thou shalt take seven ewe lambs at my hand: that they may be a testimony for me, that I dug this well."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "idcirco vocatus est locus ille Bersabee quia ibi uterque iuraverunt"
      en: "Therefore that place was called Bersabee: because both of them did swear."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et inierunt foedus pro puteo Iuramenti"
      en: "And they made a league for the well of oath."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "surrexit autem Abimelech et Fichol princeps militiae eius reversique sunt in terram Palestinorum Abraham vero plantavit nemus in Bersabee et invocavit ibi nomen Domini Dei aeterni"
      en: "And Abimelech, and Phicol the general of his army arose and returned to the land of the Palestines. But Abraham planted a grove in Bersabee, and there called upon the name of the Lord God eternal."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et fuit colonus terrae Philisthinorum diebus multis"
      en: "And he was a sojourner in the land of the Palestines many days."
    status: { la: verified, en: verified }
