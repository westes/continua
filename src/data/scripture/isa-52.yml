# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 52
verses:
  - n: 1
    text:
      la: "consurge consurge induere fortitudine tua Sion induere vestimentis gloriae tuae Hierusalem civitas sancti quia non adiciet ultra ut pertranseat per te incircumcisus et inmundus"
      en: "Arise, arise, put on thy strength, O Sion, put on the garments of thy glory, O Jerusalem, the city of the Holy One: for henceforth the uncircumcised, and unclean shall no more pass through thee."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "excutere de pulvere consurge sede Hierusalem solve vincula colli tui captiva filia Sion"
      en: "Shake thyself from the dust, arise, sit up, O Jerusalem: loose the bonds from off thy neck, O captive daughter of Sion."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quia haec dicit Dominus gratis venundati estis et sine argento redimemini"
      en: "For thus saith the Lord: You were sold gratis, and you shall be redeemed without money."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quia haec dicit Dominus Deus in Aegyptum descendit populus meus in principio ut colonus esset ibi et Assur absque ulla causa calumniatus est eum"
      en: "For thus saith the Lord God: My people went down into Egypt at the beginning to sojourn there: and the Assyrian hath oppressed them without any cause at all."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et nunc quid mihi est hic dicit Dominus quoniam ablatus est populus meus gratis dominatores eius inique agunt dicit Dominus et iugiter tota die nomen meum blasphematur"
      en: "And now what have I here, saith the Lord: for my people is taken away gratis. They that rule over them treat them unjustly, saith the Lord, and my name is continually blasphemed all the day long."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "propter hoc sciet populus meus nomen meum in die illa quia ego ipse qui loquebar ecce adsum"
      en: "Therefore my people shall know my name in that day: for I myself that spoke, behold I am here."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quam pulchri super montes pedes adnuntiantis et praedicantis pacem adnuntiantis bonum praedicantis salutem dicentis Sion regnavit Deus tuus"
      en: "How beautiful upon the mountains are the feet of him that bringeth good tidings, and that preacheth peace: of him that sheweth forth good, that preacheth salvation, that saith to Sion: Thy God shall reign!"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "vox speculatorum tuorum levaverunt vocem simul laudabunt quia oculum ad oculum videbunt cum converterit Dominus Sion"
      en: "The voice of thy watchmen: they have lifted up their voice, they shah praise together: for they shall see eye to eye when the Lord shall convert Sion"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "gaudete et laudate simul deserta Hierusalem quia consolatus est Dominus populum suum redemit Hierusalem"
      en: "Rejoice, and give praise together, O ye deserts of Jerusalem: for the Lord hath comforted his people: he hath redeemed Jerusalem."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "paravit Dominus brachium sanctum suum in oculis omnium gentium et videbunt omnes fines terrae salutare Dei nostri"
      en: "The Lord hath prepared his holy arm in the sight of all the Gentiles: and all the ends of the earth shall see the salvation of our God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "recedite recedite exite inde pollutum nolite tangere exite de medio eius mundamini qui fertis vasa Domini"
      en: "Depart, depart, go ye out from thence, touch no unclean thing: go out of the midst of her, be ye clean, you that carry the vessels of the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quoniam non in tumultu exibitis nec in fuga properabitis praecedet enim vos Dominus et congregabit vos Deus Israhel"
      en: "For you shall not go out in a tumult, neither shall you make haste by flight: For the Lord will go before you, and the God of Israel will gather you together."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ecce intelleget servus meus exaltabitur et elevabitur et sublimis erit valde"
      en: "Behold my servant shall understand, he shall be exalted, and extolled, and shall be exceeding high."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sicut obstipuerunt super te multi sic inglorius erit inter viros aspectus eius et forma eius inter filios hominum"
      en: "As many have been astonished at thee, so shall his visage be inglorious among men, and his form among the sons of men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "iste asperget gentes multas super ipsum continebunt reges os suum quia quibus non est narratum de eo viderunt et qui non audierunt contemplati sunt"
      en: "He shall sprinkle many nations, kings shall shut their mouth at him: for they to whom it was not told of him, have seen: and they that heard not, have beheld."
    status: { la: verified, en: verified }
