# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 48
verses:
  - n: 1
    text:
      la: "Ad Moab haec dicit Dominus exercituum, Deus Israel: Vae super Nabo, quoniam vastata est, et confusa! capta est Cariathaim, confusa est fortis, et tremuit."
      en: "Against Moab thus saith the Lord of hosts the God of Israel: Woe to Nabo, for it is laid waste, and confounded: Cariathaim is taken: the strong city is confounded and hath trembled."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Non est ultra exsultatio in Moab contra Hesebon: cogitaverunt malum: Venite, et disperdamus eam de gente. Ergo silens conticesces, sequeturque te gladius."
      en: "There is no more rejoicing in Moab over Hesebon: they have devised evil. Come, and let us cut it off from being a nation. Therefore shalt thou in silence hold thy peace, and the sword shall follow thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Vox clamoris de Oronaim, vastitas et contritio magna."
      en: "A voice of crying from Oronaim: waste, and great destruction."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Contrita est Moab: annuntiate clamorem parvulis ejus."
      en: "Moab is destroyed: proclaim a cry for her little ones."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Per ascensum enim Luith plorans ascendet in fletu, quoniam in descensu Oronaim hostes ululatum contritionis audierunt."
      en: "For by the ascent of Luith shall the mourner go up with weeping: for in the descent of Oronaim the enemies have heard a howling of destruction."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Fugite, salvate animas vestras, et eritis quasi myricae in deserto:"
      en: "Flee, save your lives: and be as heath in the wilderness."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "pro eo enim quod habuisti fiduciam in munitionibus tuis et in thesauris tuis, tu quoque capieris: et ibit Chamos in transmigrationem, sacerdotes ejus et principes ejus simul."
      en: "For because thou hast trusted in thy bulwarks, and in thy treasures, thou also shalt be taken: and Chamos shall go into captivity, his priests, and his princes together."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et veniet praedo ad omnem urbem, et urbs nulla salvabitur: et peribunt valles, et dissipabuntur campestria, quoniam dixit Dominus:"
      en: "And the spoiler shall come upon every city, and no city shall escape: and the valleys shall perish, and the plains shall be destroyed, for the Lord hath spoken:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Date florem Moab, quia florens egredietur: et civitates ejus desertae erunt, et inhabitabiles."
      en: "Give a flower to Moab, for in its flower it shall go out: and the cities thereof shall be desolate, and uninhabited."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Maledictus qui facit opus Domini fraudulenter, et maledictus qui prohibet gladium suum a sanguine."
      en: "Cursed be he that doth the work of the Lord deceitfully: and cursed be he that withholdeth his sword from blood."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Fertilis fuit Moab ab adolescentia sua, et requievit in faecibus suis: nec transfusus est de vase in vas, et in transmigrationem non abiit: idcirco permansit gustus ejus in eo, et odor ejus non est immutatus."
      en: "Moab hath been fruitful from his youth, and hath rested upon his lees: and hath not been poured out from vessel to vessel, nor hath gone into captivity: therefore his taste hath remained in him, and his scent is not changed."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Propterea ecce dies veniunt, dicit Dominus, et mittam ei ordinatores et stratores laguncularum: et sternent eum, et vasa ejus exhaurient, et lagunculas eorum collident."
      en: "Therefore behold the days come, saith the Lord, and I will send him men that shall order and overturn his bottles, and they shall cast him down, and shall empty his vessels, and break their bottles one against another."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et confundetur Moab a Chamos sicut confusa est domus Israel a Bethel, in qua habebat fiduciam."
      en: "And Moab shall be ashamed of Chamos, as the house of Israel was ashamed of Bethel, in which they trusted."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quomodo dicitis: Fortes sumus, et viri robusti ad praeliandum?"
      en: "How do you say: We are valiant, and stout men in battle?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Vastata est Moab, et civitates illius succiderunt, et electi juvenes ejus descenderunt in occisionem, ait rex, Dominus exercituum nomen ejus."
      en: "Moab is laid waste, and they have cast down her cities: and her choice young men are gone down to the slaughter: saith the king, whose name is the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Prope est interitus Moab ut veniat, et malum ejus velociter accurret nimis."
      en: "The destruction of Moab is near to come: the calamity thereof shall come on exceeding swiftly."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Consolamini eum, omnes qui estis in circuitu ejus: et universi qui scitis nomen ejus, dicite: Quomodo confracta est virga fortis, baculus gloriosus?"
      en: "Comfort him, all you that are round about him, and all you that know his name, say: How is the strong staff broken, the beautiful rod?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Descende de gloria, et sede in siti, habitatio filiae Dibon, quoniam vastator Moab ascendit ad te, dissipavit munitiones tuas."
      en: "Come down from thy glory, and sit in thirst, O dwelling of the daughter of Dibon: because the spoiler of Moab is come up to thee, he hath destroyed thy bulwarks."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "In via sta, et prospice, habitatio Aroer: interroga fugientem, et ei qui evasit dic: Quid accidit?"
      en: "Stand in the way, and look out, O habitation of Aroer: inquire of him that fleeth: and say to him that hath escaped: What Is done?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Confusus est Moab, quoniam victus est. Ululate, et clamate: annuntiate in Arnon, quoniam vastata est Moab,"
      en: "Moab is confounded, because he is overthrown: howl ye, and cry, tell ye it in Arnon, that Moab is wasted."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et judicium venit ad terram campestrem, super Helon, et super Jasa, et super Mephaath,"
      en: "And judgment is come upon the plain country: upon Helon, and upon Jasa, and upon Mephaath."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et super Dibon, et super Nabo, et super domum Deblathaim,"
      en: "And upon Dibon, and upon Nabo, and upon the house of Deblathaim,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et super Cariathaim, et super Bethgamul, et super Bethmaon,"
      en: "And upon Cariathaim, and upon Bethgamul, and upon Bethmaon,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et super Carioth, et super Bosra, et super omnes civitates terrae Moab, quae longe et quae prope sunt."
      en: "And upon Carioth, and upon Bosra: and upon all the cities of the land of Moab, far or near."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Abscissum est cornu Moab, et brachium ejus contritum est, ait Dominus."
      en: "The horn of Moab is cut off, and his arm is broken, saith the Lord."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Inebriate eum, quoniam contra Dominum erectus est: et allidet manum Moab in vomitu suo, et erit in derisum etiam ipse."
      en: "Make him drunk, because he lifted up himself against the Lord: and Moab shall dash his hand in his own vomit, and he also shall be in derision."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Fuit enim in derisum tibi Israel, quasi inter fures reperisses eum: propter verba ergo tua quae adversum illum locutus es, captivus duceris."
      en: "For Israel hath been a derision unto thee: as though thou hadst found him amongst thieves: for thy words therefore, which thou hast spoken against him, thou shalt be led away captive."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Relinquite civitates, et habitate in petra, habitatores Moab: et estote quasi columba nidificans in summo ore foraminis."
      en: "Leave the cities, and dwell in the rock, you that dwell in Moab: and be ye like the dove that maketh her nest in the mouth of the hole in the highest place."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Audivimus superbiam Moab, superbus est valde: sublimitatem ejus, et arrogantiam, et superbiam, et altitudinem cordis ejus."
      en: "We have heard the pride of Moab, he is exceeding proud: his haughtiness, and his arrogancy, and his pride, and the loftiness of his heart."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Ego scio, ait Dominus, jactantiam ejus, et quod non sit juxta eam virtus ejus, nec juxta quod poterat conata sit facere."
      en: "I know, saith the Lord, his boasting, and that the strength thereof is not according to it, neither hath it endeavoured to do according as it was able."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Ideo super Moab ejulabo, et ad Moab universam clamabo, ad viros muri fictilis lamentantes:"
      en: "Therefore will I lament for Moab, and I will cry out to all Moab, for the men of the brick wall that mourn."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "de planctu Jazer plorabo tibi, vinea Sabama. Propagines tuae transierunt mare, usque ad mare Jazer pervenerunt: super messem tuam et vindemiam tuam praedo irruit."
      en: "O vineyard of Sabama, I will weep for thee, with the mourning of Jazer: thy branches are gone over the sea, they are come even to the sea of Jazer: the robber hath rushed in upon thy harvest and thy vintage."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Ablata est laetitia et exsultatio de Carmelo et de terra Moab: et vinum de torcularibus sustuli, nequaquam calcator uvae solitum celeuma cantabit."
      en: "Joy and gladness is taken away from Carmel, and from the land of Moab, and I have taken away the wine out of the presses: the treader of the grapes shall not sing the accustomed cheerful tune."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "De clamore Hesebon usque Eleale et Jasa, dederunt vocem suam, a Segor usque ad Oronaim, vitula conternante: aquae quoque Nemrim pessimae erunt."
      en: "From the cry of Hesebon even to Eleale, and to Jasa, they have uttered their voice: from Segor to Oronaim, as a heifer of three years old: the waters also of Nemrim shall be very bad."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et auferam de Moab, ait Dominus, offerentem in excelsis, et sacrificantem diis ejus."
      en: "And I will take away from Moab, saith the Lord, him that offereth in the high places, and that sacrificeth to his gods."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Propterea cor meum ad Moab quasi tibiae resonabit, et cor meum ad viros muri fictilis dabit sonitum tibiarum: quia plus fecit quam potuit, idcirco perierunt."
      en: "Therefore my heart shall sound for Moab like pipes: and my heart a sound like pipes for the men of the brick wall: because he hath done more than he could, therefore they have perished."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Omne enim caput calvitium, et omnis barba rasa erit: in cunctis manibus colligatio, et super omne dorsum cilicium:"
      en: "For every head shall be bald, and every beard shall be shaven: all hands shall be tied together, and upon every back there shall be haircloth."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "super omnia tecta Moab, et in plateis ejus, omnis planctus: quoniam contrivi Moab sicut vas inutile, ait Dominus."
      en: "Upon all the housetops of Moab, and in the streets thereof general mourning: because I have broken Moab as an useless vessel, saith the Lord."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Quomodo victa est, et ululaverunt? quomodo dejecit cervicem Moab, et confusus est? Eritque Moab in derisum, et in exemplum omnibus in circuitu suo."
      en: "How is it overthrown, and they have howled! How hath Moab bowed down the neck, and is confounded! And Moab shall be a derision, and an example to all round about him."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Haec dicit Dominus: Ecce quasi aquila volabit, et extendet alas suas ad Moab."
      en: "Thus saith the Lord: Behold he shall fly as an eagle, and shall stretch forth his wings to Moab."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Capta est Carioth, et munitiones comprehensae sunt: et erit cor fortium Moab in die illa sicut cor mulieris parturientis,"
      en: "Carioth is taken, and the strong holds are won: and the heart of the valiant men of Moab in that day shall be as the heart of a woman in labour."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et cessabit Moab esse populus, quoniam contra Dominum gloriatus est."
      en: "And Moab shall cease to be a people: because he hath gloried against the Lord."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Pavor, et fovea, et laqueus super te, o habitator Moab, dicit Dominus."
      en: "Fear, and the pit, and the snare come upon thee, O inhabitant of Moab, saith the Lord."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Qui fugerit a facie pavoris cadet in foveam, et qui conscenderit de fovea capietur laqueo: adducam enim super Moab annum visitationis eorum, ait Dominus."
      en: "He that shall flee from the fear, shall fall into the pit: and he that shall get up out of the pit, shall be taken in the snare: for I will bring upon Moab the year of their visitation, saith the Lord."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "In umbra Hesebon steterunt de laqueo fugientes, quia ignis egressus est de Hesebon, et flamma de medio Seon: et devorabit partem Moab, et verticem filiorum tumultus."
      en: "They that fled from the snare stood in the shadow of Hesebon: but there came a fire out of Hesebon, and a flame out of the midst of Seon, and it shall devour part of Moab. and the crown of the head of the children of tumult."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Vae tibi, Moab: periisti, popule Chamos, quia comprehensi sunt filii tui et filiae tuae in captivitatem."
      en: "Woe to thee, Moab, thou hast perished, O people of Chamos: for thy sons, and thy daughters are taken captives."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Et convertam captivitatem Moab in novissimis diebus, ait Dominus. Hucusque judicia Moab."
      en: "And I will bring back the captivity of Moab in the last days, saith the Lord. Hitherto the judgments of Moab."
    status: { la: verified, en: verified }
