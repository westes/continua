# Wisdom 3:1-9, transcribed from live Divinum Officium queries (Monastic
# Tridentinum 1617, command=prayMatutinum): verses 7-9 from 2026-08-18 --
# St. Andrew's own day, 2026-11-30, Matins Nocturn III's second canticle;
# verses 1-6 added 2029-01-20 -- Ss. Fabian and Sebastian, Common of
# Several Martyrs, Matins Nocturn III's first canticle. Only these
# verses are authored; the rest of the chapter is unauthored.
book: sap
chapter: 3
verses:
  - n: 1
    text:
      la: "Justórum autem ánimæ in manu Dei sunt, * et non tangent illos torméntum mortis."
      en: "But the souls of the just are in the hand of God, and the torment of death shall not touch them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Visi sunt óculis insipiéntium mori, * et æstimáta est afflíctio éxitus illórum,"
      en: "In the sight of the unwise they seemed to die: and their departure was taken for misery:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et quod a nobis est iter extermínium; * illi autem sunt in pace:"
      en: "And their going away from us, for utter destruction: but they are in peace."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Etsi coram homínibus torménta passi sunt, * spes illórum immortalitáte plena est."
      en: "And though in the sight of men they suffered torments, their hope is full of immortality."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "In paucis vexáti, in multis bene disponéntur, * quóniam Deus tentávit eos, et invénit illos dignos se."
      en: "Afflicted in few things, in many they shall be well rewarded: because God hath tried them, and found them worthy of himself."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Tamquam aurum in fornáce probávit illos, et quasi holocáusti hóstiam accépit illos, * et in témpore erit respéctus illórum."
      en: "As gold in the furnace he hath proved them, and as a victim of a holocaust he hath received them, and in time there shall be respect had to them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Fulgébunt justi, * et tamquam scintíllæ in arundinéto discúrrent."
      en: "The just shall shine, and shall run to and fro like sparks among the reeds."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Judicábunt natiónes, et dominabúntur pópulis, * et regnábit Dóminus illórum in perpétuum."
      en: "They shall judge nations, and rule over people, and their Lord shall reign forever."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Qui confídunt in illo, intélligent veritátem, * et fidéles in dilectióne acquiéscent illi:"
      en: "They that trust in him, shall understand the truth: and they that are faithful in love shall rest in him:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quóniam donum * et pax est eléctis ejus."
      en: "For grace and peace is to his elect."
    status: { la: verified, en: verified }
