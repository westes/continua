# Wisdom 3:7-9, transcribed from a live Divinum Officium query (Monastic
# Tridentinum 1617, command=prayMatutinum, 2026-08-18 -- St. Andrew's own
# day, 2026-11-30, Matins Nocturn III's second canticle). Only these
# verses are authored; the rest of the chapter is unauthored.
book: sap
chapter: 3
verses:
  - n: 7
    text:
      la: "Fulgébunt justi, * et tamquam scintíllæ in arundinéto discúrrent."
      en: "The just shall shine, and shall run to and fro like sparks among the reeds."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Judicábunt natiónes, et dominabúntur pópulis, * et regnábit Dóminus illórum in perpétuum."
      en: "They shall judge nations, and rule over people, and their Lord shall reign forever."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Qui confídunt in illo, intélligent veritátem, * et fidéles in dilectióne acquiéscent illi:"
      en: "They that trust in him, shall understand the truth: and they that are faithful in love shall rest in him:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quóniam donum * et pax est eléctis ejus."
      en: "For grace and peace is to his elect."
    status: { la: verified, en: verified }
