# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: marc
chapter: 9
verses:
  - n: 1
    text:
      la: "et post dies sex adsumit Iesus Petrum et Iacobum et Iohannem et ducit illos in montem excelsum seorsum solos et transfiguratus est coram ipsis"
      en: "And after six days Jesus taketh with him Peter and James and John, and leadeth them up into an high mountain apart by themselves, and was transfigured before them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et vestimenta eius facta sunt splendentia candida nimis velut nix qualia fullo super terram non potest candida facere"
      en: "And his garments became shining and exceeding white as snow, so as no fuller upon earth can make white."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et apparuit illis Helias cum Mose et erant loquentes cum Iesu"
      en: "And there appeared to them Elias with Moses; and they were talking with Jesus."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et respondens Petrus ait Iesu rabbi bonum est hic nos esse et faciamus tria tabernacula tibi unum et Mosi unum et Heliae unum"
      en: "And Peter answering, said to Jesus: Rabbi, it is good for us to be here: and let us make three tabernacles, one for thee, and one for Moses, and one for Elias."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "non enim sciebat quid diceret erant enim timore exterriti"
      en: "For he knew not what he said: for they were struck with fear."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et facta est nubes obumbrans eos et venit vox de nube dicens hic est Filius meus carissimus audite illum"
      en: "And there was a cloud overshadowing them: and a voice came out of the cloud, saying: This is my most beloved son; hear ye him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et statim circumspicientes neminem amplius viderunt nisi Iesum tantum secum"
      en: "And immediately looking about, they saw no man any more, but Jesus only with them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et descendentibus illis de monte praecepit illis ne cui quae vidissent narrarent nisi cum Filius hominis a mortuis resurrexerit"
      en: "And as they came down from the mountain, he charged them not to tell any man what things they had seen, till the Son of man shall be risen again from the dead."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et verbum continuerunt apud se conquirentes quid esset cum a mortuis resurrexerit"
      en: "And they kept the word to themselves; questioning together what that should mean, when he shall be risen from the dead."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et interrogabant eum dicentes quid ergo dicunt Pharisaei et scribae quia Heliam oporteat venire primum"
      en: "And they asked him, saying: Why then do the Pharisees and scribes say that Elias must come first?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "qui respondens ait illis Helias cum venerit primo restituet omnia et quomodo scriptum est in Filium hominis ut multa patiatur et contemnatur"
      en: "Who answering, said to them: Elias, when he shall come first, shall restore all things; and as it is written of the Son of man, that he must suffer many things and be despised."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "sed dico vobis quia et Helias venit et fecerunt illi quaecumque voluerunt sicut scriptum est de eo"
      en: "But I say to you, that Elias also is come, (and they have done to him whatsoever they would,) as it is written of him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et veniens ad discipulos suos vidit turbam magnam circa eos et scribas conquirentes cum illis"
      en: "And coming to his disciples, he saw a great multitude about them, and the scribes disputing with them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et confestim omnis populus videns eum stupefactus est et adcurrentes salutabant eum"
      en: "And presently all the people seeing Jesus, were astonished and struck with fear; and running to him, they saluted him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et interrogavit eos quid inter vos conquiritis"
      en: "And he asked them: What do you question about among you?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et respondens unus de turba dixit magister adtuli filium meum ad te habentem spiritum mutum"
      en: "And one of the multitude, answering, said: Master, I have brought my son to thee, having a dumb spirit."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qui ubicumque eum adprehenderit adlidit eum et spumat et stridet dentibus et arescit et dixi discipulis tuis ut eicerent illum et non potuerunt"
      en: "Who, wheresoever he taketh him, dasheth him, and he foameth, and gnasheth with the teeth, and pineth away; and I spoke to thy disciples to cast him out, and they could not."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui respondens eis dicit o generatio incredula quamdiu apud vos ero quamdiu vos patiar adferte illum ad me"
      en: "Who answering them, said: O incredulous generation, how long shall I be with you? how long shall I suffer you? bring him unto me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et adtulerunt eum et cum vidisset illum statim spiritus conturbavit eum et elisus in terram volutabatur spumans"
      en: "And they brought him. And when he had seen him, immediately the spirit troubled him; and being thrown down upon the ground, he rolled about foaming."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et interrogavit patrem eius quantum temporis est ex quo hoc ei accidit at ille ait ab infantia"
      en: "And he asked his father: How long time is it since this hath happened unto him? But he said: From his infancy:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et frequenter eum et in ignem et in aquas misit ut eum perderet sed si quid potes adiuva nos misertus nostri"
      en: "And oftentimes hath he cast him into the fire and into waters to destroy him. But if thou canst do any thing, help us, having compassion on us."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Iesus autem ait illi si potes credere omnia possibilia credenti"
      en: "And Jesus saith to him: If thou canst believe, all things are possible to him that believeth."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et continuo exclamans pater pueri cum lacrimis aiebat credo adiuva incredulitatem meam"
      en: "And immediately the father of the boy crying out, with tears said: I do believe, Lord: help my unbelief."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et cum videret Iesus concurrentem turbam comminatus est spiritui inmundo dicens illi surde et mute spiritus ego tibi praecipio exi ab eo et amplius ne introeas in eum"
      en: "And when Jesus saw the multitude running together, he threatened the unclean spirit, saying to him: Deaf and dumb spirit, I command thee, go out of him; and enter not any more into him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et clamans et multum discerpens eum exiit ab eo et factus est sicut mortuus ita ut multi dicerent quia mortuus est"
      en: "And crying out, and greatly tearing him, he went out of him, and he became as dead, so that many said: He is dead."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Iesus autem tenens manum eius elevavit illum et surrexit"
      en: "But Jesus taking him by the hand, lifted him up; and he arose."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et cum introisset in domum discipuli eius secreto interrogabant eum quare nos non potuimus eicere eum"
      en: "And when he was come into the house, his disciples secretly asked him: Why could not we cast him out?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et dixit illis hoc genus in nullo potest exire nisi in oratione et ieiunio"
      en: "And he said to them: This kind can go out by nothing, but by prayer and fasting."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et inde profecti praetergrediebantur Galilaeam nec volebat quemquam scire"
      en: "And departing from thence, they passed through Galilee, and he would not that any man should know it."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "docebat autem discipulos suos et dicebat illis quoniam Filius hominis tradetur in manus hominum et occident eum et occisus tertia die resurget"
      en: "And he taught his disciple, and said to them: The Son of man shall be betrayed into the hands of men, and they shall kill him; and after that he is killed, he shall rise again the third day."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "at illi ignorabant verbum et timebant eum interrogare"
      en: "But they understood not the word, and they were afraid to ask him."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et venerunt Capharnaum qui cum domi esset interrogabat eos quid in via tractabatis"
      en: "And they came to Capharnaum. And when they were in the house, he asked them: What did you treat of in the way?"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "at illi tacebant siquidem inter se in via disputaverant quis esset illorum maior"
      en: "But they held their peace, for in the way they had disputed among themselves, which of them should be the greatest."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et residens vocavit duodecim et ait illis si quis vult primus esse erit omnium novissimus et omnium minister"
      en: "And sitting down, he called the twelve, and saith to them: If any man desire to be first, he shall be the last of all, and the minister of all."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et accipiens puerum statuit eum in medio eorum quem cum conplexus esset ait illis"
      en: "And taking a child, he set him in the midst of them. Whom when he had embraced, he saith to them:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "quisquis unum ex huiusmodi pueris receperit in nomine meo me recipit et quicumque me susceperit non me suscipit sed eum qui me misit"
      en: "Whosoever shall receive one such child as this in my name, receiveth me. And whosoever shall receive me, receiveth not me, but him that sent me."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "respondit illi Iohannes dicens magister vidimus quendam in nomine tuo eicientem daemonia qui non sequitur nos et prohibuimus eum"
      en: "John answered him, saying: Master, we saw one casting out devils in thy name, who followeth not us, and we forbade him."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Iesus autem ait nolite prohibere eum nemo est enim qui faciat virtutem in nomine meo et possit cito male loqui de me"
      en: "But Jesus said: Do not forbid him. For there is no man that doth a miracle in my name, and can soon speak ill of me."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "qui enim non est adversum vos pro vobis est"
      en: "For he that is not against you, is for you."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "quisquis enim potum dederit vobis calicem aquae in nomine meo quia Christi estis amen dico vobis non perdet mercedem suam"
      en: "For whosoever shall give you to drink a cup of water in my name, because you belong to Christ: amen I say to you, he shall not lose his reward."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et quisquis scandalizaverit unum ex his pusillis credentibus in me bonum est ei magis si circumdaretur mola asinaria collo eius et in mare mitteretur"
      en: "And whosoever shall scandalize one of these little ones that believe in me; it were better for him that a millstone were hanged around his neck, and he were cast into the sea."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et si scandalizaverit te manus tua abscide illam bonum est tibi debilem introire in vitam quam duas manus habentem ire in gehennam in ignem inextinguibilem"
      en: "And if thy hand scandalize thee, cut it off: it is better for thee to enter into life, maimed, than having two hands to go into hell, into unquenchable fire:"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "ubi vermis eorum non moritur et ignis non extinguitur"
      en: "Where there worm dieth not, and the fire is not extinguished."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et si pes tuus te scandalizat amputa illum bonum est tibi claudum introire in vitam aeternam quam duos pedes habentem mitti in gehennam ignis inextinguibilis"
      en: "And if thy foot scandalize thee, cut it off. It is better for thee to enter lame into life everlasting, than having two feet, to be cast into the hell of unquenchable fire:"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "ubi vermis eorum non moritur et ignis non extinguitur"
      en: "Where their worm dieth not, and the fire is not extinguished."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "quod si oculus tuus scandalizat te eice eum bonum est tibi luscum introire in regnum Dei quam duos oculos habentem mitti in gehennam ignis"
      en: "And if thy eye scandalize thee, pluck it out. It is better for thee with one eye to enter into the kingdom of God, than having two eyes to be cast into the hell of fire:"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "ubi vermis eorum non moritur et ignis non extinguitur"
      en: "Where the worm dieth not, and the fire is not extinguished."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "omnis enim igne sallietur et omnis victima sallietur"
      en: "For every one shall be salted with fire: and every victim shall be salted with salt."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "bonum est sal quod si sal insulsum fuerit in quo illud condietis habete in vobis sal et pacem habete inter vos"
      en: "Salt is good. But if the salt became unsavory; wherewith will you season it? Have salt in you, and have peace among you."
    status: { la: verified, en: verified }
