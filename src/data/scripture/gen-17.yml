# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 17
verses:
  - n: 1
    text:
      la: "Postquam vero nonaginta et novem annorum esse coeperat, apparuit ei Dominus, dixitque ad eum: Ego Deus omnipotens: ambula coram me, et esto perfectus."
      en: "And after he began to be ninety and nine years old, the Lord appeared to him: and said unto him: I am the Almighty God: walk before me, and be perfect."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ponamque foedus meum inter me et te, et multiplicabo te vehementer nimis."
      en: "And I will make my covenant between me and thee: and I will multiply thee exceedingly."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cecidit Abram pronus in faciem."
      en: "Abram fell flat on his face."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dixitque ei Deus: Ego sum, et pactum meum tecum, erisque pater multarum gentium."
      en: "And God said to him: I AM, and my covenant is with thee, and thou shalt be a father of many nations."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Nec ultra vocabitur nomen tuum Abram, sed appellaberis Abraham: quia patrem multarum gentium constitui te."
      en: "Neither shall thy name be called any more Abram: but thou shalt be called Abraham: because I have made thee a father of many nations."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Faciamque te crescere vehementissime, et ponam te in gentibus, regesque ex te egredientur."
      en: "And I will make thee increase, exceedingly, and I will make nations of thee, and kings shall come out of thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et statuam pactum meum inter me et te, et inter semen tuum post te in generationibus suis, foedere sempiterno: ut sim Deus tuus, et seminis tui post te."
      en: "And I will establish my covenant between me and thee, and between thy seed after thee in their generations, by a perpetual covenant: to be a God to thee, and to thy seed after thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Daboque tibi et semini tuo terram peregrinationis tuae, omnem terram Chanaan in possessionem aeternam, eroque Deus eorum."
      en: "And I will give to thee, and to thy seed, the land of thy sojournment, all the land of Chanaan for a perpetual possession, and I will be their God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dixit iterum Deus ad Abraham: Et tu ergo custodies pactum meum, et semen tuum post te in generationibus suis."
      en: "Again God said to Abraham: And thou therefore shalt keep my covenant, and thy seed after thee in their generations."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Hoc est pactum meum quod observabitis inter me et vos, et semen tuum post te: circumcidetur ex vobis omne masculinum:"
      en: "This is my covenant which you shall observe, between me and you, and thy seed after thee: All the male kind of you shall be circumcised:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et circumcidetis carnem praeputii vestri, ut sit in signum foederis inter me et vos."
      en: "And you shall circumcise the flesh of your foreskin, that it may be for a sign of the covenant between me and you."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Infans octo dierum circumcidetur in vobis, omne masculinum in generationibus vestris: tam vernaculus, quam emptitius circumcidetur, et quicumque non fuerit de stirpe vestra:"
      en: "An infant of eight days old shall be circumcised among you, every man child in your generations: he that is born in the house, as well as the bought servant shall be circumcised, and whosoever is not of your stock:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "eritque pactum meum in carne vestra in foedus aeternum."
      en: "And my covenant shall be in your flesh for a perpetual covenant."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Masculus, cujus praeputii caro circumcisa non fuerit, delebitur anima illa de populo suo: quia pactum meum irritum fecit."
      en: "The male, whose flesh of his foreskin shall not be circumcised, that soul shall be destroyed out of his people: because he hath broken my covenant."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dixit quoque Deus ad Abraham: Sarai uxorem tuam non vocabis Sarai, sed Saram."
      en: "God said also to Abraham: Sarai thy wife thou shalt not call Sarai, but Sara."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et benedicam ei, et ex illa dabo tibi filium cui benedicturus sum: eritque in nationes, et reges populorum orientur ex eo."
      en: "And I will bless her, and of her I will give thee a son, whom I will bless, and he shall become nations, and kings of people shall spring from him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cecidit Abraham in faciem suam, et risit, dicens in corde suo: Putasne centenario nascetur filius? et Sara nonagenaria pariet?"
      en: "Abraham fell upon his face, and laughed, saying in his heart: Shall a son, thinkest thou, be born to him that is a hundred years old? and shall Sara that is ninety years old bring forth?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Dixitque ad Deum: Utinam Ismael vivat coram te."
      en: "And he said to God: O that Ismael may live before thee."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et ait Deus ad Abraham: Sara uxor tua pariet tibi filium, vocabisque nomen ejus Isaac, et constituam pactum meum illi in foedus sempiternum, et semini ejus post eum."
      en: "And God said to Abraham: Sara thy wife shall bear thee a son, and thou shalt call his name Isaac, and I will establish my covenant with him for a perpetual covenant, and with his seed after him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Super Ismael quoque exaudivi te: ecce, benedicam ei, et augebo, et multiplicabo eum valde: duodecim duces generabit, et faciam illum in gentem magnam."
      en: "And as for Ismael I have also heard thee. Behold, I will bless him, and increase, and multiply him exceedingly: he shall beget twelve chiefs, and I will make him a great nation."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Pactum vero meum statuam ad Isaac, quem pariet tibi Sara tempore isto in anno altero."
      en: "But my covenant I will establish with Isaac, whom Sara shall bring forth to thee at this time in the next year."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Cumque finitus esset sermo loquentis cum eo, ascendit Deus ab Abraham."
      en: "And when he had left off speaking with him, God went up from Abraham."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Tulit autem Abraham Ismael filium suum, et omnes vernaculos domus suae, universosque quos emerat, cunctos mares ex omnibus viris domus suae: et circumcidit carnem praeputii eorum statim in ipsa die, sicut praeceperat ei Deus."
      en: "And Abraham took Ismael his son, and all that were born in his house: and all whom he had bought, every male among the men of his house: and he circumcised the flesh of their foreskin forthwith the very same day, as God had commanded him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Abraham nonaginta et novem erat annorum quando circumcidit carnem praeputii sui."
      en: "Abraham was ninety and nine years old, when he circumcised the flesh of his foreskin."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et Ismael filius tredecim annos impleverat tempore circumcisionis suae."
      en: "And Ismael his son was full thirteen years old at the time of his circumcision."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Eadem die circumcisus est Abraham et Ismael filius ejus:"
      en: "The selfsame day was Abraham circumcised and Ismael his son."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et omnes viri domus illius, tam vernaculi, quam emptitii et alienigenae pariter circumcisi sunt."
      en: "And all the men of his house, as well they that were born in his house, as the bought servants and strangers were circumcised with him."
    status: { la: verified, en: verified }
