# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 25
verses:
  - n: 1
    text:
      la: "in tribus placitum est spiritui meo quae sunt probata coram Deo et hominibus"
      en: "With three things my spirit is pleased, which are approved before God and men:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "concordia fratrum et amor proximorum et vir et mulier sibi consentientes"
      en: "The concord of brethren, and the love of neighbours, and mall and wife that agree well together."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "tres species odivit anima mea et adgravor valde animae illorum"
      en: "Three sorts my soul hateth, and I am greatly grieved at their life:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "pauperem superbum et divitem mendacem et senem fatuum et insensatum"
      en: "A poor man that is proud: a rich man that is a liar: an old man that is a fool, and doting."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "in iuventute tua non congregasti et quomodo invenies eam in senectute tua"
      en: "The things that thou hast not gathered in thy youth, how shalt thou find them in thy old age?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quam speciosum canitiae iudicium et presbyteris cognoscere consilium"
      en: "O how comely is judgment for a grey head, and for ancients to know counsel!"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quam speciosa veteranis sapientia et gloriosis intellectus et consilium"
      en: "O how comely is wisdom for the aged, and understanding and counsel to men of honour!"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "corona senum multa peritia et gloria illorum timor Dei"
      en: "Much experience is the crown of old men, and the fear of God is their glory."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "novem insuspicabilia cordis magnificavi et decimum dicam in lingua hominibus"
      en: "Nine things that are not to be imagined by the heart have I magnified, and the tenth I will utter to men with my tongue."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "homo qui iucundatur in filiis vivens et videns subversionem inimicorum"
      en: "A man that hath joy of his children: and he that liveth and seeth the fall of his enemies."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "beatus qui inhabitat cum muliere sensata et qui in lingua sua non est lapsus et qui non servivit indignis se"
      en: "Blessed is he. that dwelleth with a wise woman, and that hath not slipped with his tongue, and that hath not served such as are unworthy of him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "beatus qui invenit amicum verum et qui enarrat iustitiam auri audienti"
      en: "Blessed is he that findeth a true friend, and that declareth justice to an ear that heareth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quam magnus qui invenit sapientiam et scientiam sed non est super timentem Deum"
      en: "How great is he that findeth wisdom and knowledge! but there is none above him that feareth the Lord."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "timor Dei super omnia superposuit"
      en: "The fear of God hath set itself above all things:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "beatus cui donatum est habere timorem Dei qui tenet illum cui adsimilabitur"
      en: "Blessed is the man, to whom it is given to have the fear of God: he that holdeth it, to whom shall he be likened?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "timor Dei initium dilectionis eius fidei autem initium adglutinandum est ei"
      en: "The fear of God is the beginning of his love: and the beginning of faith is to be fast joined unto it."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "omnis plaga tristitia cordis est et omnis malitia nequitia mulieris est"
      en: "The sadness of the heart is every plague: and the wickedness of a woman is all evil."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et omnem plagam et non plagam videbit cordis"
      en: "And a man will choose any plague, but the plague of the heart:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et omnem nequitiam et non nequitiam mulieris"
      en: "And ally wickedness, but the wickedness of a woman:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et omnem obductum et non obductum odientium"
      en: "And any affliction, but the affliction from them that hate him:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et omnem vindictam et non vindictam inimicorum"
      en: "And ally revenge, but the revenge of enemies."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "non est caput nequius super caput colubri"
      en: "There is no head worse than the head of a serpent:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et non est ira super iram inimici commorari leoni et draconi placebit quam habitare cum muliere nequa"
      en: "And there is no anger above the anger of a woman. It will be more agreeable to abide with a lion and a dragon, than to dwell with a wicked woman."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "nequitia mulieris inmutat faciem eius et obcaecabit vultum suum tamquam ursus et quasi saccum ostendit in medio proximorum eius"
      en: "The wickedness of a woman changeth her face: and she darkeneth her countenance as a bear: and sheweth it like sackcloth. In the midst of her neighbours,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et audiens suspirabit modicum"
      en: "Her husband groaned, and hearing he sighed a little."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "brevis malitia super malitiam mulieris sors peccatorum cadat super illam"
      en: "All malice is shore to the malice of a woman, let the lot of sinners fall upon her."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ascensus harenosus in pedibus veterani sic mulier linguata homini quieto"
      en: "As the climbing of a sandy way is to the feet of the aged, so is a wife full of tongue to a quiet man."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "ne respicias in mulieris speciem et non concupiscas mulierem in specie"
      en: "Look not upon a woman's beauty, and desire not a woman for beauty."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "mulieris ira et inreverentia et confusio magna"
      en: "A woman's anger, and impudence, and confusion is great."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "mulier si primatum habeat contraria est viro suo"
      en: "A woman, if she have superiority, is contrary to her husband."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "cor humile et facies tristis et plaga mortis mulier nequa"
      en: "A wicked woman abateth the courage, and maketh a heavy countenance, and a wounded heart."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "manus debiles et genua dissoluta mulier quae non beatificat virum suum"
      en: "Feeble hands, and disjointed knees, a woman that doth not make her husband happy."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "a muliere initium factum est peccati et per illam omnes morimur"
      en: "From the woman came the beginning of sin, and by her we all die."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "non des aquae tuae exitum nec modicum nec mulieri nequa veniam prodeundi"
      en: "Give no issue to thy water, no, not a little: nor to a wicked woman liberty to gad abroad."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "si non ambulaverit ad manum tuam et confundet te in conspectu inimicorum"
      en: "If she walk not at thy hand, she will confound thee in the sight of thy enemies."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "a carnibus tuis abscide illam ne semper te abutatur"
      en: "Cut her off from thy flesh, lest she always abuse thee."
    status: { la: verified, en: verified }
