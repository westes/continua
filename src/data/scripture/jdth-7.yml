# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdth
chapter: 7
verses:
  - n: 1
    text:
      la: "Holofernis autem altera die praecepit exercitibus suis ut ascenderent contra Bethuliam"
      en: "But Holofernes on the next day gave orders to his army, to go up against Bethulia."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "erant autem pedites bellatorum centum viginti milia et equites viginti duo milia praeter praeparationes virorum illorum quos occupaverat captivitas et adducti fuerant de provinciis et urbibus universae iuventutis"
      en: "Now there were in his troops a hundred and twenty thousand footmen, and two and twenty thousand horsemen, besides the preparations of those men who had been taken, and who had been brought away out of the provinces and cities of all the youth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "omnes pariter paraverunt se ad pugnam contra filios Israhel et venerunt per crepidinem montis usque ad apicem qui respicit super Dothain a loco qui dicitur Belma usque Chelmo qui est contra Hesdraelon"
      en: "All these prepared themselves together to fight against the children of Israel, and they came by the hillside to the top, which looketh toward Dothain, from the place which is called Behlma, unto Chelmon, which is over against Esdrelon."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "filii autem Israhel ut viderunt multitudinem illorum prostraverunt se super terram mittentes cinerem super capita sua unianimes orantes ut Deus Israhel misericordiam suam ostenderet super populum suum"
      en: "But the children of Israel, when they saw the multitude of them, prostrated themselves upon the ground, putting ashes upon their heads, praying with one accord, that the God of Israel would shew his mercy upon his people."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et adsumentes arma sua bellica sederunt per loca quae angusti itineris tramitem dirigunt inter montuosa et erant custodientes ea tota die et nocte"
      en: "And taking their arms of war, they posted themselves at the places, which by a narrow pathway lead directly between the mountains, and they guarded them all day and night."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "porro Holofernis dum circuit per gyrum repperit quod fons qui influebat aquaeductum illorum a parte australi extra civitatem dirigeret incidi praecepit aquaeductum eorum"
      en: "Now Holofernes, in going round about, found that the fountains which supplied them with water, ran through an aqueduct without the city on the south side: and he commanded their aqueduct to he cut off."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "erant tamen non longe a muris fontes ex quibus furtim videbantur haurire aquam ad refocilandum potius quam ad potandum"
      en: "Nevertheless there were springs not far from the walls, out of which they were seen secretly to draw water, to refresh themselves a little rather than to drink their fill."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sed filii Ammon et Moab accesserunt ad Holofernem dicentes filii Israhel non in lancea nec in sagitta confidunt sed montes defendunt illos et muniunt illos colles in praecipitio constituti"
      en: "But the children of Ammon and Moab came to Holofernes, saying: The children of Israel trust not in their spears, nor in their arrows, but the mountains are their defense, and the steep hires and precipices guard them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ut ergo sine congressione pugnae possis superare eos pone custodes fontium ut non hauriant ex eis et sine gladio interficies eos vel certe fatigati tradent civitatem suam quam putant civitatem montibus positam superari non posse"
      en: "Wherefore that thou mayst overcome them without joining battle, set guards at the springs that they may not draw water out of them, and thou shalt destroy them without sword, or at least being wearied out they will yield up their city, which they suppose, because it is situate in the mountains, to be impregnable."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et placuerunt verba haec coram Holoferne et coram omnibus satellitibus eius et constituit per gyrum centenarios per singulos fontes"
      en: "And these words pleased Holofernes, and his officers, and he placed all round about a hundred men at every spring."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cumque ista custodia per dies viginti fuisset expleta defecerunt cisternae et collectiones aquarum omnibus inhabitantibus in Bethuliam ita ut non esset intra civitatem unde satiarentur vel una die quoniam ad mensuram dabatur populis aqua cotidie"
      en: "And when they had kept this watch for full twenty days, the cisterns, and the reserve of waters failed among all the inhabitants of Bethulia, so that there was not within the city, enough to satisfy them, no not for one day, for water was daily given out to the people by measure."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tunc ad Oziam congregati omnes viri feminaeque iuvenes et parvuli simul omnes una voce"
      en: "Then all the men and women, young men, and children, gathering themselves together to Ozias, all together with one voice,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixerunt iudicet Deus inter nos et te quoniam fecisti in nos mala nolentes loqui pacifice cum Assyriis et propter hoc vendidit nos Deus in manibus eorum"
      en: "Said: God be judge between us and thee, for thou hast done evil against us, in that thou wouldst not speak peaceably with the Assyrians, and for this cause God hath sold us into their hands."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et ideo non est qui adiuvet cum prosternamur ante oculos eorum in siti et perditione magna"
      en: "And therefore there is no one to help us, while we are cast down before their eyes in thirst, and sad destruction."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et nunc congregate universos qui in civitate sunt ut sponte nos tradamus omnes populo Holofernis"
      en: "And now assemble ye all that are in the city, that we may of our own accord yield ourselves all up to the people of Holofernes."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "melius est enim ut captivi benedicamus Deum viventes quam moriamur et simus obprobrium omni carni cum videamus uxores nostras et infantes nostros mori ante oculos nostros"
      en: "For it is better, that being captives we should live and bless the Lord, than that we should die, and be a reproach to all flesh, after we have seen our wives and our infants die before our eyes."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "contestamur hodie caelum et terram et Deum patrum nostrorum qui ulciscitur nos secundum peccata nostra ut iam tradatis civitatem in manu militiae Holofernis et sit finis noster brevis in ore gladii qui longior efficitur in ariditate sitis"
      en: "We call to witness this day heaven and earth, and the God of our fathers, who taketh vengeance upon us according to our sins, conjuring you to deliver now the city into the hand of the army of Holofernes, that our end may be short by the edge of the sword, which is made longer by the drought of thirst."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et cum haec dixissent factus est fletus et ululatus magnus in ecclesia omnibus et per multas horas una voce clamaverunt ad Deum dicentes"
      en: "And when they had said these things, there was great weeping and lamentation of all in the assembly, and for many hours with one voice they cried to God, saying:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "peccavimus cum patribus nostris iniuste egimus iniquitatem fecimus"
      en: "We have sinned with our fathers we have done unjustly, we have commited iniquity:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "tu quia pius es miserere nostri aut in tuo flagello vindica iniquitates nostras et noli tradere confitentes te populo qui ignorat te"
      en: "Have thou mercy on us, because thou art good, or punish our iniquities by chastising us thyself, and deliver not them that trust in thee to a people that knoweth not thee,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ut non dicant inter gentes ubi est Deus eorum"
      en: "That they may not say among the gentiles: Where is their God?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et cum fatigati his clamoribus et his fletibus lassati siluissent"
      en: "And when being wearied with these cries, and tired with these weepings, they held their peace,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "exsurgens Ozias infusus lacrimis dixit aequo animo estote fratres et hos quinque dies expectemus a Domino misericordiam"
      en: "Ozias rising up all in tears, said: Be of good courage, my brethren, and let us wait these five days for mercy from the Lord."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "forsitan enim indignationem suam abscidet et dat gloriam nomini suo"
      en: "For perhaps he will put a stop to his indignation, and will give glory to his own name."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "si autem transactis quinque diebus non venerit adiutorium faciemus haec verba quae locuti estis"
      en: "But if after five days be past there come no aid, we will do the things which you leave spoken."
    status: { la: verified, en: verified }
