# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 24
verses:
  - n: 1
    text:
      la: "Et egressus Jesus de templo, ibat. Et accesserunt discipuli ejus, ut ostenderent ei aedificationes templi."
      en: "And Jesus being come out of the temple, went away. And his disciples came to shew him the buildings of the temple."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ipse autem respondens dixit illis: Videtis haec omnia? amen dico vobis, non relinquetur hic lapis super lapidem, qui non destruatur."
      en: "And he answering, said to them: Do you see all these things? Amen I say to you there shall not be left here a stone upon a stone that shall not be destroyed."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sedente autem eo super montem Oliveti, accesserunt ad eum discipuli secreto, dicentes: Dic nobis, quando haec erunt? et quod signum adventus tui, et consummationis saeculi?"
      en: "And when he was sitting on mount Olivet, the disciples came to him privately, saying: Tell us when shall these things be? and what shall be the sign of thy coming, and of the consummation of the world?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et respondens Jesus, dixit eis: Videte ne quis vos seducat:"
      en: "And Jesus answering, said to them: Take heed that no man seduce you:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "multi enim venient in nomine meo, dicentes: Ego sum Christus: et multos seducent."
      en: "For many will come in my name saying, I am Christ: and they will seduce many."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Audituri enim estis praelia, et opiniones praeliorum. Videte ne turbemini: oportet enim haec fieri, sed nondum est finis:"
      en: "And you shall hear of wars and rumours of wars. See that ye be not troubled. For these things must come to pass, but the end is not yet."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "consurget enim gens in gentem, et regnum in regnum, et erunt pestilentiae, et fames, et terraemotus per loca:"
      en: "For nation shall rise against nation, and kingdom against kingdom; and there shall be pestilences, and famines, and earthquakes in places:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "haec autem omnia initia sunt dolorum."
      en: "Now all these are the beginnings of sorrows."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Tunc tradent vos in tribulationem, et occident vos: et eritis odio omnibus gentibus propter nomen meum."
      en: "Then shall they deliver you up to be afflicted, and shall put you to death: and you shall be hated by all nations for my name's sake."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et tunc scandalizabuntur multi, et invicem tradent, et odio habebunt invicem."
      en: "And then shall many be scandalized: and shall betray one another: and shall hate one another."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et multi pseudoprophetae surgent, et seducent multos."
      en: "And many false prophets shall rise, and shall seduce many."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et quoniam abundavit iniquitas, refrigescet caritas multorum:"
      en: "And because iniquity hath abounded, the charity of many shall grow cold."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui autem perseveraverit usque in finem, hic salvus erit."
      en: "But he that shall persevere to the end, he shall be saved."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et praedicabitur hoc Evangelium regni in universo orbe, in testimonium omnibus gentibus: et tunc veniet consummatio."
      en: "And this gospel of the kingdom, shall be preached in the whole world, for a testimony to all nations, and then shall the consummation come."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cum ergo videritis abominationem desolationis, quae dicta est a Daniele propheta, stantem in loco sancto, qui legit, intelligat:"
      en: "When therefore you shall see the abomination of desolation, which was spoken of by Daniel the prophet, standing in the holy place: he that readeth let him understand."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tunc qui in Judaea sunt, fugiant ad montes:"
      en: "Then they that are in Judea, let them flee to the mountains:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et qui in tecto, non descendat tollere aliquid de domo sua:"
      en: "And he that is on the housetop, let him not come down to take any thing out of his house:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et qui in agro, non revertatur tollere tunicam suam."
      en: "And he that is in the field, let him not go back to take his coat."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Vae autem praegnantibus et nutrientibus in illis diebus!"
      en: "And woe to them that are with child, and that give suck in those days."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Orate autem ut non fiat fuga vestra in hieme, vel sabbato:"
      en: "But pray that your flight be not in the winter, or on the sabbath."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "erit enim tunc tribulatio magna, qualis non fuit ab initio mundi usque modo, neque fiet."
      en: "For there shall be then great tribulation, such as hath not been from the beginning of the world until now, neither shall be."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et nisi breviati fuissent dies illi, non fieret salva omnis caro: sed propter electos breviabuntur dies illi."
      en: "And unless those days had been shortened, no flesh should be saved: but for the sake of the elect those days shall be shortened."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Tunc si quis vobis dixerit: Ecce hic est Christus, aut illic: nolite credere."
      en: "Then if any man shall say to you: Lo here is Christ, or there, do not believe him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Surgent enim pseudochristi, et pseudoprophetae: et dabunt signa magna, et prodigia, ita ut in errorem inducantur ( si fieri potest) etiam electi."
      en: "For there shall arise false Christs and false prophets, and shall shew great signs and wonders, insomuch as to deceive (if possible) even the elect."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Ecce praedixi vobis."
      en: "Behold I have told it to you, beforehand."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Si ergo dixerint vobis: Ecce in deserto est, nolite exire; Ecce in penetralibus, nolite credere."
      en: "If therefore they shall say to you: Behold he is in the desert, go ye not out: Behold he is in the closets, believe it not."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Sicut enim fulgur exit ab oriente, et paret usque in occidentem: ita erit et adventus Filii hominis."
      en: "For as lightning cometh out of the east, and appeareth even into the west: so shall the coming of the Son of man be."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Ubicumque fuerit corpus, illic congregabuntur et aquilae."
      en: "Wheresoever the body shall be, there shall the eagles also be gathered together."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Statim autem post tribulationem dierum illorum sol obscurabitur, et luna non dabit lumen suum, et stellae cadent de caelo, et virtutes caelorum commovebuntur:"
      en: "And immediately after the tribulation of those days, the sun shall be darkened and the moon shall not give her light, and the stars shall fall from heaven, and the powers of heaven shall be moved:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et tunc parebit signum Filii hominis in caelo: et tunc plangent omnes tribus terrae: et videbunt Filium hominis venientem in nubibus caeli cum virtute multa et majestate."
      en: "And then shall appear the sign of the Son of man in heaven: and then shall all tribes of the earth mourn: and they shall see the Son of man coming in the clouds of heaven with much power and majesty."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et mittet angelos suos cum tuba, et voce magna: et congregabunt electos ejus a quatuor ventis, a summis caelorum usque ad terminos eorum."
      en: "And he shall send his angels with a trumpet, and a great voice: and they shall gather together his elect from the four winds, from the farthest parts of the heavens to the utmost bounds of them."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Ab arbore autem fici discite parabolam: cum jam ramus ejus tener fuerit, et folia nata, scitis quia prope est aestas:"
      en: "And from the fig tree learn a parable: When the branch thereof is now tender, and the leaves come forth, you know that summer is nigh."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "ita et vos cum videritis haec omnia, scitote quia prope est, in januis."
      en: "So you also, when you shall see all these things, know ye that it is nigh, even at the doors."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Amen dico vobis, quia non praeteribit generatio haec, donec omnia haec fiant."
      en: "Amen I say to you, that this generation shall not pass, till all these things be done."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Caelum et terra transibunt, verba autem mea non praeteribunt."
      en: "Heaven and earth shall pass, but my words shall not pass."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "De die autem illa et hora nemo scit, neque angeli caelorum, nisi solus Pater."
      en: "But of that day and hour no one knoweth, not the angels of heaven, but the Father alone."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Sicut autem in diebus Noe, ita erit et adventus Filii hominis:"
      en: "And as in the days of Noe, so shall also the coming of the Son of man be."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "sicut enim erant in diebus ante diluvium comedentes et bibentes, nubentes et nuptum tradentes, usque ad eum diem, quo intravit Noe in arcam,"
      en: "For as in the days before the flood, they were eating and drinking, marrying and giving in marriage, even till that day in which Noe entered into the ark,"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et non cognoverunt donec venit diluvium, et tulit omnes: ita erit et adventus Filii hominis."
      en: "And they knew not till the flood came, and took them all away; so also shall the coming of the Son of man be."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Tunc duo erunt in agro: unus assumetur, et unus relinquetur."
      en: "Then two shall be in the field: one shall be taken, and one shall be left."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Duae molentes in mola: una assumetur, et una relinquetur."
      en: "Two women shall be grinding at the mill: one shall be taken, and one shall be left."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Vigilate ergo, quia nescitis qua hora Dominus vester venturus sit."
      en: "Watch ye therefore, because ye know not what hour your Lord will come."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Illud autem scitote, quoniam si sciret paterfamilias qua hora fur venturus esset, vigilaret utique, et non sineret perfodi domum suam."
      en: "But know this ye, that if the goodman of the house knew at what hour the thief would come, he would certainly watch, and would not suffer his house to be broken open."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Ideo et vos estote parati: quia qua nescitis hora Filius hominis venturus est."
      en: "Wherefore be you also ready, because at what hour you know not the Son of man will come."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Quis, putas, est fidelis servus, et prudens, quem constituit dominus suus super familiam suam ut det illis cibum in tempore?"
      en: "Who, thinkest thou, is a faithful and wise servant, whom his lord hath appointed over his family, to give them meat in season."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Beatus ille servus, quem cum venerit dominus ejus, invenerit sic facientem."
      en: "Blessed is that servant, whom when his lord shall come he shall find so doing."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Amen dico vobis, quoniam super omnia bona sua constituet eum."
      en: "Amen I say to you, he shall place him over all his goods."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Si autem dixerit malus servus ille in corde suo: Moram fecit dominus meus venire:"
      en: "But if that evil servant shall say in his heart: My lord is long a coming:"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "et coeperit percutere conservos suos, manducet autem et bibat cum ebriosis:"
      en: "And shall begin to strike his fellow servants, and shall eat and drink with drunkards:"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "veniet dominus servi illius in die qua non sperat, et hora qua ignorat:"
      en: "The lord of that servant shall come in a day that he hopeth not, and at an hour that he knoweth not:"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "et dividet eum, partemque ejus ponet cum hypocritis: illic erit fletus et stridor dentium."
      en: "And shall separate him, and appoint his portion with the hypocrites. There shall be weeping and gnashing of teeth."
    status: { la: verified, en: verified }
