# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: tob
chapter: 11
verses:
  - n: 1
    text:
      la: "cumque reverterentur pervenerunt ad Charram quae est in medio itinere contra Nineven undecimo die"
      en: "And as they were returning they came to Charan, which is in the midway to Ninive, the eleventh day."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixit angelus Tobias frater scis quemadmodum reliquisti patrem tuum"
      en: "And the angel said: Brother Tobias, thou knowest how thou didst leave thy father."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "si placet itaque tibi praecedamus et lento gradu insequentur iter nostrum familiae simul cum coniuge tua et cum animalibus"
      en: "If it please thee therefore, let us go before, and let the family follow softly after us, together with thy wife, and with the beasts."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cumque hoc placuisset ut irent dixit Rafahel ad Tobiam tolle tecum ex felle piscis erit enim necessarium tulit itaque Tobias ex felle illo et abierunt"
      en: "And as this their going pleased him, Raphael said to Tobias: Take with thee of the gall of the fish, for it will be necessary. So Tobias took some of that gall and departed."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Anna vero sedebat secus viam in supercilio montis unde respicere poterat de longinquo"
      en: "But Anna sat beside the way daily, on the top of a hill, from whence she might see afar off."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et dum ex eodem loco specularetur adventum eius vidit a longe et ilico agnovit venientem filium suum et currens nuntiavit viro suo dicens ecce venit filius tuus"
      en: "And while she watched his coming from that place, she saw him afar off, and presently perceived it was her son coming: and returning she told her husband, saying: Behold thy son cometh."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixitque Rafahel ad Tobiam adubi introieris domum tuam statim adora Dominum Deum tuum et gratias agens ei accede ad patrem tuum et osculare eum"
      en: "And Raphael said to Tobias: As soon as thou shalt come into thy house, forthwith adore the Lord thy God: and giving thanks to him, go to thy father, and kiss him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "statimque lini super oculos eius ex felle isto piscis quod portas tecum scias enim quoniam mox aperientur oculi eius et videbit pater tuus lumen caeli et in aspectu tuo gaudebit"
      en: "And immediately anoint his eyes with this gall of the fish, which thou carriest with thee. For be assured that his eyes shall be presently opened, and thy father shall see the light of heaven, and shall rejoice in the sight of thee."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "tunc praecucurrit canis qui simul fuerat in via et quasi nuntius adveniens blandimento suae caudae gaudebat"
      en: "Then the dog, which had been with them in the way, ran before, and coming as if he had brought the news, shewed his joy by his fawning and wagging his tail."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "unde contigit ut exsurgens caecus pater coepit offendens pedibus currere et data manu puero occurrit in obviam filio suo"
      en: "And his father that was blind, rising up, began to run stumbling with his feet: and giving a servant his hand, went to meet his son."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et suscipiens osculatus est eum cum uxore sua et coeperunt flere prae gaudio"
      en: "And receiving him kissed him, as did also his wife, and they began to weep for joy."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cumque adorassent Dominum et gratias egissent consederunt"
      en: "And when they had adored God, and given him thanks, they sat down together."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "tunc sumens Tobias de felle piscis linivit oculos patri suo"
      en: "Then Tobias taking of the gall of the fish, anointed his father's eyes."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et sustinens quasi dimidiam fere horam coepit albugo ex oculis eius quasi membrana ovi egredi"
      en: "And he stayed about half an hour: and a white skin began to come out of his eyes, like the skin of an egg."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quem adprehendens Tobias traxit ab oculis eius statimque visum recepit"
      en: "And Tobias took hold of it, and drew it from his eyes, and immediately he recovered his sight."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et glorificabant Deum ipse videlicet et uxor eius et omnes qui sciebant eum"
      en: "And they glorified God, both he and his wife and all that knew them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dicebatque Tobias benedico te Domine Deus Israhel quoniam tu castigasti me et tu sanasti me et ecce video Tobiam filium meum"
      en: "And Tobias said: I bless thee, O Lord God of Israel, because thou hast chastised me, and thou hast saved me: and behold I see Tobias my son."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ingressa est etiam post septem dies Sarra uxor filii eius et omnes familiae et pecora sana et cameli et pecunia multa uxoris sed et alia pecunia quam receperat a Gabelo"
      en: "And after seven days Sara his son's wife, and all the family arrived safe, and the cattle, and the camels, and an abundance of money of his wife's: and that money also which he had received of Gabelus:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et narravit parentibus suis omnia beneficia Dei quae fecisset circa eum per hominem qui eum duxerat"
      en: "And he told his parents all the benefits of God, which he had done to him by the man that conducted him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "veneruntque Achior et Nabath consobrini Tobiae gaudentes ad Tobin congratulantes ei de omnibus bonis quae circa illum ostenderat Deus"
      en: "And Achior and Nabath the kinsmen of Tobias came, rejoicing for Tobias, and congratulating with him for all the good things that God had done for him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et per septem dies epulantes omnes gaudio magno gavisi sunt"
      en: "And for seven days they feasted and rejoiced all with great joy."
    status: { la: verified, en: verified }
