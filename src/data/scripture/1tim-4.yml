# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1tim
chapter: 4
verses:
  - n: 1
    text:
      la: "Spiritus autem manifeste dicit, quia in novissimis temporibus discedent quidam a fide, attendentes spiritibus erroris, et doctrinis daemoniorum,"
      en: "Now the Spirit manifestly saith, that in the last times some shall depart from the faith, giving heed to spirits of error, and doctrines of devils,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in hypocrisi loquentium mendacium, et cauteriatam habentium suam conscientiam,"
      en: "Speaking lies in hypocrisy, and having their conscience seared,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "prohibentium nubere, abstinere a cibis, quod Deus creavit ad percipiendum cum gratiarum actione fidelibus, et iis qui cognoverunt veritatem."
      en: "Forbidding to marry, to abstain from meats, which God hath created to be received with thanksgiving by the faithful, and by them that have known the truth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quia omnis creatura Dei bona est, et nihil rejiciendum quod cum gratiarum actione percipitur:"
      en: "For every creature of God is good, and nothing to be rejected that is received with thanksgiving:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "sanctificatur enim per verbum Dei, et orationem."
      en: "For it is sanctified by the word of God and prayer."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Haec proponens fratribus, bonus eris minister Christi Jesu enutritus verbis fidei, et bonae doctrinae, quam assecutus es."
      en: "These things proposing to the brethren, thou shalt be a good minister of Christ Jesus, nourished up in the words of faith, and of the good doctrine which thou hast attained unto."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ineptas autem, et aniles fabulas devita: exerce autem teipsum ad pietatem."
      en: "But avoid foolish and old wives' fables: and exercise thyself unto godliness."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Nam corporalis exercitatio, ad modicum utilis est: pietas autem ad omnia utilis est, promissionem habens vitae, quae nunc est, et futurae."
      en: "For bodily exercise is profitable to little: but godliness is profitable to all things, having promise of the life that now is, and of that which is to come."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Fidelis sermo, et omni acceptione dignus."
      en: "A faithful saying and worthy of all acceptation."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "In hoc enim laboramus, et maledicimur, quia speramus in Deum vivum, qui est Salvator omnium hominum, maxime fidelium."
      en: "For therefore we labor and are reviled, because we hope in the living God, who is the Saviour of all men, especially of the faithful."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Praecipe haec, et doce."
      en: "These things command and teach."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Nemo adolescentiam tuam contemnat: sed exemplum esto fidelium in verbo, in conversatione, in caritate, in fide, in castitate."
      en: "Let no man despise thy youth: but be thou an example of the faithful in word, in conversation, in charity, in faith, in chastity."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dum venio, attende lectioni, exhortationi, et doctrinae."
      en: "Till I come, attend unto reading, to exhortation, and to doctrine."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Noli negligere gratiam, quae in te est, quae data est tibi per prophetiam, cum impositione manuum presbyterii."
      en: "Neglect not the grace that is in thee, which was given thee by prophesy, with imposition of the hands of the priesthood."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Haec meditare, in his esto: ut profectus tuus manifestus sit omnibus."
      en: "Meditate upon these things, be wholly in these things: that thy profiting may be manifest to all."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Attende tibi, et doctrinae: insta in illis. Hoc enim faciens, et teipsum salvum facies, et eos qui te audiunt."
      en: "Take heed to thyself and to doctrine: be earnest in them. For in doing this thou shalt both save thyself and them that hear thee."
    status: { la: verified, en: verified }
