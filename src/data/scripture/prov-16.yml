# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 16
verses:
  - n: 1
    text:
      la: "Hominis est animam praeparare, et Domini gubernare linguam."
      en: "It is the part of man to prepare the soul: and of the Lord to govern the tongue."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Omnes viae hominis patent oculis ejus; spirituum ponderator est Dominus."
      en: "All the ways of a man are open to his eyes: the Lord is the weigher of spirits."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Revela Domino opera tua, et dirigentur cogitationes tuae."
      en: "Lay open thy works to the Lord: and thy thoughts shall be directed."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Universa propter semetipsum operatus est Dominus; impium quoque ad diem malum."
      en: "The Lord hath made all things for himself: the wicked also for the evil day."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Abominatio Domini est omnis arrogans; etiamsi manus ad manum fuerit, non est innocens. Initium viae bonae facere justitiam; accepta est autem apud Deum magis quam immolare hostias."
      en: "Every proud man is an abomination to the Lord: though hand should be joined to hand, he is not innocent. The beginning of a good way is to do justice; and this is more acceptable with God, than to offer sacrifices."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Misericordia et veritate redimitur iniquitas, et in timore Domini declinatur a malo."
      en: "By mercy and truth iniquity is redeemed: and by the fear of the Lord men depart from evil."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cum placuerint Domino viae hominis, inimicos quoque ejus convertet ad pacem."
      en: "When the ways of man shall please the Lord, he will convert even his enemies to peace."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Melius est parum cum justitia, quam multi fructus cum iniquitate."
      en: "Better is a little with justice, than great revenues with iniquity."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Cor hominis disponit viam suam, sed Domini est dirigere gressus ejus."
      en: "The heart of man disposeth his way: but the Lord must direct his steps."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Divinatio in labiis regis; in judicio non errabit os ejus."
      en: "Divination is in the lips of the king, his mouth shall not err in judgment."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Pondus et statera judicia Domini sunt, et opera ejus omnes lapides sacculi."
      en: "Weight and balance are judgments of the Lord: and his work all the weights of the bag."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Abominabiles regi qui agunt impie, quoniam justitia firmatur solium."
      en: "They that act wickedly are abominable to the king: for the throne is established by justice."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Voluntas regum labia justa; qui recta loquitur diligetur."
      en: "Just lips are the delight of kings: he that speaketh right things shall be loved."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Indignatio regis nuntii mortis, et vir sapiens placabit eam."
      en: "The wrath of a king is as messengers of death: and the wise man will pacify it."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "In hilaritate vultus regis vita, et clementia ejus quasi imber serotinus."
      en: "In the cheerfulness of the king's countenance is life: and his clemency is like the latter rain."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Posside sapientiam, quia auro melior est, et acquire prudentiam, quia pretiosior est argento."
      en: "Get wisdom, because it is better than gold: and purchase prudence, for it is more precious than silver."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Semita justorum declinat mala; custos animae suae servat viam suam."
      en: "The path of the just departeth from evils: he that keepeth his soul keepeth his way."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Contritionem praecedit superbia, et ante ruinam exaltatur spiritus."
      en: "Pride goeth before destruction: and the spirit is lifted up before a fall."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Melius est humiliari cum mitibus, quam dividere spolia cum superbis."
      en: "It is better to be humbled with the meek, than to divide spoils with the proud."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Eruditus in verbo reperiet bona, et qui sperat in Domino beatus est."
      en: "The learned in word shall find good things: and he that trusteth in the Lord is blessed."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Qui sapiens est corde appellabitur prudens, et qui dulcis eloquio majora percipiet."
      en: "The wise in heart shall be called prudent: and he that is sweet in words shall attain to greater things."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Fons vitae eruditio possidentis; doctrina stultorum fatuitas."
      en: "Knowledge is a fountain of life to him that possesseth it: the instruction of fools is foolishness."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cor sapientis erudiet os ejus, et labiis ejus addet gratiam."
      en: "The heart of the wise shall instruct his mouth: and shall add grace to his lips."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Favus mellis composita verba; dulcedo animae sanitas ossium."
      en: "Well ordered words are as a honeycomb: sweet to the soul, and health to the bones."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Est via quae videtur homini recta, et novissima ejus ducunt ad mortem."
      en: "There is a way that seemeth to a man right: and the ends thereof lead to death."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Anima laborantis laborat sibi, quia compulit eum os suum."
      en: "The soul of him that laboureth, laboureth for himself, because his mouth hath obliged him to it."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Vir impius fodit malum, et in labiis ejus ignis ardescit."
      en: "The wicked man diggeth evil, and in his lips is a burning fire."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Homo perversus suscitat lites, et verbosus separat principes."
      en: "A perverse man stirreth up quarrels: and one full of words separateth princes."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Vir iniquus lactat amicum suum, et ducit eum per viam non bonam."
      en: "An unjust man allureth his friend: and leadeth him into a way that is not good."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Qui attonitis oculis cogitat prava, mordens labia sua perficit malum."
      en: "He that with fixed eyes deviseth wicked things, biting his lips, bringeth: evil to pass."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Corona dignitatis senectus, quae in viis justitiae reperietur."
      en: "Old age is a crown of dignity, when it is found in the ways of justice."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Melior est patiens viro forti; et qui dominatur animo suo, expugnatore urbium."
      en: "The patient man is better than the valiant: and he that ruleth his spirit than he that taketh cities."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Sortes mittuntur in sinum, sed a Domino temperantur."
      en: "Lots are cast into the lap, but they are disposed of by the Lord."
    status: { la: verified, en: verified }
