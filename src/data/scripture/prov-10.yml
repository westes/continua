# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 10
verses:
  - n: 1
    text:
      la: "Filius sapiens laetificat patrem, filius vero stultus moestitia est matris suae."
      en: "A wise son maketh the father glad: but a foolish son is the sorrow of his mother."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Nil proderunt thesauri impietatis, justitia vero liberabit a morte."
      en: "Treasures of wickedness shall profit nothing: but justice shall deliver from death."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Non affliget Dominus fame animam justi, et insidias impiorum subvertet."
      en: "The Lord will not afflict the soul of the just with famine, and he will disappoint the deceitful practices of the wicked."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Egestatem operata est manus remissa; manus autem fortium divitias parat. Qui nititur mendaciis, hic pascit ventos; idem autem ipse sequitur aves volantes."
      en: "The slothful hand hath wrought poverty: but the hand of the industrious getteth riches. He that trusteth to lies feedeth the winds: and the same runneth after birds that fly away."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Qui congregat in messe, filius sapiens est; qui autem stertit aestate, filius confusionis."
      en: "He that gathered in the harvest is a wise son: but he that snorteth in the summer, is the son of confusion."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Benedictio Domini super caput justi; os autem impiorum operit iniquitas."
      en: "The blessing of the Lord is upon the head of the just: but iniquity covereth the mouth of the wicked."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Memoria justi cum laudibus, et nomen impiorum putrescet."
      en: "The memory of the just is with praises: and the name of the wicked shall rot."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sapiens corde praecepta suscipit; stultus caeditur labiis."
      en: "The wise of heart receiveth precepts: a fool is beaten with lips."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Qui ambulat simpliciter ambulat confidenter; qui autem depravat vias suas manifestus erit."
      en: "He that walketh sincerely, walketh confidently: but he that perverteth his ways, shall be manifest."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Qui annuit oculo dabit dolorem; et stultus labiis verberabitur."
      en: "He that winketh with the eye shall cause sorrow: and the foolish in lips shall be beaten."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Vena vitae os justi, et os impiorum operit iniquitatem."
      en: "The mouth of the just is a vein of life: and the mouth of the wicked covereth iniquity."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Odium suscitat rixas, et universa delicta operit caritas."
      en: "Hatred stirreth up strifes: and charity covereth all sins."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "In labiis sapientis invenitur sapientia, et virga in dorso ejus qui indiget corde."
      en: "In the lips of the wise is wisdom found: and a rod on the back of him that wanteth sense."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sapientes abscondunt scientiam; os autem stulti confusioni proximum est."
      en: "Wise men lay up knowledge: but the mouth of the fool is next to confusion."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Substantia divitis, urbs fortitudinis ejus; pavor pauperum egestas eorum."
      en: "The substance of a rich man is the city of his strength: the fear of the poor is their poverty."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Opus justi ad vitam, fructus autem impii ad peccatum."
      en: "The work of the just is unto life: but the fruit of the wicked, unto sin."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Via vitae custodienti disciplinam; qui autem increpationes relinquit, errat."
      en: "The way of life, to him that observeth correction: but he that forsaketh reproofs goeth astray."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Abscondunt odium labia mendacia; qui profert contumeliam, insipiens est."
      en: "Lying lips hide hatred: he that uttereth reproach is foolish."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "In multiloquio non deerit peccatum, qui autem moderatur labia sua prudentissimus est."
      en: "In the multitude of words there shall not want sin: but he that refraineth his lips is most wise."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Argentum electum lingua justi; cor autem impiorum pro nihilo."
      en: "The tongue of the just is as choice silver: but the heart of the wicked is nothing worth."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Labia justi erudiunt plurimos; qui autem indocti sunt in cordis egestate morientur."
      en: "The lips of the just teach many: but they that are ignorant, shall die in the want of understanding."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Benedictio Domini divites facit, nec sociabitur eis afflictio."
      en: "The blessing of the Lord maketh men rich: neither shall affliction be joined to them."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Quasi per risum stultus operatur scelus, sapientia autem est viro prudentia."
      en: "A fool worketh mischief as it were for sport: but wisdom is prudence to a man."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Quod timet impius veniet super eum; desiderium suum justus dabitur."
      en: "That which the wicked feareth, shall come upon him: to the just their desire shall be given."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Quasi tempestas transiens non erit impius; justus autem quasi fundamentum sempiternum."
      en: "As a tempest that passeth, so the wicked shall be no more: but the just is as an everlasting foundation."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Sicut acetum dentibus, et fumus oculis, sic piger his qui miserunt eum."
      en: "As vinegar to the teeth, and smoke to the eyes, so is the sluggard to them that sent him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Timor Domini apponet dies, et anni impiorum breviabuntur."
      en: "The fear of the Lord shall prolong days: and the years of the wicked shall be shortened."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Exspectatio justorum laetitia, spes autem impiorum peribit."
      en: "The expectation of the just is joy; but the hope of the wicked shall perish."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Fortitudo simplicis via Domini, et pavor his qui operantur malum."
      en: "The strength of the upright is the way of the Lord: and fear to them that work evil."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Justus in aeternum non commovebitur, impii autem non habitabunt super terram."
      en: "The just shall never be moved: but the wicked shall not dwell on the earth."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Os justi parturiet sapientiam; lingua pravorum peribit."
      en: "The mouth of the just shall bring forth wisdom: the tongue of the perverse shall perish."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Labia justi considerant placita, et os impiorum perversa."
      en: "The lips of the just consider what is acceptable: and the mouth of the wicked uttereth perverse things."
    status: { la: verified, en: verified }
