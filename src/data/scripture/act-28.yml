# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: act
chapter: 28
verses:
  - n: 1
    text:
      la: "et cum evasissemus tunc cognovimus quia Militene insula vocatur barbari vero praestabant non modicam humanitatem nobis"
      en: "And when we had escaped, then we knew that the island was called Melita. But the barbarians shewed us no small courtesy."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "accensa enim pyra reficiebant nos omnes propter imbrem qui inminebat et frigus"
      en: "For kindling a fire, they refreshed us all, because of the present rain, and of the cold."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cum congregasset autem Paulus sarmentorum aliquantam multitudinem et inposuisset super ignem vipera a calore cum processisset invasit manum eius"
      en: "And when Paul had gathered together a bundle of sticks, and had laid them on the fire, a viper coming out of the heat, fastened on his hand."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ut vero viderunt barbari pendentem bestiam de manu eius ad invicem dicebant utique homicida est homo hic qui cum evaserit de mari Ultio non sinit vivere"
      en: "And when the barbarians saw the beast hanging on his hand, they said one to another: Undoubtedly this man is a murderer, who though he hath escaped the sea, yet vengeance doth not suffer him to live."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et ille quidem excutiens bestiam in ignem nihil mali passus est"
      en: "And he indeed shaking off the beast into the fire, suffered no harm."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "at illi existimabant eum in tumorem convertendum et subito casurum et mori diu autem illis sperantibus et videntibus nihil mali in eo fieri convertentes se dicebant eum esse deum"
      en: "But they supposed that he would begin to swell up, and that he would suddenly fall down and die. But expecting long, and seeing that there came no harm to him, changing their minds, they said, that he was a god."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in locis autem illis erant praedia principis insulae nomine Publii qui nos suscipiens triduo benigne exhibuit"
      en: "Now in these places were possessions of the chief man of the island, named Publius, who receiving us, for three days entertained us courteously."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "contigit autem patrem Publii febribus et dysenteria vexatum iacere ad quem Paulus intravit et cum orasset et inposuisset ei manus salvavit eum"
      en: "And it happened that the father of Publius lay sick of a fever, and of a bloody flux. To whom Paul entered in; and when he had prayed, and laid his hands on him, he healed him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quo facto et omnes qui in insula habebant infirmitates accedebant et curabantur"
      en: "Which being done, all that had diseases in the island, came and were healed:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui etiam multis honoribus nos honoraverunt et navigantibus inposuerunt quae necessaria erant"
      en: "Who also honoured us with many honours, and when we were to set sail, they laded us with such things as were necessary."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "post menses autem tres navigavimus in nave alexandrina quae in insula hiemaverat cui erat insigne Castorum"
      en: "And after three months, we sailed in a ship of Alexandria, that had wintered in the island, whose sign was the Castors."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et cum venissemus Syracusam mansimus ibi triduo"
      en: "And when we were come to Syracusa, we tarried there three days."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "inde circumlegentes devenimus Regium et post unum diem flante austro secunda die venimus Puteolos"
      en: "From thence, compassing by the shore, we came to Rhegium: and after one day, the south wind blowing, we came the second day to Puteoli;"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ubi inventis fratribus rogati sumus manere apud eos dies septem et sic venimus Romam"
      en: "Where, finding brethren, we were desired to tarry with them seven days: and so we went to Rome."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et inde cum audissent fratres occurrerunt nobis usque ad Appii Forum et Tribus Tabernis quos cum vidisset Paulus gratias agens Deo accepit fiduciam"
      en: "And from thence, when the brethren had heard of us, they came to meet us as far as Appii Forum, and the Three Taverns: whom when Paul saw, he gave thanks to God, and took courage."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cum venissemus autem Romam permissum est Paulo manere sibimet cum custodiente se milite"
      en: "And when we were come to Rome, Paul was suffered to dwell by himself, with a soldier that kept him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "post tertium autem diem convocavit primos Iudaeorum cumque convenissent dicebat eis ego viri fratres nihil adversus plebem faciens aut morem paternum vinctus ab Hierosolymis traditus sum in manus Romanorum"
      en: "And after the third day, he called together the chief of the Jews. And when they were assembled, he said to them: Men, brethren, I, having done nothing against the people, or the custom of our fathers, was delivered prisoner from Jerusalem into the hands of the Romans;"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui cum interrogationem de me habuissent voluerunt me dimittere eo quod nulla causa esset mortis in me"
      en: "Who, when they had examined me, would have released me, for that there was no cause of death in me;"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "contradicentibus autem Iudaeis coactus sum appellare Caesarem non quasi gentem meam habens aliquid accusare"
      en: "But the Jews contradicting it, I was constrained to appeal unto Caesar; not that I had any thing to accuse my nation of."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "propter hanc igitur causam rogavi vos videre et adloqui propter spem enim Israhel catena hac circumdatus sum"
      en: "For this cause therefore I desired to see you, and to speak to you. Because that for the hope of Israel, I am bound with this chain."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "at illi dixerunt ad eum nos neque litteras accepimus de te a Iudaea neque adveniens aliquis fratrum nuntiavit aut locutus est quid de te malum"
      en: "But they said to him: We neither received letters concerning thee from Judea, neither did any of the brethren that came hither, relate or speak any evil of thee."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "rogamus autem a te audire quae sentis nam de secta hac notum est nobis quia ubique ei contradicitur"
      en: "But we desire to hear of thee what thou thinkest; for as concerning this sect, we know that it is every where contradicted."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "cum constituissent autem illi diem venerunt ad eum in hospitium plures quibus exponebat testificans regnum Dei suadensque eos de Iesu ex lege Mosi et prophetis a mane usque ad vesperam"
      en: "And when they had appointed him a day, there came very many to him unto his lodgings; to whom he expounded, testifying the kingdom of God, and persuading them concerning Jesus, out of the law of Moses and the prophets, from morning until evening."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et quidam credebant his quae dicebantur quidam vero non credebant"
      en: "And some believed the things that were said; but some believed not."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "cumque invicem non essent consentientes discedebant dicente Paulo unum verbum quia bene Spiritus Sanctus locutus est per Esaiam prophetam ad patres nostros"
      en: "And when they agreed not among themselves, they departed, Paul speaking this one word: Well did the Holy Ghost speak to our fathers by Isaias the prophet,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "dicens vade ad populum istum et dic aure audietis et non intellegetis et videntes videbitis et non perspicietis"
      en: "Saying: Go to this people, and say to them: With the ear you shall hear, and shall not understand; and seeing you shall see, and shall not perceive."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "incrassatum est enim cor populi huius et auribus graviter audierunt et oculos suos conpresserunt ne forte videant oculis et auribus audiant et corde intellegant et convertantur et sanem illos"
      en: "For the heart of this people is grown gross, and with their ears have they heard heavily, and their eyes they have shut; lest perhaps they should see with their eyes, and hear with their ears, and understand with their heart, and should be converted, and I should heal them."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "notum ergo sit vobis quoniam gentibus missum est hoc salutare Dei ipsi et audient"
      en: "Be it known therefore to you, that this salvation of God is sent to the Gentiles, and they will hear it."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "[]"
      en: "And when he had said these things, the Jews went out from him, having much reasoning among themselves."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "mansit autem biennio toto in suo conducto et suscipiebat omnes qui ingrediebantur ad eum"
      en: "And he remained two whole years in his own hired lodging; and he received all that came in to him,"
    status: { la: verified, en: verified }
