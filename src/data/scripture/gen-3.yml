# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 3
verses:
  - n: 1
    text:
      la: "sed et serpens erat callidior cunctis animantibus terrae quae fecerat Dominus Deus qui dixit ad mulierem cur praecepit vobis Deus ut non comederetis de omni ligno paradisi"
      en: "Now the serpent was more subtle than any of the beasts of the earth which the Lord God made. And he said to the woman: Why hath God commanded you, that you should not eat of every tree of paradise?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "cui respondit mulier de fructu lignorum quae sunt in paradiso vescemur"
      en: "And the woman answered him, saying: Of the fruit of the trees that are in paradise we do eat:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "de fructu vero ligni quod est in medio paradisi praecepit nobis Deus ne comederemus et ne tangeremus illud ne forte moriamur"
      en: "But of the fruit of the tree which is in the midst of paradise, God hath commanded us that we should not eat; and that we should not touch it, lest perhaps we die."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dixit autem serpens ad mulierem nequaquam morte moriemini"
      en: "And the serpent said to the woman: No, you shall not die the death."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "scit enim Deus quod in quocumque die comederitis ex eo aperientur oculi vestri et eritis sicut dii scientes bonum et malum"
      en: "For God doth know that in what day soever you shall eat thereof, your eyes shall be opened: and you shall be as Gods, knowing good and evil."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "vidit igitur mulier quod bonum esset lignum ad vescendum et pulchrum oculis aspectuque delectabile et tulit de fructu illius et comedit deditque viro suo qui comedit"
      en: "And the woman saw that the tree was good to eat, and fair to the eyes, and delightful to behold: and she took of the fruit thereof, and did eat, and gave to her husband who did eat."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et aperti sunt oculi amborum cumque cognovissent esse se nudos consuerunt folia ficus et fecerunt sibi perizomata"
      en: "And the eyes of them both were opened: and when they perceived themselves to be naked, they sewed together fig leaves, and made themselves aprons."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et cum audissent vocem Domini Dei deambulantis in paradiso ad auram post meridiem abscondit se Adam et uxor eius a facie Domini Dei in medio ligni paradisi"
      en: "And when they heard the voice of the Lord God walking in paradise at the afternoon air, Adam and his wife hid themselves from the face of the Lord God, amidst the trees of paradise."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "vocavitque Dominus Deus Adam et dixit ei ubi es"
      en: "And the Lord God called Adam, and said to him: Where art thou?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui ait vocem tuam audivi in paradiso et timui eo quod nudus essem et abscondi me"
      en: "And he said: I heard thy voice in paradise; and I was afraid, because I was naked, and I hid myself."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cui dixit quis enim indicavit tibi quod nudus esses nisi quod ex ligno de quo tibi praeceperam ne comederes comedisti"
      en: "And he said to him: And who hath told thee that thou wast naked, but that thou hast eaten of the tree whereof I commanded thee that thou shouldst not eat?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dixitque Adam mulier quam dedisti sociam mihi dedit mihi de ligno et comedi"
      en: "And Adam said: The woman, whom thou gavest me to be my companion, gave me of the tree, and I did eat."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et dixit Dominus Deus ad mulierem quare hoc fecisti quae respondit serpens decepit me et comedi"
      en: "And the Lord God said to the woman: Why hast thou done this? And she answered: The serpent deceived me, and I did eat."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et ait Dominus Deus ad serpentem quia fecisti hoc maledictus es inter omnia animantia et bestias terrae super pectus tuum gradieris et terram comedes cunctis diebus vitae tuae"
      en: "And the Lord God said to the serpent: Because thou hast done this thing, thou art cursed among all cattle, and the beasts of the earth: upon thy breast shalt thou go, and earth shalt thou eat all the days of thy life."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "inimicitias ponam inter te et mulierem et semen tuum et semen illius ipsa conteret caput tuum et tu insidiaberis calcaneo eius"
      en: "I will put enmities between thee and the woman, and thy seed and her seed: she shall crush thy head, and thou shalt lie in wait for her heel."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "mulieri quoque dixit multiplicabo aerumnas tuas et conceptus tuos in dolore paries filios et sub viri potestate eris et ipse dominabitur tui"
      en: "To the woman also he said: I will multiply thy sorrows, and thy conceptions: in sorrow shalt thou bring forth children, and thou shalt be under thy husband's power, and he shall have dominion over thee."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ad Adam vero dixit quia audisti vocem uxoris tuae et comedisti de ligno ex quo praeceperam tibi ne comederes maledicta terra in opere tuo in laboribus comedes eam cunctis diebus vitae tuae"
      en: "And to Adam he said: Because thou hast hearkened to the voice of thy wife, and hast eaten of the tree, whereof I commanded thee that thou shouldst not eat, cursed is the earth in thy work; with labour and toil shalt thou eat thereof all the days of thy life."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "spinas et tribulos germinabit tibi et comedes herbas terrae"
      en: "Thorns and thistles shall it bring forth to thee; and thou eat the herbs of the earth."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "in sudore vultus tui vesceris pane donec revertaris in terram de qua sumptus es quia pulvis es et in pulverem reverteris"
      en: "In the sweat of thy face shalt thou eat bread till thou return to the earth, out of which thou wast taken: for dust thou art, and into dust thou shalt return."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et vocavit Adam nomen uxoris suae Hava eo quod mater esset cunctorum viventium"
      en: "And Adam called the name of his wife Eve: because she was the mother of all the living."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "fecit quoque Dominus Deus Adam et uxori eius tunicas pellicias et induit eos"
      en: "And the Lord God made for Adam and his wife, garments of skins, and clothed them."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et ait ecce Adam factus est quasi unus ex nobis sciens bonum et malum nunc ergo ne forte mittat manum suam et sumat etiam de ligno vitae et comedat et vivat in aeternum"
      en: "And he said: Behold Adam is become as one of us, knowing good and evil: now, therefore, lest perhaps he put forth his hand, and take also of the tree of life, and eat, and live for ever."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "emisit eum Dominus Deus de paradiso voluptatis ut operaretur terram de qua sumptus est"
      en: "And the Lord God sent him out of the paradise of pleasure, to till the earth from which he was taken."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "eiecitque Adam et conlocavit ante paradisum voluptatis cherubin et flammeum gladium atque versatilem ad custodiendam viam ligni vitae"
      en: "And he cast out Adam; and placed before the paradise of pleasure Cherubims, and a flaming sword, turning every way, to keep the way of the tree of life."
    status: { la: verified, en: verified }
