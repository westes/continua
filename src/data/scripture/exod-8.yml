book: exod
chapter: 8
verses:
  - n: 1
    text:
      la: "dixitque Dominus ad Mosen ingredere ad Pharao et dices ad eum haec dicit Dominus dimitte populum meum ut sacrificet mihi"
      en: "And the Lord said to Moses: Go in to Pharao, and thou shalt say to him: Thus saith the Lord: Let my people go to sacrifice to me."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sin autem nolueris dimittere ecce ego percutiam omnes terminos tuos ranis"
      en: "But if thou wilt not let them go behold I will strike all thy coasts with frogs."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ebulliet fluvius ranas quae ascendent et ingredientur domum tuam et cubiculum lectuli tui et super stratum tuum et in domos servorum tuorum et in populum tuum et in furnos tuos et in reliquias ciborum tuorum"
      en: "And the river shall bring forth an abundance of frogs: which shall come up, and enter into thy house, and thy bedchamber, and upon thy bed, and in the houses of thy servants, and to thy people, and into thy ovens, and into the remains of thy meats;"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ad te et ad populum tuum et ad omnes servos tuos intrabunt ranae"
      en: "And the frogs shall come in to thee and to thy people, and to all thy servants."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixitque Dominus ad Mosen dic Aaron extende manum tuam super fluvios et super rivos ac paludes et educ ranas super terram Aegypti"
      en: "And the Lord said to Moses: Say to Aaron, Stretch forth thy hand upon the streams and upon the rivers and the pools, and bring forth frogs upon the land of Egypt."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "extendit Aaron manum super aquas Aegypti et ascenderunt ranae operueruntque terram Aegypti"
      en: "And Aaron stretched forth his hand upon the waters of Egypt, and the frogs came up, and covered the land of Egypt."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "fecerunt autem et malefici per incantationes suas similiter eduxeruntque ranas super terram Aegypti"
      en: "And the magicians also by their enchantments did in like manner, and the brought forth frogs upon all the land of Egypt"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "vocavit autem Pharao Mosen et Aaron et dixit orate Dominum ut auferat ranas a me et a populo meo et dimittam populum ut sacrificet Domino"
      en: "But Pharao called Moses and Aaron and said to them: Pray ye to the Lord to take away the frogs from me and from my people; and I will let the people go to sacrifice to the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dixitque Moses Pharaoni constitue mihi quando deprecer pro te et pro servis tuis et pro populo tuo ut abigantur ranae a te et a domo tua et tantum in flumine remaneant"
      en: "And Moses said to Pharao: Set me a time when I shall pray for thee, and for thy servants, and for thy people, that the frogs may be driven away from thee and from thy house, and from thy servants, and from thy people: and may remain only in the river."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui respondit cras at ille iuxta verbum inquit tuum ut scias quoniam non est sicut Dominus Deus noster"
      en: "And he answered: Tomorrow. But he said: I will do according to thy word; that thou mayst know that there is none like to the Lord our God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et recedent ranae a te et a domo tua et a servis tuis et a populo tuo tantum in flumine remanebunt"
      en: "And the frogs shall depart from thee, and from thy house, and from thy servants, and from thy people; and shall remain only in the river."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "egressique sunt Moses et Aaron a Pharaone et clamavit Moses ad Dominum pro sponsione ranarum quam condixerat Pharaoni"
      en: "And Moses and Aaron went forth from Pharao: and Moses cried to the Lord for the promise, which he had made to Pharao concerning the frogs."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "fecitque Dominus iuxta verbum Mosi et mortuae sunt ranae de domibus et de villis et de agris"
      en: "And the Lord did according to the word of Moses: and the frogs died out of the houses, and out of the villages, and out of the fields:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "congregaveruntque eas in inmensos aggeres et conputruit terra"
      en: "And they gathered them together into immense heaps, and the land was corrupted."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "videns autem Pharao quod data esset requies ingravavit cor suum et non audivit eos sicut praeceperat Dominus"
      en: "And Pharao seeing that rest was given, hardened his own heart, and did not hear them, as the Lord had commanded."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixitque Dominus ad Mosen loquere ad Aaron extende virgam tuam et percute pulverem terrae et sint scinifes in universa terra Aegypti"
      en: "And the Lord said to Moses: Say to Aaron, Stretch forth thy rod, and strike the dust of the earth: and may there be sciniphs in all the land of Egypt."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "feceruntque ita et extendit Aaron manu virgam tenens percussitque pulverem terrae et facti sunt scinifes in hominibus et in iumentis omnis pulvis terrae versus est in scinifes per totam terram Aegypti"
      en: "And they did so. And Aaron stretched forth his hand, holding the rod: and he struck the dust of the earth, and there came sciniphs on men and on beasts: all the dust of the earth was turned into sciniphs through all the land of Egypt."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "feceruntque similiter malefici incantationibus suis ut educerent scinifes et non potuerunt erantque scinifes tam in hominibus quam in iumentis"
      en: "And the magicians with their enchantments practiced in like manner, to bring forth sciniphs, and they could not and there were sciniphs as well on men as on beasts."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et dixerunt malefici ad Pharao digitus Dei est induratumque est cor Pharaonis et non audivit eos sicut praeceperat Dominus"
      en: "And the magicians said to Pharao This is the finger of God. And Pharao heart was hardened, and he hearkened not unto them, as the Lord had commanded."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dixit quoque Dominus ad Mosen consurge diluculo et sta coram Pharaone egreditur enim ad aquas et dices ad eum haec dicit Dominus dimitte populum meum ut sacrificet mihi"
      en: "The Lord also said to Moses: Arise early, and stand before Pharao: for he will go forth to the waters: and thou shalt say to him: Thus saith the Lord: Let my people go to sacrifice to me."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quod si non dimiseris eum ecce ego inmittam in te et in servos tuos et in populum tuum et in domos tuas omne genus muscarum et implebuntur domus Aegyptiorum muscis diversi generis et in universa terra in qua fuerint"
      en: "But if thou wilt not let them go, behold I will send in upon thee, and upon thy servants, and upon thy houses all kind of flies: and the houses of the Egyptians shall be filled with flies of divers kinds, and the whole land wherein they shall be."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "faciamque mirabilem in die illa terram Gessen in qua populus meus est ut non sint ibi muscae et scias quoniam ego Dominus in medio terrae"
      en: "And I will make the land of Gessen wherein my people is, wonderful in that lay, so that flies shall not be there: and thou shalt know that I am the Lord in the midst of the earth."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ponamque divisionem inter populum meum et populum tuum cras erit signum istud"
      en: "And I will put a division between my people and thy people: tomorrow shall this sign be."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "fecitque Dominus ita et venit musca gravissima in domos Pharaonis et servorum eius et in omnem terram Aegypti corruptaque est terra ab huiuscemodi muscis"
      en: "And the Lord did so. And there came a very grievous swarm of flies into he houses of Pharao and of his servants, and into all the land of Egypt: and the land was corrupted by this kind of flies."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "vocavit Pharao Mosen et Aaron et ait eis ite sacrificate Deo vestro in terra"
      en: "And Pharao called Moses and Aaron, and said to them: Go, and sacrifice to your God in this land."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et ait Moses non potest ita fieri abominationes enim Aegyptiorum immolabimus Domino Deo nostro quod si mactaverimus ea quae colunt Aegyptii coram eis lapidibus nos obruent"
      en: "And Moses said: It cannot be so: for we shall sacrifice the abominations of the Egyptians to the Lord our God: now if we kill those things which the Egyptians worship, in their presence, they will stone us."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "via trium dierum pergemus in solitudine et sacrificabimus Domino Deo nostro sicut praeceperit nobis"
      en: "We will go three days' journey into the wilderness: and we will sacrifice to the Lord our God, as he hath commanded us."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "dixitque Pharao ego dimittam vos ut sacrificetis Domino Deo vestro in deserto verumtamen longius ne abeatis rogate pro me"
      en: "And Pharao said: I will let you go to sacrifice to the Lord your God in the wilderness: but go no farther: pray for me."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et ait Moses egressus a te orabo Dominum et recedet musca a Pharaone et a servis et a populo eius cras verumtamen noli ultra fallere ut non dimittas populum sacrificare Domino"
      en: "And Moses said: I will go out from thee, and will pray to the Lord: and the flies shall depart from Pharao, and from his servants, and from his people tomorrow: but do not deceive any more, in not letting the people go to sacrifice to the Lord."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "egressusque Moses a Pharao oravit Dominum"
      en: "So Moses went out from Pharao, and prayed to the Lord."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "qui fecit iuxta verbum illius et abstulit muscas a Pharao et a servis et a populo eius non superfuit ne una quidem"
      en: "And he did according to his word: and he took away the flies from Pharao, and from his servants, and from his people: there was not left so much as one."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et ingravatum est cor Pharaonis ita ut ne hac quidem vice dimitteret populum"
      en: "And Pharao's heart was hardened, so that neither this time would he let the people go."
    status: { la: verified, en: verified }
