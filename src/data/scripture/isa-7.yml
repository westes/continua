# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 7
verses:
  - n: 1
    text:
      la: "Et factum est in diebus Achaz, filii Joathan, filii Oziae, regis Juda, ascendit Rasin, rex Syriae, et Phacee, filius Romeliae, rex Israel, in Jerusalem, ad praeliandum contra eam: et non potuerunt"
      en: "And it came to pass in the days of Achaz the son of Joathan, the son of Ozias, king of Juda, that Rasin king of Syria, and Phacee the son of Romelia king of Israel, came up to Jerusalem, to fight against it: but they could not prevail over it."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "debellare eam. Et nuntiaverunt domui David, dicentes: Requievit Syria super Ephraim. Et commotum est cor ejus, et cor populi ejus, sicut moventur ligna silvarum a facie venti."
      en: "And they told the house of David, saying: Syria hath rested upon Ephraim, and his heart was moved, and the heart of his people, as the trees of the woods are moved with the wind."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dixit Dominus ad Isaiam: Egredere in occursum Achaz, tu et qui derelictus est Jasub, filius tuus, ad extremum aquaeductus piscinae superioris in via agri Fullonis;"
      en: "And the Lord said to Isaias: Go forth to meet Achaz, thou and Jasub thy son that is left, to the conduit of the upper pool, in the way of the fuller's field."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dices ad eum: Vide ut sileas; noli timere, et cor tuum ne formidet a duabus caudis titionum fumigantium istorum, in ira furoris Rasin, regis Syriae, et filii Romeliae;"
      en: "And thou shalt say to him: See thou be quiet: fear not, and let not thy heart be afraid of the two tails of these fire brands, smoking with the wrath of the fury of Rasin king of Syria, and of the son of Romelia."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "eo quod consilium inierit contra te Syria in malum, Ephraim, et filius Romeliae, dicentes:"
      en: "Because Syria hath taken counsel against thee, unto the evil of Ephraim and the son of Romelia, saying:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ascendamus ad Judam, et suscitemus eum, et avellamus eum ad nos, et ponamus regem in medio ejus filium Tabeel."
      en: "Let us go up to Juda, and rouse it up, and draw it away to us, and make the son of Tabeel king in the midst thereof."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Haec dicit Dominus Deus: Non stabit, et non erit istud;"
      en: "Thus saith the Lord God: It shall not stand, and this shall not be."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sed caput Syriae Damascus, et caput Damasci Rasin; et adhuc sexaginta et quinque anni, et desinet Ephraim esse populus;"
      en: "But the head of Syria is Damascus, and the head of Damascus is Rasin: and within threescore and five years, Ephraim shall cease to be a people:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et caput Ephraim Samaria, et caput Samariae filius Romeliae. Si non credideritis, non permanebitis."
      en: "And the head of Ephraim is Samaria and the head of Samaria the son of Romelia. If you will not believe, you shall not continue."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et adjecit Dominus loqui ad Achaz, dicens:"
      en: "And the Lord spoke again to Achaz, saying:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Pete tibi signum a Domino Deo tuo, in profundum inferni, sive in excelsum supra."
      en: "Ask thee a sign of the Lord thy God either unto the depth of hell, or unto the height above."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et dixit Achaz: Non petam, et non tentabo Dominum."
      en: "And Achaz said: I will not ask, and I will not tempt the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et dixit: Audite ergo, domus David. Numquid parum vobis est molestos esse hominibus, quia molesti estis et Deo meo?"
      en: "And he said: Hear ye therefore, O house of David: Is it a small thing for you to be grievous to men, that you are grievous to my God also?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Propter hoc dabit Dominus ipse vobis signum: ecce virgo concipiet, et pariet filium, et vocabitur nomen ejus Emmanuel."
      en: "Therefore the Lord himself shall give you a sign. Behold a virgin shall conceive, and bear a son, and his name shall be called Emmanuel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Butyrum et mel comedet, ut sciat reprobare malum, et eligere bonum."
      en: "He shall eat butter and honey, that he may know to refuse the evil, and to choose the good."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quia antequam sciat puer reprobare malum et eligere bonum, derelinquetur terra quam tu detestaris a facie duorum regum suorum."
      en: "For before the child know to refuse the evil, and to choose the good, the land which thou abhorrest shall be forsaken of the face of her two kings."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Adducet Dominus super te, et super populum tuum, et super domum patris tui, dies qui non venerunt a diebus separationis Ephraim a Juda, cum rege Assyriorum."
      en: "The Lord shall bring upon thee, and upon thy people, and upon the house of thy father, days that have not come since the time of the separation of Ephraim from Juda with the king of the Assyrians."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et erit in die illa: sibilabit Dominus muscae quae est in extremo fluminum Aegypti, et api quae est in terra Assur;"
      en: "And it shall come to pass in that day, that the Lord shall hiss for the fly, that is in the uttermost parts of the rivers of Egypt, and for the bee that is in the land of Assyria."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et venient, et requiescent omnes in torrentibus vallium, et in cavernis petrarum, et in omnibus frutetis, et in universis foraminibus."
      en: "And they shall come, and shall all of them rest in the torrents of the valleys, and in the holes of the rocks, and upon all places set with shrubs, and in all hollow places."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "In die illa radet Dominus in novacula conducta in his qui trans flumen sunt, in rege Assyriorum, caput et pilos pedum, et barbam universam."
      en: "In that day the Lord shall shave with a razor that is hired by them that are beyond the river, by the king of the Assyrians, the head and the hairs of the feet, and the whole beard."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et erit in die illa: nutriet homo vaccam boum, et duas oves,"
      en: "And it shall come to pass in that day, that a man shall nourish a young cow, and two sheep."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et prae ubertate lactis comedet butyrum; butyrum enim et mel manducabit omnis qui relictus fuerit in medio terrae."
      en: "And for the abundance of milk he shall eat butter: for butter and honey shall every one eat that shall be left in the midst of the land."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et erit in die illa: omnis locus ubi fuerint mille vites, mille argenteis, in sinas et in vepres erunt."
      en: "And it shall come to pass in that day, that every place where there were a thousand vines, at a thousand pieces of silver, shall become thorns and briers."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Cum sagittis et arcu ingredientur illuc: vepres enim et spinae erunt in universa terra."
      en: "With arrows and with bows they shall go in thither: for briars and thorns shall be in all the land."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et omnes montes qui in sarculo sarrientur, non veniet illuc terror spinarum et veprium: et erit in pascua bovis, et in conculcationem pecoris."
      en: "And as for all the hills that shall be raked with a rake, the fear of thorns and briers shall not come thither, but they shall be for the ox to feed on, and the lesser cattle to tread upon."
    status: { la: verified, en: verified }
