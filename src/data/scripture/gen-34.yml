# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 34
verses:
  - n: 1
    text:
      la: "Egressa est autem Dina filia Liae ut videret mulieres regionis illius."
      en: "And Dina the daughter of Lia went out to see the women of that country."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quam cum vidisset Sichem filius Hemor Hevaei, princeps terrae illius, adamavit eam: et rapuit, et dormivit cum illa, vi opprimens virginem."
      en: "And when Sichem the son of Hemor the Hevite, the prince of that land, saw her, he was in love with her: and took her away, and lay with her, ravishing the virgin."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et conglutinata est anima ejus cum ea, tristemque delinivit blanditiis."
      en: "And his soul was fast knit unto her, and whereas she was sad, he comforted her with sweet words."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et pergens ad Hemor patrem suum: Accipe, inquit, mihi puellam hanc conjugem."
      en: "And going to Hemor his father, he said: Get me this damsel to wife."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quod cum audisset Jacob absentibus filiis, et in pastu pecorum occupatis, siluit donec redirent."
      en: "But when Jacob had heard this, his sons being absent, and employed in feeding the cattle, he held his peace till they came back."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Egresso autem Hemor patre Sichem ut loqueretur ad Jacob,"
      en: "And when Hemor the father of Sichem was come out to speak to Jacob,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ecce filii ejus veniebant de agro: auditoque quod acciderat, irati sunt valde, eo quod foedam rem operatus esset in Israel et, violata filia Jacob, rem illicitam perpetrasset."
      en: "Behold his sons came from the field: and hearing what had passed, they were exceeding angry, because he had done a foul thing in Israel, and committed an unlawful act, in ravishing Jacob's daughter,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Locutus est itaque Hemor ad eos: Sichem filii mei adhaesit anima filiae vestrae: date eam illi uxorem:"
      en: "And Hemor spoke to them: The soul of my son Sichem has a longing for your daughter: give her him to wife:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et jungamus vicissim connubia: filias vestras tradite nobis, et filias nostras accipite,"
      en: "And let us contract marriages one with another: give us your daughters and take you our daughters,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et habitate nobiscum: terra in potestate vestra est: exercete, negotiamini, et possidete eam."
      en: "And dwell with us: the land is at your command, till, trade, and possess it."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sed et Sichem ad patrem et ad fratres ejus ait: Inveniam gratiam coram vobis: et quaecumque statueritis, dabo:"
      en: "Sichem also said to her father and to her brethren: Let me find favour in your sight: and whatsoever you shall appoint I will give."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "augete dotem, et munera postulate, et libenter tribuam quod petieritis: tantum date mihi puellam hanc uxorem."
      en: "Raise the dowry, and ask gifts, and I will gladly give what you shall demand: only give me this damsel to wife."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Responderunt filii Jacob Sichem et patri ejus in dolo, saevientes ob stuprum sororis:"
      en: "The sons of Jacob answered Sichem and his father deceitfully, being enraged at the deflowering of their sister:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Non possumus facere quod petitis, nec dare sororem nostram homini incircumciso: quod illicitum et nefarium est apud nos."
      en: "We cannot do what you demand, nor give our sister to one that is uncircumcised, which with us is unlawful and abominable."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Sed in hoc valebimus foederari, si volueritis esse similes nostri, et circumcidatur in vobis omne masculini sexus;"
      en: "But in this we may be allied with you, if you will be like us, and all the male sex among you be circumcised:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tunc dabimus et accipiemus mutuo filias vestras ac nostras: et habitabimus vobiscum, erimusque unus populus."
      en: "Then will we mutually give and take your daughters, and ours: and we will dwell with you, and will be one people:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Si autem circumcidi nolueritis, tollemus filiam nostram, et recedemus."
      en: "But if you will not be circumcised, we will take our daughter and depart:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Placuit oblatio eorum Hemor, et Sichem filio ejus,"
      en: "Their offer pleased Hemor, and Sichem his son:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "nec distulit adolescens quin statim quod petebatur expleret: amabat enim puellam valde, et ipse erat inclytus in omni domo patris sui."
      en: "And the young man made no delay, but forthwith fulfilled what was required, for he loved the damsel exceedingly, and he was the greatest man in all his father's house."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Ingressique portam urbis, locuti sunt ad populum:"
      en: "And going into the gate of the city they spoke to the people:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Viri isti pacifici sunt, et volunt habitare nobiscum: negotientur in terra, et exerceant eam, quae spatiosa et lata cultoribus indiget: filias eorum accipiemus uxores, et nostras illis dabimus."
      en: "These men are peaceable and willing to dwell with us: let them trade in the land, and till it, which being large and wide wanteth men to till it: we shall take their daughters for wives, and we will give them ours."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Unum est quo differtur tantum bonum: si circumcidamus masculos nostros, ritum gentis imitantes."
      en: "One thing there is for which so great a good is deferred: We must circumcise every male among us, following the manner of the nation."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et substantia eorum, et pecora, et cuncta quae possident, nostra erunt: tantum in hoc acquiescamus, et habitantes simul, unum efficiemus populum."
      en: "And their substance, and cattle, and all that they possess, shall be ours: only in this let us condescend, and by dwelling together, we shall make one people."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Assensique sunt omnes, circumcisis cunctis maribus."
      en: "And they all agreed, and circumcised all the males."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et ecce, die tertio, quando gravissimus vulnerum dolor est: arreptis duo filii Jacob, Simeon et Levi fratres Dinae, gladiis, ingressi sunt urbem confidenter: interfectisque omnibus masculis,"
      en: "And behold the third day, when the pain of the wound was greatest, two of the sons of Jacob, Simeon and Levi, the brothers of Dina, taking their swords, entered boldly into the city, and slew all the men:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Hemor et Sichem pariter necaverunt, tollentes Dinam de domo Sichem sororem suam."
      en: "And they killed also Hemor and Sichem, and took away their sister Dina, out of Sichem's house."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Quibus egressis, irruerunt super occisos ceteri filii Jacob: et depopulati sunt urbem in ultionem stupri."
      en: "And when they were gone out, the other sons of Jacob came upon the slain; and plundered the city in revenge of the rape."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Oves eorum, et armenta, et asinos, cunctaque vastantes quae in domibus et in agris erant,"
      en: "And they took their sheep and their herds and their asses, wasting all they had in their houses and in the fields."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "parvulos quoque eorum et uxores duxerunt captivas."
      en: "And their children and wives they took captive,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Quibus patratis audacter, Jacob dixit ad Simeon et Levi: Turbastis me, et odiosum fecistis me Chananaeis, et Pherezaeis habitatoribus terrae hujus: nos pauci sumus; illi congregati percutient me, et delebor ego, et domus mea."
      en: "And when they had boldly perpetrated these things, Jacob said to Simeon and Levi: You have troubled me, and made me hateful to the Chanaanites and Pherezites, the inhabitants of this land: we are few: they will gather themselves together and kill me; and both I, and my house, shall be destroyed."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Responderunt: Numquid ut scorto abuti debuere sorore nostra?"
      en: "They answered: Should they abuse our sister as a strumpet?"
    status: { la: verified, en: verified }
