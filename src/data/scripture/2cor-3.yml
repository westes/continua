# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2cor
chapter: 3
verses:
  - n: 1
    text:
      la: "Incipimus iterum nosmetipsos commendare? aut numquid egemus ( sicut quidam) commendatiis epistolis ad vos, aut ex vobis?"
      en: "Do we begin again to commend ourselves? Or do we need (as some do) epistles of commendation to you, or from you?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Epistola nostra vos estis, scripta in cordibus nostris, quae scitur, et legitur ab omnibus hominibus:"
      en: "You are our epistle, written in our hearts, which is known and read by all men:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "manifestati quod epistola estis Christi, ministrata a nobis, et scripta non atramento, sed Spiritu Dei vivi: non in tabulis lapideis, sed in tabulis cordis carnalibus."
      en: "Being manifested, that you are the epistle of Christ, ministered by us, and written not with ink, but with the Spirit of the living God; not in tables of stone, but in the fleshly tables of the heart."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Fiduciam autem talem habemus per Christum ad Deum:"
      en: "And such confidence we have, through Christ, towards God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "non quod sufficientes simus cogitare aliquid a nobis, quasi ex nobis: sed sufficientia nostra ex Deo est:"
      en: "Not that we are sufficient to think any thing of ourselves, as of ourselves: but our sufficiency is from God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui et idoneos nos fecit ministros novi testamenti: non littera, sed Spiritu: littera enim occidit, Spiritus autem vivificat."
      en: "Who also hath made us fit ministers of the new testament, not in the letter, but in the spirit. For the letter killeth, but the spirit quickeneth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quod si ministratio mortis litteris deformata in lapidibus fuit in gloria, ita ut non possent intendere filii Israel in faciem Moysi propter gloriam vultus ejus, quae evacuatur:"
      en: "Now if the ministration of death, engraven with letters upon stones, was glorious; so that the children of Israel could not steadfastly behold the face of Moses, for the glory of his countenance, which is made void:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quomodo non magis ministratio Spiritus erit in gloria?"
      en: "How shall not the ministration of the spirit be rather in glory?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Nam si ministratio damnationis gloria est: multo magis abundat ministerium justitiae in gloria."
      en: "For if the ministration of condemnation be glory, much more the ministration of justice aboundeth in glory."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nam nec glorificatum est, quod claruit in hac parte, propter excellentem gloriam."
      en: "For even that which was glorious in this part was not glorified, by reason of the glory that excelleth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Si enim quod evacuatur, per gloriam est: multo magis quod manet, in gloria est."
      en: "For if that which is done away was glorious, much more that which remaineth is in glory."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Habentes igitur talem spem, multa fiducia utimur:"
      en: "Having therefore such hope, we use much confidence:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et non sicut Moyses ponebat velamen super faciem suam, ut non intenderent filii Israel in faciem ejus, quod evacuatur,"
      en: "And not as Moses put a veil upon his face, that the children of Israel might not steadfastly look on the face of that which is made void."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sed obtusi sunt sensus eorum. Usque in hodiernum enim diem, idipsum velamen in lectione veteris testamenti manet non revelatum ( quoniam in Christo evacuatur),"
      en: "But their senses were made dull. For, until this present day, the selfsame veil, in the reading of the old testament, remaineth not taken away (because in Christ it is made void)."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sed usque in hodiernum diem, cum legitur Moyses, velamen positum est super cor eorum."
      en: "But even until this day, when Moses is read, the veil is upon their heart."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cum autem conversus fuerit ad Dominum, auferetur velamen."
      en: "But when they shall be converted to the Lord, the veil shall be taken away."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dominus autem Spiritus est: ubi autem Spiritus Domini, ibi libertas."
      en: "Now the Lord is a Spirit. And where the Spirit of the Lord is, there is liberty."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Nos vero omnes, revelata facie gloriam Domini speculantes, in eamdem imaginem transformamur a claritate in claritatem, tamquam a Domini Spiritu."
      en: "But we all beholding the glory of the Lord with open face, are transformed into the same image from glory to glory, as by the Spirit of the Lord."
    status: { la: verified, en: verified }
