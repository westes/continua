# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1par
chapter: 13
verses:
  - n: 1
    text:
      la: "iniit autem consilium David cum tribunis et centurionibus et universis principibus"
      en: "And David consulted with the captains of thousands, and of hundreds, and with all the commanders."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ait ad omnem coetum Israhel si placet vobis et a Domino Deo nostro egreditur sermo quem loquor mittamus ad fratres nostros reliquos in universas regiones Israhel et ad sacerdotes et Levitas qui habitant in suburbanis urbium ut congregentur ad nos"
      en: "And he said to all the assembly of Israel: If it please you; and if the words which I speak come from the Lord our God, let us send to the rest of our brethren into all the countries of Israel, and to the priests, and the Levites, that dwell in the suburbs of the cities, to gather themselves to us,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et reducamus arcam Dei nostri ad nos non enim requisivimus eam in diebus Saul"
      en: "And let us bring again the ark of our God to us: for we sought it not in the days of Saul."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et respondit universa multitudo ut ita fieret placuerat enim sermo omni populo"
      en: "And all the multitude answered that it should be so: for the word pleased all the people."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "congregavit ergo David cunctum Israhel a Sior Aegypti usque dum ingrediaris Emath ut adduceret arcam Dei de Cariathiarim"
      en: "So David assembled all Israel from Sihor of Egypt, even to the entering into Emath, to bring the ark of God from Cariathiarim."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et ascendit David et omnis vir Israhel ad collem Cariathiarim quae est in Iuda ut adferrent inde arcam Dei Domini sedentis super cherubin ubi invocatum est nomen eius"
      en: "And David went up with all the men of Israel to the hill of Cariathiarim which is in Juda, to bring thence the ark of the Lord God sitting upon the cherubims, where his name is called upon."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "inposueruntque arcam Dei super plaustrum novum de domo Aminadab Oza autem et fratres eius minabant plaustrum"
      en: "And they carried the ark of God upon a new cart, out of the house of Abinadab. And Oza and his brother drove the cart."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "porro David et universus Israhel ludebant coram Deo omni virtute in canticis et in citharis et psalteriis et tympanis et cymbalis et tubis"
      en: "And David and all Israel played before God with all their might with hymns, and with harps, and with psalteries, and timbrels, and cymbals, and trumpets,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cum autem pervenissent ad aream Chidon tetendit Oza manum suam ut sustentaret arcam bos quippe lasciviens paululum inclinaverat eam"
      en: "And when they came to the floor of Chidon, Oza put forth his hand, to hold up the ark: for the ox being wanton had made it lean a little on one side."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "iratus est itaque Dominus contra Ozam et percussit eum eo quod contigisset arcam et mortuus est ibi coram Deo"
      en: "And the Lord was angry with Oza, and struck him, because he had touched the ark; and he died there before the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "contristatusque David eo quod divisisset Dominus Ozam vocavit locum illum Divisio Oza usque in praesentem diem"
      en: "And David was troubled because the Lord had divided Oza: and he called that place the Breach of Oza to this day."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et timuit Deum tunc temporis dicens quomodo possum ad me introducere arcam Dei"
      en: "And he feared God at that time, saying: How can I bring in the ark of God to me?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et ob hanc causam non eam adduxit ad se hoc est in civitatem David sed avertit in domum Obededom Getthei"
      en: "And therefore he brought it not home to himself, that is, into the city of David, but carried it aside into the house of Obededom the Gethite."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "mansit ergo arca Dei in domo Obededom tribus mensibus et benedixit Dominus domui eius et omnibus quae habebat"
      en: "And the ark of God remained in the house of Obededom three months: and the Lord blessed his house, and all that he had."
    status: { la: verified, en: verified }
