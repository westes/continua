# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 22
verses:
  - n: 1
    text:
      la: "Onus vallis Visionis. Quidnam quoque tibi est, quia ascendisti et tu omnis in tecta?"
      en: "The burden of the valley of vision. What aileth thee also, that thou too art wholly gone up to the housetops?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Clamoris plena, urbs frequens, civitas exsultans; interfecti tui, non interfecti gladio, nec mortui in bello."
      en: "Full of clamour, a populous city, a joyous city: thy slain are not slain by the sword, nor dead in battle."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cuncti principes tui fugerunt simul dureque ligati sunt; omnes qui inventi sunt vincti sunt pariter; procul fugerunt."
      en: "All the princes are fled together, and are bound hard: all that were found, are bound together, they are fled far off."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Propterea dixi: Recedite a me: amare flebo; nolite incumbere ut consolemini me super vastitate filiae populi mei;"
      en: "Therefore have I said: Depart from me, I will weep bitterly: labour not to comfort me, for the devastation of the daughter of my people."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dies enim interfectionis, et conculcationis, et fletuum, Domino Deo exercituum, in valle Visionis, scrutans murum, et magnificus super montem."
      en: "For it is a day of slaughter and of treading down, and of weeping to the Lord the God of hosts in the valley of vision, searching the wall, and magnificent upon the mountain."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et Aelam sumpsit pharetram, currum hominis equitis, et parietem nudavit clypeus."
      en: "And Elam took the quiver, the chariot of the horseman, and the shield was taken down from the wall."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et erunt electae valles tuae plenae quadrigarum, et equites ponent sedes suas in porta."
      en: "And thy choice valleys shall be full of chariots, and the horseman shall place themselves in the gate."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et revelabitur operimentum Judae, et videbis in die illa armamentarium domus saltus."
      en: "And the covering of Juda shall be discovered, and thou shalt see in that day the armoury of the house of the forest."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et scissuras civitatis David videbitis, quia multiplicatae sunt; et congregastis aquas piscinae inferioris,"
      en: "And you shall see the breaches of the city of David, that they are many: and you have gathered together the waters of the lower pool,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et domos Jerusalem numerastis, et destruxistis domos ad muniendum murum."
      en: "And have numbered the houses of Jerusalem, and broken down houses to fortify the wall."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et lacum fecistis inter duos muros ad aquam piscinae veteris; et non suspexistis ad eum qui fecerat eam, et operatorem ejus de longe non vidistis."
      en: "And you made a ditch between the two walls for the water of the old pool: and you have not looked up to the maker thereof, nor regarded him even at a distance, that wrought it long ago."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et vocabit Dominus Deus exercituum in die illa ad fletum, et ad planctum, ad calvitium, et ad cingulum sacci;"
      en: "And the Lord, the God of hosts, in that day shall call to weeping, and to mourning, to baldness, and to girding with sackcloth:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et ecce gaudium et laetitia, occidere vitulos et jugulare arietes, comedere carnes, et bibere vinum: comedamus et bibamus, cras enim moriemur."
      en: "And behold joy and gladness, killing calves, and slaying rams, eating flesh, and drinking wine: Let us eat and drink; for tomorrow we shall die."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et revelata est in auribus meis vox Domini exercituum: Si dimittetur iniquitas haec vobis donec moriamini, dicit Dominus Deus exercituum."
      en: "And the voice of the Lord of hosts was revealed in my ears: Surely this iniquity shall not be forgiven you till you die, saith the Lord God of hosts."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Haec dicit Dominus Deus exercituum: Vade, ingredere ad eum qui habitat in tabernaculo, ad Sobnam, praepositum templi, et dices ad eum:"
      en: "Thus saith the Lord God of hosts: Go, get thee in to him that dwelleth in the tabernacle, to Sobna who is over the temple: and thou shalt say to him:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quid tu hic, aut quasi quis hic? quia excidisti tibi hic sepulchrum, excidisti in excelso memoriale diligenter, in petra tabernaculum tibi."
      en: "What dost thou here, or as if thou wert somebody here? for thou hast hewed thee out a sepulchre here, thou hast hewed out a monument carefully in a high place, a dwelling for thyself in a rock."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ecce Dominus asportari te faciet, sicut asportatur gallus gallinaceus; et quasi amictum, sic sublevabit te."
      en: "Behold the Lord will cause thee to be carried away, as a cock is carried away, and he will lift thee up as a garment."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Coronas cornonabit te tribulatione; quasi pilam mittet te in terram latam et spatiosam; ibi morieris, et ibi erit currus gloriae tuae, ignominia domus domini tui."
      en: "He will crown thee with a crown of tribulation, he will toss thee like a ball into a large and spacious country: there shalt thou die, and there shall the chariot of thy glory be, the shame of the house of thy Lord."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et expellam te de statione tua, et de ministerio tuo deponam te."
      en: "And I will drive thee out from thy station, and depose thee from thy ministry."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et erit in die illa: vocabo servum meum Eliacim, filium Helciae,"
      en: "And it shall come to pass in that day, that I will call my servant Eliacim the son of Helcias,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et induam illum tunica tua, et cingulo tuo confortabo eum, et potestatem tuam dabo in manu ejus; et erit quasi pater habitantibus Jerusalem et domui Juda."
      en: "And I will clothe him with thy robe, and will strengthen him with thy girdle, and will give thy power into his hand: and he shall be as a father to the inhabitants of Jerusalem, and to the house of Juda."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et dabo clavem domus David super humerum ejus; et aperiet, et non erit qui claudat; et claudet, et non erit qui aperiat."
      en: "And I will lay the key of the house of David upon his shoulder: and he shall open, and none shall shut: and he shall shut, and none shall open."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et figam illum paxillum in loco fideli, et erit in solium gloriae domui patris ejus."
      en: "And I will fasten him as a peg in a sure place, and he shall be for a throne of glory to the house of his father."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et suspendent super eum omnem gloriam domus patris ejus; vasorum diversa genera, omne vas parvulum, a vasis craterarum usque ad omne vas musicorum."
      en: "And they shall hang upon him all the glory of his father's house, divers kinds of vessels, every little vessel, from the vessels of cups even to every instrument of music."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "In die illa, dicit Dominus exercituum, auferetur paxillus qui fixus fuerat in loco fideli, et frangetur, et cadet, et peribit quod pependerat in eo, quia Dominus locutus est."
      en: "In that day, saith the Lord of hosts, shall the peg be removed, that was fastened in the sure place: and it shall be broken and shall fall: and that which hung thereon, shall perish, because the Lord hath spoken it."
    status: { la: verified, en: verified }
