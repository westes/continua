# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: cant
chapter: 6
verses:
  - n: 1
    text:
      la: "SPONSA. Dilectus meus descendit in hortum suum ad areolam aromatum, ut pascatur in hortis, et lilia colligat."
      en: "My beloved is gone down into his garden, to the bed of aromatical spices, to feed in the gardens, and to gather lilies."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ego dilecto meo, et dilectus meus mihi, qui pascitur inter lilia."
      en: "I to my beloved, and my beloved to me, who feedeth among the lilies."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "SPONSUS. Pulchra es, amica mea; suavis, et decora sicut Jerusalem; terribilis ut castrorum acies ordinata."
      en: "Thou art beautiful, O my love, sweet and comely as Jerusalem: terrible as an army set in array."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Averte oculos tuos a me, quia ipsi me avolare fecerunt. Capilli tui sicut grex caprarum quae apparuerunt de Galaad."
      en: "Turn away thy eyes from me, for they have made me flee away. Thy hair is as a flock of goats, that appear from Galaad."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dentes tui sicut grex ovium quae ascenderunt de lavacro: omnes gemellis foetibus, et sterilis non est in eis."
      en: "Thy teeth as a flock of sheep, which come up from the washing, all with twins, and there is none barren among them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Sicut cortex mali punici, sic genae tuae, absque occultis tuis."
      en: "Thy cheeks are as the bark of a pomegranate, beside what is hidden within thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Sexaginta sunt reginae, et octoginta concubinae, et adolescentularum non est numerus."
      en: "There are threescore queens, and fourscore concubines, and young maidens without number."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Una est columba mea, perfecta mea, una est matris suae, electa genetrici suae. Viderunt eam filiae, et beatissimam praedicaverunt; reginae et concubinae, et laudaverunt eam."
      en: "One is my dove, my perfect one is but one, she is the only one of her mother, the chosen of her that bore her. The daughters saw her, and declared her most blessed: the queens and concubines, and they praised her."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quae est ista quae progreditur quasi aurora consurgens, pulchra ut luna, electa ut sol, terribilis ut castrorum acies ordinata?"
      en: "Who is she that cometh forth as the morning rising, fair as the moon, bright as the sun, terrible as an army set in array?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "SPONSA. Descendi in hortum nucum, ut viderem poma convallium, et inspicerem si floruisset vinea, et germinassent mala punica."
      en: "I went down into the garden of nuts, to see the fruits of the valleys, and to look if the vineyard had flourished, and the pomegranates budded."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Nescivi: anima mea conturbavit me, propter quadrigas Aminadab."
      en: "I knew not: my soul troubled me for the chariots of Aminadab."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "CHORUS. Revertere, revertere, Sulamitis! revertere, revertere ut intueamur te."
      en: "Return, return, O Sulamitess: return, return that we may behold thee."
    status: { la: verified, en: verified }
