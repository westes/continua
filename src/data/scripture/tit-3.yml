# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: tit
chapter: 3
verses:
  - n: 1
    text:
      la: "Admone illos principibus, et potestatibus subditos esse, dicto obedire, ad omne opus bonum paratos esse:"
      en: "Admonish them to be subject to princes and powers, to obey at a word, to be ready to every good work."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "neminem blasphemare, non litigiosos esse, sed modestos, omnem ostendentes mansuetudinem ad omnes homines."
      en: "To speak evil of no man, not to be litigious, but gentle: shewing all mildness towards all men."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Eramus enim aliquando et nos insipientes, increduli, errantes, servientes desideriis, et voluptatibus variis, in malitia et invidia agentes, odibiles, odientes invicem."
      en: "For we ourselves also were some time unwise, incredulous, erring, slaves to divers desires and pleasures, living in malice and envy, hateful, and hating one another."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cum autem benignitas et humanitas apparuit Salvatoris nostri Dei,"
      en: "But when the goodness and kindness of God our Saviour appeared:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "non ex operibus justitiae, quae fecimus nos, sed secundum suam misericordiam salvos nos fecit per lavacrum regenerationis et renovationis Spiritus Sancti,"
      en: "Not by the works of justice, which we have done, but according to his mercy, he saved us, by the laver of regeneration, and renovation of the Holy Ghost;"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quem effudit in nos abunde per Jesum Christum Salvatorem nostrum:"
      en: "Whom he hath poured forth upon us abundantly, through Jesus Christ our Saviour:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ut justificati gratia ipsius, haeredes simus secundum spem vitae aeternae."
      en: "That, being justified by his grace, we may be heirs, according to hope of life everlasting."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Fidelis sermo est: et de his volo te confirmare: ut curent bonis operibus praeesse qui credunt Deo. Haec sunt bona, et utilia hominibus."
      en: "It is a faithful saying: and these things I will have thee affirm constantly: that they, who believe in God, may be careful to excel in good works. These things are good and profitable unto men."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Stultas autem quaestiones, et genealogias, et contentiones, et pugnas legis devita: sunt enim inutiles, et vanae."
      en: "But avoid foolish questions, and genealogies, and contentions, and strivings about the law. For they are unprofitable and vain."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Haereticum hominem post unam et secundam correptionem devita:"
      en: "A man that is a heretic, after the first and second admonition, avoid:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sciens quia subversus est, qui ejusmodi est, et delinquit, cum sit proprio judicio condemnatus."
      en: "Knowing that he, that is such an one, is subverted, and sinneth, being condemned by his own judgment."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cum misero ad te Artemam, aut Tychicum, festina ad me venire Nicopolim: ibi enim statui hiemare."
      en: "When I shall send to thee Artemas or Tychicus, make haste to come unto me to Nicopolis. For there I have determined to winter."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Zenam legisperitum et Apollo sollicite praemitte, ut nihil illis desit."
      en: "Send forward Zenas, the lawyer, and Apollo, with care, that nothing be wanting to them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Discant autem et nostri bonis operibus praeesse ad usus necessarios: ut non sint infructuosi."
      en: "And let our men also learn to excel in good works for necessary uses: that they be not unfruitful."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Salutant te qui mecum sunt omnes: saluta eos qui nos amant in fide. Gratia Dei cum omnibus vobis. Amen."
      en: "All that are with me salute thee: salute them that love us in the faith. The grace of God be with you all. Amen."
    status: { la: verified, en: verified }
