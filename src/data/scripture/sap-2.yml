# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sap
chapter: 2
verses:
  - n: 1
    text:
      la: "dixerunt enim apud se cogitantes non recte exiguum et cum taedio est tempus vitae nostrae et non est refrigerium in fine hominis et non est qui agnitus sit reversus ab inferis"
      en: "For they have said, reasoning with themselves, but not right: The time of our life is short and tedious, and in the end of a man there is no remedy, and no man hath been known to have returned from hell:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quia ex nihilo nati sumus et post hoc erimus tamquam non fuerimus quoniam fumus afflatus est in naribus nostris et sermo scintillae ad commovendum cor nostrum"
      en: "For we are born of nothing, and after this we shall be as if we had not been: for the breath in our nostrils is smoke: and speech a spark to move our heart,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quia extincta cinis erit corpus et spiritus diffundetur tamquam mollis aer et transiet vita nostra tamquam vestigium nubis et sicut nebula dissolvetur quae fugata est a radiis solis et a calore illius adgravata"
      en: "Which being put out, our body shall be ashes, and our spirit shall be poured abroad as soft air, and our life shall pass away as the trace of a cloud, and shall be dispersed as a mist, which is driven away by the beams of the sun, and overpowered with the heat thereof:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et nomen nostrum oblivionem accipiet per tempus et nemo memoriam habebit operum nostrorum"
      en: "And our name in time shall be forgotten, and no man shall have any remembrance of our works."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "umbrae enim transitus est tempus nostrum et non est reversio finis nostri quoniam consignata est et nemo revertetur"
      en: "For our time is as the passing of a shadow, and there is no going back of our end: for it is fast sealed, and no man returneth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "venite ergo et fruamur bonis quae sunt et utamur creaturam tamquam in iuventute celeriter"
      en: "Come therefore, and let us enjoy the good things that are present, and let us speedily use the creatures as in youth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "vino pretioso et unguentis nos impleamus et non praetereat nos flos temporis"
      en: "Let us fill ourselves with costly wine, and ointments: and let not the flower of the time pass by us."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "coronemus nos rosis antequam marcescant nullum pratum sit quod non pertranseat luxuria nostra"
      en: "Let us crown ourselves with roses, before they be withered: let no meadow escape our riot."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ubique relinquamus signa laetitiae quoniam haec est pars nostra et haec est sors"
      en: "Let none of us go without his part in luxury: let us everywhere leave tokens of joy: for this is our portion, and this our lot."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "opprimamus pauperem iustum et non parcamus viduae nec veterani revereamur canos multi temporis"
      en: "Let us oppress the poor just man, and not spare the widow, nor honour the ancient grey hairs of the aged."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sit autem fortitudo nostra lex iniustitiae quod infirmum est enim inutile invenitur"
      en: "But let our strength be the law of justice: for that which is feeble, is found to be nothing worth."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "circumveniamus ergo iustum quoniam inutilis est nobis et contrarius est operibus nostris et inproperat nobis peccata legis et diffamat in nos peccata disciplinae nostrae"
      en: "Let us therefore lie in wait for the just, because he is not for our turn, and he is contrary to our doings, and upbraideth us with transgressions of the law, and divulgeth against us the sins of our way of life."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "promittit scientiam Dei se habere et filium Dei se nominat"
      en: "He boasteth that he hath the knowledge of God, and calleth himself the son of God."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "factus est nobis in traductionem cogitationum nostrarum"
      en: "He is become a censurer of our thoughts."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "gravis est nobis etiam ad videndum quoniam dissimilis est aliis vita illius et inmutatae sunt viae eius"
      en: "He is grievous unto us, even to behold: for his life is not like other men's, and his ways are very different."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tamquam nugaces aestimati sumus ab illo et abstinet se a viis nostris tamquam ab inmunditiis et praefert novissima iustorum et gloriatur patrem Deum se habere"
      en: "We are esteemed by him as triflers, and he abstaineth from our ways as from filthiness, and he preferreth the latter end of the just, and glorieth that he hath God for his father."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "videamus ergo si sermones illius veri sunt et temptemus quae ventura sunt illi et sciemus quae erunt novissima illius"
      en: "Let us see then if his words be true, and let us prove what shall happen to him, and we shall know what his end shall be."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "si enim est verus filius Dei suscipiet illum et liberabit eum de manu contrariorum"
      en: "For if he be the true son of God, he will defend him, and will deliver him from the hands of his enemies."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "contumelia et tormento interrogemus eum ut sciamus reverentiam illius et probemus patientiam ipsius"
      en: "Let us examine him by outrages and tortures, that we may know his meekness and try his patience."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "morte turpissima condemnemus illum erit enim ei respectus ex sermonibus illius"
      en: "Let us condemn him to a most shameful death: for there shall be respect had unto him by his words."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "haec cogitaverunt et erraverunt excaecavit enim illos malitia eorum"
      en: "These things they thought, and were deceived: for their own malice blinded them."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et nescierunt sacramenta Dei neque mercedem speraverunt iustitiae nec iudicaverunt honorem animarum sanctarum"
      en: "And they knew not the secrets of God, nor hoped for the wages of justice, nor esteemed the honour of holy souls."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quoniam Deus creavit hominem inexterminabilem et ad imaginem suae similitudinis fecit illum"
      en: "For God created man incorruptible, and to the image of his own likeness he made him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "invidia autem diaboli mors introivit in orbem terrarum"
      en: "But by the envy of the devil, death came into the world:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "imitantur autem illum qui sunt ex parte illius"
      en: "And they follow him that are of his side."
    status: { la: verified, en: verified }
