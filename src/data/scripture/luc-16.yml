# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: luc
chapter: 16
verses:
  - n: 1
    text:
      la: "Dicebat autem et ad discipulos suos: Homo quidam erat dives, qui habebat villicum: et hic diffamatus est apud illum quasi dissipasset bona ipsius."
      en: "And he said also to his disciples: There was a certain rich man who had a steward: and the same was accused unto him, that he had wasted his goods."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et vocavit illum, et ait illi: Quid hoc audio de te? redde rationem villicationis tuae: jam enim non poteris villicare."
      en: "And he called him, and said to him: How is it that I hear this of thee? give an account of thy stewardship: for now thou canst be steward no longer."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ait autem villicus intra se: Quid faciam? quia dominus meus aufert a me villicationem. Fodere non valeo, mendicare erubesco."
      en: "And the steward said within himself: What shall I do, because my lord taketh away from me the stewardship? To dig I am not able; to beg I am ashamed."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Scio quid faciam, ut, cum amotus fuero a villicatione, recipiant me in domos suas."
      en: "I know what I will do, that when I shall be removed from the stewardship, they may receive me into their houses."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Convocatis itaque singulis debitoribus domini sui, dicebat primo: Quantum debes domino meo?"
      en: "Therefore calling together every one of his lord's debtors, he said to the first: How much dost thou owe my lord?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "At ille dixit: Centum cados olei. Dixitque illi: Accipe cautionem tuam: et sede cito, scribe quinquaginta."
      en: "But he said: An hundred barrels of oil. And he said to him: Take thy bill and sit down quickly, and write fifty."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Deinde alii dixit: Tu vero quantum debes? Qui ait: Centum coros tritici. Ait illi: Accipe litteras tuas, et scribe octoginta."
      en: "Then he said to another: And how much dost thou owe? Who said: An hundred quarters of wheat. He said to him: Take thy bill, and write eighty."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et laudavit dominus villicum iniquitatis, quia prudenter fecisset: quia filii hujus saeculi prudentiores filiis lucis in generatione sua sunt."
      en: "And the lord commended the unjust steward, forasmuch as he had done wisely: for the children of this world are wiser in their generation than the children of light."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ego vobis dico: facite vobis amicos de mammona iniquitatis: ut, cum defeceritis, recipiant vos in aeterna tabernacula."
      en: "And I say to you: Make unto you friends of the mammon of iniquity; that when you shall fail, they may receive you into everlasting dwellings."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Qui fidelis est in minimo, et in majori fidelis est: et qui in modico iniquus est, et in majori iniquus est."
      en: "He that is faithful in that which is least, is faithful also in that which is greater: and he that is unjust in that which is little, is unjust also in that which is greater."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Si ergo in iniquo mammona fideles non fuistis quod verum est, quis credet vobis?"
      en: "If then you have not been faithful in the unjust mammon; who will trust you with that which is the true?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et si in alieno fideles non fuistis, quod vestrum est, quis dabit vobis?"
      en: "And if you have not been faithful in that which is another's; who will give you that which is your own?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nemo servus potest duobus dominis servire: aut enim unum odiet, et alterum diliget: aut uni adhaerebit, et alterum contemnet. Non potestis Deo servire et mammonae."
      en: "No servant can serve two masters: for either he will hate the one, and love the other; or he will hold to the one, and despise the other. You cannot serve God and mammon."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Audiebant autem omnia haec pharisaei, qui erant avari: et deridebant illum."
      en: "Now the Pharisees, who were covetous, heard all these things: and they derided him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et ait illis: Vos estis qui justificatis vos coram hominibus: Deus autem novit corda vestra: quia quod hominibus altum est, abominatio est ante Deum."
      en: "And he said to them: You are they who justify yourselves before men, but God knoweth your hearts; for that which is high to men, is an abomination before God."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Lex et prophetae usque ad Joannem: ex eo regnum Dei evangelizatur, et omnis in illud vim facit."
      en: "The law and the prophets were until John; from that time the kingdom of God is preached, and every one useth violence towards it."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Facilius est autem caelum et terram praeterire, quam de lege unum apicem cadere."
      en: "And it is easier for heaven and earth to pass, than one tittle of the law to fall."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Omnis qui dimittit uxorem suam et alteram ducit, moechatur: et qui dimissam a viro ducit, moechatur."
      en: "Every one that putteth away his wife, and marrieth another, committeth adultery: and he that marrieth her that is put away from her husband, committeth adultery."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Homo quidam erat dives, qui induebatur purpura et bysso, et epulabatur quotidie splendide."
      en: "There was a certain rich man, who was clothed in purple and fine linen; and feasted sumptuously every day."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et erat quidam mendicus, nomine Lazarus, qui jacebat ad januam ejus, ulceribus plenus,"
      en: "And there was a certain beggar, named Lazarus, who lay at his gate, full of sores,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "cupiens saturari de micis quae cadebant de mensa divitis, et nemo illi dabat: sed et canes veniebant, et lingebant ulcera ejus."
      en: "Desiring to be filled with the crumbs that fell from the rich man's table, and no one did give him; moreover the dogs came, and licked his sores."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Factum est autem ut moreretur mendicus, et portaretur ab angelis in sinum Abrahae. Mortuus est autem et dives, et sepultus est in inferno."
      en: "And it came to pass, that the beggar died, and was carried by the angels into Abraham's bosom. And the rich man also died: and he was buried in hell."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Elevans autem oculos suos, cum esset in tormentis, vidit Abraham a longe, et Lazarum in sinu ejus:"
      en: "And lifting up his eyes when he was in torments, he saw Abraham afar off, and Lazarus in his bosom:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et ipse clamans dixit: Pater Abraham, miserere mei, et mitte Lazarum ut intingat extremum digiti sui in aquam, ut refrigeret linguam meam, quia crucior in hac flamma."
      en: "And he cried, and said: Father Abraham, have mercy on me, and send Lazarus, that he may dip the tip of his finger in water, to cool my tongue: for I am tormented in this flame."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et dixit illi Abraham: Fili, recordare quia recepisti bona in vita tua, et Lazarus similiter mala: nunc autem hic consolatur, tu vero cruciaris:"
      en: "And Abraham said to him: Son, remember that thou didst receive good things in thy lifetime, and likewise Lazarus evil things, but now he is comforted; and thou art tormented."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et in his omnibus inter nos et vos chaos magnum firmatum est: ut hi qui volunt hinc transire ad vos, non possint, neque inde huc transmeare."
      en: "And besides all this, between us and you, there is fixed a great chaos: so that they who would pass from hence to you, cannot, nor from thence come hither."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et ait: Rogo ergo te, pater, ut mittas eum in domum patris mei:"
      en: "And he said: Then, father, I beseech thee, that thou wouldst send him to my father's house, for I have five brethren,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "habeo enim quinque fratres: ut testetur illis, ne et ipsi veniant in hunc locum tormentorum."
      en: "That he may testify unto them, lest they also come into this place of torments."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et ait illi Abraham: Habent Moysen et prophetas: audiant illos."
      en: "And Abraham said to him: They have Moses and the prophets; let them hear them."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "At ille dixit: Non, pater Abraham: sed si quis ex mortuis ierit ad eos, poenitentiam agent."
      en: "But he said: No, father Abraham: but if one went to them from the dead, they will do penance."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Ait autem illi: Si Moysen et prophetas non audiunt, neque si quis ex mortuis resurrexerit, credent."
      en: "And he said to him: If they hear not Moses and the prophets, neither will they believe, if one rise again from the dead."
    status: { la: verified, en: verified }
