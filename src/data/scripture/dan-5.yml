# Douay-Rheims + Latin Vulgate, from drbo.org (Douay-Rheims Bible
# Online) -- the "DR + LV" combined page keeps every verse's Latin
# and English paired in the same block, avoiding the verse-
# misalignment this project's first-pass "Unbound Bible" source had
# for dan 5 specifically; see TODO.md's bulk scripture import entry.
book: dan
chapter: 5
verses:
  - n: 1
    text:
      la: "Baltassar rex fecit grande convivium optimatibus suis mille : et unusquisque secundum suam bibebat aetatem."
      en: "Baltasar the king made a great feast for a thousand of his nobles: and every one drank according to his age."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Praecepit ergo jam temulentus ut afferrentur vasa aurea et argentea, quae asportaverat Nabuchodonosor pater ejus de templo, quod fuit in Ierusalem, ut biberent in eis rex, et optimates ejus, uxoresque ejus, et concubinae."
      en: "And being now drunk he commanded that they should bring the vessels of gold and silver which Nabuchodonosor his father had brought away out of the temple, that was in Jerusalem, that the king and his nobles, and his wives and his concubines, might drink in them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tunc allata sunt vasa aurea, et argentea, quae asportaverat de templo, quod fuerat in Ierusalem : et biberunt in eis rex, et optimates ejus, uxores et concubinae illius."
      en: "Then were the golden and silver vessels brought, which he had brought away out of the temple that was in Jerusalem: and the king and his nobles, his wives and his concubines, drank in them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Bibebant vinum, et laudabant deos suos aureos et argenteos, aereos, ferreos, ligneosque et lapideos."
      en: "They drank wine, and praised their gods of gold, and of silver, of brass, of iron, and of wood, and of stone."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "In eadem hora apparuerunt digiti, quasi manus hominis scribentis contra candelabrum in superficie parietis aulae regiae : et rex aspiciebat articulos manus scribentis."
      en: "In the same hour there appeared fingers, as it were of the hand of a man, writing over against the candlestick upon the surface of the wall of the king's palace: and the king beheld the joints of the hand that wrote."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Tunc facies regis commutata est, et cogitationes ejus conturbabant eum : et compages renum ejus solvebantur, et genua ejus ad se invicem collidebantur."
      en: "Then was the king's countenance changed, and his thoughts troubled him: and the joints of his loins were loosed, and his knees struck one against the other."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Exclamavit itaque rex fortiter ut introducerent magos, Chaldaeos, et aruspices. Et proloquens rex ait sapientibus Babylonis : Quicumque legerit scripturam hanc, et interpretationem ejus manifestam mihi fecerit, purpura vestietur, et torquem auream habebit in collo, et tertius in regno meo erit."
      en: "And the king cried out aloud to bring in the wise men, the Chaldeans, and the soothsayers. And the king spoke, and said to the wise men of Babylon: Whosoever shall read this writing, and shall make known to me the interpretation thereof, shall be clothed with purple, and shall have a golden chain on his neck, and shall be the third man in my kingdom."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Tunc ingressi omnes sapientes regis non potuerunt nec scripturam legere, nec interpretationem indicare regi."
      en: "Then came in all the king's wise men, but they could neither read the writing, nor declare the interpretation to the king."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Unde rex Baltassar satis conturbatus est, et vultus illius immutatus est; sed et optimates ejus turbabantur."
      en: "Wherewith king Baltasar was much troubled, and his countenance was changed: and his nobles also were troubled."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Regina autem pro re, quae acciderat regi et optimatibus ejus, domum convivii ingressa est : et proloquens ait : Rex, in aeternum vive! non te conturbent cogitationes tuae, neque facies tua immutetur."
      en: "Then the queen, on occasion of what had happened to the king, and his nobles, came into the banquet house: and she spoke and said: O king, live for ever: let not thy thoughts trouble thee, neither let thy countenance be changed."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Est vir in regno tuo, qui spiritum deorum sanctorum habet in se, et in diebus patris tui scientia et sapientia inventae sunt in eo : nam et rex Nabuchodonosor pater tuus principem magorum, incantatorum, Chaldaeorum, et aruspicum constituit eum, pater, inquam, tuus, o rex :"
      en: "There is a man in thy kingdom that hath the spirit of the holy gods in him: and in the days of thy father knowledge and wisdom were found in him: for king Nabuchodonosor thy father appointed him prince of the wise men, enchanters, Chaldeans, and soothsayers, thy father, I say, O king:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quia spiritus amplior, et prudentia, intelligentiaque et interpretatio somniorum, et ostensio secretorum, ac solutio ligatorum inventae sunt in eo, hoc est in Daniele : cui rex posuit nomen Baltassar. Nunc itaque Daniel vocetur, et interpretationem narrabit."
      en: "Because a greater spirit, and knowledge, and understanding, and interpretation of dreams, and shewing of secrets, and resolving of difficult things, were found in him, that is, in Daniel: whom the king named Baltassar. Now therefore let Daniel be called for, and he will tell the interpretation."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Igitur introductus est Daniel coram rege : ad quem praefatus rex ait : Tu es Daniel de filiis captivitatis Judae, quem adduxit pater meus rex de Judaea?"
      en: "Then Daniel was brought in before the king. And the king spoke, and said to him: Art thou Daniel of the children of the captivity of Juda, whom my father the king brought out of Judea?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "audivi de te, quoniam spiritum deorum habeas, et scientia, intelligentiaque ac sapientia ampliores inventae sunt in te."
      en: "I have heard of thee, that thou hast the spirit of the gods, and excellent knowledge, and understanding, and wisdom are found in thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et nunc introgressi sunt in conspectu meo sapientes magi, ut scripturam hanc legerent, et interpretationem ejus indicarent mihi : et nequiverunt sensum hujus sermonis edicere."
      en: "And now the wise men the magicians have come in before me, to read this writing, and shew me the interpretation thereof: and they could not declare to me the meaning of this writing."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Porro ego audivi de te, quod possis obscura interpretari, et ligata dissolvere : si ergo vales scripturam legere, et interpretationem ejus indicare mihi, purpura vestieris, et torquem auream circa collum tuum habebis, et tertius in regno meo princeps eris."
      en: "But I have heard of thee, that thou canst interpret obscure things, and resolve difficult things: now if thou art able to read the writing, and to shew me the interpretation thereof, thou shalt be clothed with purple, and shalt have a chain of gold about thy neck, and shalt be the third prince in my kingdom."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ad quae respondens Daniel, ait coram rege : Munera tua sint tibi, et dona domus tuae alteri da : scripturam autem legam tibi, rex, et interpretationem ejus ostendam tibi."
      en: "To which Daniel made answer, and said before the king: Thy rewards be to thyself, and the gifts of thy house give to another: but the writing I will read to thee, O king, and shew thee the interpretation thereof."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "O rex, Deus altissimus regnum et magnificentiam, gloriam et honorem dedit Nabuchodonosor patri tuo."
      en: "O king, the most high God gave to Nabuchodonosor thy father a kingdom, and greatness, and glory, and honour."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et propter magnificentiam, quam dederat ei, universi populi, tribus, et linguae tremebant, et metuebant eum : quos volebat, interficiebat : et quos volebat, percutiebat : et quos volebat, exaltabat : et quos volebat, humiliabat."
      en: "And for the greatness that he gave to him, all people, tribes, and languages trembled, and were afraid of him: whom he would, he slew: and whom he would, he destroyed: and whom he would, he set up: and whom he would, he brought down."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quando autem elevatum est cor ejus, et spiritus illius obfirmatus est ad superbiam, depositus est de solio regni sui, et gloria ejus ablata est :"
      en: "But when his heart was lifted up, and his spirit hardened unto pride, he was put down from the throne of his kingdom, and his glory was taken away."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et a filiis hominum ejectus est, sed et cor ejus cum bestiis positum est, et cum onagris erat habitatio ejus : foenum quoque ut bos comedebat, et rore caeli corpus ejus infectum est, donec cognosceret quod potestatem haberet Altissimus in regno hominum, et quemcumque voluerit, suscitabit super illud."
      en: "And he was driven out from the sons of men, and his heart was made like the beasts, and his dwelling was with the wild asses, and he did eat grass like an ox, and his body was wet with the dew of heaven: till he knew that the most High ruled in the kingdom of men, and that he will set over it whomsoever it shall please him."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Tu quoque, filius ejus Baltassar, non humiliasti cor tuum, cum scires haec omnia :"
      en: "Thou also his son, O Baltasar, hast not humbled thy heart, whereas thou knewest all these things:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sed adversum Dominatorem caeli elevatus es : et vasa domus ejus allata sunt coram te, et tu, et optimates tui, et uxores tuae, et concubinae tuae vinum bibistis in eis : deos quoque argenteos, et aureos, et aereos, ferreos, ligneosque et lapideos, qui non vident, neque audiunt, neque sentiunt, laudasti : porro Deum, qui habet flatum tuum in manu sua, et omnes vias tuas, non glorificasti."
      en: "But hast lifted thyself up against the Lord of heaven: and the vessels of his house have been brought before thee: and thou, and thy nobles, and thy wives, and thy concubines have drunk wine in them: and thou hast praised the gods of silver, and of gold, and of brass, of iron, and of wood, and of stone, that neither see, nor hear, nor feel: but the God who hath thy breath in his hand, and all thy ways, thou hast not glorified."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Idcirco ab eo missus est articulus manus, quae scripsit hoc quod exaratum est."
      en: "Wherefore he hath sent the part of the hand which hath written this that is set down."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Haec est autem scriptura, quae digesta est : Mane, Thecel, Phares."
      en: "And this is the writing that is written: MANE, THECEL, PHARES."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et haec est interpretatio sermonis. Mane : numeravit Deus regnum tuum, et complevit illud."
      en: "And this is the interpretation of the word. MANE: God hath numbered thy kingdom, and hath finished it."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Thecel : appensus es in statera, et inventus es minus habens."
      en: "THECEL: thou art weighed in the balance, and art found wanting."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Phares : divisum est regnum tuum, et datum est Medis, et Persis."
      en: "PHARES: thy kingdom is divided, and is given to the Medes and Persians."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Tunc, jubente rege, indutus est Daniel purpura, et circumdata est torques aurea collo ejus : et praedicatum est de eo quod haberet potestatem tertius in regno suo."
      en: "Then by the king's command Daniel was clothed with purple, and a chain of gold was put about his neck: and it was proclaimed of him that he had power as the third man in the kingdom."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Eadem nocte interfectus est Baltassar rex Chaldaeus."
      en: "The same night Baltasar the Chaldean king was slain."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et Darius Medus successit in regnum, annos natus sexaginta duos."
      en: "And Darius the Mede succeeded to the kingdom, being threescore and two years old."
    status: { la: verified, en: verified }
