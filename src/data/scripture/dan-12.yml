# Douay-Rheims + Latin Vulgate, from drbo.org (Douay-Rheims Bible
# Online) -- the "DR + LV" combined page keeps every verse's Latin
# and English paired in the same block, avoiding the verse-
# misalignment this project's first-pass "Unbound Bible" source had
# for dan 12 specifically; see TODO.md's bulk scripture import entry.
book: dan
chapter: 12
verses:
  - n: 1
    text:
      la: "In tempore autem illo consurget Michael princeps magnus, qui stat pro filiis populi tui : et veniet tempus quale non fuit ab eo ex quo gentes esse coeperunt usque ad tempus illud. Et in tempore illo salvabitur populus tuus, omnis qui inventus fuerit scriptus in libro."
      en: "But at that time shall Michael rise up, the great prince, who standeth for the children of thy people: and a time shall come such as never was from the time that nations began even until that time. And at that time shall thy people be saved, every one that shall be found written in the book."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et multi de his qui dormiunt in terrae pulvere evigilabunt, alii in vitam aeternam, et alii in opprobrium ut videant semper."
      en: "And many of those that sleep in the dust of the earth, shall awake: some unto life everlasting, and others unto reproach, to see it always."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Qui autem docti fuerint, fulgebunt quasi splendor firmamenti : et qui ad justitiam erudiunt multos, quasi stellae in perpetuas aeternitates."
      en: "But they that are learned shall shine as the brightness of the firmament: and they that instruct many to justice, as stars for all eternity."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Tu autem Daniel, claude sermones, et signa librum usque ad tempus statutum : plurimi pertransibunt, et multiplex erit scientia."
      en: "But thou, O Daniel, shut up the words, and seal the book, even to the time appointed: many shall pass over, and knowledge shall be manifold."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et vidi ego Daniel, et ecce quasi duo alii stabant : unus hinc super ripam fluminis, et alius inde ex altera ripa fluminis."
      en: "And I Daniel looked, and behold as it were two others stood: one on this side upon the bank of the river, and another on that side, on the other bank of the river."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et dixi viro qui erat indutus lineis, qui stabat super aquas fluminis : Usquequo finis horum mirabilium?"
      en: "And I said to the man that was clothed in linen, that stood upon the waters of the river: How long shall it be to the end of these wonders?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et audivi virum qui indutus erat lineis, qui stabat super aquas fluminis, cum elevasset dexteram et sinistram suam in caelum, et jurasset per viventem in aeternum, quia in tempus, et tempora, et dimidium temporis. Et cum completa fuerit dispersio manus populi sancti, complebuntur universa haec."
      en: "And I heard the man that was clothed in linen, that stood upon the waters of the river: when he had lifted up his right hand, and his left hand to heaven, and had sworn, by him that liveth for ever, that it should be unto a time, and times, and half a time. And when the scattering of the band of the holy people shall be accomplished, all these things shall be finished."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et ego audivi, et non intellexi. Et dixi : Domine mi, quid erit post haec?"
      en: "And I heard, and understood not. And I said: O my lord, what shall be after these things?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ait : Vade, Daniel, quia clausi sunt signatique sermones usque ad praefinitum tempus."
      en: "And he said: Go, Daniel, because the words are shut up, and sealed until the appointed time."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Eligentur, et dealbabuntur, et quasi ignis probabuntur multi : et impie agent impii, neque intelligent omnes impii : porro docti intelligent."
      en: "Many shall be chosen, and made white, and shall be tried as fire: and the wicked shall deal wickedly, and none of the wicked shall understand, but the learned shall understand."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et a tempore cum ablatum fuerit juge sacrificium, et posita fuerit abominatio in desolationem, dies mille ducenti nonaginta."
      en: "And from the time when the continual sacrifice shall be taken away, and the abomination unto desolation shall be set up, there shall be a thousand two hundred ninety days,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Beatus qui exspectat, et pervenit usque ad dies mille trecentos triginta quinque."
      en: "Blessed is he that waiteth and cometh unto a thousand three hundred thirty-five days."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tu autem vade ad praefinitum : et requiesces, et stabis in sorte tua in finem dierum."
      en: "But go thou thy ways until the time appointed: and thou shalt rest, and stand in thy lot unto the end of the days."
    status: { la: verified, en: verified }
