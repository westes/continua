# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 31
verses:
  - n: 1
    text:
      la: "Et factum est in anno undecimo, tertio mense, una mensis: factum est verbum Domini ad me, dicens:"
      en: "And it came to pass in the eleventh year, the third month, the first day of the month, that the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fili hominis, dic Pharaoni regi Aegypti, et populo ejus: Cui similis factus es in magnitudine tua?"
      en: "Son of man, speak to Pharao king of Egypt, and to his people: To whom art thou like in thy greatness?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ecce Assur quasi cedrus in Libano, pulcher ramis, et frondibus nemorosus, excelsusque altitudine, et inter condensas frondes elevatum est cacumen ejus."
      en: "Behold, the Assyrian was like a cedar in Libanus, with fair branches, and full of leaves, of a high stature, and his top was elevated among the thick boughs."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Aquae nutrierunt illum, abyssus exaltavit illum: flumina ejus manabant in circuitu radicum ejus, et rivos suos emisit ad universa ligna regionis."
      en: "The waters nourished him, the deep set him up on high, the streams thereof ran round about his roots, and it sent forth its rivulets to all the trees of the country."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Propterea elevata est altitudo ejus super omnia ligna regionis: et multiplicata sunt arbusta ejus, et elevati sunt rami ejus prae aquis multis."
      en: "Therefore was his height exalted above all the trees of the country: and his branches were multiplied, and his boughs were elevated because of many waters."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Cumque extendisset umbram suam, in ramis ejus fecerunt nidos omnia volatilia caeli: et sub frondibus ejus genuerunt omnes bestiae saltuum, et sub umbraculo illius habitabat coetus gentium plurimarum."
      en: "And when he had spread forth his shadow, all the fowls of the air made their nests in his boughs, and all the beasts of the forest brought forth their young under his branches, and the assembly of many nations dwelt under his shadow."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Eratque pulcherrimus in magnitudine sua, et in dilatatione arbustorum suorum: erat enim radix illius juxta aquas multas."
      en: "And he was most beautiful for his greatness, and for the spreading of his branches: for his root was near great waters."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cedri non fuerunt altiores illo in paradiso Dei: abietes non adaequaverunt summitatem ejus, et platani non fuerunt aequae frondibus illius: omne lignum paradisi Dei non est assimilatum illi, et pulchritudini ejus."
      en: "The cedars in the paradise of God were not higher than he, the fir trees did not equal his top, neither were the plane trees to be compared with him for branches: no tree in the paradise of God was like him in his beauty."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quoniam speciosum feci eum, et multis condensisque frondibus, et aemulata sunt eum omnia ligna voluptatis, quae erant in paradiso Dei."
      en: "For I made him beautiful and thick set with many branches: and all the trees of pleasure, that were in the paradise of God, envied him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Propterea haec dicit Dominus Deus: Pro eo quod sublimatus est in altitudine, et dedit summitatem suam virentem atque condensam, et elevatum est cor ejus in altitudine sua:"
      en: "Therefore thus saith the Lord God: Because he was exalted in height, and shot up his top green and thick, and his heart was lifted up in his height:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "tradidi eum in manu fortissimi gentium: faciens faciet ei: juxta impietatem ejus ejeci eum."
      en: "I have delivered him into the hands of the mighty one of the nations, he shall deal with him: I have cast him out according to his wickedness."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et succident eum alieni, et crudelissimi nationum, et projicient eum super montes: et in cunctis convallibus corruent rami ejus, et confringentur arbusta ejus in universis rupibus terrae: et recedent de umbraculo ejus omnes populi terrae, et relinquent eum."
      en: "And strangers, and the most cruel of the nations shall cut him down, and cast him away upon the mountains, and his boughs shall fall in every valley, and his branches shall be broken on every rock of the country: and all the people of the earth shall depart from his shadow, and leave him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "In ruina ejus habitaverunt omnia volatilia caeli, et in ramis ejus fuerunt universae bestiae regionis."
      en: "All the fowls of the air dwelt upon his ruins, and all the beasts of the field were among his branches."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quam ob rem non elevabuntur in altitudine sua omnia ligna aquarum, nec ponent sublimitatem suam inter nemorosa atque frondosa: nec stabunt in sublimitate sua omnia quae irrigantur aquis, quia omnes traditi sunt in mortem ad terram ultimam, in medio filiorum hominum, ad eos qui descendunt in lacum."
      en: "For which cause none of the trees by the waters shall exalt themselves for their height: nor shoot up their tops among the thick branches and leaves, neither shall any of them that are watered stand up in their height: for they are all delivered unto death to the lowest parts of the earth, in the midst of the children of men, with them that go down into the pit."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Haec dicit Dominus Deus: In die quando descendit ad inferos, induxi luctum: operui eum abysso, et prohibui flumina ejus, et coercui aquas multas: contristatus est super eum Libanus, et omnia ligna agri concussa sunt."
      en: "Thus saith the Lord God: In the day when he went down to hell, I brought in mourning, I covered him with the deep: and I withheld its rivers, and restrained the many waters: Libanus grieved for him, and all the trees of the field trembled."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "A sonitu ruinae ejus commovi gentes, cum deducerem eum ad infernum cum his qui descendebant in lacum: et consolata sunt in terra infima omnia ligna voluptatis egregia atque praeclara in Libano, universa quae irrigabantur aquis."
      en: "I shook the nations with the sound of his fall, when I brought him down to hell with them that descend into the pit: and all the trees of pleasure, the choice and best in Libanus, all that were moistened with waters, were comforted in the lowest parts of the earth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Nam et ipsi cum eo descendent in infernum ad interfectos gladio: et brachium uniuscujusque sedebit sub umbraculo ejus in medio nationum."
      en: "For they also shall go down with him to hell to them that are slain by the sword: and the arm of every one shall sit down under his shadow in the midst of the nations."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Cui assimilatus es, o inclyte atque sublimis inter ligna voluptatis? ecce deductus es cum lignis voluptatis ad terram ultimam: in medio incircumcisorum dormies, cum eis qui interfecti sunt gladio: ipse est Pharao, et omnis multitudo ejus, dicit Dominus Deus."
      en: "To whom art thou like, O thou that art famous and lofty among the trees of pleasure? Behold, thou art brought down with the trees of pleasure to the lowest parts of the earth: thou shalt sleep in the midst of the uncircumcised, with them that are slain by the sword: this is Pharao, and all his multitude, saith the Lord God."
    status: { la: verified, en: verified }
