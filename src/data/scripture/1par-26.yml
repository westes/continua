# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1par
chapter: 26
verses:
  - n: 1
    text:
      la: "divisiones autem ianitorum de Coritis Mesellemia filius Core de filiis Asaph"
      en: "And the divisions of the porters: of the Corites Meselemia, the son of Core, of the sons of Asaph."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "filii Mesellemiae Zaccharias primogenitus Iadihel secundus Zabadias tertius Iathanahel quartus"
      en: "The sons of Meselemia: Zacharias the firstborn, Jadihel the second, Zabadias the third, Jathanael the fourth,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ahilam quintus Iohanan sextus Helioenai septimus"
      en: "Elam the fifth, Johanan the sixth, Elioenai the seventh."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "filii autem Obededom Semeias primogenitus Iozabad secundus Iohaa tertius Sachar quartus Nathanahel quintus"
      en: "And the sons of Obededom, Semeias the firstborn, Jozabad the second, Joaha the third, Sachar the fourth, Nathanael the fifth,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Amihel sextus Isachar septimus Phollathi octavus quia benedixit illi Dominus"
      en: "Ammiel the sixth, Issachar the seventh, Phollathi the eighth: for the Lord had blessed him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Semeiae autem filio eius nati sunt filii praefecti familiarum suarum erant enim viri fortissimi"
      en: "And to Semei his son were born sons, herds of their families: for they were men of great valour."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "filii ergo Semeiae Othni et Raphahel et Obedihel Zabad fratres eius viri fortissimi Heliu quoque et Samachias"
      en: "The sons then of Semeias were Othni, and Raphael, and Obed, Elizabad, and his brethren most valiant men: and Eliu, and Samachias."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "omnes hii de filiis Obededom ipsi et filii et fratres eorum fortissimi ad ministrandum sexaginta duo de Obededom"
      en: "All these of the sons of Obededom: they, and their sons, and their brethren most able men for service, sixty-two of Obededom."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "porro Mesellamiae filii et fratres robustissimi decem et octo"
      en: "And the sons of Meselemia, and their brethren strong men, were eighteen."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "de Hosa autem id est de filiis Merari Semri princeps non enim habuerat primogenitum et idcirco posuerat eum pater eius in principem"
      en: "And of Hosa, that is, of the sons of Merari: Semri the chief, (for he had not a firstborn, and therefore his father made him chief.)"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Helchias secundus Tabelias tertius Zaccharias quartus omnes hii filii et fratres Hosa tredecim"
      en: "Helcias the second, Tabelias the third, Zacharias the fourth: all these the sons, and the brethren of Hosa, were thirteen."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "hii divisi sunt in ianitores ut semper principes custodiarum sicut et fratres eorum ministrarent in domo Domini"
      en: "Among these were the divisions of the porters, so that the chiefs of the wards, as well as their brethren, always ministered in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "missae sunt autem sortes ex aequo et parvis et magnis per familias suas in unamquamque portarum"
      en: "And they cast lots equally, both little and great, by their families for every one of the gates."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "cecidit igitur sors orientalis Selemiae porro Zacchariae filio eius viro prudentissimo et erudito sortito obtigit plaga septentrionalis"
      en: "And the lot of the east fell to Selemias. But to his son Zacharias, a very wise and learned man, the north gate fell by lot."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Obededom vero et filiis eius ad austrum in qua parte domus erat seniorum concilium"
      en: "And to Obededom and his sons that towards the south: in which part of the house was the council of the ancients."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sepphima et Hosa ad occidentem iuxta portam quae ducit ad viam ascensionis custodia contra custodiam"
      en: "To Sephim, and Hosa towards the west, by the gate which leadeth to the way of the ascent: ward against ward."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ad orientem vero Levitae sex et ad aquilonem quattuor per diem atque ad meridiem similiter in die quattuor et ubi erat concilium bini et bini"
      en: "Now towards the east were six Levites: and towards the north four a day: and towards the south likewise four a day: and where the council was, two and two."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "in cellulis quoque ianitorum ad occidentem quattuor in via binique per cellulas"
      en: "In the cells also of the porters toward the west four in the way: and two at every cell."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "hae sunt divisiones ianitorum filiorum Core et Merari"
      en: "These are the divisions of the porters of the sons of Core, and of Merari."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "porro Achias erat super thesauros domus Dei ac vasa sanctorum"
      en: "Now Achias was over the treasures of the house of God, and the holy vessels."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "filii Ledan filii Gersonni de Ledan principes familiarum Ledan et Gersonni Ieiheli"
      en: "The sons of Ledan, the sons of Gersonni: of Ledan were heads of the families, of Ledan, and Gersonni, Jehieli."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "filii Ieiheli Zathan et Iohel frater eius super thesauros domus Domini"
      en: "The sons of Jehieli: Zathan and Joel, his brethren over the treasures of the house of the Lord,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Amramitis et Isaaritis et Hebronitis et Ozihelitibus"
      en: "With the Amramites, and Isaarites, and Hebronites, and Ozielites."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Subahel autem filius Gersom filii Mosi praepositus thesauris"
      en: "And Subael the son of Gersom, the son of Moses, was chief over the treasures."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "fratres quoque eius Eliezer cuius filius Raabia et huius filius Isaias et huius filius Ioram huius quoque filius Zechri sed et huius filius Selemith"
      en: "His brethren also, Eliezer, whose son Rohobia, and his son Isaias, and his son Joram, and his son Zechri, and his son Selemith."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ipse Selemith et fratres eius super thesauros sanctorum quae sanctificavit David rex et principes familiarum et tribuni et centuriones et duces exercitus"
      en: "Which Selemith and his brethren were over the treasures of the holy things, which king David, and the heads of families, and the captains over thousands and over hundreds, and the captains of the host had dedicated,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "de bellis et manubiis proeliorum quae consecraverant ad instaurationem et supellectilem templi Domini"
      en: "Out of the wars, and the spoils won in battles, which they had consecrated to the building and furniture of the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "haec autem universa sanctificavit Samuhel videns et Saul filius Cis et Abner filius Ner et Ioab filius Sarviae omnes qui sanctificaverunt ea per manum Salemith et fratrum eius"
      en: "And all these things that Samuel the seer and Saul the son of Cis, and Abner the son of Ner, and Joab the son of Sarvia had sanctified: and whosoever had sanctified those things, they were under the hand of Selemith and his brethren."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Saaritis vero praeerat Chonenias et filii eius ad opera forinsecus super Israhel ad docendum et ad iudicandum eos"
      en: "But Chonenias and his sons were over the Isaarites, for the business abroad over Israel to teach them and judge them."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "porro de Hebronitis Asabias et fratres eius viri fortissimi mille septingenti praeerant Israheli trans Iordanem contra occidentem in cunctis operibus Domini et in ministerium regis"
      en: "And of the Hebronites Hasabias, and his brethren most able men, a thousand seven hundred had the charge over Israel beyond the Jordan westward, in all the works of the Lord, and for the service of the king."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Hebronitarum autem princeps fuit Hieria secundum familias et cognationes eorum quadragesimo anno regni David recensiti sunt et inventi viri fortissimi in Iazer Galaad"
      en: "And the chief of the Hebronites was Jeria according to their families and kindreds. In the fortieth year of the reign of David they were numbered, and there were found most valiant men in Jazer Galaad,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "fratresque eius robustioris aetatis duo milia septingenti principes familiarum praeposuit autem eos David rex Rubenitis et Gadditis et dimidio tribus Manasse in omne ministerium Dei et regis"
      en: "And his brethren of stronger age, two thousand seven hundred chiefs of families. And king David made them rulers over the Rubenites and the Gadites, and the half tribe of Manasses, for all the service of God, and the king."
    status: { la: verified, en: verified }
