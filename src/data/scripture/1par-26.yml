# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1par
chapter: 26
verses:
  - n: 1
    text:
      la: "Divisiones autem janitorum: de Coritis Meselemia, filius Core, de filiis Asaph."
      en: "And the divisions of the porters: of the Corites Meselemia, the son of Core, of the sons of Asaph."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Filii Meselemiae: Zacharias primogenitus, Jadihel secundus, Zabadias tertius, Jathanael quartus,"
      en: "The sons of Meselemia: Zacharias the firstborn, Jadihel the second, Zabadias the third, Jathanael the fourth,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Aelam quintus, Johanan sextus, Elioenai septimus."
      en: "Elam the fifth, Johanan the sixth, Elioenai the seventh."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Filii autem Obededom: Semeias primogenitus, Jozabad secundus, Joaha tertius, Sachar quartus, Nathanael quintus,"
      en: "And the sons of Obededom, Semeias the firstborn, Jozabad the second, Joaha the third, Sachar the fourth, Nathanael the fifth,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ammiel sextus, Issachar septimus, Phollathi octavus: quia benedixit illi Dominus."
      en: "Ammiel the sixth, Issachar the seventh, Phollathi the eighth: for the Lord had blessed him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Semei autem filio ejus nati sunt filii, praefecti familiarum suarum: erant enim viri fortissimi."
      en: "And to Semei his son were born sons, herds of their families: for they were men of great valour."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Filii ergo Semeiae: Othni, et Raphael, et Obed, Elzabad, fratres ejus viri fortissimi: Eliu quoque et Samachias."
      en: "The sons then of Semeias were Othni, and Raphael, and Obed, Elizabad, and his brethren most valiant men: and Eliu, and Samachias."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Omnes hi, de filiis Obededom: ipsi, et filii, et fratres eorum fortissimi ad ministrandum, sexaginta duo de Obededom."
      en: "All these of the sons of Obededom: they, and their sons, and their brethren most able men for service, sixty-two of Obededom."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Porro Meselemiae filii, et fratres eorum robustissimi, decem et octo."
      en: "And the sons of Meselemia, and their brethren strong men, were eighteen."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "De Hosa autem, id est, de filiis Merari: Semri princeps ( non enim habuerat primogenitum, et idcirco posuerat eum pater ejus in principem),"
      en: "And of Hosa, that is, of the sons of Merari: Semri the chief, (for he had not a firstborn, and therefore his father made him chief.)"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Helcias secundus, Tabelias tertius, Zacharias quartus: omnes hi filii, et fratres Hosa, tredecim."
      en: "Helcias the second, Tabelias the third, Zacharias the fourth: all these the sons, and the brethren of Hosa, were thirteen."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Hi divisi sunt in janitores, ut semper principes custodiarum, sicut et fratres eorum ministrarent in domo Domini."
      en: "Among these were the divisions of the porters, so that the chiefs of the wards, as well as their brethren, always ministered in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Missae sunt ergo sortes ex aequo, et parvis, et magnis, per familias suas in unamquamque portarum."
      en: "And they cast lots equally, both little and great, by their families for every one of the gates."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cecidit ergo sors orientalis, Selemiae. Porro Zachariae filio ejus, viro prudentissimo, et erudito, sortito obtigit plaga septentrionalis."
      en: "And the lot of the east fell to Selemias. But to his son Zacharias, a very wise and learned man, the north gate fell by lot."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Obededom vero et filiis ejus ad austrum: in qua parte domus erat senrioum concilium."
      en: "And to Obededom and his sons that towards the south: in which part of the house was the council of the ancients."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sephim, et Hosa ad occidentem, juxta portam, quae ducit ad viam ascensionis: custodia contra custodiam."
      en: "To Sephim, and Hosa towards the west, by the gate which leadeth to the way of the ascent: ward against ward."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ad orentem vero Levitae sex: et ad aquilonem, quatuor per diem: atque ad meridiem similiter in die quatuor: et ubi erat concilium bini et bini."
      en: "Now towards the east were six Levites: and towards the north four a day: and towards the south likewise four a day: and where the council was, two and two."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "In cellulis quoque janitorum ad occidentem quatuor in via, binique per cellulas."
      en: "In the cells also of the porters toward the west four in the way: and two at every cell."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Hae sunt divisiones janitorum filiorum Core et Merari."
      en: "These are the divisions of the porters of the sons of Core, and of Merari."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Porro Achias erat super thesauros domus Dei, et vasa sanctorum."
      en: "Now Achias was over the treasures of the house of God, and the holy vessels."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Filii Ledan, filii Gersonni: de Ledan principes familiarum Ledan, et Gersonni, Jehieli."
      en: "The sons of Ledan, the sons of Gersonni: of Ledan were heads of the families, of Ledan, and Gersonni, Jehieli."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Filii Jehieli: Zathan, et Joel fratres ejus super thesauros domus Domini."
      en: "The sons of Jehieli: Zathan and Joel, his brethren over the treasures of the house of the Lord,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Amramitis, et Isaaritis, et Hebronitis, et Ozihelitis."
      en: "With the Amramites, and Isaarites, and Hebronites, and Ozielites."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Subael autem filius Gersom, filii Moysi, praepositus thesauris."
      en: "And Subael the son of Gersom, the son of Moses, was chief over the treasures."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Fratres quoque ejus Eliezer, cujus filius Rahabia, et hujus filius Isaias, et hujus filius Joram, hujus quoque filius Zechri, et hujus filius Selemith."
      en: "His brethren also, Eliezer, whose son Rohobia, and his son Isaias, and his son Joram, and his son Zechri, and his son Selemith."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Ipse Selemith, et fratres ejus, super thesauros sanctorum, quae sanctificavit David rex, et principes familiarum, et tribuni, et centuriones, et duces exercitus,"
      en: "Which Selemith and his brethren were over the treasures of the holy things, which king David, and the heads of families, and the captains over thousands and over hundreds, and the captains of the host had dedicated,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "de bellis, et manubiis praeliorum, quae consecraverant ad instaurationem, et supellectilem templi Domini."
      en: "Out of the wars, and the spoils won in battles, which they had consecrated to the building and furniture of the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Haec autem universa sanctificavit Samuel videns, et Saul filius Cis, et Abner filius Ner, et Joab filius Sarviae: omnes, qui sanctificaverant ea per manum Selemith, et fratrum ejus."
      en: "And all these things that Samuel the seer and Saul the son of Cis, and Abner the son of Ner, and Joab the son of Sarvia had sanctified: and whosoever had sanctified those things, they were under the hand of Selemith and his brethren."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Isaaritis vero praeerat Chonenias, et filii ejus ad opera forinsecus super Israel ad docendum et judicandum eos."
      en: "But Chonenias and his sons were over the Isaarites, for the business abroad over Israel to teach them and judge them."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Porro de Hebronitis Hasabias, et fratres ejus viri fortissimi, mille septingenti praeerant Israeli trans Jordanem contra occidentem, in cunctis operibus Domini, et in ministerium regis."
      en: "And of the Hebronites Hasabias, and his brethren most able men, a thousand seven hundred had the charge over Israel beyond the Jordan westward, in all the works of the Lord, and for the service of the king."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Hebronitarum autem princeps fuit Jeria secundum familias et cognationes eorum. Quadragesimo anno regni David recensiti sunt, et inventi sunt viri fortissimi in Jazer Galaad,"
      en: "And the chief of the Hebronites was Jeria according to their families and kindreds. In the fortieth year of the reign of David they were numbered, and there were found most valiant men in Jazer Galaad,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "fratresque ejus robustioris aetatis, duo millia septingenti principes familiarum. Praeposuit autem eos David rex Rubenitis, et Gadditis, et dimidiae tribui Manasse, in omne ministerium Dei, et regis."
      en: "And his brethren of stronger age, two thousand seven hundred chiefs of families. And king David made them rulers over the Rubenites and the Gadites, and the half tribe of Manasses, for all the service of God, and the king."
    status: { la: verified, en: verified }
