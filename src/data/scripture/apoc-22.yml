# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: apoc
chapter: 22
verses:
  - n: 1
    text:
      la: "Et ostendit mihi fluvium aquae vitae, splendidum tamquam crystallum, procedentem de sede Dei et Agni."
      en: "And he shewed me a river of water of life, clear as crystal, proceeding from the throne of God and of the Lamb."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "In medio plateae ejus, et ex utraque parte fluminis, lignum vitae, afferens fructus duodecim per menses singulos, reddens fructum suum et folia ligni ad sanitatem gentium."
      en: "In the midst of the street thereof, and on both sides of the river, was the tree of life, bearing twelve fruits, yielding its fruits every month, and the leaves of the tree were for the healing of the nations."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et omne maledictum non erit amplius: sed sedes Dei et Agni in illa erunt, et servi ejus servient illi."
      en: "And there shall be no curse any more; but the throne of God and of the Lamb shall be in it, and his servants shall serve him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et videbunt faciem ejus: et nomen ejus in frontibus eorum."
      en: "And they shall see his face: and his name shall be on their foreheads."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et nox ultra non erit: et non egebunt lumine lucernae, neque lumine solis, quoniam Dominus Deus illuminabit illos, et regnabunt in saecula saeculorum."
      en: "And night shall be no more: and they shall not need the light of the lamp, nor the light of the sun, because the Lord God shall enlighten them, and they shall reign for ever and ever."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et dixit mihi: Haec verba fidelissima sunt, et vera. Et Dominus Deus spirituum prophetarum misit angelum suum ostendere servis suis quae oportet fieri cito."
      en: "And he said to me: These words are most faithful and true. And the Lord God of the spirits of the prophets sent his angel to shew his servants the things which must be done shortly."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et ecce venio velociter. Beatus, qui custodit verba prophetiae libri hujus."
      en: "And, Behold I come quickly. Blessed is he that keepeth the words of the prophecy of this book."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et ego Joannes, qui audivi, et vidi haec. Et postquam audissem, et vidissem, cecidi ut adorarem ante pedes angeli, qui mihi haec ostendebat:"
      en: "And I, John, who have heard and seen these things. And after I had heard and seen, I fell down to adore before the feet of the angel, who shewed me these things."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dixit mihi: Vide ne feceris: conservus enim tuus sum, et fratrum tuorum prophetarum, et eorum qui servant verba prophetiae libri hujus: Deum adora."
      en: "And he said to me: See thou do it not: for I am thy fellow servant, and of thy brethren the prophets, and of them that keep the words of the prophecy of this book. Adore God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et dicit mihi: Ne signaveris verba prophetiae libri hujus: tempus enim prope est."
      en: "And he saith to me: Seal not the words of the prophecy of this book: for the time is at hand."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Qui nocet, noceat adhuc: et qui in sordibus est, sordescat adhuc: et qui justus est, justificetur adhuc: et sanctus, sanctificetur adhuc."
      en: "He that hurteth, let him hurt still: and he that is filthy, let him be filthy still: and he that is just, let him be justified still: and he that is holy, let him be sanctified still."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ecce venio cito, et merces mea mecum est, reddere unicuique secundum opera sua."
      en: "Behold, I come quickly; and my reward is with me, to render to every man according to his works."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ego sum alpha et omega, primus et novissimus, principium et finis."
      en: "I am Alpha and Omega, the first and the last, the beginning and the end."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Beati, qui lavant stolas suas in sanguine Agni: ut sit potestas eorum in ligno vitae, et per portas intrent in civitatem."
      en: "Blessed are they that wash their robes in the blood of the Lamb: that they may have a right to the tree of life, and may enter in by the gates into the city."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Foris canes, et venefici, et impudici, et homicidae, et idolis servientes, et omnis qui amat et facit mendacium."
      en: "Without are dogs, and sorcerers, and unchaste, and murderers, and servers of idols, and every one that loveth and maketh a lie."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ego Jesus misi angelum meum testificari vobis haec in ecclesiis. Ego sum radix, et genus David, stella splendida et matutina."
      en: "I Jesus have sent my angel, to testify to you these things in the churches. I am the root and stock of David, the bright and morning star."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et spiritus, et sponsa dicunt: Veni. Et qui audit, dicat: Veni. Et qui sitit, veniat: et qui vult, accipiat aquam vitae, gratis."
      en: "And the spirit and the bride say: Come. And he that heareth, let him say: Come. And he that thirsteth, let him come: and he that will, let him take the water of life, freely."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Contestor enim omni audienti verba prophetiae libri hujus: si quis apposuerit ad haec, apponet Deus super illum plagas scriptas in libro isto."
      en: "For I testify to every one that heareth the words of the prophecy of this book: If any man shall add to these things, God shall add unto him the plagues written in this book."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et si quis diminuerit de verbis libri prophetiae hujus, auferet Deus partem ejus de libro vitae, et de civitate sancta, et de his quae scripta sunt in libro isto:"
      en: "And if any man shall take away from the words of the book of this prophecy, God shall take away his part out of the book of life, and out of the holy city, and from these things that are written in this book."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dicit qui testimonium perhibet istorum. Etiam venio cito: amen. Veni, Domine Jesu."
      en: "He that giveth testimony of these things, saith, Surely I come quickly: Amen. Come, Lord Jesus."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Gratia Domini nostri Jesu Christi cum omnibus vobis. Amen."
      en: "The grace of our Lord Jesus Christ be with you all. Amen."
    status: { la: verified, en: verified }
