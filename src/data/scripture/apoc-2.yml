# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: apoc
chapter: 2
verses:
  - n: 1
    text:
      la: "Angelo Ephesi ecclesiae scribe: Haec dicit, qui tenet septem stellas in dextera sua, qui ambulat in medio septem candelabrorum aureorum:"
      en: "Unto the angel of the church of Ephesus write: These things saith he, who holdeth the seven stars in his right hand, who walketh in the midst of the seven golden candlesticks:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Scio opera tua, et laborem, et patientiam tuam, et quia non potes sustinere malos: et tentasti eos, qui se dicunt apostolos esse, et non sunt: et invenisti eos mendaces:"
      en: "I know thy works, and thy labour, and thy patience, and how thou canst not bear them that are evil, and thou hast tried them, who say they are apostles, and are not, and hast found them liars:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et patientiam habes, et sustinuisti propter nomen meum, et non defecisti."
      en: "And thou hast patience, and hast endured for my name, and hast not fainted."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Sed habeo adversum te, quod caritatem tuam primam reliquisti."
      en: "But I have somewhat against thee, because thou hast left thy first charity."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Memor esto itaque unde excideris: et age poenitentiam, et prima opera fac: sin autem, venio tibi, et movebo candelabrum tuum de loco suo, nisi poenitentiam egeris."
      en: "Be mindful therefore from whence thou art fallen: and do penance, and do the first works. Or else I come to thee, and will move thy candlestick out of its place, except thou do penance."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Sed hoc habes, quia odisti facta Nicolaitarum, quae et ego odi."
      en: "But this thou hast, that thou hatest the deeds of the Nicolaites, which I also hate."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Qui habet aurem, audiat quid Spiritus dicat ecclesiis: Vincenti dabo edere de ligno vitae, quod est in paradiso Dei mei."
      en: "He, that hath an ear, let him hear what the Spirit saith to the churches: To him, that overcometh, I will give to eat of the tree of life, which is in the paradise of my God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et angelo Smyrnae ecclesiae scribe: Haec dicit primus, et novissimus, qui fuit mortuus, et vivit:"
      en: "And to the angel of the church of Smyrna write: These things saith the First and the Last, who was dead, and is alive:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Scio tribulationem tuam, et paupertatem tuam, sed dives es: et blasphemaris ab his, qui se dicunt Judaeos esse, et non sunt, sed sunt synagoga Satanae."
      en: "I know thy tribulation and thy poverty, but thou art rich: and thou art blasphemed by them that say they are Jews and are not, but are the synagogue of Satan."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nihil horum timeas quae passurus es. Ecce missurus est diabolus aliquos ex vobis in carcerem ut tentemini: et habebitis tribulationem diebus decem. Esto fidelis usque ad mortem, et dabo tibi coronam vitae."
      en: "Fear none of those things which thou shalt suffer. Behold, the devil will cast some of you into prison that you may be tried: and you shall have tribulation ten days. Be thou faithful until death: and I will give thee the crown of life."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Qui habet aurem, audiat quid Spiritus dicat ecclesiis: Qui vicerit, non laedetur a morte secunda."
      en: "He, that hath an ear, let him hear what the Spirit saith to the churches: He that shall overcome, shall not be hurt by the second death."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et angelo Pergami ecclesiae scribe: Haec dicit qui habet rhomphaeam utraque parte acutam:"
      en: "And to the angel of the church of Pergamus write: These things, saith he, that hath the sharp two edged sword:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Scio ubi habitas, ubi sedes est Satanae: et tenes nomen meum, et non negasti fidem meam. Et in diebus illis Antipas testis meus fidelis, qui occisus est apud vos ubi Satanas habitat."
      en: "I know where thou dwellest, where the seat of Satan is: and thou holdest fast my name, and hast not denied my faith. Even in those days when Antipas was my faithful witness, who was slain among you, where Satan dwelleth."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sed habeo adversus te pauca: quia habes illic tenentes doctrinam Balaam, qui docebat Balac mittere scandalum coram filiis Israel, edere, et fornicari:"
      en: "But I have against thee a few things: because thou hast there them that hold the doctrine of Balaam, who taught Balac to cast a stumblingblock before the children of Israel, to eat, and to commit fornication:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ita habes et tu tenentes doctrinam Nicolaitarum."
      en: "So hast thou also them that hold the doctrine of the Nicolaites."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Similiter poenitentiam age: si quominus veniam tibi cito, et pugnabo cum illis in gladio oris mei."
      en: "In like manner do penance: if not, I will come to thee quickly, and will fight against them with the sword of my mouth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Qui habet aurem, audiat quid Spiritus dicat ecclesiis: Vincenti dabo manna absconditum, et dabo illi calculum candidum: et in calculo nomen novum scriptum, quod nemo scit, nisi qui accipit."
      en: "He, that hath an ear, let him hear what the Spirit saith to the churches: To him that overcometh, I will give the hidden manna, and will give him a white counter, and in the counter, a new name written, which no man knoweth, but he that receiveth it."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et angelo Thyatirae ecclesiae scribe: Haec dicit Filius Dei, qui habet oculos tamquam flammam ignis, et pedes ejus similes auricalco:"
      en: "And to the angel of the church of Thyatira write: These things saith the Son of God, who hath his eyes like to a flame of fire, and his feet like to fine brass."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Novi opera tua, et fidem, et caritatem tuam, et ministerium, et patientiam tuam, et opera tua novissima plura prioribus."
      en: "I know thy works, and thy faith, and thy charity, and thy ministry, and thy patience, and thy last works which are more than the former."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Sed habeo adversus te pauca: quia permittis mulierem Jezabel, quae se dicit propheten, docere, et seducere servos meos, fornicari, et manducare de idolothytis."
      en: "But I have against thee a few things: because thou sufferest the woman Jezabel, who calleth herself a prophetess, to teach, and to seduce my servants, to commit fornication, and to eat of things sacrificed to idols."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et dedi illi tempus ut poenitentiam ageret: et non vult poenitere a fornicatione sua."
      en: "And I gave her a time that she might do penance, and she will not repent of her fornication."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ecce mittam eam in lectum: et qui moechantur cum ea, in tribulatione maxima erunt, nisi poenitentiam ab operibus suis egerint."
      en: "Behold, I will cast her into a bed: and they that commit adultery with her shall be in very great tribulation, except they do penance from their deeds."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et filios ejus interficiam in morte, et scient omnes ecclesiae, quia ego sum scrutans renes, et corda: et dabo unicuique vestrum secundum opera sua. Vobis autem dico,"
      en: "And I will kill her children with death, and all the churches shall know that I am he that searcheth the reins and hearts, and I will give to every one of you according to your works. But to you I say,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et ceteris qui Thyatirae estis: quicumque non habent doctrinam hanc, et qui non cognoverunt altitudines Satanae, quemadmodum dicunt, non mittam super vos aliud pondus:"
      en: "And to the rest who are at Thyatira: Whosoever have not this doctrine, and who have not known the depths of Satan, as they say, I will not put upon you any other burthen."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "tamen id quod habetis, tenete donec veniam."
      en: "Yet that, which you have, hold fast till I come."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et qui vicerit, et custodierit usque in finem opera mea, dabo illi potestatem super gentes,"
      en: "And he that shall overcome, and keep my works unto the end, I will give him power over the nations."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et reget eas in virga ferrea, et tamquam vas figuli confringentur,"
      en: "And he shall rule them with a rod of iron, and as the vessel of a potter they shall be broken,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "sicut et ego accepi a Patre meo: et dabo illi stellam matutinam."
      en: "As I also have received of my Father: and I will give him the morning star."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Qui habet aurem, audiat quid Spiritus dicat ecclesiis."
      en: "He that hath an ear, let him hear what the Spirit saith to the churches."
    status: { la: verified, en: verified }
