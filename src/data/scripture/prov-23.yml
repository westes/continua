# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 23
verses:
  - n: 1
    text:
      la: "Quando sederis ut comedas cum principe, diligenter attende quae apposita sunt ante faciem tuam."
      en: "When thou shalt sit to eat with a prince, consider diligently what is set before thy face."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et statue cultrum in gutture tuo; si tamen habes in potestate animam tuam."
      en: "And put a knife to thy throat, if it be so that thou have thy soul in thy own power."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ne desideres de cibis ejus, in quo est panis mendacii."
      en: "Be not desirous of his meats, in which is the bread of deceit."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Noli laborare ut diteris, sed prudentiae tuae pone modum."
      en: "Labour not to be rich: but set bounds to thy prudence."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ne erigas oculos tuos ad opes quas non potes habere, quia facient sibi pennas quasi aquilae et volabunt in caelum."
      en: "Lift not up thy eyes to riches which thou canst not have: because they shall make themselves wings like those of an eagle, and shall fly towards heaven."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ne comedas cum homine invido, et ne desideres cibos ejus;"
      en: "Eat not with an envious man, and desire not his meats:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quoniam in similitudinem arioli et conjectoris, aestimat quod ignorat. Comede et bibe, dicet tibi; et mens ejus non est tecum."
      en: "Because like a soothsayer, and diviner, he thinketh that which he knoweth not. Eat and drink, will he say to thee: and his mind is not with thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cibos, quos comederas evomes, et perdes pulchros sermones tuos."
      en: "The meats which thou hadst eaten, thou shalt vomit up: and shalt loose thy beautiful words."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "In auribus insipientium ne loquaris, qui despicient doctrinam eloquii tui."
      en: "Speak not in the ears of fools: because they will despise the instruction of thy speech."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ne attingas parvulorum terminos, et agrum pupillorum ne introeas:"
      en: "Touch not the bounds of little ones: and enter not into the field of the fatherless:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "propinquus enim illorum fortis est, et ipse judicabit contra te causam illorum."
      en: "For their near kinsman is strong: and he will judge their cause against thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ingrediatur ad doctrinam cor tuum, et aures tuae ad verba scientiae."
      en: "Let thy heart apply itself to instruction: and thy ears to words of knowledge."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Noli subtrahere a puero disciplinam; si enim percusseris eum virga, non morietur."
      en: "Withhold not correction from a child: for if thou strike him with the rod, he shall not die."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tu virga percuties eum, et animam ejus de inferno liberabis."
      en: "Thou shalt beat him with the rod, and deliver his soul from hell."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Fili mi, si sapiens fuerit animus tuus, gaudebit tecum cor meum;"
      en: "My son, if thy mind be wise, my heart shall rejoice with thee:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et exsultabunt renes mei, cum locuta fuerint rectum labia tua."
      en: "And my reins shall rejoice, when thy lips shall speak what is right."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Non aemuletur cor tuum peccatores, sed in timore Domini esto tota die;"
      en: "Let not thy heart envy sinners: but be thou in the fear of the Lord all the day long:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quia habebis spem in novissimo, et praestolatio tua non auferetur."
      en: "Because thou shalt have hope in the latter end, and thy expectation shall not be taken away."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Audi, fili mi, et esto sapiens, et dirige in via animum tuum."
      en: "Hear thou, my son, and be wise: and guide thy mind in the way."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Noli esse in conviviis potatorum, nec in comessationibus eorum qui carnes ad vescendum conferunt;"
      en: "Be not in the feasts of great drinkers, nor in their revellings, who contribute flesh to eat:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quia vacantes potibus et dantes symbola consumentur, et vestietur pannis dormitatio."
      en: "Because they that give themselves to drinking, and that club together shall be consumed; and drowsiness shall be clothed with rags."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Audi patrem tuum, qui genuit te, et ne contemnas cum senuerit mater tua."
      en: "Hearken to thy father, that beget thee: and despise not thy mother when she is old."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Veritatem eme, et noli vendere sapientiam, et doctrinam, et intelligentiam."
      en: "Buy truth, and do not sell wisdom, and instruction, and understanding."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Exsultat gaudio pater justi; qui sapientem genuit laetabitur in eo."
      en: "The father of the just rejoiceth greatly: he that hath begotten a wise son, shall have joy in him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Gaudeat pater tuus et mater tua, et exsultet quae genuit te."
      en: "Let thy father, and thy mother be joyful, and let her rejoice that bore thee."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Praebe, fili mi, cor tuum mihi, et oculi tui vias meas custodiant."
      en: "My son, give me thy heart: and let thy eyes keep my ways."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Fovea enim profunda est meretrix, et puteus angustus aliena."
      en: "For a harlot is a deep ditch: and a strange woman is a narrow pit."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Insidiatur in via quasi latro, et quos incautos viderit interficiet."
      en: "She lieth in wait in the way as a robber, and him whom she shall see unwary, she will kill."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Cui vae? cujus patri vae? cui rixae? cui foveae? cui sine causa vulnera? cui suffusio oculorum?"
      en: "Who hath woe? whose father hath woe? who hath contentions? who falls into pits? who hath wounds without cause? who hath redness of eyes?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "nonne his qui commorantur in vino, et student calicibus epotandis?"
      en: "Surely they that pass their time in wine, and study to drink of their cups."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Ne intuearis vinum quando flavescit, cum splenduerit in vitro color ejus: ingreditur blande,"
      en: "Look not upon the wine when it is yellow, when the colour thereof shineth in the glass: it goeth in pleasantly,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "sed in novissimo mordebit ut coluber, et sicut regulus venena diffundet."
      en: "But in the end, it will bite like a snake, and will spread abroad poison like a basilisk."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Oculi tui videbunt extraneas, et cor tuum loquetur perversa."
      en: "Thy eyes shall behold strange women, and thy heart shall utter perverse things."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et eris sicut dormiens in medio mari, et quasi sopitus gubernator, amisso clavo."
      en: "And thou shalt be as one sleeping in the midst of the sea, and as a pilot fast asleep, when the stern is lost."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et dices: Verberaverunt me, sed non dolui; traxerunt me, et ego non sensi. Quando evigilabo, et rursus vina reperiam?"
      en: "And thou shalt say: They have beaten me, but I was not sensible of pain: they drew me, and I felt not: when shall I awake, and find wine again?"
    status: { la: verified, en: verified }
