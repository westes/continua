# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 12
verses:
  - n: 1
    text:
      la: "cumque roboratum fuisset regnum Roboam et confortatum dereliquit legem Domini et omnis Israhel cum eo"
      en: "And when the kingdom of Roboam was strengthened and fortified, he forsook the law of the Lord, and all Israel with him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "anno autem quinto regni Roboam ascendit Sesac rex Aegypti in Hierusalem quia peccaverunt Domino"
      en: "And in the fifth year of the reign of Roboam, Sesac king of Egypt came up against Jerusalem (because they had sinned against the Lord)"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cum mille ducentis curribus et sexaginta milibus equitum nec erat numerus vulgi quod venerat cum eo ex Aegypto Lybies scilicet et Trogoditae et Aethiopes"
      en: "With twelve hundred chariots and threescore thousand horsemen: and the people were without number that came with him out of Egypt, to wit, Libyans, and Troglodites, and Ethiopians."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cepitque civitates munitissimas in Iuda et venit usque Hierusalem"
      en: "And he took the strongest cities in Juda, and came to Jerusalem."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Semeias autem propheta ingressus est ad Roboam et principes Iuda qui congregati fuerant in Hierusalem fugientes Sesac dixitque ad eos haec dicit Dominus vos reliquistis me et ego reliqui vos in manu Sesac"
      en: "And Semeias the prophet came to Roboam, and to the princes of Juda, that were gathered together in Jerusalem, fleeing from Sesac, and he said to them : Thus saith the Lord: You have left me, and I have left you in the hand of Sesac."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "consternatique principes Israhel et rex dixerunt iustus est Dominus"
      en: "And the princes of Israel, and the king, being in a consternation, said: The Lord is just."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "cumque vidisset Dominus quod humiliati essent factus est sermo Domini ad Semeiam dicens quia humiliati sunt non disperdam eos daboque eis pauxillum auxilii et non stillabit furor meus super Hierusalem per manum Sesac"
      en: "And when the Lord saw that they were humbled, the word of the Lord came to Semeias, saying: Because they are humbled, I will not destroy them, and I will give them a little help, and my wrath shall not fall upon Jerusalem by the hand of Sesac."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "verumtamen servient ei ut sciant distantiam servitutis meae et servitutis regni terrarum"
      en: "But yet they shall serve him, that they may know the difference between my service, and the service of a kingdom of the earth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "recessit itaque Sesac rex Aegypti ab Hierusalem sublatis thesauris domus Domini et domus regis omniaque secum tulit et clypeos aureos quos fecerat Salomon"
      en: "So Sesac king of Egypt departed from Jerusalem, taking away the treasures of the house of the Lord, and of the king's house, and he took all with him, and the golden shields that Solomon had made,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "pro quibus fecit rex aeneos et tradidit illos principibus scutariorum qui custodiebant vestibulum palatii"
      en: "Instead of which the king made brazen ones, and delivered them to the captains of the shieldbearers, who guarded the entrance of the palace."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cumque introiret rex domum Domini veniebant scutarii et tollebant eos iterumque referebant ad armamentarium suum"
      en: "And when the king entered into the house of the Lord, the shieldbearers came and took them, and brought them back again to their armoury."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "verumtamen quia humiliati sunt aversa est ab eis ira Domini nec deleti sunt penitus siquidem et in Iuda inventa sunt opera bona"
      en: "But yet because they were humbled, the wrath of the Lord turned away from them, and they were not utterly destroyed: for even in Juda there were found good works."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "confortatus est igitur rex Roboam in Hierusalem atque regnavit quadraginta autem et unius anni erat cum regnare coepisset et decem septemque annis regnavit in Hierusalem urbe quam elegit Dominus ut confirmaret nomen suum ibi de cunctis tribubus Israhel nomenque matris eius Naama Ammanitis"
      en: "King Roboam therefore was strengthened in Jerusalem, and reigned: he was one and forty years old when he began to reign, and he reigned seventeen years in Jerusalem, the city which the Lord chose out of all the tribes of Israel, to establish his name there: and the name of his mother was Naama an Ammonitess."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "fecit autem malum et non praeparavit cor suum ut quaereret Dominum"
      en: "But he did evil, and did not prepare his heart to seek the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "opera vero Roboam prima et novissima scripta sunt in libris Semeiae prophetae et Addo videntis et diligenter exposita pugnaveruntque adversum se Roboam et Hieroboam cunctis diebus"
      en: "Now the acts of Roboam first and last are written in the books of Semeias the prophet, and of Addo the seer, and diligently recorded: and there was war between Roboam and Jeroboam all their days."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et dormivit Roboam cum patribus suis sepultusque est in civitate David et regnavit Abia filius eius pro eo"
      en: "And Roboam slept with his fathers, and was buried in the city of David. And Abia his son reigned in his stead."
    status: { la: verified, en: verified }
