book: ezek
chapter: 43
verses:
  - n: 1
    text:
      la: "et duxit me ad portam quae respiciebat ad viam orientalem"
      en: "And he brought me to the gate that looked towards the east."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ecce gloria Dei Israhel ingrediebatur per viam orientalem et vox erat ei quasi vox aquarum multarum et terra splendebat a maiestate eius"
      en: "And behold the glory of the God of Israel came in by the way of the east: and his voice was like the noise of many waters, and the earth shone with his majesty."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et vidi visionem secundum speciem quam videram quando venit ut disperderet civitatem et species secundum aspectum quem videram iuxta fluvium Chobar et cecidi super faciem meam"
      en: "And I saw the vision according to the appearance which I had seen when he came to destroy the city: and the appearance was according to the vision which I had seen by the river Chobar: and I fell upon my face."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et maiestas Domini ingressa est templum per viam portae quae respiciebat ad orientem"
      en: "And the majesty of the Lord went into the temple by the way of the gate that looked to the east."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et levavit me spiritus et introduxit me in atrium interius et ecce repleta erat gloria Domini domus"
      en: "And the spirit lifted me up and brought me into the inner court: and behold the house was filled with the glory of the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et audivi loquentem ad me de domo et vir qui stabat iuxta me"
      en: "And I heard one speaking to me out of the house, and the man that stood by me,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixit ad me fili hominis locus solii mei et locus vestigiorum pedum meorum ubi habito in medio filiorum Israhel in aeternum et non polluent ultra domus Israhel nomen sanctum meum ipsi et reges eorum in fornicationibus suis et in ruinis regum suorum et in excelsis"
      en: "Said to me: Son of man, the place of my throne, and the place of the soles of my feet, where I dwell in the midst of the children of Israel for ever: and the house of Israel shall no more profane my holy name, they and their kings by their fornications, and by the carcasses of their kings, and by the high places."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui fabricati sunt limen suum iuxta limen meum et postes suos iuxta postes meos et murus erat inter me et eos et polluerunt nomen sanctum meum in abominationibus quas fecerunt propter quod consumpsi eos in ira mea"
      en: "They who have set their threshold by my threshold, and their posts by my posts: and there was but a wall between me and them: and they profaned my holy name by the abominations which they committed: for which reason I consumed them in my wrath."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "nunc ergo repellant procul fornicationem suam et ruinas regum suorum a me et habitabo in medio eorum semper"
      en: "Now therefore let them put away their fornications, and the carcasses of their kings far from me: and I will dwell in the midst of them for ever."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "tu autem fili hominis ostende domui Israhel templum et confundantur ab iniquitatibus suis et metiantur fabricam"
      en: "But thou, son of man, shew to the house of Israel the temple, and let them be ashamed of their iniquities, and let them measure the building:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et erubescant ex omnibus quae fecerunt figuram domus et fabricae eius exitus et introitus et omnem descriptionem eius et universa praecepta eius cunctumque ordinem eius et omnes leges eius ostende eis et scribes in oculis eorum et custodiant omnes descriptiones eius et praecepta illius et faciant ea"
      en: "And be ashamed of all that they have done. Shew them the form of the house, and of the fashion thereof, the goings out and the comings in, and the whole plan thereof, and all its ordinances, and all its order, and all its laws, and thou shalt write it in their sight: that they may keep the whole form thereof, and its ordinances, and do them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ista est lex domus in summitate montis omnes fines eius in circuitu sanctum sanctorum est haec ergo est lex domus"
      en: "This is the law of the house upon the top of the mountain: All its border round about is most holy: this then is the law of the house."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "istae autem mensurae altaris in cubito verissimo qui habebat cubitum et palmum in sinu eius erat cubitus et cubitus in latitudine et definitio usque ad labium eius in circuitu palmus unus haec quoque erat fossa altaris"
      en: "And these are the measures of the altar by the truest cubit, which is a cubit and a handbreadth: the bottom thereof was a cubit, and the breadth a cubit: and the border thereof unto its edge, and round about, one handbreadth: and this was the trench of the altar."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et de sinu terrae usque ad crepidinem novissimam duo cubiti et latitudo cubiti unius et a crepidine maiori usque ad crepidinem minorem quattuor cubiti et latitudo unius cubiti"
      en: "And from the bottom of the ground to the lowest brim two cubits, and the breadth of one cubit: and from the lesser brim to the greater brim four cubits, and the breadth of one cubit."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ipse autem arihel quattuor cubitorum et ab arihel usque sursum cornua quattuor"
      en: "And the Ariel itself was four cubits: and from the Ariel upward were four horns."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et arihel duodecim cubitorum in longitudine per duodecim cubitos latitudinis quadrangulatum aequis lateribus"
      en: "And the Ariel was twelve cubits long, and twelve cubits broad, foursquare, with equal sides."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et crepido quattuordecim cubitorum longitudinis per quattuordecim latitudinis in quattuor angulis eius et corona in circuitu eius dimidii cubitus et sinus eius unius cubiti per circuitum gradus autem eius versi ad orientem"
      en: "And the brim was fourteen cubits long, and fourteen cubits broad in the four corners thereof: and the crown round about it was half a cubit, and the bottom of it one cubit round about: and its steps turned toward the east."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et dixit ad me fili hominis haec dicit Dominus Deus hii sunt ritus altaris in quacumque die fuerit fabricatum ut offeratur super illud holocaustum et effundatur sanguis"
      en: "And he said to me: Son of man, thus saith the Lord God: These are the ceremonies of the altar, in what day soever it shall be made: that holocausts may be offered upon it, and blood poured out."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et dabis sacerdotibus Levitis qui sunt de semine Sadoc qui accedunt ad me ait Dominus Deus ut offerant mihi vitulum de armento pro peccato"
      en: "And thou shalt give to the priests, and the Levites, that are of the race of Sadoc, who approach to me, saith the Lord God, to offer to me a calf of the herd for sin."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et adsumens de sanguine eius pones super quattuor cornua eius et super quattuor angulos crepidinis et super coronam in circuitu et mundabis illud et expiabis"
      en: "And thou shalt take of his blood, and shalt put it upon the four horns thereof, and upon the four corners of the brim, and upon the crown round about: and thou shalt cleanse, and expiate it."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et tolles vitulum qui oblatus fuerit pro peccato et conbures illum in separato loco domus extra sanctuarium"
      en: "And thou shalt take the calf, that is offered for sin: and thou shalt burn him in a separate place of the house without the sanctuary."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et in die secunda offeres hircum caprarum inmaculatum pro peccato et expiabunt altare sicut expiaverunt in vitulo"
      en: "And in the second day thou shalt offer a he goat without blemish for sin: and they shall expiate the altar, as they expiated it with the calf."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "cumque conpleveris expians illud offeres vitulum de armento inmaculatum et arietem de grege inmaculatum"
      en: "And when thou shalt have made an end of the expiation thereof, thou shalt offer a calf of the herd without blemish, and a ram of the flock without blemish."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et offeres eos in conspectu Domini et mittent sacerdotes super eos sal et offerent eos holocaustum Domino"
      en: "And thou shalt offer them in the sight of the Lord: and the priests shall put salt upon them, and shall offer them a holocaust to the Lord."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "septem diebus facies hircum pro peccato cotidie et vitulum de armento et arietem de pecoribus inmaculatos offerent"
      en: "Seven days shalt thou offer a he goat for sill daily: they shall offer also a calf of the herd, and a ram of the flock without blemish."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "septem diebus expiabunt altare et mundabunt illud et implebunt manum eius"
      en: "Seven days shall they expiate the altar, and shall cleanse it: and they shall consecrate it."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "expletis autem diebus in die octava et ultra facient sacerdotes super altare holocausta vestra et quae pro pace offerunt et placatus ero vobis ait Dominus Deus"
      en: "And the days being, expired, on the eighth day and thenceforward, the priests shall offer your holocausts upon the altar, and the peace offerings: and I will be pacified towards you, saith the Lord God."
    status: { la: verified, en: verified }
