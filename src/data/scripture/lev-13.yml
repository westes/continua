# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: lev
chapter: 13
verses:
  - n: 1
    text:
      la: "locutus est Dominus ad Mosen et Aaron dicens"
      en: "And the Lord spoke to Moses and Aaron, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "homo in cuius carne et cute ortus fuerit diversus color sive pustula aut quasi lucens quippiam id est plaga leprae adducetur ad Aaron sacerdotem vel ad unum quemlibet filiorum eius"
      en: "The man in whose skin or flesh shalt arise a different colour or a blister, or as it were something shining, that is, the stroke of the leprosy, shall be brought to Aaron the priest, or any one of his sons."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "qui cum viderit lepram in cute et pilos in album mutatos colorem ipsamque speciem leprae humiliorem cute et carne reliqua plaga leprae est et ad arbitrium eius separabitur"
      en: "And if he see the leprosy in his skin, and the hair turned white, and the place where the leprosy appears lower than the skin and the rest of the flesh: it is the stroke of the leprosy, and upon his judgment he shall be separated."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sin autem lucens candor fuerit in cute nec humilior carne reliqua et pili coloris pristini recludet eum sacerdos septem diebus"
      en: "But if there be a shining whiteness in the skin, and not lower than the other flesh, and the hair be of the former colour, the priest shall shut him up seven days."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et considerabit die septimo et siquidem lepra ultra non creverit nec transierit in cute priores terminos rursum includet eum septem diebus aliis"
      en: "And the seventh day he shall look on him: and if the leprosy be grown no farther, and hath not spread itself in the skin, he shall shut him up again other seven days."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et die septimo contemplabitur si obscurior fuerit lepra et non creverit in cute mundabit eum quia scabies est lavabitque homo vestimenta sua et mundus erit"
      en: "And on the seventh day, he shall look on him: if the leprosy be somewhat obscure, and not spread in the skin, he shall declare him clean, because it is but a scab: and the man shall wash his clothes, and shall be clean."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quod si postquam a sacerdote visus est et redditus munditiae iterum lepra creverit adducetur ad eum"
      en: "But if the leprosy grow again, after he was seen by the priest and restored to cleanness, he shall be brought to him,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et inmunditiae condemnabitur"
      en: "And shall be condemned of uncleanness."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "plaga leprae si fuerit in homine adducetur ad sacerdotem"
      en: "If the stroke of the leprosy be in a man, he shall be brought to the priest,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et videbit eum cumque color albus in cute fuerit et capillorum mutarit aspectum ipsa quoque caro viva apparuerit"
      en: "And he shall view him. And when there shall be a white colour in the skin, and it shall have changed the look of the hair, and the living flesh itself shall appear:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "lepra vetustissima iudicabitur atque inolita cuti contaminabit itaque eum sacerdos et non recludet quia perspicue inmunditia est"
      en: "It shall be judged an inveterate leprosy, and grown into the skin. The priest therefore shall declare him unclean, and shall not shut him up, because he is evidently unclean."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "sin autem effloruerit discurrens lepra in cute et operuerit omnem carnem a capite usque ad pedes quicquid sub aspectu oculorum cadit"
      en: "But if the leprosy spring out running about in the skin, and cover all the skin from the head to the feet, whatsoever falleth under the sight of the eyes,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "considerabit eum sacerdos et teneri lepra mundissima iudicabit eo quod omnis in candorem versa sit et idcirco homo mundus erit"
      en: "The priest shall view him, and shall judge that the leprosy which he has is very clean: because it is all turned into whiteness, and therefore the man shall be clean."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quando vero caro vivens in eo apparuerit"
      en: "But when the live flesh shall appear in him,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "tunc sacerdotis iudicio polluetur et inter inmundos reputabitur caro enim viva si lepra aspergatur inmunda est"
      en: "Then by the judgment of the priest he shall be defiled, and shall be reckoned among the unclean: for live flesh, if it be spotted with leprosy, is unclean."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quod si rursum versa fuerit in alborem et totum hominem operuerit"
      en: "And if again it be turned into whiteness, and cover all the man,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "considerabit eum sacerdos et mundum esse decernet"
      en: "The priest shall view him, and shall judge him to be clean."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "caro et cutis in qua ulcus natum est et sanatum"
      en: "When also there has been an ulcer in the flesh and the skin, and it has been healed,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et in loco ulceris cicatrix apparuerit alba sive subrufa adducetur homo ad sacerdotem"
      en: "And in the place of the ulcer, there appeareth a white scar, or somewhat red, the man shall be brought to the priest:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "qui cum viderit locum leprae humiliorem carne reliqua et pilos versos in candorem contaminabit eum plaga enim leprae orta est in ulcere"
      en: "And when he shall see the place of the leprosy lower than the other flesh, and the hair turned white, he shall declare him unclean, for the plague of leprosy is broken out in the ulcer."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quod si pilus coloris est pristini et cicatrix subobscura et vicina carne non est humilior recludet eum septem diebus"
      en: "But if the hair be of the former colour, and the scar somewhat obscure, and be not lower than the flesh that is near it, he shall shut him up seven days."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et siquidem creverit adiudicabit eum leprae"
      en: "And if it spread, he shall judge him to have the leprosy:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sin autem steterit in loco suo ulceris est cicatrix et homo mundus erit"
      en: "But if it stay in its place, it is but the scar of an ulcer, and the man shall be clean."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "caro et cutis quam ignis exuserit et sanata albam sive rufam habuerit cicatricem"
      en: "The flesh also and skin that hath been burnt, and after it is healed hath a white or a red scar,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "considerabit eam sacerdos et ecce versa est in alborem et locus eius reliqua cute humilior contaminabit eum quia plaga leprae in cicatrice orta est"
      en: "The priest shall view it, and if he see it turned white, and the place thereof is lower than the other skin: he shall declare him unclean, because the evil of leprosy is broken out in the scar."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "quod si pilorum color non fuerit inmutatus nec humilior plaga carne reliqua et ipsa leprae species fuerit subobscura recludet eum septem diebus"
      en: "But if the colour of the hair be not changed, nor the blemish lower than the other flesh, and the appearance of the leprosy be somewhat obscure, he shall shut him up seven days,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et die septimo contemplabitur si creverit in cute lepra contaminabit eum"
      en: "And on the seventh day he shall view him: if the leprosy be grown farther in the skin, he shall declare him unclean."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "sin autem in loco suo candor steterit non satis clarus plaga conbustionis est et idcirco mundabitur quia cicatrix est conbusturae"
      en: "But if the whiteness stay in its place, and be not very clear, it is the sore of a burning, and therefore he shall be cleansed, because it is only the scar of a burning."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "vir sive mulier in cuius capite vel barba germinarit lepra videbit eos sacerdos"
      en: "If the leprosy break out in the head or the beard of a man or woman, the Priest shall see them,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et siquidem humilior fuerit locus carne reliqua et capillus flavus solitoque subtilior contaminabit eos quia lepra capitis ac barbae est"
      en: "And if the place be lower than the other flesh, and the hair yellow, and thinner than usual: he shall declare them unclean, because it is the leprosy of the head and the beard;"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "sin autem viderit et locum maculae aequalem vicinae carni et capillum nigrum recludet eos septem diebus"
      en: "But if he perceive the place of the spot is equal with the flesh that is near it, and the hair black: he shall shut him up seven days,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et die septimo intuebitur si non creverit macula et capillus sui coloris est et locus plagae carni reliquae aequalis"
      en: "And on the seventh day he shall look upon it. If the spot be not grown, and the hair keep its colour, and the place of the blemish be even with the other flesh:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "radetur homo absque loco maculae et includetur septem diebus aliis"
      en: "The man shall be shaven all but the place of the spot, and he shall be shut up other seven days:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "si die septimo visa fuerit stetisse plaga in loco suo nec humilior carne reliqua mundabit eum lotisque vestibus mundus erit"
      en: "If on the seventh day the evil seem to have stayed in its place, and not lower than the other flesh, he shall cleanse him, and his clothes being washed he shall be clean."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "sin autem post emundationem rursus creverit macula in cute"
      en: "But if after his cleansing the spot spread again in the skin,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "non quaeret amplius utrum capillus in flavum colorem sit commutatus quia aperte inmundus est"
      en: "He shall seek no more whether the hair be turned yellow, because he is evidently unclean."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "porro si steterit macula et capilli nigri fuerint noverit hominem esse sanatum et confidenter eum pronuntiet mundum"
      en: "But if the spot be stayed, and the hair be black, let him know that the man is healed, and let him confidently pronounce him clean."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "vir et mulier in cuius cute candor apparuerit"
      en: "If a whiteness appear in the skin of a man or a woman,"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "intuebitur eos sacerdos si deprehenderit subobscurum alborem lucere in cute sciat non esse lepram sed maculam coloris candidi et hominem mundum"
      en: "The priest shall view them. If he find that a darkish whiteness shineth in the skin, let him know that it is not the leprosy, but a white blemish, and that the man is clean."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "vir de cuius capite capilli fluunt calvus ac mundus est"
      en: "The man whose hair falleth off from his head, he is bald and clean:"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et si a fronte ceciderint pili recalvaster et mundus est"
      en: "And if the hair fall from his forehead, he is bald before and clean."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "sin autem in calvitio sive in recalvatione albus vel rufus color fuerit exortus"
      en: "But if in the bald head or in the bald forehead there be risen a white or reddish colour,"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et hoc sacerdos viderit condemnabit eum haut dubiae leprae quae orta est in calvitio"
      en: "And the priest perceive this, he shall condemn him undoubtedly of leprosy which is risen in the bald part."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "quicumque ergo maculatus fuerit lepra et separatus ad arbitrium sacerdotis"
      en: "Now whosoever shall be defiled with the leprosy, and is separated by the judgment of the priest,"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "habebit vestimenta dissuta caput nudum os veste contectum contaminatum ac sordidum se clamabit"
      en: "Shall have his clothes hanging loose, his head bare, his mouth covered with a cloth, and he shall cry out that he is defiled and unclean."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "omni tempore quo leprosus est et inmundus solus habitabit extra castra"
      en: "All the time that he is a leper and unclean, he shall dwell alone without the camp."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "vestis lanea sive linea quae lepram habuerit"
      en: "A woollen or linen garment that shall have the leprosy"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "in stamine atque subtemine aut certe pellis vel quicquid ex pelle confectum est"
      en: "In the warp, and the woof, or a skin. or whatsoever is made of a skin,"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "si alba aut rufa macula fuerit infecta lepra reputabitur ostendeturque sacerdoti"
      en: "If it be infected with a white or red spot, it shall be accounted the leprosy, and shall be shewn to the priest."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "qui consideratam recludet septem diebus"
      en: "And he shall look upon it and shall shut it up seven days:"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "et die septimo rursus aspiciens si crevisse deprehenderit lepra perseverans est pollutum iudicabit vestimentum et omne in quo fuerit inventa"
      en: "51And on the seventh day when he looketh on it again, if he find that it if grown, it is a Axed leprosy: he shall judge the garment unclean, and every thing wherein it shall be found:"
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "et idcirco conburetur flammis"
      en: "And therefore it shall be burnt with fire."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "quod si eam viderit non crevisse"
      en: "But if he see that it is not grown,"
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "praecipiet et lavabunt id in quo lepra est recludetque illud septem diebus aliis"
      en: "He shall give orders, and they shall wash that part wherein the leprosy is, and he shall shut it up other seven days."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "et cum viderit faciem quidem pristinam non reversam nec tamen crevisse lepram inmundum iudicabit et igne conburet eo quod infusa sit in superficie vestimenti vel per totum lepra"
      en: "And when he shall see that the former colour is not returned, nor yet the leprosy spread, he shall judge it unclean, and shall burn it with fire, for the leprosy has taken hold of the outside of the garment, or through the whole."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "sin autem obscurior fuerit locus leprae postquam vestis est lota abrumpet eum et a solido dividet"
      en: "But if the place of the leprosy be somewhat dark, after the garment is washed, he shall tear it off, and divide it from that which is sound."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "quod si ultra apparuerit in his locis quae prius inmaculata erant lepra volatilis et vaga debet igne conburi"
      en: "And if after this there appear in those places that before were without spot, a flying and wandering leprosy: it must be burnt with fire."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "si cessaverit lavabit ea quae pura sunt secundo et munda erunt"
      en: "If it cease, he shall wash with water the parts that are pure, the second time, and they shall be clean."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "ista est lex leprae vestimenti lanei et linei staminis atque subteminis omnisque supellectilis pelliciae quomodo mundari debeat vel contaminari"
      en: "This is the law touching the leprosy of any woollen or linen garment, either in the warp or woof, or any thing of skins, how it ought to be cleansed, or pronounced unclean."
    status: { la: verified, en: verified }
