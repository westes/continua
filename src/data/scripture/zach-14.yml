# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: zach
chapter: 14
verses:
  - n: 1
    text:
      la: "ecce dies veniunt Domini et dividentur spolia tua in medio tui"
      en: "Behold the days of the Lord shall come, and thy spoils shall be divided in the midst of thee."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et congregabo omnes gentes ad Hierusalem in proelium et capietur civitas et vastabuntur domus et mulieres violabuntur et egredietur media pars civitatis in captivitatem et reliquum populi non auferetur ex urbe"
      en: "And I will gather all nations to Jerusalem to battle, and the city shall be taken, and the houses shall be rifled, and the women shall be defiled: and half of the city shall go forth into captivity, and the rest of the people shall not be taken away out of the city."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et egredietur Dominus et proeliabitur contra gentes illas sicut proeliatus est in die certaminis"
      en: "Then the Lord shall go forth, and shall fight against those nations, as when he fought in the day of battle."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et stabunt pedes eius in die illa super montem Olivarum qui est contra Hierusalem ad orientem et scindetur mons Olivarum ex media parte sui ad orientem et occidentem praerupto grandi valde et separabitur medium montis ad aquilonem et medium eius ad meridiem"
      en: "And his feet shall stand in that day upon the mount of Olives, which is over against Jerusalem toward the east: and the mount of Olives shall be divided in the midst thereof to the east, and to the west with a very great opening, and half of the mountain shall be separated to the north, and half thereof to the south."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et fugietis ad vallem montium meorum quoniam coniungetur vallis montium usque ad proximum et fugietis sicut fugistis a facie terraemotus in diebus Oziae regis Iuda et veniet Dominus Deus meus omnesque sancti cum eo"
      en: "And you shall flee to the valley of those mountains, for the valley of the mountains shall be joined even to the next, and you shall flee r as you fled from the face of the earthquake in the days of Ozias king of Juda: and the Lord my God shall come, and all the saints with him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et erit in die illa non erit lux sed frigus et gelu"
      en: "And it shall come to pass in that day, that there shall be no light, but cold and frost."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et erit dies una quae nota est Domino non dies neque nox et in tempore vesperae erit lux"
      en: "And there shall be one day, which is known to the Lord, not day nor night : and in the time of the evening there shall be light."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et erit in die illa exibunt aquae vivae de Hierusalem medium earum ad mare orientale et medium earum ad mare novissimum in aestate et in hieme erunt"
      en: "And it shall come to pass in that day, that living waters shall go out from Jerusalem: half of them to the east sea, and half of them to the last sea: they shall be in summer and in winter."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et erit Dominus rex super omnem terram in die illa erit Dominus unus et erit nomen eius unum"
      en: "And the Lord shall be king over all the earth: in that day there shall be one Lord, and his name shall be one."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et revertetur omnis terra usque ad desertum de colle Remmon ad austrum Hierusalem et exaltabitur et habitabit in loco suo a porta Beniamin usque ad locum portae Prioris usque ad portam Angulorum et a turre Ananehel usque ad torcularia regis"
      en: "And all the land shall return even to the desert, from the hill to Remmon to the south of Jerusalem: and she shall be exalted, and shall dwell in her own place, from the gate of Benjamin even to the place of the former gate, and even to the gate of the corners: and from the tower of Hananeel even to the king's wine- presses."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et habitabunt in ea et anathema non erit amplius sed sedebit Hierusalem secura"
      en: "And people shall dwell in it, and there shall be no more an anathema: but Jerusalem shall sit secure."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et haec erit plaga qua percutiet Dominus omnes gentes quae pugnaverunt adversus Hierusalem tabescet caro uniuscuiusque stantis super pedes suos et oculi eius contabescent in foraminibus suis et lingua eorum contabescet in ore suo"
      en: "And this shall be the plague where with the Lord shall strike all nations that have fought against Jerusalem: the flesh of every one shall consume away while they stand upon their feet, and their eyes shall consume away in their holes, and their tongue shall consume away in their mouth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "in die illo erit tumultus Domini magnus in eis et adprehendet vir manum proximi sui et conseretur manus eius super manum proximi sui"
      en: "In that day there shall be a great tumult from the Lord among them: and a man shall take the hand of his neighbour, and his hand shall be clasped upon his neighbour's hand."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sed et Iudas pugnabit adversus Hierusalem et congregabuntur divitiae omnium gentium in circuitu aurum et argentum et vestes multae satis"
      en: "And even Juda shall fight against Jerusalem: and the riches of all nations round about shall be gathered together, gold, and silver, and garments in great abundance."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et sic erit ruina equi et muli cameli et asini et omnium iumentorum quae fuerint in castris illis sicut ruina haec"
      en: "And the destruction of the horse, and of the mule, and of the camel, and of the ass, and of all the beasts, that shall be in those tents, shall be like this destruction."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et omnes qui reliqui fuerint de universis gentibus quae venerint contra Hierusalem ascendent ab anno in annum ut adorent regem Dominum exercituum et celebrent festivitatem tabernaculorum"
      en: "And all they that shall be left of all nations that came against Jerusalem, shall go up from year to year, to adore the King, the Lord of hosts, and to keep the feast of tabernacles."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et erit qui non ascenderit de familiis terrae ad Hierusalem ut adoret regem Dominum exercituum non erit super eos imber"
      en: "And it shall come to pass, that he that shall not go up of the families of the land to Jerusalem, to adore the King, the Lord of hosts, there shall be no rain upon them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quod si et familia Aegypti non ascenderit et non venerit nec super eos erit sed erit ruina qua percutiet Dominus omnes gentes quae non ascenderint ad celebrandam festivitatem tabernaculorum"
      en: "And if the family of Egypt go not up nor come: neither shall it be upon them, but there shall be destruction wherewith the Lord will strike all nations that will not go up to keep the feast of tabernacles."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "hoc erit peccatum Aegypti et hoc peccatum omnium gentium quae non ascenderint ad celebrandam festivitatem tabernaculorum"
      en: "This shall be the sin of Egypt, and this the sin of all nations, that will not go up to keep the feast of tabernacles."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "in die illo erit quod super frenum equi est sanctum Domino et erunt lebetes in domo Domini quasi fialae coram altari"
      en: "In that day that which is upon the bridle of the horse shall be holy to the Lord: and the caldrons in the house of the Lord shall be as the phials before the altar."
    status: { la: verified, en: verified }
