# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: zach
chapter: 14
verses:
  - n: 1
    text:
      la: "Ecce venient dies Domini, et dividentur spolia tua in medio tui."
      en: "Behold the days of the Lord shall come, and thy spoils shall be divided in the midst of thee."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et congregabo omnes gentes ad Jerusalem in praelium: et capietur civitas, et vastabuntur domus, et mulieres violabuntur: et egredietur media pars civitatis in captivitatem, et reliquum populi non auferetur ex urbe."
      en: "And I will gather all nations to Jerusalem to battle, and the city shall be taken, and the houses shall be rifled, and the women shall be defiled: and half of the city shall go forth into captivity, and the rest of the people shall not be taken away out of the city."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et egredietur Dominus, et praeliabitur contra gentes illas, sicut praeliatus est in die certaminis."
      en: "Then the Lord shall go forth, and shall fight against those nations, as when he fought in the day of battle."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et stabunt pedes ejus in die illa super montem Olivarum, qui est contra Jerusalem ad orientem: et scindetur mons Olivarum ex media parte sui ad orientem et ad occidentem, praerupto grandi valde: et separabitur medium montis ad aquilonem, et medium ejus ad meridiem."
      en: "And his feet shall stand in that day upon the mount of Olives, which is over against Jerusalem toward the east: and the mount of Olives shall be divided in the midst thereof to the east, and to the west with a very great opening, and half of the mountain shall be separated to the north, and half thereof to the south."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et fugietis ad vallem montium eorum, quoniam conjungetur vallis montium usque ad proximum: et fugietis sicut fugistis a facie terraemotus in diebus Oziae regis Juda: et veniet Dominus Deus meus, omnesque sancti cum eo."
      en: "And you shall flee to the valley of those mountains, for the valley of the mountains shall be joined even to the next, and you shall flee as you fled from the face of the earthquake in the days of Ozias king of Juda: and the Lord my God shall come, and all the saints with him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et erit in die illa: non erit lux, sed frigus et gelu."
      en: "And it shall come to pass in that day, that there shall be no light, but cold and frost."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et erit dies una quae nota est Domino, non dies neque nox: et in tempore vesperi erit lux."
      en: "And there shall be one day, which is known to the Lord, not day nor night: and in the time of the evening there shall be light."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et erit in die illa: exibunt aquae vivae de Jerusalem: medium earum ad mare orientale, et medium earum ad mare novissimum: in aestate et in hieme erunt."
      en: "And it shall come to pass in that day, that living waters shall go out from Jerusalem: half of them to the east sea, and half of them to the last sea: they shall be in summer and in winter."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et erit Dominus rex super omnem terram: in die illa erit Dominus unus, et erit nomen ejus unum."
      en: "And the Lord shall be king over all the earth: in that day there shall be one Lord, and his name shall be one."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et revertetur omnis terra usque ad desertum, de colle Remmon ad austrum Jerusalem: et exaltabitur, et habitabit in loco suo, a porta Benjamin usque ad locum portae prioris, et usque ad portam angulorum, et a turre Hananeel usque ad torcularia regis."
      en: "And all the land shall return even to the desert, from the hill to Remmon to the south of Jerusalem: and she shall be exalted, and shall dwell in her own place, from the gate of Benjamin even to the place of the former gate, and even to the gate of the corners: and from the tower of Hananeel even to the king's winepresses."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et habitabunt in ea, et anathema non erit amplius, sed sedebit Jerusalem secura."
      en: "And people shall dwell in it, and there shall be no more an anathema: but Jerusalem shall sit secure."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et haec erit plaga qua percutiet Dominus omnes gentes quae pugnaverunt adversus Jerusalem: tabescet caro uniuscujusque stantis super pedes suos: et oculi ejus contabescent in foraminibus suis, et lingua eorum contabescet in ore suo."
      en: "And this shall be the plague wherewith the Lord shall strike all nations that have fought against Jerusalem: the flesh of every one shall consume away while they stand upon their feet, and their eyes shall consume away in their holes, and their tongue shall consume away in their mouth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "In die illa erit tumultus Domini magnus in eis: et apprehendet vir manum proximi sui, et conseretur manus ejus super manum proximi sui."
      en: "In that day there shall be a great tumult from the Lord among them: and a man shall take the hand of his neighbour, and his hand shall be clasped upon his neighbour's hand."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sed et Judas pugnabit adversus Jerusalem: et congregabuntur divitiae omnium gentium in circuitu, aurum, et argentum, et vestes multae satis."
      en: "And even Juda shall fight against Jerusalem: and the riches of all nations round about shall be gathered together, gold, and silver, and garments in great abundance."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et sic erit ruina equi, et muli, et cameli, et asini, et omnium jumentorum quae fuerint in castris illis, sicut ruina haec."
      en: "And the destruction of the horse, and of the mule, and of the camel, and of the ass, and of all the beasts, that shall be in those tents, shall be like this destruction."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et omnes qui reliqui fuerint de universis gentibus quae venerunt contra Jerusalem, ascendent ab anno in annum ut adorent regem, Dominum exercituum, et celebrent festivitatem tabernaculorum."
      en: "And all they that shall be left of all nations that came against Jerusalem, shall go up from year to year, to adore the King, the Lord of hosts, and to keep the feast of tabernacles."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et erit: qui non ascenderit de familiis terrae ad Jerusalem ut adoret regem, Dominum exercituum, non erit super eos imber."
      en: "And it shall come to pass, that he that shall not go up of the families of the land to Jerusalem, to adore the King, the Lord of hosts, there shall be no rain upon them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quod etsi familia Aegypti non ascenderit et non venerit, nec super eos erit: sed erit ruina, qua percutiet Dominus omnes gentes quae non ascenderint ad celebrandam festivitatem tabernaculorum."
      en: "And if the family of Egypt go not up nor come: neither shall it be upon them, but there shall be destruction wherewith the Lord will strike all nations that will not go up to keep the feast of tabernacles."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Hoc erit peccatum Aegypti, et hoc peccatum omnium gentium quae non ascenderint ad celebrandam festivitatem tabernaculorum."
      en: "This shall be the sin of Egypt, and this the sin of all nations, that will not go up to keep the feast of tabernacles."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "In die illa, erit quod super frenum equi est, sanctum Domino: et erunt lebetes in domo Domini quasi phialae coram altari."
      en: "In that day that which is upon the bridle of the horse shall be holy to the Lord: and the caldrons in the house of the Lord shall be as the phials before the altar."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et erit omnis lebes in Jerusalem et in Juda sanctificatus Domino exercituum: et venient omnes immolantes, et sument ex eis, et coquent in eis: et non erit mercator ultra in domo Domini exercituum in die illo."
      en: "And every caldron in Jerusalem and Juda shall be sanctified to the Lord of hosts: and all that sacrifice shall come, and take of them, and shall seethe in them: and the merchant shall be no more in the house of the Lord of hosts in that day."
    status: { la: verified, en: verified }
