# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: luc
chapter: 7
verses:
  - n: 1
    text:
      la: "Cum autem implesset omnia verba sua in aures plebis, intravit Capharnaum."
      en: "And when he had finished all his words in the hearing of the people, he entered into Capharnaum."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Centurionis autem cujusdam servus male habens, erat moriturus: qui illi erat pretiosus."
      en: "And the servant of a certain centurion, who was dear to him, being sick, was ready to die."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et cum audisset de Jesu, misit ad eum seniores Judaeorum, rogans eum ut veniret et salvaret servum ejus."
      en: "And when he had heard of Jesus, he sent unto him the ancients of the Jews, desiring him to come and heal his servant."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "At illi cum venissent ad Jesum, rogabant eum sollicite, dicentes ei: Quia dignus est ut hoc illi praestes:"
      en: "And when they came to Jesus, they besought him earnestly, saying to him: He is worthy that thou shouldest do this for him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "diligit enim gentem nostram, et synagogam ipse aedificavit nobis."
      en: "For he loveth our nation; and he hath built us a synagogue."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Jesus autem ibat cum illis. Et cum jam non longe esset a domo, misit ad eum centurio amicos, dicens: Domine, noli vexari: non enim sum dignus ut sub tectum meum intres:"
      en: "And Jesus went with them. And when he was now not far from the house, the centurion sent his friends to him, saying: Lord, trouble not thyself; for I am not worthy that thou shouldest enter under my roof."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "propter quod et meipsum non sum dignum arbitratus ut venirem ad te: sed dic verbo, et sanabitur puer meus."
      en: "For which cause neither did I think myself worthy to come to thee; but say the word, and my servant shall be healed."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Nam et ego homo sum sub potestate constitutus, habens sub me milites: et dico huic, Vade, et vadit: et alii, Veni, et venit: et servo meo, Fac hoc, et facit."
      en: "For I also am a man subject to authority, having under me soldiers: and I say to one, Go, and he goeth; and to another, Come, and he cometh; and to my servant, Do this, and he doth it."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quo audito Jesus miratus est: et conversus sequentibus se turbis, dixit: Amen dico vobis, nec in Israel tantam fidem inveni."
      en: "Which Jesus hearing, marvelled: and turning about to the multitude that followed him, he said: Amen I say to you, I have not found so great faith, not even in Israel."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et reversi, qui missi fuerant, domum, invenerunt servum, qui languerat, sanum."
      en: "And they who were sent, being returned to the house, found the servant whole who had been sick."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et factum est: deinceps ibat in civitatem quae vocatur Naim: et ibant cum eo discipuli ejus et turba copiosa."
      en: "And it came to pass afterwards, that he went into a city that is called Naim; and there went with him his disciples, and a great multitude."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cum autem appropinquaret portae civitatis, ecce defunctus efferebatur filius unicus matris suae: et haec vidua erat: et turba civitatis multa cum illa."
      en: "And when he came nigh to the gate of the city, behold a dead man was carried out, the only son of his mother; and she was a widow: and a great multitude of the city was with her."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quam cum vidisset Dominus, misericordia motus super eam, dixit illi: Noli flere."
      en: "Whom when the Lord had seen, being moved with mercy towards her, he said to her: Weep not."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et accessit, et tetigit loculum. ( Hi autem qui portabant, steterunt.) Et ait: Adolescens, tibi dico, surge."
      en: "And he came near and touched the bier. And they that carried it, stood still. And he said: Young man, I say to thee, arise."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et resedit qui erat mortuus, et coepit loqui. Et dedit illum matri suae."
      en: "And he that was dead, sat up, and began to speak. And he gave him to his mother."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Accepit autem omnes timor: et magnificabant Deum, dicentes: Quia propheta magnus surrexit in nobis: et quia Deus visitavit plebem suam."
      en: "And there came a fear on them all: and they glorified God, saying: A great prophet is risen up among us: and, God hath visited his people."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et exiit hic sermo in universam Judaeam de eo, et in omnem circa regionem."
      en: "And this rumour of him went forth throughout all Judea, and throughout all the country round about."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et nuntiaverunt Joanni discipuli ejus de omnibus his."
      en: "And John's disciples told him of all these things."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et convocavit duos de discipulis suis Joannes, et misit ad Jesum, dicens: Tu es qui venturus es, an alium exspectamus?"
      en: "And John called to him two of his disciples, and sent them to Jesus, saying: Art thou he that art to come; or look we for another?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Cum autem venissent ad eum viri, dixerunt: Joannes Baptista misit nos ad te dicens: Tu es qui venturus es, an alium exspectamus?"
      en: "And when the men were come unto him, they said: John the Baptist hath sent us to thee, saying: Art thou he that art to come; or look we for another?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "( In ipsa autem hora multos curavit a languoribus, et plagis, et spiritibus malis, et caecis multis donavit visum.)"
      en: "(And in that same hour, he cured many of their diseases, and hurts, and evil spirits: and to many that were blind he gave sight.)"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et respondens, dixit illis: Euntes renuntiate Joanni quae audistis et vidistis: quia caeci vident, claudi ambulant, leprosi mundantur, surdi audiunt, mortui resurgunt, pauperes evangelizantur:"
      en: "And answering, he said to them: Go and relate to John what you have heard and seen: the blind see, the lame walk, the lepers are made clean, the deaf hear, the dead rise again, to the poor the gospel is preached:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et beatus est quicumque non fuerit scandalizatus in me."
      en: "And blessed is he whosoever shall not be scandalized in me."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et cum discessissent nuntii Joannis, coepit de Joanne dicere ad turbas: Quid existis in desertum videre? arundinem vento agitatam?"
      en: "And when the messengers of John were departed, he began to speak to the multitudes concerning John. What went ye out into the desert to see? a reed shaken with the wind?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Sed quid existis videre? hominem mollibus vestibus indutum? Ecce qui in veste pretiosa sunt et deliciis, in domibus regum sunt."
      en: "But what went you out to see? a man clothed in soft garments? Behold they that are in costly apparel and live delicately, are in the houses of kings."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Sed quid existis videre? prophetam? Utique dico vobis, et plus quam prophetam:"
      en: "But what went you out to see? a prophet? Yea, I say to you, and more than a prophet."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "hic est, de quo scriptum est: Ecce mitto angelum meum ante faciem tuam, qui praeparabit viam tuam ante te."
      en: "This is he of whom it is written: Behold I send my angel before thy face, who shall prepare thy way before thee."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Dico enim vobis: major inter natos mulierum propheta Joanne Baptista nemo est: qui autem minor est in regno Dei, major est illo."
      en: "For I say to you: Amongst those that are born of women, there is not a greater prophet than John the Baptist. But he that is the lesser in the kingdom of God, is greater than he."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et omnis populus audiens et publicani, justificaverunt Deum, baptizati baptismo Joannis."
      en: "And all the people hearing, and the publicans, justified God, being baptized with John's baptism."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Pharisaei autem et legisperiti consilium Dei spreverunt in semetipsos, non baptizati ab eo."
      en: "But the Pharisees and the lawyers despised the counsel of God against themselves, being not baptized by him."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Ait autem Dominus: Cui ergo similes dicam homines generationis hujus? et cui similes sunt?"
      en: "And the Lord said: Whereunto then shall I liken the men of this generation? and to what are they like?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Similes sunt pueris sedentibus in foro, et loquentibus ad invicem, et dicentibus: Cantavimus vobis tibiis, et non saltastis: lamentavimus, et non plorastis."
      en: "They are like to children sitting in the marketplace, and speaking one to another, and saying: We have piped to you, and you have not danced: we have mourned, and you have not wept."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Venit enim Joannes Baptista, neque manducans panem, neque bibens vinum, et dicitis: Daemonium habet."
      en: "For John the Baptist came neither eating bread nor drinking wine; and you say: He hath a devil."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Venit Filius hominis manducans, et bibens, et dicitis: Ecce homo devorator, et bibens vinum, amicus publicanorum et peccatorum."
      en: "The Son of man is come eating and drinking: and you say: Behold a man that is a glutton and a drinker of wine, a friend of publicans and sinners."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et justificata est sapientia ab omnibus filiis suis."
      en: "And wisdom is justified by all her children."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Rogabat autem illum quidam de pharisaeis ut manducaret cum illo. Et ingressus domum pharisaei discubuit."
      en: "And one of the Pharisees desired him to eat with him. And he went into the house of the Pharisee, and sat down to meat."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et ecce mulier, quae erat in civitate peccatrix, ut cognovit quod accubuisset in domo pharisaei, attulit alabastrum unguenti:"
      en: "And behold a woman that was in the city, a sinner, when she knew that he sat at meat in the Pharisee's house, brought an alabaster box of ointment;"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et stans retro secus pedes ejus, lacrimis coepit rigare pedes ejus, et capillis capitis sui tergebat, et osculabatur pedes ejus, et unguento ungebat."
      en: "And standing behind at his feet, she began to wash his feet, with tears, and wiped them with the hairs of her head, and kissed his feet, and anointed them with the ointment."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Videns autem pharisaeus, qui vocaverat eum, ait intra se dicens: Hic si esset propheta, sciret utique quae et qualis est mulier, quae tangit eum: quia peccatrix est."
      en: "And the Pharisee, who had invited him, seeing it, spoke within himself, saying: This man, if he were a prophet, would know surely who and what manner of woman this is that toucheth him, that she is a sinner."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et respondens Jesus, dixit ad illum: Simon, habeo tibi aliquid dicere. At ille ait: Magister, dic."
      en: "And Jesus answering, said to him: Simon, I have somewhat to say to thee. But he said: Master, say it."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Duo debitores erant cuidam foeneratori: unus debebat denarios quingentos, et alius quinquaginta."
      en: "A certain creditor had two debtors, the one who owed five hundred pence, and the other fifty."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Non habentibus illis unde redderent, donavit utrisque. Quis ergo eum plus diligit?"
      en: "And whereas they had not wherewith to pay, he forgave them both. Which therefore of the two loveth him most?"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Respondens Simon dixit: Aestimo quia is cui plus donavit. At ille dixit: Recte judicasti."
      en: "Simon answering, said: I suppose that he to whom he forgave most. And he said to him: Thou hast judged rightly."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Et conversus ad mulierem, dixit Simoni: Vides hanc mulierem? Intravi in domum tuam, aquam pedibus meis non dedisti: haec autem lacrimis rigavit pedes meos, et capillis suis tersit."
      en: "And turning to the woman, he said unto Simon: Dost thou see this woman? I entered into thy house, thou gavest me no water for my feet; but she with tears hath washed my feet, and with her hairs hath wiped them."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Osculum mihi non dedisti: haec autem ex quo intravit, non cessavit osculari pedes meos."
      en: "Thou gavest me no kiss; but she, since she came in, hath not ceased to kiss my feet."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Oleo caput meum non unxisti: haec autem unguento unxit pedes meos."
      en: "My head with oil thou didst not anoint; but she with ointment hath anointed my feet."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Propter quod dico tibi: remittuntur ei peccata multa, quoniam dilexit multum. Cui autem minus dimittitur, minus diligit."
      en: "Wherefore I say to thee: Many sins are forgiven her, because she hath loved much. But to whom less is forgiven, he loveth less."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Dixit autem ad illam: Remittuntur tibi peccata."
      en: "And he said to her: Thy sins are forgiven thee."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Et coeperunt qui simul accumbebant, dicere intra se: Quis est hic qui etiam peccata dimittit?"
      en: "And they that sat at meat with him began to say within themselves: Who is this that forgiveth sins also?"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Dixit autem ad mulierem: Fides tua te salvam fecit: vade in pace."
      en: "And he said to the woman: Thy faith hath made thee safe, go in peace."
    status: { la: verified, en: verified }
