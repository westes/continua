# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 21
verses:
  - n: 1
    text:
      la: "onus deserti maris sicut turbines ab africo veniunt de deserto venit de terra horribili"
      en: "The burden of the desert of the sea. As whirlwinds come from the south, it cometh from the desert from a terrible land."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "visio dura nuntiata est mihi qui incredulus est infideliter agit et qui depopulator est vastat ascende Aelam obside Mede omnem gemitum eius cessare feci"
      en: "A grievous vision is told me: he that is unfaithful dealeth unfaithfully : and he that is a spoiler, spoileth. Go up, O Elam, besiege, O Mede: I have made all the mourning thereof to cease."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "propterea repleti sunt lumbi mei dolore angustia possedit me sicut angustia parientis corrui cum audirem conturbatus sum cum viderem"
      en: "Therefore are my loins filled with pain, anguish hath taken hold of me, as the anguish of a woman in labour: I fell down at the hearing of it, I was troubled at the seeing of it."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "emarcuit cor meum tenebrae stupefecerunt me Babylon dilecta mea posita est mihi in miraculum"
      en: "My heart failed, darkness amazed me: Babylon my beloved is become a wonder to me."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "pone mensam contemplare in specula comedentes bibentes surgite principes arripite clypeum"
      en: "Prepare the table, behold in the watchtower them that eat and drink: arise, ye princes, take up the shield."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "haec enim dixit mihi Dominus vade et pone speculatorem et quodcumque viderit adnuntiet"
      en: "For thus hath the Lord said to me: Go, and set a watchman: and whatsoever he shall see, let him tell."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et vidit currum duorum equitum ascensorem asini et ascensorem cameli et contemplatus est diligenter multo intuitu"
      en: "And he saw a chariot with two horsemen, a rider upon an ass, and a rider upon a camel: and he beheld them diligently with much heed."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et clamavit leo super specula Domini ego sum stans iugiter per diem et super custodiam meam ego sum stans totis noctibus"
      en: "And a lion cried out: I am upon the watchtower of the Lord, standing continually by day: and I am upon my ward, standing whole nights."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ecce iste venit ascensor vir bigae equitum et respondit et dixit cecidit cecidit Babylon et omnia sculptilia deorum eius contrita sunt in terram"
      en: "Behold this man cometh, the rider upon the chariot with two horsemen, and he answered, and said: Babylon is fallen, she is fallen, and all the graven gods thereof are broken unto the ground."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "tritura mea et fili areae meae quae audivi a Domino exercituum Deo Israhel adnuntiavi vobis"
      en: "O my thrashing and the children of my door, that which I have heard of the Lord of hosts, the God of Israel, I have declared unto you."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "onus Duma ad me clamat ex Seir custos quid de nocte custos quid de nocte"
      en: "The burden of Duma calleth to me out of Seir: Watchman, what of the eight? watchman, what of the night?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dixit custos venit mane et nox si quaeritis quaerite convertimini venite"
      en: "The watchman said: The morning cometh, also the night: if you seek, seek: return, come."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "onus in Arabia in saltu ad vesperam dormietis in semitis Dodanim"
      en: "The burden in Arabia. In the forest at evening you shall sleep, in the paths of Dedanim."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "occurrentes sitienti ferte aquam qui habitatis terram austri cum panibus occurrite fugienti"
      en: "Meeting the thirsty bring him water, you that inhabit the land of the south, meet with bread him that fleeth."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "a facie enim gladiorum fugerunt a facie gladii inminentis a facie arcus extenti a facie gravis proelii"
      en: "For they are fled from before the swords, from the sword that hung over them, from the bent bow, from the face of a grievous battle."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quoniam haec dicit Dominus ad me adhuc in uno anno quasi in anno mercennarii et auferetur omnis gloria Cedar"
      en: "For thus saith the Lord to me: Within a year, according to the years of a hireling, all the glory of Cedar shall be taken away."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et reliquiae numeri sagittariorum fortium de filiis Cedar inminuentur Dominus enim Deus Israhel locutus est"
      en: "And the residue of the number of strong archers of the children of Cedar shall be diminished: for the Lord the God of Israel hath spoken it."
    status: { la: verified, en: verified }
