# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: apoc
chapter: 10
verses:
  - n: 1
    text:
      la: "et vidi alium angelum fortem descendentem de caelo amictum nube et iris in capite eius et facies eius erat ut sol et pedes eius tamquam columna ignis"
      en: "And I saw another mighty angel come down from heaven, clothed with a cloud, and a rainbow was on his head, and his face was as the sun, and his feet as pillars of fire."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et habebat in manu sua libellum apertum et posuit pedem suum dextrum supra mare sinistrum autem super terram"
      en: "And he had in his hand a little book open: and he set his right foot upon the sea, and his left foot upon the earth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et clamavit voce magna quemadmodum cum leo rugit et cum clamasset locuta sunt septem tonitrua voces suas"
      en: "And he cried with a loud voice as when a lion roareth. And when he had cried, seven thunders uttered their voices."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et cum locuta fuissent septem tonitrua scripturus eram et audivi vocem de caelo dicentem signa quae locuta sunt septem tonitrua et noli ea scribere"
      en: "And when the seven thunders had uttered their voices, I was about to write: and I heard a voice from heaven saying to me: Seal up the things which the seven thunders have spoken; and write them not."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et angelum quem vidi stantem supra mare et supra terram levavit manum suam ad caelum"
      en: "And the angel, whom I saw standing upon the sea and upon the earth, lifted up his hand to heaven,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et iuravit per viventem in saecula saeculorum qui creavit caelum et ea quae in illo sunt et terram et ea quae in ea sunt et mare et quae in eo sunt quia tempus amplius non erit"
      en: "And he swore by him that liveth for ever and ever, who created heaven, and the things which are therein; and the earth, and the things which are in it; and the sea, and the things which are therein: That time shall be no longer."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sed in diebus vocis septimi angeli cum coeperit tuba canere et consummabitur mysterium Dei sicut evangelizavit per servos suos prophetas"
      en: "But in the days of the voice of the seventh angel, when he shall begin to sound the trumpet, the mystery of God shall be finished, as he hath declared by his servants the prophets."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et vox quam audivi de caelo iterum loquentem mecum et dicentem vade accipe librum apertum de manu angeli stantis supra mare et supra terram"
      en: "And I heard a voice from heaven again speaking to me, and saying: Go, and take the book that is open, from the hand of the angel who standeth upon the sea, and upon the earth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et abii ad angelum dicens ei ut daret mihi librum et dicit mihi accipe et devora illum et faciet amaricare ventrem tuum sed in ore tuo erit dulce tamquam mel"
      en: "And I went to the angel, saying unto him, that he should give me the book. And he said to me: Take the book, and eat it up: and it shall make thy belly bitter, but in thy mouth it shall be sweet as honey."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et accepi librum de manu angeli et devoravi eum et erat in ore meo tamquam mel dulce et cum devorassem eum amaricatus est venter meus"
      en: "And I took the book from the hand of the angel, and ate it up: and it was in my mouth, sweet as honey: and when I had eaten it, my belly was bitter."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dicunt mihi oportet te iterum prophetare populis et gentibus et linguis et regibus multis"
      en: "And he said to me: Thou must prophesy again to many nations, and peoples, and tongues, and kings."
    status: { la: verified, en: verified }
