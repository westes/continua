# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 13
verses:
  - n: 1
    text:
      la: "Anno vigesimo tertio Joas filii Ochoziae regis Juda, regnavit Joachaz filius Jehu super Israel in Samaria decem et septem annis."
      en: "In the three and twentieth year of Joas son of Ochozias king of Juda, Joachaz the son of Jehu reigned over Israel in Samaria, seventeen years."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et fecit malum coram Domino, secutusque est peccata Jeroboam filii Nabat, qui peccare fecit Israel, et non declinavit ab eis."
      en: "And he did evil before the Lord, and followed the sins of Jeroboam the son of Nabat, who made Israel to sin, and he departed not from them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Iratusque est furor Domini contra Israel, et tradidit eos in manu Hazael regis Syriae, et in manu Benadad filii Hazael, cunctis diebus."
      en: "And the wrath of the Lord was kindled against Israel, and he delivered them into the hand of Hazael the king of Syria, and into the hand of Benadad the son of Hazael all days."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Deprecatus est autem Joachaz faciem Domini, et audivit eum Dominus: vidit enim angustiam Israel, quia attriverat eos rex Syriae:"
      en: "But Joachaz besought the face of the Lord, and the Lord heard him: for he saw the distress of Israel, because the king of Syria had oppressed them:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et dedit Dominus salvatorem Israeli, et liberatus est de manu regis Syriae: habitaveruntque filii Israel in tabernaculis suis sicut heri et nudiustertius."
      en: "And the Lord gave Israel a saviour, and they were delivered out of the hand of the king of Syria: and the children of Israel dwelt in their pavilions as yesterday and the day before."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Verumtamen non recesserunt a peccatis domus Jeroboam, qui peccare fecit Israel, sed in ipsis ambulaverunt: siquidem et lucus permansit in Samaria."
      en: "But yet they departed not from the sins of Jeroboam, who made Israel to sin, but walked in them: and there still remained a grove also in Samaria."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et non sunt derelicti Joachaz de populo nisi quinquaginta equites, et decem currus, et decem millia peditum: interfecerat enim eos rex Syriae, et redegerat quasi pulverem in tritura areae."
      en: "And Joachaz had no more left of the people than fifty horsemen, and ten chariots, and ten thousand footmen: for the king of Syria had slain them, and had brought them low as dust by thrashing in the barnfloor."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Reliqua autem sermonum Joachaz, et universa quae fecit, et fortitudo ejus, nonne haec scripta sunt in libro sermonum dierum regum Israel?"
      en: "But the rest of the acts of Joachaz, and all that he did, and his valour, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dormivitque Joachaz cum patribus suis, et sepelierunt eum in Samaria: regnavitque Joas filius ejus pro eo."
      en: "And Joachaz slept with his fathers, and they buried him in Samaria: and Joas his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Anno trigesimo septimo Joas regis Juda, regnavit Joas filius Joachaz super Israel in Samaria sedecim annis,"
      en: "In the seven and thirtieth year of Joas king of Juda, Joas the son of Joachaz reigned over Israel in Samaria sixteen years."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et fecit quod malum est in conspectu Domini: non declinavit ab omnibus peccatis Jeroboam filii Nabat, qui peccare fecit Israel, sed in ipsis ambulavit."
      en: "And he did that which is evil in the sight of the Lord: he departed not from all the sins of Jeroboam the son of Nabat, who made Israel to sin, but he walked in them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Reliqua autem sermonum Joas, et universa quae fecit, et fortitudo ejus, quomodo pugnaverit contra Amasiam regem Juda, nonne haec scripta sunt in libro sermonum dierum regum Israel?"
      en: "But the rest of the acts of Joas, and all that he did, and his valour wherewith he fought against Amasias king of Juda, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et dormivit Joas cum patribus suis: Jeroboam autem sedit super solium ejus. Porro Joas sepultus est in Samaria cum regibus Israel."
      en: "And Joas slept with his fathers: and Jeroboam sat upon his throne. But Joas was buried in Samaria with the kings of Israel."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Eliseus autem aegrotabat infirmitate, qua et mortuus est: descenditque ad eum Joas rex Israel, et flebat coram eo, dicebatque: Pater mi, pater mi, currus Israel et auriga ejus."
      en: "Now Eliseus was sick of the illness whereof he died: and Joas king of Israel went down to him, and wept before him, and said: O my father, my father, the chariot of Israel and the guider thereof."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et ait illi Eliseus: Affer arcum, et sagittas. Cumque attulisset ad eum arcum, et sagittas,"
      en: "And Eliseus said to him: Bring a bow and arrows. And when he had brought him a bow, and arrows,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixit ad regem Israel: Pone manum tuam super arcum. Et cum posuisset ille manum suam, superposuit Eliseus manus suas manibus regis,"
      en: "He said to the king of Israel: Put thy hand upon the bow. And when he had put his hand, Eliseus put his hands over the king's hands,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ait: Aperi fenestram orientalem. Cumque aperuisset, dixit Eliseus: Jace sagittam. Et jecit. Et ait Eliseus: Sagitta salutis Domini, et sagitta salutis contra Syriam: percutiesque Syriam in Aphec, donec consumas eam."
      en: "And said: Open the window to the east. And when he had opened it, Eliseus said: Shoot an arrow. And he shot. And Eliseus said: The arrow of the Lord's deliverance, and the arrow of the deliverance from Syria: and thou shalt strike the Syrians in Aphec, till thou consume them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et ait: Tolle sagittas. Qui cum tulisset, rursum dixit ei: Percute jaculo terram. Et cum percussisset tribus vicibus, et stetisset,"
      en: "And he said: Take the arrows. And when he had taken them, he said to him: Strike with an arrow upon the ground. And he struck three times and stood still."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "iratus est vir Dei contra eum, et ait: Si percussisses quinquies, aut sexies, sive septies, percussisses Syriam usque ad consumptionem: nunc autem tribus vicibus percuties eam."
      en: "And the man of God was angry with him, and said: If thou hadst smitten five or six or seven times, thou hadst smitten Syria even to utter destruction: but now three times shalt thou smite it."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Mortuus est ergo Eliseus, et sepelierunt eum. Latrunculi autem de Moab venerunt in terram in ipso anno."
      en: "And Eliseus died, and they buried him. And the rovers from Moab came into the land the same year."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quidam autem sepelientes hominem, viderunt latrunculos, et projecerunt cadaver in sepulchro Elisei. Quod cum tetigisset ossa Elisei, revixit homo, et stetit super pedes suos."
      en: "And some that were burying a man, saw the rovers, and cast the body into the sepulchre of Eliseus. And when it had touched the bones of Eliseus, the man came to life, and stood upon his feet."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Igitur Hazael rex Syriae afflixit Israel cunctis diebus Joachaz:"
      en: "Now Hazael king of Syria afflicted Israel all the days of Joachaz:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et misertus est Dominus eorum, et reversus est ad eos propter pactum suum, quod habebat cum Abraham, et Isaac, et Jacob: et noluit disperdere eos, neque projicere penitus usque in praesens tempus."
      en: "And the Lord had mercy on them, and returned to them because of his covenant, which he had made with Abraham and Isaac and Jacob: and he would not destroy them, nor utterly cast them away, unto this present time."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Mortuus est autem Hazael rex Syriae, et regnavit Benadad filius ejus pro eo."
      en: "And Hazael king of Syria died, and Benadad his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Porro Joas filius Joachaz tulit urbes de manu Benadad filii Hazael, quas tulerat de manu Joachaz patris sui jure praelii: tribus vicibus percussit eum Joas, et reddidit civitates Israel."
      en: "Now Joas the son of Joachaz, took the cities out of the hand of Benadad, the son of Hazael, which he had taken out of the hand of Joachaz his father by war, three times did Joas beat him, and he restored the cities to Israel."
    status: { la: verified, en: verified }
