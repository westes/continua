book: 4reg
chapter: 13
verses:
  - n: 1
    text:
      la: "anno vicesimo tertio Ioas filii Ahaziae regis Iudae regnavit Ioachaz filius Hieu super Israhel in Samaria decem et septem annis"
      en: "In the three and twentieth year of Joas son of Ochozias king of Juda, Joachaz the son of Jehu reigned over Israel in Samaria, seventeen years."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et fecit malum coram Domino secutusque est peccata Hieroboam filii Nabath qui peccare fecit Israhel non declinavit ab eis"
      en: "And he did evil before the Lord, and followed the sins of Jeroboam the son of Nabat, who made Israel to sin, and he departed not from them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "iratusque est furor Domini contra Israhel et tradidit eos in manu Azahelis regis Syriae et in manu Benadad filii Azahel cunctis diebus"
      en: "And the wrath of the Lord was kindled against Israel, and he delivered them into the hand of Hazael the king of Syria, and into the hand of Benadad the son of Hazael all days."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "deprecatus est autem Ioachaz faciem Domini et audivit eum Dominus vidit enim angustiam Israhel qua adtriverat eos rex Syriae"
      en: "But Joachaz besought the face of the Lord, and the Lord heard him: for he saw the distress of Israel, because the king of Syria had oppressed them:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et dedit Dominus Israheli salvatorem et liberatus est de manu Syriae habitaveruntque filii Israhel in tabernaculis suis sicut heri et nudius tertius"
      en: "And the Lord gave Israel a saviour, and they were delivered out of the hand of the king of Syria: and the children of Israel dwelt in their pavilions as yesterday and the day before."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "verumtamen non recesserunt a peccatis domus Hieroboam qui peccare fecit Israhel in ipsis ambulaverunt siquidem et lucus permansit in Samaria"
      en: "But yet they departed not from the sins of Jeroboam, who made Israel to sin, but walked in them: and there still remained a grove also in Samaria."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et non sunt derelicti Ioachaz de populo nisi quinquaginta equites et decem currus et decem milia peditum interfecerat enim eos rex Syriae et redegerat quasi pulverem in tritura areae"
      en: "And Joachaz had no more left of the people than fifty horsemen, and ten chariots, and ten thousand footmen: for the king of Syria had slain them, and had brought them low as dust by thrashing in the barnfloor."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "reliqua autem sermonum Ioachaz et universa quae fecit sed et fortitudo eius nonne haec scripta sunt in libro sermonum dierum regum Israhel"
      en: "Rut the rest of the acts of Joachaz, and all that he did, and his valour, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dormivitque Ioachaz cum patribus suis et sepelierunt eum in Samaria regnavitque Ioas filius eius pro eo"
      en: "And Joachaz slept with his fathers, and they buried him in Samaria: and Joas his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "anno tricesimo septimo Ioas regis Iuda regnavit Ioas filius Ioachaz super Israhel in Samaria sedecim annis"
      en: "In the seven and thirtieth year of Joas king of Juda, Joas the son of Joachaz reigned over Israel in Samaria sixteen years."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et fecit quod malum est in conspectu Domini non declinavit ab omnibus peccatis Hieroboam filii Nabath qui peccare fecit Israhel in ipsis ambulavit"
      en: "And he did that which is evil in the sight of the Lord: he departed not from all the sine of Jeroboam the son of Nabat, who made Israel to sin, but he walked in them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "reliqua autem sermonum Ioas et universa quae fecit sed et fortitudo eius quomodo pugnaverit contra Amasiam regem Iuda nonne haec scripta sunt in libro sermonum regum Israhel"
      en: "But the rest of the acts of Joas, and all that he did, and his valour wherewith he fought against Amasias king of Juda, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et dormivit Ioas cum patribus suis Hieroboam autem sedit super solium eius porro Ioas sepultus est in Samaria cum regibus Israhel"
      en: "And Joas slept with his fathers: and Jeroboam sat upon his throne. But Joas was buried in Samaria with the kings of Israel."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Heliseus autem aegrotabat infirmitate qua et mortuus est descenditque ad eum Ioas rex Israhel et flebat coram eo dicebatque pater mi pater mi currus Israhel et auriga eius"
      en: "Now Eliseus was sick of the illness whereof he died: and Joas king of Israel went down to him, and wept before him, and said: O my father, my father, the chariot of Israel and the guider thereof."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ait illi Heliseus adfer arcum et sagittas cumque adtulisset ad eum arcum et sagittas"
      en: "And Eliseus said to him: Bring a bow and arrows. And when he had brought him a bow, and arrows,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixit ad regem Israhel pone manum tuam super arcum et cum posuisset ille manum suam superposuit Heliseus manus suas manibus regis"
      en: "He said to the king of Israel: Put thy hand upon the bow. And when he had put his hand, Eliseus put his hands over the king's hands,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ait aperi fenestram orientalem cumque aperuisset dixit Heliseus iace sagittam et iecit et ait Heliseus sagitta salutis Domini et sagitta salutis contra Syriam percutiesque Syriam in Afec donec consumas eam"
      en: "And said: Open the window to the east. And when he had opened it, Eliseus said: Shoot an arrow. And he shot. And Eliseus said: The arrow of the Lord's deliverance, and the arrow of the deliverance from Syria: and thou shalt strike the Syrians in Aphec, till thou consume them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ait tolle sagittas qui cum tulisset rursum dixit ei percute iaculo terram et cum percussisset tribus vicibus et stetisset"
      en: "And he said: Take the arrows. And when he had taken them, he said to him : Strike with an arrow upon the ground. And he struck three times and stood still."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "iratus est contra eum vir Dei et ait si percussisses quinquies aut sexies sive septies percussisses Syriam usque ad consummationem nunc autem tribus vicibus percuties eam"
      en: "And the man of God was angry with him, and said: If thou hadst smitten five or six or seven times, thou hadst smitten Syria even to utter destruction: but now three times shalt thou smite it."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "mortuus est ergo Heliseus et sepelierunt eum latrunculi quoque de Moab venerunt in terra in ipso anno"
      en: "And Eliseus died, and they buried him. And the rovers from Moab came into the land the same year."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quidam autem sepelientes hominem viderunt latrunculos et proiecerunt cadaver in sepulchro Helisei quod ambulavit et tetigit ossa Helisei et revixit homo et stetit super pedes suos"
      en: "And some that were burying a man, saw the rovers, and cast the body into the sepulchre of Eliseus. And when it had touched the bones of Eliseus, the man came to life, and stood upon his feet."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "igitur Azahel rex Syriae adflixit Israhel cunctis diebus Ioachaz"
      en: "Now Hazael king of Syria afflicted Israel all the days of Joachaz:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et misertus est Dominus eorum et reversus est ad eos propter pactum suum quod habebat cum Abraham Isaac et Iacob et noluit disperdere eos neque proicere penitus usque in praesens tempus"
      en: "And the Lord had mercy on them, and returned to them because of his covenant, which he had made with Abraham and Isaac and Jacob: and he would not destroy them, nor utterly cast them away, unto this present time."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "mortuus est autem Azahel rex Syriae et regnavit Benadad filius eius pro eo"
      en: "And Hazael king of Syria died, and Benadad his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "porro Ioas filius Ioachaz tulit urbes de manu Benadad filii Azahel quas tulerat de manu Ioachaz patris sui iure proelii tribus vicibus percussit eum Ioas et reddidit civitates Israheli"
      en: "Now Joas d the son of Joachaz, took the cities out of the hand of Benadad, the son of Hazael, which he had taken out of the hand of Joachaz his father by war, three times did Joas beat him, and he restored the cities to Israel."
    status: { la: verified, en: verified }
