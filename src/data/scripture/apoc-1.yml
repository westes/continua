# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: apoc
chapter: 1
verses:
  - n: 1
    text:
      la: "apocalypsis Iesu Christi quam dedit illi Deus palam facere servis suis quae oportet fieri cito et significavit mittens per angelum suum servo suo Iohanni"
      en: "The Revelation of Jesus Christ, which God gave unto him, to make known to his servants the things which must shortly come to pass: and signified, sending by his angel to his servant John,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "qui testimonium perhibuit verbo Dei et testimonium Iesu Christi quaecumque vidit"
      en: "Who hath given testimony to the word of God, and the testimony of Jesus Christ, what things soever he hath seen."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "beatus qui legit et qui audiunt verba prophetiae et servant ea quae in ea scripta sunt tempus enim prope est"
      en: "Blessed is he, that readeth and heareth the words of this prophecy; and keepeth those things which are written in it; for the time is at hand."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Iohannes septem ecclesiis quae sunt in Asia gratia vobis et pax ab eo qui est et qui erat et qui venturus est et a septem spiritibus qui in conspectu throni eius sunt"
      en: "John to the seven churches which are in Asia. Grace be unto you and peace from him that is, and that was, and that is to come, and from the seven spirits which are before his throne,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et ab Iesu Christo qui est testis fidelis primogenitus mortuorum et princeps regum terrae qui dilexit nos et lavit nos a peccatis nostris in sanguine suo"
      en: "And from Jesus Christ, who is the faithful witness, the first begotten of the dead, and the prince of the kings of the earth, who hath loved us, and washed us from our sins in his own blood,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et fecit nostrum regnum sacerdotes Deo et Patri suo ipsi gloria et imperium in saecula saeculorum amen"
      en: "And hath made us a kingdom, and priests to God and his Father, to him be glory and empire for ever and ever. Amen."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ecce venit cum nubibus et videbit eum omnis oculus et qui eum pupugerunt et plangent se super eum omnes tribus terrae etiam amen"
      en: "Behold, he cometh with the clouds, and every eye shall see him, and they also that pierced him. And all the tribes of the earth shall bewail themselves because of him. Even so. Amen."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ego sum Alpha et Omega principium et finis dicit Dominus Deus qui est et qui erat et qui venturus est Omnipotens"
      en: "I am Alpha and Omega, the beginning and the end, saith the Lord God, who is, and who was, and who is to come, the Almighty."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ego Iohannes frater vester et particeps in tribulatione et regno et patientia in Iesu fui in insula quae appellatur Patmos propter verbum Dei et testimonium Iesu"
      en: "I John, your brother and your partner in tribulation, and in the kingdom, and patience in Christ Jesus, was in the island, which is called Patmos, for the word of God, and for the testimony of Jesus."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "fui in spiritu in dominica die et audivi post me vocem magnam tamquam tubae"
      en: "I was in the spirit on the Lord's day, and heard behind me a great voice, as of a trumpet,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dicentis quod vides scribe in libro et mitte septem ecclesiis Ephesum et Zmyrnam et Pergamum et Thyatiram et Sardis et Philadelphiam et Laodiciam"
      en: "Saying: What thou seest, write in a book, and send to the seven churches which are in Asia, to Ephesus, and to Smyrna, and to Pergamus, and to Thyatira, and to Sardis, and to Philadelphia, and to Laodicea."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et conversus sum ut viderem vocem quae loquebatur mecum et conversus vidi septem candelabra aurea"
      en: "And I turned to see the voice that spoke with me. And being turned, I saw seven golden candlesticks:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et in medio septem candelabrorum similem Filio hominis vestitum podere et praecinctum ad mamillas zonam auream"
      en: "And in the midst of the seven golden candlesticks, one like to the Son of man, clothed with a garment down to the feet, and girt about the paps with a golden girdle."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "caput autem eius et capilli erant candidi tamquam lana alba tamquam nix et oculi eius velut flamma ignis"
      en: "And his head and his hairs were white, as white wool, and as snow, and his eyes were as a flame of fire,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et pedes eius similes orichalco sicut in camino ardenti et vox illius tamquam vox aquarum multarum"
      en: "And his feet like unto fine brass, as in a burning furnace. And his voice as the sound of many waters."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et habebat in dextera sua stellas septem et de ore eius gladius utraque parte acutus exiebat et facies eius sicut sol lucet in virtute sua"
      en: "And he had in his right hand seven stars. And from his mouth came out a sharp two edged sword: and his face was as the sun shineth in his power."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et cum vidissem eum cecidi ad pedes eius tamquam mortuus et posuit dexteram suam super me dicens noli timere ego sum primus et novissimus"
      en: "And when I had seen him, I fell at his feet as dead. And he laid his right hand upon me, saying: Fear not. I am the First and the Last,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et vivus et fui mortuus et ecce sum vivens in saecula saeculorum et habeo claves mortis et inferni"
      en: "And alive, and was dead, and behold I am living for ever and ever, and have the keys of death and of hell."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "scribe ergo quae vidisti et quae sunt et quae oportet fieri post haec"
      en: "Write therefore the things which thou hast seen, and which are, and which must be done hereafter."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sacramentum septem stellarum quas vidisti in dextera mea et septem candelabra aurea septem stellae angeli sunt septem ecclesiarum et candelabra septem septem ecclesiae sunt"
      en: "The mystery of the seven stars, which thou sawest in my right hand, and the seven golden candlesticks. The seven stars are the angels of the seven churches. And the seven candlesticks are the seven churches."
    status: { la: verified, en: verified }
