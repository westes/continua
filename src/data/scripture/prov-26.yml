# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: prov
chapter: 26
verses:
  - n: 1
    text:
      la: "quomodo nix aestate et pluvia in messe sic indecens est stulto gloria"
      en: "As snow in summer, and rain in harvest, so glory is not seemly for a fool."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sicut avis ad alia transvolans et passer quolibet vadens sic maledictum frustra prolatum in quempiam superveniet"
      en: "As a bird flying to other places, and a sparrow going here or there: so a curse uttered without cause shall come upon a man."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "flagellum equo et camus asino et virga dorso inprudentium"
      en: "A whip for a horse, and a snaffle for an ass, and a rod for the back of fools."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ne respondeas stulto iuxta stultitiam suam ne efficiaris ei similis"
      en: "Answer not a fool according to his folly, lest thou be made like him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "responde stulto iuxta stultitiam suam ne sibi sapiens esse videatur"
      en: "Answer a fool according to his folly, lest he imagine himself to be wise."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "claudus pedibus et iniquitatem bibens qui mittit verba per nuntium stultum"
      en: "He that sendeth words by a foolish messenger, is lame of feet and drinketh iniquity."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quomodo pulchras frustra habet claudus tibias sic indecens est in ore stultorum parabola"
      en: "As a lame man hath fair legs in vain: so a parable is unseemly in the mouth of fools."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sicut qui mittit lapidem in acervum Mercurii ita qui tribuit insipienti honorem"
      en: "As he that casteth a stone into the heap of Mercury: so is he that giveth honour to a fool."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quomodo si spina nascatur in manu temulenti sic parabola in ore stultorum"
      en: "As if a thorn should grow in the hand of a drunkard: so is a parable in the mouth of fools."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "iudicium determinat causas et qui inponit stulto silentium iras mitigat"
      en: "Judgment determineth causes: and he that putteth a fool to silence, appeaseth anger."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sicut canis qui revertitur ad vomitum suum sic inprudens qui iterat stultitiam suam"
      en: "As a dog that returneth to his vomit, so is the fool that repeateth his folly."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "vidisti hominem sapientem sibi videri magis illo spem habebit stultus"
      en: "Hast thou seen a man wise in his own conceit? there shall be more hope of a fool than of him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dicit piger leaena in via leo in itineribus"
      en: "The slothful man saith: There is a lion in the way, and a lioness in the roads."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sicut ostium vertitur in cardine suo ita piger in lectulo suo"
      en: "As the door turneth upon its hinges, so doth the slothful upon his bed."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "abscondit piger manus sub ascellas suas et laborat si ad os suum eas converterit"
      en: "The slothful hideth his hand under his armpit, and it grieveth him to turn it to his mouth."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sapientior sibi piger videtur septem viris loquentibus sententias"
      en: "The sluggard is wiser in his own conceit, than seven men that speak sentences."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sicut qui adprehendit auribus canem sic qui transit et inpatiens commiscetur rixae alterius"
      en: "As he that taketh a dog by the ears, so is he that passeth by in anger, and meddleth with another man's quarrel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sicut noxius est qui mittit lanceas et sagittas et mortem"
      en: "As he is guilty that shooteth arrows, and lances unto death :"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "sic vir qui fraudulenter nocet amico suo et cum fuerit deprehensus dicit ludens feci"
      en: "So is the man that hurteth his friend deceitfully: and when he is taken, saith: I did it in jest."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "cum defecerint ligna extinguetur ignis et susurrone subtracto iurgia conquiescunt"
      en: "When the wood faileth, the fire shall go out: and when the talebearer is taken away, contentions shall cease."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "sicut carbones ad prunam et ligna ad ignem sic homo iracundus suscitat rixas"
      en: "As coals are to burning coals, and wood to fire, so an angry man stirreth up strife."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "verba susurronis quasi simplicia et ipsa perveniunt ad intima ventris"
      en: "The words of a talebearer are as it were simple, but they reach to the innermost parts of the belly."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quomodo si argento sordido ornare velis vas fictile sic labia tumentia cum pessimo corde sociata"
      en: "Swelling lips joined with a corrupt heart, are like an earthen vessel adorned with silver dross."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "labiis suis intellegitur inimicus cum in corde tractaverit dolos"
      en: "An enemy is known by his lips, when in his heart he entertaineth deceit."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quando submiserit vocem suam ne credideris ei quoniam septem nequitiae sunt in corde illius"
      en: "When he shall speak low, trust him not: because there are seven mischiefs in his heart."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "qui operit odium fraudulenter revelabitur malitia eius in concilio"
      en: "He that covereth hatred deceitfully, his malice shall be laid open in the public assembly."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "qui fodit foveam incidet in eam et qui volvit lapidem revertetur ad eum"
      en: "He that diggeth a pit, shall fall into it: and he that rolleth a stone, it shall return to him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "lingua fallax non amat veritatem et os lubricum operatur ruinas"
      en: "A deceitful tongue loveth not truth: and a slippery mouth worketh ruin."
    status: { la: verified, en: verified }
