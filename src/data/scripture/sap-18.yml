# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sap
chapter: 18
verses:
  - n: 1
    text:
      la: "Sanctis autem tuis maxima erat lux, et horum quidem vocem audiebant, sed figuram non videbant. Et quia non et ipsi eadem passi erant, magnificabant te;"
      en: "But thy saints had a very great light, and they heard their voice indeed, but did not see their shape. And because they also did not suffer the same things, they glorified thee:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et qui ante laesi erant, quia non laedebantur, gratias agebant; et ut esset differentia, donum petebant."
      en: "And they that before had been wronged, gave thanks, because they were not hurt now: and asked this gift, that there might be a difference."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Propter quod ignis ardentem columnam ducem habuerunt ignotae viae, et solem sine laesura boni hospitii praestitisti."
      en: "Therefore they received a burning pillar of fire for a guide of the way which they knew not, and thou gavest them a harmless sun of a good entertainment."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Digni quidem illi carere luce, et pati carcerem tenebrarum, qui inclusos custodiebant filios tuos, per quos incipiebat incorruptum legis lumen saeculo dari."
      en: "The others indeed were worthy to be deprived of light, and imprisoned in darkness, who kept thy children shut up, by whom the pure light of the law was to be given to the world."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cum cogitarent justorum occidere infantes, et uno expositio filio et liberato, in traductionem illorum, multitudinem filiorum abstulisti, et pariter illos perdidisti in aqua valida."
      en: "And whereas they thought to kill the babes of the just, one child being cast forth, and saved, to reprove them, thou tookest away a multitude of their children, and destroyedst them all together in a mighty water."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Illa enim nox ante cognita est a patribus nostris, ut vere scientes quibus juramentis crediderunt, animaequiores essent."
      en: "For that night was known before by our fathers, that assuredly knowing what oaths they had trusted to, they might be of better courage."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Suscepta est autem a populo tuo sanitas quidem justorum, injustorum autem exterminatio."
      en: "So thy people received the salvation of the just, and destruction of the unjust."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sicut enim laesisti adversarios, sic et nos provocans magnificasti."
      en: "For as thou didst punish the adversaries: so thou didst also encourage and glorify us."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Absconse enim sacrificabant justi pueri bonorum, et justitiae legem in concordia disposuerunt; similiter et bona et mala recepturos justos, patrum jam decantantes laudes."
      en: "For the just children of good men were offering sacrifice secretly, and they unanimously ordered a law of justice: that the just should receive both good and evil alike, singing now the praises of the fathers."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Resonabat autem inconveniens inimicorum vox, et flebilis audiebatur planctus ploratorum infantium."
      en: "But on the other side there sounded an ill according cry of the enemies, and a lamentable mourning was heard for the children that were bewailed."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Simili autem poena servus cum domino afflictus est, et popularis homo regi similia passus."
      en: "And the servant suffered the same punishment as the master, and a common man suffered in like manner as the king."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Similiter ergo omnes, uno nomine mortis, mortuos habebant innumerabiles. Nec enim ad sepeliendum vivi sufficiebant, quoniam uno momento quae erat praeclarior natio illorum exterminata est."
      en: "So all alike had innumerable dead, with one kind of death. Neither were the living sufficient to bury them; for in one moment the noblest offspring of them was destroyed."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "De omnibus enim non credentes, propter veneficia; tunc vero primum cum fuit exterminium primogenitorum, spoponderunt populum Dei esse."
      en: "For whereas they would not believe any thing before by reason of the enchantments, then first upon the destruction of the firstborn, they acknowledged the people to be of God."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cum enim quietum silentium contineret omnia, et nox in suo cursu medium iter haberet,"
      en: "For while all things were in quiet silence, and the night was in the midst of her course,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "omnipotens sermo tuus de caelo, a regalibus sedibus, durus debellator in mediam exterminii terram prosilivit,"
      en: "Thy almighty word leapt down from heaven from thy royal throne, as a fierce conqueror into the midst of the land of destruction."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "gladius acutus insimulatum imperium tuum portans, et stans, replevit omnia morte, et usque ad caelum attingebat stans in terra."
      en: "With a sharp sword carrying thy unfeigned commandment, and he stood and filled all things with death, and standing on the earth reached even to heaven."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Tunc continuo visus somniorum malorum turbaverunt illos, et timores supervenerunt insperati."
      en: "Then suddenly visions of evil dreams troubled them, and fears unlooked for came upon them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et alius alibi projectus semivivus, propter quam moriebatur causam demonstrabat mortis."
      en: "And one thrown here, another there, half dead, shewed the cause of his death."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Visiones enim quae illos turbaverunt haec praemonebant, ne inscii quare mala patiebantur perirent."
      en: "For the visions that troubled them foreshewed these things, lest they should perish and not know why they suffered these evils."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Tetigit autem tunc et justos tentatio mortis et commotio in eremo facta est multitudinis; sed non diu permansit ira tua."
      en: "But the just also were afterwards touched by an assault of death, and there was a disturbance of the multitude in the wilderness: but thy wrath did not long continue."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Prosperans enim homo sine querela deprecari pro populis, proferens servitutis suae scutum, orationem et per incensum deprecationem allegans, restitit irae, et finem imposuit necessitati, ostendens quoniam tuus est famulus."
      en: "For a blameless man made haste to pray for the people, bringing forth the shield of his ministry, prayer, and by incense making supplication, withstood the wrath, and put an end to the calamity, shewing that he was thy servant."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Vicit autem turbas non in virtute corporis, nec armaturae potentia; sed verbo illum qui se vexabat subjecit, juramenta parentum, et testamentum commemorans."
      en: "And he overcame the disturbance, not by strength of body nor with force of arms, but with a word he subdued him that punished them, alleging the oaths and covenant made with the fathers."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cum enim jam acervatim cecidissent super alterutrum mortui, interstitit, et amputavit impetum, et divisit illam quae ad vivos ducebat viam."
      en: "For when they were now fallen down dead by heaps one upon another, he stood between and stayed the assault, and cut off the way to the living."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "In veste enim poderis quam habebat, totus erat orbis terrarum; et parentum magnalia in quatuor ordinibus lapidum erant sculpta, et magnificientia tua in diademate capitis illius sculpta erat."
      en: "For in the priestly robe which he wore, was the whole world: and in the four rows of the stones the glory of the fathers was graven, and thy majesty was written upon the diadem of his head."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "His autem cessit qui exterminabat, et haec extimuit; erat enim sola tentatio irae sufficiens."
      en: "And to these the destroyer gave place, and was afraid of them: for the proof only of wrath was enough."
    status: { la: verified, en: verified }
