# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 26
verses:
  - n: 1
    text:
      la: "orta autem fame super terram post eam sterilitatem quae acciderat in diebus Abraham abiit Isaac ad Abimelech regem Palestinorum in Gerara"
      en: "And when a famine came in the land, after that barrenness which had happened in the days of Abraham, Isaac went to Abimelech king of the Palestines to Gerara."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "apparuitque ei Dominus et ait ne descendas in Aegyptum sed quiesce in terra quam dixero tibi"
      en: "And the Lord appeared to him and said: Go not down into Egypt, but stay in the land that I shall tell thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et peregrinare in ea eroque tecum et benedicam tibi tibi enim et semini tuo dabo universas regiones has conplens iuramentum quod spopondi Abraham patri tuo"
      en: "And sojourn in it, and I will be with thee, and will bless thee: for to thee and to thy seed I will give all these countries, to fulfill the oath which I swore to Abraham thy father."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et multiplicabo semen tuum sicut stellas caeli daboque posteris tuis universas regiones has et benedicentur in semine tuo omnes gentes terrae"
      en: "And I will multiply thy seed like the stars of heaven: and I will give to thy posterity all these countries: and in thy seed shall all the nations of the earth be blessed."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "eo quod oboedierit Abraham voci meae et custodierit praecepta et mandata mea et caerimonias legesque servaverit"
      en: "Because Abraham obeyed my voice, and kept my precepts and commandments, and observed my ceremonies and laws."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "mansit itaque Isaac in Geraris"
      en: "So Isaac abode in Gerara."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui cum interrogaretur a viris loci illius super uxore sua respondit soror mea est timuerat enim confiteri quod sibi esset sociata coniugio reputans ne forte interficerent eum propter illius pulchritudinem"
      en: "And when he was asked by the men of that place, concerning his wife, he answered: She is my sister; for he was afraid to confess that she was his wife, thinking lest perhaps they would like him because of her beauty."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cumque pertransissent dies plurimi et ibi demoraretur prospiciens Abimelech Palestinorum rex per fenestram vidit eum iocantem cum Rebecca uxore sua"
      en: "And when very many days were passed, and he abode there, Abimelech king of the Palestines looking out through a window, saw him playing with Rebecca his wife."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et accersito ait perspicuum est quod uxor tua sit cur mentitus es sororem tuam esse respondit timui ne morerer propter eam"
      en: "And calling for him, he said: It is evident she is thy wife: why didst thou feign her to be thy sister? He answered: I feared lest I should die for her sake."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dixitque Abimelech quare inposuisti nobis potuit coire quispiam de populo cum uxore tua et induxeras super nos grande peccatum praecepitque omni populo dicens"
      en: "And Abimelech said: Why hadst thou deceived us? Some man of the people might have lain with thy wife, and thou hadst brought upon us a great sin. And he commanded all the people, saying:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "qui tetigerit hominis huius uxorem morte morietur"
      en: "He that shall touch this man's wife, shall surely be put to death."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "seruit autem Isaac in terra illa et invenit in ipso anno centuplum benedixitque ei Dominus"
      en: "And Isaac sowed in that land, and he found that same year a hundredfold: and the Lord blessed him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et locupletatus est homo et ibat proficiens atque succrescens donec magnus vehementer effectus est"
      en: "And the man was enriched, and he went on prospering and increasing, till he became exceeding great:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "habuit quoque possessionem ovium et armentorum et familiae plurimum ob haec invidentes ei Palestini"
      en: "And he had possessions of sheep and of herds, and a very great family. Wherefore the Palestines envying him,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "omnes puteos quos foderant servi patris illius Abraham illo tempore obstruxerunt implentes humo"
      en: "Stopped up at that time all the wells, that the servants of his father Abraham had digged, filling them up with earth:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "in tantum ut ipse Abimelech diceret ad Isaac recede a nobis quoniam potentior nostri factus es valde"
      en: "Insomuch that Abimelech himself said to Isaac: Depart from us, for thou art become much mightier than we."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ille discedens veniret ad torrentem Gerarae habitaretque ibi"
      en: "So he departed and came to the torrent of Gerara, to dwell there:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "rursum fodit alios puteos quos foderant servi patris sui Abraham et quos illo mortuo olim obstruxerant Philisthim appellavitque eos hisdem nominibus quibus ante pater vocaverat"
      en: "And he digged again other wells, which the servants of his father Abraham had digged, and which, after his death, the Palestines had of old stopped up: and he called them by the same names by which his father before had called them."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "foderunt in torrente et reppererunt aquam vivam"
      en: "And they digged in the torrent, and found living water."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sed et ibi iurgium fuit pastorum Gerarae adversum pastores Isaac dicentium nostra est aqua quam ob rem nomen putei ex eo quod acciderat vocavit Calumniam"
      en: "But there also the herdsmen of Gerara strove against the herdsmen of Isaac, saying: It is our water. Wherefore he called the name of the well, on occasion of that which had happened, Calumny."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "foderunt et alium et pro illo quoque rixati sunt appellavitque eum Inimicitias"
      en: "And they digged also another; and for that they quarreled likewise, and he called the name of it, Enmity."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "profectus inde fodit alium puteum pro quo non contenderunt itaque vocavit nomen illius Latitudo dicens nunc dilatavit nos Dominus et fecit crescere super terram"
      en: "Going forward from thence, he digged another well, for which they contended not: therefore he called the name thereof, Latitude, saying: Now hath the Lord given us room, and made us to increase upon the earth."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ascendit autem ex illo loco in Bersabee"
      en: "And he went up from that place to Bersabee,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ubi apparuit ei Dominus in ipsa nocte dicens ego sum Deus Abraham patris tui noli metuere quia tecum sum benedicam tibi et multiplicabo semen tuum propter servum meum Abraham"
      en: "Where the Lord appeared to him that same might, saying: I am the God of Abraham thy father; do not fear, for I am with thee: I will bless thee, and multiply thy seed for my servant Abraham's sake."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "itaque aedificavit ibi altare et invocato nomine Domini extendit tabernaculum praecepitque servis suis ut foderent puteum"
      en: "And he built there an altar: and called upon the name of the Lord, and pitched his tent: and commanded his servants to dig a well."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ad quem locum cum venissent de Geraris Abimelech et Ochozath amicus illius et Fichol dux militum"
      en: "To which place when Abimelech, and Ochozath his friend, and Phicol chief captain of his soldiers came from Gerara,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "locutus est eis Isaac quid venistis ad me hominem quem odistis et expulistis a vobis"
      en: "Isaac said to them: Why are ye come to me, a man whom you hate, and have thrust out from you?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "qui responderunt vidimus tecum esse Dominum et idcirco nunc diximus sit iuramentum inter nos et ineamus foedus"
      en: "And they answered: We saw that the Lord is with thee, and therefore we said: Let there be an oath between us, and let us make a covenant,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ut non facias nobis quicquam mali sicut et nos nihil tuorum adtigimus nec fecimus quod te laederet sed cum pace dimisimus auctum benedictione Domini"
      en: "That thou do us no harm, as we on our part have touched nothing of thine, nor have done any thing to hurt thee: but with peace have sent thee away increased with the blessing of the Lord."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "fecit ergo eis convivium et post cibum et potum"
      en: "And he made them a feast, and after they had eaten and drunk:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "surgentes mane iuraverunt sibi mutuo dimisitque eos Isaac pacifice in locum suum"
      en: "Arising in the morning, they swore one to another: and Isaac sent them away peaceably to their own home."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "ecce autem venerunt in ipso die servi Isaac adnuntiantes ei de puteo quem foderant atque dicentes invenimus aquam"
      en: "And behold the same day the servants of Isaac came, telling him of a well which they had digged, and saying: We have found water."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "unde appellavit eum Abundantiam et nomen urbi inpositum est Bersabee usque in praesentem diem"
      en: "Whereupon he called it Abundance: and the name of the city was called Bersabee, even to this day."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Esau vero quadragenarius duxit uxores Iudith filiam Beeri Hetthei et Basemath filiam Helon eiusdem loci"
      en: "And Esau being forty years old, married wives, Judith the daughter of Beeri the Hethite, and Basemath the daughter of Elon of the same place."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "quae ambae offenderant animum Isaac et Rebeccae"
      en: "And they both offended the mind of Isaac and Rebecca."
    status: { la: verified, en: verified }
