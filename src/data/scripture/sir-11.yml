# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 11
verses:
  - n: 1
    text:
      la: "Sapientia humiliati exaltabit caput illius, et in medio magnatorum consedere illum faciet."
      en: "The wisdom of the humble shall exalt his head, and shall make him sit in the midst of great men."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Non laudes virum in specie sua, neque spernas hominem in visu suo."
      en: "Praise not a man for his beauty, neither despise a man for his look."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Brevis in volatilibus est apis, et initium dulcoris habet fructus illius."
      en: "The bee is small among flying things, but her fruit hath the chiefest sweetness."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "In vestitu ne glorieris umquam, nec in die honoris tui extollaris: quoniam mirabilia opera Altissimi solius, et gloriosa, et absconsa, et invisa opera illius."
      en: "Glory not in apparel at any time, and be not exalted in the day of thy honour: for the works of the Highest only are wonderful, and his works are glorious, and secret, and hidden."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Multi tyranni sederunt in throno: et insuspicabilis portavit diadema."
      en: "Many tyrants have sat on the throne, and he whom no man would think on, hath worn the crown."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Multi potentes oppressi sunt valide, et gloriosi traditi sunt in manus alterorum."
      en: "Many mighty men have been greatly brought down, and the glorious have been delivered into the hand of others."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Priusquam interroges, ne vituperes quemquam: et cum interrogaveris, corripe juste."
      en: "Before thou inquire, blame no man: and when thou hast inquired, reprove justly."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Priusquam audias, ne respondeas verbum: et in medio sermonum ne adjicias loqui."
      en: "Before thou hear, answer not a word: and interrupt not others in the midst of their discourse."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "De ea re quae te non molestat, ne certeris: et in judicio peccantium ne consistas."
      en: "Strive not in a matter which doth not concern thee, and sit not in judgment with sinners."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Fili, ne in multis sint actus tui: et si dives fueris, non eris immunis a delicto. Si enim secutus fueris, non apprehendes: et non effugies, si praecucurreris."
      en: "My son, meddle not with many matters: and if thou be rich, thou shalt not be free from sin: for if thou pursue after thou shalt not overtake: and if thou run before thou shalt not escape."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Est homo laborans et festinans, et dolens: impius, et tanto magis non abundabit."
      en: "There is an ungodly man that laboureth, and maketh haste, and is in sorrow, and is so much the more in want."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Est homo marcidus egens recuperatione, plus deficiens virtute, et abundans paupertate:"
      en: "Again, there is an inactive man that wanteth help, is very weak in ability, and full of poverty:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et oculus Dei respexit illum in bono, et erexit eum ab humilitate ipsius, et exaltavit caput ejus: et mirati sunt in illo multi, et honoraverunt Deum."
      en: "Yet the eye of God hath looked upon him for good, and hath lifted him up from his low estate, and hath exalted his head: and many have wondered at him, and have glorified God."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Bona et mala, vita et mors, paupertas et honestas, a Deo sunt:"
      en: "Good things and evil, life and death, poverty and riches, are from God."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sapientia, et disciplina, et scientia legis, apud Deum: dilectio, et viae bonorum, apud ipsum."
      en: "Wisdom and discipline, and the knowledge of the law are with God. Love and the ways of good things are with him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Error et tenebrae peccatoribus concreata sunt: qui autem exsultant in malis consenescunt in malo."
      en: "Error and darkness are created with sinners: and they that glory in evil things, grow old in evil."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Datio Dei permanet justis, et profectus illius successus habebit in aeternum."
      en: "The gift of God abideth with the just, and his advancement shall have success for ever."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Est qui locupletatur parce agendo, et haec est pars mercedis illius."
      en: "There is one that is enriched by living sparingly, and this is the portion of his reward."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "In eo quod dicit: Inveni requiem mihi, et nunc manducabo de bonis meis solus:"
      en: "In that he saith: I have found me rest, and now I will eat of my goods alone:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et nescit quod tempus praeteriet, et mors appropinquet, et relinquat omnia aliis, et morietur."
      en: "And he knoweth not what time shall pass, and that death approacheth, and that he must leave all to others, and shall die."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Sta in testamento tuo, et in illo colloquere, et in opere mandatorum tuorum veterasce."
      en: "Be steadfast in thy covenant, and be conversant therein, and grow old in the work of thy commandments."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ne manseris in operibus peccatorum: confide autem in Deo, et mane in loco tuo."
      en: "Abide not in the works of sinners. But trust in God, and stay in thy place."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Facile est enim in oculis Dei subito honestare pauperem."
      en: "For it is easy in the eyes of God on a sudden to make the poor man rich."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Benedictio Dei in mercedem justi festinat, et in hora veloci processus illius fructificat."
      en: "The blessing of God maketh haste to reward the just, and in a swift hour his blessing beareth fruit."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Ne dicas: Quid est mihi opus? et quae erunt mihi ex hoc bona?"
      en: "Say not: What need I, and what good shall I have by this?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Ne dicas: Sufficiens mihi sum: et quid ex hoc pessimabor?"
      en: "Say not: I am sufficient for myself: and what shall I be made worse by this?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "In die bonorum ne immemor sis malorum, et in die malorum ne immemor sis bonorum:"
      en: "In the day of good things be not unmindful of evils: and in the day of evils be not unmindful of good things:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "quoniam facile est coram Deo in die obitus retribuere unicuique secundum vias suas."
      en: "For it is easy before God in the day of death to reward every one according to his ways."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Malitia horae oblivionem facit luxuriae magnae, et in fine hominis denudatio operum illius."
      en: "The affliction of an hour maketh one forget great delights, and in the end of a man is the disclosing of his works."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Ante mortem ne laudes hominem quemquam: quoniam in filiis suis agnoscitur vir."
      en: "Praise not any man before death, for a man is known by his children."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Non omnem hominem inducas in domum tuam: multae enim sunt insidiae dolosi."
      en: "Bring not every man into thy house: for many are the snares of the deceitful."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Sicut enim eructant praecordia foetentium, et sicut perdix inducitur in caveam, et ut caprea in laqueum: sic et cor superborum, et sicut prospector videns casum proximi sui."
      en: "For as corrupted bowels send forth stinking breath, and as the partridge is brought into the cage, and as the roe into the snare: so also is the heart of the proud, and as a spy that looketh on the fall of his neighbour."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Bona enim in mala convertens insidiatur, et in electis imponet maculam."
      en: "For he lieth in wait and turneth good into evil, and on the elect he will lay a blot."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "A scintilla una augetur ignis, et ab uno doloso augetur sanguis: homo vero peccator sanguini insidiatur."
      en: "Of one spark cometh a great fire, and of one deceitful man much blood: and a sinful man lieth in wait for blood."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Attende tibi a pestifero, fabricat enim mala, ne inducat super te subsannationem in perpetuum."
      en: "Take heed to thyself of a mischievous man, for he worketh evils: lest he bring upon thee reproach for ever."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Admitte ad te alienigenam: et subvertet te in turbine, et abalienabit te a tuis propriis."
      en: "Receive a stranger in, and he shall overthrow thee with a whirlwind, and shall turn thee out of thy own."
    status: { la: verified, en: verified }
