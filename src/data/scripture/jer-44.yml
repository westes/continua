# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 44
verses:
  - n: 1
    text:
      la: "Verbum quod factum est per Jeremiam ad omnes Judaeos qui habitabant in terra Aegypti, habitantes in Magdalo, et in Taphnis, et in Memphis, et in terra Phatures, dicens:"
      en: "The word that came to Jeremias, concerning all the Jews that dwelt in the land of Egypt, dwelling in Magdal, and in Taphnis, and in Memphis, and in the land of Phatures, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Haec dicit Dominus exercituum, Deus Israel: Vos vidistis omne malum istud quod adduxi super Jerusalem, et super omnes urbes Juda: et ecce desertae sunt hodie, et non est in eis habitator,"
      en: "Thus saith the Lord of hosts the God of Israel: You have seen all this evil that I have brought upon Jerusalem, and upon all the cities of Juda: and behold they are desolate this day, and there is not an inhabitant in them:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "propter malitiam quam fecerunt ut me ad iracundiam provocarent, et irent ut sacrificarent, et colerent deos alienos quos nesciebant, et illi, et vos, et patres vestri."
      en: "Because of the wickedness which they have committed, to provoke me to wrath, and to go and offer sacrifice, and worship other gods, which neither they, nor you, nor your fathers knew."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et misi ad vos omnes servos meos prophetas, de nocte consurgens, mittensque et dicens: Nolite facere verbum abominationis hujuscemodi, quam odivi."
      en: "And I sent to you all my servants the prophets, rising early, and sending, and saying: Do not commit this abominable thing, which I hate."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et non audierunt, nec inclinaverunt aurem suam, ut converterentur a malis suis, et non sacrificarent diis alienis."
      en: "But they heard not, nor inclined their ear to turn from their evil ways, and not to sacrifice to strange gods."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et conflata est indignatio mea et furor meus, et succensa est in civitatibus Juda, et in plateis Jerusalem, et versae sunt in solitudinem et vastitatem secundum diem hanc."
      en: "Wherefore my indignation and my fury was poured forth, and was kindled in the cities of Juda, and in the streets of Jerusalem: and they are turned to desolation and waste, as at this day."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et nunc haec dicit Dominus exercituum, Deus Israel: Quare vos facitis malum grande hoc contra animas vestras, ut intereat ex vobis vir et mulier, parvulus et lactens, de medio Judae, nec relinquatur vobis quidquam residuum:"
      en: "And now thus saith the Lord of hosts the God of Israel: Why do you commit this great evil against your own souls, that there should die of you man and woman, child and suckling out of the midst of Juda, and no remnant should be left you:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "provocantes me in operibus manuum vestrarum, sacrificando diis alienis in terra Aegypti, in quam ingressi estis ut habitetis ibi et dispereatis, et sitis in maledictionem et in opprobrium cunctis gentibus terrae?"
      en: "In that you provoke me to wrath with the works of your hands, by sacrificing to other gods in the land of Egypt, into which you are come to dwell there: and that you should perish, and be a curse, and a reproach to all the nations of the earth?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Numquid obliti estis mala patrum vestrorum, et mala regum Juda, et mala uxorum ejus, et mala vestra, et mala uxorum vestrarum, quae fecerunt in terra Juda, et in regionibus Jerusalem?"
      en: "Have you forgotten the evils of your fathers, and the evils of the kings of Juda, and the evils of their wives, and your evils, and the evils of your wives, that they have done in the land of Juda, and in the streets of Jerusalem?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Non sunt mundati usque ad diem hanc: et non timuerunt, et non ambulaverunt in lege Domini, et in praeceptis meis, quae dedi coram vobis et coram patribus vestris."
      en: "They are not cleansed even to this day: neither have they feared, nor walked in the law of the Lord, nor in my commandments, which I set before you and your fathers."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ideo haec dicit Dominus exercituum, Deus Israel: Ecce ego ponam faciem meam in vobis in malum: et disperdam omnem Judam."
      en: "Therefore thus saith the Lord of hosts the God of Israel: Behold I will set my face upon you for evil: and I will destroy all Juda."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et assumam reliquias Judae, qui posuerunt facies suas ut ingrederentur terram Aegypti, et habitarent ibi, et consumentur omnes in terra Aegypti: cadent in gladio, et in fame, et consumentur a minimo usque ad maximum: in gladio et in fame morientur, et erunt in jusjurandum, et in miraculum, et in maledictionem, et in opprobrium."
      en: "And I will take the remnant of Juda that have set their faces to go into the land of Egypt, and to dwell there: and they shall be all consumed in the land of Egypt: they shall fall by the sword, and by the famine: and they shall be consumed from the least even to the greatest, by the sword, and by the famine shall they die: and they shall be for an execration, and for a wonder, and for a curse, and for a reproach."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et visitabo super habitatores terrae Aegypti, sicut visitavi super Jerusalem, in gladio, et fame, et peste:"
      en: "And I will visit them that dwell in the land of Egypt, as I have visited Jerusalem by the sword, and by famine, and by pestilence."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et non erit qui effugiat, et sit residuus de reliquis Judaeorum qui vadunt ut peregrinentur in terra Aegypti, et revertantur in terram Juda, ad quam ipsi elevant animas suas ut revertantur, et habitent ibi: non revertentur, nisi qui fugerint."
      en: "And there shall be none that shall escape, and remain of the remnant of the Jews that are gone to sojourn in the land of Egypt: and that shall return into the land of Juda, to which they have a desire to return to dwell there: there shall none return but they that shall flee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Responderunt autem Jeremiae omnes viri scientes quod sacrificarent uxores eorum diis alienis, et universae mulieres quarum stabat multitudo grandis, et omnis populus habitantium in terra Aegypti in Phatures, dicentes:"
      en: "Then all the men that knew that their wives sacrificed to other gods: and all the women of whom there stood by a great multitude, and all the people of them that dwelt in the land of Egypt in Phatures, answered Jeremias, saying:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sermonem quem locutus es ad nos in nomine Domini, non audiemus ex te:"
      en: "As for the word which thou hast spoken to us in the name of the Lord, we will not hearken to thee:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sed facientes faciemus omne verbum quod egredietur de ore nostro, ut sacrificemus reginae caeli, et libemus ei libamina, sicut fecimus nos et patres nostri, reges nostri et principes nostri, in urbibus Juda, et in plateis Jerusalem: et saturati sumus panibus, et bene nobis erat, malumque non vidimus."
      en: "But we will certainly do every word that shall proceed out of our own mouth, to sacrifice to the queen of heaven, and to pour out drink offerings to her, as we and our fathers have done, our kings, and our princes in the cities of Juda, and in the streets of Jerusalem: and we were filled with bread, and it was well with us, and we saw no evil."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ex eo autem tempore quo cessavimus sacrificare reginae caeli, et libare ei libamina, indigemus omnibus, et gladio et fame consumpti sumus."
      en: "But since we left off to offer sacrifice to the queen of heaven, and to pour out drink offerings to her, we have wanted all things, and have been consumed by the sword, and by famine."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Quod si nos sacrificamus reginae caeli, et libamus ei libamina, numquid sine viris nostris fecimus ei placentas ad colendum eam, et libandum ei libamina?"
      en: "And if we offer sacrifice to the queen of heaven, and pour out drink offerings to her: did we make cakes to worship her, to pour out drink offerings to her, without our husbands?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et dixit Jeremias ad omnem populum, adversum viros, et adversum mulieres, et adversum universam plebem, qui responderant ei verbum, dicens:"
      en: "And Jeremias spoke to all the people, to the men, and to the women, and to all the people which had given him that answer, saying:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Numquid non sacrificium quod sacrificastis in civitatibus Juda, et in plateis Jerusalem, vos et patres vestri, reges vestri, et principes vestri, et populus terrae, horum recordatus est Dominus, et ascendit super cor ejus?"
      en: "Was it not the sacrifice that you offered in the cities of Juda, and in the streets of Jerusalem, you and your fathers, your kings, and your princes, and the people of the land, which the Lord hath remembered, and hath it not entered into his heart?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et non poterat Dominus ultra portare propter malitiam studiorum vestrorum, et propter abominationes quas fecistis: et facta est terra vestra in desolationem, et in stuporem, et in maledictum, eo quod non sit habitator, sicut est dies haec."
      en: "So that the Lord could no longer bear, because of the evil of your doings, and because of the abominations which you have committed: therefore your land is become a desolation, and an astonishment, and a curse, without an inhabitant, as at this day."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Propterea quod sacrificaveritis idolis, et peccaveritis Domino, et non audieritis vocem Domini, et in lege, et in praeceptis, et in testimoniis ejus non ambulaveritis, idcirco evenerunt vobis mala haec, sicut est dies haec."
      en: "Because you have sacrificed to idols, and have sinned against the Lord: and have not obeyed the voice of the Lord, and have not walked in his law, and in his commandments, and in his testimonies: therefore are these evils come upon you, as at this day."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Dixit autem Jeremias ad omnem populum, et ad universas mulieres: Audite verbum Domini, omnis Juda, qui estis in terra Aegypti."
      en: "And Jeremias said to all the people, and to all the women: Hear ye the word of the Lord, all Juda, you that dwell in the land of Egypt:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Haec inquit Dominus exercituum, Deus Israel, dicens: Vos et uxores vestrae, locuti estis ore vestro, et manibus vestris implestis, dicentes: Faciamus vota nostra, quae vovimus, ut sacrificemus reginae caeli, et libemus ei libamina. Implestis vota vestra, et opere perpetrastis ea."
      en: "Thus saith the Lord of hosts the God of Israel, saying: You and your wives have spoken with your mouth, and fulfilled with your hands, saying: Let us perform our vows which we have made, to offer sacrifice to the queen of heaven, and to pour out drink offerings to her: you have fulfilled your vows, and have performed them indeed."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Ideo audite verbum Domini, omnis Juda, qui habitatis in terra Aegypti: Ecce ego juravi in nomine meo magno, ait Dominus, quia nequaquam ultra vocabitur nomen meum ex ore omnis viri Judaei, dicentis: Vivit Dominus Deus, in omni terra Aegypti."
      en: "Therefore hear ye the word of the Lord, all Juda, you that dwell in the land of Egypt: Behold I have sworn by my great name, saith the Lord: that my name shall no more be named in the mouth of any man of Juda, in the land of Egypt, saying: The Lord God liveth."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ecce ego vigilabo super eos in malum, et non in bonum: et consumentur omnes viri Juda qui sunt in terra Aegypti gladio et fame, donec penitus consumantur."
      en: "Behold I will watch over them for evil, and not for good: and all the men of Juda that are in the land of Egypt, shall be consumed, by the sword, and by famine, till there be an end of them."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et qui fugerint gladium, revertentur de terra Aegypti in terram Juda viri pauci: et scient omnes reliquiae Juda, ingredientium terram Aegypti ut habitent ibi, cujus sermo compleatur, meus an illorum."
      en: "And a few men that shall flee from the sword, shall return out of the land of Egypt into the land of Juda: and all the remnant of Juda that are gone into the land of Egypt to dwell there, shall know whose word shall stand, mine, or theirs."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et hoc vobis signum, ait Dominus, quod visitem ego super vos in loco isto, ut sciatis quia vere complebuntur sermones mei contra vos in malum:"
      en: "And this shall be a sign to you, saith the Lord, that I will punish you in this place: that you may know that my words shall be accomplished indeed against you for evil."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "haec dicit Dominus: Ecce ego tradam Pharaonem Ephree regem Aegypti, in manu inimicorum ejus, et in manu quaerentium animam illius, sicut tradidi Sedeciam regem Juda in manu Nabuchodonosor regis Babylonis, inimici sui, et quaerentis animam ejus."
      en: "Thus saith the Lord: Behold I will deliver Pharao Ephree king of Egypt into the hand of his enemies, and into the hand of them that seek his life: as I delivered Sedecias king of Juda into the hand of Nabuchodonosor the king of Babylon his enemy, and that sought his life."
    status: { la: verified, en: verified }
