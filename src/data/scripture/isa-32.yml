# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 32
verses:
  - n: 1
    text:
      la: "ecce in iustitia regnabit rex et principes in iudicio praeerunt"
      en: "Behold a king shall reign in justice, and princes shell rule in judgment."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et erit vir sicut qui absconditur a vento et celat se a tempestate sicut rivi aquarum in siti et umbra petrae prominentis in terra deserta"
      en: "And a man shall be as when one is hid from the wind, and hideth himself from a storm, as rivers of waters in drought, and the shadow of a rock that standeth out in a desert land."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "non caligabunt oculi videntium et aures audientium diligenter auscultabunt"
      en: "The eyes of them that see shall not be dim, and the ears of them that hear shall hearken diligently."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et cor stultorum intelleget scientiam et lingua balborum velociter loquetur et plane"
      en: "And the heart of fools shall understand knowledge, and the tongue of stammerers shall speak readily and plain."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "non vocabitur ultra is qui insipiens est princeps neque fraudulentus appellabitur maior"
      en: "The fool shall no more be called prince: neither shall the deceitful be called great:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "stultus enim fatua loquetur et cor eius faciet iniquitatem ut perficiat simulationem et loquatur ad Dominum fraudulenter et vacuefaciat animam esurientis et potum sitienti auferat"
      en: "For the fool will speak foolish things, and his heart will work iniquity, to practise hypocrisy, and speak to the Lord deceitfully, and to make empty the soul of the hungry, and take away drink from the thirsty."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "fraudulenti vasa pessima sunt ipse enim cogitationes concinnavit ad perdendos mites in sermone mendacii cum loqueretur pauper iudicium"
      en: "The vessels of the deceitful are most wicked: for he hath framed devices to destroy the meek, with lying words, when the poor man speaketh judgment."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "princeps vero ea quae digna sunt principe cogitavit et ipse super duces stabit"
      en: "But the prince will devise such things as are worthy of a prince, and he shah stand above the rulers."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "mulieres opulentae surgite et audite vocem meam filiae confidentes percipite auribus eloquium meum"
      en: "Rise up, ye rich women, and hear my voice: ye confident daughters, give ear to my speech."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "post dies et annum et vos conturbabimini confidentes consummata est enim vindemia collectio ultra non veniet"
      en: "For after days and a year, you that are confident shall be troubled: for the vintage is at an end, the gathering shall come no more."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "obstupescite opulentae conturbamini confidentes exuite vos et confundimini accingite lumbos vestros"
      en: "Be astonished, ye rich women, be troubled, ye confident ones: strip yen, and be confounded, gird your loins."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "super ubera plangite super regione desiderabili super vinea fertili"
      en: "Mourn for your breasts, for the delightful country, for the fruitful vineyard."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "super humum populi mei spina et vepres ascendent quanto magis super omnes domos gaudii civitatis exultantis"
      en: "Upon the land of my people shall thorns and briers come up: how much more upon all the houses of joy, of the city that rejoiced?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "domus enim dimissa est multitudo urbis relicta est tenebrae et palpatio factae sunt super speluncas usque in aeternum gaudium onagrorum pascua gregum"
      en: "For the house is forsaken, the multitude of the city is left, darkness and obscurity are come upon its dens for ever. A joy of wild asses, the pastures of docks,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "donec effundatur super nos spiritus de excelso et erit desertum in Chermel et Chermel in saltum reputabitur"
      en: "Until the spirit be poured upon us from on high: and the desert shall be se a charmel, and charmel shall be counted for a forest."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et habitabit in solitudine iudicium et iustitia in Chermel sedebit"
      en: "And judgment shall dwell in the wilderness, and justice shall sit in charmel."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et erit opus iustitiae pax et cultus iustitiae silentium et securitas usque in sempiternum"
      en: "And the work of justice shall be peace, and the service of justice quietness, and security for ever."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et sedebit populus meus in pulchritudine pacis et in tabernaculis fiduciae et in requie opulenta"
      en: "And my people shall sit in the beauty of peace, and in the tabernacles of confidence, and in wealthy rest."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "grando autem in descensione saltus et humilitate humiliabitur civitas"
      en: "But hail shall be in the descent of the forest, and the city shall be made very low."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "beati qui seminatis super omnes aquas inmittentes pedem bovis et asini"
      en: "Blessed are ye that sow upon all waters, sending thither the foot of the ox and the ass."
    status: { la: verified, en: verified }
