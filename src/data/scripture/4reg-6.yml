# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 4reg
chapter: 6
verses:
  - n: 1
    text:
      la: "dixerunt autem filii prophetarum ad Heliseum ecce locus in quo habitamus coram te angustus est nobis"
      en: "And the sons of the prophets said to Eliseus: Behold the place where we dwell with thee is too strait for us."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "eamus usque ad Iordanem et tollant singuli de silva materias singulas ut aedificemus nobis ibi locum ad habitandum qui dixit ite"
      en: "Let us go as far as the Jordan and take out of the wood every man a piece of timber, that we may build us there a place to dwell in. And he said: Go."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ait unus ex illis veni ergo et tu cum servis tuis respondit ego veniam"
      en: "And one of them said: But come thou also with thy servants. He answered: I will come."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et abiit cum eis cumque venissent ad Iordanem caedebant ligna"
      en: "So he went with them. And when they were come to the Jordan they cut down wood."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "accidit autem ut cum unus materiem succidisset caderet ferrum securis in aquam exclamavitque ille et ait eheu eheu eheu domine mi et hoc ipsum mutuo acceperam"
      en: "And it happened, as one was felling some timber, that the head of the axe fell into the water: and he cried out, and said: Alas, alas, alas, my lord, for this same was borrowed."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixit autem homo Dei ubi cecidit at ille monstravit ei locum praecidit ergo lignum et misit illuc natavitque ferrum"
      en: "And the man of God said: Where did it fall? and he shewed him the place. Then he cut off a piece of wood, and cast it in thither: and the iron swam."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et ait tolle qui extendit manum et tulit illud"
      en: "And he said: Take it up. And he put out his hand and took it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "rex autem Syriae pugnabat contra Israhel consiliumque iniit cum servis suis dicens in loco illo et illo ponamus insidias"
      en: "And the king of Syria warred against Israel, and took counsel with his servants, saying: In such and such a place let us lay ambushes."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "misit itaque vir Dei ad regem Israhel dicens cave ne transeas in loco illo quia ibi Syri in insidiis sunt"
      en: "And the man of God sent to the king of Israel, saying: Beware that thou pass not to such a place: for the Syrians are there in ambush."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "misit rex Israhel ad locum quem dixerat ei vir Dei et praeoccupavit eum et observavit se ibi non semel neque bis"
      en: "And the king of Israel sent to the place which the man of God had told him, and prevented him, and looked well to himself there not once nor twice."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "conturbatumque est cor regis Syriae pro hac re et convocatis servis suis ait quare non indicastis mihi quis proditor mei sit apud regem Israhel"
      en: "And the heart of the king of Syria was troubled for this thing. And calling together his servants, he said: Why do you not tell me who it is that betrays me to the king of Israel?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dixitque unus servorum eius nequaquam domine mi rex sed Heliseus propheta qui est in Israhel indicat regi Israhel omnia verba quaecumque locutus fueris in conclavi tuo"
      en: "And one of his servants said: No one, my lord O king: but Eliseus the prophet, that is in Israel, telleth the king of Israel all the words, that thou speakest in thy privy chamber."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixit eis ite et videte ubi sit ut mittam et capiam eum adnuntiaveruntque ei dicentes ecce in Dothan"
      en: "And he said to them: Go, and see where he is: that I may send, and take him. And they told him, saying: Behold he is in Dothan."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "misit ergo illuc equos et currus et robur exercitus qui cum venissent nocte circumdederunt civitatem"
      en: "Therefore he sent thither horses and chariots, and the strength of an army: and they came by night, and beset the city."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "consurgens autem diluculo minister viri Dei egressus est viditque exercitum in circuitu civitatis et equos et currus nuntiavitque ei dicens eheu eheu domine mi quid faciemus"
      en: "And the servant of the man of God rising early, went out, and saw an army round about the city, and horses and chariots: and he told him, saying: Alas, alas, alas, my lord, what shall we do?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "at ille respondit noli timere plures enim nobiscum sunt quam cum illis"
      en: "But he answered: Fear not: for there are more with us than with them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "cumque orasset Heliseus ait Domine aperi oculos huius ut videat et aperuit Dominus oculos pueri et vidit et ecce mons plenus equorum et curruum igneorum in circuitu Helisei"
      en: "And Eliseus prayed, and said: Lord, open his eyes, that he may see. And the Lord opened the eyes of the servant, and he saw: and behold the mountain was full of horses, and chariots of fire round about Eliseus."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "hostes vero descenderunt ad eum porro Heliseus oravit Dominum dicens percute obsecro gentem hanc caecitate percussitque eos Dominus ne viderent iuxta verbum Helisei"
      en: "And the enemies came down to him, but Eliseus prayed to the Lord, saying: Strike, I beseech thee, this people with blindness. And the Lord struck them with blindness, according to the word of Eliseus."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "dixit autem ad eos Heliseus non est haec via nec ista est civitas sequimini me et ostendam vobis virum quem quaeritis duxit ergo eos in Samariam"
      en: "And Eliseus said to them: This is not the way, neither is this the city: follow me, and I will shew you the man whom you seek. So he led them into Samaria."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "cumque ingressi fuissent in Samaria dixit Heliseus Domine aperi oculos istorum ut videant aperuitque Dominus oculos eorum et viderunt esse se in medio Samariae"
      en: "And when they were come into Samaria, Eliseus said: Lord, open the eyes of these men, that they may see. And the Lord opened their eyes, and they saw themselves to be in the midst of Samaria."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "dixitque rex Israhel ad Heliseum cum vidisset eos numquid percutiam eos pater mi"
      en: "And the king of Israel said to Eliseus, when he saw them: My father, shall I kill them?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "at ille ait non percuties neque enim cepisti eos gladio et arcu tuo ut percutias pone panem et aquam coram eis ut comedant et bibant et vadant ad dominum suum"
      en: "And he said: Thou shalt not kill them: for thou didst not take them with thy sword, or thy bow, that thou mayst kill them: but set bread and water before them, that they may eat and drink, and go to their master."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "adpositaque est eis ciborum magna praeparatio et comederunt et biberunt et dimisit eos abieruntque ad dominum suum et ultra non venerunt latrones Syriae in terram Israhel"
      en: "And a great provision of meats was set before them, and they ate and drank, and he let them go, and they went away to their master, and the robbers of Syria came no more into the land of Israel."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "factum est autem post haec congregavit Benadad rex Syriae universum exercitum suum et ascendit et obsidebat Samariam"
      en: "And tit came to pass after these things, that Benadad king of Syria gathered together all his army, and went up, and besieged Samaria."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "factaque est fames magna in Samaria et tamdiu obsessa est donec venundaretur caput asini octoginta argenteis et quarta pars cabi stercoris columbarum quinque argenteis"
      en: "And there was a great famine in Samaria: and so long did the siege continue, till the head of an ass was sold for fourscore pieces of silver, and the fourth part of a cabe of pigeon's dung, for five pieces of silver."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "cumque rex Israhel transiret per murum mulier exclamavit ad eum dicens salva me domine mi rex"
      en: "And as the king of Israel was passing by the wall, a certain woman cried out to him, saying: Save me, my lord O king."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "qui ait non te salvet Dominus unde salvare te possum de area an de torculari dixitque ad eam rex quid tibi vis quae respondit"
      en: "And he said: If the Lord doth not save thee, how can I save thee? out of the barnfloor, or out of the winepress? And the king said to her: What aileth thee? And she answered:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "mulier ista dixit mihi da filium tuum ut comedamus eum hodie et filium meum comedemus cras"
      en: "This woman said to me: Give thy son, that we may eat him to day, and we will eat my son to morrow."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "coximus ergo filium meum et comedimus dixique ei die altera da filium tuum ut comedamus eum quae abscondit filium suum"
      en: "So we boiled my son, and ate him. And I said to her on the next day: Give thy son that we may eat him. And she hath hid her son."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quod cum audisset rex scidit vestimenta sua et transiebat super murum viditque omnis populus cilicium quo vestitus erat ad carnem intrinsecus"
      en: "When the king heard this, he rent his garments, and passed by upon the wall. And all the people saw the haircloth which he wore within next to his flesh."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et ait haec mihi faciat Deus et haec addat si steterit caput Helisei filii Saphat super eum hodie"
      en: "And the king said: May God do so and so to me, and may he add more, if the head of Eliseus the son of Saphat shall stand on him this day."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Heliseus autem sedebat in domo sua et senes sedebant cum eo praemisit itaque virum et antequam veniret nuntius ille dixit ad senes numquid scitis quod miserit filius homicidae hic ut praecidatur caput meum videte ergo cum venerit nuntius cludite ostium et non sinatis eum introire ecce enim sonitus pedum domini eius post eum est"
      en: "But Eliseus sat in his house, and the ancients sat with him. So he sent a man before: and before that messenger came, he said to the ancients: Do you know that this son of a murderer hath sent to cut off my head? Look then, when the messenger shall come, shut the door, and suffer him not to come in: for behold the sound of his master's feet is behind him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et adhuc illo loquente eis apparuit nuntius qui veniebat ad eum et ait ecce tantum malum a Domino est quid amplius expectabo a Domino"
      en: "While he was yet speaking to them, the messenger appeared who was coming to him. And he said: Behold, so great an evil is from the Lord: what shall I look for more from the Lord?"
    status: { la: verified, en: verified }
