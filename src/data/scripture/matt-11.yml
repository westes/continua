# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 11
verses:
  - n: 1
    text:
      la: "Et factum est, cum consummasset Jesus, praecipiens duodecim discipulis suis, transiit inde ut doceret, et praedicaret in civitatibus eorum."
      en: "And it came to pass, when Jesus had made an end of commanding his twelve disciples, he passed from thence, to teach and preach in their cities."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Joannes autem cum audisset in vinculis opera Christi, mittens duos de discipulis suis,"
      en: "Now when John had heard in prison the works of Christ: sending two of his disciples he said to him:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ait illi: Tu es, qui venturus es, an alium exspectamus?"
      en: "Art thou he that art to come, or look we for another?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et respondens Jesus ait illis: Euntes renuntiate Joanni quae audistis, et vidistis."
      en: "And Jesus making answer said to them: Go and relate to John what you have heard and seen."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Caeci vident, claudi ambulant, leprosi mundantur, surdi audiunt, mortui resurgunt, pauperes evangelizantur:"
      en: "The blind see, the lame walk, the lepers are cleansed, the deaf hear, the dead rise again, the poor have the gospel preached to them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et beatus est, qui non fuerit scandalizatus in me."
      en: "And blessed is he that shall not be scandalized in me."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Illis autem abeuntibus, coepit Jesus dicere ad turbas de Joanne: Quid existis in desertum videre? arundinem vento agitatem?"
      en: "And when they went their way, Jesus began to say to the multitudes concerning John: What went you out into the desert to see? a reed shaken with the wind?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sed quid existis videre? hominem mollibus vestitum? Ecce qui mollibus vestiuntur, in domibus regum sunt."
      en: "But what went you out to see? a man clothed in soft garments? Behold they that are clothed in soft garments, are in the houses of kings."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sed quid existis videre? prophetam? Etiam dico vobis, et plus quam prophetam."
      en: "But what went you out to see? a prophet? yea I tell you, and more than a prophet."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Hic est enim de quo scriptum est: Ecce ego mitto angelum meum ante faciem tuam, qui praeparabit viam tuam ante te."
      en: "For this is he of whom it is written: Behold I send my angel before thy face, who shall prepare thy way before thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Amen dico vobis, non surrexit inter natos mulierum major Joanne Baptista: qui autem minor est in regno caelorum, major est illo."
      en: "Amen I say to you, there hath not risen among them that are born of women a greater than John the Baptist: yet he that is the lesser in the kingdom of heaven is greater than he."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "A diebus autem Joannis Baptistae usque nunc, regnum caelorum vim patitur, et violenti rapiunt illud."
      en: "And from the days of John the Baptist until now, the kingdom of heaven suffereth violence, and the violent bear it away."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Omnes enim prophetae et lex usque ad Joannem prophetaverunt:"
      en: "For all the prophets and the law prophesied until John:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et si vultis recipere, ipse est Elias, qui venturus est."
      en: "And if you will receive it, he is Elias that is to come."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Qui habet aures audiendi, audiat."
      en: "He that hath ears to hear, let him hear."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cui autem similem aestimabo generationem istam? Similis est pueris sedentibus in foro: qui clamantes coaequalibus"
      en: "But whereunto shall I esteem this generation to be like? It is like to children sitting in the market place."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dicunt: Cecinimus vobis, et non saltastis: lamentavimus, et non planxistis."
      en: "Who crying to their companions say: We have piped to you, and you have not danced: we have lamented, and you have not mourned."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Venit enim Joannes neque manducans, neque bibens, et dicunt: Daemonium habet."
      en: "For John came neither eating nor drinking; and they say: He hath a devil."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Venit Filius hominis manducans, et bibens, et dicunt: Ecce homo vorax, et potator vini, publicanorum et peccatorum amicus. Et justificata est sapientia a filiis suis."
      en: "The Son of man came eating and drinking, and they say: Behold a man that is a glutton and a wine drinker, a friend of publicans and sinners. And wisdom is justified by her children."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Tunc coepit exprobrare civitatibus, in quibus factae sunt plurimae virtutes ejus, quia non egissent poenitentiam:"
      en: "Then began he to upbraid the cities wherein were done the most of his miracles, for that they had not done penance."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Vae tibi Corozain, vae tibi Bethsaida: quia, si in Tyro et Sidone factae essent virtutes quae factae sunt in vobis, olim in cilicio et cinere poenitentiam egissent."
      en: "Woe to thee, Corozain, woe to thee, Bethsaida: for if in Tyre and Sidon had been wrought the miracles that have been wrought in you, they had long ago done penance in sackcloth and ashes."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Verumtamen dico vobis: Tyro et Sidoni remissius erit in die judicii, quam vobis."
      en: "But I say unto you, it shall be more tolerable for Tyre and Sidon in the day of judgment, than for you."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et tu Capharnaum, numquid usque in caelum exaltaberis? usque in infernum descendes, quia si in Sodomis factae fuissent virtutes quae factae sunt in te, forte mansissent usque in hanc diem."
      en: "And thou Capharnaum, shalt thou be exalted up to heaven? thou shalt go down even unto hell. For if in Sodom had been wrought the miracles that have been wrought in thee, perhaps it had remained unto this day."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Verumtamen dico vobis, quia terrae Sodomorum remissius erit in die judicii, quam tibi."
      en: "But I say unto you, that it shall be more tolerable for the land of Sodom in the day of judgment, than for thee."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "In illo tempore respondens Jesus dixit: Confiteor tibi, Pater, Domine caeli et terrae, quia abscondisti haec a sapientibus, et prudentibus, et revelasti ea parvulis."
      en: "At that time Jesus answered and said: I confess to thee, O Father, Lord of heaven and earth, because thou hast hid these things from the wise and prudent, and hast revealed them to the little ones."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Ita Pater: quoniam sic fuit placitum ante te."
      en: "Yea, Father; for so hath it seemed good in thy sight."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Omnia mihi tradita sunt a Patre meo. Et nemo novit Filium, nisi Pater: neque Patrem quis novit, nisi Filius, et cui voluerit Filius revelare."
      en: "All things are delivered to me by my Father. And no one knoweth the Son, but the Father: neither doth any one know the Father, but the Son, and he to whom it shall please the Son to reveal him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Venite ad me omnes qui laboratis, et onerati estis, et ego reficiam vos."
      en: "Come to me, all you that labour, and are burdened, and I will refresh you."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Tollite jugum meum super vos, et discite a me, quia mitis sum, et humilis corde: et invenietis requiem animabus vestris."
      en: "Take up my yoke upon you, and learn of me, because I am meek, and humble of heart: and you shall find rest to your souls."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Jugum enim meum suave est, et onus meum leve."
      en: "For my yoke is sweet and my burden light."
    status: { la: verified, en: verified }
