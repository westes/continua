# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: amos
chapter: 3
verses:
  - n: 1
    text:
      la: "audite verbum quod locutus est Dominus super vos filii Israhel super omni cognatione quam eduxi de terra Aegypti dicens"
      en: "Hear the word that the Lord hath spoken concerning you, O ye children of Israel: concerning the whole family that I brought up out of the land of Egypt, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tantummodo vos cognovi ex omnibus cognationibus terrae idcirco visitabo super vos omnes iniquitates vestras"
      en: "You only have I known of all the families of the earth: therefore will I visit upon you all your iniquities."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "numquid ambulabunt duo pariter nisi convenerit eis"
      en: "Shall two walk together except they be agreed?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "numquid rugiet leo in saltu nisi habuerit praedam numquid dabit catulus leonis vocem de cubili suo nisi aliquid adprehenderit"
      en: "Will a lion roar in the forest, if he have no prey? will the lion's whelp cry out of his den, if he have taken nothing ?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "numquid cadet avis in laqueum terrae absque aucupe numquid auferetur laqueus de terra antequam quid ceperit"
      en: "Will the bird fall into the snare upon the earth, if there be no fowler? Shall the snare be taken up from the earth, before it hath taken somewhat ?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "si clanget tuba in civitate et populus non expavescet si erit malum in civitate quod Dominus non fecit"
      en: "Shall the trumpet sound in a city, and the people not be afraid? Shall there be evil in a city, which the Lord hath not done?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quia non faciet Dominus Deus verbum nisi revelaverit secretum suum ad servos suos prophetas"
      en: "For the Lord God doth nothing without revealing his secret to his servants the prophets."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "leo rugiet quis non timebit Dominus Deus locutus est quis non prophetabit"
      en: "The lion shall roar, who will not fear? The Lord God hath spoken, who shall not prophesy?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "auditum facite in aedibus Azoti et in aedibus terrae Aegypti et dicite congregamini super montes Samariae et videte insanias multas in medio eius et calumniam patientes in penetrabilibus eius"
      en: "Publish it in the houses of Azotus, and in the houses of the land of Egypt, and say: Assemble yourselves upon the mountains of Samaria, and behold the many follies in the midst thereof, and them that suffer oppression in the inner rooms thereof."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et nescierunt facere rectum dicit Dominus thesaurizantes iniquitatem et rapinas in aedibus suis"
      en: "And they have not known to do the right thing, saith the Lord, storing up iniquity, and robberies in their houses."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "propterea haec dicit Dominus Deus tribulabitur et circumietur terra et detrahetur ex te fortitudo tua et diripientur aedes tuae"
      en: "Therefore thus saith the Lord God: The land shall be in tribulation, and shall be compassed about: and thy strength shall be taken away from thee, and thy houses shall be spoiled."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "haec dicit Dominus quomodo si eruat pastor de ore leonis duo crura aut extremum auriculae sic eruentur filii Israhel qui habitant in Samaria in plaga lectuli et in Damasco grabatti"
      en: "Thus saith the Lord: As if a shepherd should get out of the lion's mouth two legs, or the tip of the ear: so shall the children of Israel be taken out that dwell in Samaria, in a piece of a bed, and in the couch of Damascus."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "audite et contestamini in domo Iacob dicit Dominus Deus exercituum"
      en: "Hear ye, and testify in the house of Jacob, saith the Lord the God of hosts:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quia in die cum visitare coepero praevaricationes Israhel super eum visitabo et super altaria Bethel et amputabuntur cornua altaris et cadent in terram"
      en: "That in the day when I shall begin to visit the transgressions of Israel, I will visit upon him, and upon the altars of Bethel: and the horns of the altars shall be cut off, and shall fall to the ground."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et percutiam domum hiemalem cum domo aestiva et peribunt domus eburneae et dissipabuntur aedes multae dicit Dominus"
      en: "And I will strike the winter house with the summer house: and the houses of ivory shall perish, and many houses shall be destroyed, saith the Lord."
    status: { la: verified, en: verified }
