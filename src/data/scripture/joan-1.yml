# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: joan
chapter: 1
verses:
  - n: 1
    text:
      la: "in principio erat Verbum et Verbum erat apud Deum et Deus erat Verbum"
      en: "In the beginning was the Word, and the Word was with God, and the Word was God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "hoc erat in principio apud Deum"
      en: "The same was in the beginning with God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "omnia per ipsum facta sunt et sine ipso factum est nihil quod factum est"
      en: "All things were made by him: and without him was made nothing that was made."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "in ipso vita erat et vita erat lux hominum"
      en: "In him was life, and the life was the light of men."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et lux in tenebris lucet et tenebrae eam non conprehenderunt"
      en: "And the light shineth in darkness, and the darkness did not comprehend it."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "fuit homo missus a Deo cui nomen erat Iohannes"
      en: "There was a man sent from God, whose name was John."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "hic venit in testimonium ut testimonium perhiberet de lumine ut omnes crederent per illum"
      en: "This man came for a witness, to give testimony of the light, that all men might believe through him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "non erat ille lux sed ut testimonium perhiberet de lumine"
      en: "He was not the light, but was to give testimony of the light."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "erat lux vera quae inluminat omnem hominem venientem in mundum"
      en: "That was the true light, which enlighteneth every man that cometh into this world."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in mundo erat et mundus per ipsum factus est et mundus eum non cognovit"
      en: "He was in the world, and the world was made by him, and the world knew him not."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in propria venit et sui eum non receperunt"
      en: "He came unto his own, and his own received him not."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quotquot autem receperunt eum dedit eis potestatem filios Dei fieri his qui credunt in nomine eius"
      en: "But as many as received him, he gave them power to be made the sons of God, to them that believe in his name."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui non ex sanguinibus neque ex voluntate carnis neque ex voluntate viri sed ex Deo nati sunt"
      en: "Who are born, not of blood, nor of the will of the flesh, nor of the will of man, but of God."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et Verbum caro factum est et habitavit in nobis et vidimus gloriam eius gloriam quasi unigeniti a Patre plenum gratiae et veritatis"
      en: "And the Word was made flesh, and dwelt among us, (and we saw his glory, the glory as it were of the only begotten of the Father,) full of grace and truth."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Iohannes testimonium perhibet de ipso et clamat dicens hic erat quem dixi vobis qui post me venturus est ante me factus est quia prior me erat"
      en: "John beareth witness of him, and crieth out, saying: This was he of whom I spoke: He that shall come after me, is preferred before me: because he was before me."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et de plenitudine eius nos omnes accepimus et gratiam pro gratia"
      en: "And of his fulness we all have received, and grace for grace."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quia lex per Mosen data est gratia et veritas per Iesum Christum facta est"
      en: "For the law was given by Moses; grace and truth came by Jesus Christ."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Deum nemo vidit umquam unigenitus Filius qui est in sinu Patris ipse enarravit"
      en: "No man hath seen God at any time: the only begotten Son who is in the bosom of the Father, he hath declared him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et hoc est testimonium Iohannis quando miserunt Iudaei ab Hierosolymis sacerdotes et Levitas ad eum ut interrogarent eum tu quis es"
      en: "And this is the testimony of John, when the Jews sent from Jerusalem priests and Levites to him, to ask him: Who art thou?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et confessus est et non negavit et confessus est quia non sum ego Christus"
      en: "And he confessed, and did not deny: and he confessed: I am not the Christ."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et interrogaverunt eum quid ergo Helias es tu et dicit non sum propheta es tu et respondit non"
      en: "And they asked him: What then? Art thou Elias? And he said: I am not. Art thou the prophet? And he answered: No."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "dixerunt ergo ei quis es ut responsum demus his qui miserunt nos quid dicis de te ipso"
      en: "They said therefore unto him: Who art thou, that we may give an answer to them that sent us? What sayest thou of thyself?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ait ego vox clamantis in deserto dirigite viam Domini sicut dixit Esaias propheta"
      en: "He said: I am the voice of one crying out in the wilderness, make straight the way of the Lord, as said the prophet Isaias."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et qui missi fuerant erant ex Pharisaeis"
      en: "And they that were sent, were of the Pharisees."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et interrogaverunt eum et dixerunt ei quid ergo baptizas si tu non es Christus neque Helias neque propheta"
      en: "And they asked him, and said to him: Why then dost thou baptize, if thou be not Christ, nor Elias, nor the prophet?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "respondit eis Iohannes dicens ego baptizo in aqua medius autem vestrum stetit quem vos non scitis"
      en: "John answered them, saying: I baptize with water; but there hath stood one in the midst of you, whom you know not."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ipse est qui post me venturus est qui ante me factus est cuius ego non sum dignus ut solvam eius corrigiam calciamenti"
      en: "The same is he that shall come after me, who is preferred before me: the latchet of whose shoe I am not worthy to loose."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "haec in Bethania facta sunt trans Iordanen ubi erat Iohannes baptizans"
      en: "These things were done in Bethania, beyond the Jordan, where John was baptizing."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "altera die videt Iohannes Iesum venientem ad se et ait ecce agnus Dei qui tollit peccatum mundi"
      en: "The next day, John saw Jesus coming to him, and he saith: Behold the Lamb of God, behold him who taketh away the sin of the world."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "hic est de quo dixi post me venit vir qui ante me factus est quia prior me erat"
      en: "This is he, of whom I said: After me there cometh a man, who is preferred before me: because he was before me."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et ego nesciebam eum sed ut manifestaretur Israhel propterea veni ego in aqua baptizans"
      en: "And I knew him not, but that he may be made manifest in Israel, therefore am I come baptizing with water."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et testimonium perhibuit Iohannes dicens quia vidi Spiritum descendentem quasi columbam de caelo et mansit super eum"
      en: "And John gave testimony, saying: I saw the Spirit coming down, as a dove from heaven, and he remained upon him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et ego nesciebam eum sed qui misit me baptizare in aqua ille mihi dixit super quem videris Spiritum descendentem et manentem super eum hic est qui baptizat in Spiritu Sancto"
      en: "And I knew him not; but he who sent me to baptize with water, said to me: He upon whom thou shalt see the Spirit descending, and remaining upon him, he it is that baptizeth with the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et ego vidi et testimonium perhibui quia hic est Filius Dei"
      en: "And I saw, and I gave testimony, that this is the Son of God."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "altera die iterum stabat Iohannes et ex discipulis eius duo"
      en: "The next day again John stood, and two of his disciples."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et respiciens Iesum ambulantem dicit ecce agnus Dei"
      en: "And beholding Jesus walking, he saith: Behold the Lamb of God."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et audierunt eum duo discipuli loquentem et secuti sunt Iesum"
      en: "And the two disciples heard him speak, and they followed Jesus."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "conversus autem Iesus et videns eos sequentes dicit eis quid quaeritis qui dixerunt ei rabbi quod dicitur interpretatum magister ubi habitas"
      en: "And Jesus turning, and seeing them following him, saith to them: What seek you? Who said to him, Rabbi, (which is to say, being interpreted, Master,) where dwellest thou?"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "dicit eis venite et videte venerunt et viderunt ubi maneret et apud eum manserunt die illo hora autem erat quasi decima"
      en: "He saith to them: Come and see. They came, and saw where he abode, and they stayed with him that day: now it was about the tenth hour."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "erat autem Andreas frater Simonis Petri unus ex duobus qui audierant ab Iohanne et secuti fuerant eum"
      en: "And Andrew, the brother of Simon Peter, was one of the two who had heard of John, and followed him."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "invenit hic primum fratrem suum Simonem et dicit ei invenimus Messiam quod est interpretatum Christus"
      en: "He findeth first his brother Simon, and saith to him: We have found the Messias, which is, being interpreted, the Christ."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et adduxit eum ad Iesum intuitus autem eum Iesus dixit tu es Simon filius Iohanna tu vocaberis Cephas quod interpretatur Petrus"
      en: "And he brought him to Jesus. And Jesus looking upon him, said: Thou art Simon the son of Jona: thou shalt be called Cephas, which is interpreted Peter."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "in crastinum voluit exire in Galilaeam et invenit Philippum et dicit ei Iesus sequere me"
      en: "On the following day, he would go forth into Galilee, and he findeth Philip. And Jesus saith to him: Follow me."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "erat autem Philippus a Bethsaida civitate Andreae et Petri"
      en: "Now Philip was of Bethsaida, the city of Andrew and Peter."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "invenit Philippus Nathanahel et dicit ei quem scripsit Moses in lege et prophetae invenimus Iesum filium Ioseph a Nazareth"
      en: "Philip findeth Nathanael, and saith to him: We have found him of whom Moses in the law, and the prophets did write, Jesus the son of Joseph of Nazareth."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et dixit ei Nathanahel a Nazareth potest aliquid boni esse dicit ei Philippus veni et vide"
      en: "And Nathanael said to him: Can any thing of good come from Nazareth? Philip saith to him: Come and see."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "vidit Iesus Nathanahel venientem ad se et dicit de eo ecce vere Israhelita in quo dolus non est"
      en: "Jesus saw Nathanael coming to him: and he saith of him: Behold an Israelite indeed, in whom there is no guile."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "dicit ei Nathanahel unde me nosti respondit Iesus et dixit ei priusquam te Philippus vocaret cum esses sub ficu vidi te"
      en: "Nathanael saith to him: Whence knowest thou me? Jesus answered, and said to him: Before that Philip called thee, when thou wast under the fig tree, I saw thee."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "respondit ei Nathanahel et ait rabbi tu es Filius Dei tu es rex Israhel"
      en: "Nathanael answered him, and said: Rabbi, thou art the Son of God, thou art the King of Israel."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "respondit Iesus et dixit ei quia dixi tibi vidi te sub ficu credis maius his videbis"
      en: "Jesus answered, and said to him: Because I said unto thee, I saw thee under the fig tree, thou believest: greater things than these shalt thou see."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "et dicit ei amen amen dico vobis videbitis caelum apertum et angelos Dei ascendentes et descendentes supra Filium hominis"
      en: "And he saith to him: Amen, amen I say to you, you shall see the heaven opened, and the angels of God ascending and descending upon the Son of man."
    status: { la: verified, en: verified }
