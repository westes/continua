# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2reg
chapter: 13
verses:
  - n: 1
    text:
      la: "factum est autem post haec ut Absalom filii David sororem speciosissimam vocabulo Thamar adamaret Amnon filius David"
      en: "And it came to pass after this, that Amnon the son of David loved the sister of Absalom the son of David, who was very beautiful, and her name was Thamar."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et deperiret eam valde ita ut aegrotaret propter amorem eius quia cum esset virgo difficile ei videbatur ut quippiam inhoneste ageret cum ea"
      en: "And he was exceedingly fond of her, so that he fell sick for the love of her: for as she was a virgin, he thought it hard to do any thing dishonestly with her."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "erat autem Amnonis amicus nomine Ionadab filius Semaa fratris David vir prudens valde"
      en: "Now Amnon had a friend, named Jonadab the son of Semmaa the brother of David, a very wise man:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui dixit ad eum quare sic adtenuaris macie fili regis per singulos dies cur non indicas mihi dixitque ei Amnon Thamar sororem Absalom fratris mei amo"
      en: "And he said to him: Why dost thou grow so lean from day to day, O son of the king? why dost thou not tell me the reason of it? And Amnon said to him: I am in love with Thamar the sister of my brother Absalom."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cui respondit Ionadab cuba super lectulum tuum et languorem simula cumque venerit pater tuus ut visitet te dic ei veniat oro Thamar soror mea ut det mihi cibum et faciat pulmentum ut comedam de manu eius"
      en: "And Jonadab said to him: Lie down upon thy bed, and feign thyself sick: and when thy father shall come to visit thee, say to him: Let my sister Thamar, I pray thee, come to me, to give me to eat, and to make me a mess, that I may eat it at her hand."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "accubuit itaque Amnon et quasi aegrotare coepit cumque venisset rex ad visitandum eum ait Amnon ad regem veniat obsecro Thamar soror mea ut faciat in oculis meis duas sorbitiunculas et cibum capiam de manu eius"
      en: "So Amnon lay down, and made as if he were sick: and when the king came to visit him, Amnon said to the king: I pray thee let my sister Thamar come, and make in my sight two little messes, that I may eat at her hand."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "misit ergo David ad Thamar domum dicens veni in domum Amnon fratris tui et fac ei pulmentum"
      en: "Then David sent home to Thamar, saying: Come to the house of thy brother Amnon, and make him a mess."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "venitque Thamar in domum Amnon fratris sui ille autem iacebat quae tollens farinam commiscuit et liquefaciens in oculis eius coxit sorbitiunculas"
      en: "And Thamar came to the house of Amnon her brother: but he was laid down: and she took meal and tempered it: and dissolving it in his sight she made little messes."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "tollensque quod coxerat effudit et posuit coram eo et noluit comedere dixitque Amnon eicite universos a me cumque eiecissent omnes"
      en: "And taking what she had boiled, she poured it out, and set it before him, but he would not eat: and Amnon said: Put out all persons from me. And when they had put all persons out,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dixit Amnon ad Thamar infer cibum in conclave ut vescar de manu tua tulit ergo Thamar sorbitiunculas quas fecerat et intulit ad Amnon fratrem suum in conclave"
      en: "Amnon said to Thamar: Bring the mess into the chamber, that I may eat at thy hand. And Thamar took the little messes which she had made, and brought them in to her brother Amnon in the chamber."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cumque obtulisset ei cibum adprehendit eam et ait veni cuba mecum soror mea"
      en: "And when she had presented him the meat, he took hold of her, and said: Come lie with me, my sister."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quae respondit ei noli frater mi noli opprimere me neque enim hoc fas est in Israhel noli facere stultitiam hanc"
      en: "She answered him: Do not so, my brother, do not force me: for no such thing must be done in Israel. Do not thou this folly."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et ego enim ferre non potero obprobrium meum et tu eris quasi unus de insipientibus in Israhel quin potius loquere ad regem et non negabit me tibi"
      en: "For I shall not be able to bear my shame, and thou shalt be as one of the fools in Israel: but rather speak to the king, and he will not deny me to thee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "noluit autem adquiescere precibus eius sed praevalens viribus oppressit eam et cubavit cum illa"
      en: "But he would not hearken to her prayers, but being stronger overpowered her and lay with her."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et exosam eam habuit Amnon magno odio nimis ita ut maius esset odium quo oderat eam amore quo ante dilexerat dixitque ei Amnon surge vade"
      en: "Then Amnon hated her with an exceeding great hatred: so that the hatred wherewith he hated her was greater than the love with which he had loved her before, And Amnon said to her: Arise, and get thee gone."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quae respondit ei maius est hoc malum quod nunc agis adversum me quam quod ante fecisti expellens me et noluit audire eam"
      en: "She answered him: This evil which now thou dost against me, in driving me away, is greater than that which thou didst before. And he would not hearken to her:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sed vocato puero qui ministrabat ei dixit eice hanc a me foras et claude ostium post eam"
      en: "But calling the servants that ministered to him, he said: Thrust this woman out from me: and shut the door after her."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quae induta erat talari tunica huiuscemodi enim filiae regis virgines vestibus utebantur eiecit itaque eam minister illius foras clausitque fores post eam"
      en: "And she was clothed with along robe: for the king's daughters that were virgins, used such kind of garments. Then his servant thrust her out: and shut the door after her."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quae aspergens cinerem capiti suo scissa talari tunica inpositisque manibus super caput suum ibat ingrediens et clamans"
      en: "And she put ashes on her head, and rent her long robe and laid her hands upon her head, and went on crying."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dixit autem ei Absalom frater suus num Amnon frater tuus concubuit tecum sed nunc soror tace frater tuus est neque adfligas cor tuum pro re hac mansit itaque Thamar contabescens in domo Absalom fratris sui"
      en: "And Absalom her brother said to her: Hath thy brother Amnon lain with thee? but now, sister, hold thy peace, he is thy brother: and afflict not thy heart for this thing. So Thamar remained pining away in the house of Absalom her brother."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "cum autem audisset rex David verba haec contristatus est valde"
      en: "And when king David heard of these things he was exceedingly grieved: and he would not afflict the spirit of his son Amnon, for he loved him, because he was his firstborn."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "porro non est locutus Absalom ad Amnon nec malum nec bonum oderat enim Absalom Amnon eo quod violasset Thamar sororem suam"
      en: "But Absalom spoke not to Amnon neither good nor evil: for Absalom hated Amnon because he had ravished his sister Thamar."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "factum est autem post tempus biennii ut tonderentur oves Absalom in Baalasor quae est iuxta Ephraim et vocavit Absalom omnes filios regis"
      en: "And it came to pass after two years, that the sheep of Absalom were shorn in Baalhasor, which is near Ephraim: and Absalom invited all the king's sons:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "venitque ad regem et ait ad eum ecce tondentur oves servi tui veniat oro rex cum servis suis ad servum suum"
      en: "And he came to the king, and said to him: Behold thy servant's sheep are shorn. Let the king, I pray, with his servants come to his servant."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "dixitque rex ad Absalom noli fili mi noli rogare ut veniamus omnes et gravemus te cum autem cogeret eum et noluisset ire benedixit ei"
      en: "And the king said to Absalom: Nay, my son, do not ask that we should all come, and be chargeable to thee. And when he pressed him, and he would not go, he blessed him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et ait Absalom si non vis venire veniat obsecro nobiscum saltem Amnon frater meus dixitque ad eum rex non est necesse ut vadat tecum"
      en: "And Absalom said: If thou wilt not come, at least let my brother Amnon, I beseech thee, come with us. And the king said to him: It is not necessary that he should go with thee."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "coegit itaque eum Absalom et dimisit cum eo Amnon et universos filios regis"
      en: "But Absalom pressed him, so that he let Amnon and all the king's sons go with him. And Absalom made a feast as it were the feast of a king."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "praeceperat autem Absalom pueris suis dicens observate cum temulentus fuerit Amnon vino et dixero vobis percutite eum et interficite nolite timere ego enim sum qui praecepi vobis roboramini et estote viri fortes"
      en: "And Absalom had commanded his servants, saying: Take notice when Amnon shall be drunk with wine, and when I shall say to you: Strike him, and kill him, fear not: for it is I that command you: take courage, and be valiant men."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "fecerunt ergo pueri Absalom adversum Amnon sicut praeceperat eis Absalom surgentesque omnes filii regis ascenderunt singuli mulas suas et fugerunt"
      en: "And the servants of Absalom did to Amnon as Absalom had commanded them. And all the king's sons arose and got up every man upon his mule, and fled."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "cumque adhuc pergerent in itinere fama praevenit ad David dicens percussit Absalom omnes filios regis et non remansit ex eis saltem unus"
      en: "And while they were yet in the way, a rumour came to David, saying: Absalom hath slain all the king's sons, and there is not one of them left."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "surrexit itaque rex et scidit vestimenta sua et cecidit super terram et omnes servi ipsius qui adsistebant ei sciderunt vestimenta sua"
      en: "Then the king rose up, and rent his garments: and fell upon the ground, and all his servants, that stood about him, rent their garments."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "respondens autem Ionadab filius Samaa fratris David dixit ne aestimet dominus meus quod omnes pueri filii regis occisi sint Amnon solus mortuus est quoniam in ore Absalom erat positus ex die qua oppressit Thamar sororem eius"
      en: "But Jonadab the son of Semmaa David's brother answering, said: Let not my lord the king think that all the king's sons are slain: Amnon only is dead, for he was appointed by the mouth of Absalom from the day that he ravished his sister Thamar."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "nunc ergo ne ponat dominus meus rex super cor suum verbum istud dicens omnes filii regis occisi sunt quoniam Amnon solus mortuus est"
      en: "Now therefore let not my lord the king take this thing into his heart, saying: All the king's sons are slain: for Amnon only is dead."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "fugit autem Absalom et levavit puer speculator oculos suos et aspexit et ecce populus multus veniebat per iter devium ex latere montis"
      en: "But Absalom fled away: and the young man that kept the watch, lifted up his eyes and looked, and behold there came much people by a by-way on the side of the mountain."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "dixit autem Ionadab ad regem ecce filii regis adsunt iuxta verbum servi tui sic factum est"
      en: "And Jonadab said to the king: Behold the king's sons are come: as thy servant said, so it is."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "cumque cessasset loqui apparuerunt et filii regis et intrantes levaverunt vocem suam et fleverunt sed et rex et omnes servi eius fleverunt ploratu magno nimis"
      en: "And when he made an end of speaking, the king's sons also appeared: and coming in they lifted up their voice, and wept: and the king also and all his servants wept very much."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "porro Absalom fugiens abiit ad Tholomai filium Amiur regem Gessur luxit ergo David filium suum cunctis diebus"
      en: "But Absalom fled, and went to Tholomai the son of Ammiud the king of Gessur. And David mourned for his son every day."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Absalom autem cum fugisset et venisset in Gessur fuit ibi tribus annis"
      en: "And Absalom after he was fled, and come into Gessur, was there three years. And king David ceased to pursue after Absalom, because he was comforted concerning the death of Amnon."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "cessavitque David rex persequi Absalom eo quod consolatus esset super Amnon interitu"
      en: "And king David ceased to pursue after Absalom, because he was comforted concerning the death of Amnon."
    status: { la: verified, en: verified }
