# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: rom
chapter: 7
verses:
  - n: 1
    text:
      la: "An ignoratis, fratres ( scientibus enim legem loquor), quia lex in homine dominatur quanto tempore vivit?"
      en: "Know you not, brethren, (for I speak to them that know the law,) that the law hath dominion over a man, as long as it liveth?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Nam quae sub viro est mulier, vivente viro, alligata est legi: si autem mortuus fuerit vir ejus, soluta est a lege viri."
      en: "For the woman that hath an husband, whilst her husband liveth is bound to the law. But if her husband be dead, she is loosed from the law of her husband."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Igitur, vivente viro, vocabitur adultera si fuerit cum alio viro: si autem mortuus fuerit vir ejus, liberata est a lege viri, ut non sit adultera si fuerit cum alio viro."
      en: "Therefore, whilst her husband liveth, she shall be called an adulteress, if she be with another man: but if her husband be dead, she is delivered from the law of her husband; so that she is not an adulteress, if she be with another man."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Itaque fratres mei, et vos mortificati estis legi per corpus Christi: ut sitis alterius, qui ex mortuis resurrexit, ut fructificemus Deo."
      en: "Therefore, my brethren, you also are become dead to the law, by the body of Christ; that you may belong to another, who is risen again from the dead, that we may bring forth fruit to God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cum enim essemus in carne, passiones peccatorum, quae per legem erant, operabantur in membris nostris, ut fructificarent morti."
      en: "For when we were in the flesh, the passions of sins, which were by the law, did work in our members, to bring forth fruit unto death."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Nunc autem soluti sumus a lege mortis, in qua detinebamur, ita ut serviamus in novitate spiritus, et non in vetustate litterae."
      en: "But now we are loosed from the law of death, wherein we were detained; so that we should serve in newness of spirit, and not in the oldness of the letter."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quid ergo dicemus? lex peccatum est? Absit. Sed peccatum non cognovi, nisi per legem: nam concupiscentiam nesciebam, nisi lex diceret: Non concupisces."
      en: "What shall we say, then? Is the law sin? God forbid. But I do not know sin, but by the law; for I had not known concupiscence, if the law did not say: Thou shalt not covet."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Occasione autem accepta, peccatum per mandatum operatum est in me omnem concupiscentiam. Sine lege enim peccatum mortuum erat."
      en: "But sin taking occasion by the commandment, wrought in me all manner of concupiscence. For without the law sin was dead."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ego autem vivebam sine lege aliquando: sed cum venisset mandatum, peccatum revixit."
      en: "And I lived some time without the law. But when the commandment came, sin revived,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ego autem mortuus sum: et inventum est mihi mandatum, quod erat ad vitam, hoc esse ad mortem."
      en: "And I died. And the commandment that was ordained to life, the same was found to be unto death to me."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Nam peccatum occasione accepta per mandatum, seduxit me, et per illud occidit."
      en: "For sin, taking occasion by the commandment, seduced me, and by it killed me."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Itaque lex quidem sancta, et mandatum sanctum, et justum, et bonum."
      en: "Wherefore the law indeed is holy, and the commandment holy, and just, and good."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quod ergo bonum est, mihi factum est mors? Absit. Sed peccatum, ut appareat peccatum, per bonum operatum est mihi mortem: ut fiat supra modum peccans peccatum per mandatum."
      en: "Was that then which is good, made death unto me? God forbid. But sin, that it may appear sin, by that which is good, wrought death in me; that sin, by the commandment, might become sinful above measure."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Scimus enim quia lex spiritualis est: ego autem carnalis sum, venundatus sub peccato."
      en: "For we know that the law is spiritual; but I am carnal, sold under sin."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quod enim operor, non intelligo: non enim quod volo bonum, hoc ago: sed quod odi malum, illud facio."
      en: "For that which I work, I understand not. For I do not that good which I will; but the evil which I hate, that I do."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Si autem quod nolo, illud facio: consentio legi, quoniam bona est."
      en: "If then I do that which I will not, I consent to the law, that it is good."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Nunc autem jam non ego operor illud, sed quod habitat in me peccatum."
      en: "Now then it is no more I that do it, but sin that dwelleth in me."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Scio enim quia non habitat in me, hoc est in carne mea, bonum. Nam velle, adjacet mihi: perficere autem bonum, non invenio."
      en: "For I know that there dwelleth not in me, that is to say, in my flesh, that which is good. For to will, is present with me; but to accomplish that which is good, I find not."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Non enim quod volo bonum, hoc facio: sed quod nolo malum, hoc ago."
      en: "For the good which I will, I do not; but the evil which I will not, that I do."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Si autem quod nolo, illud facio: jam non ego operor illud, sed quod habitat in me, peccatum."
      en: "Now if I do that which I will not, it is no more I that do it, but sin that dwelleth in me."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Invenio igitur legem, volenti mihi facere bonum, quoniam mihi malum adjacet:"
      en: "I find then a law, that when I have a will to do good, evil is present with me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "condelector enim legi Dei secundum interiorem hominem:"
      en: "For I am delighted with the law of God, according to the inward man:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "video autem aliam legem in membris meis, repugnantem legi mentis meae, et captivantem me in lege peccati, quae est in membris meis."
      en: "But I see another law in my members, fighting against the law of my mind, and captivating me in the law of sin, that is in my members."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Infelix ego homo, quis me liberabit de corpore mortis hujus?"
      en: "Unhappy man that I am, who shall deliver me from the body of this death?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "gratia Dei per Jesum Christum Dominum nostrum. Igitur ego ipse mente servio legi Dei: carne autem, legi peccati."
      en: "The grace of God, by Jesus Christ our Lord. Therefore, I myself, with the mind serve the law of God; but with the flesh, the law of sin."
    status: { la: verified, en: verified }
