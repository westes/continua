# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 26
verses:
  - n: 1
    text:
      la: "Respondens autem Job dixit:"
      en: "Then Job answered, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cujus adjutor es? numquid imbecillis? et sustentas brachium ejus qui non est fortis?"
      en: "Whose helper art thou? is it of him that is weak? and dost thou hold up the arm of him that has no strength?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cui dedisti consilium? forsitan illi qui non habet sapientiam, et prudentiam tuam ostendisti plurimam."
      en: "To whom hast thou given counsel? perhaps to him that hath no wisdom, and thou hast shewn thy very great prudence."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quem docere voluisti? nonne eum qui fecit spiramentum?"
      en: "Whom hast thou desired to teach? was it not him that made life?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ecce gigantes gemunt sub aquis, et qui habitant cum eis."
      en: "Behold the giants groan under the waters, and they that dwell with them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Nudus est infernus coram illo, et nullum est operimentum perditioni."
      en: "Hell is naked before him, and there is no covering for destruction."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Qui extendit aquilonem super vacuum, et appendit terram super nihilum."
      en: "He stretched out the north over the empty space, and hangeth the earth upon nothing."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Qui ligat aquas in nubibus suis, ut non erumpant pariter deorsum."
      en: "He bindeth up the waters in his clouds, so that they break not out and fall down together."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Qui tenet vultum solii sui, et expandit super illud nebulam suam."
      en: "He withholdeth the face of his throne, and spreadeth his cloud over it."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Terminum circumdedit aquis, usque dum finiantur lux et tenebrae."
      en: "He hath set bounds about the waters, till light and darkness come to an end."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Columnae caeli contremiscunt, et pavent ad nutum ejus."
      en: "The pillars of heaven tremble, and dread at his beck."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "In fortitudine illius repente maria congregata sunt, et prudentia ejus percussit superbum."
      en: "By his power the seas are suddenly gathered together, and his wisdom has struck the proud one."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Spiritus ejus ornavit caelos, et obstetricante manu ejus, eductus est coluber tortuosus."
      en: "His spirit hath adorned the heavens, and his obstetric hand brought forth the winding serpent."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ecce haec ex parte dicta sunt viarum ejus: et cum vix parvam stillam sermonis ejus audierimus, quis poterit tonitruum magnitudinis illius intueri?"
      en: "Lo, these things are said in part of his ways: and seeing we have heard scarce a little drop of his word, who shall be able to behold the thunder of his greatness?"
    status: { la: verified, en: verified }
