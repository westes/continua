# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 50
verses:
  - n: 1
    text:
      la: "haec dicit Dominus quis est hic liber repudii matris vestrae quo dimisi eam aut quis est creditor meus cui vendidi vos ecce in iniquitatibus vestris venditi estis et in sceleribus vestris dimisi matrem vestram"
      en: "Thus saith the Lord: What is this bill of the divorce of your mother, with which I have put her away? or who is my creditor, to whom I sold you: behold you are sold for your iniquities, and for your wicked deeds have I put your mother away."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quia veni et non erat vir vocavi et non erat qui audiret numquid adbreviata et parvula facta est manus mea ut non possim redimere aut non est in me virtus ad liberandum ecce in increpatione mea desertum faciam mare ponam flumina in siccum conputrescent pisces sine aqua et morientur in siti"
      en: "Because I came, and there was not a man: I called, and there was none that would hear. Is my hand shortened and become little, that I cannot redeem? or is there no strength in me to deliver? Behold at my rebuke I will make the sea a desert, I will turn the rivers into dry land: the fishes shall rot for want of water, and shall die for thirst."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "induam caelos tenebris et saccum ponam operimentum eorum"
      en: "I will clothe the heavens with darkness, and will make sackcloth their covering."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dominus dedit mihi linguam eruditam ut sciam sustentare eum qui lassus est verbo erigit mane mane erigit mihi aurem ut audiam quasi magistrum"
      en: "The Lord hath given me a learned tongue, that I should know how to uphold by word him that is weary: he wakeneth in the morning, in the morning he wakeneth my ear, that I may hear him as a master."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dominus Deus aperuit mihi aurem ego autem non contradico retrorsum non abii"
      en: "The Lord God hath opened my ear, and I do not resist: I have not gone back."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "corpus meum dedi percutientibus et genas meas vellentibus faciem meam non averti ab increpantibus et conspuentibus"
      en: "I have given my body to the strikers, and my cheeks to them that plucked them: I have not turned away my face from them that rebuked me, and spit upon me."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dominus Deus auxiliator meus ideo non sum confusus ideo posui faciem meam ut petram durissimam et scio quoniam non confundar"
      en: "The Lord God is my helper, therefore am I not confounded: therefore have I set my face as a most hard rock, and I know that I shall not be confounded."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "iuxta est qui iustificat me quis contradicet mihi stemus simul quis est adversarius meus accedat ad me"
      en: "He is near that justifieth me, who will contend with me? let us stand together, who is my adversary? let him come near to me."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ecce Dominus Deus auxiliator meus quis est qui condemnet me ecce omnes quasi vestimentum conterentur tinea comedet eos"
      en: "Behold the Lord God is my helper: who is he that shall condemn me? Lo, they shall all be destroyed as a garment, the moth shall eat them up."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quis ex vobis timens Dominum audiens vocem servi sui qui ambulavit in tenebris et non est lumen ei speret in nomine Domini et innitatur super Deum suum"
      en: "Who is there among you that feareth the Lord, that heareth the voice of his servant, that hath walked in darkness, and hath no light? let him hope in the name of the Lord, and lean upon his God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ecce omnes vos accendentes ignem accincti flammis ambulate in lumine ignis vestri et in flammis quas succendistis de manu mea factum est hoc vobis in doloribus dormietis"
      en: "Behold all you that kindle a fire, encompassed with dames, walk in the light of your fire, and in the dames which you have kindled: this is done to you by my hand, you shall sleep in sorrows."
    status: { la: verified, en: verified }
