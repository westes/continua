# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 13
verses:
  - n: 1
    text:
      la: "ecce omnia et vidit oculus meus et audivit auris mea et intellexi singula"
      en: "Behold my eye hath seen all these things, and my ear hath heard them, and I have understood them all."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "secundum scientiam vestram et ego novi nec inferior vestri sum"
      en: "According to your knowledge I also know: neither am I inferior to you."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sed tamen ad Omnipotentem loquar et disputare cum Deo cupio"
      en: "But yet I will speak to the Almighty, and I desire to reason with God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "prius vos ostendens fabricatores mendacii et cultores perversorum dogmatum"
      en: "Having first shewn that you are forgers of lies, and maintainers of perverse opinions."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "atque utinam taceretis ut putaremini esse sapientes"
      en: "And I wish you would hold your peace, that you might be thought to be wise men.."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "audite ergo correptiones meas et iudicium labiorum meorum adtendite"
      en: "Hear ye therefore my reproof, and attend to the judgment of my lips."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "numquid Deus indiget vestro mendacio ut pro illo loquamini dolos"
      en: "Hath God any need of your lie, that you should speak deceitfully for him?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "numquid faciem eius accipitis et pro Deo iudicare nitimini"
      en: "Do you accept his person, and do you endeavour to judge for God?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "aut placebit ei quem celare nihil potest aut decipietur ut homo vestris fraudulentiis"
      en: "Or shall it please him, from whom nothing can be concealed ? or shall he be deceived as a man, with your deceitful dealings ?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ipse vos arguet quoniam in abscondito faciem eius accipitis"
      en: "He shall reprove you, because in secret you accept his person."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "statim ut se commoverit turbabit vos et terror eius inruet super vos"
      en: "As soon as he shall move himself, he shall trouble you: and his dread shall fall upon you."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "memoria vestra conparabitur cineri et redigentur in lutum cervices vestrae"
      en: "Your remembrance shall be compared to ashes, and your necks shall be brought to clay."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "tacete paulisper ut loquar quodcumque mihi mens suggesserit"
      en: "Hold your peace a little while, that I may speak whatsoever my mind shall suggest to me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quare lacero carnes meas dentibus meis et animam meam porto in manibus meis"
      en: "Why do I tear my flesh with my teeth, and carry my soul in my hands?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "etiam si occiderit me in ipso sperabo verumtamen vias meas in conspectu eius arguam"
      en: "Although he should bill me, I will trust in him: but yet I will reprove my ways in his sight."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et ipse erit salvator meus non enim veniet in conspectu eius omnis hypocrita"
      en: "And he shall be my saviour: for no hypocrite shall come before his presence."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "audite sermonem meum et enigmata percipite auribus vestris"
      en: "Hear ye my speech, and receive with Sour ears hidden truths."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "si fuero iudicatus scio quod iustus inveniar"
      en: "If I shall be judged, I know that I shall be found just."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quis est qui iudicetur mecum veniat quare tacens consumor"
      en: "Who is he that will plead against me? let him come: why am I consumed holding my peace?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "duo tantum ne facias mihi et tunc a facie tua non abscondar"
      en: "Two things only do not to me, and then from thy face I shall not be hid:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "manum tuam longe fac a me et formido tua non me terreat"
      en: "Withdraw thy hand far from me, and let not thy dread terrify me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et voca me et respondebo tibi aut certe loquar et tu responde mihi"
      en: "Call me, and I will answer thee: or else I will speak, and do thou answer me."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quantas habeo iniquitates et peccata scelera mea et delicta ostende mihi"
      en: "How many are my iniquities and sins? make me know my crimes and offences."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "cur faciem tuam abscondis et arbitraris me inimicum tuum"
      en: "Why hidest thou thy face, and thinkest me thy enemy?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "contra folium quod vento rapitur ostendis potentiam tuam et stipulam siccam persequeris"
      en: "Against a leaf, that is carried away with the wind, thou shewest thy power, and thou pursuest a dry straw."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "scribis enim contra me amaritudines et consumere me vis peccatis adulescentiae meae"
      en: "For thou writest bitter things against me, and wilt consume me for the sins of my youth."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "posuisti in nervo pedem meum et observasti omnes semitas meas et vestigia pedum meorum considerasti"
      en: "Thou hast put my feet in the stocks, and hast observed all my paths, and hast considered the steps of my feet:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "qui quasi putredo consumendus sum et quasi vestimentum quod comeditur a tinea"
      en: "Who am to be consumed as rottenness, and as a garment that is moth-eaten."
    status: { la: verified, en: verified }
