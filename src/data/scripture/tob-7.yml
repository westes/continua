book: tob
chapter: 7
verses:
  - n: 1
    text:
      la: "ingressi sunt autem ad Raguhelem et suscepit eos Raguhel cum gaudio"
      en: "And they went in to Raguel, and Raguel received them with joy."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "intuensque Tobiam Raguhel dixit Annae uxori suae quam similis est iuvenis iste consobrino meo"
      en: "And Raguel looking upon Tobias, said to Anna his wife: How like is this young man to my cousin?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et cum haec dixisset ait unde estis iuvenes fratres nostri at illi dixerunt ex tribu Nepthalim sumus ex captivitate Nineven"
      en: "And when he had spoken these words, he said: Whence are ye young men our brethren?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dixit illis Raguhel nostis Tobiam fratrem meum qui dixerunt novimus"
      en: "But they said: We are of the tribe of Nephtali, of the captiveof Ninive."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cumque multa bona loquerentur de eo dixit angelus ad Raguhel Tobias de quo interrogas pater huius est"
      en: "And Raguel said to them: Do you know Tobias my brother? And they said: We know him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et misit se Raguhel et cum lacrimis osculatus est eum et plorans super collum eius"
      en: "And when he was speaking many good things of him, the angel said to Raguel: Tobias concerning whom thou inquirest is this young man's father."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixit benedictio sit tibi fili mi quia boni et optimi viri filius es"
      en: "And Raguel went to him, and kissed him with tears, and weeping upon his neck, said: A blessing be upon thee, my son, because thou art the son of a good and most virtuous man."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et Anna uxor eius et Sarra filia ipsorum lacrimatae sunt"
      en: "And Anna his wife, and Sara their daughter wept."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "postquam autem locuti sunt praecepit Raguhel occidi arietem et parari convivium cumque hortaretur eos discumbere ad prandendum"
      en: "And after they had spoken, Raguel commanded a sheep to be killed, and a feast to be prepared. And when he desired them to sit down to dinner,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Tobias dixit hic ego hodie non manducabo neque bibam nisi prius petitionem meam confirmes et promittas mihi dare Sarram filiam tuam"
      en: "Tobias said: I will not eat nor drink here this day, unless thou first grant me my petition, and promise to give me Sara thy daughter."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quo audito verbo Raguhel expavit sciens quid evenerit illis septem viris et timere coepit ne forte et huic similiter accideret et cum nutaret et non daret ullum petenti responsum"
      en: "Now when Raguel heard this he was afraid, knowing what had happened to those seven husbands, that went in unto her: and he began to fear lest it might happen to him also in like manner: and as he was in suspense, and gave no answer to his petition,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dixit ei angelus noli timere dare illam isti quoniam huic timenti Deum debetur coniux filia tua propterea alius non potuit habere illam"
      en: "The angel said to him: Be not afraid to give her to this man, for to him who feareth God is thy daughter due to be his wife: therefore another could not have her."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "tunc dixit Raguhel non dubito quod Deus preces et lacrimas meas in conspectu suo admiserit"
      en: "Then Raguel said: I doubt not but God hath regarded my prayers and tears in his sight."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et credo quoniam ideo vos fecit ad me venire ut ista coniungeretur cognationi suae secundum legem Mosi et nunc noli dubium gerere quod tibi eam non tradam"
      en: "And I believe he hath therefore made you come to me, that this maid might be married to one of her own kindred, according to the law of Moses: and now doubt not but I will give her to thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et adprehendens dexteram filiae suae dexterae Tobiae tradidit dicens Deus Abraham et Deus Isaac et Deus Iacob sit vobiscum et ipse coniungat vos impleatque benedictionem suam in vobis"
      en: "And taking the right hand of his daughter, he gave it into the right hand of Tobias, saying: The God of Abraham, and the God of Isaac, and the God of Jacob be with you, and may he join you together, and fulfil his blessing in you."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et accepta carta fecerunt conscriptionem coniugii"
      en: "And taking paper they made a writing of the marriage."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et post haec epulati sunt benedicentes Deum"
      en: "And afterwards they made merry, blessing God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "vocavitque ad se Raguhel Annam uxorem suam et praecepit ei ut praepararet alterum cubiculum"
      en: "And Raguel called to him Anna his wife, and bade her prepare another chamber."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et introduxit in eum Sarram filiam suam et lacrimata est"
      en: "And she brought Sara her daughter in thither, and she wept."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dixitque ei forti animo esto filia mi Dominus caeli det tibi gaudium pro taedio quo perpessa es"
      en: "And she said to her: Be of good cheer, my daughter: the Lord of heaven give thee joy for the trouble thou hast undergone."
    status: { la: verified, en: verified }
