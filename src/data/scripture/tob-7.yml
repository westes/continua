# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: tob
chapter: 7
verses:
  - n: 1
    text:
      la: "Ingressi sunt autem ad Raguelem, et suscepit eos Raguel cum gaudio."
      en: "And they went in to Raguel, and Raguel received them with joy."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Intuensque Tobiam Raguel, dixit Annae uxori suae: Quam similis est juvenis iste consobrino meo!"
      en: "And Raguel looking upon Tobias, said to Anna his wife: How like is this young man to my cousin?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et cum haec dixisset, ait: Unde estis juvenes fratres nostri? At illi dixerunt: Ex tribu Nephthali sumus, ex captivitate Ninive."
      en: "And when he had spoken these words, he said: Whence are ye young men our brethren?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dixitque illis Raguel: Nostis Tobiam fratrem meum? Qui dixerunt: Novimus."
      en: "But they said: We are of the tribe of Nephtali, of the captivity of Ninive."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cumque multa bona loqueretur de eo, dixit angelus ad Raguelem: Tobias, de quo interrogas, pater istius est."
      en: "And Raguel said to them: Do you know Tobias my brother? And they said: We know him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et misit se Raguel, et cum lacrimis osculatus est eum, et plorans supra collum ejus,"
      en: "And when he was speaking many good things of him, the angel said to Raguel: Tobias concerning whom thou inquirest is this young man's father."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixit: Benedictio sit tibi, fili mi, quia boni et optimi viri filius es."
      en: "And Raguel went to him, and kissed him with tears, and weeping upon his neck, said: A blessing be upon thee, my son, because thou art the son of a good and most virtuous man."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et Anna uxor ejus, et Sara ipsorum filia, lacrimatae sunt."
      en: "And Anna his wife, and Sara their daughter wept."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Postquam autem locuti sunt, praecepit Raguel occidi arietem, et parari convivium. Cumque hortaretur eos discumbere ad prandium,"
      en: "And after they had spoken, Raguel commanded a sheep to be killed, and a feast to be prepared. And when he desired them to sit down to dinner,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Tobias dixit: Hic ego hodie non manducabo neque bibam, nisi prius petitionem meam confirmes, et promittas mihi dare Saram filiam tuam."
      en: "Tobias said: I will not eat nor drink here this day, unless thou first grant me my petition, and promise to give me Sara thy daughter."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quo audito verbo Raguel, expavit, sciens quid evenerit illis septem viris, qui ingressi sunt ad eam: et timere coepit ne forte et hunc similiter contingeret: et cum nutaret, et non daret petenti ullum responsum,"
      en: "Now when Raguel heard this he was afraid, knowing what had happened to those seven husbands, that went in unto her: and he began to fear lest it might happen to him also in like manner: and as he was in suspense, and gave no answer to his petition,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dixit ei angelus: Noli timere dare eam isti, quoniam huic timenti Deum debetur conjux filia tua: propterea alius non potuit habere illam."
      en: "The angel said to him: Be not afraid to give her to this man, for to him who feareth God is thy daughter due to be his wife: therefore another could not have her."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tunc dixit Raguel: Non dubito quod Deus preces et lacrimas meas in conspectu suo admiserit."
      en: "Then Raguel said: I doubt not but God hath regarded my prayers and tears in his sight."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et credo quoniam ideo fecit vos venire ad me, ut ista conjungeretur cognationi suae secundum legem Moysi: et nunc noli dubium gerere quod tibi eam tradam."
      en: "And I believe he hath therefore made you come to me, that this maid might be married to one of her own kindred, according to the law of Moses: and now doubt not but I will give her to thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et apprehendens dexteram filiae suae, dexterae Tobiae tradidit, dicens: Deus Abraham, et Deus Isaac, et Deus Jacob vobiscum sit, et ipse conjungat vos, impleatque benedictionem suam in vobis."
      en: "And taking the right hand of his daughter, he gave it into the right hand of Tobias, saying: The God of Abraham, and the God of Isaac, and the God of Jacob be with you, and may he join you together, and fulfill his blessing in you."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et accepta carta, fecerunt conscriptionem conjugii."
      en: "And taking paper they made a writing of the marriage."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et post haec epulati sunt, benedicentes Deum."
      en: "And afterwards they made merry, blessing God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vocavitque Raguel ad se Annam uxorem suam, et praecepit ei ut praepararet alterum cubiculum."
      en: "And Raguel called to him Anna his wife, and bade her prepare another chamber."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et introduxit illuc Saram filiam suam, et lacrimata est."
      en: "And she brought Sara her daughter in thither, and she wept."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dixitque ei: Forti animo esto, filia mea: Dominus caeli det tibi gaudium pro taedio quod perpessa es."
      en: "And she said to her: Be of good cheer, my daughter: the Lord of heaven give thee joy for the trouble thou hast undergone."
    status: { la: verified, en: verified }
