# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 28
verses:
  - n: 1
    text:
      la: "et factum est in anno illo in principio regni Sedeciae regis Iuda in anno quarto in mense quinto dixit ad me Ananias filius Azur propheta de Gabaon in domo Domini coram sacerdotibus et omni populo dicens"
      en: "And it came to pass in that year, in the beginning of the reign of Sedecias king of Juda, in the fourth year, in the fifth month, that Hananias the son of Azur, a prophet of Gabaon spoke to me, in the house of the Lord before the priests, and all the people, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "haec dicit Dominus exercituum Deus Israhel contrivi iugum regis Babylonis"
      en: "Thus saith the Lord of hosts the God of Israel: I have broken the yoke of the king of Babylon."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "adhuc duo anni dierum et ego referri faciam ad locum istum omnia vasa Domini quae tulit Nabuchodonosor rex Babylonis de loco isto et transtulit ea in Babylonem"
      en: "As yet two years of days, and I will cause all the vessels of the house of the Lord to be brought back into this place, which Nabuchodonosor king of Babylon took away from this place, and carried them to Babylon."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et Iechoniam filium Ioachim regem Iuda et omnem transmigrationem Iudae qui ingressi sunt in Babylonem ego convertam ad locum istum ait Dominus conteram enim iugum regis Babylonis"
      en: "And I will bring back to this place Jechonias the son of Joakim king of Juda, and all the captives of Juda, that are gone to Babylon, saith the Lord: for I will break the yoke of the king of Babylon."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et dixit Hieremias propheta ad Ananiam prophetam in oculis sacerdotum et in oculis omnis populi qui stabant in domo Domini"
      en: "And Jeremias the prophet said to Hananias the prophet in the presence of the priests, and in the presence of all the people that stood in the house of the Lord:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et ait Hieremias propheta amen sic faciat Dominus suscitet Dominus verba tua quae prophetasti ut referantur vasa in domum Domini et omnis transmigratio de Babylone ad locum istum"
      en: "And Jeremias the prophet said: Amen, the Lord do so: the Lord perform thy words, which thou hast prophesied: that the vessels may be brought again into the house of the Lord, and all the captives may return out of Babylon to this place."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "verumtamen audi verbum hoc quod ego loquor in auribus tuis et in auribus universi populi"
      en: "Nevertheless hear this word that I speak in thy ears, and in the ears of all the people:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "prophetae qui fuerunt ante me et te ab initio et prophetaverunt super terras multas et super regna magna de proelio et de adflictione et de fame"
      en: "The prophets that have been before me, and before thee from the beginning, and have prophesied concerning many countries, and concerning great kingdoms, of war, and of affliction, and of famine."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "propheta qui vaticinatus est pacem cum venerit verbum eius scietur propheta quem misit Dominus in veritate"
      en: "The prophet that prophesied peace when his word shall come to pass, the prophet shall be known, whom the Lord hath sent in truth."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et tulit Ananias propheta catenam de collo Hieremiae prophetae et confregit eam"
      en: "And Hananias the prophet took the chain from the neck of Jeremias the prophet, and broke it."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et ait Ananias in conspectu omnis populi dicens haec dicit Dominus sic confringam iugum Nabuchodonosor regis Babylonis post duos annos dierum de collo omnium gentium"
      en: "And Hananias spoke in the presence of all the people, saying: Thus saith the Lord: Even so will I break the yoke of Nabuchodonosor the king of Babylon after two full years from off the neck of all the nations."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et abiit Hieremias prophetes in viam suam et factum est verbum Domini ad Hieremiam postquam confregit Ananias propheta catenam de collo Hieremiae prophetae dicens"
      en: "And Jeremias the prophet went his way. And the word of the Lord came to Jeremias, after that Hananias the prophet had broken the chain from off the neck of Jeremias the prophet, saying:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "vade et dices Ananiae haec dicit Dominus catenas ligneas contrivisti et facies pro eis catenas ferreas"
      en: "Go, and tell Hananias: Thus saith the Lord: Thou hast broken chains of wood, and thou shalt make for them chains of iron."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quia haec dicit Dominus exercituum Deus Israhel iugum ferreum posui super collum cunctarum gentium istarum ut serviant Nabuchodonosor regi Babylonis et servient ei insuper et bestias terrae dedi ei"
      en: "For thus saith the Lord of hosts the God of Israel: I have put a yoke of iron upon the neck of all these nations, to serve Nabuchodonosor king of Babylon, and they shall serve him: moreover also I have given him the beasts of the earth."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et dixit Hieremias propheta ad Ananiam prophetam audi Anania non misit te Dominus et tu confidere fecisti populum istum in mendacio"
      en: "And Jeremias the prophet said to Hananias the prophet: Hear now, Hananias: the Lord hath not sent thee, and thou hast made this people to trust in a lie."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "idcirco haec dicit Dominus ecce emittam te a facie terrae hoc anno morieris adversum Dominum enim locutus es"
      en: "Therefore thus saith the Lord: Behold I will send thee away from off the face of the earth: this year shalt thou die: for thou hast spoken against the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et mortuus est Ananias propheta in anno illo mense septimo"
      en: "And Hananias the prophet died in that year, in the seventh month."
    status: { la: verified, en: verified }
