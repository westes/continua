# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: luc
chapter: 23
verses:
  - n: 1
    text:
      la: "et surgens omnis multitudo eorum duxerunt illum ad Pilatum"
      en: "And the whole multitude of them rising up, led him to Pilate."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "coeperunt autem accusare illum dicentes hunc invenimus subvertentem gentem nostram et prohibentem tributa dari Caesari et dicentem se Christum regem esse"
      en: "And they began to accuse him, saying: We have found this man perverting our nation, and forbidding to give tribute to Caesar, and saying that he is Christ the king."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Pilatus autem interrogavit eum dicens tu es rex Iudaeorum at ille respondens ait tu dicis"
      en: "And Pilate asked him, saying: Art thou the king of the Jews? But he answering, said: Thou sayest it."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ait autem Pilatus ad principes sacerdotum et turbas nihil invenio causae in hoc homine"
      en: "And Pilate said to the chief priests and to the multitudes: I find no cause in this man."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "at illi invalescebant dicentes commovet populum docens per universam Iudaeam et incipiens a Galilaea usque huc"
      en: "But they were more earnest, saying: He stirreth up the people, teaching throughout all Judea, beginning from Galilee to this place."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Pilatus autem audiens Galilaeam interrogavit si homo Galilaeus esset"
      en: "But Pilate hearing Galilee, asked if the man were of Galilee?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et ut cognovit quod de Herodis potestate esset remisit eum ad Herodem qui et ipse Hierosolymis erat illis diebus"
      en: "And when he understood that he was of Herod's jurisdiction, he sent him away to Herod, who was also himself at Jerusalem, in those days."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Herodes autem viso Iesu gavisus est valde erat enim cupiens ex multo tempore videre eum eo quod audiret multa de illo et sperabat signum aliquod videre ab eo fieri"
      en: "And Herod, seeing Jesus, was very glad; for he was desirous of a long time to see him, because he had heard many things of him; and he hoped to see some sign wrought by him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "interrogabat autem illum multis sermonibus at ipse nihil illi respondebat"
      en: "And he questioned him in many words. But he answered him nothing."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "stabant etiam principes sacerdotum et scribae constanter accusantes eum"
      en: "And the chief priests and the scribes stood by, earnestly accusing him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sprevit autem illum Herodes cum exercitu suo et inlusit indutum veste alba et remisit ad Pilatum"
      en: "And Herod with his army set him at nought, and mocked him, putting on him a white garment, and sent him back to Pilate."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et facti sunt amici Herodes et Pilatus in ipsa die nam antea inimici erant ad invicem"
      en: "And Herod and Pilate were made friends, that same day; for before they were enemies one to another."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Pilatus autem convocatis principibus sacerdotum et magistratibus et plebe"
      en: "And Pilate, calling together the chief priests, and the magistrates, and the people,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "dixit ad illos obtulistis mihi hunc hominem quasi avertentem populum et ecce ego coram vobis interrogans nullam causam inveni in homine isto ex his in quibus eum accusatis"
      en: "Said to them: You have presented unto me this man, as one that perverteth the people; and behold I, having examined him before you, find no cause in this man, in those things wherein you accuse him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sed neque Herodes nam remisi vos ad illum et ecce nihil dignum morte actum est ei"
      en: "No, nor Herod neither. For I sent you to him, and behold, nothing worthy of death is done to him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "emendatum ergo illum dimittam"
      en: "I will chastise him therefore, and release him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "necesse autem habebat dimittere eis per diem festum unum"
      en: "Now of necessity he was to release unto them one upon the feast day."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "exclamavit autem simul universa turba dicens tolle hunc et dimitte nobis Barabban"
      en: "But the whole multitude together cried out, saying: Away with this man, and release unto us Barabbas:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "qui erat propter seditionem quandam factam in civitate et homicidium missus in carcerem"
      en: "Who, for a certain sedition made in the city, and for a murder, was cast into prison."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "iterum autem Pilatus locutus est ad illos volens dimittere Iesum"
      en: "And Pilate again spoke to them, desiring to release Jesus."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "at illi succlamabant dicentes crucifige crucifige illum"
      en: "But they cried again, saying: Crucify him, crucify him."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ille autem tertio dixit ad illos quid enim mali fecit iste nullam causam mortis invenio in eo corripiam ergo illum et dimittam"
      en: "And he said to them the third time: Why, what evil hath this man done? I find no cause of death in him. I will chastise him therefore, and let him go."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "at illi instabant vocibus magnis postulantes ut crucifigeretur et invalescebant voces eorum"
      en: "But they were instant with loud voices, requiring that he might be crucified; and their voices prevailed."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et Pilatus adiudicavit fieri petitionem eorum"
      en: "And Pilate gave sentence that it should be as they required."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "dimisit autem illis eum qui propter homicidium et seditionem missus fuerat in carcerem quem petebant Iesum vero tradidit voluntati eorum"
      en: "And he released unto them him who for murder and sedition, had been cast into prison, whom they had desired; but Jesus he delivered up to their will."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et cum ducerent eum adprehenderunt Simonem quendam Cyrenensem venientem de villa et inposuerunt illi crucem portare post Iesum"
      en: "And as they led him away, they laid hold of one Simon of Cyrene, coming from the country; and they laid the cross on him to carry after Jesus."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "sequebatur autem illum multa turba populi et mulierum quae plangebant et lamentabant eum"
      en: "And there followed him a great multitude of people, and of women, who bewailed and lamented him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "conversus autem ad illas Iesus dixit filiae Hierusalem nolite flere super me sed super vos ipsas flete et super filios vestros"
      en: "But Jesus turning to them, said: Daughters of Jerusalem, weep not over me; but weep for yourselves, and for your children."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quoniam ecce venient dies in quibus dicent beatae steriles et ventres qui non genuerunt et ubera quae non lactaverunt"
      en: "For behold, the days shall come, wherein they will say: Blessed are the barren, and the wombs that have not borne, and the paps that have not given suck."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "tunc incipient dicere montibus cadite super nos et collibus operite nos"
      en: "Then shall they begin to say to the mountains: Fall upon us; and to the hills: Cover us."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "quia si in viridi ligno haec faciunt in arido quid fiet"
      en: "For if in the green wood they do these things, what shall be done in the dry?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "ducebantur autem et alii duo nequam cum eo ut interficerentur"
      en: "And there were also two other malefactors led with him to be put to death."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et postquam venerunt in locum qui vocatur Calvariae ibi crucifixerunt eum et latrones unum a dextris et alterum a sinistris"
      en: "And when they were come to the place which is called Calvary, they crucified him there; and the robbers, one on the right hand, and the other on the left."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Iesus autem dicebat Pater dimitte illis non enim sciunt quid faciunt dividentes vero vestimenta eius miserunt sortes"
      en: "And Jesus said: Father, forgive them, for they know not what they do. But they, dividing his garments, cast lots."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et stabat populus expectans et deridebant illum principes cum eis dicentes alios salvos fecit se salvum faciat si hic est Christus Dei electus"
      en: "And the people stood beholding, and the rulers with them derided him, saying: He saved others; let him save himself, if he be Christ, the elect of God."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "inludebant autem ei et milites accedentes et acetum offerentes illi"
      en: "And the soldiers also mocked him, coming to him, and offering him vinegar,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "dicentes si tu es rex Iudaeorum salvum te fac"
      en: "And saying: If thou be the king of the Jews, save thyself."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "erat autem et superscriptio inscripta super illum litteris graecis et latinis et hebraicis hic est rex Iudaeorum"
      en: "And there was also a superscription written over him in letters of Greek, and Latin, and Hebrew: THIS IS THE KING OF THE JEWS."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "unus autem de his qui pendebant latronibus blasphemabat eum dicens si tu es Christus salvum fac temet ipsum et nos"
      en: "And one of those robbers who were hanged, blasphemed him, saying: If thou be Christ, save thyself and us."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "respondens autem alter increpabat illum dicens neque tu times Deum quod in eadem damnatione es"
      en: "But the other answering, rebuked him, saying: Neither dost thou fear God, seeing thou art condemned under the same condemnation?"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et nos quidem iuste nam digna factis recipimus hic vero nihil mali gessit"
      en: "And we indeed justly, for we receive the due reward of our deeds; but this man hath done no evil."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et dicebat ad Iesum Domine memento mei cum veneris in regnum tuum"
      en: "And he said to Jesus: Lord, remember me when thou shalt come into thy kingdom."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et dixit illi Iesus amen dico tibi hodie mecum eris in paradiso"
      en: "And Jesus said to him: Amen I say to thee, this day thou shalt be with me in paradise."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "erat autem fere hora sexta et tenebrae factae sunt in universa terra usque in nonam horam"
      en: "And it was almost the sixth hour; and there was darkness over all the earth until the ninth hour."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et obscuratus est sol et velum templi scissum est medium"
      en: "And the sun was darkened, and the veil of the temple was rent in the midst."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et clamans voce magna Iesus ait Pater in manus tuas commendo spiritum meum et haec dicens exspiravit"
      en: "And Jesus crying out with a loud voice, said: Father, into thy hands I commend my spirit. And saying this, he gave up the ghost."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "videns autem centurio quod factum fuerat glorificavit Deum dicens vere hic homo iustus erat"
      en: "Now the centurion, seeing what was done, glorified God, saying: Indeed this was a just man."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et omnis turba eorum qui simul aderant ad spectaculum istud et videbant quae fiebant percutientes pectora sua revertebantur"
      en: "And all the multitude of them that were come together to that sight, and saw the things that were done, returned striking their breasts."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "stabant autem omnes noti eius a longe et mulieres quae secutae erant eum a Galilaea haec videntes"
      en: "And all his acquaintance, and the women that had followed him from Galilee, stood afar off, beholding these things."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "et ecce vir nomine Ioseph qui erat decurio vir bonus et iustus"
      en: "And behold there was a man named Joseph, who was a counsellor, a good and just man,"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "hic non consenserat consilio et actibus eorum ab Arimathia civitate Iudaeae qui expectabat et ipse regnum Dei"
      en: "(The same had not consented to their counsel and doings;) of Arimathea, a city of Judea; who also himself looked for the kingdom of God."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "hic accessit ad Pilatum et petiit corpus Iesu"
      en: "This man went to Pilate, and begged the body of Jesus."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "et depositum involvit sindone et posuit eum in monumento exciso in quo nondum quisquam positus fuerat"
      en: "And taking him down, he wrapped him in fine linen, and laid him in a sepulchre that was hewed in stone, wherein never yet any man had been laid."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "et dies erat parasceves et sabbatum inlucescebat"
      en: "And it was the day of the Parasceve, and the sabbath drew on."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "subsecutae autem mulieres quae cum ipso venerant de Galilaea viderunt monumentum et quemadmodum positum erat corpus eius"
      en: "And the women that were come with him from Galilee, following after, saw the sepulchre, and how his body was laid."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "et revertentes paraverunt aromata et unguenta et sabbato quidem siluerunt secundum mandatum"
      en: "And returning, they prepared spices and ointments; and on the sabbath day they rested, according to the commandment."
    status: { la: verified, en: verified }
