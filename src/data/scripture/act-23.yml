# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: act
chapter: 23
verses:
  - n: 1
    text:
      la: "intendens autem concilium Paulus ait viri fratres ego omni conscientia bona conversatus sum ante Deum usque in hodiernum diem"
      en: "And Paul looking upon the council, said: Men, brethren, I have conversed with all good conscience before God until this present day."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "princeps autem sacerdotum Ananias praecepit adstantibus sibi percutere os eius"
      en: "And the high priest Ananias commanded them that stood by him to strike him on the mouth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "tunc Paulus ad eum dixit percutiet te Deus paries dealbate et tu sedens iudicas me secundum legem et contra legem iubes me percuti"
      en: "Then Paul said to him: God shall strike thee, thou whited wall. For sittest thou to judge me according to the law, and contrary to the law commandest me to be struck?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et qui adstabant dixerunt summum sacerdotem Dei maledicis"
      en: "And they that stood by said: Dost thou revile the high priest of God?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixit autem Paulus nesciebam fratres quia princeps est sacerdotum scriptum est enim principem populi tui non maledices"
      en: "And Paul said: I knew not, brethren, that he is the high priest. For it is written: Thou shalt not speak evil of the prince of thy people."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sciens autem Paulus quia una pars esset Sadducaeorum et altera Pharisaeorum exclamavit in concilio viri fratres ego Pharisaeus sum filius Pharisaeorum de spe et resurrectione mortuorum ego iudicor"
      en: "And Paul knowing that the one part were Sadducees, and the other Pharisees, cried out in the council: Men, brethren, I am a Pharisee, the son of Pharisees: concerning the hope and resurrection of the dead I am called in question."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et cum haec dixisset facta est dissensio inter Pharisaeos et Sadducaeos et soluta est multitudo"
      en: "And when he had so said, there arose a dissension between the Pharisees and the Sadducees; and the multitude was divided."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sadducaei enim dicunt non esse resurrectionem neque angelum neque spiritum Pharisaei autem utrumque confitentur"
      en: "For the Sadducees say that there is no resurrection, neither angel, nor spirit: but the Pharisees confess both."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "factus est autem clamor magnus et surgentes quidam Pharisaeorum pugnabant dicentes nihil mali invenimus in homine isto quod si spiritus locutus est ei aut angelus"
      en: "And there arose a great cry. And some of the Pharisees rising up, strove, saying: We find no evil in this man. What if a spirit hath spoken to him, or an angel?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et cum magna dissensio facta esset timens tribunus ne discerperetur Paulus ab ipsis iussit milites descendere et rapere eum de medio eorum ac deducere eum in castra"
      en: "And when there arose a great dissension, the tribune fearing lest Paul should be pulled in pieces by them, commanded the soldiers to go down, and to take him by force from among them, and to bring him into the castle."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sequenti autem nocte adsistens ei Dominus ait constans esto sicut enim testificatus es de me Hierusalem sic te oportet et Romae testificari"
      en: "And the night following the Lord standing by him, said: Be constant; for as thou hast testified of me in Jerusalem, so must thou bear witness also at Rome."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "facta autem die collegerunt se quidam ex Iudaeis et devoverunt se dicentes neque manducaturos neque bibituros donec occiderent Paulum"
      en: "And when day was come, some of the Jews gathered together, and bound themselves under a curse, saying, that they would neither eat, nor drink, till they killed Paul."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "erant autem plus quam quadraginta qui hanc coniurationem fecerant"
      en: "And they were more than forty men that had made this conspiracy."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui accesserunt ad principes sacerdotum et seniores et dixerunt devotione devovimus nos nihil gustaturos donec occidamus Paulum"
      en: "Who came to the chief priests and the ancients, and said: We have bound ourselves under a great curse that we will eat nothing till we have slain Paul."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "nunc ergo vos notum facite tribuno cum concilio ut producat illum ad vos tamquam aliquid certius cognituri de eo nos vero priusquam adpropiet parati sumus interficere illum"
      en: "Now therefore do you with the council signify to the tribune, that he bring him forth to you, as if you meant to know something more certain touching him. And we, before he come near, are ready to kill him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quod cum audisset filius sororis Pauli insidias venit et intravit in castra nuntiavitque Paulo"
      en: "Which when Paul's sister's son had heard, of their lying in wait, he came and entered into the castle and told Paul."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "vocans autem Paulus ad se unum ex centurionibus ait adulescentem hunc perduc ad tribunum habet enim aliquid indicare illi"
      en: "And Paul, calling to him one of the centurions, said: Bring this young man to the tribune, for he hath some thing to tell him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ille quidem adsumens eum duxit ad tribunum et ait vinctus Paulus vocans rogavit me hunc adulescentem perducere ad te habentem aliquid loqui tibi"
      en: "And he taking him, brought him to the tribune, and said: Paul, the prisoner, desired me to bring this young man unto thee, who hath some thing to say to thee."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "adprehendens autem tribunus manum illius secessit cum eo seorsum et interrogavit illum quid est quod habes indicare mihi"
      en: "And the tribune taking him by the hand, went aside with him privately, and asked him: What is it that thou hast to tell me?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ille autem dixit Iudaeis convenit rogare te ut crastina die Paulum producas in concilium quasi aliquid certius inquisituri sint de illo"
      en: "And he said: The Jews have agreed to desire thee, that thou wouldst bring forth Paul to morrow into the council, as if they meant to inquire some thing more certain touching him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "tu vero ne credideris illis insidiantur enim ei ex eis viri amplius quadraginta qui se devoverunt non manducare neque bibere donec interficiant eum et nunc parati sunt expectantes promissum tuum"
      en: "But do not thou give credit to them; for there lie in wait for him more than forty men of them, who have bound themselves by oath neither to eat, nor to drink, till they have killed him: and they are now ready, looking for a promise from thee."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "tribunus igitur dimisit adulescentem praecipiens ne cui loqueretur quoniam haec nota sibi fecisset"
      en: "The tribune therefore dismissed the young man, charging him that he should tell no man, that he had made known these things unto him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et vocatis duobus centurionibus dixit illis parate milites ducentos ut eant usque Caesaream et equites septuaginta et lancearios ducentos a tertia hora noctis"
      en: "Then having called two centurions, he said to them: Make ready two hundred soldiers to go as far as Caesarea, and seventy horsemen, and two hundred spearmen for the third hour of the night:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et iumenta praeparate ut inponentes Paulum salvum perducerent ad Felicem praesidem"
      en: "And provide beasts, that they may set Paul on, and bring him safe to Felix the governor."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "[]"
      en: "(For he feared lest perhaps the Jews might take him away by force and kill him, and he should afterwards be slandered, as if he was to take money.) And he wrote a letter after this manner:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "scribens epistulam continentem haec Claudius Lysias optimo praesidi Felici salutem"
      en: "Claudius Lysias to the most excellent governor, Felix, greeting."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "virum hunc conprehensum a Iudaeis et incipientem interfici ab eis superveniens cum exercitu eripui cognito quia Romanus est"
      en: "This man being taken by the Jews, and ready to be killed by them, I rescued coming in with an army, understanding that he is a Roman:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "volensque scire causam quam obiciebant illi deduxi eum in concilium eorum"
      en: "And meaning to know the cause which they objected unto him, I brought him forth into their council."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quem inveni accusari de quaestionibus legis ipsorum nihil vero dignum morte aut vinculis habentem crimen"
      en: "Whom I found to be accused concerning questions of their law; but having nothing laid to his charge worthy of death or of bands."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et cum mihi perlatum esset de insidiis quas paraverunt ei misi ad te denuntians et accusatoribus ut dicant apud te"
      en: "And when I was told of ambushes that they had prepared for him, I sent him to thee, signifying also to his accusers to plead before thee. Farewell."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "milites ergo secundum praeceptum sibi adsumentes Paulum duxerunt per noctem in Antipatridem"
      en: "Then the soldiers, according as it was commanded them, taking Paul, brought him by night to Antipatris."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et postera die dimissis equitibus ut irent cum eo reversi sunt ad castra"
      en: "And the next day, leaving the horsemen to go with him, they returned to the castle."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "qui cum venissent Caesaream et tradidissent epistulam praesidi statuerunt ante illum et Paulum"
      en: "Who, when they were come to Caesarea, and had delivered the letter to the governor, did also present Paul before him."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "cum legisset autem et interrogasset de qua provincia esset et cognoscens quia de Cilicia"
      en: "And when he had read it, and had asked of what province he was, and understood that he was of Cilicia;"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "audiam te inquit cum et accusatores tui venerint iussitque in praetorio Herodis custodiri eum"
      en: "I will hear thee, said he, when thy accusers come. And he commanded him to be kept in Herod's judgment hall."
    status: { la: verified, en: verified }
