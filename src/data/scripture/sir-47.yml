# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 47
verses:
  - n: 1
    text:
      la: "Post haec surrexit Nathan, propheta in diebus David."
      en: "Then Nathan the prophet arose in the days of David."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et quasi adeps separatus a carne, sic David a filiis Israel."
      en: "And as the fat taken away from the flesh, so was David chosen from among the children of Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cum leonibus lusit quasi cum agnis, et in ursis similiter fecit sicut in agnis ovium, in juventute sua."
      en: "He played with lions as with lambs: and with bears he did in like manner as with the lambs of the flock, in his youth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Numquid non occidit gigantem, et abstulit opprobrium de gente?"
      en: "Did not he kill the giant, and take away reproach from his people?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "In tollendo manum, saxo fundae dejecit exsultationem Goliae:"
      en: "In lifting up his hand, with the stone in the sling he beat down the boasting of Goliath:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "nam invocavit Dominum omnipotentem, et dedit in dextera ejus tollere hominem fortem in bello, et exaltare cornu gentis suae."
      en: "For he called upon the Lord the Almighty, and he gave strength in his right hand, to take away the mighty warrior, and to set up the horn of his nation."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Sic in decem millibus glorificavit eum: et laudavit eum in benedictionibus Domini, in offerendo illi coronam gloriae:"
      en: "So in ten thousand did he glorify him, and praised him in the blessings of the Lord, in offering to him a crown of glory:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "contrivit enim inimicos undique, et extirpavit Philisthiim contrarios usque in hodiernum diem: contrivit cornu ipsorum usque in aeternum."
      en: "For he destroyed the enemies on every side, and extirpated the Philistines the adversaries unto this day: he broke their horn for ever."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "In omni opere dedit confessionem Sancto, et Excelso in verbo gloriae."
      en: "In all his works he gave thanks to the holy one, and to the most High, with words of glory."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "De omni corde suo laudavit Dominum: et dilexit Deum, qui fecit illum, et dedit illi contra inimicos potentiam:"
      en: "With his whole heart he praised the Lord, and loved God that made him: and he gave him power against his enemies:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et stare fecit cantores contra altare, et in sono eorum dulces fecit modos."
      en: "And he set singers before the altar, and by their voices he made sweet melody."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et dedit in celebrationibus decus, et ornavit tempora usque ad consummationem vitae, ut laudarent nomen sanctum Domini, et amplificarent mane Dei sanctitatem."
      en: "And to the festivals he added beauty, and set in order the solemn times even to the end of his life, that they should praise the holy name of the Lord, and magnify the holiness of God in the morning."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dominus purgavit peccata ipsius, et exaltavit in aeternum cornu ejus: et dedit illi testamentum regni, et sedem gloriae in Israel."
      en: "The Lord took away his sins, and exalted his horn for ever: and he gave him a covenant of the kingdom, and a throne of glory in Israel."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Post ipsum surrexit filius sensatus, et propter illum dejecit omnem potentiam inimicorum."
      en: "After him arose up a wise son, and for his sake he cast down all the power of the enemies."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Salomon imperavit in diebus pacis, cui subjecit Deus omnes hostes, ut conderet domum in nomine suo, et pararet sanctitatem in sempiternum. Quemadmodum eruditus es in juventute tua,"
      en: "Solomon reigned in days of peace, and God brought all his enemies under him, that he might build a house in his name, and prepare a sanctuary for ever: O how wise wast thou in thy youth!"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et impletus es, quasi flumen, sapientia, et terram retexit anima tua."
      en: "And thou wast filled as a river with wisdom, and thy soul covered the earth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et replesti in comparationibus aenigmata: ad insulas longe divulgatum est nomen tuum, et dilectus es in pace tua."
      en: "And thou didst multiply riddles in parables: thy name went abroad to the islands far off, and thou wast beloved in thy peace."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "In cantilenis, et proverbiis, et comparationibus, et interpretationibus, miratae sunt terrae:"
      en: "The countries wondered at thee for thy canticles, and proverbs, and parables, and interpretations,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et in nomine Domini Dei, cui est cognomen Deus Israel."
      en: "And at the name of the Lord God, whose surname is, God of Israel."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Collegisti quasi auricalcum aurum, et ut plumbum complesti argentum:"
      en: "Thou didst gather gold as copper, and didst multiply silver as lead,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et inclinasti femora tua mulieribus: potestatem habuisti in corpore tuo."
      en: "And thou didst bow thyself to women: and by thy body thou wast brought under subjection."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Dedisti maculam in gloria tua, et profanasti semen tuum, inducere iracundiam ad liberos tuos, et incitari stultitiam tuam:"
      en: "Thou hast stained thy glory, and defiled thy seed so as to bring wrath upon thy children, and to have thy folly kindled,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ut faceres imperium bipartitum, et ex Ephraim imperare imperium durum."
      en: "That thou shouldst make the kingdom to be divided, and out of Ephraim a rebellious kingdom to rule."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Deus autem non derelinquet misericordiam suam: et non corrumpet, nec delebit opera sua, neque perdet a stirpe nepotes electi sui, et semen ejus qui diligit Dominum non corrumpet."
      en: "But God will not leave off his mercy, and he will not destroy, nor abolish his own works, neither will he cut up by the roots the offspring of his elect: and he will not utterly take away the seed of him that loveth the Lord."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Dedit autem reliquum Jacob, et David de ipsa stirpe."
      en: "Wherefore he gave a remnant to Jacob, and to David of the same stock."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et finem habuit Salomon cum patribus suis."
      en: "And Solomon had an end with his fathers."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et dereliquit post se de semine suo, gentis stultitiam,"
      en: "And he left behind him of his seed, the folly of the nation,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et imminutum a prudentia, Roboam, qui avertit gentem consilio suo:"
      en: "Even Roboam that had little wisdom, who turned away the people through his counsel:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et Jeroboam filium Nabat, qui peccare fecit Israel, et dedit viam peccandi Ephraim: et plurima redundaverunt peccata ipsorum."
      en: "And Jeroboam the son of Nabat, who caused Israel to sin, and shewed Ephraim the way of sin, and their sins were multiplied exceedingly."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Valde averterunt illos a terra sua."
      en: "They removed them far away from their land."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et quaesivit omnes nequitias, usque dum perveniret ad illos defensio, et ab omnibus peccatis liberavit eos."
      en: "And they sought out all iniquities, till vengeance came upon them, and put an end to all their sins."
    status: { la: verified, en: verified }
