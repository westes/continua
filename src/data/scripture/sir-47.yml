# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 47
verses:
  - n: 1
    text:
      la: "post hoc surrexit Nathan propheta in diebus David"
      en: "the Lord the Almighty, and he gave strength in his right hand, to take away the mighty warrior, and to set up the horn of his nation."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et quasi adeps separatus est a carne sic David a filiis Israhel"
      en: "And as the fat taken away from the flesh, so was David chosen from among the children of Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cum leonibus lusit quasi cum agnis et in ursis similiter fecit sicut cum agnis ovium in iuventute sua"
      en: "He played with lions as with lambs: and with bears he did in like manner as with the lambs of the flock, in his youth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "numquid non occidit gigantem et extulit obprobrium de gente"
      en: "Did not he kill the giant, and take away reproach from his people?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "in tollendo manum in saxo fundae deiecit exultationem Goliae"
      en: "In lifting up his hand, with the stone in the sling he beat down the boasting of Goliath:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ubi invocavit Dominum potentem et dedit in dexteram eius tollere hominem fortem in bello et exaltare cornum gentis suae"
      en: "For he called upoI"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sic in milibus glorificavit illum et laudavit eum in benedictionibus Domini in offerendo illi coronam gloriae"
      en: "So in ten thousand did he glorify him, and praised him in the blessings of the Lord, in offering to him a crown of glory:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "conteruit enim inimicos undique et extirpavit Philisthim contrarios usque in hodiernum diem conteruit cornum ipsorum usque in aeternum"
      en: "For he destroyed the enemies on every side, and extirpated the Philistines the adversaries unto this day: he broke their horn for ever."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "in omni opere dedit confessionem Sancto et Excelso in verbo gloriae"
      en: "In all his works he gave thanks to the holy one, and to the most High, with words of glory."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "de omni corde suo laudavit Dominum et dilexit Deum qui fecit illum et dedit illi contra inimicos potentiam"
      en: "With his whole heart he praised the Lord, and loved God that made him: and he gave him power against his enemies:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et stare fecit cantores contra altarium et in sono eorum dulces fecit modos"
      en: "And he set singers before the altar, and by their voices he made sweet melody."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et dedit in celebrationibus decus et ornavit tempora usque ad consummationem vitae ut laudarent sanctum nomen Domini et amplificarent mane Dei sanctitatem"
      en: "And to the festivals he added beauty, and set in order the solemn times even to the end of his life, that they should praise the holy name of the Lord, and magnify the holiness of God in the morning."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Christus purgavit peccata ipsius et exaltavit in aeternum cornum ipsius et dedit illi testamentum regum et sedem gloriae in Israhel"
      en: "The Lord took away his sine, and exalted his horn for ever: and he gave him a covenant of the kingdom, and a throne of glory in Israel."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "post ipsum surrexit filius sensatus et propter illum deiecit omnem potentiam inimicorum"
      en: "After him arose up a wise son, and for his sake he cast down all the power of the enemies."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Salomon imperavit in diebus pacis cui subiecit Deus omnes hostes ut conderet domum in nomine suo et pararet sanctitatem in sempiternum quemadmodum eruditus est in iuventute sua"
      en: "Solomon reigned in days of peace, and God brought all his enemies under him, that he might build a house in his name, and prepare a sanctuary for ever: O how wise wast thou in thy youth!"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et impletus est quasi flumen sapientia et terram retexit anima tua"
      en: "And thou wast filled as a river with wisdom, and thy soul covered the earth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et replesti in conparationibus enigmata ad insulas longe distulisti nomen tuum et dilectus es in pace tua"
      en: "And thou didst multiply riddles in parables: thy name went abroad to the islands far off, and thou wast beloved in thy peace."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "in cantilenis et proverbiis et conparationibus et interpretationibus miratae sunt te terrae"
      en: "The countries wondered at thee for thy canticles, and proverbs, and parables, and interpretations,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et in nomine Domini Dei cui est cognomen Deus Israhel"
      en: "And at the name of the Lord God, whose surname is, God of Israel."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "collegisti quasi auricalcum aurum et ut plumbum conplesti argentum"
      en: "Thou didst gather gold as copper, and didst multiply silver as lead,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et reclinasti femora tua mulieribus potestatem habuisti in tuo corpore"
      en: "And thou didst bow thyself to women: and by thy body thou wast brought under subjection."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "dedisti maculam in gloria tua et profugasti semen tuum inducere iracundiam ad liberos tuos et incitari stultitiam tuam"
      en: "Thou hast stained thy glory, and defiled thy seed so as to bring wrath upon thy children, and to have thy folly kindled,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ut faceres imperium bipertitum et ex Efraim imperare imperium durum"
      en: "That thou shouldst make the kingdom to be divided, and out of Ephraim a rebellious kingdom to rule."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Deus autem non relinquit misericordiam suam et non corrumpit nec delebit opera sua neque perdet ab stirpe nepotes electi sui et semen eius qui diligit Dominum non corrumpet"
      en: "But God will not leave off his mercy, and he will not destroy, nor abolish his own works, neither will he out up by the roots the offspring of his elect: and he will not utterly take away the seed of him that loveth the Lord."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "dedit autem reliquum Iacob et David de ipsa stirpe"
      en: "Wherefore he gave a remnant to Jacob, and to David of the same stock."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et finem habuit Salomon cum patribus suis"
      en: "And Solomon had an end with his fathers."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et reliquit post se de semine suo gentis stultitiam"
      en: "And he left behind him of his seed, the folly of the nation,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et mutum prudentia Roboam qui avertit gentem consilio suo"
      en: "Even Roboam that had little wisdom, who turned away the people through his counsel:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et Hieroboam filium Nabath qui peccare fecit Israhel et dedit Efraim viam peccandi et plurima redundaverunt peccata ipsorum"
      en: "And Jeroboam the son of Nabat, who caused Israel to sin, and shewed Ephraim the way of sin, and their sins were multiplied exceedingly."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "valde averterunt illos a terra sua"
      en: "They removed them far away from their land."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et quaesivit omnes nequitias usque dum perveniret ad illos defensio et ab omnibus peccatis liberavit eos"
      en: "And they sought out all iniquities, till vengeance came upon them, and put an end to all their sine."
    status: { la: verified, en: verified }
