# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdc
chapter: 13
verses:
  - n: 1
    text:
      la: "rursumque filii Israhel fecerunt malum in conspectu Domini qui tradidit eos in manus Philisthinorum quadraginta annis"
      en: "And the children of Israel did evil again in the sight of the Lord: and he delivered them into the hands of the Philistines forty years."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "erat autem vir quidam de Saraa et de stirpe Dan nomine Manue habens uxorem sterilem"
      en: "Now there was a certain man of Saraa, and of the race of Dan, whose name was Manue, and his wife was barren."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cui apparuit angelus Domini et dixit ad eam sterilis es et absque liberis sed concipies et paries filium"
      en: "And an angel of the Lord appeared to her, and said: Thou art barren and without children: but thou shalt conceive and bear a son."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cave ergo ne vinum bibas ac siceram ne inmundum quicquam comedas"
      en: "Now therefore beware and drink no wine nor strong drink, and eat not any unclean thing."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quia concipies et paries filium cuius non tanget caput novacula erit enim nazareus Dei ab infantia sua et ex matris utero et ipse incipiet liberare Israhel de manu Philisthinorum"
      en: "Because thou shalt conceive and bear a son, and no razor shall touch his head: for he shall be a Nazarite of God, from his infancy, and from his mother's womb, and he shall begin to deliver Israel from the hands of the Philistines."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quae cum venisset ad maritum dixit ei vir Dei venit ad me habens vultum angelicum terribilis nimis quem cum interrogassem quis esset et unde venisset et quo nomine vocaretur noluit mihi dicere"
      en: "And when she was come to her husband she said to him: A man of God came to me, having the countenance of an angel, very awful. And when I asked him who he was, and whence he came, and by what name he was called, he would not tell me."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sed hoc respondit ecce concipies et paries filium cave ne vinum bibas et siceram et ne aliquo vescaris inmundo erit enim puer nazareus Dei ab infantia sua et ex utero matris usque ad diem mortis suae"
      en: "But he answered thus: Behold thou shalt conceive and bear a son: beware thou drink no wine, nor strong drink, nor eat any unclean thing: for the child shall be a Nazarite of God from his infancy, from his mother's womb until the day of his death."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "oravit itaque Manue Deum et ait obsecro Domine ut vir Dei quem misisti veniat iterum et doceat nos quid debeamus facere de puero qui nasciturus est"
      en: "Then Manue prayed to the Lord, and said: I beseech thee, O Lord, that the mail of God, whom thou didst send, may come again, and teach us what we ought to do concerning the child that shall be born."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "exaudivitque Dominus precantem Manue et apparuit rursum angelus Domini uxori eius sedenti in agro Manue autem maritus eius non erat cum ea quae cum vidisset angelum"
      en: "And the Lord heard the prayer of Manue, and the angel of the Lord appeared again to his wife as she was sitting in the field. But Manue her husband was not with her. And when she saw the angel,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "festinavit et cucurrit ad virum suum nuntiavitque ei dicens ecce apparuit mihi vir quem ante videram"
      en: "She made haste and ran to her husband: and told him saying: Behold the man hath appeared to me whom I saw before."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "qui surrexit et secutus est uxorem suam veniensque ad virum dixit ei tu es qui locutus es mulieri et ille respondit ego sum"
      en: "He rose up and followed his wife: and coming to the man, said to him: Art thou he that spoke to the woman? And he answered: I am."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cui Manue quando inquit sermo tuus fuerit expletus quid vis ut faciat puer aut a quo se observare debebit"
      en: "And Manue said to him: When thy word shall come to pass, what wilt thou that the child should do? or from what shall he keep himself?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixitque angelus Domini ad Manue ab omnibus quae locutus sum uxori tuae abstineat se"
      en: "And the angel of the Lord said to Manue: From all the things I have spoken of to thy wife, let her refrain herself:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et quicquid ex vinea nascitur non comedat vinum et siceram non bibat nullo vescatur inmundo et quod ei praecepi impleat atque custodiat"
      en: "And let her eat nothing that cometh of the vine, neither let her drink wine or strong drink, nor eat any unclean thing: and whatsoever I have commanded her, let her fulfil and observe."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "dixitque Manue ad angelum Domini obsecro te ut adquiescas precibus meis et faciamus tibi hedum de capris"
      en: "And Manue said to the angel of the Lord: I beseech thee to consent to my request, and let us dress a kid for thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cui respondit angelus si me cogis non comedam panes tuos sin autem vis holocaustum facere offer illud Domino et nesciebat Manue quod angelus Dei esset"
      en: "And the angel answered him: If thou press me, I will not eat of thy bread: but if thou wilt offer a holocaust, offer it to the Lord. And Manue knew not it was the angel of the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dixitque ad eum quod est tibi nomen ut si sermo tuus fuerit expletus honoremus te"
      en: "And he said to him: What is thy name, that, if thy word shall come to pass, we may honour thee?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cui ille respondit cur quaeris nomen meum quod est mirabile"
      en: "And he answered him: Why askest thou my name, which is wonderful?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "tulit itaque Manue hedum de capris et libamenta et posuit super petram offerens Domino qui facit mirabilia ipse autem et uxor eius intuebantur"
      en: "Then Manue took a kid of the flocks, and the libations, and put them upon a rock, offering to the Lord, who doth wonderful things: and he and his wife looked on."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "cumque ascenderet flamma altaris in caelum angelus Domini in flamma pariter ascendit quod cum vidisset Manue et uxor eius proni ceciderunt in terram"
      en: "And when the flame from the altar went up towards heaven, the angel of the lord ascended also in the flame. And when Manue and his wife saw this, they fell flat on the ground."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et ultra non eis apparuit angelus Domini statimque intellexit Manue angelum esse Domini"
      en: "And the angel of the Lord appeared to them no more. And forthwith Manue understood that it was an angel of the Lord,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et dixit ad uxorem suam morte moriemur quia vidimus Deum"
      en: "And he said to his wife: We shall certainly die, because we have seen God."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "cui respondit mulier si Dominus nos vellet occidere de manibus nostris holocaustum et libamenta non suscepisset nec ostendisset nobis haec omnia neque ea quae sunt ventura dixisset"
      en: "And his wife answered him: If the Lord had a mind to kill us, he would not have received a holocaust and libations at our hands, neither would he have shewed us all these things, nor have told us the things that are to come."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "peperit itaque filium et vocavit nomen eius Samson crevitque puer et benedixit ei Dominus"
      en: "And she bore a son, and called his name Samson. And the child grew, and the Lord blessed him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "coepitque spiritus Domini esse cum eo in castris Dan inter Saraa et Esthaol"
      en: "And the spirit of the Lord began to be with him in the camp of Dan, between Saraa and Esthaol."
    status: { la: verified, en: verified }
