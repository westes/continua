# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdc
chapter: 8
verses:
  - n: 1
    text:
      la: "dixeruntque ad eum viri Ephraim quid est hoc quod facere voluisti ut non nos vocares cum ad pugnam pergeres contra Madian iurgantes fortiter et prope vim inferentes"
      en: "And the men of Ephraim said to him: What is this that thou meanest to do, that thou wouldst not call us when thou wentest to fight against Madian? and they chid him sharply and almost offered violence."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quibus ille respondit quid enim tale facere potui quale vos fecistis nonne melior est racemus Ephraim vindemiis Abiezer"
      en: "And he answered them: What could I have done like to that which you have done? Is not one bunch of grapes of Ephraim better than the vintages of Abiezer?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "in manus vestras tradidit Dominus principes Madian Oreb et Zeb quid tale facere potui quale vos fecistis quod cum locutus esset requievit spiritus eorum quo tumebant contra eum"
      en: "The Lord hath delivered into your bands the princes of Madian, Oreb and Zeb: what could I have done like to what you have done? And when he had said this, their spirit was appeased, with which they swelled against him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cumque venisset Gedeon ad Iordanem transivit eum cum trecentis viris qui secum erant et prae lassitudine fugientes persequi non poterant"
      en: "And when Gedeon was come to the Jordan, he passed over it with the three hundred men, that were with him: who were so weary that they could not pursue after them that fled."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixitque ad viros Soccoth date obsecro panes populo qui mecum est quia valde defecerunt ut possimus persequi Zebee et Salmana reges Madian"
      en: "And he said to the men of Soccoth: Give, I beseech you, bread to the people that is with me, for they are faint: that we may pursue Zebee, and Salmana the kings of Madian."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "responderunt principes Soccoth forsitan palmae manuum Zebee et Salmana in manu tua sunt et idcirco postulas ut demus exercitui tuo panes"
      en: "The princes of Soccoth answered: Peradventure the palms of the hands of Zebee and Salmana are in thy hand, and therefore thou demandest that we should give bread to thy army."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quibus ille ait cum ergo tradiderit Dominus Zebee et Salmana in manus meas conteram carnes vestras cum spinis tribulisque deserti"
      en: "And he said to them: When the Lord therefore shall have delivered Zebee and Salmana into my hands, I will thresh your flesh with the thorns and briers of the desert."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et inde conscendens venit in Phanuhel locutusque est ad viros eius loci similia cui et illi responderunt sicut responderant viri Soccoth"
      en: "And going up from thence, he came to Phanuel: and he spoke the like things to the men of that place. And they also answered him, as the men of Soccoth had answered."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dixit itaque et eis cum reversus fuero victor in pace destruam turrem hanc"
      en: "He said therefore to them also: When I shall return a conqueror in peace, I will destroy this tower."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Zebee autem et Salmana requiescebant cum omni exercitu suo quindecim milia enim viri remanserant ex omnibus turmis orientalium populorum caesis centum viginti milibus bellatorum et educentium gladium"
      en: "But Zebee and Salmana were resting with all their army. For fifteen thousand men were left of all the troops of the eastern people, and one hundred and twenty thousand warriors that drew the sword, were slain."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ascendensque Gedeon per viam eorum qui in tabernaculis morabantur ad orientalem partem Nobee et Iecbaa percussit castra hostium qui securi erant et nihil adversi suspicabantur"
      en: "And Gedeon went up by the way of them that dwelt in tents, on the east of Nobe and Jegbaa, and smote the camp of the enemies, who were secure, and suspected no hurt."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "fugeruntque Zebee et Salmana quos persequens Gedeon conprehendit turbato omni exercitu eorum"
      en: "And Zebee and Salmana fled, and Gedeon pursued and took them, all their host being put in confusion."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "revertensque de bello ante solis ortum"
      en: "And returning from the battle before the sun rising,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "adprehendit puerum de viris Soccoth interrogavitque eum nomina principum et seniorum Soccoth et descripsit septuaginta septem viros"
      en: "He took a boy of the men of Soccoth: and he asked him the names of the princes and ancients of Soccoth, and he described unto him seventy-seven men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "venitque ad Soccoth et dixit eis en Zebee et Salmana super quibus exprobrastis mihi dicentes forsitan manus Zebee et Salmana in manibus tuis sunt et idcirco postulas ut demus viris qui lassi sunt et defecerunt panes"
      en: "And he came to Soccoth and said to them: Behold Zebee and Salmana, concerning whom you upbraided me, saying: Peradventure the hands of Zebee and Salmana, are in thy hands, and therefore thou demandest that we should give bread to the men that are weary and faint."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tulit ergo seniores civitatis et spinas deserti ac tribulos et contrivit cum eis atque comminuit viros Soccoth"
      en: "So he took the ancients of the city and thorns and briers of the desert, and tore them with the same, and cut in pieces the men of Soccoth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "turrem quoque Phanuhel subvertit occisis habitatoribus civitatis"
      en: "And he demolished the tower of Phanuel, and slew the men of the city."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dixitque ad Zebee et Salmana quales fuerunt viri quos occidistis in Thabor qui responderunt similes tui et unus ex eis quasi filius regis"
      en: "And he said to Zebee and Salmana: What manner of men were they whom you slew in Thabor? They answered: They were like thee, and one of them as the son of a king."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quibus ille ait fratres mei fuerunt filii matris meae vivit Dominus si servassetis eos non vos occiderem"
      en: "He answered them: They were my brethren, the sons of my mother. As the Lord liveth, if you had saved them, I would not kill you."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dixitque Ietther primogenito suo surge et interfice eos qui non eduxit gladium timebat enim quia adhuc puer erat"
      en: "And he said to Jether his eldest son: Arise, and slay them. But he drew not his sword: for he was afraid, being but yet a boy."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "dixeruntque Zebee et Salmana tu surge et inrue in nos quia iuxta aetatem robur est hominis surrexit Gedeon et interfecit Zebee et Salmana et tulit ornamenta ac bullas quibus colla regalium camelorum decorari solent"
      en: "And Zebee and Salmana said: Do thou rise, and run upon us: because the strength of a man is according to his age: Gedeon rose up and slew Zebee and Salmana: and he took the ornaments and bosses, with which the necks of the camels of kings are wont to be adorned."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "dixeruntque omnes viri Israhel ad Gedeon dominare nostri tu et filius tuus et filius filii tui quia liberasti nos de manu Madian"
      en: "And all the men of Israel said to Gedeon: Rule thou over us and thy son, and thy son's son: because thou hast delivered us from the hand of Madian."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quibus ille ait non dominabor vestri nec dominabitur in vos filius meus sed dominabitur Dominus"
      en: "And he said to them: I will not rule over you, neither shall my son rule over you, but the Lord shall rule over you."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "dixitque ad eos unam petitionem postulo a vobis date mihi inaures ex praeda vestra inaures enim aureas Ismahelitae habere consuerant"
      en: "And he said to them: I desire one request of you: Give me the earlets of your spoils. For the Ismaelites were accustomed to wear golden earlets."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "qui responderunt libentissime dabimus expandentesque super terram pallium proiecerunt in eo inaures de praeda"
      en: "They answered: We will give them most willingly. And spreading a mantle on the ground, they cast upon it the earlets of the spoils."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et fuit pondus postulatarum inaurium mille septingenti auri sicli absque ornamentis et monilibus et veste purpurea quibus Madian reges uti soliti erant et praeter torques aureos camelorum"
      en: "And the weight of the earlets that he requested, was a thousand seven hundred sicles of gold, besides the ornaments, and jewels, and purple raiment which the kings of Madian were went to use, and besides the golden chains that were about the camels' necks."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "fecitque ex eo Gedeon ephod et posuit illud in civitate sua Ephra fornicatusque est omnis Israhel in eo et factum est Gedeoni et omni domui eius in ruinam"
      en: "And Gedeon made an ephod thereof, and put it in his city Ephra. And all Israel committed fornication with it, and it became a ruin to Gedeon and to all his house."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "humiliatus est autem Madian coram filiis Israhel nec potuerunt ultra elevare cervices sed quievit terra per quadraginta annos quibus praefuit Gedeon"
      en: "But Madian was humbled before the children of Israel, neither could they any more lift up their beads: but the land rested for forty years, while Gedeon presided."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "abiit itaque Hierobbaal filius Ioas et habitavit in domo sua"
      en: "So Jerobaal the son of Joas went, and dwelt in his own house."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "habuitque septuaginta filios qui egressi sunt de femore eius eo quod plures haberet uxores"
      en: "And he had seventy sons, who came out of his thigh, for he had many wives."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "concubina autem illius quam habebat in Sychem genuit ei filium nomine Abimelech"
      en: "And his concubine, that he had in Sichem, bore him a son, whose name was Abimelech."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "mortuusque est Gedeon filius Ioas in senectute bona et sepultus in sepulchro Ioas patris sui in Ephra de familia Ezri"
      en: "And Gedeon the son of Joas died in a good old age, and was buried in the sepulchre of his father in Ephra of the family of Ezri."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "postquam autem mortuus est Gedeon aversi sunt filii Israhel et fornicati cum Baalim percusseruntque cum Baal foedus ut esset eis in deum"
      en: "But after Gedeon was dead, the children of Israel turned again, and committed fornication with Baalim. And they made a covenant with Baal, that he should be their god:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "nec recordati sunt Domini Dei sui qui eruit eos de manu omnium inimicorum suorum per circuitum"
      en: "And they remembered not the Lord their God, who delivered them out of the hands of all their enemies round about:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "nec fecerunt misericordiam cum domo Hierobbaal Gedeon iuxta omnia bona quae fecerat Israheli"
      en: "Neither did they shew mercy to the house of Jerobaal Gedeon, according to all the good things he had done to Israel."
    status: { la: verified, en: verified }
