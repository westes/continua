# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1par
chapter: 7
verses:
  - n: 1
    text:
      la: "Porro filii Issachar: Thola, et Phua, Jasub, et Simeron, quatuor."
      en: "Now the sons of Issachar were Thola, and Phua, Jasub and Simeron, four."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Filii Thola: Ozi, et Raphaia, et Jeriel, et Jemai, et Jebsem, et Samuel, principes per domos cognationum suarum. De stirpe Thola viri fortissimi numerati sunt in diebus David, viginti duo millia sexcenti."
      en: "The sons of Thola: Ozi and Raphaia, and Jeriel, and Jemai, and Jebsem, and Samuel, chiefs of the houses of their kindreds. Of the posterity of Thola were numbered in the days of David, two and twenty thousand six hundred most valiant men."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Filii Ozi: Izrahia, de quo nati sunt Michael, et Obadia, et Joel, et Jesia, quinque omnes principes."
      en: "The sons of Ozi: Izrahia, of whom were born Michael, and Obadia, and Joel, and Jesia, five all great men."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cumque eis per familias, et populos suos, accincti ad praelium, viri fortissimi, triginta sex millia: multas enim habuerunt uxores, et filios."
      en: "And there were with them by their families and peoples, six and thirty thousand most valiant men ready for war: for they had many wives and children."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Fratres quoque eorum per omnem cognationem Issachar robustissimi ad pugnandum, octoginta septem millia numerati sunt."
      en: "Their brethren also throughout all the house of Issachar, were numbered fourscore and seven thousand most valiant men for war."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Filii Benjamin: Bela, et Bechor, et Jadihel, tres."
      en: "The sons of Benjamin were Bela, and Bechor, and Jadihel, three."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Filii Bela: Esbon, et Ozi, et Oziel, et Jerimoth, et Urai, quinque principes familiarum, et ad pugnandum robustissimi: numerus autem eorum, viginti duo millia et triginta quatuor."
      en: "The sons of Bela: Esbon, and Ozi, and Ozial, and Jerimoth and Urai, five chiefs of their families, and most valiant warriors, and their number was twenty-two thousand and thirty-four."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Porro filii Bechor: Zamira, et Joas, et Eliezer, et Elioenai, et Amri, et Jerimoth, et Abia, et Anathoth, et Almath: omnes hi, filii Bechor."
      en: "And the sons of Bechor were Zamira, and Joas, and Eliezer, and Elioenai, and Amai, and Jerimoth, and Abia, and Anathoth, and Almath: all these were the sons of Bechor."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Numerati sunt autem per familias suas principes cognationum suarum ad bella fortissimi, viginti millia et ducenti."
      en: "And they were numbered by the families, heads of their kindreds, most valiant men for war, twenty thousand and two hundred."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Porro filii Jadihel: Balan. Filii autem Balan: Jehus, et Benjamin, et Aod, et Chanana, et Zethan, et Tharsis, et Ahisahar:"
      en: "And the son of Jadihel: Balan. And the sons of Balan: Jehus and Benjamin and Aod, and Chanana, and Zethan and Tharsis, and Ahisahar."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "omnes hi filii Jadihel, principes cognationum suarum viri fortissimi, decem et septem millia et ducenti ad praelium procedentes."
      en: "All these were sons of Jadihel, heads of their kindreds, most valiant men, seventeen thousand and two hundred fit to go out to war."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Sepham quoque, et Hapham filii Hir: et Hasim filii Aher."
      en: "Sepham also and Hapham the sons of Hir: and Hasim the sons of Aher."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Filii autem Nephthali: Jaziel, et Guni, et Jeser, et Sellum, filii Bala."
      en: "And the sons of Nephtali were Jasiel, and Guni, and Jezer, and Sellum, sons of Bala."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Porro filius Manasse, Esriel: concubinaque ejus Syra peperit Machir patrem Galaad."
      en: "And the son of Manasses, Ezriel: and his concubine the Syrian bore Machir the father of Galaad."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Machir autem accepit uxores filiis suis Happhim, et Saphan: et habuit sororem nomine Maacha: nomen autem secundi, Salphaad, nataeque sunt Salphaad filiae."
      en: "And Machir took wives for his sons Happhim, and Saphan: and he had a sister named Maacha: the name of the second was Salphaad, and Salphaad had daughters."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et peperit Maacha uxor Machir filium, vocavitque nomen ejus Phares: porro nomen fratris ejus, Sares: et filii ejus, Ulam, et Recen."
      en: "And Maacha the wife of Machir bore a son, and she called his name Phares: and the name of his brother was Sares: and his sons were Ulam and Recen."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Filius autem Ulam, Badan: hi sunt filii Galaad, filii Machir, filii Manasse."
      en: "And the son of Ulam, Baden. These are the sons of Galaad, the son of Machir the son of Manasses."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Soror autem ejus Regina peperit Virum decorum, et Abiezer, et Mohola."
      en: "And his sister named Queen bore Goodlyman, and Abiezer, and Mohola."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Erant autem filii Semida, Ahin, et Sechem, et Leci, et Aniam."
      en: "And the sons of Semida were Ahiu, and Sechem, and Leci and Aniam."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Filii autem Ephraim: Suthala, Bared filius ejus, Thahath filius ejus, Elada filius ejus, Thahath filius ejus, hujus filius Zabad,"
      en: "And the sons of Ephraim were Suthala, Bared his son, Thahath his son, Elada his son, Thahath his son, and his son Zabad,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et hujus filius Suthula, et hujus filius Ezer et Elad: occiderunt autem eos viri Geth indigenae, quia descenderant ut invaderent possessiones eorum."
      en: "And his son Suthala, and his son Ezer, and Elad: and the men of Geth born in the land slew them, because they came down to invade their possessions."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Luxit igitur Ephraim pater eorum multis diebus, et venerunt fratres ejus ut consolarentur eum."
      en: "And Ephraim their father mourned many days, and his brethren came to comfort him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ingressusque est ad uxorem suam: quae concepit, et peperit filium, et vocavit nomen ejus Beria, eo quod in malis domus ejus ortus esset:"
      en: "And he went in to his wife: and she conceived and bore a son, and he called his name Beria, because he was born when it went evil with his house:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "filia autem ejus fuit Sara, quae aedificavit Bethoron inferiorem et superiorem, et Ozensara."
      en: "And his daughter was Sara, who built Bethoron, the nether and the upper, and Ozensara."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Porro filius ejus Rapha, et Reseph, et Thale, de quo natus est Thaan,"
      en: "And Rapha was his son, and Reseph, and Thale, of whom was born Thaan,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "qui genuit Laadan: hujus quoque filius Ammiud, qui genuit Elisama,"
      en: "Who begot Laadan: and his son was Ammiud, who beget Elisama,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "de quo ortus est Nun, qui habuit filium Josue."
      en: "Of whom was born Nun, who had Josue for his son."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Possessio autem eorum et habitatio, Bethel cum filiabus suis, et contra orientem Noran, ad occidentalem plagam Gazer et filiae ejus, Sichem quoque cum filiabus suis, usque ad Aza cum filiabus ejus."
      en: "And their possessions and habitations were Bethel with her daughters, and eastward Noran, and westward Gazer and her daughters, Sichem also with her daughters, as far as Ass with her daughters."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Juxta filios quoque Manasse Bethsan, et filias ejus, Thanach et filias ejus, Mageddo et filias ejus, Dor et filias ejus: in his habitaverunt filii Joseph, filii Israel."
      en: "And by the borders of the sons of Manasses Bethsan and her daughters, Thanach and her daughters, Mageddo and her daughters: Dor and her daughters: in these dwelt the children of Joseph, the son of Israel."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Filii Aser: Jemna, et Jesua, et Jessui, et Baria, et Sara soror eorum."
      en: "The children of Aser were Jemna, and Jesua, and Jessui, and Baria, and Sara their sister."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Filii autem Baria: Heber, et Melchiel: ipse est pater Barsaith."
      en: "And the sons of Baria: Haber, and Melchiel: he is the father of Barsaith."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Heber autem genuit Jephlat, et Somer, et Hotham, et Suaa sororem eorum."
      en: "And Heber beget Jephlat, and Somer, and Hotham, and Suaa their sister."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Filii Jephlat: Phosech, et Chamaal, et Asoth: hi filii Jephlat."
      en: "The sons of Jephlat: Phosech, and Chamaal, and Asoth: these are the sons of Jephlat."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Porro filii Somer: Ahi, et Roaga, et Haba, et Aram."
      en: "And the sons of Somer: Ahi, and Roaga, and Haba, and Aram."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Filii autem Helem fratris ejus: Supha, et Jemna, et Selles et Amal."
      en: "And the sons of Helem his brother: Supha, and Jemna, and Selles, and Amal."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Filii Supha: Sue, Harnapher, et Sual, et Beri, et Jamra,"
      en: "The sons of Supha: Sue, Hernapher, and Sual, and Beri, and Jamra."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Bosor, et Hod, et Samma, et Salusa, et Jethran, et Bera."
      en: "Bosor and Hod, and Samma, and Salusa, and Jethran, and Bera."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Filii Jether: Jephone, et Phaspha, et Ara."
      en: "The sons of Jether: Jephone, and Phaspha, and Ara."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Filii autem Olla: Aree, et Haniel, et Resia."
      en: "And the sons of Olla: Aree, and Haniel, and Resia."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Omnes hi filii Aser, principes cognationum, electi atque fortissimi duces ducum: numerus autem eorum aetatis, quae apta esset ad bellum, viginti sex millia."
      en: "All these were sons of Aser, heads of their families, choice and most valiant captains of captains: and the number of them that were of the age that was fit for war, was six and twenty thousand."
    status: { la: verified, en: verified }
