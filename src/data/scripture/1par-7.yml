book: 1par
chapter: 7
verses:
  - n: 1
    text:
      la: "porro filii Isachar Thola et Phua Iasub et Samaron quattuor"
      en: "Now the sons of Issachar were Thola, and Phua, Jasub and Simeron, four."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "filii Thola Ozi et Raphaia et Ierihel et Iemai et Iebsem et Samuhel principes per domos cognationum suarum de stirpe Thola viri fortissimi numerati sunt in diebus David viginti duo milia sescenti"
      en: "The sons of Thola: Ozi and Raphaia, and Jeriel, and Jemai, and Jebsem, and Samuel, chiefs of the houses of their kindreds. Of the posterity of Thola were numbered in the days of David, two and twenty thousand six hundred most valiant men."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "filii Ozi Iezraia de quo nati sunt Michahel et Obadia et Iohel et Iesia quinque omnes principes"
      en: "The sons of Ozi: Izrahia, of whom were born Michael, and Obadia, and Joel, and Jesia, five all great men."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cumque eis per familias et populos suos accincti ad proelium viri fortissimi triginta sex milia multas enim habuere uxores et filios"
      en: "And there were with them by their families and peoples, six and thirty thousand most valiant men ready for war: for they had many wives and children."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "fratresque eorum per omnem cognationem Isachar robustissimi ad pugnandum octoginta septem milia numerati sunt"
      en: "Their brethren also throughout all the house of Issachar, were numbered fourscore and seven thousand most valiant men for war."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Beniamin Bale et Bochor et Iadihel tres"
      en: "The sons of s Benjamin were Bela, and Bechor, and Jadihel, three."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "filii Bale Esbon et Ozi et Ozihel et Ierimoth et Urai quinque principes familiarum et ad pugnandum robustissimi numerus autem eorum viginti duo milia et triginta quattuor"
      en: "The sons of Bela: Esbon, and Ozi, and Ozial, and Jerimoth and Urai, five chiefs of their families, and most valiant warriors, and their number was twenty-two thousand and thirty-four."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "porro filii Bochor Zamira et Ioas et Eliezer et Helioenai et Amri et Ierimoth et Abia et Anathoth et Almathan omnes hii filii Bochor"
      en: "And the sons of Bechor were Zamira, and Joas, and Eliezer, and Elioenai, and Amai, and Jerimoth, and Abia, and Anathoth, and Almath: all these were the sons of Bechor."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "numerati sunt autem per familias suas principes cognationum ad bella fortissimi viginti milia et ducenti"
      en: "And they were numbered by the families, heads of their kindreds, most valiant men for war, twenty thousand and two hundred."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "porro filii Iadihel Balan filii autem Balan Hieus et Beniamin et Ahoth et Chanana et Iothan et Tharsis et Haisaar"
      en: "And the son of Jadihel: Balan. And the sons of Balan: Jehus and Benjamin and Aod, and Chanana, and Zethan and Tharsis, and Ahisahar."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "omnes hii filii Iadihel principes cognationum suarum viri fortissimi decem et septem milia et ducenti ad proelium procedentes"
      en: "All these were sons of Jadihel, heads of their kindreds, most valiant men, seventeen thousand and two hundred fit to go out to war."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Sephan quoque et Apham filii Hir et Asim filii Aer"
      en: "Sepham also and Hapham the sons of Hir: and Hasim the sons of Aher."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "filii autem Nepthali Iasihel et Guni et Asar et Sellum filii Balaa"
      en: "And the sons of Nephtali were Jasiel, and Guni, and Jezer, and Sellum, sons of Bala."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "porro filius Manasse Esrihel concubinaque eius syra peperit Machir patrem Galaad"
      en: "And the son of Manasses, Ezriel: and his concubine the Syrian bore Machir the father of Galaad."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Machir autem accepit uxores filiis suis Happhim et Sepham et habuit sororem nomine Maacha nomen autem secundi Salphaad nataeque sunt Salphaad filiae"
      en: "And Machir took wives for his sons Happhim, and Saphan: and he had a sister named Maacha: the name of the second was Salphaad, and Salphaad had daughters."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et peperit Maacha uxor Machir filium vocavitque nomen eius Phares porro nomen fratris eius Sares et filii eius Ulam et Recem"
      en: "And Maacha the wife of Machir bore a son, and she called his name Phares: and the name of his brother was Sares: and his sons were Ulam and Recen."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "filius autem Ulam Badan hii sunt filii Galaad filii Machir filii Manasse"
      en: "And the son of Ulam, Baden. These are the sons of Galaad, the son of Machir the son of Manasses."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "soror autem eius Regina peperit virum Decorum et Abiezer et Moola"
      en: "And his sister named Queen bore Goodlyman, and Abiezer, and Mohola."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "erant autem filii Semida Ahin et Sechem et Leci et Aniam"
      en: "And the sons of Semida were Ahiu, and Sechem, and Leci and Aniam."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "filii autem Ephraim Suthala Bareth filius eius Thaath filius eius Elada filius eius Thaath filius eius et huius filius Zabad"
      en: "And the sons of Ephraim were Suthala, Bared his son, Thahath his son, Elada his son, Thahath his son, and his son Zabad,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et huius filius Suthala et huius filius Ezer et Elad occiderunt autem eos viri Geth indigenae quia descenderant ut invaderent possessiones eorum"
      en: "And his son Suthala, and his son Ezer, and Elad: and the men of Geth born in the land slew them, because they came down to invade their possessions."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "luxit igitur Ephraim pater eorum multis diebus et venerunt fratres eius ut consolarentur eum"
      en: "And Ephraim their father mourned many days, and his brethren came to comfort him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ingressusque est ad uxorem suam quae concepit et peperit filium et vocavit nomen eius Beria eo quod in malis domus eius ortus esset"
      en: "And he went in to his wife: and she conceived and bore a son, and he called his name Beria, because he was born when it went evil with his house:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "filia autem eius fuit Sara quae aedificavit Bethoron inferiorem et superiorem et Ozensara"
      en: "And his daughter was Sara, who built Bethoron, the nether and the upper, and Ozensara."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "porro filius eius Rapha et Reseph et Thale de quo natus est Thaan"
      en: "And Rapha was his son, and Reseph, and Thale, of whom was born Thaan,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "qui genuit Laadan huius quoque filius Ammiud genuit Elisama"
      en: "Who begot Laadan: and his son was Ammiud, who beget Elisama,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "de quo ortus est Nun qui habuit filium Iosue"
      en: "Of whom was born Nun, who had Josue for his son."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "possessio autem eorum et habitatio Bethel cum filiabus suis et contra orientem Noran ad occidentalem plagam Gazer et filiae eius Sychem quoque cum filiabus suis usque Aza et filias eius"
      en: "And their possessions and habitations were Bethel with her daughters, and eastward Noran, and westward Gazer and her daughters, Sichem also with her daughters, as far as Ass with her daughters."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "iuxta filios quoque Manasse Bethsan et filias eius Thanach et filias eius Mageddo et filias eius Dor et filias eius in his habitaverunt filii Ioseph filii Israhel"
      en: "And by the borders of the sons of Manasses Bethsan and her daughters, Thanach and her daughters, Mageddo and her daughters: Dor and her daughters: in these dwelt the children of Joseph, the son of Israel."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "filii Aser Iomna et Iesua et Isui et Baria et Sara soror eorum"
      en: "The children of Aser were Jemna, and Jesua, and Jessui, and Baria, and Sara their sister."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "filii autem Baria Heber et Melchihel ipse est pater Barzaith"
      en: "31And the sons of Baria: Haber, and Melchiel: he is the father of Barsaith."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Heber autem genuit Iephlat et Somer et Otham et Suaa sororem eorum"
      en: "And Heber beget Jephlat, and Somer, and Hotham, and Suaa their sister."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "filii Iephlat Phosech et Chamaal et Asoth hii filii Iephlat"
      en: "The sons of Jephlat: Phosech, and Chamaal, and Asoth: these are the sons of Jephlat."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "porro filii Somer Ahi et Roaga et Iaba et Aram"
      en: "And the sons of Somer: Ahi, and Roaga, and Haba, and Aram."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "filii autem Helem fratris eius Supha et Iemna et Selles et Amal"
      en: "And the sons of Helem his brother: Supha, and Jemna, and Selles, and Amal."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "filii Supha Sue Arnaphed et Sual et Beri et Iamra"
      en: "The sons of Supha: Sue, Hernapher, and Sual, and Beri, and Jamra."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Bosor et Od et Samma et Salusa et Iethran et Bera"
      en: "Bosor and Hod, and Samma, and Salusa, and Jethran, and Bera."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "filii Iether Iephonne et Phaspha et Ara"
      en: "The sons of Jether: Jephone, and Phaspha, and Ara."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "filii autem Olla Aree et Anihel et Resia"
      en: "And the sons of Olla: Aree, and Haniel, and Resia."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "omnes hii filii Aser principes cognationum electi atque fortissimi duces ducum numerus autem eorum aetatis quae apta esset ad bellum viginti sex milia"
      en: "All these were sons of Aser, heads of their families, choice and most valiant captains of captains: and the number of them that were of the age that was fit for war, was six and twenty thousand."
    status: { la: verified, en: verified }
