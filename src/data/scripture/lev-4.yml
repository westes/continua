# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: lev
chapter: 4
verses:
  - n: 1
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Loquere filiis Israel: Anima, quae peccaverit per ignorantiam, et de universis mandatis Domini, quae praecepit ut non fierent, quippiam fecerit:"
      en: "Say to the children of Israel: The soul that sinneth through ignorance, and doth any thing concerning any of the commandments of the Lord, which he commanded not to be done:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "si sacerdos, qui unctus est, peccaverit, delinquere faciens populum, offeret pro peccato suo vitulum immaculatum Domino:"
      en: "If the priest that is anointed shall sin, making the people to offend, he shall offer to the Lord for his sin a calf without blemish."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et adducet illum ad ostium tabernaculi testimonii coram Domino, ponetque manum super caput ejus, et immolabit eum Domino."
      en: "And he shall bring it to the door of the testimony before the Lord, and shall put his hand upon the head thereof, and shall sacrifice it to the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Hauriet quoque de sanguine vituli, inferens illum in tabernaculum testimonii."
      en: "He shall take also of the blood of the calf, and carry it into the tabernacle of the testimony."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Cumque intinxerit digitum in sanguine, asperget eo septies coram Domino contra velum sanctuarii."
      en: "And having dipped his finger in the blood, he shall sprinkle with it seven times before the Lord, before the veil of the sanctuary."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ponetque de eodem sanguine super cornua altaris thymiamatis gratissimi Domino, quod est in tabernaculo testimonii: omnem autem reliquum sanguinem fundet in basim altaris holocausti in introitu tabernaculi."
      en: "And he shall put some of the same blood upon the horns of the altar of the sweet incense most acceptable to the Lord, which is in the tabernacle of the testimony. And he shall pour all the rest of the blood at the foot of the altar of holocaust in the entry of the tabernacle."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et adipem vituli auferet pro peccato, tam eum qui vitalia operit quam omnia quae intrinsecus sunt:"
      en: "And he shall take off the fat of the calf for the sin offering, as well that which covereth the entrails, as all the inwards:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "duos renunculos et reticulum quod est super eos juxta ilia, et adipem jecoris cum renunculis,"
      en: "The two little kidneys, and the caul that is upon them, which is by the flanks, and the fat of the liver with the little kidneys,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sicut aufertur de vitulo hostiae pacificorum: et adolebit ea super altare holocausti."
      en: "As it is taken off from the calf of the sacrifice of peace offerings, and he shall burn them upon the altar of holocaust."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Pellem vero et omnes carnes, cum capite et pedibus et intestinis et fimo,"
      en: "But the skin and all the flesh with the head and the feet and the bowels and the dung,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et reliquo corpore, efferet extra castra in locum mundum, ubi cineres effundi solent: incendetque ea super lignorum struem, quae in loco effusorum cinerum cremabuntur."
      en: "And the rest of the body he shall carry forth without the camp into a clean place where the ashes are wont to be poured out, and he shall burn them upon a pile of wood, they shall be burnt in the place where the ashes are poured out."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quod si omnis turba Israel ignoraverit, et per imperitiam fecerit quod contra mandatum Domini est,"
      en: "And if all the multitude of Israel shall be ignorant, and through ignorance shall do that which is against the commandment of the Lord,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et postea intellexerit peccatum suum, offeret pro peccato suo vitulum, adducetque eum ad ostium tabernaculi."
      en: "And afterwards shall understand their sin, they shall offer for their sin a calf, and shall bring it to the door of the tabernacle."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et ponent seniores populi manus super caput ejus coram Domino. Immolatoque vitulo in conspectu Domini,"
      en: "And the ancients of the people shall put their hands upon the head thereof before the Lord. And the calf being immolated in the sight of the Lord,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "inferet sacerdos, qui unctus est, de sanguine ejus in tabernaculum testimonii,"
      en: "The priest that is anointed shall carry of the blood into the tabernacle of the testimony."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "tincto digito aspergens septies contra velum."
      en: "And shall dip his finger in it and sprinkle it seven times before the veil."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ponetque de eodem sanguine in cornibus altaris, quod est coram Domino in tabernaculo testimonii: reliquum autem sanguinem fundet juxta basim altaris holocaustorum, quod est in ostio tabernaculi testimonii."
      en: "And he shall put of the same blood on the horns of the altar that is before the Lord, in the tabernacle of the testimony: and the rest of the blood he shall pour at the foot of the altar of holocaust, which is at the door of the tabernacle of the testimony."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Omnemque ejus adipem tollet, et adolebit super altare:"
      en: "And all the fat thereof he shall take off, and shall burn it upon the altar:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sic faciens et de hoc vitulo quomodo fecit et prius: et rogante pro eis sacerdote, propitius erit eis Dominus."
      en: "Doing so with this calf, as he did also with that before: and the priest praying for them, the Lord will be merciful unto them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Ipsum autem vitulum efferet extra castra, atque comburet sicut et priorem vitulum: quia est pro peccato multitudinis."
      en: "But the calf itself he shall carry forth without the camp, and shall burn it as he did the former calf: because it is for the sin of the multitude."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Si peccaverit princeps, et fecerit unum e pluribus per ignorantiam, quod Domini lege prohibetur:"
      en: "If a prince shall sin, and through ignorance do any one of the things that the law of the Lord forbiddeth,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et postea intellexerit peccatum suum, offeret hostiam Domino, hircum de capris immaculatum."
      en: "And afterwards shall come to know his sin, he shall offer a buck goat without blemish, a sacrifice to the Lord."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ponetque manum suam super caput ejus: cumque immolaverit eum loco ubi solet mactari holocaustum coram Domino, quia pro peccato est,"
      en: "And he shall put his hand upon the head thereof: and when he hath immolated it in the place where the holocaust is wont to be slain before the Lord, because it is for sin,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "tinget sacerdos digitum in sanguine hostiae pro peccato, tangens cornua altaris holocausti, et reliquum fundens ad basim ejus."
      en: "The priest shall dip his finger in the blood of the victim for sin, touching therewith the horns of the altar of holocaust, and pouring out the rest at the foot thereof."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Adipem vero adolebit supra, sicut in victimis pacificorum fieri solet: rogabitque pro eo sacerdos, et pro peccato ejus, et dimittetur ei."
      en: "But the fat he shall burn upon it, as is wont to be done with the victims of peace offerings: and the priest shall pray for him, and for his sin, and it shall be forgiven him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Quod si peccaverit anima per ignorantiam, de populo terrae, ut faciat quidquam de his, quae Domini lege prohibentur, atque delinquat,"
      en: "And if any one of the people of the land shall sin through ignorance, doing any of those things that by the law of the Lord are forbidden, and offending,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et cognoverit peccatum suum, offeret capram immaculatam."
      en: "And shall come to know his sin, he shall offer a she goat without blemish."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Ponetque manum super caput hostiae quae pro peccato est, et immolabit eam in loco holocausti."
      en: "And he shall put his hand upon the head of the victim that is for sin, and shall immolate it in the place of the holocaust."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Tolletque sacerdos de sanguine in digito suo: et tangens cornua altaris holocausti, reliquum fundet ad basim ejus."
      en: "And the priest shall take of the blood with his finger, and shall touch the horns of the altar of holocaust, and shall pour out the rest at the foot thereof."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Omnem autem adipem auferens, sicut auferri solet de victimis pacificorum, adolebit super altare in odorem suavitatis Domino: rogabitque pro eo, et dimittetur ei."
      en: "But taking off all the fat, as is wont to be taken away of the victims of peace offerings, he shall burn it upon the altar, for a sweet savour to the Lord: and he shall pray for him, and it shall be forgiven him."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Sin autem de pecoribus obtulerit victimam pro peccato, ovem scilicet immaculatam:"
      en: "But if he offer of the flock a victim for his sin, to wit, an ewe without blemish:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "ponet manum super caput ejus, et immolabit eam in loco ubi solent caedi holocaustorum hostiae."
      en: "He shall put his hand upon the head thereof, and shall immolate it in the place where the victims of holocausts are wont to be slain."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Sumetque sacerdos de sanguine ejus digito suo, et tangens cornua altaris holocausti, reliquum fundet ad basim ejus."
      en: "And the priest shall take of the blood thereof with his finger, and shall touch the horns of the altar of holocaust, and the rest he shall pour out at the foot thereof."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Omnem quoque adipem auferens, sicut auferri solet adeps arietis, qui immolatur pro pacificis, cremabit super altare in incensum Domini: rogabitque pro eo, et pro peccato ejus, et dimittetur ei."
      en: "All the fat also he shall take off, as the fat of the ram that is offered for peace offerings is wont to be taken away: and shall burn it upon the altar, for a burnt sacrifice of the Lord: and he shall pray for him and for his sin, and it shall be forgiven him."
    status: { la: verified, en: verified }
