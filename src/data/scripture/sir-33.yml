# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 33
verses:
  - n: 1
    text:
      la: "timenti Dominum non occurrent mala sed in temptatione Deus illum conservat et liberabit a malis"
      en: "No evils shall happen to him that feareth the Lord, but in temptation God will keep him, and deliver him from evils."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sapiens non odit mandata et iustitias et non inludetur quasi in procella navis"
      en: "A wise man hateth not the commandments and justices, and he shall not be dashed in pieces as a ship in a storm."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "homo sensatus credit legi Dei et lex illi fidelis"
      en: "A man of understanding is faithful to the law of God, and the law is faithful to him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui interrogationem manifestat parabit verbum et sic deprecatus exaudietur et conservabit disciplinam et tunc respondebit"
      en: "He that cleareth up a question, shall prepare what to say, and so having prayed he shall be heard, and shall keep discipline, and then he shall answer."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "praecordia fatui quasi rota carri et quasi axis versatilis cogitatus illius"
      en: "The heart of a fool is as a wheel of a cart: and his thoughts are like a rolling axletree."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "equus admissarius sicut amicus subsannator sub omni suprasedenti hinnit"
      en: "A friend that is a mocker, is like a stallion horse: he neigheth under every one that sitteth upon him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quare dies diem superat et iterum lux lucem et annus annum a sole"
      en: "Why doth one day excel another, and one light another, and one year another year, when all come of the sun?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "a Domini scientia separati sunt facto sole et praeceptum custodiente"
      en: "By the knowledge of the Lord they were distinguished, the sun being made, and keeping his commandment."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et inmutavit tempora et dies festos ipsorum et in illis dies festos celebraverunt ad horam"
      en: "And he ordered the seasons, and holidays of them, and in them they celebrated festivals at an hour."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ex ipsis exaltavit et magnificavit Deus et ex ipsis posuit in numerum dierum et homines omnes de solo et ex terra unde creatus est Adam"
      en: "Some of them God made high and great days, and some of them he put in the number of ordinary days. And all men are from the ground, and out of the earth, from whence Adam was created."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in multitudine disciplinae Domini separavit eos et inmutavit vias eorum"
      en: "With much knowledge the Lord hath divided them and diversified their ways."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et ex ipsis benedixit et exaltavit et ex ipsis sanctificavit et ad se adplicavit et ex ipsis maledixit et humiliavit et convertit illos a separatione ipsorum"
      en: "Some of them hath he blessed, and exalted: and some of them hath he sanctified, and set near himself: and some of them hath he cursed and brought low, end turned them from their station."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quasi lutum figuli in manus ipsius plasmare illud et disponere"
      en: "As the potter's clay is in his hand, to fashion and order it:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "omnes viae eius secundum dispositionem eius sic homo in manu illius qui se fecit reddet illis secundum iudicium suum"
      en: "All his ways are according to his ordering: so man is in the hand of him that made him, and he will render to him according to his judgment."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "contra malum bonum est et contra mortem vita sic et contra virum iustum peccator et sic intuere in omnia opera Altissimi duo duo unum contra unum"
      en: "Good is set against evil, and life against death: so also is the sinner against a just man. And so look upon all the works of the most High. Two and two, and one against another."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et ego novissimus vigilavi et quasi qui colligit acinos post vindemiatores"
      en: "And I awaked last of all, and as one that gathereth after the grapegatherers."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "in benedictione Dei et ipse speravi et quasi qui vindemiat replevi torcular"
      en: "In the blessing of God I also have hoped: and as one that gathereth grapes, have I filled the winepress."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "respicite quoniam non soli mihi laboravi sed omnibus exquirentibus disciplinam"
      en: "See that I have not laboured for myself only, but for all that seek discipline."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "audite me magnati et omnes populi et rectores ecclesiae auribus percipite"
      en: "Hear me, ye great men, and all ye people, and hearken with your ears, ye rulers of the church."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "filio et mulieri fratri et amico non des potestatem super te in vita tua non dederis alio possessionem tuam ne forte paeniteat te et depreceris pro illis"
      en: "Give not to son or wife, brother or friend, power over thee while thou livest; and give not thy estate to another, lest then repent, and thou entreat for the same."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "dum adhuc superes et adspiras non inmutabit te omnis caro"
      en: "As long as thou livest, and hast breath in thee, let no man change thee."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "melius est enim ut filii tui te rogent quam te respicere in manus filiorum tuorum"
      en: "For it is better that thy children should ask of thee, than that thou look toward the hands of thy children."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "in omnibus operibus tuis praecellens esto"
      en: "In all thy works keep the pre-eminence."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ne dederis maculam in gloriam tuam in die consummationis dierum vitae tuae et in tempore exitus tui distribue hereditatem tuam"
      en: "Let no stain sully thy glory. In the time when thou shalt end the days of thy life, and in the time of thy decease, distribute thy inheritance."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "cibaria et virga et onus asino panis et disciplina et opus servo"
      en: "Fodder, and a wand, and a burden are for an ass: bread, and correction, and work for a slave."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "operatur in disciplina et quaerit requiescere laxa manus illi et quaerit libertatem"
      en: "He worketh under correction, and seeketh to rest: let his hands be idle, and he seeketh liberty."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "iugum et lorum curvant collum durum et servum inclinant operationes adsiduae"
      en: "The yoke and the thong bend a stiff neck, and continual labours bow a slave."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "servo malivolo tortura et conpedes mitte illum in operatione ne vacet"
      en: "Torture and fetters are for a malicious slave: send him to work, that he be not idle:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "multam enim malitiam docuit otiositas"
      en: "For idleness hath taught much evil."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "in opera constitue eum sic enim condecet illi quod si non obaudierit grava illum conpedibus et non amplifices super omnem carnem verum sine iudicio nihil facias grave"
      en: "Set him to work: for so it is fit for him. And if he be not obedient, bring him down with fetters, but be not excessive towards any one: and do no grievous thing without judgment."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "si est tibi servus sit tibi quasi anima tua quasi fratrem sic eum tracta quoniam in sanguine animae parasti eum"
      en: "If thou have a faithful servant, let him be to thee as thy own soul: treat him as a brother: because in the blood of thy soul thou hast gotten him."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "si laeseris illum iniuste"
      en: "If thou hurt him unjustly, he will run away:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et extollens discesserit quem quaeres et in qua via quaeras illum nescis"
      en: "And if he rise up and depart, thou knowest not whom to ask, and in what way to seek him."
    status: { la: verified, en: verified }
