# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2cor
chapter: 13
verses:
  - n: 1
    text:
      la: "Ecce tertio hoc venio ad vos: in ore duorum vel trium testium stabit omne verbum."
      en: "Behold, this is the third time I am coming to you: In the mouth of two or three witnesses shall every word stand."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Praedixi, et praedico, ut praesens, et nunc absens iis qui ante peccaverunt, et ceteris omnibus, quoniam si venero iterum, non parcam."
      en: "I have told before, and foretell, as present, and now absent, to them that sinned before, and to all the rest, that if I come again, I will not spare."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "An experimentum quaeritis ejus, qui in me loquitur Christus, qui in vobis non infirmatur, sed potens est in vobis?"
      en: "Do you seek a proof of Christ that speaketh in me, who towards you is not weak, but is mighty in you?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nam etsi crucifixus est ex infirmitate: sed vivit ex virtute Dei. Nam et nos infirmi sumus in illo: sed vivemus cum eo ex virtute Dei in vobis."
      en: "For although he was crucified through weakness, yet he liveth by the power of God. For we also are weak in him: but we shall live with him by the power of God towards you."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Vosmetipsos tentate si estis in fide: ipsi vos probate. An non cognoscitis vosmetipsos quia Christus Jesus in vobis est? nisi forte reprobi estis."
      en: "Try your own selves if you be in the faith; prove ye yourselves. Know you not your own selves, that Christ Jesus is in you, unless perhaps you be reprobates?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Spero autem quod cognoscetis, quia nos non sumus reprobi."
      en: "But I trust that you shall know that we are not reprobates."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Oramus autem Deum ut nihil mali faciatis, non ut nos probati appareamus, sed ut vos quod bonum est faciatis: nos autem ut reprobi simus."
      en: "Now we pray God, that you may do no evil, not that we may appear approved, but that you may do that which is good, and that we may be as reprobates."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Non enim possumus aliquid adversus veritatem, sed pro veritate."
      en: "For we can do nothing against the truth; but for the truth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Gaudemus enim, quoniam nos infirmi sumus, vos autem potentes estis. Hoc et oramus, vestram consummationem."
      en: "For we rejoice that we are weak, and you are strong. This also we pray for, your perfection."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ideo haec absens scribo, ut non praesens durius agam secundum potestatem, quam Dominus dedit mihi in aedificationem, et non in destructionem."
      en: "Therefore I write these things, being absent, that, being present, I may not deal more severely, according to the power which the Lord hath given me unto edification, and not unto destruction."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "De cetero, fratres, gaudete, perfecti estote, exhortamini, idem sapite, pacem habete, et Deus pacis et dilectionis erit vobiscum."
      en: "For the rest, brethren, rejoice, be perfect, take exhortation, be of one mind, have peace; and the God of peace and of love shall be with you."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Salutate invicem in osculo sancto. Salutant vos omnes sancti."
      en: "Salute one another with a holy kiss. All the saints salute you."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Gratia Domini nostri Jesu Christi, et caritas Dei, et communicatio Sancti Spiritus sit cum omnibus vobis. Amen."
      en: "The grace of our Lord Jesus Christ, and the charity of God, and the communication of the Holy Ghost be with you all. Amen."
    status: { la: verified, en: verified }
