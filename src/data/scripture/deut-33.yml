# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: deut
chapter: 33
verses:
  - n: 1
    text:
      la: "haec est benedictio qua benedixit Moses homo Dei filiis Israhel ante mortem suam"
      en: "This is the blessing, wherewith the man of God Moses blessed the children of Israel, before his death."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ait Dominus de Sina venit et de Seir ortus est nobis apparuit de monte Pharan et cum eo sanctorum milia in dextera eius ignea lex"
      en: "And he said: The Lord came from Sinai, and from Seir he rose up to us: he hath appeared from mount Pharan, and with him thousands of saints. In his right hand a fiery law."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dilexit populos omnes sancti in manu illius sunt et qui adpropinquant pedibus eius accipient de doctrina illius"
      en: "He hath loved the people, all the saints are in his hand: and they that approach to his feet, shall receive of his doctrine."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "legem praecepit nobis Moses hereditatem multitudinis Iacob"
      en: "Moses commanded us a law, the inheritance of the multitude of Jacob."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "erit apud rectissimum rex congregatis principibus populi cum tribubus Israhel"
      en: "He shall be king with the most right, the princes of the people being assembled with the tribes of Israel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "vivat Ruben et non moriatur et sit parvus in numero"
      en: "Let Ruben live, and not die, and be he small in number."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "haec est Iudae benedictio audi Domine vocem Iudae et ad populum suum introduc eum manus eius pugnabunt pro eo et adiutor illius contra adversarios eius erit"
      en: "This is the blessing of Juda. Hear, O Lord, the voice of Juda, and bring him in unto his people : his hands shall fight for him, and he shall be his helper against his enemies."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Levi quoque ait perfectio tua et doctrina tua viro sancto tuo quem probasti in Temptatione et iudicasti ad aquas Contradictionis"
      en: "To Levi also he said: Thy perfection, and thy doctrine be to thy holy man, whom thou hast proved in the temptation, and judged at the waters of contradiction :"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "qui dixit patri suo et matri suae nescio vos et fratribus suis ignoro illos et nescierunt filios suos hii custodierunt eloquium tuum et pactum tuum servaverunt"
      en: "Who hath said to his father, and to his mother: I do not know you; and to his brethren: I know you not: and their own children they have not known. These have kept thy word, and observed thy covenant,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "iudicia tua o Iacob et legem tuam o Israhel ponent thymiama in furore tuo et holocaustum super altare tuum"
      en: "Thy judgments, O Jacob, and thy law, O Israel: they shall put incense in thy wrath and holocaust upon thy altar."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "benedic Domine fortitudini eius et opera manuum illius suscipe percute dorsa inimicorum eius et qui oderunt eum non consurgant"
      en: "Bless, O Lord, his strength, and receive the works of his hands. Strike the backs of his enemies, and let not them that hate him rise."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et Beniamin ait amantissimus Domini habitabit confidenter in eo quasi in thalamo tota die morabitur et inter umeros illius requiescet"
      en: "And to Benjamin he said: The best beloved of the Lord shall dwell confidently in him: as in a bride chamber shall he abide all the day long, and between his shoulders shall be rest."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ioseph quoque ait de benedictione Domini terra eius de pomis caeli et rore atque abysso subiacente"
      en: "To Joseph also he said: Of the blessing of the Lord be his land, of the fruits of heaven, and of the dew, and of the deep that lieth beneath."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "de pomis fructuum solis ac lunae"
      en: "Of the fruits brought forth by the sun and by the moon."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "de vertice antiquorum montium de pomis collium aeternorum"
      en: "Of the tops of the ancient mountains, of the fruits of the everlasting hills:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et de frugibus terrae et plenitudine eius benedictio illius qui apparuit in rubo veniat super caput Ioseph et super verticem nazarei inter fratres suos"
      en: "And of the fruits of the earth, and of the fulness thereof. The blessing of him that appeared in the bush, come upon the head of Joseph, and upon the crown of the Nazarite among his brethren."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quasi primogeniti tauri pulchritudo eius cornua rinocerotis cornua illius in ipsis ventilabit gentes usque ad terminos terrae hae sunt multitudines Ephraim et haec milia Manasse"
      en: "His beauty as of the firstling of a bullock, his horns as the horns of a rhinoceros: with them shall he push the nations even to the ends of the earth These are the multitudes of Ephraim and these the thousands of Manasses."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et Zabulon ait laetare Zabulon in exitu tuo et Isachar in tabernaculis tuis"
      en: "And to Zabulon he said: Rejoice, O Zabulon, in thy going out; and Issachar in thy tabernacles."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "populos ad montem vocabunt ibi immolabunt victimas iustitiae qui inundationem maris quasi lac sugent et thesauros absconditos harenarum"
      en: "They shall call the people to the mountain: there shall they sacrifice the victims of justice. Who shall suck as milk the abundance of the sea, and the hidden treasures of the sands."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et Gad ait benedictus in latitudine Gad quasi leo requievit cepitque brachium et verticem"
      en: "And to Gad he said: Blessed be Gad in his breadth: he hath rested as a lion, and hath seized upon the arm and the top of the head."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et vidit principatum suum quod in parte sua doctor esset repositus qui fuit cum principibus populi et fecit iustitias Domini et iudicium suum cum Israhel"
      en: "And he saw his pre-eminence, that in his portion the teacher was laid up: who was with the princes of the people, and did the justices of the Lord, and his judgment with Israel."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Dan quoque ait Dan catulus leonis fluet largiter de Basan"
      en: "To Dan also he said: Dan is a young lion, he shall flow plentifully from Basan."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et Nepthalim dixit Nepthalim abundantia perfruetur et plenus erit benedictione Domini mare et meridiem possidebit"
      en: "And to Nephtali he said: Nephtali shall enjoy abundance, and shall be full of the blessings of the Lord: he shall possess the sea and the south."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Aser quoque ait benedictus in filiis Aser sit placens fratribus suis tinguat in oleo pedem suum"
      en: "To Aser also he said: Let Aser be blessed with children, let him be acceptable to his brethren, and let him dip his foot in oil."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ferrum et aes calciamentum eius sicut dies iuventutis tuae ita et senectus tua"
      en: "His shoe shall be iron and brass. As the days of thy youth, so also shall thy old age be."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "non est alius ut Deus rectissimi ascensor caeli auxiliator tuus magnificentia eius discurrunt nubes"
      en: "There is no other God like the God of the rightest: he that is mounted upon the heaven is thy helper. By his magnificence the clouds run hither and thither."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "habitaculum eius sursum et subter brachia sempiterna eiciet a facie tua inimicum dicetque conterere"
      en: "His dwelling is above, and underneath are the everlasting arms: he shall cast out the enemy from before thee, and shall say: Be thou brought to nought."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "habitabit Israhel confidenter et solus oculus Iacob in terra frumenti et vini caelique caligabunt rore"
      en: "Israel shall dwell in safety, and alone. The eye of Jacob in a land of corn and wine, and the heavens shall be misty with dew."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "beatus tu Israhel quis similis tui popule qui salvaris in Domino scutum auxilii tui et gladius gloriae tuae negabunt te inimici tui et tu eorum colla calcabis"
      en: "Blessed are thou, Israel: who is like to thee, O people, that art saved by the Lord? the shield of thy help, and the sword of thy glory: thy enemies shall deny thee, and thou shalt tread upon their necks."
    status: { la: verified, en: verified }
