# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: apoc
chapter: 11
verses:
  - n: 1
    text:
      la: "et datus est mihi calamus similis virgae dicens surge et metire templum Dei et altare et adorantes in eo"
      en: "And there was given me a reed like unto a rod: and it was said to me: Arise, and measure the temple of God, and the altar and them that adore therein."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "atrium autem quod est foris templum eice foras et ne metieris eum quoniam datum est gentibus et civitatem sanctam calcabunt mensibus quadraginta duobus"
      en: "But the court, which is without the temple, cast out, and measure it not: because it is given unto the Gentiles, and the holy city they shall tread under foot two and forty months:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dabo duobus testibus meis et prophetabunt diebus mille ducentis sexaginta amicti saccos"
      en: "And I will give unto my two witnesses, and they shall prophesy a thousand two hundred sixty days, clothed in sackcloth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "hii sunt duo olivae et duo candelabra in conspectu Domini terrae stantes"
      en: "These are the two olive trees, and the two candlesticks, that stand before the Lord of the earth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et si quis eos voluerit nocere ignis exiet de ore illorum et devorabit inimicos eorum et si quis voluerit eos laedere sic oportet eum occidi"
      en: "And if any man will hurt them, fire shall come out of their mouths, and shall devour their enemies. And if any man will hurt them, in this manner must he be slain."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "hii habent potestatem cludendi caelum ne pluat diebus prophetiae ipsorum et potestatem habent super aquas convertendi eas in sanguinem et percutere terram omni plaga quotienscumque voluerint"
      en: "These have power to shut heaven, that it rain not in the days of their prophecy: and they have power over waters to turn them into blood, and to strike the earth with all plagues as often as they will."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et cum finierint testimonium suum bestia quae ascendit de abysso faciet adversus illos bellum et vincet eos et occidet illos"
      en: "And when they shall have finished their testimony, the beast, that ascendeth out of the abyss, shall make war against them, and shall overcome them, and kill them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et corpora eorum in plateis civitatis magnae quae vocatur spiritaliter Sodoma et Aegyptus ubi et Dominus eorum crucifixus est"
      en: "And their bodies shall lie in the streets of the great city, which is called spiritually, Sodom and Egypt, where their Lord also was crucified."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et videbunt de populis et tribubus et linguis et gentibus corpora eorum per tres dies et dimidium et corpora eorum non sinunt poni in monumentis"
      en: "And they of the tribes, and peoples, and tongues, and nations, shall see their bodies for three days and a half: and they shall not suffer their bodies to be laid in sepulchres."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et inhabitantes terram gaudebunt super illis et iucundabuntur et munera mittent invicem quoniam hii duo prophetae cruciaverunt eos qui inhabitant super terram"
      en: "And they that dwell upon the earth shall rejoice over them, and make merry: and shall send gifts one to another, because these two prophets tormented them that dwelt upon the earth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et post dies tres et dimidium spiritus vitae a Deo intravit in eos et steterunt super pedes suos et timor magnus cecidit super eos qui viderunt eos"
      en: "And after three days and a half, the spirit of life from God entered into them. And they stood upon their feet, and great fear fell upon them that saw them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et audierunt vocem magnam de caelo dicentem illis ascendite huc et ascenderunt in caelum in nube et viderunt illos inimici eorum"
      en: "And they heard a great voice from heaven, saying to them: Come up hither. And they went up to heaven in a cloud: and their enemies saw them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et in illa hora factus est terraemotus magnus et decima pars civitatis cecidit et occisi sunt in terraemotu nomina hominum septem milia et reliqui in timore sunt missi et dederunt gloriam Deo caeli"
      en: "And at that hour there was made a great earthquake, and the tenth part of the city fell: and there were slain in the earthquake names of men seven thousand: and the rest were cast into a fear, and gave glory to the God of heaven."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "vae secundum abiit ecce vae tertium veniet cito"
      en: "The second woe is past: and behold the third woe will come quickly."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et septimus angelus tuba cecinit et factae sunt voces magnae in caelo dicentes factum est regnum huius mundi Domini nostri et Christi eius et regnabit in saecula saeculorum"
      en: "And the seventh angel sounded the trumpet: and there were great voices in heaven, saying: The kingdom of this world is become our Lord's and his Christ's, and he shall reign for ever and ever. Amen."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et viginti quattuor seniores qui in conspectu Dei sedent in sedibus suis ceciderunt in facies suas et adoraverunt Deum"
      en: "And the four and twenty ancients, who sit on their seats in the sight of God, fell on their faces and adored God, saying:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dicentes gratias agimus tibi Domine Deus omnipotens qui es et qui eras quia accepisti virtutem tuam magnam et regnasti"
      en: "We give thee thanks, O Lord God Almighty, who art, and who wast, and who art to come: because thou hast taken to thee thy great power, and thou hast reigned."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et iratae sunt gentes et advenit ira tua et tempus mortuorum iudicari et reddere mercedem servis tuis prophetis et sanctis et timentibus nomen tuum pusillis et magnis et exterminandi eos qui corruperunt terram"
      en: "And the nations were angry, and thy wrath is come, and the time of the dead, that they should be judged, and that thou shouldest render reward to thy servants the prophets and the saints, and to them that fear thy name, little and great, and shouldest destroy them who have corrupted the earth."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et apertum est templum Dei in caelo et visa est arca testamenti eius in templo eius et facta sunt fulgora et voces et terraemotus et grando magna"
      en: "And the temple of God was opened in heaven: and the ark of his testament was seen in his temple, and there were lightnings, and voices, and an earthquake, and great hail."
    status: { la: verified, en: verified }
