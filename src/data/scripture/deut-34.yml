# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: deut
chapter: 34
verses:
  - n: 1
    text:
      la: "Ascendit ergo Moyses de campestribus Moab super montem Nebo, in verticem Phasga contra Jericho: ostenditque ei Dominus omnem terram Galaad usque Dan,"
      en: "Then Moses went up from the plains of Moab upon mount Nebo, to the top of Phasga over against Jericho: and the Lord shewed him all the land of Galaad as far as Dan."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et universum Nephthali, terramque Ephraim et Manasse, et omnem terram Juda usque ad mare novissimum,"
      en: "And all Nephtali, and the land of Ephraim and Manasses, and all the land of Juda unto the furthermost sea,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et australem partem, et latitudinem campi Jericho civitatis palmarum usque Segor."
      en: "And the south part, and the breadth of the plain of Jericho the city of palm trees as far as Segor."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dixitque Dominus ad eum: Haec est terra, pro qua juravi Abraham, Isaac, et Jacob, dicens: Semini tuo dabo eam. Vidisti eam oculis tuis, et non transibis ad illam."
      en: "And the Lord said to him: This is the land, for which I swore to Abraham, Isaac, and Jacob, saying: I will give it to thy seed. Thou hast seen it with thy eyes, and shalt not pass over to it."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Mortuusque est ibi Moyses servus Domini, in terra Moab, jubente Domino:"
      en: "And Moses the servant of the Lord died there, in the land of Moab, by the commandment of the Lord:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et sepelivit eum in valle terrae Moab contra Phogor: et non cognovit homo sepulchrum ejus usque in praesentem diem."
      en: "And he buried him in the valley of the land of Moab over against Phogor: and no man hath known of his sepulchre until this present day."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Moyses centum et viginti annorum erat quando mortuus est: non caligavit oculus ejus, nec dentes illius moti sunt."
      en: "Moses was a hundred and twenty years old when he died: his eye was not dim, neither were his teeth moved."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Fleveruntque eum filii Israel in campestribus Moab triginta diebus: et completi sunt dies planctus lugentium Moysen."
      en: "And the children of Israel mourned for him in the plains of Moab thirty days: and the days of their mourning in which they mourned for Moses were ended."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Josue vero filius Nun repletus est spiritu sapientiae, quia Moyses posuit super eum manus suas. Et obedierunt ei filii Israel, feceruntque sicut praecepit Dominus Moysi."
      en: "And Josue the son of Nun was filled with the spirit of wisdom, because Moses had laid his hands upon him. And the children of Israel obeyed him, and did as the Lord commanded Moses."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et non surrexit ultra propheta in Israel sicut Moyses, quem nosset Dominus facie ad faciem,"
      en: "And there arose no more a prophet in Israel like unto Moses, whom the Lord knew face to face,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in omnibus signis atque portentis, quae misit per eum, ut faceret in terra Aegypti Pharaoni, et omnibus servis ejus, universaeque terrae illius,"
      en: "In all the signs and wonders, which he sent by him, to do in the land of Egypt to Pharao, and to all his servants, and to his whole land,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et cunctam manum robustam, magnaque mirabilia, quae fecit Moyses coram universo Israel."
      en: "And all the mighty hand, and great miracles, which Moses did before all Israel."
    status: { la: verified, en: verified }
