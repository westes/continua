# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: deut
chapter: 34
verses:
  - n: 1
    text:
      la: "ascendit ergo Moses de campestribus Moab super montem Nebo in verticem Phasga contra Hiericho ostenditque ei Dominus omnem terram Galaad usque Dan"
      en: "Then Moses went up from the plains of Moab upon mount Nebo, to the top of Phasga over against Jericho: and the Lord shewed him all the land of Galaad as far as Dan."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et universum Nepthalim terramque Ephraim et Manasse et omnem terram usque ad mare Novissimum"
      en: "And all Nephtali, and the land of Ephraim and Manasses, and all the land of Juda unto the furthermost sea,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et australem partem et latitudinem campi Hiericho civitatis Palmarum usque Segor"
      en: "And the south part, and the breadth of the plain of Jericho the city of palm trees as far as Segor."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dixitque Dominus ad eum haec est terra pro qua iuravi Abraham Isaac et Iacob dicens semini tuo dabo eam vidisti eam oculis tuis et non transibis ad illam"
      en: "And the Lord said to him: This is the land, for which I swore to Abraham, Isaac, and Jacob, saying: I will give it to thy seed. Thou hast seen it with thy eyes, and shalt not pass over to it."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "mortuusque est ibi Moses servus Domini in terra Moab iubente Domino"
      en: "And Moses the servant of the Lord died there, in the land of Moab, by the commandment of the Lord:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et sepelivit eum in valle terrae Moab contra Phogor et non cognovit homo sepulchrum eius usque in praesentem diem"
      en: "And he buried him in the valley of the land of Moab over against Phogor: and no man hath known of his sepulchre until this present day."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Moses centum et viginti annorum erat quando mortuus est non caligavit oculus eius nec dentes illius moti sunt"
      en: "Moses was a hundred and twenty years old when he died: his eye was not dim, neither were his teeth moved."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "fleveruntque eum filii Israhel in campestribus Moab triginta diebus et conpleti sunt dies planctus lugentium Mosen"
      en: "And the children of Israel mourned for him in the plains of Moab thirty days: and the days of their mourning in which they mourned for Moses were ended."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Iosue vero filius Nun repletus est spiritu sapientiae quia Moses posuit super eum manus suas et oboedierunt ei filii Israhel feceruntque sicut praecepit Dominus Mosi"
      en: "And Josue the son of Nun was filled with the spirit of wisdom, because Moses had laid his hands upon him. And the children of Israel obeyed him, and did as the Lord commanded Moses."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et non surrexit propheta ultra in Israhel sicut Moses quem nosset Dominus facie ad faciem"
      en: "And there arose no more a prophet in Israel like unto Moses, whom the Lord knew face to face,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in omnibus signis atque portentis quae misit per eum ut faceret in terra Aegypti Pharaoni et omnibus servis eius universaeque terrae illius"
      en: "In all the signs and wonders, which he sent by him, to do in the land of Egypt to Pharao, and to all his servants, and to his whole land,"
    status: { la: verified, en: verified }
