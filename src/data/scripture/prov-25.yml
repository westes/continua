# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 25
verses:
  - n: 1
    text:
      la: "Hae quoque parabolae Salomonis, quas transtulerunt viri Ezechiae regis Juda."
      en: "These are also parables of Solomon, which the men of Ezechias king of Juda copied out."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Gloria Dei est celare verbum, et gloria regum investigare sermonem."
      en: "It is the glory of God to conceal the word, and the glory of kings to search out the speech."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Caelum sursum, et terra deorsum, et cor regum inscrutabile."
      en: "The heaven above, and the earth beneath, and the heart of kings is unsearchable."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Aufer rubiginem de argento, et egredietur vas purissimum."
      en: "Take away the rust from silver, and there shall come forth a most pure vessel:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Aufer impietatem de vultu regis, et firmabitur justitia thronus ejus."
      en: "Take away wickedness from the face of the king, and his throne shall be established with justice."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ne gloriosus appareas coram rege, et in loco magnorum ne steteris."
      en: "Appear not glorious before the king, and stand not in the place of great men."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Melius est enim ut dicatur tibi: Ascende huc, quam ut humilieris coram principe."
      en: "For it is better that it should be said to thee: Come up hither; than that thou shouldst be humbled before the prince."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quae viderunt oculi tui ne proferas in jurgio cito, ne postea emendare non possis, cum dehonestaveris amicum tuum."
      en: "The things which thy eyes have seen, utter not hastily in a quarrel: lest afterward thou mayst not be able to make amends, when thou hast dishonoured thy friend."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Causam tuam tracta cum amico tuo, et secretum extraneo ne reveles:"
      en: "Treat thy cause with thy friend, and discover not the secret to a stranger:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ne forte insultet tibi cum audierit, et exprobrare non cesset. Gratia et amicitia liberant: quas tibi serva, ne exprobrabilis fias."
      en: "Lest he insult over thee, when he hath heard it, and cease not to upbraid thee. Grace and friendship deliver a man: keep these for thyself, lest thou fall under reproach."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Mala aurea in lectis argenteis, qui loquitur verbum in tempore suo."
      en: "To speak a word in due time, is like apples of gold on beds of silver."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Inauris aurea et margaritum fulgens qui arguit sapientem et aurem obedientem."
      en: "As an earring of gold and a bright pearl, so is he that reproveth the wise, and the obedient ear."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sicut frigus nivis in die messis, ita legatus fidelis ei qui misit eum: animam ipsius requiescere facit."
      en: "As the cold of snow in the time of harvest, so is a faithful messenger to him that sent him, for he refresheth his soul."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Nubes, et ventus, et pluviae non sequentes, vir gloriosus et promissa non complens."
      en: "As clouds, and wind, when no rain followeth, so is the man that boasteth, and doth not fulfill his promises."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Patientia lenietur princeps, et lingua mollis confringet duritiam."
      en: "By patience a prince shall be appeased, and a soft tongue shall break hardness."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Mel invenisti comede quod sufficit tibi, ne fore satiatus evomas illud."
      en: "Thou hast found honey, eat what is sufficient for thee, lest being glutted therewith thou vomit it up."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Subtrahe pedem tuum de domo proximi tui, nequando satiatus oderit te."
      en: "Withdraw thy foot from the house of thy neighbour, lest having his fill he hate thee."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Jaculum, et gladius, et sagitta acuta, homo qui loquitur contra proximum suum falsum testimonium."
      en: "A man that beareth false witness against his neighbour, is like a dart and a sword and a sharp arrow."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dens putridus, et pes lassus, qui sperat super infideli in die angustiae,"
      en: "To trust to an unfaithful man in the time of trouble, is like a rotten tooth, and weary foot,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et amittit pallium in die frigoris. Acetum in nitro, qui cantat carmina cordi pessimo. Sicut tinea vestimento, et vermis ligno, ita tristitia viri nocet cordi."
      en: "And one that looseth his garment in cold weather. As vinegar upon nitre, so is he that singeth songs to a very evil heart. As a moth doth by a garment, and a worm by the wood: so the sadness of a man consumeth the heart."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Si esurierit inimicus tuus, ciba illum; si sitierit, da ei aquam bibere:"
      en: "If thy enemy be hungry, give him to eat: if he thirst, give him water to drink:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "prunas enim congregabis super caput ejus, et Dominus reddet tibi."
      en: "For thou shalt heap hot coals upon his head, and the Lord will reward thee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ventus aquilo dissipat pluvias, et facies tristis linguam detrahentem."
      en: "The north wind driveth away rain, as doth a sad countenance a backbiting tongue."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Melius est sedere in angulo domatis, quam cum muliere litigiosa et in domo communi."
      en: "It is better to sit in a corner of the housetop, than with a brawling woman, and in a common house."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Aqua frigida animae sitienti, et nuntius bonus de terra longinqua."
      en: "As cold water to a thirsty soul, so is good tidings from a far country."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Fons turbatus pede et vena corrupta, justus cadens coram impio."
      en: "A just man falling down before the wicked, is as a fountain troubled with the foot, and a corrupted spring."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Sicut qui mel multum comedit non est ei bonum, sic qui scrutator est majestatis opprimetur a gloria."
      en: "As it is not good for a man to eat much honey, so he that is a searcher of majesty, shall be overwhelmed by glory."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Sicut urbs patens et absque murorum ambitu, ita vir qui non potest in loquendo cohibere spiritum suum."
      en: "As a city that lieth open and is not compassed with walls, so is a man that cannot refrain his own spirit in speaking."
    status: { la: verified, en: verified }
