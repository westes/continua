# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 22
verses:
  - n: 1
    text:
      la: "Respondens autem Eliphaz Themanites, dixit:"
      en: "Then Eliphaz the Themanite answered, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Numquid Deo potest comparari homo, etiam cum perfectae fuerit scientiae?"
      en: "Can man be compared with God, even though he were of perfect knowledge?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Qui prodest Deo, si justus fueris? aut quid ei confers, si immaculata fuerit via tua?"
      en: "What doth it profit God if thou be just? or what dost thou give him if thy way be unspotted?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Numquid timens arguet te, et veniet tecum in judicium?"
      en: "Shall he reprove thee for fear, and come with thee into judgment:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et non propter malitiam tuam plurimam, et infinitas iniquitates tuas?"
      en: "And not for thy manifold wickedness, and thy infinite iniquities?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Abstulisti enim pignus fratrum tuorum sine causa, et nudos spoliasti vestibus."
      en: "For thou hast taken away the pledge of thy brethren without cause, and stripped the naked of their clothing."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Aquam lasso non dedisti, et esurienti subtraxisti panem."
      en: "Thou hast not given water to the weary, thou hast withdrawn bread from the hungry."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "In fortitudine brachii tui possidebas terram, et potentissimus obtinebas eam."
      en: "In the strength of thy arm thou didst possess the land, and being the most mighty thou holdest it."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Viduas dimisisti vacuas, et lacertos pupillorum comminuisti."
      en: "Thou hast sent widows away empty, and the arms of the fatherless thou hast broken in pieces."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Propterea circumdatus es laqueis, et conturbat te formido subita."
      en: "Therefore art thou surrounded with snares, and sudden fear troubleth thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et putabas te tenebras non visurum, et impetu aquarum inundantium non oppressum iri."
      en: "And didst thou think that thou shouldst not see darkness, and that thou shouldst not be covered with the violence of overflowing waters?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "An non cogitas quod Deus excelsior caelo sit, et super stellarum verticem sublimetur?"
      en: "Dost not thou think that God is higher than heaven, and is elevated above the height of the stars?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et dicis: Quid enim novit Deus? et quasi per caliginem judicat."
      en: "And thou sayst: What doth God know? and he judgeth as it were through a mist."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Nubes latibulum ejus, nec nostra considerat, et circa cardines caeli perambulat."
      en: "The clouds are his covert, and he doth not consider our things, and he walketh about the poles of heaven."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Numquid semitam saeculorum custodire cupis, quam calcaverunt viri iniqui,"
      en: "Dost thou desire to keep the path of ages, which wicked men have trodden?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "qui sublati sunt ante tempus suum, et fluvius subvertit fundamentum eorum?"
      en: "Who were taken away before their time, and a flood hath overthrown their foundation."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qui dicebant Deo: Recede a nobis: et quasi nihil posset facere Omnipotens, aestimabant eum,"
      en: "Who said to God: Depart from us: and looked upon the Almighty as if he could do nothing:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cum ille implesset domos eorum bonis? quorum sententia procul sit a me!"
      en: "Whereas he had filled their houses with good things: whose way of thinking be far from me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Videbunt justi, et laetabuntur, et innocens subsannabit eos:"
      en: "The just shall see, and shall rejoice, and the innocent shall laugh them to scorn."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "nonne succisa est erectio eorum? et reliquias eorum devoravit ignis?"
      en: "Is not their exaltation cut down, and hath not fire devoured the remnants of them?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Acquiesce igitur ei, et habeto pacem, et per haec habebis fructus optimos."
      en: "Submit thyself then to him, and be at peace: and thereby thou shalt have the best fruits."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Suscipe ex ore illius legem, et pone sermones ejus in corde tuo."
      en: "Receive the law of his mouth, and lay up his words in thy heart."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Si reversus fueris ad Omnipotentem, aedificaberis, et longe facies iniquitatem a tabernaculo tuo."
      en: "If thou wilt return to the Almighty, thou shalt be built up, and shalt put away iniquity far from thy tabernacle."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Dabit pro terra silicem, et pro silice torrentes aureos."
      en: "He shall give for earth flint, and for flint torrents of gold."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Eritque Omnipotens contra hostes tuos, et argentum coacervabitur tibi."
      en: "And the Almighty shall be against thy enemies, and silver shall be heaped together for thee."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Tunc super Omnipotentem deliciis afflues, et elevabis ad Deum faciem tuam."
      en: "Then shalt thou abound in delights in the Almighty, and shalt lift up thy face to God."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Rogabis eum, et exaudiet te, et vota tua reddes."
      en: "Thou shalt pray to him, and he will hear thee, and thou shalt pay vows."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Decernes rem, et veniet tibi, et in viis tuis splendebit lumen."
      en: "Thou shalt decree a thing, and it shall come to thee, and light shall shine in thy ways."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Qui enim humiliatus fuerit, erit in gloria, et qui inclinaverit oculos, ipse salvabitur."
      en: "For he that hath been humbled, shall be in glory: and he that shall bow down his eyes, he shall be saved."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Salvabitur innocens: salvabitur autem in munditia manuum suarum."
      en: "The innocent shall be saved, and he shall be saved by the cleanness of his hands."
    status: { la: verified, en: verified }
