# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: prov
chapter: 8
verses:
  - n: 1
    text:
      la: "numquid non sapientia clamitat et prudentia dat vocem suam"
      en: "Doth not wisdom cry aloud, and prudence put forth her voice ?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in summis excelsisque verticibus super viam in mediis semitis stans"
      en: "Standing in the top of the highest places by the way, in the midst of the paths."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "iuxta portas civitatis in ipsis foribus loquitur dicens"
      en: "Beside the gates of the city, in the very doors she speaketh, saying:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "o viri ad vos clamito et vox mea ad filios hominum"
      en: "O ye men, to you I call, and my voice is to the sons of men."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "intellegite parvuli astutiam et insipientes animadvertite"
      en: "O little ones, understand subtilty, and ye unwise, take notice."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "audite quoniam de rebus magnis locutura sum et aperientur labia mea ut recta praedicent"
      en: "Hear, for I will speak of great things: and my lips shall be opened to preach right things."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "veritatem meditabitur guttur meum et labia mea detestabuntur impium"
      en: "My mouth shall meditate truth, and my lips shall hate wickedness."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "iusti sunt omnes sermones mei non est in eis pravum quid neque perversum"
      en: "All my words are just, there is nothing wicked nor perverse in them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "recti sunt intellegentibus et aequi invenientibus scientiam"
      en: "They are right to them that understand, and just to them that find knowledge."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "accipite disciplinam meam et non pecuniam doctrinam magis quam aurum eligite"
      en: "Receive my instruction, and not money: choose knowledge rather than gold."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "melior est enim sapientia cunctis pretiosissimis et omne desiderabile ei non potest conparari"
      en: "For wisdom is better than all the most precious things: and whatsoever may be desired cannot be compared to it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ego sapientia habito in consilio et eruditis intersum cogitationibus"
      en: "I wisdom dwell in counsel, and am present in learned thoughts."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "timor Domini odit malum arrogantiam et superbiam et viam pravam et os bilingue detestor"
      en: "The fear of the Lord hateth evil: I hate arrogance, and pride, and every wicked way, and a mouth with a double tongue."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "meum est consilium et aequitas mea prudentia mea est fortitudo"
      en: "Counsel and equity is mine, prudence is mine, strength is mine."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "per me reges regnant et legum conditores iusta decernunt"
      en: "By me kings reign, and lawgivers decree just things,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "per me principes imperant et potentes decernunt iustitiam"
      en: "By me princes rule, and the mighty decree justice."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ego diligentes me diligo et qui mane vigilant ad me invenient me"
      en: "I love them that love me: and they that in the morning early watch for me, shall find me."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "mecum sunt divitiae et gloria opes superbae et iustitia"
      en: "With me are riches and glory, glorious riches and justice."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "melior est fructus meus auro et pretioso lapide et genimina mea argento electo"
      en: "For my fruit is better than gold and the precious stone, and my blossoms than choice silver."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "in viis iustitiae ambulo in medio semitarum iudicii"
      en: "I walk in the way of justice, in the midst of the paths of judgment,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ut ditem diligentes me et thesauros eorum repleam"
      en: "That I may enrich them that love me, and may fill their treasures."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Dominus possedit me initium viarum suarum antequam quicquam faceret a principio"
      en: "The Lord possessed me in the beginning of his ways, before he made any thing from the beginning."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ab aeterno ordita sum et ex antiquis antequam terra fieret"
      en: "I was set up from eternity, and of old before the earth was made."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "necdum erant abyssi et ego iam concepta eram necdum fontes aquarum eruperant"
      en: "The depths were not as yet, and I was already conceived. neither had the fountains of waters as yet sprung out:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "necdum montes gravi mole constiterant ante colles ego parturiebar"
      en: "The mountains with their huge bulk had not as yet been established: before the hills I was brought forth:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "adhuc terram non fecerat et flumina et cardines orbis terrae"
      en: "He had not yet made the earth, nor the rivers, nor the poles of the world."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "quando praeparabat caelos aderam quando certa lege et gyro vallabat abyssos"
      en: "When he prepared the heavens, I was present: when with a certain law and compass he enclosed the depths:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "quando aethera firmabat sursum et librabat fontes aquarum"
      en: "When he established the sky above, and poised the fountains of waters:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quando circumdabat mari terminum suum et legem ponebat aquis ne transirent fines suos quando adpendebat fundamenta terrae"
      en: "When he compassed the sea with its bounds, and set a law to the waters that they should not pass their limits: when be balanced the foundations of the earth;"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "cum eo eram cuncta conponens et delectabar per singulos dies ludens coram eo omni tempore"
      en: "I was with him forming all things: and was delighted every day, playing before him at all times;"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ludens in orbe terrarum et deliciae meae esse cum filiis hominum"
      en: "Playing in the world: and my delights were to be with the children of men."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "nunc ergo filii audite me beati qui custodiunt vias meas"
      en: "Now therefore, ye children, hear me: Blessed are they that keep my ways."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "audite disciplinam et estote sapientes et nolite abicere eam"
      en: "Hear instruction and be wise, and refuse it not."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "beatus homo qui audit me qui vigilat ad fores meas cotidie et observat ad postes ostii mei"
      en: "Blessed is the man that heareth me, and that watcheth daily at my gates, and waiteth at the posts of my doors."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "qui me invenerit inveniet vitam et hauriet salutem a Domino"
      en: "He that shall find me, shall find life, and shall have salvation from the Lord:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "qui autem in me peccaverit laedet animam suam omnes qui me oderunt diligunt mortem"
      en: "But he that shall sin against me, shall hurt his own soul. All that hate me love death."
    status: { la: verified, en: verified }
