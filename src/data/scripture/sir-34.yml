# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 34
verses:
  - n: 1
    text:
      la: "vana spes et mendacium insensato viro et somnia extollunt inprudentes"
      en: "The hopes of a man that is void of understanding are vain and deceitful: and dreams lift up fools."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quasi qui adprehendit umbram et persequitur ventum sic et qui adtendit ad visa mendacia"
      en: "The man that giveth heed to lying visions, is like to him that catcheth at a shadow, and followeth after the wind."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "hoc secundum hoc visio somniorum ante faciem hominis similitudo hominis"
      en: "The vision of dreams is the resemblance of one thing to another: as when a man's likeness is before the face of a man."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ab inmundo quid mundabitur et a mendace quid verum dicetur"
      en: "What can be made clean by the unclean? and what truth can come from that which is false?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "divinatio erroris et auguria mendacia et somnia malefacientium vanitas est"
      en: "Deceitful divinations and lying omens and the dreams of evildoers, are vanity:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et sicut parturientis cor tuum fantasiam patitur nisi ab Altissimo fuerit emissa visitatio ne dederis in illis cor tuum"
      en: "And the heart fancieth as that of a woman in travail: except it be a vision sent forth from the most High, set no thy heart upon them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "multos enim errare fecerunt somnia et exciderunt sperantes in illis"
      en: "For dreams have deceived many, and they have failed that put their trust in them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sine mendacio consummabitur verbum et sapientia in ore fidelis conplanabitur"
      en: "The word of the law shall be fulfilled without a lie, and wisdom shall be made plain in the mouth of the faithful."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "qui non temptatus est quid scit vir in multis expertus cogitavit multa et qui multa didicit enarrabit intellectum"
      en: "What doth he know, that hath not been tried? A man that hath much experience, shall think of many things: and he that hath learned many things, shall shew forth understanding."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui non est expertus pauca recognoscit qui autem in multis factus est multiplicabit malitiam"
      en: "He that hath no experience, knoweth little: and he that hath been experienced in many things, multiplieth prudence."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "[]"
      en: "He that hath not been tried, what manner of things doth he know? he that hath been surprised, shall abound with subtlety."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "multa vidi errando et plurimas verborum consuetudines"
      en: "I have seen many things by travelling, and many customs of things."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "aliquotiens usque ad mortem periclitatus sum horum causa et liberatus sum gratia Dei"
      en: "Sometimes I have been in danger of death for these things, and I have been delivered by the grace of God."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "spiritus timentium Deum quaeretur et in respectu illius benedicentur"
      en: "The spirit of those that fear God; is sought after, and by his regard shall be blessed."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "spes enim illorum in salvantem illos et oculi Dei in diligentes se"
      en: "For their hope is on him that saveth them, and the eyes of God are upon them that love him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "qui timet Dominum nihil trepidabit et non pavebit quoniam ipse est spes eius"
      en: "He that feareth the Lord shall tremble at nothing, and shall not be afraid for he is his hope."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "timentis Dominum beata est anima eius"
      en: "The soul of him that feareth the Lord is blessed."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ad quem respicit et quis est fortitudo eius"
      en: "To whom doth he look, and who in his strength?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "oculi Domini super timentes eum protector potentiae firmamentum virtutis tegimen ardoris et umbraculum meridiani"
      en: "The eyes of the Lord are upon them that fear him, he is their powerful protector, and strong stay, a defence from the heat, and a cover from the sun at noon,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et precatio offensionis et adiutorium casus exaltans animam et inluminans oculos dans sanitatem vitam et benedictionem"
      en: "A preservation from stumbling, and a help from falling; he raiseth up the soul, and enlighteneth the eyes, and giveth health, and life, and blessing."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "immolans ex iniquo oblatio est maculata et non sunt beneplacitae subsannationes iniustorum"
      en: "The offering of him that sacrificeth of a thing wrongfully gotten, is stained, and the mockeries of the unjust are not acceptable."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Dominus solus sustinentibus se in via veritatis et iustitiae"
      en: "The Lord is only for them that wait upon him in the way of truth and justice."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "dona iniquorum non probat Altissimus in oblationibus iniquorum nec in multitudine sacrificiorum eorum propitiabitur peccatis"
      en: "The most High approveth not the gifts of the wicked: neither hath he respect to the oblations of the unjust, nor will he be pacified for sine by the multitude of their sacrifices."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "qui offert sacrificium ex substantia pauperum quasi qui victimat filium in conspectu patris sui"
      en: "He that offereth sacrifice of the goods of the poor, is as one that sacrificeth the son in the presence of his father."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "panis egentium vita pauperis est qui defraudat illum homo sanguinis"
      en: "The bread of the needy, is the life of the poor: he that defraudeth them thereof, is a man of blood."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "qui aufert in sudore panem quasi qui occidit proximum suum"
      en: "He that taketh away the bread gotten by sweat, is like him that killeth his neighbour."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "qui effundit sanguinem et qui fraudem facit mercedem mercennario"
      en: "He that sheddeth blood, and he that defraudeth the labourer of his hire, are brothers."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "unus aedificans et unus destruens quid prodest illis nisi labor"
      en: "When one buildeth up, and another pulleth down: what profit have they but the labour?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "unus orans et unus maledicens cuius vocem exaudiet Deus"
      en: "When one prayeth, and another curseth: whose voice will God hear?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "qui baptizatur a mortuo et iterum tangit illum quid proficit lavatione illius"
      en: "He that washeth himself after touching the dead, if he toucheth him again, what doth his washing avail?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "sic homo qui ieiunat in peccatis suis et iterum eadem faciens quid proficit humiliando se orationem illius quis exaudiet"
      en: "So a man that fasteth for his sins, and doth the same again, what doth his humbling himself profit him? who will hear his prayer?"
    status: { la: verified, en: verified }
