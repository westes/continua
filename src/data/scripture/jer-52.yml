book: jer
chapter: 52
verses:
  - n: 1
    text:
      la: "filius viginti et unius anni Sedecias cum regnare coepisset et undecim annis regnavit in Hierusalem et nomen matris eius Amithal filia Hieremiae de Lobna"
      en: "Sedecias was one and twenty years old when he began to reign: and he reigned eleven years in Jerusalem: and the name of his mother was Amital, the daughter of Jerernias of Lobna."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et fecit malum in oculis Domini iuxta omnia quae fecerat Ioachim"
      en: "And he did that which was evil in the eyes of the Lord, according to all that Joakim had done."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quoniam furor Domini erat in Hierusalem et in Iuda usquequo proiceret eos a facie sua et recessit Sedecias a rege Babylonis"
      en: "For the wrath of the Lord was against Jerusalem, and against Juda, till he cast t hem out from his presence: and Sedecias revolted from the king of Babylon."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "factum est autem in anno nono regni eius in mense decimo decima mensis venit Nabuchodonosor rex Babylonis ipse et omnis exercitus eius adversum Hierusalem et obsederunt eam et aedificaverunt contra eam munitiones in circuitu"
      en: "And it came to pass in the ninth year of his reign, in the tenth month, the tenth day of the month, that Nabuchodonosor the king of Babylon came, he and all his army, against Jerusalem, and they besieged it, and built forts against it round about."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et fuit civitas obsessa usque ad undecimum annum regis Sedeciae"
      en: "And the city was besieged until the eleventh year of king Sedecias."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "mense autem quarto nona mensis obtinuit fames in civitate et non erant alimenta populo terrae"
      en: "And in the fourth month, the ninth day of the month, a famine overpowered the city: and there was no food for the people of the land."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et disrupta est civitas et omnes viri bellatores fugerunt et exierunt de civitate nocte per viam portae quae est inter duos muros et ducit ad hortum regis Chaldeis obsidentibus urbem in gyro et abierunt per viam quae ducit in heremum"
      en: "And the city was broken up, and the men of war fled, and went out of the city in the night by the way of the gate that is between the two walls, and leadeth to the king's garden, (the Chaldeans besieging the city round about, ) sad they went by the way that leadeth to the wilderness."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "persecutus est autem exercitus Chaldeorum regem et adprehenderunt Sedeciam in deserto quod est iuxta Hiericho et omnis comitatus eius diffugit ab eo"
      en: "But the army of the Chaldeans pursued after the king: and they overtook Sedecias in the desert which is near Jericho: and all his companions were scattered from him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cumque conprehendissent regem adduxerunt eum ad regem Babylonis in Reblatha quae est in terra Emath et locutus est ad eum iudicia"
      en: "And when they had taken the king, they carried him to the king of Babylon to Reblatha, which is in the land of Emath: and he gave judgment upon him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et iugulavit rex Babylonis filios Sedeciae in oculis eius sed et omnes principes Iudae occidit in Reblatha"
      en: "And the king of Babylon slew the sons of Sedecias before his eyes: and he slew all the princes of Juda in Reblatha."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et oculos Sedeciae eruit et vinxit eum conpedibus et adduxit eum rex Babylonis in Babylonem et posuit eum in domo carceris usque ad diem mortis eius"
      en: "And he put out the eyes of Sedecias, and bound him with fetters, and the king of Babylon brought him into Babylon, and he put him in prison till the day of his death."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "in mense autem quinto decima mensis ipse est annus nonusdecimus Nabuchodonosor regis Babylonis venit Nabuzardan princeps militiae qui stabat coram rege Babylonis in Hierusalem"
      en: "And in the fifth month, the tenth day of the month, the same is the nineteenth year of Nabuchodonosor, king of Babylon, came Nabuzardan the general of the army, who stood before the king of Babylon in Jerusalem."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et incendit domum Domini et domum regis et omnes domos Hierusalem et omnem domum magnam igne conbusit"
      en: "And he burnt the house of the Lord, and the king's house, and all the houses of Jerusalem, and every great house he burnt with fire."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et totum murum Hierusalem per circuitum destruxit cunctus exercitus Chaldeorum qui erat cum magistro militiae"
      en: "And all the army of the Chaldeans that were with the general broke down all the wall of Jerusalem round about."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "de pauperibus autem populi et de reliquo vulgo quod remanserat in civitate et de perfugis qui transfugerant ad regem Babylonis et ceteros de multitudine transtulit Nabuzardan princeps militiae"
      en: "But Nabuzardan the general carried away captives some of the poor people, and of the rest of the common sort who remained in the city, and of the fugitives that were fled over to the king of Babylon, and the rest of the multitude."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "de pauperibus vero terrae reliquit Nabuzardan princeps militiae in vinitores et in agricolas"
      en: "But of the poor of the land, Nabuzardan the general left some for vinedressers, and for husbandmen."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "columnas quoque aereas quae erant in domo Domini et bases et mare aereum quod erat in domo Domini confregerunt Chaldei et tulerunt omne aes eorum in Babylonem"
      en: "The Chaldeans also broke in pieces the brazen pillars that were in the house of the Lord, and the bases, and the sea of brass that was in the house of the Lord: and they carried all the brass of them to Babylon."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et lebetas et creagras et psalteria et fialas et mortariola et omnia vasa aerea quae in ministerio fuerant tulerunt"
      en: "And they took the caldrons, and the fleshhooks, and the psalteries, and the bowls, and the little mortars, and all the brazen vessels that had been used in the ministry: and"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et hydrias et thymiamateria et urceos et pelves et candelabra et mortaria et cyatos quotquot aurea aurea et quotquot argentea argentea tulit magister militiae"
      en: "The general took away the pitchers, and the censers, and the pots, and the basins, and the candlesticks, and the mortars, and the cups: as many as were of gold, in gold: and as many as were of silver, in silver:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "columnas duas et mare unum vitulos duodecim aereos qui erant sub basibus quas fecerat rex Salomon in domo Domini non erat pondus aeris omnium vasorum horum"
      en: "And the two pillars, and one sea, and twelve oxen of brass that were under the bases, which king Solomon had made in the house of the Lord: there was no weight of the brass of all these vessels."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "de columnis autem decem et octo cubiti altitudinis erant in columna una et funiculus duodecim cubitorum circuibat eam porro grossitudo eius quattuor digitorum et intrinsecus cava erat"
      en: "And concerning the pillars, one pillar was eighteen cubits high: and a cord of twelve cubits compassed it about: but the thickness thereof was four fingers, and it was hollow within."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et capitella super utramque aerea altitudo capitelli unius quinque cubitorum et retiacula et mala granata"
      en: "And chapiters of brass were upon both: and the height of one chapiter was five cubits: and network, and pomegranates were upon the chapiters round about, all of brass. The same of the second pillar, and the pomegranates."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "nonaginta sex dependentia omnia mala granata centum retiaculis circumdabantur"
      en: "And there were ninety-six pomegranates hanging down: and the pomegranates being a hundred in all, were compassed with network."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et tulit magister militiae Saraiam sacerdotem primum et Sophoniam sacerdotem secundum et tres custodes vestibuli"
      en: "And the general took Saraias the chief priest, and Sophonias the second priest, and the three keepers of the entry."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et de civitate tulit eunuchum unum qui erat praepositus super viros bellatores et septem viros de his qui videbant faciem regis qui inventi sunt in civitate et scribam principem militum qui probabat tirones et sexaginta viros de populo terrae qui inventi sunt in medio civitatis"
      en: "He also took out of the city one eunuch that was chief over the men of war: and seven men of them that were near the king's person, that were found in the city: and a scribe, an officer of the army who exercised the young soldiers: and threescore men of the people of the land, that were found in the midst of the city."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "tulit autem eos Nabuzardan magister militiae et duxit eos ad regem Babylonis in Reblatha"
      en: "And Nabuzardan the general took them, and brought them to the king of Babylon, to Reblatha."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et percussit eos rex Babylonis et interfecit eos in Reblatha in terra Emath et translatus est Iuda de terra sua"
      en: "And the king of Babylon struck them, and put them to death in Reblatha, in the land of Emath: and Juda was carried away captive out of his land."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "iste est populus quem transtulit Nabuchodonosor in anno septimo Iudaeos tria milia et viginti tres"
      en: "This is the people whom Nabuchodonosor carried away captive : in the seventh year, three thousand and twenty-three Jews."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "in anno octavodecimo Nabuchodonosor de Hierusalem animas octingentas triginta duas"
      en: "In the eighteenth year of Nabuchodonosor, eight hundred and thirty-two souls from Jerusalem."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "in anno vicesimo tertio Nabuchodonosor transtulit Nabuzardan magister militiae Iudaeorum animas septingentas quadraginta quinque omnes ergo animae quattuor milia sescentae"
      en: "In the three and twentieth year of Nabuchodonosor, Nabuzardan the general carried away of the Jews seven hundred and forty-five souls. So all the souls were four thousand six hundred."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et factum est in tricesimo septimo anno transmigrationis Ioachim regis Iudae duodecimo mense vicesima quinta mensis elevavit Evilmerodach rex Babylonis ipso anno regni sui caput Ioachim regis Iudae et eduxit eum de domo carceris"
      en: "And it came to pass in the seven and thirtieth year of the captivity of Joachin king of Juda, in the twelfth month, the five and twentieth day of the month, that Evilmerodach king of Babylon, in the first year of his reign, lifted up the head of Joachin king of Juda, and brought him forth out of prison."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et locutus est cum eo bona et posuit thronum eius super thronos regum qui erant post se in Babylone"
      en: "And he spoke kindly to him, and he set his throne above the thrones of the kings that were with him in Babylon."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et mutavit vestimenta carceris eius et comedebat panem coram eo semper cunctis diebus vitae suae"
      en: "And he changed his prison garments, and he ate bread before him always all the days of his life."
    status: { la: verified, en: verified }
