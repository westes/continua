# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: marc
chapter: 5
verses:
  - n: 1
    text:
      la: "et venerunt trans fretum maris in regionem Gerasenorum"
      en: "And they came over the strait of the sea into the country of the Gerasens."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et exeunti ei de navi statim occurrit ei de monumentis homo in spiritu inmundo"
      en: "And as he went out of the ship, immediately there met him out of the monuments a man with an unclean spirit,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "qui domicilium habebat in monumentis et neque catenis iam quisquam eum poterat ligare"
      en: "Who had his dwelling in the tombs, and no man now could bind him, not even with chains."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quoniam saepe conpedibus et catenis vinctus disrupisset catenas et conpedes comminuisset et nemo poterat eum domare"
      en: "For having been often bound with fetters and chains, he had burst the chains, and broken the fetters in pieces, and no one could tame him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et semper nocte ac die in monumentis et in montibus erat clamans et concidens se lapidibus"
      en: "And he was always day and night in the monuments and in the mountains, crying and cutting himself with stones."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "videns autem Iesum a longe cucurrit et adoravit eum"
      en: "And seeing Jesus afar off, he ran and adored him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et clamans voce magna dicit quid mihi et tibi Iesu Fili Dei summi adiuro te per Deum ne me torqueas"
      en: "And crying with a loud voice, he said: What have I to do with thee, Jesus the Son of the most high God? I adjure thee by God that thou torment me not."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dicebat enim illi exi spiritus inmunde ab homine"
      en: "For he said unto him: Go out of the man, thou unclean spirit."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et interrogabat eum quod tibi nomen est et dicit ei Legio nomen mihi est quia multi sumus"
      en: "And he asked him: What is thy name? And he saith to him: My name is Legion, for we are many."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et deprecabatur eum multum ne se expelleret extra regionem"
      en: "And he besought him much, that he would not drive him away out of the country."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "erat autem ibi circa montem grex porcorum magnus pascens"
      en: "And there was there near the mountain a great herd of swine, feeding."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et deprecabantur eum spiritus dicentes mitte nos in porcos ut in eos introeamus"
      en: "And the spirits besought him, saying: Send us into the swine, that we may enter into them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et concessit eis statim Iesus et exeuntes spiritus inmundi introierunt in porcos et magno impetu grex praecipitatus est in mare ad duo milia et suffocati sunt in mare"
      en: "And Jesus immediately gave them leave. And the unclean spirits going out, entered into the swine: and the herd with great violence was carried headlong into the sea, being about two thousand, and were stifled in the sea."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui autem pascebant eos fugerunt et nuntiaverunt in civitatem et in agros et egressi sunt videre quid esset facti"
      en: "And they that fed them fled, and told it in the city and in the fields. And they went out to see what was done:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et veniunt ad Iesum et vident illum qui a daemonio vexabatur sedentem vestitum et sanae mentis et timuerunt"
      en: "And they came to Jesus, and they see him that was troubled with the devil, sitting, clothed, and well in his wits, and they were afraid."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et narraverunt illis qui viderant qualiter factum esset ei qui daemonium habuerat et de porcis"
      en: "And they that had seen it, told them, in what manner he had been dealt with who had the devil; and concerning the swine."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et rogare eum coeperunt ut discederet de finibus eorum"
      en: "And they began to pray him that he would depart from their coasts."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cumque ascenderet navem coepit illum deprecari qui daemonio vexatus fuerat ut esset cum illo"
      en: "And when he went up into the ship, he that had been troubled with the devil, began to beseech him that he might be with him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et non admisit eum sed ait illi vade in domum tuam ad tuos et adnuntia illis quanta tibi Dominus fecerit et misertus sit tui"
      en: "And he admitted him not, but saith to him: Go into thy house to thy friends, and tell them how great things the Lord hath done for thee, and hath had mercy on thee."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et abiit et coepit praedicare in Decapoli quanta sibi fecisset Iesus et omnes mirabantur"
      en: "And he went his way, and began to publish in Decapolis how great things Jesus had done for him: and all men wondered."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et cum transcendisset Iesus in navi rursus trans fretum convenit turba multa ad illum et erat circa mare"
      en: "And when Jesus had passed again in the ship over the strait, a great multitude assembled together unto him, and he was nigh unto the sea."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et venit quidam de archisynagogis nomine Iairus et videns eum procidit ad pedes eius"
      en: "And there cometh one of the rulers of the synagogue named Jairus: and seeing him, falleth down at his feet."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et deprecabatur eum multum dicens quoniam filia mea in extremis est veni inpone manus super eam ut salva sit et vivat"
      en: "And he besought him much, saying: My daughter is at the point of death, come, lay thy hand upon her, that she may be safe, and may live."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et abiit cum illo et sequebatur eum turba multa et conprimebant illum"
      en: "And he went with him, and a great multitude followed him, and they thronged him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et mulier quae erat in profluvio sanguinis annis duodecim"
      en: "And a woman who was under an issue of blood twelve years,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et fuerat multa perpessa a conpluribus medicis et erogaverat omnia sua nec quicquam profecerat sed magis deterius habebat"
      en: "And had suffered many things from many physicians; and had spent all that she had, and was nothing the better, but rather worse,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "cum audisset de Iesu venit in turba retro et tetigit vestimentum eius"
      en: "When she had heard of Jesus, came in the crowd behind him, and touched his garment."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "dicebat enim quia si vel vestimentum eius tetigero salva ero"
      en: "For she said: If I shall touch but his garment, I shall be whole."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et confestim siccatus est fons sanguinis eius et sensit corpore quod sanata esset a plaga"
      en: "And forthwith the fountain of her blood was dried up, and she felt in her body that she was healed of the evil."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et statim Iesus cognoscens in semet ipso virtutem quae exierat de eo conversus ad turbam aiebat quis tetigit vestimenta mea"
      en: "And immediately Jesus knowing in himself the virtue that had proceeded from him, turning to the multitude, said: Who hath touched my garments?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et dicebant ei discipuli sui vides turbam conprimentem te et dicis quis me tetigit"
      en: "And his disciples said to him: Thou seest the multitude thronging thee, and sayest thou who hath touched me?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et circumspiciebat videre eam quae hoc fecerat"
      en: "And he looked about to see her who had done this."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "mulier autem timens et tremens sciens quod factum esset in se venit et procidit ante eum et dixit ei omnem veritatem"
      en: "But the woman fearing and trembling, knowing what was done in her, came and fell down before him, and told him all the truth."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "ille autem dixit ei filia fides tua te salvam fecit vade in pace et esto sana a plaga tua"
      en: "And he said to her: Daughter, thy faith hath made thee whole: go in peace, and be thou whole of thy disease."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "adhuc eo loquente veniunt ab archisynagogo dicentes quia filia tua mortua est quid ultra vexas magistrum"
      en: "While he was yet speaking, some come from the ruler of the synagogue's house, saying: Thy daughter is dead: why dost thou trouble the master any further?"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Iesus autem verbo quod dicebatur audito ait archisynagogo noli timere tantummodo crede"
      en: "But Jesus having heard the word that was spoken, saith to the ruler of the synagogue: Fear not, only believe."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et non admisit quemquam sequi se nisi Petrum et Iacobum et Iohannem fratrem Iacobi"
      en: "And he admitted not any man to follow him, but Peter, and James, and John the brother of James."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et veniunt in domum archisynagogi et videt tumultum et flentes et heiulantes multum"
      en: "And they come to the house of the ruler of the synagogue; and he seeth a tumult, and people weeping and wailing much."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et ingressus ait eis quid turbamini et ploratis puella non est mortua sed dormit"
      en: "And going in, he saith to them: Why make you this ado, and weep? the damsel is not dead, but sleepeth."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et inridebant eum ipse vero eiectis omnibus adsumit patrem et matrem puellae et qui secum erant et ingreditur ubi erat puella iacens"
      en: "And they laughed him to scorn. But he having put them all out, taketh the father and the mother of the damsel, and them that were with him, and entereth in where the damsel was lying."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et tenens manum puellae ait illi talitha cumi quod est interpretatum puella tibi dico surge"
      en: "And taking the damsel by the hand, he saith to her: Talitha cumi, which is, being interpreted: Damsel (I say to thee) arise."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et confestim surrexit puella et ambulabat erat autem annorum duodecim et obstipuerunt stupore maximo"
      en: "And immediately the damsel rose up, and walked: and she was twelve years old: and they were astonished with a great astonishment."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et praecepit illis vehementer ut nemo id sciret et dixit dari illi manducare"
      en: "And he charged them strictly that no man should know it: and commanded that something should be given her to eat."
    status: { la: verified, en: verified }
