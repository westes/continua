# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: lam
chapter: 3
verses:
  - n: 1
    text:
      la: "ALEPH. Ego vir videns paupertatem meam in virga indignationis ejus."
      en: "Aleph. I am the man that see my poverty by the rod of his indignation."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ALEPH. Me minavit, et adduxit in tenebras, et non in lucem."
      en: "Aleph. He hath led me, and brought me into darkness, and not into light."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ALEPH. Tantum in me vertit et convertit manum suam tota die."
      en: "Aleph. Only against me he hath turned, and turned again his hand all the day."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "BETH. Vetustam fecit pellem meam et carnem meam; contrivit ossa mea."
      en: "Beth. My skin and my flesh he hath made old, he hath broken my bones."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "BETH. Aedificavit in gyro meo, et circumdedit me felle et labore."
      en: "Beth. He hath built round about me, and he hath compassed me with gall and labour."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "BETH. In tenebrosis collocavit me, quasi mortuos sempiternos."
      en: "Beth. He hath set me in dark places as those that are dead for ever."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "GHIMEL. Circumaedificavit adversum me, ut non egrediar; aggravavit compedem meum."
      en: "Ghimel. He hath built against me round about, that I may not get out: he hath made my fetters heavy."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "GHIMEL. Sed et cum clamavero, et rogavero, exclusit orationem meam."
      en: "Ghimel. Yea, and when I cry, and entreat, he hath shut out my prayer."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "GHIMEL. Conclusit vias meas lapidibus quadris; semitas meas subvertit."
      en: "Ghimel. He hath shut up my ways with square stones, he hath turned my paths upside down."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "DALETH. Ursus insidians factus est mihi, leo in absconditis."
      en: "Daleth. He is become to me as a bear lying in wait: as a lion in secret places."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "DALETH. Semitas meas subvertit, et confregit me; posuit me desolatam."
      en: "Daleth. He hath turned aside my paths, and hath broken me in pieces, he hath made me desolate."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "DALETH. Tetendit arcum suum, et posuit me quasi signum ad sagittam."
      en: "Daleth. He hath bent his bow, and set me as a mark for his arrows."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "HE. Misit in renibus meis filias pharetrae suae."
      en: "He. He hath shot into my reins the daughters of his quiver."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "HE. Factus sum in derisum omni populo meo, canticum eorum tota die."
      en: "He. I am made a derision to all my people, their song all the day long."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "HE. Replevit me amaritudinibus; inebriavit me absinthio."
      en: "He. He hath filled me with bitterness, he hath inebriated me with wormwood."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "VAU. Et fregit ad numerum dentes meos; cibavit me cinere."
      en: "Vau. And he hath broken my teeth one by one, he hath fed me with ashes."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "VAU. Et repulsa est a pace anima mea; oblitus sum bonorum."
      en: "Vau. And my soul is removed far off from peace, I have forgotten good things."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "VAU. Et dixi: Periit finis meus, et spes mea a Domino."
      en: "Vau. And I said: My end and my hope is perished from the Lord."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ZAIN. Recordare paupertatis, et transgressionis meae, absinthii et fellis."
      en: "Zain. Remember my poverty, and transgression, the wormwood, and the gall."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ZAIN. Memoria memor ero, et tabescet in me anima mea."
      en: "Zain. I will be mindful and remember, and my soul shall languish within me."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ZAIN. Haec recolens in corde meo, ideo sperabo."
      en: "Zain. These things I shall think over in my heart, therefore will I hope."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "HETH. Misericordiae Domini, quia non sumus consumpti; quia non defecerunt miserationes ejus."
      en: "Heth. The mercies of the Lord that we are not consumed: because his commiserations have not failed."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "HETH. Novi diluculo, multa est fides tua."
      en: "Heth. They are new every morning, great is thy faithfulness."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "HETH. Pars mea Dominus, dixit anima mea; propterea exspectabo eum."
      en: "Heth. The Lord is my portion, said my soul: therefore will I wait for him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "TETH. Bonus est Dominus sperantibus in eum, animae quaerenti illum."
      en: "Teth. The Lord is good to them that hope in him, to the soul that seeketh him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "TETH. Bonum est praestolari cum silentio salutare Dei."
      en: "Teth. It is good to wait with silence for the salvation of God."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "TETH. Bonum est viro cum portaverit jugum ab adolescentia sua."
      en: "Teth. It is good for a man, when he hath borne the yoke from his youth."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "JOD. Sedebit solitarius, et tacebit, quia levavit super se."
      en: "Jod. He shall sit solitary, and hold his peace: because he hath taken it up upon himself."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "JOD. Ponet in pulvere os suum, si forte sit spes."
      en: "Jod. He shall put his mouth in the dust, if so be there may be hope."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "JOD. Dabit percutienti se maxillam: saturabitur opprobriis."
      en: "Jod. He shall give his cheek to him that striketh him, he shall be filled with reproaches."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "CAPH. Quia non repellet in sempiternum Dominus."
      en: "Caph. For the Lord will not cast off for ever."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "CAPH. Quia si abjecit, et miserebitur, secundum multitudinem misericordiarum suarum."
      en: "Caph. For if he hath cast off, he will also have mercy, according to the multitude of his mercies."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "CAPH. Non enim humiliavit ex corde suo et abjecit filios hominum."
      en: "Caph. For he hath not willingly afflicted, nor cast off the children of men."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "LAMED. Ut conteret sub pedibus suis omnes vinctos terrae."
      en: "Lamed. To crush under his feet all the prisoners of the land,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "LAMED. Ut declinaret judicium viri in conspectu vultus Altissimi."
      en: "Lamed. To turn aside the judgment of a man before the face of the most High,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "LAMED. Ut perverteret hominem in judicio suo; Dominus ignoravit."
      en: "Lamed. To destroy a man wrongfully in his judgment, the Lord hath not approved."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "MEM. Quis est iste qui dixit ut fieret, Domino non jubente?"
      en: "Mem. Who is he that hath commanded a thing to be done, when the Lord commandeth it not?"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "MEM. Ex ore Altissimi non egredientur nec mala nec bona?"
      en: "Mem. Shall not both evil and good proceed out of the mouth of the Highest?"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "MEM. Quid murmuravit homo vivens, vir pro peccatis suis?"
      en: "Mem. Why hath a living man murmured, man suffering for his sins?"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "NUN. Scrutemur vias nostras, et quaeramus, et revertamur ad Dominum."
      en: "Nun. Let us search our ways, and seek, and return to the Lord."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "NUN. Levemus corda nostra cum manibus ad Dominum in caelos."
      en: "Nun. Let us lift up our hearts with our hands to the Lord in the heavens."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "NUN. Nos inique egimus, et ad iracundiam provocavimus; idcirco tu inexorabilis es."
      en: "Nun. We have done wickedly, and provoked thee to wrath: therefore thou art inexorable."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "SAMECH. Operuisti in furore, et percussisti nos; occidisti, nec pepercisti."
      en: "Samech. Thou hast covered in thy wrath, and hast struck us: thou hast killed and hast not spared."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "SAMECH. Opposuisti nubem tibi, ne transeat oratio."
      en: "Samech. Thou hast set a cloud before thee, that our prayer may not pass through."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "SAMECH. Eradicationem et abjectionem posuisti me in medio populorum."
      en: "Samech. Thou hast made me as an outcast, and refuse in the midst of the people."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "PHE. Aperuerunt super nos os suum omnes inimici."
      en: "Phe. All our enemies have opened their mouths against us."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "PHE. Formido et laqueus facta est nobis vaticinatio, et contritio."
      en: "Phe. Prophecy is become to us a fear, and a snare, and destruction."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "PHE. Divisiones aquarum deduxit oculus meus, in contritione filiae populi mei."
      en: "Phe. My eye hath run down with streams of water, for the destruction of the daughter of my people."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "AIN. Oculus meus afflictus est, nec tacuit, eo quod non esset requies."
      en: "Ain. My eye is afflicted, and hath not been quiet, because there was no rest:"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "AIN. Donec respiceret et videret Dominus de caelis."
      en: "Ain. Till the Lord regarded and looked down from the heavens."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "AIN. Oculus meus depraedatus est animam meam in cunctis filiabus urbis meae."
      en: "Ain. My eye hath wasted my soul because of all the daughters of my city."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "SADE. Venatione ceperunt me quasi avem inimici mei gratis."
      en: "Sade. My enemies have chased me and caught me like a bird, without cause."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "SADE. Lapsa est in lacum vita mea, et posuerunt lapidem super me."
      en: "Sade. My life is fallen into the pit, and they have laid a stone over me."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "SADE. Inundaverunt aquae super caput meum; dixi: Perii."
      en: "Sade. Waters have flowed over my head: I said: I am cut off."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "COPH. Invocavi nomen tuum, Domine, de lacu novissimo."
      en: "Coph. I have called upon thy name, O Lord, from the lowest pit."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "COPH. Vocem meam audisti; ne avertas aurem tuam a singultu meo et clamoribus."
      en: "Coph. Thou hast heard my voice: turn not away thy ear from my sighs, and cries."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "COPH. Appropinquasti in die quando invocavi te; dixisti: Ne timeas."
      en: "Coph. Thou drewest near in the day, when I called upon thee, thou saidst: Fear not."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "RES. Judicasti, Domine, causam animae meae, redemptor vitae meae."
      en: "Res. Thou hast judged, O Lord, the cause of my soul, thou the Redeemer of my life."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "RES. Vidisti, Domine, iniquitatem illorum adversum me: judica judicium meum."
      en: "Res. Thou hast seen, O Lord, their iniquity against me: judge thou my judgment."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "RES. Vidisti omnem furorem, universas cogitationes eorum adversum me."
      en: "Res. Thou hast seen all their fury, and all their thoughts against me."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "SIN. Audisti opprobrium eorum, Domine, omnes cogitationes eorum adversum me."
      en: "Sin. Thou hast heard their reproach, O Lord, all their imaginations against me."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "SIN. Labia insurgentium mihi, et meditationes eorum adversum me tota die."
      en: "Sin. The lips of them that rise up against me: and their devices against me all the day."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "SIN. Sessionem eorum et resurrectionem eorum vide; ego sum psalmus eorum."
      en: "Sin. Behold their sitting down, and their rising up, I am their song."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "THAU. Redes eis vicem, Domine, juxta opera manuum suarum."
      en: "Thau. Thou shalt render them a recompense, O Lord, according to the works of their hands."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "THAU. Dabis eis scutum cordis, laborem tuum."
      en: "Thau. Thou shalt give them a buckler of heart, thy labour."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "THAU. Persequeris in furore, et conteres eos sub caelis, Domine."
      en: "Thau. Thou shalt persecute them in anger, and shalt destroy them from under the heavens, O Lord."
    status: { la: verified, en: verified }
