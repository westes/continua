# Douay-Rheims + Latin Vulgate, from drbo.org (Douay-Rheims Bible
# Online) -- the "DR + LV" combined page keeps every verse's Latin
# and English paired in the same block, avoiding the verse-
# misalignment this project's first-pass "Unbound Bible" source had
# for sir 10 specifically; see TODO.md's bulk scripture import entry.
book: sir
chapter: 10
verses:
  - n: 1
    text:
      la: "Judex sapiens judicabit populum suum, et principatus sensati stabilis erit."
      en: "A wise judge shall judge his people, and the government of a prudent man shall be steady."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Secundum judicem populi, sic et ministri ejus : et qualis rector est civitatis, tales et inhabitantes in ea."
      en: "As the judge of the people is himself, so also are his ministers: and what manner of man the ruler of a city is, such also are they that dwell therein."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Rex insipiens perdet populum suum : et civitates inhabitabuntur per sensum potentium."
      en: "An unwise king shall be the ruin of his people: and cities shall be inhabited through the prudence of the rulers."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "In manu Dei potestas terrae : et utilem rectorem suscitabit in tempus super illam."
      en: "The power of the earth is in the hand of God, and in his time he will raise up a profitable ruler over it."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "In manu Dei prosperitas hominis, et super faciem scribae imponet honorem suum."
      en: "The prosperity of man is in the hand of God, and upon the person of the scribe he shall lay his honour."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Omnis injuriae proximi ne memineris, et nihil agas in operibus injuriae."
      en: "Remember not any injury done thee by thy neighbour, and do thou nothing by deeds of injury."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Odibilis coram Deo est et hominibus superbia, et execrabilis omnis iniquitas gentium."
      en: "Pride is hateful before God and men: and all iniquity of nations is execrable."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Regnum a gente in gentem transfertur propter injustitias, et injurias, et contumelias, et diversos dolos."
      en: "A kingdom is translated from one people to another, because of injustices, and wrongs, and injuries, and divers deceits."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Avaro autem nihil est scelestius. Quid superbit terra et cinis?"
      en: "But nothing is more wicked than the covetous man. Why is earth and ashes proud?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nihil est iniquius quam amare pecuniam : hic enim et animam suam venalem habet, quoniam in vita sua projecit intima sua."
      en: "There is not a more wicked thing than to love money: for such a one setteth even his own soul to sale: because while he liveth he hath cast away his bowels."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Omnis potentatus brevis vita; languor prolixior gravat medicum."
      en: "All power is of short life. A long sickness is troublesome to the physician."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Brevem languorem praecidit medicus : sic et rex hodie est, et cras morietur."
      en: "The physician cutteth off a short sickness: so also a king is today, and tomorrow he shall die."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Cum enim morietur homo, haereditabit serpentes, et bestias, et vermes."
      en: "For when a man shall die, he shall inherit serpents, and beasts, and worms."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Initium superbiae hominis apostatare a Deo :"
      en: "The beginning of the pride of man, is to fall off from God:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quoniam ab eo qui fecit illum recessit cor ejus, quoniam initium omnis peccati est superbia. Qui tenuerit illam adimplebitur maledictis, et subvertet eum in finem."
      en: "Because his heart is departed from him that made him: for pride is the beginning of all sin: he that holdeth it, shall be filled with maledictions, and it shall ruin him in the end."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Propterea exhonoravit Dominus conventus malorum, et destruxit eos usque in finem."
      en: "Therefore hath the Lord disgraced the assemblies of the wicked, and hath utterly destroyed them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Sedes ducum superborum destruxit Deus, et sedere fecit mites pro eis."
      en: "God hath overturned the thrones of proud princes, and hath set up the meek in their stead."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Radices gentium superbarum arefecit Deus, et plantavit humiles ex ipsis gentibus."
      en: "God hath made the roots of proud nations to wither, and hath planted the humble of these nations."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Terras gentium evertit Dominus, et perdidit eas usque ad fundamentum."
      en: "The Lord hath overthrown the lands of the Gentiles, and hath destroyed them even to the foundation."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Arefecit ex ipsis, et disperdidit eos, et cessare fecit memoriam eorum a terra."
      en: "He hath made some of them to wither away, and hath destroyed them, and hath made the memory of them to cease from the earth."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Memoria superborum perdidit Deus, et reliquit memoriam humilium sensu."
      en: "God hath abolished the memory of the proud, and hath preserved the memory of them that are humble in mind."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Non est creata hominibus superbia, neque iracundia nationi mulierum."
      en: "Pride was not made for men: nor wrath for the race of women."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Semen hominum honorabitur hoc, quod timet Deum : semen autem hoc exhonorabitur, quod praeterit mandata Domini."
      en: "That seed of men shall be honoured, which feareth God: but that seed shall be dishonoured, which transgresseth the commandments of the Lord."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "In medio fratrum rector illorum in honore : et qui timent Dominum erunt in oculis illius."
      en: "In the midst of brethren their chief is honourable: so shall they that fear the Lord, be in his eyes."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Gloria divitum, honoratorum, et pauperum, timor Dei est."
      en: "The fear of God is the glory of the rich, and of the honourable, and of the poor:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Noli despicere hominem justum pauperem, et noli magnificare virum peccatorem divitem."
      en: "Despise not a just man that is poor, and do not magnify a sinful man that is rich."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Magnus, et judex, et potens est in honore : et non est major illo qui timet Deum."
      en: "The great man, and the judge, and the mighty is in honour: and there is none greater than he that feareth God."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Servo sensato liberi servient : et vir prudens et disciplinatus non murmurabit correptus, et inscius non honorabitur."
      en: "They that are free shall serve a servant that is wise: and a man that is prudent and well instructed will not murmur when he is reproved; and he that is ignorant, shall not be honoured."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Noli extollere te in faciendo opere tuo, et noli cunctari in tempore angustiae."
      en: "Extol not thyself in doing thy work, and linger not in the time of distress:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Melior est qui operatur et abundat in omnibus, quam qui gloriatur et eget pane."
      en: "Better is he that laboureth, and aboundeth in all things, than he that boasteth himself and wanteth bread."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Fili, in mansuetudine serva animam tuam, et da illi honorem secundum meritum suum."
      en: "My son, keep thy soul in meekness, and give it honour according to its desert."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Peccantem in animam suam quis justificabit? et quis honorificabit exhonorantem animam suam?"
      en: "Who will justify him that sinneth against his own soul? and who will honour him that dishonoureth his own soul?"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Pauper gloriatur per disciplinam et timorem suum : et est homo qui honorificatur propter substantiam suam."
      en: "The poor man is glorified by his discipline and fear: and there is a man that is honoured for his wealth."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Qui autem gloriatur in paupertate, quanto magis in substantia! et qui gloriatur in substantia, paupertatem vereatur."
      en: "But he that is glorified in poverty, how much more in wealth? and he that is glorified in wealth, let him fear poverty."
    status: { la: verified, en: verified }
