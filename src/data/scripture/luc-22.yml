# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: luc
chapter: 22
verses:
  - n: 1
    text:
      la: "Appropinquat autem dies festus azymorum, qui dicitur Pascha:"
      en: "Now the feast of unleavened bread, which is called the pasch, was at hand."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et quaerebant principes sacerdotum, et scribae, quomodo Jesum interficerent: timebant vero plebem."
      en: "And the chief priests and the scribes sought how they might put Jesus to death: but they feared the people."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Intravit autem Satanas in Judam, qui cognominabatur Iscariotes, unum de duodecim:"
      en: "And Satan entered into Judas, who was surnamed Iscariot, one of the twelve."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et abiit, et locutus est cum principibus sacerdotum, et magistratibus, quemadmodum illum traderet eis."
      en: "And he went, and discoursed with the chief priests and the magistrates, how he might betray him to them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et gavisi sunt, et pacti sunt pecuniam illi dare."
      en: "And they were glad, and covenanted to give him money."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et spopondit, et quaerebat opportunitatem ut traderet illum sine turbis."
      en: "And he promised. And he sought opportunity to betray him in the absence of the multitude."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Venit autem dies azymorum, in qua necesse erat occidi pascha."
      en: "And the day of the unleavened bread came, on which it was necessary that the pasch should be killed."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et misit Petrum et Joannem, dicens: Euntes parate nobis pascha, ut manducemus."
      en: "And he sent Peter and John, saying: Go, and prepare for us the pasch, that we may eat."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "At illi dixerunt: Ubi vis paremus?"
      en: "But they said: Where wilt thou that we prepare?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et dixit ad eos: Ecce introeuntibus vobis in civitatem occurret vobis homo quidam amphoram aquae portans: sequimini eum in domum, in quam intrat,"
      en: "And he said to them: Behold, as you go into the city, there shall meet you a man carrying a pitcher of water: follow him into the house where he entereth in."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dicetis patrifamilias domus: Dicit tibi Magister: Ubi est diversorium, ubi pascha cum discipulis meis manducem?"
      en: "And you shall say to the goodman of the house: The master saith to thee, Where is the guest chamber, where I may eat the pasch with my disciples?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et ipse ostendet vobis coenaculum magnum stratum, et ibi parate."
      en: "And he will shew you a large dining room, furnished; and there prepare."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Euntes autem invenerunt sicut dixit illis, et paraverunt pascha."
      en: "And they going, found as he had said to them, and made ready the pasch."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et cum facta esset hora, discubuit, et duodecim apostoli cum eo."
      en: "And when the hour was come, he sat down, and the twelve apostles with him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et ait illis: Desiderio desideravi hoc pascha manducare vobiscum, antequam patiar."
      en: "And he said to them: With desire I have desired to eat this pasch with you, before I suffer."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Dico enim vobis, quia ex hoc non manducabo illud, donec impleatur in regno Dei."
      en: "For I say to you, that from this time I will not eat it, till it be fulfilled in the kingdom of God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et accepto calice gratias egit, et dixit: Accipite, et dividite inter vos."
      en: "And having taken the chalice, he gave thanks, and said: Take, and divide it among you:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Dico enim vobis quod non bibam de generatione vitis donec regnum Dei veniat."
      en: "For I say to you, that I will not drink of the fruit of the vine, till the kingdom of God come."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et accepto pane gratias egit, et fregit, et dedit eis, dicens: Hoc est corpus meum, quod pro vobis datur: hoc facite in meam commemorationem."
      en: "And taking bread, he gave thanks, and brake; and gave to them, saying: This is my body, which is given for you. Do this for a commemoration of me."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Similiter et calicem, postquam coenavit, dicens: Hic est calix novum testamentum in sanguine meo, qui pro vobis fundetur."
      en: "In like manner the chalice also, after he had supped, saying: This is the chalice, the new testament in my blood, which shall be shed for you."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Verumtamen ecce manus tradentis me, mecum est in mensa."
      en: "But yet behold, the hand of him that betrayeth me is with me on the table."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et quidem Filius hominis, secundum quod definitum est, vadit: verumtamen vae homini illi per quem tradetur."
      en: "And the Son of man indeed goeth, according to that which is determined: but yet, woe to that man by whom he shall be betrayed."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et ipsi coeperunt quaerere inter se quis esset ex eis qui hoc facturus esset."
      en: "And they began to inquire among themselves, which of them it was that should do this thing."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Facta est autem et contentio inter eos, quis eorum videretur esse major."
      en: "And there was also a strife amongst them, which of them should seem to be the greater."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Dixit autem eis: Reges gentium dominantur eorum: et qui potestatem habent super eos, benefici vocantur."
      en: "And he said to them: The kings of the Gentiles lord it over them; and they that have power over them, are called beneficent."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Vos autem non sic: sed qui major est in vobis, fiat sicut minor: et qui praecessor est, sicut ministrator."
      en: "But you not so: but he that is the greater among you, let him become as the younger; and he that is the leader, as he that serveth."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Nam quis major est, qui recumbit, an qui ministrat? nonne qui recumbit? Ego autem in medio vestrum sum, sicut qui ministrat:"
      en: "For which is greater, he that sitteth at table, or he that serveth? Is it not he that sitteth at table? But I am in the midst of you, as he that serveth:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "vos autem estis, qui permansistis mecum in tentationibus meis."
      en: "And you are they who have continued with me in my temptations:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et ego dispono vobis sicut disposuit mihi Pater meus regnum,"
      en: "And I dispose to you, as my Father hath disposed to me, a kingdom;"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ut edatis et bibatis super mensam meam in regno meo, et sedeatis super thronos judicantes duodecim tribus Israel."
      en: "That you may eat and drink at my table, in my kingdom: and may sit upon thrones, judging the twelve tribes of Israel."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Ait autem Dominus: Simon, Simon, ecce Satanas expetivit vos ut cribraret sicut triticum:"
      en: "And the Lord said: Simon, Simon, behold Satan hath desired to have you, that he may sift you as wheat:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "ego autem rogavi pro te ut non deficiat fides tua: et tu aliquando conversus, confirma fratres tuos."
      en: "But I have prayed for thee, that thy faith fail not: and thou, being once converted, confirm thy brethren."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Qui dixit ei: Domine, tecum paratus sum et in carcerem et in mortem ire."
      en: "Who said to him: Lord, I am ready to go with thee, both into prison, and to death."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "At ille dixit: Dico tibi, Petre, non cantabit hodie gallus, donec ter abneges nosse me. Et dixit eis:"
      en: "And he said: I say to thee, Peter, the cock shall not crow this day, till thou thrice deniest that thou knowest me. And he said to them:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Quando misi vos sine sacculo, et pera, et calceamentis, numquid aliquid defuit vobis?"
      en: "When I sent you without purse, and scrip, and shoes, did you want anything?"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "At illi dixerunt: Nihil. Dixit ergo eis: Sed nunc qui habet sacculum, tollat; similiter et peram: et qui non habet, vendat tunicam suam et emat gladium."
      en: "But they said: Nothing. Then said he unto them: But now he that hath a purse, let him take it, and likewise a scrip; and he that hath not, let him sell his coat, and buy a sword."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Dico enim vobis, quoniam adhuc hoc quod scriptum est, oportet impleri in me: Et cum iniquis deputatus est. Etenim ea quae sunt de me finem habent."
      en: "For I say to you, that this that is written must yet be fulfilled in me: And with the wicked was he reckoned. For the things concerning me have an end."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "At illi dixerunt: Domine, ecce duo gladii hic. At ille dixit eis: Satis est."
      en: "But they said: Lord, behold here are two swords. And he said to them, It is enough."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et egressus ibat secundum consuetudinem in monte Olivarum. Secuti sunt autem illum et discipuli."
      en: "And going out, he went, according to his custom, to the mount of Olives. And his disciples also followed him."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et cum pervenisset ad locum, dixit illis: Orate ne intretis in tentationem."
      en: "And when he was come to the place, he said to them: Pray, lest ye enter into temptation."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et ipse avulsus est ab eis quantum jactus est lapidis: et positis genibus orabat,"
      en: "And he was withdrawn away from them a stone's cast; and kneeling down, he prayed,"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "dicens: Pater, si vis, transfer calicem istum a me: verumtamen non mea voluntas, sed tua fiat."
      en: "Saying: Father, if thou wilt, remove this chalice from me: but yet not my will, but thine be done."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Apparuit autem illi angelus de caelo, confortans eum. Et factus in agonia, prolixius orabat."
      en: "And there appeared to him an angel from heaven, strengthening him. And being in an agony, he prayed the longer."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Et factus est sudor ejus sicut guttae sanguinis decurrentis in terram."
      en: "And his sweat became as drops of blood, trickling down upon the ground."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Et cum surrexisset ab oratione et venisset ad discipulos suos, invenit eos dormientes prae tristitia."
      en: "And when he rose up from prayer, and was come to his disciples, he found them sleeping for sorrow."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Et ait illis: Quid dormitis? surgite, orate, ne intretis in tentationem."
      en: "And he said to them: Why sleep you? arise, pray, lest you enter into temptation."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Adhuc eo loquente, ecce turba: et qui vocabatur Judas, unus de duodecim, antecedebat eos, et appropinquavit Jesu ut oscularetur eum."
      en: "As he was yet speaking, behold a multitude; and he that was called Judas, one of the twelve, went before them, and drew near to Jesus, for to kiss him."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Jesus autem dixit illi: Juda, osculo Filium hominis tradis?"
      en: "And Jesus said to him: Judas, dost thou betray the Son of man with a kiss?"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Videntes autem hi qui circa ipsum erant, quod futurum erat, dixerunt ei: Domine, si percutimus in gladio?"
      en: "And they that were about him, seeing what would follow, said to him: Lord, shall we strike with the sword?"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Et percussit unus ex illis servum principis sacerdotum, et amputavit auriculam ejus dexteram."
      en: "And one of them struck the servant of the high priest, and cut off his right ear."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Respondens autem Jesus, ait: Sinite usque huc. Et cum tetigisset auriculam ejus, sanavit eum."
      en: "But Jesus answering, said: Suffer ye thus far. And when he had touched his ear, he healed him."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Dixit autem Jesus ad eos qui venerant ad se principes sacerdotum, et magistratus templi, et seniores: Quasi ad latronem existis cum gladiis et fustibus?"
      en: "And Jesus said to the chief priests, and magistrates of the temple, and the ancients, that were come unto him: Are ye come out, as it were against a thief, with swords and clubs?"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Cum quotidie vobiscum fuerim in templo, non extendistis manus in me: sed haec est hora vestra, et potestas tenebrarum."
      en: "When I was daily with you in the temple, you did not stretch forth your hands against me: but this is your hour, and the power of darkness."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Comprehendentes autem eum, duxerunt ad domum principis sacerdotum: Petrus vero sequebatur a longe."
      en: "And apprehending him, they led him to the high priest's house. But Peter followed afar off."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Accenso autem igne in medio atrii et circumsedentibus illis, erat Petrus in medio eorum."
      en: "And when they had kindled a fire in the midst of the hall, and were sitting about it, Peter was in the midst of them."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Quem cum vidisset ancilla quaedam sedentem ad lumen, et eum fuisset intuita, dixit: Et hic cum illo erat."
      en: "Whom when a certain servant maid had seen sitting at the light, and had earnestly beheld him, she said: This man also was with him."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "At ille negavit eum, dicens: Mulier, non novi illum."
      en: "But he denied him, saying: Woman, I know him not."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Et post pusillum alius videns eum, dixit: Et tu de illis es. Petrus vero ait: O homo, non sum."
      en: "And after a little while, another seeing him, said: Thou also art one of them. But Peter said: O man, I am not."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Et intervallo facto quasi horae unius, alius quidam affirmabat, dicens: Vere et hic cum illo erat: nam et Galilaeus est."
      en: "And after the space, as it were of one hour, another certain man affirmed, saying: Of a truth, this man was also with him; for he is also a Galilean."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "Et ait Petrus: Homo, nescio quid dicis. Et continuo, adhuc illo loquente, cantavit gallus."
      en: "And Peter said: Man, I know not what thou sayest. And immediately, as he was yet speaking, the cock crew."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "Et conversus Dominus respexit Petrum, et recordatus est Petrus verbi Domini, sicut dixerat: Quia priusquam gallus cantet, ter me negabis."
      en: "And the Lord turning looked on Peter. And Peter remembered the word of the Lord, as he had said: Before the cock crow, thou shalt deny me thrice."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "Et egressus foras Petrus flevit amare."
      en: "And Peter going out, wept bitterly."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "Et viri qui tenebant illum, illudebant ei, caedentes."
      en: "And the men that held him, mocked him, and struck him."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "Et velaverunt eum, et percutiebant faciem ejus: et interrogabant eum, dicentes: Prophetiza, quis est, qui te percussit?"
      en: "And they blindfolded him, and smote his face. And they asked him, saying: Prophesy, who is it that struck thee?"
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "Et alia multa blasphemantes dicebant in eum."
      en: "And blaspheming, many other things they said against him."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "Et ut factus est dies, convenerunt seniores plebis, et principes sacerdotum, et scribae, et duxerunt illum in concilium suum, dicentes: Si tu es Christus, dic nobis."
      en: "And as soon as it was day, the ancients of the people, and the chief priests and scribes, came together; and they brought him into their council, saying: If thou be the Christ, tell us."
    status: { la: verified, en: verified }
  - n: 67
    text:
      la: "Et ait illis: Si vobis dixero, non credetis mihi:"
      en: "And he saith to them: If I shall tell you, you will not believe me."
    status: { la: verified, en: verified }
  - n: 68
    text:
      la: "si autem et interrogavero, non respondebitis mihi, neque dimittetis."
      en: "And if I shall also ask you, you will not answer me, nor let me go."
    status: { la: verified, en: verified }
  - n: 69
    text:
      la: "Ex hoc autem erit Filius hominis sedens a dextris virtutis Dei."
      en: "But hereafter the Son of man shall be sitting on the right hand of the power of God."
    status: { la: verified, en: verified }
  - n: 70
    text:
      la: "Dixerunt autem omnes: Tu ergo es Filius Dei? Qui ait: Vos dicitis, quia ego sum."
      en: "Then said they all: Art thou then the Son of God? Who said: You say that I am."
    status: { la: verified, en: verified }
  - n: 71
    text:
      la: "At illi dixerunt: Quid adhuc desideramus testimonium? ipsi enim audivimus de ore ejus."
      en: "And they said: What need we any further testimony? for we ourselves have heard it from his own mouth."
    status: { la: verified, en: verified }
