book: jon
chapter: 1
verses:
  - n: 1
    text:
      la: "et factum est verbum Domini ad Ionam filium Amathi dicens"
      en: "Now the word of the Lord came to Jonas the son of Amathi, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "surge vade in Nineven civitatem grandem et praedica in ea quia ascendit malitia eius coram me"
      en: "Arise, and go to Ninive the great city, and preach in it: for the wickedness thereof is come up before me."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et surrexit Iona ut fugeret in Tharsis a facie Domini et descendit Ioppen et invenit navem euntem in Tharsis et dedit naulum eius et descendit in eam ut iret cum eis in Tharsis a facie Domini"
      en: "And Jonas rose up to flee into Tharsis from the face of the Lord, and he went down to Joppe, and found a ship going to Tharsis: and he paid the fare thereof, and went down into it, to go with them to Tharsis from the face of the Lord."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dominus autem misit ventum magnum in mari et facta est tempestas magna in mari et navis periclitabatur conteri"
      en: "But the Lord sent a great wind into the sea: and a great tempest was raised in the sea, and the ship was in danger to be broken."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et timuerunt nautae et clamaverunt viri ad deum suum et miserunt vasa quae erant in navi in mare ut adleviaretur ab eis et Iona descendit ad interiora navis et dormiebat sopore gravi"
      en: "And the mariners were afraid, and the men cried to their god: and they cast forth the wares that were in the ship, into the sea, to lighten it of them: and Jones went down into the inner part of the ship, and fell into a deep sleep."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et accessit ad eum gubernator et dixit ei quid tu sopore deprimeris surge invoca Deum tuum si forte recogitet Deus de nobis et non pereamus"
      en: "And the shipmaster came to him, and said to him: Why art thou fast asleep? rise up, call upon thy God, if so be that God will think of us, that we may not perish."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et dixit vir ad collegam suum venite et mittamus sortes et sciamus quare hoc malum sit nobis et miserunt sortes et cecidit sors super Ionam"
      en: "And they said every one to his fellow: Come, and let us cast lots, that we may know why this evil is upon us. And they cast lots, and the lot fell upon Jonas."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et dixerunt ad eum indica nobis cuius causa malum istud sit nobis quod est opus tuum quae terra tua et quo vel ex quo populo es tu"
      en: "And they said to him: Tell us for what cause this evil is upon us, what is thy business? of what country art thou? and whither goest thou? or of what people art thou?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dixit ad eos Hebraeus ego sum et Dominum Deum caeli ego timeo qui fecit mare et aridam"
      en: "And he said to them: I am a Hebrew, and I fear the Lord the God of heaven, who made both the sea and the dry land."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et timuerunt viri timore magno et dixerunt ad eum quid hoc fecisti cognoverunt enim viri quod a facie Domini fugeret quia indicaverat eis"
      en: "And the men were greatly afraid, and they said to him: Why hast thou done this? (for the men knew that he fled from the face of the Lord: because he had told them.)"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dixerunt ad eum quid faciemus tibi et cessabit mare a nobis quia mare ibat et intumescebat"
      en: "And they said to him: What shall we do to thee, that the sea may be calm to us? for the sea flowed and swelled."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et dixit ad eos tollite me et mittite in mare et cessabit mare a vobis scio enim ego quoniam propter me tempestas grandis haec super vos"
      en: "And he said to them: Take me up, and cast me into the sea, and the sea shall be calm to you: for I know that for my sake this great tempest is upon you."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et remigabant viri ut reverterentur ad aridam et non valebant quia mare ibat et intumescebat super eos"
      en: "And the men rowed hard to return to land, but they were not able: because the sea tossed and swelled upon them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et clamaverunt ad Dominum et dixerunt quaesumus Domine ne pereamus in anima viri istius et ne des super nos sanguinem innocentem quia tu Domine sicut voluisti fecisti"
      en: "And they cried to the Lord, and said: We beseech thee, O Lord, let us not perish for this man's life, and lay not upon us innocent blood: for thou, O Lord, hast done as it pleased thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et tulerunt Ionam et miserunt in mare et stetit mare a fervore suo"
      en: "And they took Jonas, and cast him into the sea, and the sea ceased from raging."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et timuerunt viri timore magno Dominum et immolaverunt hostias Domino et voverunt vota"
      en: "And the men feared the Lord exceedingly, and sacrificed victims to the Lord, and made vows."
    status: { la: verified, en: verified }
