# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 25
verses:
  - n: 1
    text:
      la: "Viginti quinque annorum erat Amasias cum regnare coepisset, et viginti novem annis regnavit in Jerusalem: nomen matris ejus Joadan de Jerusalem."
      en: "Amasias was five and twenty years old when he began to reign, and he reigned nine and twenty years in Jerusalem, the name of his mother was Joadan of Jerusalem."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fecitque bonum in conspectu Domini: verumtamen non in corde perfecto."
      en: "And he did what was good in the sight of the Lord: but yet not with a perfect heart."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cumque roboratum sibi videret imperium, jugulavit servos, qui occiderant regem patrem suum,"
      en: "And when he saw himself strengthened in his kingdom, he put to death the servants that had slain the king his father."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sed filios eorum non interfecit, sicut scriptum est in libro legis Moysi, ubi praecepit Dominus, dicens: Non occidentur patres pro filiis, neque filii pro patribus suis, sed unusquisque in suo peccato morietur."
      en: "But he slew not their children, as it is written in the book of the law of Moses, where the Lord commanded, saying: The fathers shall not be slain for the children, nor the children for their fathers, but every man shall die for his own sin."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Congregavit igitur Amasias Judam, et constituit eos per familias, tribunosque et centuriones in universo Juda et Benjamin: et recensuit a viginti annis supra, invenitque trecenta millia juvenum, qui egrederentur ad pugnam, et tenerent hastam et clypeum:"
      en: "Amasias therefore gathered Juda together, and appointed them by families, and captains of thousands and of hundreds in all Juda, and Benjamin: and he numbered them from twenty years old and upwards, and found three hundred thousand young men that could go out to battle, and could hold the spear and shield."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "mercede quoque conduxit de Israel centum millia robustorum, centum talentis argenti."
      en: "He hired also of Israel a hundred thousand valiant men, for a hundred talents of silver."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Venit autem homo Dei ad illum, et ait: O rex, ne egrediatur tecum exercitus Israel: non est enim Dominus cum Israel, et cunctis filiis Ephraim:"
      en: "But a man of God came to him, and said: O king, let not the army of Israel go out with thee, for the Lord is not with Israel, and all the children of Ephraim:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quod si putas in robore exercitus bella consistere, superari te faciet Deus ab hostibus: Dei quippe est et adjuvare, et in fugam convertere."
      en: "And if thou think that battles consist in the strength of the army, God will make thee to be overcome by the enemies: for it belongeth to God both to help, and to put to flight."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dixitque Amasias ad hominem Dei: Quid ergo fiet de centum talentis, quae dedi militibus Israel? Et respondit ei homo Dei: Habet Dominus unde tibi dare possit multo his plura."
      en: "And Amasias said to the man of God: What will then become of the hundred talents which I have given to the soldiers of Israeli and the man of God answered him: The Lord is rich enough to be able to give thee much more than this."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Separavit itaque Amasias exercitum, qui venerat ad eum ex Ephraim, ut reverteretur in locum suum: at illi contra Judam vehementer irati, reversi sunt in regionem suam."
      en: "Then Amasias separated the army, that came to him out of Ephraim, to go home again: but they being much enraged against Juda, returned to their own country."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Porro Amasias confidenter eduxit populum suum, et abiit in vallem Salinarum, percussitque filios Seir decem millia:"
      en: "And Amasias taking courage led forth his people, and went to the vale of saltpits, and slew of the children of Seir ten thousand."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et alia decem millia virorum ceperunt filii Juda, et adduxerunt ad praeruptum cujusdam petrae, praecipitaveruntque eos de summo in praeceps, qui universi crepuerunt."
      en: "And other ten thousand men the sons of Juda took, and brought to the steep of a certain rock, and cast them down headlong from the top, and they all were broken to pieces."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "At ille exercitus, quem remiserat Amasias ne secum iret ad praelium, diffusus est in civitatibus Juda a Samaria usque ad Bethoron, et interfectis tribus millibus, diripuit praedam magnam."
      en: "But that army which Amasias had sent back, that they should not go with him to battle, spread themselves among the cities of Juda, from Samaria to Beth-horon, and having killed three thousand took away much spoil."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Amasias vero post caedem Idumaeorum, et allatos deos filiorum Seir, statuit illos in deos sibi, et adorabat eos, et illis adolebat incensum."
      en: "But Amasias after he had slain the Edomites, set up the gods of the children of Seir, which he had brought thence, to be his gods, and adored them, and burnt incense to them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quam ob rem iratus Dominus contra Amasiam misit ad illum prophetam, qui diceret ei: Cur adorasti deos, qui non liberaverunt populum suum de manu tua?"
      en: "Wherefore the Lord being angry against Amasias, sent a prophet to him, to say to him: Why hast thou adored gods that have not delivered their own people out of thy hand?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cumque haec ille loqueretur, respondit ei: Num consiliarius regis es? quiesce, ne interficiam te. Discedensque propheta, Scio, inquit, quod cogitaverit Deus occidere te, quia fecisti hoc malum, et insuper non acquievisti consilio meo."
      en: "And when he spoke these things, he answered him: Art thou the king's counsellor? be quiet, lest I kill thee. And the prophet departing, said: I know that God is minded to kill thee, because thou hast done this evil, and moreover hast not hearkened to my counsel."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Igitur Amasias rex Juda inito pessimo consilio, misit ad Joas filium Joachaz filii Jehu, regem Israel, dicens: Veni, videamus nos mutuo."
      en: "Then Amasias king of Juda taking very bad counsel, sent to Joas the son of Joachaz the son of Jehu, king of Israel, saying: Come, let us see one another."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "At ille remisit nuntios, dicens: Carduus, qui est in Libano, misit ad cedrum Libani, dicens: Da filiam tuam filio meo uxorem: et ecce bestiae, quae erant in silva Libani, transierunt, et conculcaverunt carduum."
      en: "But he sent back the messengers, saying: The thistle that is in Libanus, sent to the cedar in Libanus, saying: Give thy daughter to my son to wife: and behold the beasts that were in the wood of Libanus passed by, and trod down the thistle."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dixisti: Percussi Edom, et idcirco erigitur cor tuum in superbiam: sede in domo tua: cur malum adversum te provocas, ut cadas et tu, et Juda tecum?"
      en: "Thou hast said: I have overthrown Edom, and therefore thy heart is lifted up with pride: stay at home, why dost thou provoke evil against thee, that both thou shouldst fall and Juda with thee."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Noluit audire Amasias, eo quod Domini esset voluntas ut traderetur in manus hostium propter deos Edom."
      en: "Amasias would not hearken to him, because it was the Lord's will that he should be delivered into the hands of enemies, because of the gods of Edom."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Ascendit igitur Joas rex Israel, et mutuos sibi praebuere conspectus: Amasias autem rex Juda erat in Bethsames Juda:"
      en: "So Joas king of Israel went up, and they presented themselves to be seen by one another: and Amasias king of Juda was in Bethsames of Juda:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "corruitque Juda coram Israel, et fugit in tabernacula sua."
      en: "And Juda fell before Israel and they fled to their dwellings."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Porro Amasiam regem Juda, filium Joas filii Joachaz, cepit Joas rex Israel in Bethsames, et adduxit in Jerusalem: destruxitque murum ejus a porta Ephraim usque ad portam anguli quadringentis cubitis."
      en: "And Joas king of Israel took Amasias king of Juda, the son of Joas, the son Joachaz, in Bethsames, and brought him to Jerusalem: and broke down the walls thereof from the gate of Ephraim, to the gate of the corner, four hundred cubits."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Omne quoque aurum, et argentum, et universa vasa, quae repererat in domo Dei, et apud Obededom in thesauris etiam domus regiae, necnon et filios obsidum, reduxit in Samariam."
      en: "And he took all the gold, and silver, and all the vessels, that he found in the house of God, and with Obededom, and in the treasures of the king's house, moreover also the sons of the hostages, he brought back to Samaria."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Vixit autem Amasias filius Joas rex Juda, postquam mortuus est Joas filius Joachaz rex Israel, quindecim annis."
      en: "And Amasias the son of Joas king of Juda lived, after the death of Joas the son of Joachaz king of Israel, fifteen years."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Reliqua autem sermonum Amasiae priorum et novissimorum scripta sunt in libro regum Juda et Israel."
      en: "Now the rest of the acts of Amasias, the first and last, are written in the book of the kings of Juda and Israel."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Qui postquam recessit a Domino, tetenderunt ei insidias in Jerusalem. Cumque fugisset in Lachis, miserunt, et interfecerunt eum ibi."
      en: "And after he revolted from the Lord, they made a conspiracy against him in Jerusalem. And he fled into Lachis, and they sent, and killed him there."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Reportantesque super equos, sepelierunt eum cum patribus suis in civitate David."
      en: "And they brought him back upon horses, and buried him with his fathers in the city of David."
    status: { la: verified, en: verified }
