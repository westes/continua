# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: num
chapter: 22
verses:
  - n: 1
    text:
      la: "profectique castrametati sunt in campestribus Moab ubi trans Iordanem Hierichus sita est"
      en: "And they went forward and encamped in the plains of Moab, over against where Jericho is situate beyond the Jordan."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "videns autem Balac filius Sepphor omnia quae fecerat Israhel Amorreo"
      en: "And Balac the son of Sephor, seeing all that Israel had done to the Amorrhite,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et quod pertimuissent eum Moabitae et impetum eius ferre non possent"
      en: "And that the Moabites were in great fear of him, and were not able to sustain his assault,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dixit ad maiores natu Madian ita delebit hic populus omnes qui in nostris finibus commorantur quomodo solet bos herbas usque ad radices carpere ipse erat eo tempore rex in Moab"
      en: "He said to the elders of Madian: So will this people destroy all that dwell in our borders, as the ox is wont to eat the grass to the very roots. Now he was at that time king in Moab."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "misit ergo nuntios ad Balaam filium Beor ariolum qui habitabat super flumen terrae filiorum Ammon ut vocarent eum et dicerent ecce egressus est populus ex Aegypto qui operuit superficiem terrae sedens contra me"
      en: "He sent therefore messengers to Balaam the son of Beer, a soothsayer, who dwelt by the river of the land of the children of Ammon, to call him, and to say: Behold a people is come out of Egypt, that hath covered the face of the earth, sitting over against me."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "veni igitur et maledic populo huic quia fortior me est si quo modo possim percutere et eicere eum de terra mea novi enim quod benedictus sit cui benedixeris et maledictus in quem maledicta congesseris"
      en: "Come therefore, and curse this people, because it is mightier than I: if by any means I may beat them and drive them out of my land: for I know that he whom thou shalt bless is blessed, and he whom thou shalt curse is cursed."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "perrexerunt seniores Moab et maiores natu Madian habentes divinationis pretium in manibus cumque venissent ad Balaam et narrassent ei omnia verba Balac"
      en: "And the ancients of Moab, and the elders of Madian, went with the price of divination in their hands. And when they were come to Balaam, and had told him all the words of Balac:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ille respondit manete hic nocte et respondebo quicquid mihi dixerit Dominus manentibus illis apud Balaam venit Deus et ait ad eum"
      en: "He answered: Tarry here this night, and I will answer whatsoever the Lord shall say to me. And while they stayed with Balaam, God came and said to him:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quid sibi volunt homines isti apud te"
      en: "What mean these men that are with thee?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "respondit Balac filius Sepphor rex Moabitarum misit ad me"
      en: "He answered: Balac the son of Sephor king of the Moabites hath sent to me,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dicens ecce populus qui egressus est de Aegypto operuit superficiem terrae veni et maledic ei si quo modo possim pugnans abicere eum"
      en: "Saying: Behold a people that is come out of Egypt, hath covered the face of the land: come and curse them, if by any means I may fight with them and drive them away."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dixitque Deus ad Balaam noli ire cum eis neque maledicas populo quia benedictus est"
      en: "And God said to Balaam : Thou shalt not go with them, nor shalt thou curse the people: because it is blessed."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui mane consurgens dixit ad principes ite in terram vestram quia prohibuit me Deus venire vobiscum"
      en: "And he rose in the morning and said to the princes: Go into your country, because the Lord hath forbid me to come with you."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "reversi principes dixerunt ad Balac noluit Balaam venire nobiscum"
      en: "The princes returning, said to Balac: Balaam would not come with us."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "rursum ille multo plures et nobiliores quam ante miserat misit"
      en: "Then he sent many more and more noble than he had sent before:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "qui cum venissent ad Balaam dixerunt sic dicit Balac filius Sepphor ne cuncteris venire ad me"
      en: "Who, when they were come to Balaam, said: Thus saith Balac the son of Sephor, Delay not to come to me:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "paratum honorare te et quicquid volueris dare veni et maledic populo isti"
      en: "For I am ready to honour thee, and will give thee whatsoever thou wilt: come and curse this people."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "respondit Balaam si dederit mihi Balac plenam domum suam argenti et auri non potero inmutare verbum Domini Dei mei ut vel plus vel minus loquar"
      en: "Balaam answered: If Balac would give me his house full of silver and gold, I cannot alter the word of the Lord my God, to speak either more or less."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "obsecro ut hic maneatis etiam hac nocte et scire queam quid mihi rursum respondeat Dominus"
      en: "I pray you to stay here this night also, that I may know what the Lord will answer me once more."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "venit ergo Deus ad Balaam nocte et ait ei si vocare te venerunt homines isti surge et vade cum eis ita dumtaxat ut quod tibi praecepero facias"
      en: "God therefore came to Balaam in the night, and said to him: It these men be come to call thee, arise and go with them: yet so, that thou do what I shall command thee."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "surrexit Balaam mane et strata asina profectus est cum eis"
      en: "Balaam arose in the morning, and saddling his ass went with them."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et iratus est Deus stetitque angelus Domini in via contra Balaam qui sedebat asinae et duos pueros habebat secum"
      en: "And God was angry. And an angel of the Lord stood in the way against Balaam, who sat on the ass, and had two servants with him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "cernens asina angelum stantem in via evaginato gladio avertit se de itinere et ibat per agrum quam cum verberaret Balaam et vellet ad semitam reducere"
      en: "The ass seeing the angel standing in the way, with a drawn sword, turned herself out of the way, and went into the field. And when Balaam beat her, and had a mind to bring her again to the way,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "stetit angelus in angustiis duarum maceriarum quibus vineae cingebantur"
      en: "The angel stood in a narrow place between two walls, wherewith the vineyards were enclosed."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quem videns asina iunxit se parieti et adtrivit sedentis pedem at ille iterum verberabat"
      en: "And the ass seeing him, thrust herself close to the wall, and bruised the foot of the rider. But he beat her again:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et nihilominus angelus ad locum angustum transiens ubi nec ad dextram nec ad sinistram poterat deviari obvius stetit"
      en: "And nevertheless the angel going on to a narrow place, where there was no way to turn aside either to the right hand or to the left, stood to meet him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "cumque vidisset asina stantem angelum concidit sub pedibus sedentis qui iratus vehementius caedebat fuste latera"
      en: "And when the ass saw the angel standing, she fell under the feet of the rider: who being angry beat her sides more vehemently with a staff."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "aperuitque Dominus os asinae et locuta est quid feci tibi cur percutis me ecce iam tertio"
      en: "And the Lord opened the mouth of the ass, and she said: What have I done to thee? Why strikest thou me, lo, now this third time?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "respondit Balaam quia commeruisti et inlusisti mihi utinam haberem gladium ut te percuterem"
      en: "Balaam answered: Because thou hast deserved it, and hast served me ill: I would I had a sword that I might kill thee."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "dixit asina nonne animal tuum sum cui semper sedere consuesti usque in praesentem diem dic quid simile umquam fecerim tibi at ille ait numquam"
      en: "The ass said: Am not I thy beast, on which thou hast been always accustomed to ride until this present day? tell me if I ever did the like thing to thee. But he said: Never."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "protinus aperuit Dominus oculos Balaam et vidit angelum stantem in via evaginato gladio adoravitque eum pronus in terram"
      en: "Forthwith the Lord opened the eyes of Balaam, and he saw the angel standing in the way with a drawn sword, and he worshipped him falling flat on the ground."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "cui angelus cur inquit tertio verberas asinam tuam ego veni ut adversarer tibi quia perversa est via tua mihique contraria"
      en: "And the angel said to him: Why beatest thou thy ass these three times? I am come to withstand thee, because thy way is perverse, and contrary to me:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et nisi asina declinasset de via dans locum resistenti te occidissem et illa viveret"
      en: "And unless the ass had turned out of the way, giving place to me who stood against thee, I had slain thee, and she should have lived."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "dixit Balaam peccavi nesciens quod tu stares contra me et nunc si displicet tibi ut vadam revertar"
      en: "Balaam said: I have sinned, not knowing that thou didst stand against me: and now if it displease thee that I go, I will return."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "ait angelus vade cum istis et cave ne aliud quam praecepero tibi loquaris ivit igitur cum principibus"
      en: "The angel said: Go with these men, and see thou speak no other thing than what I shall command thee. He went therefore with the princes."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "quod cum audisset Balac egressus est in occursum eius in oppido Moabitarum quod situm est in extremis finibus Arnon"
      en: "And when Balac heard it he came forth to meet him in a town of the Moabites, that is situate in the uttermost borders of Arnon."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "dixitque ad Balaam misi nuntios ut vocarent te cur non statim venisti ad me an quia mercedem adventui tuo reddere nequeo"
      en: "And he said to Balaam: I sent messengers to call thee, why didst thou not come immediately to me? was it because I am not able to reward thy coming?"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "cui ille respondit ecce adsum numquid loqui potero aliud nisi quod Deus posuerit in ore meo"
      en: "He answered him: Lo, here I am: shall I have power to speak any other thing but that which God shall put in my mouth?"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "perrexerunt ergo simul et venerunt in urbem quae in extremis regni eius finibus erat"
      en: "So they went on together, and came into a city, that was in the uttermost borders of his kingdom."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "cumque occidisset Balac boves et oves misit ad Balaam et principes qui cum eo erant munera"
      en: "And when Balac had killed oxen and sheep, he sent presents to Balaam, and to the princes that were with him."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "mane autem facto duxit eum ad excelsa Baal et intuitus est extremam partem populi"
      en: "And when morning was come, he brought him to the high places of Baal, and he beheld the uttermost part of the people."
    status: { la: verified, en: verified }
