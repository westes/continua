# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 4reg
chapter: 22
verses:
  - n: 1
    text:
      la: "octo annorum erat Iosias cum regnare coepisset et triginta uno anno regnavit in Hierusalem nomen matris eius Idida filia Phadaia de Besecath"
      en: "Josias was eight years old when he began to reign: he reigned one and thirty years in Jerusalem: the name of his mother was Idida, the daughter of Hadaia, of Besecath."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fecitque quod placitum erat coram Domino et ambulavit per omnes vias David patris sui non declinavit ad dextram sive ad sinistram"
      en: "And he did that which was right in the sight of the Lord, and walked in all the ways of David his father: he turned not aside to the right hand, or to the left."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "anno autem octavodecimo regis Iosiae misit rex Saphan filium Aslia filii Mesullam scribam templi Domini dicens ei"
      en: "And in the eighteenth year of b king Josias, the king sent Saphan the son of Assia, the son of Messulam, the scribe of the temple of the Lord, saying to him:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "vade ad Helciam sacerdotem magnum ut confletur pecunia quae inlata est in templum Domini quam collegerunt ianitores a populo"
      en: "Go to Helcias the high priest, that the money may be put together which is brought into the temple of the Lord, which the doorkeepers of the temple have gathered of the people."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "deturque fabris per praepositos in domo Domini qui et distribuent eam his qui operantur in templo Domini ad instauranda sarta tecta templi"
      en: "And let it be given to the workmen by the overseers of the house of the Lord: and lot them distribute it to those that work in the temple of the Lord, to repair the temple:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "tignariis videlicet et cementariis et his qui interrupta conponunt et ut emantur ligna et lapides de lapidicinis ad instaurandum templum"
      en: "That is, to carpenters and masons, and to such as mend breaches: and that timber may be bought, and stones out of the quarries, to repair the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "verumtamen non supputetur eis argentum quod accipiunt sed in potestate habeant et in fide"
      en: "But let there be no reckoning made with them of the money which they receive, but let them have it in their power, and in their trust."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixit autem Helcias pontifex ad Saphan scribam librum legis repperi in domo Domini deditque Helcias volumen Saphan qui et legit illud"
      en: "And Helcias the high priest said to Saphan the scribe: I have found the book of the law in the house of the Lord: and Helcias gave the book to Saphan, and he read it."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "venit quoque Saphan scriba ad regem et renuntiavit ei quod praeceperat et ait conflaverunt servi tui pecuniam quae repperta est in domo Domini et dederunt ut distribueretur fabris a praefectis operum templi Domini"
      en: "And Saphan the scribe came to the king, and brought him word again concerning that which he had commanded, and said: Thy servants have gathered together the money that was found in the house of the Lord, and they have given it to be distributed to the workmen, by the overseers of the works of the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "narravitque Saphan scriba regi dicens librum dedit mihi Helcias sacerdos quem cum legisset Saphan coram rege"
      en: "And Saphan the scribe told the king, saying: Helcias the priest hath delivered to me a book. And when Saphan had read it before the king,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et audisset rex verba libri legis Domini scidit vestimenta sua"
      en: "And the king had heard the words of the law of the Lord, he rent his garments."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et praecepit Helciae sacerdoti et Ahicham filio Saphan et Achobor filio Micha et Saphan scribae et Asaiae servo regis dicens"
      en: "And he commanded Helcias the priest, and Ahicam the son of Saphan, and Achobor the son of Micha, and Saphan the scribe, and Asaia the king's servant, saying:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ite et consulite Dominum super me et super populo et super omni Iuda de verbis voluminis istius quod inventum est magna enim ira Domini succensa est contra nos quia non audierunt patres nostri verba libri huius ut facerent omne quod scriptum est nobis"
      en: "Go and consult the Lord for me, and for the people, and for all Juda, concerning the words of this book which is found: for the great wrath of the Lord is kindled against us, because our fathers have not hearkened to the words of this book, to do all that is written for us."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ierunt itaque Helcias sacerdos et Ahicham et Achobor et Saphan et Asaia ad Oldam propheten uxorem Sellum filii Thecue filii Araas custodis vestium quae habitabat in Hierusalem in secunda locutique sunt ad eam"
      en: "So Helcias the priest, and Ahicam, and Achobor, and Saphan, and Asaia went to Holda the prophetess the wife of Sellum the son of Thecua, the son of Araas keeper of the wardrobe, who dwelt in Jerusalem in the Second: and they spoke to her."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et illa respondit eis haec dicit Dominus Deus Israhel dicite viro qui misit vos ad me"
      en: "And she said to them: Thus saith the Lord the God of Israel: Tell the man that sent you to me:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "haec dicit Dominus ecce ego adducam mala super locum hunc et super habitatores eius omnia verba legis quae legit rex Iuda"
      en: "Thus saith the Lord: Behold, I will bring evils upon this place, and upon the inhabitants thereof, all the words of the law which the king of Juda hath read:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quia dereliquerunt me et sacrificaverunt diis alienis inritantes me in cunctis operibus manuum suarum et succendetur indignatio mea in loco hoc et non extinguetur"
      en: "Because they have forsaken me, and have sacrificed to strange gods, provoking me by all the works of their hands: therefore my indignation shall be kindled against this place, and shall not be quenched."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "regi autem Iuda qui misit vos ut consuleretis Dominum sic dicetis haec dicit Dominus Deus Israhel pro eo quod audisti verba voluminis"
      en: "But to the king of Juda, who sent you to consult the Lord, thus shall you say: Thus saith the Lord the God of Israel: Forasmuch as thou hast heard the words of the book,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et perterritum est cor tuum et humiliatus es coram Domino auditis sermonibus contra locum istum et habitatores eius quo videlicet fierent in stuporem et in maledictum et scidisti vestimenta tua et flevisti coram me et ego audivi ait Dominus"
      en: "And thy heart hath been moved to fear, and thou hast humbled thyself before the Lord, hearing the words against this place, and the inhabitants thereof, to wit, that they should become a wonder and a curse: and thou hast rent thy garments, and wept before me, I also have heard thee, saith the Lord:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "idcirco colligam te ad patres tuos et colligeris ad sepulchrum tuum in pace ut non videant oculi tui omnia mala quae inducturus sum super locum istum"
      en: "Therefore I will gather thee to thy fathers, and thou shalt be gathered to thy sepulchre in peace, that thy eyes may not see all the evils which I will bring; upon this place."
    status: { la: verified, en: verified }
