# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: esth
chapter: 1
verses:
  - n: 1
    text:
      la: "in diebus Asueri qui regnavit ab India usque Aethiopiam super centum viginti septem provincias"
      en: "In the days of Assuerus, who reigned from India to Ethiopia over a hundred and twenty-seven provinces:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quando sedit in solio regni sui Susa civitas regni eius exordium fuit"
      en: "When he sat on the throne of his kingdom, the city Susan was the capital of his kingdom."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "tertio igitur anno imperii sui fecit grande convivium cunctis principibus et pueris suis fortissimis Persarum et Medorum inclitis et praefectis provinciarum coram se"
      en: "Now in the third year of his reign he made a great feast for all the princes, and for his servants, for the most mighty of the Persians, and the nobles of the Medes, and the governors of the provinces in his sight,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ut ostenderet divitias gloriae regni sui ac magnitudinem atque iactantiam potentiae suae multo tempore centum videlicet et octoginta diebus"
      en: "That he might shew the riches of the glory of his kingdom, and the greatness, and boasting of his power, for a long time, to wit, for a hundred and fourscore days."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cumque implerentur dies convivii invitavit omnem populum qui inventus est Susis a maximo usque ad minimum et septem diebus iussit convivium praeparari in vestibulo horti et nemoris quod regio cultu et manu consitum erat"
      en: "And when the days of the feast were expired, he invited all the people that were found in Susan, from the greatest to the least: and commanded a feast to be made seven days in the court of the garden, and of the wood, which was planted by the care and the hand of the king."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et pendebant ex omni parte tentoria aerii coloris et carpasini et hyacinthini sustentata funibus byssinis atque purpureis qui eburneis circulis inserti erant et columnis marmoreis fulciebantur lectuli quoque aurei et argentei super pavimentum zmaragdino et pario stratum lapide dispositi erant quod mira varietate pictura decorabat"
      en: "And there were hung up on every side sky coloured, and green, and violet hangings, fastened with cords of silk, and of purple, which were put into rings of ivory, and were held up with marble pillars. The beds also were of gold and silver, placed in order upon a floor paved with porphyry and white marble: which was embellished with painting of wonderful variety."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "bibebant autem qui invitati erant aureis poculis et aliis atque aliis vasis cibi inferebantur vinum quoque ut magnificentia regia dignum erat abundans et praecipuum ponebatur"
      en: "And they that were invited, drank in golden cups, and the meats were brought in divers vessels one after another. Wine also in abundance and of the best was presented, as was worthy of a king's magnificence."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "nec erat qui nolentes cogeret ad bibendum sed sic rex statuerat praeponens mensis singulos de principibus suis ut sumeret unusquisque quod vellet"
      en: "Neither was there any one to compel them to drink that were not willing, but as the king had appointed, who set over every table one of his nobles, that every man might take what he would."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Vasthi quoque regina fecit convivium feminarum in palatio ubi rex Asuerus manere consueverat"
      en: "Also Vasthi the queen made a feast for the women in the palace, where king Assuerus was used to dwell."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "itaque die septimo cum rex esset hilarior et post nimiam potionem incaluisset mero praecepit Mauman et Bazatha et Arbona et Bagatha et Abgatha et Zarath et Charchas septem eunuchis qui in conspectu eius ministrabant"
      en: "Now on the seventh day, when the king was merry, and after very much drinking was well warmed with wine, he commanded Mauman, and Bazatha, and Harbona, and Bagatha, and Abgatha, and Zethar, and Charcas, the seven eunuchs that served in his presence,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ut introducerent reginam Vasthi coram rege posito super caput eius diademate et ostenderet cunctis populis et principibus illius pulchritudinem erat enim pulchra valde"
      en: "To bring in queen Vasthi before the king, with the crown set upon her head, to shew her beauty to all the people and the princes: for she was exceeding beautiful."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quae rennuit et ad regis imperium quod per eunuchos mandaverat venire contempsit unde iratus rex et nimio furore succensus"
      en: "But she refused, and would not come at the king's commandment, which he had signified to her by the eunuchs. Whereupon the king, being angry, and inflamed with a very great fury,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "interrogavit sapientes qui ex more regio semper ei aderant et illorum faciebat cuncta consilio scientium leges ac iura maiorum"
      en: "Baked the wise men, who according to the custom of the kings, were always near his person, and all he did was by their counsel, who knew the laws, and judgments of their forefathers:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "erant autem primi et proximi Charsena et Sethar et Admatha et Tharsis et Mares et Marsana et Mamucha septem duces Persarum atque Medorum qui videbant faciem regis et primi post eum residere soliti erant"
      en: "(Now the chief and nearest him were, Charsena, and Sethar, and Admatha, and Tharsis, and Mares, and Marsana, and Mamuchan, seven princes of the Persians, and of the Medes, who saw the face of the king, and were used to sit first after him :)"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cui sententiae Vasthi regina subiaceret quae Asueri regis imperium quod per eunuchos mandaverat facere noluisset"
      en: "What sentence ought to pass upon Vasthi the queen, who had refused to obey the commandment of king Assuerus, which he had sent to her by the eunuchs?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "responditque Mamuchan audiente rege atque principibus non solum regem laesit regina Vasthi sed omnes principes et populos qui sunt in cunctis provinciis regis Asueri"
      en: "And Mamuchan answered, in the hearing of the king and the princes: Queen Vasthi hath not only injured the king, but also all the people and princes that are in all the provinces of king Assuerus."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "egredietur enim sermo reginae ad omnes mulieres ut contemnant viros suos et dicant rex Asuerus iussit ut regina Vasthi intraret ad eum et illa noluit"
      en: "For this deed of the queen will go abroad to all women, so that they will despise their husbands, and will say: King Assuerus commanded that queen Vasthi should come in to him, and she would not."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "atque hoc exemplo omnes principum coniuges Persarum atque Medorum parvipendent imperia maritorum unde regis iusta est indignatio"
      en: "And by this example all the wives of the princes of the Persians and the Medes will slight the commandments of their husbands: wherefore the king's indignation is just."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et si tibi placet egrediatur edictum a facie tua et scribatur iuxta legem Persarum atque Medorum quam praeteriri inlicitum est ut nequaquam ultra Vasthi ingrediatur ad regem sed regnum illius altera quae melior illa est accipiat"
      en: "If it please thee, let an edict go out from thy presence, and let it be written according to the law of the Persians and of the Medes, which must not be altered, that Vasthi come in no more to the king, but another, that is better than her, be made queen in her place."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et hoc in omne quod latissimum est provinciarum tuarum divulgetur imperium et cunctae uxores tam maiorum quam minorum deferant maritis suis"
      en: "And let this be published through all the provinces of thy empire, (which is very wide,) and let all wives, as well of the greater as of the lesser, give honour to their husbands."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "placuit consilium eius regi et principibus fecitque rex iuxta consultum Mamuchan"
      en: "His counsel pleased the king, and the princes: and the king did according to the counsel of Mamuchan."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et misit epistulas ad universas provincias regni sui ut quaeque gens audire et legere poterat diversis linguis et litteris esse viros principes ac maiores in domibus suis et hoc per cunctos populos divulgari"
      en: "And he sent letters to all the provinces of his kingdom, as every nation could hear and read, in divers languages and characters, that the husbands should be rulers and masters in their houses: and that this should be published to every people."
    status: { la: verified, en: verified }
