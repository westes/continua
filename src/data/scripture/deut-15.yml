# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: deut
chapter: 15
verses:
  - n: 1
    text:
      la: "septimo anno facies remissionem"
      en: "In the seventh year thou shalt make a remission,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quae hoc ordine celebrabitur cui debetur aliquid ab amico vel proximo ac fratre suo repetere non poterit quia annus remissionis est Domini"
      en: "Which shall be celebrated in this order. He to whom any thing is owing from his friend or neighbour or brother, cannot demand it again, because it is the year of remission of the Lord,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "a peregrino et advena exiges civem et propinquum repetendi non habes potestatem"
      en: "Of the foreigner or stranger thou mayst exact it: of thy countryman and neighbour thou shalt not have power to demand it again."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et omnino indigens et mendicus non erit inter vos ut benedicat tibi Dominus in terra quam traditurus est tibi in possessionem"
      en: "And there shall be no poor nor beggar among you: that the Lord thy God may bless thee in the land which he will give thee in possession."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "si tamen audieris vocem Domini Dei tui et custodieris universa quae iussit et quae ego hodie praecipio tibi benedicet tibi ut pollicitus est"
      en: "Yet so if thou hear the voice of the Lord thy God, and keep all things that he hath ordained, and which I command thee this day, he will bless thee, as he hath promised."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "fenerabis gentibus multis et ipse a nullo accipies mutuum dominaberis nationibus plurimis et tui nemo dominabitur"
      en: "Thou shalt lend to many nations, and thou shalt borrow of no man. Thou shalt have dominion over very many nations, and no one shall have dominion over thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "si unus de fratribus tuis qui morantur intra portas civitatis tuae in terra quam Dominus Deus tuus daturus est tibi ad paupertatem venerit non obdurabis cor tuum nec contrahes manum"
      en: "If one of thy brethren that dwelleth within the gates of thy city in the land which the Lord thy God will give thee, come to poverty: thou shalt not harden thy heart, nor close thy hand,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sed aperies eam pauperi et dabis mutuum quod eum indigere perspexeris"
      en: "But shalt open it to the poor man, thou shalt lend him, that which thou perceivest he hath need of."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cave ne forte subripiat tibi impia cogitatio et dicas in corde tuo adpropinquat septimus annus remissionis et avertas oculos a paupere fratre tuo nolens ei quod postulat mutuum commodare ne clamet contra te ad Dominum et fiat tibi in peccatum"
      en: "Beware lest perhaps a wicked thought steal in upon thee, and thou say in thy heart: The seventh year of remission draweth nigh; and thou turn away thy eyes from thy poor brother, denying to lend him that which he asketh: lest he cry against thee to the Lord, and it become a sin unto thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sed dabis ei nec ages quippiam callide in eius necessitatibus sublevandis ut benedicat tibi Dominus Deus tuus in omni tempore et in cunctis ad quae manum miseris"
      en: "But thou shalt give to him: neither shalt thou do any thing craftily in relieving his necessities: that the Lord thy God may bless thee at all times, and in all things to which thou shalt put thy hand."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "non deerunt pauperes in terra habitationis tuae idcirco ego praecipio tibi ut aperias manum fratri tuo egeno et pauperi qui tecum versatur in terra"
      en: "There will not be wanting poor in the land of thy habitation: therefore I command thee to open thy hand to thy needy and poor brother, that liveth in the land."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cum tibi venditus fuerit frater tuus hebraeus aut hebraea et sex annis servierit tibi in septimo anno dimittes eum liberum"
      en: "When thy brother a Hebrew man, or Hebrew woman is sold to thee, and hath served thee six years, in the seventh year thou shalt let him go free:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et quem libertate donaveris nequaquam vacuum abire patieris"
      en: "And when thou sendest him out free, thou shalt not let him go away empty:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sed dabis viaticum de gregibus et de area et torculari tuo quibus Dominus Deus tuus benedixerit tibi"
      en: "But shalt give him for his way out of thy flocks, and out of thy barnfloor, and thy winepress, wherewith the Lord thy God shall bless thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "memento quod et ipse servieris in terra Aegypti et liberaverit te Dominus Deus tuus et idcirco ego nunc praecipiam tibi"
      en: "Remember that thou also wast a bondservant in the land of Egypt, and the Lord thy God made thee free, and therefore I now command thee this."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sin autem dixerit nolo egredi eo quod diligat te et domum tuam et bene sibi apud te esse sentiat"
      en: "But if he say: I will not depart: because he loveth thee, and thy house, and findeth that he is well with thee:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "adsumes subulam et perforabis aurem eius in ianua domus tuae et serviet tibi usque in aeternum ancillae quoque similiter facies"
      en: "Thou shalt take an awl, and bore through his ear in the door of thy house, and he shall serve thee for ever: thou shalt do in like manner to thy womanservant also."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "non avertes ab eis oculos tuos quando dimiseris eos liberos quoniam iuxta mercedem mercennarii per sex annos servivit tibi ut benedicat tibi Dominus Deus tuus in cunctis operibus quae agis"
      en: "Turn not away thy eyes from them when thou makest them tree: because he hath served thee six years according to the wages of a hireling: that the Lord thy God may bless thee in all the works that thou dost."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "de primogenitis quae nascuntur in armentis et ovibus tuis quicquid sexus est masculini sanctificabis Domino Deo tuo non operaberis in primogenito bovis et non tondebis primogenita ovium"
      en: "Of the firstlings, that come of thy herds and thy sheep, thou shalt sanctify to the Lord thy God whatsoever is of the male sex. Thou shalt not work with the firstling of a bullock, and thou shalt not shear the firstlings of thy sheep."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "in conspectu Domini Dei tui comedes ea per annos singulos in loco quem elegerit Dominus tu et domus tua"
      en: "In the sight of the Lord thy God shalt thou eat them every year, in the place that the Lord shall choose, thou and thy house."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "sin autem habuerit maculam et vel claudum fuerit vel caecum aut in aliqua parte deforme vel debile non immolabitur Domino Deo tuo"
      en: "But if it have a blemish, or be lame, or blind, or in any part disfigured or feeble, it shall not be sacrificed to the Lord thy God."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sed intra portas urbis tuae comedes illud tam mundus quam inmundus similiter vescentur eis quasi caprea et cervo"
      en: "But thou shalt eat it within the gates of thy city: the clean and the unclean shall eat them alike, as the roe and as the hart."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "hoc solum observabis ut sanguinem eorum non comedas sed effundas in terram quasi aquam"
      en: "Only thou shalt take heed not to eat their blood, but pour it out on the earth as water."
    status: { la: verified, en: verified }
