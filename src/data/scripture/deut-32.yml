# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: deut
chapter: 32
verses:
  - n: 1
    text:
      la: "audite caeli quae loquor audiat terra verba oris mei"
      en: "Hear, O ye heavens, the things I speak, let the earth give ear to the words of my mouth."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "concrescat in pluvia doctrina mea fluat ut ros eloquium meum quasi imber super herbam et quasi stillae super gramina"
      en: "Let my doctrine gather as the rain, let my speech distil as the dew, as a shower upon the herb, and as drops upon the grass."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quia nomen Domini invocabo date magnificentiam Deo nostro"
      en: "Because I will invoke the name of the Lord: give ye magnificence to our God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dei perfecta sunt opera et omnes viae eius iudicia Deus fidelis et absque ulla iniquitate iustus et rectus"
      en: "The works of God are perfect, and all his ways are judgments: God is faithful and without any iniquity, he is just and right."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "peccaverunt ei non filii eius in sordibus generatio prava atque perversa"
      en: "They have sinned against him, and are nose of his children in their filth: they are a wicked and perverse generation."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "haecine reddis Domino popule stulte et insipiens numquid non ipse est pater tuus qui possedit et fecit et creavit te"
      en: "Is this the return thou makest to the Lord, O foolish and senseless people? Is not he thy father, that hath possessed thee, and made thee, and created thee?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "memento dierum antiquorum cogita generationes singulas interroga patrem tuum et adnuntiabit tibi maiores tuos et dicent tibi"
      en: "Remember the days of old, think upon every generation: ask thy father, and he will declare to thee: thy elders and they will tell thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quando dividebat Altissimus gentes quando separabat filios Adam constituit terminos populorum iuxta numerum filiorum Israhel"
      en: "When the Most High divided the nations: when he separated the sons of Adam, he appointed the bounds of people according to the number of the children of Israel."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "pars autem Domini populus eius Iacob funiculus hereditatis eius"
      en: "But the Lord's portion is his people: Jacob the lot of his inheritance."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "invenit eum in terra deserta in loco horroris et vastae solitudinis circumduxit eum et docuit et custodivit quasi pupillam oculi sui"
      en: "He found him in a desert land, in a place of horror, and of vast wilderness: he led him about, and taught him: and he kept him as the apple of his eye."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sicut aquila provocans ad volandum pullos suos et super eos volitans expandit alas suas et adsumpsit eum atque portavit in umeris suis"
      en: "As the eagle enticing her young to fly, and hovering over them, he spread his wings, and hath taken him and carried him on his shoulders."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dominus solus dux eius fuit et non erat cum eo deus alienus"
      en: "The Lord alone was his leader: and there was no strange god with him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "constituit eum super excelsam terram ut comederet fructus agrorum ut sugeret mel de petra oleumque de saxo durissimo"
      en: "He set him upon high land: that he might eat the fruits of the fields, that he might suck honey out of the rock, and oil out of the hardest stone,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "butyrum de armento et lac de ovibus cum adipe agnorum et arietum filiorum Basan et hircos cum medulla tritici et sanguinem uvae biberet meracissimum"
      en: "Butter of the herd, and milk of the sheep with the fat of lambs, and of the rams of the breed of Basan: and goats with the marrow of wheat, and might drink the purest blood of the grape."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "incrassatus est dilectus et recalcitravit incrassatus inpinguatus dilatatus dereliquit Deum factorem suum et recessit a Deo salutari suo"
      en: "The beloved grew fat, and kicked: he grew fat, and thick and gross, he forsook God who made him, and departed from God his saviour."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "provocaverunt eum in diis alienis et in abominationibus ad iracundiam concitaverunt"
      en: "They provoked him by strange gods, and stirred him up to anger, with their abominations."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "immolaverunt daemonibus et non Deo diis quos ignorabant novi recentesque venerunt quos non coluerunt patres eorum"
      en: "They sacrificed to devils and not to God: to gods whom they knew not: that were newly come up, whom their fathers worshipped not."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Deum qui te genuit dereliquisti et oblitus es Domini creatoris tui"
      en: "Thou hast forsaken the God that beget thee, and hast forgotten the Lord that created thee."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "vidit Dominus et ad iracundiam concitatus est quia provocaverunt eum filii sui et filiae"
      en: "The Lord saw, and was moved to wrath: because his own sons and daughters provoked him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et ait abscondam faciem meam ab eis et considerabo novissima eorum generatio enim perversa est et infideles filii"
      en: "And he said: I will hide my face from them, and will consider what their last end shall be: for it is a perverse generation, and unfaithful children."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ipsi me provocaverunt in eo qui non erat Deus et inritaverunt in vanitatibus suis et ego provocabo eos in eo qui non est populus et in gente stulta inritabo illos"
      en: "They have provoked me with that which was no god, and have angered me with their vanities: and I will provoke them with that which is no people, and will vex them with a foolish nation."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ignis succensus est in furore meo et ardebit usque ad inferni novissima devorabitque terram cum germine suo et montium fundamenta conburet"
      en: "A fire is kindled in my wrath, and shall burn even to the lowest hell: and shall devour the earth with her increase, and shall burn the foundations of the mountains."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "congregabo super eos mala et sagittas meas conplebo in eis"
      en: "I will heap evils upon them, and will spend my arrows among them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "consumentur fame et devorabunt eos aves morsu amarissimo dentes bestiarum inmittam in eos cum furore trahentium super terram atque serpentium"
      en: "They shall be consumed with famine, and birds shall devour them with a most bitter bite: I will send the teeth of beasts upon them, with the fury of creatures that trail upon the ground, and of serpents."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "foris vastabit eos gladius et intus pavor iuvenem simul ac virginem lactantem cum homine sene"
      en: "Without, the sword shall lay them waste, and terror within, both the young man and the virgin, the sucking child with the man in years."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "dixi ubinam sunt cessare faciam ex hominibus memoriam eorum"
      en: "I said: Where are they? I will make the memory of them to cease from among men."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "sed propter iram inimicorum distuli ne forte superbirent hostes eorum et dicerent manus nostra excelsa et non Dominus fecit haec omnia"
      en: "But for the wrath of the enemies I have deferred it: lest perhaps their enemies might be proud, and should say: Our mighty hand, and not the Lord, hath done all these things."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "gens absque consilio est et sine prudentia"
      en: "They are a nation without counsel, and without wisdom."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "utinam saperent et intellegerent ac novissima providerent"
      en: "O that they would be wise and would understand, and would provide for their last end."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quomodo persequatur unus mille et duo fugent decem milia nonne ideo quia Deus suus vendidit eos et Dominus conclusit illos"
      en: "How should one pursue after a thousand, and two chase ten thousand? Was it not, because their God had sold them, and the Lord had shut them up?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "non enim est Deus noster ut deus eorum et inimici nostri sunt iudices"
      en: "For our God is not as their gods: our enemies themselves are judges."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "de vinea Sodomorum vinea eorum et de suburbanis Gomorrae uva eorum uva fellis et botri amarissimi"
      en: "Their vines are of the vineyard of Sodom, and of the suburbs of Gomorrha: their grapes are grapes of gall, and their clusters most bitter."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "fel draconum vinum eorum et venenum aspidum insanabile"
      en: "Their wine is the gall of dragons, and the venom of asps, which is incurable."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "nonne haec condita sunt apud me et signata in thesauris meis"
      en: "Are not these things stored up with me, and sealed up in my treasures?"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "mea est ultio et ego retribuam in tempore ut labatur pes eorum iuxta est dies perditionis et adesse festinant tempora"
      en: "Revenge is mine, and I will repay them in due time, that their foot may slide: the day of destruction is at hand, and the time makes haste to come."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "iudicabit Dominus populum suum et in servis suis miserebitur videbit quod infirmata sit manus et clausi quoque defecerint residuique consumpti sint"
      en: "The Lord will judge his people, and will have mercy on his servants : he shall see that their hand is weakened, and that they who were shut up have also failed, and they that remained are consumed."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et dicet ubi sunt dii eorum in quibus habebant fiduciam"
      en: "And he shall say: Where are their gods, in whom they trusted?"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "de quorum victimis comedebant adipes et bibebant vinum libaminum surgant et opitulentur vobis et in necessitate vos protegant"
      en: "Of whose victims they ate the fat, and drank the wine of their drink offerings: let them arise and help you, and protect you in your distress."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "videte quod ego sim solus et non sit alius deus praeter me ego occidam et ego vivere faciam percutiam et ego sanabo et non est qui de manu mea possit eruere"
      en: "See ye that I alone am, and there is no other God besides me: I will kill and I will make to live: I will strike, and I will heal, and there is none that can deliver out of my hand."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "levabo ad caelum manum meam et dicam vivo ego in aeternum"
      en: "I will lift up my hand to heaven, and I will say: I live for ever."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "si acuero ut fulgur gladium meum et arripuerit iudicium manus mea reddam ultionem hostibus meis et his qui oderunt me retribuam"
      en: "If I shall whet my sword as the lightning, and my hand take hold on judgment: I will render vengeance to my enemies, and repay them that hate me."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "inebriabo sagittas meas sanguine et gladius meus devorabit carnes de cruore occisorum et de captivitate nudati inimicorum capitis"
      en: "I will make my arrows drunk with blood, and my sword shall devour flesh, of the blood of the slain and of the captivity, of the bare head of the enemies."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "laudate gentes populum eius quia sanguinem servorum suorum ulciscetur et vindictam retribuet in hostes eorum et propitius erit terrae populi sui"
      en: "Praise his people, ye nations, for he will revenge the blood of his servants: and will render vengeance to their enemies, and he will be merciful to the land of his people."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "venit ergo Moses et locutus est omnia verba cantici huius in auribus populi ipse et Iosue filius Nun"
      en: "So Moses came and spoke all the words of this canticle in the ears of the people, and Josue the son of Nun."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "conplevitque omnes sermones istos loquens ad universum Israhel"
      en: "And he ended all these words, speaking to all Israel."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et dixit ad eos ponite corda vestra in omnia verba quae ego testificor vobis hodie ut mandetis ea filiis vestris custodire et facere et implere universa quae scripta sunt legis huius"
      en: "And he said to them : Set your hearts on all the words, which I testify to you this day: which you shall command your children to observe and to do, and to fulfil all that is written in this law:"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "quia non in cassum praecepta sunt vobis sed ut singuli in eis viverent quae facientes longo perseveretis tempore in terra ad quam Iordane transmisso ingredimini possidendam"
      en: "For they are not commanded you in vain, but that every one should live in them, and that doing them you may continue a long time in the land whither you are going over the Jordan to possess it."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "locutusque est Dominus ad Mosen in eadem die dicens"
      en: "And the Lord spoke to Moses the same day, saying:"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "ascende in montem istum Abarim id est transituum in montem Nebo qui est in terra Moab contra Hiericho et vide terram Chanaan quam ego tradam filiis Israhel obtinendam et morere in monte"
      en: "Go up into this mountain Abarim, (that is to say, of passages,) unto mount Nebo, which is in the land of Moab over against Jericho: and see the land of Chanaan, which I will deliver to the children of Israel to possess, and die thou in the mountain."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "quem conscendens iungeris populis tuis sicut mortuus est Aaron frater tuus in monte Hor et adpositus populis suis"
      en: "When thou art gone up into it thou shalt be gathered to thy people, as Aaron thy brother died in mount Her, and was gathered to his people:"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "quia praevaricati estis contra me in medio filiorum Israhel ad aquas Contradictionis in Cades deserti Sin et non sanctificastis me inter filios Israhel"
      en: "Because you trespassed against me in the midst of the children of Israel, at the waters of contradiction in Cades of the desert of Sin: and you did not sanctify me among the children of Israel."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "e contra videbis terram et non ingredieris in eam quam ego dabo filiis Israhel"
      en: "Thou shalt see the land before thee, which I will give to the children of Israel, but thou shalt not enter into it."
    status: { la: verified, en: verified }
