# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 1
verses:
  - n: 1
    text:
      la: "verba Hieremiae filii Helciae de sacerdotibus qui fuerunt in Anathoth in terra Beniamin"
      en: "The words of Jeremias the son of Helcias, of the priests that were in Anathoth, in the land of Benjamin."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quod factum est verbum Domini ad eum in diebus Iosiae filii Amon regis Iuda in tertiodecimo anno regni eius"
      en: "The word of the Lord which came to him in the days of Josias the son of Amon king of Juda, in the thirteenth year of his reign."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et factum est in diebus Ioachim filii Iosiae regis Iuda usque ad consummationem undecimi anni Sedeciae filii Iosiae regis Iuda usque ad transmigrationem Hierusalem in mense quinto"
      en: "And which came to him in the days of Joakim the son of Josias king of Juda, unto the end of the eleventh year of Sedecias the son of Josias king of Juda, even unto the carrying away of Jerusalem captive, in the fifth month."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et factum est verbum Domini ad me dicens"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "priusquam te formarem in utero novi te et antequam exires de vulva sanctificavi te prophetam gentibus dedi te"
      en: "Before I formed thee in the bowels of thy mother, I knew thee: and before thou camest forth out of the womb, I sanctified thee, and made thee a prophet unto the nations."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et dixi a a a Domine Deus ecce nescio loqui quia puer ego sum"
      en: "And I said: Ah, ah, ah, Lord God: behold, I cannot speak, for I am a child."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et dixit Dominus ad me noli dicere puer sum quoniam ad omnia quae mittam te ibis et universa quaecumque mandavero tibi loqueris"
      en: "And the Lord said to me: Say not: I am a child: for thou shalt go to all that I shall send thee: and whatsoever I shall command thee, thou shalt speak."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ne timeas a facie eorum quia tecum ego sum ut eruam te dicit Dominus"
      en: "Be not afraid at their presence: for I am with thee to deliver thee, saith the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et misit Dominus manum suam et tetigit os meum et dixit Dominus ad me ecce dedi verba mea in ore tuo"
      en: "And the Lord put forth his hand, and touched my mouth: and the Lord said to me: Behold I have given my words in thy mouth:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ecce constitui te hodie super gentes et super regna ut evellas et destruas et disperdas et dissipes et aedifices et plantes"
      en: "Lo, I have set thee this day over the nations, and over the kingdoms, to root up, and pull down, and to waste, and to destroy, and to build, and to plant."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et factum est verbum Domini ad me dicens quid tu vides Hieremia et dixi virgam vigilantem ego video"
      en: "And the word of the Lord came to me, saying: What seest thou, Jeremias? And I said: I see a rod watching."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et dixit Dominus ad me bene vidisti quia vigilabo ego super verbo meo ut faciam illud"
      en: "And the Lord said to me: Thou hast seen well: for I will watch over my word to perform it."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et factum est verbum Domini secundo ad me dicens quid tu vides et dixi ollam succensam ego video et faciem eius a facie aquilonis"
      en: "And the word of the Lord came to me a second time, saying: What seest thou? I see a boiling caldron, and the face thereof from the face of the north."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et dixit Dominus ad me ab aquilone pandetur malum super omnes habitatores terrae"
      en: "And the Lord said to me: from the north shall an evil break forth upon all the inhabitants of the land."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quia ecce ego convocabo omnes cognationes regnorum aquilonis ait Dominus et venient et ponent unusquisque solium suum in introitu portarum Hierusalem et super omnes muros eius in circuitu et super universas urbes Iuda"
      en: "For behold I will call together all the families of the kingdoms of the north: saith the Lord: and they shall come, and shall set every one his throne in the entrance of the gates of Jerusalem, and upon all the walls thereof round about, and upon all the cities of Juda,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et loquar iudicia mea cum eis super omni malitia eorum qui dereliquerunt me et libaverunt diis alienis et adoraverunt opus manuum suarum"
      en: "And I will pronounce my judgements against them, touching all their wickedness, who have forsaken me, and have sacrificed to strange gods, and have adored the work of their own hands."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "tu ergo accinge lumbos tuos et surge et loquere ad eos omnia quae ego praecipio tibi ne formides a facie eorum nec enim timere te faciam vultum eorum"
      en: "Thou therefore gird up thy loins, and arise, and speak to them all that I command thee. Be not afraid at their presence : for I will make thee not to fear their countenance."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ego quippe dedi te hodie in civitatem munitam et in columnam ferream et in murum aereum super omnem terram regibus Iuda principibus eius et sacerdotibus et populo terrae"
      en: "For behold I have made thee this day a fortified city, and a pillar of iron, and a wall of brass, over all the land, to the kings of Juda, to the princes thereof, and to the priests, and to the people of the land."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et bellabunt adversum te et non praevalebunt quia tecum ego sum ait Dominus ut liberem te"
      en: "And they shall fight against thee, and shall not prevail: for I am with thee, saith the Lord, to deliver thee."
    status: { la: verified, en: verified }
