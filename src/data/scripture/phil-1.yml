# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: phil
chapter: 1
verses:
  - n: 1
    text:
      la: "Paulus et Timotheus, servi Jesu Christi, omnibus sanctis in Christo Jesu, qui sunt Philippis, cum episcopis et diaconibus."
      en: "Paul and Timothy, the servants of Jesus Christ; to all the saints in Christ Jesus, who are at Philippi, with the bishops and deacons."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Gratia vobis, et pax a Deo Patre nostro, et Domino Jesu Christo."
      en: "Grace be unto you, and peace from God our Father, and from the Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Gratias ago Deo meo in omni memoria vestri,"
      en: "I give thanks to my God in every remembrance of you,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "semper in cunctis orationibus meis pro omnibus vobis, cum gaudio deprecationem faciens,"
      en: "Always in all my prayers making supplication for you all, with joy;"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "super communicatione vestra in Evangelio Christi a prima die usque nunc."
      en: "For your communication in the gospel of Christ from the first day until now."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Confidens hoc ipsum, quia qui coepit in vobis opus bonum, perficiet usque in diem Christi Jesu:"
      en: "Being confident of this very thing, that he, who hath begun a good work in you, will perfect it unto the day of Christ Jesus."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sicut est mihi justum hoc sentire pro omnibus vobis: eo quod habeam vos in corde, et in vinculis meis, et in defensione, et confirmatione Evangelii, socios gaudii mei omnes vos esse."
      en: "As it is meet for me to think this for you all, for that I have you in my heart; and that in my bands, and in the defence and confirmation of the gospel, you all are partakers of my joy."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Testis enim mihi est Deus, quomodo cupiam omnes vos in visceribus Jesu Christi."
      en: "For God is my witness, how I long after you all in the bowels of Jesus Christ."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et hoc oro, ut caritas vestra magis ac magis abundet in scientia, et in omni sensu:"
      en: "And this I pray, that your charity may more and more abound in knowledge, and in all understanding:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ut probetis potiora, ut sitis sinceri, et sine offensa in diem Christi,"
      en: "That you may approve the better things, that you may be sincere and without offence unto the day of Christ,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "repleti fructu justitiae per Jesum Christum, in gloriam et laudem Dei."
      en: "Filled with the fruit of justice, through Jesus Christ, unto the glory and praise of God."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Scire autem vos volo fratres, quia quae circa me sunt, magis ad profectum venerunt Evangelii:"
      en: "Now, brethren, I desire you should know, that the things which have happened to me, have fallen out rather to the furtherance of the gospel:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ita ut vincula mea manifesta fierent in Christo in omni praetorio, et in ceteris omnibus,"
      en: "So that my bands are made manifest in Christ, in all the court, and in all other places;"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et plures e fratribus in Domino confidentes vinculis meis, abundantius auderent sine timore verbum Dei loqui."
      en: "And many of the brethren in the Lord, growing confident by my bands, are much more bold to speak the word of God without fear."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quidam quidem et propter invidiam et contentionem: quidam autem et propter bonam voluntatem Christum praedicant:"
      en: "Some indeed, even out of envy and contention; but some also for good will preach Christ."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quidam ex caritate, scientes quoniam in defensionem Evangelii positus sum."
      en: "Some out of charity, knowing that I am set for the defence of the gospel."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quidam autem ex contentione Christum annuntiant non sincere, existimantes pressuram se suscitare vinculis meis."
      en: "And some out of contention preach Christ not sincerely: supposing that they raise affliction to my bands."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quid enim? Dum omni modo sive per occasionem, sive per veritatem, Christus annuntietur: et in hoc gaudeo, sed et gaudebo."
      en: "But what then? So that by all means, whether by occasion, or by truth, Christ be preached: in this also I rejoice, yea, and will rejoice."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Scio enim quia hoc mihi proveniet ad salutem, per vestram orationem, et subministrationem Spiritus Jesu Christi,"
      en: "For I know that this shall fall out to me unto salvation, through your prayer, and the supply of the Spirit of Jesus Christ,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "secundum exspectationem et spem meam, quia in nullo confundar: sed in omni fiducia sicut semper, et nunc magnificabitur Christus in corpore meo, sive per vitam, sive per mortem."
      en: "According to my expectation and hope; that in nothing I shall be confounded, but with all confidence, as always, so now also shall Christ be magnified in my body, whether it be by life, or by death."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Mihi enim vivere Christus est, et mori lucrum."
      en: "For to me, to live is Christ; and to die is gain."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Quod si vivere in carne, hic mihi fructus operis est, et quid eligam ignoro."
      en: "And if to live in the flesh, this is to me the fruit of labour, and what I shall choose I know not."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Coarctor autem e duobus: desiderium habens dissolvi, et esse cum Christo, multo magis melius:"
      en: "But I am straitened between two: having a desire to be dissolved and to be with Christ, a thing by far the better."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "permanere autem in carne, necessarium propter vos."
      en: "But to abide still in the flesh, is needful for you."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et hoc confidens scio quia manebo, et permanebo omnibus vobis ad profectum vestrum, et gaudium fidei:"
      en: "And having this confidence, I know that I shall abide, and continue with you all, for your furtherance and joy of faith:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ut gratulatio vestra abundet in Christo Jesu in me, per meum adventum iterum ad vos."
      en: "That your rejoicing may abound in Christ Jesus for me, by my coming to you again."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Tantum digne Evangelio Christi conversamini: ut sive cum venero, et videro vos, sive absens audiam de vobis, quia statis in uno spiritu unanimes, collaborantes fidei Evangelii:"
      en: "Only let your conversation be worthy of the gospel of Christ: that, whether I come and see you, or, being absent, may hear of you, that you stand fast in one spirit, with one mind labouring together for the faith of the gospel."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et in nullo terreamini ab adversariis: quae illis est causa perditionis, vobis autem salutis, et hoc a Deo:"
      en: "And in nothing be ye terrified by the adversaries: which to them is a cause of perdition, but to you of salvation, and this from God:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quia vobis donatum est pro Christo, non solum ut in eum credatis, sed ut etiam pro illo patiamini:"
      en: "For unto you it is given for Christ, not only to believe in him, but also to suffer for him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "idem certamen habentes, quale et vidistis in me, et nunc audistis de me."
      en: "Having the same conflict as that which you have seen in me, and now have heard of me."
    status: { la: verified, en: verified }
