# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: phil
chapter: 3
verses:
  - n: 1
    text:
      la: "De cetero, fratres mei, gaudete in Domino. Eadem vobis scribere, mihi quidem non pigrum, vobis autem necessarium."
      en: "As to the rest, my brethren, rejoice in the Lord. To write the same things to you, to me indeed is not wearisome, but to you it is necessary."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Videte canes, videte malos operarios, videte concisionem."
      en: "Beware of dogs, beware of evil workers, beware of the concision."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Nos enim sumus circumcisio, qui spiritu servimus Deo, et gloriamur in Christo Jesu, et non in carne fiduciam habentes,"
      en: "For we are the circumcision, who in spirit serve God; and glory in Christ Jesus, not having confidence in the flesh."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quamquam ego habeam confidentiam et in carne. Si quis alius videtur confidere in carne, ego magis,"
      en: "Though I might also have confidence in the flesh. If any other thinketh he may have confidence in the flesh, I more,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "circumcisus octavo die, ex genere Israel, de tribu Benjamin, Hebraeus ex Hebraeis, secundum legem pharisaeus,"
      en: "Being circumcised the eighth day, of the stock of Israel, of the tribe of Benjamin, an Hebrew of the Hebrews; according to the law, a Pharisee:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "secundum aemulationem persequens Ecclesiam Dei, secundum justitiam, quae in lege est, conversatus sine querela."
      en: "According to zeal, persecuting the church of God; according to the justice that is in the law, conversing without blame."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Sed quae mihi fuerunt lucra, haec arbitratus sum propter Christum detrimenta."
      en: "But the things that were gain to me, the same I have counted loss for Christ."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Verumtamen existimo omnia detrimentum esse propter eminentem scientiam Jesu Christi Domini mei: propter quem omnia detrimentum feci, et arbitror ut stercora, ut Christum lucrifaciam,"
      en: "Furthermore I count all things to be but loss for the excellent knowledge of Jesus Christ my Lord; for whom I have suffered the loss of all things, and count them but as dung, that I may gain Christ:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et inveniar in illo non habens meam justitiam, quae ex lege est, sed illam, quae ex fide est Christi Jesu: quae ex Deo est justitia in fide,"
      en: "And may be found in him, not having my justice, which is of the law, but that which is of the faith of Christ Jesus, which is of God, justice in faith:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ad cognoscendum illum, et virtutem resurrectionis ejus, et societatem passionum illius: configuratus morti ejus:"
      en: "That I may know him, and the power of his resurrection, and the fellowship of his sufferings, being made conformable to his death,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "si quo modo occurram ad resurrectionem, quae est ex mortuis:"
      en: "If by any means I may attain to the resurrection which is from the dead."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "non quod jam acceperim, aut jam perfectus sim: sequor autem, si quomodo comprehendam in quo et comprehensus sum a Christo Jesu."
      en: "Not as though I had already attained, or were already perfect; but I follow after, if I may by any means apprehend, wherein I am also apprehended by Christ Jesus."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Fratres, ego me non arbitror comprehendisse. Unum autem, quae quidem retro sunt obliviscens, ad ea vero quae sunt priora, extendens meipsum,"
      en: "Brethren, I do not count myself to have apprehended. But one thing I do: forgetting the things that are behind, and stretching forth myself to those that are before,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ad destinatum persequor, ad bravium supernae vocationis Dei in Christo Jesu."
      en: "I press towards the mark, to the prize of the supernal vocation of God in Christ Jesus."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quicumque ergo perfecti sumus, hoc sentiamus: et si quid aliter sapitis, et hoc vobis Deus revelabit."
      en: "Let us therefore, as many as are perfect, be thus minded; and if in any thing you be otherwise minded, this also God will reveal to you."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Verumtamen ad quod pervenimus ut idem sapiamus, et in eadem permaneamus regula."
      en: "Nevertheless whereunto we are come, that we be of the same mind, let us also continue in the same rule."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Imitatores mei estote, fratres, et observate eos qui ita ambulant, sicut habetis formam nostram."
      en: "Be ye followers of me, brethren, and observe them who walk so as you have our model."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Multi enim ambulant, quos saepe dicebam vobis ( nunc autem et flens dico) inimicos crucis Christi:"
      en: "For many walk, of whom I have told you often (and now tell you weeping), that they are enemies of the cross of Christ;"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quorum finis interitus: quorum Deus venter est: et gloria in confusione ipsorum, qui terrena sapiunt."
      en: "Whose end is destruction; whose God is their belly; and whose glory is in their shame; who mind earthly things."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Nostra autem conversatio in caelis est: unde etiam Salvatorem exspectamus Dominum nostrum Jesum Christum,"
      en: "But our conversation is in heaven; from whence also we look for the Saviour, our Lord Jesus Christ,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui reformabit corpus humilitatis nostrae, configuratum corpori claritatis suae, secundum operationem, qua etiam possit subjicere sibi omnia."
      en: "Who will reform the body of our lowness, made like to the body of his glory, according to the operation whereby also he is able to subdue all things unto himself."
    status: { la: verified, en: verified }
