# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: act
chapter: 17
verses:
  - n: 1
    text:
      la: "cum autem perambulassent Amphipolim et Apolloniam venerunt Thessalonicam ubi erat synagoga Iudaeorum"
      en: "And when they had passed through Amphipolis and Apollonia, they came to Thessalonica, where there was a synagogue of the Jews."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "secundum consuetudinem autem Paulus introivit ad eos et per sabbata tria disserebat eis de scripturis"
      en: "And Paul, according to his custom, went in unto them; and for three sabbath days he reasoned with them out of the scriptures:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "adaperiens et insinuans quia Christum oportuit pati et resurgere a mortuis et quia hic est Christus Iesus quem ego adnuntio vobis"
      en: "Declaring and insinuating that the Christ was to suffer, and to rise again from the dead; and that this is Jesus Christ, whom I preach to you."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et quidam ex eis crediderunt et adiuncti sunt Paulo et Silae et de colentibus gentilibusque multitudo magna et mulieres nobiles non paucae"
      en: "And some of them believed, and were associated to Paul and Silas; and of those that served God, and of the Gentiles a great multitude, and of noble women not a few."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "zelantes autem Iudaei adsumentesque de vulgo viros quosdam malos et turba facta concitaverunt civitatem et adsistentes domui Iasonis quaerebant eos producere in populum"
      en: "But the Jews, moved with envy, and taking unto them some wicked men of the vulgar sort, and making a tumult, set the city in an uproar; and besetting Jason's house, sought to bring them out unto the people."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et cum non invenissent eos trahebant Iasonem et quosdam fratres ad principes civitatis clamantes quoniam hii qui orbem concitant et huc venerunt"
      en: "And not finding them, they drew Jason and certain brethren to the rulers of the city, crying: They that set the city in an uproar, are come hither also;"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quos suscepit Iason et hii omnes contra decreta Caesaris faciunt regem alium dicentes esse Iesum"
      en: "Whom Jason hath received; and these all do contrary to the decrees of Caesar, saying that there is another king, Jesus."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "concitaverunt autem plebem et principes civitatis audientes haec"
      en: "And they stirred up the people, and the rulers of the city hearing these things,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et accepto satis ab Iasone et a ceteris dimiserunt eos"
      en: "And having taken satisfaction of Jason and of the rest, they let them go."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "fratres vero confestim per noctem dimiserunt Paulum et Silam in Beroeam qui cum advenissent in synagogam Iudaeorum introierunt"
      en: "But the brethren immediately sent away Paul and Silas by night unto Berea. Who, when they were come thither, went into the synagogue of the Jews."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "hii autem erant nobiliores eorum qui sunt Thessalonicae qui susceperunt verbum cum omni aviditate cotidie scrutantes scripturas si haec ita se haberent"
      en: "Now these were more noble than those in Thessalonica, who received the word with all eagerness, daily searching the scriptures, whether these things were so."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et multi quidem crediderunt ex eis et gentilium mulierum honestarum et viri non pauci"
      en: "And many indeed of them believed, and of honourable women that were Gentiles, and of men not a few."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cum autem cognovissent in Thessalonica Iudaei quia et Beroeae praedicatum est a Paulo verbum Dei venerunt et illuc commoventes et turbantes multitudinem"
      en: "And when the Jews of Thessalonica had knowledge that the word of God was also preached by Paul at Berea, they came thither also, stirring up and troubling the multitude."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "statimque tunc Paulum dimiserunt fratres ut iret usque ad mare Silas autem et Timotheus remanserunt ibi"
      en: "And then immediately the brethren sent away Paul, to go unto the sea; but Silas and Timothy remained there."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui autem deducebant Paulum perduxerunt usque Athenas et accepto mandato ab eo ad Silam et Timotheum ut quam celeriter venirent ad illum profecti sunt"
      en: "And they that conducted Paul, brought him as far as Athens; and receiving a commandment from him to Silas and Timothy, that they should come to him with all speed, they departed."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Paulus autem cum Athenis eos expectaret incitabatur spiritus eius in ipso videns idolatriae deditam civitatem"
      en: "Now whilst Paul waited for them at Athens, his spirit was stirred within him, seeing the city wholly given to idolatry."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "disputabat igitur in synagoga cum Iudaeis et colentibus et in foro per omnes dies ad eos qui aderant"
      en: "He disputed, therefore, in the synagogue with the Jews, and with them that served God, and in the marketplace, every day with them that were there."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quidam autem epicurei et stoici philosophi disserebant cum eo et quidam dicebant quid vult seminiverbius hic dicere alii vero novorum daemoniorum videtur adnuntiator esse quia Iesum et resurrectionem adnuntiabat eis"
      en: "And certain philosophers of the Epicureans and of the Stoics disputed with him; and some said: What is it, that this word sower would say? But others: He seemeth to be a setter forth of new gods; because he preached to them Jesus and the resurrection."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et adprehensum eum ad Ariopagum duxerunt dicentes possumus scire quae est haec nova quae a te dicitur doctrina"
      en: "And taking him, they brought him to the Areopagus, saying: May we know what this new doctrine is, which thou speakest of?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "nova enim quaedam infers auribus nostris volumus ergo scire quidnam velint haec esse"
      en: "For thou bringest in certain new things to our ears. We would know therefore what these things mean."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Athenienses autem omnes et advenae hospites ad nihil aliud vacabant nisi aut dicere aut audire aliquid novi"
      en: "(Now all the Athenians, and strangers that were there, employed themselves in nothing else, but either in telling or in hearing some new thing.)"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "stans autem Paulus in medio Ariopagi ait viri athenienses per omnia quasi superstitiosiores vos video"
      en: "But Paul standing in the midst of the Areopagus, said: Ye men of Athens, I perceive that in all things you are too superstitious."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "praeteriens enim et videns simulacra vestra inveni et aram in qua scriptum erat ignoto deo quod ergo ignorantes colitis hoc ego adnuntio vobis"
      en: "For passing by, and seeing your idols, I found an altar also, on which was written: To the unknown God. What therefore you worship, without knowing it, that I preach to you:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Deus qui fecit mundum et omnia quae in eo sunt hic caeli et terrae cum sit Dominus non in manufactis templis inhabitat"
      en: "God, who made the world, and all things therein; he, being Lord of heaven and earth, dwelleth not in temples made with hands;"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "nec manibus humanis colitur indigens aliquo cum ipse det omnibus vitam et inspirationem et omnia"
      en: "Neither is he served with men's hands, as though he needed any thing; seeing it is he who giveth to all life, and breath, and all things:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "fecitque ex uno omne genus hominum inhabitare super universam faciem terrae definiens statuta tempora et terminos habitationis eorum"
      en: "And hath made of one, all mankind, to dwell upon the whole face of the earth, determining appointed times, and the limits of their habitation."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "quaerere Deum si forte adtractent eum aut inveniant quamvis non longe sit ab unoquoque nostrum"
      en: "That they should seek God, if happily they may feel after him or find him, although he be not far from every one of us:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "in ipso enim vivimus et movemur et sumus sicut et quidam vestrum poetarum dixerunt ipsius enim et genus sumus"
      en: "For in him we live, and move, and are; as some also of your own poets said: For we are also his offspring."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "genus ergo cum simus Dei non debemus aestimare auro aut argento aut lapidi sculpturae artis et cogitationis hominis divinum esse simile"
      en: "Being therefore the offspring of God, we must not suppose the divinity to be like unto gold, or silver, or stone, the graving of art, and device of man."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et tempora quidem huius ignorantiae despiciens Deus nunc adnuntiat hominibus ut omnes ubique paenitentiam agant"
      en: "And God indeed having winked at the times of this ignorance, now declareth unto men, that all should every where do penance."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "eo quod statuit diem in qua iudicaturus est orbem in aequitate in viro in quo statuit fidem praebens omnibus suscitans eum a mortuis"
      en: "Because he hath appointed a day wherein he will judge the world in equity, by the man whom he hath appointed; giving faith to all, by raising him up from the dead."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "cum audissent autem resurrectionem mortuorum quidam quidem inridebant quidam vero dixerunt audiemus te de hoc iterum"
      en: "And when they had heard of the resurrection of the dead, some indeed mocked, but others said: We will hear thee again concerning this matter."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "sic Paulus exivit de medio eorum"
      en: "So Paul went out from among them."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "quidam vero viri adherentes ei crediderunt in quibus et Dionisius Ariopagita et mulier nomine Damaris et alii cum eis"
      en: "But certain men adhering to him, did believe; among whom was also Dionysius, the Areopagite, and a woman named Damaris, and others with them."
    status: { la: verified, en: verified }
