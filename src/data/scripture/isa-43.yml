# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 43
verses:
  - n: 1
    text:
      la: "Et nunc haec dicit Dominus creans te, Jacob, et formans te, Israel: Noli timere, quia redemi te, et vocavi te nomine tuo; meus es tu."
      en: "And now thus saith the Lord that created thee, O Jacob, and formed thee, O Israel: Fear not, for I have redeemed thee, and called thee by thy name: thou art mine."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cum transieris per aquas, tecum ero, et flumina non operient te; cum ambulaveris in igne, non combureris, et flamma non ardebit in te."
      en: "When thou shalt pass through the waters, I will be with thee, and the rivers shall not cover thee: when thou shalt walk in the fire, thou shalt not be burnt, and the flames shall not burn in thee:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quia ego Dominus Deus tuus, Sanctus Israel, salvator tuus, dedi propitiationem tuam Aegyptum, Aethopiam, et Saba pro te."
      en: "For I am the Lord thy God, the Holy One of Israel, thy Saviour: I have given Egypt for thy atonement, Ethiopia and Saba for thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ex quo honorabilis factus es in oculis meis, et gloriosus, ego dilexi te, et dabo homines pro te, et populos pro anima tua."
      en: "Since thou becamest honourable in my eyes, thou art glorious: I have loved thee, and I will give men for thee, and people for thy life."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Noli timere, quia ego tecum sum; ab oriente adducam semen tuum, et ab occidente congregabo te."
      en: "Fear not, for I am with thee: I will bring thy seed from the east, and gather thee from the west."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dicam aquiloni: Da; et austro: Noli prohibere; affer filios meos de longinquo, et filias meas ab extremis terrae."
      en: "I will say to the north: Give up: and to the south: Keep not back: bring my sons from afar, and my daughters from the ends of the earth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et omnem qui invocat nomen meum, in gloriam meam creavi eum, formavi eum, et feci eum."
      en: "And every one that calleth upon my name, I have created him for my glory, I have formed him, and made him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Educ foras populum caecum, et oculos habentem; surdum, et aures ei sunt."
      en: "Bring forth the people that are blind, and have eyes: that are deaf, and have ears."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Omnes gentes congregatae sunt simul, et collectae sunt tribus. Quis in vobis annuntiet istud, et quae prima sunt audire nos faciet? Dent testes eorum, justificentur, et audiant et dicant: Vere."
      en: "All the nations are assembled together, and the tribes are gathered: who among you can declare this, and shall make us hear the former things? let them bring forth their witnesses, let them be justified, and hear, and say: It is truth."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Vos testes mei, dicit Dominus, et servus meus quem elegi; ut sciatis, et credatis mihi, et intelligatis quia ego ipse sum; ante me non est formatus Deus, et post me non erit."
      en: "You are my witnesses, saith the Lord, and my servant whom I have chosen: that you may know, and believe me, and understand that I myself am. Before me there was no God formed, and after me there shall be none."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ego sum, ego sum Dominus; et non est absque me salvator."
      en: "I am, I am the Lord: and there is no saviour besides me."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ego annuntiavi, et salvavi; auditum feci, et non fuit in vobis alienus: vos testes mei, dicit Dominus, et ego Deus."
      en: "I have declared, and have saved. I have made it heard, and there was no strange one among you. You are my witnesses, saith the Lord, and I am God."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et ab initio ego ipse; et non est qui de manu mea eruat. Operabor, et quis avertet illud?"
      en: "And from the beginning I am the same, and there is none that can deliver out of my hand: I will work, and who shall turn it away?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Haec dicit Dominus, redemptor vester, Sanctus Israel: Propter vos misi in Babylonem, et detraxi vectes universos, et Chaldaeos in navibus suis gloriantes."
      en: "Thus saith the Lord your redeemer, the Holy One of Israel: For your sake I sent to Babylon, and have brought down all their bars, and the Chaldeans glorying in their ships."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ego Dominus, Sanctus vester, creans Israel, rex vester."
      en: "I am the Lord your Holy One, the Creator of Israel, your King."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Haec dicit Dominus, qui dedit in mari viam, et in aquis torrentibus semitam;"
      en: "Thus saith the Lord, who made a way in the sea, and a path in the mighty waters."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qui eduxit quadrigam et equum, agmen et robustum; simul obdormierunt, nec resurgent; contriti sunt quasi linum, et extincti sunt."
      en: "Who brought forth the chariot and the horse, the army and the strong: they lay down to sleep together, and they shall not rise again: they are broken as flax, and are extinct."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ne memineritis priorum, et antiqua ne intueamini."
      en: "Remember not former things, and look not on things of old."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ecce ego facio nova, et nunc orientur, utique cognoscetis ea; ponam in deserto viam, et in invio flumina."
      en: "Behold I do new things, and now they shall spring forth, verily you shall know them: I will make a way in the wilderness, and rivers in the desert."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Glorificabit me bestia agri, dracones, et struthiones, quia dedi in deserto aquas, flumina in invio, ut darem potum populo meo, electo meo."
      en: "The beast of the field shall glorify me, the dragons and the ostriches: because I have given waters in the wilderness, rivers in the desert, to give drink to my people, to my chosen."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Populum istum formavi mihi, laudem meam narrabit."
      en: "This people have I formed for myself, they shall shew forth my praise."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Non me invocasti, Jacob; nec laborasti in me, Israel."
      en: "But thou hast not called upon me, O Jacob, neither hast thou laboured about me, O Israel."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Non obtulisti mihi arietem holocausti tui, et victimis tuis non glorificasti me; non te servire feci in oblatione, nec laborem tibi praebui in thure."
      en: "Thou hast not offered me the ram of thy holocaust, nor hast thou glorified me with thy victims: I have not caused thee to serve with oblations, nor wearied thee with incense."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Non emisti mihi argento calamum, et adipe victimarum tuarum non inebriasti me; verumtamen servire me fecisti in peccatis tuis, praebuisti mihi laborem in iniquitatibus tuis."
      en: "Thou hast bought me no sweet cane with money, neither hast thou filled me with the fat of thy victims. But thou hast made me to serve with thy sins, thou hast wearied me with thy iniquities."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Ego sum, ego sum ipse qui deleo iniquitates tuas propter me, et peccatorum tuorum non recordabor."
      en: "I am, I am he that blot out thy iniquities for my own sake, and I will not remember thy sins."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Reduc me in memoriam, et judicemur simul: narra si quid habes ut justificeris."
      en: "Put me in remembrance, and let us plead together: tell if thou hast any thing to justify thyself."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Pater tuus primus peccavit, et interpretes tui praevaricati sunt in me:"
      en: "Thy first father sinned, and thy teachers have transgressed against me."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et contaminavi principes sanctos; dedi ad internecionem Jacob, et Israel in blasphemiam."
      en: "And I have profaned the holy princes, I have given Jacob to slaughter, and Israel to reproach."
    status: { la: verified, en: verified }
