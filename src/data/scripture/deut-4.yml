# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: deut
chapter: 4
verses:
  - n: 1
    text:
      la: "Et nunc, Israel, audi praecepta et judicia, quae ego doceo te: ut faciens ea, vivas, et ingrediens possideas terram, quam Dominus Deus patrum vestrorum daturus est vobis."
      en: "And now, O Israel, hear the commandments and judgments which I teach thee: that doing them, thou mayst live, and entering in mayst possess the land which the Lord the God of your fathers will give you."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Non addetis ad verbum, quod vobis loquor, nec auferetis ex eo: custodite mandata Domini Dei vestri, quae ego praecipio vobis."
      en: "You shall not add to the word that I speak to you, neither shall you take away from it: keep the commandments of the Lord your God which I command you."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Oculi vestri viderunt omnia quae fecit Dominus contra Beelphegor, quomodo contriverit omnes cultores ejus de medio vestri."
      en: "Your eyes have seen all that the Lord hath done against Beelphegor, how he hath destroyed all his worshippers from among you."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Vos autem qui adhaeretis Domino Deo vestro, vivitis universi usque in praesentem diem."
      en: "But you that adhere to the Lord your God, are all alive until this present day."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Scitis quod docuerim vos praecepta atque justitias, sicut mandavit mihi Dominus Deus meus: sic facietis ea in terra, quam possessuri estis:"
      en: "You know that I have taught you statutes and justices, as the Lord my God hath commanded me: so shall you do them in the land which you shall possess:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et observabitis et implebitis opere. Haec est enim vestra sapientia, et intellectus coram populis, ut audientes universa praecepta haec, dicant: En populus sapiens et intelligens, gens magna."
      en: "And you shall observe, and fulfill them in practice. For this is your wisdom, and understanding in the sight of nations, that hearing all these precepts, they may say: Behold a wise and understanding people, a great nation."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nec est alia natio tam grandis, quae habeat deos appropinquantes sibi, sicut Deus noster adest cunctis obsecrationibus nostris."
      en: "Neither is there any other nation so great, that hath gods so nigh them, as our God is present to all our petitions."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quae est enim alia gens sic inclyta, ut habeat caeremonias, justaque judicia, et universam legem, quam ego proponam hodie ante oculos vestros?"
      en: "For what other nation is there so renowned that hath ceremonies, and just judgments, and all the law, which I will set forth this day before your eyes?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Custodi igitur temetipsum, et animam tuam sollicite. Ne obliviscaris verborum, quae viderunt oculi tui, et ne excidant de corde tuo cunctis diebus vitae tuae. Docebis ea filios ac nepotes tuos,"
      en: "Keep thyself therefore, and thy soul carefully. Forget not the words that thy eyes have seen, and let them not go out of thy heart all the days of thy life. Thou shalt teach them to thy sons and to thy grandsons,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "a die in quo stetisti coram Domino Deo tuo in Horeb, quando Dominus locutus est mihi, dicens: Congrega ad me populum, ut audiant sermones meos, et discant timere me omni tempore quo vivunt in terra, doceantque filios suos."
      en: "From the day in which thou didst stand before the Lord thy God in Horeb, when the Lord spoke to me, saying: Call together the people unto me, that they may hear my words, and may learn to fear me all the time that they live on the earth, and may teach their children."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et accessistis ad radices montis, qui ardebat usque ad caelum: erantque in eo tenebrae, et nubes, et caligo."
      en: "And you came to the foot of the mount, which burned even unto heaven: and there was darkness, and a cloud and obscurity in it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Locutusque est Dominus ad vos de medio ignis. Vocem verborum ejus audistis, et formam penitus non vidistis."
      en: "And the Lord spoke to you from the midst of the fire. You heard the voice of his words, but you saw not any form at all."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et ostendit vobis pactum suum, quod praecepit ut faceretis, et decem verba, quae scripsit in duabus tabulis lapideis."
      en: "And he shewed you his covenant, which he commanded you to do, and the ten words that he wrote in two tables of stone."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Mihique mandavit in illo tempore ut docerem vos caeremonias et judicia, quae facere deberetis in terra, quam possessuri estis."
      en: "And he commanded me at that time that I should teach you the ceremonies and judgments which you shall do in the land, that you shall possess."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Custodite igitur sollicite animas vestras. Non vidistis aliquam similitudinem in die, qua locutus est vobis Dominus in Horeb de medio ignis:"
      en: "Keep therefore your souls carefully. You saw not any similitude in the day that the Lord God spoke to you in Horeb from the midst of the fire:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ne forte decepti faciatis vobis sculptam similitudinem, aut imaginem masculi vel feminae:"
      en: "Lest perhaps being deceived you might make you a graven similitude, or image of male or female,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "similitudinem omnium jumentorum, quae sunt super terram, vel avium sub caelo volantium,"
      en: "The similitude of any beasts, that are upon the earth, or of birds, that fly under heaven,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "atque reptilium, quae moventur in terra, sive piscium qui sub terra morantur in aquis:"
      en: "Or of creeping things, that move on the earth, or of fishes, that abide in the waters under the earth:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ne forte elevatis oculis ad caelum, videas solem et lunam, et omnia astra caeli, et errore deceptus adores ea, et colas quae creavit Dominus Deus tuus in ministerium cunctis gentibus, quae sub caelo sunt."
      en: "Lest perhaps lifting up thy eyes to heaven, thou see the sun and the moon, and all the stars of heaven, and being deceived by error thou adore and serve them, which the Lord thy God created for the service of all the nations, that are under heaven."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Vos autem tulit Dominus, et eduxit de fornace ferrea Aegypti, ut haberet populum haereditarium, sicut est in praesenti die."
      en: "But the Lord hath taken you and brought you out of the iron furnace of Egypt, to make you his people of inheritance, as it is this present day."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Iratusque est Dominus contra me propter sermones vestros, et juravit ut non transirem Jordanem, nec ingrederer terram optimam, quam daturus est vobis."
      en: "And the Lord was angry with me for your words, and he swore that I should not pass over the Jordan, nor enter into the excellent land, which he will give you."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ecce morior in hac humo; non transibo Jordanem: vos transibitis, et possidebitis terram egregiam."
      en: "Behold I die in this land, I shall not pass over the Jordan: you shall pass, and possess the goodly land."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cave nequando obliviscaris pacti Domini Dei tui, quod pepigit tecum, et facias tibi sculptam similitudinem eorum, quae fieri Dominus prohibuit:"
      en: "Beware lest thou ever forget the covenant of the Lord thy God, which he hath made with thee: and make to thyself a graven likeness of those things which the Lord hath forbid to be made:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "quia Dominus Deus tuus ignis consumens est, Deus aemulator."
      en: "Because the Lord thy God is a consuming fire, a jealous God."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Si genueritis filios ac nepotes, et morati fueritis in terra, deceptique feceritis vobis aliquam similitudinem, patrantes malum coram Domino Deo vestro, ut eum ad iracundiam provocetis:"
      en: "If you shall beget sons and grandsons, and abide in the land, and being deceived, make to yourselves any similitude, committing evil before the Lord your God, to provoke him to wrath:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "testes invoco hodie caelum et terram, cito perituros vos esse de terra, quam transito Jordane possessuri estis: non habitabitis in ea longo tempore, sed delebit vos Dominus,"
      en: "I call this day heaven and earth to witness, that you shall quickly perish out of the land, which, when you have passed over the Jordan, you shall possess. You shall not dwell therein long, but the Lord will destroy you,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "atque disperget in omnes gentes, et remanebitis pauci in nationibus, ad quas vos ducturus est Dominus."
      en: "And scatter you among all nations, and you shall remain a few among the nations, to which the Lord shall lead you."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Ibique servietis diis, qui hominum manu fabricati sunt, ligno et lapidi qui non vident, nec audiunt, nec comedunt, nec odorantur."
      en: "And there you shall serve gods, that were framed with men's hands: wood and stone, that neither see, nor hear, nor eat, nor smell."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Cumque quaesieris ibi Dominum Deum tuum, invenies eum: si tamen toto corde quaesieris, et tota tribulatione animae tuae."
      en: "And when thou shalt seek there the Lord thy God, thou shalt find him: yet so, if thou seek him with all thy heart, and all the affliction of thy soul."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Postquam te invenerint omnia quae praedicta sunt, novissimo tempore reverteris ad Dominum Deum tuum, et audies vocem ejus."
      en: "After all the things aforesaid shall and thee, in the latter time thou shalt return to the Lord thy God, and shalt hear his voice."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Quia Deus misericors Dominus Deus tuus est: non dimittet te, nec omnino delebit, neque obliviscetur pacti, in quo juravit patribus tuis."
      en: "Because the Lord thy God is a merciful God: he will not leave thee, nor altogether destroy thee, nor forget the covenant, by which he swore to thy fathers."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Interroga de diebus antiquis, qui fuerunt ante te ex die quo creavit Deus hominem super terram, a summo caelo usque ad summum ejus, si facta est aliquando hujuscemodi res, aut umquam cognitum est,"
      en: "Ask of the days of old, that have been before thy time from the day that God created man upon the earth, from one end of heaven to the other end thereof, if ever there was done the like thing, or it hath been known at any time,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "ut audiret populus vocem Dei loquentis de medio ignis, sicut tu audisti, et vixisti:"
      en: "That a people should hear the voice of God speaking out of the midst of fire, as thou hast heard, and lived:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "si fecit Deus ut ingrederetur, et tolleret sibi gentem de medio nationum, per tentationes, signa atque portenta, per pugnam et robustam manum, extentumque brachium, et horribiles visiones juxta omnia quae fecit pro vobis Dominus Deus vester in Aegypto, videntibus oculis tuis:"
      en: "If God ever did so as to go, and take to himself a nation out of the midst of nations by temptations, signs, and wonders, by fight, and a strong hand, and stretched out arm, and horrible visions according to all the things that the Lord your God did for you in Egypt, before thy eyes."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "ut scires quoniam Dominus ipse est Deus, et non est alius praeter eum."
      en: "That thou mightest know that the Lord he is God, and there is no other besides him."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "De caelo te fecit audire vocem suam, ut doceret te, et in terra ostendit tibi ignem suum maximum, et audisti verba illius de medio ignis:"
      en: "From heaven he made thee to hear his voice, that he might teach thee. And upon earth he shewed thee his exceeding great fire, and thou didst hear his words out of the midst of the fire,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "quia dilexit patres tuos, et elegit semen eorum post eos. Eduxitque te praecedens in virtute sua magna ex Aegypto,"
      en: "Because he loved thy fathers, and chose their seed after them. And he brought thee out of Egypt, going before thee with his great power,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "ut deleret nationes maximas et fortiores te in introitu tuo: et introduceret te, daretque tibi terram earum in possessionem, sicut cernis in praesenti die."
      en: "To destroy at thy coming very great nations, and stronger than thou art, and to bring thee in, and give thee their land for a possession, as thou seest at this present day."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Scito ergo hodie, et cogitato in corde tuo quod Dominus ipse sit Deus in caelo sursum, et in terra deorsum, et non sit alius."
      en: "Know therefore this day, and think in thy heart that the Lord he is God in heaven above, and in the earth beneath, and there is no other."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Custodi praecepta ejus atque mandata, quae ego praecipio tibi: ut bene sit tibi, et filiis tuis post te, et permaneas multo tempore super terram, quam Dominus Deus tuus daturus est tibi."
      en: "Keep his precepts and commandments, which I command thee: that it may be well with thee, and thy children after thee, and thou mayst remain a long time upon the land, which the Lord thy God will give thee."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Tunc separavit Moyses tres civitates trans Jordanem ad orientalem plagam,"
      en: "Then Moses set aside three cities beyond the Jordan at the east side,"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "ut confugiat ad eas qui occiderit nolens proximum suum, nec sibi fuerit inimicus ante unum et alterum diem, et ad harum aliquam urbium possit evadere:"
      en: "That any one might flee to them who should kill his neighbour unwillingly, and was not his enemy a day or two before, and that he might escape to some one of these cities:"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Bosor in solitudine, quae sita est in terra campestri de tribu Ruben: et Ramoth in Galaad, quae est in tribu Gad: et Golan in Basan, quae est in tribu Manasse."
      en: "Bosor in the wilderness, which is situate in the plains of the tribe of Ruben: and Ramoth in Galaad, which is in the tribe of Gad: and Golan in Basan, which is in the tribe of Manasses."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Ista est lex, quam proposuit Moyses coram filiis Israel:"
      en: "This is the law, that Moses set before the children of Israel,"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et haec testimonia et caeremoniae atque judicia, quae locutus est ad filios Israel, quando egressi sunt de Aegypto,"
      en: "And these are the testimonies and ceremonies and judgments, which he spoke to the children of Israel, when they came out of Egypt,"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "trans Jordanem in valle contra fanum Phogor in terra Sehon regis Amorrhaei, qui habitavit in Hesebon, quem percussit Moyses. Filii quoque Israel egressi ex Aegypto"
      en: "Beyond the Jordan in the valley over against the temple of Phogor, in the land of Sehon king of the Amorrhites, that dwelt in Hesebon, whom Moses slew. And the children of Israel coming out of Egypt,"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "possederunt terram ejus, et terram Og regis Basan, duorum regum Amorrhaeorum, qui erant trans Jordanem ad solis ortum:"
      en: "Possessed his land, and the land of Og king of Basan, of the two kings of the Amorrhites, who were beyond the Jordan towards the rising of the sun:"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "ab Aroer, quae sita est super ripam torrentis Arnon, usque ad montem Sion, qui est et Hermon,"
      en: "From Aroer, which is situate upon the bank of the torrent Arnon, unto mount Sion, which is also called Hermon,"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "omnem planitiem trans Jordanem ad orientalem plagam, usque ad mare solitudinis, et usque ad radices montis Phasga."
      en: "All the plain beyond the Jordan at the east side, unto the sea of the wilderness, and unto the foot of mount Phasga."
    status: { la: verified, en: verified }
