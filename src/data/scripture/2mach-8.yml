book: 2mach
chapter: 8
verses:
  - n: 1
    text:
      la: "Iudas vero Macchabeus et qui cum illo erant introibant latenter in castella et convocantes cognatos et eos qui permanserant in iudaismo adsumentes eduxerunt ad sex milia viros"
      en: "But Judas Machabeus, and they that were with him, went privately into the towns: and calling together their kinsmen and friends, and taking unto them such as continued in the Jews' religion, they assembled six thousand men."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et invocabant Dominum ut respiceret in populum qui ab omnibus calcabatur misereretur templo quod contaminabatur ab impiis"
      en: "And they called upon the Lord that he would look upon his people that was trodden down by all, and would have pity on the temple, that was defiled by the wicked:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "misereretur etiam exterminio civitatis quae esset ilico conplananda et vocem sanguinis ad se clamantis audiret"
      en: "That he would have pity also upon the city that was destroyed, that was ready to be made even with the ground, and would hear the voice of the blood that cried to him:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "memoraretur quoque iniquissimas mortes innocentium parvulorum et blasphemias nomini suo inlatas et indignaretur super his"
      en: "That he would remember also the most unjust deaths of innocent children, and the blasphemies offered to his name, and would shew his indignation on this occasion."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "at Macchabeus congregata multitudine intolerabilis gentibus efficiebatur ira enim Domini in misericordiam conversa est"
      en: "Now when Machabeus had gathered a multitude, he could not be withstood by the heathens: for the wrath of the Lord was turned into mercy."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et superveniens castellis et civitatibus inprovisus succendebat eas et oportuna loca occupans non paucas hostium strages dabat"
      en: "So coming unawares upon the towns and cities, he set them on fire, and taking possession of the most commodious places, he made no small slaughter of the enemies �"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "maxime autem noctibus ad huiuscemodi excursus ferebatur et fama virtutis eius ubique diffundebatur"
      en: "And especially in the nights he went upon these expeditions, and the fame of his valour was spread abroad every where."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "videns autem Philippus paulatim virum ad profectum venire ac frequentius res ei prospere cedere ad Ptolomeum ducem Coelesyriae et Foenicis scripsit ut auxilium ferret regis negotiis"
      en: "Then Philip, seeing that the man gained ground by little and little, and that things for the most part succeeded prosperously with him, wrote to Ptolemee the governor of Celesyria and Phenicia, to send aid to the king's affairs."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "at ille velociter misit Nicanorem Patrocli de primoribus amicum datis ei permixtis gentibus armatis non minus viginti milibus ut universum Iudaeorum genus deleret adiuncto ei Gorgia viro militari"
      en: "And he with all speed sent Nicanor the son of Patroclus, one of his special friends, giving him no fewer than twenty thousand armed men of different nations, to root out the whole race of the Jews, joining also with him Gorgias, a good soldier, and of great experience in matters of war."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "constituit autem Nicanor regi ut tributum Romanis quod erat dandum duo milia talentum de captivitate Iudaeorum suppleret"
      en: "And Nicanor purposed to raise for the king the tribute of two thousand talents, that was to be given to the Romans, by making so much money of the captive Jews:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "statimque ad maritimas misit civitates convocans ad coemptionem iudaeorum mancipiorum promittens se nonaginta mancipia talento distracturum non respiciens ad vindictam quae eum ab Omnipotente esset consecutura"
      en: "Wherefore he sent immediately to the cities upon the sea coast, to invite men together to buy up the Jewish slaves, promising that they should have ninety slaves for one talent, not reflecting on the vengeance, which was to follow him from the Almighty."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Iudas autem ubi conperit indicavit his qui secum erant Iudaeis Nicanoris adventum"
      en: "Now when Judas found that Nicanor was coming, he imparted to the Jews that were with him, that the enemy was at hand."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ex quibus quidam formidantes et non credentes Dei iustitiae in fugam vertebantur"
      en: "And some of them being afraid, and distrusting the justice of God, fled away:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "alii vero si quid eis supererat vendebant simulque Dominum deprecabantur ut eriperet eos ab impio Nicanore qui eos priusquam in comminus veniret vendiderat"
      en: "Others sold all that they had left, and withal besought the Lord, that he would deliver them from the wicked Nicanor, who had sold them before he came near them:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "si non propter eos propter testamentum quod erat ad patres eorum et propter invocationem sancti et magnifici nominis eius super ipsos"
      en: "And if not for their sakes, yet for the covenant that he had made with their fathers, and for the sake of his holy and glorious name that was invoked upon them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "convocatis autem Macchabeus septem milibus qui cum ipso erant rogabat ne hostibus reconciliarentur neque metuerent inique venientium adversum se hostium multitudinem sed fortiter contenderent"
      en: "But Machabeus calling together seven thousand that were with him, exhorted them not to be reconciled to the enemies, nor to fear the multitude of the enemies who came wrongfully against them, but to fight manfully:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ante oculos habentes contumeliam quae in locum sanctum ab his iniuste esset inlata itemque et ludibria habitae civitatis iniuriam adhuc etiam veterum instituta convulsa"
      en: "Setting before their eyes the injury they had unjustly done the holy place, and also the injury they had done to the city, which had been shamefully abused, besides their destroying the ordinances of the fathers."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "nam illi quidem armis confidunt ait simul et audacia nos autem in omnipotente Domino qui potest venientes adversus nos et universum mundum uno nutu delere confidimus"
      en: "For, said he, they trust in their weapons, and in their boldness: but we trust in the Almighty Lord, who at a beck can utterly destroy both them that come against us, and the whole world."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "admonuit autem eos et de auxiliis Dei quae facta sunt erga parentes et sub Sennacherim centum octoginta quinque milia ut perierunt"
      en: "Moreover he put them in mind also of the helps their fathers had received from God: and how under Sennacherib a hundred and eighty-five thousand had been destroyed."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et de proelio quod eis adversus Galatas fuit in Babylonia ut omnes ubi ad rem ventum est Macedonibus sociis haesitantibus ipsi sex milia soli peremerunt centum viginti milia propter auxilium illis datum e caelo et beneficia pro his plurima consecuti sunt"
      en: "And of the battle that they had fought against the Galatians in Babylonia, how they, being in all but six thousand, when it came to the point, and Macedonians their companions were a stand, slew a hundred and twenty thousand, because of the help they had from heaven, and for this they received many favours."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "his verbis constantes effecti sunt et pro legibus et patria mori parati"
      en: "With these words they were greatly encouraged, and disposed even to die for the laws and their country."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "constituit itaque fratres suos duces utrique ordini Simonem et Iosepphum et Ionathan subiectis unicuique millenis et quingentenis"
      en: "So he appointed his brethren cap over each division of his army, Simon, and Joseph, and Jonathan, giving to one fifteen hundred men."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ad hoc etiam ab Ezra lecto illis sancto libro et dato signo adiutorio Dei in prima acie ipse dux commisit cum Nicanore"
      en: "And after the holy Book had been read to them by Esdras, and he had given them for a watchword, The help of God: himself leading the first band, he joined battle with Nicanor:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et facto sibi adiutore Omnipotente interfecerunt super novem milia hominum maiorem autem partem exercitus Nicanoris vulneribus debilem factam fugere conpulerunt"
      en: "And the Almighty being their helper, they slew above nine thousand men: and having wounded and disabled the greater part of Nicanor's army, they obliged them to fly."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "pecuniis vero eorum qui ad emptionem ipsorum venerant sublatis ipsos usquequaque persecuti sunt"
      en: "And they took the money of them that came to buy them, and they pursued them on every side."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "sed reverterunt hora conclusi nam erat ante sabbatum quam ob causam non perseveraverunt insequentes"
      en: "But they came back for want of time: for it was the day before the sabbath: and therefore they did not continue the pursuit."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "arma autem ipsorum et spolia congregantes sabbatum agebant benedicentes Dominum qui liberavit eos in isto die misericordiae initium stillans in eos"
      en: "But when they had gathered together their arms and their spoils, they kept the sabbath: blessing the Lord who had delivered them that day, distilling the beginning of mercy upon them."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "post sabbatum vero debilibus et orfanis et viduis diviserunt spolia et residua ipsi cum suis habuere"
      en: "Then after the sabbath they divided the spoils to the feeble and the orphans, and the widows: and the rest they took for themselves and their servants."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "his ita gestis et communiter ab omnibus facta obsecratione misericordem Dominum postulabant ut in finem servis suis reconciliaretur"
      en: "When this was done, and they had all made a common supplication, they besought the merciful Lord to be reconciled to his servants unto the end."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et ex his qui cum Timotheo et Bacchide erant contra se contendentes super viginti milia interfecerunt et munitiones excelsas obtinuerunt et plures praedas diviserunt aequam portionem debilibus pupillis et viduis sed et senioribus facientes"
      en: "Moreover they slew above twenty thousand of them that were with Timotheus and Bacchides who fought them, and they made themselves masters of the high strong holds: and they divided amongst them many spoils, giving equal portions to the feeble, the fatherless and the widows, yea and the aged also."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et cum arma eorum collegissent diligenter omnia conposuerunt in locis oportunis residua vero spolia Hierosolymam detulerunt"
      en: "And when they had carefully gathered together their arms, they laid them all up in convenient places, and the residue of their spoils they carried to Jerusalem :"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et phylarchen qui cum Timotheo erat interfecerunt virum scelestum qui in multis Iudaeos adflixerat"
      en: "They slew also Philarches who was with Timotheus, a wicked man, who had many ways afflicted the Jews."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et cum epicinia agerent in Hierosolymis eos qui sacras ianuas incenderant id est Callistenen cum in quodam domicilio refugisset incenderunt digna ei mercede pro impietatibus suis reddita"
      en: "And when they kept the feast of the victory at Jerusalem, they burnt Callisthenes, that had set fire to the holy gates, who had taken refuge in a certain house, rendering to him a worthy reward for his impieties:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "facinorosissimus autem Nicanor qui mille negotiantes ad Iudaeorum venditionem adduxerat"
      en: "But as for that most wicked man Nicanor, who had brought a thousand merchants to the sale of the Jews,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "humiliatus auxilio Domini ab his quos nullos existimaverat deposita veste gloriae per mediterranea fugiens solus venit Antiochiam summam infelicitatem de interitu sui exercitus consecutus"
      en: "Being through the help of the Lord brought down by them, of whom he had made no account, laying; aside his garment of glory, fleeing through the midland country, he came alone to Antioch, being rendered very unhappy by the destruction of his army."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et qui promiserat Romanis se tributum restituere de captivitate Hierosolymorum praedicabat nunc protectorem Deum habere Iudaeos et ob ipsum invulnerabiles esse eo quod sequerentur leges ab ipso constitutas"
      en: "And he that had promised to levy the tribute for the Romans by the means of the captives of Jerusalem, now professed that the Jews had God for their protector, and therefore they could not be hurt, because they followed the laws appointed by him."
    status: { la: verified, en: verified }
