# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 1
verses:
  - n: 1
    text:
      la: "Omnis sapientia a Domino Deo est: et cum illo fuit semper, et est ante aevum."
      en: "All wisdom is from the Lord God, and hath been always with him, and is before all time."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Arenam maris, et pluviae guttas, et dies saeculi, quis dinumeravit? altitudinem caeli, et latitudinem terrae, et profundum abyssi, quis dimensus est?"
      en: "Who hath numbered the sand of the sea, and the drops of rain, and the days of the world? Who hath measured the height of heaven, and the breadth of the earth, and the depth of the abyss?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sapientiam Dei praecedentem omnia, quis investigavit?"
      en: "Who hath searched out the wisdom of God that goeth before all things?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Prior omnium creata est sapientia, et intellectus prudentiae ab aevo."
      en: "Wisdom hath been created before all things, and the understanding of prudence from everlasting."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Fons sapientiae verbum Dei in excelsis, et ingressus illius mandata aeterna."
      en: "The word of God on high is the fountain of wisdom, and her ways are everlasting commandments."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Radix sapientiae cui revelata est? et astutias illius quis agnovit?"
      en: "To whom hath the root of wisdom been revealed, and who hath known her wise counsels?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "disciplina sapientiae cui revelata est et manifestata? et multiplicationem ingressus illius quis intellexit?"
      en: "To whom hath the discipline of wisdom been revealed and made manifest? and who hath understood the multiplicity of her steps?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Unus est altissimus, Creator omnipotens, et rex potens et metuendus nimis, sedens super thronum illius, et dominans Deus."
      en: "There is one most high Creator Almighty, and a powerful king, and greatly to be feared, who sitteth upon his throne, and is the God of dominion."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ipse creavit illam in Spiritu Sancto, et vidit, et dinumeravit, et mensus est:"
      en: "He created her in the Holy Ghost, and saw her, and numbered her, and measured her."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et effudit illam super omnia opera sua, et super omnem carnem, secundum datum suum, et praebuit illam diligentibus se."
      en: "And he poured her out upon all his works, and upon all flesh according to his gift, and hath given her to them that love him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Timor Domini gloria, et gloriatio, et laetitia, et corona exsultationis."
      en: "The fear of the Lord is honour, and glory, and gladness, and a crown of joy."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Timor Domini delectabit cor, et dabit laetitiam, et gaudium, et longitudinem dierum."
      en: "The fear of the Lord shall delight the heart, and shall give joy, and gladness, and length of days."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Timenti Dominum bene erit in extremis, et in die defunctionis suae benedicetur."
      en: "With him that feareth the Lord, it shall go well in the latter end, and in the day of his death he shall be blessed."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dilectio Dei honorabilis sapientia:"
      en: "The love of God is honourable wisdom."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quibus autem apparuerit in visu diligunt eam in visione, et in agnitione magnalium suorum."
      en: "And they to whom she shall shew herself love her by the sight, and by the knowledge of her great works."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Initium sapientiae timor Domini: et cum fidelibus in vulva concreatus est: cum electis feminis graditur, et cum justis et fidelibus agnoscitur."
      en: "The fear of the Lord is the beginning of wisdom, and was created with the faithful in the womb, it walketh with chosen women, and is known with the just and faithful."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Timor Domini scientiae religiositas:"
      en: "The fear of the Lord is the religiousness of knowledge."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "religiositas custodiet et justificabit cor; jucunditatem atque gaudium dabit."
      en: "Religiousness shall keep and justify the heart, it shall give joy and gladness."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Timenti Dominum bene erit, et in diebus consummationis illius benedicetur."
      en: "It shall go well with him that feareth the Lord, and in the days of his end he shall be blessed."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Plenitudo sapientiae est timere Deum, et plenitudo a fructibus illius."
      en: "To fear God is the fulness of wisdom, and fulness is from the fruits thereof."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Omnem domum illius implebit a generationibus, et receptacula a thesauris illius."
      en: "She shall fill all her house with her increase, and the storehouses with her treasures."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Corona sapientiae timor Domini, replens pacem et salutis fructum:"
      en: "The fear of the Lord is a crown of wisdom, filling up peace and the fruit of salvation:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et vidit, et dinumeravit eam: utraque autem sunt dona Dei."
      en: "And it hath seen, and numbered her: but both are the gifts of God."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Scientiam et intellectum prudentiae sapientia compartietur, et gloriam tenentium se exaltat."
      en: "Wisdom shall distribute knowledge, and understanding of prudence: and exalteth the glory of them that hold her."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Radix sapientiae est timere Dominum, et rami illius longaevi."
      en: "The root of wisdom is to fear the Lord: and the branches thereof are longlived."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "In thesauris sapientiae intellectus et scientiae religiositas: execratio autem peccatoribus sapientia."
      en: "In the treasures of wisdom is understanding, and religiousness of knowledge: but to sinners wisdom is an abomination."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Timor Domini expellit peccatum:"
      en: "The fear of the Lord driveth out sin:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "nam qui sine timore est non poterit justificari: iracundia enim animositatis illius subversio illius est."
      en: "For he that is without fear, cannot be justified: for the wrath of his high spirits is his ruin."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Usque in tempus sustinebit patiens, et postea redditio jucunditatis."
      en: "A patient man shall bear for a time, and afterwards joy shall be restored to him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Bonus sensus usque in tempus abscondet verba illius, et labia multorum enarrabunt sensum illius."
      en: "A good understanding will hide his words for a time, and the lips of many shall declare his wisdom."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "In thesauris sapientiae significatio disciplinae:"
      en: "In the treasures of wisdom is the signification of discipline:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "execratio autem peccatori cultura Dei."
      en: "But the worship of God is an abomination to a sinner."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Fili, concupiscens sapientiam, conserva justitiam, et Deus praebebit illam tibi."
      en: "Son, if thou desire wisdom, keep justice, and God will give her to thee."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Sapientia enim et disciplina timor Domini: et quod beneplacitum est illi,"
      en: "For the fear of the Lord is wisdom and discipline: and that which is agreeable to him,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "fides et mansuetudo, et adimplebit thesauros illius."
      en: "Is faith, and meekness: and he will fill up his treasures."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Ne sis incredibilis timori Domini, et ne accesseris ad illum duplici corde."
      en: "Be not incredulous to the fear of the Lord: and come not to him with a double heart."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Ne fueris hypocrita in conspectu hominum, et non scandalizeris in labiis tuis."
      en: "Be not a hypocrite in the sight of men, and let not thy lips be a stumblingblock to thee."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Attende in illis, ne forte cadas, et adducas animae tuae inhonorationem:"
      en: "Watch over them, lest thou fall, and bring dishonour upon thy soul,"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et revelet Deus absconsa tua, et in medio synagogae elidat te:"
      en: "And God discover thy secrets, and cast thee down in the midst of the congregation."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "quoniam accessisti maligne ad Dominum, et cor tuum plenum est dolo et fallacia."
      en: "Because thou camest to the Lord wickedly, and thy heart is full of guile and deceit."
    status: { la: verified, en: verified }
