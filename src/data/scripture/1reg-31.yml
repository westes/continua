# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1reg
chapter: 31
verses:
  - n: 1
    text:
      la: "Philisthiim autem pugnabant adversum Israel: et fugerunt viri Israel ante faciem Philisthiim, et ceciderunt interfecti in monte Gelboe."
      en: "And the Philistines fought against Israel, and the men of Israel fled from before the Philistines, and fell down slain in mount Gelboe."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Irrueruntque Philisthiim in Saul, et in filios ejus, et percusserunt Jonathan, et Abinadab, et Melchisua filios Saul,"
      en: "And the Philistines fell upon Saul, and upon his sons, and they slew Jonathan, and Abinadab and Melchisua the sons of Saul."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "totumque pondus praelii versum est in Saul: et consecuti sunt eum viri sagittarii, et vulneratus est vehementer a sagittariis."
      en: "And the whole weight of the battle was turned upon Saul: and the archers overtook him, and he was grievously wounded by the archers."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dixitque Saul ad armigerum suum: Evagina gladium tuum, et percute me: ne forte veniant incircumcisi isti, et interficiant me, illudentes mihi. Et noluit armiger ejus: fuerat enim nimio terrore perterritus. Arripuit itaque Saul gladium, et irruit super eum."
      en: "Then Saul said to his armourbearer: Draw thy sword, and kill me: lest these uncircumcised come, and slay me, and mock at me. And his armourbearer would not: for he was struck with exceeding great fear. Then Saul took his sword, and fell upon it."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quod cum vidisset armiger ejus, videlicet quod mortuus esset Saul, irruit etiam ipse super gladium suum, et mortuus est cum eo."
      en: "And when his armourbearer saw this, to wit, that Saul was dead, he also fell upon his sword and died with him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Mortuus est ergo Saul, et tres filii ejus, et armiger illius, et universi viri ejus in die illa pariter."
      en: "So Saul died, and his three sons, and his armourbearer, and all his men that same day together."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Videntes autem viri Israel, qui erant trans vallem, et trans Jordanem, quod fugissent viri Israelitae, et quod mortuus esset Saul, et filii ejus, reliquerunt civitates suas, et fugerunt: veneruntque Philisthiim, et habitaverunt ibi."
      en: "And the men of Israel, that were beyond the valley, and beyond the Jordan, seeing that the Israelites were fled, and that Saul was dead, and his sons, forsook their cities, and fled: and the Philistines came, and dwelt there."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Facta autem die altera, venerunt Philisthiim, ut spoliarent interfectos, et invenerunt Saul et tres filios ejus jacentes in monte Gelboe."
      en: "And on the morrow the Philistines came to strip the slain, and they found Saul and his three sons lying in mount Gelboe."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et praeciderunt caput Saul, et spoliaverunt eum armis: et miserunt in terram Philisthinorum per circuitum, ut annuntiaretur in templo idolorum, et in populis."
      en: "And they cut off Saul's head, and stripped him of his armour, and sent into the land of the Philistines round about, to publish it in the temples of their idols, and among their people."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et posuerunt arma ejus in templo Astaroth, corpus vero ejus suspenderunt in muro Bethsan."
      en: "And they put his armour in the temple of Astaroth, but his body they hung on the wall of Bethsan."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quod cum audissent habitatores Jabes Galaad, quaecumque fecerant Philisthiim Saul,"
      en: "Now when the inhabitants of Jabes Galaad had heard all that the Philistines had done to Saul,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "surrexerunt omnes viri fortissimi, et ambulaverunt tota nocte, et tulerunt cadaver Saul, et cadavera filiorum ejus de muro Bethsan: veneruntque Jabes Galaad, et combusserunt ea ibi:"
      en: "All the most valiant men arose, and walked all the night, and took the body of Saul, and the bodies of his sons, from the wall of Bethsan: and they came to Jabes Galaad, and burnt them there:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et tulerunt ossa eorum, et sepelierunt in nemore Jabes, et jejunaverunt septem diebus."
      en: "And they took their bones and buried them in the wood of Jabes: and fasted seven days."
    status: { la: verified, en: verified }
