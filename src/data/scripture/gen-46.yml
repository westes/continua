# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 46
verses:
  - n: 1
    text:
      la: "Profectusque Israel cum omnibus quae habebat, venit ad Puteum juramenti: et mactatis ibi victimis Deo patris sui Isaac,"
      en: "And Israel taking his journey, with all that he had, came to the well of the oath, and killing victims there to the God of his father Isaac,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "audivit eum per visionem noctis vocantem se, et dicentem sibi: Jacob, Jacob. Cui respondit: Ecce adsum."
      en: "He heard him by a vision in the night calling him, and saying to him: Jacob, Jacob. And he answered him: Lo, here I am."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ait illi Deus: Ego sum fortissimus Deus patris tui: noli timere, descende in Aegyptum, quia in gentem magnam faciam te ibi."
      en: "God said to him: I am the most mighty God of thy father: fear not, go down into Egypt, for I will make a great nation of thee there."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ego descendam tecum illuc, et ego inde adducam te revertentem: Joseph quoque ponet manus suas super oculos tuos."
      en: "I will go down with thee thither, and will bring thee back again from thence: Joseph also shall put his hands upon thy eyes."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Surrexit autem Jacob a Puteo juramenti: tuleruntque eum filii cum parvulis et uxoribus suis in plaustris quae miserat Pharao ad portandum senem,"
      en: "And Jacob rose up from the well of the oath: and his sons took him up, with their children and wives in the wagons, which Pharao had sent to carry the old man,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et omnia quae possederat in terra Chanaan: venitque in Aegyptum cum omni semine suo,"
      en: "And all that he had in the land of Chanaan, and he came into Egypt with all his seed:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "filii ejus, et nepotes, filiae, et cuncta simul progenies."
      en: "His sons, and grandsons, daughters, and all his offspring together."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Haec sunt autem nomina filiorum Israel, qui ingressi sunt in Aegyptum, ipse cum liberis suis. Primogenitus Ruben."
      en: "And these are the names of the children of Israel, that entered into Egypt, he and his children. His firstborn Ruben,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Filii Ruben: Henoch et Phallu et Hesron et Charmi."
      en: "The sons of Ruben: Henoch and Phallu, and Hesron and Charmi."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Filii Simeon: Jamuel et Jamin et Ahod, et Jachin et Sohar, et Saul filius Chanaanitidis."
      en: "The sons of Simeon: Jamuel and Jamin and Ahod, and Jachin and Sohar, and Saul the son of a woman of Chanaan."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Filii Levi: Gerson et Caath et Merari."
      en: "The sons of Levi: Gerson and Caath and Merari."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Filii Juda: Her et Onan et Sela et Phares et Zara; mortui sunt autem Her et Onan in terra Chanaan. Natique sunt filii Phares: Hesron et Hamul."
      en: "The sons of Juda: Her and Onan and Sela and Phares and Zara. And Her and Onan died in the land of Chanaan. And sons were born to Phares: Hesron and Hamul."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Filii Issachar: Thola et Phua et Job et Semron."
      en: "The sons of Issachar: Thola and Phua and Job and Semron."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Filii Zabulon: Sared et Elon et Jahelel."
      en: "The sons of Zabulon: Sared and Elon and Jahelel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Hi filii Liae quos genuit in Mesopotamia Syriae cum Dina filia sua: omnes animae filiorum ejus et filiarum, triginta tres."
      en: "These are the sons of Lia, whom she bore in Mesopotamia of Syria, with Dina his daughter. All the souls of her sons and daughters, thirty-three."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Filii Gad: Sephion et Haggi et Suni et Esebon et Heri et Arodi et Areli."
      en: "The sons of Gad: Sephian and Haggi and Suni and Esebon and Heri and Arodi and Areli."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Filii Aser: Jamne et Jesua et Jessui et Beria, Sara quoque soror eorum. Filii Beria: Heber et Melchiel."
      en: "The sons of Aser: Jamne and Jesua and Jessuri and Beria, and Sara their sister. The sons of Beria: Heber and Melchiel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Hi filii Zelphae, quam dedit Laban Liae filiae suae: et hos genuit Jacob sedecim animas."
      en: "These are the sons of Zelpha, whom Laban gave to Lia his daughter. And these she bore to Jacob, sixteen souls."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Filii Rachel uxoris Jacob: Joseph et Benjamin."
      en: "The sons of Rachel Jacob's wife: Joseph and Benjamin."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Natique sunt Joseph filii in terra Aegypti, quos genuit ei Aseneth filia Putiphare sacerdotis Heliopoleos: Manasses et Ephraim."
      en: "And sons were born to Joseph, in the land of Egypt, whom Aseneth the daughter of Putiphare priest of Heliopolis bore him: Manasses and Ephraim."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Filii Benjamin: Bela et Bechor et Asbel et Gera et Naaman et Echi et Ros et Mophim et Ophim et Ared."
      en: "The sons of Benjamin: Bela and Bechor and Asbel and Gera and Naaman and Echi and Ros and Mophim and Ophim and Ared."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Hi filii Rachel quos genuit Jacob: omnes animae, quatuordecim."
      en: "These are the sons of Rachel, whom she bore to Jacob: all the souls, fourteen."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Filii Dan: Husim."
      en: "The sons of Dan: Husim."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Filii Nephthali: Jasiel et Guni et Jeser et Sallem."
      en: "The sons of Nephtali: Jaziel and Guni and Jeser and Sallem."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Hi filii Balae, quam dedit Laban Racheli filiae suae: et hos genuit Jacob: omnes animae, septem."
      en: "These are the sons of Bala, whom Laban gave to Rachel his daughter: and these she bore to Jacob: all the souls, seven."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Cunctae animae, quae ingressae sunt cum Jacob in Aegyptum, et egressae sunt de femore illius, absque uxoribus filiorum ejus, sexaginta sex."
      en: "All the souls that went with Jacob into Egypt, and that came out of his thigh, besides his sons' wives, sixty-six."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Filii autem Joseph, qui nati sunt ei in terra Aegypti, animae duae. Omnes animae domus Jacob, quae ingressae sunt in Aegyptum, fuere septuaginta."
      en: "And the sons of Joseph, that were born to him in the land of Egypt, two souls. All the souls of the house of Jacob, that entered into Egypt, were seventy."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Misit autem Judam ante se ad Joseph, ut nuntiaret ei, et occurreret in Gessen."
      en: "And he sent Juda before him to Joseph, to tell him; and that he should meet him in Gessen."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Quo cum pervenisset, juncto Joseph curro suo, ascendit obviam patri suo ad eumdem locum: vidensque eum, irruit super collum ejus, et inter amplexus flevit."
      en: "And when he was come thither, Joseph made ready his chariot, and went up to meet his father, in the same place: and seeing him, he fell upon his neck, and embracing him wept."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Dixitque pater ad Joseph: Jam laetus moriar, quia vidi faciem tuam, et superstitem te relinquo."
      en: "And the father said to Joseph: Now shall I die with joy, because I have seen thy face, and leave thee alive."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "At ille locutus est ad fratres suos, et ad omnem domum patris sui: Ascendam, et nuntiabo Pharaoni, dicamque ei: Fratres mei, et domus patris mei, qui erant in terra Chanaan, venerunt ad me:"
      en: "And Joseph said to his brethren, and to all his father's house: I will go up, and will tell Pharao, and will say to him: My brethren and my father's house, that were in the land of Chanaan, are come to me:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et sunt viri pastores ovium, curamque habent alendorum gregum: pecora sua, et armenta, et omnia quae habere potuerunt, adduxerunt secum."
      en: "And the men are shepherds, and their occupation is to feed cattle: their flocks and herds, and all they have, they have brought with them."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Cumque vocaverit vos, et dixerit: Quod est opus vestrum?"
      en: "And when he shall call you, and shall say: What is your occupation?"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "respondebitis: Viri pastores sumus servi tui, ab infantia nostra usque in praesens, et nos et patres nostri. Haec autem dicetis, ut habitare possitis in terra Gessen: quia detestantur Aegyptii omnes pastores ovium."
      en: "You shall answer: We thy servants are shepherds, from our infancy until now, both we and our fathers. And this you shall say, that you may dwell in the land of Gessen, because the Egyptians have all shepherds in abomination."
    status: { la: verified, en: verified }
