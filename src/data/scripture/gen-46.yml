book: gen
chapter: 46
verses:
  - n: 1
    text:
      la: "profectusque Israhel cum omnibus quae habebat venit ad puteum Iuramenti et mactatis ibi victimis Deo patris sui Isaac"
      en: "And Israel taking his journey, with all that he had, came to the well of the oath, and killing victims there to the God of his father Isaac,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "audivit eum per visionem nocte vocantem se et dicentem sibi Iacob Iacob cui respondit ecce adsum"
      en: "He heard him by a vision in the night calling him, and saying to him: Jacob, Jacob. And he answered him: Lo, here I am."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ait illi Deus ego sum Fortissimus Deus patris tui noli timere et descende in Aegyptum quia in gentem magnam faciam te ibi"
      en: "God said to him: I am the most mighty God of thy father: fear not, go down into Egypt, for I will make a great nation of thee there."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ego descendam tecum illuc et ego inde adducam te revertentem Ioseph quoque ponet manum suam super oculos tuos"
      en: "I will go down with thee thither, and will bring thee back again from thence: Joseph also shall put his hands upon thy eyes."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "surrexit Iacob a puteo Iuramenti tuleruntque eum filii cum parvulis et uxoribus suis in plaustris quae miserat Pharao ad portandum senem"
      en: "And Jacob rose up from the well of the oath: and his sons took him up, with their children and wives in the wagons, which Pharao had sent to carry the old man,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et omnia quae possederat in terra Chanaan venitque in Aegyptum cum omni semine suo"
      en: "And all that he had in the land of Chanaan, and he came into Egypt with all his seed:\""
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "filii eius et nepotes filiae et cuncta simul progenies"
      en: "His sons, and grandsons, daughters, and all his offspring together."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "haec sunt autem nomina filiorum Israhel qui ingressi sunt in Aegyptum ipse cum liberis suis primogenitus Ruben"
      en: "And these are the names of the children of Israel, that entered into Egypt, he and his children. His firstborn Ruben,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "filii Ruben Enoch et Phallu et Esrom et Charmi"
      en: "The sons of Ruben: Henoch and Phallu, and Hesron and Charmi."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "filii Symeon Iemuhel et Iamin et Ahod et Iachin et Saher et Saul filius Chananitidis"
      en: "The sons of Simeon: Jamuel and Jamin and Ahod, and Jachin and Sohar, and Saul the son of a woman of Chanaan."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "filii Levi Gerson Caath et Merari"
      en: "The sons of Levi: Gerson and Caath and Merari."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "filii Iuda Her et Onan et Sela et Phares et Zara mortui sunt autem Her et Onan in terra Chanaan natique sunt filii Phares Esrom et Amul"
      en: "The sons of Juda: Her and Onan and Sela and Phares and Zara. And Her and Onan died in the land of Chanaan. And sons were born to Phares: Hesron and Hamul."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "filii Isachar Thola et Phua et Iob et Semron"
      en: "The sons of Issachar: Thola and Phua and Job and Semron."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "filii Zabulon Sared et Helon et Iahelel"
      en: "The sons of Zabulon: Sared and Elo and Jahelel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "hii filii Liae quos genuit in Mesopotamiam Syriae cum Dina filia sua omnes animae filiorum eius et filiarum triginta tres"
      en: "These are the sons of Lia, whom she bore in Mesopotamia of Syria, with Dins his daughter. All the souls of her sons and daughters, thirty-three."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "filii Gad Sephion et Haggi Suni et Esebon Heri et Arodi et Areli"
      en: "The sons of Cad: Sephian and Haggi and Suni and Esebon and Heri and Arodi and Areli."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "filii Aser Iamne et Iesua et Iesui et Beria Sara quoque soror eorum filii Beria Heber et Melchihel"
      en: "The sons of Beer: Jamne and Jesua and Jessuri and Beria, and Sara their sister. The sons of Beria: Heber and Melchiel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "hii filii Zelphae quam dedit Laban Liae filiae suae et hos genuit Iacob sedecim animas"
      en: "These are the sons of Zelpha, whom Laban gave to Lia his daughter. And these she bore to Jacob, sixteen souls."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "filii Rahel uxoris Iacob Ioseph et Beniamin"
      en: "The sons of Rachel Jacob's wife: Joseph and Benjamin."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "natique sunt Ioseph filii in terra Aegypti quos genuit ei Aseneth filia Putiphare sacerdotis Heliopoleos Manasses et Ephraim"
      en: "And sons were born to Joseph, in the land of Egypt, whom Aseneth the daughter of Putiphare priest of Heliopolis bore him: Manasses and Ephraim."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "filii Beniamin Bela et Bechor et Asbel Gera et Naaman et Ehi et Ros Mophim et Opphim et Ared"
      en: "The sons of Benjamin: Bela and Bechor and Asbel and Gera and Naaman and Echi and Ros and Mophim and Ophim and Ared."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "hii filii Rahel quos genuit Iacob omnes animae quattuordecim"
      en: "These are the sons of Rachel, whom she bore to Jacob: all the souls, four- teen."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "filii Dan Usim"
      en: "The sons of Dan: Husim."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "filii Nepthalim Iasihel et Guni et Hieser et Sallem"
      en: "The sons of Nephtali: Jaziel and Guni and Jeser and Sallem."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "hii filii Balae quam dedit Laban Raheli filiae suae et hos genuit Iacob omnes animae septem"
      en: "These are the sons of Bala, whom Laban gave to Rachel his daughter: and these she bore to Jacob: all the souls, seven."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "cunctae animae quae ingressae sunt cum Iacob in Aegyptum et egressae de femore illius absque uxoribus filiorum sexaginta sex"
      en: "All the souls that went with Jacob into Egypt, and that came out of his thigh, besides his sons' wives, sixty-six."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "filii autem Ioseph qui nati sunt ei in terra Aegypti animae duae omnis anima domus Iacob quae ingressa est Aegyptum fuere septuaginta"
      en: "And the sons of Joseph, that were born to him in the land of Egypt, two souls. All the souls of the house of Jacob, that entered into Egypt, were seventy."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "misit autem Iudam ante se ad Ioseph ut nuntiaret ei et ille occurreret in Gessen"
      en: "And he sent Juda before him to Joseph, to tell him; and that he should meet him in Gessen."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quo cum pervenisset iuncto Ioseph curru suo ascendit obviam patri ad eundem locum vidensque eum inruit super collum eius et inter amplexus flevit"
      en: "And when he was come thither, Joseph made ready his chariot, and went up to meet his father, in the same place: and seeing him, he fell upon his neck, and embracing him wept."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "dixitque pater ad Ioseph iam laetus moriar quia vidi faciem tuam et superstitem te relinquo"
      en: "And the father said to Joseph: Now shall I die with joy, because I have seen thy face, and leave thee alive."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et ille locutus est ad fratres et ad omnem domum patris sui ascendam et nuntiabo Pharaoni dicamque ei fratres mei et domus patris mei qui erant in terra Chanaan venerunt ad me"
      en: "And Joseph said to his brethren, and to all his father's house: I will go up, and will tell Pharao, and will say to him: My brethren and my father's house, that were in the land of Chanaan, are come to me:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et sunt viri pastores ovium curamque habent alendorum gregum pecora sua et armenta et omnia quae habere potuerunt adduxerunt secum"
      en: "And the men are shepherds, and their occupation is to feed cattle: their flocks and herds, and all they have, they have brought with them."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "cumque vocaverit vos et dixerit quod est opus vestrum"
      en: "And when he shall call you, and shall say: What is your occupation?"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "respondebitis viri pastores sumus servi tui ab infantia nostra usque in praesens et nos et patres nostri haec autem dicetis ut habitare possitis in terra Gessen quia detestantur Aegyptii omnes pastores ovium"
      en: "You shall answer: We thy servants are shepherds, from our infancy until now, both we and our fathers. And this you shall say, that you may dwell in the land of Gessen, because the Egyptians have all shepherds in abomination."
    status: { la: verified, en: verified }
