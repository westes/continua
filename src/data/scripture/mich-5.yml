# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: mich
chapter: 5
verses:
  - n: 1
    text:
      la: "nunc vastaberis filia latronis obsidionem posuerunt super nos in virga percutient maxillam iudicis Israhel"
      en: "Now shalt thou be laid waste, O daughter of the robber: they have laid siege against us, with a rod shall they strike the cheek of the judge of Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et tu Bethleem Ephrata parvulus es in milibus Iuda ex te mihi egredietur qui sit dominator in Israhel et egressus eius ab initio a diebus aeternitatis"
      en: "AND THOU, BETHLEHEM Ephrata, art a little one among the thousands of Juda: out of thee shall he come forth unto me that is to be the ruler in Israel: and his going forth is from the beginning, from the days of eternity."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "propter hoc dabit eos usque ad tempus in quo parturiens pariet reliquiae fratrum eius convertentur ad filios Israhel"
      en: "Therefore will he give them up even till the time wherein she that travaileth shall bring forth: and the remnant of his brethren shall be converted to the children of Israel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et stabit et pascet in fortitudine Domini in sublimitate nominis Domini Dei sui et convertentur quia nunc magnificabitur usque ad terminos terrae"
      en: "And he shall stand, and feed in the strength of the Lord, in the height of the name of the Lord his God: and they shall be converted, for now shall he be magnified even to the ends of the earth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et erit iste pax Assyrius cum venerit in terram nostram et quando calcaverit in domibus nostris et suscitabimus super eum septem pastores et octo primates homines"
      en: "And this man shall be our peace, when the Assyrian shall come into our land, and when he shall set his foot in our houses: and we shall raise against him seven shepherds, and eight principal men."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et pascent terram Assur in gladio et terram Nemrod in lanceis eius et liberabit ab Assur cum venerit in terram nostram et cum calcaverit in finibus nostris"
      en: "And they shall feed the land of Assyria with the sword, and the land of Nemrod with the spears thereof: and he shall deliver us from the Assyrian, when he shall come into our land, and when he shall tread in our borders."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et erunt reliquiae Iacob in medio populorum multorum quasi ros a Domino et quasi stillae super herbam quae non expectat virum et non praestolatur filios hominum"
      en: "And the remnant of Jacob shall be in the midst of many peoples as a dew from the Lord, and as drops upon the grass, which waiteth not for man, nor tarrieth for the children of men."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et erunt reliquiae Iacob in gentibus in medio populorum multorum quasi leo in iumentis silvarum et quasi catulus leonis in gregibus pecorum qui cum transierit et conculcaverit et ceperit non est qui eruat"
      en: "And the remnant of Jacob shall be among the Gentiles in the midst of many peoples as a lion among the beasts of the forests, and as a young lion among the docks of sheep: who when he shall go through and tread down, and take, there is none to deliver."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "exaltabitur manus tua super hostes tuos et omnes inimici tui interibunt"
      en: "Thy hand shall be lifted up over thy enemies, and all thy enemies shall be cut off."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et erit in die illa dicit Dominus auferam equos tuos de medio tui et disperdam quadrigas tuas"
      en: "And it shall come to pass in that day, saith the Lord, that I will take away thy horses out of the midst of thee, and will destroy thy chariots."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et perdam civitates terrae tuae et destruam omnes munitiones tuas et auferam maleficia de manu tua et divinationes non erunt in te"
      en: "And I will destroy the cities of thy land, and will throw down all thy strong holds, and I will take away sorceries out of thy hand, and there shall be no divinations in thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et perire faciam sculptilia tua et statuas tuas de medio tui et non adorabis ultra opera manuum tuarum"
      en: "And I will destroy thy graven things, and thy statues out of the midst of thee: and thou shalt no more adore the works of thy hands."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et evellam lucos tuos de medio tui et conteram civitates tuas"
      en: "And I will pluck up thy groves out of the midst of thee: and will crush thy cities."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et faciam in furore et in indignatione ultionem in omnibus gentibus quae non audierunt"
      en: "And I will execute vengeance in wrath and in indignation among all the nations that have not given ear."
    status: { la: verified, en: verified }
