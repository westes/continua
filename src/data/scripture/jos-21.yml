book: jos
chapter: 21
verses:
  - n: 1
    text:
      la: "accesseruntque principes familiarum Levi ad Eleazar sacerdotem et Iosue filium Nun et ad duces cognationum per singulas tribus filiorum Israhel"
      en: "Then the princes of the families of Levi came to Eleazar the priest, and to Josue the son of Nun, and to the princes of the kindreds of all the tribes of the children of Israel:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "locutique sunt ad eos in Silo terrae Chanaan atque dixerunt Dominus praecepit per manum Mosi ut darentur nobis urbes ad habitandum et suburbana earum ad alenda iumenta"
      en: "And they spoke to them in Silo in the land of Chanaan, and said: The Lord commanded by the hand of Moses, that cities should be given us to dwell in, and their suburbs to feed our cattle."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dederuntque filii Israhel de possessionibus suis iuxta imperium Domini civitates et suburbana earum"
      en: "And the children of Israel gave out of their possessions according to the commandment of the Lord, cities and their suburbs."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "egressaque est sors in familiam Caath filiorum Aaron sacerdotis de tribubus Iuda et Symeon et Beniamin civitates tredecim"
      en: "And the lot came out for the family of Caath of the children of Aaron the priest out of the tribes of Juda, and of Simeon, and of Benjamin, thirteen cities."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et reliquis filiorum Caath id est Levitis qui superflui erant de tribubus Ephraim et Dan et dimidia tribu Manasse civitates decem"
      en: "And to the rest of the children of Caath, that is, to the Levites, who remained, out of the tribes of Ephraim, and of Dan, and the half tribe of Manasses, ten cities."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "porro filiis Gerson egressa est sors ut acciperent de tribubus Isachar et Aser et Nepthalim dimidiaque tribu Manasse in Basan civitates numero tredecim"
      en: "And the lot came out to the children of Gerson, that they should take of the tribes of Issachar and of Aser and of Nephtali, and of the half tribe of Manasses in Basan, thirteen cities."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et filiis Merari per cognationes suas de tribubus Ruben et Gad et Zabulon urbes duodecim"
      en: "And to the sons of Merari by their kindreds, of the tribes of Ruben and or Cad and of Zabulon, twelve cities."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dederuntque filii Israhel Levitis civitates et suburbana earum sicut praecepit Dominus per manum Mosi singulis sorte tribuentes"
      en: "And the children of Israel gave to the Levites the cities and their suburbs, as the Lord commanded by the hand of Moses, giving to every one by lot."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "de tribubus filiorum Iuda et Symeon dedit Iosue civitates quarum ista sunt nomina"
      en: "Of the tribes of the children of Juda and of Simeon Josue gave cities: whose names are these,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "filiis Aaron per familias Caath levitici generis prima enim sors illis egressa est"
      en: "To the sons of Aaron, of the families of Caath of the race of Levi (for the first lot came out for them)"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cariatharbe patris Enach quae vocatur Hebron in monte Iuda et suburbana eius per circuitum"
      en: "The city of Arbe the father of Enac, which is called Hebron, in the mountain of Juda, and the suburbs thereof round about."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "agros vero et villas eius dederat Chaleb filio Iepphonne ad possidendum"
      en: "But the fields and the villages thereof he had given to Caleb the son of Jephone for his possession."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dedit ergo filiis Aaron sacerdotis Hebron confugii civitatem ac suburbana eius et Lebnam cum suburbanis suis"
      en: "He gave therefore to the children of Aaron the priest, Hebron a city of refuge, and the suburbs thereof: and Lobna with the suburbs thereof,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et Iether et Isthimon"
      en: "And Jether and Estemo,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et Helon Dabir"
      en: "And Holon, and Dabir,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et Ahin et Iethan et Bethsemes cum suburbanis suis civitates novem de tribubus ut dictum est duabus"
      en: "And Ain, and Jeta, and Bethsames, with their suburbs : nine cities out of the two tribes, as hath been said."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "de tribu autem filiorum Beniamin Gabaon et Gabee"
      en: "And out of the tribe of the children of Benjamin, Gabaon, and Gabae,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et Anathoth et Almon cum suburbanis suis civitates quattuor"
      en: "And Anathoth and Almon, with their suburbs: four cities."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "omnes simul civitates filiorum Aaron sacerdotis tredecim cum suburbanis suis"
      en: "All the cities together of the children of Aaron the priest, were thirteen, with their suburbs."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "reliquis vero per familias filiorum Caath levitici generis haec est data possessio"
      en: "And to the rest of the families of the children of Caath of the race of Levi was given this possession."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "de tribu Ephraim urbs confugii Sychem cum suburbanis suis in monte Ephraim et Gazer"
      en: "Of the tribe of Ephraim, Sichem one of the cities of refuge, with the suburbs thereof in mount Ephraim, and Cater,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et Cebsain et Bethoron cum suburbanis suis civitates quattuor"
      en: "And Cibsaim, and Beth-horon, with their suburbs, four cities."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "de tribu quoque Dan Elthece et Gebbethon"
      en: "And of the tribe of Dan, Eltheco and Gabathon,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et Ahialon et Gethremmon cum suburbanis suis civitates quattuor"
      en: "And Aialon and Gethremmon, with their suburbs, four cities."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "porro de dimidia tribu Manasse Thanach et Gethremmon cum suburbanis suis civitates duae"
      en: "And of the half tribe of Manasses, Thanac and Gethremmon, with their suburbs, two cities."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "omnes civitates decem et suburbana earum datae sunt filiis Caath inferioris gradus"
      en: "All the cities were ten, with their suburbs, which were given to the children of Caath, of the inferior degree."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "filiis quoque Gerson levitici generis dedit de dimidia tribu Manasse confugii civitatem Gaulon in Basan et Bosram cum suburbanis suis civitates duas"
      en: "To the children of Gerson also of the race of Levi out of the half tribe of Manasses, Gaulon in Basan, one of the cities of refuge, and Bosra, with their suburbs, two cities."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "porro de tribu Isachar Cesion et Dabereth"
      en: "And of the tribe of Issachar, Cesion, and Dabereth,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et Iaramoth et Engannim cum suburbanis suis civitates quattuor"
      en: "And Jaramoth, and Engannim, with their suburbs, four cities."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "de tribu autem Aser Masal et Abdon"
      en: "And of the tribe of Aser, Masal and Abdon,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et Elacoth et Roob cum suburbanis suis civitates quattuor"
      en: "31And Helcath, and Rohob, with their suburbs, four cities."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "de tribu quoque Nepthali civitatem confugii Cedes in Galilea et Ammothdor et Charthan cum suburbanis suis civitates tres"
      en: "Of the tribe also of Nephtali, Cedes in Galilee, one of the cities of refuge: and Hammoth Dor, and Carthan, with their suburbs, three cities."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "omnes urbes familiarum Gerson tredecim cum suburbanis suis"
      en: "All the cities of the families of Gerson, were thirteen, with their suburbs."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "filiis autem Merari Levitis inferioris gradus per familias suas data est de tribu Zabulon Iechenam et Chartha"
      en: "And to the children of Merari, Levites of the inferior degree, by their families were given of the tribe of Zabulon, Jecnam and Cartha,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et Damna et Nalol civitates quattuor cum suburbanis suis"
      en: "And Damna and Naalol, four cities with their suburbs;"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "[de tribu quoque Ruben ciuitates confugii Bosor in solitudine et Cedson et Misor et Ocho ciuitates quattuor cum suburbanis suis]"
      en: "Of the tribe of Ruben beyond the Jordan over against Jericho, Bosor in the wilderness, one of the cities of refuge, Miser and Jaser and Jethson and Mephaath, four cities with their suburbs."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et de tribu Gad civitates confugii Ramoth in Galaad et Manaim et Esebon et Iazer civitates quattuor cum suburbanis suis"
      en: "Of the tribe of Gad, Ramoth in Galaad, one of the cities of refuge, and Manaim and Hesebon and Jaser, four cities with their suburbs."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "omnes urbes filiorum Merari per familias et cognationes suas duodecim"
      en: "All the cities of the children of Merari by their families and kindreds, were twelve."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "itaque universae civitates Levitarum in medio possessionis filiorum Israhel fuerunt quadraginta octo"
      en: "So all the cities of the Levites within the possession of the children of Israel were forty-eight,"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "cum suburbanis suis singulae per familias distributae"
      en: "With their suburbs, each distributed by the families."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "deditque Dominus Israheli omnem terram quam traditurum se patribus eorum iuraverat et possederunt illam atque habitaverunt in ea"
      en: "And the Lord God gave to Israel all the land that he had sworn to give to their fathers: and they possessed it and dwelt in it."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "dataque est ab eo pax in omnes per circuitum nationes nullusque eis hostium resistere ausus est sed cuncti in eorum dicionem redacti sunt"
      en: "And he gave them peace from all nations round about: and none of their enemies durst stand against them, but were brought under their dominion."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "ne unum quidem verbum quod illis praestaturum se esse promiserat irritum fuit sed rebus expleta sunt omnia"
      en: "Not so much as one word, which he had promised to perform unto them, was made void, but all came to pass."
    status: { la: verified, en: verified }
