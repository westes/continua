# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1reg
chapter: 27
verses:
  - n: 1
    text:
      la: "et ait David in corde suo aliquando incidam in uno die in manu Saul nonne melius est ut fugiam et salver in terra Philisthinorum ut desperet Saul cessetque me quaerere in cunctis finibus Israhel fugiam ergo manus eius"
      en: "And David said in his heart: I shall gone day or other fall into the hands of Saul: is it not better for me to flee, and to be saved in the land of the Philistines, that Saul may despair of me, and cease to seek me in all the coasts of Israel? I will flee then out of his hands."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et surrexit David et abiit ipse et sescenti viri cum eo ad Achis filium Mahoc regem Geth"
      en: "And David arose and went away, both he and the six hundred men that were with him, to Achis the son of Maoch, king of Geth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et habitavit David cum Achis in Geth ipse et viri eius vir et domus eius David et duae uxores eius Ahinoem Iezrahelites et Abigail uxor Nabal Carmeli"
      en: "And David dwelt with Achis at Geth, he and his men: every man with his household, and David with his two wives, Achinoam the Jezrahelitess, and Abigail the wife of Nabal of Carmel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et nuntiatum est Saul quod fugisset David in Geth et non addidit ultra ut quaereret eum"
      en: "And it was told Saul that David was fled to Geth, and he sought no more after him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixit autem David ad Achis si inveni gratiam in oculis tuis detur mihi locus in una urbium regionis huius ut habitem ibi cur enim manet servus tuus in civitate regis tecum"
      en: "And David said to Achis: If I have found favour in thy sight, let a place be given me in one of the cities of this country, that I may dwell there: for why should thy servant dwell in the royal city with thee?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dedit itaque ei Achis in die illa Siceleg propter quam causam facta est Siceleg regum Iuda usque in diem hanc"
      en: "Then Achis gave him Siceleg that day: for which reason Siceleg belongeth to the kings of Juda unto this day."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "fuit autem numerus dierum quibus habitavit David in regione Philisthinorum quattuor mensuum"
      en: "And the time that David dwelt in the country of the Philistines, was four months."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et ascendit David et viri eius et agebant praedas de Gesuri et de Gedri et de Amalechitis hii enim pagi habitabantur in terra antiquitus euntibus Sur usque ad terram Aegypti"
      en: "And David and his men went up, and pillaged Gessuri, and Gerzi, and the Amalecites: for these were of old the inhabitants of the countries, as men go to Sur, even to the land of Egypt."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et percutiebat David omnem terram nec relinquebat viventem virum et mulierem tollensque oves et boves et asinos et camelos et vestes revertebatur et veniebat ad Achis"
      en: "And David wasted all the land, and left neither man nor woman alive: and took away the sheep and the oxen, and the asses, and the camels, and the apparel, and returned and came to Achis."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dicebat autem ei Achis in quem inruisti hodie respondebatque David contra meridiem Iudae et contra meridiem Hiramel et contra meridiem Ceni"
      en: "And Achis said to him: Whom hast thou gone against to day? David answered: Against the south of Juda, and against the south of Jerameel, and against the south of Ceni."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "virum et mulierem non vivificabat David nec adducebat in Geth dicens ne forte loquantur adversum nos haec fecit David et hoc erat decretum illi omnibus diebus quibus habitavit in regione Philisthinorum"
      en: "And David saved neither man nor woman, neither brought he any of them to Geth, saying: Lest they should speak against us. So did David, and such was his proceeding all the days that he dwelt in the country of the Philistines."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "credidit ergo Achis David dicens multa mala operatus est contra populum suum Israhel erit igitur mihi servus sempiternus"
      en: "And Achis believed David, saying: He hath done much harm to his people Israel: therefore he shall be my servant for ever."
    status: { la: verified, en: verified }
