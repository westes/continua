# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1reg
chapter: 27
verses:
  - n: 1
    text:
      la: "Et ait David in corde suo: Aliquando incidam una die in manus Saul: nonne melius est ut fugiam, et salver in terra Philisthinorum, ut desperet Saul, cessetque me quaerere in cunctis finibus Israel? Fugiam ergo manus ejus."
      en: "And David said in his heart: I shall one day or other fall into the hands of Saul: is it not better for me to flee, and to be saved in the land of the Philistines, that Saul may despair of me, and cease to seek me in all the coasts of Israel? I will flee then out of his hands."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et surrexit David, et abiit ipse, et sexcenti viri cum eo, ad Achis filium Maoch regem Geth."
      en: "And David arose and went away, both he and the six hundred men that were with him, to Achis the son of Maoch, king of Geth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et habitavit David cum Achis in Geth, ipse et viri ejus: vir et domus ejus: et David, et duae uxores ejus, Achinoam Jezrahelitis, et Abigail uxor Nabal Carmeli."
      en: "And David dwelt with Achis at Geth, he and his men: every man with his household, and David with his two wives, Achinoam the Jezrahelitess, and Abigail the wife of Nabal of Carmel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et nuntiatum est Sauli quod fugisset David in Geth, et non addidit ultra quaerere eum."
      en: "And it was told Saul that David was fled to Geth, and he sought no more after him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dixit autem David ad Achis: Si inveni gratiam in oculis tuis, detur mihi locus in una urbium regionis hujus, ut habitem ibi: cur enim manet servus tuus in civitate regis tecum?"
      en: "And David said to Achis: If I have found favour in thy sight, let a place be given me in one of the cities of this country, that I may dwell there: for why should thy servant dwell in the royal city with thee?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dedit itaque ei Achis in die illa Siceleg: propter quam causam facta est Siceleg regum Juda, usque in diem hanc."
      en: "Then Achis gave him Siceleg that day: for which reason Siceleg belongeth to the kings of Juda unto this day."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Fuit autem numerus dierum, quibus habitavit David in regione Philisthinorum, quatuor mensium."
      en: "And the time that David dwelt in the country of the Philistines, was four months."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et ascendit David et viri ejus, et agebant praedas de Gessuri, et de Gerzi, et de Amalecitis: hi enim pagi habitabantur in terra antiquitus, euntibus Sur usque ad terram Aegypti."
      en: "And David and his men went up, and pillaged Gessuri, and Gerzi, and the Amalecites: for these were of old the inhabitants of the countries, as men go to Sur, even to the land of Egypt."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et percutiebat David omnem terram, nec relinquebat viventem virum et mulierem: tollensque oves, et boves, et asinos, et camelos, et vestes, revertebatur, et veniebat ad Achis."
      en: "And David wasted all the land, and left neither man nor woman alive: and took away the sheep and the oxen, and the asses, and the camels, and the apparel, and returned and came to Achis."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dicebat autem ei Achis: In quem irruisti hodie? Respondebat David: Contra meridiem Judae, et contra meridiem Jerameel, et contra meridiem Ceni."
      en: "And Achis said to him: Whom hast thou gone against today? David answered: Against the south of Juda, and against the south of Jerameel, and against the south of Ceni."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Virum et mulierem non vivificabat David, nec adducebat in Geth, dicens: Ne forte loquantur adversum nos: Haec fecit David: et hoc erat decretum illi omnibus diebus quibus habitavit in regione Philisthinorum."
      en: "And David saved neither man nor woman, neither brought he any of them to Geth, saying: Lest they should speak against us. So did David, and such was his proceeding all the days that he dwelt in the country of the Philistines."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Credidit ergo Achis David, dicens: Multa mala operatus est contra populum suum Israel: erit igitur mihi servus sempiternus."
      en: "And Achis believed David, saying: He hath done much harm to his people Israel: therefore he shall be my servant for ever."
    status: { la: verified, en: verified }
