# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gal
chapter: 6
verses:
  - n: 1
    text:
      la: "Fratres, etsi praeoccupatus fuerit homo in aliquo delicto, vos, qui spirituales estis, hujusmodi instruite in spiritu lenitatis, considerans teipsum, ne et tu tenteris."
      en: "Brethren, and if a man be overtaken in any fault, you, who are spiritual, instruct such a one in the spirit of meekness, considering thyself, lest thou also be tempted."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Alter alterius onera portate, et sic adimplebitis legem Christi."
      en: "Bear ye one another's burdens; and so you shall fulfill the law of Christ."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Nam si quis existimat se aliquid esse, cum nihil sit, ipse se seducit."
      en: "For if any man think himself to be some thing, whereas he is nothing, he deceiveth himself."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Opus autem suum probet unusquisque, et sic in semetipso tantum gloriam habebit, et non in altero."
      en: "But let every one prove his own work, and so he shall have glory in himself only, and not in another."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Unusquisque enim onus suum portabit."
      en: "For every one shall bear his own burden."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Communicet autem is qui catechizatur verbo, ei qui se catechizat, in omnibus bonis."
      en: "And let him that is instructed in the word, communicate to him that instructeth him, in all good things."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nolite errare: Deus non irridetur."
      en: "Be not deceived, God is not mocked."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quae enim seminaverit homo, haec et metet. Quoniam qui seminat in carne sua, de carne et metet corruptionem: qui autem seminat in spiritu, de spiritu metet vitam aeternam."
      en: "For what things a man shall sow, those also shall he reap. For he that soweth in his flesh, of the flesh also shall reap corruption. But he that soweth in the spirit, of the spirit shall reap life everlasting."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Bonum autem facientes, non deficiamus: tempore enim suo metemus non deficientes."
      en: "And in doing good, let us not fail. For in due time we shall reap, not failing."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ergo dum tempus habemus, operemur bonum ad omnes, maxime autem ad domesticos fidei."
      en: "Therefore, whilst we have time, let us work good to all men, but especially to those who are of the household of the faith."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Videte qualibus litteris scripsi vobis mea manu."
      en: "See what a letter I have written to you with my own hand."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quicumque enim volunt placere in carne, hi cogunt vos circumcidi, tantum ut crucis Christi persecutionem non patiantur."
      en: "For as many as desire to please in the flesh, they constrain you to be circumcised, only that they may not suffer the persecution of the cross of Christ."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Neque enim qui circumciduntur, legem custodiunt: sed volunt vos circumcidi, ut in carne vestra glorientur."
      en: "For neither they themselves who are circumcised, keep the law; but they will have you to be circumcised, that they may glory in your flesh."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Mihi autem absit gloriari, nisi in cruce Domini nostri Jesu Christi: per quem mihi mundus crucifixus est, et ego mundo."
      en: "But God forbid that I should glory, save in the cross of our Lord Jesus Christ; by whom the world is crucified to me, and I to the world."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "In Christo enim Jesu neque circumcisio aliquid valet, neque praeputium, sed nova creatura."
      en: "For in Christ Jesus neither circumcision availeth any thing, nor uncircumcision, but a new creature."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et quicumque hanc regulam secuti fuerint, pax super illos, et misericordia, et super Israel Dei."
      en: "And whosoever shall follow this rule, peace on them, and mercy, and upon the Israel of God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "De cetero, nemo mihi molestus sit: ego enim stigmata Domini Jesu in corpore meo porto."
      en: "From henceforth let no man be troublesome to me; for I bear the marks of the Lord Jesus in my body."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Gratia Domini nostri Jesu Christi cum spiritu vestro, fratres. Amen."
      en: "The grace of our Lord Jesus Christ be with your spirit, brethren. Amen."
    status: { la: verified, en: verified }
