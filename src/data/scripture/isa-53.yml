# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 53
verses:
  - n: 1
    text:
      la: "quis credidit auditui nostro et brachium Domini cui revelatum est"
      en: "Who hath believed our report? and to whom is the arm of the Lord revealed?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ascendet sicut virgultum coram eo et sicut radix de terra sitienti non est species ei neque decor et vidimus eum et non erat aspectus et desideravimus eum"
      en: "And he shall grow up as a tender plant before him, and as a root out of a thirsty ground: there is no beauty in him, nor comeliness: and we have seen him, and there was no sightliness, that we should be desirous of him:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "despectum et novissimum virorum virum dolorum et scientem infirmitatem et quasi absconditus vultus eius et despectus unde nec reputavimus eum"
      en: "Despised, and the most abject of men, a man of sorrows, and acquainted with infirmity: and his look was as it were hidden and despised, whereupon we esteemed him not."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "vere languores nostros ipse tulit et dolores nostros ipse portavit et nos putavimus eum quasi leprosum et percussum a Deo et humiliatum"
      en: "Surely he hath borne our infirmities and carried our sorrows: and we have thought him as it were a leper, and as one struck by God and afflicted."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ipse autem vulneratus est propter iniquitates nostras adtritus est propter scelera nostra disciplina pacis nostrae super eum et livore eius sanati sumus"
      en: "But he was wounded for our iniquities, he was bruised for our sins: the chastisement of our peace was upon him, and by his bruises we are healed."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "omnes nos quasi oves erravimus unusquisque in viam suam declinavit et Dominus posuit in eo iniquitatem omnium nostrum"
      en: "All we like sheep have gone astray, every one hath turned aside into his own way: and the Lord hath laid on him the iniquity of us all."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "oblatus est quia ipse voluit et non aperuit os suum sicut ovis ad occisionem ducetur et quasi agnus coram tondente obmutescet et non aperiet os suum"
      en: "He was offered because it was his own will, and he opened not his mouth: he shall be led as a sheep to the slaughter, and shall be dumb as a lamb before his shearer, and he shall not open his mouth."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "de angustia et de iudicio sublatus est generationem eius quis enarrabit quia abscisus est de terra viventium propter scelus populi mei percussit eum"
      en: "He was taken away from distress, and from judgment: who shall declare his generation? because he is cut oh out of the land of the living: for the wickedness of my people have I struck him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dabit impios pro sepultura et divitem pro morte sua eo quod iniquitatem non fecerit neque dolus fuerit in ore eius"
      en: "And he shall give the ungodly for his burial, and the rich for his death: because he hath done no iniquity, neither was there deceit in his mouth."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et Dominus voluit conterere eum in infirmitate si posuerit pro peccato animam suam videbit semen longevum et voluntas Domini in manu eius dirigetur"
      en: "And the Lord was pleased to bruise him in infirmity: if he shall lay down his life for sin, he shall see a long-lived seed, and the will of the Lord shall be prosperous in his hand."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "pro eo quod laboravit anima eius videbit et saturabitur in scientia sua iustificabit ipse iustus servus meus multos et iniquitates eorum ipse portabit"
      en: "Because his soul hath laboured, he shall see and be filled: by his knowledge shall this my just servant justify many, and he shall bear their iniquities."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ideo dispertiam ei plurimos et fortium dividet spolia pro eo quod tradidit in morte animam suam et cum sceleratis reputatus est et ipse peccatum multorum tulit et pro transgressoribus rogavit"
      en: "Therefore will I distribute to him very many, and he shall divide the spoils of the strong, because he hath delivered his soul unto death, and was reputed with the wicked: and he hath borne the sins of many, and hath prayed for the transgressors."
    status: { la: verified, en: verified }
