# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: lev
chapter: 10
verses:
  - n: 1
    text:
      la: "Arreptisque Nadab et Abiu filii Aaron thuribulis, posuerunt ignem, et incensum desuper, offerentes coram Domino ignem alienum: quod eis praeceptum non erat."
      en: "And Nadab and Abiu, the sons of Aaron, taking their censers, put fire therein, and incense on it, offering before the Lord strange fire: which was not commanded them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Egressusque ignis a Domino, devoravit eos, et mortui sunt coram Domino."
      en: "And fire coming out from the Lord destroyed them, and they died before the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dixitque Moyses ad Aaron: Hoc est quod locutus est Dominus: Sanctificabor in iis qui appropinquant mihi, et in conspectu omnis populi glorificabor. Quod audiens tacuit Aaron."
      en: "And Moses said to Aaron: This is what the Lord hath spoken: I will be sanctified in them that approach to me, and I will be glorified in the sight of all the people. And when Aaron heard this, he held his peace."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Vocatis autem Moyses Misaele et Elisaphan filiis Oziel, patrui Aaron, ait ad eos: Ite, et tollite fratres vestros de conspectu sanctuarii, et asportate extra castra."
      en: "And Moses called Misael and Elisaphan, the sons of Oziel, the uncle of Aaron, and said to them: Go and take away your brethren from before the sanctuary, and carry them without the camp."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Confestimque pergentes, tulerunt eos sicut jacebant, vestitos lineis tunicis, et ejecerunt foras, ut sibi fuerat imperatum."
      en: "And they went forthwith and took them as they lay, vested with linen tunicks, and cast them forth, as had been commanded them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Locutusque est Moyses ad Aaron, et ad Eleazar, et Ithamar, filios ejus: Capita vestra nolite nudare, et vestimenta nolite scindere, ne forte moriamini, et super omnem coetum oriatur indignatio. Fratres vestri, et omnis domus Israel, plangant incendium quod Dominus suscitavit:"
      en: "And Moses said to Aaron, and to Eleazar and Ithamar, his sons: Uncover not your heads, and rend not your garments, lest perhaps you die, and indignation come upon all the congregation. Let your brethren, and all the house of Israel, bewail the burning which the Lord has kindled:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "vos autem non egrediemini fores tabernaculi, alioquin peribitis: oleum quippe sanctae unctionis est super vos. Qui fecerunt omnia juxta praeceptum Moysi."
      en: "But you shall not go out of the door of the tabernacle, otherwise you shall perish, for the oil of the holy unction is on you. And they did all things according to the precept of Moses."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dixit quoque Dominus ad Aaron:"
      en: "The Lord also said to Aaron:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Vinum, et omne quod inebriare potest, non bibetis tu et filii tui, quando intratis in tabernaculum testimonii, ne moriamini: quia praeceptum sempiternum est in generationes vestras:"
      en: "You shall not drink wine nor any thing that may make drunk, thou nor thy sons, when you enter into the tabernacle of the testimony, lest you die: because it is an everlasting precept through your generations:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et ut habeatis scientiam discernendi inter sanctum et profanum, inter pollutum et mundum;"
      en: "And that you may have knowledge to discern between holy and unholy, between unclean and clean:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "doceatisque filios Israel omnia legitima mea quae locutus est Dominus ad eos per manum Moysi."
      en: "And may teach the children of Israel all my ordinances which the Lord hath spoken to them by the hand of Moses."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Locutusque est Moyses ad Aaron, et ad Eleazar, et Ithamar, filios ejus, qui erant residui: Tollite sacrificium, quod remansit de oblatione Domini, et comedite illud absque fermento juxta altare, quia Sanctum sanctorum est."
      en: "And Moses spoke to Aaron, and to Eleazar and Ithamar, his sons that were left: Take the sacrifice that is remaining of the oblation of the Lord, and eat it without leaven beside the altar, because it is holy of holies."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Comedetis autem in loco sancto: quod datum est tibi et filiis tuis de oblationibus Domini, sicut praeceptum est mihi."
      en: "And you shall eat it in a holy place: which is given to thee and thy sons of the oblations of the Lord, as it hath been commanded me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Pectusculum quoque quod oblatum est, et armum qui separatus est, edetis in loco mundissimo tu et filii tui, et filiae tuae tecum: tibi enim ac liberis tuis reposita sunt de hostiis salutaribus filiorum Israel:"
      en: "The breast also that is offered, and the shoulder that is separated, you shall eat in a most clean place, thou and thy sons, and thy daughters with thee. For they are set aside for thee and thy children, of the victims of peace offerings of the children of Israel:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "eo quod armum et pectus, et adipes qui cremantur in altari, elevaverunt coram Domino, et pertineant ad te, et ad filios tuos, lege perpetua, sicut praecepit Dominus."
      en: "Because they have elevated before the Lord the shoulder and the breast, and the fat that is burnt on the altar, and they belong to thee and to thy sons by a perpetual law, as the Lord hath commanded."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Inter haec, hircum, qui oblatus fuerat pro peccato, cum quaereret Moyses, exustum reperit: iratusque contra Eleazar et Ithamar filios Aaron, qui remanserant, ait:"
      en: "While these things were a doing, when Moses sought for the buck goat, that had been offered for sin, he found it burnt: and being angry with Eleazar and Ithamar, the sons of Aaron that were left, he said:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cur non comedistis hostiam pro peccato in loco sancto, quae Sancta sanctorum est, et data vobis ut portetis iniquitatem multitudinis, et rogetis pro ea in conspectu Domini,"
      en: "Why did you not eat in the holy place the sacrifice for sin, which is most holy, and given to you, that you may bear the iniquity of the people, and may pray for them in the sight of the Lord,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "praesertim cum de sanguine illius non sit illatum intra sancta, et comedere debueritis eam in Sanctuario, sicut praeceptum est mihi?"
      en: "Especially whereas none of the blood thereof hath been carried within the holy places, and you ought to have eaten it in the sanctuary, as was commanded me?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Respondit Aaron: Oblata est hodie victima pro peccato, et holocaustum coram Domino: mihi autem accidit quod vides; quomodo potui comedere eam, aut placere Domino in caeremoniis mente lugubri?"
      en: "Aaron answered: This day hath been offered the victim for sin, and the holocaust before the Lord: and to me what thou seest has happened: how could I eat it, or please the Lord in the ceremonies, having a sorrowful heart?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quod cum audisset Moyses, recepit satisfactionem."
      en: "Which when Moses had heard he was satisfied."
    status: { la: verified, en: verified }
