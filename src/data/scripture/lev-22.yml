# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: lev
chapter: 22
verses:
  - n: 1
    text:
      la: "locutus quoque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "loquere ad Aaron et ad filios eius ut caveant ab his quae consecrata sunt filiorum Israhel et non contaminent nomen sanctificatorum mihi quae ipsi offerunt ego Dominus"
      en: "Speak to Aaron and to his sons, that they beware of those things that are consecrated of the children of Israel, and defile not the name of the things sanctified to me, which they offer. I am the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dic ad eos et ad posteros eorum omnis homo qui accesserit de stirpe vestra ad ea quae consecrata sunt et quae obtulerunt filii Israhel Domino in quo est inmunditia peribit coram Domino ego sum Dominus"
      en: "Say to them and to their posterity: Every man of your race, that approacheth to those things that are consecrated, and which the children of Israel have offered to the Lord, in whom there is uncleanness, shall perish before the Lord. I am the Lord."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "homo de semine Aaron qui fuerit leprosus aut patiens fluxum seminis non vescetur de his quae sanctificata sunt mihi donec sanetur qui tetigerit inmundum super mortuo et ex quo egreditur semen quasi coitus"
      en: "The man of the seed of Aaron, that is a leper, or that suffereth a running of the seed, shall not eat of those things that are sanctified to me, until he be healed. He that toucheth any thing unclean by occasion of the dead, and he whose seed goeth from him as in generation,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et qui tangit reptile et quodlibet inmundum cuius tactus est sordidus"
      en: "And he that toucheth a creeping thing, or any unclean thing, the touching of which is defiling,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "inmundus erit usque ad vesperum et non vescetur his quae sanctificata sunt sed cum laverit carnem suam aqua"
      en: "Shall be unclean until the evening, and shall not eat those things that are sanctified: but when he hath washed his flesh with water,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et occubuerit sol tunc mundatus vescetur de sanctificatis quia cibus illius est"
      en: "And the sun is down, then being purified, he shall eat of the sanctified things, because it is his meat."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "morticinum et captum a bestia non comedent nec polluentur in eis ego sum Dominus"
      en: "That which dieth of itself, and that which was taken by a beast, they shall not eat, nor be defiled therewith, I am the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "custodient praecepta mea ut non subiaceant peccato et moriantur in sanctuario cum polluerint illud ego Dominus qui sanctifico eos"
      en: "Let them keep my precepts, that they may not fall into sin, and die in the sanctuary, when they shall have defiled it. I am the Lord who sanctify them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "omnis alienigena non comedet de sanctificatis inquilinus sacerdotis et mercennarius non vescentur ex eis"
      en: "No stranger shall eat of the sanctified things: a sojourner of the priests, or a hired servant, shall not eat of them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quem autem sacerdos emerit et qui vernaculus domus eius fuerit hii comedent ex eis"
      en: "But he whom the priest hath bought, and he that is his servant, born in his house, these shall eat of them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "si filia sacerdotis cuilibet ex populo nupta fuerit de his quae sanctificata sunt et de primitiis non vescetur"
      en: "If the daughter of a priest be married to any of the people, she shall not eat of those things that are sanctified, nor of the firstfruits."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sin autem vidua vel repudiata et absque liberis reversa fuerit ad domum patris sui sicut puella consuerat aletur cibis patris sui omnis alienigena comedendi ex eis non habet potestatem"
      en: "But if she be a widow, or divorced, and having no children return to her father's house, she shall eat of her father's meats, as she was wont to do when she was a maid, no stranger hath leave to eat of them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui comederit de sanctificatis per ignorantiam addet quintam partem cum eo quod comedit et dabit sacerdoti in sanctuarium"
      en: "He that eateth of the sanctified things through ignorance, shall add the fifth part with that which he ate, and shall give it to the priest into the sanctuary."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "nec contaminabunt sanctificata filiorum Israhel quae offerunt Domino"
      en: "And they shall not profane the sanctified things of the children of Israel, which they offer to the Lord:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ne forte sustineant iniquitatem delicti sui cum sanctificata comederint ego Dominus qui sanctifico eos"
      en: "Lest perhaps they bear the iniquity of their trespass, when they shall have eaten the sanctified things. I am the Lord who sanctify them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "locutus est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "loquere ad Aaron et filios eius et ad omnes filios Israhel dicesque ad eos homo de domo Israhel et de advenis qui habitant apud vos qui obtulerit oblationem suam vel vota solvens vel sponte offerens quicquid illud obtulerit in holocaustum Domini"
      en: "Speak to Aaron, and to his sons, and to all the children of Israel, and thou shalt say to them: The man of the house of Israel, and of the strangers who dwell with you, that offereth his oblation, either paying his vows, or offering of his own accord, whatsoever it be which he presenteth for a holocaust of the Lord,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ut offeratur per vos masculus inmaculatus erit ex bubus et ex ovibus et ex capris"
      en: "To be offered by you, it shall be a male without blemish of the beeves, or of the sheep, or of the goats."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "si maculam habuerit non offeretis neque erit acceptabile"
      en: "If it have a blemish you shall not offer it, neither shall it be acceptable."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "homo qui obtulerit victimam pacificorum Domino vel vota solvens vel sponte offerens tam de bubus quam de ovibus inmaculatum offeret ut acceptabile sit omnis macula non erit in eo"
      en: "The man that offereth a victim of peace offerings to the Lord, either paying his vows, or offering of his own accord, whether of beeves or of sheep, shall offer it without blemish, that it may be acceptable: there shall be no blemish in it."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "si caecum fuerit si fractum si cicatricem habens si papulas aut scabiem vel inpetiginem non offeretis ea Domino neque adolebitis ex eis super altare Domini"
      en: "If it be blind, or broken, or have a scar or blisters, or a scab, or a dry scurf: you shall not offer them to the Lord, nor burn any thing of them upon the Lord's altar."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "bovem et ovem aure et cauda amputatis voluntarie offerre potes votum autem ex his solvi non potest"
      en: "An ox or a sheep, that hath the ear and the tail cut off, thou mayst offer voluntarily: but a vow may not be paid with them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "omne animal quod vel contritis vel tunsis vel sectis ablatisque testiculis est non offeretis Domino et in terra vestra hoc omnino ne faciatis"
      en: "You shall not offer to the Lord any beast that hath the testicles bruised, or crushed, or cut and taken away: neither shall you do any such thing in your land."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "de manu alienigenae non offeretis panes Deo vestro et quicquid aliud dare voluerint quia corrupta et maculata sunt omnia non suscipietis ea"
      en: "You shall not offer bread to your God, from the hand of a stranger, nor any other thing that he would give: because they are all corrupted, and defiled: you shall not receive them."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "locutusque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "bos ovis et capra cum genita fuerint septem diebus erunt sub ubere matris suae die autem octavo et deinceps offerri poterunt Domino"
      en: "When a bullock, or a sheep, or a goat, is brought forth, they shall be seven days under the udder of their dam: but the eighth day, and thenceforth, they may be offered to the Lord."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "sive illa bos sive ovis non immolabuntur una die cum fetibus suis"
      en: "Whether it be a cow, or a sheep, they shall not be sacrificed the same day with their young ones."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "si immolaveritis hostiam pro gratiarum actione Domino ut possit esse placabilis"
      en: "If you immolate a victim for thanksgiving to the Lord, that he may be favourable,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "eodem die comedetis eam non remanebit quicquam in mane alterius diei ego Dominus"
      en: "You shall eat it the same day, there shall not any of it remain until the morning of the next day. I am the Lord."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "custodite mandata mea et facite ea ego Dominus"
      en: "Keep my commandments, and do them. I am the Lord."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "ne polluatis nomen meum sanctum ut sanctificer in medio filiorum Israhel ego Dominus qui sanctifico vos"
      en: "Profane not my holy name, that I may be sanctified in the midst of the children of Israel. I am the Lord who sanctify you,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et eduxi de terra Aegypti ut essem vobis in Deum ego Dominus"
      en: "And who brought you out of the land of Egypt, that I might be your God: I am the Lord."
    status: { la: verified, en: verified }
