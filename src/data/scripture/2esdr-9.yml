book: 2esdr
chapter: 9
verses:
  - n: 1
    text:
      la: "in die autem vicesimo quarto mensis huius convenerunt filii Israhel in ieiunio et in saccis et humus super eos"
      en: "And in the four and twentieth day of the month the children of Israel came together with fasting and with sackcloth, and earth upon them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et separatum est semen filiorum Israhel ab omni filio alienigena et steterunt et confitebantur peccata sua et iniquitates patrum suorum"
      en: "And the seed of the children of Israel separated themselves from every stranger: and they stood, and confessed their sins, and the iniquities of their fathers."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et consurrexerunt ad standum et legerunt in volumine legis Domini Dei sui quater in die et quater confitebantur et adorabant Dominum Deum suum"
      en: "And they rose up to stand: and they read in the book of the law of the Lord their God, four times in the day, and four times they confessed, and adored the Lord their God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "surrexit autem super gradum Levitarum Iosue et Bani Cedmihel Sebnia Bani Sarebias Bani Chanani et inclamaverunt voce magna Dominum Deum suum"
      en: "And there stood up upon the seep of the Levites, Josue, and Bani, and Cedmihel, Sabania, Bonni, Sarebias, Bani, and Chanani: and they cried with a loud voice to the Lord their God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et dixerunt Levitae Iosue et Cedmihel Bonni Asebia Serebia Odoia Sebna Fataia surgite benedicite Domino Deo vestro ab aeterno usque in aeternum et benedicant nomini gloriae tuae excelso in omni benedictione et laude"
      en: "And the Levites Josue and Cedmihel, Bonni, Hasebnia, Serebia, Oduia, Sebnia, and Phathahia, said: Arise, bless the Lord your God from eternity to eternity: and blessed be the high name of thy glory with all blessing and praise."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "tu ipse Domine solus tu fecisti caelum caelum caelorum et omnem exercitum eorum terram et universa quae in ea sunt maria et omnia quae in eis sunt et tu vivificas omnia haec et exercitus caeli te adorat"
      en: "Thou thyself, O Lord alone, thou hast made heaven, and the heaven of heavens, and all the host thereof: the earth and all things that are in it: the seas and all that are therein: and thou givest life to all these things, and the host of heaven adoreth thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "tu ipse Domine Deus qui elegisti Abram et eduxisti eum de igne Chaldeorum et posuisti nomen eius Abraham"
      en: "Thou, O Lord God, art he who chosest Abram, and broughtest him forth out of the fire of the Chaldeans, and gavest him the name of Abraham."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et invenisti cor eius fidele coram te et percussisti cum eo foedus ut dares ei terram Chananei Chetthei Amorrei et Ferezei et Iebusei et Gergesei ut dares semini eius et implesti verba tua quoniam iustus es"
      en: "And thou didst find his heart faithful before thee: and thou madest a covenant with him, to give him the land of the Chanaanite, of the Hethite, and of the Amorrhite, and of the Pherezite, and of the Jebusite, and of the Gergezite, to give it to his seed: and thou hast fulfilled thy words, because thou art just."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et vidisti adflictionem patrum nostrorum in Aegypto clamoremque eorum audisti super mare Rubrum"
      en: "And thou sawest the affliction of our fathers in Egypt: and thou didst hear their cry by the Red Sea."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et dedisti signa et portenta in Pharao et in universis servis eius et in omni populo terrae illius cognovisti enim quia superbe egerant contra eos et fecisti tibi nomen sicut et in hac die"
      en: "And thou shewedst signs and wonders upon Pharao, and upon all his servants, and upon the people of his land : for thou knewest that they dealt proudly against them: and thou madest thyself a name, as it is at this day."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et mare divisisti ante eos et transierunt per medium maris in sicca persecutores autem eorum proiecisti in profundum quasi lapidem in aquas validas"
      en: "And thou didst divide the sea before them, and they passed through the midst of the sea on dry land: but their persecutors thou threwest into the depth, as a stone into mighty waters."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et in columna nubis ductor eorum fuisti per diem et in columna ignis per noctem ut appareret eis via per quam ingrediebantur"
      en: "And in a pillar of a cloud thou wast their leader by day, and in a pillar of Are by night, that they might see the way by which they went."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ad montem quoque Sinai descendisti et locutus es cum eis de caelo et dedisti eis iudicia recta et legem veritatis caerimonias et praecepta bona"
      en: "Thou camest down also to mount Sinai, and didst speak with them from heaven, and thou gavest them right judgments, and the law of truth, ceremonies, and good precepts."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et sabbatum sanctificatum tuum ostendisti eis et mandata et caerimonias et legem praecepisti eis in manu Mosi servi tui"
      en: "Thou madest known to them thy holy sabbath, and didst prescribe to them commandments, and ceremonies, and the law by the hand of Moses thy servant."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "panem quoque de caelo dedisti eis in fame eorum et aquam de petra eduxisti eis sitientibus et dixisti eis ut ingrederentur et possiderent terram super quam levasti manum tuam ut traderes eis"
      en: "And thou gavest them bread from heaven in their hunger, and broughtest forth water for them out of the rock in their thirst, and thou saidst to them that they should go in, and possess the land, upon which thou hadst lifted up thy hand to give it them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ipsi vero et patres nostri superbe egerunt et induraverunt cervices suas et non audierunt mandata tua"
      en: "But they and our fathers dealt proudly, and hardened their necks and hearkened not to thy commandments."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et noluerunt audire et non sunt recordati mirabilium tuorum quae feceras eis et induraverunt cervices suas et dederunt caput ut converterentur ad servitutem suam quasi per contentionem tu autem Deus propitius clemens et misericors longanimis et multae miserationis non dereliquisti eos"
      en: "And they would not hear, and they remembered not thy wonders which thou hadst done for them. And they hardened their necks, and gave the head to return to their bondage, as it were by contention. But thou, a forgiving God, gracious, and merciful, longsuffering, and full of compassion, didst not forsake them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et quidem cum fecissent sibi vitulum conflatilem et dixissent iste est Deus tuus qui eduxit te de Aegypto feceruntque blasphemias magnas"
      en: "Yea when they had made also to themselves a molten calf, and had said: This is thy God, that brought thee out of Egypt: and hail committed great blasphemies :"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "tu autem in misericordiis tuis multis non dimisisti eos in deserto columna nubis non recessit ab eis per diem ut duceret eos in via et columna ignis in nocte ut ostenderet eis iter per quod ingrederentur"
      en: "Yet thou, in thy many mercies, didst not leave them in the desert: the pillar of the cloud departed not from them by day to lead them in the way, and the pillar of fire by night to shew them the way by which they should go."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et spiritum tuum bonum dedisti qui doceret eos et manna tuum non prohibuisti ab ore eorum et aquam dedisti eis in siti"
      en: "And thou gavest them thy good Spirit to teach them, and thy manna thou didst not withhold from their mouth, and thou gavest them water for their thirst."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quadraginta annis pavisti eos in deserto nihilque eis defuit vestimenta eorum non inveteraverunt et pedes eorum non sunt adtriti"
      en: "Forty years didst thou feed them in the desert, and nothing was wanting to them: their garments did not grow old, and their feet were not worn."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et dedisti eis regna et populos et partitus es eis sortes et possederunt terram Seon et terram regis Esebon et terram Og regis Basan"
      en: "And thou gavest them kingdoms, and nations, and didst divide lots for them: and they possessed the land of Sehon, and the land of the king of Hesebon, and the land of Og king of Basan."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et filios eorum multiplicasti sicut stellas caeli et adduxisti eos ad terram de qua dixeras patribus eorum ut ingrederentur et possiderent"
      en: "And thou didst multiply their children as the stars of heaven, and broughtest them to the land concerning which thou hadst said to their fathers, that they should go in and possess it."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et venerunt filii et possederunt terram et humiliasti coram eis habitatores terrae Chananeos et dedisti eos in manu eorum et reges eorum et populos terrae ut facerent eis sicut placebat illis"
      en: "And the children came and possessed the land, and thou didst humble before them the inhabitants of the land, the Chanaanites, and gavest them into their hands, with their kings, and the people of the land, that they might do with them as it pleased them."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ceperunt itaque urbes munitas et humum pinguem et possederunt domos plenas cunctis bonis cisternas ab aliis fabricatas vineas et oliveta et ligna pomifera multa et comederunt et saturati sunt et inpinguati sunt et abundavere deliciis in bonitate tua magna"
      en: "And they took strong cities and a fat land, and possessed houses full of all goods: cisterns made by others, vine- yards, and oliveyards, and fruit trees in abundance: and they ate, and were filled, and became fat, and abounded with de- light in thy great goodness."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "provocaverunt autem te ad iracundiam et recesserunt a te et proiecerunt legem tuam post terga sua et prophetas tuos occiderunt qui contestabantur eos ut reverterentur ad te feceruntque blasphemias grandes"
      en: "But they provoked thee to wrath, and departed from thee, and threw thy law behind their backs: and they killed thy prophets, who admonished them earnestly to return to thee : and they were guilty of great blasphemies."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et dedisti eos in manu hostium suorum et adflixerunt eos et in tempore tribulationis suae clamaverunt ad te et tu de caelo audisti et secundum miserationes tuas multas dedisti eis salvatores qui salvaverunt eos de manu hostium suorum"
      en: "And thou gavest them into the hands of their enemies, and they afflicted them. And in the time of their tribulation they cried to thee, and thou heardest from heaven, and according to the multitude of thy tender mercies thou gavest them saviours, to save them from the hands of their enemies."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "cumque requievissent reversi sunt ut facerent malum in conspectu tuo et dereliquisti eos in manu inimicorum suorum et possederunt eos conversique sunt et clamaverunt ad te tu autem de caelo audisti et liberasti eos in misericordiis tuis multis temporibus"
      en: "But after they had rest, they returned to do evil in thy sight : and thou leftest them in the hand of their enemies, and they had dominion over them. Then they returned, and cried to thee: and thou heardest from heaven, and deliveredst them many times in thy mercies."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et contestatus es eos ut reverterentur ad legem tuam ipsi vero superbe egerunt et non audierunt mandata tua et in iudiciis tuis peccaverunt quae faciet homo et vivet in eis et dederunt umerum recedentem et cervicem suam induraverunt nec audierunt"
      en: "And thou didst admonish them to re turn to thy law. But they dealt proudly, and hearkened not to thy commandments, but sinned against thy judgments, which if a man do, he shall live in them: and they withdrew the shoulder, and hardened their neck, and would not hear."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et protraxisti super eos annos multos et contestatus es eos in spiritu tuo per manum prophetarum tuorum et non audierunt et tradidisti eos in manu populorum terrarum"
      en: "And thou didst forbear with them for many years, and didst testify against them by thy spirit by the hand of thy prophets: and they heard not, and thou didst deliver them into the hand of the people of the lands."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "in misericordiis autem tuis plurimis non fecisti eos in consumptione nec dereliquisti eos quoniam Deus miserationum et clemens tu es"
      en: "Yet in thy very many mercies thou didst not utterly consume them, nor forsake them: because thou art a merciful and gracious God."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "nunc itaque Deus noster Deus magne fortis et terribilis custodiens pactum et misericordiam ne avertas a facie tua omnem laborem qui invenit nos reges nostros principes nostros et sacerdotes nostros prophetas nostros et patres nostros et omnem populum tuum a diebus regis Assur usque in diem hanc"
      en: "Now therefore our God, great, strong and terrible, who keepest covenant and mercy, turn not away from thy face all the labour which hath come upon us, upon our kings, and our princes, and our priests, and our prophets, and our fathers, and all the people from the days of the king of Assur, until this day."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et tu iustus in omnibus quae venerunt super nos quia veritatem fecisti nos autem impie egimus"
      en: "And thou art just in all things that have come upon us: because thou hast done truth, but we have done wickedly."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "reges nostri principes nostri sacerdotes nostri et patres nostri non fecerunt legem tuam et non adtenderunt mandata tua et testimonia tua quae testificatus es in eis"
      en: "Our kings, our princes, our priests, and our fathers have not kept thy law, and have not minded thy commandments, and thy testimonies which thou hast testified among them."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et ipsi in regnis suis bonis et in bonitate tua multa quam dederas eis et in terra latissima et pingui quam tradideras in conspectu eorum non servierunt tibi nec reversi sunt ab studiis suis pessimis"
      en: "And they have not served thee in their kingdoms, and in thy manifold goodness, which thou gavest them, and in the large and fat land, which thou deliveredst before them, nor did they return from their most wicked devices."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "ecce nos ipsi hodie servi sumus et terram quam dedisti patribus nostris ut comederent panem eius et quae bona sunt eius et nos ipsi servi sumus in ea"
      en: "Behold we ourselves this day are bondmen: and the land, which thou gavest our fathers, to eat the bread thereof, and the good things thereof, and we ourselves are servants in it."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et fruges eius multiplicantur regibus quos posuisti super nos propter peccata nostra et in corporibus nostris dominantur et in iumentis nostris secundum voluntatem suam et in tribulatione magna sumus"
      en: "And the fruits thereof grow up for the kings, whom thou hast set over us for our sins, and they have dominion over our bodies, and over our beasts, according to their will, and we are in great tribulation."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "super omnibus ergo his nos ipsi percutimus foedus et scribimus et signant principes nostri Levitae nostri et sacerdotes nostri"
      en: "and because of all this we ourselves make a covenant, and write it, and our princes, our Levites, and our priests sign it."
    status: { la: verified, en: verified }
