# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 47
verses:
  - n: 1
    text:
      la: "ingressus ergo Ioseph nuntiavit Pharaoni dicens pater meus et fratres oves eorum et armenta et cuncta quae possident venerunt de terra Chanaan et ecce consistunt in terra Gessen"
      en: "Then Joseph went in and told Pharao, saying: My father and brethren, their sheep and their herds, and all that they possess, are come out of the land of Chanaan: and behold they stay in the land of Gessen."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "extremos quoque fratrum suorum quinque viros statuit coram rege"
      en: "Five men also the last of his brethren, he presented before the king:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quos ille interrogavit quid habetis operis responderunt pastores ovium sumus servi tui et nos et patres nostri"
      en: "And he asked them: What is your occupation? They answered: Re thy servants are shepherds, both we, and our fathers."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ad peregrinandum in terra tua venimus quoniam non est herba gregibus servorum tuorum ingravescente fame in regione Chanaan petimusque ut esse nos iubeas servos tuos in terra Gessen"
      en: "We are come to sojourn in thy land, because there is no grass for the flocks of thy servants, the famine being very grievous in the land of Chanaan: and we pray thee to give orders that we thy servants may be in the land of Gessen."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixit itaque rex ad Ioseph pater tuus et fratres tui venerunt ad te"
      en: "The king therefore said to Joseph: Thy father and thy brethren are come to thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "terra Aegypti in conspectu tuo est in optimo loco fac habitare eos et trade eis terram Gessen quod si nosti esse in eis viros industrios constitue illos magistros pecorum meorum"
      en: "The land of Egypt is before thee: make them dwell in the best place, and give them the land of Gessen. And if thou knowest that there are industrious men among them, make them rulers over my cattle."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "post haec introduxit Ioseph patrem suum ad regem et statuit eum coram eo qui benedicens illi"
      en: "After this Joseph brought in his to the king, and presented him before him: and he blessed him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et interrogatus ab eo quot sunt dies annorum vitae tuae"
      en: "And being asked by him: How many are the days of the years of thy life?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "respondit dies peregrinationis vitae meae centum triginta annorum sunt parvi et mali et non pervenerunt usque ad dies patrum meorum quibus peregrinati sunt"
      en: "He answered: The days of my pilgrimage are a hundred and thirty years, few, and evil, and they are not come up to the days of the pilgrimage of my fathers."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et benedicto rege egressus est foras"
      en: "And blessing the king, he went out."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ioseph vero patri et fratribus suis dedit possessionem in Aegypto in optimo loco terrae solo Ramesses ut praeceperat Pharao"
      en: "But Joseph gave a possession to his father and his brethren in Egypt, in the best place of the land, in Ramesses, as Pharao had commanded."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et alebat eos omnemque domum patris sui praebens cibaria singulis"
      en: "And he nourished them, and all his father's house, allowing food to every one."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "in toto enim orbe panis deerat et oppresserat fames terram maxime Aegypti et Chanaan"
      en: "For in the whole world there was want of bread, and a famine had op- pressed the land: more especially of Egypt and Chanaan."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "e quibus omnem pecuniam congregavit pro venditione frumenti et intulit eam in aerarium regis"
      en: "Out of which he gathered up all the money for the corn which they bought, and brought it into the king's treasure."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cumque defecisset emptoris pretium venit cuncta Aegyptus ad Ioseph dicens da nobis panes quare morimur coram te deficiente pecunia"
      en: "And when the buyers wanted money, all Egypt came to Joseph, saying: Give us bread: why should we die in thy presence, having now net money."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quibus ille respondit adducite pecora vestra et dabo vobis pro eis cibos si pretium non habetis"
      en: "And he answered them: Bring your cattle, and for them I will give you food, if you have no money."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quae cum adduxissent dedit eis alimenta pro equis et ovibus et bubus et asinis sustentavitque eos illo anno pro commutatione pecorum"
      en: "And when they had brought them, he gave them food in exchange for their horses, and sheep, and oxen, end asses and he maintained them that year for the exchange of their cattle."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "veneruntque anno secundo et dixerunt ei non celamus dominum nostrum quod deficiente pecunia pecora simul defecerint nec clam te est quod absque corporibus et terra nihil habeamus"
      en: "And they came the second year, and said to him: We will not hide from our lord, how that our money is spent, and our cattle also are gone: neither art thou ignorant that we have nothing now left but our bodies and our lands."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "cur ergo morimur te vidente et nos et terra nostra tui erimus eme nos in servitutem regiam et praebe semina ne pereunte cultore redigatur terra in solitudinem"
      en: "Why therefore shall we die before thy eyes? we will be thins, both we and our lands: buy us to be the king's servants, and give us seed, lest for want of tillers the land be turned into a wilderness."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "emit igitur Ioseph omnem terram Aegypti vendentibus singulis possessiones suas prae magnitudine famis subiecitque eam Pharaoni"
      en: "So Joseph bought all the land of Egypt, every man selling his possessions, because of the greatness of the famine. And he brought it into Pharao's hands:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et cunctos populos eius a novissimis terminis Aegypti usque ad extremos fines eius"
      en: "And all its people from one end of the borders of Egypt, even to the other end thereof,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "praeter terram sacerdotum quae a rege tradita fuerat eis quibus et statuta cibaria ex horreis publicis praebebantur et idcirco non sunt conpulsi vendere possessiones suas"
      en: "Except the land of the priests, which had been given them by the king: to whom also a certain allowance of food was given out of the public stores, and therefore they were not forced to sell their possessions."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "dixit ergo Ioseph ad populos en ut cernitis et vos et terram vestram Pharao possidet accipite semina et serite agros"
      en: "Then Joseph said to the people : Be- hold as you see, both you and your lands belong to Pharao: take seed and sow the fields,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ut fruges habere possitis quintam partem regi dabitis quattuor reliquas permitto vobis in sementem et in cibos famulis et liberis vestris"
      en: "That you may have corn. The fifth part you shall give to the king: the other four you shall have for seed, and for food for your families and children."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "qui responderunt salus nostra in manu tua est respiciat nos tantum dominus noster et laeti serviemus regi"
      en: "And they answered: Our life is in thy hand: only let my lord look favourably upon us, and we will gladly serve the king."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ex eo tempore usque in praesentem diem in universa terra Aegypti regibus quinta pars solvitur et factum est quasi in legem absque terra sacerdotali quae libera ab hac condicione fuit"
      en: "From that time unto this day, in the whole land of Egypt, the fifth part is paid to the king, and it is become as a law, except the land of the priests, which was free from this covenant."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "habitavit ergo Israhel in Aegypto id est in terra Gessen et possedit eam auctusque est et multiplicatus nimis"
      en: "So Israel dwelt in Egypt, that is, in the land of Gessen, and possessed it: and grew, and was multiplied exceedingly."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et vixit in ea decem et septem annis factique sunt omnes dies vitae illius centum quadraginta septem annorum"
      en: "And he lived in it seventeen years: and all the days of his life came to a hundred and forty-seven years."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "cumque adpropinquare cerneret mortis diem vocavit filium suum Ioseph et dixit ad eum si inveni gratiam in conspectu tuo pone manum sub femore meo et facies mihi misericordiam et veritatem ut non sepelias me in Aegypto"
      en: "And when he saw that the day of his death drew nigh, he called his son Joseph, and said to him: If I have found favour in thy sight, put thy hand under my thigh; and thou shalt shew me this kindness and truth, not to bury me in Egypt:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "sed dormiam cum patribus meis et auferas me de hac terra condasque in sepulchro maiorum cui respondit Ioseph ego faciam quod iussisti"
      en: "But I will sleep with my fathers, end thou shalt take me away out of this land, and bury me in the burying place of my ancestors. And Joseph answered him: I will do what thou hast commanded."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et ille iura ergo inquit mihi quo iurante adoravit Israhel Deum conversus ad lectuli caput"
      en: "And he said: Swear then to me. And as he was swearing, Israel adored God, turning to the bed's head."
    status: { la: verified, en: verified }
