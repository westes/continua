# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 47
verses:
  - n: 1
    text:
      la: "Ingressus ergo Joseph nuntiavit Pharaoni, dicens: Pater meus et fratres, oves eorum et armenta, et cuncta quae possident, venerunt de terra Chanaan: et ecce consistunt in terra Gessen."
      en: "Then Joseph went in and told Pharao, saying: My father and brethren, their sheep and their herds, and all that they possess, are come out of the land of Chanaan: and behold they stay in the land of Gessen."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Extremos quoque fratrum suorum quinque viros constituit coram rege:"
      en: "Five men also the last of his brethren, he presented before the king:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quos ille interrogavit: Quid habetis operis? Responderunt: Pastores ovium sumus servi tui, et nos et patres nostri."
      en: "And he asked them: What is your occupation? They answered: We thy servants are shepherds, both we, and our fathers."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ad peregrinandum in terra tua venimus: quoniam non est herba gregibus servorum tuorum, ingravescente fame in terra Chanaan: petimusque ut esse nos jubeas servos tuos in terra Gessen."
      en: "We are come to sojourn in thy land, because there is no grass for the flocks of thy servants, the famine being very grievous in the land of Chanaan: and we pray thee to give orders that we thy servants may be in the land of Gessen."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dixit itaque rex ad Joseph: Pater tuus et fratres tui venerunt ad te."
      en: "The king therefore said to Joseph: Thy father and thy brethren are come to thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Terra Aegypti in conspectu tuo est: in optimo loco fac eos habitare, et trade eis terram Gessen. Quod si nosti in eis esse viros industrios, constitue illos magistros pecorum meorum."
      en: "The land of Egypt is before thee: make them dwell in the best place, and give them the land of Gessen. And if thou knowest that there are industrious men among them, make them rulers over my cattle."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Post haec introduxit Joseph patrem suum ad regem, et statuit eum coram eo: qui benedicens illi,"
      en: "After this Joseph brought in his father to the king, and presented him before him: and he blessed him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et interrogatus ab eo: Quot sunt dies annorum vitae tuae?"
      en: "And being asked by him: How many are the days of the years of thy life?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "respondit: Dies peregrinationis meae centum triginta annorum sunt, parvi et mali, et non pervenerunt usque ad dies patrum meorum quibus peregrinati sunt."
      en: "He answered: The days of my pilgrimage are a hundred and thirty years, few, and evil, and they are not come up to the days of the pilgrimage of my fathers."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et benedicto rege, egressus est foras."
      en: "And blessing the king, he went out."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Joseph vero patri et fratribus suis dedit possessionem in Aegypto in optimo terrae loco, Ramesses, ut praeceperat Pharao."
      en: "But Joseph gave a possession to his father and his brethren in Egypt, in the best place of the land, in Ramesses, as Pharao had commanded."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et alebat eos, omnemque domum patris sui, praebens cibaria singulis."
      en: "And he nourished them, and all his father's house, allowing food to every one."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "In toto enim orbe panis deerat, et oppresserat fames terram, maxime Aegypti et Chanaan."
      en: "For in the whole world there was want of bread, and a famine had oppressed the land: more especially of Egypt and Chanaan."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "E quibus omnem pecuniam congregavit pro venditione frumenti, et intulit eam in aerarium regis."
      en: "Out of which he gathered up all the money for the corn which they bought, and brought it into the king's treasure."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cumque defecisset emptoribus pretium, venit cuncta Aegyptus ad Joseph, dicens: Da nobis panes: quare morimur coram te, deficiente pecunia?"
      en: "And when the buyers wanted money, all Egypt came to Joseph, saying: Give us bread: why should we die in thy presence, having now no money."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quibus ille respondit: Adducite pecora vestra, et dabo vobis pro eis cibos, si pretium non habetis."
      en: "And he answered them: Bring me your cattle, and for them I will give you food, if you have no money."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quae cum adduxissent, dedit eis alimenta pro equis, et ovibus, et bobus, et asinis: sustentavitque eos illo anno pro commutatione pecorum."
      en: "And when they had brought them, he gave them food in exchange for their horses, and sheep, and oxen, and asses and he maintained them that year for the exchange of their cattle."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Venerunt quoque anno secundo, et dixerunt ei: Non celabimus dominum nostrum quod deficiente pecunia, pecora simul defecerunt: nec clam te est, quod absque corporibus et terra nihil habeamus."
      en: "And they came the second year, and said to him: We will not hide from our lord, how that our money is spent, and our cattle also are gone: neither art thou ignorant that we have nothing now left but our bodies and our lands."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Cur ergo moriemur te vidente? et nos et terra nostra tui erimus: eme nos in servitutem regiam, et praebe semina, ne pereunte cultore redigatur terra in solitudinem."
      en: "Why therefore shall we die before thy eyes? we will be thine, both we and our lands: buy us to be the king's servants, and give us seed, lest for want of tillers the land be turned into a wilderness."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Emit igitur Joseph omnem terram Aegypti, vendentibus singulis possessiones suas prae magnitudine famis. Subjecitque eam Pharaoni,"
      en: "So Joseph bought all the land of Egypt, every man selling his possessions, because of the greatness of the famine. And he brought it into Pharao's hands:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et cunctos populos ejus a novissimis terminis Aegypti usque ad extremos fines ejus,"
      en: "And all its people from one end of the borders of Egypt, even to the other end thereof,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "praeter terram sacerdotum, quae a rege tradita fuerat eis: quibus et statuta cibaria ex horreis publicis praebebantur, et idcirco non sunt compulsi vendere possessiones suas."
      en: "Except the land of the priests, which had been given them by the king: to whom also a certain allowance of food was given out of the public stores, and therefore they were not forced to sell their possessions."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Dixit ergo Joseph ad populos: En ut cernitis, et vos et terram vestram Pharao possidet: accipite semina, et serite agros,"
      en: "Then Joseph said to the people: Behold as you see, both you and your lands belong to Pharao: take seed and sow the fields,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ut fruges habere possitis. Quintam partem regi dabitis: quatuor reliquas permitto vobis in sementem, et in cibum familiis et liberis vestris."
      en: "That you may have corn. The fifth part you shall give to the king: the other four you shall have for seed, and for food for your families and children."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Qui responderunt: Salus nostra in manu tua est: respiciat nos tantum dominus noster, et laeti serviemus regi."
      en: "And they answered: Our life is in thy hand: only let my lord look favourably upon us, and we will gladly serve the king."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Ex eo tempore usque in praesentem diem, in universa terra Aegypti regibus quinta pars solvitur, et factum est quasi in legem, absque terra sacerdotali, quae libera ab hac conditione fuit."
      en: "From that time unto this day, in the whole land of Egypt, the fifth part is paid to the king, and it is become as a law, except the land of the priests, which was free from this covenant."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Habitavit ergo Israel in Aegypto, id est, in terra Gessen, et possedit eam: auctusque est, et multiplicatus nimis."
      en: "So Israel dwelt in Egypt, that is, in the land of Gessen, and possessed it: and grew, and was multiplied exceedingly."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et vixit in ea decem et septem annis: factique sunt omnes dies vitae illius, centum quadraginta septem annorum."
      en: "And he lived in it seventeen years: and all the days of his life came to a hundred and forty-seven years."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Cumque appropinquare cerneret diem mortis suae, vocavit filium suum Joseph, et dixit ad eum: Si inveni gratiam in conspectu tuo, pone manum tuam sub femore meo: et facies mihi misericordiam et veritatem, ut non sepelias me in Aegypto:"
      en: "And when he saw that the day of his death drew nigh, he called his son Joseph, and said to him: If I have found favour in thy sight, put thy hand under my thigh; and thou shalt shew me this kindness and truth, not to bury me in Egypt:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "sed dormiam cum patribus meis, et auferas me de terra hac, condasque in sepulchro majorum meorum. Cui respondit Joseph: Ego faciam quod jussisti."
      en: "But I will sleep with my fathers, and thou shalt take me away out of this land, and bury me in the burying place of my ancestors. And Joseph answered him: I will do what thou hast commanded."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et ille: Jura ergo, inquit, mihi. Quo jurante, adoravit Israel Deum, conversus ad lectuli caput."
      en: "And he said: Swear then to me. And as he was swearing, Israel adored God, turning to the bed's head."
    status: { la: verified, en: verified }
