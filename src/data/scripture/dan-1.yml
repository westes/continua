# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: dan
chapter: 1
verses:
  - n: 1
    text:
      la: "Anno tertio regni Joakim regis Juda, venit Nabuchodonosor, rex Babylonis, in Jerusalem, et obsedit eam:"
      en: "In the third year of the reign of Joakim king of Juda, Nabuchodonosor king of Babylon came to Jerusalem, and besieged it."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et tradidit Dominus in manu ejus Joakim, regem Juda, et partem vasorum domus Dei: et asportavit ea in terram Sennaar in domum dei sui, et vasa intulit in domum thesauri dei sui."
      en: "And the Lord delivered into his hands Joakim the king of Juda, and part of the vessels of the house of God: and he carried them away into the land of Sennaar, to the house of his god, and the vessels he brought into the treasure house of his god."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et ait rex Asphenez praeposito eunuchorum ut introduceret de filiis Israel, et de semine regio et tyrannorum,"
      en: "And the king spoke to Asphenez the master of the eunuchs, that he should bring in some of the children of Israel, and of the king's seed and of the princes,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "pueros in quibus nulla esset macula, decoros forma, et eruditos omni sapientia, cautos scientia, et doctos disciplina, et qui possent stare in palatio regis, ut doceret eos litteras et linguam Chaldaeorum."
      en: "Children in whom there was no blemish, well favoured, and skillful in all wisdom, acute in knowledge, and instructed in science, and such as might stand in the king's palace, that he might teach them the learning, and the tongue of the Chaldeans."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et constituit eis rex annonam per singulos dies de cibis suis, et de vino unde bibebat ipse, ut enutriti tribus annis, postea starent in conspectu regis."
      en: "And the king appointed them a daily provision, of his own meat, and of the wine of which he drank himself, that being nourished three years, afterwards they might stand before the king."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Fuerunt ergo inter eos de filiis Juda, Daniel, Ananias, Misael, et Azarias."
      en: "Now there were among them of the children of Juda, Daniel, Ananias, Misael, and Azarias."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et imposuit eis praepositus eunuchorum nomina: Danieli, Baltassar; Ananiae, Sidrach; Misaeli, Misach; et Azariae, Abdenago."
      en: "And the master of the eunuchs gave them names: to Daniel, Baltassar: to Ananias, Sidrach: to Misael, Misach: and to Azarias, Abdenago."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Proposuit autem Daniel in corde suo ne pollueretur de mensa regis, neque de vino potus ejus: et rogavit eunuchorum praepositum ne contaminaretur."
      en: "But Daniel purposed in his heart that he would not be defiled with the king's table, nor with the wine which he drank: and he requested the master of the eunuchs that he might not be defiled."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dedit autem Deus Danieli gratiam et misericordiam in conspectu principis eunuchorum."
      en: "And God gave to Daniel grace and mercy in the sight of the prince of the eunuchs."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et ait princeps eunuchorum ad Danielem: Timeo ego dominum meum regem, qui constituit vobis cibum et potum: qui si viderit vultus vestros macilentiores prae ceteris adolescentibus coaevis vestris, condemnabitis caput meum regi."
      en: "And the prince of the eunuchs said to Daniel: I fear my lord the king, who hath appointed you meat and drink: who if he should see your faces leaner than those of the other youths your equals, you shall endanger my head to the king."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et dixit Daniel ad Malasar, quem constituerat princeps eunuchorum super Danielem, Ananiam, Misaelem, et Azariam:"
      en: "And Daniel said to Malasar, whom the prince of the eunuchs had appointed over Daniel, Ananias, Misael, and Azarias:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tenta nos, obsecro, servos tuos, diebus decem, et dentur nobis legumina ad vescendum, et aqua ad bibendum:"
      en: "Try, I beseech thee, thy servants for ten days, and let pulse be given us to eat, and water to drink:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et contemplare vultus nostros, et vultus puerorum, qui vescuntur cibo regio: et sicut videris, facies cum servis tuis."
      en: "And look upon our faces, and the faces of the children that eat of the king's meat: and as thou shalt see, deal with thy servants."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Qui, audito sermone hujuscemodi, tentavit eos diebus decem."
      en: "And when he had heard these words, he tried them for ten days."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Post dies autem decem, apparuerunt vultus eorum meliores, et corpulentiores prae omnibus pueris, qui vescebantur cibo regio."
      en: "And after ten days their faces appeared fairer and fatter than all the children that ate of the king's meat."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Porro Malasar tollebat cibaria, et vinum potus eorum: dabatque eis legumina."
      en: "So Malasar took their portions, and the wine that they should drink: and he gave them pulse."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Pueris autem his dedit Deus scientiam et disciplinam, in omni libro et sapientia: Danieli autem intelligentiam omnium visionum et somniorum."
      en: "And to these children God gave knowledge, and understanding in every book, and wisdom: but to Daniel the understanding also of all visions and dreams."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Completis itaque diebus, post quos dixerat rex ut introducerentur, introduxit eos praepositus eunuchorum in conspectu Nabuchodonosor."
      en: "And when the days were ended, after which the king had ordered they should be brought in: the prince of the eunuchs brought them in before Nabuchodonosor."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Cumque eis locutus fuisset rex, non sunt inventi tales de universis, ut Daniel, Ananias, Misael, et Azarias: et steterunt in conspectu regis."
      en: "And when the king had spoken to them, there were not found among them all such as Daniel, Ananias, Misael, and Azarias: and they stood in the king's presence."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et omne verbum sapientiae et intellectus, quod sciscitatus est ab eis rex, invenit in eis decuplum super cunctos ariolos et magos qui erant in universo regno ejus."
      en: "And in all matters of wisdom and understanding, that the king inquired of them, he found them ten times better than all the diviners, and wise men, that were in all his kingdom."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Fuit autem Daniel usque ad annum primum Cyri regis."
      en: "And Daniel continued even to the first year of king Cyrus."
    status: { la: verified, en: verified }
