# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2cor
chapter: 11
verses:
  - n: 1
    text:
      la: "Utinam sustineretis modicum quid insipientiae meae, sed et supportare me:"
      en: "Would to God you could bear with some little of my folly: but do bear with me."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "aemulor enim vos Dei aemulatione. Despondi enim vos uni viro, virginem castam exhibere Christo."
      en: "For I am jealous of you with the jealousy of God. For I have espoused you to one husband that I may present you as a chaste virgin to Christ."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Timeo autem ne sicut serpens Hevam seduxit astutia sua, ita corrumpantur sensus vestri, et excidant a simplicitate, quae est in Christo."
      en: "But I fear lest, as the serpent seduced Eve by his subtilty, so your minds should be corrupted, and fall from the simplicity that is in Christ."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nam si is qui venit, alium Christum praedicat, quem non praedicavimus, aut alium spiritum accipitis, quem non accepistis: aut aliud Evangelium, quod non recepistis: recte pateremini."
      en: "For if he that cometh preacheth another Christ, whom we have not preached; or if you receive another Spirit, whom you have not received; or another gospel which you have not received; you might well bear with him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Existimo enim nihil me minus fecisse a magnis Apostolis."
      en: "For I suppose that I have done nothing less than the great apostles."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Nam etsi imperitus sermone, sed non scientia, in omnibus autem manifestati sumus vobis."
      en: "For although I be rude in speech, yet not in knowledge; but in all things we have been made manifest to you."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Aut numquid peccatum feci, meipsum humilians, ut vos exaltemini? quoniam gratis Evangelium Dei evangelizavi vobis?"
      en: "Or did I commit a fault, humbling myself, that you might be exalted? Because I preached unto you the gospel of God freely?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Alias ecclesias expoliavi, accipiens stipendium ad ministerium vestrum."
      en: "I have taken from other churches, receiving wages of them for your ministry."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et cum essem apud vos, et egerem, nulli onerosus fui: nam quod mihi deerat, suppleverunt fratres, qui venerunt a Macedonia: et in omnibus sine onere me vobis servavi, et servabo."
      en: "And, when I was present with you, and wanted, I was chargeable to no man: for that which was wanting to me, the brethren supplied who came from Macedonia; and in all things I have kept myself from being burthensome to you, and so I will keep myself."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Est veritas Christi in me, quoniam haec gloriatio non infringetur in me in regionibus Achaiae."
      en: "The truth of Christ is in me, that this glorying shall not be broken off in me in the regions of Achaia."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quare? quia non diligo vos? Deus scit."
      en: "Wherefore? Because I love you not? God knoweth it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quod autem facio, et faciam: ut amputem occasionem eorum qui volunt occasionem, ut in quo gloriantur, inveniantur sicut et nos."
      en: "But what I do, that I will do, that I may cut off the occasion from them that desire occasion, that wherein they glory, they may be found even as we."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nam ejusmodi pseudoapostoli sunt operarii subdoli, transfigurantes se in apostolos Christi."
      en: "For such false apostles are deceitful workmen, transforming themselves into the apostles of Christ."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et non mirum: ipse enim Satanas transfigurat se in angelum lucis."
      en: "And no wonder: for Satan himself transformeth himself into an angel of light."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Non est ergo magnum, si ministri ejus transfigurentur velut ministri justitiae: quorum finis erit secundum opera ipsorum."
      en: "Therefore it is no great thing if his ministers be transformed as the ministers of justice, whose end shall be according to their works."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Iterum dico ( ne quis me putet insipientem esse, alioquin velut insipientem accipite me, ut et ego modicum quid glorier),"
      en: "I say again, (let no man think me to be foolish, otherwise take me as one foolish, that I also may glory a little.)"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quod loquor, non loquor secundum Deum, sed quasi in insipientia, in hac substantia gloriae."
      en: "That which I speak, I speak not according to God, but as it were in foolishness, in this matter of glorying."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quoniam multi gloriantur secundum carnem: et ego gloriabor."
      en: "Seeing that many glory according to the flesh, I will glory also."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Libenter enim suffertis insipientes, cum sitis ipsi sapientes."
      en: "For you gladly suffer the foolish; whereas yourselves are wise."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Sustinetis enim si quis vos in servitutem redigit, si quis devorat, si quis accipit, si quis extollitur, si quis in faciem vos caedit."
      en: "For you suffer if a man bring you into bondage, if a man devour you, if a man take from you, if a man be lifted up, if a man strike you on the face."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Secundum ignobilitatem dico, quasi nos infirmi fuerimus in hac parte. In quo quis audet ( in insipientia dico) audeo et ego:"
      en: "I speak according to dishonour, as if we had been weak in this part. Wherein if any man dare (I speak foolishly), I dare also."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Hebraei sunt, et ego: Israelitae sunt, et ego: semen Abrahae sunt, et ego."
      en: "They are Hebrews: so am I. They are Israelites: so am I. They are the seed of Abraham: so am I."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ministri Christi sunt ( ut minus sapiens dico), plus ego: in laboribus plurimis, in carceribus abundantius, in plagis supra modum, in mortibus frequenter."
      en: "They are the ministers of Christ (I speak as one less wise). I am more; in many more labours, in prisons more frequently, in stripes above measure, in deaths often."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "A Judaeis quinquies, quadragenas, una minus, accepi."
      en: "Of the Jews five times did I receive forty stripes, save one."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Ter virgis caesus sum, semel lapidatus sum: ter naufragium feci, nocte et die in profundo maris fui,"
      en: "Thrice was I beaten with rods, once I was stoned, thrice I suffered shipwreck, a night and a day I was in the depth of the sea."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "in itineribus saepe, periculis fluminum, periculis latronum, periculis ex genere, periculis ex gentibus, periculis in civitate, periculis in solitudine, periculis in mari, periculis in falsis fratribus:"
      en: "In journeying often, in perils of waters, in perils of robbers, in perils from my own nation, in perils from the Gentiles, in perils in the city, in perils in the wilderness, in perils in the sea, in perils from false brethren."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "in labore et aerumna, in vigiliis multis, in fame et siti, in jejuniis multis, in frigore et nuditate,"
      en: "In labour and painfulness, in much watchings, in hunger and thirst, in fastings often, in cold and nakedness."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "praeter illa quae extrinsecus sunt, instantia mea quotidiana, sollicitudo omnium ecclesiarum."
      en: "Besides those things which are without: my daily instance, the solicitude for all the churches."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Quis infirmatur, et ego non infirmor? quis scandalizatur, et ego non uror?"
      en: "Who is weak, and I am not weak? Who is scandalized, and I am not on fire?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Si gloriari oportet, quae infirmitatis meae sunt, gloriabor."
      en: "If I must needs glory, I will glory of the things that concern my infirmity."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Deus et Pater Domini nostri Jesu Christi, qui est benedictus in saecula, scit quod non mentior."
      en: "The God and Father of our Lord Jesus Christ, who is blessed for ever, knoweth that I lie not."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Damasci praepositus gentis Aretae regis custodiebat civitatem Damascenorum ut me comprehenderet:"
      en: "At Damascus, the governor of the nation under Aretas the king, guarded the city of the Damascenes, to apprehend me."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et per fenestram in sporta dimissus sum per murum, et sic effugi manus ejus."
      en: "And through a window in a basket was I let down by the wall, and so escaped his hands."
    status: { la: verified, en: verified }
