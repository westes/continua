# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 20
verses:
  - n: 1
    text:
      la: "quam bonum est arguere quam irasci et confitentem in oratione non prohibere"
      en: "How much better is it to reprove, than to be angry, and not to hinder him that confesseth in prayer."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "concupiscentia spadonis devirginavit iuvenem"
      en: "The lust of an eunuch shall devour a young maiden:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sic qui facit per vim iudicium inique"
      en: "So is he that by violence executeth unjust judgment."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quam bonum est correptum manifestare paenitentiam sic enim effugies voluntarium peccatum est tacens qui invenitur sapiens"
      en: "How good is it, when thou art reproved, to shew repentance! for so thou shalt escape wilful sin."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et est odibilis qui procax est ad loquendum"
      en: "There is one that holdeth his peace, that is found wise: and there is another that is hateful, that is bold in speech."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "est autem tacens non habens sensum loquellae et est tacens sciens tempus apti temporis"
      en: "There is one that holdeth his peace, because he knoweth not what to say: and there is another that holdeth his peace, knowing the proper time."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "homo sapiens tacebit usque ad tempus lascivus autem et inprudens non servabunt tempus"
      en: "A wise man will hold his peace till he see opportunity: but a babbler, and a fool, will regard no time."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui multis utitur verbis laedit animam suam et qui potestatem sibi adsumit iniuste odietur"
      en: "He that useth many words shall hurt his own soul: and he that taketh authority to himself unjustly shall be hated."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "est processio in malis viro indisciplinato et est inventio in detrimentum"
      en: "There is success in evil things to a man without discipline, and there is a finding that turneth to loss."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "est datus qui non sit utilis et est datus cuius retributio duplex"
      en: "There is a gift that is not profitable: and there is a gift, the recompense of which is double."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "est propter gloriam minoratio et est qui ab humilitate levavit caput"
      en: "There is an abasement because of glory: and there is one that shall lift up his head from a low estate."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "est qui multa redimat modico pretio et restituens ea septuplum"
      en: "There is that buyeth much for a small price, and restoreth the same sevenfold."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sapiens in verbis se ipsum amabilem facit gratiae autem fatuorum effundentur"
      en: "A man wise in words shall make himself beloved: but the graces of fools shall be poured out."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "datus insipientis non erit utilis tibi oculi enim illius septimplices sunt"
      en: "The gift of the fool shall do thee no good: for his eyes are sevenfold."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "exigua dabit et multa inproperabit et apertio oris illius inflammatio est"
      en: "He will give a few things, and upbraid much: and the opening of his mouth is the kindling of a fire."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "hodie fenerat quis et cras expetit et odibilis homo huiusmodi"
      en: "To day a man lendeth, and to morrow he asketh it again: such a man as this is hateful."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "fatuo non erit amicus et non erit gratia bonis illius"
      en: "A fool shall have no friend, and there shall be no thanks for his good deeds."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui enim edunt panem illius falsi linguae sunt quotiens et quanti inridebunt eum"
      en: "For they that eat his bread, are of a false tongue. How often, and how many will laugh him to scorn!"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "neque enim quod habendum erat directo sensu distribuit similiter et quod non erat habendum"
      en: "For he doth not distribute with right understanding that which was to be had: in like manner also that which was not to be had."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "lapsus falsae linguae quasi qui pavimento cadens nam et sic casus malorum festinanter venient"
      en: "The slipping of a false tongue is as one that falleth on the pavement: so the fall of the wicked shall come speedily."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "homo acharis quasi fabula vana in ore indisciplinatorum adsidua erit"
      en: "A man without grace is as a vain fable, it shall be continually in the mouth of the unwise."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ex ore fatui reprobabitur parabola non enim dicit illam in tempore suo"
      en: "A parable coming out, of a fool's mouth shall be rejected: for he doth not speak it in due season."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "est qui vetatur peccare ab inopia et in requie sua stimulabitur"
      en: "There is that is hindered from sinning through want, and in his rest he shall be pricked."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "est qui perdit animam suam prae confusione et ab inprudenti persona perdet eam personae autem acceptione perdet se"
      en: "There is that will destroy his own soul through shamefacedness, and by occasion of an unwise person he will destroy it: and by respect of person he will destroy himself."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "est qui prae confusione promittit amico et lucratus est eum inimicum gratis"
      en: "There is that for bashfulness promiseth to his friend, and maketh him his enemy for nothing."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "obprobrium nequa in homine mendacium et in ore indisciplinatorum adsidue erit"
      en: "A lie is a foul blot in a man, and yet it will be continually in the mouth of men without discipline."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "potius furem quam adsiduitas viri mendacis perditionem autem ambo hereditabunt"
      en: "A thief is better than a man that is always lying: but both of them shall inherit destruction."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "mores hominum mendacium sine honore et confusio illius cum ipso sine intermissione"
      en: "The manners of lying men are without honour: and their confusion is with them without ceasing."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "verbum parabolarum sapiens in verbis producet se ipsum et homo prudens placebit magnatis"
      en: "A wise man shall advance himself with his words, and a prudent man shall please the great ones."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "qui operatur terram suam inaltabit acervum fructuum et qui operatur iustitiam ipse exaltabitur qui vero placet magnatis effugiet iniquitatem"
      en: "He that tilleth his land shall make a high heap of corn: and he that worketh justice shall be exalted: and he that pleaseth great men shall escape iniquity."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "xenia et dona excaecant oculos iudicum et quasi mutus in ore avertit correptiones eorum"
      en: "Presents and gifts blind the eyes of judges, and make them dumb in the mouth, so that they cannot correct."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "sapientia absconsa et thesaurus invisus quae utilitas in utrisque"
      en: "Wisdom that is hid, and treasure that is not seen: what profit is there in them both?"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "melius in hominibus qui abscondent insipientiam suam quam qui abscondunt sapientiam suam"
      en: "Better is he that hideth his folly, than the man that hideth his wisdom."
    status: { la: verified, en: verified }
