# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: rom
chapter: 5
verses:
  - n: 1
    text:
      la: "Justificati ergo ex fide, pacem habeamus ad Deum per Dominum nostrum Jesum Christum:"
      en: "Being justified therefore by faith, let us have peace with God, through our Lord Jesus Christ:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "per quem et habemus accessum per fidem in gratiam istam, in qua stamus, et gloriamur in spe gloriae filiorum Dei."
      en: "By whom also we have access through faith into this grace, wherein we stand, and glory in the hope of the glory of the sons of God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Non solum autem, sed et gloriamur in tribulationibus: scientes quod tribulatio patientiam operatur:"
      en: "And not only so; but we glory also in tribulations, knowing that tribulation worketh patience;"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "patientia autem probationem, probatio vero spem,"
      en: "And patience trial; and trial hope;"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "spes autem non confundit: quia caritas Dei diffusa est in cordibus nostris per Spiritum Sanctum, qui datus est nobis."
      en: "And hope confoundeth not: because the charity of God is poured forth in our hearts, by the Holy Ghost, who is given to us."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ut quid enim Christus, cum adhuc infirmi essemus, secundum tempus, pro impiis mortuus est?"
      en: "For why did Christ, when as yet we were weak, according to the time, die for the ungodly?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "vix enim pro justo quis moritur: nam pro bono forsitan quis audeat mori."
      en: "For scarce for a just man will one die; yet perhaps for a good man some one would dare to die."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Commendat autem caritatem suam Deus in nobis: quoniam cum adhuc peccatores essemus, secundum tempus,"
      en: "But God commendeth his charity towards us; because when as yet we were sinners, according to the time,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Christus pro nobis mortuus est: multo igitur magis nunc justificati in sanguine ipsius, salvi erimus ab ira per ipsum."
      en: "Christ died for us; much more therefore, being now justified by his blood, shall we be saved from wrath through him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Si enim cum inimici essemus, reconciliati sumus Deo per mortem filii ejus: multo magis reconciliati, salvi erimus in vita ipsius."
      en: "For if, when we were enemies, we were reconciled to God by the death of his Son; much more, being reconciled, shall we be saved by his life."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Non solum autem: sed et gloriamur in Deo per Dominum nostrum Jesum Christum, per quem nunc reconciliationem accepimus."
      en: "And not only so; but also we glory in God, through our Lord Jesus Christ, by whom we have now received reconciliation."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Propterea sicut per unum hominem peccatum in hunc mundum intravit, et per peccatum mors, et ita in omnes homines mors pertransiit, in quo omnes peccaverunt."
      en: "Wherefore as by one man sin entered into this world, and by sin death; and so death passed upon all men, in whom all have sinned."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Usque ad legem enim peccatum erat in mundo: peccatum autem non imputabatur, cum lex non esset."
      en: "For until the law sin was in the world; but sin was not imputed, when the law was not."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sed regnavit mors ab Adam usque ad Moysen etiam in eos qui non peccaverunt in similitudinem praevaricationis Adae, qui est forma futuri."
      en: "But death reigned from Adam unto Moses, even over them also who have not sinned after the similitude of the transgression of Adam, who is a figure of him who was to come."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Sed non sicut delictum, ita et donum: si enim unius delicto multi mortui sunt: multo magis gratia Dei et donum in gratia unius hominis Jesu Christi in plures abundavit."
      en: "But not as the offence, so also the gift. For if by the offence of one, many died; much more the grace of God, and the gift, by the grace of one man, Jesus Christ, hath abounded unto many."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et non sicut per unum peccatum, ita et donum. Nam judicium quidem ex uno in condemnationem: gratia autem ex multis delictis in justificationem."
      en: "And not as it was by one sin, so also is the gift. For judgment indeed was by one unto condemnation; but grace is of many offences, unto justification."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Si enim unius delicto mors regnavit per unum: multo magis abundantiam gratiae, et donationis, et justitiae accipientes, in vita regnabunt per unum Jesum Christum."
      en: "For if by one man's offence death reigned through one; much more they who receive abundance of grace, and of the gift, and of justice, shall reign in life through one, Jesus Christ."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Igitur sicut per unius delictum in omnes homines in condemnationem: sic et per unius justitiam in omnes homines in justificationem vitae."
      en: "Therefore, as by the offence of one, unto all men to condemnation; so also by the justice of one, unto all men to justification of life."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Sicut enim per inobedientiam unius hominis, peccatores constituti sunt multi: ita et per unius obeditionem, justi constituentur multi."
      en: "For as by the disobedience of one man, many were made sinners; so also by the obedience of one, many shall be made just."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Lex autem subintravit ut abundaret delictum. Ubi autem abundavit delictum, superabundavit gratia:"
      en: "Now the law entered in, that sin might abound. And where sin abounded, grace did more abound."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ut sicut regnavit peccatum in mortem: ita et gratia regnet per justitiam in vitam aeternam, per Jesum Christum Dominum nostrum."
      en: "That as sin hath reigned to death; so also grace might reign by justice unto life everlasting, through Jesus Christ our Lord."
    status: { la: verified, en: verified }
