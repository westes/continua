# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 30
verses:
  - n: 1
    text:
      la: "Nunc autem derident me juniores tempore, quorum non dignabar patres ponere cum canibus gregis mei:"
      en: "But now the younger in time scorn me, whose fathers I would not have set with the dogs of my flock:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quorum virtus manuum mihi erat pro nihilo, et vita ipsa putabantur indigni:"
      en: "The strength of whose hands was to me as nothing, and they were thought unworthy of life itself."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "egestate et fame steriles, qui rodebant in solitudine, squallentes calamitate et miseria."
      en: "Barren with want and hunger, who gnawed in the wilderness, disfigured with calamity and misery."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et mandebant herbas, et arborum cortices, et radix juniperorum erat cibus eorum:"
      en: "And they ate grass, and barks of trees, and the root of junipers was their food."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "qui de convallibus ista rapientes, cum singula reperissent, ad ea cum clamore currebant:"
      en: "Who snatched up these things out of the valleys, and when they had found any of them, they ran to them with a cry."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in desertis habitabant torrentium, et in cavernis terrae, vel super glaream:"
      en: "They dwelt in the desert places of torrents, and in caves of earth, or upon the gravel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui inter hujuscemodi laetabantur, et esse sub sentibus delicias computabant:"
      en: "They pleased themselves among these kind of things, and counted it delightful to be under the briers."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "filii stultorum et ignobilium, et in terra penitus non parentes."
      en: "The children of foolish and base men, and not appearing at all upon the earth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Nunc in eorum canticum versus sum, et factus sum eis in proverbium."
      en: "Now I am turned into their song, and am become their byword."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Abominantur me, et longe fugiunt a me, et faciem meam conspuere non verentur."
      en: "They abhor me, and flee far from me, and are not afraid to spit in my face."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Pharetram enim suam aperuit, et afflixit me, et frenum posuit in os meum."
      en: "For he hath opened his quiver, and hath afflicted me, and hath put a bridle into my mouth."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ad dexteram orientis calamitates meae illico surrexerunt: pedes meos subverterunt, et oppresserunt quasi fluctibus semitis suis."
      en: "At the right hand of my rising, my calamities forthwith arose: they have overthrown my feet, and have overwhelmed me with their paths as with waves."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dissipaverunt itinera mea: insidiati sunt mihi, et praevaluerunt, et non fuit qui ferret auxilium."
      en: "They have destroyed my ways, they have lain in wait against me, and they have prevailed, and there was none to help."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quasi rupto muro, et aperta janua, irruerunt super me, et ad meas miserias devoluti sunt."
      en: "They have rushed in upon me, as when a wall is broken, and a gate opened, and have rolled themselves down to my miseries."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Redactus sum in nihilum; abstulisti quasi ventus desiderium meum, et velut nubes pertransiit salus mea."
      en: "I am brought to nothing: as a wind thou hast taken away my desire: and my prosperity hath passed away like a cloud."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nunc autem in memetipso marcescit anima mea, et possident me dies afflictionis."
      en: "And now my soul fadeth within myself, and the days of affliction possess me."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Nocte os meum perforatur doloribus, et qui me comedunt, non dormiunt."
      en: "In the night my bone is pierced with sorrows: and they that feed upon me, do not sleep."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "In multitudine eorum consumitur vestimentum meum, et quasi capito tunicae succinxerunt me."
      en: "With the multitude of them my garment is consumed, and they have girded me about, as with the collar of my coat."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Comparatus sum luto, et assimilatus sum favillae et cineri."
      en: "I am compared to dirt, and am likened to embers and ashes."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Clamo ad te, et non exaudis me: sto, et non respicis me."
      en: "I cry to thee, and thou hearest me not: I stand up, and thou dost not regard me."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Mutatus es mihi in crudelem, et in duritia manus tuae adversaris mihi."
      en: "Thou art changed to be cruel toward me, and in the hardness of thy hand thou art against me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Elevasti me, et quasi super ventum ponens elisisti me valide."
      en: "Thou hast lifted me up, and set me as it were upon the wind, and thou hast mightily dashed me."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Scio quia morti trades me, ubi constituta est domus omni viventi."
      en: "I know that thou wilt deliver me to death, where a house is appointed for every one that liveth."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Verumtamen non ad consumptionem eorum emittis manum tuam: et si corruerint, ipse salvabis."
      en: "But yet thou stretchest not forth thy hand to their consumption: and if they shall fall down thou wilt save."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Flebam quondam super eo qui afflictus erat, et compatiebatur anima mea pauperi."
      en: "I wept heretofore for him that was afflicted, and my soul had compassion on the poor."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Expectabam bona, et venerunt mihi mala: praestolabar lucem, et eruperunt tenebrae."
      en: "I expected good things, and evils are come upon me: I waited for light, and darkness broke out."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Interiora mea efferbuerunt absque ulla requie: praevenerunt me dies afflictionis."
      en: "My inner parts have boiled without any rest, the days of affliction have prevented me."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Moerens incedebam, sine furore, consurgens, in turba clamabam."
      en: "I went mourning without indignation; I rose up, and cried in the crowd."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Frater fui draconum, et socius struthionum."
      en: "I was the brother of dragons, and companion of ostriches."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Cutis mea denigrata est super me, et ossa mea aruerunt prae caumate."
      en: "My skin is become black upon me, and my bones are dried up with heat."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Versa est in luctum cithara mea, et organum meum in vocem flentium."
      en: "My harp is turned to mourning, and my organ into the voice of those that weep."
    status: { la: verified, en: verified }
