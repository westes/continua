# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 43
verses:
  - n: 1
    text:
      la: "Factum est autem, cum complesset Jeremias loquens ad populum universos sermones Domini Dei eorum, pro quibus miserat eum Dominus Deus eorum ad illos, omnia verba haec,"
      en: "And it came to pass, that when Jeremias had made an end of speaking to the people all the words of the Lord their God, for which the Lord their God had sent him to them, all these words:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixit Azarias filius Osaiae, et Johanan filius Caree, et omnes viri superbi, dicentes ad Jeremiam: Mendacium tu loqueris: non misit te Dominus Deus noster, dicens: Ne ingrediamini Aegyptum ut habitetis illuc."
      en: "Azarias the son of Osaias, and Johanan the son of Caree, and all the proud men, made answer, saying to Jeremias: Thou tellest a lie: the Lord our God hath not sent thee, saying: Go not into Egypt, to dwell there."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sed Baruch filius Neriae incitat te adversum nos, ut tradat nos in manus Chaldaeorum, ut interficiat nos, et traduci faciat in Babylonem."
      en: "But Baruch the son of Nerias setteth thee on against us, to deliver us into the hands of the Chaldeans, to kill us, and to cause us to be carried away captives to Babylon."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et non audivit Johanan filius Caree, et omnes principes bellatorum, et universus populus, vocem Domini, ut manerent in terra Juda."
      en: "So Johanan the son of Caree, and all the captains of the soldiers, and all the people, obeyed not the voice of the Lord, to remain in the land of Juda."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Sed tollens Johanan filius Caree, et universi principes bellatorum, universos reliquiarum Juda, qui reversi fuerant de cunctis gentibus ad quas fuerant ante dispersi, ut habitarent in terra Juda,"
      en: "But Johanan the son of Caree, and all the captains of the soldiers took all the remnant of Juda, that were returned out of all nations, to which they had before been scattered, to dwell in the land of Juda:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "viros, et mulieres, et parvulos, et filias regis, et omnem animam quam reliquerat Nabuzardan princeps militiae cum Godolia filio Ahicam filii Saphan, et Jeremiam prophetam, et Baruch filium Neriae:"
      en: "Men, and women, and children, and the king's daughters, and every soul, which Nabuzardan the general had left with Godolias the son of Ahicam the son of Saphan, and Jeremias the prophet, and Baruch the son of Nerias."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et ingressi sunt terram Aegypti, quia non obedierunt voci Domini, et venerunt usque ad Taphnis."
      en: "And they went Into the land of Egypt, for they obeyed not the voice of the Lord: and they came as far as Taphnis."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et factus est sermo Domini ad Jeremiam in Taphnis, dicens:"
      en: "And the word of the Lord came to Jeremias in Taphnis, saying:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sume lapides grandes in manu tua, et abscondes eos in crypta quae est sub muto latericio in porta domus Pharaonis in Taphnis, cernentibus viris Judaeis,"
      en: "Take great stones in thy hand, and thou shalt hide them in the vault that is under the brick wall at the gate of Pharao's house in Taphnis: in the sight of the men of Juda."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et dices ad eos: Haec dicit Dominus exercituum, Deus Israel: Ecce ego mittam et assumam Nabuchodonosor regem Babylonis, servum meum: et ponam thronum ejus super lapides istos quos abscondi, et statuet solium suum super eos:"
      en: "And thou shalt say to them: Thus saith the Lord of hosts the God of Israel: Behold I will send, and take Nabuchodonosor the king of Babylon my servant: and I will set his throne over these stones which I have hid, and he shall set his throne over them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "veniensque percutiet terram Aegypti, quos in mortem, in mortem, et quos in captivitatem, in captivitatem, et quos in gladium, in gladium:"
      en: "And he shall come and strike the land of Egypt: such as are for death, to death: and such as are for captivity, to captivity: and such as are for the sword, to the sword."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et succendet ignem in delubris deorum Aegypti, et comburet ea, et captivos ducet illos, et amicietur terra Aegypti sicut amicitur pastor pallio suo, et egredietur inde in pace:"
      en: "And he shall kindle a fire in the temples of the gods of Egypt, and he shall burn them, and he shall carry them away captives: and he shall array himself with the land of Egypt, as a shepherd putteth on his garment: and he shall go forth from thence in peace."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et conteret statuas domus solis quae sunt in terra Aegypti, et delubra deorum Aegypti comburet igni."
      en: "And he shall break the statues of the house of the sun, that are in the land of Egypt; and the temples of the gods of Egypt he shall burn with fire."
    status: { la: verified, en: verified }
