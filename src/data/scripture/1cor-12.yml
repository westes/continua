# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1cor
chapter: 12
verses:
  - n: 1
    text:
      la: "de spiritalibus autem nolo vos ignorare fratres"
      en: "Now concerning spiritual things, my brethren, I would not have you ignorant."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "scitis quoniam cum gentes essetis ad simulacra muta prout ducebamini euntes"
      en: "You know that when you were heathens, you went to dumb idols, according as you were led."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ideo notum vobis facio quod nemo in Spiritu Dei loquens dicit anathema Iesu et nemo potest dicere Dominus Iesus nisi in Spiritu Sancto"
      en: "Wherefore I give you to understand, that no man, speaking by the Spirit of God, saith Anathema to Jesus. And no man can say the Lord Jesus, but by the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "divisiones vero gratiarum sunt idem autem Spiritus"
      en: "Now there are diversities of graces, but the same Spirit;"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et divisiones ministrationum sunt idem autem Dominus"
      en: "And there are diversities of ministries, but the same Lord;"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et divisiones operationum sunt idem vero Deus qui operatur omnia in omnibus"
      en: "And there are diversities of operations, but the same God, who worketh all in all."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "unicuique autem datur manifestatio Spiritus ad utilitatem"
      en: "And the manifestation of the Spirit is given to every man unto profit."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "alii quidem per Spiritum datur sermo sapientiae alii autem sermo scientiae secundum eundem Spiritum"
      en: "To one indeed, by the Spirit, is given the word of wisdom: and to another, the word of knowledge, according to the same Spirit;"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "alteri fides in eodem Spiritu alii gratia sanitatum in uno Spiritu"
      en: "To another, faith in the same spirit; to another, the grace of healing in one Spirit;"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "alii operatio virtutum alii prophetatio alii discretio spirituum alii genera linguarum alii interpretatio sermonum"
      en: "To another, the working of miracles; to another, prophecy; to another, the discerning of spirits; to another, diverse kinds of tongues; to another, interpretation of speeches."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "haec autem omnia operatur unus atque idem Spiritus dividens singulis prout vult"
      en: "But all these things one and the same Spirit worketh, dividing to every one according as he will."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "sicut enim corpus unum est et membra habet multa omnia autem membra corporis cum sint multa unum corpus sunt ita et Christus"
      en: "For as the body is one, and hath many members; and all the members of the body, whereas they are many, yet are one body, so also is Christ."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "etenim in uno Spiritu omnes nos in unum corpus baptizati sumus sive Iudaei sive gentiles sive servi sive liberi et omnes unum Spiritum potati sumus"
      en: "For in one Spirit were we all baptized into one body, whether Jews or Gentiles, whether bond or free; and in one Spirit we have all been made to drink."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "nam et corpus non est unum membrum sed multa"
      en: "For the body also is not one member, but many."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "si dixerit pes quoniam non sum manus non sum de corpore non ideo non est de corpore"
      en: "If the foot should say, because I am not the hand, I am not of the body; is it therefore not of the body ?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et si dixerit auris quia non sum oculus non sum de corpore non ideo non est de corpore"
      en: "And if the ear should say, because I am not the eye, I am not of the body; is it therefore not of the body ?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "si totum corpus oculus ubi auditus si totum auditus ubi odoratus"
      en: "If the whole body were the eye, where would be the hearing? If the whole were hearing, where would be the smelling?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "nunc autem posuit Deus membra unumquodque eorum in corpore sicut voluit"
      en: "But now God hath set the members every one of them in the body as it hath pleased him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quod si essent omnia unum membrum ubi corpus"
      en: "And if they all were one member, where would be the body?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "nunc autem multa quidem membra unum autem corpus"
      en: "But now there are many members indeed, yet one body."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "non potest dicere oculus manui opera tua non indigeo aut iterum caput pedibus non estis mihi necessarii"
      en: "And the eye cannot say to the hand: I need not thy help; nor again the head to the feet: I have no need of you."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sed multo magis quae videntur membra corporis infirmiora esse necessariora sunt"
      en: "Yea, much more those that seem to be the more feeble members of the body, are more necessary."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et quae putamus ignobiliora membra esse corporis his honorem abundantiorem circumdamus et quae inhonesta sunt nostra abundantiorem honestatem habent"
      en: "And such as we think to be the less honourable members of the body, about these we put more abundant honour; and those that are our uncomely parts, have more abundant comeliness."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "honesta autem nostra nullius egent sed Deus temperavit corpus ei cui deerat abundantiorem tribuendo honorem"
      en: "But our comely parts have no need: but God hath tempered the body together, giving to that which wanted the more abundant honour,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ut non sit scisma in corpore sed id ipsum pro invicem sollicita sint membra"
      en: "That there might be no schism in the body; but the members might be mutually careful one for another."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et si quid patitur unum membrum conpatiuntur omnia membra sive gloriatur unum membrum congaudent omnia membra"
      en: "And if one member suffer any thing, all the members suffer with it; or if one member glory, all the members rejoice with it."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "vos autem estis corpus Christi et membra de membro"
      en: "Now you are the body of Christ, and members of member."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et quosdam quidem posuit Deus in ecclesia primum apostolos secundo prophetas tertio doctores deinde virtutes exin gratias curationum opitulationes gubernationes genera linguarum"
      en: "And God indeed hath set some in the church; first apostles, secondly prophets, thirdly doctors; after that miracles; then the graces of healing, helps, governments, kinds of tongues, interpretations of speeches."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "numquid omnes apostoli numquid omnes prophetae numquid omnes doctores"
      en: "Are all apostles? Are all prophets? Are all doctors?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "numquid omnes virtutes numquid omnes gratiam habent curationum numquid omnes linguis loquuntur numquid omnes interpretantur"
      en: "Are all workers of miracles? Have all the grace of healing? Do all speak with tongues? Do all interpret?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "aemulamini autem charismata maiora et adhuc excellentiorem viam vobis demonstro"
      en: "But be zealous for the better gifts. And I shew unto you yet a more excellent way."
    status: { la: verified, en: verified }
