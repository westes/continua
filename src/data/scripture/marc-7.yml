# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: marc
chapter: 7
verses:
  - n: 1
    text:
      la: "Et conveniunt ad eum pharisaei, et quidam de scribis, venientes ab Jerosolymis."
      en: "And there assembled together unto him the Pharisees and some of the scribes, coming from Jerusalem."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et cum vidissent quosdam ex discipulis ejus communibus manibus, id est non lotis, manducare panes, vituperaverunt."
      en: "And when they had seen some of his disciples eat bread with common, that is, with unwashed hands, they found fault."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Pharisaei enim, et omnes Judaei, nisi crebro laverint manus, non manducant, tenentes traditionem seniorum:"
      en: "For the Pharisees, and all the Jews eat not without often washing their hands, holding the tradition of the ancients:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et a foro nisi baptizentur, non comedunt: et alia multa sunt, quae tradita sunt illis servare, baptismata calicum, et urceorum, et aeramentorum, et lectorum:"
      en: "And when they come from the market, unless they be washed, they eat not: and many other things there are that have been delivered to them to observe, the washings of cups and of pots, and of brazen vessels, and of beds."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et interrogabant eum pharisaei et scribae: Quare discipuli tui non ambulant juxta traditionem seniorum, sed communibus manibus manducant panem?"
      en: "And the Pharisees and scribes asked him: Why do not thy disciples walk according to the tradition of the ancients, but they eat bread with common hands?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "At ille respondens, dixit eis: Bene prophetavit Isaias de vobis hypocritis, sicut scriptum est: Populus hic labiis me honorat, cor autem eorum longe est a me:"
      en: "But he answering, said to them: Well did Isaias prophesy of you hypocrites, as it is written: This people honoureth me with their lips, but their heart is far from me."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in vanum autem me colunt, docentes doctrinas, et praecepta hominum."
      en: "And in vain do they worship me, teaching doctrines and precepts of men."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Relinquentes enim mandatum Dei, tenetis traditionem hominum, baptismata urceorum et calicum: et alia similia his facitis multa."
      en: "For leaving the commandment of God, you hold the tradition of men, the washing of pots and of cups: and many other things you do like to these."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et dicebat illis: Bene irritum facitis praeceptum Dei, ut traditionem vestram servetis."
      en: "And he said to them: Well do you make void the commandment of God, that you may keep your own tradition."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Moyses enim dixit: Honora patrem tuum, et matrem tuam. Et: Qui maledixerit patri, vel matri, morte moriatur."
      en: "For Moses said: Honour thy father and thy mother; and He that shall curse father or mother, dying let him die."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Vos autem dicitis: Si dixerit homo patri, aut matri, Corban ( quod est donum) quodcumque ex me, tibi profuerit:"
      en: "But you say: If a man shall say to his father or mother, Corban, (which is a gift,) whatsoever is from me, shall profit thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et ultra non dimittitis eum quidquam facere patri suo, aut matri,"
      en: "And further you suffer him not to do any thing for his father or mother,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "rescindentes verbum Dei per traditionem vestram, quam tradidistis: et similia hujusmodi multa facitis."
      en: "Making void the word of God by your own tradition, which you have given forth. And many other such like things you do."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et advocans iterum turbam, dicebat illis: Audite me omnes, et intelligite."
      en: "And calling again the multitude unto him, he said to them: Hear ye me all, and understand."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Nihil est extra hominem introiens in eum, quod possit eum coinquare, sed quae de homine procedunt illa sunt quae communicant hominem."
      en: "There is nothing from without a man that entering into him, can defile him. But the things which come from a man, those are they that defile a man."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Si quis habet aures audiendi, audiat."
      en: "If any man have ears to hear, let him hear."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et cum introisset in domum a turba, interrogabant eum discipuli ejus parabolam."
      en: "And when he was come into the house from the multitude, his disciples asked him the parable."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et ait illis: Sic et vos imprudentes estis? Non intelligitis quia omne extrinsecus introiens in hominem, non potest eum communicare:"
      en: "And he saith to them: So are you also without knowledge? understand you not that every thing from without, entering into a man cannot defile him:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quia non intrat in cor ejus, sed in ventrum vadit, et in secessum exit, purgans omnes escas?"
      en: "Because it entereth not into his heart, but goeth into the belly, and goeth out into the privy, purging all meats?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dicebat autem, quoniam quae de homine exeunt, illa communicant hominem."
      en: "But he said that the things which come out from a man, they defile a man."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Ab intus enim de corde hominum malae cogitationes procedunt, adulteria, fornicationes, homicidia,"
      en: "For from within out of the heart of men proceed evil thoughts, adulteries, fornications, murders,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "furta, avaritiae, nequitiae, dolus, impudicitiae, oculus malus, blasphemia, superbia, stultitia."
      en: "Thefts, covetousness, wickedness, deceit, lasciviousness, an evil eye, blasphemy, pride, foolishness."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Omnia haec mala ab intus procedunt, et communicant hominem."
      en: "All these evil things come from within, and defile a man."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et inde surgens abiit in fines Tyri et Sidonis: et ingressus domum, neminem voluit scire, et non potuit latere."
      en: "And rising from thence he went into the coasts of Tyre and Sidon: and entering into a house, he would that no man should know it, and he could not be hid."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Mulier enim statim ut audivit de eo, cujus filia habebat spiritum immundum, intravit, et procidit ad pedes ejus."
      en: "For a woman as soon as she heard of him, whose daughter had an unclean spirit, came in and fell down at his feet."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Erat enim mulier gentilis, Syrophoenissa genere. Et rogabat eum ut daemonium ejiceret de filia ejus."
      en: "For the woman was a Gentile, a Syrophenician born. And she besought him that he would cast forth the devil out of her daughter."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Qui dixit illi: Sine prius saturari filios: non est enim bonum sumere panem filiorum, et mittere canibus."
      en: "Who said to her: Suffer first the children to be filled: for it is not good to take the bread of the children, and cast it to the dogs."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "At illa respondit, et dixit illi: Utique Domine, nam et catelli comedunt sub mensa de micis puerorum."
      en: "But she answered and said to him: Yea, Lord; for the whelps also eat under the table of the crumbs of the children."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et ait illi: Propter hunc sermonem vade: exiit daemonium a filia tua."
      en: "And he said to her: For this saying go thy way, the devil is gone out of thy daughter."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et cum abiisset domum suam, invenit puellam jacentem supra lectum, et daemonium exiisse."
      en: "And when she was come into her house, she found the girl lying upon the bed, and that the devil was gone out."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et iterum exiens de finibus Tyri, venit per Sidonem ad mare Galilaeae inter medios fines Decapoleos."
      en: "And again going out of the coasts of Tyre, he came by Sidon to the sea of Galilee, through the midst of the coasts of Decapolis."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et adducunt ei surdum, et mutum, et deprecabantur eum, ut imponat illi manum."
      en: "And they bring to him one deaf and dumb; and they besought him that he would lay his hand upon him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et apprehendens eum de turba seorsum, misit digitos suos in auriculas ejus: et exspuens, tetigit linguam ejus:"
      en: "And taking him from the multitude apart, he put his fingers into his ears, and spitting, he touched his tongue:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et suscipiens in caelum, ingemuit, et ait illi: Ephphetha, quod est, Adaperire."
      en: "And looking up to heaven, he groaned, and said to him: Ephpheta, which is, Be thou opened."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et statim apertae sunt aures ejus, et solutum est vinculum linguae ejus, et loquebatur recte."
      en: "And immediately his ears were opened, and the string of his tongue was loosed, and he spoke right."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et praecepit illis ne cui dicerent. Quanto autem eis praecipiebat, tanto magis plus praedicabant:"
      en: "And he charged them that they should tell no man. But the more he charged them, so much the more a great deal did they publish it."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et eo amplius admirabantur, dicentes: Bene omnia fecit: et surdos fecit audire, et mutos loqui."
      en: "And so much the more did they wonder, saying: He hath done all things well; he hath made both the deaf to hear, and the dumb to speak."
    status: { la: verified, en: verified }
