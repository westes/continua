# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 33
verses:
  - n: 1
    text:
      la: "duodecim annorum erat Manasses cum regnare coepisset et quinquaginta quinque annis regnavit in Hierusalem"
      en: "Manasses was twelve years old when he began to reign, and he reigned fifty-five years in Jerusalem."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fecit autem malum coram Domino iuxta abominationes gentium quas subvertit Dominus coram filiis Israhel"
      en: "And he did evil before the Lord, according to all the abominations of the nations, which the Lord cast out before the children of Israel:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et conversus instauravit excelsa quae demolitus fuerat Ezechias pater eius construxitque aras Baalim et fecit lucos et adoravit omnem militiam caeli et coluit eam"
      en: "And he turned, and built again the high places which Ezechias his father had destroyed: and he built altars to Baalim, and made groves, and he adored all the host of heaven, and worshipped them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "aedificavit quoque altaria in domo Domini de qua dixerat Dominus in Hierusalem erit nomen meum in aeternum"
      en: "He built also altars in the house of the Lord, whereof the Lord had said: In Jerusalem shall my name be for ever."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "aedificavit autem ea cuncto exercitui caeli in duobus atriis domus Domini"
      en: "And he built them for all the host of heaven in the two courts of the house of the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "transireque fecit filios suos per ignem in valle Benennon observabat somnia sectabatur auguria maleficis artibus inserviebat habebat secum magos et incantatores multaque mala operatus est coram Domino ut inritaret eum"
      en: "And he made his sons to pass through the fire in the valley of Benennom: he observed dreams, followed divinations, gave himself up to magic arts, had with him magicians, and enchanters: and he wrought many evils before the Lord, to provoke him to anger."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sculptile quoque et conflatile signum posuit in domo Domini de qua locutus est Dominus ad David et ad Salomonem filium eius dicens in domo hac et in Hierusalem quam elegi de cunctis tribubus Israhel ponam nomen meum in sempiternum"
      en: "He set also a graven, and a molten statue in the house of God, of which God had said to David, and to Solomon his son: In this house, and in Jerusalem, which I have chosen out of all the tribes of Israel, will I put my name for ever."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et movere non faciam pedem Israhel de terra quam tradidi patribus eorum ita dumtaxat si custodierint facere quae praecepi eis cunctamque legem et caerimonias atque iudicia per manum Mosi"
      en: "And I will not make the foot of Israel to be removed out of the land which I have delivered to their fathers: yet so if they will take heed to do what I hare commanded them, and all the law, and the ceremonies, and judgments by the hand of Moses."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "igitur Manasses seduxit Iudam et habitatores Hierusalem ut facerent malum super omnes gentes quas subverterat Dominus a facie filiorum Israhel"
      en: "So Manasses seduced Juda, and the inhabitants of Jerusalem, to do evil beyond all the nations, which the Lord had destroyed before the face of the children of Israel."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "locutusque est Dominus ad eum et ad populum illius et adtendere noluerunt"
      en: "And the Lord spoke to him, and to his people, and they would not hearken."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "idcirco superinduxit eis principes exercitus regis Assyriorum ceperuntque Manassen et vinctum catenis atque conpedibus duxerunt Babylonem"
      en: "Therefore he brought upon them the captains of the army of the king of the Assyrians: and they took Manasses, and carried him bound with chains and fetters to Babylon."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "qui postquam coangustatus est oravit Dominum Deum suum et egit paenitentiam valde coram Deo patrum suorum"
      en: "And after that he was in distress he prayed to the Lord his God: and did penance exceedingly before the God of his fathers."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "deprecatusque est eum et obsecravit intente et exaudivit orationem eius reduxitque eum Hierusalem in regnum suum et cognovit Manasses quod Dominus ipse esset Deus"
      en: "And he entreated him, and besought him earnestly: and he heard his prayer, and brought him again to Jerusalem into his kingdom, and Manasses knew that the Lord was God."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "post haec aedificavit murum extra civitatem David ad occidentem Gion in convalle ab introitu portae Piscium per circuitum usque ad Ophel et exaltavit illum vehementer constituitque principes exercitus in cunctis civitatibus Iuda munitis"
      en: "After this he built a wall without the city of David, on the west side of Gihon in the valley, from the entering in of the fish gate round about to Ophel, and raised it up to a great height: and he appointed captains of the army in all the fenced cities of Juda:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et abstulit deos alienos et simulacrum de domo Domini aras quoque quas fecerat in monte domus Domini et in Hierusalem et proiecit omnia extra urbem"
      en: "And he took away the strange gods, and the idol out of the house of the Lord: the altars also which he had made in the mount of the house of the Lord, and in Jerusalem, and he cast them all out of the city."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "porro instauravit altare Domini et immolavit super illud victimas et pacifica et laudem praecepitque Iudae ut serviret Domino Deo Israhel"
      en: "And he repaired the altar of the Lord, and sacrificed upon it victims, and peace offerings, and praise: and he commanded Juda to serve the Lord the God of Israel."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "attamen adhuc populus immolabat in excelsis Domino Deo suo"
      en: "Nevertheless the people still sacrificed in the high places to the Lord their God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "reliqua autem gestorum Manasse et obsecratio eius ad Deum suum verba quoque videntium qui loquebantur ad eum in nomine Domini Dei Israhel continentur in sermonibus regum Israhel"
      en: "But the rest of the acts of Manasses, and his prayer to his God, and the words of the seers that spoke to him in the name of the Lord the God of Israel, are contained in the words of the kings of Israel."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "oratio quoque eius et exauditio et cuncta peccata atque contemptus loca etiam in quibus aedificavit excelsa et fecit lucos et statuas antequam ageret paenitentiam scripta sunt in sermonibus Ozai"
      en: "His prayer also, and his being heard, and all his sins, and contempt, and places wherein he built high places, and set up groves, and statues before he did penance, are written in the words of Hozai."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dormivit ergo Manasses cum patribus suis et sepelierunt eum in domo sua regnavitque pro eo filius eius Amon"
      en: "And Manasses slept with his fathers. and they buried him in his house: and his son Amen reigned in his stead."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "viginti duo annorum erat Amon cum regnare coepisset et duobus annis regnavit in Hierusalem"
      en: "Amen was two and twenty years old when he began to reign, and he reigned two years in Jerusalem."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "fecitque malum in conspectu Domini sicut fecerat Manasses pater eius et cunctis idolis quae Manasses fuerat fabricatus immolavit atque servivit"
      en: "And he did evil in the sight of the Lord, as Manasses his father had done: and he sacrificed to all the idols which Manasses his father had made, and served them."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et non est reveritus faciem Domini sicut reveritus est Manasses pater eius et multo maiora deliquit"
      en: "And he did not humble himself before the Lord, as Manasses his father had humbled himself, but committed far greater sins."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "cumque coniurassent adversus eum servi sui interfecerunt eum in domo sua"
      en: "And his servants conspired against him, and slew him in his own house."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "porro reliqua populi multitudo caesis his qui Amon percusserant constituit regem Iosiam filium eius pro eo"
      en: "But the rest of the multitude of the people slew them that had killed Amen, and made Josias his son king in his stead."
    status: { la: verified, en: verified }
