book: ezek
chapter: 48
verses:
  - n: 1
    text:
      la: "et haec nomina tribuum a finibus aquilonis iuxta viam Aethlon pergentibus Emath atrium Aenon terminus Damasci ad aquilonem iuxta Emath et erit ei plaga orientalis mare Dan una"
      en: "And these are the names of the tribes from the borders of the north, by the way of Hethalon, as they go to Emath, the court of Enan the border of Damascus northward, by the way of Emath. And from the east side thereof to the sea, shall be one portion for Dan."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ad terminum Dan a plaga orientali usque ad plagam maris Aser una"
      en: "And by the border of Dan, from the east side even to the side of the sea, one portion for Aser:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et super terminum Aser a plaga orientali usque ad plagam maris Nepthalim una"
      en: "And by the border of Aser, from the east side even to the side of the sea, one portion for Nephthali."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et super terminum Nepthalim a plaga orientali usque ad plagam maris Manasse una"
      en: "And by the border of Nephthali, from the east side even to the side of the sea, one portion for Manasses."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et super terminum Manasse a plaga orientali usque ad plagam maris Ephraim una"
      en: "And by the border of Manasses, from the east side even to the side of the sea, one portion for Ephraim."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et super terminum Ephraim a plaga orientali usque ad plagam maris Ruben una"
      en: "And by the border of Ephraim, from the east side even to the side of the sea, one portion for Ruben."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et super terminum Ruben a plaga orientali usque ad plagam maris Iuda una"
      en: "And by the border of Ruben, from the east side even to the side of the sea, one portion for Juda."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et super terminum Iuda a plaga orientali usque ad plagam maris erunt primitiae quas separabitis viginti quinque milibus latitudinis et longitudinis sicuti singulae partes a plaga orientali usque ad plagam maris et erit sanctuarium in medio eius"
      en: "And by the border of Juda, from the east side even to the side of the sea, shall be the firstfruits which you shall set apart, five and twenty thousand in breadth, and in length, as every one of the portions from the east side to the side of the sea: and the sanctuary shall be in the midst thereof."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "primitiae quas separastis Domino longitudo viginti quinque milibus et latitudo decem milibus"
      en: "The firstfruits which you shall set apart for the Lord : shall be the length of five and twenty thousand, and the breadth of ten thousand."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "hae autem erunt primitiae sanctuarii sacerdotum ad aquilonem viginti quinque milia et ad mare latitudinis decem milia sed et ad orientem latitudinis decem milia et ad meridiem longitudinis viginti quinque milia et erit sanctuarium Domini in medio eius"
      en: "And these shall be the firstfruits of the sanctuary for the priests: toward the north five and twenty thousand in length, and toward the sea ten thousand in breadth, and toward the east also ten thousand in breadth, and toward the south five and twenty thousand in length: and the sanctuary of the Lord shall be in the midst thereof."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sacerdotibus sanctuarium erit de filiis Sadoc qui custodierunt caerimonias meas et non erraverunt cum errarent filii Israhel sicut erraverunt et Levitae"
      en: "The sanctuary shall be for the priests of the sons of Sadoc, who kept my ceremonies, and went not astray when the children of Israel went astray, as the Levites also went astray."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et erunt eis primitiae de primitiis terrae sanctum sanctorum iuxta terminum Levitarum"
      en: "And for them shall be the firstfruits of the firstfruits of the land holy of holies, by the border of the Levites."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sed et Levitis similiter iuxta fines sacerdotum viginti quinque milia longitudinis et latitudinis decem milia omnis longitudo viginti et quinque milium et latitudo decem milium"
      en: "And the Levites in like manner shall have by the borders of the priests five and twenty thousand in length, and ten thousand in breadth. All the length shall be five and twenty thousand, and the breadth ten thousand."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et non venundabunt ex eo neque mutabunt nec transferentur primitiae terrae quia sanctificatae sunt Domino"
      en: "And they shall not sell thereof, nor exchange, neither shall the firstfruits of the land be alienated, because they are sanctified to the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quinque milia autem quae supersunt in latitudine per viginti quinque milia profana erunt urbis in habitaculum et in suburbana et erit civitas in medio eius"
      en: "But the five thousand that remain in the breadth over against the five and twenty thousand, shall be a profane place for the city for dwelling, and for suburbs: and the city shall be in the midst thereof."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et heae mensurae eius ad plagam septentrionalem quingenti et quattuor milia et ad plagam meridianam quingenti et quattuor milia et ad plagam orientalem quingenti et quattuor milia et ad plagam occidentalem quingenti et quattuor milia"
      en: "And these are the measures thereof: on the north side four thousand and five hundred: and on the south side four thousand and five hundred: and on the east side four thousand and five hundred: and on the west side four thousand and five hundred."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "erunt autem suburbana civitatis ad aquilonem ducenti quinquaginta et in meridie ducenti quinquaginta et ad orientem ducenti quinquaginta et ad mare ducenti quinquaginta"
      en: "And the suburbs of the city shall be to the north two hundred and fifty, and to the south two hundred and fifty, and to the east two hundred and fifty, and to the sea two hundred and fifty."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quod autem reliquum fuerit in longitudine secundum primitias sanctuarii decem milia in orientem et decem milia ad occidentem erunt sicut primitiae sanctuarii et erunt fruges eius in panes his qui serviunt civitati"
      en: "And the residue in length by the firstfruits of the sanctuary, ten thousand toward the east, and ten thousand toward the west, shall be as the firstfruits of the sanctuary: and the fruits thereof shall be for bread to them that serve the city."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "servientes autem civitati operabuntur ex omnibus tribubus Israhel"
      en: "And they that serve the city, shall serve it out of all the tribes of Israel."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "omnes primitiae viginti quinque milium per viginti quinque milia in quadrum separabuntur in primitias sanctuarii et possessionem civitatis"
      en: "All the firstfruits, of five and twenty thousand, by five and twenty thousand foursquare, shall be set apart for the firstfruits of the sanctuary, and for the possession of the city."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quod autem reliquum fuerit principis erit ex omni parte primitiarum sanctuarii et possessionis civitatis e regione viginti quinque milium primitiarum usque ad terminum orientalem sed et ad mare e regione viginti quinque milium usque ad terminum maris similiter in partibus principis erit et erunt primitiae sanctuarii et sanctuarium templi in medio eius"
      en: "And the residue shall be for the prince on every side of the firstfruits of the sanctuary, and of the possession of the city over against the five and twenty thousand of the firstfruits unto the east border: toward the sea also over against the five and twenty thousand, unto the border of the sea, shall likewise be the portion of the prince: and the firstfruits of the sanctuary, and the sanctuary of the temple shall be in the midst thereof."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "de possessione autem Levitarum et de possessione civitatis in medio partium principis erit inter terminum Iuda et inter terminum Beniamin et ad principem pertinebit"
      en: "And from the possession of the Levites, and from the possession of the city which ale in the midst of the prince's portions: what shall be to the border of Juda, and to the border of Benjamin, shall also belong to the prince."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et reliquis tribubus a plaga orientali usque ad plagam occidentalem Beniamin una"
      en: "And for the rest of the tribes: from the east side to the west side, one portion for Benjamin."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et contra terminum Beniamin a plaga orientali usque ad plagam occidentalem Symeon una"
      en: "And over against the border of Benjamin, from the east side to the west side, one portion for Simeon."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et super terminum Symeonis a plaga orientali usque ad plagam occidentis Isachar una"
      en: "And by the border of Simeon, from the east side to the west side, one portion for Issachar."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et super terminum Isachar a plaga orientali usque ad plagam occidentalem Zabulon una"
      en: "And by the border of Issachar, from the east side to the west side, one portion for Zabulon."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et super terminum Zabulon a plaga orientali usque ad plagam maris Gad una"
      en: "And by the border of Zabulon, from the east side to the side of the sea, one portion for Gad."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et super terminum Gad ad plagam austri in meridiem et erit finis de Thamar usque ad aquas Contradictionis Cades hereditas contra mare magnum"
      en: "And by the border of Gad, the south side southward: and the border shah be from Thamar, even to the waters of contradiction of Cades, the inheritance over against the great sea."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "haec est terra quam mittetis in sortem tribubus Israhel et hae partitiones earum ait Dominus Deus"
      en: "This is the land which you shall divide by lot to the tribes of Israel: and these are the portions of them, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et hii egressus civitatis a plaga septentrionali quingentos et quattuor milia mensurabis"
      en: "And these are the goings out of the city: on the north side thou shalt measure four thousand and five hundred."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et portae civitatis in nominibus tribuum Israhel portae tres a septentrione porta Ruben una porta Iudae una porta Levi una"
      en: "And the gates of the city according to the names of the tribes of Israel, three gates on the north side, the gate of Ruben one, the gate of Juda one, the gate of Levi one."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et ad plagam orientalem quingentos et quattuor milia et portae tres porta Ioseph una porta Beniamin una porta Dan una"
      en: "And at the east side, four thousand and five hundred: and three gates, the gate of Joseph one, the gate of Benjamin one, the gate of Dan one."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et ad plagam meridianam quingentos et quattuor milia metieris portam Symeonis unam portam Isachar unam portam Zabulon unam"
      en: "And at the south side, thou shalt measure four thousand and five hundred: and three gates, the gate of Simeon one, the gate of Issachar one, the gate of Zabulon one."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et ad plagam occidentalem quingenti et quattuor milia portae eorum tres porta Gad una porta Aser una porta Nepthalim una"
      en: "And at the west side, four thousand and five hundred, and their three gates, the gate of Gad one, the gate of Aser one, the gate of Nephthali one."
    status: { la: verified, en: verified }
