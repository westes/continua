# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: luc
chapter: 5
verses:
  - n: 1
    text:
      la: "factum est autem cum turbae inruerent in eum ut audirent verbum Dei et ipse stabat secus stagnum Gennesareth"
      en: "And it came to pass, that when the multitudes pressed upon him to hear the word of God, he stood by the lake of Genesareth,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et vidit duas naves stantes secus stagnum piscatores autem descenderant et lavabant retia"
      en: "And saw two ships standing by the lake: but the fishermen were gone out of them, and were washing their nets."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ascendens autem in unam navem quae erat Simonis rogavit eum a terra reducere pusillum et sedens docebat de navicula turbas"
      en: "And going into one of the ships that was Simon's, he desired him to draw back a little from the land. And sitting he taught the multitudes out of the ship."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ut cessavit autem loqui dixit ad Simonem duc in altum et laxate retia vestra in capturam"
      en: "Now when he had ceased to speak, he said to Simon: Launch out into the deep, and let down your nets for a draught."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et respondens Simon dixit illi praeceptor per totam noctem laborantes nihil cepimus in verbo autem tuo laxabo rete"
      en: "And Simon answering said to him: Master, we have labored all the night, and have taken nothing: but at thy word I will let down the net."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et cum hoc fecissent concluserunt piscium multitudinem copiosam rumpebatur autem rete eorum"
      en: "And when they had done this, they enclosed a very great multitude of fishes, and their net broke."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et annuerunt sociis qui erant in alia navi ut venirent et adiuvarent eos et venerunt et impleverunt ambas naviculas ita ut mergerentur"
      en: "And they beckoned to their partners that were in the other ship, that they should come and help them. And they came, and filled both the ships, so that they were almost sinking."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quod cum videret Simon Petrus procidit ad genua Iesu dicens exi a me quia homo peccator sum Domine"
      en: "Which when Simon Peter saw, he fell down at Jesus' knees, saying: Depart from me, for I am a sinful man, O Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "stupor enim circumdederat eum et omnes qui cum illo erant in captura piscium quam ceperant"
      en: "For he was wholly astonished, and all that were with him, at the draught of the fishes which they had taken."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "similiter autem Iacobum et Iohannem filios Zebedaei qui erant socii Simonis et ait ad Simonem Iesus noli timere ex hoc iam homines eris capiens"
      en: "And so were also James and John the sons of Zebedee, who were Simon's partners. And Jesus saith to Simon: Fear not: from henceforth thou shalt catch men."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et subductis ad terram navibus relictis omnibus secuti sunt illum"
      en: "And having brought their ships to land, leaving all things, they followed him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et factum est cum esset in una civitatum et ecce vir plenus lepra et videns Iesum et procidens in faciem rogavit eum dicens Domine si vis potes me mundare"
      en: "And it came to pass, when he was ina certain city, behold a man full of leprosy, who seeing Jesus, and falling on his face, besought him, saying: Lord, if thou wilt, thou canst make me clean."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et extendens manum tetigit illum dicens volo mundare et confestim lepra discessit ab illo"
      en: "And stretching forth his hand, he touched him, saying: I will. Be thou cleansed. And immediately the leprosy departed from him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et ipse praecepit illi ut nemini diceret sed vade ostende te sacerdoti et offer pro emundatione tua sicut praecepit Moses in testimonium illis"
      en: "And he charged him that he should tell no man, but, Go, shew thyself to the priest, and offer for thy cleansing according as Moses commanded, for a testimony to them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "perambulabat autem magis sermo de illo et conveniebant turbae multae ut audirent et curarentur ab infirmitatibus suis"
      en: "But the fame of him went abroad the more, and great multitudes came together to hear, and to be healed by him of their infirmities."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ipse autem secedebat in deserto et orabat"
      en: "And he retired into the desert, and prayed."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et factum est in una dierum et ipse sedebat docens et erant Pharisaei sedentes et legis doctores qui venerant ex omni castello Galilaeae et Iudaeae et Hierusalem et virtus erat Domini ad sanandum eos"
      en: "And it came to pass on a certain day, as he sat teaching, that there were also Pharisees and doctors of the law sitting by, that were come out of every town of Galilee, and Judea and Jerusalem: and the power of the Lord was to heal them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ecce viri portantes in lecto hominem qui erat paralyticus et quaerebant eum inferre et ponere ante eum"
      en: "And behold, men brought in a bed a man, who had the palsy: and they sought means to bring him in, and to lay him before him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et non invenientes qua parte illum inferrent prae turba ascenderunt supra tectum per tegulas submiserunt illum cum lecto in medium ante Iesum"
      en: "And when they could not find by what way they might bring him in, because of the multitude, they went up upon the roof, and let him down through the tiles with his bed into the midst before Jesus."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quorum fidem ut vidit dixit homo remittuntur tibi peccata tua"
      en: "Whose faith when he saw, he said: Man, thy sins are forgiven thee."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et coeperunt cogitare scribae et Pharisaei dicentes quis est hic qui loquitur blasphemias quis potest dimittere peccata nisi solus Deus"
      en: "And the scribes and Pharisees began to think, saying: Who is this who speaketh blasphemies? Who can forgive sins, but God alone?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ut cognovit autem Iesus cogitationes eorum respondens dixit ad illos quid cogitatis in cordibus vestris"
      en: "And when Jesus knew their thoughts, answering, he said to them: What is it you think in your hearts?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quid est facilius dicere dimittuntur tibi peccata an dicere surge et ambula"
      en: "Which is easier to say, Thy sins are forgiven thee; or to say, Arise and walk?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ut autem sciatis quia Filius hominis potestatem habet in terra dimittere peccata ait paralytico tibi dico surge tolle lectum tuum et vade in domum tuam"
      en: "But that you may know that the Son of man hath power on earth to forgive sins, (he saith to the sick of the palsy,) I say to thee, Arise, take up thy bed, and go into thy house."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et confestim surgens coram illis tulit in quo iacebat et abiit in domum suam magnificans Deum"
      en: "And immediately rising up before them, he took up the bed on which he lay; and he went away to his own house, glorifying God."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et stupor adprehendit omnes et magnificabant Deum et repleti sunt timore dicentes quia vidimus mirabilia hodie"
      en: "And all were astonished; and they glorified God. And they were filled with fear, saying: We have seen wonderful things to day."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et post haec exiit et vidit publicanum nomine Levi sedentem ad teloneum et ait illi sequere me"
      en: "And after these things he went forth, and saw a publican named Levi, sitting at the receipt of custom, and he said to him: Follow me."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et relictis omnibus surgens secutus est eum"
      en: "And leaving all things, he rose up and followed him."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et fecit ei convivium magnum Levi in domo sua et erat turba multa publicanorum et aliorum qui cum illis erant discumbentes"
      en: "And Levi made him a great feast in his own house; and there was a great company of publicans, and of others, that were at table with them."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et murmurabant Pharisaei et scribae eorum dicentes ad discipulos eius quare cum publicanis et peccatoribus manducatis et bibitis"
      en: "But the Pharisees and scribes murmured, saying to his disciples: Why do you eat and drink with publicans and sinners?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et respondens Iesus dixit ad illos non egent qui sani sunt medico sed qui male habent"
      en: "And Jesus answering, said to them: They that are whole, need not the physician: but they that are sick."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "non veni vocare iustos sed peccatores in paenitentiam"
      en: "I came not to call the just, but sinners to penance."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "at illi dixerunt ad eum quare discipuli Iohannis ieiunant frequenter et obsecrationes faciunt similiter et Pharisaeorum tui autem edunt et bibunt"
      en: "And they said to him: Why do the disciples of John fast often, and make prayers, and the disciples of the Pharisees in like manner; but thine eat and drink?"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "quibus ipse ait numquid potestis filios sponsi dum cum illis est sponsus facere ieiunare"
      en: "To whom he said: Can you make the children of the bridegroom fast, whilst the bridegroom is with them?"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "venient autem dies et cum ablatus fuerit ab illis sponsus tunc ieiunabunt in illis diebus"
      en: "But the days will come, when the bridegroom shall be taken away from them, then shall they fast in those days."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "dicebat autem et similitudinem ad illos quia nemo commissuram a vestimento novo inmittit in vestimentum vetus alioquin et novum rumpit et veteri non convenit commissura a novo"
      en: "And he spoke also a similitude to them: That no man putteth a piece from a new garment upon an old garment; otherwise he both rendeth the new, and the piece taken from the new agreeth not with the old."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et nemo mittit vinum novum in utres veteres alioquin rumpet vinum novum utres et ipsum effundetur et utres peribunt"
      en: "And no man putteth new wine into old bottle: otherwise the new wine will break the bottles, and it will be spilled, and the bottles will be lost."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "sed vinum novum in utres novos mittendum est et utraque conservantur"
      en: "But new wine must be put into new bottles; and both are preserved."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et nemo bibens vetus statim vult novum dicit enim vetus melius est"
      en: "And no man drinking old, hath presently a mind to new: for he saith, The old is better."
    status: { la: verified, en: verified }
