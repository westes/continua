# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 8
verses:
  - n: 1
    text:
      la: "respondens autem Baldad Suites dixit"
      en: "The Baldad the Suhite answered, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "usquequo loqueris talia et spiritus multiplex sermones oris tui"
      en: "How long wilt thou speak these things, and how long shall the words of thy mouth be like a strong wind?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "numquid Deus subplantat iudicium et Omnipotens subvertit quod iustum est"
      en: "Doth God pervert judgment, or doth the Almighty overthrow that which is just?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "etiam si filii tui peccaverunt ei et dimisit eos in manu iniquitatis suae"
      en: "Although thy children have sinned against him, and he hath left them in the hand of their iniquity:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "tu tamen si diluculo consurrexeris ad Deum et Omnipotentem fueris deprecatus"
      en: "Yet if thou wilt arise early to God, and wilt beseech the Almighty:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "si mundus et rectus incesseris statim evigilabit ad te et pacatum reddet habitaculum iustitiae tuae"
      en: "If thou wilt walk clean and upright, he will presently awake onto thee, and will make the dwelling of thy justice peaceable:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in tantum ut priora tua fuerint parva et novissima tua multiplicentur nimis"
      en: "Insomuch, that if thy former things were small, thy latter things would be multiplied exceedingly."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "interroga enim generationem pristinam et diligenter investiga patrum memoriam"
      en: "For inquire of the former generation, and search diligently into the memory of the fathers:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "hesterni quippe sumus et ignoramus quoniam sicut umbra dies nostri sunt super terram"
      en: "(For we are but of yesterday, and are ignorant that our days upon earth are but a shadow:)"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et ipsi docebunt te loquentur tibi et de corde suo proferent eloquia"
      en: "And they shall teach thee: they shall speak to thee, and utter words out of their hearts."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "numquid vivere potest scirpus absque humore aut crescet carectum sine aqua"
      en: "Can the rush be green without moisture? or a sedge-bush grow without water?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cum adhuc sit in flore nec carpatur manu ante omnes herbas arescit"
      en: "When it is yet in flower, and is not plucked up with the hand, it withereth before all herbs."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sic viae omnium qui obliviscuntur Deum et spes hypocritae peribit"
      en: "Even so are the ways of all that forget God, and the hope of the hypocrite shall perish:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "non ei placebit vecordia sua et sicut tela aranearum fiducia eius"
      en: "His folly shall not please him, and his trust shall be like the spider's web."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "innitetur super domum suam et non stabit fulciet eam et non consurget"
      en: "He shall lean upon his house, and it shall not stand: he shall prop it up, and it shall not rise:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "humectus videtur antequam veniat sol et in horto suo germen eius egreditur"
      en: "He seemeth to have moisture before the sun cometh, and at his rising his blossom shall shoot forth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "super acervum petrarum radices eius densabuntur et inter lapides commorabitur"
      en: "His roots shall be thick upon a heap of stones, and among the stones he shall abide."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "si absorbuerit eum de loco suo negabit eum et dicet non novi te"
      en: "If one swallow him up out of his place, he shall deny him, and shall say: I know thee not."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "haec est enim laetitia viae eius ut rursum de terra alii germinentur"
      en: "For this is the joy of his way, that others may spring again out of the earth."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Deus non proiciet simplicem nec porriget manum malignis"
      en: "God will not cast away the simple, nor reach out his hand to the evildoer:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "donec impleatur risu os tuum et labia tua iubilo"
      en: "Until thy mouth be filled with laughter, and thy lips with rejoicing."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "qui oderunt te induentur confusione et tabernaculum impiorum non subsistet"
      en: "They that hate thee, shall be clothed with confusion: and the dwelling of the wicked shall not stand."
    status: { la: verified, en: verified }
