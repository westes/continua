# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: joan
chapter: 13
verses:
  - n: 1
    text:
      la: "Ante diem festum Paschae, sciens Jesus quia venit hora ejus ut transeat ex hoc mundo ad Patrem: cum dilexisset suos, qui erant in mundo, in finem dilexit eos."
      en: "Before the festival day of the pasch, Jesus knowing that his hour was come, that he should pass out of this world to the Father: having loved his own who were in the world, he loved them unto the end."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et coena facta, cum diabolus jam misisset in cor ut traderet eum Judas Simonis Iscariotae:"
      en: "And when supper was done, (the devil having now put into the heart of Judas Iscariot, the son of Simon, to betray him,)"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sciens quia omnia dedit ei Pater in manus, et quia a Deo exivit, et ad Deum vadit:"
      en: "Knowing that the Father had given him all things into his hands, and that he came from God, and goeth to God;"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "surgit a coena, et ponit vestimenta sua, et cum accepisset linteum, praecinxit se."
      en: "He riseth from supper, and layeth aside his garments, and having taken a towel, girded himself."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Deinde mittit aquam in pelvim, et coepit lavare pedes discipulorum, et extergere linteo, quo erat praecinctus."
      en: "After that, he putteth water into a basin, and began to wash the feet of the disciples, and to wipe them with the towel wherewith he was girded."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Venit ergo ad Simonem Petrum. Et dicit ei Petrus: Domine, tu mihi lavas pedes?"
      en: "He cometh therefore to Simon Peter. And Peter saith to him: Lord, dost thou wash my feet?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Respondit Jesus, et dixit ei: Quod ego facio, tu nescis modo: scies autem postea."
      en: "Jesus answered, and said to him: What I do thou knowest not now; but thou shalt know hereafter."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dicit ei Petrus: Non lavabis mihi pedes in aeternum. Respondit ei Jesus: Si non lavero te, non habebis partem mecum."
      en: "Peter saith to him: Thou shalt never wash my feet. Jesus answered him: If I wash thee not, thou shalt have no part with me."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dicit ei Simon Petrus: Domine, non tantum pedes meos, sed et manus, et caput."
      en: "Simon Peter saith to him: Lord, not only my feet, but also my hands and my head."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dicit ei Jesus: Qui lotus est, non indiget nisi ut pedes lavet, sed est mundus totus. Et vos mundi estis, sed non omnes."
      en: "Jesus saith to him: He that is washed, needeth not but to wash his feet, but is clean wholly. And you are clean, but not all."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sciebat enim quisnam esset qui traderet eum; propterea dixit: Non estis mundi omnes."
      en: "For he knew who he was that would betray him; therefore he said: You are not all clean."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Postquam ergo lavit pedes eorum, et accepit vestimenta sua: cum recubuisset iterum, dixit eis: Scitis quid fecerim vobis?"
      en: "Then after he had washed their feet, and taken his garments, being set down again, he said to them: Know you what I have done to you?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Vos vocatis me Magister et Domine, et bene dicitis: sum etenim."
      en: "You call me Master, and Lord; and you say well, for so I am."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Si ergo ego lavi pedes vestros, Dominus et Magister, et vos debetis alter alterutrum lavare pedes."
      en: "If then I being your Lord and Master, have washed your feet; you also ought to wash one another's feet."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Exemplum enim dedi vobis, ut quemadmodum ego feci vobis, ita et vos faciatis."
      en: "For I have given you an example, that as I have done to you, so you do also."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Amen, amen dico vobis: non est servus major domino suo: neque apostolus major est eo qui misit illum."
      en: "Amen, amen I say to you: The servant is not greater than his lord; neither is the apostle greater than he that sent him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Si haec scitis, beati eritis si feceritis ea."
      en: "If you know these things, you shall be blessed if you do them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Non de omnibus vobis dico: ego scio quos elegerim; sed ut adimpleatur Scriptura: Qui manducat mecum panem, levabit contra me calcaneum suum."
      en: "I speak not of you all: I know whom I have chosen. But that the scripture may be fulfilled: He that eateth bread with me, shall lift up his heel against me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Amodo dico vobis, priusquam fiat: ut cum factum fuerit, credatis, quia ego sum."
      en: "At present I tell you, before it come to pass: that when it shall come to pass, you may believe that I am he."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Amen, amen dico vobis: qui accipit si quem misero, me accipit; qui autem me accipit, accipit eum qui me misit."
      en: "Amen, amen I say to you, he that receiveth whomsoever I send, receiveth me; and he that receiveth me, receiveth him that sent me."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Cum haec dixisset Jesus, turbatus est spiritu: et protestatus est, et dixit: Amen, amen dico vobis, quia unus ex vobis tradet me."
      en: "When Jesus had said these things, he was troubled in spirit; and he testified, and said: Amen, amen I say to you, one of you shall betray me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Aspiciebant ergo ad invicem discipuli, haesitantes de quo diceret."
      en: "The disciples therefore looked one upon another, doubting of whom he spoke."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Erat ergo recumbens unus ex discipulis ejus in sinu Jesu, quem diligebat Jesus."
      en: "Now there was leaning on Jesus' bosom one of his disciples, whom Jesus loved."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Innuit ergo huic Simon Petrus, et dixit ei: Quis est, de quo dicit?"
      en: "Simon Peter therefore beckoned to him, and said to him: Who is it of whom he speaketh?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Itaque cum recubuisset ille supra pectus Jesu, dicit ei: Domine, quis est?"
      en: "He therefore, leaning on the breast of Jesus, saith to him: Lord, who is it?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Respondit Jesus: Ille est cui ego intinctum panem porrexero. Et cum intinxisset panem, dedit Judae Simonis Iscariotae."
      en: "Jesus answered: He it is to whom I shall reach bread dipped. And when he had dipped the bread, he gave it to Judas Iscariot, the son of Simon."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et post buccellam, introivit in eum Satanas. Et dixit ei Jesus: Quod facis, fac citius."
      en: "And after the morsel, Satan entered into him. And Jesus said to him: That which thou dost, do quickly."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Hoc autem nemo scivit discumbentium ad quid dixerit ei."
      en: "Now no man at the table knew to what purpose he said this unto him."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Quidam enim putabant, quia loculos habebat Judas, quod dixisset ei Jesus: Eme ea quae opus sunt nobis ad diem festum: aut egenis ut aliquid daret."
      en: "For some thought, because Judas had the purse, that Jesus had said to him: Buy those things which we have need of for the festival day: or that he should give something to the poor."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Cum ergo accepisset ille buccellam, exivit continuo. Erat autem nox."
      en: "He therefore having received the morsel, went out immediately. And it was night."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Cum ergo exisset, dixit Jesus: Nunc clarificatus est Filius hominis, et Deus clarificatus est in eo."
      en: "When he therefore was gone out, Jesus said: Now is the Son of man glorified, and God is glorified in him."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Si Deus clarificatus est in eo, et Deus clarificabit eum in semetipso: et continuo clarificabit eum."
      en: "If God be glorified in him, God also will glorify him in himself; and immediately will he glorify him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Filioli, adhuc modicum vobiscum sum. Quaeretis me; et sicut dixi Judaeis, quo ego vado, vos non potestis venire: et vobis dico modo."
      en: "Little children, yet a little while I am with you. You shall seek me; and as I said to the Jews: Whither I go you cannot come; so I say to you now."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Mandatum novum do vobis: ut diligatis invicem: sicut dilexi vos, ut et vos diligatis invicem."
      en: "A new commandment I give unto you: That you love one another, as I have loved you, that you also love one another."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "In hoc cognoscent omnes quia discipuli mei estis, si dilectionem habueritis ad invicem."
      en: "By this shall all men know that you are my disciples, if you have love one for another."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Dicit ei Simon Petrus: Domine, quo vadis? Respondit Jesus: Quo ego vado non potes me modo sequi: sequeris autem postea."
      en: "Simon Peter saith to him: Lord, whither goest thou? Jesus answered: Whither I go, thou canst not follow me now; but thou shalt follow hereafter."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Dicit ei Petrus: Quare non possum te sequi modo? animam meam pro te ponam."
      en: "Peter saith to him: Why cannot I follow thee now? I will lay down my life for thee."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Respondit ei Jesus: Animam tuam pro me pones? amen, amen dico tibi: non cantabit gallus, donec ter me neges."
      en: "Jesus answered him: Wilt thou lay down thy life for me? Amen, amen I say to thee, the cock shall not crow, till thou deny me thrice."
    status: { la: verified, en: verified }
