# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: marc
chapter: 10
verses:
  - n: 1
    text:
      la: "Et inde exsurgens venit in fines Judaeae ultra Jordanem: et conveniunt iterum turbae ad eum: et sicut consueverat, iterum docebat illos."
      en: "And rising up from thence, he cometh into the coasts of Judea beyond the Jordan: and the multitudes flock to him again. And as he was accustomed, he taught them again."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et accedentes pharisaei interrogabant eum: Si licet vero uxorem dimittere: tentantes eum."
      en: "And the Pharisees coming to him asked him: Is it lawful for a man to put away his wife? tempting him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "At ille respondens, dixit eis: Quid vobis praecepit Moyses?"
      en: "But he answering, saith to them: What did Moses command you?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Qui dixerunt: Moyses permisit libellum repudii scribere, et dimittere."
      en: "Who said: Moses permitted to write a bill of divorce, and to put her away."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quibus respondens Jesus, ait: Ad duritiam cordis vestri scripsit vobis praeceptum istud:"
      en: "To whom Jesus answering, said: Because of the hardness of your heart he wrote you that precept."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ab initio autem creaturae masculum et feminam fecit eos Deus."
      en: "But from the beginning of the creation, God made them male and female."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Propter hoc relinquet homo patrem suum et matrem, et adhaerebit ad uxorem suam:"
      en: "For this cause a man shall leave his father and mother; and shall cleave to his wife."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et erunt duo in carne una. Itaque jam non sunt duo, sed una caro."
      en: "And they two shall be in one flesh. Therefore now they are not two, but one flesh."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quod ergo Deus conjunxit, homo non separet."
      en: "What therefore God hath joined together, let not man put asunder."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et in domo iterum discipuli ejus de eodem interrogaverunt eum."
      en: "And in the house again his disciples asked him concerning the same thing."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et ait illis: Quicumque dimiserit uxorem suam, et aliam duxerit, adulterium committit super eam."
      en: "And he saith to them: Whosoever shall put away his wife and marry another, committeth adultery against her."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et si uxor dimiserit virum suum, et alii nupserit, moechatur."
      en: "And if the wife shall put away her husband, and be married to another, she committeth adultery."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et offerebant illi parvulos ut tangeret illos. Discipuli autem comminabantur offerentibus."
      en: "And they brought to him young children, that he might touch them. And the disciples rebuked them that brought them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quos cum videret Jesus, indigne tulit, et ait illis: Sinite parvulos venire ad me, et ne prohibueritis eos: talium enim est regnum Dei."
      en: "Whom when Jesus saw, he was much displeased, and saith to them: Suffer the little children to come unto me, and forbid them not; for of such is the kingdom of God."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Amen dico vobis: Quisquis non receperit regnum Dei velut parvulus, non intrabit in illud."
      en: "Amen I say to you, whosoever shall not receive the kingdom of God as a little child, shall not enter into it."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et complexans eos, et imponens manus super illos, benedicebat eos."
      en: "And embracing them, and laying his hands upon them, he blessed them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et cum egressus esset in viam, procurrens quidam genu flexo ante eum, rogabat eum: Magister bone, quid faciam ut vitam aeternam percipiam?"
      en: "And when he was gone forth into the way, a certain man running up and kneeling before him, asked him, Good Master, what shall I do that I may receive life everlasting?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Jesus autem dixit ei: Quid me dicis bonum? nemo bonus, nisi unus Deus."
      en: "And Jesus said to him, Why callest thou me good? None is good but one, that is God."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Praecepta nosti: ne adulteres, ne occidas, ne fureris, ne falsum testimonium dixeris, ne fraudum feceris, honora patrem tuum et matrem."
      en: "Thou knowest the commandments: Do not commit adultery, do not kill, do not steal, bear not false witness, do no fraud, honour thy father and mother."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "At ille respondens, ait illi: Magister, haec omnia observavi a juventute mea."
      en: "But he answering, said to him: Master, all these things I have observed from my youth."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Jesus autem intuitus eum, dilexit eum, et dixit ei: Unum tibi deest: vade, quaecumque habes vende, et da pauperibus, et habebis thesaurum in caelo: et veni, sequere me."
      en: "And Jesus looking on him, loved him, and said to him: One thing is wanting unto thee: go, sell whatsoever thou hast, and give to the poor, and thou shalt have treasure in heaven; and come, follow me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Qui contristatus in verbo, abiit moerens: erat enim habens multas possessiones."
      en: "Who being struck sad at that saying, went away sorrowful: for he had great possessions."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et circumspiciens Jesus, ait discipulis suis: Quam difficile qui pecunias habent, in regnum Dei introibunt!"
      en: "And Jesus looking round about, saith to his disciples: How hardly shall they that have riches, enter into the kingdom of God!"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Discipuli autem obstupescebant in verbis ejus. At Jesus rursus respondens ait illis: Filioli, quam difficile est, confidentes in pecuniis, in regnum Dei introire!"
      en: "And the disciples were astonished at his words. But Jesus again answering, saith to them: Children, how hard is it for them that trust in riches, to enter into the kingdom of God?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Facilius est camelum per foramen acus transire, quam divitem intrare in regnum Dei."
      en: "It is easier for a camel to pass through the eye of a needle, than for a rich man to enter into the kingdom of God."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Qui magis admirabantur, dicentes ad semetipsos: Et quis potest salvus fieri?"
      en: "Who wondered the more, saying among themselves: Who then can be saved?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et intuens illos Jesus, ait: Apud homines impossibile est, sed non apud Deum: omnia enim possibilia sunt apud Deum."
      en: "And Jesus looking on them, saith: With men it is impossible; but not with God: for all things are possible with God."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et coepit ei Petrus dicere: Ecce nos dimisimus omnia, et secuti sumus te."
      en: "And Peter began to say unto him: Behold, we have left all things, and have followed thee."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Respondens Jesus, ait: Amen dico vobis: Nemo est qui reliquerit domum, aut fratres, aut sorores, aut patrem, aut matrem, aut filios, aut agros propter me et propter Evangelium,"
      en: "Jesus answering, said: Amen I say to you, there is no man who hath left house or brethren, or sisters, or father, or mother, or children, or lands, for my sake and for the gospel,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "qui non accipiat centies tantum, nunc in tempore hoc: domos, et fratres, et sorores, et matres, et filios, et agros, cum persecutionibus, et in saeculo futuro vitam aeternam."
      en: "Who shall not receive an hundred times as much, now in this time; houses, and brethren, and sisters, and mothers, and children, and lands, with persecutions: and in the world to come life everlasting."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Multi autem erunt primi novissimi, et novissimi primi."
      en: "But many that are first, shall be last: and the last, first."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Erant autem in via ascendentes Jerosolymam: et praecedebat illos Jesus, et stupebant: et sequentes timebant. Et assumens iterum duodecim, coepit illis dicere quae essent ei eventura."
      en: "And they were in the way going up to Jerusalem: and Jesus went before them, and they were astonished; and following were afraid. And taking again the twelve, he began to tell them the things that should befall him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Quia ecce ascendimus Jerosolymam, et Filius hominis tradetur principibus sacerdotum, et scribis, et senioribus, et damnabunt eum morte, et tradent eum gentibus:"
      en: "Saying: Behold we go up to Jerusalem, and the Son of man shall be betrayed to the chief priests, and to the scribes and ancients, and they shall condemn him to death, and shall deliver him to the Gentiles."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et illudent ei, et conspuent eum, et flagellabunt eum, et interficient eum: et tertia die resurget."
      en: "And they shall mock him, and spit on him, and scourge him, and kill him: and the third day he shall rise again."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et accedunt ad eum Jacobus et Joannes filii Zebedaei, dicentes: Magister, volumus ut quodcumque petierimus, facias nobis."
      en: "And James and John the sons of Zebedee, come to him, saying: Master, we desire that whatsoever we shall ask, thou wouldst do it for us:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "At ille dixit eis: Quid vultis ut faciam vobis?"
      en: "But he said to them: What would you that I should do for you?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et dixerunt: Da nobis ut unus ad dexteram tuam, et alius ad sinistram tuam sedeamus in gloria tua."
      en: "And they said: Grant to us, that we may sit, one on thy right hand, and the other on thy left hand, in thy glory."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Jesus autem ait eis: Nescitis quid petatis: potestis bibere calicem, quem ego bibo, aut baptismo, quo ego baptizor, baptizari?"
      en: "And Jesus said to them: You know not what you ask. Can you drink of the chalice that I drink of: or be baptized with the baptism wherewith I am baptized?"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "At illi dixerunt ei: Possumus. Jesus autem ait eis: Calicem quidem, quem ego bibo, bibetis; et baptismo, quo ego baptizor, baptizabimini:"
      en: "But they said to him: We can. And Jesus saith to them: You shall indeed drink of the chalice that I drink of: and with the baptism wherewith I am baptized, you shall be baptized."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "sedere autem ad dexteram meam, vel ad sinistram, non est meum dare vobis, sed quibus paratum est."
      en: "But to sit on my right hand, or on my left, is not mine to give to you, but to them for whom it is prepared."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et audientes decem, coeperunt indignari de Jacobo et Joanne."
      en: "And the ten hearing it, began to be much displeased at James and John."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Jesus autem vocans eos, ait illis: Scitis quia hi, qui videntur principari gentibus, dominantur eis: et principes eorum potestatem habent ipsorum."
      en: "But Jesus calling them, saith to them: You know that they who seem to rule over the Gentiles, lord it over them: and their princes have power over them."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Non ita est autem in vobis, sed quicumque voluerit fieri major, erit vester minister:"
      en: "But it is not so among you: but whosoever will be greater, shall be your minister."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et quicumque voluerit in vobis primus esse, erit omnium servus."
      en: "And whosoever will be first among you, shall be the servant of all."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Nam et Filius hominis non venit ut ministraretur ei, sed ut ministraret, et daret animam suam redemptionem pro multis."
      en: "For the Son of man also is not come to be ministered unto, but to minister, and to give his life a redemption for many."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Et veniunt Jericho: et proficiscente eo de Jericho, et discipulis ejus, et plurima multitudine, filius Timae Bartimaeus caecus, sedebat juxta viam mendicans."
      en: "And they came to Jericho: and as he went out of Jericho, with his disciples, and a very great multitude, Bartimeus the blind man, the son of Timeus, sat by the way side begging."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Qui cum audisset quia Jesus Nazarenus est, coepit clamare, et dicere: Jesu fili David, miserere mei."
      en: "Who when he had heard, that it was Jesus of Nazareth, began to cry out, and to say: Jesus son of David, have mercy on me."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Et comminabantur ei multi ut taceret. At ille multo magis clamabat: Fili David, miserere mei."
      en: "And many rebuked him, that he might hold his peace; but he cried a great deal the more: Son of David, have mercy on me."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Et stans Jesus praecepit illum vocari. Et vocant caecum, dicentes ei: Animaequior esto: surge, vocat te."
      en: "And Jesus, standing still, commanded him to be called. And they call the blind man, saying to him: Be of better comfort: arise, he calleth thee."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Qui projecto vestimento suo exiliens, venit ad eum."
      en: "Who casting off his garment leaped up, and came to him."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Et respondens Jesus dixit illi: Quid tibi vis faciam? Caecus autem dixit ei: Rabboni, ut videam."
      en: "And Jesus answering, said to him: What wilt thou that I should do to thee? And the blind man said to him: Rabboni, that I may see."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Jesus autem ait illi: Vade, fides tua te salvum fecit. Et confestim vidit, et sequebatur eum in via."
      en: "And Jesus saith to him: Go thy way, thy faith hath made thee whole. And immediately he saw, and followed him in the way."
    status: { la: verified, en: verified }
