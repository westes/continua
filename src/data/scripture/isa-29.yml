# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 29
verses:
  - n: 1
    text:
      la: "vae Arihel Arihel civitas quam circumdedit David additus est annus ad annum sollemnitates evolutae sunt"
      en: "Woe to Ariel, to Ariel the city which David took: year is added to year: the solemnities are at an end."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et circumvallabo Arihel et erit tristis et maerens et erit mihi quasi Arihel"
      en: "And I will make a trench about Ariel, and it shall be in sorrow and mourning, and it shall be to me as Ariel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et circumdabo quasi spheram in circuitu tuo et iaciam contra te aggerem et munimenta ponam in obsidionem tuam"
      en: "And I will make a circle round about thee, and will cast up a rampart against thee, and raise up bulwarks to besiege thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "humiliaberis de terra loqueris et de humo audietur eloquium tuum et erit quasi pythonis de terra vox tua et de humo eloquium tuum mussitabit"
      en: "Thou shalt be brought down, thou shalt speak out of the earth, and thy speech shall be heard out of the ground: and thy voice shall be from the earth like that of the python, and out of the ground thy speech shall mutter."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et erit sicut pulvis tenuis multitudo ventilantium te et sicut favilla pertransiens multitudo eorum qui contra te praevaluerunt"
      en: "And the multitude of them that fan thee, shall be like small dust: and as ashes passing away, the multitude of them that have prevailed against thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "eritque repente confestim a Domino exercituum visitabitur in tonitru et commotione terrae et voce magna turbinis et tempestatis et flammae ignis devorantis"
      en: "And it shall be at an instant suddenly. A visitation shall come from the Lord of hosts in thunder, and with earthquake, and with a great noise of whirlwind and tempest, and with the flame of devouring fire."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et erit sicut somnium visionis nocturnae multitudo omnium gentium quae dimicaverunt contra Arihel et omnes qui militaverunt et obsederunt et praevaluerunt adversus eam"
      en: "And the multitude of all nations that have fought against Ariel, shall be as the dream of a vision by night, and all that have fought, and besieged and prevailed against it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et sicuti somniat esuriens et comedit cum autem fuerit expertus vacua est anima eius et sicut somniat sitiens et bibit et postquam fuerit expergefactus lassus adhuc sitit et anima eius vacua est sic erit multitudo omnium gentium quae dimicaverunt contra montem Sion"
      en: "And as he that is hungry dreameth, and eateth, but when he is awake, his soul is empty: and as he that is thirsty dreameth, and drinketh, and after he is awake, is yet faint with thirst, and his soul is empty: so shall be the multitude of all the Gentiles, that have fought against mount Sion."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "obstupescite et admiramini fluctuate et vacillate inebriamini et non a vino movemini et non ebrietate"
      en: "Be astonished, and wander, waver, and stagger: be drunk, and not with wine: stagger, and not with drunkenness."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quoniam miscuit vobis Dominus spiritum soporis claudet oculos vestros prophetas et principes vestros qui vident visiones operiet"
      en: "For the Lord hath mingled for you the spirit of a deep sleep, he will shut up your eyes, he will cover your prophets and princes, that see visions."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et erit vobis visio omnium sicut verba libri signati quem cum dederint scienti litteras dicent lege istum et respondebit non possum signatus est enim"
      en: "And the vision of all shall be unto you as the words of a book that is sealed, which when they shall deliver to one that is learned, they shall say: Read this: and he shall answer: I cannot, for it is sealed."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et dabitur liber nescienti litteras diceturque ei lege et respondebit nescio litteras"
      en: "And the book shall be given to one that knoweth no letters, and it shall be said to him: Read: and he shall answer: I know no letters."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et dixit Dominus eo quod adpropinquat populus iste ore suo et labiis suis glorificat me cor autem eius longe est a me et timuerunt me mandato hominum et doctrinis"
      en: "And the Lord said: Forasmuch as this people draw near me with their mouth, and with their lips glorify me, but their heart is far from me, and they have feared me with the commandment and doctrines of men:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ideo ecce ego addam ut admirationem faciam populo huic miraculo grandi et stupendo peribit enim sapientia a sapientibus eius et intellectus prudentium eius abscondetur"
      en: "Therefore behold I will proceed to cause an admiration in this people, by a great and wonderful miracle: for wisdom shall perish from their wise men, and the understanding of their prudent men shall be hid."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "vae qui profundi estis corde ut a Domino abscondatis consilium quorum sunt in tenebris opera et dicunt quis videt nos et quis novit nos"
      en: "Woe to you that are deep of heart, to hide your counsel from the Lord: and their works are in the dark, and they say: Who seeth us, and who knoweth us?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "perversa est haec vestra cogitatio quasi lutum contra figulum cogitet et dicat opus factori suo non fecisti me et figmentum dicat fictori suo non intellegis"
      en: "This thought of yours is perverse: as if the clay should think against the potter, and the work should say to the maker thereof: Thou madest me not: or the thing framed should say to him that fashioned it: Thou understandest not."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "nonne adhuc in modico et in brevi convertetur Libanus in Chermel et Chermel in saltum reputabitur"
      en: "Is it not yet a very little while, and Libanus shall be turned into charmel, and charmel shall be esteemed as a forest?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et audient in die illa surdi verba libri et de tenebris et caligine oculi caecorum videbunt"
      en: "And in that day the deaf shall hear the words of the book, and out of darkness and obscurity the eyes of the blind shall see."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et addent mites in Domino laetitiam et pauperes homines in Sancto Israhel exultabunt"
      en: "And the meek shall increase their joy in the Lord, and the poor men shall rejoice in the Holy One of Israel."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quoniam defecit qui praevalebat consummatus est inlusor et succisi sunt omnes qui vigilabant super iniquitatem"
      en: "For he that did prevail hath failed, the scorner is consumed, and they are all cut off that watched for iniquity:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui peccare faciebant homines in verbo et arguentem in porta subplantabant et declinaverunt frustra a iusto"
      en: "That made men sin by word, and supplanted him that reproved them in the gate, and declined in vain from the just."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "propter hoc haec dicit Dominus ad domum Iacob qui redemit Abraham non modo confundetur Iacob nec modo vultus eius erubescet"
      en: "Therefore thus saith the Lord to the house of Jacob, he that redeemed Abraham: Jacob shall not now be confounded, neither shall his countenance now be ashamed:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sed cum viderit filios suos opera manuum mearum in medio sui sanctificantes nomen meum et sanctificabunt Sanctum Iacob et Deum Israhel praedicabunt"
      en: "But when he shall see his children, the work of my hands in the midst of him sanctifying my name, and they shall sanctify the Holy One of Jacob, and shall glorify the God of Israel:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et scient errantes spiritu intellectum et mussitatores discent legem"
      en: "And they that erred in spirit, shall know understanding, and they that murmured, shall learn the law."
    status: { la: verified, en: verified }
