# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 23
verses:
  - n: 1
    text:
      la: "Domine, pater et dominator vitae meae, ne derelinquas me in consilio eorum, nec sinas me cadere in illis."
      en: "O Lord, father, and sovereign ruler of my life, leave me not to their counsel: nor suffer me to fall by them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quis superponet in cogitatu meo flagella, et in corde meo doctrinam sapientiae, ut ignorationibus eorum non parcant mihi, et non appareant delicta eorum,"
      en: "Who will set scourges over my thoughts, and the discipline of wisdom over my heart, that they spare me not in their ignorances, and that their sins may not appear:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ne adincrescant ignorantiae meae, et multiplicentur delicta mea, et peccata mea abundent, et incidam in conspectu adversariorum meorum, et gaudeat super me inimicus meus?"
      en: "Lest my ignorance increase, and my offences be multiplied, and my sins abound, and I fall before my adversaries, and my enemy rejoice over me?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Domine, pater et Deus vitae meae, ne derelinquas me in cogitatu illorum."
      en: "O Lord, father, and God of my life, leave me not to their devices."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Extollentiam oculorum meorum ne dederis mihi, et omne desiderium averte a me."
      en: "Give me not haughtiness of my eyes, and turn away from me all coveting."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Aufer a me ventris concupiscentias, et concubitus concupiscentiae ne apprehendant me, et animae irreverenti et infrunitae ne tradas me."
      en: "Take from me the greediness of the belly, and let not the lusts of the flesh take hold of me, and give me not over to a shameless and foolish mind."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Doctrinam oris audite, filii: et qui custodierit illam non periet labiis, nec scandalizabitur in operibus nequissimis."
      en: "Hear, O ye children, the discipline of the mouth: and he that will keep it shall not perish by his lips, nor be brought to fall into most wicked works."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "In vanitate sua apprehenditur peccator: et superbus et maledicus scandalizabitur in illis."
      en: "A sinner is caught in his own vanity, and the proud and the evil speakers shall fall thereby."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Jurationi non assuescat os tuum: multi enim casus in illa."
      en: "Let not thy mouth be accustomed to swearing: for in it there are many falls."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nominatio vero Dei non sit assidua in ore tuo, et nominibus sanctorum non admiscearis, quoniam non erit immunis ab eis."
      en: "And let not the naming of God be usual in thy mouth, and meddle not with the names of saints, for thou shalt not escape free from them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sicut enim servus interrogatus assidue a livore non minuitur, sic omnis jurans et nominans in toto a peccato non purgabitur."
      en: "For as a slave daily put to the question, is never without a blue mark: so every one that sweareth, and nameth, shall not be wholly pure from sin."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Vir multum jurans implebitur iniquitate, et non discedet a domo illius plaga."
      en: "A man that sweareth much, shall be filled with iniquity, and a scourge shall not depart from his house."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et si frustraverit, delictum illius super ipsum erit: et si dissimulaverit, delinquit dupliciter:"
      en: "And if he make it void, his sin shall be upon him: and if he dissemble it, he offendeth double:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et si in vacuum juraverit, non justificabitur: replebitur enim retributione domus illius."
      en: "And if he swear in vain, he shall not be justified: for his house shall be filled with his punishment."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Est et alia loquela contraria morti: non inveniatur in haereditate Jacob."
      en: "There is also another speech opposite to death, let it not be found in the inheritance of Jacob."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Etenim a misericordibus omnia haec auferentur, et in delictis non volutabuntur."
      en: "For from the merciful all these things shall be taken away, and they shall not wallow in sins."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Indisciplinatae loquelae non assuescat os tuum: est enim in illa verbum peccati."
      en: "Let not thy mouth be accustomed to indiscreet speech: for therein is the word of sin."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Memento patris et matris tuae: in medio enim magnatorum consistis:"
      en: "Remember thy father and thy mother, for thou sittest in the midst of great men:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ne forte obliviscatur te Deus in conspectu illorum, et assiduitate tua infatuatus, improperium patiaris, et maluisses non nasci, et diem nativitatis tuae maledicas."
      en: "Lest God forget thee in their sight, and thou, by thy daily custom, be infatuated and suffer reproach: and wish that thou hadst not been born, and curse the day of thy nativity."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Homo assuetus in verbis improperii in omnibus diebus suis non erudietur."
      en: "The man that is accustomed to opprobrious words, will never be corrected all the days of his life."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Duo genera abundant in peccatis, et tertium adducit iram et perditionem."
      en: "Two sorts of men multiply sins, and the third bringeth wrath and destruction."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Anima calida quasi ignis ardens, non extinguetur donec aliquid glutiat:"
      en: "A hot soul is a burning fire, it will never be quenched, till it devour some thing."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et homo nequam in ore carnis suae non desinet donec incendat ignem."
      en: "And a man that is wicked in the mouth of his flesh, will not leave off till he hath kindled a fire."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Homini fornicario omnis panis dulcis: non fatigabitur transgrediens usque ad finem."
      en: "To a man that is a fornicator all bread is sweet, he will not be weary of sinning unto the end."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Omnis homo qui transgreditur lectum suum, contemnens in animam suam, et dicens: Quis me videt?"
      en: "Every man that passeth beyond his own bed, despising his own soul, and saying: Who seeth me?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Tenebrae circumdant me, et parietes cooperiunt me, et nemo circumspicit me: quem vereor? delictorum meorum non memorabitur Altissimus."
      en: "Darkness compasseth me about, and the walls cover me, and no man seeth me: whom do I fear? the most High will not remember my sins."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et non intelligit quoniam omnia videt oculus illius, quoniam expellit a se timorem Dei hujusmodi hominis timor, et oculi hominum timentes illum:"
      en: "And he understandeth not that his eye seeth all things, for such a man's fear driveth from him the fear of God, and the eyes of men fearing him:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et non cognovit quoniam oculi Domini multo plus lucidiores sunt super solem, circumspicientes omnes vias hominum, et profundum abyssi, et hominum corda, intuentes in absconditas partes."
      en: "And he knoweth not that the eyes of the Lord are far brighter than the sun, beholding round about all the ways of men, and the bottom of the deep, and looking into the hearts of men, into the most hidden parts."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Domino enim Deo antequam crearentur omnia sunt agnita: sic et post perfectum respicit omnia."
      en: "For all things were known to the Lord God, before they were created: so also after they were perfected he beholdeth all things."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Hic in plateis civitatis vindicabitur, et quasi pullus equinus fugabitur, et ubi non speravit apprehendetur."
      en: "This man shall be punished in the streets of the city, and he shall be chased as a colt: and where he suspected not, he shall be taken."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et erit dedecus omnibus, eo quod non intellexerit timorem Domini."
      en: "And he shall be in disgrace with all men, because he understood not the fear of the Lord."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Sic et mulier omnis relinquens virum suum, et statuens haereditatem ex alieno matrimonio:"
      en: "So every woman also that leaveth her husband, and bringeth in an heir by another:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "primo enim in lege Altissimi incredibilis fuit: secundo in virum suum deliquit: tertio in adulterio fornicata est, et ex alio viro filios statuit sibi."
      en: "For first she hath been unfaithful to the law of the most High: and secondly, she hath offended against her husband: thirdly, she hath fornicated in adultery, and hath gotten her children of another man."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Haec in ecclesiam adducetur, et in filios ejus respicietur:"
      en: "This woman shall be brought into the assembly, and inquisition shall be made of her children."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "non tradent filii ejus radices, et rami ejus non dabunt fructum:"
      en: "Her children shall not take root, and her branches shall bring forth no fruit."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "derelinquet in maledictum memoriam ejus, et dedecus illius non delebitur."
      en: "She shall leave her memory to be cursed, and her infamy shall not be blotted out."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et agnoscent qui derelicti sunt, quoniam nihil melius est quam timor Dei, et nihil dulcius quam respicere in mandatis Domini."
      en: "And they that remain shall know. that there is nothing better than the fear of God: and that there is nothing sweeter than to have regard to the commandments of the Lord."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Gloria magna est sequi Dominum: longitudo enim dierum assumetur ab eo."
      en: "It is great glory to follow the Lord for length of days shall be received from him."
    status: { la: verified, en: verified }
