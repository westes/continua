book: 2mach
chapter: 7
verses:
  - n: 1
    text:
      la: "contigit autem et septem fratres cum matre adprehensos conpelli a rege contra fas ad carnes porcinas flagris et taureis cruciatos"
      en: "have from heaven, but for the laws of God I now despise them: because I hope to receive them again from him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "unus autem ex illis qui erat primus sic ait quid quaeris et quid vis discere a nobis parati sumus mori magis quam patrias Dei leges praevaricari"
      en: "But one of them, who was the eldest, said thus: What wouldst thou ask, or learn of us? we are ready to die rather than to transgress the laws of God, received from our fathers."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "iratus itaque rex iussit sartagines et ollas aeneas succendi quibus statim succensis"
      en: "Then the king being angry commanded fryingpans, and brazen caldrons to be made hot: which forthwith being heated,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "iussit ei qui prior fuerat locutus amputari linguam et cute capitis abstracta summas quoque manus ei et pedes praecidi ceteris eius fratribus et matre inspicientibus"
      en: "He commanded to cut out the tongue of him that had spoken first: and the skin of his head being drawn off, to chop off also the extremities of his hands and feet, the rest of his brethren, and his mother, looking on."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et cum iam per omnia inutilis factus esset iussit ignem admoveri et adhuc spirantem torreri in sartaginem in qua cum diu cruciaretur ceteri una cum matre invicem se hortabantur mori fortiter"
      en: "And when he was now maimed in all parts, he commanded him, being yet alive, to be brought to the Are, and to be fried in the fryingpan: and while he was suffering therein long torments, the rest, together with the mother, exhorted one another to die manfully,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dicentes Dominus Deus aspiciat veritatem et consolabitur in nobis quemadmodum protestationem cantici declaravit Moses et in servis suis consolabitur"
      en: "Saying: The Lord God will look upon the truth, and will take pleasure in us, \"as Moses declared in the profession of the canticle: And In his servants he will take pleasure."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "mortuo itaque primo illo hoc modo sequentem deducebant ad inludendum et cute capitis eius cum capillis detracta interrogabant si manducaret priusquam toto corpore per membra singula puniretur"
      en: "So when the first was dead after this manner, they brought the next to make him a, mocking stock: and when they had pulled off the skin of his head with the hair, they asked him if he would eat, before he were punished throughout the whole body in every limb."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "at ille respondens patria voce dixit non faciam propter quod et iste sequenti loco primi tormenta suscepit"
      en: "But he answered in his own language, and said: I will not do it. Wherefore Ire also in the next place, received the torments of the first:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et in ultimo spiritu constitutus ait tu quidem scelestissime in praesenti vita nos perdis sed rex mundi defunctos nos pro suis legibus in aeternae vitae resurrectione suscitabit"
      en: "And when he was at the last gasp, he said thus: Thou indeed, O most wicked man, destroyest us out of this present life: but the King of the world will raise us up, who die for his laws, in the resurrection of eternal life."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "post hunc tertius inludebatur et linguam postulatus cito protulit et manus constanter extendit"
      en: "After him the third was made a mocking stock, and when he was required, he quickly put forth his tongue, and courageously stretched out his hands:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et cum fiducia ait e caelo ista possideo sed propter Dei leges nunc haec ipsa despicio quoniam ab ipso me ea recepturum spero"
      en: "And said with confidence: These"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ita ut rex et qui cum ipso erant mirarentur adulescentis animum quod tamquam nihili duceret cruciatus"
      en: "So that the king, and they that were with him, wondered at the young man's courage, because he esteemed the torments as nothing."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et hoc ita defuncto quartum similiter vexabant torquentes"
      en: "And after he was thus dead, they tormented the fourth in the like manner"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et cum iam esset ad mortem sic ait potius est ab hominibus morti datos spem expectare a Deo iterum ab ipso resuscitandos tibi enim resurrectio ad vitam non erit"
      en: "And when he was now ready to die, he spoke thus: It is better, being put to death by men, to look for hope from God, to be raised up again by him: for, as to thee thou shalt have no resurrection unto life."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et cum admovissent quintum vexabant eum at ille respiciens in eum"
      en: "And when they had brought the fifth, they tormented him. But he looking upon the king,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixit potestatem inter homines habens cum sis corruptibilis facis quod vis noli autem putare genus nostrum a Deo esse derelictum"
      en: "Said: Whereas thou hast power among men, though thou art corruptible, thou dost what thou wilt: but think not that our nation is forsaken by God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "patienter sustine et videbis magna potestas ipsius qualiter te et semen tuum torquebit"
      en: "But stay patiently a while, and thou shalt see his great power, in what manner he will torment thee and thy seed."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "post hunc ducebant et sextum et is mori incipiens sic ait noli frustra errare nos enim propter nosmet ipsos haec patimur peccantes in Deum nostrum et digna admiratione facta sunt in nobis"
      en: "After him they brought the sixth, and he being ready to die, spoke thus: Be not deceived without cause: for we suffer these things for ourselves, having sinned against our God, and things worthy of admiration are done to us:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "tu autem ne existimes tibi inpune futurum quod contra Deum pugnare temptaveris"
      en: "But do not think that thou s escape unpunished, for that thou attempted to fight against God."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "supra modum autem mater mirabilis et bonorum memoria digna quae pereuntes septem filios sub unius diei tempore conspiciens bono animo ferebat propter spem quam in Deum habebat"
      en: "Now the mother was to be ad above measure, and worthy to be remembered by good men, who beheld seven sons slain in the space of one day, and bore it with a good courage, for the hope that she had in God:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "singulos illorum hortabatur patria voce fortiter repleta sapientia et femineae cogitationi masculinum animum inserens"
      en: "And she bravely exhorted every o of them in her own language, being filled with wisdom: and joining a man's heart to a woman's thought,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "dixit ad eos nescio qualiter in utero meo apparuistis neque enim ego spiritum et animam donavi vobis et vitam et singulorum membra non ego ipsa conpegi"
      en: "She said to them: I know not how you were formed in my womb: for I neither gave you breath, nor soul, nor life, neither did I frame the limbs of every one of you."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sed enim mundi creator qui formavit hominis nativitatem quique omnium invenit originem et spiritum vobis iterum cum misericordia reddet et vitam sicut nunc vosmet ipsos despicitis propter leges eius"
      en: "But the Creator of the world, that formed the nativity of man, and that found out the origin of all, he will re- store to you again in his mercy, both breath and life, as now you despise your- selves for the sake of his laws."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Antiochus autem contemni se arbitratus simul et exprobrantis voce despecta cum adhuc adulescentior superesset non solum verbis hortabatur sed et iuramento adfirmabat divitem se et beatum facturum et translatum a patriis legibus amicum habiturum et res necessarias praebiturum"
      en: "Now Antiochus, thinking himself despised, and withal despising the voice of the upbraider, when the youngest was yet alive, did not only exhort him by words, but also assured him with an oath, that he would make him a rich and a happy man, and, if he would turn from the laws of his fathers, would take him for a friend, and furnish him with things necessary."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "sed ad ista cum adulescens nequaquam inclinaretur vocavit rex matrem et suadebat ut adulescenti fieret in salutem"
      en: "But when the young man was not moved with these things, the king called the mother, and counselled her to deal with the young man to save his life."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "cum autem multis eam verbis esset hortatus promisit suasuram se filio suo"
      en: "And when he had exhorted her with many words, she promised that she would counsel her son."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "itaque inclinata ad illum inridens crudelem tyrannum ait patria voce fili mi miserere mei quae te in utero decem menses portavi et lac triennio dedi et alui et in aetatem istam perduxi"
      en: "So bending herself towards him, mocking the cruel tyrant, she said her own language: My son, have pi upon me, that bore thee nine months my womb, and save thee suck years, and nourished thee, and b thee up unto this age."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "peto nate aspicias in caelum et terram et ad omnia quae in eis sunt et intellegas quia ex nihilo fecit illa Deus et hominum genus"
      en: "I beseech thee, my son, look upon heaven and earth, and all that is in them: and consider that God made the out of nothing, and mankind also:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ita fit ut non timeas carnificem istum sed dignus fratribus tuis effectus suscipe mortem ut in illa miseratione cum fratribus tuis te recipiam"
      en: "So thou shalt not fear this tormentor, but being made a worthy partner with thy brethren, receive death, that in that mercy I may receive thee again with thy brethren."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "cum haec illa adhuc diceret ait adulescens quem sustinetis non oboedio praecepto regis sed praecepto legis quae data est nobis per Mosen"
      en: "While she was yet speaking these words, the young man said: For whom do you stay ? I will not obey the commandment of the king, but the commandment of the law, which was given us by Moses."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "tu vero qui inventor omnis malitiae factus es in Hebraeos non effugies manum Dei"
      en: "But thou that hast been the author of all mischief against the Hebrews, shalt not escape the hand of God."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "nos enim pro peccatis nostris haec patimur"
      en: "For we suffer thus for our sine."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et si nobis propter increpationem et correptionem Dominus noster modicum iratus est sed iterum reconciliabitur servis suis"
      en: "And though the Lord our God is angry with us a little while for our chastisement and correction: yet he will be reconciled again to his servants."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "tu autem o sceleste et omnium hominum flagitiosissime noli frustra extolli vanis spebus in servos eius inflammatus"
      en: "But thou, O wicked and of all men most flagitious, be not lifted up without cause with vain hopes, whilst thou art raging against his servants."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "nondum enim omnipotentis Dei et omnia inspicientis iudicium effugisti"
      en: "For thou hast not yet escaped the judgment of the almighty God, who beholdeth all things."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "nam fratres mei modico nunc dolore sustentato sub testamento aeternae vitae effecti sunt tu vero iudicio Dei iustas superbiae poenas solves"
      en: "For my brethren, having now undergone a short pain, are under the covenant of eternal life: but thou by the judgment of God shalt receive just punishment for thy pride."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "ego autem sicut fratres mei animam et corpus meum trado pro patriis legibus invocans Deum maturius genti nostrae propitium fieri teque cum tormentis et verberibus confiteri quod ipse est Deus solus"
      en: "But I, like my brethren, offer up my life and my body for the laws of our fathers: calling upon God to be speedily merciful to our nation, and that thou by torments and stripes mayst confess that he alone is God."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "in me vero et in fratribus meis desinet Omnipotentis ira quae super omne genus nostrum iuste superducta est"
      en: "But in me and in my brethren the wrath of the Almighty, which hath justly been brought upon all our nation, shall cease."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "tunc rex accensus ira in hunc super omnes crudelius desaeviit indigne ferens derisum se"
      en: "Then the king being incensed with anger, raged against him more cruelly than all the rest, taking it grievously that he was mocked."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et hic itaque mundus obiit per omnia in Domino confidens"
      en: "So this man also died undefiled, wholly trusting in the Lord."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "novissime autem et mater consummata est"
      en: "And last of all after the sons the mother also was consumed."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "igitur de sacrificiis et de nimiis crudelitatibus satis dictum"
      en: "But now there is enough said of the sacrifices, and of the excessive cruelties."
    status: { la: verified, en: verified }
