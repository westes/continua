# Douay-Rheims + Latin Vulgate, from drbo.org (Douay-Rheims Bible
# Online) -- the "DR + LV" combined page keeps every verse's Latin
# and English paired in the same block, avoiding the verse-
# misalignment this project's first-pass "Unbound Bible" source had
# for dan 14 specifically; see TODO.md's bulk scripture import entry.
book: dan
chapter: 14
verses:
  - n: 1
    text:
      la: "Erat autem Daniel conviva regis, et honoratus super omnes amicos ejus."
      en: "And Daniel was the king's guest, and was honoured above all his friends."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Erat quoque idolum apud Babylonios nomine Bel : et impendebantur in eo per dies singulos similae artabae duodecim, et oves quadraginta, vinique amphorae sex."
      en: "Now the Babylonians had an idol called Bel: and there were spent upon him every day twelve great measures of fine flour, and forty sheep, and sixty vessels of wine."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Rex quoque colebat eum, et ibat per singulos dies adorare eum : porro Daniel adorabat Deum suum. Dixitque ei rex : Quare non adoras Bel?"
      en: "The king also worshipped him, and went every day to adore him: but Daniel adored his God. And the king said to him: Why dost thou not adore Bel?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Qui respondens ait ei : Quia non colo idola manufacta, sed viventem Deum, qui creavit caelum, et terram, et habet potestatem omnis carnis."
      en: "And he answered, and said to him: Because I do not worship idols made with hands, but the living God, that created heaven and earth, and hath power over all flesh."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et dixit rex ad eum : Non videtur tibi esse Bel vivens deus? an non vides quanta comedat et bibat quotidie?"
      en: "And the king said to him: Doth not Bel seem to thee to be a living god? Seest thou not how much he eateth and drinketh every day?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et ait Daniel arridens : Ne erres, rex : iste enim intrinsecus luteus est, et forinsecus aereus, neque comedit aliquando."
      en: "Then Daniel smiled and said: O king, be not deceived: for this is but clay within, and brass without, neither hath he eaten at any time."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et iratus rex vocavit sacerdotes ejus, et ait eis : Nisi dixeritis mihi quis est qui comedat impensas has, moriemini."
      en: "And the king being angry called for his priests, and said to them: If you tell me not, who it is that eateth up these expenses, you shall die."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Si autem ostenderitis quoniam Bel comedat haec, morietur Daniel, quia blasphemavit in Bel. Et dixit Daniel regi : Fiat juxta verbum tuum."
      en: "But if you can shew that Bel eateth these things, Daniel shall die, because he hath blasphemed against Bel. And Daniel said to the king: Be it done according to thy word."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Erant autem sacerdotes Bel septuaginta, exceptis uxoribus, et parvulis, et filiis. Et venit rex cum Daniele in templum Bel."
      en: "Now the priests of Bel were seventy, besides their wives, and little ones, and children. And the king went with Daniel into the temple of Bel."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et dixerunt sacerdotes Bel : Ecce nos egredimur foras : et tu, rex, pone escas, et vinum misce, et claude ostium, et signa annulo tuo :"
      en: "And the priests of Bel said: Behold we go out: and do thou, O king, set on the meats, and make ready the wine, and shut the door fast, and seal it with thy own ring:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et cum ingressus fueris mane, nisi inveneris omnia comesta a Bel, morte moriemur, vel Daniel qui mentitus est adversum nos."
      en: "And when thou comest in the morning, if thou findest not that Bel hath eaten up all, we will suffer death, or else Daniel that hath lied against us."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Contemnebant autem, quia fecerant sub mensa absconditum introitum, et per illum ingrediebantur semper, et devorabant ea."
      en: "And they little regarded it, because they had made under the table a secret entrance, and they always came in by it, and consumed those things."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Factum est igitur postquam egressi sunt illi, rex posuit cibos ante Bel : praecepit Daniel pueris suis, et attulerunt cinerem, et cribravit per totum templum coram rege : et egressi clauserunt ostium, et signantes annulo regis abierunt."
      en: "So it came to pass after they were gone out, the king set the meats before Bel: and Daniel commanded his servants, and they brought ashes, and he sifted them all over the temple before the king: and going forth they shut the door, and having sealed it with the king's ring, they departed."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sacerdotes autem ingressi sunt nocte juxta consuetudinem suam, et uxores et filii eorum, et comederunt omnia, et biberunt."
      en: "But the priests went in by night, according to their custom, with their wives and their children: and they ate and drank up all."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Surrexit autem rex primo diluculo, et Daniel cum eo."
      en: "And the king arose early in the morning, and Daniel with him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et ait rex : Salvane sunt signacula, Daniel? Qui respondit : Salva, rex."
      en: "And the king said: Are the seals whole, Daniel? And he answered: They are whole, O king."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Statimque cum aperuisset ostium, intuitus rex mensam, exclamavit voce magna : Magnus es, Bel, et non est apud te dolus quisquam."
      en: "And as soon as he had opened the door, the king looked upon the table, and cried out with a loud voice: Great art thou, O Bel, and there is not any deceit with thee."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et risit Daniel, et tenuit regem ne ingrederetur intro : et dixit : Ecce pavimentum : animadverte cujus vestigia sint haec."
      en: "And Daniel laughed: and he held the king that he should not go in: and he said: Behold the pavement, mark whose footsteps these are."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et dixit rex : Video vestigia virorum, et mulierum, et infantium. Et iratus est rex."
      en: "And the king said: I see the footsteps of men, and women, and children. And the king was angry."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Tunc apprehendit sacerdotes, et uxores, et filios eorum : et ostenderunt ei abscondita ostiola, per quae ingrediebantur, et consumebant quae erant super mensam."
      en: "Then he took the priests, and their wives, and their children: and they shewed him the private doors by which they came in, and consumed the things that were on the table."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Occidit ergo illos rex, et tradidit Bel in potestatem Danielis : qui subvertit eum, et templum ejus."
      en: "The king therefore put them to death, and delivered Bel into the power of Daniel: who destroyed him, and his temple."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et erat draco magnus in loco illo, et colebant eum Babylonii."
      en: "And there was a great dragon in that place, and the Babylonians worshipped him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et dixit rex Danieli : Ecce nunc non potes dicere quia iste non sit deus vivens : adora ergo eum."
      en: "And the king said to Daniel: Behold thou canst not say now, that this is not a living god: adore him therefore."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Dixitque Daniel : Dominum Deum meum adoro, quia ipse est Deus vivens : iste autem non est deus vivens."
      en: "And Daniel said: I adore the Lord my God: for he is the living God: but that is no living god."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Tu autem, rex, da mihi potestatem, et interficiam draconem absque gladio et fuste. Et ait rex : Do tibi."
      en: "But give me leave, O king, and I will kill this dragon without sword or club. And the king said: I give thee leave."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Tulit ergo Daniel picem, et adipem, et pilos, et coxit pariter : fecitque massas, et dedit in os draconis, et diruptus est draco. Et dixit : Ecce quem colebatis."
      en: "Then Daniel took pitch, and fat, and hair, and boiled them together: and he made lumps, and put them into the dragon's mouth, and the dragon burst asunder. And he said: Behold him whom you worshipped."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Quod cum audissent Babylonii, indignati sunt vehementer : et congregati adversum regem, dixerunt : Judaeus factus est rex : Bel destruxit, draconem interfecit, et sacerdotes occidit."
      en: "And when the Babylonians had heard this, they took great indignation: and being gathered together against the king, they said: The king is become a Jew. He hath destroyed Bel, he hath killed the dragon, and he hath put the priests to death."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et dixerunt cum venissent ad regem : Trade nobis Danielem, alioquin interficiemus te, et domum tuam."
      en: "And they came to the king, and said: Deliver us Daniel, or else we will destroy thee and thy house."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Vidit ergo rex quod irruerent in eum vehementer : et necessitate compulsus, tradidit eis Danielem."
      en: "And the king saw that they pressed upon him violently: and being constrained by necessity he delivered Daniel to them."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Qui miserunt eum in lacum leonum, et erat ibi diebus sex."
      en: "And they cast him into the den of lions, and he was there six days."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Porro in lacu erant leones septem, et dabantur eis duo corpora quotidie, et duae oves : et tunc non data sunt eis, ut devorarent Danielem."
      en: "And in the den there were seven lions, and they had given to them two carcasses every day, and two sheep: but then they were not given unto them, that they might devour Daniel."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Erat autem Habacuc propheta in Judaea, et ipse coxerat pulmentum, et intriverat panes in alveolo : et ibat in campum ut ferret messoribus."
      en: "Now there was in Judea a prophet called Habacuc, and he had boiled pottage, and had broken bread in a bowl: and was going into the field, to carry it to the reapers."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Dixitque angelus Domini ad Habacuc : Fer prandium quod habes in Babylonem Danieli, qui est in lacu leonum."
      en: "And the angel of the Lord said to Habacuc: Carry the dinner which thou hast into Babylon to Daniel, who is in the lions' den."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et dixit Habacuc : Domine, Babylonem non vidi, et lacum nescio."
      en: "And Habacuc said: Lord, I never saw Babylon, nor do I know the den."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et apprehendit eum angelus Domini in vertice ejus, et portavit eum capillo capitis sui, posuitque eum in Babylone supra lacum in impetu spiritus sui."
      en: "And the angel of the Lord took him by the top of his head, and carried him by the hair of his head, and set him in Babylon over the den in the force of his spirit."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et clamavit Habacuc, dicens : Daniel serve Dei, tolle prandium quod misit tibi Deus."
      en: "And Habacuc cried, saying: O Daniel, thou servant of God, take the dinner that God hath sent thee."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et ait Daniel : Recordatus es mei, Deus, et non dereliquisti diligentes te."
      en: "And Daniel said: Thou hast remembered me, O God, and thou hast not forsaken them that love thee."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Surgensque Daniel comedit. Porro angelus Domini restituit Habacuc confestim in loco suo."
      en: "And Daniel arose and ate. And the angel of the Lord presently set Habacuc again in his own place."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Venit ergo rex die septimo ut lugeret Danielem : et venit ad lacum, et introspexit, et ecce Daniel sedens in medio leonum."
      en: "And upon the seventh day the king came to bewail Daniel: and he came to the den, and looked in, and behold Daniel was sitting in the midst of the lions."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et exclamavit voce magna rex, dicens : Magnus es, Domine Deus Danielis. Et extraxit eum de lacu leonum."
      en: "And the king cried out with a loud voice, saying: Great art thou, O Lord the God of Daniel. And he drew him out of the lions' den."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Porro illos, qui perditionis ejus causa fuerant, intromisit in lacum, et devorati sunt in momento coram eo."
      en: "But those that had been the cause of his destruction, he cast into the den, and they were devoured in a moment before him."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Tunc rex ait : Paveant omnes habitantes in universa terra Deum Danielis : quia ipse est salvator, faciens signa et mirabilia in terra : qui liberavit Danielem de lacu leonum."
      en: "Then the king said: Let all the inhabitants of the whole earth fear the God of Daniel: for he is the Saviour, working signs, and wonders in the earth: who hath delivered Daniel out of the lions' den."
    status: { la: verified, en: verified }
