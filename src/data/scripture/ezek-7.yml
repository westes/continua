# Ezekiel (Vulgate "Ezechiel," cited "Ezech"), chapter 7.
# Verses transcribed from all-saints-octave-day-5.yml (already pulled
# from Divinum Officium, Monastic Tridentinum 1617) as part of the
# migration to a dedicated scripture store (2026-08 decision).
book: ezek
chapter: 7
verses:
  - n: 1
    text:
      la: "Et factus est sermo Dómini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et tu, fili hóminis, hæc dicit Dóminus Deus terræ Israël: Finis venit, venit finis super quátuor plagas terræ."
      en: "And thou son of man, thus saith the Lord God to the land of Israel: The end is come, the end is come upon the four quarters of the land."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Nunc finis super te, et immíttam furórem meum in te: et judicábo te juxta vias tuas, et ponam contra te omnes abominatiónes tuas."
      en: "Now is an end come upon thee, and I will send my wrath upon thee, and I will judge thee according to thy ways: and I will set all thy abominations against thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et non parcet óculus meus super te, et non miserébor; sed vias tuas ponam super te, et abominatiónes tuæ in médio tui erunt, et sciétis quia ego Dóminus."
      en: "And my eye shall not spare thee, and I will shew thee no pity: but I will lay thy ways upon thee, and thy abominations shall be in the midst of thee: and you shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Hæc dicit Dóminus Deus: Afflíctio una, afflíctio ecce venit."
      en: "Thus saith the Lord God: One affliction, behold an affliction is come."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Finis venit, venit finis, evigilávit advérsum te, ecce venit:"
      en: "An end is come, the end is come, it hath awaked against thee: behold it is come."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Venit contrítio super te, qui hábitas in terra; venit tempus, prope est dies occisiónis, et non glóriæ móntium."
      en: "Destruction is come upon thee that dwellest in the land: the time is come, the day of slaughter is near, and not of the joy of mountains."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Nunc de propínquo effúndam iram meam super te, et complébo furórem meum in te: et judicábo te juxta vias tuas, et impónam tibi ómnia scélera tua,"
      en: "Now very shortly I will pour out my wrath upon thee, and I will accomplish my anger in thee: and I will judge thee according to thy ways, and I will lay upon thee all thy crimes."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et non parcet óculus meus, nec miserébor; sed vias tuas impónam tibi, et abominatiónes tuæ in médio tui erunt, et sciétis quia ego sum Dóminus percútiens."
      en: "And my eye shall not spare, neither will I shew mercy: but I will lay thy ways upon thee, and thy abominations shall be in the midst of thee: and you shall know that I am the Lord that strike."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ecce dies, ecce venit; egréssa est contrítio, flóruit virga, germinávit supérbia,"
      en: "Behold the day, behold it is come: destruction is gone forth, the rod hath blossomed, pride hath budded."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Iníquitas surréxit in virga impietátis; non ex eis et non ex pópulo neque ex sónitu eórum, et non erit réquies in eis."
      en: "Iniquity is risen up into a rod of impiety: nothing of them shall remain, nor of their people, nor of the noise of them: and there shall be no rest among them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Venit tempus, appropinquávit dies: qui emit non lætétur, et qui vendit, non lúgeat: quia ira super omnem pópulum ejus;"
      en: "The time is come, the day is at hand: let not the buyer rejoice: nor the seller mourn: for wrath is upon all the people thereof."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quia qui vendit, ad id quod véndidit non revertétur: et adhuc in vivéntibus vita eórum."
      en: "For the seller shall not return to that which he hath sold, although their life be yet among the living. For the vision which regardeth all the multitude thereof, shall not go back: neither shall man be strengthened in the iniquity of his life."
    status: { la: verified, en: verified }
