# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 36
verses:
  - n: 1
    text:
      la: "hae sunt autem generationes Esau ipse est Edom"
      en: "And these are the generations of Esau, the same is Edom."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Esau accepit uxores de filiabus Chanaan Ada filiam Elom Hetthei et Oolibama filiam Anae filiae Sebeon Evei"
      en: "Esau took wives of the daughters of Chanaan: Ada the daughter of Elon the Hethite, and Oolibama the daughter of Ana, the daughter of Sebeon the Hevite:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Basemath quoque filiam Ismahel sororem Nabaioth"
      en: "And Basemath the daughter of Ismael, sister of Nabajoth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "peperit autem Ada Eliphaz Basemath genuit Rauhel"
      en: "And Ada bore Eliphaz: Basemath bore Rahuel:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Oolibama edidit Hieus et Hielom et Core hii filii Esau qui nati sunt ei in terra Chanaan"
      en: "Oolibama bore Jehus and Ihelon and Core. These are the sons of Esau, that were born to him in the land of Chanaan."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "tulit autem Esau uxores suas et filios et filias et omnem animam domus suae et substantiam et pecora et cuncta quae habere poterat in terra Chanaan et abiit in alteram regionem recessitque a fratre suo Iacob"
      en: "And Esau took his wives and his sons and daughters, and every soul of his house, and his substance, and cattle, and all that he was able to acquire in the land of Chanaan: and went into another country, and departed from his brother Jacob."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "divites enim erant valde et simul habitare non poterant nec sustinebat eos terra peregrinationis eorum prae multitudine gregum"
      en: "For they were exceeding rich, and could not dwell together: neither was the land in which they sojourned able to bear them, for the multitude of their flocks."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "habitavitque Esau in monte Seir ipse est Edom"
      en: "And Esau dwelt in mount Seir: he is Edom."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "hae sunt generationes Esau patris Edom in monte Seir"
      en: "And these are the generations of Esau the father of Edom in mount Seir,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et haec nomina filiorum eius Eliphaz filius Ada uxoris Esau Rauhel quoque filius Basemath uxoris eius"
      en: "And these the names of his sons: Eliphaz the son of Ada the wife of Esau: and Rahnel the son of Basemath his wife."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "fueruntque filii Eliphaz Theman Omar Sephu et Gatham et Cenez"
      en: "And Eliphaz had sons: Theman, Omar, Sepho, and Gatham, and Cenee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "erat autem Thamna concubina Eliphaz filii Esau quae peperit ei Amalech hii sunt filii Adae uxoris Esau"
      en: "And Thamna was the concubine of Eliphaz the son of Esau: and she bore him Amalech. These are the sons of Ada the wife of Esau."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "filii autem Rauhel Naath et Zara Semma et Meza hii filii Basemath uxoris Esau"
      en: "And the sons of Rahuel were Nahath and Zara, Samma and Meza. These were the sons of Basemath the wife of Esau."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "isti quoque erant filii Oolibama filiae Ana filiae Sebeon uxoris Esau quos genuit ei Hieus et Hielom et Core"
      en: "And these were the sons of Oolibama, the daughter of Ana, the daughter of Sebeon, the wife of Esau, whom she bore to him, Jehus, and Ihelon, and Core."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "hii duces filiorum Esau filii Eliphaz primogeniti Esau dux Theman dux Omar dux Sephu dux Cenez"
      en: "These were dukes of the sons of Esau: the sons of Eliphaz the firstborn of Esau: duke Theman, duke Omar, duke Sepho, duke Cenez,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dux Core dux Gatham dux Amalech hii filii Eliphaz in terra Edom et hii filii Adae"
      en: "Duke Core, duke Gatham, duke Amalech: these are the sons of Eliphaz, in the land of Edom, and these the Bone of Ada."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "hii quoque filii Rauhel filii Esau dux Naath dux Zara dux Semma dux Meza hii duces Rauhel in terra Edom isti filii Basemath uxoris Esau"
      en: "And these were the sons of Rahuel, the son of Esau: duke Nahath, duke Zara, duke Samma, duke Meza. And these are the dukes of Rahuel, in the land of Edom: these the sons of Base- math the wife of Esau."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "hii autem filii Oolibama uxoris Esau dux Hieus dux Hielom dux Core hii duces Oolibama filiae Ana uxoris Esau"
      en: "And these the sons of Oolibama the wife of Esau: duke Jehus, duke Ihelon, duke Core. These are the dukes of Oolibama, the daughter of Ana, and wife of Esau."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "isti filii Esau et hii duces eorum ipse est Edom"
      en: "These are the sons of Esau, and these the dukes of them: the same is Edom."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "isti filii Seir Horrei habitatores terrae Lotham et Sobal et Sebeon et Anan"
      en: "These are the sons of Seir the Horrite, the inhabitants of the land: Lotan, and Sobal, and Sebeon, and Ana,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dison et Eser et Disan hii duces Horrei filii Seir in terra Edom"
      en: "And Dison, and Eser, and Disan. These are dukes of the Horrites, the sons of Seir in the land of Edom."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "facti sunt autem filii Lotham Horrei et Heman erat autem soror Lotham Thamna"
      en: "And Lotan had sons: Hori and Heman. And the sister of Lotan was Thamna."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et isti filii Sobal Alvam et Maneeth et Hebal Sephi et Onam"
      en: "And these the sons of Sobal: Alvan and Manahat, and Ebal, and Sepho, and Oman."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et hii filii Sebeon Ahaia et Anam iste est Ana qui invenit aquas calidas in solitudine cum pasceret asinos Sebeon patris sui"
      en: "And these the sons of Sebeon: Aia and Ana. This is Ana that found the hot waters in the wilderness, when he fed the asses of Sebeon his father:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "habuitque filium Disan et filiam Oolibama"
      en: "And he had a son Dison, and a daughter Oolibama."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et isti filii Disan Amdan et Esban et Iethran et Charan"
      en: "And these were the sons of Dison: Hamdan, and Eseban, and Jethram, and Charan."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "hii quoque filii Eser Balaan et Zevan et Acham"
      en: "These also were the sons of Eser: Balaan, and Zavan, and Acan."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "habuit autem filios Disan Hus et Aran"
      en: "And Disan had sons : Hus, and Aram."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "isti duces Horreorum dux Lothan dux Sobal dux Sebeon dux Ana"
      en: "These were dukes of the Horrites: duke Lotan, duke Sobal, duke Sebeon, duke Ana,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "dux Dison dux Eser dux Disan isti duces Horreorum qui imperaverunt in terra Seir"
      en: "Duke Dison, duke Eser, duke Disan: these were dukes of the Horrites that ruled in the land of Seir."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "reges autem qui regnaverunt in terra Edom antequam haberent regem filii Israhel fuerunt hii"
      en: "And the kings that ruled in the land of Edom, before the children of Israel had a king were these:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Bale filius Beor nomenque urbis eius Denaba"
      en: "Bela the son of Beer, and the name of his city Denaba."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "mortuus est autem Bale et regnavit pro eo Iobab filius Zare de Bosra"
      en: "And Bela died, and Jobab the son of Zara of Bosra reigned in his stead."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "cumque mortuus esset Iobab regnavit pro eo Husan de terra Themanorum"
      en: "And when Jobab was dead, Husam of the land of the Themanites reigned in his stead."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "hoc quoque mortuo regnavit pro eo Adad filius Badadi qui percussit Madian in regione Moab et nomen urbis eius Ahuith"
      en: "And after his death, Adad the son of Badad reigned in his stead, who defeated the Madianites in the country of Moab: and the name of his city was Avith."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "cumque mortuus esset Adad regnavit pro eo Semla de Maserecha"
      en: "And when Adad was dead, there reigned in his stead, Semla of Masreca."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "hoc quoque mortuo regnavit pro eo Saul de fluvio Rooboth"
      en: "And he being dead, Saul of the river Rohoboth, reigned in his stead."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "cumque et hic obisset successit in regnum Baalanam filius Achobor"
      en: "And when he also was dead, Balanan the son of Achobor succeeded to the kingdom."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "isto quoque mortuo regnavit pro eo Adad nomenque urbis eius Phau et appellabatur uxor illius Meezabel filia Matred filiae Mizaab"
      en: "This man also being dead, Adar reigned in his place, and the name of his city was Phau: and his wife was called Meetabel, the daughter of Matred, daughter of Mezaab."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "haec ergo nomina Esau in cognationibus et locis et vocabulis suis dux Thamna dux Alva dux Ietheth"
      en: "And these are the names of the dukes of Esau in their kindreds, and places, and callings: duke Thamna, duke Alva, duke Jetheth,"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "dux Oolibama dux Ela dux Phinon"
      en: "Duke Oolibama, duke Ela, duke Phinon,"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "dux Cenez dux Theman dux Mabsar"
      en: "Duke Cenez, duke Theman, duke Mabsar,"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "dux Mabdiel dux Iram hii duces Edom habitantes in terra imperii sui ipse est Esau pater Idumeorum"
      en: "Duke Magdiel, duke Hiram: these are the dukes of Edom dwelling in the land of their government; the same is Esau the father of the Edomites."
    status: { la: verified, en: verified }
