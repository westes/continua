# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 36
verses:
  - n: 1
    text:
      la: "Hae sunt autem generationes Esau, ipse est Edom."
      en: "And these are the generations of Esau, the same is Edom."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Esau accepit uxores de filiabus Chanaan: Ada filiam Elon Hethaei, et Oolibama filiam Anae filiae Sebeon Hevaei:"
      en: "Esau took wives of the daughters of Chanaan: Ada the daughter of Elon the Hethite, and Oolibama the daughter of Ana, the daughter of Sebeon the Hevite:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Basemath quoque filiam Ismael sororem Nabaioth."
      en: "And Basemath the daughter of Ismael, sister of Nabajoth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Peperit autem Ada Eliphaz: Basemath genuit Rahuel:"
      en: "And Ada bore Eliphaz: Basemath bore Rahuel:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Oolibama genuit Jehus et Ihelon et Core. Hi filii Esau qui nati sunt ei in terra Chanaan."
      en: "Oolibama bore Jehus and Ihelon and Core. These are the sons of Esau, that were born to him in the land of Chanaan."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Tulit autem Esau uxores suas et filios et filias, et omnem animam domus suae, et substantiam, et pecora, et cuncta quae habere poterat in terra Chanaan: et abiit in alteram regionem, recessitque a fratre suo Jacob."
      en: "And Esau took his wives and his sons and daughters, and every soul of his house, and his substance, and cattle, and all that he was able to acquire in the land of Chanaan: and went into another country, and departed from his brother Jacob."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Divites enim erant valde, et simul habitare non poterant: nec sustinebat eos terra peregrinationis eorum prae multitudine gregum."
      en: "For they were exceeding rich, and could not dwell together: neither was the land in which they sojourned able to bear them, for the multitude of their flocks."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Habitavitque Esau in monte Seir, ipse est Edom."
      en: "And Esau dwelt in mount Seir: he is Edom."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Hae autem sunt generationes Esau patris Edom in monte Seir,"
      en: "And these are the generations of Esau the father of Edom in mount Seir,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et haec nomina filiorum ejus: Eliphaz filius Ada uxoris Esau: Rahuel quoque filius Basemath uxoris ejus."
      en: "And these the names of his sons: Eliphaz the son of Ada the wife of Esau: and Rahuel the son of Basemath his wife."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Fueruntque Eliphaz filii: Teman, Omar, Sepho, et Gatham, et Cenez."
      en: "And Eliphaz had sons: Theman, Omar, Sepho, and Gatham, and Cenez."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Erat autem Thamna concubina Eliphaz filii Esau: quae peperit ei Amalech. Hi sunt filii Ada uxoris Esau."
      en: "And Thamna was the concubine of Eliphaz the son of Esau: and she bore him Amalech. These are the sons of Ada the wife of Esau."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Filii autem Rahuel: Nahath et Zara, Samma et Meza: hi filii Basemath uxoris Esau."
      en: "And the sons of Rahuel were Nahath and Zara, Samma and Meza. These were the sons of Basemath the wife of Esau."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Isti quoque erant filii Oolibama filiae Anae filiae Sebeon, uxoris Esau, quos genuit ei, Jehus et Ihelon et Core."
      en: "And these were the sons of Oolibama, the daughter of Ana, the daughter of Sebeon, the wife of Esau, whom she bore to him, Jehus, and Ihelon, and Core."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Hi duces filiorum Esau: filii Eliphaz primogeniti Esau: dux Theman, dux Omra, dux Sepho, dux Cenez,"
      en: "These were dukes of the sons of Esau: the sons of Eliphaz the firstborn of Esau: duke Theman, duke Omar, duke Sepho, duke Cenez,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dux Core, dux Gathan, dux Amalech. Hi filii Eliphaz in terra Edom, et hi filii Ada."
      en: "Duke Core, duke Gatham, duke Amalech: these are the sons of Eliphaz, in the land of Edom, and these the sons of Ada."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Hi quoque filii Rahuel filii Esau: dux Nahath, dux Zara, dux Samma, dux Meza: hi autem duces Rahuel in terra Edom: isti filii Basemath uxoris Esau."
      en: "And these were the sons of Rahuel, the son of Esau: duke Nahath, duke Zara, duke Samma, duke Meza. And these are the dukes of Rahuel, in the land of Edom: these the sons of Basemath the wife of Esau."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Hi autem filii Oolibama uxoris Esau: dux Jehus, dux Ihelon, dux Core: hi duces Oolibama filiae Anae uxoris Esau."
      en: "And these the sons of Oolibama the wife of Esau: duke Jehus, duke Ihelon, duke Core. These are the dukes of Oolibama, the daughter of Ana, and wife of Esau."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Isti sunt filii Esau, et hi duces eorum: ipse est Edom."
      en: "These are the sons of Esau, and these the dukes of them: the same is Edom."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Isti sunt filii Seir Horraei, habitatores terrae: Lotan, et Sobal, et Sebeon, et Ana,"
      en: "These are the sons of Seir the Horrite, the inhabitants of the land: Lotan, and Sobal, and Sebeon, and Ana,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et Dison, et Eser, et Disan: hi duces Horraei, filii Seir in terra Edom."
      en: "And Dison, and Eser, and Disan. These are dukes of the Horrites, the sons of Seir in the land of Edom."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Facti sunt autem filii Lotan: Hori et Heman. Erat autem soror Lotan, Thamna."
      en: "And Lotan had sons: Hori and Heman. And the sister of Lotan was Thamna."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et isti filii Sobal: Alvan et Manahat et Ebal, et Sepho et Onam."
      en: "And these the sons of Sobal: Alvan and Manahat, and Ebal, and Sepho, and Oman."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et hi filii Sebeon: Aja et Ana. Iste est Ana qui invenit aquas calidas in solitudine, cum pasceret asinos Sebeon patris sui:"
      en: "And these the sons of Sebeon: Aia and Ana. This is Ana that found the hot waters in the wilderness, when he fed the asses of Sebeon his father:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "habuitque filium Dison, et filiam Oolibama."
      en: "And he had a son Dison, and a daughter Oolibama."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et isti filii Dison: Hamdan, et Eseban, et Jethram, et Charan."
      en: "And these were the sons of Dison: Hamdan, and Eseban, and Jethram, and Charan."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Hi quoque filii Eser: Balaan, et Zavan, et Acan."
      en: "These also were the sons of Eser: Balaan, and Zavan, and Acan."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Habuit autem filios Disan: Hus et Aram."
      en: "And Disan had sons: Hus, and Aram."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Hi duces Horraeorum: dux Lotan, dux Sobal, dux Sebeon, dux Ana,"
      en: "These were dukes of the Horrites: duke Lotan, duke Sobal, duke Sebeon, duke Ana,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "dux Dison, dux Eser, dux Disan: isti duces Horraeorum qui imperaverunt in terra Seir."
      en: "Duke Dison, duke Eser, duke Disan: these were dukes of the Horrites that ruled in the land of Seir."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Reges autem qui regnaverunt in terra Edom antequam haberent regem filii Israel, fuerunt hi:"
      en: "And the kings that ruled in the land of Edom, before the children of Israel had a king were these:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Bela filius Beor, nomenque urbis ejus Denaba."
      en: "Bela the son of Beor, and the name of his city Denaba."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Mortuus est autem Bela, et regnavit pro eo Jobab filius Zarae de Bosra."
      en: "And Bela died, and Jobab the son of Zara of Bosra reigned in his stead."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Cumque mortuus esset Jobab, regnavit pro eo Husam de terra Themanorum."
      en: "And when Jobab was dead, Husam of the land of the Themanites reigned in his stead."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Hoc quoque mortuo, regnavit pro eo Adad filius Badad, qui percussit Madian in regione Moab: et nomen urbis ejus Avith."
      en: "And after his death, Adad the son of Badad reigned in his stead, who defeated the Madianites in the country of Moab: and the name of his city was Avith."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Cumque mortuus esset Adad, regnavit pro eo Semla de Masreca."
      en: "And when Adad was dead, there reigned in his stead, Semla of Masreca."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Hoc quoque mortuo regnavit pro eo Saul de fluvio Rohoboth."
      en: "And he being dead, Saul of the river Rohoboth, reigned in his stead."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Cumque et hic obiisset, successit in regnum Balanan filius Achobor."
      en: "And when he also was dead, Balanan the son of Achobor succeeded to the kingdom."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Isto quoque mortuo regnavit pro eo Adar, nomenque urbis ejus Phau: et appellabatur uxor ejus Meetabel, filia Matred filiae Mezaab."
      en: "This man also being dead, Adar reigned in his place, and the name of his city was Phau: and his wife was called Meetabel, the daughter of Matred, daughter of Mezaab."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Haec ergo nomina ducum Esau in cognationibus, et locis, et vocabulis suis: dux Thamna, dux Alva, dux Jetheth,"
      en: "And these are the names of the dukes of Esau in their kindreds, and places, and callings: duke Thamna, duke Alva, duke Jetheth,"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "dux Oolibama, dux Ela, dux Phinon,"
      en: "Duke Oolibama, duke Ela, duke Phinon,"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "dux Cenez, dux Theman, dux Mabsar,"
      en: "Duke Cenez, duke Theman, duke Mabsar,"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "dux Magdiel, dux Hiram: hi duces Edom habitantes in terra imperii sui, ipse est Esau pater Idumaeorum."
      en: "Duke Magdiel, duke Hiram: these are the dukes of Edom dwelling in the land of their government; the same is Esau the father of the Edomites."
    status: { la: verified, en: verified }
