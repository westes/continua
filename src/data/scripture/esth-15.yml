# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: esth
chapter: 15
verses:
  - n: 1
    text:
      la: "Et mandavit ei ( haud dubium quin esset Mardochaeus) ut ingrederetur ad regem, et rogaret pro populo suo et pro patria sua."
      en: "And he commanded her (no doubt but he was Mardochai) to go to the king, and petition for her people, and for her country."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Memorare, inquit, dierum humilitatis tuae, quomodo nutrita sis in manu mea, quia Aman secundus a rege locutus est contra nos in mortem:"
      en: "Remember, (said he,) the days of thy low estate, how thou wast brought up by my hand, because Aman the second after the king hath spoken against us unto death."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et tu invoca Dominum, et loquere regi pro nobis, et libera nos de morte."
      en: "And do thou call upon the Lord, and speak to the king for us, and deliver us from death."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Die autem tertio deposuit vestimenta ornatus sui, et circumdata est gloria sua."
      en: "And on the third day she laid away the garments she wore, and put on her glorious apparel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cumque regio fulgeret habitu, et invocasset omnium rectorem et salvatorem Deum, assumpsit duas famulas,"
      en: "And glittering in royal robes, after she had called upon God the ruler and Saviour of all, she took two maids with her,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et super unam quidem innitebatur, quasi prae deliciis et nimia teneritudine corpus suum ferre non sustinens:"
      en: "And upon one of them she leaned, as if for delicateness and overmuch tenderness she were not able to bear up her own body."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "altera autem famularum sequebatur dominam, defluentia in humum indumenta sustentans."
      en: "And the other maid followed her lady, bearing up her train flowing on the ground."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ipsa autem roseo colore vultum perfusa, et gratis ac nitentibus oculis tristem celabat animum, et nimio timore contractum."
      en: "But she with a rosy colour in her face, and with gracious and bright eyes, hid a mind full of anguish, and exceeding great fear."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ingressa igitur cuncta per ordinem ostia, stetit contra regem, ubi ille residebat super solium regni sui, indutus vestibus regiis, auroque fulgens, et pretiosis lapidibus, eratque terribilis aspectu."
      en: "So going in she passed through all the doors in order, and stood before the king, where he sat upon his royal throne, clothed with his royal robes, and glittering with gold, and precious stones, and he was terrible to behold."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Cumque elevasset faciem, et ardentibus oculis furorem pectoris indicasset, regina corruit, et in pallorem colore mutato, lassum super ancillulam reclinavit caput."
      en: "And when he had lifted up his countenance, and with burning eyes had shewn the wrath of his heart, the queen sunk down, and her colour turned pale, and she rested her weary head upon her handmaid."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Convertitque Deus spiritum regis in mansuetudinem, et festinus ac metuens exilivit de solio, et sustentans eam ulnis suis, donec rediret ad se, his verbis blandiebatur:"
      en: "And God changed the king's spirit into mildness, and all in haste and in fear he leaped from his throne, and holding her up in his arms, till she came to herself, caressed her with these words:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quid habes, Esther? ego sum frater tuus: noli metuere."
      en: "What is the matter, Esther? I am thy brother, fear not."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Non morieris: non enim pro te, sed pro omnibus haec lex constituta est."
      en: "Thou shalt not die: for this law is not made for thee, but for all others."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Accede igitur, et tange sceptrum."
      en: "Come near then, and touch the sceptre."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cumque illa reticeret, tulit auream virgam, et posuit super collum ejus, et osculatus est eam, et ait: Cur mihi non loqueris?"
      en: "And as she held her peace, he took the golden sceptre, and laid it upon her neck, and kissed her, and said: Why dost thou not speak to me?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quae respondit: Vidi te, domine, quasi angelum Dei, et conturbatum est cor meum prae timore gloriae tuae."
      en: "She answered: I saw thee, my lord, as an angel of God, and my heart was troubled for fear of thy majesty."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Valde enim mirabilis es, domine, et facies tua plena est gratiarum."
      en: "For thou, my lord, art very admirable, and thy. face is full of graces."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Cumque loqueretur, rursus corruit, et pene exanimata est."
      en: "And while she was speaking, she fell down again, and was almost in a swoon."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Rex autem turbabatur, et omnes ministri ejus consolabantur eam."
      en: "But the king was troubled, and all his servants comforted her."
    status: { la: verified, en: verified }
