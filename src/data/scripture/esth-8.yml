# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: esth
chapter: 8
verses:
  - n: 1
    text:
      la: "die illo dedit rex Asuerus Hester reginae domum Aman adversarii Iudaeorum et Mardocheus ingressus est ante faciem regis confessa est enim ei Hester quod esset patruus suus"
      en: "On that day king Assuerus gave the house of Aman, the Jews' enemy, to queen Esther, and Mardochai came in before the king. For Esther had confessed to him that he was her uncle."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tulitque rex anulum quem ab Aman recipi iusserat et tradidit Mardocheo Hester autem constituit Mardocheum super domum suam"
      en: "And the king took the ring which he had commanded to be taken again from Aman, and gave it to Mardochai. And Esther set Mardochai over her house."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "nec his contenta procidit ad pedes regis flevitque et locuta ad eum oravit ut malitiam Aman Agagitae et machinationes eius pessimas quas excogitaverat contra Iudaeos iuberet irritas fieri"
      en: "And not content with these things, she fell down at the king's feet and wept, and speaking to him besought him, that he would give orders that the malice of Aman the Agagite, and his most wicked devices which he had invented against the Jews, should be of no effect."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "at ille ex more sceptrum aureum protendit manu quo signum clementiae monstrabatur illaque consurgens stetit ante eum"
      en: "But he, as the manner was, held out the golden sceptre with his hand, which was the sign of clemency: and she arose up and stood before him,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et ait si placet regi et inveni gratiam coram oculis eius et deprecatio mea non ei videtur esse contraria obsecro ut novis epistulis veteres Aman litterae insidiatoris et hostis Iudaeorum quibus eos in cunctis regis provinciis perire praeceperat corrigantur"
      en: "And said: If it please the king, and if I have found favour in his sight, and my request be not disagreeable to him, I beseech thee, that the former letters of Aman the traitor and enemy of the Jews, by which he commanded that they should be destroyed in all the king's provinces, may be reversed by new letters."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quomodo enim potero sustinere necem et interfectionem populi mei"
      en: "For how call I endure the murdering and slaughter of my people?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "responditque rex Asuerus Hester reginae et Mardocheo Iudaeo domum Aman concessi Hester et ipsum iussi adfigi cruci qui ausus est manum in Iudaeos mittere"
      en: "And king Assuerus answered Esther the queen, and Mardochai the Jew: I have given Aman's house to Esther, and I have commanded him to be hanged on a gibbet, because he durst lay hands on the Jews."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "scribite ergo Iudaeis sicut vobis placet ex regis nomine signantes litteras anulo meo haec enim consuetudo erat ut epistulis quae ex regis nomine mittebantur et illius anulo signatae erant nemo auderet contradicere"
      en: "Write ye therefore to the Jews, as it pleaseth you, in the king's name, and seal the letters with my ring. For this was the custom, that no man durst gainsay the letters which were sent in the king's name, and were sealed with his ring."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "accitisque scribis et librariis regis erat autem tempus tertii mensis qui appellatur siban vicesima et tertia illius die scriptae sunt epistulae ut Mardocheus voluerat ad Iudaeos et ad principes procuratoresque et iudices qui centum viginti septem provinciis ab India usque Aethiopiam praesidebant provinciae atque provinciae populo et populo iuxta linguas et litteras suas et Iudaeis ut legere poterant et audire"
      en: "Then the king's scribes and secretaries were called for (now it was the time of the third month which is called Siban) the three and twentieth day of the month, and letters were written, as Mardochai had a mind, to the Jews, and to the governors, and to the deputies, and to the judges, who were rulers over the hundred and twenty-seven provinces, from India even to Ethiopia: to province and province, to people and people, according to their languages and characters, and to the Jews, according as they could read and hear."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ipsaeque epistulae quae ex regis nomine mittebantur anulo illius obsignatae sunt et missae per veredarios qui per omnes provincias discurrentes veteres litteras novis nuntiis praevenirent"
      en: "And these letters which were sent in the king's name, were sealed with his ring, and sent by posts: who were to run through all the provinces, to prevent the former letters with new messages."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quibus imperavit rex ut convenirent Iudaeos per singulas civitates et in unum praeciperent congregari ut starent pro animabus suis et omnes inimicos suos cum coniugibus ac liberis et universis domibus interficerent atque delerent"
      en: "And the king gave orders to them, to speak to the Jews in every city, and to command them to gather themselves together, and to stand for their lives, and to kill and destroy all their enemies with their wives and children and all their houses, and to take their spoil."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et constituta est per omnes provincias una ultionis dies id est tertiadecima mensis duodecimi adar"
      en: "And one day of revenge was appointed through all the provinces, to wit, the thirteenth of the twelfth month Adar."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "summaque epistulae fuit ut in omnibus terris ac populis qui regis Asueri imperio subiacebant notum fieret paratos esse Iudaeos ad capiendam vindictam de hostibus suis"
      en: "And this was the content of the letter, that it should be notified in all lands and peoples that were subject to the empire of king Assuerus, that the Jews were ready to be revenged of their enemies."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "egressique sunt veredarii celeres nuntios perferentes et edictum regis pependit in Susis"
      en: "So the swift posts went out carrying the messages, and the king's edict was hung up in Susan."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Mardocheus autem de palatio et de conspectu regis egrediens fulgebat vestibus regiis hyacinthinis videlicet et aerinis coronam auream portans capite et amictus pallio serico atque purpureo omnisque civitas exultavit atque laetata est"
      en: "And Mardochai going forth out of the palace, and from the king's presence, shone in royal apparel, to wit, of violet and sky colour, wearing a golden crown on his head, and clothed with a cloak of silk and purple. And all the city rejoiced and was glad."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Iudaeis autem nova lux oriri visa est gaudium honor et tripudium"
      en: "But to the Jews a new light seemed to rise, joy, honour, and dancing."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "apud omnes populos urbes atque provincias quocumque regis iussa veniebant mira exultatio epulae atque convivia et festus dies in tantum ut plures alterius gentis et sectae eorum religioni et caerimoniis iungerentur grandis enim cunctos iudaici nominis terror invaserat"
      en: "And in all peoples, cities, and provinces, whithersoever the king's commandments came, there was wonderful rejoicing, feasts and banquets, and keeping holy day: insomuch that many of other nations and religion, joined themselves to their worship and ceremonies. For a great dread of the name of the Jews had fallen upon all."
    status: { la: verified, en: verified }
