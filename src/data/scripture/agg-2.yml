# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: agg
chapter: 2
verses:
  - n: 1
    text:
      la: "in die vicesima et quarta mensis in sexto mense in anno secundo Darii regis"
      en: "In the four and twentieth day of the month, in the sixth month, in the second year of Darius the king, they began."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in septimo mense vicesima et prima mensis factum est verbum Domini in manu Aggei prophetae dicens"
      en: "And in the seventh month, the word of the Lord came by the hand of Aggeus the prophet, saying:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "loquere ad Zorobabel filium Salathihel ducem Iuda et ad Iesum filium Iosedech sacerdotem magnum et ad reliquos populi dicens"
      en: "Speak to Zorobabel the son of Salathiel the governor of Juda, and to Jesus the son of Josedec the high priest, and to the rest of the people, saying:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quis in vobis est derelictus qui vidit domum istam in gloria sua prima et quid vos videtis hanc nunc numquid non ita est quasi non sit in oculis vestris"
      en: "Who is left among you, that saw this house in its first glory? and how do you see it now? is it not in comparison to that as nothing in your eyes?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et nunc confortare Zorobabel dicit Dominus et confortare Iesu fili Iosedech sacerdos magne et confortare omnis popule terrae dicit Dominus exercituum et facite quoniam ego vobiscum sum dicit Dominus exercituum"
      en: "Yet now take courage, O Zorobabel, saith the Lord, and take courage, O Jesus the son of Josedec the high priest, and take courage, all ye people of the land, saith the Lord of hosts: and perform (for I am with you, saith the Lord of hosts)"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "verbum quod placui vobiscum cum egrederemini de terra Aegypti et spiritus meus erit in medio vestrum nolite timere"
      en: "The word that I covenanted with you when you came out of the land of Egypt: and my spirit shall be in the midst of you: fear not."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quia haec dicit Dominus exercituum adhuc unum modicum est et ego commovebo caelum et terram et mare et aridam"
      en: "For thus saith the Lord of hosts: Yet one little while, and I will move the heaven and the earth, and the sea, and the dry land."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et movebo omnes gentes et veniet desideratus cunctis gentibus et implebo domum istam gloria dicit Dominus exercituum"
      en: "And I will move all nations: AND THE DESIRED OF ALL NATIONS SHALL COME: and I will fill this house with glory: saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "meum est argentum et meum est aurum dicit Dominus exercituum"
      en: "The silver is mine, and the gold is mine, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "magna erit gloria domus istius novissimae plus quam primae dicit Dominus exercituum et in loco isto dabo pacem dicit Dominus exercituum"
      en: "Great shall be the glory of this last house more than of the first, saith the Lord of hosts: and in this place I will give peace, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in vicesima et quarta noni mensis in anno secundo Darii factum est verbum Domini ad Aggeum prophetam dicens"
      en: "In the four and twentieth day of the ninth month, in the second year of Darius the king, the word of the Lord came to Aggeus the prophet, saying:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "haec dicit Dominus exercituum interroga sacerdotes legem dicens"
      en: "Thus saith the Lord of hosts: Ask the priests the law, saying:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "si tulerit homo carnem sanctificatam in ora vestimenti sui et tetigerit de summitate eius panem aut pulmentum aut vinum aut oleum aut omnem cibum numquid sanctificabitur respondentes autem sacerdotes dixerunt non"
      en: "If a man carry sanctified flesh in the skirt of his garment, and touch with his skirt, bread, or pottage, or wine, or oil, or any meat: shall it be sanctified? And the priests answered, and said: No."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et dixit Aggeus si tetigerit pollutus in anima ex omnibus his numquid contaminabitur et responderunt sacerdotes et dixerunt contaminabitur"
      en: "And Aggeus said: If one that is unclean by occasion of a soul touch any of all these things, shall it be defiled? And the priests answered, and said: It shall be defiled."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et respondit Aggeus et dixit sic populus iste et sic gens ista ante faciem meam dicit Dominus et sic omne opus manuum eorum et omnia quae obtulerint ibi contaminata erunt"
      en: "And Aggeus answered, and said: So is this people, and so is this nation before my face, saith the Lord, and so is all the work of their hands: and all that they have offered there, shall be defiled."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et nunc ponite corda vestra a die hac et supra antequam poneretur lapis super lapidem in templo Domini"
      en: "And now consider in your hearts, from this day and upward, before there was a stone laid upon a stone in the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "cum accederetis ad acervum viginti modiorum et fierent decem intraretis ad torcular ut exprimeretis quinquaginta lagoenas et fiebant viginti"
      en: "When you went to a heap of twenty bushels, and they became ten: and you went into the press, to press out fifty vessels, and they became twenty."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "percussi vos vento urente et aurugine et grandine omnia opera manuum vestrarum et non fuit in vobis qui reverteretur ad me dicit Dominus"
      en: "I struck you with a blasting wind, and all the works of your hand with the mildew and with hail, yet there was none among you that returned to me, saith the Lord."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ponite corda vestra ex die ista et in futurum a die vicesima et quarta noni mensis a die qua fundamenta iacta sunt templi Domini ponite super cor vestrum"
      en: "Set your hearts from this day, and henceforward, from the four and twentieth day of the ninth month: from the day that the foundations of the temple of the Lord were laid, and lay it up in your hearts."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "numquid iam semen in germine est et adhuc vinea et ficus et malogranatum et lignum olivae non floruit ex die ista benedicam"
      en: "Is the seed as yet sprung up? or hath the vine, and the fig tree, and the pomegranate, and the olive tree as yet flourished? from this day I will bless you."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et factum est verbum Domini secundo ad Aggeum in vicesima et quarta mensis dicens"
      en: "And the word of the Lord came a second time to Aggeus in the four and twentieth day of the month, saying:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "loquere ad Zorobabel ducem Iuda dicens ego movebo caelum pariter et terram"
      en: "Speak to Zorobabel the governor of Juda, saying: I will move both heaven and earth."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et subvertam solium regnorum et conteram fortitudinem regni gentium et subvertam quadrigam et ascensorem eius et descendent equi et ascensores eorum vir in gladio fratris sui"
      en: "And I will overthrow the throne of kingdoms, and will destroy the strength of the kingdom of the Gentiles: and I will overthrow the chariot, and him that rideth therein: and the horses and their riders shall come down, every one by the sword of his brother."
    status: { la: verified, en: verified }
