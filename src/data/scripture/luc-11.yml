# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: luc
chapter: 11
verses:
  - n: 1
    text:
      la: "Et factum est: cum esset in quodam loco orans, ut cessavit, dixit unus ex discipulis ejus ad eum: Domine, doce nos orare, sicut docuit et Joannes discipulos suos."
      en: "And it came to pass, that as he was in a certain place praying, when he ceased, one of his disciples said to him: Lord, teach us to pray, as John also taught his disciples."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et ait illis: Cum oratis, dicite: Pater, sanctificetur nomen tuum. Adveniat regnum tuum."
      en: "And he said to them: When you pray, say: Father, hallowed be thy name. Thy kingdom come."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Panem nostrum quotidianum da nobis hodie."
      en: "Give us this day our daily bread."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et dimitte nobis peccata nostra, siquidem et ipsi dimittimus omni debenti nobis. Et ne nos inducas in tentationem."
      en: "And forgive us our sins, for we also forgive every one that is indebted to us. And lead us not into temptation."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et ait ad illos: Quis vestrum habebit amicum, et ibit ad illum media nocte, et dicet illi: Amice, commoda mihi tres panes,"
      en: "And he said to them: Which of you shall have a friend, and shall go to him at midnight, and shall say to him: Friend, lend me three loaves,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quoniam amicus meus venit de via ad me, et non habeo quod ponam ante illum,"
      en: "Because a friend of mine is come off his journey to me, and I have not what to set before him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et ille de intus respondens dicat: Noli mihi molestus esse, jam ostrium clausum est, et pueri mei mecum sunt in cubili: non possum surgere, et dare tibi."
      en: "And he from within should answer, and say: Trouble me not, the door is now shut, and my children are with me in bed; I cannot rise and give thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et si ille perseveraverit pulsans: dico vobis, etsi non dabit illi surgens eo quod amicus ejus sit, propter improbitatem tamen ejus surget, et dabit illi quotquot habet necessarios."
      en: "Yet if he shall continue knocking, I say to you, although he will not rise and give him, because he is his friend; yet, because of his importunity, he will rise, and give him as many as he needeth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ego dico vobis: Petite, et dabitur vobis; quaerite, et invenietis; pulsate, et aperietur vobis."
      en: "And I say to you, Ask, and it shall be given you: seek, and you shall find: knock, and it shall be opened to you."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Omnis enim qui petit, accipit: et qui quaerit, invenit: et pulsanti aperietur."
      en: "For every one that asketh, receiveth; and he that seeketh, findeth; and to him that knocketh, it shall be opened."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quis autem ex vobis patrem petit panem, numquid lapidem dabit illi? aut piscem, numquid pro pisce serpentem dabit illi?"
      en: "And which of you, if he ask his father bread, will he give him a stone? or a fish, will he for a fish give him a serpent?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "aut si petierit ovum, numquid porriget illi scorpionem?"
      en: "Or if he shall ask an egg, will he reach him a scorpion?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Si ergo vos, cum sitis mali, nostis bona data dare filiis vestris: quanto magis Pater vester de caelo dabit spiritum bonum petentibus se?"
      en: "If you then, being evil, know how to give good gifts to your children, how much more will your Father from heaven give the good Spirit to them that ask him?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et erat ejiciens daemonium, et illud erat mutum. Et cum ejecisset daemonium, locutus est mutus, et admiratae sunt turbae."
      en: "And he was casting out a devil, and the same was dumb: and when he had cast out the devil, the dumb spoke: and the multitudes were in admiration at it:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quidam autem ex eis dixerunt: In Beelzebub principe daemoniorum ejicit daemonia."
      en: "But some of them said: He casteth out devils by Beelzebub, the prince of devils."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et alii tentantes, signum de caelo quaerebant ab eo."
      en: "And others tempting, asked of him a sign from heaven."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ipse autem ut vidit cogitationes eorum, dixit eis: Omne regnum in seipsum divisum desolabitur, et domus supra domum cadet."
      en: "But he seeing their thoughts, said to them: Every kingdom divided against itself, shall be brought to desolation, and house upon house shall fall."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Si autem et Satanas in seipsum divisus est, quomodo stabit regnum ejus? quia dicitis in Beelzebub me ejicere daemonia."
      en: "And if Satan also be divided against himself, how shall his kingdom stand? because you say, that through Beelzebub I cast out devils."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Si autem ego in Beelzebub ejicio daemonia: filii vestri in quo ejiciunt? ideo ipsi judices vestri erunt."
      en: "Now if I cast out devils by Beelzebub; by whom do your children cast them out? Therefore they shall be your judges."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Porro si in digito Dei ejicio daemonia: profecto pervenit in vos regnum Dei."
      en: "But if I by the finger of God cast out devils; doubtless the kingdom of God is come upon you."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Cum fortis armatus custodit atrium suum, in pace sunt ea quae possidet."
      en: "When a strong man armed keepeth his court, those things are in peace which he possesseth."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Si autem fortior eo superveniens vicerit eum, universa arma ejus auferet, in quibus confidebat, et spolia ejus distribuet."
      en: "But if a stronger than he come upon him, and overcome him; he will take away all his armour wherein he trusted, and will distribute his spoils."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Qui non est mecum, contra me est: et qui non colligit mecum, dispergit."
      en: "He that is not with me, is against me; and he that gathereth not with me, scattereth."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Cum immundus spiritus exierit de homine, ambulat per loca inaquosa, quaerens requiem: et non inveniens dicit: Revertar in domum meam unde exivi."
      en: "When the unclean spirit is gone out of a man, he walketh through places without water, seeking rest; and not finding, he saith: I will return into my house whence I came out."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et cum venerit, invenit eam scopis mundatam, et ornatam."
      en: "And when he is come, he findeth it swept and garnished."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Tunc vadit, et assumit septem alios spiritus secum, nequiores se, et ingressi habitant ibi. Et fiunt novissima hominis illius pejora prioribus."
      en: "Then he goeth and taketh with him seven other spirits more wicked than himself, and entering in they dwell there. And the last state of that man becomes worse than the first."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Factum est autem, cum haec diceret: extollens vocem quaedam mulier de turba dixit illi: Beatus venter qui te portavit, et ubera quae suxisti."
      en: "And it came to pass, as he spoke these things, a certain woman from the crowd, lifting up her voice, said to him: Blessed is the womb that bore thee, and the paps that gave thee suck."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "At ille dixit: Quinimmo beati, qui audiunt verbum Dei et custodiunt illud."
      en: "But he said: Yea rather, blessed are they who hear the word of God, and keep it."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Turbis autem concurrentibus coepit dicere: Generatio haec, generatio nequam est: signum quaerit, et signum non dabitur ei, nisi signum Jonae prophetae."
      en: "And the multitudes running together, he began to say: This generation is a wicked generation: it asketh a sign, and a sign shall not be given it, but the sign of Jonas the prophet."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Nam sicut fuit Jonas signum Ninivitis, ita erit et Filius hominis generationi isti."
      en: "For as Jonas was a sign to the Ninivites; so shall the Son of man also be to this generation."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Regina austri surget in judicio cum viris generationis hujus, et condemnabit illos: quia venit a finibus terrae audire sapientiam Salomonis: et ecce plus quam Salomon hic."
      en: "The queen of the south shall rise in the judgment with the men of this generation, and shall condemn them: because she came from the ends of the earth to hear the wisdom of Solomon; and behold more than Solomon here."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Viri Ninivitae surgent in judicio cum generatione hac, et condemnabunt illam: quia poenitentiam egerunt ad praedicationem Jonae, et ecce plus quam Jonas hic."
      en: "The men of Ninive shall rise in the judgment with this generation, and shall condemn it; because they did penance at the preaching of Jonas; and behold more than Jonas here."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Nemo lucernam accendit, et in abscondito ponit, neque sub modio: sed supra candelabrum, ut qui ingrediuntur, lumen videant."
      en: "No man lighteth a candle, and putteth it in a hidden place, nor under a bushel; but upon a candlestick, that they that come in, may see the light."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Lucerna corporis tui est oculus tuus. Si oculus tuus fuerit simplex, totum corpus tuum lucidum erit: si autem nequam fuerit, etiam corpus tuum tenebrosum erit."
      en: "The light of thy body is thy eye. If thy eye be single, thy whole body will be lightsome: but if it be evil, thy body also will be darksome."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Vide ergo ne lumen quod in te est, tenebrae sint."
      en: "Take heed therefore, that the light which is in thee, be not darkness."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Si ergo corpus tuum totum lucidum fuerit, non habens aliquam partem tenebrarum, erit lucidum totum, et sicut lucerna fulgoris illuminabit te."
      en: "If then thy whole body be lightsome, having no part of darkness; the whole shall be lightsome; and as a bright lamp, shall enlighten thee."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et cum loqueretur, rogavit illum quidam pharisaeus ut pranderet apud se. Et ingressus recubuit."
      en: "And as he was speaking, a certain Pharisee prayed him, that he would dine with him. And he going in, sat down to eat."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Pharisaeus autem coepit intra se reputans dicere, quare non baptizatus esset ante prandium."
      en: "And the Pharisee began to say, thinking within himself, why he was not washed before dinner."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et ait Dominus ad illum: Nunc vos pharisaei, quod deforis est calicis et catini, mundatis: quod autem intus est vestrum, plenum est rapina et iniquitate."
      en: "And the Lord said to him: Now you Pharisees make clean the outside of the cup and of the platter; but your inside is full of rapine and iniquity."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Stulti nonne qui fecit quod deforis est, etiam id quod deintus est fecit?"
      en: "Ye fools, did not he that made that which is without, make also that which is within?"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Verumtamen quod superest, date eleemosynam: et ecce omnia munda sunt vobis."
      en: "But yet that which remaineth, give alms; and behold, all things are clean unto you."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Sed vae vobis, pharisaeis, quia decimatis mentham, et rutam, et omne olus, et praeteritis judicium et caritatem Dei: haec autem oportuit facere, et illa non omittere."
      en: "But woe to you, Pharisees, because you tithe mint and rue and every herb; and pass over judgment, and the charity of God. Now these things you ought to have done, and not to leave the other undone."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Vae vobis, pharisaeis, quia diligitis primas cathedras in synagogis, et salutationes in foro."
      en: "Woe to you, Pharisees, because you love the uppermost seats in the synagogues, and salutations in the marketplace."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Vae vobis, quia estis ut monumenta, quae non apparent, et homines ambulantes supra, nesciunt."
      en: "Woe to you, because you are as sepulchres that appear not, and men that walk over are not aware."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Respondens autem quidam ex legisperitis, ait illi: Magister, haec dicens etiam contumeliam nobis facis."
      en: "And one of the lawyers answering, saith to him: Master, in saying these things, thou reproachest us also."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "At ille ait: Et vobis legisperitis vae: quia oneratis homines oneribus, quae portare non possunt, et ipsi uno digito vestro non tangitis sarcinas."
      en: "But he said: Woe to you lawyers also, because you load men with burdens which they cannot bear, and you yourselves touch not the packs with one of your fingers."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Vae vobis, qui aedificatis monumenta prophetarum: patres autem vestri occiderunt illos."
      en: "Woe to you who build the monuments of the prophets: and your fathers killed them."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Profecto testificamini quod consentitis operibus patrum vestrorum: quoniam ipsi quidem eos occiderunt, vos autem aedificatis eorum sepulchra."
      en: "Truly you bear witness that you consent to the doings of your fathers: for they indeed killed them, and you build their sepulchres."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Propterea et sapientia Dei dixit: Mittam ad illos prophetas, et apostolos, et ex illis occident, et persequentur:"
      en: "For this cause also the wisdom of God said: I will send to them prophets and apostles; and some of them they will kill and persecute."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "ut inquiratur sanguis omnium prophetarum, qui effusus est a constitutione mundi a generatione ista,"
      en: "That the blood of all the prophets which was shed from the foundation of the world, may be required of this generation,"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "a sanguine Abel, usque ad sanguinem Zachariae, qui periit inter altare et aedem. Ita dico vobis, requiretur ab hac generatione."
      en: "From the blood of Abel unto the blood of Zacharias, who was slain between the altar and the temple: Yea I say to you, It shall be required of this generation."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Vae vobis, legisperitis, quia tulistis clavem scientiae: ipsi non introistis, et eos qui introibant, prohibuistis."
      en: "Woe to you lawyers, for you have taken away the key of knowledge: you yourselves have not entered in, and those that were entering in, you have hindered."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Cum autem haec ad illos diceret, coeperunt pharisaei et legisperiti graviter insistere, et os ejus opprimere de multis,"
      en: "And as he was saying these things to them, the Pharisees and the lawyers began violently to urge him, and to oppress his mouth about many things,"
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "insidiantes ei, et quaerentes aliquid capere de ore ejus, ut accusarent eum."
      en: "Lying in wait for him, and seeking to catch something from his mouth, that they might accuse him."
    status: { la: verified, en: verified }
