# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sap
chapter: 14
verses:
  - n: 1
    text:
      la: "Iterum alius navigare cogitans, et per feros fluctus iter facere incipiens, ligno portante se, fragilius lignum invocat."
      en: "Again, another designing to sail, and beginning to make his voyage through the raging waves, calleth upon a piece of wood more frail than the wood that carrieth him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Illud enim cupiditas acquirendi excogitavit, et artifex sapientia fabricavit sua."
      en: "For this the desire of gain devised, and the workman built it by his skill."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tua autem, Pater, providentia gubernat: quoniam dedisti et in mari viam, et inter fluctus semitam firmissimam,"
      en: "But thy providence, O Father, governeth it: for thou hast made a way even in the sea, and a most sure path among the waves,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ostendens quoniam potens es ex omnibus salvare, etiam si sine arte aliquis adeat mare."
      en: "shewing that thou art able to save out of all things, yea though a man went to sea without art."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Sed ut non essent vacua sapientiae tuae opera, propter hoc etiam et exiguo ligno credunt homines animas suas, et transeuntes mare per ratem liberati sunt."
      en: "But that the works of thy wisdom might not be idle: therefore men also trust their lives even to a little wood, and passing over the sea by ship are saved."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Sed et ab initio cum perirent superbi gigantes, spes orbis terrarum ad ratem confugiens, remisit saeculo semen nativitatis quae manu tua erat gubernata."
      en: "And from the beginning also when the proud giants perished, the hope of the world fleeing to a vessel, which was governed by thy hand, left to the world seed of generation."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Benedictum est enim lignum per quod fit justitia;"
      en: "For blessed is the wood, by which justice cometh."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "per manus autem quod fit idolum, maledictum est et ipsum, et qui fecit illud; quia ille quidem operatus est, illud autem cum esset fragile, deus cognominatus est."
      en: "But the idol that is made by hands, is cursed, as well it, as he that made it: he because he made it; and it because being frail it is called a god."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Similiter autem odio sunt Deo impius et impietas ejus;"
      en: "But to God the wicked and his wickedness are hateful alike."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "etenim quod factum est, cum illo qui fecit tormenta patietur."
      en: "For that which is made, together with him that made it, shall suffer torments."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Propter hoc et in idolis nationum non erit respectus, quoniam creaturae Dei in odium factae sunt, et in tentationem animabus hominum, et in muscipulam pedibus insipientium."
      en: "Therefore there shall be no respect had even to the idols of the Gentiles: because the creatures of God are turned to an abomination, and a temptation to the souls of men, and a snare to the feet of the unwise."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Initium enim fornicationis est exquisitio idolorum; et adinventio illorum corruptio vitae est:"
      en: "For the beginning of fornication is the devising of idols: and the invention of them is the corruption of life."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "neque enim erant ab initio, neque erunt in perpetuum."
      en: "For neither were they from the beginning, neither shall they be for ever."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Supervacuitas enim hominum haec advenit in orbem terrarum; et ideo brevis illorum finis est inventus."
      en: "For by the vanity of men they came into the world: and therefore they shall be found to come shortly to an end."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Acerbo enim luctu dolens pater, cito sibi rapti filii fecit imaginem; et illum qui tunc quasi homo mortuus fuerat, nunc tamquam deum colere coepit, et constituit inter servos suos sacra et sacrificia."
      en: "For a father being afflicted with bitter grief, made to himself the image of his son who was quickly taken away: and him who then had died as a man, he began now to worship as a god, and appointed him rites and sacrifices among his servants."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Deinde interveniente tempore, convalescente iniqua consuetudine, hic error tamquam lex custoditus est, et tyrannorum imperio colebantur figmenta."
      en: "Then in process of time, wicked custom prevailing, this error was kept as a law, and statues were worshipped by the commandment of tyrants."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et hos quos in palam homines honorare non poterant propter hoc quod longe essent, e longinquo figura eorum allata, evidentem imaginem regis quem honorare volebant fecerunt, ut illum qui aberat, tanquam praesentem colerent sua sollicitudine."
      en: "And those whom men could not honour in presence, because they dwelt far off, they brought their resemblance from afar, and made an express image of the king whom they had a mind to honour: that by this their diligence, they might honour as present, him that was absent."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Provexit autem ad horum culturam et hos qui ignorabant artificis eximia diligentia."
      en: "And to worshipping of these, the singular diligence also of the artificer helped to set forward the ignorant."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ille enim, volens placere illi qui se assumpsit, elaboravit arte sua ut similitudinem in melius figuraret."
      en: "For he being willing to please him that employed him, laboured with all his art to make the resemblance in the best manner."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Multitudo autem hominum, abducta per speciem operis, eum qui ante tempus tanquam homo honoratus fuerat, nunc deum aestimaverunt."
      en: "And the multitude of men, carried away by the beauty of the work, took him now for a god that a little before was but honoured as a man."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et haec fuit vitae humanae deceptio, quoniam aut affectui, aut regibus deservientes homines, incommunicabile nomen lapidibus et lignis imposuerunt."
      en: "And this was the occasion of deceiving human life: for men serving either their affection, or their kings, gave the incommunicable name to stones and wood."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et non suffecerat errasse eos circa Dei scientiam, sed et in magno viventes inscientiae bello, tot et tam magna mala pacem appellant."
      en: "And it was not enough for them to err about the knowledge of God, but whereas they lived in a great war of ignorance, they call so many and so great evils peace."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Aut enim filios suos sacrificantes, aut obscura sacrificia facientes, aut insaniae plenas vigilias habentes,"
      en: "For either they sacrifice their own children, or use hidden sacrifices, or keep watches full of madness,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "neque vitam, neque nuptias mundas jam custodiunt: sed alius alium per invidiam occidit, aut adulterans contristat;"
      en: "So that now they neither keep life, nor marriage undefiled, but one killeth another through envy, or grieveth him by adultery:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et omnia commista sunt: sanguis, homicidium, furtum et fictio, corruptio et infidelitas, turbatio et perjurium, tumultus bonorum,"
      en: "And all things are mingled together, blood, murder, theft and dissimulation, corruption and unfaithfulness, tumults and perjury, disquieting of the good,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Dei immemoratio, animarum inquinatio. Nativitatis immutatio, nuptiarum inconstantia, inordinatio moechiae et impudicitiae."
      en: "Forgetfulness of God, defiling of souls, changing of nature, disorder in marriage, and the irregularity of adultery and uncleanness."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Infandorum enim idolorum cultura omnis mali causa est, et initium et finis."
      en: "For the worship of abominable idols is the cause, and the beginning and end of all evil."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Aut enim dum laetantur insaniunt, aut certe vaticinantur falsa, aut vivunt injuste, aut pejerant cito."
      en: "For either they are mad when they are merry: or they prophesy lies, or they live unjustly, or easily forswear themselves."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Dum enim confidunt in idolis quae sine anima sunt, male jurantes noceri se non sperant."
      en: "For whilst they trust in idols, which are without life, though they swear amiss, they look not to be hurt."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Utraque ergo illis evenient digne, quoniam male senserunt de Deo, attendentes idolis, et juraverunt injuste, in dolo contemnentes justitiam."
      en: "But for two things they shall be justly punished, because they have thought not well of God, giving heed to idols, and have sworn unjustly, in guile despising justice."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Non enim juratorum virtus, sed peccantium poena, perambulat semper injustorum praevaricationem."
      en: "For it is not the power of them, by whom they swear, but the just vengeance of sinners always punisheth the transgression of the unjust."
    status: { la: verified, en: verified }
