# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 13
verses:
  - n: 1
    text:
      la: "Profectusque est populus de Haseroth, fixis tentoriis in deserto Pharan."
      en: "And the people marched from Haseroth, and pitched their tents in the desert of Pharan."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ibique locutus est Dominus ad Moysen, dicens:"
      en: "And there the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Mitte viros, qui considerent terram Chanaan, quam daturus sum filiis Israel, singulos de singulis tribubus, ex principibus."
      en: "Send men to view the land of Chanaan, which I will give to the children of Israel, one of every tribe, of the rulers."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Fecit Moyses quod Dominus imperaverat, de deserto Pharan mittens principes viros, quorum ista sunt nomina."
      en: "Moses did what the Lord had commanded, sending from the desert of Pharan, principal men, whose names are these:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "De tribu Ruben, Sammua filium Zechur."
      en: "Of the tribe of Ruben, Sammua the son of Zechur."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "De tribu Simeon, Saphat filium Huri."
      en: "Of the tribe of Simeon, Saphat the son of Hurl."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "De tribu Juda, Caleb filium Jephone."
      en: "Of the tribe of Juda, Caleb the son of Jephone."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "De tribu Issachar, Igal filium Joseph."
      en: "Of the tribe of Issachar, Igal the son of Joseph."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "De tribu Ephraim, Osee filium Nun."
      en: "Of the tribe of Ephraim, Osee the son of Nun."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "De tribu Benjamin, Phalti filium Raphu."
      en: "Of the tribe of Benjamin, Phalti the son of Raphu."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "De tribu Zabulon, Geddiel filium Sodi."
      en: "Of the tribe of Zabulon, Geddiel the son of Sodi."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "De tribu Joseph, sceptri Manasse, Gaddi filium Susi."
      en: "Of the tribe of Joseph, of the sceptre of Manasses, Gaddi the son of Susi."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "De tribu Dan, Ammiel filium Gemalli."
      en: "Of the tribe of Dan, Ammiel the son of Gemalli."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "De tribu Aser, Sthur filium Michael."
      en: "Of the tribe of Aser, Sthur the son of Michael."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "De tribu Nephthali, Nahabi filium Vapsi."
      en: "Of the tribe of Nephtali, Nahabi the son of Vapsi."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "De tribu Gad, Guel filium Machi."
      en: "Of the tribe of Gad, Guel the son of Machi."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Haec sunt nomina virorum, quos misit Moyses ad considerandam terram: vocavitque Osee filium Nun, Josue."
      en: "These are the names of the men, whom Moses sent to view the land: and he called Osee the son of Nun, Josue."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Misit ergo eos Moyses ad considerandam terram Chanaan, et dixit ad eos: Ascendite per meridianam plagam. Cumque veneritis ad montes,"
      en: "And Moses sent them to view the land of Chanaan, and said to them: Go you up by the south side. And when you shall come to the mountains,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "considerate terram, qualis sit: et populum qui habitator est ejus, utrum fortis sit an infirmus: si pauci numero an plures:"
      en: "View the land, of what sort it is: and the people that are the inhabitants thereof, whether they be strong or weak: few in number or many:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ipsa terra, bona an mala: urbes quales, muratae an absque muris:"
      en: "The land itself, whether it be good or bad: what manner of cities, walled or without walls:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "humus, pinguis an sterilis, nemorosa an absque arboribus. Confortamini, et afferte nobis de fructibus terrae. Erat autem tempus quando jam praecoquae uvae vesci possunt."
      en: "The ground, fat or barren, woody or without trees. Be of good courage, and bring us of the fruits of the land. Now it was the time when the first ripe grapes are fit to be eaten."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Cumque ascendissent, exploraverunt terram a deserto Sin, usque Rohob intrantibus Emath."
      en: "And when they were gone up, they viewed the land from the desert of Sin, unto Rohob as you enter into Emath."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ascenderuntque ad meridiem, et venerunt in Hebron, ubi erant Achiman et Sisai et Tholmai filii Enac: nam Hebron septem annis ante Tanim urbem Aegypti condita est."
      en: "And they went up at the south side, and came to Hebron, where were Achiman and Sisai and Tholmai the sons of Enac. For Hebron was built seven years before Tanis the city of Egypt."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Pergentesque usque ad Torrentem botri, absciderunt palmitem cum uva sua, quem portaverunt in vecte duo viri. De malis quoque granatis et de ficis loci illius tulerunt:"
      en: "And going forward as far as the torrent of the cluster of grapes, they cut off a branch with its cluster of grapes, which two men carried upon a lever. They took also of the pomegranates and of the figs of that place:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "qui appellatus est Nehelescol, id est Torrens botri, eo quod botrum portassent inde filii Israel."
      en: "Which was called Nehelescol, that is to say, the torrent of the cluster of grapes, because from thence the children of Israel had carried a cluster of grapes."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Reversique exploratores terrae post quadraginta dies, omni regione circuita,"
      en: "And they that went to spy out the land returned after forty days, having gone round all the country,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "venerunt ad Moysen et Aaron et ad omnem coetum filiorum Israel in desertum Pharan, quod est in Cades. Locutique eis et omni multitudini ostenderunt fructus terrae:"
      en: "And came to Moses and Aaron and to all the assembly of the children of Israel to the desert of Pharan, which is in Cades. And speaking to them and to all the multitude, they shewed them the fruits of the land:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et narraverunt, dicentes: Venimus in terram, ad quam misisti nos, quae revera fluit lacte et melle, ut ex his fructibus cognosci potest:"
      en: "And they related and said: We came into the land to which thou sentest us, which in very deed floweth with milk and honey as may be known by these fruits:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "sed cultores fortissimos habet, et urbes grandes atque muratas. Stirpem Enac vidimus ibi."
      en: "But it hath very strong inhabitants, and the cities are great and walled. We saw there the race of Enac."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Amalec habitat in meridie, Hethaeus et Jebusaeus et Amorrhaeus in montanis: Chananaeus vero moratur juxta mare et circa fluenta Jordanis."
      en: "Amalec dwelleth in the south, the Hethite and the Jebusite and the Amorrhite in the mountains: but the Chanaanite abideth by the sea and near the streams of the Jordan."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Inter haec Caleb compescens murmur populi, qui oriebatur contra Moysen, ait: Ascendamus, et possideamus terram, quoniam poterimus obtinere eam."
      en: "In the mean time Caleb, to still the murmuring of the people that rose against Moses, said: Let us go up and possess the land, for we shall be able to conquer it."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Alii vero, qui fuerant cum eo, dicebant: Nequaquam ad hunc populum valemus ascendere, quia fortior nobis est."
      en: "But the others, that had been with him, said: No, we are not able to go up to this people, because they are stronger than we."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Detraxeruntque terrae, quam inspexerant, apud filios Israel, dicentes: Terra, quam lustravimus, devorat habitatores suos: populus, quem aspeximus, procerae staturae est."
      en: "And they spoke ill of the land, which they had viewed, before the children of Israel, saying: The land which we have viewed, devoureth its inhabitants: the people, that we beheld, are of a tall stature."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Ibi vidimus monstra quaedam filiorum Enac de genere giganteo: quibus comparati, quasi locustae videbamur."
      en: "There we saw certain monsters of the sons of Enac, of the giant kind: in comparison of whom, we seemed like locusts."
    status: { la: verified, en: verified }
