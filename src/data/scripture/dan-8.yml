# Douay-Rheims + Latin Vulgate, from drbo.org (Douay-Rheims Bible
# Online) -- the "DR + LV" combined page keeps every verse's Latin
# and English paired in the same block, avoiding the verse-
# misalignment this project's first-pass "Unbound Bible" source had
# for dan 8 specifically; see TODO.md's bulk scripture import entry.
book: dan
chapter: 8
verses:
  - n: 1
    text:
      la: "Anno tertio regni Baltassar regis, visio apparuit mihi. Ego Daniel, post id quod videram in principio,"
      en: "In the third year of the reign of king Baltasar, a vision appeared to me. I Daniel, after what I had seen in the beginning,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "vidi in visione mea, cum essem in Susis castro, quod est in Aelam regione : vidi autem in visione esse me super portam Ulai."
      en: "Saw in my vision when I was in the castle of Susa, which is in the province of Elam: and I saw in the vision that I was over the gate of Ulai."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et levavi oculus meos, et vidi : et ecce aries unus stabat ante paludem, habens cornua excelsa, et unum excelsius altero atque succrescens. Postea"
      en: "And I lifted up my eyes, and saw: and behold a ram stood before the water, having two high horns, and one higher than the other, and growing up."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "vidi arietem cornibus ventilantem contra occidentem, et contra aquilonem, et contra meridiem, et omnes bestiae non poterant resistere ei, neque liberari de manu ejus : fecitque secundum voluntatem suam, et magnificatus est."
      en: "Afterward I saw the ram pushing with his horns against the west, and against the north, and against the south: and no beasts could withstand him, nor be delivered out of his hand: and he did according to his own will, and became great."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et ego intelligebam : ecce autem hircus caprarum veniebat ab occidente super faciem totius terrae, et non tangebat terram : porro hircus habebat cornu insigne inter oculos suos."
      en: "And I understood: and behold a he goat came from the west on the face of the whole earth, and he touched not the ground, and the he goat had a notable horn between his eyes."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et venit usque ad arietem illum cornutum, quem videram stantem ante portam, et cucurrit ad eum in impetu fortitudinis suae."
      en: "And he went up to the ram that had the horns, which I had seen standing before the gate, and he ran towards him in the force of his strength."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cumque appropinquasset prope arietem, efferatus est in eum, et percussit arietem : et comminuit duo cornua ejus, et non poterat aries resistere ei : cumque eum misisset in terram, conculcavit, et nemo quibat liberare arietem de manu ejus."
      en: "And when he was come near the ram, he was enraged against him, and struck the ram: and broke his two horns, and the ram could not withstand him: and when he had cast him down on the ground, he stamped upon him, and none could deliver the ram out of his hand."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Hircus autem caprarum magnus factus est nimis : cumque crevisset, fractum est cornu magnum, et orta sunt quatuor cornua subter illud per quatuor ventos caeli."
      en: "And the he goat became exceeding great: and when he was grown, the great horn was broken, and there came up four horns under it towards the four winds of heaven."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "De uno autem ex eis egressum est cornu unum modicum : et factum est grande contra meridiem, et contra orientem, et contra fortitudinem."
      en: "And out of one of them came forth a little horn: and it became great against the south, and against the east, and against the strength."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et magnificatum est usque ad fortitudinem caeli : et dejecit de fortitudine, et de stellis, et conculcavit eas."
      en: "And it was magnified even unto the strength of heaven: and it threw down of the strength, and of the stars, and trod upon them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et usque ad principem fortitudinis magnificatum est : et ab eo tulit juge sacrificium, et dejecit locum sanctificationis ejus."
      en: "And it was magnified even to the prince of the strength: and it took away from him the continual sacrifice, and cast down the place of his sanctuary."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Robur autem datum est ei contra juge sacrificium propter peccata : et prosternetur veritas in terra, et faciet, et prosperabitur."
      en: "And strength was given him against the continual sacrifice, because of sins: and truth shall be cast down on the ground, and he shall do and shall prosper."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et audivi unum de sanctis loquentem : et dixit unus sanctus alteri nescio cui loquenti : Usquequo visio, et juge sacrificium, et peccatum desolationis quae facta est : et sanctuarium, et fortitudo conculcabitur?"
      en: "And I heard one of the saints speaking, and one saint said to another, I know not to whom that was speaking: How long shall be the vision, concerning the continual sacrifice, and the sin of the desolation that is made: and the sanctuary, and the strength be trodden under foot?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et dixit ei : Usque ad vesperam et mane, dies duo millia trecenti : et mundabitur sanctuarium."
      en: "And he said to him: Unto evening and morning two thousand three hundred days: and the sanctuary shall be cleansed."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Factum est autem cum viderem ego Daniel visionem, et quaererem intelligentiam : ecce stetit in conspectu meo quasi species viri."
      en: "And it came to pass when I Daniel saw the vision, and sought the meaning, that behold there stood before me as it were the appearance of a man."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et audivi vocem viri inter Ulai : et clamavit, et ait : Gabriel, fac intelligere istam visionem."
      en: "And I heard the voice of a man between Ulai: and he called, and said: Gabriel, make this man to understand the vision."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et venit, et stetit juxta ubi ego stabam : cumque venisset, pavens corrui in faciem meam : et ait ad me : Intellige, fili hominis, quoniam in tempore finis complebitur visio."
      en: "And he came and stood near where I stood: and when he was come, I fell on my face trembling, and he said to me: Understand, O son of man, for in the time of the end the vision shall be fulfilled."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Cumque loqueretur ad me, collapsus sum pronus in terram : et tetigit me, et statuit me in gradu meo,"
      en: "And when he spoke to me I fell flat on the ground: and he touched me, and set me upright,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "dixitque mihi : Ego ostendam tibi quae futura sunt in novissimo maledictionis : quoniam habet tempus finem suum."
      en: "And he said to me: I will shew thee what things are to come to pass in the end of the malediction: for the time hath its end."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Aries, quem vidisti habere cornua, rex Medorum est atque Persarum."
      en: "The ram, which thou sawest with horns, is the king of the Medes and Persians."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Porro hircus caprarum, rex Graecorum est; et cornu grande, quod erat inter oculos ejus, ipse est rex primus."
      en: "And the he goat, is the king of the Greeks, and the great horn that was between his eyes, the same is the first king."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Quod autem fracto illo surrexerunt quatuor pro eo : quatuor reges de gente ejus consurgent, sed non in fortitudine ejus."
      en: "But whereas when that was broken, there arose up four for it: four kings shall rise up of his nation, but not with his strength."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et post regnum eorum, cum creverint iniquitates, consurget rex impudens facie, et intelligens propositiones;"
      en: "And after their reign, when iniquities shall be grown up, there shall arise a king of a shameless face, and understanding dark sentences."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et roborabitur fortitudo ejus, sed non in viribus suis : et supra quam credi potest, universa vastabit, et prosperabitur, et faciet. Et interficiet robustos, et populum sanctorum"
      en: "And his power shall be strengthened, but not by his own force: and he shall lay all things waste, and shall prosper, and do more than can be believed. And he shall destroy the mighty, and the people of the saints,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "secundum voluntatem suam, et dirigetur dolus in manu ejus : et cor suum magnificabit, et in copia rerum omnium occidet plurimos : et contra principem principum consurget, et sine manu conteretur."
      en: "According to his will, and craft shall be successful in his hand: and his heart shall be puffed up, and in the abundance of all things he shall kill many: and he shall rise up against the prince of princes, and shall be broken without hand."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et visio vespere et mane, quae dicta est, vera est : tu ergo visionem signa, quia post multos dies erit."
      en: "And the vision of the evening and the morning, which was told, is true: thou therefore seal up the vision, because it shall come to pass after many days."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et ego Daniel langui, et aegrotavi per dies : cumque surrexissem, faciebam opera regis, et stupebam ad visionem, et non erat qui interpretaretur."
      en: "And I Daniel languished, and was sick for some days: and when I was risen up, I did the king's business, and I was astonished at the vision, and there was none that could interpret it."
    status: { la: verified, en: verified }
