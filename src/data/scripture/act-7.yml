# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: act
chapter: 7
verses:
  - n: 1
    text:
      la: "Dixit autem princeps sacerdotum: Si haec ita se habent?"
      en: "Then the high priest said: Are these things so?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Qui ait: Viri fratres et patres, audite: Deus gloriae apparuit patri nostro Abrahae cum esset in Mesopotamia, prius quam moraretur in Charan,"
      en: "Who said: Ye men, brethren, and fathers, hear. The God of glory appeared to our father Abraham, when he was in Mesopotamia, before he dwelt in Charan."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dixit ad illum: Exi de terra tua, et de cognatione tua, et veni in terram quam monstravero tibi."
      en: "And said to him: Go forth out of thy country, and from thy kindred, and come into the land which I shall shew thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Tunc exiit de terra Chaldaeorum, et habitavit in Charan. Et inde, postquam mortuus est pater ejus, transtulit illum in terram istam, in qua nunc vos habitatis."
      en: "Then he went out of the land of the Chaldeans, and dwelt in Charan. And from thence, after his father was dead, he removed him into this land, wherein you now dwell."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et non dedit illi haereditatem in ea, nec passum pedis: sed repromisit dare illi eam in possessionem, et semini ejus post ipsum, cum non haberet filium."
      en: "And he gave him no inheritance in it; no, not the pace of a foot: but he promised to give it him in possession, and to his seed after him, when as yet he had no child."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Locutus est autem ei Deus: Quia erit semen ejus accola in terra aliena, et servituti eos subjicient, et male tractabunt eos annis quadringentis:"
      en: "And God said to him: That his seed should sojourn in a strange country, and that they should bring them under bondage, and treat them evil four hundred years."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et gentem cui servierint, judicabo ego, dixit Dominus: et post haec exibunt, et servient mihi in loco isto."
      en: "And the nation which they shall serve will I judge, said the Lord; and after these things they shall go out, and shall serve me in this place."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et dedit illi testamentum circumcisionis: et sic genuit Isaac, et circumcidit eum die octavo: et Isaac, Jacob: et Jacob, duodecim patriarchas."
      en: "And he gave him the covenant of circumcision, and so he begot Isaac, and circumcised him the eighth day; and Isaac begot Jacob; and Jacob the twelve patriarchs."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et patriarchae aemulantes, Joseph vendiderunt in Aegyptum, et erat Deus cum eo:"
      en: "And the patriarchs, through envy, sold Joseph into Egypt; and God was with him,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et eripuit eum ex omnibus tribulationibus ejus: et dedit ei gratiam et sapientiam in conspectu pharaonis regis Aegypti, et constituit eum praepositum super Aegyptum, et super omnem domum suam."
      en: "And delivered him out of all his tribulations: and he gave him favour and wisdom in the sight of Pharao, the king of Egypt; and he appointed him governor over Egypt, and over all his house."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Venit autem fames in universam Aegyptum, et Chanaan, et tribulatio magna: et non inveniebant cibos patres nostri."
      en: "Now there came a famine upon all Egypt and Chanaan, and great tribulation; and our fathers found no food."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cum audisset autem Jacob esse frumentum in Aegypto, misit patres nostros primum:"
      en: "But when Jacob had heard that there was corn in Egypt, he sent our fathers first:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et in secundo cognitus est Joseph a fratribus suis, et manifestatum est Pharaoni genus ejus."
      en: "And at the second time, Joseph was known by his brethren, and his kindred was made known to Pharao."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Mittens autem Joseph accersivit Jacob patrem suum, et omnem cognationem suam in animabus septuaginta quinque."
      en: "And Joseph sending, called thither Jacob, his father, and all his kindred, seventy-five souls."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et descendit Jacob in Aegyptum: et defunctus est ipse, et patres nostri."
      en: "So Jacob went down into Egypt; and he died, and our fathers."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et translati sunt in Sichem, et positi sunt in sepulchro, quod emit Abraham pretio argenti a filiis Hemor filii Sichem."
      en: "And they were translated into Sichem, and were laid in the sepulchre, that Abraham bought for a sum of money of the sons of Hemor, the son of Sichem."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cum autem appropinquaret tempus promissionis, quam confessus erat Deus Abrahae, crevit populus, et multiplicatus est in Aegypto,"
      en: "And when the time of the promise drew near, which God had promised to Abraham, the people increased, and were multiplied in Egypt,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quoadusque surrexit alius rex in Aegypto, qui non sciebat Joseph."
      en: "Till another king arose in Egypt, who knew not Joseph."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Hic circumveniens genus nostrum, afflixit patres nostros ut exponerent infantes suos, ne vivificarentur."
      en: "This same dealing craftily with our race, afflicted our fathers, that they should expose their children, to the end they might not be kept alive."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Eodem tempore natus est Moyses et fuit gratus Deo, qui nutritus est tribus mensibus in domo patris sui."
      en: "At the same time was Moses born, and he was acceptable to God: who was nourished three months in his father's house."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Exposito autem illo, sustulit eum filia Pharaonis, et nutrivit eum sibi in filium."
      en: "And when he was exposed, Pharao's daughter took him up, and nourished him for her own son."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et eruditus est Moyses omni sapientia Aegyptiorum, et erat potens in verbis, et in operibus suis."
      en: "And Moses was instructed in all the wisdom of the Egyptians; and he was mighty in his words and in his deeds."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cum autem impleretur ei quadraginta annorum tempus, ascendit in cor ejus ut visitaret fratres suos filios Israel."
      en: "And when he was full forty years old, it came into his heart to visit his brethren, the children of Israel."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et cum vidisset quemdam injuriam patientem, vindicavit illum, et fecit ultionem ei qui injuriam sustinebat, percusso Aegyptio."
      en: "And when he had seen one of them suffer wrong, he defended him; and striking the Egyptian, he avenged him who suffered the injury."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Existimabat autem intelligere fratres, quoniam Deus per manum ipsius daret salutem illis: at illi non intellexerunt."
      en: "And he thought that his brethren understood that God by his hand would save them; but they understood it not."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Sequenti vero die apparuit illis litigantibus: et reconciliabat eos in pace, dicens: Viri, fratres estis, ut quid nocetis alterutrum?"
      en: "And the day following, he shewed himself to them when they were at strife; and would have reconciled them in peace, saying: Men, ye are brethren; why hurt you one another?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Qui autem injuriam faciebat proximo, repulit eum, dicens: Quis te constituit principem et judicem super nos?"
      en: "But he that did the injury to his neighbour thrust him away, saying: Who hath appointed thee prince and judge over us?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Numquid interficere me tu vis, quemadmodum interfecisti heri Aegyptium?"
      en: "What, wilt thou kill me, as thou didst yesterday kill the Egyptian?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Fugit autem Moyses in verbo isto: et factus est advena in terra Madian, ubi generavit filios duos."
      en: "And Moses fled upon this word, and was a stranger in the land of Madian, where he begot two sons."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et expletis annis quadraginta, apparuit illi in deserto montis Sina angelus in igne flammae rubi."
      en: "And when forty years were expired, there appeared to him in the desert of mount Sina, an angel in a flame of fire in a bush."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Moyses autem videns, admiratus est visum. Et accedente illo ut consideraret, facta est ad eum vox Domini, dicens:"
      en: "And Moses seeing it, wondered at the sight. And as he drew near to view it, the voice of the Lord came unto him, saying:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Ego sum Deus patrum tuorum, Deus Abraham, Deus Isaac, et Deus Jacob. Tremefactus autem Moyses, non audebat considerare."
      en: "I am the God of thy fathers; the God of Abraham, the God of Isaac, and the God of Jacob. And Moses being terrified, durst not behold."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Dixit autem illi Dominus: Solve calceamentum pedum tuorum: locus enim in quo stas, terra sancta est."
      en: "And the Lord said to him: Loose the shoes from thy feet, for the place wherein thou standest, is holy ground."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Videns vidi afflictionem populi mei, qui est in Aegypto, et gemitum eorum audivi, et descendi liberare eos. Et nunc veni, et mittam te in Aegyptum."
      en: "Seeing I have seen the affliction of my people which is in Egypt, and I have heard their groaning, and am come down to deliver them. And now come, and I will send thee into Egypt."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Hunc Moysen, quem negaverunt, dicentes: Quis te constituit principem et judicem? hunc Deus principem et redemptorem misit, cum manu angeli qui apparuit illi in rubo."
      en: "This Moses, whom they refused, saying: Who hath appointed thee prince and judge? him God sent to be prince and redeemer by the hand of the angel who appeared to him in the bush."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Hic eduxit illos faciens prodigia, et signa in terra Aegypti, et in rubro mari, et in deserto annis quadraginta."
      en: "He brought them out, doing wonders and signs in the land of Egypt, and in the Red Sea, and in the desert forty years."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Hic est Moyses, qui dixit filiis Israel: Prophetam suscitabit vobis Deus de fratribus vestris, tamquam me, ipsum audietis."
      en: "This is that Moses who said to the children of Israel: A prophet shall God raise up to you of your own brethren, as myself: him shall you hear."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Hic est qui fuit in ecclesia in solitudine cum angelo, qui loquebatur ei in monte Sina, et cum patribus nostris: qui accepit verba vitae dare nobis."
      en: "This is he that was in the church in the wilderness, with the angel who spoke to him on mount Sina, and with our fathers; who received the words of life to give unto us."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Cui noluerunt obedire patres nostri: sed repulerunt, et aversi sunt cordibus suis in Aegyptum,"
      en: "Whom our fathers would not obey; but thrust him away, and in their hearts turned back into Egypt,"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "dicentes ad Aaron: Fac nobis deos, qui praecedant nos: Moyses enim hic, qui eduxit nos de terra Aegypti, nescimus quid factum sit ei."
      en: "Saying to Aaron: Make us gods to go before us. For as for this Moses, who brought us out of the land of Egypt, we know not what is become of him."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et vitulum fecerunt in diebus illis, et obtulerunt hostiam simulacro, et laetabantur in operibus manuum suarum."
      en: "And they made a calf in those days, and offered sacrifices to the idol, and rejoiced in the works of their own hands."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Convertit autem Deus, et tradidit eos servire militiae caeli, sicut scriptum est in libro prophetarum: Numquid victimas et hostias obtulistis mihi annis quadraginta in deserto, domus Israel?"
      en: "And God turned, and gave them up to serve the host of heaven, as it is written in the books of the prophets: Did you offer victims and sacrifices to me for forty years, in the desert, O house of Israel?"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Et suscepistis tabernaculum Moloch, et sidus Dei vestri Rempham, figuras quas fecistis adorare eas et transferam vos trans Babylonem."
      en: "And you took unto you the tabernacle of Moloch, and the star of your god Rempham, figures which you made to adore them. And I will carry you away beyond Babylon."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Tabernaculum testimonii fui cum patribus nostris in deserto, sicut disposuit illis Deus, loquens ad Moysen, ut faceret illud secundum formam quam viderat."
      en: "The tabernacle of the testimony was with our fathers in the desert, as God ordained for them, speaking to Moses, that he should make it according to the form which he had seen."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Quod et induxerunt, suscipientes patres nostri cum Jesu in possessionem gentium, quas expulit Deus a facie patrum nostrorum, usque in diebus David,"
      en: "Which also our fathers receiving, brought in with Jesus, into the possession of the Gentiles, whom God drove out before the face of our fathers, unto the days of David."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "qui invenit gratiam ante Deum, et petiit ut inveniret tabernaculum Deo Jacob."
      en: "Who found grace before God, and desired to find a tabernacle for the God of Jacob."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Salomon autem aedificavit illi domum."
      en: "But Solomon built him a house."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Sed non Excelsus in manufactis habitat, sicut propheta dicit:"
      en: "Yet the most High dwelleth not in houses made by hands, as the prophet saith:"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Caelum mihi sedes est: terra autem scabellum pedum meorum. Quam domum aedificabitis mihi, dicit Dominus? aut quis locus requietionis meae est?"
      en: "Heaven is my throne, and the earth my footstool. What house will you build me? saith the Lord; or what is the place of my resting?"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Nonne manus mea fecit haec omnia?"
      en: "Hath not my hand made all these things?"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Dura cervice, et incircumcisis cordibus, et auribus, vos semper Spiritui Sancto resistitis; sicut patres vestri, ita et vos."
      en: "You stiffnecked and uncircumcised in heart and ears, you always resist the Holy Ghost: as your fathers did, so do you also."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Quem prophetarum non sunt persecuti patres vestri? Et occiderunt eos qui praenuntiabant de adventu Justi, cujus vos nunc proditores et homicidae fuistis:"
      en: "Which of the prophets have not your fathers persecuted? And they have slain them who foretold of the coming of the Just One; of whom you have been now the betrayers and murderers:"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "qui accepistis legem in dispositione angelorum, et non custodistis."
      en: "Who have received the law by the disposition of angels, and have not kept it."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Audientes autem haec dissecabantur cordibus suis, et stridebant dentibus in eum."
      en: "Now hearing these things, they were cut to the heart, and they gnashed with their teeth at him."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Cum autem esset plenus Spiritu Sancto, intendens in caelum, vidit gloriam Dei, et Jesum stantem a dextris Dei. Et ait: Ecce video caelos apertos, et Filium hominis stantem a dextris Dei."
      en: "But he, being full of the Holy Ghost, looking up steadfastly to heaven, saw the glory of God, and Jesus standing on the right hand of God. And he said: Behold, I see the heavens opened, and the Son of man standing on the right hand of God."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Exclamantes autem voce magna continuerunt aures suas, et impetum fecerunt unanimiter in eum."
      en: "And they crying out with a loud voice, stopped their ears, and with one accord ran violently upon him."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Et ejicientes eum extra civitatem lapidabant: et testes deposuerunt vestimenta sua secus pedes adolescentis qui vocabatur Saulus."
      en: "And casting him forth without the city, they stoned him; and the witnesses laid down their garments at the feet of a young man, whose name was Saul."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Et lapidabant Stephanum invocantem, et dicentem: Domine Jesu, suscipe spiritum meum."
      en: "And they stoned Stephen, invoking, and saying: Lord Jesus, receive my spirit."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Positis autem genibus, clamavit voce magna, dicens: Domine, ne statuas illis hoc peccatum. Et cum hoc dixisset, obdormivit in Domino. Saulus autem erat consentiens neci ejus."
      en: "And falling on his knees, he cried with a loud voice, saying: Lord, lay not this sin to their charge. And when he had said this, he fell asleep in the Lord. And Saul was consenting to his death."
    status: { la: verified, en: verified }
