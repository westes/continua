# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1reg
chapter: 12
verses:
  - n: 1
    text:
      la: "Dixit autem Samuel ad universum Israel: Ecce audivi vocem vestram juxta omnia quae locuti estis ad me, et constitui super vos regem."
      en: "And Samuel said to all Israel: Behold I have hearkened to your voice in all that you said to me, and have made a king over you."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et nunc rex graditur ante vos: ego autem senui, et incanui: porro filii mei vobiscum sunt: itaque conversatus coram vobis ab adolescentia mea usque ad hanc diem, ecce praesto sum."
      en: "And now the king goeth before you: but I am old and greyheaded: and my sons are with you: having then conversed with you from my youth unto this day, behold here I am."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Loquimini de me coram Domino, et coram Christo ejus, utrum bovem cujusquam tulerim, aut asinum: si quempiam calumniatus sum, si oppressi aliquem, si de manu cujusquam munus accepi: et contemnam illud hodie, restituamque vobis."
      en: "Speak of me before the Lord, and before his anointed, whether I have taken any man's ox, or ass: If I have wronged any man, if I have oppressed any man, if I have taken a bribe at any man's hand: and I will despise it this day, and will restore it to you."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et dixerunt: Non es calumniatus nos, neque oppressisti, neque tulisti de manu alicujus quippiam."
      en: "And they said: Thou hast not wronged us, nor oppressed us, nor taken ought at any man's hand."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dixitque ad eos: Testis est Dominus adversum vos, et testis Christus ejus in die hac, quia non inveneritis in manu mea quippiam. Et dixerunt: Testis."
      en: "And he said to them: The Lord is witness against you, and his anointed is witness this day, that you have not found any thing in my hand. And they said: He is witness."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et ait Samuel ad populum: Dominus, qui fecit Moysen et Aaron, et eduxit patres nostros de terra Aegypti."
      en: "And Samuel said to the people: It is the Lord, who made Moses and Aaron, and brought our fathers out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nunc ergo state, ut judicio contendam adversum vos coram Domino de omnibus misericordiis Domini, quas fecit vobiscum, et cum patribus vestris:"
      en: "Now therefore stand up, that I may plead in judgment against you before the Lord, concerning all the kindness of the Lord, which he hath shewn to you, and to your fathers:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quomodo Jacob ingressus est in Aegyptum, et clamaverunt patres vestri ad Dominum: et misit Dominus Moysen et Aaron, et eduxit patres vestros de Aegypto: et collocavit eos in loco hoc."
      en: "How Jacob went into Egypt, and your fathers cried to the Lord: and the Lord sent Moses and Aaron, and brought your fathers out of Egypt: and made them dwell in this place."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Qui obliti sunt Domini Dei sui, et tradidit eos in manu Sisarae magistri militiae Hasor, et in manu Philisthinorum, et in manu regis Moab, et pugnaverunt adversum eos."
      en: "And they forgot the Lord their God, and he delivered them into the hands of Sisara, captain of the army of Hasor, and into the hands of the Philistines, and into the hand of the king of Moab, and they fought against them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Postea autem clamaverunt ad Dominum, et dixerunt: Peccavimus, quia dereliquimus Dominum, et servivimus Baalim et Astaroth: nunc ergo erue nos de manu inimicorum nostrorum, et serviemus tibi."
      en: "But afterwards they cried to the Lord, and said: We have sinned, because we have forsaken the Lord, and have served Baalim and Astaroth: but now deliver us from the hand of our enemies, and we will serve thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et misit Dominus Jerobaal, et Badan, et Jephte, et Samuel, et eruit vos de manu inimicorum vestrorum per circuitum, et habitastis confidenter."
      en: "And the Lord sent Jerobaal, and Badan, and Jephte, and Samuel, and delivered you from the hand of your enemies round about, and you dwelt securely."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Videntes autem quod Naas rex filiorum Ammon venisset adversum vos, dixistis mihi: Nequaquam, sed rex imperabit nobis: cum Dominus Deus vester regnaret in vobis."
      en: "But seeing that Naas king of the children of Ammon was come against you, you said to me: Nay, but a king shall reign over us: whereas the Lord your God was your king."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nunc ergo praesto est rex vester, quem elegistis et petistis: ecce dedit vobis Dominus regem."
      en: "Now therefore your king is here, whom you have chosen and desired: Behold the Lord hath given you a king."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Si timueritis Dominum, et servieritis ei, et audieritis vocem ejus, et non exasperaveritis os Domini: eritis et vos, et rex qui imperat vobis, sequentes Dominum Deum vestrum:"
      en: "If you will fear the Lord, and serve him, and hearken to his voice, and not provoke the mouth of the Lord: then shall both you, and the king who reigneth over you, be followers of the Lord your God."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "si autem non audieritis vocem Domini, sed exasperaveritis sermones ejus, erit manus Domini super vos, et super patres vestros."
      en: "But if you will not hearken to the voice of the Lord, but will rebel against his words, the hand of the Lord shall be upon you, and upon your fathers."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sed et nunc state, et videte rem istam grandem quam facturus est Dominus in conspectu vestro."
      en: "Now then stand, and see this great thing which the Lord will do in your sight."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Numquid non messis tritici est hodie? invocabo Dominum, et dabit voces et pluvias: et scietis, et videbitis, quia grande malum feceritis vobis in conspectu Domini, petentes super vos regem."
      en: "Is it not wheat harvest today? I will call upon the Lord, and he shall send thunder and rain: and you shall know and see that you yourselves have done a great evil in the sight of the Lord, in desiring a king over you."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et clamavit Samuel ad Dominum, et dedit Dominus voces et pluvias in illa die."
      en: "And Samuel cried unto the Lord, and the Lord sent thunder and rain that day."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et timuit omnis populus nimis Dominum et Samuelem, et dixit universus populus ad Samuelem: Ora pro servis tuis ad Dominum Deum tuum, ut non moriamur: addidimus enim universis peccatis nostris malum, ut peteremus nobis regem."
      en: "And all the people greatly feared the Lord and Samuel. And all the people said to Samuel: Pray for thy servants to the Lord thy God, that we may not die, for we have added to all our sins this evil, to ask for a king."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dixit autem Samuel ad populum: Nolite timere, vos fecistis universum malum hoc: verumtamen nolite recedere a tergo Domini, sed servite Domino in omni corde vestro."
      en: "And Samuel said to the people: Fear not, you have done all this evil: but yet depart not from following the Lord, but serve the Lord with all your heart."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et nolite declinare post vana, quae non proderunt vobis, neque eruent vos, quia vana sunt."
      en: "And turn not aside after vain things which shall never profit you, nor deliver you, because they are vain."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et non derelinquet Dominus populum suum propter nomen suum magnum: quia juravit Dominus facere vos sibi populum."
      en: "And the Lord will not forsake his people for his great name's sake: because the Lord hath sworn to make you his people."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Absit autem a me hoc peccatum in Dominum, ut cessem orare pro vobis, et docebo vos viam bonam et rectam."
      en: "And far from me be this sin against the Lord, that I should cease to pray for you, and I will teach you the good and right way."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Igitur timete Dominum, et servite ei in veritate, et ex toto corde vestro: vidistis enim magnifica quae in vobis gesserit."
      en: "Therefore fear the Lord, and serve him in truth and with your whole heart, for you have seen the great works which he hath done among you."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Quod si perseveraveritis in malitia: et vos et rex vester pariter peribitis."
      en: "But if you will still do wickedly: both you and your king shall perish together."
    status: { la: verified, en: verified }
