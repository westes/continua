# Douay-Rheims + Latin Vulgate, from drbo.org (Douay-Rheims Bible
# Online) -- the "DR + LV" combined page keeps every verse's Latin
# and English paired in the same block, avoiding the verse-
# misalignment this project's first-pass "Unbound Bible" source had
# for esth 16 specifically; see TODO.md's bulk scripture import entry.
book: esth
chapter: 16
verses:
  - n: 1
    text:
      la: "Rex magnus Artaxerxes ab India usque Aethiopiam centum viginti septem provinciarum ducibus ac principibus, qui nostrae jussioni obediunt, salutem dicit."
      en: "The great king Artaxerxes, from India to Ethiopia, to the governors and princes of a hundred and twenty-seven provinces, which obey our command, sendeth greeting."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Multi bonitate principum et honore, qui in eos collatus est, abusi sunt in superbiam :"
      en: "Many have abused unto pride the goodness of princes, and the honour that hath been bestowed upon them:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et non solum subjectos regibus nituntur opprimere, sed datam sibi gloriam non ferentes, in ipsos, qui dederunt, moliuntur insidias."
      en: "And not only endeavour to oppress the king's subjects, but not bearing the glory that is given them, take in hand to practise also against them that gave it."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nec contenti sunt gratias non agere beneficiis, et humanitatis in se jura violare, sed Dei quoque cuncta cernentis arbitrantur se posse fugere sententiam."
      en: "Neither are they content not to return thanks for benefits received, and to violate in themselves the laws of humanity, but they think they can also escape the justice of God who seeth all things."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et in tantum vesaniae proruperunt, ut eos, qui credita sibi officia diligenter observant, et ita cuncta agunt ut omnium laude digni sint, mendaciorum cuniculis conentur subvertere,"
      en: "And they break out into so great madness, as to endeavour to undermine by lies such as observe diligently the offices committed to them, and do all things in such manner as to be worthy of all men's praise,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dum aures principum simplices, et ex sua natura alios aestimantes, callida fraude decipiunt."
      en: "While with crafty fraud they deceive the ears of princes that are well meaning, and judge of others by their own nature."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quae res et ex veteribus probatur historiis, et ex his, quae geruntur quotidie, quomodo malis quorumdam suggestionibus regum studia depraventur."
      en: "Now this is proved both from ancient histories, and by the things which are done daily, how the good designs of kings are depraved by the evil suggestions of certain men."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Unde providendum est paci omnium provinciarum."
      en: "Wherefore we must provide for the peace of all provinces."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Nec putare debetis, si diversa jubeamus, ex animi nostri venire levitate, sed pro qualitate et necessitate temporum, ut reipublicae poscit utilitas, ferre sententiam."
      en: "Neither must you think, if we command different things, that it cometh of the levity of our mind, but that we give sentence according to the quality and necessity of times, as the profit of the commonwealth requireth."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et ut manifestius quod dicimus, intelligatis, Aman filius Amadathi, et animo et gente Macedo, alienusque a Persarum sanguine, et pietatem nostram sua crudelitate commaculans, peregrinus a nobis susceptus est :"
      en: "Now that you may more plainly understand what we say, I Aman the son of Amadathi, a Macedonian both in mind and country, and having nothing of the Persian blood, but with his cruelty staining our goodness, was received being a stranger by us:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et tantam in se expertus humanitatem, ut pater noster vocaretur, et adoraretur ab omnibus post regem secundus :"
      en: "And found our humanity so great towards him, that he was called our father, and was worshipped by all as the next man after the king:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "qui in tantum arrogantiae tumorem sublatus est, ut regno privare nos niteretur et spiritu."
      en: "But he was so far puffed up with arrogancy, as to go about to deprive us of our kingdom and life."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nam Mardochaeum, cujus fide et beneficiis vivimus, et consortem regni nostri Esther cum omni gente sua, novis quibusdam atque inauditis machinis expetivit in mortem :"
      en: "For with certain new and unheard of devices he hath sought the destruction of Mardochai, by whose fidelity and good services our life was saved, and of Esther the partner of our kingdom, with all their nation:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "hoc cogitans ut illis interfectis, insidiaretur nostrae solitudini, et regnum Persarum transferret in Macedonas."
      en: "Thinking that after they were slain, he might work treason against us left alone without friends, and might transfer the kingdom of the Persians to the Macedonians."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Nos autem a pessimo mortalium Judaeos neci destinatos, in nulla penitus culpa reperimus, sed e contrario justis utentes legibus,"
      en: "But we have found that the Jews, who were by that most wicked man appointed to be slain, are in no fault at all, but contrariwise, use just laws,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et filios altissimi et maximi, semperque viventis Dei, cujus beneficio et patribus nostris et nobis regnum est traditum, et usque hodie custoditur."
      en: "And are the children of the highest and the greatest, and the ever living God, by whose benefit the kingdom was given both to our fathers and to us, and is kept unto this day."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Unde eas litteras, quas sub nomine nostro ille direxerat, sciatis esse irritas."
      en: "Wherefore know ye that those letters which he sent in our name, are void and of no effect."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Pro quo scelere ante portas hujus urbis, id est, Susan, et ipse qui machinatus est, et omnis cognatio ejus pendet in patibulis : non nobis, sed Deo reddente ei quod meruit."
      en: "For which crime both he himself that devised it, and all his kindred hang on gibbets, before the gates of this city Susan: not we, but God repaying him as he deserved."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Hoc autem edictum, quod nunc mittimus, in cunctis urbibus proponatur, ut liceat Judaeis uti legibus suis."
      en: "But this edict, which we now send, shall be published in all cities, that the Jews may freely follow their own laws."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quibus debetis esse adminiculo, ut eos, qui se ad necem eorum paraverant, possint interficere tertiadecima die mensis duodecimi, qui vocatur Adar."
      en: "And you shall aid them that they may kill those who had prepared themselves to kill them, on the thirteenth day of the twelfth month, which is called Adar."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Hanc enim diem, Deus omnipotens, moeroris et luctus, eis vertit in gaudium."
      en: "For the almighty God hath turned this day of sadness and mourning into joy to them."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Unde et vos inter ceteros festos dies, hanc habetote diem, et celebrate eam cum omni laetitia, ut et in posterum cognoscatur"
      en: "Wherefore you shall also count this day among other festival days, and celebrate it with all joy, that it may be known also in times to come,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "omnes, qui fideliter Persis obediunt, dignam pro fide recipere mercedem; qui autem insidiantur regno eorum, perire pro scelere."
      en: "That all they who faithfully obey the Persians, receive a worthy reward for their fidelity: but they that are traitors to their kingdom, are destroyed for their wickedness."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Omnis autem provincia et civitas, quae noluerit solemnitatis hujus esse particeps, gladio et igne pereat, et sic deleatur, ut non solum hominibus, sed etiam bestiis invia sit in sempiternum, pro exemplo contemptus, et inobedientiae."
      en: "And let every province and city, that will not be partaker of this solemnity, perish by the sword and by fire, and be destroyed in such manner as to be made unpassable, both to men and beasts, for an example of contempt, and disobedience."
    status: { la: verified, en: verified }
