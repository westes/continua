book: 1par
chapter: 4
verses:
  - n: 1
    text:
      la: "filii Iuda Phares Esrom et Carmi et Ur et Subal"
      en: "The sons of Juda: Phares, Hesron, and Charmi, and Hur, and Sobal."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Reaia vero filius Subal genuit Ieth de quo nati sunt Ahimai et Laed hae cognationes Sarathi"
      en: "And Raia the son of Sobal beget Jahath, of whom were born Ahumai, and Laad. These are the families of Sarathi."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ista quoque stirps Hetam Iezrahel et Iesema et Iedebos nomenque sororis eorum Asalelphuni"
      en: "And this is the posterity of Etam: Jezrahel, and Jesema, and Jedebos: and the name of their sister was Asalelphuni."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Phunihel autem pater Gedor et Ezer pater Osa isti sunt filii Ur primogeniti Ephrata patris Bethleem"
      en: "And Phanuel the father of Gedor, and Ezar the father of Hosa, these are the sons of Hur the firstborn of Ephratha the father of Bethlehem."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Asur vero patris Thecue erant duae uxores Halaa et Naara"
      en: "And Assur the father of Thecua had two wives, Halaa and Naara:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "peperit autem ei Naara Oozam et Epher et Themani et Asthari isti sunt filii Naara"
      en: "And Naara bore him Ozam, and Hepher, and Themani, and Ahasthari: these are the sons of Naara."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "porro filii Halaa Sereth Isaar et Ethnan"
      en: "And the sons of Halaa, Sereth, Isaar, and Ethnan."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cos autem genuit Anob et Sobaba et cognationem Aral filii Arum"
      en: "And Cos begot Anob, and Soboba, the kindred of Aharehel the son of Arum."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "fuit autem Iabes inclitus prae fratribus suis et mater eius vocavit nomen illius Iabes dicens quia peperi eum in dolore"
      en: "And Jabes was more honourable than any of his brethren, and his mother called his name Jabes, saying: Because I bore him with sorrow."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "invocavit vero Iabes Deum Israhel dicens si benedicens benedixeris mihi et dilataveris terminos meos et fuerit manus tua mecum et feceris me a malitia non opprimi et praestitit Deus quae precatus est"
      en: "And Jabes called upon the God of Israel, saying: If blessing thou wilt bless me, and wilt enlarge my borders, and thy hand be with me, and thou save me from being oppressed by evil. And God granted him the things he prayed for."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Chaleb autem frater Suaa genuit Machir qui fuit pater Esthon"
      en: "And Caleb the brother of Sua beget Mahir, who was the father of Esthon."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "porro Esthon genuit Bethrapha et Phesse et Thena patrem urbis Naas hii sunt viri Recha"
      en: "And Esthon beget Bethrapha, and Phesse, and Tehinna father of the city of Naas: these are the men of Recha."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "filii autem Cenez Othonihel et Saraia porro filii Othonihel Athath"
      en: "And the sons of Cenez were Othoniel,. and Saraia. And the sons of Othoniel, Hathath, and Maonathi."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et Maonathi genuit Ophra Saraias autem genuit Ioab patrem vallis Artificum ibi quippe artifices erant"
      en: "Maonathi beget Ophra, and Saraia begot Joab the father of the Valley of artificers: for artificers were there."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "filii vero Chaleb filii Iephonne Hir et Hela et Nahem filiique Hela et Cenez"
      en: "And the sons of Caleb the son of Jephone, were Hir, and Ela, and Naham. And the sons of Ela: Cenez."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "filii quoque Iallelel Ziph et Zipha Thiria et Asrahel"
      en: "The sons also of Jaleleel: Ziph, and Zipha, Thiria, and Asrael."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et filii Ezra Iether et Mered et Epher et Ialon genuitque Mariam et Sammai et Iesba patrem Esthamo"
      en: "And the sons of Esra, Jether, and Mered, and Epher, and Jalon, and he beget Mariam, and Sammai, and Jesba the father of Esthamo."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "uxor quoque eius Iudaia peperit Iared patrem Gedor et Heber patrem Soccho et Hicuthihel patrem Zano hii autem filii Beththiae filiae Pharaonis quam accepit Mered"
      en: "And his wife Judaia, bore Jared the father of Gedor, and Heber the father of Socho, and Icuthiel the father of Zanoe. And these are the sons of Bethia the daughter of Pharao, whom Mered took to wife."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et filii uxoris Odaiae sororis Naham patris Ceila Garmi et Esthamo qui fuit de Machathi"
      en: "And the sons of his wife Odaia the sister of Naham the father of Celia, Garmi, and Esthamo, who was of Machathi."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "filii quoque Simon Amnon et Rena filius Anan et Thilon et filii Iesi Zoeth et Benzoeth"
      en: "The sons also of Simon, Amnon, and Rinna the son of Hanan, and Thilon. And the sons of Jesi Zoheth, and Benzoheth."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "filii Sela filii Iuda Her pater Lecha et Laada pater Maresa et cognationes Domus operantium byssum in domo Iuramenti"
      en: "The sons of h Sela the son of Juda: Her the father of Lecha, and Laada the father of Maresa, and the families of the house of them that wrought fine linen in the House of oath."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et Qui stare fecit solem virique Mendacii et Securus et Incendens qui principes fuerunt in Moab et qui reversi sunt in Leem haec autem verba vetera"
      en: "And he that made the sun to stand, and the men of Lying, and Secure, and Burning, who were princes in Moab, and who returned into Lahem. Now these are things of old."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "hii sunt figuli habitantes in plantationibus et in praesepibus apud regem in operibus eius commoratique sunt ibi"
      en: "These are the potters, and they dwelt in Plantations, and Hedges, with the king for his works, and they abode there."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "filii Symeon Namuhel et Iamin Iarib Zara Saul"
      en: "The sons of Simeon: Namuel, and Jamin, Jarib, Zara, Saul:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Sellum filius eius Mabsam filius eius Masma filius eius"
      en: "Sellum his son, Mapsam his son, Masma his son."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "filii Masma Amuhel filius eius Zacchur filius eius Semei filius eius"
      en: "The sons of Masma: Hamuel his son, Zachur his son, Semei his son."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "filii Semei sedecim et filiae sex fratres autem eius non habuerunt filios multos et universa cognatio non potuit adaequare summam filiorum Iuda"
      en: "The sons of Semei were sixteen, and six daughters: but his brethren had not many sons, and the whole kindred could not reach to the sum of the children of Juda."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "habitaverunt autem in Bersabee et Molada et Asarsual"
      en: "And they dwelt in Bersabee, and Molada, and Hasarsuhal,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et in Ballaa et in Asom et in Tholad"
      en: "And in Bala, and in Asom, and in Tholad,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et in Bathuhel et in Orma et in Siceleg"
      en: "And in Bathuel, and in Horma, and in Siceleg,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et in Bethmarchaboth et in Asarsusim et in Bethberai et in Saarim hae civitates eorum usque ad regem David"
      en: "And in Bethmarchaboth, and in Hasarsusim, and in Bethberai, and in Saarim. These were their cities unto the reign of David."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "villae quoque eorum Etham et Aen et Remmon et Thochen et Asan civitates quinque"
      en: "Their towns also were Etam, and Aen, Remmon, and Thochen, and Asan, five cities."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et universi viculi eorum per circuitum civitatum istarum usque ad Baal haec est habitatio eorum et sedum distributio"
      en: "And all their villages round about these cities as far as Baal. This was their habitation, and the distribution of their dwellings."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Masobab quoque et Iemlech et Iosa filius Amasiae"
      en: "And Mosabab and Jemlech, and Josa, the son of Amasias,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et Iohel et Ieu filius Iosabiae filii Saraiae filii Asihel"
      en: "And Joel, and Jehu the son of Josabia the son of Saraia, the son of Asiel,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et Helioenai et Iacoba et Isuaia et Asaia et Adihel et Isimihel et Banaia"
      en: "And Elioenai, and Jacoba, and Isuhaia, and Asaia, and Adiel, and Ismiel, and Banaia,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Ziza quoque filius Sephei filii Allon filii Idaia filii Semri filii Samaia"
      en: "Ziza also the son of Sephei the son of Allon the son of Idaia the son of Semri the son of Samaia."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "isti sunt nominati principes in cognationibus suis et in domo adfinitatum suarum multiplicati sunt vehementer"
      en: "These were named princes in their kindreds, and in the houses of their families were multiplied exceedingly."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et profecti sunt ut ingrederentur in Gador usque ad orientem vallis et ut quaererent pascua gregibus suis"
      en: "And they went forth to enter into Gador as far as to the east side of the valley, to seek pastures for their flocks."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "inveneruntque pascuas uberes et valde bonas et terram latissimam et quietam et fertilem in qua ante habitaverunt de stirpe Ham"
      en: "And they found fat pastures, and very good, and a country spacious, and quiet, and fruitful, in which some of the race of Cham had dwelt before."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "hii ergo venerunt quos supra descripsimus nominatim in diebus Ezechiae regis Iuda et percusserunt tabernacula eorum et habitatores qui inventi fuerant ibi et deleverunt eos usque in praesentem diem habitaveruntque pro eis quoniam uberrimas ibidem pascuas reppererunt"
      en: "And these whose names are written above, came in the days of Ezechias king of Juda: and they beat down their tents, and slew the inhabitants that were found there, and utterly destroyed them unto this day: and they dwelt in their place, because they found there fat pastures."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "de filiis quoque Symeon abierunt in montem Seir viri quingenti habentes principes Phaltiam et Nahariam et Raphaiam et Ozihel filios Iesi"
      en: "Some also of the children of Simeon, five hundred men, went into mount Seir, having for their captains Phaltias and Naaria and Raphaia and Oziel the sons of Jesi:"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et percusserunt reliquias quae evadere potuerant Amalechitarum et habitaverunt ibi pro eis usque ad diem hanc"
      en: "And they slew the remnant of the Amalecites, who had been able to escape, and they dwelt there in their stead unto this day."
    status: { la: verified, en: verified }
