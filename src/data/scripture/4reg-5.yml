# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 5
verses:
  - n: 1
    text:
      la: "Naaman princeps militiae regis Syriae, erat vir magnus apud dominum suum, et honoratus: per illum enim dedit Dominus salutem Syriae: erat autem vir fortis et dives, sed leprosus."
      en: "Naaman, general of the army of the king of Syria, was a great man with his master, and honourable: for by him the Lord gave deliverance to Syria: and he was a valiant man and rich, but a leper."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Porro de Syria egressi fuerant latrunculi, et captivam duxerant de terra Israel puellam parvulam, quae erat in obsequio uxoris Naaman,"
      en: "Now there had gone out robbers from Syria, and had led away captive out of the land of Israel a little maid, and she waited upon Naaman's wife."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quae ait ad dominam suam: Utinam fuisset dominus meus ad prophetam, qui est in Samaria: profecto curasset eum a lepra, quam habet."
      en: "And she said to her mistress: I wish my master had been with the prophet, that is in Samaria: he would certainly have healed him of the leprosy which he hath."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ingressus est itaque Naaman ad dominum suum, et nuntiavit ei, dicens: Sic et sic locuta est puella de terra Israel."
      en: "Then Naaman went in to his lord, and told him, saying: Thus and thus said the girl from the land of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dixitque ei rex Syriae: Vade, et mittam litteras ad regem Israel. Qui cum profectus esset, et tulisset secum decem talenta argenti, et sex millia aureos, et decem mutatoria vestimentorum,"
      en: "And the king of Syria said to him: Go, and I will send a letter to the king of Israel. And he departed, and took with him ten talents of silver, and six thousand pieces of gold, and ten changes of raiment,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "detulit litteras ad regem Israel, in haec verba: Cum acceperis epistolam hanc, scito quod miserim ad te Naaman servum meum, ut cures eum a lepra sua."
      en: "And brought the letter to the king of Israel, in these words: When thou shalt receive this letter, know that I have sent to thee Naaman my servant, that thou mayest heal him of his leprosy."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cumque legisset rex Israel litteras, scidit vestimenta sua, et ait: Numquid Deus ego sum, ut occidere possim et vivificare, quia iste misit ad me, ut curem hominem a lepra sua? Animadvertite, et videte quod occasiones quaerat adversum me."
      en: "And when the king of Israel had read the letter, he rent his garments, and said: Am I God, to be able to kill and give life, that this man hath sent to me, to heal a man of his leprosy? mark, and see how he seeketh occasions against me."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quod cum audisset Eliseus vir Dei, scidisse videlicet regem Israel vestimenta sua, misit ad eum, dicens: Quare scidisti vestimenta tua? veniat ad me, et sciat esse prophetam in Israel."
      en: "And when Eliseus the man of God had heard this, to wit, that the king of Israel had rent his garments, he sent to him, saying: Why hast thou rent thy garments? let him come to me, and let him know that there is a prophet in Israel."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Venit ergo Naaman cum equis, et curribus, et stetit ad ostium domus Elisei:"
      en: "So Naaman came with his horses and chariots, and stood at the door of the house of Eliseus:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "misitque ad eum Eliseus nuntium, dicens: Vade, et lavare septies in Jordane, et recipiet sanitatem caro tua, atque mundaberis."
      en: "And Eliseus sent a messenger to him, saying: Go, and wash seven times in the Jordan, and thy flesh shall recover health, and thou shalt be clean."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Iratus Naaman recedebat, dicens: Putabam quod egrederetur ad me, et stans invocaret nomen Domini Dei sui, et tangeret manu sua locum leprae, et curaret me."
      en: "Naaman was angry and went away, saying: I thought he would have come out to me, and standing would have invoked the name of the Lord his God, and touched with his hand the place of the leprosy, and healed me."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Numquid non meliores sunt Abana, et Pharphar, fluvii Damasci, omnibus aquis Israel, ut laver in eis, et munder? Cum ergo vertisset se, et abiret indignans,"
      en: "Are not the Abana, and the Pharphar, rivers of Damascus, better than all the waters of Israel, that I may wash in them, and be made clean? So as he turned, and was going away with indignation,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "accesserunt ad eum servi sui, et locuti sunt ei: Pater, etsi rem grandem dixisset tibi propheta, certe facere debueras: quanto magis quia nunc dixit tibi: Lavare, et mundaberis?"
      en: "His servants came to him, and said to him: Father, if the prophet had bid thee do some great thing, surely thou shouldst have done it: how much rather what he now hath said to thee: Wash, and thou shalt be clean?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Descendit, et lavit in Jordane septies juxta sermonem viri Dei, et restituta est caro ejus, sicut caro pueri parvuli, et mundatus est."
      en: "Then he went down, and washed in the Jordan seven times: according to the word of the man of God, and his flesh was restored, like the flesh of a little child, and he was made clean."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Reversusque ad virum Dei cum universo comitatu suo, venit, et stetit coram eo, et ait: Vere scio quod non sit alius Deus in universa terra, nisi tantum in Israel. Obsecro itaque ut accipias benedictionem a servo tuo."
      en: "And returning to the man of God with all his train, he came, and stood before him, and said: In truth, I know there is no other God in all the earth, but only in Israel: I beseech thee therefore take a blessing of thy servant."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "At ille respondit: Vivit Dominus, ante quem sto, quia non accipiam. Cumque vim faceret, penitus non acquievit."
      en: "But he answered: As the Lord liveth, before whom I stand, I will receive none. And when he pressed him, he still refused."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dixitque Naaman: Ut vis: sed, obsecro, concede mihi servo tuo ut tollam onus duorum burdonum de terra: non enim faciet ultra servus tuus holocaustum, aut victimam diis alienis, nisi Domino."
      en: "And Naaman said: As thou wilt: but I beseech thee, grant to me thy servant, to take from hence two mules' burden of earth: for thy servant will not henceforth offer holocaust, or victim, to other gods, but to the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Hoc autem solum est, de quo depreceris Dominum pro servo tuo, quando ingredietur dominus meus templum Remmon, ut adoret: et illo innitente super manum meam, si adoravero in templo Remmon, adorante eo in eodem loco, ut ignoscat mihi Dominus servo tuo pro hac re."
      en: "But there is only this, for which thou shalt entreat the Lord for thy servant, when my master goeth into the temple of Remmon, to worship: and he leaneth upon my hand, if I bow down in the temple of Remmon, when he boweth down in the same place, that the Lord pardon me thy servant for this thing."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Qui dixit ei: Vade in pace. Abiit ergo ab eo electo terrae tempore."
      en: "And he said to him: Go in peace. So he departed from him in the springtime of the earth."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dixitque Giezi puer viri Dei: Pepercit dominus meus Naaman Syro isti, ut non acciperet ab eo quae attulit: vivit Dominus, quia curram post eum, et accipiam ab eo aliquid."
      en: "But Giezi the servant of the man of God said: My master hath spared Naaman this Syrian, in not receiving of him that which he brought: as the Lord liveth, I will run after him, and take some thing of him:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et secutus est Giezi post tergum Naaman: quem cum vidisset ille currentem ad se, desiliit de curru in occursum ejus, et ait: Rectene sunt omnia?"
      en: "And Giezi followed after Naaman: and when he saw him running after him, he leapt down from his chariot to meet him, and said: Is all well?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et ille ait: Recte. Dominus meus misit me ad te dicens: Modo venerunt ad me duo adolescentes de monte Ephraim, ex filiis prophetarum: da eis talentum argenti, et vestes mutatorias duplices."
      en: "And he said: Well: my master hath sent me to thee, saying: Just now there are come to me from mount Ephraim, two young men of the sons of the prophets: give them a talent of silver, and two changes of garments."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Dixitque Naaman: Melius est ut accipias duo talenta. Et coegit eum, ligavitque duo talenta argenti in duobus saccis, et duplicia vestimenta, et imposuit duobus pueris suis, qui et portaverunt coram eo."
      en: "And Naaman said: It is better that thou take two talents. And he forced him, and bound two talents of silver in two bags, and two changes of garments, and laid them upon two of his servants, and they carried them before him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Cumque venisset jam vesperi, tulit de manu eorum, et reposuit in domo, dimisitque viros, et abierunt."
      en: "And when he was come, and now it was the evening, he took them from their hands, and laid them up in the house, and sent the men away, and they departed."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Ipse autem ingressus, stetit coram domino suo. Et dixit Eliseus: Unde venis Giezi? Qui respondit: Non ivit servus tuus quoquam."
      en: "But he went in, and stood before his master. And Eliseus said: Whence comest thou, Giezi? He answered: Thy servant went no whither."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "At ille ait: Nonne cor meum in praesenti erat, quando reversus est homo de curru suo in occursum tui? Nunc igitur accepisti argentum, et accepisti vestes ut emas oliveta, et vineas, et oves, et boves, et servos, et ancillas."
      en: "But he said: Was not my heart present, when the man turned back from his chariot to meet thee? So now thou hast received money, and received garments, to buy oliveyards, and vineyards, and sheep, and oxen, and menservants, and maidservants."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Sed et lepra Naaman adhaerebit tibi, et semini tuo, usque in sempiternum. Et egressus est ab eo leprosus quasi nix."
      en: "But the leprosy of Naaman shall also stick to thee, and to thy seed for ever. And he went out from him a leper as white as snow."
    status: { la: verified, en: verified }
