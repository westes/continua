# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: act
chapter: 10
verses:
  - n: 1
    text:
      la: "Vir autem quidam erat in Caesarea, nomine Cornelius, centurio cohortis quae dicitur Italica,"
      en: "And there was a certain man in Caesarea, named Cornelius, a centurion of that which is called the Italian band;"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "religiosus, ac timens Deum cum omni domo sua, faciens eleemosynas multas plebi, et deprecans Deum semper:"
      en: "A religious man, and fearing God with all his house, giving much alms to the people, and always praying to God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "is vidit in visu manifeste, quasi hora diei nona, angelum Dei introeuntem ad se, et dicentem sibi: Corneli."
      en: "This man saw in a vision manifestly, about the ninth hour of the day, an angel of God coming in unto him, and saying to him: Cornelius."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "At ille intuens eum, timore correptus, dixit: Quid est, Domine? Dixit autem illi: Orationes tuae et eleemosynae tuae ascenderunt in memoriam in conspectu Dei."
      en: "And he, beholding him, being seized with fear, said: What is it, Lord? And he said to him: Thy prayers and thy alms are ascended for a memorial in the sight of God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et nunc mitte viros in Joppen, et accersi Simonem quemdam, qui cognominatur Petrus:"
      en: "And now send men to Joppe, and call hither one Simon, who is surnamed Peter:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "hic hospitatur apud Simonem quemdam coriarium, cujus est domus juxta mare: hic dicet tibi quid te oporteat facere."
      en: "He lodgeth with one Simon a tanner, whose house is by the sea side. He will tell thee what thou must do."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et cum discessisset angelus qui loquebatur illi, vocavit duos domesticos suos, et militem metuentem Dominum ex his qui illi parebant."
      en: "And when the angel who spoke to him was departed, he called two of his household servants, and a soldier who feared the Lord, of them that were under him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quibus cum narrasset omnia, misit illos in Joppen."
      en: "To whom when he had related all, he sent them to Joppe."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Postera autem die, iter illis facientibus, et appropinquantibus civitati, ascendit Petrus in superiora ut oraret circa horam sextam."
      en: "And on the next day, whilst they were going on their journey, and drawing nigh to the city, Peter went up to the higher parts of the house to pray, about the sixth hour."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et cum esuriret, voluit gustare. Parantibus autem illis, cecidit super eum mentis excessus:"
      en: "And being hungry, he was desirous to taste somewhat. And as they were preparing, there came upon him an ecstasy of mind."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et vidit caelum apertum, et descendens vas quoddam, velut linteum magnum, quatuor initiis submitti de caelo in terram,"
      en: "And he saw the heaven opened, and a certain vessel descending, as it were a great linen sheet let down by the four corners from heaven to the earth:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "in quo erant omnia quadrupedia, et serpentia terrae, et volatilia caeli."
      en: "Wherein were all manner of fourfooted beasts, and creeping things of the earth, and fowls of the air."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et facta est vox ad eum: Surge Petre, occide, et manduca."
      en: "And there came a voice to him: Arise, Peter; kill and eat."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ait autem Petrus: Absit Domine, quia numquam manducavi omne commune et immundum."
      en: "But Peter said: Far be it from me; for I never did eat any thing that is common and unclean."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et vox iterum secundo ad eum: Quod Deus purificavit, tu commune ne dixeris."
      en: "And the voice spoke to him again the second time: That which God hath cleansed, do not thou call common."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Hoc autem factum est per ter: et statim receptum est vas in caelum."
      en: "And this was done thrice; and presently the vessel was taken up into heaven."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et dum intra se haesitaret Petrus quidnam esset visio, quam vidisset: ecce viri qui missi erant a Cornelio, inquirentes domum Simonis, astiterunt ad januam."
      en: "Now, whilst Peter was doubting within himself, what the vision that he had seen should mean, behold the men who were sent from Cornelius, inquiring for Simon's house, stood at the gate."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et cum vocassent, interrogabant, si Simon, qui cognominatur Petrus, illic haberet hospitium."
      en: "And when they had called, they asked, if Simon, who is surnamed Peter, were lodged there."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Petro autem cogitante de visione, dixit Spiritus ei: Ecce viri tres quaerunt te."
      en: "And as Peter was thinking of the vision, the Spirit said to him: Behold three men seek thee."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Surge itaque, descende, et vade cum eis nihil dubitans: quia ego misi illos."
      en: "Arise, therefore, get thee down and go with them, doubting nothing: for I have sent them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Descendens autem Petrus ad viros, dixit: Ecce ego sum, quem quaeritis: quae causa est, propter quam venistis?"
      en: "Then Peter, going down to the men, said: Behold, I am he whom you seek; what is the cause for which you are come?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Qui dixerunt: Cornelius centurio, vir justus, et timens Deum, et testimonium habens ab universa gente Judaeorum, responsum accepit ab angelo sancto accersire te in domum suam, et audire verba abs te."
      en: "Who said: Cornelius, a centurion, a just man, and one that feareth God, and having good testimony from all the nation of the Jews, received an answer of an holy angel, to send for thee into his house, and to hear words of thee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Introducens ergo eos, recepit hospitio. Sequenti autem die surgens profectus est cum illis; et quidam ex fratribus ab Joppe comitati sunt eum."
      en: "Then bringing them in, he lodged them. And the day following he arose, and went with them: and some of the brethren from Joppe accompanied him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Altera autem die introivit Caesaream. Cornelius vero exspectabat illos, convocatis cognatis suis, et necessariis amicis."
      en: "And the morrow after, he entered into Caesarea. And Cornelius waited for them, having called together his kinsmen and special friends."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et factum est cum introisset Petrus, obvius venit ei Cornelius, et procidens ad pedes ejus adoravit."
      en: "And it came to pass, that when Peter was come in, Cornelius came to meet him, and falling at his feet adored."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Petrus vero elevavit eum, dicens: Surge, et ego ipse homo sum."
      en: "But Peter lifted him up, saying: Arise, I myself also am a man."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et loquens cum illo intravit, et invenit multos qui convenerant:"
      en: "And talking with him, he went in, and found many that were come together."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "dixitque ad illos: Vos scitis quomodo abominatum sit viro Judaeo conjungi, aut accedere ad alienigenam: sed mihi ostendit Deus neminem communem aut immundum dicere hominem."
      en: "And he said to them: You know how abominable it is for a man that is a Jew, to keep company or to come unto one of another nation: but God hath shewed to me, to call no man common or unclean."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Propter quod sine dubitatione veni accersitus. Interrogo ergo, quam ob causam accersistis me?"
      en: "For which cause, making no doubt, I came when I was sent for. I ask, therefore, for what cause you have sent for me?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et Cornelius ait: A nudiusquarta die usque ad hanc horam, orans eram hora nona in domo mea, et ecce vir stetit ante me in veste candida, et ait:"
      en: "And Cornelius said: Four days ago, unto this hour, I was praying in my house, at the ninth hour, and behold a man stood before me in white apparel, and said:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Corneli, exaudita est oratio tua, et eleemosynae tuae commemoratae sunt in conspectu Dei."
      en: "Cornelius, thy prayer is heard, and thy alms are had in remembrance in the sight of God."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Mitte ergo in Joppen, et accersi Simonem, qui cognominatur Petrus: hic hospitatur in domo Simonis coriarii juxta mare."
      en: "Send therefore to Joppe, and call hither Simon, who is surnamed Peter: he lodgeth in the house of Simon a tanner, by the sea side."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Confestim ergo misi ad te: et tu benefecisti veniendo. Nunc ergo omnes nos in conspectu tuo adsumus audire omnia quaecumque tibi praecepta sunt a Domino."
      en: "Immediately therefore I sent to thee: and thou hast done well in coming. Now therefore all we are present in thy sight, to hear all things whatsoever are commanded thee by the Lord."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Aperiens autem Petrus os suum, dixit: In veritate comperi quia non est personarum acceptor Deus;"
      en: "And Peter opening his mouth, said: In very deed I perceive, that God is not a respecter of persons."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "sed in omni gente qui timet eum, et operatur justitiam, acceptus est illi."
      en: "But in every nation, he that feareth him, and worketh justice, is acceptable to him."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Verbum misit Deus filiis Israel, annuntians pacem per Jesum Christum ( hic est omnium Dominus)."
      en: "God sent the word to the children of Israel, preaching peace by Jesus Christ: (he is Lord of all.)"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Vos scitis quod factum est verbum per universam Judaeum: incipiens enim a Galilaea post baptismum, quod praedicavit Joannes,"
      en: "You know the word which hath been published through all Judea: for it began from Galilee, after the baptism which John preached,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Jesum a Nazareth: quomodo unxit eum Deus Spiritu Sancto, et virtute, qui pertransiit benefaciendo, et sanando omnes oppressos a diabolo, quoniam Deus erat cum illo."
      en: "Jesus of Nazareth: how God anointed him with the Holy Ghost, and with power, who went about doing good, and healing all that were oppressed by the devil, for God was with him."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et nos testes sumus omnium quae fecit in regione Judaeorum, et Jerusalem, quem occiderunt suspendentes in ligno."
      en: "And we are witnesses of all things that he did in the land of the Jews and in Jerusalem, whom they killed, hanging him upon a tree."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Hunc Deus suscitavit tertia die, et dedit eum manifestum fieri,"
      en: "Him God raised up the third day, and gave him to be made manifest,"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "non omni populo, sed testibus praeordinatis a Deo: nobis, qui manducavimus et bibimus cum illo postquam resurrexit a mortuis."
      en: "Not to all the people, but to witnesses preordained by God, even to us, who did eat and drink with him after he arose again from the dead;"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et praecepit nobis praedicare populo, et testificari, quia ipse est qui constitutus est a Deo judex vivorum et mortuorum."
      en: "And he commanded us to preach to the people, and to testify that it is he who was appointed by God, to be judge of the living and of the dead."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Huic omnes prophetae testimonium perhibent remissionem peccatorum accipere per nomen ejus omnes qui credunt in eum."
      en: "To him all the prophets give testimony, that by his name all receive remission of sins, who believe in him."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Adhuc loquente Petro verba haec, cecidit Spiritus Sanctus super omnes qui audiebant verbum."
      en: "While Peter was yet speaking these words, the Holy Ghost fell on all them that heard the word."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Et obstupuerunt ex circumcisione fideles qui venerant cum Petro: quia et in nationes gratia Spiritus Sancti effusa est."
      en: "And the faithful of the circumcision, who came with Peter, were astonished, for that the grace of the Holy Ghost was poured out upon the Gentiles also."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Audiebant enim illos loquentes linguis, et magnificantes Deum."
      en: "For they heard them speaking with tongues, and magnifying God."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Tunc respondit Petrus: Numquid aquam quis prohibere potest ut non baptizentur hi qui Spiritum Sanctum acceperunt sicut et nos?"
      en: "Then Peter answered: Can any man forbid water, that these should not be baptized, who have received the Holy Ghost, as well as we?"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Et jussit eos baptizari in nomine Domini Jesu Christi. Tunc rogaverunt eum ut maneret apud eos aliquot diebus."
      en: "And he commanded them to be baptized in the name of the Lord Jesus Christ. Then they desired him to tarry with them some days."
    status: { la: verified, en: verified }
