# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 14
verses:
  - n: 1
    text:
      la: "Et venerunt ad me viri seniorum Israel, et sederunt coram me."
      en: "And some of the ancients of Israel came to me, and sat before me."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et factus est sermo Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Fili hominis, viri isti posuerunt immunditias suas in cordibus suis, et scandalum iniquitatis suae statuerunt contra faciem suam: numquid interrogatus respondebo eis?"
      en: "Son of man, these men have placed their uncleannesses in their hearts, and have set up before their face the stumblingblock of their iniquity: and shall I answer when they inquire of me?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Propter hoc loquere eis, et dices ad eos: Haec dicit Dominus Deus: Homo, homo de domo Israel, qui posuerit immunditias suas in corde suo, et scandalum iniquitatis suae statuerit contra faciem suam, et venerit ad prophetam interrogans per eum me: ego Dominus respondebo ei in multitudine immunditiarum suarum,"
      en: "Therefore speak to them, and say to them: Thus saith the Lord God: Man, man of the house of Israel that shall place his uncleannesses in his heart, and set up the stumblingblock of his iniquity before his face, and shall come to the prophet inquiring of me by him: I the Lord will answer him according to the multitude of his uncleannesses:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ut capiatur domus Israel in corde suo, quo recesserunt a me in cunctis idolis suis."
      en: "That the house of Israel may be caught in their own heart, with which they have departed from me through all their idols."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Propterea dic ad domum Israel: Haec dicit Dominus Deus: Convertimini, et recedite ab idolis vestris et ab universis contaminationibus vestris avertite facies vestras."
      en: "Therefore say to the house of Israel: Thus saith the Lord God: Be converted, and depart from your idols, and turn away your faces from all your abominations."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quia homo, homo de domo Israel, et de proselytis quicumque advena fuerit in Israel, si alienatus fuerit a me, et posuerit idola sua in corde suo, et scandalum iniquitatis suae statuerit contra faciem suam, et venerit ad prophetam ut interroget per eum me: ego Dominus respondebo ei per me:"
      en: "For every man of the house of Israel, and every stranger among the proselytes in Israel, if he separate himself from me, and place his idols in his heart, and set the stumblingblock of his iniquity before his face, and come to the prophet to inquire of me by him: I the Lord will answer him by myself."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et ponam faciem meam super hominem illum, et faciam eum in exemplum et in proverbium, et disperdam eum de medio populi mei: et scietis quia ego Dominus."
      en: "And I will set my face against that man, and will make him an example, and a proverb, and will cut him off from the midst of my people: and you shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et propheta cum erraverit, et locutus fuerit verbum, ego Dominus decepi prophetam illum, et extendam manum meam super illum, et delebo eum de medio populi mei Israel."
      en: "And when the prophet shall err, and speak a word: I the Lord have deceived that prophet: and I will stretch forth my hand upon him, and will cut him off from the midst of my people Israel."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et portabunt iniquitatem suam: juxta iniquitatem interrogantis, sic iniquitas prophetae erit:"
      en: "And they shall bear their iniquity: according to the iniquity of him that inquireth, so shall the iniquity of the prophet be."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ut non erret ultra domus Israel a me, neque polluatur in universis praevaricationibus suis: sed sint mihi in populum, et ego sim eis in Deum, ait Dominus exercituum."
      en: "That the house of Israel may go no more astray from me, nor be polluted with all their transgressions: but may be my people, and I may be their God, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et factus est sermo Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Fili hominis, terra cum peccaverit mihi, ut praevaricetur praevaricans, extendam manum meam super eam, et conteram virgam panis ejus, et immittam in eam famem, et interficiam de ea hominem et jumentum."
      en: "Son of man, when a land shall sin against me, so as to transgress grievously, I will stretch forth my hand upon it, and will break the staff of the bread thereof: and I will send famine upon it, and will destroy man and beast out of it."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et si fuerint tres viri isti in medio ejus, Noe, Daniel, et Job, ipsi justitia sua liberabunt animas suas, ait Dominus exercituum."
      en: "And if these three men, Noe, Daniel, and Job, shall be in it: they shall deliver their own souls by their justice, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quod si et bestias pessimas induxero super terram ut vastem eam, et fuerit invia, eo quod non sit pertransiens propter bestias:"
      en: "And if I shall bring mischievous beasts also upon the land to waste it, and it be desolate, so that there is none that can pass because of the beasts:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tres viri isti si fuerint in ea, vivo ego, dicit Dominus Deus, quia nec filios nec filias liberabunt, sed ipsi soli liberabuntur, terra autem desolabitur."
      en: "If these three men shall be in it, as I live, saith the Lord, they shall deliver neither sons nor daughters: but they only shall be delivered, and the land shall be made desolate."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Vel si gladium induxero super terram illam, et dixero gladio: Transi per terram: et interfecero de ea hominem et jumentum:"
      en: "Or if I bring the sword upon that land, and say to the sword: Pass through the land: and I destroy man and beast out of it:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et tres viri isti fuerint in medio ejus, vivo ego, dicit Dominus Deus, non liberabunt filios neque filias, sed ipsi soli liberabuntur."
      en: "And these three men be in the midst thereof: as I live, saith the Lord God, they shall deliver neither sons nor daughters, but they themselves alone shall be delivered."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Si autem et pestilentiam immisero super terram illam, et effudero indignationem meam super eam in sanguine, ut auferam ex ea hominem et jumentum:"
      en: "Or if I also send the pestilence upon that land, and pour out my indignation upon it in blood, to cut off from it man and beast:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et Noe, et Daniel, et Job fuerint in medio ejus, vivo ego, dicit Dominus Deus, quia filium et filiam non liberabunt, sed ipsi justitia sua liberabunt animas suas."
      en: "And Noe, and Daniel, and Job be in the midst thereof: as I live, saith the Lord God, they shall deliver neither son nor daughter: but they shall only deliver their own souls by their justice."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quoniam haec dicit Dominus Deus: Quod etsi quatuor judicia mea pessima, gladium, et famem, ac bestias malas, et pestilentiam, immisero in Jerusalem, ut interficiam de ea hominem et pecus,"
      en: "For thus saith the Lord: Although I shall send in upon Jerusalem my four grievous judgments, the sword, and the famine, and the mischievous beasts, and the pestilence, to destroy out of it man and beast,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "tamen relinquetur in ea salvatio educentium filios et filias: ecce ipsi ingredientur ad vos, et videbitis viam eorum et adinventiones eorum, et consolabimini super malo quod induxi in Jerusalem, in omnibus quae importavi super eam."
      en: "Yet there shall be left in it some that shall be saved, who shall bring away their sons and daughters: behold they shall come among you, and you shall see their way, and their doings: and you shall be comforted concerning the evil that I have brought upon Jerusalem, in all things that I have brought upon it."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et consolabuntur vos, cum videritis viam eorum, et adinventiones eorum: et cognoscetis quod non frustra fecerim omnia quae feci in ea, ait Dominus Deus."
      en: "And they shall comfort you, when you shall see their ways, and their doings: and you shall know that I have not done without cause all that I have done in it, saith the Lord God."
    status: { la: verified, en: verified }
