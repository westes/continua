# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: amos
chapter: 9
verses:
  - n: 1
    text:
      la: "vidi Dominum stantem super altare et dixit percute cardinem et commoveantur superliminaria avaritia enim in capite omnium et novissimum eorum in gladio interficiam non erit fuga eis fugiet et non salvabitur ex eis qui fugerit"
      en: "I saw the Lord standing upon the altar, and he said: Strike the hinges, and let the lintels be shook: for there is covetousness in the head of them all, and I will slay the last of them with the sword: there shall be no flight for them: they shall flee, and he that shall flee of them shall not be delivered."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "si descenderint usque ad infernum inde manus mea educet eos et si ascenderint usque ad caelum inde detraham eos"
      en: "Though they go down even to hell, thence shall my hand bring them out: and though they climb up to heaven, thence will I bring them down."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et si absconditi fuerint in vertice Carmeli inde scrutans auferam eos et si celaverint se ab oculis meis in fundo maris ibi mandabo serpenti et mordebit eos"
      en: "And though they be hid in the top of Carmel, I will search and take them away from thence : and though they hide themselves from my eyes in the depth of the sea, there will I command the serpent and he shall bite them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et si abierint in captivitatem coram inimicis suis ibi mandabo gladio et occidet eos et ponam oculos meos super eos in malum et non in bonum"
      en: "And if they go into captivity before their enemies, there will I command the sword, and it shall kill them. And I will set my eyes upon them for evil, and not for good."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et Dominus Deus exercituum qui tangit terram et tabescet et lugebunt omnes habitantes in ea et ascendet sicut rivus omnis et defluet sicut fluvius Aegypti"
      en: "And the Lord the God of hosts is he who toucheth the earth, and it shall melt: and all that dwell therein shall mourn: and it shall rise up as a river, and shall run down as the river of Egypt."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui aedificat in caelo ascensionem suam et fasciculum suum super terram fundavit qui vocat aquas maris et effundit eas super faciem terrae Dominus nomen eius"
      en: "He that buildeth his ascension in heaven, and hath founded his bundle upon the earth: who calleth the waters of the sea, and poureth them out upon the face of the earth, the Lord is his name."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "numquid non ut filii Aethiopum vos estis mihi filii Israhel ait Dominus numquid non Israhel ascendere feci de terra Aegypti et Palestinos de Cappadocia et Syros de Cyrene"
      en: "Are not you as the children of the Ethiopians unto me, O children of Israel, saith the Lord? did not I bring up Israel, out of the land of Egypt: and the Philistines out of Cappadocia, and the Syrians out of Cyrene?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ecce oculi Domini Dei super regnum peccans et conteram illud a facie terrae verumtamen conterens non conteram domum Iacob dicit Dominus"
      en: "Behold the eyes of the Lord God are upon the sinful kingdom, and I will destroy it from the face of the earth: but yet I will not utterly destroy the house of Jacob, saith the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ecce enim ego mandabo et concutiam in omnibus gentibus domum Israhel sicut concutitur in cribro et non cadet lapillus super terram"
      en: "For behold I will command, and I will sift the house of Israel among all nations, as corn is sifted in a sieve: and there shall not a little stone fall to the ground."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in gladio morientur omnes peccatores populi mei qui dicunt non adpropinquabit et non veniet super nos malum"
      en: "All the sinners of my people shall fall by the sword: who say: The evils shall not approach, and shall not come upon us."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in die illo suscitabo tabernaculum David quod cecidit et reaedificabo aperturas murorum eius et ea quae corruerant instaurabo et reaedificabo eum sicut diebus antiquis"
      en: "In that day I will raise up the tabernacle of David, that is fallen: and I will close up the breaches of the walls thereof, and repair what was fallen: and I will rebuild it as in the days of old."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ut possideant reliquias Idumeae et omnes nationes eo quod invocatum sit nomen meum super eos dicit Dominus faciens haec"
      en: "That they may possess the remnant of Edom, and all nations, because my name is invoked upon them: saith the Lord that doth these things."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ecce dies veniunt dicit Dominus et conprehendet arator messorem et calcator uvae mittentem semen et stillabunt montes dulcedinem et omnes colles culti erunt"
      en: "Behold the days come, saith the Lord, when the ploughman shall overtake the reaper, and the treader of grapes him that soweth seed: and the mountains shall drop sweetness, and every hill shall be tilled."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et convertam captivitatem populi mei Israhel et aedificabunt civitates desertas et habitabunt et plantabunt vineas et bibent vinum earum et facient hortos et comedent fructus eorum"
      en: "And I will bring back the captivity of my people Israel: and they shall build the abandoned cities, and inhabit them: and they shall plant vineyards, and drink the wine of them: and shall make gardens, and eat the fruits of them. And I will plant them upon their own land: and I will no more pluck them out of their land which I have given them, saith the Lord thy God."
    status: { la: verified, en: verified }
