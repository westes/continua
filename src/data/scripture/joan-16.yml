# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: joan
chapter: 16
verses:
  - n: 1
    text:
      la: "haec locutus sum vobis ut non scandalizemini"
      en: "These things have I spoken to you, that you may not be scandalized."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "absque synagogis facient vos sed venit hora ut omnis qui interficit vos arbitretur obsequium se praestare Deo"
      en: "They will put you out of the synagogues: yea, the hour cometh, that whosoever killeth you, will think that he doth a service to God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et haec facient quia non noverunt Patrem neque me"
      en: "And these things will they do to you; because they have not known the Father, nor me."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sed haec locutus sum vobis ut cum venerit hora eorum reminiscamini quia ego dixi vobis"
      en: "But these things I have told you, that when the hour shall come, you may remember that I told you of them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "haec autem vobis ab initio non dixi quia vobiscum eram at nunc vado ad eum qui me misit et nemo ex vobis interrogat me quo vadis"
      en: "But I told you not these things from the beginning, because I was with you. And now I go to him that sent me, and none of you asketh me: Whither goest thou?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sed quia haec locutus sum vobis tristitia implevit cor vestrum"
      en: "But because I have spoken these things to you, sorrow hath filled your heart."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sed ego veritatem dico vobis expedit vobis ut ego vadam si enim non abiero paracletus non veniet ad vos si autem abiero mittam eum ad vos"
      en: "But I tell you the truth: it is expedient to you that I go: for if I go not, the Paraclete will not come to you; but if I go, I will send him to you."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et cum venerit ille arguet mundum de peccato et de iustitia et de iudicio"
      en: "And when he is come, he will convince the world of sin, and of justice, and of judgment."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "de peccato quidem quia non credunt in me"
      en: "Of sin: because they believed not in me."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "de iustitia vero quia ad Patrem vado et iam non videbitis me"
      en: "And of justice: because I go to the Father; and you shall see me no longer."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "de iudicio autem quia princeps mundi huius iudicatus est"
      en: "And of judgment: because the prince of this world is already judged."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "adhuc multa habeo vobis dicere sed non potestis portare modo"
      en: "I have yet many things to say to you: but you cannot bear them now."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cum autem venerit ille Spiritus veritatis docebit vos in omnem veritatem non enim loquetur a semet ipso sed quaecumque audiet loquetur et quae ventura sunt adnuntiabit vobis"
      en: "But when he, the Spirit of truth, is come, he will teach you all truth. For he shall not speak of himself; but what things soever he shall hear, he shall speak; and the things that are to come, he shall shew you."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ille me clarificabit quia de meo accipiet et adnuntiabit vobis"
      en: "He shall glorify me; because he shall receive of mine, and shall shew it to you."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "omnia quaecumque habet Pater mea sunt propterea dixi quia de meo accipit et adnuntiabit vobis"
      en: "All things whatsoever the Father hath, are mine. Therefore I said, that he shall receive of mine, and shew it to you."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "modicum et iam non videbitis me et iterum modicum et videbitis me quia vado ad Patrem"
      en: "A little while, and now you shall not see me; and again a little while, and you shall see me: because I go to the Father."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dixerunt ergo ex discipulis eius ad invicem quid est hoc quod dicit nobis modicum et non videbitis me et iterum modicum et videbitis me et quia vado ad Patrem"
      en: "Then some of the disciples said one to another: What is this that he saith to us: A little while, and you shall not see me; and again a little while, and you shall see me, and, because I go to the Father?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dicebant ergo quid est hoc quod dicit modicum nescimus quid loquitur"
      en: "They said therefore: What is this that he saith, A little while? we know not what he speaketh."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "cognovit autem Iesus quia volebant eum interrogare et dixit eis de hoc quaeritis inter vos quia dixi modicum et non videbitis me et iterum modicum et videbitis me"
      en: "And Jesus knew that they had a mind to ask him; and he said to them: Of this do you inquire among yourselves, because I said: A little while, and you shall not see me; and again a little while, and you shall see me?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "amen amen dico vobis quia plorabitis et flebitis vos mundus autem gaudebit vos autem contristabimini sed tristitia vestra vertetur in gaudium"
      en: "Amen, amen I say to you, that you shall lament and weep, but the world shall rejoice; and you shall be made sorrowful, but your sorrow shall be turned into joy."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "mulier cum parit tristitiam habet quia venit hora eius cum autem pepererit puerum iam non meminit pressurae propter gaudium quia natus est homo in mundum"
      en: "A woman, when she is in labour, hath sorrow, because her hour is come; but when she hath brought forth the child, she remembereth no more the anguish, for joy that a man is born into the world."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et vos igitur nunc quidem tristitiam habetis iterum autem videbo vos et gaudebit cor vestrum et gaudium vestrum nemo tollit a vobis"
      en: "So also you now indeed have sorrow; but I will see you again, and your heart shall rejoice; and your joy no man shall take from you."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et in illo die me non rogabitis quicquam amen amen dico vobis si quid petieritis Patrem in nomine meo dabit vobis"
      en: "And in that day you shall not ask me any thing. Amen, amen I say to you: if you ask the Father any thing in my name, he will give it you."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "usque modo non petistis quicquam in nomine meo petite et accipietis ut gaudium vestrum sit plenum"
      en: "Hitherto you have not asked any thing in my name. Ask, and you shall receive; that your joy may be full."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "haec in proverbiis locutus sum vobis venit hora cum iam non in proverbiis loquar vobis sed palam de Patre adnuntiabo vobis"
      en: "These things I have spoken to you in proverbs. The hour cometh, when I will no more speak to you in proverbs, but will shew you plainly of the Father."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "illo die in nomine meo petetis et non dico vobis quia ego rogabo Patrem de vobis"
      en: "In that day you shall ask in my name; and I say not to you, that I will ask the Father for you:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ipse enim Pater amat vos quia vos me amastis et credidistis quia ego a Deo exivi"
      en: "For the Father himself loveth you, because you have loved me, and have believed that I came out from God."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "exivi a Patre et veni in mundum iterum relinquo mundum et vado ad Patrem"
      en: "I came forth from the Father, and am come into the world: again I leave the world, and I go to the Father."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "dicunt ei discipuli eius ecce nunc palam loqueris et proverbium nullum dicis"
      en: "His disciples say to him: Behold, now thou speakest plainly, and speakest no proverb."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "nunc scimus quia scis omnia et non opus est tibi ut quis te interroget in hoc credimus quia a Deo existi"
      en: "Now we know that thou knowest all things, and thou needest not that any man should ask thee. By this we believe that thou camest forth from God."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "respondit eis Iesus modo creditis"
      en: "Jesus answered them: Do you now believe?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "ecce venit hora et iam venit ut dispergamini unusquisque in propria et me solum relinquatis et non sum solus quia Pater mecum est"
      en: "Behold, the hour cometh, and it is now come, that you shall be scattered every man to his own, and shall leave me alone; and yet I am not alone, because the Father is with me."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "haec locutus sum vobis ut in me pacem habeatis in mundo pressuram habetis sed confidite ego vici mundum"
      en: "These things I have spoken to you, that in me you may have peace. In the world you shall have distress: but have confidence, I have overcome the world."
    status: { la: verified, en: verified }
