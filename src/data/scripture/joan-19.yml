# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: joan
chapter: 19
verses:
  - n: 1
    text:
      la: "Tunc ergo apprehendit Pilatus Jesum, et flagellavit."
      en: "Then therefore, Pilate took Jesus, and scourged him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et milites plectentes coronam de spinis, imposuerunt capiti ejus: et veste purpurea circumdederunt eum."
      en: "And the soldiers platting a crown of thorns, put it upon his head; and they put on him a purple garment."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et veniebant ad eum, et dicebant: Ave, rex Judaeorum: et dabant ei alapas."
      en: "And they came to him, and said: Hail, king of the Jews; and they gave him blows."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Exivit ergo iterum Pilatus foras, et dicit eis: Ecce adduco vobis eum foras, ut cognoscatis quia nullam invenio in eo causam."
      en: "Pilate therefore went forth again, and saith to them: Behold, I bring him forth unto you, that you may know that I find no cause in him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "( Exivit ergo Jesus portans coronam spineam, et purpureum vestimentum.) Et dicit eis: Ecce homo."
      en: "(Jesus therefore came forth, bearing the crown of thorns and the purple garment.) And he saith to them: Behold the Man."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Cum ergo vidissent eum pontifices et ministri, clamabant, dicentes: Crucifige, crucifige eum. Dicit eis Pilatus: Accipite eum vos, et crucifigite: ego enim non invenio in eo causam."
      en: "When the chief priests, therefore, and the servants, had seen him, they cried out, saying: Crucify him, crucify him. Pilate saith to them: Take him you, and crucify him: for I find no cause in him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Responderunt ei Judaei: Nos legem habemus, et secundum legem debet mori, quia Filium Dei se fecit."
      en: "The Jews answered him: We have a law; and according to the law he ought to die, because he made himself the Son of God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cum ergo audisset Pilatus hunc sermonem, magis timuit."
      en: "When Pilate therefore had heard this saying, he feared the more."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ingressus est praetorium iterum: et dixit ad Jesum: Unde es tu? Jesus autem responsum non dedit ei."
      en: "And he entered into the hall again, and he said to Jesus: Whence art thou? But Jesus gave him no answer."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dicit ergo ei Pilatus: Mihi non loqueris? nescis quia potestatem habeo crucifigere te, et potestatem habeo dimittere te?"
      en: "Pilate therefore saith to him: Speakest thou not to me? knowest thou not that I have power to crucify thee, and I have power to release thee?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Respondit Jesus: Non haberes potestatem adversum me ullam, nisi tibi datum esset desuper. Propterea qui me tradidit tibi, majus peccatum habet."
      en: "Jesus answered: Thou shouldst not have any power against me, unless it were given thee from above. Therefore, he that hath delivered me to thee, hath the greater sin."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et exinde quaerebat Pilatus dimittere eum. Judaei autem clamabant dicentes: Si hunc dimittis, non es amicus Caesaris. Omnis enim qui se regem facit, contradicit Caesari."
      en: "And from henceforth Pilate sought to release him. But the Jews cried out, saying: If thou release this man, thou art not Caesar's friend. For whosoever maketh himself a king, speaketh against Caesar."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Pilatus autem cum audisset hos sermones, adduxit foras Jesum: et sedit pro tribunali, in loco qui dicitur Lithostrotos, hebraice autem Gabbatha."
      en: "Now when Pilate had heard these words, he brought Jesus forth, and sat down in the judgment seat, in the place that is called Lithostrotos, and in Hebrew Gabbatha."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Erat enim parasceve Paschae, hora quasi sexta, et dicit Judaeis: Ecce rex vester."
      en: "And it was the parasceve of the pasch, about the sixth hour, and he saith to the Jews: Behold your king."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Illi autem clamabant: Tolle, tolle, crucifige eum. Dicit eis Pilatus: Regem vestrum crucifigam? Responderunt pontifices: Non habemus regem, nisi Caesarem."
      en: "But they cried out: Away with him; away with him; crucify him. Pilate saith to them: Shall I crucify your king? The chief priests answered: We have no king but Caesar."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Tunc ergo tradidit eis illum ut crucifigeretur. Susceperunt autem Jesum, et eduxerunt."
      en: "Then therefore he delivered him to them to be crucified. And they took Jesus, and led him forth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et bajulans sibi crucem exivit in eum, qui dicitur Calvariae locum, hebraice autem Golgotha:"
      en: "And bearing his own cross, he went forth to that place which is called Calvary, but in Hebrew Golgotha."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ubi crucifixerunt eum, et cum eo alios duos hinc et hinc, medium autem Jesum."
      en: "Where they crucified him, and with him two others, one on each side, and Jesus in the midst."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Scripsit autem et titulum Pilatus, et posuit super crucem. Erat autem scriptum: Jesus Nazarenus, Rex Judaeorum."
      en: "And Pilate wrote a title also, and he put it upon the cross. And the writing was: JESUS OF NAZARETH, THE KING OF THE JEWS."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Hunc ergo titulum multi Judaeorum legerunt: quia prope civitatem erat locus, ubi crucifixus est Jesus, et erat scriptum hebraice, graece, et latine."
      en: "This title therefore many of the Jews did read: because the place where Jesus was crucified was nigh to the city: and it was written in Hebrew, in Greek, and in Latin."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dicebant ergo Pilato pontifices Judaeorum: Noli scribere: Rex Judaeorum: sed quia ipse dixit: Rex sum Judaeorum."
      en: "Then the chief priests of the Jews said to Pilate: Write not, The King of the Jews; but that he said, I am the King of the Jews."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Respondit Pilatus: Quod scripsi, scripsi."
      en: "Pilate answered: What I have written, I have written."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Milites ergo cum crucifixissent eum, acceperunt vestimenta ejus ( et fecerunt quatuor partes, unicuique militi partem) et tunicam. Erat autem tunica inconsutilis, desuper contexta per totum."
      en: "The soldiers therefore, when they had crucified him, took his garments, (and they made four parts, to every soldier a part,) and also his coat. Now the coat was without seam, woven from the top throughout."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Dixerunt ergo ad invicem: Non scindamus eam, sed sortiamur de illa cujus sit. Ut Scriptura impleretur, dicens: Partiti sunt vestimenta mea sibi: et in vestem meam miserunt sortem. Et milites quidem haec fecerunt."
      en: "They said then one to another: Let us not cut it, but let us cast lots for it, whose it shall be; that the scripture might be fulfilled, saying: They have parted my garments among them, and upon my vesture they have cast lots. And the soldiers indeed did these things."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Stabant autem juxta crucem Jesu mater ejus, et soror matris ejus, Maria Cleophae, et Maria Magdalene."
      en: "Now there stood by the cross of Jesus, his mother, and his mother's sister, Mary of Cleophas, and Mary Magdalen."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Cum vidisset ergo Jesus matrem, et discipulum stantem, quem diligebat, dicit matri suae: Mulier, ecce filius tuus."
      en: "When Jesus therefore had seen his mother and the disciple standing whom he loved, he saith to his mother: Woman, behold thy son."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Deinde dicit discipulo: Ecce mater tua. Et ex illa hora accepit eam discipulus in sua."
      en: "After that, he saith to the disciple: Behold thy mother. And from that hour, the disciple took her to his own."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Postea sciens Jesus quia omnia consummata sunt, ut consummaretur Scriptura, dixit: Sitio."
      en: "Afterwards, Jesus knowing that all things were now accomplished, that the scripture might be fulfilled, said: I thirst."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Vas ergo erat positum aceto plenum. Illi autem spongiam plenam aceto, hyssopo circumponentes, obtulerunt ori ejus."
      en: "Now there was a vessel set there full of vinegar. And they, putting a sponge full of vinegar about hyssop, put it to his mouth."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Cum ergo accepisset Jesus acetum, dixit: Consummatum est. Et inclinato capite tradidit spiritum."
      en: "Jesus therefore, when he had taken the vinegar, said: It is consummated. And bowing his head, he gave up the ghost."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Judaei ergo ( quoniam parasceve erat) ut non remanerent in cruce corpora sabbato ( erat enim magnus dies ille sabbati), rogaverunt Pilatum ut frangerentur eorum crura, et tollerentur."
      en: "Then the Jews, (because it was the parasceve,) that the bodies might not remain on the cross on the sabbath day, (for that was a great sabbath day,) besought Pilate that their legs might be broken, and that they might be taken away."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Venerunt ergo milites: et primi quidem fregerunt crura, et alterius, qui crucifixus est cum eo."
      en: "The soldiers therefore came; and they broke the legs of the first, and of the other that was crucified with him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Ad Jesum autem cum venissent, ut viderunt eum jam mortuum, non fregerunt ejus crura,"
      en: "But after they were come to Jesus, when they saw that he was already dead, they did not break his legs."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "sed unus militum lancea latus ejus aperuit, et continuo exivit sanguis et aqua."
      en: "But one of the soldiers with a spear opened his side, and immediately there came out blood and water."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et qui vidit, testimonium perhibuit: et verum est testimonium ejus. Et ille scit quia vera dicit: ut et vos credatis."
      en: "And he that saw it, hath given testimony, and his testimony is true. And he knoweth that he saith true; that you also may believe."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Facta sunt enim haec ut Scriptura impleretur: Os non comminuetis ex eo."
      en: "For these things were done, that the scripture might be fulfilled: You shall not break a bone of him."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et iterum alia Scriptura dicit: Videbunt in quem transfixerunt."
      en: "And again another scripture saith: They shall look on him whom they pierced."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Post haec autem rogavit Pilatum Joseph ab Arimathaea ( eo quod esset discipulus Jesu, occultus autem propter metum Judaeorum), ut tolleret corpus Jesu. Et permisit Pilatus. Venit ergo, et tulit corpus Jesu."
      en: "And after these things, Joseph of Arimathea (because he was a disciple of Jesus, but secretly for fear of the Jews) besought Pilate that he might take away the body of Jesus. And Pilate gave leave. He came therefore, and took the body of Jesus."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Venit autem et Nicodemus, qui venerat ad Jesum nocte primum, ferens mixturam myrrhae et aloes, quasi libras centum."
      en: "And Nicodemus also came, (he who at the first came to Jesus by night,) bringing a mixture of myrrh and aloes, about an hundred pound weight."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Acceperunt ergo corpus Jesu, et ligaverunt illud linteis cum aromatibus, sicut mos est Judaeis sepelire."
      en: "They took therefore the body of Jesus, and bound it in linen cloths, with the spices, as the manner of the Jews is to bury."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Erat autem in loco, ubi crucifixus est, hortus: et in horto monumentum novum, in quo nondum quisquam positus erat."
      en: "Now there was in the place where he was crucified, a garden; and in the garden a new sepulchre, wherein no man yet had been laid."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Ibi ergo propter parasceven Judaeorum, quia juxta erat monumentum, posuerunt Jesum."
      en: "There, therefore, because of the parasceve of the Jews, they laid Jesus, because the sepulchre was nigh at hand."
    status: { la: verified, en: verified }
