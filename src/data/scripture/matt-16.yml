# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 16
verses:
  - n: 1
    text:
      la: "Et accesserunt ad eum pharisaei et sadducaei tentantes: et rogaverunt eum ut signum de caelo ostenderet eis."
      en: "And there came to him the Pharisees and Sadducees tempting: and they asked him to shew them a sign from heaven."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "At ille respondens, ait illis: Facto vespere dicitis: Serenum erit, rubicundum est enim caelum."
      en: "But he answered and said to them: When it is evening, you say, It will be fair weather, for the sky is red."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et mane: Hodie tempestas, rutilat enim triste caelum."
      en: "And in the morning: Today there will be a storm, for the sky is red and lowering. You know then how to discern the face of the sky: and can you not know the signs of the times?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Faciem ergo caeli dijudicare nostis: signa autem temporum non potestis scire? Generatio mala et adultera signum quaerit: et signum non dabitur ei, nisi signum Jonae prophetae. Et relictis illis, abiit."
      en: "A wicked and adulterous generation seeketh after a sign: and a sign shall not be given it, but the sign of Jonas the prophet. And he left them, and went away."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et cum venissent discipuli ejus trans fretum, obliti sunt panes accipere."
      en: "And when his disciples were come over the water, they had forgotten to take bread."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Qui dixit illis: Intuemini, et cavete a fermento pharisaeorum et sadducaeorum."
      en: "Who said to them: Take heed and beware of the leaven of the Pharisees and Sadducees."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "At illi cogitabant intra se dicentes: Quia panes non accepimus."
      en: "But they thought within themselves, saying: Because we have taken no bread."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sciens autem Jesus, dixit: Quid cogitatis intra vos modicae fidei, quia panes non habetis?"
      en: "And Jesus knowing it, said: Why do you think within yourselves, O ye of little faith, for that you have no bread?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Nondum intelligitis, neque recordamini quinque panum in quinque millia hominum, et quot cophinos sumpsistis?"
      en: "Do you not yet understand, neither do you remember the five loaves among five thousand men, and how many baskets you took up?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "neque septem panum in quatuor millia hominum, et quot sportas sumpsistis?"
      en: "Nor the seven loaves among four thousand men, and how many baskets you took up?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quare non intelligitis, quia non de pane dixi vobis: Cavete a fermento pharisaeorum et sadducaeorum?"
      en: "Why do you not understand that it was not concerning the bread I said to you: Beware of the leaven of the Pharisees and Sadducees?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tunc intellexerunt quia non dixerit cavendum a fermento panum, sed a doctrina pharisaeorum et sadducaeorum."
      en: "Then they understood that he said not that they should beware of the leaven of bread, but of the doctrine of the Pharisees and Sadducees."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Venit autem Jesus in partes Caesareae Philippi: et interrogabat discipulos suos, dicens: Quem dicunt homines esse Filium hominis?"
      en: "And Jesus came into the quarters of Caesarea Philippi: and he asked his disciples, saying: Whom do men say that the Son of man is?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "At illi dixerunt: Alii Joannem Baptistam, alii autem Eliam, alii vero Jeremiam, aut unum ex prophetis."
      en: "But they said: Some John the Baptist, and other some Elias, and others Jeremias, or one of the prophets."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dicit illis Jesus: Vos autem, quem me esse dicitis?"
      en: "Jesus saith to them: But whom do you say that I am?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Respondens Simon Petrus dixit: Tu es Christus, Filius Dei vivi."
      en: "Simon Peter answered and said: Thou art Christ, the Son of the living God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Respondens autem Jesus, dixit ei: Beatus es Simon Bar Jona: quia caro et sanguis non revelavit tibi, sed Pater meus, qui in caelis est."
      en: "And Jesus answering, said to him: Blessed art thou, Simon Bar-Jona: because flesh and blood hath not revealed it to thee, but my Father who is in heaven."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et ego dico tibi, quia tu es Petrus, et super hanc petram aedificabo Ecclesiam meam, et portae inferi non praevalebunt adversus eam."
      en: "And I say to thee: That thou art Peter; and upon this rock I will build my church, and the gates of hell shall not prevail against it."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et tibi dabo claves regni caelorum. Et quodcumque ligaveris super terram, erit ligatum et in caelis: et quodcumque solveris super terram, erit solutum et in caelis."
      en: "And I will give to thee the keys of the kingdom of heaven. And whatsoever thou shalt bind upon earth, it shall be bound also in heaven: and whatsoever thou shalt loose upon earth, it shall be loosed also in heaven."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Tunc praecepit discipulis suis ut nemini dicerent quia ipse esset Jesus Christus."
      en: "Then he commanded his disciples, that they should tell no one that he was Jesus the Christ."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Exinde coepit Jesus ostendere discipulis suis, quia oporteret eum ire Jerosolymam, et multa pati a senioribus, et scribis, et principibus sacerdotum, et occidi, et tertia die resurgere."
      en: "From that time Jesus began to shew to his disciples, that he must go to Jerusalem, and suffer many things from the ancients and scribes and chief priests, and be put to death, and the third day rise again."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et assumens eum Petrus, coepit increpare illum dicens: Absit a te, Domine: non erit tibi hoc."
      en: "And Peter taking him, began to rebuke him, saying: Lord, be it far from thee, this shall not be unto thee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Qui conversus, dixit Petro: Vade post me Satana, scandalum es mihi: quia non sapis ea quae Dei sunt, sed ea quae hominum."
      en: "Who turning, said to Peter: Go behind me, Satan, thou art a scandal unto me: because thou savourest not the things that are of God, but the things that are of men."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Tunc Jesus dixit discipulis suis: Si quis vult post me venire, abneget semetipsum, et tollat crucem suam, et sequatur me."
      en: "Then Jesus said to his disciples: If any man will come after me, let him deny himself, and take up his cross, and follow me."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Qui enim voluerit animam suam salvam facere, perdet eam: qui autem perdiderit animam suam propter me, inveniet eam."
      en: "For he that will save his life, shall lose it: and he that shall lose his life for my sake, shall find it."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Quid enim prodest homini, si mundum universum lucretur, animae vero suae detrimentum patiatur? aut quam dabit homo commutationem pro anima sua?"
      en: "For what doth it profit a man, if he gain the whole world, and suffer the loss of his own soul? Or what exchange shall a man give for his soul?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Filius enim hominis venturus est in gloria Patris sui cum angelis suis: et tunc reddet unicuique secundum opera ejus."
      en: "For the Son of man shall come in the glory of his Father with his angels: and then will he render to every man according to his works."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Amen dico vobis, sunt quidam de hic stantibus, qui non gustabunt mortem, donec videant Filium hominis venientem in regno suo."
      en: "Amen I say to you, there are some of them that stand here, that shall not taste death, till they see the Son of man coming in his kingdom."
    status: { la: verified, en: verified }
