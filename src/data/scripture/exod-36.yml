# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 36
verses:
  - n: 1
    text:
      la: "fecit ergo Beselehel et Hooliab et omnis vir sapiens quibus dedit Dominus sapientiam et intellectum ut scirent fabre operari quae in usus sanctuarii necessaria sunt et quae praecepit Dominus"
      en: "Beseleel, therefore, and Ooliab, and every wise man, to whom the Lord gave wisdom and understanding, to know how to work artificially, made the things that are necessary for the uses of the sanctuary, and which the Lord commanded."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "cumque vocasset eos Moses et omnem eruditum virum cui dederat Deus sapientiam et qui sponte sua obtulerant se ad faciendum opus"
      en: "And when Moses had called them, and every skilful man, to whom the Lord had given wisdom, and such as of their own accord had offered themselves to the making of the work,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "tradidit eis universa donaria filiorum Israhel qui cum instarent operi cotidie mane vota populus offerebat"
      en: "He delivered all the offerings of the children of Israel unto them. And while they were earnest about the work, the people daily in the morning offered their vows."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "unde artifices venire conpulsi"
      en: "Whereupon the workmen being constrained to come,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixerunt Mosi plus offert populus quam necessarium est"
      en: "Said to Moses: The people offereth more than is necessary."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "iussit ergo Moses praeconis voce cantari nec vir nec mulier quicquam ultra offerat in opere sanctuarii sicque cessatum est a muneribus offerendis"
      en: "Moses therefore commanded proclamation to be made by the crier's voice: Let neither man nor woman offer any more for the work of the sanctuary. And so they ceased from offering gifts,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "eo quod oblata sufficerent et superabundarent"
      en: "Because the things that were offered did suffice, and were too much."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "feceruntque omnes corde sapientes ad explendum opus tabernaculi cortinas decem de bysso retorta et hyacintho et purpura coccoque bis tincto opere vario et arte polymita"
      en: "And all the men that were wise of heart, to accomplish the work of the tabernacle, made ten curtains of twisted fine linen, and violet, and purple, and scarlet twice dyed, with varied work, and the art of embroidering:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quarum una habebat in longitudine viginti octo cubitos et in latitudine quattuor una mensura erat omnium cortinarum"
      en: "The length of one curtain was twenty-eight cubits, and the breadth four: all the curtains were of the same size."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "coniunxitque cortinas quinque alteram alteri et alias quinque sibi invicem copulavit"
      en: "And he joined five curtains, one to another, and the other five he coupled one to another."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "fecit et ansas hyacinthinas in ora cortinae unius ex utroque latere et in ora cortinae alterius similiter"
      en: "He made also loops of violet in the edge of the curtain on both sides, and in the edge of the other curtain in like manner,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ut contra se invicem venirent ansae et mutuo iungerentur"
      en: "That the loops might meet on against another, and might be joined each with the other."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "unde et quinquaginta fudit circulos aureos qui morderent cortinarum ansas et fieret unum tabernaculum"
      en: "Whereupon also he cast fifty rings of gold, that might catch the loops of the curtains, and they might be made one tabernacle."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "fecit et saga undecim de pilis caprarum ad operiendum tectum tabernaculi"
      en: "He made also eleven curtains of goats' hair, to cover the roof of the tabernacle:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "unum sagum habebat in longitudine cubitos triginta et in latitudine cubitos quattuor unius mensurae erant omnia saga"
      en: "One curtain was thirty cubits long and four cubits broad: all the curtains were of one measure."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quorum quinque iunxit seorsum et sex alia separatim"
      en: "Five of which he joined apart, and the other six apart."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "fecitque ansas quinquaginta in ora sagi unius et quinquaginta in ora sagi alterius ut sibi invicem iungerentur"
      en: "And he made fifty loops in the edge of one curtain, and fifty in the edge of another curtain, that they might be joined one to another."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et fibulas aeneas quinquaginta quibus necteretur tectum et unum pallium ex omnibus sagis fieret"
      en: "And fifty buckles of brass wherewith the roof might be knit together, that of all the curtains there might be made one covering."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "fecit et opertorium tabernaculi de pellibus arietum rubricatis aliudque desuper velamentum de pellibus ianthinis"
      en: "He made also a cover for the tabernacle of rams' skins dyed red: and another cover over that of violet skins."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "fecit et tabulas tabernaculi de lignis setthim stantes"
      en: "He made also the boards of the tabernacle of setim wood standing."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "decem cubitorum erat longitudo tabulae unius et unum ac semis cubitum latitudo retinebat"
      en: "The length of one board was ten cubits: and the breadth was one cubit and a half."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "binae incastraturae erant per singulas tabulas ut altera alteri iungeretur sic fecit in omnibus tabulis tabernaculi"
      en: "There were two mortises throughout every board, that one might be joined to the other. And in this manner he made for all the boards of the tabernacle."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "e quibus viginti ad plagam meridianam erant contra austrum"
      en: "Of which twenty were at the south side southward,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "cum quadraginta basibus argenteis duae bases sub una tabula ponebantur ex utraque angulorum parte ubi incastraturae laterum in angulis terminantur"
      en: "With forty sockets of silver, two sockets were put under one board on the two sides of the corners, where the mortises of the sides end in the corners."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ad plagam quoque tabernaculi quae respicit ad aquilonem fecit viginti tabulas"
      en: "At that side also of the tabernacle, that looketh toward the north, he made twenty boards."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "cum quadraginta argenteis basibus duas bases per singulas tabulas"
      en: "With forty sockets of silver, two sockets for every board."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "contra occidentem vero id est ad eam partem tabernaculi quae mare respicit fecit sex tabulas"
      en: "But against the west, to wit, at that side of the tabernacle, which looketh to the sea, he made six boards,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et duas alias per singulos angulos tabernaculi retro"
      en: "And two others at each corner of the tabernacle behind:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quae iunctae erant deorsum usque sursum et in unam conpagem pariter ferebantur ita fecit ex utraque parte per angulos"
      en: "Which were also joined from beneath unto the top, and went together into one joint. Thus he did on both sides at the corners:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ut octo essent simul tabulae et haberent bases argenteas sedecim binas scilicet bases sub singulis tabulis"
      en: "So there were in all eight boards and they had sixteen sockets of silver, to wit, two sockets under every board."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "fecit et vectes de lignis setthim quinque ad continendas tabulas unius lateris tabernaculi"
      en: "He made also bars of setim wood, five to hold together the boards of one side of the tabernacle,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et quinque alios ad alterius lateris tabulas coaptandas et extra hos quinque alios vectes ad occidentalem plagam tabernaculi contra mare"
      en: "And five others to join together the boards of the other side: and besides these, five other bars at the west side of the tabernacle towards the sea."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "fecit quoque vectem alium qui per medias tabulas ab angulo usque ad angulum perveniret"
      en: "He made also another bar, that might come by the midst of the boards from corner to corner."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "ipsa autem tabulata deauravit et circulos eorum fecit aureos per quos vectes induci possint quos et ipsos aureis lamminis operuit"
      en: "And the board works themselves he overlaid with gold, casting for them sockets of silver. And their rings he made of gold, through which the bars might be drawn: and he covered the bars themselves with plates of gold."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "fecit et velum de hyacintho purpura vermiculo ac bysso retorta opere polymitario varium atque distinctum"
      en: "He made also a veil of violet, and purple, scarlet, and fine twisted linen, varied and distinguished with embroidery:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et quattuor columnas de lignis setthim quas cum capitibus deauravit fusis basibus earum argenteis"
      en: "And four pillars of setim wood, which with their heads be overlaid with gold, casting for them sockets of silver."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "fecit et tentorium in introitu tabernaculi ex hyacintho purpura vermiculo byssoque retorta opere plumarii"
      en: "He made also a hanging in the entry of the tabernacle of violet, purple, scarlet, and fine twisted linen, with the work of an embroiderer."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et columnas quinque cum capitibus suis quas operuit auro basesque earum fudit aeneas"
      en: "And five pillars with their heads, which he covered with gold, and their sockets he cast of brass."
    status: { la: verified, en: verified }
