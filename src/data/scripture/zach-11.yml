# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: zach
chapter: 11
verses:
  - n: 1
    text:
      la: "Aperi, Libane, portas tuas, et comedat ignis cedros tuas."
      en: "Open thy gates, O Libanus, and let fire devour thy cedars."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ulula, abies, quia cecidit cedrus, quoniam magnifici vastati sunt: ululate, quercus Basan, quoniam succisus est saltus munitus."
      en: "Howl, thou fir tree, for the cedar is fallen, for the mighty are laid waste: howl, ye oaks of Basan, because the fenced forest is cut down."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Vox ululatus pastorum, quia vastata est magnificentia eorum: vox rugitus leonum, quoniam vastata est superbia Jordanis."
      en: "The voice of the howling of the shepherds, because their glory is laid waste: the voice of the roaring of the lions, because the pride of the Jordan is spoiled."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Haec dicit Dominus Deus meus: Pasce pecora occisionis,"
      en: "Thus saith the Lord my God: Feed the flock of the slaughter,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quae qui possederant occidebant, et non dolebant, et vendebant ea, dicentes: Benedictus Dominus! divites facti sumus: et pastores eorum non parcebant eis."
      en: "Which they that possessed, slew, and repented not, and they sold them, saying: Blessed be the Lord, we are become rich: and their shepherds spared them not."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et ego non parcam ultra super habitantes terram, dicit Dominus: ecce ego tradam homines, unumquemque in manu proximi sui, et in manu regis sui: et concident terram, et non eruam de manu eorum."
      en: "And I will no more spare the inhabitants of the land, saith the Lord: behold I will deliver the men, every one into his neighbour's hand, and into the hand of his king: and they shall destroy the land, and I will not deliver it out of their hand."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et pascam pecus occisionis propter hoc, o pauperes gregis! et assumpsi mihi duas virgas: unam vocavi Decorem, et alteram vocavi Funiculum: et pavi gregem."
      en: "And I will feed the flock of slaughter for this, O ye poor of the flock. And I took unto me two rods, one I called Beauty, and the other I called a Cord, and I fed the flock."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et succidi tres pastores in mense uno, et contracta est anima mea in eis, siquidem et anima eorum variavit in me."
      en: "And I cut off three shepherds in one month, and my soul was straitened in their regard: for their soul also varied in my regard."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et dixi: Non pascam vos: quod moritur, moriatur, et quod succiditur, succidatur: et reliqui devorent unusquisque carnem proximi sui."
      en: "And I said: I will not feed you: that which dieth, let it die: and that which is cut off, let it be cut off: and let the rest devour every one the flesh of his neighbour."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et tuli virgam meam quae vocabatur Decus, et abscidi eam, ut irritum facerem foedus meum quod percussi cum omnibus populis."
      en: "And I took my rod that was called Beauty, and I cut it asunder to make void my covenant, which I had made with all people."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et in irritum deductum est in die illa: et cognoverunt sic pauperes gregis, qui custodiunt mihi, quia verbum Domini est."
      en: "And it was made void in that day: and so the poor of the flock that keep for me, understood that it is the word of the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et dixi ad eos: Si bonum est in oculis vestris, afferte mercedem meam: et si non, quiescite. Et appenderunt mercedem meam triginta argenteos."
      en: "And I said to them: If it be good in your eyes, bring hither my wages: and if not, be quiet. And they weighed for my wages thirty pieces of silver."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et dixit Dominus ad me: Projice illud ad statuarium, decorum pretium quo appretiatus sum ab eis. Et tuli triginta argenteos, et projeci illos in domum Domini, ad statuarium."
      en: "And the Lord said to me: Cast it to the statuary, a handsome price, that I was prized at by them. And I took the thirty pieces of silver, and I cast them into the house of the Lord to the statuary."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et praecidi virgam meam secundam, quae appellabatur Funiculus, ut dissolverem germanitatem inter Judam et Israel."
      en: "And I cut off my second rod that was called a Cord, that I might break the brotherhood between Juda and Israel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et dixit Dominus ad me: Adhuc sunt tibi vasa pastoris stulti."
      en: "And the Lord said to me: Take to thee yet the instruments of a foolish shepherd."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quia ecce ego suscitabo pastorem in terra, qui derelicta non visitabit, dispersum non quaeret, et contritum non sanabit, et id quod stat non enutriet, et carnes pinguium comedet, et ungulas eorum dissolvet."
      en: "For behold I will raise up a shepherd in the land, who shall not visit what is forsaken, nor seek what is scattered, nor heal what is broken, nor nourish that which standeth, and he shall eat the flesh of the fat ones, and break their hoofs."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "O pastor, et idolum derelinquens gregem: gladius super brachium ejus, et super oculum dextrum ejus: brachium ejus ariditate siccabitur, et oculus dexter ejus tenebrescens obscurabitur."
      en: "O shepherd, and idol, that forsaketh the flock: the sword upon his arm and upon his right eye: his arm shall quite wither away, and his right eye shall be utterly darkened."
    status: { la: verified, en: verified }
