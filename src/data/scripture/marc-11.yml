# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: marc
chapter: 11
verses:
  - n: 1
    text:
      la: "et cum adpropinquarent Hierosolymae et Bethaniae ad montem Olivarum mittit duos ex discipulis suis"
      en: "And when they were drawing near to Jerusalem and to Bethania at the mount of Olives, he sendeth two of his disciples,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ait illis ite in castellum quod est contra vos et statim introeuntes illuc invenietis pullum ligatum super quem nemo adhuc hominum sedit solvite illum et adducite"
      en: "And saith to them: Go into the village that is over against you, and immediately at your coming in thither, you shall find a colt tied, upon which no man yet hath sat: loose him, and bring him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et si quis vobis dixerit quid facitis dicite quia Domino necessarius est et continuo illum dimittet huc"
      en: "And if any man shall say to you, What are you doing? say ye that the Lord hath need of him: and immediately he will let him come hither."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et abeuntes invenerunt pullum ligatum ante ianuam foris in bivio et solvunt eum"
      en: "And going their way, they found the colt tied before the gate without, in the meeting of two ways: and they loose him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et quidam de illic stantibus dicebant illis quid facitis solventes pullum"
      en: "And some of them that stood there, said to them: What do you loosing the colt?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui dixerunt eis sicut praeceperat illis Iesus et dimiserunt eis"
      en: "Who said to them as Jesus had commanded them; and they let him go with them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et duxerunt pullum ad Iesum et inponunt illi vestimenta sua et sedit super eo"
      en: "And they brought the colt to Jesus; and they lay their garments on him, and he sat upon him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "multi autem vestimenta sua straverunt in via alii autem frondes caedebant de arboribus et sternebant in via"
      en: "And many spread their garments in the way: and others cut down boughs from the trees, and strewed them in the way."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et qui praeibant et qui sequebantur clamabant dicentes osanna benedictus qui venit in nomine Domini"
      en: "And they that went before and they that followed, cried, saying: Hosanna, blessed is he that cometh in the name of the Lord."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "benedictum quod venit regnum patris nostri David osanna in excelsis"
      en: "Blessed be the kingdom of our father David that cometh: Hosanna in the highest."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et introivit Hierosolyma in templum et circumspectis omnibus cum iam vespera esset hora exivit in Bethania cum duodecim"
      en: "And he entered into Jerusalem, into the temple: and having viewed all things round about, when now the eventide was come, he went out to Bethania with the twelve."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et alia die cum exirent a Bethania esuriit"
      en: "And the next day when they came out from Bethania, he was hungry."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cumque vidisset a longe ficum habentem folia venit si quid forte inveniret in ea et cum venisset ad eam nihil invenit praeter folia non enim erat tempus ficorum"
      en: "And when he had seen afar off a fig tree having leaves, he came if perhaps he might find any thing on it. And when he was come to it, he found nothing but leaves. For it was not the time for figs."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et respondens dixit ei iam non amplius in aeternum quisquam fructum ex te manducet et audiebant discipuli eius"
      en: "And answering he said to it: May no man hereafter eat fruit of thee any more for ever. And his disciples heard it."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et veniunt Hierosolymam et cum introisset templum coepit eicere vendentes et ementes in templo et mensas nummulariorum et cathedras vendentium columbas evertit"
      en: "And they came to Jerusalem. And when he was entered into the temple, he began to cast out them that sold and bought in the temple, and overthrew the tables of the moneychangers, and the chairs of them that sold doves."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et non sinebat ut quisquam vas transferret per templum"
      en: "And he suffered not that any man should carry a vessel through the temple;"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et docebat dicens eis non scriptum est quia domus mea domus orationis vocabitur omnibus gentibus vos autem fecistis eam speluncam latronum"
      en: "And he taught, saying to them: Is it not written, My house shall be called the house of prayer to all nations? But you have made it a den of thieves."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quo audito principes sacerdotum et scribae quaerebant quomodo eum perderent timebant enim eum quoniam universa turba admirabatur super doctrina eius"
      en: "Which when the chief priests and the scribes had heard, they sought how they might destroy him. For they feared him, because the whole multitude was in admiration at his doctrine."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et cum vespera facta esset egrediebatur de civitate"
      en: "And when evening was come, he went forth out of the city."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et cum mane transirent viderunt ficum aridam factam a radicibus"
      en: "And when they passed by in the morning they saw the fig tree dried up from the roots."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et recordatus Petrus dicit ei rabbi ecce ficus cui maledixisti aruit"
      en: "And Peter remembering, said to him: Rabbi, behold the fig tree, which thou didst curse, is withered away."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et respondens Iesus ait illis habete fidem Dei"
      en: "And Jesus answering, saith to them: Have the faith of God."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "amen dico vobis quicumque dixerit huic monti tollere et mittere in mare et non haesitaverit in corde suo sed crediderit quia quodcumque dixerit fiat fiet ei"
      en: "Amen I say to you, that whosoever shall say to this mountain, Be thou removed and be cast into the sea, and shall not stagger in his heart, but believe, that whatsoever he saith shall be done; it shall be done unto him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "propterea dico vobis omnia quaecumque orantes petitis credite quia accipietis et veniet vobis"
      en: "Therefore I say unto you, all things, whatsoever you ask when ye pray, believe that you shall receive; and they shall come unto you."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et cum stabitis ad orandum dimittite si quid habetis adversus aliquem ut et Pater vester qui in caelis est dimittat vobis peccata vestra"
      en: "And when you shall stand to pray, forgive, if you have aught against any man; that your Father also, who is in heaven, may forgive you your sins."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "quod si vos non dimiseritis nec Pater vester qui in caelis est dimittet vobis peccata vestra"
      en: "But if you will not forgive, neither will your Father that is in heaven, forgive you your sins."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et veniunt rursus Hierosolymam et cum ambularet in templo accedunt ad eum summi sacerdotes et scribae et seniores"
      en: "And they come again to Jerusalem. And when he was walking in the temple, there come to him the chief priests and the scribes and the ancients,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et dicunt illi in qua potestate haec facis et quis tibi dedit hanc potestatem ut ista facias"
      en: "And they say to him: By what authority dost thou these things? and who hath given thee this authority that thou shouldst do these things?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Iesus autem respondens ait illis interrogabo vos et ego unum verbum et respondete mihi et dicam vobis in qua potestate haec faciam"
      en: "And Jesus answering, said to them: I will also ask you one word, and answer you me, and I will tell you by what authority I do these things."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "baptismum Iohannis de caelo erat an ex hominibus respondete mihi"
      en: "The baptism of John, was it from heaven, or from men? Answer me."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "at illi cogitabant secum dicentes si dixerimus de caelo dicet quare ergo non credidistis ei"
      en: "But they thought with themselves, saying: If we say, From heaven; he will say, Why then did you not believe him?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "sed dicemus ex hominibus timebant populum omnes enim habebant Iohannem quia vere propheta esset"
      en: "If we say, From men, we fear the people. For all men counted John that he was a prophet indeed."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et respondentes dicunt Iesu nescimus respondens Iesus ait illis neque ego dico vobis in qua potestate haec faciam"
      en: "And they answering, say to Jesus: We know not. And Jesus answering, saith to them: Neither do I tell you by what authority I do these things."
    status: { la: verified, en: verified }
