# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: osee
chapter: 5
verses:
  - n: 1
    text:
      la: "audite hoc sacerdotes et adtendite domus Israhel et domus regis auscultate quia vobis iudicium est quoniam laqueus facti estis speculationi et rete expansum super Thabor"
      en: "Hear ye this, O priests, and hearken, O ye house of Israel, and give ear, O house of the king: for there is a judgment against you, because you have been a snare to them whom you should have watched over, and a net spread upon Thabor."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et victimas declinastis in profundum et ego eruditor omnium eorum"
      en: "And you have turned aside victims into the depth: and I am, the teacher of them all."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ego scio Ephraim et Israhel non est absconditus a me quia nunc fornicatus est Ephraim contaminatus est Israhel"
      en: "I know Ephraim, and Israel is not hid from me: for now Ephraim hath committed fornication, Israel is defiled."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "non dabunt cogitationes suas ut revertantur ad Dominum suum quia spiritus fornicationis in medio eorum et Dominum non cognoverunt"
      en: "They will not set their thoughts to return to their God: for the spirit of fornication is in the midst of them, and they have not known the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et respondebit arrogantia Israhel in facie eius et Israhel et Ephraim ruent in iniquitate sua ruet etiam Iudas cum eis"
      en: "And the pride of Israel shall answer in his face: and Israel and Ephraim shall fall in their iniquity, Juda also shall fall with them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in gregibus suis et in armentis suis vadent ad quaerendum Dominum et non invenient ablatus est ab eis"
      en: "With their flocks, and with their herds, they shall go to seek the Lord, and shall not find him: he is withdrawn from them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in Domino praevaricati sunt quia filios alienos genuerunt nunc devorabit eos mensis cum partibus suis"
      en: "They have transgressed against the Lord, for they have begotten children that are strangers: now shall a month devour them with their portions."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "clangite bucina in Gabaa tuba in Rama ululate in Bethaven post tergum tuum Beniamin"
      en: "Blow ye the cornet in Gabaa, the trumpet in Rama: howl ye in Bethaven, behind thy back, O Benjamin."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ephraim in desolatione erit in die correptionis in tribubus Israhel ostendi fidem"
      en: "Ephraim shall be in desolation in the day of rebuke: among the tribes of Israel I have shewn that which shall surely be."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "facti sunt principes Iuda quasi adsumentes terminum super eos effundam quasi aquam iram meam"
      en: "The princes of Juda are become as they that take up the bound: I will pour out my wrath upon them like water."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "calumniam patiens Ephraim fractus iudicio quoniam coepit abire post sordem"
      en: "Ephraim is under oppression, and broken in judgment: because he began to go after filthiness."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et ego quasi tinea Ephraim et quasi putredo domui Iuda"
      en: "And I will be like a moth to Ephraim: and like rottenness to the house of Juda."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et vidit Ephraim languorem suum et Iudas vinculum suum et abiit Ephraim ad Assur et misit ad regem ultorem et ipse non poterit sanare vos nec solvere poterit a vobis vinculum"
      en: "And Ephraim saw his sickness, and Juda his band: and Ephraim went to the Assyrian, and sent to the avenging king: and he shall not be able to heal you, neither shall he be able to take off the band from you."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quoniam ego quasi leaena Ephraim et quasi catulus leonis domui Iuda ego ego capiam et vadam tollam et non est qui eruat"
      en: "For I will be like a lioness to Ephraim, and like a lion's whelp to the house of Juda: I, I will catch, and go: I will take away, and there is none that can rescue."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "vadens revertar ad locum meum donec deficiatis et quaeratis faciem meam"
      en: "I will go and return to my place: until you are consumed, and seek my face."
    status: { la: verified, en: verified }
