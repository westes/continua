# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 28
verses:
  - n: 1
    text:
      la: "Applica quoque ad te Aaron fratrem tuum cum filiis suis de medio filiorum Israel, ut sacerdotio fungantur mihi: Aaron, Nadab, et Abiu, Eleazar, et Ithamar."
      en: "Take unto thee also Aaron thy brother with his sons, from among the children of Israel, that they may minister to me in the priest's office: Aaron, Nadab, and Abiu, Eleazar, and Ithamar."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Faciesque vestem sanctam Aaron fratri tuo in gloriam et decorem."
      en: "And thou shalt make a holy vesture for Aaron thy brother for glory and for beauty."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et loqueris cunctis sapientibus corde quos replevi spiritu prudentiae, ut faciant vestes Aaron, in quibus sanctificatus ministret mihi."
      en: "And thou shalt speak to all the wise of heart, whom I have filled with the spirit of wisdom, that they may make Aaron's vestments, in which he being consecrated may minister to me."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Haec autem erunt vestimenta quae faciet: rationale et superhumerale, tunicam et lineam strictam, cidarim et balteum. Facient vestimenta sancta fratri tuo Aaron et filiis ejus, ut sacerdotio fungantur mihi."
      en: "And these shall be the vestments that they shall make: A rational and an ephod, a tunick and a strait linen garment, a mitre and a girdle. They shall make the holy vestments for thy brother Aaron and his sons, that they may do the office of priesthood unto me."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Accipientque aurum, et hyacinthum, et purpuram, coccumque bis tinctum, et byssum."
      en: "And they shall take gold, and violet, and purple, and scarlet twice dyed, and fine linen."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Facient autem superhumerale de auro et hyacintho et purpura, coccoque bis tincto, et bysso retorta, opere polymito."
      en: "And they shall make the ephod of gold, and violet, and purple, and scarlet twice dyed, and fine twisted linen, embroidered with divers colours."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Duas oras junctas habebit in utroque latere summitatum, ut in unum redeant."
      en: "It shall have the two edges joined in the top on both sides, that they may be closed together."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ipsa quoque textura et cuncta operis varietas erit ex auro et hyacintho, et purpura, coccoque bis tincto, et bysso retorta."
      en: "The very workmanship also and all the variety of the work shall be of gold, and violet, and purple, and scarlet twice dyed, and fine twisted linen."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sumesque duos lapides onychinos, et sculpes in eis nomina filiorum Israel:"
      en: "And thou shalt take two onyx stones, and shalt grave on them the names of the children of Israel:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sex nomina in lapide uno, et sex reliqua in altero, juxta ordinem nativitatis eorum."
      en: "Six names on one stone, and the other six on the other, according to the order of their birth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Opere sculptoris et caelatura gemmarii, sculpes eos nominibus filiorum Israel, inclusos auro atque circumdatos:"
      en: "With the work of an engraver and the graving of a jeweller, thou shalt engrave them with the names of the children of Israel, set in gold and compassed about:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et pones in utroque latere superhumeralis, memoriale filiis Israel. Portabitque Aaron nomina eorum coram Domino super utrumque humerum, ob recordationem."
      en: "And thou shalt put them in both sides of the ephod, a memorial for the children of Israel. And Aaron shall bear their names before the Lord upon both shoulders, for a remembrance."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Facies et uncinos ex auro,"
      en: "Thou shalt make also hooks of gold."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et duas catenulas ex auro purissimo sibi invicem cohaerentes, quas inseres uncinis."
      en: "And two little chains of the purest gold linked one to another, which thou shalt put into the hooks."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Rationale quoque judicii facies opere polymito juxta texturam superhumeralis, ex auro, hyacintho, et purpura, coccoque bis tincto, et bysso retorta."
      en: "And thou shalt make the rational of judgment with embroidered work of divers colours, according to the workmanship of the ephod, of gold, violet, and purple, and scarlet twice dyed, and fine twisted linen."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quadrangulum erit et duplex: mensuram palmi habebit tam in longitudine quam in latitudine."
      en: "It shall be foursquare and doubled: it shall be the measure of a span both in length and in breadth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ponesque in eo quatuor ordines lapidum: in primo versu erit lapis sardius, et topazius, et smaragdus:"
      en: "And thou shalt set in it four rows of stones: in the first row shall be a sardius stone, and a topaz, and an emerald:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "in secundo carbunculus, sapphirus, et jaspis:"
      en: "In the second a carbuncle, a sapphire and a jasper."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "in tertio ligurius, achates, et amethystus:"
      en: "In the third a ligurius, an agate, and an amethyst:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "in quarto chrysolithus, onychinus, et beryllus. Inclusi auro erunt per ordines suos."
      en: "In the fourth a chrysolite, an onyx, and a beryl. They shall be set in gold by their rows."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Habebuntque nomina filiorum Israel: duodecim nominibus caelabuntur, singuli lapides nominibus singulorum per duodecim tribus."
      en: "And they shall have the names of the children of Israel: with twelve names shall they be engraved, each stone with the name of one according to the twelve tribes."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Facies in rationali catenas sibi invicem cohaerentes ex auro purissimo,"
      en: "And thou shalt make on the rational chains linked one to another of the purest gold:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et duos annulos aureos, quos pones in utraque rationalis summitate:"
      en: "And two rings of gold, which thou shalt put in the two ends at the top of the rational."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "catenasque aureas junges annulis, qui sunt in marginibus ejus,"
      en: "And the golden chains thou shalt join to the rings, that are in the ends thereof:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et ipsarum catenarum extrema duobus copulabis uncinis in utroque latere superhumeralis quod rationale respicit."
      en: "And the ends of the chains themselves thou shalt join together with two hooks on both sides of the ephod, which is towards the rational."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Facies et duos annulos aureos, quos pones in summitatibus rationalis, in oris, quae e regione sunt superhumeralis, et posteriora ejus aspiciunt."
      en: "Thou shalt make also two rings of gold which thou shalt put in the top parts of the rational, in the borders that are over against the ephod, and look towards the back parts thereof."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Necnon et alios duos annulos aureos, qui ponendi sunt in utroque latere superhumeralis deorsum, quod respicit contra faciem juncturae inferioris, ut aptari possit cum superhumerali,"
      en: "Moreover also other two rings of gold, which are to be set on each side of the ephod beneath, that looketh towards the nether joining, that the rational may be fitted with the ephod,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et stringatur rationale annulis suis cum annulis superhumeralis vitta hyacinthina, ut maneat junctura fabrefacta, et a se invicem rationale et superhumerale nequeant separari."
      en: "And may be fastened by the rings thereof unto the rings of the ephod with a violet fillet, that the joining artificially wrought may continue, and the rational and the ephod may not be loosed one from the other."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Portabitque Aaron nomina filiorum Israel in rationali judicii super pectus suum, quando ingredietur Sanctuarium, memoriale coram Domino in aeternum."
      en: "And Aaron shall bear the names of the children of Israel in the rational of judgment upon his breast, when he shall enter into the sanctuary, a memorial before the Lord for ever."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Pones autem in rationali judicii Doctrinam et Veritatem, quae erunt in pectore Aaron, quando ingredietur coram Domino: et gestabit judicium filiorum Israel in pectore suo, in conspectu Domini semper."
      en: "And thou shalt put in the rational of judgment doctrine and truth, which shall be on Aaron's breast, when he shall go in before the Lord: and he shall bear the judgment of the children of Israel on his breast, in the sight of the Lord always."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Facies et tunicam superhumeralis totam hyacinthinam,"
      en: "And thou shalt make the tunick of the ephod all of violet,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "in cujus medio supra erit capitium, et ora per gyrum ejus textilis, sicut fieri solet in extremis vestium partibus, ne facile rumpatur."
      en: "In the midst whereof above shall be a hole for the head, and a border round about it woven, as is wont to be made in the outmost parts of garments, that it may not easily be broken."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Deorsum vero, ad pedes ejusdem tunicae, per circuitum, quasi mala punica facies, ex hyacintho, et purpura, et cocco bis tincto, mistis in medio tintinnabulis,"
      en: "And beneath at the feet of the same tunick round about, thou shalt make as it were pomegranates, of violet, and purple, and scarlet twice dyed, with little bells set between:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "ita ut tintinnabulum sit aureum et malum punicum: rursumque tintinnabulum aliud aureum et malum punicum."
      en: "So that there shall be a golden bell and a pomegranate, and again another golden bell and a pomegranate."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et vestietur ea Aaron in officio ministerii, ut audiatur sonitus quando ingreditur et egreditur sanctuarium in conspectu Domini, et non moriatur."
      en: "And Aaron shall be vested with it in the office of his ministry, that the sound may be heard, when he goeth in and cometh out of the sanctuary, in the sight of the Lord, and that he may not die."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Facies et laminam de auro purissimo, in qua sculpes opere caelatoris, Sanctum Domino."
      en: "Thou shalt make also a plate of the purest gold: wherein thou shalt grave with engraver's work, Holy to the Lord."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Ligabisque eam vitta hyacinthina, et erit super tiaram,"
      en: "And thou shalt tie it with a violet fillet, and it shall be upon the mitre,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "imminens fronti pontificis. Portabitque Aaron iniquitates eorum, quae obtulerunt et sanctificaverunt filii Israel, in cunctis muneribus et donariis suis. Erit autem lamina semper in fronte ejus, ut placatus sit eis Dominus."
      en: "Hanging over the forehead of the high priest. And Aaron shall bear the iniquities of those things, which the children of Israel have offered and sanctified, in all their gifts and offerings. And the plate shall be always on his forehead, that the Lord may be well pleased with them."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Stringesque tunicam bysso, et tiaram byssinam facies, et balteum opere plumarii."
      en: "And thou shalt gird the tunick with fine linen, and thou shalt make a fine linen mitre, and a girdle of embroidered work."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Porro filiis Aaron tunicas lineas parabis et balteos ac tiaras in gloriam et decorem:"
      en: "Moreover for the sons of Aaron thou shalt prepare linen tunicks, and girdles and mitres for glory and beauty:"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "vestiesque his omnibus Aaron fratrem tuum et filios ejus cum eo. Et cunctorum consecrabis manus, sanctificabisque illos, ut sacerdotio fungantur mihi."
      en: "And with all these things thou shalt vest Aaron thy brother, and his sons with him. And thou shalt consecrate the hands of them all, and shalt sanctify them, that they may do the office of priesthood unto me."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Facies et feminalia linea, ut operiant carnem turpitudinis suae, a renibus usque ad femora:"
      en: "Thou shalt make also linen breeches, to cover the flesh of their nakedness from the reins to the thighs:"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et utentur eis Aaron et filii ejus quando ingredientur tabernaculum testimonii, vel quando appropinquant ad altare ut ministrent in sanctuario, ne iniquitatis rei moriantur. Legitimum sempiternum erit Aaron, et semini ejus post eum."
      en: "And Aaron and his sons shall use them when they shall go in to the tabernacle of the testimony, or when they approach the altar to minister in the sanctuary, lest being guilty of iniquity they die. It shall be a law for ever to Aaron, and to his seed after him."
    status: { la: verified, en: verified }
