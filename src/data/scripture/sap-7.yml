# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sap
chapter: 7
verses:
  - n: 1
    text:
      la: "sum quidem et ego mortalis homo similis omnibus et ex genere terreno illius qui prior finctus est et in ventre matris figuratus sum caro"
      en: "I myself also am a mortal man, like all others, and of the race of him, that was first made of the earth, and in the womb of my mother I was fashioned to be flesh."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "decem mensuum tempore coagulatus in sanguine ex semine hominis et delectamento somni conveniente"
      en: "In the time of ten months I was compacted in blood, of the seed of man, and the pleasure of sleep concurring."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ego natus accepi communem aerem et in similiter factam decidi terram primam vocem similem omnibus emisi plorans"
      en: "And being born I drew in the common air, and fell upon the earth, that is made alike, and the first voice which I uttered was crying, as all others do."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "in involumentis nutritus sum et curis magnis"
      en: "I was nursed in swaddling clothes, and with great cares."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "nemo enim ex regibus aliud habuit nativitatis initium"
      en: "For none of the kings had any other beginning of birth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "unus ergo introitus est omnibus ad vitam et similis exitus"
      en: "For all men have one entrance into life, and the like going out."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "propter hoc optavi et datus est mihi sensus et invocavi et venit in me spiritus sapientiae"
      en: "Wherefore I wished, and understanding was given me: and I called upon God, and the spirit of wisdom came upon me:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et praeposui illam regnis et sedibus et divitias nihil esse duxi in conparatione illius"
      en: "And I preferred her before kingdoms and thrones, and esteemed riches nothing in comparison of her."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "nec conparavi illi lapidem pretiosum quoniam omne aurum in conparatione illius harena est exigua et tamquam lutum aestimabitur argentum in conspectu illius"
      en: "Neither did I compare unto her any precious stone: for all gold in comparison of her, is as a little sand, and silver in respect to her shall be counted as clay."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "super salutem et speciem dilexi illam et proposui pro luce habere illam quoniam inextinguibile est lumen illius"
      en: "I loved her above health and beauty, and chose to have her instead of light: for her light cannot be put out."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "venerunt autem mihi omnia bona pariter cum illa et innumerabilis honestas per manus illius"
      en: "Now all good things came to me together with her, and innumerable riches through her hands,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et laetatus sum in omnibus quoniam antecedebat ista sapientia et ignorabam quoniam horum omnium mater est"
      en: "And I rejoiced in all these: for this wisdom went before me, and I knew not that she was the mother of them all."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quam sine fictione didici et sine invidia communico et honestatem illius non abscondo"
      en: "Which I have learned without guile, and communicate without envy, and her riches I hide not."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "infinitus enim thesaurus est hominibus quod qui usi sunt participes facti sunt amicitiae Dei propter disciplinae dona commendati"
      en: "For she is an infinite treasure to men! which they that use, become the friends of God, being commended for the gift of discipline."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "mihi autem det Deus dicere ex sententia et praesumere digna horum quae dantur quoniam ipse et sapientiae dux est et sapientium emendator"
      en: "And God hath given to me to speak as I would, and to conceive thoughts worthy of those things that are given me: because he is the guide of wisdom, and the director of the wise:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "in manu enim illius et nos et sermones nostri et omnis sapientia et operum scientiae disciplina"
      en: "For in his hand are both we, and our words, and all wisdom, and the knowledge and skill of works."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ipse enim mihi dedit horum quae sunt scientiam veram ut sciam dispositionem orbis terrarum et virtutes elementorum"
      en: "For he hath given me the true knowledge of the things that are: to know the disposition of the whole world, and the virtues of the elements,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "initium et consummationem et medietatem temporum et meditationem omnium morum mutationes et divisiones temporum"
      en: "The beginning, and ending, and midst of the times, the alterations of their courses, and the changes of seasons,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "anni cursus et stellarum dispositiones"
      en: "The revolutions of the year, and the dispositions of the stars,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "naturas animalium et iras bestiarum vim ventorum et cogitationes hominum differentias arborum et virtutes radicum"
      en: "The natures of living creatures, and rage of wild beasts, the force of winds, and reasonings of men, the diversities of plants, and the virtues of roots,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et quaecumque sunt absconsa et inprovisa didici omnium enim artifex docuit me sapientia"
      en: "And all such things as are hid and not foreseen, I have learned: for wisdom, which is the worker of all things, taught me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "est enim in illa spiritus intellectus sanctus unicus multiplex subtilis mobilis dissertus incoinquinatus certus suavis amans bonum acutus qui nihil vetat benefacere"
      en: "For in her is the spirit of understanding: holy, one, manifold, subtile, eloquent, active, undefiled, sure, sweet, loving that which is good, quick, which nothing hindereth, beneficent,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "humanus stabilis certus securus omnem habens virtutem omnia prospiciens et qui capiat omnes spiritus intellegibiles mundos subtiles"
      en: "Gentle, kind, steadfast, assured, secure, having all power, overseeing all things, and containing all spirits, intelligible, pure, subtile."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "omnibus enim mobilibus mobilior est sapientia adtingit autem ubique et capit propter suam munditiam"
      en: "For wisdom is more active than all active things: and reacheth everywhere by reason of her purity."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "vapor est enim virtutis Dei et emanatio quaedam est claritatis omnipotentis Dei sincera et ideo nihil inquinatum in illa incurrit"
      en: "For she is a vapour of the power of God, and a certain pure emanation of the glory of the almighty God: and therefore no defiled thing cometh into her."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "candor est enim lucis aeternae et speculum sine macula Dei maiestatis et imago bonitatis illius"
      en: "For she is the brightness of eternal light, and the unspotted mirror of God's majesty, and the image of his goodness."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et cum sit una omnia potest et permanens in se omnia innovat et per nationes in animas sanctas se transfert amicos Dei et prophetas constituit"
      en: "And being but one, she can do all things: and remaining in herself the same, she reneweth all things, and through nations conveyeth herself into holy souls, she maketh the friends of God and prophets."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "neminem enim diligit Deus nisi eum qui cum sapientia inhabitat"
      en: "For God loveth none but him that dwelleth with wisdom."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "est enim haec speciosior sole et super omnem stellarum dispositionem luci conparata invenitur prior"
      en: "For she is more beautiful than the sun, and above all the order of the stars: being compared with the light, she is found before it."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "illi enim succedit nox sapientiam autem non vincit malitia"
      en: "For after this cometh night, but no evil can overcome wisdom."
    status: { la: verified, en: verified }
