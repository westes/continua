# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 49
verses:
  - n: 1
    text:
      la: "Memoria Josiae in compositionem odoris facta opus pigmentarii."
      en: "The memory of Josias is like the composition of a sweet smell made by the art of a perfumer:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "In omni ore quasi mel indulcabitur ejus memoria, et ut musica in convivio vini."
      en: "His remembrance shall be sweet as honey in every mouth, and as music at a banquet of wine."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ipse est directus divinitus in poenitentiam gentis, et tulit abominationes impietatis."
      en: "He was directed by God unto the repentance of the nation, and he took away the abominations of wickedness."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et gubernavit ad Dominum cor ipsius, et in diebus peccatorum corroboravit pietatem."
      en: "And he directed his heart towards the Lord, and in the days of sinners he strengthened godliness."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Praeter David et Ezechiam et Josiam, omnes peccatum commiserunt:"
      en: "Except David, and Ezechias, and Josias, all committed sin."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "nam reliquerunt legem Altissimi reges Juda, et contempserunt timorem Dei."
      en: "For the kings of Juda forsook the law of the most High, and despised the fear of God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dederunt enim regnum suum aliis, et gloriam suam alienigenae genti."
      en: "So they gave their kingdom to others, and their glory to a strange nation."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Incenderunt electam sanctitatis civitatem, et desertas fecerunt vias ipsius in manu Jeremiae."
      en: "They burnt the chosen city of holiness, and made the streets thereof desolate according to the prediction of Jeremias."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Nam male tractaverunt illum qui a ventre matris consecratus est propheta, evertere, et eruere, et perdere, et iterum aedificare, et renovare:"
      en: "For they treated him evil, who was consecrated a prophet from his mother's womb, to overthrow, and pluck up, and destroy, and to build again, and renew."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ezechiel, qui vidit conspectum gloriae quam ostendit illi in curru cherubim."
      en: "It was Ezechiel that saw the glorious vision, which was shewn him upon the chariot of cherubims."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Nam commemoratus est inimicorum in imbre, benefacere illis qui ostenderunt rectas vias."
      en: "For he made mention of the enemies under the figure of rain, and of doing good to them that shewed right ways."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et duodecim prophetarum ossa pullulent de loco suo: nam corroboraverunt Jacob, et redemerunt se in fide virtutis."
      en: "And may the bones of the twelve prophets spring up out of their place: for they strengthened Jacob, and redeemed themselves by strong faith."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quomodo amplificemus Zorobabel? nam et ipse quasi signum in dextera manu:"
      en: "How shall we magnify Zorobabel? for he was as a signet on the right hand;"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sic et Jesum filium Josedec, qui in diebus suis aedificaverunt domum, et exaltaverunt templum sanctum Domino, paratum in gloriam sempiternam."
      en: "In like manner Jesus the son of Josedec? who in their days built the house, and set up a holy temple to the Lord, prepared for everlasting glory."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et Nehemias in memoriam multi temporis, qui erexit nobis muros eversos, et stare fecit portas et seras, qui erexit domos nostras."
      en: "And let Nehemias be a long time remembered, who raised up for us our walls that were cast down, and set up the gates and the bars, who rebuilt our houses."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nemo natus est in terra qualis Henoch, nam et ipse receptus est a terra:"
      en: "No man was born upon earth like Henoch: for he also was taken up from the earth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "neque ut Joseph, qui natus est homo princeps fratrum, firmamentum gentis, rector fratrum, stabilimentum populi:"
      en: "Nor as Joseph, who was a man born prince of his brethren, the support of his family, the ruler of his brethren, the stay of the people:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ossa ipsius visitata sunt, et post mortem prophetaverunt."
      en: "And his bones were visited, and after death they prophesied."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Seth et Sem apud homines gloriam adepti sunt, et super omnem animam in origine Adam."
      en: "Seth and Sem obtained glory among men: and above every soul Adam in the beginning."
    status: { la: verified, en: verified }
