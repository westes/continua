# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 40
verses:
  - n: 1
    text:
      la: "his ita gestis accidit ut peccarent duo eunuchi pincerna regis Aegypti et pistor domino suo"
      en: "After this, it came to pass, that two eunuchs, the butler and the baker of the king of Egypt, offended their lord."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "iratusque Pharao contra eos nam alter pincernis praeerat alter pistoribus"
      en: "And Pharao being angry with them (now the one was chief butler, the other chief baker)"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "misit eos in carcerem principis militum in quo erat vinctus et Ioseph"
      en: "He sent them to the prison of the commander of the soldiers, in which Joseph also was prisoner,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "at custos carceris tradidit eos Ioseph qui et ministrabat eis aliquantum temporis fluxerat et illi in custodia tenebantur"
      en: "But the keeper of the prison delivered them to Joseph, and he served them. Some little time passed, and they were kept in custody."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "videruntque ambo somnium nocte una iuxta interpretationem congruam sibi"
      en: "And they both dreamed a dream the same night, according to the interpretation agreeing to themselves:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ad quos cum introisset Ioseph mane et vidisset eos tristes"
      en: "And when Joseph was come in to them in the morning, and saw them sad,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sciscitatus est dicens cur tristior est hodie solito facies vestra"
      en: "He asked them, saying: Why is your oountenance sadder to day than usual?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui responderunt somnium vidimus et non est qui interpretetur nobis dixitque ad eos Ioseph numquid non Dei est interpretatio referte mihi quid videritis"
      en: "They answered: We have dreamed a dream, and there is nobody to interpret it to us. And Joseph said to them: Both not interpretation belong to God? Tell me what you have dreamed. g The chief butler first told his dream: I saw before me a vine,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "narravit prior praepositus pincernarum somnium videbam coram me vitem"
      en: "The chief butler first told his dream: I saw before me a vine,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in qua erant tres propagines crescere paulatim gemmas et post flores uvas maturescere"
      en: "On which were three branches, which by little and little sent out buds, and after the blossoms brought forth ripe grapes :"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "calicemque Pharaonis in manu mea tuli ergo uvas et expressi in calicem quem tenebam et tradidi poculum Pharaoni"
      en: "And the cup of Pharao was in my hand: and I took the grapes, and pressed them into the cup which I held, and I gave the cup to Pharao."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "respondit Ioseph haec est interpretatio somnii tres propagines tres adhuc dies sunt"
      en: "Joseph answered: This is the interpretation of the dream: The three branches are yet three days:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "post quos recordabitur Pharao magisterii tui et restituet te in gradum pristinum dabisque ei calicem iuxta officium tuum sicut facere ante consueveras"
      en: "After which Pharao will remember thy service, and will restore thee to thy former place: and thou shah present him the cup according to thy office, as before thou wast wont to do."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "tantum memento mei cum tibi bene fuerit et facies mecum misericordiam ut suggeras Pharaoni et educat me de isto carcere"
      en: "Only remember me, when it shall be well with thee, and do me this kindness: to put Pharao in mind to take me out of this prison:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quia furto sublatus sum de terra Hebraeorum et hic innocens in lacum missus sum"
      en: "For I was stolen away out of the land of the Hebrews, and here without any fault was cast into the dungeon."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "videns pistorum magister quod prudenter somnium dissolvisset ait et ego vidi somnium quod haberem tria canistra farinae super caput meum"
      en: "The chief baker seeing that he had wisely interpreted the dream, said: I also dreamed a dream, That I bed three baskets of meal upon my heed:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et in uno canistro quod erat excelsius portare me omnes cibos qui fiunt arte pistoria avesque comedere ex eo"
      en: "And that in one basket which was uppermost, I carried all meats that are made by the art of baking, and that the birds ate out of it."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "respondit Ioseph haec est interpretatio somnii tria canistra tres adhuc dies sunt"
      en: "Joseph answered: This is the interpretation of the dream: The three baskets are yet three days:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "post quos auferet Pharao caput tuum ac suspendet te in cruce et lacerabunt volucres carnes tuas"
      en: "After which Pharao will take thy hand from thee, and hang thee on a cross, and the birds shall tear thy flesh."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "exin dies tertius natalicius Pharaonis erat qui faciens grande convivium pueris suis recordatus est inter epulas magistri pincernarum et pistorum principis"
      en: "The third day after this was the birthday of Pharao: and he made a. great feast for his servants, and at the banquet remembered the chief butler, and the chief baker."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "restituitque alterum in locum suum ut porrigeret regi poculum"
      en: "And he restored the one to his place to present him the cup:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "alterum suspendit in patibulo ut coniectoris veritas probaretur"
      en: "The other he hanged on a gibbet, that the truth of the interpreter might be shewn."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et tamen succedentibus prosperis praepositus pincernarum oblitus est interpretis sui"
      en: "But the chief butler, when things prospered with him, forgot his interpreter."
    status: { la: verified, en: verified }
