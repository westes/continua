# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 40
verses:
  - n: 1
    text:
      la: "His ita gestis, accidit ut peccarent duo eunuchi, pincerna regis Aegypti, et pistor, domino suo."
      en: "After this, it came to pass, that two eunuchs, the butler and the baker of the king of Egypt, offended their lord."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Iratusque contra eos Pharao ( nam alter pincernis praeerat, alter pistoribus),"
      en: "And Pharao being angry with them (now the one was chief butler, the other chief baker)"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "misit eos in carcerem principis militum, in quo erat vinctus et Joseph."
      en: "He sent them to the prison of the commander of the soldiers, in which Joseph also was prisoner,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "At custos carceris tradidit eos Joseph, qui et ministrabat eis: aliquantulum temporis fluxerat, et illi in custodia tenebantur."
      en: "But the keeper of the prison delivered them to Joseph, and he served them. Some little time passed, and they were kept in custody."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Videruntque ambo somnium nocte una, juxta interpretationem congruam sibi:"
      en: "And they both dreamed a dream the same night, according to the interpretation agreeing to themselves:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ad quos cum introisset Joseph mane, et vidisset eos tristes,"
      en: "And when Joseph was come in to them in the morning, and saw them sad,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sciscitatus est eos, dicens: Cur tristior est hodie solito facies vestra?"
      en: "He asked them, saying: Why is your countenance sadder today than usual?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Qui responderunt: Somnium vidimus, et non est qui interpretetur nobis. Dixitque ad eos Joseph: Numquid non Dei est interpretatio? referte mihi quid videritis."
      en: "They answered: We have dreamed a dream, and there is nobody to interpret it to us. And Joseph said to them: Doth not interpretation belong to God? Tell me what you have dreamed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Narravit prior, praepositus pincernarum, somnium suum: Videbam coram me vitem,"
      en: "The chief butler first told his dream: I saw before me a vine,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in qua erant tres propagines, crescere paulatim in gemmas, et post flores uvas maturescere:"
      en: "On which were three branches, which by little and little sent out buds, and after the blossoms brought forth ripe grapes:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "calicemque Pharaonis in manu mea: tuli ergo uvas, et expressi in calicem quem tenebam, et tradidi poculum Pharaoni."
      en: "And the cup of Pharao was in my hand: and I took the grapes, and pressed them into the cup which I held, and I gave the cup to Pharao."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Respondit Joseph: Haec est interpretatio somnii: tres propagines, tres adhuc dies sunt:"
      en: "Joseph answered: This is the interpretation of the dream: The three branches are yet three days:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "post quos recordabitur Pharao ministerii tui, et restituet te in gradum pristinum: dabisque ei calicem juxta officium tuum, sicut ante facere consueveras."
      en: "After which Pharao will remember thy service, and will restore thee to thy former place: and thou shalt present him the cup according to thy office, as before thou wast wont to do."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tantum memento mei, cum bene tibi fuerit, et facias mecum misericordiam: ut suggeras Pharaoni ut educat me de isto carcere:"
      en: "Only remember me, when it shall be well with thee, and do me this kindness: to put Pharao in mind to take me out of this prison:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quia furto sublatus sum de terra Hebraeorum, et hic innocens in lacum missus sum."
      en: "For I was stolen away out of the land of the Hebrews, and here without any fault was cast into the dungeon."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Videns pistorum magister quod prudenter somnium dissolvisset, ait: Et ego vidi somnium: quod tria canistra farinae haberem super caput meum:"
      en: "The chief baker seeing that he had wisely interpreted the dream, said: I also dreamed a dream, That I had three baskets of meal upon my head:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et in uno canistro quod erat excelsius, portare me omnes cibos qui fiunt arte pistoria, avesque comedere ex eo."
      en: "And that in one basket which was uppermost, I carried all meats that are made by the art of baking, and that the birds ate out of it."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Respondit Joseph: Haec est interpretatio somnii: tria canistra, tres adhuc dies sunt:"
      en: "Joseph answered: This is the interpretation of the dream: The three baskets are yet three days:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "post quos auferet Pharao caput tuum, ac suspendet te in cruce, et lacerabunt volucres carnes tuas."
      en: "After which Pharao will take thy head from thee, and hang thee on a cross, and the birds shall tear thy flesh."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Exinde dies tertius natalitius Pharaonis erat: qui faciens grande convivium pueris suis, recordatus est inter epulas magistri pincernarum, et pistorum principis."
      en: "The third day after this was the birthday of Pharao: and he made a great feast for his servants, and at the banquet remembered the chief butler, and the chief baker."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Restituitque alterum in locum suum, ut porrigeret ei poculum:"
      en: "And he restored the one to his place to present him the cup:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "alterum suspendit in patibulo, ut conjectoris veritas probaretur."
      en: "The other he hanged on a gibbet, that the truth of the interpreter might be shewn."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et tamen succedentibus prosperis, praepositus pincernarum oblitus est interpretis sui."
      en: "But the chief butler, when things prospered with him, forgot his interpreter."
    status: { la: verified, en: verified }
