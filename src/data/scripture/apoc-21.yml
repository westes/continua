# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: apoc
chapter: 21
verses:
  - n: 1
    text:
      la: "Et vidi caelum novum et terram novam. Primum enim caelum, et prima terra abiit, et mare jam non est."
      en: "And I saw a new heaven and a new earth. For the first heaven and the first earth was gone, and the sea is now no more."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et ego Joannes vidi sanctam civitatem Jerusalem novam descendentem de caelo a Deo, paratam sicut sponsam ornatam viro suo."
      en: "And I John saw the holy city, the new Jerusalem, coming down out of heaven from God, prepared as a bride adorned for her husband."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et audivi vocem magnam de throno dicentem: Ecce tabernaculum Dei cum hominibus, et habitabit cum eis. Et ipsi populus ejus erunt, et ipse Deus cum eis erit eorum Deus:"
      en: "And I heard a great voice from the throne, saying: Behold the tabernacle of God with men, and he will dwell with them. And they shall be his people; and God himself with them shall be their God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et absterget Deus omnem lacrimam ab oculis eorum: et mors ultra non erit, neque luctus, neque clamor, neque dolor erit ultra, quia prima abierunt."
      en: "And God shall wipe away all tears from their eyes: and death shall be no more, nor mourning, nor crying, nor sorrow shall be any more, for the former things are passed away."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et dixit qui sedebat in throno: Ecce nova facio omnia. Et dixit mihi: Scribe, quia haec verba fidelissima sunt, et vera."
      en: "And he that sat on the throne, said: Behold, I make all things new. And he said to me: Write, for these words are most faithful and true."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et dixit mihi: Factum est: ego sum alpha et omega, initium et finis. Ego sitienti dabo de fonte aquae vitae, gratis."
      en: "And he said to me: It is done. I am Alpha and Omega; the beginning and the end. To him that thirsteth, I will give of the fountain of the water of life, freely."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Qui vicerit, possidebit haec: et ero illi Deus, et ille erit mihi filius."
      en: "He that shall overcome shall possess these things, and I will be his God; and he shall be my son."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Timidis autem, et incredulis, et execratis, et homicidis, et fornicatoribus, et veneficis, et idolatris, et omnibus mendacibus, pars illorum erit in stagno ardenti igne et sulphure: quod est mors secunda."
      en: "But the fearful, and unbelieving, and the abominable, and murderers, and whoremongers, and sorcerers, and idolaters, and all liars, they shall have their portion in the pool burning with fire and brimstone, which is the second death."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et venit unus de septem angelis habentibus phialas plenas septem plagis novissimis, et locutus est mecum, dicens: Veni, et ostendam tibi sponsam, uxorem Agni."
      en: "And there came one of the seven angels, who had the vials full of the seven last plagues, and spoke with me, saying: Come, and I will shew thee the bride, the wife of the Lamb."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et sustulit me in spiritu in montem magnum et altum, et ostendit mihi civitatem sanctam Jerusalem descendentem de caelo a Deo,"
      en: "And he took me up in spirit to a great and high mountain: and he shewed me the holy city Jerusalem coming down out of heaven from God,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "habentem claritatem Dei: et lumen ejus simile lapidi pretioso tamquam lapidi jaspidis, sicut crystallum."
      en: "Having the glory of God, and the light thereof was like to a precious stone, as to the jasper stone, even as crystal."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et habebat murum magnum, et altum, habentem portas duodecim: et in portis angelos duodecim, et nomina inscripta, quae sunt nomina duodecim tribuum filiorum Israel:"
      en: "And it had a wall great and high, having twelve gates, and in the gates twelve angels, and names written thereon, which are the names of the twelve tribes of the children of Israel."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ab oriente portae tres, et ab aquilone portae tres, et ab austro portae tres, et ab occasu portae tres."
      en: "On the east, three gates: and on the north, three gates: and on the south, three gates: and on the west, three gates."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et murus civitatis habens fundamenta duodecim, et in ipsis duodecim nomina duodecim apostolorum Agni."
      en: "And the wall of the city had twelve foundations, and in them, the twelve names of the twelve apostles of the Lamb."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et qui loquebatur mecum, habebat mensuram arundineam auream, ut metiretur civitatem, et portas ejus, et murum."
      en: "And he that spoke with me, had a measure of a reed of gold, to measure the city and the gates thereof, and the wall."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et civitas in quadro posita est, et longitudo ejus tanta est quanta et latitudo: et mensus est civitatem de arundine aurea per stadia duodecim millia: et longitudo, et altitudo, et latitudo ejus aequalia sunt."
      en: "And the city lieth in a foursquare, and the length thereof is as great as the breadth: and he measured the city with the golden reed for twelve thousand furlongs, and the length and the height and the breadth thereof are equal."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et mensus est murum ejus centem quadraginta quatuor cubitorum, mensura hominis, quae est angeli."
      en: "And he measured the wall thereof an hundred and forty-four cubits, the measure of a man, which is of an angel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et erat structura muri ejus ex lapide jaspide: ipsa vero civitas aurum mundum simile vitro mundo."
      en: "And the building of the wall thereof was of jasper stone: but the city itself pure gold, like to clear glass."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et fundamenta muri civitatis omni lapide pretioso ornata. Fundamentum primum, jaspis: secundum, sapphirus: tertium, calcedonius: quartum, smaragdus:"
      en: "And the foundations of the wall of the city were adorned with all manner of precious stones. The first foundation was jasper: the second, sapphire: the third, a chalcedony: the fourth, an emerald:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quintum, sardonyx: sextum, sardius: septimum, chrysolithus: octavum, beryllus: nonum, topazius: decimum, chrysoprasus: undecimum, hyacinthus: duodecimum, amethystus."
      en: "The fifth, sardonyx: the sixth, sardius: the seventh, chrysolite: the eighth, beryl: the ninth, a topaz: the tenth, a chrysoprasus: the eleventh, a jacinth: the twelfth, an amethyst."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et duodecim portae, duodecim margaritae sunt, per singulas: et singulae portae erant ex singulis margaritis: et platea civitatis aurum mundum, tamquam vitrum perlucidum."
      en: "And the twelve gates are twelve pearls, one to each: and every several gate was of one several pearl. And the street of the city was pure gold, as it were transparent glass."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et templum non vidi in ea: Dominus enim Deus omnipotens templum illius est, et Agnus."
      en: "And I saw no temple therein. For the Lord God Almighty is the temple thereof, and the Lamb."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et civitas non eget sole neque luna ut luceant in ea, nam claritas Dei illuminavit eam, et lucerna ejus est Agnus."
      en: "And the city hath no need of the sun, nor of the moon, to shine in it. For the glory of God hath enlightened it, and the Lamb is the lamp thereof."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et ambulabunt gentes in lumine ejus: et reges terrae afferent gloriam suam et honorem in illam."
      en: "And the nations shall walk in the light of it: and the kings of the earth shall bring their glory and honour into it."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et portae ejus non claudentur per diem: nox enim non erit illic."
      en: "And the gates thereof shall not be shut by day: for there shall be no night there."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et afferent gloriam et honorem gentium in illam."
      en: "And they shall bring the glory and honour of the nations into it."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Non intrabit in eam aliquod coinquinatum, aut abominationem faciens et mendacium, nisi qui scripti sunt in libro vitae Agni."
      en: "There shall not enter into it any thing defiled, or that worketh abomination or maketh a lie, but they that are written in the book of life of the Lamb."
    status: { la: verified, en: verified }
