# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: act
chapter: 20
verses:
  - n: 1
    text:
      la: "Postquam autem cessavit tumultus, vocatis Paulus discipulis, et exhortatus eos, valedixit, et profectus est ut iret in Macedoniam."
      en: "And after the tumult was ceased, Paul calling to him the disciples, and exhorting them, took his leave, and set forward to go into Macedonia."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cum autem perambulasset partes illas, et exhortatus eos fuisset multo sermone, venit ad Graeciam:"
      en: "And when he had gone over those parts, and had exhorted them with many words, he came into Greece;"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ubi cum fecisset menses tres, factae sunt illi insidiae a Judaeis navigaturo in Syriam: habuitque consilium ut reverteretur per Macedoniam."
      en: "Where, when he had spent three months, the Jews laid wait for him, as he was about to sail into Syria; so he took a resolution to return through Macedonia."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Comitatus est autem eum Sopater Pyrrhi Beroeensis, Thessalonicensium vero Aristarchus, et Secundus, et Gajus Derbeus, et Timotheus: Asiani vero Tychicus et Trophimus."
      en: "And there accompanied him Sopater the son of Pyrrhus, of Berea; and of the Thessalonians, Aristarchus, and Secundus, and Gaius of Derbe, and Timothy; and of Asia, Tychicus and Trophimus."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Hi cum praecessissent, sustinuerunt nos Troade:"
      en: "These going before, stayed for us at Troas."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "nos vero navigavimus post dies azymorum a Philippis, et venimus ad eos Troadem in diebus quinque, ubi demorati sumus diebus septem."
      en: "But we sailed from Philippi after the days of the Azymes, and came to them to Troas in five days, where we abode seven days."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Una autem sabbati cum convenissemus ad frangendum panem, Paulus disputabat cum eis profecturus in crastinum, protraxitque sermonem usque in mediam noctem."
      en: "And on the first day of the week, when we were assembled to break bread, Paul discoursed with them, being to depart on the morrow: and he continued his speech until midnight."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Erant autem lampades copiosae in coenaculo, ubi eramus congregati."
      en: "And there were a great number of lamps in the upper chamber where we were assembled."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sedens autem quidam adolescens nomine Eutychus super fenestram, cum mergeretur somno gravi, disputante diu Paulo, ductus somno cecidit de tertio coenaculo deorsum, et sublatus est mortuus."
      en: "And a certain young man named Eutychus, sitting on the window, being oppressed with a deep sleep, (as Paul was long preaching,) by occasion of his sleep fell from the third loft down, and was taken up dead."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ad quem cum descendisset Paulus, incubuit super eum: et complexus dixit: Nolite turbari, anima enim ipsius in ipso est."
      en: "To whom, when Paul had gone down, he laid himself upon him, and embracing him, said: Be not troubled, for his soul is in him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ascendens autem, frangensque panem, et gustans, satisque allocutus usque in lucem, sic profectus est."
      en: "Then going up, and breaking bread and tasting, and having talked a long time to them, until daylight, so he departed."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Adduxerunt autem puerum viventem, et consolati sunt non minime."
      en: "And they brought the youth alive, and were not a little comforted."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nos autem ascendentes navem, navigavimus in Asson, inde suscepturi Paulum: sic enim disposuerat ipse per terram iter facturus."
      en: "But we, going aboard the ship, sailed to Assos, being there to take in Paul; for so he had appointed, himself purposing to travel by land."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cum autem convenisset nos in Asson, assumpto eo, venimus Mitylenen."
      en: "And when he had met with us at Assos, we took him in, and came to Mitylene."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et inde navigantes, sequenti die venimus contra Chium, et alia applicuimus Samum, et sequenti die venimus Miletum."
      en: "And sailing thence, the day following we came over against Chios; and the next day we arrived at Samos; and the day following we came to Miletus."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Proposuerat enim Paulus transnavigare Ephesum, ne qua mora illi fieret in Asia. Festinabat enim, si possibile sibi esset, ut diem Pentecostes faceret Jerosolymis."
      en: "For Paul had determined to sail by Ephesus, lest he should be stayed any time in Asia. For he hasted, if it were possible for him, to keep the day of Pentecost at Jerusalem."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "A Mileto autem mittens Ephesum, vocavit majores natu ecclesiae."
      en: "And sending from Miletus to Ephesus, he called the ancients of the church."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Qui cum venissent ad eum, et simul essent, dixit eis: Vos scitis a prima die, qua ingressus sum in Asiam, qualiter vobiscum per omne tempus fuerim,"
      en: "And when they were come to him, and were together, he said to them: You know from the first day that I came into Asia, in what manner I have been with you, for all the time,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "serviens Domino cum omni humilitate, et lacrimis, et tentationibus, quae mihi acciderunt ex insidiis Judaeorum:"
      en: "Serving the Lord with all humility, and with tears, and temptations which befell me by the conspiracies of the Jews;"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quomodo nihil subtraxerim utilium, quominus annuntiarem vobis, et docerem vos publice, et per domos,"
      en: "How I have kept back nothing that was profitable to you, but have preached it to you, and taught you publicly, and from house to house,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "testificans Judaeis, atque gentilibus in Deum poenitentiam, et fidem in Dominum nostrum Jesum Christum."
      en: "Testifying both to Jews and Gentiles penance towards God, and faith in our Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et nunc ecce alligatus ego spiritu, vado in Jerusalem: quae in ea ventura sint mihi, ignorans:"
      en: "And now, behold, being bound in the spirit, I go to Jerusalem: not knowing the things which shall befall me there:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "nisi quod Spiritus Sanctus per omnes civitates mihi protestatur, dicens quoniam vincula et tribulationes Jerosolymis me manent."
      en: "Save that the Holy Ghost in every city witnesseth to me, saying: That bands and afflictions wait for me at Jerusalem."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Sed nihil horum vereor: nec facio animam meam pretiosiorem quam me, dummodo consummem cursum meum, et ministerium verbi, quod accepi a Domino Jesu, testificari Evangelium gratiae Dei."
      en: "But I fear none of these things, neither do I count my life more precious than myself, so that I may consummate my course and the ministry of the word which I received from the Lord Jesus, to testify the gospel of the grace of God."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et nunc ecce ego scio quia amplius non videbitis faciem meam vos omnes, per quos transivi praedicans regnum Dei."
      en: "And now behold, I know that all you, among whom I have gone preaching the kingdom of God, shall see my face no more."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Quapropter contestor vos hodierna die, quia mundus sum a sanguine omnium."
      en: "Wherefore I take you to witness this day, that I am clear from the blood of all men;"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Non enim subterfugi, quominus annuntiarem omne consilium Dei vobis."
      en: "For I have not spared to declare unto you all the counsel of God."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Attendite vobis, et universo gregi, in quo vos Spiritus Sanctus posuit episcopos regere ecclesiam Dei, quam acquisivit sanguine suo."
      en: "Take heed to yourselves, and to the whole flock, wherein the Holy Ghost hath placed you bishops, to rule the church of God, which he hath purchased with his own blood."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Ego scio quoniam intrabunt post discessionem meam lupi rapaces in vos, non parcentes gregi."
      en: "I know that, after my departure, ravening wolves will enter in among you, not sparing the flock."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et ex vobis ipsis exsurgent viri loquentes perversa, ut abducant discipulos post se."
      en: "And of your own selves shall arise men speaking perverse things, to draw away disciples after them."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Propter quod vigilate memoria retinentes: quoniam per triennium nocte et die non cessavi, cum lacrimis monens unumquemque vestrum."
      en: "Therefore watch, keeping in memory, that for three years I ceased not, with tears to admonish every one of you night and day."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et nunc commendo vos Deo, et verbo gratiae ipsius, qui potens est aedificare, et dare haereditatem in sanctificatis omnibus."
      en: "And now I commend you to God, and to the word of his grace, who is able to build up, and to give an inheritance among all the sanctified."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Argentum, et aurum, aut vestem nullius concupivi, sicut"
      en: "I have not coveted any man's silver, gold, or apparel, as"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "ipsi scitis: quoniam ad ea quae mihi opus erant, et his qui mecum sunt, ministraverunt manus istae."
      en: "You yourselves know: for such things as were needful for me and them that are with me, these hands have furnished."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Omnia ostendi vobis, quoniam sic laborantes, oportet suscipere infirmos ac meminisse verbi Domini Jesu, quoniam ipse dixit: Beatius est magis dare, quam accipere."
      en: "I have shewed you all things, how that so labouring you ought to support the weak, and to remember the word of the Lord Jesus, how he said: It is a more blessed thing to give, rather than to receive."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et cum haec dixisset, positis genibus suis oravit cum omnibus illis."
      en: "And when he had said these things, kneeling down, he prayed with them all."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Magnus autem fletus factus est omnium: et procumbentes super collum Pauli, osculabantur eum,"
      en: "And there was much weeping among them all; and falling on the neck of Paul, they kissed him,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "dolentes maxime in verbo, quod dixerat, quoniam amplius faciem ejus non essent visuri. Et deducebant eum ad navem."
      en: "Being grieved most of all for the word which he had said, that they should see his face no more. And they brought him on his way to the ship."
    status: { la: verified, en: verified }
