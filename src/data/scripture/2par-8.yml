# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 8
verses:
  - n: 1
    text:
      la: "expletis autem viginti annis postquam aedificavit Salomon domum Domini et domum suam"
      en: "And at the end of twenty years after Solomon had built the house of the Lord and his own house:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "civitates quas dederat Hiram Salomoni aedificavit et habitare ibi fecit filios Israhel"
      en: "He built the cities which Hiram had given to Solomon, and caused the children of Israel to dwell there."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "abiit quoque in Emath Suba et obtinuit eam"
      en: "He went also into Emath Suba, and possessed it."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et aedificavit Palmyram in deserto et alias civitates munitissimas aedificavit in Emath"
      en: "And he built Palmira in the desert, and he built other strong cities in Emath."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "extruxitque Bethoron superiorem et Bethoron inferiorem civitates muratas habentes portas et vectes et seras"
      en: "And he built Beth-horon the upper, and Beth-horon the nether, walled cities with Rates and bars and locks."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Baalath etiam et omnes urbes firmissimas quae fuerunt Salomonis cunctasque urbes quadrigarum et urbes equitum omnia quae voluit Salomon atque disposuit aedificavit in Hierusalem et in Libano et in universa terra potestatis suae"
      en: "Balaath also and all the strong cities that were Solomon's, and all the cities of the chariots, and the cities of the horsemen. All that Solomon had a mind, and designed, he built in Jerusalem and in Libanus, and in all the land of his dominion."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "omnem populum qui derelictus fuerat de Hettheis et Amorreis et Ferezeis et Eveis et Iebuseis qui non erant de stirpe Israhel"
      en: "All the people that were left of the Hethites, and the Amorrhites, and the Pherezites, and the Hevites, and the Jebusites, that were not of the stock of Israel:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "de filiis eorum et de posteris quos non interfecerant filii Israhel subiugavit Salomon in tributarios usque in diem hanc"
      en: "Of their children, and of the posterity, whom the children of Israel had not slain, Solomon made to be the tributaries, unto this day."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "porro de filiis Israhel non posuit ut servirent operibus regis ipsi enim erant viri bellatores et duces primi et principes quadrigarum et equitum eius"
      en: "But of the children of Israel he set none to serve in the king's works: for they were men of war, and chief captains, and rulers of his chariots and horsemen."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "omnes autem principes exercitus regis Salomonis fuerunt ducenti quinquaginta qui erudiebant populum"
      en: "And all the chief captains of king Solomon's army were two hundred and fifty, who taught the people."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "filiam vero Pharaonis transtulit de civitate David in domum quam aedificaverat ei dixit enim non habitabit uxor mea in domo David regis Israhel eo quod sanctificata sit quia ingressa est eam arca Domini"
      en: "And he removed the daughter of Pharao from the city of David, to the house which he had built for her. For the king said: My wife shall not dwell in the house of David king of Israel, for it is sanctified: because the ark of the Lord came into it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tunc obtulit Salomon holocausta Domino super altare Domini quod extruxerat ante porticum"
      en: "Then Solomon offered holocausts to the Lord upon the altar of the Lord which he had built before the porch,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ut per singulos dies offerretur in eo iuxta praeceptum Mosi in sabbatis et in kalendis et in festis diebus ter per annum id est in sollemnitate azymorum et in sollemnitate ebdomadarum et in sollemnitate tabernaculorum"
      en: "That every day an offering might be made on it according to the ordinance of Moses, in the sabbaths, and on the new moons, and on the festival days three times a year, that is to say, in the feast of unleavened bread, and in the feast of weeks, and in the feast of tabernacles."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et constituit iuxta dispositionem David patris sui officia sacerdotum in ministeriis suis et Levitas in ordine suo ut laudarent et ministrarent coram sacerdotibus iuxta ritum uniuscuiusque diei et ianitores in divisionibus suis per portam et portam sic enim praeceperat David homo Dei"
      en: "And he appointed according to the order of David his father the offices of the priests in their ministries: and the Levites in their order to give praise, and minister before the priests according to the duty of every day: and the porters in their divisions by gate and gate: for so David the man of God had commanded."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "nec praetergressi sunt de mandatis regis tam sacerdotes quam Levitae ex omnibus quae praeceperat et in custodiis thesaurorum"
      en: "And the priests and Levites departed not from the king's commandments, as to any thing that he had commanded, and as to the keeping of the treasures."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "omnes inpensas praeparatas habuit Salomon ex eo die quo fundavit domum Domini usque in diem quo perfecit eam"
      en: "Solomon had all charges prepared, from the day that he founded the house of the Lord, until the day wherein he finished it."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "tunc abiit Salomon in Hesiongaber et in Ahilath ad oram maris Rubri quae est in terra Edom"
      en: "Then Solomon went to Asiongaber, and to Ailath, on the coast of the Red Sea, which is in the land of Edom."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "misit autem ei Hiram per manum servorum suorum naves et nautas gnaros maris et abierunt cum servis Salomonis in Ophir tuleruntque inde quadringenta quinquaginta talenta auri et adtulerunt ad regem Salomonem"
      en: "And Hiram sent him ships by the hands of his servants, and skilful mariners, and they went with Solomon's servants to Ophir, and they took thence four hundred and fifty talents of gold, and brought it to king Solomon."
    status: { la: verified, en: verified }
