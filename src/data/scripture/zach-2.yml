# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: zach
chapter: 2
verses:
  - n: 1
    text:
      la: "Et levavi oculos meos, et vidi, et ecce vir, et in manu ejus funiculus mensorum."
      en: "And I lifted up my eyes, and saw, and behold a man, with a measuring line in his hand."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et dixi: Quo tu vadis? Et dixit ad me: Ut metiar Jerusalem, et videam quanta sit latitudo ejus, et quanta longitudo ejus."
      en: "And I said: Whither goest thou? and he said to me: To measure Jerusalem, and to see how great is the breadth thereof, and how great the length thereof."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et ecce angelus qui loquebatur in me egrediebatur, et angelus alius egrediebatur in occursum ejus:"
      en: "And behold the angel that spoke in me went forth, and another angel went out to meet him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dixit ad eum: Curre, loquere ad puerum istum, dicens: Absque muro habitabitur Jerusalem, prae multitudine hominum et jumentorum in medio ejus."
      en: "And he said to him: Run, speak to this young man, saying: Jerusalem shall be inhabited without walls, by reason of the multitude of men, and of the beasts in the midst thereof."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et ego ero ei, ait Dominus, murus ignis in circuitu, et in gloria ero in medio ejus."
      en: "And I will be to it, saith the Lord, a wall of fire round about: and I will be in glory in the midst thereof."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "O, o, fugite de terra aquilonis, dicit Dominus, quoniam in quatuor ventos caeli dispersi vos, dicit Dominus."
      en: "O, O flee ye out of the land of the north, saith the Lord, for I have scattered you into the four winds of heaven, saith the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "O Sion! fuge, quae habitas apud filiam Babylonis:"
      en: "O Sion, flee, thou that dwellest with the daughter of Babylon:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quia haec dicit Dominus exercituum: Post gloriam misit me ad gentes quae spoliaverunt vos: qui enim tetigerit vos, tangit pupillam oculi mei:"
      en: "For thus saith the Lord of hosts: After the glory he hath sent me to the nations that have robbed you: for he that toucheth you, toucheth the apple of my eye:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quia ecce ego levo manum meam super eos, et erunt praedae his qui serviebant sibi: et cognoscetis quia Dominus exercituum misit me."
      en: "For behold I lift up my hand upon them, and they shall be a prey to those that served them: and you shall know that the Lord of hosts sent me."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Lauda et laetare, filia Sion, quia ecce ego venio, et habitabo in medio tui, ait Dominus."
      en: "Sing praise, and rejoice, O daughter of Sion: for behold I come, and I will dwell in the midst of thee: saith the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et applicabuntur gentes multae ad Dominum in die illa, et erunt mihi in populum, et habitabo in medio tui: et scies quia Dominus exercituum misit me ad te."
      en: "And many nations shall be joined to the Lord in that day, and they shall be my people, and I will dwell in the midst of thee: and thou shalt know that the Lord of hosts hath sent me to thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et possidebit Dominus Judam partem suam in terra sanctificata, et eliget adhuc Jerusalem."
      en: "And the Lord shall possess Juda his portion in the sanctified land: and he shall yet choose Jerusalem."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sileat omnis caro a facie Domini, quia consurrexit de habitaculo sancto suo."
      en: "Let all flesh be silent at the presence of the Lord: for he is risen up out of his. holy habitation."
    status: { la: verified, en: verified }
