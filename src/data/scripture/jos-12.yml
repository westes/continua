# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jos
chapter: 12
verses:
  - n: 1
    text:
      la: "Hi sunt reges, quos percusserunt filii Israel, et possederunt terram eorum trans Jordanem ad solis ortum, a torrente Arnon usque ad montem Hermon, et omnem orientalem plagam, quae respicit solitudinem."
      en: "These are the kings, whom the children of Israel slew and possessed their land beyond the Jordan towards the rising of the sun, from the torrent Arnon unto mount Hermon, and all the east country that looketh towards the wilderness."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Sehon rex Amorrhaeorum, qui habitavit in Hesebon, dominatus est ab Aroer, quae sita est super ripam torrentis Arnon, et mediae partis in valle, dimidiaeque Galaad, usque ad torrentem Jaboc, qui est terminus filiorum Ammon."
      en: "Sehon king of the Amorrhites, who dwelt in Hesebon, and had dominion from Aroer, which is seated upon the bank of the torrent Arnon, and of the middle part in the valley, and of half Galaad, as far as the torrent Jaboc, which is the border of the children of Ammon."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et a solitudine usque ad mare Ceneroth contra orientem, et usque ad mare deserti, quod est mare salsissimum, ad orientalem plagam per viam quae ducit Bethsimoth: et ab australi parte, quae subjacet Asedoth, Phasga."
      en: "And from the wilderness, to the sea of Ceneroth towards the east, and to the sea of the wilderness, which is the most salt sea, on the east side by the way that leadeth to Bethsimoth: and on the south side that lieth under Asedoth, Phasga."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Terminus Og regis Basan, de reliquiis Raphaim, qui habitavit in Astaroth, et in Edrai, et dominatus est in monte Hermon, et in Salecha, atque in universa Basan, usque ad terminos"
      en: "The border of Og the king of Basan, of the remnant of the Raphaims who dwelt in Astaroth, and in Edrai, and had dominion in mount Hermon, and in Salecha, and in all Basan, unto the borders"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Gessuri, et Machati, et dimidiae partis Galaad: terminos Sehon regis Hesebon."
      en: "Of Gessuri and Machati, and of half Galaad: the borders of Sehon the king of Hesebon."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Moyses famulus Domini, et filii Israel percusserunt eos, tradiditque terram eorum Moyses in possessionem Rubenitis, et Gaditis, et dimidiae tribui Manasse."
      en: "Moses the servant of the Lord, and the children of Israel slew them, and Moses delivered their land in possession to the Rubenites, and Gadites, and the half tribe of Manasses."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Hi sunt reges terrae, quos percussit Josue et filii Israel trans Jordanem ad occidentalem plagam, a Baalgad in campo Libani, usque ad montem cujus pars ascendit in Seir: tradiditque eam Josue in possessionem tribubus Israel, singulis partes suas,"
      en: "These are the kings of the land, whom Josue and the children of Israel slew beyond the Jordan on the west side from Baalgad in the held of Libanus, unto the mount, part of which goeth up into Seir: and Josue delivered it in possession to the tribes of Israel, to every one their divisions,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "tam in montanis quam in planis atque campestribus. In Asedoth, et in solitudine, ac in meridie Hethaeus fuit et Amorrhaeus, Chananaeus, et Pherezaeus, Hevaeus et Jebusaeus."
      en: "As well in the mountains as in the plains and the champaign countries. In Asedoth, and in the wilderness, and in the south was the Hethite and the Amorrhite, the Chanaanite and the Pherezite, the Hevite and the Jebusite."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Rex Jericho unus: rex Hai, quae est ex latere Bethel, unus:"
      en: "The king of Jericho one: the king of Hai, which is on the side of Bethel, one:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "rex Jerusalem unus, rex Hebron unus,"
      en: "The king of Jerusalem one, the king of Hebron one."
    status: { la: verified, en: verified }
  - n: 11
    text:
