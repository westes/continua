# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 4reg
chapter: 20
verses:
  - n: 1
    text:
      la: "in diebus illis aegrotavit Ezechias usque ad mortem et venit ad eum Esaias filius Amos prophetes dixitque ei haec dicit Dominus Deus praecipe domui tuae morieris enim et non vives"
      en: "In those days Ezechias was sick unto death: and Isaias the son of Amos the prophet came and said to him: Thus saith the Lord God: Give charge concerning thy house, for thou shalt die, and not live."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "qui convertit faciem suam ad parietem et oravit Dominum dicens"
      en: "And he turned his face to the wall, and prayed to the Lord, saying:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "obsecro Domine memento quomodo ambulaverim coram te in veritate et in corde perfecto et quod placitum est coram te fecerim flevit itaque Ezechias fletu magno"
      en: "I beseech thee, O Lord, remember how I have walked before thee in truth, and with a perfect heart, and have done that which is pleasing before thee. And Ezechias wept with much weeping."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et antequam egrederetur Esaias mediam partem atrii factus est sermo Domini ad eum dicens"
      en: "And before Isaias was gone out of the middle of the court, the word of the Lord came to him, saying:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "revertere et dic Ezechiae duci populi mei haec dicit Dominus Deus David patris tui audivi orationem tuam vidi lacrimam tuam et ecce sanavi te die tertio ascendes templum Domini"
      en: "Go back, and tell Ezechias the captain of my people: Thus saith the Lord the God of David thy father: I have heard thy prayer, and I have seen thy tears: and behold I have healed thee; on the third day thou shalt go up to the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et addam diebus tuis quindecim annos sed et de manu regis Assyriorum liberabo te et civitatem hanc et protegam urbem istam propter me et propter David servum meum"
      en: "And I will add to thy days fifteen years: and I will deliver thee and this city out of the hand of the king of the Assyrians, and I will protect this city for my own sake, and for David my servant's sake."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixitque Esaias adferte massam ficorum quam cum adtulissent et posuissent super ulcus eius curatus est"
      en: "And Isaias said: Bring me a lump of figs. And when they had brought it, and laid it upon his boil. he was healed."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixerat autem Ezechias ad Esaiam quod erit signum quia Dominus me sanabit et quia ascensurus sum die tertio templum Domini"
      en: "And Ezechias had said to Isaias: What shall be the sign that the Lord will heal me, and that I shall go up to the temple of the Lord the third day?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cui ait Esaias hoc erit signum a Domino quod facturus sit Dominus sermonem quem locutus est vis ut accedat umbra decem lineis an ut revertatur totidem gradibus"
      en: "And Isaias said to him: This shall be the sign from the Lord, that the Lord will do the word which he hath spoken: Wilt thou that the shadow go forward ten lines, or that it go back so many degrees?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et ait Ezechias facile est umbram crescere decem lineis nec hoc volo ut fiat sed ut revertatur retrorsum decem gradibus"
      en: "And Ezechias said: It is an easy matter for the shadow to go forward ten lines: and I do not desire that this be done, but let it return back ten degrees."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "invocavit itaque Esaias propheta Dominum et reduxit umbram per lineas quibus iam descenderat in horologio Ahaz retrorsum decem gradibus"
      en: "And Isaias the prophet called upon the Lord, and he brought the shadow ten degrees backwards by the lines, by which it had already gone down in the dial of Achaz."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "in tempore illo misit Berodach Baladan filius Baladan rex Babyloniorum litteras et munera ad Ezechiam audierat enim quod aegrotasset Ezechias"
      en: "At that time Berodach Baladan, the son of Baladan, king of the Babylonians, sent letters and presents to Ezechias: for he had heard that Ezechias had been sick."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "laetatus est autem in adventum eorum Ezechias et ostendit eis domum aromatum et aurum et argentum et pigmenta varia unguenta quoque et domum vasorum suorum et omnia quae habere potuerat in thesauris suis non fuit quod non monstraret eis Ezechias in domo sua et in omni potestate sua"
      en: "And Ezechias rejoiced at their coming, and he showed them the house of his aromatical spices, and the gold and the silver, and divers precious odours, and ointments, and the house of his vessels, and all that he had in his treasures. There was nothing in his house, nor in all his dominions that Ezechias shewed them not."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "venit autem Esaias propheta ad regem Ezechiam dixitque ei quid dixerunt viri isti aut unde venerunt ad te cui ait Ezechias de terra longinqua venerunt de Babylone"
      en: "And Isaias the prophet came to king Ezechias, and said to him: What said these men? or from whence came they to thee? And Ezechias said to him: From a far country they came to me out of Babylon."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "at ille respondit quid viderunt in domo tua ait Ezechias omnia quae sunt in domo mea viderunt nihil est quod non monstraverim eis in thesauris meis"
      en: "And he said: What did they see in thy house? Ezechias said: They saw all the things that are in my house: there is nothing among my treasures that I have not shewn them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixit itaque Esaias Ezechiae audi sermonem Domini"
      en: "And Isaias said to Ezechias: Hear the word of the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ecce dies venient et auferentur omnia quae sunt in domo tua et quae condiderunt patres tui usque in diem hanc in Babylone non remanebit quicquam ait Dominus"
      en: "Behold the days shall come, that all that is in thy house, and that thy fathers have laid up in store unto this day, shall be carried into Babylon: nothing shall be left, saith the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sed et de filiis tuis qui egredientur ex te quos generabis tollentur et erunt eunuchi in palatio regis Babylonis"
      en: "And of thy sons also that shall issue from thee, whom thou shalt beget, they shall take away, and they shall be eunuchs in the palace of the king of Babylon."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "dixit Ezechias ad Esaiam bonus sermo Domini quem locutus est sit pax et veritas in diebus meis"
      en: "Ezechias said to Isaias: The word of the Lord, which thou hast spoken, is good: let peace and truth be in my days."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "reliqua autem sermonum Ezechiae et omnis fortitudo eius et quomodo fecerit piscinam et aquaeductum et introduxerit aquas in civitatem nonne haec scripta sunt in libro sermonum dierum regum Iuda"
      en: "And the rest of the acts of Ezechias and all his might, and how he made a pool, and a conduit, and brought waters into the city, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "dormivitque Ezechias cum patribus suis et regnavit Manasses filius eius pro eo"
      en: "And Ezechias slept with his fathers, and Manasses his son reigned in his stead."
    status: { la: verified, en: verified }
