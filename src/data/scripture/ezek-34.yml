# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 34
verses:
  - n: 1
    text:
      la: "Et factum est verbum Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fili hominis, propheta de pastoribus Israel: propheta, et dices pastoribus: Haec dicit Dominus Deus: Vae pastoribus Israel, qui pascebant semetipsos! nonne greges a pastoribus pascuntur?"
      en: "Son of man, prophesy concerning the shepherds of Israel: prophesy, and say to the shepherds: Thus saith the Lord God: Woe to the shepherds of Israel, that fed themselves: should not the flocks be fed by the shepherds?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Lac comedebatis, et lanis operiebamini, et quod crassum erat occidebatis, gregem autem meum non pascebatis."
      en: "You ate the milk, and you clothed yourselves with the wool, and you killed that which was fat: but my flock you did not feed."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quod infirmum fuit non consolidastis, et quod aegrotum non sanastis: quod confractum est non alligastis, et quod abjectum est non reduxistis, et quod perierat non quaesistis: sed cum austeritate imperabatis eis, et cum potentia."
      en: "The weak you have not strengthened, and that which was sick you have not healed, that which was broken you have not bound up, and that which was driven away you have not brought again, neither have you sought that which was lost: but you ruled over them with rigour, and with a high hand."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et dispersae sunt oves meae, eo quod non esset pastor: et factae sunt in devorationem omnium bestiarum agri, et dispersae sunt."
      en: "And my sheep were scattered, because there was no shepherd: and they became the prey of all the beasts of the field, and were scattered."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Erraverunt greges mei in cunctis montibus, et in universo colle excelso: et super omnem faciem terrae dispersi sunt greges mei, et non erat qui requireret: non erat, inquam, qui requireret."
      en: "My sheep have wandered in every mountain, and in every high hill: and my flocks were scattered upon the face of the earth, and there was none that sought them, there was none, I say, that sought them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Propterea, pastores, audite verbum Domini:"
      en: "Therefore, ye shepherds, hear the word of the Lord:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Vivo ego, dicit Dominus Deus, quia pro eo quod facti sunt greges mei in rapinam, et oves meae in devorationem omnium bestiarum agro, eo quod non esset pastor: neque enim quaesierunt pastores mei gregem meum, sed pascebant pastores semetipsos, et greges meos non pascebant:"
      en: "As I live, saith the Lord God, forasmuch as my flocks have been made a spoil, and my sheep are become a prey to all the beasts of the field, because there was no shepherd: for my shepherds did not seek after my flock, but the shepherds fed themselves, and fed not my flocks:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "propterea, pastores, audite verbum Domini:"
      en: "Therefore, ye shepherds, hear the word of the Lord:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Haec dicit Dominus Deus: Ecce ego ipse super pastores: requiram gregem meum de manu eorum, et cessare faciam eos, ut ultra non pascant gregem, nec pascant amplius pastores semetipsos: et liberabo gregem meum de ore eorum, et non erit ultra eis in escam."
      en: "Thus saith the Lord God: Behold I myself come upon the shepherds, I will require my flock at their hand, and I will cause them to cease from feeding the flock any more, neither shall the shepherds feed themselves any more: and I will deliver my flock from their mouth, and it shall no more be meat for them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quia haec dicit Dominus Deus: Ecce ego ipse requiram oves meas, et visitabo eas."
      en: "For thus saith the Lord God: Behold I myself will seek my sheep, and will visit them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Sicut visitat pastor gregem suum, in die quando fuerit in medio ovium suarum dissipatarum, sic visitabo oves meas, et liberabo eas de omnibus locis in quibus dispersae fuerant in die nubis et caliginis."
      en: "As the shepherd visiteth his flock in the day when he shall be in the midst of his sheep that were scattered, so will I visit my sheep, and will deliver them out of all the places where they have been scattered in the cloudy and dark day."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et educam eas de populis, et congregabo eas de terris, et inducam eas in terram suam, et pascam eas in montibus Israel, in rivis, et in cunctis sedibus terrae."
      en: "And I will bring them out from the peoples, and will gather them out of the countries, and will bring them to their own land: and I will feed them in the mountains of Israel, by the rivers, and in all the habitations of the land."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "In pascuis uberrimis pascam eas, et in montibus excelsis Israel erunt pascua earum: ibi requiescent in herbis virentibus, et in pascuis pinguibus pascentur super montes Israel."
      en: "I will feed them in the most fruitful pastures, and their pastures shall be in the high mountains of Israel: there shall they rest on the green grass, and be fed in fat pastures upon the mountains of Israel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ego pascam oves meas, et ego eas accubare faciam, dicit Dominus Deus."
      en: "I will feed my sheep: and I will cause them to lie down, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quod perierat requiram, et quod abjectum erat reducam, et quod confractum fuerat alligabo, et quod infirmum fuerat consolidabo, et quod pingue et forte custodiam: et pascam illas in judicio."
      en: "I will seek that which was lost: and that which was driven away, I will bring again: and I will bind up that which was broken, and I will strengthen that which was weak, and that which was fat and strong I will preserve: and I will feed them in judgment."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Vos autem, greges mei, haec dicit Dominus Deus: Ecce ego judico inter pecus et pecus, arietum et hircorum."
      en: "And as for you, O my flocks, thus saith the Lord God: Behold I judge between cattle and cattle, of rams and of he goats."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Nonne satis vobis erat pascua bona depasci? insuper et reliquias pascarum vestrarum conculcastis pedibus vestris: et cum purissimam aquam biberetis, reliquam pedibus vestris turbabatis:"
      en: "Was it not enough for you to feed upon good pastures? but you must also tread down with your feet the residue of your pastures: and when you drank the clearest water, you troubled the rest with your feet."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et oves meae his quae conculcata pedibus vestris fuerant, pascebantur: et quae pedes vestri turbaverant, haec bibebant."
      en: "And my sheep were fed with that which you had trodden with your feet: and they drank what your feet had troubled."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Propterea haec dicit Dominus Deus ad vos: Ecce ego ipse judico inter pecus pingue et macilentum:"
      en: "Therefore thus saith the Lord God to you: Behold, I myself will judge between the fat cattle and the lean."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "pro eo quod lateribus et humeris impingebatis, et cornibus vestris ventilabatis omnia infirma pecora, donec dispergerentur foras,"
      en: "Because you thrusted with sides and shoulders, and struck all the weak cattle with your horns, till they were scattered abroad:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "salvabo gregem meum, et non erit ultra in rapinam, et judicabo inter pecus et pecus."
      en: "I will save my flock, and it shall be no more a spoil, and I will judge between cattle and cattle."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et suscitabo super eas pastorem unum, qui pascat eas, servum meum David: ipse pascet eas, et ipse erit eis in pastorem."
      en: "AND I WILL SET UP ONE SHEPHERD OVER THEM, and he shall feed them, even my servant David: he shall feed them, and he shall be their shepherd."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ego autem Dominus ero eis in Deum, et servus meus David princeps in medio eorum: ego Dominus locutus sum."
      en: "And I the Lord will be their God: and my servant David the prince in the midst of them: I the Lord have spoken it."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et faciam cum eis pactum pacis, et cessare faciam bestias pessimas de terra: et qui habitant in deserto, securi dormient in saltibus."
      en: "And I will make a covenant of peace with them, and will cause the evil beasts to cease out of the land: and they that dwell in the wilderness shall sleep secure in the forests."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et ponam eos in circuitu collis mei benedictionem: et deducam imbrem in tempore suo; pluviae benedictionis erunt."
      en: "And I will make them a blessing round about my hill: and I will send down the rain in its season, there shall be showers of blessing."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et dabit lignum agri fructum suum, et terra dabit germen suum, et erunt in terra sua absque timore, et scient quia ego Dominus, cum contrivero catenas jugi eorum, et eruero eos de manu imperantium sibi."
      en: "And the tree of the field shall yield its fruit, and the earth shall yield her increase, and they shall be in their land without fear: and they shall know that I am the Lord, when I shall have broken the bonds of their yoke, and shall have delivered them out of the hand of those that rule over them."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et non erunt ultra in rapinam in gentibus, neque bestiae terrae devorabunt eos: sed habitabunt confidenter absque ullo terrore."
      en: "And they shall be no more for a spoil to the nations, neither shall the beasts of the earth devour them: but they shall dwell securely without any terror."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et suscitabo eis germen nominatum, et non erunt ultra imminuti fame in terra, neque portabunt ultra opprobrium gentium."
      en: "And I will raise up for them a bud of renown: and they shall be no more consumed with famine in the land, neither shall they bear any more the reproach of the Gentiles."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et scient quia ego Dominus Deus eorum cum eis, et ipsi populus meus domus Israel, ait Dominus Deus."
      en: "And they shall know that I the Lord their God am with them, and that they are my people the house of Israel: saith the Lord God."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Vos autem, greges mei, greges pascuae meae, homines estis: et ego Dominus Deus vester, dicit Dominus Deus."
      en: "And you my flocks, the flocks of my pasture are men: and I am the Lord your God, saith the Lord God."
    status: { la: verified, en: verified }
