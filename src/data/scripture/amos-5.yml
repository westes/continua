# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: amos
chapter: 5
verses:
  - n: 1
    text:
      la: "Audite verbum istud, quod ego levo super vos planctum: domus Israel cecidit, et non adjiciet ut resurgat."
      en: "Hear ye this word, which I take up concerning you for a lamentation. The house of Israel is fallen, and it shall rise no more."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Virgo Israel projecta est in terram suam, non est qui suscitet eam."
      en: "The virgin of Israel is cast down upon her land, there is none to raise her up."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quia haec dicit Dominus Deus: Urbs de qua egrediebantur mille, relinquentur in ea centum; et de qua egrediebantur centum, relinquentur in ea decem in domo Israel."
      en: "For thus saith the Lord God: The city, out of which came forth a thousand, there shall be left in it a hundred: and out of which there came a hundred, there shall be left in it ten, in the house of Israel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quia haec dicit Dominus domui Israel: Quaerite me, et vivetis."
      en: "For thus saith the Lord to the house of Israel: Seek ye me, and you shall live."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et nolite quaerere Bethel, et in Galgalam nolite intrare, et in Bersabee non transibitis, quia Galgala captiva ducetur, et Bethel erit inutilis."
      en: "But seek not Bethel, and go not into Galgal, neither shall you pass over to Bersabee: for Galgal shall go into captivity, and Bethel shall be unprofitable."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quaerite Dominum, et vivite ( ne forte comburatur ut ignis domus Joseph, et devorabit, et non erit qui extinguat Bethel:"
      en: "Seek ye the Lord, and live: lest the house of Joseph be burnt with fire, and it shall devour, and there shall be none to quench Bethel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui convertitis in absinthium judicium, et justitiam in terra relinquitis):"
      en: "You that turn judgment into wormwood, and forsake justice in the land,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "facientem Arcturum et Orionem, et convertentem in mane tenebras, et diem in noctem mutantem; qui vocat aquas maris, et effundit eas super faciem terrae; Dominus nomen est ejus:"
      en: "Seek him that maketh Arcturus, and Orion, and that turneth darkness into morning, and that changeth day into night: that calleth the waters of the sea, and poureth them out upon the face of the earth: The Lord is his name."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "qui subridet vastitatem super robustum, et depopulationem super potentem affert."
      en: "He that with a smile bringeth destruction upon the strong, and waste upon the mighty."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Odio habuerunt corripientem in porta, et loquentem perfecte abominati sunt."
      en: "They have hated him that rebuketh in the gate: and have abhorred him that speaketh perfectly."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Idcirco, pro eo quod diripiebatis pauperem, et praedam electam tollebatis ab eo, domos quadro lapide aedificabitis, et non habitabitis in eis; vineas plantabis amantissimas, et non bibetis vinum earum."
      en: "Therefore because you robbed the poor, and took the choice prey from him: you shall build houses with square stone, and shall not dwell in them: you shall plant most delightful vineyards, and shall not drink the wine of them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quia cognovi multa scelera vestra, et fortia peccata vestra: hostes justi, accipientes munus, et pauperes deprimentes in porta."
      en: "Because I know your manifold crimes, and your grievous sins: enemies of the just, taking bribes, and oppressing the poor in the gate."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ideo prudens in tempore illo tacebit, quia tempus malum est."
      en: "Therefore the prudent shall keep silence at that time, for it is an evil time."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quaerite bonum, et non malum, ut vivatis; et erit Dominus Deus exercituum vobiscum, sicut dixistis."
      en: "Seek ye good, and not evil, that you may live: and the Lord the God of hosts will be with you, as you have said."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Odite malum et diligite bonum, et constituite in porta judicium: si forte misereatur Dominus Deus exercituum reliquiis Joseph."
      en: "Hate evil, and love good, and establish judgment in the gate: it may be the Lord the God of hosts may have mercy on the remnant of Joseph."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Propterea haec dicit Dominus Deus exercituum, dominator: In omnibus plateis planctus; et in cunctis quae foris sunt, dicetur: Vae, vae! et vocabunt agricolam ad luctum, et ad planctum eos qui sciunt plangere."
      en: "Therefore thus saith the Lord the God of hosts the sovereign Lord: In every street there shall be wailing: and in all places that are without, they shall say: Alas, alas! and they shall call the husbandman to mourning, and such as are skillful in lamentation to lament."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et in omnibus vineis erit planctus, quia pertransibo in medio tui, dicit Dominus."
      en: "And in all vineyards there shall be wailing: because I will pass through in the midst of thee, saith the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vae desiderantibus diem Domini! ad quid eam vobis? Dies Domini ista, tenebrae, et non lux."
      en: "Woe to them that desire the day of the Lord: to what end is it for you? the day of the Lord is darkness, and not light."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Quomodo si fugiat vir a facie leonis, et occurrat ei ursus; et ingrediatur domum, et innitatur manu sua super parietem, et mordeat eum coluber."
      en: "As if a man should flee from the face of a lion, and a bear should meet him: or enter into the house, and lean with his hand upon the wall, and a serpent should bite him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Numquid non tenebrae dies Domini, et non lux; et caligo, et non splendor in ea?"
      en: "Shall not the day of the Lord be darkness, and not light: and obscurity, and no brightness in it?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Odi, et projeci festivitates vestras, et non capiam odorem coetuum vestrorum."
      en: "I hate, and have rejected your festivities: and I will not receive the odour of your assemblies."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Quod si obtuleritis mihi holocautomata, et munera vestra, non suscipiam; et vota pinguium vestrorum non respiciam."
      en: "And if you offer me holocausts, and your gifts, I will not receive them: neither will I regard the vows of your fat beasts."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Aufer a me tumultum carminum tuorum; et cantica lyrae tuae non audiam."
      en: "Take away from me the tumult of thy songs: and I will not hear the canticles of thy harp."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et revelabitur quasi aqua judicium, et justitia quasi torrens fortis."
      en: "But judgment shall be revealed as water, and justice as a mighty torrent."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Numquid hostias et sacrificium obtulistis mihi in deserto quadraginta annis, domus Israel?"
      en: "Did you offer victims and sacrifices to me in the desert for forty years, O house of Israel?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et portastis tabernaculum Moloch vestro, et imaginem idolorum vestrorum, sidus dei vestri, quae fecistis vobis."
      en: "But you carried a tabernacle for your Moloch, and the image of your idols, the star of your god, which you made to yourselves."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et migrare vos faciam trans Damascum, dicit Dominus: Deus exercituum nomen ejus."
      en: "And I will cause you to go into captivity beyond Damascus, saith the Lord, the God of hosts is his name."
    status: { la: verified, en: verified }
