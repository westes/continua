# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: heb
chapter: 3
verses:
  - n: 1
    text:
      la: "Unde, fratres sancti, vocationis caelestis participes, considerate Apostolum, et pontificem confessionis nostrae Jesum:"
      en: "Wherefore, holy brethren, partakers of the heavenly vocation, consider the apostle and high priest of our confession, Jesus:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "qui fidelis est ei, qui fecit illum, sicut et Moyses in omni domo ejus."
      en: "Who is faithful to him that made him, as was also Moses in all his house."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Amplioris enim gloriae iste prae Moyse dignus est habitus, quanto ampliorem honorem habet domus, qui fabricavit illam."
      en: "For this man was counted worthy of greater glory than Moses, by so much as he that hath built the house, hath greater honour than the house."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Omnis namque domus fabricatur ab aliquo: qui autem omnia creavit, Deus est."
      en: "For every house is built by some man: but he that created all things, is God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et Moyses quidem fidelis erat in tota domo ejus tamquam famulus, in testimonium eorum, quae dicenda erant:"
      en: "And Moses indeed was faithful in all his house as a servant, for a testimony of those things which were to be said:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Christus vero tamquam filius in domo sua: quae domus sumus nos, si fiduciam, et gloriam spei usque ad finem, firmam retineamus."
      en: "But Christ as the Son in his own house: which house are we, if we hold fast the confidence and glory of hope unto the end."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quapropter sicut dicit Spiritus Sanctus: Hodie si vocem ejus audieritis,"
      en: "Wherefore, as the Holy Ghost saith: Today if you shall hear his voice,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "nolite obdurare corda vestra, sicut in exacerbatione secundum diem tentationis in deserto,"
      en: "Harden not your hearts, as in the provocation; in the day of temptation in the desert,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ubi tentaverunt me patres vestri: probaverunt, et viderunt opera mea"
      en: "Where your fathers tempted me, proved and saw my works,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quadraginta annis: propter quod infensus fui generationi huic, et dixi: Semper errant corde. Ipsi autem non cognoverunt vias meas,"
      en: "Forty years: for which cause I was offended with this generation, and I said: They always err in heart. And they have not known my ways,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sicut juravi in ira mea: Si introibunt in requiem meam."
      en: "As I have sworn in my wrath: If they shall enter into my rest."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Videte fratres, ne forte sit in aliquo vestrum cor malum incredulitatis, discedendi a Deo vivo:"
      en: "Take heed, brethren, lest perhaps there be in any of you an evil heart of unbelief, to depart from the living God."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sed adhortamini vosmetipsos per singulos dies, donec hodie cognominatur, ut non obduretur quis ex vobis fallacia peccati."
      en: "But exhort one another every day, whilst it is called today, that none of you be hardened through the deceitfulness of sin."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Participes enim Christi effecti sumus, si tamen initium substantiae ejus usque ad finem firmum retineamus."
      en: "For we are made partakers of Christ: yet so, if we hold the beginning of his substance firm unto the end."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dum dicitur: Hodie si vocem ejus audieritis, nolite obdurare corda vestra, quemadmodum in illa exacerbatione."
      en: "While it is said, Today if you shall hear his voice, harden not your hearts, as in that provocation."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quidam enim audientes exacerbaverunt: sed non universi qui profecti sunt ex Aegypto per Moysen."
      en: "For some who heard did provoke: but not all that came out of Egypt by Moses."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quibus autem infensus est quadraginta annis? nonne illis qui peccaverunt, quorum cadavera prostrata sunt in deserto?"
      en: "And with whom was he offended forty years? Was it not with them that sinned, whose carcasses were overthrown in the desert?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quibus autem juravit non introire in requiem ipsius, nisi illis qui increduli fuerunt?"
      en: "And to whom did he swear, that they should not enter into his rest: but to them that were incredulous?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et videmus, quia non potuerunt introire propter incredulitatem."
      en: "And we see that they could not enter in, because of unbelief."
    status: { la: verified, en: verified }
