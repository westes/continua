# Sophonias (Zephaniah) 3 — verses 8-13 transcribed from a live Divinum
# Officium query (Monastic Tridentinum 1617, prayMatutinum, 2026-09-01,
# ordinary Paschaltide Sundays — 2026 cycle) — see
# data/hours/matins-sunday-paschaltide-nocturn-overrides.yml. Only the
# verse range actually used by that Nocturn III canticle is authored;
# "soph" (matching this app's Latin-abbreviation book-code convention) is
# the first content under this book code.
book: soph
chapter: 3
verses:
  - n: 8
    text:
      la: "Exspécta me, dicit Dóminus, in die resurrectiónis meæ in futúrum: * quia judícium meum ut cóngregem gentes, et cólligam regna,"
      en: "Wherefore expect me, saith the Lord, in the day of my resurrection that is to come, * for my judgment is to assemble the Gentiles, and to gather the kingdoms:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et effúndam super eos indignatiónem meam, * omnem iram furóris mei:"
      en: "And to pour upon them my indignation, * all my fierce anger:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "In igne enim zeli mei * devorábitur omnis terra."
      en: "For with the fire of my jealousy * shall all the earth be devoured."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quia tunc reddam pópulis lábium eléctum, ut ínvocent omnes in nómine Dómini, * et sérviant ei húmero uno."
      en: "Because then I will restore to the people a chosen lip, that all may call upon the name of the Lord, * and may serve him with one shoulder."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ultra flúmina Æthiópiæ, inde súpplices mei; * fílii dispersórum meórum déferent munus mihi."
      en: "From beyond the rivers of Ethiopia, shall my suppliants the children of my dispersed people * bring me an offering."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "In die illa non confundéris super cunctis adinventiónibus tuis, * quibus prævaricáta es in me:"
      en: "In that day thou shalt not be ashamed for all thy doings, * wherein thou hast transgressed against me:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quia tunc áuferam de médio tui magníloquos supérbiæ tuæ, * et non adjícies exaltári ámplius in monte sancto meo."
      en: "For then I will take away out of the midst of thee thy proud boasters, * and thou shalt no more be lifted up because of my holy mountain."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et derelínquam in médio tui pópulum páuperem et egénum: * et sperábunt in nómine Dómini."
      en: "And I will leave in the midst of thee a poor and needy people: * and they shall hope in the name of the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Relíquiæ Israël non fácient iniquitátem, nec loquéntur mendácium, * et non inveniétur in ore eórum lingua dolósa:"
      en: "The remnant of Israel shall not do iniquity, nor speak lies, * nor shall a deceitful tongue be found in their mouth:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quóniam ipsi pascéntur, et accubábunt, * et non erit qui extérreat."
      en: "For they shall feed, and shall lie down, * and there shall be none to make them afraid."
    status: { la: verified, en: verified }
