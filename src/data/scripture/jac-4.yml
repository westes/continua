# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jac
chapter: 4
verses:
  - n: 1
    text:
      la: "unde bella et lites in vobis nonne hinc ex concupiscentiis vestris quae militant in membris vestris"
      en: "From whence are wars and contentions among you? Are they not hence, from your concupiscences, which war in your members?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "concupiscitis et non habetis occiditis et zelatis et non potestis adipisci litigatis et belligeratis non habetis propter quod non postulatis"
      en: "You covet, and have not: you kill, and envy, and can not obtain. You contend and war, and you have not, because you ask not."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "petitis et non accipitis eo quod male petatis ut in concupiscentiis vestris insumatis"
      en: "You ask, and receive not; because you ask amiss: that you may consume it on your concupiscences."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "adulteri nescitis quia amicitia huius mundi inimica est Dei quicumque ergo voluerit amicus esse saeculi huius inimicus Dei constituitur"
      en: "Adulterers, know you not that the friendship of this world is the enemy of God? Whosoever therefore will be a friend of this world, becometh an enemy of God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "aut putatis quia inaniter scriptura dicat ad invidiam concupiscit Spiritus qui inhabitat in nobis"
      en: "Or do you think that the scripture saith in vain: To envy doth the spirit covet which dwelleth in you?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "maiorem autem dat gratiam propter quod dicit Deus superbis resistit humilibus autem dat gratiam"
      en: "But he giveth greater grace. Wherefore he saith: God resisteth the proud, and giveth grace to the humble."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "subditi igitur estote Deo resistite autem diabolo et fugiet a vobis"
      en: "Be subject therefore to God, but resist the devil, and he will fly from you."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "adpropiate Domino et adpropinquabit vobis emundate manus peccatores et purificate corda duplices animo"
      en: "Draw nigh to God, and he will draw nigh to you. Cleanse your hands, ye sinners: and purify your hearts, ye double minded."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "miseri estote et lugete et plorate risus vester in luctum convertatur et gaudium in maerorem"
      en: "Be afflicted, and mourn, and weep: let your laughter be turned into mourning, and your joy into sorrow."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "humiliamini in conspectu Domini et exaltabit vos"
      en: "Be humbled in the sight of the Lord, and he will exalt you."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "nolite detrahere de alterutrum fratres qui detrahit fratri aut qui iudicat fratrem suum detrahit legi et iudicat legem si autem iudicas legem non es factor legis sed iudex"
      en: "Detract not one another, my brethren. He that detracteth his brother, or he that judgeth his brother, detracteth the law, and judgeth the law. But if thou judge the law, thou art not a doer of the law, but a judge."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "unus est legislator et iudex qui potest perdere et liberare tu autem quis es qui iudicas proximum"
      en: "There is one lawgiver, and judge, that is able to destroy and to deliver."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ecce nunc qui dicitis hodie aut crastino ibimus in illam civitatem et faciemus quidem ibi annum et mercabimur et lucrum faciemus"
      en: "But who art thou that judgest thy neighbour? Behold, now you that say: To day or to morrow we will go into such a city, and there we will spend a year, and will traffic, and make our gain."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui ignoratis quid erit in crastinum quae enim est vita vestra vapor est ad modicum parens deinceps exterminatur"
      en: "Whereas you know not what shall be on the morrow."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "pro eo ut dicatis si Dominus voluerit et vixerimus faciemus hoc aut illud"
      en: "For what is your life? It is a vapour which appeareth for a little while, and afterwards shall vanish away. For that you should say: If the Lord will, and if we shall live, we will do this or that."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "nunc autem exultatis in superbiis vestris omnis exultatio talis maligna est"
      en: "But now you rejoice in your arrogancies. All such rejoicing is wicked."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "scienti igitur bonum facere et non facienti peccatum est illi"
      en: "To him therefore who knoweth to do good, and doth it not, to him it is sin."
    status: { la: verified, en: verified }
