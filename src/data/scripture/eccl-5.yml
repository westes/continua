# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: eccl
chapter: 5
verses:
  - n: 1
    text:
      la: "ne temere quid loquaris neque cor tuum sit velox ad proferendum sermonem coram Deo Deus enim in caelo et tu super terram idcirco sint pauci sermones tui"
      en: "Speak not any thing rashly, and let not thy heart be hasty to utter a word before God. For God is in heaven, and thou upon earth: therefore let thy words be few."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "multas curas sequuntur somnia et in multis sermonibus invenitur stultitia"
      en: "Dreams follow many cares: and in many words shall be found folly."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "si quid vovisti Deo ne moreris reddere displicet enim ei infidelis et stulta promissio sed quodcumque voveris redde"
      en: "If thou hast vowed any thing to God, defer not to pay it: for an unfaithful and foolish promise displeaseth him: but whatsoever thou hast vowed, pay it."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "multoque melius est non vovere quam post votum promissa non conplere"
      en: "And it is much better not to vow, than after a vow not to perform the things promised."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ne dederis os tuum ut peccare faciat carnem tuam neque dicas coram angelo non est providentia ne forte iratus Deus super sermone tuo dissipet cuncta opera manuum tuarum"
      en: "Give not thy mouth to cause thy flesh to sin: and say not before the angel: There is no providence: lest God be angry at thy words, and destroy all the works of thy hands."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ubi multa sunt somnia plurimae vanitates et sermones innumeri tu vero Deum time"
      en: "Where there are many dreams, there are many vanities, and words without number: but do thou fear God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "si videris calumnias egenorum et violenta iudicia et subverti iustitiam in provincia non mireris super hoc negotio quia excelso alius excelsior est et super hos quoque eminentiores sunt alii"
      en: "If thou shalt see the oppressions of the poor, and violent judgments, and justice perverted in the province, wonder not at this matter: for he that is high hath another higher, and there are others still higher than these:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et insuper universae terrae rex imperat servienti"
      en: "Moreover there is the king that reigneth over all the land subject to him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "avarus non implebitur pecunia et qui amat divitias fructus non capiet ex eis et hoc ergo vanitas"
      en: "A covetous man shall not be satisfied with money: and he that loveth riches shall reap no fruit from them: so this also is vanity."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ubi multae sunt opes multi et qui comedant eas et quid prodest possessori nisi quod cernit divitias oculis suis"
      en: "Where there are great riches, there are also many to eat them. And what doth it profit the owner, but that he seeth the riches with his eyes?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dulcis est somnus operanti sive parum sive multum comedat saturitas autem divitis non sinit dormire eum"
      en: "Sleep is sweet to a labouring man, whether he eat lttle or much: but the fulness of the rich will not suffer him to sleep."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "est et alia infirmitas pessima quam vidi sub sole divitiae conservatae in malum domini sui"
      en: "There is also another grievous evil, which I have seen under the sun: riches kept to the hurt of the owner."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "pereunt enim in adflictione pessima generavit filium qui in summa egestate erit"
      en: "For they are lost with very great affliction: he hath begotten a son, who shall be in extremity of want."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sicut egressus est nudus de utero matris suae sic revertetur et nihil auferet secum de labore suo"
      en: "As he came forth naked from his mother's womb, so shall he return, and shall take nothing away with him of his labour."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "miserabilis prorsus infirmitas quomodo venit sic revertetur quid ergo prodest ei quod laboravit in ventum"
      en: "A most deplorable evil: as he came, so shall he return. What then doth it profit him that he hath laboured for the wind?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cunctis diebus vitae suae comedit in tenebris et in curis multis et in aerumna atque tristitia"
      en: "All the days of his life he eateth in darkness, and in many cares, and in misery, and sorrow."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "hoc itaque mihi visum est bonum ut comedat quis et bibat et fruatur laetitia ex labore suo quod laboravit ipse sub sole numerum dierum vitae suae quos dedit ei Deus et haec est pars illius"
      en: "This therefore hath seemed good to me, that a man should eat and drink, and enjoy the fruit of his labour, wherewith he hath laboured under the sun, all the days of his life, which God hath given him: and this is his portion."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et omni homini cui dedit Deus divitias atque substantiam potestatemque ei tribuit ut comedat ex eis et fruatur parte sua et laetetur de labore suo hoc est donum Dei"
      en: "And every man to whom God hath given riches, and substance, and hath given him power to eat thereof, and to enjoy his portion, and to rejoice of his labour: this is the gift of God."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "non enim satis recordabitur dierum vitae suae eo quod Deus occupet deliciis cor eius"
      en: "For he shall not much remember the days of his life, because God entertaineth his heart with delight,"
    status: { la: verified, en: verified }
