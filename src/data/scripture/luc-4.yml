# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: luc
chapter: 4
verses:
  - n: 1
    text:
      la: "Jesus autem plenus Spiritu Sancto regressus est a Jordane: et agebatur a Spiritu in desertum"
      en: "And Jesus being full of the Holy Ghost, returned from the Jordan, and was led by the Spirit into the desert,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "diebus quadraginta, et tentabatur a diabolo. Et nihil manducavit in diebus illis: et consummatis illis esuriit."
      en: "For the space of forty days; and was tempted by the devil. And he ate nothing in those days; and when they were ended, he was hungry."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dixit autem illi diabolus: Si Filius Dei es, dic lapidi huic ut panis fiat."
      en: "And the devil said to him: If thou be the Son of God, say to this stone that it be made bread."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et respondit ad illum Jesus: Scriptum est: Quia non in solo pane vivit homo, sed in omni verbo Dei."
      en: "And Jesus answered him: It is written, that Man liveth not by bread alone, but by every word of God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et duxit illum diabolus in montem excelsum, et ostendit illi omnia regna orbis terrae in momento temporis,"
      en: "And the devil led him into a high mountain, and shewed him all the kingdoms of the world in a moment of time;"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et ait illi: Tibi dabo potestatem hanc universam, et gloriam illorum: quia mihi tradita sunt, et cui volo do illa."
      en: "And he said to him: To thee will I give all this power, and the glory of them; for to me they are delivered, and to whom I will, I give them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Tu ergo si adoraveris coram me, erunt tua omnia."
      en: "If thou therefore wilt adore before me, all shall be thine."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et respondens Jesus, dixit illi: Scriptum est: Dominum Deum tuum adorabis, et illi soli servies."
      en: "And Jesus answering said to him: It is written: Thou shalt adore the Lord thy God, and him only shalt thou serve."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et duxit illum in Jerusalem, et statuit eum super pinnam templi, et dixit illi: Si Filius Dei es, mitte te hinc deorsum."
      en: "And he brought him to Jerusalem, and set him on a pinnacle of the temple, and he said to him: If thou be the Son of God, cast thyself from hence."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Scriptum est enim quod angelis suis mandavit de te, ut conservent te:"
      en: "For it is written, that He hath given his angels charge over thee, that they keep thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et quia in manibus tollent te, ne forte offendas ad lapidem pedem tuum."
      en: "And that in their hands they shall bear thee up, lest perhaps thou dash thy foot against a stone."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et respondens Jesus, ait illi: Dictum est: Non tentabis Dominum Deum tuum."
      en: "And Jesus answering, said to him: It is said: Thou shalt not tempt the Lord thy God."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et consummata omni tentatione, diabolus recessit ab illo, usque ad tempus."
      en: "And all the temptation being ended, the devil departed from him for a time."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et regressus est Jesus in virtute Spiritus in Galilaeam, et fama exiit per universam regionem de illo."
      en: "And Jesus returned in the power of the spirit, into Galilee, and the fame of him went out through the whole country."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et ipse docebat in synagogis eorum, et magnificabatur ab omnibus."
      en: "And he taught in their synagogues, and was magnified by all."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et venit Nazareth, ubi erat nutritus, et intravit secundum consuetudinem suam die sabbati in synagogam, et surrexit legere."
      en: "And he came to Nazareth, where he was brought up: and he went into the synagogue, according to his custom, on the sabbath day; and he rose up to read."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et traditus est illi liber Isaiae prophetae. Et ut revolvit librum, invenit locum ubi scriptum erat:"
      en: "And the book of Isaias the prophet was delivered unto him. And as he unfolded the book, he found the place where it was written:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Spiritus Domini super me: propter quod unxit me, evangelizare pauperibus misit me, sanare contritos corde,"
      en: "The Spirit of the Lord is upon me. Wherefore he hath anointed me to preach the gospel to the poor, he hath sent me to heal the contrite of heart,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "praedicare captivis remissionem, et caecis visum, dimittere confractos in remissionem, praedicare annum Domini acceptum et diem retributioni."
      en: "To preach deliverance to the captives, and sight to the blind, to set at liberty them that are bruised, to preach the acceptable year of the Lord, and the day of reward."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et cum plicuisset librum, reddit ministro, et sedit. Et omnium in synagoga oculi erant intendentes in eum."
      en: "And when he had folded the book, he restored it to the minister, and sat down. And the eyes of all in the synagogue were fixed on him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Coepit autem dicere ad illos: Quia hodie impleta est haec scriptura in auribus vestris."
      en: "And he began to say to them: This day is fulfilled this scripture in your ears."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et omnes testimonium illi dabant: et mirabantur in verbis gratiae, quae procedebant de ore ipsius, et dicebant: Nonne hic est filius Joseph?"
      en: "And all gave testimony to him: and they wondered at the words of grace that proceeded from his mouth, and they said: Is not this the son of Joseph?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et ait illis: Utique dicetis mihi hanc similitudinem: Medice cura teipsum: quanta audivimus facta in Capharnaum, fac et hic in patria tua."
      en: "And he said to them: Doubtless you will say to me this similitude: Physician, heal thyself: as great things as we have heard done in Capharnaum, do also here in thy own country."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ait autem: Amen dico vobis, quia nemo propheta acceptus est in patria sua."
      en: "And he said: Amen I say to you, that no prophet is accepted in his own country."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "In veritate dico vobis, multae viduae erant in diebus Eliae in Israel, quando clausum est caelum annis tribus et mensibus sex, cum facta esset fames magna in omni terra:"
      en: "In truth I say to you, there were many widows in the days of Elias in Israel, when heaven was shut up three years and six months, when there was a great famine throughout all the earth."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et ad nullam illarum missus est Elias, nisi in Sarepta Sidoniae, ad mulierem viduam."
      en: "And to none of them was Elias sent, but to Sarepta of Sidon, to a widow woman."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et multi leprosi erant in Israel sub Elisaeo propheta: et nemo eorum mundatus est nisi Naaman Syrus."
      en: "And there were many lepers in Israel in the time of Eliseus the prophet: and none of them was cleansed but Naaman the Syrian."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et repleti sunt omnes in synagoga ira, haec audientes."
      en: "And all they in the synagogue, hearing these things, were filled with anger."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et surrexerunt, et ejecerunt illum extra civitatem: et duxerunt illum usque ad supercilium montis, super quem civitas illorum erat aedificata, ut praecipitarent eum."
      en: "And they rose up and thrust him out of the city; and they brought him to the brow of the hill, whereon their city was built, that they might cast him down headlong."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Ipse autem transiens per medium illorum, ibat."
      en: "But he passing through the midst of them, went his way."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et descendit in Capharnaum civitatem Galilaeae, ibique docebat illos sabbatis."
      en: "And he went down into Capharnaum, a city of Galilee, and there he taught them on the sabbath days."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et stupebant in doctrina ejus, quia in potestate erat sermo ipsius."
      en: "And they were astonished at his doctrine: for his speech was with power."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et in synagoga erat homo habens daemonium immundum, et exclamavit voce magna,"
      en: "And in the synagogue there was a man who had an unclean devil, and he cried out with a loud voice,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "dicens: Sine, quid nobis et tibi, Jesu Nazarene? venisti perdere nos? scio te quis sis, Sanctus Dei."
      en: "Saying: Let us alone, what have we to do with thee, Jesus of Nazareth? art thou come to destroy us? I know thee who thou art, the holy one of God."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et increpavit illum Jesus, dicens: Obmutesce, et exi ab eo. Et cum projecisset illum daemonium in medium, exiit ab illo, nihilque illum nocuit."
      en: "And Jesus rebuked him, saying: Hold thy peace, and go out of him. And when the devil had thrown him into the midst, he went out of him, and hurt him not at all."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et factus est pavor in omnibus, et colloquebantur ad invicem, dicentes: Quod est hoc verbum, quia in potestate et virtute imperat immundis spiritibus, et exeunt?"
      en: "And there came fear upon all, and they talked among themselves, saying: What word is this, for with authority and power he commandeth the unclean spirits, and they go out?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et divulgabatur fama de illo in omnem locum regionis."
      en: "And the fame of him was published into every place of the country."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Surgens autem Jesus de synagoga, introivit in domum Simonis. Socrus autem Simonis tenebatur magnis febribus: et rogaverunt illum pro ea."
      en: "And Jesus rising up out of the synagogue, went into Simon's house. And Simon's wife's mother was taken with a great fever, and they besought him for her."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et stans super illam imperavit febri: et dimisit illam. Et continuo surgens, ministrabat illis."
      en: "And standing over her, he commanded the fever, and it left her. And immediately rising, she ministered to them."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Cum autem sol occidisset, omnes qui habebant infirmos variis languoribus, ducebant illos ad eum. At ille singulis manus imponens, curabat eos."
      en: "And when the sun was down, all they that had any sick with divers diseases, brought them to him. But he laying his hands on every one of them, healed them."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Exibant autem daemonia a multis clamantia, et dicentia: Quia tu es Filius Dei: et increpans non sinebat ea loqui: quia sciebant ipsum esse Christum."
      en: "And devils went out from many, crying out and saying: Thou art the Son of God. And rebuking them he suffered them not to speak, for they knew that he was Christ."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Facta autem die egressus ibat in desertum locum, et turbae requirebant eum, et venerunt usque ad ipsum: et detinebant illum ne discederet ab eis."
      en: "And when it was day, going out he went into a desert place, and the multitudes sought him, and came unto him: and they stayed him that he should not depart from them."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Quibus ille ait: Quia et aliis civitatibus oportet me evangelizare regnum Dei: quia ideo missus sum."
      en: "To whom he said: To other cities also I must preach the kingdom of God: for therefore am I sent."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Et erat praedicans in synagogis Galilaeae."
      en: "And he was preaching in the synagogues of Galilee."
    status: { la: verified, en: verified }
