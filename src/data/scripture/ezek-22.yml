# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 22
verses:
  - n: 1
    text:
      la: "Et factum est verbum Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et tu, fili hominis, nonne judicas, nonne judicas civitatem sanguinum?"
      en: "And thou son of man, dost thou not judge, dost thou not judge the city of blood?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et ostendes ei omnes abominationes suas, et dices: Haec dicit Dominus Deus: Civitas effundens sanguinem in medio sui, ut veniat tempus ejus: et quae fecit idola contra semetipsam, ut pollueretur."
      en: "And thou shalt shew her all her abominations, and shalt say: Thus saith the Lord God: This is the city that sheddeth blood in the midst of her, that her time may come: and that hath made idols against herself, to defile herself."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "In sanguine tuo, qui a te effusus est, deliquisti, et in idolis tuis, quae fecisti, polluta es: et appropinquare fecisti dies tuos, et adduxisti tempus annorum tuorum: propterea dedi te opprobrium gentibus, et irrisionem universis terris."
      en: "Thou art become guilty in thy blood which thou hast shed: and thou art defiled in thy idols which thou hast made: and thou hast made thy days to draw near, and hast brought on the time of thy years: therefore have I made thee a reproach to the Gentiles, and a mockery to all countries."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quae juxta sunt, et quae procul a te, triumphabunt de te, sordida, nobilis, grandis interitu."
      en: "Those that are near, and those that are far from thee, shall triumph over thee: thou filthy one, infamous, great in destruction."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ecce principes Israel singuli in brachio suo fuerunt in te, ad effundendum sanguinem."
      en: "Behold the princes of Israel, every one hath employed his arm in thee to shed blood."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Patrem et matrem contumeliis affecerunt: in te advenam calumniati sunt in medio tui: pupillum et viduam contristaverunt apud te."
      en: "They have abused father and mother in thee, they have oppressed the stranger in the midst of thee, they have grieved the fatherless and widow in thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sanctuaria mea sprevisti, et sabbata mea polluisti."
      en: "Thou hast despised my sanctuaries, and profaned my sabbaths."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Viri detractores fuerunt in te ad effundendum sanguinem, et super montes comederunt in te: scelus operati sunt in medio tui."
      en: "Slanderers have been in thee to shed blood, and they have eaten upon the mountains in thee, they have committed wickedness in the midst of thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Verecundiora patris discooperuerunt in te: immunditiam menstruatae humiliaverunt in te:"
      en: "They have discovered the nakedness of their father in thee, they have humbled the uncleanness of the menstruous woman in thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et unusquisque in uxorem proximi sui operatus est abominationem, et socer nurum suam polluit nefarie; frater sororem suam, filiam patris sui, oppressit in te."
      en: "And every one hath committed abomination with his neighbour's wife, and the father in law hath wickedly defiled his daughter in law, the brother hath oppressed his sister the daughter of his father in thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Munera acceperunt apud te ad effundendum sanguinem: usuram et superabundantiam accepisti, et avare proximos tuos calumniabaris: meique oblita es, ait Dominus Deus."
      en: "They have taken gifts in thee to shed blood: thou hast taken usury and increase, and hast covetously oppressed thy neighbours: and thou hast forgotten me, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ecce complosi manus meas super avaritiam tuam, quam fecisti, et super sanguinem qui effusus est in medio tui."
      en: "Behold, I have clapped my hands at thy covetousness, which thou hast exercised : and at the blood that hath been shed in the midst of thee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Numquid sustinebit cor tuum, aut praevalebunt manus tuae, in diebus quos ego faciam tibi? Ego Dominus locutus sum, et faciam."
      en: "Shall thy heart endure, or shall thy hands prevail ill the days which I will bring upon thee: I the Lord have spoken, and will do it."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et dispergam te in nationes, et ventilabo te in terras, et deficere faciam immunditiam tuam a te."
      en: "And I will disperse thee in the nations, and will scatter thee among the countries, and I will put an end to thy uncleanness in thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et possidebo te in conspectu gentium: et scies quia ego Dominus."
      en: "And I will possess thee in the sight of the Gentiles, and thou shalt know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et factum est verbum Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Fili hominis, versa est mihi domus Israel in scoriam: omnes isti aes, et stannum, et ferrum, et plumbum in medio fornacis: scoria argenti facti sunt."
      en: "Son of man, the house of Israel is become dross to me: all these are brass, and tin, and iron, and lead, in the midst of the furnace: they are become the dross of silver."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Propterea haec dicit Dominus Deus: Eo quod versi estis omnes in scoriam, propterea ecce ego congregabo vos in medio Jerusalem,"
      en: "Therefore thus saith the Lord God: Because you are all turned into dross, therefore behold I will gather you together in the midst of Jerusalem."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "congregatione argenti, et aeris, et stanni, et ferri, et plumbi, in medio fornacis, ut succendam in ea ignem ad conflandum. Sic congregabo in furore meo, et in ira mea, et requiescam, et conflabo vos."
      en: "As they gather silver, and brass, and tin, and iron, and lead in the midst of the furnace: that I may kindle a fire in it to melt it: so will I gather you together in my fury and in my wrath, and will take my rest, and I will melt you down."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et congregabo vos, et succendam vos in igne furoris mei, et conflabimini in medio ejus."
      en: "And I will gather you together, and will burn you in the fire of my wrath, and you shall be melted in the midst thereof."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ut conflatur argentum in medio fornacis, sic eritis in medio ejus: et scietis quia ego Dominus cum effuderim indignationem meam super vos."
      en: "As silver is melted in the midst of the furnace, so shall you be in the midst thereof: and you shall know that I am the Lord, when I have poured out my indignation upon you."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et factum est verbum Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Fili hominis, dic ei: Tu es terra immunda, et non compluta in die furoris."
      en: "Son of man, say to her: Thou art a land that is unclean, and not rained upon in the day of wrath."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Conjuratio prophetarum in medio ejus: sicut leo rugiens, rapiensque praedam, animas devoraverunt: opes et pretium acceperunt: viduas ejus multiplicaverunt in medio illius."
      en: "There is a conspiracy of prophets in the midst thereof: like a lion that roareth and catcheth the prey, they have devoured souls, they have taken riches and hire, they have made many widows in the midst thereof."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Sacerdotes ejus contempserunt legem meam, et polluerunt sanctuaria mea: inter sanctum et profanum non habuerunt distantiam, et inter pollutum et mundum non intellexerunt: et a sabbatis meis averterunt oculos suos, et coinquinabar in medio eorum."
      en: "Her priests have despised my law, and have defiled my sanctuaries: they have put no difference between holy and profane: nor have distinguished between the polluted and the clean: and they have turned away their eyes from my sabbaths, and I was profaned in the midst of them."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Principes ejus in medio illius, quasi lupi rapientes praedam ad effundendum sanguinem, et ad perdendas animas, et avare ad sectanda lucra."
      en: "Her princes in the midst of her, are like wolves ravening the prey to shed blood, and to destroy souls, and to run after gains through covetousness."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Prophetae autem ejus liniebant eos absque temperamento, videntes vana, et divinantes eis mendacium, dicentes: Haec dicit Dominus Deus: cum Dominus non sit locutus."
      en: "And her prophets have daubed them without tempering the mortar, seeing vain things, and divining lies unto them, saying: Thus saith the Lord God: when the Lord hath not spoken."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Populi terrae calumniabantur calumniam, et rapiebant violenter: egenum et pauperem affligebant, et advenam opprimebant calumnia absque judicio."
      en: "The people of the land have used oppression, and committed robbery: they afflicted the needy and poor, and they oppressed the stranger by calumny without judgment."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et quaesivi de eis virum qui interponeret sepem, et staret oppositus contra me pro terra, ne dissiparem eam: et non inveni."
      en: "And I sought among them for a man that might set up a hedge, and stand in the gap before me in favour of the land, that I might not destroy it: and I found none."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et effudi super eos indignationem meam; in igne irae meae consumpsi eos: viam eorum in caput eorum reddidi, ait Dominus Deus."
      en: "And I poured out my indignation upon them, in the fire of my wrath I consumed them: I have rendered their way upon their own head, saith the Lord God."
    status: { la: verified, en: verified }
