# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: eccl
chapter: 11
verses:
  - n: 1
    text:
      la: "mitte panem tuum super transeuntes aquas quia post multa tempora invenies illum"
      en: "Cast thy bread upon the running waters: for after a long time thou shalt find it again."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "da partem septem necnon et octo quia ignoras quid futurum sit mali super terram"
      en: "Give a portion to seven, and also to eight: for thou knowest not what evil shall be upon the earth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "si repletae fuerint nubes imbrem super terram effundent si ceciderit lignum ad austrum aut ad aquilonem in quocumque loco ceciderit ibi erit"
      en: "If the clouds be full, they will pour out rain upon the earth. If the tree fall to the south, or to the north, in what place soever it shall fall, there shall it be."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui observat ventum non seminat et qui considerat nubes numquam metet"
      en: "He that observeth the wind, shall not sow: and he that considereth the clouds, shall never reap."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quomodo ignoras quae sit via spiritus et qua ratione conpingantur ossa in ventre praegnatis sic nescis opera Dei qui fabricator est omnium"
      en: "As thou knowest not what is the way of the spirit, nor how the bones are joined together in the womb of her that is with child: so thou knowest not the works of God, who is the maker of all."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "mane semina sementem tuam et vespere ne cesset manus tua quia nescis quid magis oriatur hoc an illud et si utrumque simul melius erit"
      en: "In the morning sow thy seed, and In the evening let not thy hand cease: for thou knowest not which may rather spring up, this or that: and if both together, it shall be the better."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dulce lumen et delectabile est oculis videre solem"
      en: "The light is sweet, and it is delightful for the eyes to see the sun."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "si annis multis vixerit homo et in omnibus his laetatus fuerit meminisse debet tenebrosi temporis et dierum multorum qui cum venerint vanitatis arguentur praeterita"
      en: "If a man live many years, and have rejoiced in them all, he must remember the darksome time, and the many days: which when they shall come, the things past shall be accused of vanity."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "laetare ergo iuvenis in adulescentia tua et in bono sit cor tuum in diebus iuventutis tuae et ambula in viis cordis tui et in intuitu oculorum tuorum et scito quod pro omnibus his adducet te Deus in iudicium"
      en: "Rejoice therefore, O young man, in thy youth, and let thy heart be in that which is good in the days of thy youth, and walk in the ways of thy heart, and in the sight of thy eyes: and know that for all these God will bring thee into judgment."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "aufer iram a corde tuo et amove malitiam a carne tua adulescentia enim et voluptas vana sunt"
      en: "Remove anger from thy heart, and put away evil from thy flesh. For youth and pleasure are vain."
    status: { la: verified, en: verified }
