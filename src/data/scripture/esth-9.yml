# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: esth
chapter: 9
verses:
  - n: 1
    text:
      la: "igitur duodecimi mensis quem adar vocari ante iam diximus tertiadecima die quando cunctis Iudaeis interfectio parabatur et hostes eorum inhiabant sanguini versa vice Iudaei superiores esse coeperunt et se de adversariis vindicare"
      en: "So on the thirteenth day of the twelfth month, which as we have said above is called Adar, when all the Jews were designed to be massacred, and their enemies were greedy after their blood, the case being altered, the Jews began to have the upper hand, and to revenge themselves of their adversaries."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "congregatique sunt per singulas civitates oppida et loca ut extenderent manum contra inimicos et persecutores suos nullusque ausus est resistere eo quod omnes populos magnitudinis eorum formido penetrarat"
      en: "And they gathered themselves together in every city, and town, and place, to lay their hands on their enemies, and their persecutors. And no one durst withstand them, for the fear of their power had gone through every people."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "nam et provinciarum iudices duces et procuratores omnisque dignitas quae singulis locis et operibus praeerat extollebant Iudaeos timore Mardochei"
      en: "And the judges of the provinces, and the governors, and lieutenants, and every one in dignity, that presided over every place and work, extolled the Jews for fear of Mardochai:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quem principem esse palatii et plurimum posse cognoverant fama quoque nominis eius crescebat cotidie et per cunctorum ora volitabat"
      en: "For they knew him to be prince of the palace, and to have great power: and the fame of his name increased daily, and was spread abroad through all men's mouths."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "itaque percusserunt Iudaei inimicos suos plaga magna et occiderunt eos reddentes eis quod sibi paraverant facere"
      en: "So the Jews made a great slaughter of their enemies, and killed them, repaying according to what they had prepared to do to them:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in tantum ut etiam in Susis quingentos viros interficerent et decem extra filios Aman Agagitae hostis Iudaeorum quorum ista sunt nomina"
      en: "Insomuch that even in Susan they killed five hundred men, besides the ten sons of Aman the Agagite, the enemy of the Jews: whose names are these:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Pharsandatha et Delphon et Esphata"
      en: "Pharsandatha, and Delphon, and Esphatha,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et Phorata et Adalia et Aridatha"
      en: "And Phoratha, and Adalia, and Aridatha,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et Ephermesta et Arisai et Aridai et Vaizatha"
      en: "And Phermesta, and Arisai, and Aridai, and Jezatha."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quos cum occidissent praedas de substantiis eorum agere noluerunt"
      en: "And when they had slain them, they would not touch the spoils of their goods."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "statimque numerus eorum qui occisi erant in Susis ad regem relatus est"
      en: "And presently the number of them that were killed in Susan was brought to the king."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "qui dixit reginae in urbe Susis interfecere Iudaei quingentos viros et alios decem filios Aman quantam putas eos exercere caedem in universis provinciis quid ultra postulas et quid vis ut fieri iubeam"
      en: "And he said to the queen: The Jews have killed five hundred men in the city of Susan, besides the ten sons of Aman: how many dost thou think they have slain in all the provinces? What askest thou more, and what wilt thou have me to command to be done?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cui illa respondit si regi placet detur potestas Iudaeis ut sicut hodie fecerunt in Susis sic et cras faciant et decem filii Aman in patibulis suspendantur"
      en: "And she answered: If it please the king, let it be granted to the Jews, to do to morrow in Susan as they have done to day, and that the ten sons of Aman may be hanged upon gibbets."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "praecepitque rex ut ita fieret statimque in Susis pependit edictum et decem Aman filii suspensi sunt"
      en: "And the king commanded that it should be so done. And forthwith the edict was hung up in Susan, and the ten sons of Aman were hanged."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "congregatis Iudaeis quartadecima adar mensis die interfecti sunt in Susis trecenti viri nec eorum ab illis direpta substantia est"
      en: "And on the fourteenth day of the month Adar the Jews gathered themselves together, and they killed in Susan three hundred men: but they took not their substance."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sed et per omnes provincias quae dicioni regis subiacebant pro animabus suis stetere Iudaei interfectis hostibus ac persecutoribus suis in tantum ut septuaginta quinque milia occisorum implerentur et nullus de substantiis eorum quicquam contingeret"
      en: "Moreover through all the provinces which were subject to the king's dominion the Jews stood for their lives, and slew their enemies and persecutors: insomuch that the number of them that were Billed amounted to seventy-five thousand, and no man took any of their goods."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dies autem tertiusdecimus mensis adar unus apud omnes interfectionis fuit et quartodecimo die caedere desierunt quem constituerunt esse sollemnem ut in eo omni deinceps tempore vacarent epulis gaudio atque conviviis"
      en: "Now the thirteenth day of the month Adar was the first day with them all of the slaughter, and on the fourteenth day they left off. Which they ordained to be kept holy day, so that all times hereafter they should celebrate it with feasting, joy, and banquets."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "at hii qui in urbe Susis caedem exercuerant tertiodecimo et quartodecimo eiusdem mensis die in caede versati sunt quintodecimo autem die percutere desierunt et idcirco eandem diem constituere sollemnem epularum atque laetitiae"
      en: "But they that were killing in the city of Susan, were employed in the slaughter on the thirteenth and fourteenth day of the same month: and on the fifteenth day they rested. And therefore they appointed that day to be a holy day of feasting and gladness."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "hii vero Iudaei qui in oppidis non muratis ac villis morabantur quartumdecimum diem mensis adar conviviorum et gaudii decreverunt ita ut exultent in eo et mittant sibi mutuo partes epularum et ciborum"
      en: "But those Jews that dwelt in towns not walled and in villages, appointed the fourteenth day of the month Adar for banquets and gladness, so as to rejoice on that day, and send one another portions of their banquets and meats."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "scripsit itaque Mardocheus omnia haec et litteris conprehensa misit ad Iudaeos qui in omnibus regis provinciis morabantur tam in vicino positis quam procul"
      en: "And Mardochai wrote all these things, and sent them comprised in letters to the Jews that abode in all the king's provinces, both those that lay near and those afar off,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ut quartamdecimam et quintamdecimam diem mensis adar pro festis susciperent et revertente semper anno sollemni honore celebrarent"
      en: "That they should receive the fourteenth and fifteenth day of the month Adar for holy days, and always at the return of the year should celebrate them with solemn honour:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quia in ipsis diebus se ulti sunt Iudaei de inimicis suis et luctus atque tristitia in hilaritatem gaudiumque conversa sint essentque istae dies epularum atque laetitiae et mitterent sibi invicem ciborum partes et pauperibus munuscula largirentur"
      en: "Because on those days the Jews revenged themselves of their enemies, and their mourning and sorrow were turned into mirth and joy, and that these should be days of feasting and gladness, in which they should send one to another portions of meats; and should give gifts to the poor."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "susceperuntque Iudaei in sollemnem ritum cuncta quae eo tempore facere coeperant et quae Mardocheus litteris facienda mandaverat"
      en: "And the Jews undertook to observe with solemnity all they had begun to do at that time, which Mardochai by letters had commanded to be done."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Aman enim filius Amadathi stirpis Agag hostis et adversarius Iudaeorum cogitavit contra eos malum ut occideret illos atque deleret et misit phur quod nostra lingua vertitur in sortem"
      en: "For Aman, the son of Amadathi of the race of Agag, the enemy and adversary of the Jews, had devised evil against them, to kill them and destroy them: and had cast Phur, that is, the lot."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et postea ingressa est Hester ad regem obsecrans ut conatus eius litteris regis irriti fierent et malum quod contra Iudaeos cogitaverat reverteretur in caput eius denique et ipsum et filios eius adfixerunt cruci"
      en: "And afterwards Esther went in to the king, beseeching him that his endeavours might be made void by the king's letters: and the evil that he had intended against the Jews, might return upon his own head. And so both he and his sons were hanged upon gibbets."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "atque ex illo tempore dies isti appellati sunt Phurim id est Sortium eo quod phur id est sors in urnam missa fuerit et cuncta quae gesta sunt epistulae id est libri huius volumine continentur"
      en: "And since that time these days are called Phurim, that is, of lots: because Phur, that is, the lot, was cast into the urn. And all things that were done, are contained in the volume of this epistle, that is, of this book:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "quaeque sustinuerint et quae deinceps inmutata sint suscepere Iudaei super se et semen suum et super cunctos qui religioni eorum voluerint copulari ut nulli liceat duos hos dies absque sollemnitate transigere quam scriptura testatur et certa expetunt tempora annis sibi iugiter succedentibus"
      en: "And the things that they suffered, and that were afterwards changed, the Jews took upon themselves and their seed, and upon all that had a mind to be joined to their religion, so that it should be lawful for none to pass these days without solemnity: which the writing testifieth, and certain times require, as the years continually succeed one another."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "isti sunt dies quos nulla umquam delebit oblivio et per singulas generationes cunctae in toto orbe provinciae celebrabunt nec est ulla civitas in qua dies Phurim id est Sortium non observentur a Iudaeis et ab eorum progenie quae his caerimoniis obligata est"
      en: "These are the days which shall never be forgot: and which all provinces in the whole world shall celebrate throughout all generations: neither is there any city wherein the days of Phurim, that is, of lots, must not be observed by the Jews, and by their posterity, which is bound to these ceremonies."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "scripseruntque Hester regina filia Abiahil et Mardocheus Iudaeus etiam secundam epistulam ut omni studio dies ista sollemnis sanciretur in posterum"
      en: "And Esther the queen, the daughter of Abihail, and Mardochai the Jew, wrote also a second epistle, that with all diligence this day should be established a festival for the time to come."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et miserunt ad omnes Iudaeos qui in centum viginti septem regis Asueri provinciis versabantur ut haberent pacem et susciperent veritatem"
      en: "And they sent to all the Jews that were in the hundred and twenty-seven provinces of king Assuerus, that they should have peace, and receive truth,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "observantes dies Sortium et suo tempore cum gaudio celebrarent sicut constituerat Mardocheus et Hester et illi observanda susceperant a se et a semine suo ieiunia atque clamores et Sortium dies"
      en: "And observe the days of lots, and celebrate them with joy in their proper time: as Mardochai and Esther had appointed, and they undertook them to be observed by themselves and by their seed, fasts, and cries, and the days of lots,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et omnia quae libri huius qui vocatur Hester historia continentur"
      en: "And all things which are contained in the history of this book, which is called Esther."
    status: { la: verified, en: verified }
