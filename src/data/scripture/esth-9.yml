# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: esth
chapter: 9
verses:
  - n: 1
    text:
      la: "Igitur duodecimi mensis, quem Adar vocari ante jam diximus, tertiadecima die, quando cunctis Judaeis interfectio parabatur, et hostes eorum inhiabant sanguini, versa vice Judaei superiores esse coeperunt, et se de adversariis vindicare."
      en: "So on the thirteenth day of the twelfth month, which as we have said above is called Adar, when all the Jews were designed to be massacred, and their enemies were greedy after their blood, the case being altered, the Jews began to have the upper hand, and to revenge themselves of their adversaries."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Congregatique sunt per singulas civitates, oppida, et loca, ut extenderent manum contra inimicos, et persecutores suos. Nullusque ausus est resistere, eo quod omnes populos magnitudinis eorum formido penetrarat."
      en: "And they gathered themselves together in every city, and town, and place, to lay their hands on their enemies, and their persecutors. And no one durst withstand them, for the fear of their power had gone through every people."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Nam et provinciarum judices, et duces, et procuratores, omnisque dignitas, quae singulis locis ac operibus praeerat, extollebant Judaeos timore Mardochaei:"
      en: "And the judges of the provinces, and the governors, and lieutenants, and every one in dignity, that presided over every place and work, extolled the Jews for fear of Mardochai:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quem principem esse palatii, et plurimum posse cognoverant: fama quoque nominis ejus crescebat quotidie, et per cunctorum ora volitabat."
      en: "For they knew him to be prince of the palace, and to have great power: and the fame of his name increased daily, and was spread abroad through all men's mouths."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Itaque percusserunt Judaei inimicos suos plaga magna, et occiderunt eos, reddentes eis quod sibi paraverant facere:"
      en: "So the Jews made a great slaughter of their enemies, and killed them, repaying according to what they had prepared to do to them:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in tantum ut etiam in Susan quingentos viros interficerent, extra decem filios Aman Agagitae hostis Judaeorum: quorum ista sunt nomina:"
      en: "Insomuch that even in Susan they killed five hundred men, besides the ten sons of Aman the Agagite, the enemy of the Jews: whose names are these:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Pharsandatha, et Delphon, et Esphatha,"
      en: "Pharsandatha, and Delphon, and Esphatha,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et Phoratha, et Adalia, et Aridatha,"
      en: "And Phoratha, and Adalia, and Aridatha,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et Phermesta et Arisai, et Aridai, et Jezatha."
      en: "And Phermesta, and Arisai, and Aridai, and Jezatha."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quos cum occidissent, praedas de substantiis eorum tangere noluerunt."
      en: "And when they had slain them, they would not touch the spoils of their goods."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Statimque numerus eorum, qui occisi erant in Susan, ad regem relatus est."
      en: "And presently the number of them that were killed in Susan was brought to the king."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Qui dixit reginae: In urbe Susan interfecerunt Judaei quingentos viros, et alios decem filios Aman: quantam putas eos exercere caedem in universis provinciis? quid ultra postulas, et quid vis ut fieri jubeam?"
      en: "And he said to the queen: The Jews have killed five hundred men in the city of Susan, besides the ten sons of Aman: how many dost thou think they have slain in all the provinces? What askest thou more, and what wilt thou have me to command to be done?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Cui illa respondit: Si regi placet, detur potestas Judaeis, ut sicut fecerunt hodie in Susan, sic et cras faciant, et decem filii Aman in patibulis suspendantur."
      en: "And she answered: If it please the king, let it be granted to the Jews, to do tomorrow in Susan as they have done today, and that the ten sons of Aman may be hanged upon gibbets."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Praecepitque rex ut ita fieret. Statimque in Susan pependit edictum, et decem filii Aman suspensi sunt."
      en: "And the king commanded that it should be so done. And forthwith the edict was hung up in Susan, and the ten sons of Aman were hanged."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Congregatis Judaeis quartadecima die mensis Adar, interfecti sunt in Susan trecenti viri: nec eorum ab illis direpta substantia est."
      en: "And on the fourteenth day of the month Adar the Jews gathered themselves together, and they killed in Susan three hundred men: but they took not their substance."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sed et per omnes provincias, quae ditioni regis subjacebant, pro animabus suis steterunt Judaei, interfectis hostibus ac persecutoribus suis: in tantum ut septuaginta quinque millia occisorum implerentur, et nullus de substantiis eorum quidquam contingeret."
      en: "Moreover through all the provinces which were subject to the king's dominion the Jews stood for their lives, and slew their enemies and persecutors: insomuch that the number of them that were killed amounted to seventy-five thousand, and no man took any of their goods."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dies autem tertiusdecimus mensis Adar primus apud omnes interfectionis fuit, et quartadecima die caedere desierunt. Quem constituerunt esse solemnem, ut in eo omni tempore deinceps vacarent epulis, gaudio atque conviviis."
      en: "Now the thirteenth day of the month Adar was the first day with them all of the slaughter, and on the fourteenth day they left off. Which they ordained to be kept holy day, so that all times hereafter they should celebrate it with feasting, joy, and banquets."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "At hi, qui in urbe Susan caedem exercuerant, tertiodecimo et quartodecimo die ejusdem mensis in caede versati sunt: quintodecimo autem die percutere desierunt. Et idcirco eumdem diem constituerunt solemnem epularum atque laetitiae."
      en: "But they that were killing in the city of Susan, were employed in the slaughter on the thirteenth and fourteenth day of the same month: and on the fifteenth day they rested. And therefore they appointed that day to be a holy day of feasting and gladness."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Hi vero Judaei, qui in oppidis non muratis ac villis morabantur, quartumdecimum diem mensis Adar conviviorum et gaudii decreverunt, ita ut exultent in eo, et mittant sibi mutuo partes epularum et ciborum."
      en: "But those Jews that dwelt in towns not walled and in villages, appointed the fourteenth day of the month Adar for banquets and gladness, so as to rejoice on that day, and send one another portions of their banquets and meats."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Scripsit itaque Mardochaeus omnia haec, et litteris comprehensa misit ad Judaeos, qui in omnibus regis provinciis morabantur, tam in vicino positis, quam procul,"
      en: "And Mardochai wrote all these things, and sent them comprised in letters to the Jews that abode in all the king's provinces, both those that lay near and those afar off,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ut quartamdecimam et quintamdecimam diem mensis Adar pro festis susciperent, et revertente semper anno solemni celebrarent honore:"
      en: "That they should receive the fourteenth and fifteenth day of the month Adar for holy days, and always at the return of the year should celebrate them with solemn honour:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quia in ipsis diebus se ulti sunt Judaei de inimicis suis, et luctus atque tristitia in hilaritatem gaudiumque conversa sunt, essentque dies isti epularum atque laetitiae, et mitterent sibi invicem ciborum partes, et pauperibus munuscula largirentur."
      en: "Because on those days the Jews revenged themselves of their enemies, and their mourning and sorrow were turned into mirth and joy, and that these should be days of feasting and gladness, in which they should send one to another portions of meats; and should give gifts to the poor."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Susceperuntque Judaei in solemnem ritum cuncta quae eo tempore facere coeperant, et quae Mardochaeus litteris facienda mandaverat."
      en: "And the Jews undertook to observe with solemnity all they had begun to do at that time, which Mardochai by letters had commanded to be done."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Aman enim, filius Amadathi stirpis Agag, hostis et adversarius Judaeorum, cogitavit contra eos malum, ut occideret illos, atque deleret: et misit phur, quod nostra lingua vertitur in sortem."
      en: "For Aman, the son of Amadathi of the race of Agag, the enemy and adversary of the Jews, had devised evil against them, to kill them and destroy them: and had cast Phur, that is, the lot."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et postea ingressa est Esther ad regem, obsecrans ut conatus ejus, litteris regis irriti fierent: et malum, quod contra Judaeos cogitaverat, reverteretur in caput ejus. Denique et ipsum et filios ejus affixerunt cruci,"
      en: "And afterwards Esther went in to the king, beseeching him that his endeavours might be made void by the king's letters: and the evil that he had intended against the Jews, might return upon his own head. And so both he and his sons were hanged upon gibbets."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "atque ex illo tempore dies isti appellati sunt phurim, id est sortium: eo quod phur, id est sors, in urnam missa fuerit. Et cuncta, quae gesta sunt, epistolae, id est libri hujus volumine continentur:"
      en: "And since that time these days are called Phurim, that is, of lots: because Phur, that is, the lot, was cast into the urn. And all things that were done, are contained in the volume of this epistle, that is, of this book:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "quaeque sustinuerunt, et quae deinceps immutata sunt, susceperunt Judaei super se et semen suum, et super cunctos, qui religioni eorum voluerunt copulari, ut nulli liceat duos hos dies absque solemnitate transigere: quos scriptura testatur, et certa expetunt tempora, annis sibi jugiter succedentibus."
      en: "And the things that they suffered, and that were afterwards changed, the Jews took upon themselves and their seed, and upon all that had a mind to be joined to their religion, so that it should be lawful for none to pass these days without solemnity: which the writing testifieth, and certain times require, as the years continually succeed one another."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Isti sunt dies, quos nulla umquam delebit oblivio: et per singulas generationes cunctae in toto orbe provinciae celebrabunt: nec est ulla civitas, in qua dies phurim, id est sortium, non observentur a Judaeis, et ab eorum progenie, quae his caeremoniis obligata est."
      en: "These are the days which shall never be forgot: and which all provinces in the whole world shall celebrate throughout all generations: neither is there any city wherein the days of Phurim, that is, of lots, must not be observed by the Jews, and by their posterity, which is bound to these ceremonies."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Scripseruntque Esther regina filia Abihail, et Mardochaeus Judaeus etiam secundam epistolam, ut omni studio dies ista solemnis sanciretur in posterum:"
      en: "And Esther the queen, the daughter of Abihail, and Mardochai the Jew, wrote also a second epistle, that with all diligence this day should be established a festival for the time to come."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et miserunt ad omnes Judaeos, qui in centum viginti septem provinciis regis Assueri versabantur, ut haberent pacem, et susciperent veritatem,"
      en: "And they sent to all the Jews that were in the hundred and twenty-seven provinces of king Assuerus, that they should have peace, and receive truth,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "observantes dies sortium, et suo tempore cum gaudio celebrarent: sicut constituerant Mardochaeus et Esther, et illi observanda susceperunt a se, et a semine suo, jejunia, et clamores, et sortium dies,"
      en: "And observe the days of lots, and celebrate them with joy in their proper time: as Mardochai and Esther had appointed, and they undertook them to be observed by themselves and by their seed, fasts, and cries, and the days of lots,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et omnia, quae libri hujus, qui vocatur Esther, historia continentur."
      en: "And all things which are contained in the history of this book, which is called Esther."
    status: { la: verified, en: verified }
