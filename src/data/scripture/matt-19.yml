# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: matt
chapter: 19
verses:
  - n: 1
    text:
      la: "et factum est cum consummasset Iesus sermones istos migravit a Galilaea et venit in fines Iudaeae trans Iordanen"
      en: "And it came to pass when Jesus had ended these words, he departed from Galilee, and came into the coasts of Judea, beyond Jordan."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et secutae sunt eum turbae multae et curavit eos ibi"
      en: "And great multitudes followed him: and he healed them there."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et accesserunt ad eum Pharisaei temptantes eum et dicentes si licet homini dimittere uxorem suam quacumque ex causa"
      en: "And there came to him the Pharisees tempting him, and saying: Is it lawful for a man to put away his wife for every cause?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui respondens ait eis non legistis quia qui fecit ab initio masculum et feminam fecit eos"
      en: "Who answering, said to them: Have ye not read, that he who made man from the beginning, Made them male and female? And he said:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et dixit propter hoc dimittet homo patrem et matrem et adherebit uxori suae et erunt duo in carne una"
      en: "For this cause shall a man leave father and mother, and shall cleave to his wife, and they two shall be in one flesh."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "itaque iam non sunt duo sed una caro quod ergo Deus coniunxit homo non separet"
      en: "Therefore now they are not two, but one flesh. What therefore God hath joined together, let no man put asunder."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dicunt illi quid ergo Moses mandavit dari libellum repudii et dimittere"
      en: "They say to him: Why then did Moses command to give a bill of divorce, and to put away?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ait illis quoniam Moses ad duritiam cordis vestri permisit vobis dimittere uxores vestras ab initio autem non sic fuit"
      en: "He saith to them: Because Moses by reason of the hardness of your heart permitted you to put away your wives: but from the beginning it was not so."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dico autem vobis quia quicumque dimiserit uxorem suam nisi ob fornicationem et aliam duxerit moechatur et qui dimissam duxerit moechatur"
      en: "And I say to you, that whosoever shall put away his wife, except it be for fornication, and shall marry another, committeth adultery: and he that shall marry her that is put away, committeth adultery."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dicunt ei discipuli eius si ita est causa homini cum uxore non expedit nubere"
      en: "His disciples say unto him: If the case of a man with his wife be so, it is not expedient to marry."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "qui dixit non omnes capiunt verbum istud sed quibus datum est"
      en: "Who said to them: All men take not this word, but they to whom it is given."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "sunt enim eunuchi qui de matris utero sic nati sunt et sunt eunuchi qui facti sunt ab hominibus et sunt eunuchi qui se ipsos castraverunt propter regnum caelorum qui potest capere capiat"
      en: "For there are eunuchs, who were born so from their mother's womb: and there are eunuchs, who were made so by men: and there are eunuchs, who have made themselves eunuchs for the kingdom of heaven. He that can take, let him take it."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "tunc oblati sunt ei parvuli ut manus eis inponeret et oraret discipuli autem increpabant eis"
      en: "Then were little children presented to him, that he should impose hands upon them and pray. And the disciples rebuked them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Iesus vero ait eis sinite parvulos et nolite eos prohibere ad me venire talium est enim regnum caelorum"
      en: "But Jesus said to them: Suffer the little children, and forbid them not to come to me: for the kingdom of heaven is for such."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et cum inposuisset eis manus abiit inde"
      en: "And when he had imposed hands upon them, he departed from thence."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et ecce unus accedens ait illi magister bone quid boni faciam ut habeam vitam aeternam"
      en: "And behold one came and said to him: Good master, what good shall I do that I may have life everlasting?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qui dixit ei quid me interrogas de bono unus est bonus Deus si autem vis ad vitam ingredi serva mandata"
      en: "Who said to him: Why asketh thou me concerning good? One is good, God. But if thou wilt enter into life, keep the commandments."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dicit illi quae Iesus autem dixit non homicidium facies non adulterabis non facies furtum non falsum testimonium dices"
      en: "He said to him: Which? And Jesus said: Thou shalt do no murder, Thou shalt not commit adultery, Thou shalt not steal, Thou shalt not bear false witness."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "honora patrem et matrem et diliges proximum tuum sicut te ipsum"
      en: "Honour thy father and thy mother: and, Thou shalt love thy neighbor as thyself."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dicit illi adulescens omnia haec custodivi quid adhuc mihi deest"
      en: "The young man saith to him: All these I have kept from my youth, what is yet wanting to me?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ait illi Iesus si vis perfectus esse vade vende quae habes et da pauperibus et habebis thesaurum in caelo et veni sequere me"
      en: "Jesus saith to him: If thou wilt be perfect, go sell what thou hast, and give to the poor, and thou shalt have treasure in heaven: and come follow me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "cum audisset autem adulescens verbum abiit tristis erat enim habens multas possessiones"
      en: "And when the young man had heard this word, he went away sad: for he had great possessions."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Iesus autem dixit discipulis suis amen dico vobis quia dives difficile intrabit in regnum caelorum"
      en: "Then Jesus said to his disciples: Amen, I say to you, that a rich man shall hardly enter into the kingdom of heaven."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et iterum dico vobis facilius est camelum per foramen acus transire quam divitem intrare in regnum caelorum"
      en: "And again I say to you: It is easier for a camel to pass through the eye of a needle, than for a rich man to enter into the kingdom of heaven."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "auditis autem his discipuli mirabantur valde dicentes quis ergo poterit salvus esse"
      en: "And when they had heard this, the disciples wondered very much, saying: Who then can be saved?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "aspiciens autem Iesus dixit illis apud homines hoc inpossibile est apud Deum autem omnia possibilia sunt"
      en: "And Jesus beholding, said to them: With men this is impossible: but with God all things are possible."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "tunc respondens Petrus dixit ei ecce nos reliquimus omnia et secuti sumus te quid ergo erit nobis"
      en: "Then Peter answering, said to him: Behold we have left all things, and have followed thee: what therefore shall we have?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Iesus autem dixit illis amen dico vobis quod vos qui secuti estis me in regeneratione cum sederit Filius hominis in sede maiestatis suae sedebitis et vos super sedes duodecim iudicantes duodecim tribus Israhel"
      en: "And Jesus said to them: Amen, I say to you, that you, who have followed me, in the regeneration, when the Son of man shall sit on the seat of his majesty, you also shall sit on twelve seats judging the twelve tribes of Israel."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et omnis qui reliquit domum vel fratres aut sorores aut patrem aut matrem aut uxorem aut filios aut agros propter nomen meum centuplum accipiet et vitam aeternam possidebit"
      en: "And every one that hath left house, or brethren, or sisters, or father, or mother, or wife, or children, or lands for my name's sake, shall receive an hundredfold, and shall possess life everlasting."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "multi autem erunt primi novissimi et novissimi primi"
      en: "And many that are first, shall be last: and the last shall be first."
    status: { la: verified, en: verified }
