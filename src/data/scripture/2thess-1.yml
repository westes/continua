# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2thess
chapter: 1
verses:
  - n: 1
    text:
      la: "Paulus, et Sylvanus, et Timotheus, ecclesiae Thessalonicensium in Deo Patre nostro, et Domino Jesu Christo."
      en: "Paul, and Sylvanus, and Timothy, to the church of the Thessalonians in God our Father, and the Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Gratia vobis, et pax a Deo Patre nostro, et Domino Jesu Christo."
      en: "Grace unto you, and peace from God our Father, and from the Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Gratias agere debemus semper Deo pro vobis, fratres, ita ut dignum est, quoniam supercrescit fides vestra, et abundat caritas uniuscujusque vestrum in invicem:"
      en: "We are bound to give thanks always to God for you, brethren, as it is fitting, because your faith groweth exceedingly, and the charity of every one of you towards each other, aboundeth:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ita ut et nos ipsi in vobis gloriemur in ecclesiis Dei, pro patientia vestra, et fide, et in omnibus persecutionibus vestris, et tribulationibus, quas sustinetis"
      en: "So that we ourselves also glory in you in the churches of God, for your patience and faith, and in all your persecutions and tribulations, which you endure,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "in exemplum justi judicii Dei, ut digni habeamini in regno Dei, pro quo et patimini."
      en: "For an example of the just judgment of God, that you may be counted worthy of the kingdom of God, for which also you suffer."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Si tamen justum est apud Deum retribuere tribulationem iis qui vos tribulant:"
      en: "Seeing it is a just thing with God to repay tribulation to them that trouble you:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et vobis, qui tribulamini, requiem nobiscum in revelatione Domini Jesu de caelo cum angelis virtutis ejus,"
      en: "And to you who are troubled, rest with us when the Lord Jesus shall be revealed from heaven, with the angels of his power:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "in flamma ignis dantis vindictam iis qui non noverunt Deum, et qui non obediunt Evangelio Domini nostri Jesu Christi,"
      en: "In a flame of fire, giving vengeance to them who know not God, and who obey not the gospel of our Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "qui poenas dabunt in interitu aeternas a facie Domini, et a gloria virtutis ejus:"
      en: "Who shall suffer eternal punishment in destruction, from the face of the Lord, and from the glory of his power:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cum venerit glorificari in sanctis suis, et admirabilis fieri in omnibus, qui crediderunt, quia creditum est testimonium nostrum super vos in die illo."
      en: "When he shall come to be glorified in his saints, and to be made wonderful in all them who have believed; because our testimony was believed upon you in that day."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "In quo etiam oramus semper pro vobis: ut dignetur vos vocatione sua Deus noster, et impleat omnem voluntatem bonitatis, et opus fidei in virtute,"
      en: "Wherefore also we pray always for you; that our God would make you worthy of his vocation, and fulfill all the good pleasure of his goodness and the work of faith in power;"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ut clarificetur nomen Domini nostri Jesu Christi in vobis, et vos in illo secundum gratiam Dei nostri, et Domini Jesu Christi."
      en: "That the name of our Lord Jesus may be glorified in you, and you in him, according to the grace of our God, and of the Lord Jesus Christ."
    status: { la: verified, en: verified }
