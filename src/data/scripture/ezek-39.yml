# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 39
verses:
  - n: 1
    text:
      la: "Tu autem, fili hominis, vaticinare adversum Gog, et dices: Haec dicit Dominus Deus: Ecce ego super te, Gog, principem capitis Mosoch et Thubal."
      en: "And thou, son of man, prophesy against Gog, and say: Thus saith the Lord God: Behold, I come against thee, O Gog, the chief prince of Mosoch and Thubal."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et circumagam te, et educam te, et ascendere te faciam de lateribus aquilonis, et adducam te super montes Israel."
      en: "And I will turn thee round, and I will lead thee out, and will make thee go up from the northern parts: and will bring thee upon the mountains of Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et percutiam arcum tuum in manu sinistra tua, et sagittas tuas de manu dextera tua dejiciam."
      en: "And I will break thy bow in thy left hand, and I will cause thy arrows to fall out of thy right hand."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Super montes Israel cades tu, et omnia agmina tua, et populi tui qui sunt tecum: feris, avibus, omnique volatili et bestiis terrae dedi te ad devorandum."
      en: "Thou shalt fall upon the mountains of Israel, thou and all thy bands, and thy nations that are with thee: I have given thee to the wild beasts, to the birds, and to every fowl, and to the beasts of the earth to be devoured."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Super faciem agri cades, quia ego locutus sum, ait Dominus Deus."
      en: "Thou shalt fall upon the face of the field: for I have spoken it, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et immittam ignem in Magog, et in his qui habitant in insulis confidenter: et scient quia ego Dominus."
      en: "And I will send a fire on Magog, and on them that dwell confidently in the islands: and they shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et nomen sanctum meum notum faciam in medio populi mei Israel, et non polluam nomen sanctum meum amplius: et scient gentes quia ego Dominus, Sanctus Israel."
      en: "And I will make my holy name known in the midst of my people Israel, and my holy name shall be profaned no more: and the Gentiles shall know that I am the Lord, the Holy One of Israel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ecce venit, et factum est, ait Dominus Deus: haec est dies de qua locutus sum."
      en: "Behold it cometh, and it is done, saith the Lord God: this is the day whereof I have spoken."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et egredientur habitatores de civitatibus Israel, et succendent et comburent arma, clypeum et hastas, arcum et sagittas, et baculos manuum et contos: et succendent ea igni septem annis."
      en: "And the inhabitants shall go forth of the cities of Israel, and shall set on fire and burn the weapons, the shields, and the spears, the bows and the arrows, and the handstaves and the pikes: and they shall burn them with fire seven years."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et non portabunt ligna de regionibus, neque succident de saltibus, quoniam arma succendent igni, et depraedabuntur eos quibus praedae fuerant, et diripient vastatores suos, ait Dominus Deus."
      en: "And they shall not bring wood out of the countries, nor cut down out of the forests: for they shall burn the weapons with fire, and shall make a prey of them to whom they had been a prey, and they shall rob those that robbed them, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et erit in die illa: dabo Gog locum nominatum sepulchrum in Israel, vallem viatorum ad orientem maris, quae obstupescere faciet praetereuntes: et sepelient ibi Gog, et omnem multitudinem ejus, et vocabitur vallis multitudinis Gog."
      en: "And it shall come to pass in that day, that I will give Gog a noted place for a sepulchre in Israel: the valley of the passengers on the east of the sea, which shall cause astonishment in them that pass by: and there shall they bury Gog, and all his multitude, and it shall be called the valley of the multitude of Gog."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et sepelient eos domus Israel, ut mundent terram septem mensibus."
      en: "And the house of Israel shall bury them for seven months to cleanse the land."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sepeliet autem eum omnis populus terrae: et erit eis nominata dies in qua glorificatus sum, ait Dominus Deus."
      en: "And all the people of the land shall bury him, and it shall be unto them a noted day, wherein I was glorified, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et viros jugiter constituent lustrantes terram, qui sepeliant et requirant eos qui remanserant super faciem terrae, ut emundent eam: post menses autem septem quaerere incipient."
      en: "And they shall appoint men to go continually about the land, to bury and to seek out them that were remaining upon the face of the earth, that they may cleanse it: and after seven months they shall begin to seek."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et circuibunt peragrantes terram: cumque viderint os hominis, statuent juxta illud titulum, donec sepeliant illud pollinctores in valle multitudinis Gog."
      en: "And they shall go about passing through the land: and when they shall see the bone of a man, they shall set up a sign by it, till the buriers bury it in the valley of the multitude of Gog."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nomen autem civitatis Amona, et mundabunt terram."
      en: "And the name of the city shall be Amona, and they shall cleanse the land."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Tu ergo, fili hominis, haec dicit Dominus Deus: Dic omni volucri, et universis avibus, cunctisque bestiis agri: Convenite, properate, concurrite undique ad victimam meam, quam ego immolo vobis, victimam grandem super montes Israel, ut comedatis carnem, et bibatis sanguinem."
      en: "And thou, O son of man, saith the Lord God, say to every fowl, and to all the birds, and to all the beasts of the field: Assemble yourselves, make haste, come together from every side to my victim, which I slay for you, a great victim upon the mountains of Israel: to eat flesh, and drink blood."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Carnes fortium comedetis, et sanguinem principum terrae bibetis, arietum, et agnorum, et hircorum, taurorumque et altilium, et pinguium omnium."
      en: "You shall eat the flesh of the mighty, and you shall drink the blood of the princes of the earth, of rams, and of lambs, and of he goats, and bullocks, and of all that are well fed and fat."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et comedetis adipem in saturitatem, et bibetis sanguinem in ebrietatem, de victima quam ego immolabo vobis:"
      en: "And you shall eat the fat till you be full, and shall drink blood till you be drunk of the victim which I shall slay for you."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et saturabimini super mensam meam de equo, et equite forti, et de universis viris bellatoribus, ait Dominus Deus."
      en: "And you shall be filled at my table with horses, and mighty horsemen, and all the men of war, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et ponam gloriam meam in gentibus: et videbunt omnes gentes judicium meum quod fecerim, et manum meam quam posuerim super eos."
      en: "And I will set my glory among the nations: and all nations shall see my judgment that I have executed, and my hand that I have laid upon them."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et scient domus Israel quia ego Dominus Deus eorum, a die illa et deinceps."
      en: "And the house of Israel shall know that I am the Lord their God from that day and forward."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et scient gentes quoniam in iniquitate sua capta sit domus Israel, eo quod dereliquerint me, et absconderim faciem meam ab eos, et tradiderim eos in manus hostium, et ceciderint in gladio universi."
      en: "And the nations shall know that the house of Israel were made captives for their iniquity, because they forsook me, and I hid my face from them: and I delivered them into the hands of their enemies, and they fell all by the sword."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Juxta immunditiam eorum et scelus feci eis, et abscondi faciem meam ab illis."
      en: "I have dealt with them according to their uncleanness, and wickedness, and hid my face from them."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Propterea haec dicit Dominus Deus: Nunc reducam captivitatem Jacob, et miserebor omnis domus Israel, et assumam zelum pro nomine sancto meo."
      en: "Therefore, thus saith the Lord God: Now will I bring back the captivity of Jacob, and will have mercy on all the house of Israel: and I will be jealous for my holy name."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et portabunt confusionem suam, et omnem praevaricationem qua praevaricati sunt in me, cum habitaverint in terra sua confidenter, neminem formidantes:"
      en: "And they shall bear their confusion, and all the transgressions wherewith they have transgressed against me, when they shall dwell in their land securely fearing no man:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et reduxero eos de populis, et congregavero de terris inimicorum suorum, et sanctificatus fuero in eis, in oculis gentium plurimarum."
      en: "And I shall have brought them back from among the nations, and shall have gathered them together out of the lands of their enemies, and shall be sanctified in them, in the sight of many nations."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et scient quia ego Dominus Deus eorum, eo quod transtulerim eos in nationes, et congregaverim eos super terram suam, et non dereliquerim quemquam ex eis ibi."
      en: "And they shall know that I am the Lord their God, because I caused them to be carried away among the nations; and I have gathered them together unto their own land, and have not left any of them there."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et non abscondam ultra faciem meam ab eis, eo quod effuderim spiritum meum super omnem domum Israel, ait Dominus Deus."
      en: "And I will hide my face no more from them, for I have poured out my spirit upon all the house of Israel, saith the Lord God."
    status: { la: verified, en: verified }
