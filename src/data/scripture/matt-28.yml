# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: matt
chapter: 28
verses:
  - n: 1
    text:
      la: "vespere autem sabbati quae lucescit in primam sabbati venit Maria Magdalene et altera Maria videre sepulchrum"
      en: "And in the end of the sabbath, when it began to dawn towards the first day of the week, came Mary Magdalen and the other Mary, to see the sepulchre."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ecce terraemotus factus est magnus angelus enim Domini descendit de caelo et accedens revolvit lapidem et sedebat super eum"
      en: "And behold there was a great earthquake. For an angel of the Lord descended from heaven, and coming, rolled back the stone, and sat upon it."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "erat autem aspectus eius sicut fulgur et vestimentum eius sicut nix"
      en: "And his countenance was as lightning, and his raiment as snow."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "prae timore autem eius exterriti sunt custodes et facti sunt velut mortui"
      en: "And for fear of him, the guards were struck with terror, and became as dead men."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "respondens autem angelus dixit mulieribus nolite timere vos scio enim quod Iesum qui crucifixus est quaeritis"
      en: "And the angel answering, said to the women: Fear not you; for I know that you seek Jesus who was crucified."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "non est hic surrexit enim sicut dixit venite videte locum ubi positus erat Dominus"
      en: "He is not here, for he is risen, as he said. Come, and see the place where the Lord was laid."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et cito euntes dicite discipulis eius quia surrexit et ecce praecedit vos in Galilaeam ibi eum videbitis ecce praedixi vobis"
      en: "And going quickly, tell ye his disciples that he is risen: and behold he will go before you into Galilee; there you shall see him. Lo, I have foretold it to you."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et exierunt cito de monumento cum timore et magno gaudio currentes nuntiare discipulis eius"
      en: "And they went out quickly from the sepulchre with fear and great joy, running to tell his disciples."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et ecce Iesus occurrit illis dicens havete illae autem accesserunt et tenuerunt pedes eius et adoraverunt eum"
      en: "And behold Jesus met them, saying: All hail. But they came up and took hold of his feet, and adored him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "tunc ait illis Iesus nolite timere ite nuntiate fratribus meis ut eant in Galilaeam ibi me videbunt"
      en: "Then Jesus said to them: Fear not. Go, tell my brethren that they go into Galilee, there they shall see me."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quae cum abissent ecce quidam de custodibus venerunt in civitatem et nuntiaverunt principibus sacerdotum omnia quae facta fuerant"
      en: "Who when they were departed, behold some of the guards came into the city, and told the chief priests all things that had been done."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et congregati cum senioribus consilio accepto pecuniam copiosam dederunt militibus"
      en: "And they being assembled together with the ancients, taking counsel, gave a great sum of money to the soldiers,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dicentes dicite quia discipuli eius nocte venerunt et furati sunt eum nobis dormientibus"
      en: "Saying: Say you, His disciples came by night, and stole him away when we were asleep."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et si hoc auditum fuerit a praeside nos suadebimus ei et securos vos faciemus"
      en: "And if the governor shall hear this, we will persuade him, and secure you."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "at illi accepta pecunia fecerunt sicut erant docti et divulgatum est verbum istud apud Iudaeos usque in hodiernum diem"
      en: "So they taking the money, did as they were taught: and this word was spread abroad among the Jews even unto this day."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "undecim autem discipuli abierunt in Galilaeam in montem ubi constituerat illis Iesus"
      en: "And the eleven disciples went into Galilee, unto the mountain where Jesus had appointed them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et videntes eum adoraverunt quidam autem dubitaverunt"
      en: "And seeing them they adored: but some doubted."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et accedens Iesus locutus est eis dicens data est mihi omnis potestas in caelo et in terra"
      en: "And Jesus coming, spoke to them, saying: All power is given to me in heaven and in earth."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "euntes ergo docete omnes gentes baptizantes eos in nomine Patris et Filii et Spiritus Sancti"
      en: "Going therefore, teach ye all nations; baptizing them in the name of the Father, and of the Son, and of the Holy Ghost."
    status: { la: verified, en: verified }
