# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 13
verses:
  - n: 1
    text:
      la: "haec dicit Dominus ad me vade et posside tibi lumbare lineum et pones illud super lumbos tuos et in aquam non inferes illud"
      en: "Thus saith the Lord to me: Go, and get thee a linen girdle, and thou shalt put it about thy loins, and shalt not put it into water."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et possedi lumbare iuxta verbum Domini et posui circa lumbos meos"
      en: "And I got a girdle accoding to the word of the Lord, and put it about my loins."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et factus est sermo Domini ad me secundo dicens"
      en: "And the word of the Lord came to me the second time, saying:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "tolle lumbare quod possedisti quod est circa lumbos tuos et surgens vade ad Eufraten et absconde illud ibi in foramine petrae"
      en: "Take the girdle which thou hast got, which is about thy loins, and arise, and go to the Euphrates, and hide it there in a hole of the rock."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et abii et abscondi illud in Eufraten sicut praeceperat mihi Dominus"
      en: "And I went, and hid it by the Euphrates, as the Lord had commanded me."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et factum est post dies plurimos dixit Dominus ad me surge vade ad Eufraten et tolle inde lumbare quod praecepi tibi ut absconderes illud ibi"
      en: "And it came to pass after many days, that the Lord said to me: Arise, go to the Euphrates, and take from thence the girdle, which I commanded thee to hide there."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et abii ad Eufraten et fodi et tuli lumbare de loco ubi absconderam illud et ecce conputruerat lumbare ita ut nullo usui aptum esset"
      en: "And I went to the Euphrates, and digged, and took the girdle out of the place where I had hid it: and behold the girdle was rotten, so that it was fit for no use."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et factum est verbum Domini ad me dicens"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "haec dicit Dominus sic putrescere faciam superbiam Iuda et superbiam Hierusalem multam"
      en: "Thus saith the Lord: after this manner will I make the pride of Juda, and the great pride of Jerusalem to rot."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "populum istum pessimum qui nolunt audire verba mea et ambulant in pravitate cordis sui abieruntque post deos alienos ut servirent eis et adorarent eos et erunt sicut lumbare istud quod nullo usui aptum est"
      en: "This wicked people, that will not hear my words, and that walk in the perverseness of their heart, and have gone after strange gods to serve them, and to adore them: and they shall be as this girdle which is fit for no use."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sicut enim adheret lumbare ad lumbos viri sic adglutinavi mihi omnem domum Israhel et omnem domum Iuda dicit Dominus ut esset mihi in populum et in nomen et in laudem et in gloriam et non audierunt"
      en: "For as the girdle sticketh close to the loins of a man, so have I brought close to me all of the house of Israel, and all the house of Juda, saith the Lord: that they might be my people, and for a name, and for a praise, and for a glory: but they would not hear."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dices ergo ad eos sermonem istum haec dicit Dominus Deus Israhel omnis laguncula implebitur vino et dicent ad te numquid ignoramus quia omnis laguncula implebitur vino"
      en: "Thou shalt speak therefore to them this word: Thus saith the Lord God of Israel: Every bottle shall be filled with wine, and they shall say to thee: Do we not know that every bottle shall be filled with wine?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et dices ad eos haec dicit Dominus ecce ego implebo omnes habitatores terrae huius et reges qui sedent de stirpe David super thronum eius et sacerdotes et prophetas et omnes habitatores Hierusalem ebrietate"
      en: "And thou shalt say to them: Thus saith the Lord: Behold I will fill all the inhabitants of this land, and the kings of the race of David that sit upon his throne, and the priests, and the prophets, and all the inhabitants of Jerusalem. with drunkenness."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et dispergam eos virum a fratre suo et patres et filios pariter ait Dominus non parcam et non concedam neque miserebor ut non disperdam eos"
      en: "And I will scatter them every man from his brother, and fathers and sons in like manner, saith the Lord: I will not spare, and I will not pardon: nor will I have mercy, but to destroy them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "audite et auribus percipite nolite elevari quia Dominus locutus est"
      en: "Hear ye, and give ear: Be not proud, for the Lord hath spoken."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "date Domino Deo vestro gloriam antequam contenebrescat et antequam offendant pedes vestri ad montes caligosos expectabitis lucem et ponet eam in umbram mortis et in caliginem"
      en: "Give ye glory to the Lord your God, before it be dark, and before your feet stumble upon the dark mountains: you shall look for light, and he will turn it into the shadow of death, and into darkness."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quod si hoc non audieritis in abscondito plorabit anima mea a facie superbiae plorans plorabit et deducet oculus meus lacrimam quia captus est grex Domini"
      en: "But if you will not hear this, my soul shall weep in secret for your pride: weeping it shall weep, and my eyes shall run down the tears, because the flock of the Lord is carried away captive."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dic regi et dominatrici humiliamini sedete quoniam descendit de capite vestro corona gloriae vestrae"
      en: "Say to the king, and to the queen: Humble yourselves, sit down: for the crown of your glory is come down from your head."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "civitates austri clausae sunt et non est qui aperiat translata est omnis Iudaea transmigratione perfecta"
      en: "The cities of the south are shut up, and there is none to open them: all Juda is carried away captive with an entire captivity."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "levate oculos vestros et videte qui venitis ab aquilone ubi est grex qui datus est tibi pecus inclitum tuum"
      en: "Lift up your eyes, and see, you that come from the north: where is the flock that is given thee, thy beautiful cattle?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quid dices cum visitaverit te tu enim docuisti eos adversum te et erudisti in caput tuum numquid non dolores adprehendent te quasi mulierem parturientem"
      en: "What wilt thou say when he shall visit thee? for thou hast taught them against thee, and instructed them against thy own head: shall not sorrows lay hold on thee, as a woman in labour?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quod si dixeris in corde tuo quare venerunt mihi haec propter multitudinem iniquitatis tuae revelata sunt verecundiora tua pollutae sunt plantae tuae"
      en: "And if thou shalt say in thy heart: Why are these things come upon me? For the greatness of thy iniquity, thy nakedness is discovered, the soles of thy feet are defiled."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "si mutare potest Aethiops pellem suam aut pardus varietates suas et vos poteritis bene facere cum didiceritis malum"
      en: "If the Ethiopian can change his skin, or the leopard his spots: you may also do well, when you have learned evil."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et disseminabo eos quasi stipulam quae vento raptatur in deserto"
      en: "And I will scatter them as stubble, which is carried away by the wind in the desert."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "haec sors tua parsque mensurae tuae a me dicit Dominus quia oblita es mei et confisa es in mendacio"
      en: "This is thy lot, and the portion of thy measure from me, saith the Lord, because thou hast forgotten me, and hast trusted in falsehood."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "unde et ego nudavi femora tua contra faciem tuam et apparuit ignominia tua"
      en: "Wherefore I have also bared my thighs against thy face, and thy shame hath appeared."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "adulteria tua et hinnitus tuus scelus fornicationis tuae super colles in agro vidi abominationes tuas vae tibi Hierusalem non mundaberis post me usquequo adhuc"
      en: "I have seen thy adulteries, and thy neighing, the wickedness of thy fornication: and thy abominations, upon the hills in the field. Woe to thee, Jerusalem, wilt thou not be made clean after me: how long yet?"
    status: { la: verified, en: verified }
