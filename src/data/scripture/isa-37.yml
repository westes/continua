# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 37
verses:
  - n: 1
    text:
      la: "et factum est cum audisset rex Ezechias scidit vestimenta sua et obvolutus est sacco et intravit in domum Domini"
      en: "And it came to pass, when king Ezechias had heard it, that he rent his garments and covered himself with sackcloth, and went into the house of the Lord."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et misit Eliachim qui erat super domum et Sobnam scribam et seniores de sacerdotibus opertos saccis ad Isaiam filium Amos prophetam"
      en: "And he sent Eliacim who was over the house, and Sobna the scribe, and the ancients of the priests covered with sackcloth, to Isaias the son of Amos the prophet."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dixerunt ad eum haec dicit Ezechias dies tribulationis et correptionis et blasphemiae dies haec quia venerunt filii usque ad partum et virtus non est parienti"
      en: "And they said to him: Thus saith Ezechias: This day is a day of tribulation, and of rebuke, and of blasphemy: for the children are come to the birth, and there is not strength to bring forth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "si quo modo audiat Dominus Deus tuus verba Rabsaces quem misit rex Assyriorum dominus suus ad blasphemandum Deum viventem et obprobrandum sermonibus quos audivit Dominus Deus tuus leva ergo orationem pro reliquiis quae reppertae sunt"
      en: "It may be the Lord thy God will hear the words of Rabsaces, whom the king of the Assyrians his master hath sent to blaspheme the living God, and to reproach with words which the Lord thy God hath heard: wherefore lift up thy prayer for the remnant that is left."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et venerunt servi regis Ezechiae ad Isaiam"
      en: "And the servants of Ezechias came to Isaias."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et dixit ad eos Isaias haec dicetis domino vestro haec dicit Dominus ne timeas a facie verborum quae audisti quibus blasphemaverunt pueri regis Assyriorum me"
      en: "And Isaias said to them: Thus shall you say to your master: Thus saith the Lord: Be not afraid of the words that thou hast heard, with which the servants of the king of the Assyrians have blasphemed me."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ecce ego dabo ei spiritum et audiet nuntium et revertetur ad terram suam et corruere eum faciam gladio in terra sua"
      en: "Behold, I will send a spirit upon him, and he shall hear a message, and shall return to his own country, and I will cause him to fall by the sword in his own country."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "reversus est autem Rabsaces et invenit regem Assyriorum proeliantem adversus Lobna audierat enim quia profectus esset de Lachis"
      en: "And Rabsaces returned, end found the king of the Assyrians besieging Lobna. W For he had heard that he was departed from Lachis."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et audivit de Tharaca rege Aethiopiae dicentes egressus est ut pugnet contra te quod cum audisset misit nuntios ad Ezechiam dicens"
      en: "And he heard say about Tharaca the king of Ethiopia: He is come forth to fight against thee. And when he heard it, he sent messengers to Ezechias, saying:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "haec dicetis Ezechiae regi Iudae loquentes non te decipiat Deus tuus in quo tu confidis dicens non dabitur Hierusalem in manu regis Assyriorum"
      en: "Thus shall you speak to Ezechias the king of Juda, saying: Let not thy God deceive thee, in whom thou trustest, saying: Jerusalem shall not be given into the hands of the king of the Assyrians."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ecce tu audisti omnia quae fecerunt reges Assyriorum omnibus terris quas subverterunt et tu poteris liberari"
      en: "Behold thou hast heard all that the kings of the Assyrians hare done to all countries which they have destroyed, and canst thou be delivered?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "numquid eruerunt eos dii gentium quos subverterunt patres mei Gozan et Aran et Reseph et filios Eden qui erant in Thalassar"
      en: "Have the gods of the nations delivered them whom my fathers have destroyed, Gozam, and Haram, and Reseph, and the children of Eden, that were in Thalassar?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ubi est rex Emath et rex Arfad et rex urbis Seffarvaim Anahe et Ava"
      en: "Where is the king of Emath, and the king of Arphad, and the king of the city of Sepharvaim, of Ana, and of Ava?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et tulit Ezechias libros de manu nuntiorum et legit eos et ascendit in domum Domini et expandit eos Ezechias coram Domino"
      en: "And Ezechias took the letter from the hand of the messengers, and read it, and went up to the house of the Lord, and Ezechias spread it before the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et oravit Ezechias ad Dominum dicens"
      en: "And Ezechias prayed to the Lord, saying:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Domine exercituum Deus Israhel qui sedes super cherubin tu es Deus solus omnium regnorum terrae tu fecisti caelum et terram"
      en: "O Lord of hosts, God of Israel, who sittest upon the cherubims, thou alone art the God of all the kingdoms of the earth, thou hast made heaven and earth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "inclina Domine aurem tuam et audi aperi Domine oculos tuos et vide et audi omnia verba Sennacherib quae misit ad blasphemandum Deum viventem"
      en: "Incline, O Lord, thy ear, and hear: open, O Lord, thy eyes, and see, and hear all the words of Sennacherib, which he hath sent to blaspheme the living God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "vere enim Domine desertas fecerunt reges Assyriorum terras et regiones earum"
      en: "For of a truth, O Lord, the kings of the Assyrians have laid waste lands, and their countries."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et dederunt deos earum igni non enim erant dii sed opera manuum hominum lignum et lapis et comminuerunt eos"
      en: "And they have cast their gods into the fire, for they were not gods, but the works of men's hands, of wood and stone: and they broke them in pieces."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et nunc Domine Deus noster salva nos de manu eius et cognoscant omnia regna terrae quia tu es Dominus solus"
      en: "And now, O Lord our God, save us out of his hand: and let all the kingdoms of the earth know, that thou only art the Lord."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et misit Isaias filius Amos ad Ezechiam dicens haec dicit Dominus Deus Israhel pro quibus rogasti me de Sennacherib rege Assyriorum"
      en: "And Isaias the son of Amos sent to Ezechias, saying: Thus saith the Lord the God of Israel: For the prayer thou hast made to me concerning Sennacherib the king of the Assyrians:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "hoc est verbum quod locutus est Dominus super eum despexit te subsannavit te virgo filia Sion post te caput movit filia Hierusalem"
      en: "This is the word which the Lord hath spoken of him: The virgin the daughter of Sion hath despised thee, and laughed thee to scorn: the daughter of Jerusalem hath wagged the head after thee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "cui exprobrasti et quem blasphemasti et super quem exaltasti vocem et levasti altitudinem oculorum tuorum ad Sanctum Israhel"
      en: "Whom hast thou reproached, and whom hast thou blasphemed, and against whom hast thou exalted thy voice, and lifted up thy eyes on high? Against the Holy One of Israel."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "in manu servorum tuorum exprobrasti Domino et dixisti in multitudine quadrigarum mearum ego ascendi altitudinem montium iuga Libani et succidam excelsa cedrorum eius electas abietes illius et introibo altitudinem summitatis eius saltum Carmeli eius"
      en: "By the hand of thy servants thou hast reproached the Lord: and hast said: With the multitude of my chariots I have gone up to the height of the mountains, to the top of Libanus: and I will out down its tall cedars, and its choice fir trees, end will enter to the top of its height, to the forest of its Carmel."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ego fodi et bibi aquam et exsiccavi vestigio pedis mei omnes rivos aggerum"
      en: "I have digged, and drunk water, and have dried up with the sole of my foot, all the rivers shut up in banks."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "numquid non audisti quae olim fecerim ei ex diebus antiquis ego plasmavi illud et nunc adduxi et factum est in eradicationem collium conpugnantium et civitatum munitarum"
      en: "Hast thou not heard what I have done to him of old? from the days of old I have formed it: and now I have brought it to effect: and it hath come to pass that hills fighting together, and fenced cities should be destroyed."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "habitatores earum breviata manu contremuerunt et confusi sunt facti sunt sicut faenum agri et gramen pascuae et herba tectorum quae exaruit antequam maturesceret"
      en: "The inhabitants of them were weak of hand, they trembled, and were confounded: they became like the grass of the field, and the herb of the pasture, and like the grass of the housetops, which withered before it was ripe."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "habitationem tuam et egressum tuum et introitum tuum cognovi et insaniam tuam contra me"
      en: "I know thy dwelling, and thy going out, and thy coming in, and thy rage against me."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "cum fureres adversum me superbia tua ascendit in aures meas ponam ergo circulum in naribus tuis et frenum in labiis tuis et reducam te in viam per quam venisti"
      en: "When thou wast mad against me, thy pride came up to my ears: therefore I will put a ring in thy nose, and a bit between thy lips, and I will turn thee back by the way by which thou camest."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "tibi autem hoc erit signum comede hoc anno quae sponte nascuntur et in anno secundo pomis vescere in anno autem tertio seminate et metite et plantate vineas et comedite fructum earum"
      en: "But to thee this shall be a sign: Eat this year the things that spring of themselves, and in the second year eat fruits: but in the third year sow and reap, and giant vineyards, and eat the fruit of them."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et mittet id quod salvatum fuerit de domo Iuda et quod reliquum est radicem deorsum et faciet fructum sursum"
      en: "And that which shall be saved of the house of Juda, and which is left, shall take root downward, and shall bear fruit upward :"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quia de Hierusalem exibunt reliquiae et salvatio de monte Sion zelus Domini exercituum faciet istud"
      en: "For out of Jerusalem shall go forth a, remnant, and salvation from mount Sion: the zeal of the Lord of hosts shall do this."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "propterea haec dicit Dominus de rege Assyriorum non introibit civitatem hanc et non iaciet ibi sagittam et non occupabit eam clypeus et non mittet in circuitu eius aggerem"
      en: "Wherefore thus saith the Lord concerning the king of the Assyrians: He shall not come into this city, nor shoot an arrow into it, nor come before it with shield, nor cast a trench about it."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "in via qua venit per eam revertetur et civitatem hanc non ingredietur dicit Dominus"
      en: "By the way that he came, he shall return, and into this city he shall not come, saith the Lord."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et protegam civitatem istam ut salvem eam propter me et propter David servum meum"
      en: "And I will protect this city, and will save it for my own sake, and for the sake of David my servant."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "egressus est autem angelus Domini et percussit in castris Assyriorum centum octoginta quinque milia et surrexerunt mane et ecce omnes cadavera mortuorum"
      en: "And the angel of the Lord went out, and slew in the camp of the Assyrians a hundred and eighty-five thousand. And they arose in the morning, and behold they were all dead corpses."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et egressus est et abiit et reversus est Sennacherib rex Assyriorum et habitavit in Nineve"
      en: "And Sennacherib the king of the Assyrians went out and departed, and returned, and dwelt in Ninive."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et factum est cum adoraret in templo Nesrach deum suum Adramelech et Sarasar filii eius percusserunt eum gladio fugeruntque in terram Ararat et regnavit Asoraddon filius eius pro eo"
      en: "And it came to pass, as he was worshipping in the temple of Nesroch his god, that Adramelech and Sarasar his sons slew him with the sword: and they fled into the land of Ararat, and Asarhaddon his son reigned in his stead."
    status: { la: verified, en: verified }
