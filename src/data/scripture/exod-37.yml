# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 37
verses:
  - n: 1
    text:
      la: "Fecit autem Beseleel et arcam de lignis setim, habentem duos semis cubitos in longitudine, et cubitum ac semissem in latitudine, altitudo quoque unius cubiti fuit et dimidii: vestivitque eam auro purissimo intus ac foris."
      en: "And Beseleel made also the ark of setim wood: it was two cubits and a half in length, and a cubit and a half in breadth, and the height was of one cubit and a half: and he overlaid it with the purest gold within and without."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et fecit illi coronam auream per gyrum,"
      en: "And he made to it a crown of gold round about,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "conflans quatuor annulos aureos per quatuor angulos ejus: duos annulos in latere uno, et duos in altero."
      en: "Casting four rings of gold at the four corners thereof: two rings in one side, and two in the other."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Vectes quoque fecit de lignis setim, quos vestivit auro,"
      en: "And he made bars of setim wood, which he overlaid with gold,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et quos misit in annulos, qui erant in lateribus arcae ad portandum eam."
      en: "And he put them into the rings that were at the sides of the ark to carry it."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Fecit et propitiatorium, id est, oraculum, de auro mundissimo, duorum cubitorum et dimidii in longitudine, et cubiti ac semis in latitudine."
      en: "He made also the propitiatory, that is, the oracle, of the purest gold, two cubits and a half in length, and a cubit and a half in breadth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Duos etiam cherubim ex auro ductili, quos posuit ex utraque parte propitiatorii:"
      en: "Two cherubims also of beaten gold, which he set on the two sides of the propitiatory:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cherub unum in summitate unius partis, et cherub alterum in summitate partis alterius: duos cherubim in singulis summitatibus propitiatorii,"
      en: "One cherub in the top of one side, and the other cherub in the top of the other side: two cherubims at the two ends of the propitiatory,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "extendentes alas, et tegentes propitiatorium, seque mutuo et illud respicientes."
      en: "Spreading their wings, and covering the propitiatory, and looking one towards the other, and towards it."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Fecit et mensam de lignis setim in longitudine duorum cubitorum, et in latitudine unius cubiti, quae habebat in altitudine cubitum ac semissem."
      en: "He made also the table of setim wood, in length two cubits, and in breadth one cubit, and in height it was a cubit and a half."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Circumdeditque eam auro mundissimo, et fecit illi labium aureum per gyrum,"
      en: "And he overlaid it with the finest gold, and he made to it a golden ledge round about."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ipsique labio coronam auream interrasilem quatuor digitorum, et super eamdem, alteram coronam auream."
      en: "And to the ledge itself he made a polished crown of gold, of four fingers' breadth, and upon the same another golden crown."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Fudit et quatuor circulos aureos, quos posuit in quatuor angulis per singulos pedes mensae"
      en: "And he cast four rings of gold, which he put in the four corners at each foot of the table,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "contra coronam: misitque in eos vectes, ut possit mensa portari."
      en: "Over against the crown: and he put the bars into them, that the table might be carried."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ipsos quoque vectes fecit de lignis setim, et circumdedit eos auro."
      en: "And the bars also themselves he made of setim wood, and overlaid them with gold,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et vasa ad diversos usus mensae, acetabula, phialas, et cyathos, et thuribula, ex auro puro, in quibus offerenda sunt libamina."
      en: "And the vessels for the divers uses of the table, dishes, bowls, and cups, and censers of pure gold, wherein the libations are to be offered."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Fecit et candelabrum ductile de auro mundissimo, de cujus vecte calami, scyphi, sphaerulaeque, ac lilia procedebant:"
      en: "He made also the candlestick of beaten work of the finest gold. From the shaft whereof its branches, its cups, and bowls, and lilies came out:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sex in utroque latere, tres calami ex parte una, et tres ex altera:"
      en: "Six on the two sides: three branches on one side, and three on the other."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "tres scyphi in nucis modum per calamos singulos, sphaerulaeque simul et lilia: et tres scyphi instar nucis in calamo altero, sphaerulaeque simul et lilia. Aequum erat opus sex calamorum, qui procedebant de stipite candelabri."
      en: "Three cups in manner of a nut on each branch, and bowls withal and lilies; and three cups of the fashion of a nut in another branch, and bowls withal and lilies. The work of the six branches that went out from the shaft of the candlestick was equal."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "In ipso autem vecte erant quatuor scyphi in nucis modum, sphaerulaeque per singulos simul et lilia:"
      en: "And in the shaft itself were four cups after the manner of a nut, and bowls withal at every one, and lilies:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et sphaerulae sub duobus calamis per loca tria, qui simul sex fiunt calami procedentes de vecte uno."
      en: "And bowls under two branches in three places, which together make six branches going out from one shaft."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et sphaerulae igitur, et calami ex ipso erant, universa ductilia ex auro purissimo."
      en: "So both the bowls, and the branches were of the same, all beaten work of the purest gold."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Fecit et lucernas septem cum emunctoriis suis, et vasa ubi ea, quae emuncta sunt, extinguantur, de auro mundissimo."
      en: "He made also the seven lamps with their snuffers, and the vessels where the snuffings were to be put out, of the purest gold."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Talentum auri appendebat candelabrum cum omnibus vasis suis."
      en: "The candlestick with all the vessels thereof weighed a talent of gold."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Fecit et altare thymiamatis de lignis setim, per quadrum singulos habens cubitos, et in altitudine duos: e cujus angulis procedebant cornua."
      en: "He made also the altar of incense of setim wood, being a cubit on every side foursquare, and in height two cubits: from the corners of which went out horns."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Vestivitque illud auro purissimo cum craticula ac parietibus et cornibus."
      en: "And he overlaid it with the purest gold, with its grate and the sides, and the horns."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Fecitque ei coronam aureolam per gyrum, et duos annulos aureos sub corona per singula latera, ut mittantur in eos vectes, et possit altare portari."
      en: "And he made to it a crown of gold round about, and two golden rings under the crown at each side, that the bars might be put into them, and the altar be carried."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Ipsos autem vectes fecit de lignis setim, et operuit laminis aureis."
      en: "And the bars themselves he made also of setim wood, and overlaid them with plates of gold."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Composuit et oleum ad sanctificationis unguentum, et thymiama de aromatibus mundissimis opere pigmentarii."
      en: "He compounded also the oil for the ointment of sanctification, and incense of the purest spices, according to the work of a perfumer."
    status: { la: verified, en: verified }
