# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1esdr
chapter: 7
verses:
  - n: 1
    text:
      la: "Post haec autem verba in regno Artaxerxis regis Persarum, Esdras filius Saraiae, filii Azariae, filii Helciae,"
      en: "Now after these things in the reign of Artaxerxes king of the Persians, Esdras the son of Saraias, the son of Azarias, the son of Helcias,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "filii Sellum, filii Sadoc, filii Achitob,"
      en: "The son of Sellum, the son of Sadoc, the son of Achitob,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "filii Amariae, filii Azariae, filii Maraioth,"
      en: "The son of Amarias, the son of Azarias, the son of Maraioth,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "filii Zarahiae, filii Ozi, filii Bocci,"
      en: "The son of Zarahias, the son of Ozi, the son of Bocci,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "filii Abisue, filii Phinees, filii Eleazar, filii Aaron sacerdotis ab initio."
      en: "The son of Abisue, the son of Phinees, the son of Eleazar the son of Aaron the priest from the beginning."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ipse Esdras ascendit de Babylone, et ipse scriba velox in lege Moysi, quam Dominus Deus dedit Israel: et dedit ei rex secundum manum Domini Dei ejus super eum, omnem petitionem ejus."
      en: "This Esdras went up from Babylon, and he was a ready scribe in the law of Moses, which the Lord God had given to Israel: and the king granted him all his request, according to the hand of the Lord his God upon him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et ascenderunt de filiis Israel, et de filiis sacerdotum, et de filiis Levitarum, et de cantoribus, et de janitoribus, et de Nathinaeis, in Jerusalem, anno septimo Artaxerxis regis."
      en: "And there went up some of the children of Israel, and of the children of the priests, and of the children of the Levites, and of the singing men, and of the porters, and of the Nathinites to Jerusalem in the seventh year of Artaxerxes the king."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et venerunt in Jerusalem mense quinto, ipse est annus septimus regis."
      en: "And they came to Jerusalem in the fifth month, in the seventh year of the king."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quia in primo die mensis primi coepit ascendere de Babylone, et in primo die mensis quinti venit in Jerusalem, juxta manum Dei sui bonam super se."
      en: "For upon the first day of the first month he began to go up from Babylon, and on the first day of the fifth month he came to Jerusalem according to the good hand of his God upon him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Esdras enim paravit cor suum, ut investigaret legem Domini, et faceret et doceret in Israel praeceptum et judicium."
      en: "For Esdras had prepared his heart to seek the law of the Lord, and to do and to teach in Israel the commandments and judgment."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Hoc est autem exemplar epistolae edicti, quod dedit rex Artaxerxes Esdrae sacerdoti, scribae erudito in sermonibus et praeceptis Domini, et caeremoniis ejus in Israel."
      en: "And this is the copy of the letter of the edict, which king Artaxerxes gave to Esdras the priest, the scribe instructed in the words and commandments of the Lord, and his ceremonies in Israel."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Artaxerxes rex regum Esdrae sacerdoti scribae legis Dei caeli doctissimo, salutem."
      en: "Artaxerxes king of kings to Esdras the priest, the most learned scribe of the law of the God of heaven, greeting."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "A me decretum est, ut cuicumque placuerit in regno meo de populo Israel, et de sacerdotibus ejus, et de Levitis, ire in Jerusalem, tecum vadat."
      en: "It is decreed by me, that all they of the people of Israel, and of the priests and of the Levites in my realm, that are minded to go into Jerusalem, should go with thee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "A facie enim regis, et septem consiliatorum ejus, missus es, ut visites Judaeam et Jerusalem in lege Dei tui, quae est in manu tua:"
      en: "For thou art sent from before the king, and his seven counsellors, to visit Judea and Jerusalem according to the law of thy God, which is in thy hand."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ut feras argentum et aurum quod rex, et consiliatores ejus, sponte obtulerunt Deo Israel, cujus in Jerusalem tabernaculum est."
      en: "And to carry the silver and gold, which the king and his counsellors have freely offered to the God of Israel, whose tabernacle is in Jerusalem."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et omne argentum et aurum quodcumque inveneris in universa provincia Babylonis, et populus offerre voluerit, et de sacerdotibus quae sponte obtulerint domui Dei sui, quae est in Jerusalem,"
      en: "And all the silver and gold that thou shalt find in all the province of Babylon, and that the people is willing to offer, and that the priests shall offer of their own accord to the house of their God, which is in Jerusalem,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "libere accipe, et studiose eme de hac pecunia vitulos, arietes, agnos, et sacrificia, et libamina eorum, et offer ea super altare templi Dei vestri, quod est in Jerusalem."
      en: "Take freely, and buy diligently with this money, calves, rams, lambs, with the sacrifices and libations of them, and offer them upon the altar of the temple of your God, that is in Jerusalem."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Sed et si quid tibi et fratribus tuis placuerit de reliquo argento et auro ut faciatis, juxta voluntatem Dei vestri facite."
      en: "And if it seem good to thee, and to thy brethren to do any thing with the rest of the silver and gold, do it according to the will of your God."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Vasa quoque, quae dantur tibi in ministerium domus Dei tui, trade in conspectu Dei in Jerusalem."
      en: "The vessels also, that are given thee for the sacrifice of the house of thy God, deliver thou in the sight of God in Jerusalem."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Sed et cetera, quibus opus fuerit in domum Dei tui, quantumcumque necesse est ut expendas, dabitur de thesauro, et de fisco regis,"
      en: "And whatsoever more there shall be need of for the house of thy God, how much soever thou shalt have occasion to spend, it shall be given out of the treasury, and the king's exchequer, and by me."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et a me. Ego Artaxerxes rex, statui atque decrevi omnibus custodibus arcae publicae, qui sunt trans flumen, ut quodcumque petierit a vobis Esdras sacerdos, scriba legis Dei caeli, absque mora detis,"
      en: "I Artaxerxes the king have ordered and decreed to all the keepers of the public chest, that are beyond the river, that whatsoever Esdras the priest, the scribe of the law of the God of heaven, shall require of you, you give it without delay,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "usque ad argenti talenta centum, et usque ad frumenti coros centum, et usque ad vini batos centum, et usque ad batos olei centum, sal vero absque mensura."
      en: "Unto a hundred talents of silver, and unto a hundred cores of wheat, and unto a hundred bates of wine, and unto a hundred bates of oil, and salt without measure."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Omne quod ad ritum Dei caeli pertinet, tribuatur diligenter in domo Dei caeli: ne forte irascatur contra regnum regis, et filiorum ejus."
      en: "All that belongeth to the rites of the God of heaven, let it be given diligently in the house of the God of heaven: lest his wrath should be enkindled against the realm of the king, and of his sons."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Vobis quoque notum facimus de universis sacerdotibus, et Levitis, et cantoribus, et janitoribus, Nathinaeis, et ministris domus Dei hujus, ut vectigal, et tributum, et annonas non habeatis potestatem imponendi super eos."
      en: "We give you also to understand concerning all the priests, and the Levites, and the singers, and the porters, and the Nathinites, and ministers of the house of this God, that you have no authority to impose toll or tribute, or custom upon them."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Tu autem Esdra, secundum sapientiam Dei tui, quae est in manu tua, constitue judices et praesides ut judicent omni populo, qui est trans flumen, his videlicet qui noverunt legem Dei tui, sed et imperitos docete libere."
      en: "And thou Esdras according to the wisdom of thy God, which is in thy hand, appoint judges and magistrates, that may judge all the people, that is beyond the river, that is, for them who know the law of thy God, yea and the ignorant teach ye freely."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et omnis qui non fecerit legem Dei tui, et legem regis, diligenter, judicium erit de eo sive in mortem, sive in exilium, sive in condemnationem substantiae ejus, vel certe in carcerem."
      en: "And whosoever will not do the law of thy God, and the law of the king diligently, judgment shall be executed upon him, either unto death, or unto banishment, or to the confiscation of goods, or at least to prison."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Benedictus Dominus Deus patrum nostrorum, qui dedit hoc in corde regis ut glorificaret domum Domini quae est in Jerusalem,"
      en: "Blessed be the Lord the God of our fathers, who hath put this in the king's heart, to glorify the house of the Lord, which is in Jerusalem,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et in me inclinavit misericordiam suam coram rege et consiliatoribus ejus, et universis principibus regis potentibus: et ego confortatus manu Domini Dei mei, quae erat in me, congregavi de Israel principes qui ascenderent mecum."
      en: "And hath inclined his mercy toward me before the king and his counsellors, and all the mighty princes of the king: and I being strengthened by the hand of the Lord my God, which was upon me, gathered together out of Israel chief men to go up with me."
    status: { la: verified, en: verified }
