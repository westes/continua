# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 19
verses:
  - n: 1
    text:
      la: "onus Aegypti ecce Dominus ascendet super nubem levem et ingredietur Aegyptum et movebuntur simulacra Aegypti a facie eius et cor Aegypti tabescet in medio eius"
      en: "The burden of Egypt. Behold the Lord will ascend upon a swift cloud, and will enter into Egypt, and the idols of Egypt shall be moved at his presence, and the heart of Egypt shall melt in the midst thereof."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et concurrere faciam Aegyptios adversum Aegyptios et pugnabit vir contra fratrem suum et vir contra amicum suum civitas adversus civitatem regnum adversus regnum"
      en: "And I will set the Egyptians to fight against the Egyptians: and they shall fight brother against brother, and friend against friend, city against city, kingdom against kingdom."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et disrumpetur spiritus Aegypti in visceribus eius et consilium eius praecipitabo et interrogabunt simulacra sua et divinos suos et pythones et ariolos"
      en: "And the spirit of Egypt shall be broken in the bowels thereof, and I will cast down their counsel: and they shall consult their idols, and their diviners, and their wizards, and soothsayers."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et tradam Aegyptum in manu dominorum crudelium et rex fortis dominabitur eorum ait Dominus Deus exercituum"
      en: "And I will deliver Egypt into the hand of cruel masters, and a strong king shall rule over them, saith the Lord the God of hosts."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et arescet aqua de mari et fluvius desolabitur atque siccabitur"
      en: "And the water of the sea shall be dried up, and the river shall be wasted and dry."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et deficient flumina adtenuabuntur et siccabuntur rivi aggerum calamus et iuncus marcescet"
      en: "And the rivers shall fail: the streams of the banks shall be diminished, and be dried up. The reed and the bulrush shall wither away."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nudabitur alveus rivi a fonte suo et omnis sementis inrigua siccabitur arescet et non erit"
      en: "The channel of the river shall be laid bare from its fountain, and every thing sown by the water shall be dried up, it shall wither away, and shall be no more."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et maerebunt piscatores et lugebunt omnes mittentes in flumen hamum et expandentes rete super faciem aquae marcescent"
      en: "The fishers also shall mourn, and all that cast a hook into the river shall lament, and they that spread nets upon the waters shall languish away."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "confundentur qui operabantur linum pectentes et texentes subtilia"
      en: "They shall be confounded that wrought in flax, combing and weaving fine linen."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et erunt inrigua eius flaccentia omnes qui faciebant lacunas ad capiendos pisces"
      en: "And its watery places shall be dry, all they shall mourn that made pools to take fishes."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "stulti principes Taneos sapientes consiliarii Pharao dederunt consilium insipiens quomodo dicetis Pharaoni filius sapientium ego filius regum antiquorum"
      en: "The princes of Tanis are become fools, the wise counsellors of Pharao have given foolish counsel: how will you say to Pharao: I am the son of the wise, the son of ancient kings?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ubi sunt nunc sapientes tui adnuntient tibi et indicent quid cogitaverit Dominus exercituum super Aegyptum"
      en: "Where are now thy wise men? let them tell thee, and shew what the Lord of hosts hath purposed upon Egypt."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "stulti facti sunt principes Taneos emarcuerunt principes Mempheos deceperunt Aegyptum angulum populorum eius"
      en: "The princes of Tanis are become fools, the princes of Memphis are gone astray, they have deceived Egypt, the stay of the people thereof."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dominus miscuit in medio eius spiritum vertiginis et errare fecerunt Aegyptum in omni opere suo sicut errat ebrius et vomens"
      en: "The Lord hath mingled in the midst thereof the spirit of giddiness: and they have caused Egypt to err in all its works, as a drunken man staggereth and vomiteth."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et non erit Aegypto opus quod faciat caput et caudam incurvantem et refrenantem"
      en: "And there shall be no work for Egypt, to make head or tail, him that bendeth down, or that holdeth back."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "in die illa erit Aegyptus quasi mulieres et stupebunt et timebunt a facie commotionis manus Domini exercituum quam ipse movebit super eam"
      en: "In that day Egypt shall be like unto women, and they shall be amazed, and afraid, because of the moving of the hand of the Lord of hosts, which he shall move over it."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et erit terra Iuda Aegypto in festivitatem omnis qui illius fuerit recordatus pavebit a facie consilii Domini exercituum quod ipse cogitavit super eam"
      en: "And the land of Juda shall be a terror to Egypt: every one that shall remember it shall tremble because of the counsel of the Lord of hosts, which he hath determined concerning it."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "in die illa erunt quinque civitates in terra Aegypti loquentes lingua Chanaan et iurantes per Dominum exercituum civitas Solis vocabitur una"
      en: "In that day there shall be five cities in the land of Egypt, speaking the language of Chanaan, and swearing by the Lord of hosts: one shall be called the city of the sun."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "in die illa erit altare Domini in medio terrae Aegypti et titulus iuxta terminum eius Domini"
      en: "In that day there shall be an altar of the Lord in the midst of the land of Egypt, and a monument of the Lord at the borders thereof:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et erit in signum et in testimonium Domino exercituum in terra Aegypti clamabunt enim ad Dominum a facie tribulantis et mittet eis salvatorem et propugnatorem qui liberet eos"
      en: "It shall be for a sign, and for a testimony to the Lord of hosts in the land of Egypt. For they shall cry to the Lord because of the oppressor, and he shall send them a Saviour and a defender to deliver them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et cognoscetur Dominus ab Aegypto et cognoscent Aegyptii Dominum in die illa et colent eum in hostiis et muneribus et vota vovebunt Domino et solvent"
      en: "And the Lord shall be known by Egypt, and the Egyptians shall know the Lord in that day, and shall worship him with sacrifices and offerings: and they shall make vows to the Lord, and per- form them."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et percutiet Dominus Aegyptum plaga et sanabit eam et revertentur ad Dominum et placabitur eis et sanabit eos"
      en: "And the Lord shall strike Egypt with a scourge, and shall heal it, and they shall return to the Lord, and he shall be pacified towards them, and heal them."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "in die illa erit via de Aegypto in Assyrios et intrabit Assyrius Aegyptum et Aegyptius in Assyrios et servient Aegyptii Assur"
      en: "In that day there shall be a way from Egypt to the Assyrians, and the Assyrian shall enter into Egypt, and the Egyptian to the Assyrians, and the Egyptians shall serve the Assyrian."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "in die illa erit Israhel tertius Aegyptio et Assyrio benedictio in medio terrae"
      en: "In that day shall Israel be the third to the Egyptian and the Assyrian: a blessing in the midst of the land,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "cui benedixit Dominus exercituum dicens benedictus populus meus Aegypti et opus manuum mearum Assyrio hereditas autem mea Israhel"
      en: "Which the Lord of hosts hath blessed, saying: Blessed be my people of Egypt, and the work of my hands to the Assyrian: but Israel is my inheritance."
    status: { la: verified, en: verified }
