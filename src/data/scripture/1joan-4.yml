# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1joan
chapter: 4
verses:
  - n: 1
    text:
      la: "carissimi nolite omni spiritui credere sed probate spiritus si ex Deo sint quoniam multi pseudoprophetae exierunt in mundum"
      en: "Dearly beloved, believe not every spirit, but try the spirits if they be of God: because many false prophets are gone out into the world."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in hoc cognoscitur Spiritus Dei omnis spiritus qui confitetur Iesum Christum in carne venisse ex Deo est"
      en: "By this is the spirit of God known. Every spirit which confesseth that Jesus Christ is come in the flesh, is of God:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et omnis spiritus qui solvit Iesum ex Deo non est et hoc est antichristi quod audistis quoniam venit et nunc iam in mundo est"
      en: "And every spirit that dissolveth Jesus, is not of God: and this is Antichrist, of whom you have heard that he cometh, and he is now already in the world."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "vos ex Deo estis filioli et vicistis eos quoniam maior est qui in vobis est quam qui in mundo"
      en: "You are of God, little children, and have overcome him. Because greater is he that is in you, than he that is in the world."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ipsi de mundo sunt ideo de mundo loquuntur et mundus eos audit"
      en: "They are of the world: therefore of the world they speak, and the world heareth them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "nos ex Deo sumus qui novit Deum audit nos qui non est ex Deo non audit nos in hoc cognoscimus Spiritum veritatis et spiritum erroris"
      en: "We are of God. He that knoweth God, heareth us. He that is not of God, heareth us not. By this we know the spirit of truth, and the spirit of error."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "carissimi diligamus invicem quoniam caritas ex Deo est et omnis qui diligit ex Deo natus est et cognoscit Deum"
      en: "Dearly beloved, let us love one another, for charity is of God. And every one that loveth, is born of God, and knoweth God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui non diligit non novit Deum quoniam Deus caritas est"
      en: "He that loveth not, knoweth not God: for God is charity."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "in hoc apparuit caritas Dei in nobis quoniam Filium suum unigenitum misit Deus in mundum ut vivamus per eum"
      en: "By this hath the charity of God appeared towards us, because God hath sent his only begotten Son into the world, that we may live by him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in hoc est caritas non quasi nos dilexerimus Deum sed quoniam ipse dilexit nos et misit Filium suum propitiationem pro peccatis nostris"
      en: "In this is charity: not as though we had loved God, but because he hath first loved us, and sent his Son to be a propitiation for our sins."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "carissimi si sic Deus dilexit nos et nos debemus alterutrum diligere"
      en: "My dearest, if God hath so loved us; we also ought to love one another."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Deum nemo vidit umquam si diligamus invicem Deus in nobis manet et caritas eius in nobis perfecta est"
      en: "No man hath seen God at any time. If we love one another, God abideth in us, and his charity is perfected in us."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "in hoc intellegimus quoniam in eo manemus et ipse in nobis quoniam de Spiritu suo dedit nobis"
      en: "In this we know that we abide in him, and he in us: because he hath given us of his spirit."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et nos vidimus et testificamur quoniam Pater misit Filium salvatorem mundi"
      en: "And we have seen, and do testify, that the Father hath sent his Son to be the Saviour of the world."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quisque confessus fuerit quoniam Iesus est Filius Dei Deus in eo manet et ipse in Deo"
      en: "Whosoever shall confess that Jesus is the Son of God, God abideth in him, and he in God."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et nos cognovimus et credidimus caritati quam habet Deus in nobis Deus caritas est et qui manet in caritate in Deo manet et Deus in eo"
      en: "And we have known, and have believed the charity, which God hath to us. God is charity: and he that abideth in charity, abideth in God, and God in him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "in hoc perfecta est caritas nobiscum ut fiduciam habeamus in die iudicii quia sicut ille est et nos sumus in hoc mundo"
      en: "In this is the charity of God perfected with us, that we may have confidence in the day of judgment: because as he is, we also are in this world."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "timor non est in caritate sed perfecta caritas foras mittit timorem quoniam timor poenam habet qui autem timet non est perfectus in caritate"
      en: "Fear is not in charity: but perfect charity casteth out fear, because fear hath pain. And he that feareth, is not perfected in charity."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "nos ergo diligamus quoniam Deus prior dilexit nos"
      en: "Let us therefore love God, because God first hath loved us."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "si quis dixerit quoniam diligo Deum et fratrem suum oderit mendax est qui enim non diligit fratrem suum quem vidit Deum quem non vidit quomodo potest diligere"
      en: "If any man say, I love God, and hateth his brother; he is a liar. For he that loveth not his brother, whom he seeth, how can he love God, whom he seeth not?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et hoc mandatum habemus ab eo ut qui diligit Deum diligat et fratrem suum"
      en: "And this commandment we have from God, that he, who loveth God, love also his brother."
    status: { la: verified, en: verified }
