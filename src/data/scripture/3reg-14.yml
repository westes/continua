# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 3reg
chapter: 14
verses:
  - n: 1
    text:
      la: "in tempore illo aegrotavit Abia filius Hieroboam"
      en: "At that time Abia the son of Jeroboam fell sick."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixitque Hieroboam uxori suae surge et commuta habitum ne cognoscaris quod sis uxor Hieroboam et vade in Silo ubi est Ahia propheta qui locutus est mihi quod regnaturus essem super populum hunc"
      en: "And Jeroboam said to his wife: Arise, and change thy dress, that thou be not known to be the wife of Jeroboam, and go to Silo, where Ahias the prophet is, who told me, that I should reign over this people."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "tolle quoque in manu tua decem panes et crustula et vas mellis et vade ad illum ipse indicabit tibi quid eventurum sit huic puero"
      en: "Take also with thee ten leaves, and cracknels, and a pot of honey, and go to him: for he will tell thee what shall become of this child."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "fecit ut dixerat uxor Hieroboam et consurgens abiit in Silo et venit in domum Ahia at ille non poterat videre quia caligaverant oculi eius prae senectute"
      en: "Jeroboam's wife did as he told her: and rising up went to Silo, and came to the house of Ahias: but he could not see, for his eyes were dim by reason of his age."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixit autem Dominus ad Ahiam ecce uxor Hieroboam ingreditur ut consulat te super filio suo qui aegrotat haec et haec loqueris ei cum ergo illa intraret et dissimularet se esse quae erat"
      en: "And the Lord said to Ahias: Behold the wife of Jeroboam cometh in, to consult thee concerning her son that is sick: thus and thus shalt thou speak to her. So when she was coming in, and made as if she were another woman,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "audivit Ahias sonitum pedum eius introeuntis per ostium et ait ingredere uxor Hieroboam quare aliam esse te simulas ego autem missus sum ad te durus nuntius"
      en: "Ahias heard the sound of her feet coming in at the door, and said: Come in, thou wife of Jeroboam: why dost thou feign thyself to be another? But I am sent to thee with heavy tidings."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "vade et dic Hieroboam haec dicit Dominus Deus Israhel quia exaltavi te de medio populi et dedi te ducem super populum meum Israhel"
      en: "Go, and tell Jeroboam: Thus saith the Lord the God of Israel: Forasmuch as I exalted thee from among the people, and made thee prince over my people Israel:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et scidi regnum domus David et dedi illud tibi et non fuisti sicut servus meus David qui custodivit mandata mea et secutus est me in toto corde suo faciens quod placitum esset in conspectu meo"
      en: "And rent the kingdom away from the house of David, and gave it to thee, and thou hast not been as my servant David, who kept my commandments, and followed me with all his heart, doing that which was well pleasing in my sight:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sed operatus es male super omnes qui fuerunt ante te et fecisti tibi deos alienos et conflatiles ut me ad iracundiam provocares me autem proiecisti post corpus tuum"
      en: "But hast done evil above all that were before thee, and hast made thee strange gods and molten gods, to provoke me to anger, and hast cast me behind thy back:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "idcirco ecce ego inducam mala super domum Hieroboam et percutiam de Hieroboam mingentem ad parietem et clausum et novissimum in Israhel et mundabo reliquias domus Hieroboam sicut mundari solet fimus usque ad purum"
      en: "Therefore behold I will bring evils upon the house of Jeroboam, and will cut of from Jeroboam him that pisseth against the wall, and him that is shut up, and the last in Israel: and I will sweep away the remnant of the house of Jeroboam, as dung is swept away till all be clean."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "qui mortui fuerint de Hieroboam in civitate comedent eos canes qui autem mortui fuerint in agro vorabunt eos aves caeli quia Dominus locutus est"
      en: "Them that shall die of Jeroboam in the city, the dogs shall eat: and them that shall die in the field, the birds of the air shall devour: for the Lord hath spoken it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tu igitur surge et vade in domum tuam et in ipso introitu pedum tuorum in urbem morietur puer"
      en: "Arise thou therefore, and go to thy house: and when thy feet shall be entering into the city, the child shall die,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et planget eum omnis Israhel et sepeliet iste enim solus infertur de Hieroboam in sepulchrum quia inventus est super eo sermo bonus ad Dominum Deum Israhel in domo Hieroboam"
      en: "And all Israel shall mourn for him, and shall bury him: for he only of Jeroboam shall be laid in a sepulchre, be- cause in his regard there is found a good word from the Lord the God of Israel, in the house of Jeroboam."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "constituet autem sibi Dominus regem super Israhel qui percutiat domum Hieroboam in hac die et in hoc tempore"
      en: "And the Lord hath appointed himself a king over Israel, who shall cut off the house of Jeroboam in this day, and in this time:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et percutiet Dominus Israhel sicut moveri solet harundo in aqua et evellet Israhel de terra bona hac quam dedit patribus eorum et ventilabit eos trans Flumen quia fecerunt sibi lucos ut inritarent Dominum"
      en: "And the Lord God shall strike Israel as a reed is shaken in the water: and he shall root up Israel out of this good land, which he gave to their fathers, and shall scatter them beyond the river: because they have made to themselves groves, to provoke the Lord."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et tradet Dominus Israhel propter peccata Hieroboam qui peccavit et peccare fecit Israhel"
      en: "And the Lord shall give up Israel for the sins of Jeroboam, who hath sinned, and made Israel to sin."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "surrexit itaque uxor Hieroboam et abiit et venit in Thersa cumque illa ingrederetur limen domus puer mortuus est"
      en: "And the wife of Jeroboam arose, and departed, and came to Thersa: and when she was coming in to the threshold of the house, the child died;"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et sepelierunt eum et planxit illum omnis Israhel iuxta sermonem Domini quem locutus est in manu servi sui Ahiae prophetae"
      en: "And they buried him. And all Israel mourned for him according to the word of the Lord, which he spoke by the hand of his servant Ahias the prophet."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "reliqua autem verborum Hieroboam quomodo pugnaverit et quomodo regnaverit ecce scripta sunt in libro verborum dierum regum Israhel"
      en: "And the rest of the acts of Jeroboam, how he fought, and how he reigned, behold they are written in the book of the words of the days of the kings of Israel."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dies autem quibus regnavit Hieroboam viginti duo anni sunt et dormivit cum patribus suis regnavitque Nadab filius eius pro eo"
      en: "And the days that Jeroboam reigned, were two and twenty years: and he slept with his fathers: and Nadab his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "porro Roboam filius Salomonis regnavit in Iuda quadraginta et unius anni erat Roboam cum regnare coepisset et decem et septem annis regnavit in Hierusalem civitatem quam elegit Dominus ut poneret nomen suum ibi ex omnibus tribubus Israhel nomen autem matris eius Naama Ammanites"
      en: "And Roboam the son of Solomon reigned in Juda: Roboam was one and forty years old when he began to reign: and he reigned seventeen years in Jerusalem the city, which the Lord chose out of all the tribes of Israel to put his name there. And his mother's name wee Naama an Ammonitess."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et fecit Iudas malum coram Domino et inritaverunt eum super omnibus quae fecerant patres eorum in peccatis suis quae peccaverant"
      en: "And Juda did evil in the sight of the Lord, and provoked him above all that their fathers had done, in their sins which they committed."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "aedificaverunt enim et ipsi sibi aras et statuas et lucos super omnem collem excelsum et subter omnem arborem frondosam"
      en: "For they also built them altars, and statues, and groves upon every high hill and under every green tree:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "sed et effeminati fuerunt in terra feceruntque omnes abominationes gentium quas adtrivit Dominus ante faciem filiorum Israhel"
      en: "There were also the effeminate in the land, and they did according to all the abominations of the people whom the Lord had destroyed before the face of the children of Israel."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "in quinto autem anno regni Roboam ascendit Sesac rex Aegypti in Hierusalem"
      en: "And in the fifth year of the reign of Roboam, Sesac king of Egypt came up against Jerusalem."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et tulit thesauros domus Domini et thesauros regios et universa diripuit scuta quoque aurea quae fecerat Salomon"
      en: "And he took away the treasures of the house of the Lord, and the king's treasures, and carried all off: as also the shields of gold which Solomon had made."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "pro quibus fecit rex Roboam scuta aerea et tradidit ea in manu ducum scutariorum et eorum qui excubabant ante ostium domus regis"
      en: "And Roboam made shields of brass instead of them, and delivered them into the. hand of the captains of the shieldbearers, and of them that kept watch before the gate of the king's house."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "cumque ingrederetur rex in domum Domini portabant ea qui praeeundi habebant officium et postea reportabant ad armamentarium scutariorum"
      en: "And when the king went into the house of the Lord, they whose office it was to go before him, carried them: and afterwards they brought them back to the armoury of the shieldbearers."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "reliqua autem sermonum Roboam et omnium quae fecit ecce scripta sunt in libro verborum dierum regum Iuda"
      en: "Now the rest of the sets of Roboam, end all that he did, behold they are written in the book of the words of the days of the kings of Juda."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "fuitque bellum inter Roboam et Hieroboam cunctis diebus"
      en: "And there was war between Roboam and Jeroboam always."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "dormivit itaque Roboam cum patribus suis et sepultus est cum eis in civitate David nomen autem matris eius Naama Ammanites et regnavit Abiam filius eius pro eo"
      en: "And Roboam slept with his fathers, and was buried with them in the city of David: and his mother's name was Naama an Ammonitess: and Abiam his son reigned in his stead."
    status: { la: verified, en: verified }
