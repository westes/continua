# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 3reg
chapter: 14
verses:
  - n: 1
    text:
      la: "In tempore illo aegrotavit Abia filius Jeroboam."
      en: "At that time Abia the son of Jeroboam fell sick."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dixitque Jeroboam uxori suae: Surge, et commuta habitum, ne cognoscaris quod sis uxor Jeroboam: et vade in Silo, ubi est Ahias propheta, qui locutus est mihi, quod regnaturus essem super populum hunc."
      en: "And Jeroboam said to his wife: Arise, and change thy dress, that thou be not known to be the wife of Jeroboam, and go to Silo, where Ahias the prophet is, who told me, that I should reign over this people."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tolle quoque in manu tua decem panes, et crustulam, et vas mellis, et vade ad illum: ipse enim indicabit tibi quid eventurum sit puero huic."
      en: "Take also with thee ten loaves, and cracknels, and a pot of honey, and go to him: for he will tell thee what shall become of this child."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Fecit ut dixerat, uxor Jeroboam: et consurgens abiit in Silo, et venit in domum Ahiae: at ille non poterat videre, quia caligaverant oculi ejus prae senectute."
      en: "Jeroboam's wife did as he told her: and rising up went to Silo, and came to the house of Ahias: but he could not see, for his eyes were dim by reason of his age."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dixit autem Dominus ad Ahiam: Ecce uxor Jeroboam ingreditur ut consulat te super filio suo qui aegrotat: haec et haec loqueris ei. Cum ergo illa intraret, et dissimularet se esse quae erat,"
      en: "And the Lord said to Ahias: Behold the wife of Jeroboam cometh in, to consult thee concerning her son that is sick: thus and thus shalt thou speak to her. So when she was coming in, and made as if she were another woman,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "audivit Ahias sonitum pedum ejus introeuntis per ostium, et ait: Ingredere, uxor Jeroboam: quare aliam te esse simulas? ego autem missus sum ad te durus nuntius."
      en: "Ahias heard the sound of her feet coming in at the door, and said: Come in, thou wife of Jeroboam: why dost thou feign thyself to be another? But I am sent to thee with heavy tidings."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Vade, et dic Jeroboam: Haec dicit Dominus Deus Israel: Quia exaltavi te de medio populi, et dedi te ducem super populum meum Israel:"
      en: "Go, and tell Jeroboam: Thus saith the Lord the God of Israel: Forasmuch as I exalted thee from among the people, and made thee prince over my people Israel:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et scidi regnum domus David, et dedi illud tibi, et non fuisti sicut servus meus David, qui custodivit mandata mea, et secutus est me in toto corde suo, faciens quod placitum esset in conspectu meo:"
      en: "And rent the kingdom away from the house of David, and gave it to thee, and thou hast not been as my servant David, who kept my commandments, and followed me with all his heart, doing that which was well pleasing in my sight:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sed operatus es mala super omnes qui fuerunt ante te, et fecisti tibi deos alienos et conflatiles, ut me ad iracundiam provocares, me autem projecisti post corpus tuum:"
      en: "But hast done evil above all that were before thee, and hast made thee strange gods and molten gods, to provoke me to anger, and hast cast me behind thy back:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "idcirco ecce ego inducam mala super domum Jeroboam, et percutiam de Jeroboam mingentem ad parietem, et clausum, et novissimum in Israel: et mundabo reliquias domus Jeroboam, sicut mundari solet fimus usque ad purum."
      en: "Therefore behold I will bring evils upon the house of Jeroboam, and will cut off from Jeroboam him that pisseth against the wall, and him that is shut up, and the last in Israel: and I will sweep away the remnant of the house of Jeroboam, as dung is swept away till all be clean."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Qui mortui fuerint de Jeroboam in civitate, comedent eos canes: qui autem mortui fuerint in agro, vorabunt eos aves caeli: quia Dominus locutus est."
      en: "Them that shall die of Jeroboam in the city, the dogs shall eat: and them that shall die in the field, the birds of the air shall devour: for the Lord hath spoken it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tu igitur surge, et vade in domum tuam: et in ipso introitu pedum tuorum in urbem, morietur puer,"
      en: "Arise thou therefore, and go to thy house: and when thy feet shall be entering into the city, the child shall die,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et planget eum omnis Israel, et sepeliet: iste enim solus inferetur de Jeroboam in sepulchrum, quia inventus est super eo sermo bonus a Domino Deo Israel, in domo Jeroboam."
      en: "And all Israel shall mourn for him, and shall bury him: for he only of Jeroboam shall be laid in a sepulchre, because in his regard there is found a good word from the Lord the God of Israel, in the house of Jeroboam."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Constituet autem sibi Dominus regem super Israel, qui percutiet domum Jeroboam in hac die, et in hoc tempore:"
      en: "And the Lord hath appointed himself a king over Israel, who shall cut off the house of Jeroboam in this day, and in this time:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et percutiet Dominus Deus Israel, sicut moveri solet arundo in aqua: et evellet Israel de terra bona hac, quam dedit patribus eorum, et ventilabit eos trans flumen: quia fecerunt sibi lucos, ut irritarent Dominum."
      en: "And the Lord God shall strike Israel as a reed is shaken in the water: and he shall root up Israel out of this good land, which he gave to their fathers, and shall scatter them beyond the river: because they have made to themselves groves, to provoke the Lord."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et tradet Dominus Israel propter peccata Jeroboam, qui peccavit, et peccare fecit Israel."
      en: "And the Lord shall give up Israel for the sins of Jeroboam, who hath sinned, and made Israel to sin."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Surrexit itaque uxor Jeroboam, et abiit, et venit in Thersa: cumque illa ingrederetur limen domus, puer mortuus est,"
      en: "And the wife of Jeroboam arose, and departed, and came to Thersa: and when she was coming in to the threshold of the house, the child died;"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et sepelierunt eum. Et planxit eum omnis Israel juxta sermonem Domini, quem locutus est in manu servi sui Ahiae prophetae."
      en: "And they buried him. And all Israel mourned for him according to the word of the Lord, which he spoke by the hand of his servant Ahias the prophet."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Reliqua autem verborum Jeroboam, quomodo pugnaverit, et quomodo regnaverit, ecce scripta sunt in libro verborum dierum regum Israel."
      en: "And the rest of the acts of Jeroboam, how he fought, and how he reigned, behold they are written in the book of the words of the days of the kings of Israel."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dies autem, quibus regnavit Jeroboam, viginti duo anni sunt: et dormivit cum patribus suis: regnavitque Nadab filius ejus pro eo."
      en: "And the days that Jeroboam reigned, were two and twenty years: and he slept with his fathers: and Nadab his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Porro Roboam filius Salomonis regnavit in Juda. Quadraginta et unius anni erat Roboam, cum regnare coepisset: decem et septem annos regnavit in Jerusalem civitate, quam elegit Dominus ut poneret nomen suum ibi, ex omnibus tribubus Israel. Nomen autem matris ejus Naama Ammanitis."
      en: "And Roboam the son of Solomon reigned in Juda: Roboam was one and forty years old when he began to reign: and he reigned seventeen years in Jerusalem the city, which the Lord chose out of all the tribes of Israel to put his name there. And his mother's name was Naama an Ammonitess."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et fecit Judas malum coram Domino, et irritaverunt eum super omnibus, quae fecerant patres eorum in peccatis suis quae peccaverunt."
      en: "And Juda did evil in the sight of the Lord, and provoked him above all that their fathers had done, in their sins which they committed."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Aedificaverunt enim et ipsi sibi aras, et statuas, et lucos super omnem collem excelsum, et subter omnem arborem frondosam:"
      en: "For they also built them altars, and statues, and groves upon every high hill and under every green tree:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "sed et effeminati fuerunt in terra, feceruntue omnes abominationes gentium, quas attrivit Dominus ante faciem filiorum Israel."
      en: "There were also the effeminate in the land, and they did according to all the abominations of the people whom the Lord had destroyed before the face of the children of Israel."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "In quinto autem anno regni Roboam, ascendit Sesac rex Aegypti in Jerusalem,"
      en: "And in the fifth year of the reign of Roboam, Sesac king of Egypt came up against Jerusalem."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et tulit thesauros domus Domini, et thesauros regios, et universa diripuit: scuta quoque aurea, quae fecerat Salomon:"
      en: "And he took away the treasures of the house of the Lord, and the king's treasures, and carried all off: as also the shields of gold which Solomon had made."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "pro quibus fecit rex Roboam scuta aerea, et tradidit ea in manum ducum scutariorum, et eorum qui excubabant ante ostium domus regis."
      en: "And Roboam made shields of brass instead of them, and delivered them into the hand of the captains of the shieldbearers, and of them that kept watch before the gate of the king's house."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Cumque ingrederetur rex in domum Domini, portabant ea qui praeeundi habebant officium: et postea reportabant ad armamentarium scutariorum."
      en: "And when the king went into the house of the Lord, they whose office it was to go before him, carried them: and afterwards they brought them back to the armoury of the shieldbearers."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Reliqua autem sermonum Roboam, et omnia quae fecit, ecce scripta sunt in libro sermonum dierum regum Juda."
      en: "Now the rest of the sets of Roboam, and all that he did, behold they are written in the book of the words of the days of the kings of Juda."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Fuitque bellum inter Roboam et Jeroboam cunctis diebus."
      en: "And there was war between Roboam and Jeroboam always."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Dormivitque Roboam cum patribus suis, et sepultus est cum eis in civitate David: nomen autem matris ejus Naama Ammanitis: et regnavit Abiam filius ejus pro eo."
      en: "And Roboam slept with his fathers, and was buried with them in the city of David: and his mother's name was Naama an Ammonitess: and Abiam his son reigned in his stead."
    status: { la: verified, en: verified }
