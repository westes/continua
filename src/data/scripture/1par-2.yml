# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1par
chapter: 2
verses:
  - n: 1
    text:
      la: "Filii autem Israel: Ruben, Simeon, Levi, Juda, Issachar, et Zabulon,"
      en: "And these are the sons of Israel: Ruben, Simeon, Levi, Juda, Issachar, and Zabulon,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dan, Joseph, Benjamin, Nephthali, Gad, et Aser."
      en: "Dan, Joseph, Benjamin, Nephtali, Gad, and Aser."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Filii Juda: Her, Onan, et Sela: hi tres nati sunt ei de filia Sue Chananitide. Fuit autem Her primogenitus Juda malus coram Domino, et occidit eum."
      en: "The sons of Juda: Her, Onan and Sela. These three were born to him of the Chanaanitess the daughter of Sue. And Her the firstborn of Juda, was wicked in the sight of the Lord, and he slew him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Thamar autem nurus ejus peperit ei Phares et Zara: omnes ergo filii Juda, quinque."
      en: "And Thamar his daughter in law bore him Phares and Zara. So all the sons of Juda were five."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Filii autem Phares: Hesron et Hamul."
      en: "And the sons of Phares, were Hesron and Hamul."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Filii quoque Zarae: Zamri, et Ethan, et Eman, Chalchal quoque, et Dara, simul quinque."
      en: "And the sons also of Zare: Zamri, and Ethan, and Eman, and Chalchal, and Dara, five in all."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Filii Charmi: Achar, qui turbavit Israel, et peccavit in furto anathematis."
      en: "And the sons of Charmi: Achar, who troubled Israel, and sinned by the theft of the anathema."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Filii Ethan: Azarias."
      en: "The sons of Ethan: Azarias,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Filii autem Hesron qui nati sunt ei: Jerameel, et Ram, et Calubi."
      en: "And the sons of Hesron that were born to him: Jerameel, and Ram, and Calubi."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Porro Ram genuit Aminadab. Aminadab autem genuit Nahasson, principem filiorum Juda."
      en: "And Ram beget Aminadab, and Aminadab beget Nahasson, prince of the children of Juda."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Nahasson quoque genuit Salma, de quo ortus est Booz."
      en: "And Nahasson beget Salma, the father of Booz."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Booz vero genuit Obed, qui et ipse genuit Isai."
      en: "And Booz beget Obed, and Obed beget Isai."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Isai autem genuit primogenitum Eliab, secundum Abinadab, tertium Simmaa,"
      en: "And Isai beget Eliab his firstborn, the second Abinadab, the third Simmaa,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quartum Nathanael, quintum Raddai,"
      en: "The fourth, Nathanael, the fifth Raddai,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sextum Asom, septimum David."
      en: "The sixth Asom, the seventh David."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quorum sorores fuerunt Sarvia, et Abigail. Filii Sarviae: Abisai, Joab, et Asael, tres."
      en: "And their sisters were Sarvia, and Abigail. The sons of Sarvia: Abisai, Joab, and Asael, three."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Abigail autem genuit Amasa, cujus pater fuit Jether Ismahelites."
      en: "And Abigail bore Amasa, whose father was Jether the Ismahelite."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Caleb vero filius Hesron accepit uxorem nomine Azuba, de qua genuit Jerioth: fueruntque filii ejus Jaser, et Sobab, et Ardon."
      en: "And Caleb the son of Hesron took a wife named Azuba, of whom he had Jerioth: and her sons were Jaser, and Sobab, and Ardon."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Cumque mortua fuisset Azuba, accepit uxorem Caleb Ephratha, quae peperit ei Hur."
      en: "And when Azuba was dead, Caleb took to wife Ephrata: who bore him Hur."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Porro Hur genuit Uri, et Uri genuit Bezeleel."
      en: "And Hur beget Uri: and Uri beget Bezeleel."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Post haec ingressus est Hesron ad filiam Machir patris Galaad, et accepit eam cum esset annorum sexaginta: quae peperit ei Segub."
      en: "And afterwards Hesron went in to the daughter of Machir the father of Galaad, and took her to wife when he was threescore years old: and she bore him Segub."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Sed et Segub genuit Jair, et possedit viginti tres civitates in terra Galaad."
      en: "And Segub beget Jair, and he had three and twenty cities in the land of Galaad."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cepitque Gessur, et Aram oppida Jair, et Canath, et viculos ejus sexaginta civitatum: omnes isti, filii Machir patris Galaad."
      en: "And he took Gessur, and Aram the towns of Jair, and Canath, and the villages thereof, threescore cities. All these, the sons of Machir father of Galaad."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Cum autem mortuus esset Hesron, ingressus est Caleb ad Ephratha. Habuit quoque Hesron uxorem Abia, quae peperit ei Assur patrem Thecuae."
      en: "And when Hesron was dead, Caleb went in to Ephrata. Hesron also had to wife Abia who bore him Ashur the father of Thecua."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Nati sunt autem filii Jerameel primogeniti Hesron, Ram primogenitus ejus, et Buna, et Aram, et Asom, et Achia."
      en: "And the sons of Jerameel the firstborn of Hesron, were Ram his firstborn, and Buna, and Aram, and Asom, and Achia."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Duxit quoque uxorem alteram Jerameel, nomine Atara, quae fuit mater Onam."
      en: "And Jerameel married another wife, named Atara, who was the mother of Onam."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Sed et filii Ram primogeniti Jerameel fuerunt Moos, Jamin, et Achar."
      en: "And the sons of Ram the firstborn of Jerameel, were Moos, Jamin, and Achar."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Onam autem habuit filios Semei, et Jada. Filii autem Semei: Nadab, et Abisur."
      en: "And Onam had sons Semei, and Jada. And the sons of Semei: Nadab, and Abisur."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Nomen vero uxoris Abisur, Abihail, quae peperit ei Ahobban, et Molid."
      en: "And the name of Abisur's wife was Abihail, who bore him Ahobban, and Molid."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Filii autem Nadab fuerunt Saled, et Apphaim. Mortuus est autem Saled absque liberis."
      en: "And the sons of Nadab were Saled, and Apphaim. And Saled died without children."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Filius vero Apphaim, Jesi: qui Jesi genuit Sesan. Porro Sesan genuit Oholai."
      en: "But the son of Apphaim was Jesi: and Jesi beget Sesan. And Sesan beget Oholai."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Filii autem Jada fratris Semei: Jether, et Jonathan. Sed et Jether mortuus est absque liberis."
      en: "And the sons of Jada the brother of Semei: Jether and Jonathan. And Jether also died without children."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Porro Jonathan genuit Phaleth, et Ziza. Isti fuerunt filii Jerameel."
      en: "But Jonathan beget Phaleth, and Ziza, These were the sons of Jerameel."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Sesan autem non habuit filios, sed filias: et servum aegyptium nomine Jeraa."
      en: "And Sesan had no sons, but daughters and a servant an Egyptian, named Jeraa."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Deditque ei filiam suam uxorem: quae peperit ei Ethei."
      en: "And he gave him his daughter to wife: and she bore him Ethei."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Ethei autem genuit Nathan, et Nathan genuit Zabad."
      en: "And Ethei begot Nathan, and Nathan beget Zabad."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Zabad quoque genuit Ophlal, et Ophlal genuit Obed."
      en: "And Zabad beget Ophlal, and Ophlal beget Obed."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Obed genuit Jehu, Jehu genuit Azariam,"
      en: "Obed beget Jehu, Jehu beget Azarias."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Azarias genuit Helles, et Helles genuit Elasa."
      en: "Azarias beget Helles, and Helles begot Elasa."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Elasa genuit Sisamoi, Sisamoi genuit Sellum,"
      en: "Elasa beget Sisamoi, Sisamoi beget Sellum,"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Sellum genuit Icamiam, Icamia autem genuit Elisama."
      en: "Sellum beget Icamia, and Icamia begot Elisama."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Filii autem Caleb fratris Jerameel: Mesa primogenitus ejus, ipse est pater Ziph, et filii Maresa patris Hebron."
      en: "Now the sons of Caleb the brother of Jerameel were Mesa his firstborn, who was the father of Siph: and the sons of Maresa father of Hebron."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Porro filii Hebron, Core, et Taphua, et Recem, et Samma."
      en: "And the sons of Hebron, Core, and Thaphua, and Recem, and Samma."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Samma autem genuit Raham, patrem Jercaam, et Recem genuit Sammai."
      en: "And Samma beget Raham, the father of Jercaam, and Recem beget Sammai."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Filius Sammai, Maon: et Maon pater Bethsur."
      en: "The son of Sammai, Maon: and Maon the father of Bethsur."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Epha autem concubina Caleb peperit Haran, et Mosa, et Gezez. Porro Haran genuit Gezez."
      en: "And Epha the concubine of Caleb bore Haran, and Mesa, and Gezez. And Haran beget Gezez."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Filii autem Jahaddai, Regom, et Joathan, et Gesan, et Phalet, et Epha, et Saaph."
      en: "And the sons of Jahaddai, Rogom, and Joathan, and Gesan, and Phalet, and Epha, and Saaph."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Concubina Caleb Maacha, peperit Saber, et Tharana."
      en: "And Maacha the concubine of Caleb bore Saber, and Tharana."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Genuit autem Saaph pater Madmena, Sue patrem Machbena, et patrem Gabaa. Filia vero Caleb fuit Achsa."
      en: "And Saaph the father of Madmena beget Sue the father of Machbena, and the father of Gabaa. And the daughter of Caleb was Achsa."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Hi erant filii Caleb, filii Hur primogeniti Ephratha, Sobal pater Cariathiarim."
      en: "These were the sons of Caleb, the son of Hur the firstborn of Ephrata, Sobal the father of Cariathiarim."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Salma pater Bethlehem, Hariph pater Bethgader."
      en: "Salma the father of Bethlehem, Hariph the father of Bethgader."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Fuerunt autem filii Sobal patris Cariathiarim, qui videbat dimidium requietionum."
      en: "And Sobal the father of Cariathiarim had sons: he that saw half of the places of rest."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Et de cognatione Cariathiarim, Jethrei, et Aphuthei, et Semathei, et Maserei. Ex his egressi sunt Saraitae, et Esthaolitae."
      en: "And of the kindred of Cariathiarim, the Jethrites, and Aphuthites, and Semathites, and Maserites. Of them came the Saraites, and Esthaolites."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Filii Salma, Bethlehem, et Netophathi, coronae domus Joab, et dimidium requietionis Sarai."
      en: "The sons of Salma, Bethlehem, and Netophathi, the crowns of the house of Joab, and half of the place of rest of Sarai."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Cognationes quoque scribarum habitantium in Jabes, canentes atque resonantes, et in tabernaculis commorantes. Hi sunt Cinaei, qui venerunt de Calore patris domus Rechab."
      en: "And the families of the scribes that dwell in Jabes, singing and making melody, and abiding in tents. These are the Cinites, who came of Calor (Chamath) father of the house of Rechab,"
    status: { la: verified, en: verified }
