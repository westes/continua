# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: deut
chapter: 30
verses:
  - n: 1
    text:
      la: "cum ergo venerint super te omnes sermones isti benedictio sive maledictio quam proposui in conspectu tuo et ductus paenitudine cordis tui in universis gentibus in quas disperserit te Dominus Deus tuus"
      en: "Now when all these things shall be come upon thee, the blessing or the curse, which I have set forth before thee, and thou shalt be touched with repentance of thy heart among all the nations, into which the Lord thy God shall have scattered thee,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "reversus fueris ad eum et oboedieris eius imperiis sicut ego hodie praecipio tibi cum filiis tuis in toto corde tuo et in tota anima tua"
      en: "And shalt return to him, and obey his commandments, as I command thee this day, thou and thy children, with all thy heart, and with all thy soul:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "reducet Dominus Deus tuus captivitatem tuam ac miserebitur tui et rursum congregabit te de cunctis populis in quos te ante dispersit"
      en: "The Lord thy God will bring back again thy captivity, and will have mercy on thee, and gather thee again out of all the nations, into which he scattered thee before."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "si ad cardines caeli fueris dissipatus inde te retrahet Dominus Deus tuus"
      en: "If thou be driven as far as the poles of heaven, the Lord thy God will fetch thee back from thence,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et adsumet atque introducet in terram quam possederunt patres tui et obtinebis eam et benedicens tibi maioris numeri esse te faciet quam fuerunt patres tui"
      en: "And will take thee to himself, and bring thee into the land which thy fathers possessed, and thou shalt possess it: and blessing thee, he will make thee more numerous than were thy fathers."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "circumcidet Dominus Deus tuus cor tuum et cor seminis tui ut diligas Dominum Deum tuum in toto corde tuo et in tota anima tua et possis vivere"
      en: "The Lord thy God will circumcise thy heart, and the heart of thy seed: that then mayst love the Lord thy God with all thy heart and with all thy soul, that thou mayst live."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "omnes autem maledictiones has convertet super inimicos tuos et eos qui oderunt te et persequuntur"
      en: "And he will turn all these curses upon thy enemies, and upon them that hate and persecute thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "tu autem reverteris et audies vocem Domini Dei tui faciesque universa mandata quae ego praecipio tibi hodie"
      en: "But thou shalt return, and hear the voice of the Lord thy God, and shalt do all the commandments which I command thee this day:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et abundare te faciet Dominus Deus tuus in cunctis operibus manuum tuarum in subole uteri tui et in fructu iumentorum tuorum in ubertate terrae tuae et in rerum omnium largitate revertetur enim Dominus ut gaudeat super te in omnibus bonis sicut gavisus est in patribus tuis"
      en: "And the Lord thy God will make thee abound in all the works of thy hands, in the fruit of thy womb, and in the fruit of thy cattle, in the fruitfulness of thy land, and in the plenty of all things. For the Lord will return to rejoice over thee in all good things, as he rejoiced in thy fathers:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "si tamen audieris vocem Domini Dei tui et custodieris praecepta eius et caerimonias quae in hac lege conscriptae sunt et revertaris ad Dominum Deum tuum in toto corde tuo et in tota anima tua"
      en: "Yet so if thou hear the voice of the Lord thy God, and keep his precepts and ceremonies, which are written in this law: and return to the Lord thy God with all thy heart, and with all thy soul."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "mandatum hoc quod ego praecipio tibi hodie non supra te est neque procul positum"
      en: "This commandment, that I command thee this day is not above thee, nor far off from thee:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nec in caelo situm ut possis dicere quis nostrum ad caelum valet conscendere ut deferat illud ad nos et audiamus atque opere conpleamus"
      en: "Nor is it in heaven, that thou shouldst say: Which of us can go up to heaven to bring it unto us, and we may hear and fulfil it in work?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "neque trans mare positum ut causeris et dicas quis e nobis transfretare poterit mare et illud ad nos usque deferre ut possimus audire et facere quod praeceptum est"
      en: "Nor is it beyond the sea: that thou mayst excuse thyself, and say: Which of us can cross the sea, and bring it unto us: that we may hear, and do that which is commanded?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sed iuxta te est sermo valde in ore tuo et in corde tuo ut facias illum"
      en: "But the word is very nigh unto thee, in thy mouth and in thy heart, that thou mayst do it."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "considera quod hodie proposuerim in conspectu tuo vitam et bonum et e contrario mortem et malum"
      en: "Consider that I have set before thee this day life and good, and on the other hand death and evil:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ut diligas Dominum Deum tuum et ambules in viis eius et custodias mandata illius et caerimonias atque iudicia et vivas ac multiplicet te benedicatque tibi in terra ad quam ingredieris possidendam"
      en: "That thou mayst love the Lord thy God, and walk in his ways, and keep his commandments and ceremonies and judgments, and thou mayst live, and he may multiply thee, and bless thee in the land, which thou shalt go in to possess."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sin autem aversum fuerit cor tuum et audire nolueris atque errore deceptus adoraveris deos alienos et servieris eis"
      en: "But if thy heart be turned away, so that thou wilt not hear, and being deceived with error thou adore strange gods, and serve them:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "praedico tibi hodie quod pereas et parvo tempore moreris in terra ad quam Iordane transmisso ingredieris possidendam"
      en: "I foretell thee this day that thou shalt perish, and shalt remain but a short time in the land, to which thou shalt pass over the Jordan, and shalt go in to possess it."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "testes invoco hodie caelum et terram quod proposuerim vobis vitam et mortem bonum et malum benedictionem et maledictionem elige ergo vitam ut et tu vivas et semen tuum"
      en: "I call heaven and earth to witness this day, that I have set before you life and death, blessing and cursing. Choose therefore life, that both thou and thy seed may live:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et diligas Dominum Deum tuum atque oboedias voci eius et illi adhereas ipse est enim vita tua et longitudo dierum tuorum ut habites in terra pro qua iuravit Dominus patribus tuis Abraham Isaac et Iacob ut daret eam illis"
      en: "And that thou mayst love the Lord thy God, and obey his voice, and adhere to him (for he is thy life, and the length of thy days,) that thou mayst dwell in the land, for which the Lord swore to thy fathers Abraham, Isaac, and Jacob that he would give it them."
    status: { la: verified, en: verified }
