# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: bar
chapter: 3
verses:
  - n: 1
    text:
      la: "et nunc Domine omnipotens Deus Israhel anima in angustiis et spiritus anxius clamat ad te"
      en: "And now, O Lord Almighty, the God of Israel, the soul in anguish, and the troubled spirit crieth to thee:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "audi Domine et miserere quia Deus es misericors et miserere nostri quia peccavimus ante te"
      en: "Hear, O Lord, and have mercy, for thou art a merciful God, and have pity on us: for we have sinned before thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quia tu sedes in sempiternum et nos peribimus in aevum"
      en: "For thou remainest for ever, and shall we perish everlastingly?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Domine omnipotens Deus Israhel audi nunc orationem mortuorum Israhel et filiorum ipsorum qui peccaverunt ante te et non audierunt vocem Domini Dei sui et adglutinata sunt nobis mala"
      en: "O Lord Almighty, the God of Israel, hear now the prayer of the dead of Israel, and of their children, that have sinned before thee, and have not hearkened to the voice of the Lord their God, wherefore evils have cleaved fast to us."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "noli meminisse iniquitates patrum nostrorum sed memento manus tuae et nominis tui in tempore isto"
      en: "Remember not the iniquities of our fathers, but think upon thy hand, and upon thy name at this time:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quia tu es Dominus Deus noster et laudabimus te Domine"
      en: "For thou art the Lord our God, and we will praise thee, O Lord:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quia propter hoc dedisti timorem tuum in cordibus nostris et ut invocemus nomen tuum et laudemus te in captivitate nostra quia convertemus iniquitatem patrum nostrorum qui peccaverunt ante te"
      en: "Because for this end thou hast put thy fear in our hearts, to the intent that we should call upon thy name, and praise thee in our captivity, for we are converted from the iniquity of our fathers, who sinned before thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et ecce nos hodie in captivitate nostra sumus quo nos dispersisti in inproperium et in maledictum et in peccatum secundum omnes iniquitates patrum nostrorum qui discesserunt a te Domine Deus noster"
      en: "And behold we are at this day in our captivity, whereby thou hast scattered us to be a reproach, and a curse, and an offence, according to all the iniquities of our fathers, who departed from thee, O Lord our God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "audi Israhel mandata vitae auribus percipite ut scias prudentiam"
      en: "Hear, O Israel, the commandments of life: give ear, that thou mayst learn wisdom."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quid est Israhel quid est quod in terra es inimicorum"
      en: "How happeneth it, O Israel, that thou art in thy enemies' land?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "inveterasti in terra aliena coinquinatus es cum mortuis deputatus es cum descendentibus in infernum"
      en: "Thou art grown old in a strange country, thou art defiled with the dead: thou art counted with them that go down into hell."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dereliquisti fontem sapientiae"
      en: "Thou hast forsaken the fountain of wisdom :"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "si in via Dei ambulasses habitasses in pace sempiterna"
      en: "For if thou hadst walked in the way of God, thou hadst surely dwelt in peace for ever."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "disce ubi sit prudentia ubi sit virtus ubi sit intellectus ut scias simul ubi sit longiturnitas vitae et victus ubi sit lumen oculorum et pax"
      en: "Learn where is wisdom, where is strength, where is understanding: that thou mayst know also where is length of days and life, where is the light of the eyes, and peace."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quis invenit locum eius et quis intravit in thesauros eius"
      en: "Who hath found out her place? and who hath gone in to her treasures?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ubi sunt principes gentium et qui dominantur super bestias quae sunt super terram"
      en: "Where are the princes of the nations, and they that rule over the beasts that are upon the earth?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qui in avibus caeli inludunt"
      en: "That take their diversion with the birds of the air."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui argentum thesaurizant et aurum in quo confidebant homines et non est finis adquisitionis eorum qui argentum fabricant et solliciti sunt nec est inventio operum illorum"
      en: "That hoard up silver and gold, wherein men trust, and there is no end of their getting? who work in silver and are solicitous, and their works are unsearchable."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "exterminati sunt et ad inferos descenderunt et alii loco eorum exsurrexerunt"
      en: "They are cut off, and are gone down to hell, and others are risen up in their place."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "iuvenes viderunt lumen et habitaverunt super terram viam autem disciplinae ignoraverunt"
      en: "Young men have seen the light, and dwelt upon the earth: but the way of knowledge they have not known,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "neque intellexerunt semitas eius neque filii eorum susceperunt eam a facie ipsorum longe facta est"
      en: "Nor have they understood the paths thereof, neither have their children received it, it is far from their face."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "non est audita in terra Chanaan neque visa est in Theman"
      en: "It hath not been heard of in the land of Chanaan, neither hath it been seen in Theman."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "filii quoque Agar qui exquirunt prudentiam quae de terra est negotiatores Merrae et Theman et fabulatores et exquisitores intellegentiae viam autem sapientiae nescierunt neque commemorati sunt semitas eius"
      en: "The children of Agar also, that search after the wisdom that is of the earth, the merchants of Merrha, and of Theman, and the tellers of fables, and searchers of prudence and understanding: but the way of wisdom they have not known, neither have they remembered her paths."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "o Israhel quam magna est domus Dei et ingens locus possessionis eius"
      en: "O Israel, how great is the house of God, and how vast is the place of his possession!"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "magnus et non habet finem excelsus et inmensus"
      en: "It is great, and hath no end: it is high and immense."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ibi fuerunt gigantes nominati illi qui ab initio fuerunt statura magna scientes bellum"
      en: "There were the giants, those renowned men that were from the beginning, of great stature, expert in war."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "non hos elegit Deus neque viam disciplinae dedit illis et perierunt"
      en: "The Lord chose not them, neither did they find the way of knowledge: therefore did they perish."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "eo quod non haberent sapientiam et perierunt propter insipientiam suam"
      en: "And because they had not wisdom, they perished through their folly."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quis ascendit in caelum et accepit eam et deduxit eam de nubibus"
      en: "Who hath gone up into heaven, and taken her, and brought her down from the clouds?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quis transfretavit mare et invenit illam et adtulit illam super aurum electum"
      en: "Who hath passed over the sea, and found her, and brought her preferably to chosen gold?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "non est qui possit scire viam eius neque qui exquirat semitas eius"
      en: "There is none that is able to know her ways, nor that can search out her paths :"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "sed qui scit universa novit eam et invenit eam prudentia sua qui praeparavit terram in aeterno tempore et replevit eam pecudibus et quadrupedibus"
      en: "But he that knoweth all things, knoweth her, and hath found her out with his understanding: he that prepared the earth for evermore, and filled it with cattle and fourfooted beasts:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "qui emittit lumen et vadit et vocavit illud et obaudit illi in tremore"
      en: "He that sendeth forth light, and it goeth: and hath called it, and it obeyeth him with trembling."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "stellae autem lumen dederunt in custodiis suis et laetatae sunt"
      en: "And the stars have given light in their watches, and rejoiced:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "vocatae sunt et dixerunt adsumus et luxerunt ei cum iucunditate qui fecit illas"
      en: "They were called, and they said: Here we are: and with cheerfuIness they have shined forth to him that made them."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "hic Deus noster non aestimabitur alius adversus eum"
      en: "This is our God, and there shall no other be accounted of in comparison of him."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "hic adinvenit omnem viam disciplinae et tradidit illam Iacob puero suo et Israhel dilecto suo"
      en: "He found out all the way of knowledge, and gave it to Jacob his servant, and to Israel his beloved."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "post haec in terris visus est et cum hominibus conversatus est"
      en: "Afterwards he was seen upon earth, and conversed with men."
    status: { la: verified, en: verified }
