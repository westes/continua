# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: zach
chapter: 12
verses:
  - n: 1
    text:
      la: "Onus verbi Domini super Israel. Dicit Dominus extendens caelum, et fundans terram, et fingens spiritum hominis in eo:"
      en: "The burden of the word of the Lord upon Israel. Thus saith the Lord, who stretcheth forth the heavens, and layeth the foundations of the earth, and formeth the spirit of man in him:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ecce ego ponam Jerusalem superliminare crapulae omnibus populis in circuitu: sed et Juda erit in obsidione contra Jerusalem."
      en: "Behold I will make Jerusalem a lintel of surfeiting to all the people round about: and Juda also shall be in the siege against Jerusalem."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et erit: in die illa ponam Jerusalem lapidem oneris cunctis populis: omnes qui levabunt eam concisione lacerabuntur, et colligentur adversus eam omnia regna terrae."
      en: "And it shall come to pass in that day, that I will make Jerusalem a burdensome stone to all people: all that shall lift it up shall be rent and torn, and all the kingdoms of the earth shall be gathered together against her."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "In die illa, dicit Dominus, percutiam omnem equum in stuporem, et ascensorem ejus in amentiam: et super domum Juda aperiam oculos meos, et omnem equum populorum percutiam caecitate."
      en: "In that day, saith the Lord, I will strike every horse with astonishment, and his rider with madness: and I will open my eyes upon the house of Juda, and will strike every horse of the nations with blindness."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et dicent duces Juda in corde suo: Confortentur mihi habitatores Jerusalem in Domino exercituum, Deo eorum!"
      en: "And the governors of Juda shall say in their heart: Let the inhabitants of Jerusalem be strengthened for me in the Lord of hosts, their God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "In die illa ponam duces Juda sicut caminum ignis in lignis, et sicut facem ignis in foeno: et devorabunt ad dexteram et ad sinistram omnes populos in circuitu, et habitabitur Jerusalem rursus in loco suo in Jerusalem."
      en: "In that day I will make the governors of Juda like a furnace of fire amongst wood, and as a firebrand amongst hay: and they shall devour all the people round about, to the right hand, and to the left: and Jerusalem shall be inhabited again in her own place in Jerusalem."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et salvabit Dominus tabernacula Juda, sicut in principio, ut non magnifice glorietur domus David, et gloria habitantium Jerusalem contra Judam."
      en: "And the Lord shall save the tabernacles of Juda, as in the beginning: that the house of David, and the glory of the inhabitants of Jerusalem, may not boast and magnify themselves against Juda."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "In die illa proteget Dominus habitatores Jerusalem: et erit qui offenderit ex eis in die illa quasi David, et domus David quasi Dei, sicut angelus Domini in conspectu eorum."
      en: "In that day shall the Lord protect the inhabitants of Jerusalem, and he that hath offended among them in that day shall be as David: and the house of David, as that of God, as an angel of the Lord in their sight."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et erit in die illa: quaeram conterere omnes gentes quae veniunt contra Jerusalem."
      en: "And it shall come to pass in that day, that I will seek to destroy all the nations that come against Jerusalem."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et effundam super domum David et super habitatores Jerusalem spiritum gratiae et precum: et aspicient ad me quem confixerunt, et plangent eum planctu quasi super unigenitum, et dolebunt super eum, ut doleri solet in morte primogeniti."
      en: "And I will pour out upon the house of David, and upon the inhabitants of Jerusalem, the spirit of grace, and of prayers: and they shall look upon me, whom they have pierced: and they shall mourn for him as one mourneth for an only son, and they shall grieve over him, as the manner is to grieve for the death of the firstborn."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "In die illa, magnus erit planctus in Jerusalem, sicut planctus Adadremmon in campo Mageddon."
      en: "In that day there shall be a great lamentation in Jerusalem like the lamentation of Adadremmon in the plain of Mageddon."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et planget terra: familiae et familiae seorsum: familiae domus David seorsum, et mulieres eorum seorsum:"
      en: "And the land shall mourn: families and families apart: the families of the house of David apart, and their women apart:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "familiae domus Nathan seorsum, et mulieres eorum seorsum: familiae domus Levi seorsum, et mulieres eorum seorsum: familiae Semei seorsum, et mulieres eorum seorsum:"
      en: "The families of the house of Nathan apart, and their women apart: the families of the house of Levi apart, and their women apart: the families of Semei apart, and their women apart."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "omnes familiae reliquae, familiae et familiae seorsum, et mulieres eorum seorsum."
      en: "All the rest of the families, families and families apart, and their women apart."
    status: { la: verified, en: verified }
