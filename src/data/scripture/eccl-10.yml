# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: eccl
chapter: 10
verses:
  - n: 1
    text:
      la: "Muscae morientes perdunt suavitatem unguenti. Pretiosior est sapientia et gloria, parva et ad tempus stultitia."
      en: "Dying flies spoil the sweetness of the ointment. Wisdom and glory is more precious than a small and shortlived folly."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cor sapientis in dextera ejus, et cor stulti in sinistra illius."
      en: "The heart of a wise man is in his right hand, and the heart of a fool is in his left hand."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sed et in via stultus ambulans, cum ipse insipiens sit, omnes stultos aestimat."
      en: "Yea, and the fool when he walketh in the way, whereas he himself is a fool, esteemeth all men fools."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Si spiritus potestatem habentis ascenderit super te, locum tuum ne demiseris, quia curatio faciet cessare peccata maxima."
      en: "If the spirit of him that hath power, ascend upon thee, leave not thy place: because care will make the greatest sins to cease."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Est malum quod vidi sub sole, quasi per errorem egrediens a facie principis:"
      en: "There is an evil that I have seen under the sun, as it were by an error proceeding from the face of the prince:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "positum stultum in dignitate sublimi, et divites sedere deorsum."
      en: "A fool set in high dignity, and the rich sitting beneath."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Vidi servos in equis, et principes ambulantes super terram quasi servos."
      en: "I have seen servants upon horses: and princes walking on the ground as servants."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Qui fodit foveam incidet in eam, et qui dissipat sepem mordebit eum coluber."
      en: "He that diggeth a pit, shall fall into it: and he that breaketh a hedge, a serpent shall bite him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Qui transfert lapides affligetur in eis, et qui scindit ligna vulnerabitur ab eis."
      en: "He that removeth stones, shall be hurt by them: and he that cutteth trees, shall be wounded by them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Si retusum fuerit ferrum, et hoc non ut prius, sed hebetatum fuerit, multo labore exacuetur, et post industriam sequetur sapientia."
      en: "If the iron be blunt, and be not as before, but be made blunt, with much labour it shall be sharpened: and after industry shall follow wisdom."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Si mordeat serpens in silentio, nihil eo minus habet qui occulte detrahit."
      en: "If a serpent bite in silence, he is nothing better that backbiteth secretly."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Verba oris sapientis gratia, et labia insipientis praecipitabunt eum;"
      en: "The words of the mouth of a wise man are grace: but the lips of a fool shall throw him down headlong."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "initium verborum ejus stultitia, et novissimum oris illius error pessimus."
      en: "The beginning of his words is folly, and the end of his talk is a mischievous error."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Stultus verba multiplicat. Ignorat homo quid ante se fuerit; et quid post se futurum sit, quis ei poterit indicare?"
      en: "A fool multiplieth words. A man cannot tell what hath been before him: and what shall be after him, who can tell him?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Labor stultorum affliget eos, qui nesciunt in urbem pergere."
      en: "The labour of fools shall afflict them that know not how to go to the city."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Vae tibi, terra, cujus rex puer est, et cujus principes mane comedunt."
      en: "Woe to thee, O land, when thy king is a child, and when the princes eat in the morning."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Beata terra cujus rex nobilis est, et cujus principes vescuntur in tempore suo, ad reficiendum, et non ad luxuriam."
      en: "Blessed is the land, whose king is noble, and whose princes eat in due season for refreshment, and not for riotousness."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "In pigritiis humiliabitur contignatio, et in infirmitate manuum perstillabit domus."
      en: "By slothfulness a building shall be brought down, and through the weakness of hands, the house shall drop through."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "In risum faciunt panem et vinum ut epulentur viventes; et pecuniae obediunt omnia."
      en: "For laughter they make bread, and wine that the living may feast: and all things obey money."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "In cogitatione tua regi ne detrahas, et in secreto cubiculi tui ne maledixeris diviti: quia et aves caeli portabunt vocem tuam, et qui habet pennas annuntiabit sententiam."
      en: "Detract not the king, no not in thy thought; and speak not evil of the rich man in thy private chamber: because even the birds of the air will carry thy voice, and he that hath wings will tell what thou hast said."
    status: { la: verified, en: verified }
