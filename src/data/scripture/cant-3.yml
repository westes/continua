# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: cant
chapter: 3
verses:
  - n: 1
    text:
      la: "in lectulo meo per noctes quaesivi quem diligit anima mea quaesivi illum et non inveni"
      en: "In my bed by night I sought him whom my soul loveth: I sought him, and found him not."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "surgam et circuibo civitatem per vicos et plateas quaeram quem diligit anima mea quaesivi illum et non inveni"
      en: "I will rise, and will go about the city: in the streets and the broad ways I will seek him whom my soul loveth: I sought him, and I found him not."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "invenerunt me vigiles qui custodiunt civitatem num quem dilexit anima mea vidistis"
      en: "The watchmen who keep the city, found me: Have you seen him, whom my soul loveth?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "paululum cum pertransissem eos inveni quem diligit anima mea tenui eum nec dimittam donec introducam illum in domum matris meae et in cubiculum genetricis meae"
      en: "When I had a little passed by them, I found him whom my soul loveth: I held him: and I will not let him go, till I bring him into my mother's house, and into the chamber of her that bore me."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "adiuro vos filiae Hierusalem per capreas cervosque camporum ne suscitetis neque evigilare faciatis dilectam donec ipsa velit"
      en: "I adjure you, O daughters of Jerusalem, by the roes and the harts of the fields, that you stir not up, nor awake my beloved, till she please."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quae est ista quae ascendit per desertum sicut virgula fumi ex aromatibus murrae et turis et universi pulveris pigmentarii"
      en: "Who is she that goeth up by the desert, as a pillar of smoke of aromatical spices, of myrrh, and frankincense, and of all the powders of the perfumer?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "en lectulum Salomonis sexaginta fortes ambiunt ex fortissimis Israhel"
      en: "Behold threescore valiant ones of the most valiant of Israel, surrounded the bed of Solomon?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "omnes tenentes gladios et ad bella doctissimi uniuscuiusque ensis super femur suum propter timores nocturnos"
      en: "All holding swords, and most expert in war : every man's sword upon his thigh, because of fears in the night."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ferculum fecit sibi rex Salomon de lignis Libani"
      en: "King Solomon hath made him a litter of the wood of Libanus:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "columnas eius fecit argenteas reclinatorium aureum ascensum purpureum media caritate constravit propter filias Hierusalem"
      en: "The pillars thereof he made of silver, the seat of gold, the going up of purple : the midst he covered with charity for the daughters of Jerusalem."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "egredimini et videte filiae Sion regem Salomonem in diademate quo coronavit eum mater sua in die disponsionis illius et in die laetitiae cordis eius"
      en: "Go forth, ye daughters of Sion, and see king Solomon in the diadem, wherewith his mother crowned him in the day of his espousals, and in the day of the joy of his heart."
    status: { la: verified, en: verified }
