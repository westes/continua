book: 2esdr
chapter: 11
verses:
  - n: 1
    text:
      la: "habitaverunt autem principes populi in Hierusalem reliqua vero plebs misit sortem ut tollerent unam partem de decem qui habitaturi essent in Hierusalem in civitate sancta novem vero partes in civitatibus"
      en: "And the princes of the people dwelt at Jerusalem: but the rest of the people cast lots, to take one part in ten to dwell in Jerusalem the holy city, and nine parts in the other cities."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "benedixit autem populus omnibus viris qui se sponte obtulerunt ut habitarent in Hierusalem"
      en: "And the people blessed all the men that willingly offered themselves to dwell in Jerusalem."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "hii sunt itaque principes provinciae qui habitaverunt in Hierusalem et in civitatibus Iuda habitavit unusquisque in possessione sua in urbibus suis Israhel sacerdotes Levitae Nathinnei et filii servorum Salomonis"
      en: "These therefore are the chief men of the province, who dwelt in Jerusalem, and in the cities of Juda. And every one dwelt in his possession, in their cities: Israel, the priests, the Levites, the Nathinites, and the children of the servants of Solomon."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et in Hierusalem habitaverunt de filiis Iuda et de filiis Beniamin de filiis Iuda Athaias filius Aziam filii Zacchariae filii Amariae filii Saphatia filii Malelehel de filiis Phares"
      en: "And in Jerusalem there dwelt some of the children of Juda, and some of the children of Benjamin: of the children of Juda, Athaias the son of Aziam, the son of Zacharias, the son of Amarias, the son of Saphatias, the son of Malaleel: of the sons of Phares,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Imaasia filius Baruch filius Coloza filius Azia filius Adaia filius Ioiarib filius Zacchariae filius Silonites"
      en: "Maasia the son of Baruch, the son of Cholhoza, the son of Hazia, the son of Adaia, the son of Joiarib, the son of Zacharias, the son of the Silonite:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "omnes filii Phares qui habitaverunt in Hierusalem quadringenti sexaginta octo viri fortes"
      en: "All these the sons of Phares, who dwelt in Jerusalem, were four hundred sixty-eight valiant men."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "hii sunt autem filii Beniamin Sellum filius Mosollam filius Ioed filius Phadaia filius Colaia filius Masia filius Ethehel filius Isaia"
      en: "And these are the children of Benjamin: Sellum the son of Mosollam, the son of Joed, the son of Phadaia, the son of Colaia, the son of Masia, the son of Etheel, the son of Isaia."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et post eum Gabbai Sellai nongenti viginti octo"
      en: "And after him Gebbai, Sellai, nine hundred twenty-eight."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et Iohel filius Zechri praepositus eorum et Iuda filius Sennua super civitatem secundus"
      en: "And Joel the son of Zechri their ruler, and Judas the son of Senua was second over the city."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et de sacerdotibus Idaia filius Ioarib Iachin"
      en: "And of the priests Idaia the son of Joarib, Jachin,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Saraia filius Elcia filius Mesollam filius Sadoc filius Meraioth filius Ahitub princeps domus Dei"
      en: "Saraia the son of Helcias, the son of Mosollam, the son of Sadoc, the son of Meraioth, the son of Achitob the prince of the house of God,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et fratres eorum facientes opera templi octingenti viginti duo et Adaia filius Ieroam filius Felelia filius Amsi filius Zacchariae filius Phessur filius Melchiae"
      en: "And their brethren that do the works of the temple: eight hundred twenty- two. And Adaia the son of Jeroham, the son of Phelelia, the son of Amsi, the son of Zacharias, the son of Pheshur, the son of Melchias,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et fratres eius principes patrum ducenti quadraginta duo et Amassai filius Azrihel filius Aazi filius Mosollamoth filius Emmer"
      en: "And his brethren the chiefs of the fathers: two hundred forty-two. And Amassai the son of Azreel, the son of Ahazi, the son of Mosollamoth, the son of Emmer,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et fratres eorum potentes nimis centum viginti octo et praepositus eorum Zabdihel filius potentium"
      en: "And their brethren who were very mighty, a hundred twenty-eight: and their ruler Zabdiel son of the mighty."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et de Levitis Sebenia filius Asob filius Azaricam filius Asabia filius Boni"
      en: "And of the Levites Semeia the son of Hasub, the son of Azaricam, the son of Hasabia, the son of Boni,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et Sabathai et Iozabed super opera quae erant forinsecus in domo Dei a principibus Levitarum"
      en: "And Sabathai and Jozabed, who were over all the outward business of the house of Cod, of the princes of the Levites,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et Mathania filius Micha filius Zebdaei filius Asaph princeps ad laudandum et confitendum in oratione et Becbecia secundus de fratribus eius et Abda filius Sammua filius Galal filius Idithun"
      en: "And Mathania the son of Micha, the son of Zebedei, the son of Asaph, was the principal man to praise, and to give glory in prayer, and Becbecia the second, one of his brethren, and Abda the son of Samua, the son of Galal, the son of Idithun."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "omnes Levitae in civitate sancta ducenti octoginta quattuor"
      en: "All the Levites in the holy city were two hundred eighty-four."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et ianitores Accob Telmon et fratres eorum qui custodiebant ostia centum septuaginta duo"
      en: "And the porters, Accub, Telmon, and their brethren, who kept the doors: a hundred seventy-two."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et reliqui ex Israhel sacerdotes et Levitae in universis civitatibus Iuda unusquisque in possessione sua"
      en: "And the rest of Israel, the priests and the Levites were in all the cities of Juda, every man in his possession."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et Nathinnei qui habitabant in Ofel et Siaha et Gaspha de Nathinneis"
      en: "And the Nathinites, that dwelt in Ophel, and Siaha, and Gaspha of the Nathinites."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et episcopus Levitarum in Hierusalem Azzi filius Bani filius Asabiae filius Matthaniae filius Michae de filiis Asaph cantores in ministerio domus Dei"
      en: "And the overseer of the Levites in Jerusalem, was Azzi the son of Bani, the son of Hasabia, the son of Mathania, the son of Micha. Of the sons of Asaph, were the singing men in the ministry of the house of Cod."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "praeceptum quippe regis super eos erat et ordo in cantoribus per dies singulos"
      en: "For the king's commandment was concerning them, and an order among the singing men day by day."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et Fataia filius Mesezebel de filiis Zera filii Iuda in manu regis iuxta omne verbum populi"
      en: "And Phathahia the son of Mesezebel of the children of Zara the son of Juda was at the hand of the king, in all matters concerning the people,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et in domibus per omnes regiones eorum de filiis Iuda habitaverunt in Cariatharbe et in filiabus eius et in Dibon et in filiabus eius et in Capsel et in viculis eius"
      en: "And in the houses through all their countries. Of the children of Juda so dwelt at Cariath-Arbe, and in the villages thereof: and at Dibon, and in the villages thereof: and at Cabseel, and in the villages thereof."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et in Iesue et in Molada et in Bethfaleth"
      en: "And at Jesue, and at Molada, and Bethphaleth,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et in Asersual et in Bersabee et in filiabus eius"
      en: "And at Hasersual, and at Bersabee, and in the villages thereof,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et in Siceleg et in Mochona et in filiabus eius"
      en: "And at Siceleg, and at Mochona, and in the villages thereof,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et in Ainremmon et in Sara et in Irimuth"
      en: "And at Remmon, and at Saraa, and at Jerimuth,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Zanoa Odollam et villis earum Lachis et regionibus eius Azeca et filiabus eius et manserunt in Bersabee usque ad vallem Ennom"
      en: "Zanoa, Odollam, and in their villages, at Lachis and its dependencies, and at Azeca and the villages thereof. And they dwelt from Bersabee unto the valley of Ennom."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "filii autem Beniamin a Geba Mechmas et Aia et Bethel et filiabus eius"
      en: "And the children of Benjamin, from Geba, at Mechmas, and at Hai, and at Bethel, and in the villages thereof,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Anathoth Nob Anania"
      en: "At Anathoth, Nob, Anania,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Asor Rama Getthaim"
      en: "Asor, Rama, Gethaim,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Adid Seboim Neballa Loth"
      en: "Hadid, Seboim, and Neballat, Led,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et Ono valle Artificum"
      en: "And Ono the valley of craftsmen."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et de Levitis partitiones Iuda et Beniamin"
      en: "And of the Levites were portions of Juda and Benjamin."
    status: { la: verified, en: verified }
