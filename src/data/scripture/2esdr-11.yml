# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2esdr
chapter: 11
verses:
  - n: 1
    text:
      la: "Habitaverunt autem principes populi in Jerusalem: reliqua vero plebs misit sortem, ut tollerent unam partem de decem qui habitaturi essent in Jerusalem civitate sancta, novem vero partes in civitatibus."
      en: "And the princes of the people dwelt at Jerusalem: but the rest of the people cast lots, to take one part in ten to dwell in Jerusalem the holy city, and nine parts in the other cities."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Benedixit autem populus omnibus viris qui se sponte obtulerant ut habitarent in Jerusalem."
      en: "And the people blessed all the men that willingly offered themselves to dwell in Jerusalem."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Hi sunt itaque principes provinciae qui habitaverunt in Jerusalem, et in civitatibus Juda. Habitavit autem unusquisque in possessione sua, in urbibus suis, Israel, sacerdotes, Levitae, Nathinaei, et filii servorum Salomonis."
      en: "These therefore are the chief men of the province, who dwelt in Jerusalem, and in the cities of Juda. And every one dwelt in his possession, in their cities: Israel, the priests, the Levites, the Nathinites, and the children of the servants of Solomon."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et in Jerusalem habitaverunt de filiis Juda, et de filiis Benjamin: de filiis Juda, Athaias filius Aziam, filii Zachariae, filii Amariae, filii Saphatiae, filii Melaleel: de filiis Phares,"
      en: "And in Jerusalem there dwelt some of the children of Juda, and some of the children of Benjamin: of the children of Juda, Athaias the son of Aziam, the son of Zacharias, the son of Amarias, the son of Saphatias, the son of Malaleel: of the sons of Phares,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Maasia filius Baruch, filius Cholhoza, filius Hazia, filius Adaia, filius Jojarib, filius Zachariae, filius Silonitis:"
      en: "Maasia the son of Baruch, the son of Cholhoza, the son of Hazia, the son of Adaia, the son of Joiarib, the son of Zacharias, the son of the Silonite:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "omnes hi filii Phares, qui habitaverunt in Jerusalem, quadringenti sexaginta octo viri fortes."
      en: "All these the sons of Phares, who dwelt in Jerusalem, were four hundred sixty-eight valiant men."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Hi sunt autem filii Benjamin: Sellum filius Mosollam, filius Joed, filius Phadaia, filius Colaia, filius Masia, filius Etheel, filius Isaia,"
      en: "And these are the children of Benjamin: Sellum the son of Mosollam, the son of Joed, the son of Phadaia, the son of Colaia, the son of Masia, the son of Etheel, the son of Isaia."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et post eum Gebbai, Sellai, nongenti viginti octo,"
      en: "And after him Gebbai, Sellai, nine hundred twenty-eight."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et Joel filius Zechri praepositus eorum, et Judas filius Senua super civitatem secundus."
      en: "And Joel the son of Zechri their ruler, and Judas the son of Senua was second over the city."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et de sacerdotibus, Idaia filius Joarib, Jachin,"
      en: "And of the priests Idaia the son of Joarib, Jachin,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Saraia filius Helciae, filius Mosollam, filius Sadoc, filius Meraioth, filius Achitob princeps domus Dei,"
      en: "Saraia the son of Helcias, the son of Mosollam, the son of Sadoc, the son of Meraioth, the son of Achitob the prince of the house of God,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et fratres eorum facientes opera templi: octingenti viginti duo. Et Adaia filius Jeroham, filius Phelelia, filius Amsi, filius Zachariae, filius Pheshur, filius Melchiae,"
      en: "And their brethren that do the works of the temple: eight hundred twenty-two. And Adaia the son of Jeroham, the son of Phelelia, the son of Amsi, the son of Zacharias, the son of Pheshur, the son of Melchias,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et fratres ejus principes patrum: ducenti quadraginta duo. Et Amassai filius Azreel, filius Ahazi, filius Mosollamoth, filius Emmer,"
      en: "And his brethren the chiefs of the fathers: two hundred forty-two. And Amassai the son of Azreel, the son of Ahazi, the son of Mosollamoth, the son of Emmer,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et fratres eorum potentes nimis: centum viginti octo, et praepositus eorum Zabdiel filius potentium."
      en: "And their brethren who were very mighty, a hundred twenty-eight: and their ruler Zabdiel son of the mighty."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et de Levitis, Semeia filius Hasub, filius Azaricam, filius Hasabia, filius Boni,"
      en: "And of the Levites Semeia the son of Hasub, the son of Azaricam, the son of Hasabia, the son of Boni,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et Sabathai et Jozabed, super omnia opera, quae erant forinsecus in domo Dei, a principibus Levitarum."
      en: "And Sabathai and Jozabed, who were over all the outward business of the house of God, of the princes of the Levites,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et Mathania filius Micha, filius Zebedei, filius Asaph, princeps ad laudandum et ad confitendum in oratione, et Becbecia secundus de fratribus ejus, et Abda filius Samua, filius Galal, filius Idithun:"
      en: "And Mathania the son of Micha, the son of Zebedei, the son of Asaph, was the principal man to praise, and to give glory in prayer, and Becbecia the second, one of his brethren, and Abda the son of Samua, the son of Galal, the son of Idithun."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "omnes Levitae in civitate sancta ducenti octoginta quatuor."
      en: "All the Levites in the holy city were two hundred eighty-four."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et janitores, Accub, Telmon, et fratres eorum, qui custodiebant ostia: centum septuaginta duo."
      en: "And the porters, Accub, Telmon, and their brethren, who kept the doors: a hundred seventy-two."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et reliqui ex Israel sacerdotes et Levitae in universis civitatibus Juda, unusquisque in possessione sua."
      en: "And the rest of Israel, the priests and the Levites were in all the cities of Juda, every man in his possession."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et Nathinaei, qui habitabant in Ophel, et Siaha, et Gaspha de Nathinaeis."
      en: "And the Nathinites, that dwelt in Ophel, and Siaha, and Gaspha of the Nathinites."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et episcopus Levitarum in Jerusalem, Azzi filius Bani, filius Hasabiae, filius Mathaniae, filius Michae. De filiis Asaph, cantores in ministerio domus Dei."
      en: "And the overseer of the Levites in Jerusalem, was Azzi the son of Bani, the son of Hasabia, the son of Mathania, the son of Micha. Of the sons of Asaph, were the singing men in the ministry of the house of God."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Praeceptum quippe regis super eos erat, et ordo in cantoribus per dies singulos,"
      en: "For the king's commandment was concerning them, and an order among the singing men day by day."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et Phathahia filius Mesezebel, de filiis Zara filii Juda in manu regis, juxta omne verbum populi,"
      en: "And Phathahia the son of Mesezebel of the children of Zara the son of Juda was at the hand of the king, in all matters concerning the people,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et in domibus per omnes regiones eorum. De filiis Juda habitaverunt in Cariatharbe et in filiabus ejus: et in Dibon, et in filiabus ejus: et in Cabseel, et in viculis ejus:"
      en: "And in the houses through all their countries. Of the children of Juda so dwelt at Cariath-Arbe, and in the villages thereof: and at Dibon, and in the villages thereof: and at Cabseel, and in the villages thereof."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et in Jesue, et in Molada, et in Bethphaleth,"
      en: "And at Jesue, and at Molada, and Bethphaleth,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et in Hasersual, et in Bersabee, et in filiabus ejus,"
      en: "And at Hasersual, and at Bersabee, and in the villages thereof,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et in Siceleg, et in Mochona, et in filiabus ejus,"
      en: "And at Siceleg, and at Mochona, and in the villages thereof,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et in Remmon, et in Saraa, et in Jerimuth,"
      en: "And at Remmon, and at Saraa, and at Jerimuth,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Zanoa, Odollam, et in villis earum, Lachis et regionibus ejus, et Azeca, et filiabus ejus. Et manserunt in Bersabee usque ad vallem Ennom."
      en: "Zanoa, Odollam, and in their villages, at Lachis and its dependencies, and at Azeca and the villages thereof. And they dwelt from Bersabee unto the valley of Ennom."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Filii autem Benjamin, a Geba, Mechmas, et Hai, et Bethel, et filiabus ejus"
      en: "And the children of Benjamin, from Geba, at Mechmas, and at Hai, and at Bethel, and in the villages thereof,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Anathoth, Nob, Anania,"
      en: "At Anathoth, Nob, Anania,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Asor, Rama, Gethaim,"
      en: "Asor, Rama, Gethaim,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Hadid, Seboim, et Neballat, Lod,"
      en: "Hadid, Seboim, and Neballat, Led,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et Ono valle artificum."
      en: "And Ono the valley of craftsmen."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et de Levitis portiones Judae et Benjamin."
      en: "And of the Levites were portions of Juda and Benjamin."
    status: { la: verified, en: verified }
