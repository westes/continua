# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: heb
chapter: 9
verses:
  - n: 1
    text:
      la: "Habuit quidem et prius justificationes culturae, et Sanctum saeculare."
      en: "The former indeed had also justifications of divine service, and a worldly sanctuary."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Tabernaculum enim factum est primum, in quo erant candelabra, et mensa, et propositio panum, quae dicitur Sancta."
      en: "For there was a tabernacle made the first, wherein were the candlesticks, and the table, and the setting forth of loaves, which is called the holy."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Post velamentum autem secundum, tabernaculum, quod dicitur Sancta sanctorum:"
      en: "And after the second veil, the tabernacle, which is called the holy of holies:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "aureum habens thuribulum, et arcam testamenti circumtectam ex omni parte auro, in qua urna aurea habens manna, et virga Aaron, quae fronduerat, et tabulae testamenti,"
      en: "Having a golden censer, and the ark of the testament covered about on every part with gold, in which was a golden pot that had manna, and the rod of Aaron, that had blossomed, and the tables of the testament."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "superque eam erant cherubim gloriae obumbrantia propitiatorium: de quibus non est modo dicendum per singula."
      en: "And over it were the cherubims of glory overshadowing the propitiatory: of which it is not needful to speak now particularly."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "His vero ita compositis, in priori quidem tabernaculo semper introibant sacerdotes, sacrificiorum officia consummantes:"
      en: "Now these things being thus ordered, into the first tabernacle the priests indeed always entered, accomplishing the offices of sacrifices."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in secundo autem semel in anno solus pontifex non sine sanguine, quem offert pro sua et populi ignorantia:"
      en: "But into the second, the high priest alone, once a year: not without blood, which he offereth for his own, and the people's ignorance:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "hoc significante Spiritu Sancto, nondum propalatam esse sanctorum viam, adhuc priore tabernaculo habente statum:"
      en: "The Holy Ghost signifying this, that the way into the holies was not yet made manifest, whilst the former tabernacle was yet standing."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quae parabola est temporis instantis: juxta quam munera, et hostiae offeruntur, quae non possunt juxta conscientiam perfectum facere servientem, solummodo in cibis, et in potibus,"
      en: "Which is a parable of the time present: according to which gifts and sacrifices are offered, which can not, as to the conscience, make him perfect that serveth, only in meats and in drinks,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et variis baptismatibus, et justitiis carnis usque ad tempus correctionis impositis."
      en: "And divers washings, and justices of the flesh laid on them until the time of correction."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Christus autem assistens pontifex futurorum bonorum, per amplius et perfectius tabernaculum, non manufactum, id est, non hujus creationis:"
      en: "But Christ, being come an high priest of the good things to come, by a greater and more perfect tabernacle not made with hand, that is, not of this creation:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "neque per sanguinem hircorum aut vitulorum, sed per proprium sanguinem introivit semel in Sancta, aeterna redemptione inventa."
      en: "Neither by the blood of goats, or of calves, but by his own blood, entered once into the holies, having obtained eternal redemption."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Si enim sanguis hircorum et taurorum, et cinis vitulae aspersus inquinatos sanctificat ad emundationem carnis:"
      en: "For if the blood of goats and of oxen, and the ashes of an heifer being sprinkled, sanctify such as are defiled, to the cleansing of the flesh:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quanto magis sanguis Christi, qui per Spiritum Sanctum semetipsum obtulit immaculatum Deo, emundabit conscientiam nostram ab operibus mortuis, ad serviendum Deo viventi?"
      en: "How much more shall the blood of Christ, who by the Holy Ghost offered himself unspotted unto God, cleanse our conscience from dead works, to serve the living God?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et ideo novi testamenti mediator est: ut morte intercedente, in redemptionem earum praevaricationum, quae erant sub priori testamento, repromissionem accipiant qui vocati sunt aeternae haereditatis."
      en: "And therefore he is the mediator of the new testament: that by means of his death, for the redemption of those transgressions, which were under the former testament, they that are called may receive the promise of eternal inheritance."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ubi enim testamentum est, mors necesse est intercedat testatoris."
      en: "For where there is a testament, the death of the testator must of necessity come in."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Testamentum enim in mortuis confirmatum est: alioquin nondum valet, dum vivit qui testatus est."
      en: "For a testament is of force, after men are dead: otherwise it is as yet of no strength, whilst the testator liveth."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Unde nec primum quidem sine sanguine dedicatum est."
      en: "Whereupon neither was the first indeed dedicated without blood."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Lecto enim omni mandato legis a Moyse universo populo, accipiens sanguinem vitulorum et hircorum cum aqua, et lana coccinea, et hyssopo, ipsum quoque librum, et omnem populum aspersit,"
      en: "For when every commandment of the law had been read by Moses to all the people, he took the blood of calves and goats, with water, and scarlet wool and hyssop, and sprinkled both the book itself and all the people,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dicens: Hic sanguis testamenti, quod mandavit ad vos Deus."
      en: "Saying: This is the blood of the testament, which God hath enjoined unto you."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Etiam tabernaculum et omnia vasa ministerii sanguine similiter aspersit."
      en: "The tabernacle also and all the vessels of the ministry, in like manner, he sprinkled with blood."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et omnia pene in sanguine secundum legem mundantur: et sine sanguinis effusione non fit remissio."
      en: "And almost all things, according to the law, are cleansed with blood: and without shedding of blood there is no remission."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Necesse est ergo exemplaria quidem caelestium his mundari: ipsa autem caelestia melioribus hostiis quam istis."
      en: "It is necessary therefore that the patterns of heavenly things should be cleansed with these: but the heavenly things themselves with better sacrifices than these."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Non enim in manufacta Sancta Jesus introivit exemplaria verorum: sed in ipsum caelum, ut appareat nunc vultui Dei pro nobis:"
      en: "For Jesus is not entered into the holies made with hands, the patterns of the true: but into heaven itself, that he may appear now in the presence of God for us."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "neque ut saepe offerat semetipsum, quemadmodum pontifex intrat in Sancta per singulos annos in sanguine alieno:"
      en: "Nor yet that he should offer himself often, as the high priest entereth into the holies, every year with the blood of others:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "alioquin oportebat eum frequenter pati ab origine mundi: nunc autem semel in consummatione saeculorum, ad destitutionem peccati, per hostiam suam apparuit."
      en: "For then he ought to have suffered often from the beginning of the world: but now once at the end of ages, he hath appeared for the destruction of sin, by the sacrifice of himself."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et quemadmodum statutum est hominibus semel mori, post hoc autem judicium:"
      en: "And as it is appointed unto men once to die, and after this the judgment:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "sic et Christus semel oblatus est ad multorum exhaurienda peccata: secundo sine peccato apparebit exspectantibus se, in salutem."
      en: "So also Christ was offered once to exhaust the sins of many; the second time he shall appear without sin to them that expect him unto salvation."
    status: { la: verified, en: verified }
