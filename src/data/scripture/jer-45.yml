# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 45
verses:
  - n: 1
    text:
      la: "verbum quod locutus est Hieremias propheta ad Baruch filium Neri cum scripsisset verba haec in libro de ore Hieremiae anno quarto Ioachim filii Iosiae regis Iuda dicens"
      en: "The word that Jeremias the prophet spoke to Baruch the son of Nerias, when he had written there words in a book, out of the mouth of Jeremias, in the fourth year of Joakim the son of Josias king of Juda, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "haec dicit Dominus Deus Israhel ad te Baruch"
      en: "Thus saith the Lord the God of Israel to thee, Baruch:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixisti vae misero mihi quoniam addidit Dominus dolorem dolori meo laboravi in gemitu meo et requiem non inveni"
      en: "Thou hast said: Woe is me, wretch that I am, for the Lord hath added sorrow to my sorrow: I am wearied with my groans, and I find no rest."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "haec dices ad eum sic dicit Dominus ecce quos aedificavi ego destruo et quos plantavi ego evello et universam terram hanc"
      en: "Thus saith the Lord: Thus shalt thou say to him: Behold, them whom I have built, I do destroy: and them whom I have planted, I do pluck up, and all this land."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et tu quaeris tibi grandia noli quaerere quia ecce ego adducam malum super omnem carnem ait Dominus et dabo tibi animam tuam in salutem in omnibus locis ad quaecumque perrexeris"
      en: "And dost thou seek great things for thyself ? Seek not : for behold I will bring evil upon all flesh, saith the Lord ! but I will give thee thy life, and save thee in all places whithersoever thou shalt go."
    status: { la: verified, en: verified }
