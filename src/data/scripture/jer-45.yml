# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 45
verses:
  - n: 1
    text:
      la: "Verbum quod locutus est Jeremias propheta ad Baruch filium Neriae, cum scripsisset verba haec in libro ex ore Jeremiae, anno quarto Joakim filii Josiae regis Juda, dicens:"
      en: "The word that Jeremias the prophet spoke to Baruch the son of Nerias, when he had written these words in a book, out of the mouth of Jeremias, in the fourth year of Joakim the son of Josias king of Juda, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Haec dicit Dominus Deus Israel ad te, Baruch:"
      en: "Thus saith the Lord the God of Israel to thee, Baruch:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dixisti: Vae misero mihi! quoniam addidit Dominus dolorem dolori meo: laboravi in gemitu meo, et requiem non inveni."
      en: "Thou hast said: Woe is me, wretch that I am, for the Lord hath added sorrow to my sorrow: I am wearied with my groans, and I find no rest."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Haec dicit Dominus: Sic dices ad eum: Ecce quos aedificavi, ego destruo: et quos plantavi, ego evello, et universam terram hanc:"
      en: "Thus saith the Lord: Thus shalt thou say to him: Behold, them whom I have built, I do destroy: and them whom I have planted, I do pluck up, and all this land."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et tu quaeris tibi grandia? Noli quaerere, quia ecce ego adducam malum super omnem carnem, ait Dominus, et dabo tibi animam tuam in salutem in omnibus locis ad quaecumque perrexeris."
      en: "And dost thou seek great things for thyself? Seek not: for behold I will bring evil upon all flesh, saith the Lord! but I will give thee thy life, and save thee in all places whithersoever thou shalt go."
    status: { la: verified, en: verified }
