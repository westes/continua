# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: esth
chapter: 6
verses:
  - n: 1
    text:
      la: "noctem illam rex duxit insomnem iussitque adferri sibi historias et annales priorum temporum qui cum illo praesente legerentur"
      en: "That night the king passed without sleep, and he commanded the histories and chronicles of former times to be brought him. And when they were reading them before him,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ventum est ad eum locum ubi scriptum erat quomodo nuntiasset Mardocheus insidias Bagathan et Thares eunuchorum regem Asuerum iugulare cupientium"
      en: "They came to that place where it was written, how Mardochai had discovered the treason of Bagathan and Thares the eunuchs, who sought to kill king Assuerus."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quod cum rex audisset ait quid pro hac fide honoris ac praemii Mardocheus consecutus est dixeruntque ei servi illius ac ministri nihil omnino mercedis accepit"
      en: "And when the king heard this, he said: What honour and reward hath Mardochai received for this fidelity? His servants and ministers said to him: He hath received no reward at all."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "statimque rex quis est inquit in atrio Aman quippe interius atrium domus regiae intraverat ut suggereret regi et iuberet Mardocheum adfigi patibulo quod ei fuerat praeparatum"
      en: "And the king said immediately: Who is in the court? for Aman was coming in to the inner court of the king's house, to speak to the king, that he might order Mardochai to be hanged upon the gibbet which was prepared for him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "responderunt pueri Aman stat in atrio dixitque rex ingrediatur"
      en: "The servants answered: Aman standeth in the court, and the king said: Let him come in."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "cumque esset ingressus ait illi quid debet fieri viro quem rex honorare desiderat cogitans Aman in corde suo et reputans quod nullum alium rex nisi se vellet honorare"
      en: "And when he was come in, he said to him: What ought to be done to the man whom the king is desirous to honour? But Aman thinking in his heart, and supposing that the king would honour no other but himself,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "respondit homo quem rex honorare cupit"
      en: "Answered: The man whom the king desireth to honour,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "debet indui vestibus regiis et inponi super equum qui de sella regis est et accipere regium diadema super caput suum"
      en: "Ought to be clothed with the king's apparel, and to be set upon the horse that the king rideth upon, and to have the royal crown upon his head,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et primus de regis principibus ac tyrannis teneat equum eius et per plateam civitatis incedens clamet ac dicat sic honorabitur quemcumque rex voluerit honorare"
      en: "And let the first of the king's princes and nobles hold his horse, and going through the street of the city, proclaim before him and say: Thus shall he be honoured, whom the king hath a mind to honour."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dixitque ei rex festina et sumpta stola et equo fac ita ut locutus es Mardocheo Iudaeo qui sedet ante fores palatii cave ne quicquam de his quae locutus es praetermittas"
      en: "And the king said to him: Make haste and take the robe and the horse, and do as thou hast spoken to Mardochai the Jew, who sitteth before the gates of the palace. Beware thou pass over any of those things which thou hast spoken."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "tulit itaque Aman stolam et equum indutumque Mardocheum in platea civitatis et inpositum equo praecedebat atque clamabat hoc honore condignus est quemcumque rex voluerit honorare"
      en: "So Aman took the robe and the horse, and arraying Mardochai in the street of the city, and setting him on the horse, went before him, and proclaimed: This honour is he worthy of, whom the king hath a mind to honour."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "reversus est Mardocheus ad ianuam palatii et Aman festinavit ire in domum suam lugens et operto capite"
      en: "But Mardochai returned to the palace gate: and Aman made haste to go to his house, mourning and having his head covered:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "narravitque Zares uxori suae et amicis omnia quae evenissent sibi cui responderunt sapientes quos habebat in consilio et uxor eius si de semine Iudaeorum est Mardocheus ante quem cadere coepisti non poteris ei resistere sed cades in conspectu eius"
      en: "And he told Zares his wife, and his friends, all that had befallen him. And the wise men whom he had in counsel, and his wife answered him: If Mardochai be of the seed of the Jews, before whom thou hast begun to fall, thou canst not resist him, but thou shalt fall in his sight."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "adhuc illis loquentibus venerunt eunuchi regis et cito eum ad convivium quod regina paraverat pergere conpulerunt"
      en: "As they were yet speaking, the king's eunuchs came, and compelled him to go quickly to the banquet which the queen had prepared."
    status: { la: verified, en: verified }
