# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: num
chapter: 26
verses:
  - n: 1
    text:
      la: "postquam noxiorum sanguis effusus est dixit Dominus ad Mosen et Eleazarum filium Aaron sacerdotem"
      en: "After the blood of the guilty was shed, the Lord said to Moses and to Eleazar the son of Aaron, the priest:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "numerate omnem summam filiorum Israhel a viginti annis et supra per domos et cognationes suas cunctos qui possunt ad bella procedere"
      en: "Number the whole sum of the children of Israel from twenty years old and upward, by their houses and kindreds, all that are able to go forth to war."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "locuti sunt itaque Moses et Eleazar sacerdos in campestribus Moab super Iordanem contra Hierichum ad eos qui erant"
      en: "Moses therefore and Eleazar the priest, being in the plains of Moab upon the Jordan over against Jericho, spoke to them that were"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "a viginti annis et supra sicut Dominus imperarat quorum iste est numerus"
      en: "From twenty years old and upward, as the Lord had commanded: and this is the number of them:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ruben primogenitus Israhel huius filius Enoch a quo familia Enochitarum et Phallu a quo familia Phalluitarum"
      en: "Ruben the firstborn of Israel. His sons were Henoch, of whom is the family of the Henochites: and Phallu, of whom is the family of the Phalluites:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et Esrom a quo familia Esromitarum et Charmi a quo familia Charmitarum"
      en: "And Hesron, of whom is the family of the Hesronites: and Charmi, of whom is the family of the Charmites."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "hae sunt familiae de stirpe Ruben quarum numerus inventus est quadraginta tria milia et septingenti triginta"
      en: "These are the families of the stock of Ruben: whose number was found to be forty-three thousand seven hundred and thirty."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "filius Phallu Heliab"
      en: "The son of Phallu was Eliab."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "huius filii Namuhel et Dathan et Abiram isti sunt Dathan et Abiram principes populi qui surrexerunt contra Mosen et Aaron in seditione Core quando adversum Dominum rebellaverunt"
      en: "His sons, were Namuel and Dathan and Abiron. These are Dathan and Abiron the princes of the people, that rose against Moses and Aaron in the sedition of Core, when they rebelled against the Lord:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et aperiens terra os suum devoravit Core morientibus plurimis quando conbusit ignis ducentos quinquaginta viros et factum est grande miraculum"
      en: "And the earth opening her mouth swallowed up Core, many others dying, when the fire burned two hundred and fifty men. And there was a great miracle wrought,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ut Core pereunte filii illius non perirent"
      en: "That when Core perished, his sons did not perish."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "filii Symeon per cognationes suas Namuhel ab hoc familia Namuhelitarum Iamin ab hoc familia Iaminitarum Iachin ab hoc familia Iachinitarum"
      en: "The sons of Simeon by their kindreds: Namuel, of him is the family of the Namuelites: Jamin, of him is the family of the Jaminites: Jachin, of him is the family of the Jachinites:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Zare ab hoc familia Zareitarum Saul ab hoc familia Saulitarum"
      en: "Zare, of him is the family of the Zarites: Saul, of him is the family of the Saulites."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "hae sunt familiae de stirpe Symeon quarum omnis numerus fuit viginti duo milia ducentorum"
      en: "These are the families of the stock of Simeon, of which the whole number was twenty-two thousand two hundred."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "filii Gad per cognationes suas Sephon ab hoc familia Sephonitarum Aggi ab hoc familia Aggitarum Suni ab hoc familia Sunitarum"
      en: "The sons of Gad by their kindreds: Sephon, of hin; Is the family of the Sephonites: Aggi, of him is the family of the Aggites: Suni, of him is the family of the Sunites:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ozni ab hoc familia Oznitarum Heri ab hoc familia Heritarum"
      en: "Ozni, of him is the family of the Oznites: Her, of him is the family of the Herites :"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Arod ab hoc familia Aroditarum Arihel ab hoc familia Arihelitarum"
      en: "Arod, of him is the family of the Arodites: Ariel, of him is the family of the Arielites."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "istae sunt familiae Gad quarum omnis numerus fuit quadraginta milia quingentorum"
      en: "These are the families of Gad, of which the whole number was forty thousand five hundred."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "filii Iuda Her et Onan qui ambo mortui sunt in terra Chanaan"
      en: "The sons of Juda, Her and Onan, who both died in the land of Chanaan."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "fueruntque filii Iuda per cognationes suas Sela a quo familia Selanitarum Phares a quo familia Pharesitarum Zare a quo familia Zareitarum"
      en: "And the sons of Juda by their kindreds were: Sela, of whom is the family of the Selaites: Phares, of whom is the family of the Pharesites: Zare, of whom is the family of the Zarites."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "porro filii Phares Esrom a quo familia Esromitarum et Amul a quo familia Amulitarum"
      en: "Moreover the sons of Phares were: Hesron, of whom is the family of the Hesronites: and Hamul, of whom is the family of the Hamulites."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "istae sunt familiae Iuda quarum omnis numerus fuit septuaginta milia quingentorum"
      en: "These are the families of Juda, of which the whole number was seventy-six thousand five hundred."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "filii Isachar per cognationes suas Thola a quo familia Tholaitarum Phua a quo familia Phuaitarum"
      en: "The sons of Issachar, by their kindreds: Thola, of whom is the family of the Tholaites: Phua, of whom is the family of the Phuaites:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Iasub a quo familia Iasubitarum Semran a quo familia Semranitarum"
      en: "Jasub, of whom is the family of the Jasubites: Semran, of whom is the family of the Semranites."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "hae sunt cognationes Isachar quarum numerus fuit sexaginta quattuor milia trecentorum"
      en: "These are the kindreds of Issachar, whose number was sixty-four thousand three hundred."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "filii Zabulon per cognationes suas Sared a quo familia Sareditarum Helon a quo familia Helonitarum Ialel a quo familia Ialelitarum"
      en: "The sons of Zabulon by their kindreds: Sared, of whom is the family of the Saredites: Elon, of whom is the family of the Elonites: Jalel, of whom is the family of the Jalelites."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "hae sunt cognationes Zabulon quarum numerus fuit sexaginta milia quingentorum"
      en: "These are the kindreds of Zabulon, whose number was sixty thousand five hundred."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "filii Ioseph per cognationes suas Manasse et Ephraim"
      en: "The sons of Joseph by their kindred, Manasses and Ephraim."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "de Manasse ortus est Machir a quo familia Machiritarum Machir genuit Galaad a quo familia Galaaditarum"
      en: "Of Manasses was born Machir, of whom is the family of the Machirites. Machir beget Galaad, of whom is the family of the Galaadites."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Galaad habuit filios Hiezer a quo familia Hiezeritarum et Elec a quo familia Elecarum"
      en: "Galaad had sons: Jezer, of whom is the family of the Jezerites: and Helec, of whom is the family of the Helecites:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et Asrihel a quo familia Asrihelitarum et Sechem a quo familia Sechemitarum"
      en: "And Asriel, of whom is the family of the Asrielites: and Sechem, of whom is the family of the Sechemites:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et Semida a quo familia Semidatarum et Epher a quo familia Epheritarum"
      en: "And Semida, of whom is the family of the Semidaites: and Hepher, of whom is the family of the Hepherites."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "fuit autem Epher pater Salphaad qui filios non habebat sed tantum filias quarum ista sunt nomina Maala et Noa et Egla et Melcha et Thersa"
      en: "And Hepher was the father of Salphaad, who had no sons, but only daughters, whose names are these: Maala, and Noa, and Hegla, and Melcha, and Thersa."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "hae sunt familiae Manasse et numerus earum quinquaginta duo milia septingentorum"
      en: "These are the families of Manasses, and the number of them fifty-two thousand seven hundred."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "filii autem Ephraim per cognationes suas fuerunt hii Suthala a quo familia Suthalitarum Becher a quo familia Becheritarum Tehen a quo familia Tehenitarum"
      en: "And the sons of Ephraim by their kindreds were these: Suthala, of whom is the family of the Suthalaites: Becher, of whom is the family of the Becherites: Thehen, of whom is the family of the Thehenites."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "porro filius Suthala fuit Heran a quo familia Heranitarum"
      en: "Now the son of Suthala was Heran, of whom is the family of the Heranites."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "hae sunt cognationes filiorum Ephraim quarum numerus triginta duo milia quingentorum"
      en: "These are the kindreds of the sons of Ephraim: whose number was thirty-two thousand five hundred."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "isti sunt filii Ioseph per familias suas filii Beniamin in cognationibus suis Bale a quo familia Baleitarum Azbel a quo familia Azbelitarum Ahiram a quo familia Ahiramitarum"
      en: "These are the sons of Joseph by their families. The sons of Benjamin in their kindreds: Bela, of whom is the family of the Belaites: Asbel, of whom is the family of the Asbelites: Ahiram, of whom is the family of the Ahiramites:"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Supham a quo familia Suphamitarum Hupham a quo familia Huphamitarum"
      en: "Supham, of whom is the family of the Suphamites: Hupham, of whom is the family of the Huphamites."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "filii Bale Hered et Noeman de Hered familia Hereditarum de Noeman familia Noemitarum"
      en: "The sons of Bela: Hered, and Noeman. Of Hered, is the family of the Heredites: of Noeman, the family of tile Noemanites."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "hii sunt filii Beniamin per cognationes suas quorum numerus quadraginta quinque milia sescentorum"
      en: "These are the sons of Benjamin by their kindreds, whose number was forty- five thousand six hundred."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "filii Dan per cognationes suas Suham a quo familia Suhamitarum hae cognationes Dan per familias suas"
      en: "The sons of Dan by their kindreds: Suham, of whom is the family of the Suhamites: These are the kindreds of Dan by their families."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "omnes fuere Suhamitae quorum numerus erat sexaginta quattuor milia quadringentorum"
      en: "All were Suhamites, whose number was sixty-four thousand four hundred."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "filii Aser per cognationes suas Iemna a quo familia Iemnaitarum Iessui a quo familia Iessuitarum Brie a quo familia Brieitarum"
      en: "The sons of Aser by their kindreds: Jemna, of whom is the family of the Jemnaites: Jessui, of whom is the family of the Jessuites: Brie, of whom is the family of the Brieites."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "filii Brie Haber a quo familia Haberitarum et Melchihel a quo familia Melchihelitarum"
      en: "The sons of Brie: Heber, of whom is the family of the Heberites: and Melchiel, of whom is the family of the Melchielites."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "nomen autem filiae Aser fuit Sara"
      en: "And the name of the daughter of Aser, was Sara."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "hae cognationes filiorum Aser et numerus eorum quinquaginta tria milia quadringentorum"
      en: "These are the kindreds of the sons of Aser, and their number fifty-three thousand four hundred."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "filii Nepthalim per cognationes suas Iessihel a quo familia Iessihelitarum Guni a quo familia Gunitarum"
      en: "The sons of Nephtali by their kindreds: Jesiel, of whom is the family of the Jesielites: Guni, of whom is the family of the Gunites:"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Iesser a quo familia Iesseritarum Sellem a quo familia Sellemitarum"
      en: "Jeser, of whom is the family of the Jeserites: Sellem, of whom is the family of the Sellemites."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "hae sunt cognationes filiorum Nepthalim per familias suas quorum numerus quadraginta quinque milia quadringentorum"
      en: "These are the kindreds of the sons of Nephtali by their families: whose number was forty-five thousand four hundred."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "ista est summa filiorum Israhel qui recensiti sunt sescenta milia et mille septingenti triginta"
      en: "This is the sum of the children of Israel, that were reckoned up, six hundred and one thousand seven hundred and thirty."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "locutusque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "istis dividetur terra iuxta numerum vocabulorum in possessiones suas"
      en: "To these shall the land be divided for their possessions according to the number of names."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "pluribus maiorem partem dabis et paucioribus minorem singulis sicut nunc recensiti sunt tradetur possessio"
      en: "To the greater number thou shalt give a greater portion, and to the fewer a less: to every one, as they have now been reckoned up, shall a possession be delivered :"
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "ita dumtaxat ut sors terram tribubus dividat et familiis"
      en: "Yet so that by lot the land be divided to the tribe and families."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "quicquid sorte contigerit hoc vel plures accipient vel pauciores"
      en: "Whatsoever shall fall by lot, that shall be taken by the more, or the fewer."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "hic quoque est numerus filiorum Levi per familias suas Gerson a quo familia Gersonitarum Caath a quo familia Caathitarum Merari a quo familia Meraritarum"
      en: "This also is the number of the sons of Levi by their families: Gerson, of whom is the family of the Gersonites: Caath, of whom is the family of the Caathites: Merari, of whom is the family of the Merarites."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "hae sunt familiae Levi familia Lobni familia Hebroni familia Mooli familia Musi familia Cori at vero Caath genuit Amram"
      en: "These are the families of Levi: The family of Lobni, the family of Hebroni, the family of Moholi, the family of Musi, the family of Core. Now Caath beget Amram :"
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "qui habuit uxorem Iochabed filiam Levi quae nata est ei in Aegypto haec genuit viro suo Amram filios Aaron et Mosen et Mariam sororem eorum"
      en: "Who had to wife Jochabed the daughter of Levi, who was horn to him in Egypt. She bore to her husband Amram sons, Aaron and Moses, and Mary their sister."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "de Aaron orti sunt Nadab et Abiu et Eleazar et Ithamar"
      en: "Of Aaron were born Nadab and Abiu, and Eleazar and Ithamar:"
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "quorum Nadab et Abiu mortui sunt cum obtulissent ignem alienum coram Domino"
      en: "Of whom Nadab and Abiu died, when they had offered the strange fire before the Lord."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "fueruntque omnes qui numerati sunt viginti tria milia generis masculini ab uno mense et supra quia non sunt recensiti inter filios Israhel nec eis cum ceteris data possessio"
      en: "And all that were numbered, were twenty-three thousand males from one month old and upward: for they were not reckoned up among the children of Israel, neither was a possession given to them with the rest."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "hic est numerus filiorum Israhel qui descripti sunt a Mosen et Eleazaro sacerdote in campestribus Moab supra Iordanem contra Hiericho"
      en: "This is the number of the children of Israel, that were enrolled by Moses and Eleazar the priest, in the plains of Moab upon the Jordan, over against Jericho."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "inter quos nullus fuit eorum qui ante numerati sunt a Mose et Aaron in deserto Sinai"
      en: "Among whom there was not one of them that were numbered before by Moses and Aaron in the desert of Sinai."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "praedixerat enim Dominus quod omnes morerentur in solitudine nullusque remansit ex eis nisi Chaleb filius Iepphonne et Iosue filius Nun"
      en: "For the Lord had foretold that they should die in the wilderness. And none remained of them, but Caleb the son of Jephone, and Josue the son of Nun."
    status: { la: verified, en: verified }
