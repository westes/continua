# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 23
verses:
  - n: 1
    text:
      la: "Vixit autem Sara centum viginti septem annis."
      en: "And Sara lived a hundred and twenty-seven years."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et mortua est in civitate Arbee, quae est Hebron, in terra Chanaan: venitque Abraham ut plangeret et fleret eam."
      en: "And she died in the city of Arbee which is Hebron, in the land of Chanaan: and Abraham came to mourn and weep for her."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cumque surrexisset ab officio funeris, locutus est ad filios Heth, dicens:"
      en: "And after he rose up from the funeral obsequies, he spoke to the children of Heth, saying:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Advena sum et peregrinus apud vos: date mihi jus sepulchri vobiscum, ut sepeliam mortuum meum."
      en: "I am a stranger and sojourner among you: give me the right of a burying place with you, that I may bury my dead."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Responderunt filii Heth, dicentes:"
      en: "The children of Heth answered, saying:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Audi nos, domine: princeps Dei es apud nos: in electis sepulchris nostris sepeli mortuum tuum, nullusque te prohibere poterit quin in monumento ejus sepelias mortuum tuum."
      en: "My Lord, hear us, thou art a prince of God among us: bury thy dead in our principal sepulchres: and no man shall have power to hinder thee from burying thy dead in his sepulchre."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Surrexit Abraham, et adoravit populum terrae, filios videlicet Heth:"
      en: "Abraham rose up, and bowed down to the people of the land, to wit the children of Heth:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixitque ad eos: Si placet animae vestrae ut sepeliam mortuum meum, audite me, et intercedite pro me apud Ephron filium Seor:"
      en: "And said to them: If it please your soul that I should bury my dead, hear me, and intercede for me to Ephron the son of Seor."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ut det mihi speluncam duplicem, quam habet in extrema parte agri sui: pecunia digna tradat eam mihi coram vobis in possessionem sepulchri."
      en: "That he may give me the double cave, which he hath in the end of his field: for as much money as it is worth he shall give it me before you, for a possession of a burying place."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Habitabat autem Ephron in medio filiorum Heth. Responditque Ephron ad Abraham, cunctis audientibus qui ingrediebantur portam civitatis illius, dicens:"
      en: "Now Ephron dwelt in the midst of the children of Heth. And Ephron made answer to Abraham in the hearing of all that went in at the gate of the city, saying:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Nequaquam ita fiat, domine mi, sed tu magis ausculta quod loquor. Agrum trado tibi, et speluncam quae in eo est, praesentibus filiis populi mei; sepeli mortuum tuum."
      en: "Let it not be so, my lord, but do thou rather hearken to what I say: The field I deliver to thee, and the cave that is therein, in the presence of the children of my people, bury thy dead."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Adoravit Abraham coram populo terrae."
      en: "Abraham bowed down before the people of the land,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et locutus est ad Ephron circumstante plebe: Quaeso ut audias me: dabo pecuniam pro agro: suscipe eam, et sic sepeliam mortuum meum in eo."
      en: "And he spoke to Ephron, in the presence of the people: I beseech thee to hear me: I will give money for the field: take it, and so I will bury my dead in it."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Responditque Ephron:"
      en: "And Ephron answered:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Domine mi, audi me: terra, quam postulas, quadringentis siclis argenti valet: istud est pretium inter me et te: sed quantum est hoc? sepeli mortuum tuum."
      en: "My lord, hear me. The ground which thou desirest, is worth four hundred sicles of silver: this is the price between me and thee: but what is this? bury thy dead."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quod cum audisset Abraham, appendit pecuniam, quam Ephron postulaverat, audientibus filiis Heth, quadringentos siclos argenti probatae monetae publicae."
      en: "And when Abraham had heard this, he weighed out the money that Ephron had asked, in the hearing of the children of Heth, four hundred sicles of silver of common current money."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Confirmatusque est ager quondam Ephronis, in quo erat spelunca duplex, respiciens Mambre, tam ipse, quam spelunca, et omnes arbores ejus in cunctis terminis ejus per circuitum,"
      en: "And the field that before was Ephron's, wherein was the double cave, looking towards Mambre, both it and the cave, and all the trees thereof in all its limits round about,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Abrahae in possessionem, videntibus filiis Heth, et cunctis qui intrabant portam civitatis illius."
      en: "Was made sure to Abraham for a possession, in the sight of the children of Heth, and of all that went in at the gate of his city."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Atque ita sepelivit Abraham Saram uxorem suam in spelunca agri duplici, quae respiciebat Mambre. Haec est Hebron in terra Chanaan."
      en: "And so Abraham buried Sara his wife, in a double cave of the field, that looked towards Mambre, this is Hebron in the land of Chanaan."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et confirmatus est ager, et antrum quod erat in eo, Abrahae in possessionem monumenti a filiis Heth."
      en: "And the field was made sure to Abraham, and the cave that was in it, for a possession to bury in, by the children of Heth."
    status: { la: verified, en: verified }
