# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1mach
chapter: 3
verses:
  - n: 1
    text:
      la: "et surrexit Iudas qui vocabatur Macchabeus filius eius pro eo"
      en: "Then his son Judas, called Machabeus, rose up in his stead."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et adiuvabant eum omnes fratres eius et universi qui se coniunxerant patri eius et proeliabantur proelium Israhel cum laetitia"
      en: "And all his brethren helped him, and all they that had joined themselves to his father, and they fought with cheerfulness the battle of Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dilatavit gloriam populo suo et induit se loricam sicut gigans et succinxit se arma bellica sua in proeliis et protegebat castra gladio suo"
      en: "And he got his people great honour, and put on a breastplate as a giant, and girt his warlike armour about him in battles, and protected the camp with his sword."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "similis factus est leoni in operibus suis et sicut catulus leonis rugiens in venatione"
      en: "In his acts he was like a lion, and like a lion's whelp roaring for his prey."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et persecutus est iniquos perscrutans eos et qui conturbabant populum suum succendit flammis"
      en: "And he pursued the wicked and sought them out, and them that troubled his people he burnt with fire:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et repulsi sunt inimici prae timore eius et omnes operarii iniquitatis conturbati sunt et directa est salus in manu eius"
      en: "And his enemies were driven away for fear of him, and all the workers of iniquity were troubled: and salvation prospered in his hand."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et exacerbabat reges multos et laetificabat Iacob in operibus suis et in saeculum memoria eius in benedictione"
      en: "And he grieved many kings, and made Jacob glad with his works, and his memory is blessed for ever."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et perambulavit civitates Iuda et perdidit impios ex eis et avertit iram ab Israhel"
      en: "And he went through the cities of Juda, and destroyed the wicked out of them, and turned away wrath from Israel."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et nominatus est usque ad novissimum terrae et congregavit pereuntes"
      en: "And he was renowned even to the utmost part of the earth, and he gathered them that were perishing."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et congregavit Apollonius gentes et a Samaria virtutem multam et magnam ad bellandum contra Israhel"
      en: "And Apollonius gathered together the Gentiles, and a numerous and great army from Samaria, to make war against Israel."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et cognovit Iudas et exiit obviam illi et percussit et occidit illum et ceciderunt vulnerati multi et reliqui fugerunt"
      en: "And Judas understood it, and went forth to meet him: and he overthrew him, and killed him: and many fell down slain, the rest fled away."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et accepit spolia eorum et gladium Apollonii abstulit Iudas et erat pugnans in eo omnibus diebus"
      en: "And he took their spoils, and Judas took the sword of Apollonius, and fought with it all his lifetime."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et audivit Seron princeps exercitus Syriae quod congregavit Iudas congregationem et ecclesiam fidelium secum"
      en: "And Seron captain of the army of Syria heard that Judas had assembled a company of the faithful, and a congregation with him,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et ait faciam mihi nomen et glorificabor in regno et debellabo Iudam et eos qui cum ipso sunt qui spernebant verbum regis"
      en: "And he said: I will get me a name, and will be glorified in the kingdom, and will overthrow Judas, and those that are with him, that have despised the edict of the king."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et praeparavit se et ascenderunt cum eo castra impiorum fortes auxiliarii ut facerent vindictam in filios Israhel"
      en: "And he made himself ready: and the host of the wicked went up with him, strong succours, to be revenged of the children of Israel."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et adpropinquaverunt usque Bethoron et exivit Iudas obviam illi cum paucis"
      en: "And they approached even as far as Bethoron: and Judas went forth to meet him, with a small company."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ut viderunt autem exercitum venientem sibi obviam dixerunt Iudae quomodo poterimus pauci pugnare ad multitudinem tantam tam fortem et nos fatigati sumus ieiunio hodie"
      en: "But when they saw the army coming to meet them, they said to Judas: How shall we, being few, be able to fight against so great a multitude and so strong, and we are ready to faint with fasting today?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ait Iudas facile est concludi multos in manus paucorum et non est differentia in conspectu Dei caeli liberare in multis et in paucis"
      en: "And Judas said: It is an easy matter for many to be shut up in the hands of a few: and there is no difference in the sight of the God of heaven to deliver with a great multitude, or with a small company:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quia non in multitudine exercitus victoria belli sed de caelo fortitudo est"
      en: "For the success of war is not in the multitude of the army, but strength cometh from heaven."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ipsi veniunt ad nos in multitudine contumaci et superba ut disperdant nos et uxores nostras et filios nostros et ut spolient nos"
      en: "They come against us with an insolent multitude, and with pride, to destroy us, and our wives, and our children, and to take our spoils."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "nos vero pugnabimus pro animabus nostris et legibus nostris"
      en: "But we will fight for our lives and our laws:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et ipse Dominus conteret eos ante faciem nostram vos autem ne timueritis eos"
      en: "And the Lord himself will overthrow them before our face: but as for you, fear them not."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ut cessavit autem loquens insiluit in eos subito et contritus est Seron et exercitus eius in conspectu ipsius"
      en: "And as soon as he had made an end of speaking, he rushed suddenly upon them: and Seron and his host were overthrown before him:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et persequebatur eum in descensu Bethoron usque in campum et ceciderunt ex eis octingenti viri reliqui autem fugerunt in terram Philisthim"
      en: "And he pursued him by the descent of Bethoron even to the plain, and there fell of them eight hundred men, and the rest fled into the land of the Philistines."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et cecidit timor Iudae ac fratrum eius et formido super omnes gentes in circuitu eorum"
      en: "And the fear of Judas and of his brethren, and the dread of them fell upon all the nations round about them."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et pervenit ad regem nomen eius et de proeliis Iudae narrabant omnes gentes"
      en: "And his fame came to the king, and all nations told of the battles of Judas."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ut audivit autem Antiochus sermones istos iratus est animo et misit et congregavit exercitum universi regni sui castra fortia valde"
      en: "Now when king Antiochus heard these words, he was angry in his mind: and he sent and gathered the forces of all his kingdom, an exceeding strong army."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et aperuit aerarium suum et dedit stipendia exercitui in annum et mandavit illis ut essent parati ad omnia"
      en: "And he opened his treasury, and gave out pay to the army for a year: and he commanded them, that they should be ready for all things."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et vidit quod defecit pecunia de thesauris et tributa regionis modica propter dissensionem et plagam quam fecit in terra ut tolleret legitima quae erant a primis diebus"
      en: "And he perceived that the money of his treasures failed, and that the tributes of the country were small because of the dissension, and the evil that he had brought upon the land, that he might take away the laws of old times:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et timuit ne non haberet et semel et bis in sumptus et donativa quae dederat ante larga manu et abundaverat super reges qui ante eum fuerant"
      en: "And he feared that he should not have as formerly enough, for charges and gifts, which he had given before with a liberal hand: for he had abounded more than the kings that had been before him."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "consternatus erat animo valde et cogitavit ire in Persidem et accipere tributa regionum et congregare argentum multum"
      en: "And he was greatly perplexed in mind, and purposed to go into Persia, and to take tributes of the countries, and to gather much money."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et reliquit Lysiam hominem nobilem de genere regali super negotia regia a flumine Eufraten usque ad flumen Aegypti"
      en: "And he left Lysias, a nobleman of the blood royal, to oversee the affairs of the kingdom, from the river Euphrates even to the river of Egypt:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et ut nutriret Antiochum filium suum donec rediret"
      en: "And to bring up his son Antiochus, till he came again."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et tradidit ei medium exercitum et elefantos et mandavit ei de omnibus quae volebat et de inhabitantibus Iudaeam et Hierusalem"
      en: "And he delivered to him half the army, and the elephants: and he gave him charge concerning all that he would have done, and concerning the inhabitants of Judea, and Jerusalem:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "ut mitteret ad eos exercitum ad conterendam et extirpandam virtutem Israhel et reliquias Hierusalem et auferendam memoriam de loco"
      en: "And that he should send an army against them, to destroy and root out the strength of Israel, and the remnant of Jerusalem, and to take away the memory of them from that place:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et ut constitueret habitatores filios alienigenas in omnibus finibus eorum et sorte distribueret terram eorum"
      en: "And that he should settle strangers to dwell in all their coasts, and divide their land by lot."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et rex adsumpsit partem exercitus residui et exivit ab Antiochia civitate regni sui anno centesimo et quadragesimo et septimo et transfretavit Eufraten flumen et perambulabat superiores regiones"
      en: "So the king took the half of the army that remained, and went forth from Antioch the chief city of his kingdom, in the hundred and forty-seventh year: and he passed over the river Euphrates, and went through the higher countries."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et elegit Lysias Ptolomeum filium Dorimini et Nicanorem et Gorgiam viros potentes ex amicis regis"
      en: "Then Lysias chose Ptolemee the son of Dorymenus, and Nicanor, and Gorgias, mighty men of the king's friends."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et misit cum eis quadraginta milia virorum et septem milia equitum ut venirent in terram Iuda et disperderent eam secundum verbum regis"
      en: "And he sent with them forty thousand men, and seven thousand horsemen: to go into the land of Juda, and to destroy it according to the king's orders."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et processerunt ut irent cum universa virtute sua et venerunt et adplicuerunt Ammaum in terra campestri"
      en: "So they went forth with all their power, and came, and pitched near Emmaus in the plain country."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et audierunt mercatores regionum nomen eorum et acceperunt argentum et aurum multum valde et pueros et venerunt in castra ut acciperent filios Israhel in servos et additi sunt ad eos exercitus Syriae et terrae alienigenarum"
      en: "And the merchants of the countries heard the fame of them: and they took silver and gold in abundance, and servants: and they came into the camp, to buy the children of Israel for slaves: and there were joined to them the forces of Syria, and of the land of the strangers."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et vidit Iudas et fratres eius quia multiplicata sunt mala et exercitus adplicabat ad fines eorum et cognoverunt verba regis quae mandavit populo facere in interitum et consummationem"
      en: "And Judas and his brethren saw that evils were multiplied, and that the armies approached to their borders: and they knew the orders the king had given to destroy the people and utterly abolish them."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et dixerunt unusquisque ad proximum suum erigamus deiectionem populi nostri et pugnemus pro populo nostro et sanctis nostris"
      en: "And they said every man to his neighbour: Let us raise up the low condition of our people, and let us fight for our people, and our sanctuary."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et congregatus est conventus ut essent parati in proelium et ut orarent et peterent misericordiam et miserationes"
      en: "And the assembly was gathered that they might be ready for battle: and that they might pray, and ask mercy and compassion."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et Hierusalem non habitabatur sed erat sicut desertum non erat qui ingrederetur et egrederetur de natis eius et sanctum conculcabatur et filii alienigenarum erant in arce ibi erat habitatio gentium et ablata est voluptas ab Iacob et defecit ibi tibia et cithara"
      en: "Now Jerusalem was not inhabited, but was like a desert: there was none of her children that went in or out: and the sanctuary was trodden down: and the children of strangers were in the castle, there was the habitation of the Gentiles: and joy was taken away from Jacob, and the pipe and harp ceased there."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et congregati sunt et venerunt in Masefat contra Hierusalem quia locus orationis erat in Masefat ante Israhel"
      en: "And they assembled together, and came to Maspha over against Jerusalem: for in Maspha was a place of prayer heretofore in Israel."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et ieiunaverunt illa die et induerunt se ciliciis et cinere in capite suo et destituerunt vestimenta sua"
      en: "And they fasted that day, and put on haircloth, and put ashes upon their heads: and they rent their garments:"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et expanderunt librum legis de quibus scrutabantur gentes similitudinem simulacrorum suorum"
      en: "And they laid open the books of the law, in which the Gentiles searched for the likeness of their idols:"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "et adtulerunt ornamenta sacerdotalia et primitias et decimas et suscitaverunt nazoreos qui impleverant dies"
      en: "And they brought the priestly ornaments, and the firstfruits and tithes, and stirred up the Nazarites that had fulfilled their days:"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "et clamaverunt voce magna in caelum dicentes quid faciemus istis et quo eos ducemus"
      en: "And they cried with a loud voice toward heaven, saying: What shall we do with these, and whither shall we carry them?"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "et sancta tua conculcata sunt et contaminata sunt et sacerdotes tui in luctu et humilitate"
      en: "For thy holies are trodden down, and are profaned, and thy priests are in mourning, and are brought low."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "et ecce nationes convenerunt adversum nos ut nos disperdant tu scis quae cogitant in nos"
      en: "And behold the nations are come together against us to destroy us: thou knowest what they intend against us."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "quomodo poterimus subsistere ante facies illorum nisi tu adiuves nos"
      en: "How shall we be able to stand before their face, unless thou, O God, help us?"
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "et tubis exclamaverunt voce magna"
      en: "Then they sounded with trumpets, and cried out with a loud voice."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "et post hoc constituit Iudas duces populi tribunos et centuriones et pentecontarcos et decuriones"
      en: "And after this Judas appointed captains over the people, over thousands, and over hundreds, and over fifties, and over tens."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "et dixit his qui aedificabant domos et sponsabant uxores et plantabant vineas et formidolosis ut redirent unusquisque in domum suam secundum legem"
      en: "And he said to them that were building houses, or had betrothed wives, or were planting vineyards, or were fearful, that they should return every man to his house, according to the law."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "et moverunt castra et conlocaverunt ad austrum Ammaum"
      en: "So they removed the camp, and pitched on the south side of Emmaus."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "et ait Iudas accingimini et estote filii potentes et estote parati in mane ut pugnetis adversus nationes has quae convenerunt disperdere nos et sancta nostra"
      en: "And Judas said: Gird yourselves, and be valiant men, and be ready against the morning, that you may fight with these nations that are assembled against us to destroy us and our sanctuary."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "quoniam melius est nos mori in bello quam videre mala gentis nostrae et sanctorum"
      en: "For it is better for us to die in battle, than to see the evils of our nation, and of the holies:"
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "sicut autem fuerit voluntas in caelo sic fiat"
      en: "Nevertheless as it shall be the will of God in heaven so be it done."
    status: { la: verified, en: verified }
