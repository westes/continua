# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 7
verses:
  - n: 1
    text:
      la: "Cumque complesset Salomon fundens preces, ignis descendit de caelo, et devoravit holocausta et victimas: et majestas Domini implevit domum."
      en: "And when Solomon had made an end of his prayer, fire came down from heaven, and consumed the holocausts and the victims: and the majesty of the Lord filled the house."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Nec poterant sacerdotes ingredi templum Domini, eo quod implesset majestas Domini templum Domini."
      en: "Neither could the priests enter into the temple of the Lord, because the majesty of the Lord had filled the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sed et omnes filii Israel videbant descendentem ignem, et gloriam Domini super domum: et corruentes proni in terram super pavimentum, stratum lapide, adoraverunt, et laudaverunt Dominum, quoniam bonus, quoniam in saeculum misericordia ejus."
      en: "Moreover all the children of Israel saw the fire coming down, and the glory of the Lord upon the house: and falling down with their faces to the ground, upon the stone pavement, they adored and praised the Lord: because he is good, because his mercy endureth for ever."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Rex autem et omnis populus immolabant victimas coram Domino."
      en: "And the king and all the people sacrificed victims before the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Mactavit igitur rex Salomon hostias, boum viginti duo millia, arietum centum viginti millia: et dedicavit domum Dei rex, et universus populus."
      en: "And king Solomon offered a sacrifice of twenty-two thousand oxen, and one hundred and twenty thousand rams: and the king and all the people dedicated the house of God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Sacerdotes autem stabant in officiis suis: et Levitae in organis carminum Domini, quae fecit David rex ad laudandum Dominum: Quoniam in aeternum misericordia ejus, hymnos David canentes per manus suas: porro sacerdotes canebant tubis ante eos, cunctusque Israel stabat."
      en: "And the priests stood in their offices: and the Levites with the instruments of music of the Lord, which king David made to praise the Lord: because his mercy endureth for ever, singing the hymns of David by their ministry: and the priests sounded with trumpets before them, and all Israel stood."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Sanctificavit quoque Salomon medium atrii ante templum Domini: obtulerat enim ibi holocausta et adipes pacificorum: quia altare aeneum, quod fecerat, non poterat sustinere holocausta et sacrificia et adipes."
      en: "Solomon also sanctified the middle of the court before the temple of the Lord: for he offered there the holocausts, and the fat of the peace offerings: because the brazen altar, which he had made, could not hold the holocausts and the sacrifices and the fat:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Fecit ergo Salomon solemnitatem in tempore illo septem diebus, et omnis Israel cum eo, ecclesia magna valde, ab introitu Emath usque ad torrentem Aegypti."
      en: "And Solomon kept the solemnity at that time seven days, and all Israel with him, a very great congregation, from the entrance of Emath to the torrent of Egypt."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Fecitque die octavo collectam, eo quod dedicasset altare septem diebus, et solemnitatem celebrasset diebus septem."
      en: "And he made on the eighth day a solemn assembly, because he had kept the dedication of the altar seven days, and had celebrated the solemnity seven days."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Igitur in die vigesimo tertio mensis septimi, dimisit populos ad tabernacula sua, laetantes atque gaudentes super bono, quod fecerat Dominus Davidi, et Salomoni, et Israeli populo suo."
      en: "So on the three and twentieth day of the seventh month he sent away the people to their dwellings, joyful and glad for the good that the Lord had done to David, and to Solomon, and to all Israel his people."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Complevitque Salomon domum Domini, et domum regis, et omnia quae disposuerat in corde suo, ut faceret in domo Domini, et in domo sua, et prosperatus est."
      en: "And Solomon finished the house of the Lord, and the king's house, and all that he had designed in his heart to do, in the house of the Lord, and in his own house, and he prospered."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Apparuit autem ei Dominus nocte, et ait: Audivi orationem tuam, et elegi locum istum mihi in domum sacrificii."
      en: "And the Lord appeared to him by night, and said: I have heard thy prayer, and I have chosen this place to myself for a house of sacrifice."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Si clausero caelum, et pluvia non fluxerit, et mandavero et praecepero locustae, ut devoret terram, et misero pestilentiam in populum meum:"
      en: "If I shut up heaven, and there fall no rain, or if I give orders, and command the locust to devour the land, or if I send pestilence among my people:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "conversus autem populus meus, super quos invocatum est nomen meum, deprecatus me fuerit, et exquisierit faciem meam, et egerit poenitentiam a viis suis pessimis: et ego exaudiam de caelo, et propitius ero peccatis eorum, et sanabo terram eorum."
      en: "And my people, upon whom my name is called, being converted, shall make supplication to me, and seek out my face, and do penance for their most wicked ways: then will I hear from heaven, and will forgive their sins and will heal their land."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Oculi quoque mei erunt aperti, et aures meae erectae ad orationem ejus, qui in loco isto oraverit."
      en: "My eyes also shall be open, and my ears attentive to the prayer of him that shall pray in this place."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Elegi enim, et sanctificavi locum istum, ut sit nomen meum ibi in sempiternum, et permaneant oculi mei, et cor meum ibi cunctis diebus."
      en: "For I have chosen, and have sanctified this place, that my name may be there for ever, and my eyes and my heart may remain there perpetually."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Tu quoque si ambulaveris coram me, sicut ambulaverit David pater tuus, et feceris juxta omnia, quae praecepi tibi, et justitias meas judiciaque servaveris:"
      en: "And as for thee, if thou walk before me, as David thy father walked, and do according to all that I have commanded thee, and keep my justices and my judgments:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "suscitabo thronum regni tui, sicut pollicitus sum David patri tuo, dicens: Non auferetur de stirpe tua vir, qui sit princeps in Israel."
      en: "I will raise up the throne of thy kingdom, as I promised to David thy father, saying: There shall not fail thee a man of thy stock to be ruler in Israel."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Si autem aversi fueritis, et dereliqueritis justitias meas, et praecepta mea, quae proposui vobis, et abeuntes servieritis diis alienis, et adoraveritis eos,"
      en: "But if you turn away, and forsake my justices, and my commandments which I have set before you, and shall go and serve strange gods, and adore them,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "evellam vos de terra mea, quam dedi vobis: et domum hanc, quam sanctificavi nomini meo, projiciam a facie mea, et tradam eam in parabolam, et in exemplum cunctis populis."
      en: "I will pluck you up by the root out of my land which I have given you: and this house which I have sanctified to my name, I will cast away from before my face, and will make it a byword, and an example among all nations."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et domus ista erit in proverbium universis transeuntibus, et dicent stupentes: Quare fecit Dominus sic terrae huic, et domui huic?"
      en: "And this house shall be for a proverb to all that pass by, and they shall be astonished and say: Why hath the Lord done thus to this land, and to this house?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Respondebuntque: Quia dereliquerunt Dominum Deum patrum suorum, qui eduxit eos de terra Aegypti, et apprehenderunt deos alienos, et adoraverunt eos, et coluerunt: idcirco venerunt super eos universa haec mala."
      en: "And they shall answer: Because they forsook the Lord the God of their fathers, who brought them out of the land of Egypt, and laid hold on strange gods, and adored them, and worshipped them: therefore all these evils are come upon them."
    status: { la: verified, en: verified }
