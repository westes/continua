# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2reg
chapter: 7
verses:
  - n: 1
    text:
      la: "Factum est autem cum sedisset rex in domo sua, et Dominus dedisset ei requiem undique ab universis inimicis suis,"
      en: "And it came to pass when the king sat in his house, and the Lord had given him rest on every side from all his enemies,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixit ad Nathan prophetam: Videsne quod ego habitem in domo cedrina, et arca Dei posita sit in medio pellium?"
      en: "He said to Nathan the prophet: Dost thou see that I dwell in a house of cedar, and the ark of God is lodged within skins?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dixitque Nathan ad regem: Omne quod est in corde tuo, vade, fac: quia Dominus tecum est."
      en: "And Nathan said to the king: Go, do all that is in thy heart: because the Lord is with thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Factum est autem in illa nocte: et ecce sermo Domini ad Nathan, dicens:"
      en: "But it came to pass that night, that the word of the Lord came to Nathan, saying:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Vade, et loquere ad servum meum David: Haec dicit Dominus: Numquid tu aedificabis mihi domum ad habitandum?"
      en: "Go, and say to my servant David: Thus saith the Lord: Shalt thou build me a house to dwell in?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Neque enim habitavi in domo ex die illa, qua eduxi filios Israel de terra Aegypti, usque in diem hanc: sed ambulabam in tabernaculo, et in tentorio."
      en: "Whereas I have not dwelt in a house from the day that I brought the children of Israel out of the land of Egypt even to this day: but have walked in a tabernacle, and in a tent."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Per cuncta loca, quae transivi cum omnibus filiis Israel, numquid loquens locutus sum ad unam de tribubus Israel, cui praecepi ut pasceret populum meum Israel, dicens: Quare non aedificastis mihi domum cedrinam?"
      en: "In all the places that I have gone through with all the children of Israel, did ever I speak a word to any one of the tribes of Israel, whom I commanded to feed my people Israel, saying: Why have you not built me a house of cedar?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et nunc haec dices servo meo David: Haec dicit Dominus exercituum: Ego tuli te de pascuis sequentem greges, ut esses dux super populum meum Israel:"
      en: "And now thus shalt thou speak to my servant David: Thus saith the Lord of hosts: I took thee out of the pastures from following the sheep to be ruler over my people Israel:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et fui tecum in omnibus ubicumque ambulasti, et interfeci universos inimicos tuos a facie tua: fecique tibi nomen grande, juxta nomen magnorum qui sunt in terra."
      en: "And I have been with thee wheresoever thou hast walked, and have slain all thy enemies from before thy face: and I have made thee a great man, like unto the name of the great ones that are on the earth."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et ponam locum populo meo Israel, et plantabo eum, et habitabit sub eo, et non turbabitur amplius: nec addent filii iniquitatis ut affligant eum sicut prius,"
      en: "And I will appoint a place for my people Israel, and I will plant them, and they shall dwell therein, and shall be disturbed no more: neither shall the children of iniquity afflict them any more as they did before,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ex die qua constitui judices super populum meum Israel: et requiem dabo tibi ab omnibus inimicis tuis: praedicitque tibi Dominus, quod domum faciat tibi Dominus."
      en: "From the day that I appointed judges over my people Israel: and I will give thee rest from all thy enemies. And the Lord foretelleth to thee, that the Lord will make thee a house."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cumque completi fuerint dies tui, et dormieris cum patribus tuis, suscitabo semen tuum post te, quod egredietur de utero tuo, et firmabo regnum ejus."
      en: "And when thy days shall be fulfilled, and thou shalt sleep with thy fathers, I will raise up thy seed after thee, which shall proceed out of thy bowels, and I will establish his kingdom."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ipse aedificabit domum nomini meo, et stabiliam thronum regni ejus usque in sempiternum."
      en: "He shall build a house to my name, and I will establish the throne of his kingdom for ever."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ego ero ei in patrem, et ipse erit mihi in filium: qui si inique aliquid gesserit, arguam eum in virga virorum, et in plagis filiorum hominum."
      en: "I will be to him a father, and he shall be to me a son: and if he commit any iniquity, I will correct him with the rod of men, and with the stripes of the children of men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Misericordiam autem meam non auferam ab eo, sicut abstuli a Saul, quem amovi a facie mea."
      en: "But my mercy I will not take away from him, as I took it from Saul, whom I removed from before my face."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et fidelis erit domus tua, et regnum tuum usque in aeternum ante faciem tuam, et thronus tuus erit firmus jugiter."
      en: "And thy house shall be faithful, and thy kingdom for ever before thy face, and thy throne shall be firm for ever."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Secundum omnia verba haec, et juxta universam visionem istam, sic locutus est Nathan ad David."
      en: "According to all these words and according to all this vision, so did Nathan speak to David."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ingressus est autem rex David, et sedit coram Domino, et dixit: Quis ego sum, Domine Deus, et quae domus mea, quia adduxisti me hucusque?"
      en: "And David went in, and sat before the Lord, and said: Who am I, O Lord God, and what is my house, that thou hast brought me thus far?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Sed et hoc parum visum est in conspectu tuo Domine Deus, nisi loquereris etiam de domo servi tui in longinquum: ista est enim lex Adam, Domine Deus."
      en: "But yet this hath seemed little in thy sight, O Lord God, unless thou didst also speak of the house of thy servant for a long time to come: for this is the law of Adam, O Lord God."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quid ergo addere poterit adhuc David, ut loquatur ad te? tu enim scis servum tuum, Domine Deus."
      en: "And what can David say more unto thee? for thou knowest thy servant, O Lord God:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Propter verbum tuum, et secundum cor tuum, fecisti omnia magnalia haec, ita ut notum faceres servo tuo."
      en: "For thy word's sake, and according to thy own heart thou hast done all these great things, so that thou wouldst make it known to thy servant."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Idcirco magnificatus es, Domine Deus, quia non est similis tui, neque est Deus extra te, in omnibus quae audivimus auribus nostris."
      en: "Therefore thou art magnified, O Lord God, because there is none like to thee, neither is there any God besides thee, in all the things that we have heard with our ears."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Quae est autem, ut populus tuus Israel, gens in terra, propter quam ivit Deus, ut redimeret eam sibi in populum, et poneret sibi nomen, faceretque eis magnalia, et horribilia super terram, a facie populi tui, quem redemisti tibi ex Aegypto, gentem, et deum ejus."
      en: "And what nation is there upon earth, as thy people Israel, whom God went to redeem for a people to himself, and to make him a name, and to do for them great and terrible things, upon the earth, before the face of thy people, whom thou redeemedst to thyself out of Egypt, from the nations and their gods."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Firmasti enim tibi populum tuum Israel in populum sempiternum: et tu Domine Deus factus es eis in Deum."
      en: "For thou hast confirmed to thyself thy people Israel to be an everlasting people: and thou, O Lord God, art become their God."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Nunc ergo Domine Deus, verbum, quod locutus es super servum tuum, et super domum ejus, suscita in sempiternum: et fac sicut locutus es,"
      en: "And now, O Lord God, raise up for ever the word that thou hast spoken, concerning thy servant and concerning his house: and do as thou hast spoken,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ut magnificetur nomen tuum usque in sempiternum, atque dicatur: Dominus exercituum, Deus super Israel. Et domus servi tui David erit stabilita coram Domino,"
      en: "That thy name may be magnified for ever, and it may be said: The Lord of hosts is God over Israel. And the house of thy servant David shall be established before the Lord."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "quia tu Domine exercituum Deus Israel revelasti aurem servi tui, dicens: Domum aedificabo tibi: propterea invenit servus tuus cor suum ut oraret te oratione hac."
      en: "Because thou, O Lord of hosts, God of Israel, hast revealed to the ear of thy servant, saying: I will build thee a house: therefore hath thy servant found in his heart to pray this prayer to thee."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Nunc ergo Domine Deus, tu es Deus, et verba tua erunt vera: locutus es enim ad servum tuum bona haec."
      en: "And now, O Lord God, thou art God, and thy words shall be true: for thou hast spoken to thy servant these good things."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Incipe ergo, et benedic domui servi tui, ut sit in sempiternum coram te: quia tu Domine Deus locutus es, et benedictione tua benedicetur domus servi tui in sempiternum."
      en: "And now begin, and bless the house of thy servant, that it may endure for ever before thee: because thou, O Lord God, hast spoken it, and with thy blessing let the house of thy servant be blessed for ever."
    status: { la: verified, en: verified }
