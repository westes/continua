# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 4reg
chapter: 2
verses:
  - n: 1
    text:
      la: "factum est autem cum levare vellet Dominus Heliam per turbinem in caelum ibant Helias et Heliseus de Galgalis"
      en: "And it came to pass, when the Lord would take up Elias into heaven by a whirlwind, that Elias and Eliseus were going from Galgal."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixitque Helias ad Heliseum sede hic quia Dominus misit me usque Bethel cui ait Heliseus vivit Dominus et vivit anima tua quia non derelinquam te cumque descendissent Bethel"
      en: "And Elias said to Eliseus: Stay thou here, because the Lord hath sent me as far as Bethel. And Eliseus said to him: As the Lord liveth, and as thy soul liveth, I will not leave thee. And when they were come down to Bethel,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "egressi sunt filii prophetarum qui erant Bethel ad Heliseum et dixerunt ei numquid nosti quia hodie Dominus tollat dominum tuum a te qui respondit et ego novi silete"
      en: "The sons of the prophets, that were at Bethel, came forth to Eliseus, and said to him: Dost thou know that this day the Lord will take away thy master from thee? And he answered: I also know it: hold your peace."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dixit autem Helias ad Heliseum sede hic quia Dominus misit me in Hiericho et ille ait vivit Dominus et vivit anima tua quia non derelinquam te cumque venissent Hierichum"
      en: "And Elias said to Eliseus: Stay here because the Lord hath sent me to Jericho. And he said: As the Lord liveth, and as thy soul liveth, I will not leave thee. And when they were come to Jericho,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "accesserunt filii prophetarum qui erant in Hiericho ad Heliseum et dixerunt ei numquid nosti quia hodie Dominus tollet dominum tuum a te et ait et ego novi silete"
      en: "The sons of the prophets that were at Jericho, came to Eliseus, and said to him: Dost thou know that this day the Lord will take away thy master from thee? And he said: I also know it: hold your peace."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixit autem ei Helias sede hic quia Dominus misit me ad Iordanem qui ait vivit Dominus et vivit anima tua quia non derelinquam te ierunt igitur ambo pariter"
      en: "And Elias said to him: Stay here, because the Lord hath sent me as far as the Jordan. And he said: As the Lord liveth, and as thy soul liveth, I will not leave thee; and they two went on together,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et quinquaginta viri de filiis prophetarum secuti sunt qui et steterunt e contra longe illi autem ambo stabant super Iordanem"
      en: "And fifty men of the sons of the prophets followed them, and stood in sight at a distance: but they two stood by the Jordan."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "tulitque Helias pallium suum et involvit illud et percussit aquas quae divisae sunt in utramque partem et transierunt ambo per siccum"
      en: "And Elias took his mantle and folded it together, and struck the waters, and they were divided hither and thither, and they both passed over on dry ground."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cumque transissent Helias dixit ad Heliseum postula quod vis ut faciam tibi antequam tollar a te dixitque Heliseus obsecro ut fiat duplex spiritus tuus in me"
      en: "And when they were gone over, Elias said to Eliseus: Ask what thou wilt have me to do for thee, before I be taken away from thee. And Eliseus said: I beseech thee that in me may be thy double spirit."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui respondit rem difficilem postulasti attamen si videris me quando tollor a te erit quod petisti si autem non videris non erit"
      en: "And he answered: Thou hast asked a hard thing: nevertheless if thou see me when I am taken from thee, thou shalt have what thou hast asked: but if thou see me not, thou shalt not have it."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cumque pergerent et incedentes sermocinarentur ecce currus igneus et equi ignei diviserunt utrumque et ascendit Helias per turbinem in caelum"
      en: "And as they went on, walking and talking together, behold a fiery chariot, and fiery horses parted them both asunder: and Elias went up by a whirlwind into heaven."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Heliseus autem videbat et clamabat pater mi pater mi currus Israhel et auriga eius et non vidit eum amplius adprehenditque vestimenta sua et scidit illa in duas partes"
      en: "And Eliseus saw him, and cried: My father, my father, the chariot of Israel, and the driver thereof. And he saw him no more: and he took hold of his own garments, and rent them in two pieces."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et levavit pallium Heliae quod ceciderat ei reversusque stetit super ripam Iordanis"
      en: "And he took up the mantle of Elias, that fell from him: and going back, he stood upon the bank of the Jordan,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et pallio Heliae quod ceciderat ei percussit aquas et dixit ubi est Deus Heliae etiam nunc percussitque aquas et divisae sunt huc atque illuc et transiit Heliseus"
      en: "And he struck the waters with the mantle of Elias, that had fallen from him, and they were not divided. And he said: Where is now the God of Elias? And he struck the waters, and they were divided, hither and thither, and Eliseus passed over."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "videntes autem filii prophetarum qui erant in Hiericho de contra dixerunt requievit spiritus Heliae super Heliseum et venientes in occursum eius adoraverunt eum proni in terram"
      en: "And the sons of the prophets at Jericho, who were over against him, seeing it said: The spirit of Elias hath rested upon Eliseus. And coming to meet him, they worshipped him, falling to the ground,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixeruntque illi ecce cum servis tuis sunt quinquaginta viri fortes qui possint ire et quaerere dominum tuum ne forte tulerit eum spiritus Domini et proiecerit in uno montium aut in una vallium qui ait nolite mittere"
      en: "And they said to him: Behold, there are with thy servants fifty strong men, that can go, and seek thy master, lest perhaps the spirit of the Lord hath taken him up and cast him upon some mountain or into some valley. And he said: Do not send."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "coegeruntque eum donec adquiesceret et diceret mittite et miserunt quinquaginta viros qui cum quaesissent tribus diebus non invenerunt"
      en: "But they pressed him, till he consented, and said: Send. And they sent fifty men: and they sought three days but found him not."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et reversi sunt ad eum at ille habitabat in Hiericho dixitque eis numquid non dixi vobis nolite ire"
      en: "And they came back to him: for he abode at Jericho, and he said to them: Did I not say to you: Do not send?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "dixerunt quoque viri civitatis ad Heliseum ecce habitatio civitatis huius optima est sicut tu ipse domine perspicis sed aquae pessimae sunt et terra sterilis"
      en: "And the men of the city said to Eliseus: Behold the situation of this city is very good, as thou, my lord, seest: but the waters are very bad, and the ground barren."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "at ille ait adferte mihi vas novum et mittite in illud sal qui cum adtulissent"
      en: "And he said: Bring me a new vessel, and put salt into it. And when they had brought it,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "egressus ad fontem aquarum misit in eum sal et ait haec dicit Dominus sanavi aquas has et non erit ultra in eis mors neque sterilitas"
      en: "He went out to the spring of the waters, and cast the salt into it, and said: Thus saith the Lord: I have healed these waters, and there shall be no more in them death or barrenness."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sanatae sunt ergo aquae usque ad diem hanc iuxta verbum Helisei quod locutus est"
      en: "And the waters were healed unto this day, according to the word of Eliseus, which he spoke."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ascendit autem inde Bethel cumque ascenderet per viam pueri parvi egressi sunt de civitate et inludebant ei dicentes ascende calve ascende calve"
      en: "And he went up from thence to Bethel: and as he was going up by the way, little boys came out of the city and mocked him, saying: Go up, thou bald head; go up, thou bald head."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "qui cum se respexisset vidit eos et maledixit eis in nomine Domini egressique sunt duo ursi de saltu et laceraverunt ex eis quadraginta duos pueros"
      en: "And looking back, he saw them, and cursed them in the name of the Lord: and there came forth two bears out of the forest, and tore of them two and forty boys."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "abiit autem inde in montem Carmeli et inde reversus est Samariam"
      en: "And from thence he went to mount Carmel, and from thence he returned to Samaria."
    status: { la: verified, en: verified }
