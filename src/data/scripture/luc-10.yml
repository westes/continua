# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: luc
chapter: 10
verses:
  - n: 1
    text:
      la: "post haec autem designavit Dominus et alios septuaginta duos et misit illos binos ante faciem suam in omnem civitatem et locum quo erat ipse venturus"
      en: "And after these things the Lord appointed also other seventy-two: and he sent them two and two before his face into every city and place whither he himself was to come."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et dicebat illis messis quidem multa operarii autem pauci rogate ergo Dominum messis ut mittat operarios in messem"
      en: "And he said to them: The harvest indeed is great, but the labourers are few. Pray ye therefore the Lord of the harvest, that he send labourers into his harvest."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ite ecce ego mitto vos sicut agnos inter lupos"
      en: "Go: Behold I send you as lambs among wolves."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "nolite portare sacculum neque peram neque calciamenta et neminem per viam salutaveritis"
      en: "Carry neither purse, nor scrip, nor shoes; and salute no man by the way."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "in quamcumque domum intraveritis primum dicite pax huic domui"
      en: "Into whatsoever house you enter, first say: Peace be to this house."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et si ibi fuerit filius pacis requiescet super illam pax vestra sin autem ad vos revertetur"
      en: "And if the son of peace be there, your peace shall rest upon him; but if not, it shall return to you."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in eadem autem domo manete edentes et bibentes quae apud illos sunt dignus enim est operarius mercede sua nolite transire de domo in domum"
      en: "And in the same house, remain, eating and drinking such things as they have: for the labourer is worthy of his hire. Remove not from house to house."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et in quamcumque civitatem intraveritis et susceperint vos manducate quae adponuntur vobis"
      en: "And into what city soever you enter, and they receive you, eat such things as are set before you."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et curate infirmos qui in illa sunt et dicite illis adpropinquavit in vos regnum Dei"
      en: "And heal the sick that are therein, and say to them: The kingdom of God is come nigh unto you."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in quamcumque civitatem intraveritis et non receperint vos exeuntes in plateas eius dicite"
      en: "But into whatsoever city you enter, and they receive you not, going forth into the streets thereof, say:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "etiam pulverem qui adhesit nobis de civitate vestra extergimus in vos tamen hoc scitote quia adpropinquavit regnum Dei"
      en: "Even the very dust of your city that cleaveth to us, we wipe off against you. Yet know this, that the kingdom of God is at hand."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dico vobis quia Sodomis in die illa remissius erit quam illi civitati"
      en: "I say to you, it shall be more tolerable at that day for Sodom, than for that city."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "vae tibi Corazain vae tibi Bethsaida quia si in Tyro et Sidone factae fuissent virtutes quae in vobis factae sunt olim in cilicio et cinere sedentes paeniterent"
      en: "Woe to thee, Corozain, woe to thee, Bethsaida. For if in Tyre and Sidon had been wrought the mighty works that have been wrought in you, they would have done penance long ago, sitting in sackcloth and ashes."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "verumtamen Tyro et Sidoni remissius erit in iudicio quam vobis"
      en: "But it shall be more tolerable for Tyre and Sidon at the judgement, than for you."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et tu Capharnaum usque in caelum exaltata usque ad infernum demergeris"
      en: "And thou, Capharnaum, which art exalted unto heaven, thou shalt be thrust down to hell."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "qui vos audit me audit et qui vos spernit me spernit qui autem me spernit spernit eum qui me misit"
      en: "He that heareth you, heareth me; and he that despiseth you, despiseth me; and he that despiseth me, despiseth him that sent me."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "reversi sunt autem septuaginta duo cum gaudio dicentes Domine etiam daemonia subiciuntur nobis in nomine tuo"
      en: "And the seventy-two returned with joy, saying: Lord, the devils also are subject to us in thy name."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ait illis videbam Satanan sicut fulgur de caelo cadentem"
      en: "And he said to them: I saw Satan like lightening falling from heaven."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ecce dedi vobis potestatem calcandi supra serpentes et scorpiones et supra omnem virtutem inimici et nihil vobis nocebit"
      en: "Behold, I have given you power to tread upon serpents and scorpions, and upon all the power of the enemy: and nothing shall hurt you."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "verumtamen in hoc nolite gaudere quia spiritus vobis subiciuntur gaudete autem quod nomina vestra scripta sunt in caelis"
      en: "But yet rejoice not in this, that spirits are subject unto you; but rejoice in this, that your names are written in heaven."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "in ipsa hora exultavit Spiritu Sancto et dixit confiteor tibi Pater Domine caeli et terrae quod abscondisti haec a sapientibus et prudentibus et revelasti ea parvulis etiam Pater quia sic placuit ante te"
      en: "In that same hour, he rejoiced in the Holy Ghost, and said: I confess to thee, O Father, Lord of heaven and earth, because thou hast hidden these things from the wise and prudent, and hast revealed them to little ones. Yea, Father, for so it hath seemed good in thy sight."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "omnia mihi tradita sunt a Patre meo et nemo scit qui sit Filius nisi Pater et qui sit Pater nisi Filius et cui voluerit Filius revelare"
      en: "All things are delivered to me by my Father; and no one knoweth who the Son is, but the Father; and who the Father is, but the Son, and to whom the Son will reveal him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et conversus ad discipulos suos dixit beati oculi qui vident quae videtis"
      en: "And turning to his disciples, he said: Blessed are the eyes that see the things which you see."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "dico enim vobis quod multi prophetae et reges voluerunt videre quae vos videtis et non viderunt et audire quae auditis et non audierunt"
      en: "For I say to you, that many prophets and kings have desired to see the things that you see, and have not seen them; and to hear the things that you hear, and have not heard them."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et ecce quidam legis peritus surrexit temptans illum et dicens magister quid faciendo vitam aeternam possidebo"
      en: "And behold a certain lawyer stood up, tempting him, and saying, Master, what must I do to possess eternal life?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "at ille dixit ad eum in lege quid scriptum est quomodo legis"
      en: "But he said to him: What is written in the law? how readest thou?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ille respondens dixit diliges Dominum Deum tuum ex toto corde tuo et ex tota anima tua et ex omnibus viribus tuis et ex omni mente tua et proximum tuum sicut te ipsum"
      en: "He answering, said: Thou shalt love the Lord thy God with thy whole heart, and with thy whole soul, and with all thy strength, and with all thy mind: and thy neighbour as thyself."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "dixitque illi recte respondisti hoc fac et vives"
      en: "And he said to him: Thou hast answered right: this do, and thou shalt live."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ille autem volens iustificare se ipsum dixit ad Iesum et quis est meus proximus"
      en: "But he willing to justify himself, said to Jesus: And who is my neighbour?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "suscipiens autem Iesus dixit homo quidam descendebat ab Hierusalem in Hiericho et incidit in latrones qui etiam despoliaverunt eum et plagis inpositis abierunt semivivo relicto"
      en: "And Jesus answering, said: A certain man went down from Jerusalem to Jericho, and fell among robbers, who also stripped him, and having wounded him went away, leaving him half dead."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "accidit autem ut sacerdos quidam descenderet eadem via et viso illo praeterivit"
      en: "And it chanced, that a certain priest went down the same way: and seeing him, passed by."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "similiter et Levita cum esset secus locum et videret eum pertransiit"
      en: "In like manner also a Levite, when he was near the place and saw him, passed by."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Samaritanus autem quidam iter faciens venit secus eum et videns eum misericordia motus est"
      en: "But a certain Samaritan being on his journey, came near him; and seeing him, was moved with compassion."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et adpropians alligavit vulnera eius infundens oleum et vinum et inponens illum in iumentum suum duxit in stabulum et curam eius egit"
      en: "And going up to him, bound up his wounds, pouring in oil and wine: and setting him upon his own beast, brought him to an inn, and took care of him."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et altera die protulit duos denarios et dedit stabulario et ait curam illius habe et quodcumque supererogaveris ego cum rediero reddam tibi"
      en: "And the next day he took out two pence, and gave to the host, and said: Take care of him; and whatsoever thou shalt spend over and above, I, at my return, will repay thee."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "quis horum trium videtur tibi proximus fuisse illi qui incidit in latrones"
      en: "Which of these three, in thy opinion, was neighbour to him that fell among the robbers?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "at ille dixit qui fecit misericordiam in illum et ait illi Iesus vade et tu fac similiter"
      en: "But he said: He that shewed mercy to him. And Jesus said to him: Go, and do thou in like manner."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "factum est autem dum irent et ipse intravit in quoddam castellum et mulier quaedam Martha nomine excepit illum in domum suam"
      en: "Now it came to pass as they went, that he entered into a certain town: and a certain woman named Martha, received him into her house."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et huic erat soror nomine Maria quae etiam sedens secus pedes Domini audiebat verbum illius"
      en: "And she had a sister called Mary, who sitting also at the Lord's feet, heard his word."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Martha autem satagebat circa frequens ministerium quae stetit et ait Domine non est tibi curae quod soror mea reliquit me solam ministrare dic ergo illi ut me adiuvet"
      en: "But Martha was busy about much serving. Who stood and said: Lord, hast thou no care that my sister hath left me alone to serve? speak to her therefore, that she help me."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et respondens dixit illi Dominus Martha Martha sollicita es et turbaris erga plurima"
      en: "And the Lord answering, said to her: Martha, Martha, thou art careful, and art troubled about many things:"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "porro unum est necessarium Maria optimam partem elegit quae non auferetur ab ea"
      en: "But one thing is necessary. Mary hath chosen the best part, which shall not be taken away from her."
    status: { la: verified, en: verified }
