# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1par
chapter: 15
verses:
  - n: 1
    text:
      la: "Fecit quoque sibi domos in civitate David: et aedificavit locum arcae Dei, tetenditque ei tabernaculum."
      en: "He made also houses for himself in the city of David: and built a place for the ark of God, and pitched a tabernacle for it."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Tunc dixit David: Illicitum est ut a quocumque portetur arca Dei nisi a Levitis, quos elegit Dominus ad portandum eam, et ad ministrandum sibi usque in aeternum."
      en: "Then David said: No one ought to carry the ark of God, but the Levites, whom the Lord hath chosen to carry it, and to minister unto himself for ever."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Congregavitque universum Israel in Jerusalem, ut afferretur arca Dei in locum suum, quem praeparaverat ei:"
      en: "And he gathered all Israel together into Jerusalem, that the ark of God might be brought into its place, which he had prepared for it."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "necnon et filios Aaron, et Levitas."
      en: "And the sons of Aaron also, and the Levites."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "De filiis Caath, Uriel princeps fuit, et fratres ejus centum viginti."
      en: "Of the children of Caath, Uriel was the chief, and his brethren a hundred and twenty."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "De filiis Merari, Asaia princeps: et fratres ejus ducenti viginti."
      en: "Of the sons of Merari, Asaia the chief, and his brethren two hundred and twenty."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "De filiis Gersom, Joel princeps: et fratres ejus centum triginta."
      en: "Of the sons of Gersom, Joel the chief, and his brethren a hundred and thirty."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "De filiis Elisaphan, Semeias princeps: et fratres ejus ducenti."
      en: "Of the sons of Elisaphan, Semeias the chief: and his brethren two hundred."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "De filiis Hebron, Eliel princeps: et fratres ejus octoginta."
      en: "Of the sons of Hebron, Eliel the chief: and his brethren eighty."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "De filiis Oziel, Aminadab princeps: et fratres ejus centum duodecim."
      en: "Of the sons of Oziel, Aminadab the chief: and his brethren a hundred and twelve."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Vocavitque David Sadoc, et Abiathar sacerdotes, et Levitas, Uriel, Asaiam, Joel, Semeiam, Eliel, et Aminadab:"
      en: "And David called Sadoc, and Abiathar the priests, and the Levites, Uriel, Asaia, Joel, Semeia, Eliel, and Aminadab:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et dixit ad eos: Vos, qui estis principes familiarum Leviticarum, sanctificamini cum fratribus vestris, et afferte arcam Domini Dei Israel ad locum qui ei praeparatus est:"
      en: "And he said to them: You that are the heads of the Levitical families, be sanctified with your brethren, and bring the ark of the Lord the God of Israel to the place, which is prepared for it:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ne ut a principio, quia non eratis praesentes, percussit nos Dominus; sic et nunc fiat, illicitum quid nobis agentibus."
      en: "Lest as the Lord at first struck us, because you were not present, the same should now also come to pass, by our doing some thing against the law."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sanctificati sunt ergo sacerdotes, et Levitae, ut portarent arcam Domini Dei Israel."
      en: "So the priests and the Levites were sanctified, to carry the ark of the Lord the God of Israel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et tulerunt filii Levi arcam Dei, sicut praeceperat Moyses juxta verbum Domini, humeris suis in vectibus."
      en: "And the sons of Levi took the ark of God as Moses had commanded, according to the word of the Lord, upon their shoulders, with the staves."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Dixitque David principibus Levitarum, ut constituerent de fratribus suis cantores in organis musicorum, nablis videlicet, et lyris, et cymbalis, ut resonaret in excelsis sonitus laetitiae."
      en: "And David spoke to the chiefs of the Levites, to appoint some of their brethren to be singers with musical instruments, to wit, on psalteries, and harps, and cymbals, that the joyful noise might resound on high."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Constitueruntque Levitas: Heman filium Joel, et de fratribus ejus Asaph filium Barachiae: de filiis vero Merari, fratribus eorum: Ethan filium Casaiae."
      en: "And they appointed Levites, Hemam the son of Joel, and of his brethren Asaph the son of Barachias: and of the sons of Merari, their brethren: Ethan the son of Casaia."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et cum eis fratres eorum: in secundo ordine, Zachariam, et Ben, et Jaziel, et Semiramoth, et Jahiel, et Ani, Eliab, et Banaiam, et Maasiam, et Mathathiam, et Eliphalu, et Maceniam, et Obededom, et Jehiel, janitores."
      en: "And with them their brethren: in the second rank, Zacharias, and Ben, and Jaziel, and Semiramoth, and Jahiel, and Ani, and Eliab, and Banaias, and Maasias, and Mathathias, and Eliphalu, and Macenias, and Obededom, and Jehiel, the porters."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Porro cantores, Heman, Asaph, et Ethan, in cymbalis aeneis concrepantes."
      en: "Now the singers, Heman, Asaph, and Ethan, sounded with cymbals of brass."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Zacharias autem, et Oziel, et Semiramoth, et Jahiel, et Ani, et Eliab, et Maasias, et Banaias in nablis arcana cantabant."
      en: "And Zacharias, and Oziel, and Semiramoth, and Jehiel, and Ani, and Eliab, and Maasias, and Banaias, sung mysteries upon psalteries."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Porro Mathathias, et Eliphalu, et Macenias, et Obededom, et Jehiel, et Ozaziu, in citharis pro octava canebant epinicion."
      en: "And Mathathias, and Eliphalu, and Macenias and Obededom, and Jehiel and Ozaziu, sung a song of victory for the octave upon harps."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Chonenias autem princeps Levitarum, prophetiae praeerat, ad praecindendam melodiam: erat quippe valde sapiens."
      en: "And Chonenias chief of the Levites, presided over the prophecy, to give out the tunes: for he was very skillful."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et Barachias, et Elcana, janitores arcae."
      en: "And Barachias, and Elcana, were doorkeepers of the ark."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Porro Sebenias, et Josaphat, et Nathanael, et Amasai, et Zacharias, et Banaias, et Eliezer sacerdotes, clangebant tubis coram arca Dei: et Obededom, et Jehias, erant janitores arcae."
      en: "And Sebenias, and Josaphat, and Nathanael, and Amasai, and Zacharias, and Banaias, and Eliezer the priests, sounded with trumpets, before the ark of God: and Obededom and Jehias were porters of the ark."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Igitur David, et omnes majores natu Israel, et tribuni, ierunt ad deportandam arcam foederis Domini de domo Obededom cum laetitia."
      en: "So David and all the ancients of Israel, and the captains over thousands, went to bring the ark of the covenant of the Lord out of the house of Obededom with joy."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Cumque adjuvisset Deus Levitas, qui portabant arcam foederis Domini, immolabantur septem tauri, et septem arietes."
      en: "And when God had helped the Levites who carried the ark of the covenant of the Lord, they offered in sacrifice seven oxen, and seven rams."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Porro David erat indutus stola byssina, et universi Levitae qui portabant arcam, cantoresque et Chonenias princeps prophetiae inter cantores: David autem etiam indutus erat ephod lineo."
      en: "And David was clothed with a robe of fine linen, and all the Levites that carried the ark, and the singing men, and Chonenias the ruler of the prophecy among the singers: and David also had on him an ephod of linen."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Universusque Israel deducebant arcam foederis Domini in jubilo, et sonitu buccinae, et tubis, et cymbalis, et nablis, et citharis concrepantes."
      en: "And all Israel brought the ark of the covenant of the Lord with joyful shouting, and sounding with the sound of the cornet, and with trumpets, and cymbals, and psalteries, and harps."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Cumque pervenisset arca foederis Domini usque ad civitatem David, Michol filia Saul prospiciens per fenestram, vidit regem David saltantem atque ludentem, et despexit eum in corde suo."
      en: "And when the ark of the covenant of the Lord was come to the city of David, Michol the daughter of Saul looking out at a window, saw king David dancing and playing, and she despised him in her heart."
    status: { la: verified, en: verified }
