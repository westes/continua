# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1par
chapter: 15
verses:
  - n: 1
    text:
      la: "fecit quoque sibi domos in civitate David et aedificavit locum arcae Dei tetenditque ei tabernaculum"
      en: "He made also houses for himself in the city of David: and built a place for the ark of God, and pitched a tabernacle for it."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tunc dixit David inlicitum est ut a quocumque portetur arca Dei nisi a Levitis quos elegit Dominus ad portandum eam et ad ministrandum sibi usque in aeternum"
      en: "Then David said: No one ought to carry the ark of God, but the Levites, whom the Lord hath chosen to carry it, and to minister unto himself for ever."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "congregavitque universum Israhel in Hierusalem ut adferretur arca Dei in locum suum quem praeparaverat ei"
      en: "And he gathered all Israel together into Jerusalem, that the ark of God might be brought into its place, which he had prepared for it."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "necnon et filios Aaron et Levitas"
      en: "And the sons of Aaron also, and the Levites."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "de filiis Caath Urihel princeps fuit et fratres eius centum viginti"
      en: "Of the children of Caath, Uriel was the chief, and his brethren a hundred and twenty."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "de filiis Merari Asaia princeps et fratres eius ducenti viginti"
      en: "Of the sons of Merari, Asaia the chief, and his brethren two hundred and twenty."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "de filiis Gersom Iohel princeps et fratres eius centum triginta"
      en: "Of the sons of Gersom, Joel the chief, and his brethren a hundred and thirty."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "de filiis Elisaphan Semeias princeps et fratres eius ducenti"
      en: "Of the sons of Elisaphan, Semeias the chief: and his brethren two hundred."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "de filiis Hebron Elihel princeps et fratres eius octoginta"
      en: "Of the sons of Hebron, Eliel the chief: and his brethren eighty."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "de filiis Ozihel Aminadab princeps et fratres eius centum duodecim"
      en: "Of the sons of Oziel, Aminadab the chief: and his brethren a hundred and twelve."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "vocavitque David Sadoc et Abiathar sacerdotes et Levitas Urihel Asaiam Iohel Semeiam Elihel et Aminadab"
      en: "And David called Sadoc, and Abiathar the priests, and the Levites, Uriel, Asaia, Joel, Semeia, Eliel, and Aminadab:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et dixit ad eos vos qui estis principes familiarum leviticarum sanctificamini cum fratribus vestris et adferte arcam Domini Dei Israhel ad locum qui ei praeparatus est"
      en: "And he said to them: You that are the heads of the Levitical families, be sanctified with your brethren, and brine the ark of the Lord the God of Israel to the place, which is prepared for it:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ne ut a principio quia non eratis praesentes percussit nos Dominus sic et nunc fiat inlicitum quid nobis agentibus"
      en: "Lest as the Lord at first struck us, because you were not present, the same should now also come to pass, by our doing some thing against the law."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sanctificati sunt ergo sacerdotes et Levitae ut portarent arcam Domini Dei Israhel"
      en: "So the priests and the Levites were sanctified, to carry the ark of the Lord the God of Israel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et tulerunt filii Levi arcam Dei sicut praeceperat Moses iuxta verbum Domini umeris suis in vectibus"
      en: "And the sons of Levi took the ark of God as Moses had commanded, according to the word of the Lord, upon their shoulders, with the staves."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixit quoque David principibus Levitarum ut constituerent de fratribus suis cantores in organis musicorum nablis videlicet et lyris et cymbalis ut resonaret in excelsum sonitus laetitiae"
      en: "And David spoke to the chiefs of the Levites, to appoint some of their brethren to be singers with musical instruments, to wit, on psalteries, and harps, and cymbals, that the joyful noise might resound on high."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "constitueruntque Levitas Heman filium Iohel et de fratribus eius Asaph filium Barachiae de filiis vero Merari fratribus eorum Ethan filium Casaiae"
      en: "And they appointed Levites, Hemam the son of Joel, and of his brethren Asaph the son of Barachias: and of the sons of Merari, their brethren: Ethan the son of Casaia."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et cum eis fratres eorum in secundo ordine Zacchariam et Ben et Iazihel et Semiramoth et Iahihel et Ani Eliab et Banaiam et Maasiam et Matthathiam et Eliphalu et Macheniam et Obededom et Ieihel ianitores"
      en: "And with them their brethren: in the second rank, Zacharias, and Ben, and Jaziel, and Semiramoth, and Jahiel, and Ani, and Eliab, and Banaias, and Maasias, and Mathathias, and Eliphalu, and Macenias, and Obededom, and Jehiel, the porters."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "porro cantores Heman Asaph et Ethan in cymbalis aeneis concrepantes"
      en: "Now the singers, Heman, Asaph, and Ethan, sounded with cymbals of brass."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Zaccharias autem et Ozihel et Semiramoth et Iahihel et Ani et Eliab et Maasias et Banaias in nablis arcana cantabant"
      en: "And Zacharias, and Oziel, and Semiramoth, and Jehiel, and Ani, and Eliab, and Maasias, and Banaias, sung mysteries upon psalteries."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "porro Matthathias et Eliphalu et Machenias et Obededom et Ieihel et Ozaziu in citharis pro octava canebant epinikion"
      en: "And Mathathias, and Eliphalu, and Macenias and Obededom, and Jehiel and Ozaziu, sung a song of victory for the octave upon harps."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Chonenias autem princeps Levitarum prophetiae praeerat ad praecinendam melodiam erat quippe valde sapiens"
      en: "And Chonenias chief of the Levites, presided over the prophecy, to give out the tunes: for he was very skilful."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et Barachias et Helcana ianitores arcae"
      en: "And Barachias, and Elcana, were doorkeepers of the ark."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "porro Sebenias et Iosaphat et Nathanahel et Amasai et Zaccharias et Banaias et Eliezer sacerdotes clangebant tubis coram arca Dei et Obededom et Ahias erant ianitores arcae"
      en: "And Sebenias, and Josaphat, and Nathanael, and Amasai, and Zacharias, and Banaias, and Eliezer the priests, sounded with trumpets, before the ark of God: and Obededom and Jehias were porters of the ark."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "igitur David et maiores natu Israhel et tribuni ierunt ad deportandam arcam foederis Domini de domo Obededom cum laetitia"
      en: "So David and all the ancients of Israel, and the captains over thousands, went to bring the ark of the covenant of the Lord out of the house of Obededom with joy."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "cumque adiuvisset Deus Levitas qui portabant arcam foederis Domini immolabantur septem tauri et septem arietes"
      en: "And when God had helped the Levites who carried the ark of the covenant of the Lord, they offered in sacrifice seven oxen, and seven rams."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "porro David erat indutus stola byssina et universi Levitae qui portabant arcam cantoresque et Chonenias princeps prophetiae inter cantores David autem indutus erat etiam ephod lineo"
      en: "And David was clothed with a robe of fine linen, and all the Levites that carried the ark, and the singing men, and Chonenias the ruler of the prophecy among the singers: and David also had on him an ephod of linen."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "universusque Israhel deducebant arcam foederis Domini in iubilo et sonitu bucinae et tubis et cymbalis et nablis et citharis concrepantes"
      en: "And all Israel brought the ark of the covenant of the Lord with joyful shouting, and sounding with the sound of the comet, and with trumpets, and cymbals, and psalteries, and harps."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "cumque pervenisset arca foederis Domini usque ad civitatem David Michol filia Saul prospiciens per fenestram vidit regem David saltantem atque ludentem et despexit eum in corde suo"
      en: "And when the ark of the covenant of the Lord was come to the city of David, Michol the daughter of Saul looking out at a window, saw king David dancing and playing, and she despised him in her heart."
    status: { la: verified, en: verified }
