# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: prov
chapter: 24
verses:
  - n: 1
    text:
      la: "ne aemuleris viros malos nec desideres esse cum eis"
      en: "Seek not to be like evil men, neither desire to be with them:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quia rapinas meditatur mens eorum et fraudes labia eorum loquuntur"
      en: "Because their mind studieth robberies, and their lips speak deceits."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sapientia aedificabitur domus et prudentia roborabitur"
      en: "By wisdom the house shall be built, and by prudence it shall be strengthened."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "in doctrina replebuntur cellaria universa substantia pretiosa et pulcherrima"
      en: "By instruction the storerooms shall be filled with all precious and most beautiful wealth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "vir sapiens et fortis est et vir doctus robustus et validus"
      en: "A wise man is strong: and a knowing man, stout and valiant."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quia cum dispositione initur bellum et erit salus ubi multa consilia sunt"
      en: "Because war is managed by due ordering: and there shall be safety where there are many counsels."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "excelsa stulto sapientia in porta non aperiet os suum"
      en: "Wisdom is too high for a fool, in the gate he shall not open his mouth."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui cogitat malefacere stultus vocabitur"
      en: "He that deviseth to do evils, shall be called a fool."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cogitatio stulti peccatum est et abominatio hominum detractor"
      en: "The thought of a fool is sin: and the detracter is the abomination of men."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "si desperaveris lassus in die angustiae inminuetur fortitudo tua"
      en: "If thou lose hope being weary in the day of distress, thy strength shall be diminished."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "erue eos qui ducuntur ad mortem et qui trahuntur ad interitum liberare ne cesses"
      en: "Deliver them that are led to death: and those that are drawn to death forbear not to deliver."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "si dixeris vires non suppetunt qui inspector est cordis ipse intellegit et servatorem animae tuae nihil fallit reddetque homini iuxta opera sua"
      en: "If thou say: I have not strength enough: he that seeth into the heart, he understandeth, and nothing deceiveth the keeper of thy soul, end he shall render to a man according to his works."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "comede fili mi mel quia bonum est et favum dulcissimum gutturi tuo"
      en: "Fat honey, my son, because it is good, and the honeycomb most sweet to thy throat:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sic et doctrina sapientiae animae tuae quam cum inveneris habebis in novissimis et spes tua non peribit"
      en: "So also is the doctrine of wisdom to thy soul: which when thou hast found, thou shalt have hope in the end, and thy hope shall not perish."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ne insidieris et quaeras impietatem in domo iusti neque vastes requiem eius"
      en: "Lie not in wait, nor seek after wickedness in the house of the just, nor spoil his rest."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "septies enim cadet iustus et resurget impii autem corruent in malum"
      en: "For a just mall shall fall seven times and shall rise again: but the wicked shall fall down into evil."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "cum ceciderit inimicus tuus ne gaudeas et in ruina eius ne exultet cor tuum"
      en: "When thy enemy shall fall, be not glad, and in his ruin let not thy heart rejoice:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ne forte videat Dominus et displiceat ei et auferat ab eo iram suam"
      en: "Lest the Lord see, and it displease him, and he turn away his wrath from him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ne contendas cum pessimis nec aemuleris impios"
      en: "Contend not with the wicked, nor seek to be like the ungodly:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quoniam non habent futurorum spem mali et lucerna impiorum extinguetur"
      en: "For evil men have no hope of things to come, and the lamp of the wicked shall be put out."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "time Dominum fili mi et regem et cum detractoribus non commiscearis"
      en: "My son, fear the Lord and the king: and have nothing to do with detracters."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quoniam repente consurget perditio eorum et ruinam utriusque quis novit"
      en: "For their destruction shall rise suddenly: and who knoweth the ruin of both?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "haec quoque sapientibus cognoscere personam in iudicio non est bonum"
      en: "These things also to the wise: It is not good to have respect to persons in judgment."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "qui dicit impio iustus es maledicent ei populi et detestabuntur eum tribus"
      en: "They that say to the wicked man: Thou art just: shall be cursed by the people, and the tribes shall abhor them."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "qui arguunt laudabuntur et super ipsos veniet benedictio"
      en: "They that rebuke him, shall be praised: and a blessing shall come upon them."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "labia deosculabitur qui recta verba respondet"
      en: "He shall kiss the lips, who answereth right words."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "praepara foris opus tuum et diligenter exerce agrum tuum ut postea aedifices domum tuam"
      en: "Prepare thy work without, and diligently till thy ground: that afterward thou mayst build thy house."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "ne sis testis frustra contra proximum tuum nec lactes quemquam labiis tuis"
      en: "Be not witness without cause against thy neighbour: and deceive not any man with thy lips."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ne dicas quomodo fecit mihi sic faciam ei reddam unicuique secundum opus suum"
      en: "Say not: I will do to him as he hath done to me: I will render to every one according to his work."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "per agrum hominis pigri transivi et per vineam viri stulti"
      en: "I passed by the field of the slothful man, and by the vineyard of the foolish man:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et ecce totum repleverant urticae operuerant superficiem eius spinae et maceria lapidum destructa erat"
      en: "And behold it was all filled with nettles, and thorns had covered the face thereof, and the stone wall was broken down."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quod cum vidissem posui in corde meo et exemplo didici disciplinam"
      en: "Which when I had seen, I laid it up in my heart, and by the example I received instruction."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "parum inquam dormies modicum dormitabis pauxillum manus conseres ut quiescas"
      en: "Thou wilt sleep a little, said I, thou wilt slumber a little, thou wilt fold thy hands a little to rest:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et veniet quasi cursor egestas tua et mendicitas quasi vir armatus"
      en: "And poverty shall come to thee as a runner, and beggary as an armed man."
    status: { la: verified, en: verified }
