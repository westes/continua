# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: zach
chapter: 3
verses:
  - n: 1
    text:
      la: "et ostendit mihi Iesum sacerdotem magnum stantem coram angelo Domini et Satan stabat a dextris eius ut adversaretur ei"
      en: "And the Lord shewed me Jesus the high priest standing before the angel of the Lord: and Satan stood on his right hand to be his adversary."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et dixit Dominus ad Satan increpet Dominus in te Satan et increpet Dominus in te qui elegit Hierusalem numquid non iste torris est erutus de igne"
      en: "And the Lord said to Satan: The Lord rebuke thee, O Satan: and the Lord that chose Jerusalem rebuke thee: Is not this a brand plucked out of the fire?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et Iesus erat indutus vestibus sordidis et stabat ante faciem angeli"
      en: "And Jesus was clothed with filthy garments: and he stood before the face of the angel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui respondit et ait ad eos qui stabant coram se dicens auferte vestimenta sordida ab eo et dixit ad eum ecce abstuli a te iniquitatem tuam et indui te mutatoriis"
      en: "Who answered, and said to them that stood before him, saying: Take away the filthy garments from him. And he said to him: Behold I have taken away thy iniquity, and have clothed thee with change of garments."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et dixit ponite cidarim mundam super caput eius et posuerunt cidarim mundam super caput eius et induerunt eum vestibus et angelus Domini stabat"
      en: "And he said: Put a clean mitre upon his head: and they put a clean mitre upon his head, and clothed him with garments, and the angel of the Lord stood."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et contestabatur angelus Domini Iesum dicens"
      en: "And the angel of the Lord protested to Jesus, saying:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "haec dicit Dominus exercituum si in viis meis ambulaveris et custodiam meam custodieris tu quoque iudicabis domum meam et custodies atria mea et dabo tibi ambulantes de his qui nunc hic adsistunt"
      en: "Thus saith the Lord of hosts: If thou wilt walk in my ways, and Beep my charge, thou also shalt judge my house, and shalt keep my courts, and I will give thee some of them that are now present here to walk with thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "audi Iesu sacerdos magne tu et amici tui qui habitant coram te quia viri portendentes sunt ecce enim ego adducam servum meum orientem"
      en: "Hear, O Jesus thou high priest, then and thy friends that dwell before thee, for they are portending men: for behold I WILL BRING MY SERVANT THE ORIENT."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quia ecce lapis quem dedi coram Iesu super lapidem unum septem oculi sunt ecce ego celabo sculpturam eius ait Dominus exercituum et auferam iniquitatem terrae illius in die una"
      en: "For behold the stone that I have laid before Jesus: upon one stone there are seven eyes: behold I will grave the graving thereof, saith the Lord of hosts: and I will take away the iniquity of that land in one day."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in die illa dicit Dominus exercituum vocabit vir amicum suum subter vineam et subter ficum"
      en: "In that day, saith the Lord of hosts, every man shell call his friend under the vine and under the fig tree."
    status: { la: verified, en: verified }
