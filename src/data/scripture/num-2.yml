book: num
chapter: 2
verses:
  - n: 1
    text:
      la: "locutusque est Dominus ad Mosen et Aaron dicens"
      en: "And the Lord spoke to Moses and Aaron, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "singuli per turmas signa atque vexilla et domos cognationum suarum castrametabuntur filiorum Israhel per gyrum tabernaculi foederis"
      en: "All the children of Israel shall camp by their troops, ensigns, and standards, and the houses of their kindreds, round about the tabernacle of the covenant."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ad orientem Iudas figet tentoria per turmas exercitus sui eritque princeps filiorum eius Naasson filius Aminadab"
      en: "On the east Juda shall pitch his tents by the bands of his army: and the prince of his sons shall be Nahasson the son of Aminadab."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et omnis de stirpe eius summa pugnantium septuaginta quattuor milia sescentorum"
      en: "And the whole sum of the fighting men of his stock, were seventy-four thousand six hundred."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "iuxta eum castrametati sunt de tribu Isachar quorum princeps fuit Nathanahel filius Suar"
      en: "Next unto him they of the tribe of Issachar encamped, whose prince was Nathanael, the son of Suar."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et omnis numerus pugnatorum eius quinquaginta quattuor milia quadringenti"
      en: "And the whole number of his fighting men were fifty-four thousand four hundred."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in tribu Zabulon princeps fuit Heliab filius Helon"
      en: "In the tribe of Zabulon the prince was Eliab the son of Helon."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "omnis de stirpe eius exercitus pugnatorum quinquaginta septem milia quadringenti"
      en: "And all the army of fighting men of his stock, were fifty-seven thousand four hundred."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "universi qui in castris Iudae adnumerati sunt fuerunt centum octoginta sex milia quadringenti et per turmas suas primi egredientur"
      en: "All that were numbered in the camp of Juda, were a hundred and eighty-six thousand four hundred: and they by their troops shall march first."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in castris filiorum Ruben ad meridianam plagam erit princeps Elisur filius Sedeur"
      en: "In the camp of the sons of Ruben, on the south side, the prince shall be Elisur the son of Sedeur:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et cunctus exercitus pugnatorum eius qui numerati sunt quadraginta sex milia quingenti"
      en: "And the whole army of his fighting men, that were numbered, were forty-six thousand five hundred."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "iuxta eum castrametati sunt de tribu Symeon quorum princeps fuit Salamihel filius Surisaddai"
      en: "Beside him camped they of the tribe of Simeon: whose prince was Salamiel the son of Surisaddai."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et cunctus exercitus pugnatorum eius qui numerati sunt quinquaginta novem milia trecenti"
      en: "And the whole army of his fighting men, that were numbered, were fifty-nine thousand three hundred."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "in tribu Gad princeps fuit Heliasaph filius Duhel"
      en: "In the tribe of Gad the prince was Eliasaph the son of Duel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et cunctus exercitus pugnatorum eius qui numerati sunt quadraginta quinque milia sescenti quinquaginta"
      en: "And the whole army of his fighting men that were numbered, were forty- five thousand six hundred and fifty."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "omnes qui recensiti sunt in castris Ruben centum quinquaginta milia et mille quadringenti quinquaginta per turmas suas in secundo loco proficiscentur"
      en: "All that were reckoned up in the camp of Ruben, were a hundred and fifty-one thousand four hundred and fifty, by their troops: they shall march in the second place."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "levabitur autem tabernaculum testimonii per officia Levitarum et turmas eorum quomodo erigetur ita et deponetur singuli per loca et ordines suos proficiscentur"
      en: "And the tabernacle of the testimony shall be carried by the officers of the Levites and their troops. As it shall be set up, so shall it be taken down. Every one shall march according to their places, and ranks."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ad occidentalem plagam erunt castra filiorum Ephraim quorum princeps fuit Helisama filius Ammiud"
      en: "On the west side shall be the camp of the sons of Ephraim, whose prince was Elisama, the son of Ammiud."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "cunctus exercitus pugnatorum eius qui numerati sunt quadraginta milia quingenti"
      en: "The whole army of his fighting men, that were numbered, were forty thousand five hundred."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et cum eis tribus filiorum Manasse quorum princeps fuit Gamalihel filius Phadassur"
      en: "And with them the tribe of the sons of Manasses, whose prince was Gamaliel the son of Phadassur."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "cunctus exercitus pugnatorum eius qui numerati sunt triginta duo milia ducenti"
      en: "And the whole army of his fighting men, that were numbered, were thirty-two thousand two hundred."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "in tribu filiorum Beniamin princeps fuit Abidan filius Gedeonis"
      en: "In the tribe of the sons of Benjamin the prince was Abidan the son of Gedeon."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et cunctus exercitus pugnatorum eius qui recensiti sunt triginta quinque milia quadringenti"
      en: "And the whole army of his fighting men, that were reckoned up, were thirty-five thousand four hundred."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "omnes qui numerati sunt in castris Ephraim centum octo milia centum per turmas suas tertii proficiscentur"
      en: "All that were numbered in the camp of Ephraim, were a hundred and eight thousand one hundred by their troops: they shall march in the third place."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ad aquilonis partem castrametati sunt filii Dan quorum princeps fuit Ahiezer filius Amisaddai"
      en: "On the north side camped the sons of Dan: whose prince was Ahiezar the son of Ammisaddai."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "cunctus exercitus pugnatorum eius qui numerati sunt sexaginta duo milia septingenti"
      en: "The whole army of his fighting men, that were numbered, were sixty-two thousand seven hundred."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "iuxta eum fixere tentoria de tribu Aser quorum princeps fuit Phegihel filius Ochran"
      en: "Beside him they of the tribe of Aser pitched their tents: whose prince was Phegiel the son of Ochran."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "cunctus exercitus pugnatorum eius qui numerati sunt quadraginta milia et mille quingenti"
      en: "The whole army of his fighting men, that were numbered, were forty-one thousand five hundred."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "de tribu filiorum Nepthalim princeps fuit Ahira filius Henan"
      en: "Of the tribe of the sons of Nephtali the prince was Ahira the son of Enan."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "cunctus exercitus pugnatorum eius quinquaginta tria milia quadringenti"
      en: "The whole army of his fighting men, were fifty-three thousand four hundred."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "omnes qui numerati sunt in castris Dan fuerunt centum quinquaginta septem milia sescenti et novissimi proficiscentur"
      en: "All that were numbered in the camp of Dan, were a hundred and fifty-seven thousand six hundred: and they shall march last."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "hic numerus filiorum Israhel per domos cognationum suarum et turmas divisi exercitus sescenta tria milia quingenti quinquaginta"
      en: "This is the number of the children of Israel, of their army divided according to the houses of their kindreds and their troops, six hundred and three thousand five hundred and fifty."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Levitae autem non sunt numerati inter filios Israhel sic enim praecepit Dominus Mosi"
      en: "And the Levites were not numbered among the children of Israel: for so the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "feceruntque filii Israhel iuxta omnia quae mandaverat Dominus castrametati sunt per turmas suas et profecti per familias ac domos patrum suorum"
      en: "And the children of Israel did according to all things that the Lord had commanded. They camped by their troops, and marched by the families and houses of their fathers."
    status: { la: verified, en: verified }
