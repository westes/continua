# Douay-Rheims + Latin Vulgate, from drbo.org (Douay-Rheims Bible
# Online) -- the "DR + LV" combined page keeps every verse's Latin
# and English paired in the same block, avoiding the verse-
# misalignment this project's first-pass "Unbound Bible" source had
# for esth 14 specifically; see TODO.md's bulk scripture import entry.
book: esth
chapter: 14
verses:
  - n: 1
    text:
      la: "Esther quoque regina confugit ad Dominum, pavens periculum, quod imminebat."
      en: "Queen Esther also, fearing the danger that was at hand, had recourse to the Lord."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cumque deposuisset vestes regias, fletibus et luctui apta indumenta suscepit, et pro unguentis variis, cinere et stercore implevit caput, et corpus suum humiliavit jejuniis : omniaque loca, in quibus antea laetari consueverat, crinium laceratione complevit."
      en: "And when she had laid away her royal apparel, she put on garments suitable for weeping and mourning: instead of divers precious ointments, she covered her head with ashes and dung, and she humbled her body with fasts: and all the places in which before she was accustomed to rejoice, she filled with her torn hair."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et deprecabatur Dominum Deum Israel, dicens : Domine mi, qui rex noster es solus, adjuva me solitariam, et cujus praeter te nullus est auxiliator alius."
      en: "And she prayed to the Lord the God of Israel, saying: O my Lord, who alone art our king, help me a desolate woman, and who have no other helper but thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Periculum meum in manibus meis est."
      en: "My danger is in my hands."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Audivi a patre meo quod tu, Domine, tulisses Israel de cunctis gentibus, et patres nostros ex omnibus retro majoribus suis, ut possideres haereditatem sempiternam, fecistique eis sicut locutus es."
      en: "I have heard of my father that thou, O Lord, didst take Israel from among all nations, and our fathers from all their predecessors, to possess them as an everlasting inheritance, and thou hast done to them as thou hast promised."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Peccavimus in conspectu tuo, et idcirco tradidisti nos in manus inimicorum nostrorum :"
      en: "We have sinned in thy sight, and therefore thou hast delivered us into the hands of our enemies:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "coluimus enim deos eorum. Justus es Domine :"
      en: "For we have worshipped their gods. Thou art just, O Lord."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et nunc non eis sufficit, quod durissima nos opprimunt servitute, sed robur manuum suarum, idolorum potentiae deputantes,"
      en: "And now they are not content to oppress us with most hard bondage, but attributing the strength of their hands to the power of their idols,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "volunt tua mutare promissa, et delere haereditatem tuam, et claudere ora laudantium te, atque extinguere gloriam templi et altaris tui,"
      en: "They design to change thy promises, and destroy thy inheritance, and shut the mouths of them that praise thee, and extinguish the glory of thy temple and altar,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ut aperiant ora gentium, et laudent idolorum fortitudinem, et praedicent carnalem regem in sempiternum."
      en: "That they may open the mouths of Gentiles, and praise the strength of idols, and magnify for ever a carnal king."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ne tradas, Domine, sceptrum tuum his, qui non sunt, ne rideant ad ruinam nostram : sed converte consilium eorum super eos, et eum, qui in nos coepit saevire, disperde."
      en: "Give not, O Lord, thy sceptre to them that are not, lest they laugh at our ruin: but turn their counsel upon themselves, and destroy him that hath begun to rage against us."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Memento Domine, et ostende te nobis in tempore tribulationis nostrae, et da mihi fiduciam, Domine rex deorum, et universae potestatis :"
      en: "Remember, O Lord, and shew thyself to us in the time of our tribulation, and give me boldness, O Lord, king of gods, and of all power:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "tribue sermonem compositum in ore meo in conspectu leonis, et transfer cor illius in odium hostis nostri, ut et ipse pereat, et ceteri, qui ei consentiunt."
      en: "Give me a well ordered speech in my mouth in the presence of the lion, and turn his heart to the hatred of our enemy, that both he himself may perish, and the rest that consent to him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Nos autem libera manu tua, et adjuva me, nullum aliud auxilium habentem, nisi te, Domine, qui habes omnium scientiam,"
      en: "But deliver us by thy hand, and help me, who have no other helper, but thee, O Lord, who hast the knowledge of all things."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et nosti quia oderim gloriam iniquorum, et detester cubile incircumcisorum, et omnis alienigenae."
      en: "And thou knowest that I hate the glory of the wicked, and abhor the bed of the uncircumcised, and of every stranger."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Tu scis necessitatem meam, quod abominer signum superbiae et gloriae meae, quod est super caput meum in diebus ostentationis meae, et detester illud quasi pannum menstruatae, et non portem in diebus silentii mei,"
      en: "Thou knowest my necessity, that I abominate the sign of my pride and glory, which is upon my head in the days of my public appearance, and detest it as a menstruous rag, and wear it not in the days of my silence,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et quod non comederim in mensa Aman, nec mihi placuerit convivium regis, et non biberim vinum libaminum :"
      en: "And that I have not eaten at Aman's table, nor hath the king's banquet pleased me, and that I have not drunk the wine of the drink offerings:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et numquam laetata sit ancilla tua, ex quo huc translata sum usque in praesentem diem, nisi in te, Domine Deus Abraham."
      en: "And that thy handmaid hath never rejoiced, since I was brought hither unto this day, but in thee, O Lord, the God of Abraham."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Deus fortis super omnes, exaudi vocem eorum, qui nullam aliam spem habent, et libera nos de manu iniquorum, et erue me a timore meo."
      en: "O God, who art mighty above all, hear the voice of them, that have no other hope, and deliver us from the hand of the wicked, and deliver me from my fear."
    status: { la: verified, en: verified }
