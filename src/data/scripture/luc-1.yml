# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: luc
chapter: 1
verses:
  - n: 1
    text:
      la: "quoniam quidem multi conati sunt ordinare narrationem quae in nobis conpletae sunt rerum"
      en: "Forasmuch as many have taken in hand to set forth in order a narration of the things that have been accomplished among us;"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sicut tradiderunt nobis qui ab initio ipsi viderunt et ministri fuerunt sermonis"
      en: "According as they have delivered them unto us, who from the beginning were eyewitnesses and ministers of the word:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "visum est et mihi adsecuto a principio omnibus diligenter ex ordine tibi scribere optime Theophile"
      en: "It seemed good to me also, having diligently attained to all things from the beginning, to write to thee in order, most excellent Theophilus,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ut cognoscas eorum verborum de quibus eruditus es veritatem"
      en: "That thou mayest know the verity of those words in which thou hast been instructed."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "fuit in diebus Herodis regis Iudaeae sacerdos quidam nomine Zaccharias de vice Abia et uxor illi de filiabus Aaron et nomen eius Elisabeth"
      en: "There was in the days of Herod, the king of Judea, a certain priest named Zachary, of the course of Abia; and his wife was of the daughters of Aaron, and her name Elizabeth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "erant autem iusti ambo ante Deum incedentes in omnibus mandatis et iustificationibus Domini sine querella"
      en: "And they were both just before God, walking in all the commandments and justifications of the Lord without blame."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et non erat illis filius eo quod esset Elisabeth sterilis et ambo processissent in diebus suis"
      en: "And they had no son, for that Elizabeth was barren, and they both were well advanced in years."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "factum est autem cum sacerdotio fungeretur in ordine vicis suae ante Deum"
      en: "And it came to pass, when he executed the priestly function in the order of his course before God,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "secundum consuetudinem sacerdotii sorte exiit ut incensum poneret ingressus in templum Domini"
      en: "According to the custom of the priestly office, it was his lot to offer incense, going into the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et omnis multitudo erat populi orans foris hora incensi"
      en: "And all the multitude of the people was praying without, at the hour of incense."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "apparuit autem illi angelus Domini stans a dextris altaris incensi"
      en: "And there appeared to him an angel of the Lord, standing on the right side of the alter of incense."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et Zaccharias turbatus est videns et timor inruit super eum"
      en: "And Zachary seeing him, was troubled, and fear fell upon him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ait autem ad illum angelus ne timeas Zaccharia quoniam exaudita est deprecatio tua et uxor tua Elisabeth pariet tibi filium et vocabis nomen eius Iohannem"
      en: "But the angel said to him: Fear not, Zachary, for thy prayer is heard; and thy wife Elizabeth shall bear thee a son, and thou shalt call his name John:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et erit gaudium tibi et exultatio et multi in nativitate eius gaudebunt"
      en: "And thou shalt have joy and gladness, and many shall rejoice in his nativity."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "erit enim magnus coram Domino et vinum et sicera non bibet et Spiritu Sancto replebitur adhuc ex utero matris suae"
      en: "For he shall be great before the Lord; and shall drink no wine nor strong drink: and he shall be filled with the Holy Ghost, even from his mother's womb."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et multos filiorum Israhel convertet ad Dominum Deum ipsorum"
      en: "And he shall convert many of the children of Israel to the Lord their God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ipse praecedet ante illum in spiritu et virtute Heliae ut convertat corda patrum in filios et incredibiles ad prudentiam iustorum parare Domino plebem perfectam"
      en: "And he shall go before him in the spirit and power of Elias; that he may turn the hearts of the fathers unto the children, and the incredulous to the wisdom of the just, to prepare unto the Lord a perfect people."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et dixit Zaccharias ad angelum unde hoc sciam ego enim sum senex et uxor mea processit in diebus suis"
      en: "And Zachary said to the angel: Whereby shall I know this? for I am an old man, and my wife is advanced in years."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et respondens angelus dixit ei ego sum Gabrihel qui adsto ante Deum et missus sum loqui ad te et haec tibi evangelizare"
      en: "And the angel answering, said to him: I am Gabriel, who stand before God: and am sent to speak to thee, and to bring thee these good tidings."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et ecce eris tacens et non poteris loqui usque in diem quo haec fiant pro eo quod non credidisti verbis meis quae implebuntur in tempore suo"
      en: "And behold, thou shalt be dumb, and shalt not be able to speak until the day wherein these things shall come to pass, because thou hast not believed my words, which shall be fulfilled in their time."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et erat plebs expectans Zacchariam et mirabantur quod tardaret ipse in templo"
      en: "And the people were waiting for Zachary; and they wondered that he tarried so long in the temple."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "egressus autem non poterat loqui ad illos et cognoverunt quod visionem vidisset in templo et ipse erat innuens illis et permansit mutus"
      en: "And when he came out, he could not speak to them: and they understood that he had seen a vision in the temple. And he made signs to them, and remained dumb."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et factum est ut impleti sunt dies officii eius abiit in domum suam"
      en: "And it came to pass, after the days of his office were accomplished, he departed to his own house."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "post hos autem dies concepit Elisabeth uxor eius et occultabat se mensibus quinque dicens"
      en: "And after those days, Elizabeth his wife conceived, and hid herself five months, saying:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quia sic mihi fecit Dominus in diebus quibus respexit auferre obprobrium meum inter homines"
      en: "Thus hath the Lord dealt with me in the days wherein he hath had regard to take away my reproach among men."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "in mense autem sexto missus est angelus Gabrihel a Deo in civitatem Galilaeae cui nomen Nazareth"
      en: "And in the sixth month, the angel Gabriel was sent from God into a city of Galilee, called Nazareth,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ad virginem desponsatam viro cui nomen erat Ioseph de domo David et nomen virginis Maria"
      en: "To a virgin espoused to a man whose name was Joseph, of the house of David; and the virgin's name was Mary."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et ingressus angelus ad eam dixit have gratia plena Dominus tecum benedicta tu in mulieribus"
      en: "And the angel being come in, said unto her: Hail, full of grace, the Lord is with thee: blessed art thou among women."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quae cum vidisset turbata est in sermone eius et cogitabat qualis esset ista salutatio"
      en: "Who having heard, was troubled at his saying, and thought with herself what manner of salutation this should be."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et ait angelus ei ne timeas Maria invenisti enim gratiam apud Deum"
      en: "And the angel said to her: Fear not, Mary, for thou hast found grace with God."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ecce concipies in utero et paries filium et vocabis nomen eius Iesum"
      en: "Behold thou shalt conceive in thy womb, and shalt bring forth a son; and thou shalt call his name Jesus."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "hic erit magnus et Filius Altissimi vocabitur et dabit illi Dominus Deus sedem David patris eius"
      en: "He shall be great, and shall be called the Son of the most High; and the Lord God shall give unto him the throne of David his father; and he shall reign in the house of Jacob for ever."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et regnabit in domo Iacob in aeternum et regni eius non erit finis"
      en: "And of his kingdom there shall be no end."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "dixit autem Maria ad angelum quomodo fiet istud quoniam virum non cognosco"
      en: "And Mary said to the angel: How shall this be done, because I know not man?"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et respondens angelus dixit ei Spiritus Sanctus superveniet in te et virtus Altissimi obumbrabit tibi ideoque et quod nascetur sanctum vocabitur Filius Dei"
      en: "And the angel answering, said to her: The Holy Ghost shall come upon thee, and the power of the most High shall overshadow thee. And therefore also the Holy which shall be born of thee shall be called the Son of God."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et ecce Elisabeth cognata tua et ipsa concepit filium in senecta sua et hic mensis est sextus illi quae vocatur sterilis"
      en: "And behold thy cousin Elizabeth, she also hath conceived a son in her old age; and this is the sixth month with her that is called barren:"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "quia non erit inpossibile apud Deum omne verbum"
      en: "Because no word shall be impossible with God."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "dixit autem Maria ecce ancilla Domini fiat mihi secundum verbum tuum et discessit ab illa angelus"
      en: "And Mary said: Behold the handmaid of the Lord; be it done to me according to thy word. And the angel departed from her."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "exsurgens autem Maria in diebus illis abiit in montana cum festinatione in civitatem Iuda"
      en: "And Mary rising up in those days, went into the hill country with haste into a city of Juda."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et intravit in domum Zacchariae et salutavit Elisabeth"
      en: "And she entered into the house of Zachary, and saluted Elizabeth."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et factum est ut audivit salutationem Mariae Elisabeth exultavit infans in utero eius et repleta est Spiritu Sancto Elisabeth"
      en: "And it came to pass, that when Elizabeth heard the salutation of Mary, the infant leaped in her womb. And Elizabeth was filled with the Holy Ghost:"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et exclamavit voce magna et dixit benedicta tu inter mulieres et benedictus fructus ventris tui"
      en: "And she cried out with a loud voice, and said: Blessed art thou among women, and blessed is the fruit of thy womb."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et unde hoc mihi ut veniat mater Domini mei ad me"
      en: "And whence is this to me, that the mother of my Lord should come to me?"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "ecce enim ut facta est vox salutationis tuae in auribus meis exultavit in gaudio infans in utero meo"
      en: "For behold as soon as the voice of thy salutation sounded in my ears, the infant in my womb leaped for joy."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et beata quae credidit quoniam perficientur ea quae dicta sunt ei a Domino"
      en: "And blessed art thou that hast believed, because those things shall be accomplished that were spoken to thee by the Lord."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et ait Maria magnificat anima mea Dominum"
      en: "And Mary said: My soul doth magnify the Lord."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et exultavit spiritus meus in Deo salutari meo"
      en: "And my spirit hath rejoiced in God my Saviour."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "quia respexit humilitatem ancillae suae ecce enim ex hoc beatam me dicent omnes generationes"
      en: "Because he hath regarded the humility of his handmaid; for behold from henceforth all generations shall call me blessed."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "quia fecit mihi magna qui potens est et sanctum nomen eius"
      en: "Because he that is mighty, hath done great things to me; and holy is his name."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "et misericordia eius in progenies et progenies timentibus eum"
      en: "And his mercy is from generation unto generations, to them that fear him."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "fecit potentiam in brachio suo dispersit superbos mente cordis sui"
      en: "He hath shewed might in his arm: he hath scattered the proud in the conceit of their heart."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "deposuit potentes de sede et exaltavit humiles"
      en: "He hath put down the mighty from their seat, and hath exalted the humble."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "esurientes implevit bonis et divites dimisit inanes"
      en: "He hath filled the hungry with good things; and the rich he hath sent empty away."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "suscepit Israhel puerum suum memorari misericordiae"
      en: "He hath received Israel his servant, being mindful of his mercy:"
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "sicut locutus est ad patres nostros Abraham et semini eius in saecula"
      en: "As he spoke to our fathers, to Abraham and to his seed for ever."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "mansit autem Maria cum illa quasi mensibus tribus et reversa est in domum suam"
      en: "And Mary abode with her about three months; and she returned to her own house."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Elisabeth autem impletum est tempus pariendi et peperit filium"
      en: "Now Elizabeth's full time of being delivered was come, and she brought forth a son."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "et audierunt vicini et cognati eius quia magnificavit Dominus misericordiam suam cum illa et congratulabantur ei"
      en: "And her neighbours and kinsfolks heard that the Lord had shewed his great mercy towards her, and they congratulated with her."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "et factum est in die octavo venerunt circumcidere puerum et vocabant eum nomine patris eius Zacchariam"
      en: "And it came to pass, that on the eighth day they came to circumcise the child, and they called him by his father's name Zachary."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "et respondens mater eius dixit nequaquam sed vocabitur Iohannes"
      en: "And his mother answering, said: Not so; but he shall be called John."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "et dixerunt ad illam quia nemo est in cognatione tua qui vocetur hoc nomine"
      en: "And they said to her: There is none of thy kindred that is called by this name."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "innuebant autem patri eius quem vellet vocari eum"
      en: "And they made signs to his father, how he would have him called."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "et postulans pugillarem scripsit dicens Iohannes est nomen eius et mirati sunt universi"
      en: "And demanding a writing table, he wrote, saying: John is his name. And they all wondered."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "apertum est autem ilico os eius et lingua eius et loquebatur benedicens Deum"
      en: "And immediately his mouth was opened, and his tongue loosed, and he spoke, blessing God."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "et factus est timor super omnes vicinos eorum et super omnia montana Iudaeae divulgabantur omnia verba haec"
      en: "And fear came upon all their neighbours; and all these things were noised abroad over all the hill country of Judea."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "et posuerunt omnes qui audierant in corde suo dicentes quid putas puer iste erit etenim manus Domini erat cum illo"
      en: "And all they that had heard them laid them up in their heart, saying: What an one, think ye, shall this child be? For the hand of the Lord was with him."
    status: { la: verified, en: verified }
  - n: 67
    text:
      la: "et Zaccharias pater eius impletus est Spiritu Sancto et prophetavit dicens"
      en: "And Zachary his father was filled with the Holy Ghost; and he prophesied, saying:"
    status: { la: verified, en: verified }
  - n: 68
    text:
      la: "benedictus Deus Israhel quia visitavit et fecit redemptionem plebi suae"
      en: "Blessed be the Lord God of Israel; because he hath visited and wrought the redemption of his people:"
    status: { la: verified, en: verified }
  - n: 69
    text:
      la: "et erexit cornu salutis nobis in domo David pueri sui"
      en: "And hath raised up an horn of salvation to us, in the house of David his servant:"
    status: { la: verified, en: verified }
  - n: 70
    text:
      la: "sicut locutus est per os sanctorum qui a saeculo sunt prophetarum eius"
      en: "As he spoke by the mouth of his holy prophets, who are from the beginning:"
    status: { la: verified, en: verified }
  - n: 71
    text:
      la: "salutem ex inimicis nostris et de manu omnium qui oderunt nos"
      en: "Salvation from our enemies, and from the hand of all that hate us:"
    status: { la: verified, en: verified }
  - n: 72
    text:
      la: "ad faciendam misericordiam cum patribus nostris et memorari testamenti sui sancti"
      en: "To perform mercy to our fathers, and to remember his holy testament,"
    status: { la: verified, en: verified }
  - n: 73
    text:
      la: "iusiurandum quod iuravit ad Abraham patrem nostrum"
      en: "The oath, which he swore to Abraham our father, that he would grant to us,"
    status: { la: verified, en: verified }
  - n: 74
    text:
      la: "daturum se nobis ut sine timore de manu inimicorum nostrorum liberati serviamus illi"
      en: "That being delivered from the hand of our enemies, we may serve him without fear,"
    status: { la: verified, en: verified }
  - n: 75
    text:
      la: "in sanctitate et iustitia coram ipso omnibus diebus nostris"
      en: "In holiness and justice before him, all our days."
    status: { la: verified, en: verified }
  - n: 76
    text:
      la: "et tu puer propheta Altissimi vocaberis praeibis enim ante faciem Domini parare vias eius"
      en: "And thou, child, shalt be called the prophet of the Highest: for thou shalt go before the face of the Lord to prepare his ways:"
    status: { la: verified, en: verified }
  - n: 77
    text:
      la: "ad dandam scientiam salutis plebi eius in remissionem peccatorum eorum"
      en: "To give knowledge of salvation to his people, unto the remission of their sins:"
    status: { la: verified, en: verified }
  - n: 78
    text:
      la: "per viscera misericordiae Dei nostri in quibus visitavit nos oriens ex alto"
      en: "Through the bowels of the mercy of our God, in which the Orient from on high hath visited us:"
    status: { la: verified, en: verified }
  - n: 79
    text:
      la: "inluminare his qui in tenebris et in umbra mortis sedent ad dirigendos pedes nostros in viam pacis"
      en: "To enlighten them that sit in darkness, and in the shadow of death: to direct our feet into the way of peace."
    status: { la: verified, en: verified }
  - n: 80
    text:
      la: "puer autem crescebat et confortabatur spiritu et erat in deserto usque in diem ostensionis suae ad Israhel"
      en: "And the child grew, and was strengthened in spirit; and was in the deserts until the day of his manifestation to Israel."
    status: { la: verified, en: verified }
