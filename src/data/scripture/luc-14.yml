# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: luc
chapter: 14
verses:
  - n: 1
    text:
      la: "Et factum est cum intraret Jesus in domum cujusdam principis pharisaeorum sabbato manducare panem, et ipsi observabant eum."
      en: "And it came to pass, when Jesus went into the house of one of the chief of the Pharisees, on the sabbath day, to eat bread, that they watched him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et ecce homo quidam hydropicus erat ante illum."
      en: "And behold, there was a certain man before him that had the dropsy."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et respondens Jesus dixit ad legisperitos et pharisaeos, dicens: Si licet sabbato curare?"
      en: "And Jesus answering, spoke to the lawyers and Pharisees, saying: Is it lawful to heal on the sabbath day?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "At illi tacuerunt. Ipse vero apprehensum sanavit eum, ac dimisit."
      en: "But they held their peace. But he taking him, healed him, and sent him away."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et respondens ad illos dixit: Cujus vestrum asinus, aut bos in puteum cadet, et non continuo extrahet illum die sabbati?"
      en: "And answering them, he said: Which of you shall have an ass or an ox fall into a pit, and will not immediately draw him out, on the sabbath day?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et non poterant ad haec respondere illi."
      en: "And they could not answer him to these things."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dicebat autem et ad invitatos parabolam, intendens quomodo primos accubitus eligerent, dicens ad illos:"
      en: "And he spoke a parable also to them that were invited, marking how they chose the first seats at the table, saying to them:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cum invitatus fueris ad nuptias, non discumbas in primo loco, ne forte honoratior te sit invitatus ab illo."
      en: "When thou art invited to a wedding, sit not down in the first place, lest perhaps one more honourable than thou be invited by him:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et veniens is, qui te et illum vocavit, dicat tibi: Da huic locum: et tunc incipias cum rubore novissimum locum tenere."
      en: "And he that invited thee and him, come and say to thee, Give this man place: and then thou begin with shame to take the lowest place."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Sed cum vocatus fueris, vade, recumbe in novissimo loco: ut, cum venerit qui te invitavit, dicat tibi: Amice, ascende superius. Tunc erit tibi gloria coram simul discumbentibus:"
      en: "But when thou art invited, go, sit down in the lowest place; that when he who invited thee, cometh, he may say to thee: Friend, go up higher. Then shalt thou have glory before them that sit at table with thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quia omnis, qui se exaltat, humiliabitur: et qui se humiliat, exaltabitur."
      en: "Because every one that exalteth himself, shall be humbled; and he that humbleth himself, shall be exalted."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dicebat autem et ei, qui invitaverat: Cum facis prandium, aut coenam, noli vocare amicos tuos, neque fratres tuos, neque cognatos, neque vicinos divites: ne forte te et ipsi reinvitent, et fiat tibi retributio;"
      en: "And he said to him also that had invited him: When thou makest a dinner or a supper, call not thy friends, nor thy brethren, nor thy kinsmen, nor thy neighbours who are rich; lest perhaps they also invite thee again, and a recompense be made to thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sed cum facis convivium, voca pauperes, debiles, claudos, et caecos:"
      en: "But when thou makest a feast, call the poor, the maimed, the lame, and the blind;"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et beatus eris, quia non habent retribuere tibi: retribuetur enim tibi in resurrectione justorum."
      en: "And thou shalt be blessed, because they have not wherewith to make thee recompense: for recompense shall be made thee at the resurrection of the just."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Haec cum audisset quidam de simul discumbentibus, dixit illi: Beatus qui manducabit panem in regno Dei."
      en: "When one of them that sat at table with him, had heard these things, he said to him: Blessed is he that shall eat bread in the kingdom of God."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "At ipse dixit ei: Homo quidam fecit coenam magnam, et vocavit multos."
      en: "But he said to him: A certain man made a great supper, and invited many."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et misit servum suum hora coenae dicere invitatis ut venirent, quia jam parata sunt omnia."
      en: "And he sent his servant at the hour of supper to say to them that were invited, that they should come, for now all things are ready."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et coeperunt simul omnes excusare. Primus dixit ei: Villam emi, et necesse habeo exire, et videre illam: rogo te, habe me excusatum."
      en: "And they began all at once to make excuse. The first said to him: I have bought a farm, and I must needs go out and see it: I pray thee, hold me excused."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et alter dixit: Juga boum emi quinque, et eo probare illa: rogo te, habe me excusatum."
      en: "And another said: I have bought five yoke of oxen, and I go to try them: I pray thee, hold me excused."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et alius dixit: Uxorem duxi, et ideo non possum venire."
      en: "And another said: I have married a wife, and therefore I cannot come."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et reversus servus nuntiavit haec domino suo. Tunc iratus paterfamilias, dixit servo suo: Exi cito in plateas et vicos civitatis: et pauperes, ac debiles, et caecos, et claudos introduc huc."
      en: "And the servant returning, told these things to his lord. Then the master of the house, being angry, said to his servant: Go out quickly into the streets and lanes of the city, and bring in hither the poor, and the feeble, and the blind, and the lame."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et ait servus: Domine, factum est ut imperasti, et adhuc locus est."
      en: "And the servant said: Lord, it is done as thou hast commanded, and yet there is room."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et ait dominus servo: Exi in vias, et saepes: et compelle intrare, ut impleatur domus mea."
      en: "And the Lord said to the servant: Go out into the highways and hedges, and compel them to come in, that my house may be filled."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Dico autem vobis quod nemo virorum illorum qui vocati sunt, gustabit coenam meam."
      en: "But I say unto you, that none of those men that were invited, shall taste of my supper."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Ibant autem turbae multae cum eo: et conversus dixit ad illos:"
      en: "And there went great multitudes with him. And turning, he said to them:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Si quis venit ad me, et non odit patrem suum, et matrem, et uxorem, et filios, et fratres, et sorores, adhuc autem et animam suam, non potest meus esse discipulus."
      en: "If any man come to me, and hate not his father, and mother, and wife, and children, and brethren, and sisters, yea and his own life also, he cannot be my disciple."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et qui non bajulat crucem suam, et venit post me, non potest meus esse discipulus."
      en: "And whosoever doth not carry his cross and come after me, cannot be my disciple."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Quis enim ex vobis volens turrim aedificare, non prius sedens computat sumptus, qui necessarii sunt, si habeat ad perficiendum,"
      en: "For which of you having a mind to build a tower, doth not first sit down, and reckon the charges that are necessary, whether he have wherewithal to finish it:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ne, posteaquam posuerit fundamentum, et non potuerit perficere, omnes qui vident, incipiant illudere ei,"
      en: "Lest, after he hath laid the foundation, and is not able to finish it, all that see it begin to mock him,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "dicentes: Quia hic homo coepit aedificare, et non potuit consummare?"
      en: "Saying: This man began to build, and was not able to finish."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Aut quis rex iturus committere bellum adversus alium regem, non sedens prius cogitat, si possit cum decem millibus occurrere ei, qui cum viginti millibus venit ad se?"
      en: "Or what king, about to go to make war against another king, doth not first sit down, and think whether he be able, with ten thousand, to meet him that, with twenty thousand, cometh against him?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Alioquin adhuc illo longe agente, legationem mittens rogat ea quae pacis sunt."
      en: "Or else, whilst the other is yet afar off, sending an embassy, he desireth conditions of peace."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Sic ergo omnis ex vobis, qui non renuntiat omnibus quae possidet, non potest meus esse discipulus."
      en: "So likewise every one of you that doth not renounce all that he possesseth, cannot be my disciple."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Bonum est sal: si autem sal evanuerit, in quo condietur?"
      en: "Salt is good. But if the salt shall lose its savour, wherewith shall it be seasoned?"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Neque in terram, neque in sterquilinium utile est, sed foras mittetur. Qui habet aures audiendi, audiat."
      en: "It is neither profitable for the land nor for the dunghill, but shall be cast out. He that hath ears to hear, let him hear."
    status: { la: verified, en: verified }
