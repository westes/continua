# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: heb
chapter: 6
verses:
  - n: 1
    text:
      la: "quapropter intermittentes inchoationis Christi sermonem ad perfectionem feramur non rursum iacientes fundamentum paenitentiae ab operibus mortuis et fidei ad Deum"
      en: "Wherefore leaving the word of the beginning of Christ, let us go on to things more perfect, not laying again the foundation of penance from dead works, and of faith towards God,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "baptismatum doctrinae inpositionis quoque manuum ac resurrectionis mortuorum et iudicii aeterni"
      en: "Of the doctrine of baptisms, and imposition of hands, and of the resurrection of the dead, and of eternal judgment."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et hoc faciemus siquidem permiserit Deus"
      en: "And this will we do, if God permit."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "inpossibile est enim eos qui semel sunt inluminati gustaverunt etiam donum caeleste et participes sunt facti Spiritus Sancti"
      en: "For it is impossible for those who were once illuminated, have tasted also the heavenly gift, and were made partakers of the Holy Ghost,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "gustaverunt nihilominus bonum Dei verbum virtutesque saeculi venturi"
      en: "Have moreover tasted the good word of God, and the powers of the world to come,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et prolapsi sunt renovari rursus ad paenitentiam rursum crucifigentes sibimet ipsis Filium Dei et ostentui habentes"
      en: "And are fallen away: to be renewed again to penance, crucifying again to themselves the Son of God, and making him a mockery."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "terra enim saepe venientem super se bibens imbrem et generans herbam oportunam illis a quibus colitur accipit benedictionem a Deo"
      en: "For the earth that drinketh in the rain which cometh often upon it, and bringeth forth herbs meet for them by whom it is tilled, receiveth blessing from God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "proferens autem spinas ac tribulos reproba est et maledicto proxima cuius consummatio in conbustionem"
      en: "But that which bringeth forth thorns and briers, is reprobate, and very near unto a curse, whose end is to be burnt."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "confidimus autem de vobis dilectissimi meliora et viciniora saluti tametsi ita loquimur"
      en: "But, my dearly beloved, we trust better things of you, and nearer to salvation; though we speak thus."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "non enim iniustus Deus ut obliviscatur operis vestri et dilectionis quam ostendistis in nomine ipsius qui ministrastis sanctis et ministratis"
      en: "For God is not unjust, that he should forget your work, and the love which you have shewn in his name, you who have ministered, and do minister to the saints."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cupimus autem unumquemque vestrum eandem ostentare sollicitudinem ad expletionem spei usque in finem"
      en: "And we desire that every one of you shew forth the same carefulness to the accomplishing of hope unto the end:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ut non segnes efficiamini verum imitatores eorum qui fide et patientia hereditabunt promissiones"
      en: "That you become not slothful, but followers of them, who through faith and patience shall inherit the promises."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Abrahae namque promittens Deus quoniam neminem habuit per quem iuraret maiorem iuravit per semet ipsum"
      en: "For God making promise to Abraham, because he had no one greater by whom he might swear, swore by himself,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "dicens nisi benedicens benedicam te et multiplicans multiplicabo te"
      en: "Saying: Unless blessing I shall bless thee, and multiplying I shall multiply thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et sic longanimiter ferens adeptus est repromissionem"
      en: "And so patiently enduring he obtained the promise."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "homines enim per maiorem sui iurant et omnis controversiae eorum finis ad confirmationem est iuramentum"
      en: "For men swear by one greater than themselves: and an oath for confirmation is the end of all their controversy."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "in quo abundantius volens Deus ostendere pollicitationis heredibus inmobilitatem consilii sui interposuit iusiurandum"
      en: "Wherein God, meaning more abundantly to shew to the heirs of the promise the immutability of his counsel, interposed an oath:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ut per duas res inmobiles quibus inpossibile est mentiri Deum fortissimum solacium habeamus qui confugimus ad tenendam propositam spem"
      en: "That by two immutable things, in which it is impossible for God to lie, we may have the strongest comfort, who have fled for refuge to hold fast the hope set before us."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quam sicut anchoram habemus animae tutam ac firmam et incedentem usque in interiora velaminis"
      en: "Which we have as an anchor of the soul, sure and firm, and which entereth in even within the veil;"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ubi praecursor pro nobis introiit Iesus secundum ordinem Melchisedech pontifex factus in aeternum"
      en: "Where the forerunner Jesus is entered for us, made a high priest for ever according to the order of Melchisedech."
    status: { la: verified, en: verified }
