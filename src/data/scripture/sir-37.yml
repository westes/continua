# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 37
verses:
  - n: 1
    text:
      la: "Omnis amicus dicet: Et ego amicitiam copulavi: sed est amicus solo nomine amicus. Nonne tristitia inest usque ad mortem?"
      en: "Every friend will say: I also am his friend: but there is a friend, that is only a friend in name. Is not this a grief even to death?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sodalis autem et amicus ad inimicitiam convertentur."
      en: "But a companion and a friend shall be turned to an enemy."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "O praesumptio nequissima, unde create es cooperire aridam malitia et dolositate illius?"
      en: "O wicked presumption, whence camest thou to cover the earth with thy malice, and deceitfulness?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Sodalis amico conjucundatur in oblectationibus, et in tempore tribulationis adversarius erit."
      en: "There is a companion who rejoiceth with his friend in his joys, but in the time of trouble, he will be against him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Sodalis amico condolet causa ventris, et contra hostem accipiet scutum."
      en: "There is a companion who condoleth with his friend for his belly's sake, and he will take up a shield against enemy."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Non obliviscaris amici tui in animo tuo, et non immemor sis illius in opibus tuis."
      en: "Forget not thy friend in thy mind, and be not unmindful of him in thy riches."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Noli consiliari cum eo qui tibi insidiatur, et a zelantibus te absconde consilium."
      en: "Consult not with him that layeth a snare for thee, and hide thy counsel from them that envy thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Omnis consiliarius prodit consilium, sed est consiliarius in semetipso."
      en: "Every counsellor giveth out counsel, but there is one that is a counsellor for himself."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "A consiliario serva animam tuam: prius scito quae sit illius necessitas: et ipse enim animo suo cogitabit:"
      en: "Beware of a counsellor. And know before what need he hath: for he will devise to his own mind:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ne forte mittat sudem in terram, et dicat tibi:"
      en: "Lest he thrust a stake into the ground, and say to thee:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Bona est via tua: et stet e contrario videre quid tibi eveniat."
      en: "Thy way is good; and then stand on the other side to see what shall befall thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cum viro irreligioso tracta de sanctitate, et cum injusto de justitia, et cum muliere de ea quae aemulatur, cum timido de bello, cum negotiatore de trajectione, cum emptore de venditione, cum viro livido de gratiis agendis,"
      en: "Treat not with a man without religion concerning holiness, nor with an unjust man concerning justice, nor with a woman touching her of whom she is jealous, nor with a coward concerning war, nor with a merchant about traffic, nor with a buyer of selling, nor with an envious man of giving thanks,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cum impio de pietate, cum inhonesto de honestate, cum operario agrario de omni opere,"
      en: "Nor with the ungodly of piety, nor with the dishonest of honesty, nor with the held labourer of every work,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "cum operario annuali de consummatione anni, cum servo pigro de multa operatione. Non attendas his in omni consilio:"
      en: "Nor with him that worketh by the year of the finishing of the year, nor with an idle servant of much business: give no heed to these in any matter of counsel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sed cum viro sancto assiduus esto, quemcumque cognoveris observantem timorem Dei:"
      en: "But be continually with a holy man, whomsoever thou shalt know to observe the fear of God,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cujus anima est secundum animam tuam, et qui, cum titubaveris in tenebris, condolebit tibi."
      en: "Whose soul is according to thy own soul: and who, when thou shalt stumble in the dark, will be sorry for thee."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cor boni consilii statue tecum: non est enim tibi aliud pluris illo."
      en: "And establish within thyself a heart of good counsel: for there is no other thing of more worth to thee than it."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Anima viri sancti enuntiat aliquando vera, quam septem circumspectores sedentes in excelso ad speculandum."
      en: "The soul of a holy man discovereth sometimes true things, more than seven watchmen that sit in a high piece to watch."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et in his omnibus deprecare Altissimum, ut dirigat in veritate viam tuam."
      en: "But above all these things pray to the most High, that he may direct thy way in truth."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Ante omnia opera verbum verax praecedat te, et ante omnem actum consilium stabile."
      en: "In all thy works let the true word go before thee, and steady counsel before every action."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Verbum nequam immutabit cor: ex quo partes quatuor oriuntur: bonum et malum, vita et mors: et dominatrix illorum est assidua lingua. Est vir astutus multorum eruditor, et animae suae inutilis est."
      en: "A wicked word shall change the beast: out of which four manner of things arise, good and evil, life and death: and the tongue is continually the ruler of them. There is a man that is subtle and a teacher of many, and yet is unprofitable to his own soul."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Vir peritus multos erudivit, et animae suae suavis est."
      en: "A skillful man hath taught many, and is sweet to his own soul."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Qui sophistice loquitur odibilis est: in omni re defraudabitur."
      en: "He that speaketh sophistically, is hateful: he shall be destitute of every thing."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Non est illi data a Domino gratia, omni enim sapientia defraudatus est."
      en: "Grace is not given him from the Lord: for he is deprived of all wisdom."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Est sapiens animae suae sapiens, et fructus sensus illius laudabilis."
      en: "There is a wise man that is wise to his own soul: and the fruit of his understanding is commendable."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Vir sapiens plebem suam erudit, et fructus sensus illius fideles sunt."
      en: "A wise man instructeth his own people, and the fruits of his understanding are faithful."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Vir sapiens implebitur benedictionibus, et videntes illum laudabunt."
      en: "A wise man shall be filled with blessings, and they that see shall praise him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Vita viri in numero dierum: dies autem Israel innumerabiles sunt."
      en: "The life of a man is in the number of his days: but the days of Israel are innumerable."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Sapiens in populo haereditabit honorem, et nomen illius erit vivens in aeternum."
      en: "A wise man shall inherit honour among his people, and his name shall live for ever."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Fili, in vita tua tenta animam tuam, et si fuerit nequam non des illi potestatem:"
      en: "My son, prove thy soul in thy life: and if it be wicked, give it no power:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "non enim omnia omnibus expediunt, et non omni animae omne genus placet."
      en: "For all things are not expedient for all, and every kind pleaseth not every soul."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Noli avidus esse in omni epulatione, et non te effundas super omnem escam:"
      en: "Be not greedy in any feasting, and pour not out thyself upon any meat:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "in multis enim escis erit infirmitas, et aviditas appropinquabit usque ad choleram."
      en: "For in many meats there will be sickness, and greediness will turn to choler."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Propter crapulam multi obierunt: qui autem abstinens est adjiciet vitam."
      en: "By surfeiting many have perished: but he that is temperate, shall prolong life."
    status: { la: verified, en: verified }
