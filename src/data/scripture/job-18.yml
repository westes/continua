# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 18
verses:
  - n: 1
    text:
      la: "respondens autem Baldad Suites dixit"
      en: "Then Baldad the Suhite answered, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "usque ad quem finem verba iactabitis intellegite prius et sic loquamur"
      en: "How long will you throw out words? understand first, and so let us speak."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quare reputati sumus ut iumenta et sorduimus coram vobis"
      en: "Why are we reputed as beasts, and counted vile before you?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui perdis animam tuam in furore tuo numquid propter te derelinquetur terra et transferentur rupes de loco suo"
      en: "Thou that destroyest thy soul in thy fury, shall the earth be forsaken for thee, and shall rocks be removed out of their place?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "nonne lux impii extinguetur nec splendebit flamma ignis eius"
      en: "Shall not the light of the wicked be extinguished, and the flame of his fire not shine?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "lux obtenebrescet in tabernaculo illius et lucerna quae super eum est extinguetur"
      en: "The light shall be dark in his tabernacle, and the lamp that is over him, shall be put out."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "artabuntur gressus virtutis eius et praecipitabit eum consilium suum"
      en: "The step of his strength shall be straitened, and his own counsel shall cast him down headlong."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "inmisit enim in rete pedes suos et in maculis eius ambulat"
      en: "For he hath thrust his feet into a net, and walketh in its meshes."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "tenebitur planta illius laqueo et exardescet contra eum sitis"
      en: "The sole of his foot shall be held in a snare, and thirst shall burn against him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "abscondita est in terra pedica eius et decipula illius super semitam"
      en: "A gin is hidden for him in the earth, and his trap upon the path."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "undique terrebunt eum formidines et involvent pedes eius"
      en: "Fears shall terrify him on every side, and shall entangle his feet."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "adtenuetur fame robur eius et inedia invadat costas illius"
      en: "Let his strength be wasted with famine, and let hunger invade his ribs."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "devoret pulchritudinem cutis eius consumat brachia illius primogenita mors"
      en: "Let it devour the beauty of his skin, let the firstborn death consume his arms."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "avellatur de tabernaculo suo fiducia eius et calcet super eum quasi rex interitus"
      en: "Let his confidence be rooted out of his tabernacle, and let destruction tread upon him like a king."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "habitent in tabernaculo illius socii eius qui non est aspergatur in tabernaculo eius sulphur"
      en: "Let the companions of him that is not, dwell in his tabernacle, let brimstone be sprinkled in his tent."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "deorsum radices eius siccentur sursum autem adteratur messis eius"
      en: "Let his roots be dried up beneath, and his harvest destroyed above."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "memoria illius pereat de terra et non celebretur nomen eius in plateis"
      en: "Let the memory of him perish from the earth and let not his name be renowned in the streets."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "expellet eum de luce in tenebras et de orbe transferet eum"
      en: "He shall drive him out of light into darkness, and shall remove him out of the world."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "non erit semen eius neque progenies in populo suo nec ullae reliquiae in regionibus eius"
      en: "His seed shall not subsist, nor his offspring among his people, nor any remnants in his country."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "in die eius stupebunt novissimi et primos invadet horror"
      en: "They that come after him shall be astonished at his day, and horror shall fall upon them that went before."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "haec sunt ergo tabernacula iniqui et iste locus eius qui ignorat Deum"
      en: "These men are the tabernacles of the wicked, and this the place of him that knoweth not God."
    status: { la: verified, en: verified }
