# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jac
chapter: 3
verses:
  - n: 1
    text:
      la: "Nolite plures magistri fieri fratres mei, scientes quoniam majus judicium sumitis."
      en: "Be ye not many masters, my brethren, knowing that you receive the greater judgment."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "In multis enim offendimus omnes. Si quis in verbo non offendit, hic perfectus est vir: potest etiam freno circumducere totum corpus."
      en: "For in many things we all offend. If any man offend not in word, the same is a perfect man. He is able also with a bridle to lead about the whole body."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Si autem equis frena in ora mittimus ad consentiendum nobis, et omne corpus illorum circumferimus."
      en: "For if we put bits into the mouths of horses, that they may obey us, and we turn about their whole body."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ecce et naves, cum magnae sint, et a ventis validis minentur, circumferuntur a modico gubernaculo ubi impetus dirigentis voluerit."
      en: "Behold also ships, whereas they are great, and are driven by strong winds, yet are they turned about with a small helm, whithersoever the force of the governor willeth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ita et lingua modicum quidem membrum est, et magna exaltat. Ecce quantus ignis quam magnam silvam incendit!"
      en: "Even so the tongue is indeed a little member, and boasteth great things. Behold how small a fire kindleth a great wood."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et lingua ignis est, universitas iniquitatis. Lingua constituitur in membris nostris, quae maculat totum corpus, et inflammat rotam nativitatis nostrae inflammata a gehenna."
      en: "And the tongue is a fire, a world of iniquity. The tongue is placed among our members, which defileth the whole body, and inflameth the wheel of our nativity, being set on fire by hell."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Omnis enim natura bestiarum, et volucrum, et serpentium, et ceterorum domantur, et domita sunt a natura humana:"
      en: "For every nature of beasts, and of birds, and of serpents, and of the rest, is tamed, and hath been tamed, by the nature of man:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "linguam autem nullus hominum domare potest: inquietum malum, plena veneno mortifero."
      en: "But the tongue no man can tame, an unquiet evil, full of deadly poison."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "In ipsa benedicimus Deum et Patrem: et in ipsa maledicimus homines, qui ad similitudinem Dei facti sunt."
      en: "By it we bless God and the Father: and by it we curse men, who are made after the likeness of God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ex ipso ore procedit benedictio et maledictio. Non oportet, fratres mei, haec ita fieri."
      en: "Out of the same mouth proceedeth blessing and cursing. My brethren, these things ought not so to be."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Numquid fons de eodem foramine emanat dulcem et amaram aquam?"
      en: "Doth a fountain send forth, out of the same hole, sweet and bitter water?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Numquid potest, fratres mei, ficus uvas facere, aut vitis ficus? Sic neque salsa dulcem potest facere aquam."
      en: "Can the fig tree, my brethren, bear grapes; or the vine, figs? So neither can the salt water yield sweet."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quis sapiens et disciplinatus inter vos? Ostendat ex bona conversatione operationem suam in mansuetudine sapientiae."
      en: "Who is a wise man, and endued with knowledge among you? Let him shew, by a good conversation, his work in the meekness of wisdom."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quod si zelum amarum habetis, et contentiones sint in cordibus vestris: nolite gloriari, et mendaces esse adversus veritatem:"
      en: "But if you have bitter zeal, and there be contentions in your hearts; glory not, and be not liars against the truth."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "non est enim ista sapientia desursum descendens: sed terrena, animalis, diabolica."
      en: "For this is not wisdom, descending from above: but earthly, sensual, devilish."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ubi enim zelus et contentio, ibi inconstantia et omne opus pravum."
      en: "For where envying and contention is, there is inconstancy, and every evil work."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quae autem desursum est sapientia, primum quidem pudica est, deinde pacifica, modesta, suadibilis, bonus consentiens, plena misericordia et fructibus bonis, non judicans, sine simulatione."
      en: "But the wisdom, that is from above, first indeed is chaste, then peaceable, modest, easy to be persuaded, consenting to the good, full of mercy and good fruits, without judging, without dissimulation."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Fructus autem justitiae, in pace seminatur, facientibus pacem."
      en: "And the fruit of justice is sown in peace, to them that make peace."
    status: { la: verified, en: verified }
