# Ezekiel (Vulgate "Ezechiel," cited "Ezech"), chapter 2.
# Verses transcribed from all-saints-octave-day-3.yml (already pulled
# from Divinum Officium, Monastic Tridentinum 1617) as part of the
# migration to a dedicated scripture store (2026-08 decision).
book: ezek
chapter: 2
verses:
  - n: 2
    text:
      la: "Et audívi loquéntem ad me,"
      en: "And the spirit entered into me after that he spoke to me, and he set me upon my feet: and I heard him speaking to me,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dicéntem: Fili hóminis, mitto ego te ad fílios Israël, ad gentes apostatríces quæ recessérunt a me; ipse et patres eórum prævaricáti sunt pactum meum usque ad diem hanc;"
      en: "And saying: Son of man, I send thee to the children of Israel, to a rebellious people, that hath revolted from me, they, and their fathers, have transgressed my covenant even unto this day."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et fílii dura fácie et indomábili corde sunt, ad quos ego mitto te, et dices ad eos: Hæc dicit Dóminus Deus:"
      en: "And they to whom I send thee are children of a hard face, and of an obstinate heart: and thou shalt say to them: Thus saith the Lord God:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Si forte vel ipsi áudiant, et si forte quiéscant, quóniam domus exásperans est: et scient quia prophéta fúerit in médio eórum."
      en: "If so be they at least will hear, and if so be they will forbear, for they are a provoking house: and they shall know that there hath been a prophet in the midst of them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Tu ergo, fili hóminis, ne tímeas eos, neque sermónes eórum métuas, quóniam incréduli et subversóres sunt tecum, et cum scorpiónibus hábitas. Verba eórum ne tímeas, et vultus eórum ne formídes, quia domus exásperans est."
      en: "And thou, O son of man, fear not, neither be thou afraid of their words: for thou art among unbelievers and destroyers, and thou dwellest with scorpions. Fear not their words, neither be thou dismayed at their looks: for they are a provoking house."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Loquéris ergo verba mea ad eos, si forte áudiant et quiéscant, quóniam irritatóres sunt."
      en: "And thou shalt speak my words to them, if perhaps they will hear, and forbear: for they provoke me to anger."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Tu autem, fili hóminis, audi quæcúmque loquor ad te, et noli esse exásperans, sicut domus exasperátrix est: áperi os tuum, et cómede quæcúmque ego do tibi."
      en: "But thou, O son of man, hear all that I say to thee: and do not thou provoke me, as that house provoketh me: open thy mouth, and eat what I give thee."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et vidi, et ecce manus missa ad me, in qua erat involútus liber: et expándit illum coram me, qui erat scriptus intus et foris, et scriptæ erant in eo lamentatiónes, et carmen, et væ."
      en: "And I looked, and behold, a hand was sent to me, wherein was a book rolled up: and he spread it before me, and it was written within and without: and there were written in it lamentations, and canticles, and woe."
    status: { la: verified, en: verified }
