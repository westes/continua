# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: marc
chapter: 2
verses:
  - n: 1
    text:
      la: "et iterum intravit Capharnaum post dies"
      en: "And again he entered into Capharnaum after some days."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et auditum est quod in domo esset et convenerunt multi ita ut non caperet neque ad ianuam et loquebatur eis verbum"
      en: "And it was heard that he was in the house, and many came together, so that there was no room; no, not even at the door; and he spoke to them the word."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et venerunt ferentes ad eum paralyticum qui a quattuor portabatur"
      en: "And they came to him, bringing one sick of the palsy, who was carried by four."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et cum non possent offerre eum illi prae turba nudaverunt tectum ubi erat et patefacientes submiserunt grabattum in quo paralyticus iacebat"
      en: "And when they could not offer him unto him for the multitude, they uncovered the roof where he was; and opening it, they let down the bed wherein the man sick of the palsy lay."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cum vidisset autem Iesus fidem illorum ait paralytico fili dimittuntur tibi peccata"
      en: "And when Jesus had seen their faith, he saith to the sick of the palsy: Son, thy sins are forgiven thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "erant autem illic quidam de scribis sedentes et cogitantes in cordibus suis"
      en: "And there were some of the scribes sitting there, and thinking in their hearts:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quid hic sic loquitur blasphemat quis potest dimittere peccata nisi solus Deus"
      en: "Why doth this man speak thus? he blasphemeth. Who can forgive sins, but God only?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quo statim cognito Iesus spiritu suo quia sic cogitarent intra se dicit illis quid ista cogitatis in cordibus vestris"
      en: "Which Jesus presently knowing in his spirit, that they so thought within themselves, saith to them: Why think you these things in your hearts?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quid est facilius dicere paralytico dimittuntur tibi peccata an dicere surge et tolle grabattum tuum et ambula"
      en: "Which is easier, to say to the sick of the palsy: Thy sins are forgiven thee; or to say: Arise, take up thy bed, and walk?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ut autem sciatis quia potestatem habet Filius hominis in terra dimittendi peccata ait paralytico"
      en: "But that you may know that the Son of man hath power on earth to forgive sins, (he saith to the sick of the palsy,)"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "tibi dico surge tolle grabattum tuum et vade in domum tuam"
      en: "I say to thee: Arise, take up thy bed, and go into thy house."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et statim ille surrexit et sublato grabatto abiit coram omnibus ita ut admirarentur omnes et honorificarent Deum dicentes quia numquam sic vidimus"
      en: "And immediately he arose; and taking up his bed, went his way in the sight of all; so that all wondered and glorified God, saying: We never saw the like."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et egressus est rursus ad mare omnisque turba veniebat ad eum et docebat eos"
      en: "And he went forth again to the sea side; and all the multitude came to him, and he taught them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et cum praeteriret vidit Levin Alphei sedentem ad teloneum et ait illi sequere me et surgens secutus est eum"
      en: "And when he was passing by, he saw Levi the son of Alpheus sitting at the receipt of custom; and he saith to him: Follow me. And rising up, he followed him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et factum est cum accumberet in domo illius multi publicani et peccatores simul discumbebant cum Iesu et discipulis eius erant enim multi qui et sequebantur eum"
      en: "And it came to pass, that as he sat at meat in his house, many publicans and sinners sat down together with Jesus and his disciples. For they were many, who also followed him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et scribae et Pharisaei videntes quia manducaret cum peccatoribus et publicanis dicebant discipulis eius quare cum publicanis et peccatoribus manducat et bibit magister vester"
      en: "And the scribes and the Pharisees, seeing that he ate with publicans and sinners, said to his disiples: Why doth your master eat and drink with publicans and sinners?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "hoc audito Iesus ait illis non necesse habent sani medicum sed qui male habent non enim veni vocare iustos sed peccatores"
      en: "Jesus hearing this, saith to them: They that are well have no need of a physician, but they that are sick. For I came not to call the just, but sinners."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et erant discipuli Iohannis et Pharisaei ieiunantes et veniunt et dicunt illi cur discipuli Iohannis et Pharisaeorum ieiunant tui autem discipuli non ieiunant"
      en: "And the disiples of John and the Pharisees used to fast; and they come and say to him: Why do the disciples of John and of the Pharisees fast; but thy disciples do not fast?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et ait illis Iesus numquid possunt filii nuptiarum quamdiu sponsus cum illis est ieiunare quanto tempore habent secum sponsum non possunt ieiunare"
      en: "And Jesus saith to them: Can the children of the marriage fast, as long as the bridegroom is with them? As long as they have the bridegroom with them, they cannot fast."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "venient autem dies cum auferetur ab eis sponsus et tunc ieiunabunt in illa die"
      en: "But the days will come when the bridegroom shall be taken away from them; and then they shall fast in those days."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "nemo adsumentum panni rudis adsuit vestimento veteri alioquin aufert supplementum novum a veteri et maior scissura fit"
      en: "No man seweth a piece of raw cloth to an old garment: otherwise the new piecing taketh away from the old, and there is made a greater rent."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et nemo mittit vinum novellum in utres veteres alioquin disrumpet vinum utres et vinum effunditur et utres peribunt sed vinum novum in utres novos mitti debet"
      en: "And no man putteth new wine into old bottles: otherwise the wine will burst the bottles, and both the wine will be spilled, and the bottles will be lost. But new wine must be put into new bottles."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et factum est iterum cum sabbatis ambularet per sata et discipuli eius coeperunt praegredi et vellere spicas"
      en: "And it came to pass again, as the Lord walked through the corn fields on the sabbath, that his disciples began to go forward, and to pluck the ears of corn."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Pharisaei autem dicebant ei ecce quid faciunt sabbatis quod non licet"
      en: "And the Pharisees said to him: Behold, why do they on the sabbath day that which is not lawful?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et ait illis numquam legistis quid fecerit David quando necessitatem habuit et esuriit ipse et qui cum eo erant"
      en: "And he said to them: Have you never read what David did when he had need, and was hungry himself, and they that were with him?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "quomodo introiit in domum Dei sub Abiathar principe sacerdotum et panes propositionis manducavit quos non licet manducare nisi sacerdotibus et dedit eis qui cum eo erant"
      en: "How he went into the house of God, under Abiathar the high priest, and did eat the loaves of proposition, which was not lawful to eat but for the priests, and gave to them who were with him?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et dicebat eis sabbatum propter hominem factum est et non homo propter sabbatum"
      en: "And he said to them: The sabbath was made for man, and not man for the sabbath."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "itaque dominus est Filius hominis etiam sabbati"
      en: "Therefore the Son of man is Lord of the sabbath also."
    status: { la: verified, en: verified }
