book: 4reg
chapter: 9
verses:
  - n: 1
    text:
      la: "Heliseus autem prophetes vocavit unum de filiis prophetarum et ait illi accinge lumbos tuos et tolle lenticulam olei hanc in manu tua et vade in Ramoth Galaad"
      en: "And Eliseus the prophet called one of the sons of the prophets, slid said to him: Gird up thy loins, and take this little bottle of oil in thy hand, and go to Ramoth Galaad."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "cumque veneris illuc videbis Hieu filium Iosaphat filii Namsi et ingressus suscitabis eum de medio fratrum suorum et introduces interius cubiculum"
      en: "And when thou art come thither, thou shalt see Jehu the son of Josaphat the son of Namsi: and going in thou shalt make him rise up from amongst his brethren, and carry him into an inner chamber."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "tenensque lenticulam olei fundes super caput eius et dices haec dicit Dominus unxi te regem super Israhel aperiesque ostium et fugies et non ibi subsistes"
      en: "Then taking the little bottle of oil, thou shalt pour it on his head, and shalt say: Thus saith the Lord: I have anointed thee king over Israel. And thou shalt open the door and flee, and shalt not stay there."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "abiit ergo adulescens puer prophetae Ramoth Galaad"
      en: "So the young man, the servant of the prophet, went awry to Ramoth Galaad,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et ingressus est ecce autem principes exercitus sedebant et ait verbum mihi ad te princeps dixitque Hieu ad quem ex omnibus nobis at ille dixit ad te o princeps"
      en: "And went in thither: and behold the captains of the army were sitting: and he said: I have a word to thee, O prince. And Jehu said: Unto whom of us all? And he said: To thee, O prince."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et surrexit et ingressus est cubiculum at ille fudit oleum super caput eius et ait haec dicit Dominus Deus Israhel unxi te regem super populum Domini Israhel"
      en: "And he arose, and went into the chamber: and he poured the oil upon his head, and said: Thus saith the Lord God of Israel : I have anointed thee king over Israel, the people of the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et percuties domum Ahab domini tui ut ulciscar sanguinem servorum meorum prophetarum et sanguinem omnium servorum Domini de manu Hiezabel"
      en: "And thou shalt cut off the house of Achab thy master, and I will revenge the blood of my servants the prophets, and the blood of all the servants of the Lord at the hand of Jezabel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "perdamque omnem domum Ahab et interficiam de Ahab mingentem ad parietem et clausum et novissimum in Israhel"
      en: "And I will destroy all the house of Achab, and I will cut off from Achab him that pisseth against the well, and him that is shut up, and the meanest in Israel."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dabo domum Ahab sicut domum Hieroboam filii Nabath et sicut domum Baasa filii Ahia"
      en: "And I will make the house of Achab like the house of Jeroboam the son of Nabat, and like the house of Baasa the son of Ahias."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Hiezabel quoque comedent canes in agro Hiezrahel nec erit qui sepeliat eam aperuitque ostium et fugit"
      en: "And the dogs shall eat Jezabel in the field of Jezrahel, and there shall be no one to bury her. And he opened the door and fled."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Hieu autem egressus est ad servos domini sui qui dixerunt ei rectene sunt omnia quid venit insanus iste ad te qui ait eis nostis hominem et quid locutus sit"
      en: "Then Jehu went forth to the servants of his lord: and they said to him: Are all things well? why came this mad man to thee? And he said to them: You know the man, and what he said."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "at illi responderunt falsum est sed magis narra nobis qui ait eis haec et haec locutus est mihi et ait haec dicit Dominus unxi te regem super Israhel"
      en: "But they answered: It is false, but rather do thou tell us. And he said to them: Thus and thus did he speak to me: and he said: Thus saith the Lord: I have anointed thee king over Israel."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "festinaverunt itaque et unusquisque tollens pallium suum posuerunt sub pedibus eius in similitudinem tribunalis et cecinerunt tuba atque dixerunt regnavit Hieu"
      en: "Then they made haste and taking every man his garment laid it under his feet, after the manner of a judgment seat, and they sounded the trumpet, and said: Jehu is king."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "coniuravit ergo Hieu filius Iosaphat filii Namsi contra Ioram porro Ioram obsederat Ramoth Galaad ipse et omnis Israhel contra Azahel regem Syriae"
      en: "So Jehu the son of Josaphat the son of Namsi conspired against Joram. Now Joram had besieged Ramoth Galaad, he and all Israel fighting with Hazael king of Syria:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et reversus fuerat ut curaretur in Hiezrahel propter vulnera quia percusserant eum Syri proeliantem contra Azahel regem Syriae dixitque Hieu si placet vobis nemo egrediatur profugus de civitate ne vadat et nuntiet in Hiezrahel"
      en: "And was returned to be healed in Jezrahel of his wounds, for the Syrians had wounded him, when he fought with Hazael king of Syria. And Jehu said: If it please you, let no mall go forth or flee out of the city, lest he go, and tell in Jezrahel."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et ascendit et profectus est in Hiezrahel Ioram enim aegrotabat ibi et Ahazia rex Iuda descenderat ad visitandum Ioram"
      en: "And he got up, and went into Jezrahel: for Joram was sick there, and Ochozias king of Juda was come down to visit Joram."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "igitur speculator qui stabat super turrem Hiezrahel vidit globum Hieu venientis et ait video ego globum dixitque Ioram tolle currum et mitte in occursum eorum et dicat vadens rectene sunt omnia"
      en: "The watchmen therefore, that stood upon the tower of Jezrahel, saw the troop of Jehu coming, and said: I see a troop. And Joram said: Take a chariot, and send to meet them, and let him that goeth say: Is all well?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "abiit igitur qui ascenderat currum in occursum eius et ait haec dicit rex pacata sunt omnia dixitque ei Hieu quid tibi et paci transi et sequere me nuntiavit quoque speculator dicens venit nuntius ad eos et non revertitur"
      en: "So there went one in a chariot to meet him, and said : Thus saith the king: Are all things peaceable? And Jehu said: What hast thou to do with peace? go behind and follow me. And the watchman told, saying: The messenger came to them, but he returneth not."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "misit etiam currum equorum secundum venitque ad eos et ait haec dicit rex num pax est et ait Hieu quid tibi et paci transi et sequere me"
      en: "And he sent a second chariot of horses: and he came to them, and said: Thus saith the king: Is there peace? And Jehu said: What hast thou to do with peace? pass, and follow me."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "nuntiavit autem speculator dicens venit usque ad eos et non revertitur est autem incessus quasi incessus Hieu filii Namsi praeceps enim graditur"
      en: "And the watchman told, saying: He came even to them, but returneth not: and the driving is like the driving of Jehu the son of Namsi, for he drives furiously."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et ait Ioram iunge currum iunxeruntque currum eius et egressus est Ioram rex Israhel et Ahazias rex Iuda singuli in curribus suis egressique sunt in occursum Hieu et invenerunt eum in agro Naboth Hiezrahelitis"
      en: "And Joram said: Make ready the chariot. And they made ready his chariot, and Joram king of Israel, and Ochozias king of Juda went out, each in his chariot, and they went out to meet Jehu, and met him in the field of Naboth the Jezrahelite."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "cumque vidisset Ioram Hieu dixit pax est Hieu at ille respondit quae pax adhuc fornicationes Hiezabel matris tuae et veneficia eius multa vigent"
      en: "And when Joram saw Jehu, he said: Is there peace, Jehu? And he answered: What peace ? so long as the fornications of Jezabel thy mother, and her many sorceries are in their vigour."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "convertit autem Ioram manum suam et fugiens ait ad Ahaziam insidiae Ahazia"
      en: "And Joram turned his hand, and fleeing, said to Ochozias: There is treachery, Ochozias."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "porro Hieu tetendit arcum manu et percussit Ioram inter scapulas et egressa est sagitta per cor eius statimque corruit in curru suo"
      en: "But Jehu bent Iris bow with his hand, and shot Joram between the shoulders: and the arrow went out through his heart, and immediately he fell in his chariot."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "dixitque Hieu ad Baddacer ducem tolle proice eum in agro Naboth Hiezrahelitae memini enim quando ego et tu sedentes in curru sequebamur Ahab patrem huius quod Dominus onus hoc levaverit super eum dicens"
      en: "And Jehu said to Badacer his captain: Take him, and cast him into the field of Naboth the Jezrahelite: for I remember when I and thou sitting in a chariot followed Achab this man's father, that the Lord laid this burden upon him, saying :"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "si non pro sanguine Naboth et pro sanguine filiorum eius quem vidi heri ait Dominus reddam tibi in agro isto dicit Dominus nunc igitur tolle proice eum in agro iuxta verbum Domini"
      en: "If I do not requite thee in this field, saith the Lord, for the blood of Naboth, and for the blood of his children, which I saw yesterday, saith the Lord. So now take him, and cast him into the field, according to the word of the Lord."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ahazias autem rex Iuda videns hoc fugit per viam domus horti persecutusque est eum Hieu et ait etiam hunc percutite in curru suo in ascensu Gaber qui est iuxta Ieblaam qui fugit in Mageddo et mortuus est ibi"
      en: "But Ochozias king of Juda seeing this, fled by the way of the garden house : and Jehu pursued him, and said: Strike him also in his chariot. And they struck him in the going up to Gaver, which is by Jeblaam: and he fled into Mageddo, and died there."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et inposuerunt eum servi eius super currum suum et tulerunt Hierusalem sepelieruntque in sepulchro cum patribus suis in civitate David"
      en: "And his servants laid him upon his chariot, and carried him to Jerusalem: and they buried him in his sepulchre with his fathers in the city of David."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "anno undecimo Ioram filii Ahab rege Ahazia super Iudam"
      en: "In the eleventh year of Joram the son of Achab, Ochozias reigned over Juda,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "venit Hieu Hiezrahel porro Hiezabel introitu eius audito depinxit oculos suos stibio et ornavit caput suum et respexit per fenestram"
      en: "And Jehu came into Jezrahel. But Jezabel hearing of his coming in, painted her face with stibic stone, and adorned her head, and looked out of a window"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ingredientem Hieu per portam et ait numquid pax esse potest Zamri qui interfecit dominum suum"
      en: "At Jehu coming in at the gate, and said: Can there be peace for Zambri, that hath killed his master?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "levavitque Hieu faciem suam ad fenestram et ait quae est ista et inclinaverunt se ad eum duo vel tres eunuchi"
      en: "And Jehu lifted up his face to the window, and said : Who is this? And two or three eunuchs bowed down to him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "at ille dixit eis praecipitate eam deorsum et praecipitaverunt eam aspersusque est sanguine paries et equorum ungulae qui conculcaverunt eam"
      en: "And he said to them: Throw her down headlong: and they threw her down, and the wall was sprinkled with her blood, and the hoofs of the horses trod upon her."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "cumque ingressus esset et comederet bibissetque ait ite videte maledictam illam et sepelite eam quia filia regis est"
      en: "And when he was come in, to eat, and to drink, he said: Go, and see after that cursed woman, and bury her: because she is a king's daughter."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "cumque issent ut sepelirent eam non invenerunt nisi calvariam et pedes et summas manus"
      en: "And when they went to bury her, they found nothing but the skull, and the feet, and the extremities of her hands."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "reversique nuntiaverunt ei et ait Hieu sermo Domini est quem locutus est per servum suum Heliam Thesbiten dicens in agro Hiezrahel comedent canes carnes Hiezabel"
      en: "And coming back they told him. And Jehu said: It is the word of the Lord, which he spoke by his servant Elias the Thesbite, saying: In the field of Jezrahel the dogs shall eat the flesh of Jezabel,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et erunt carnes Hiezabel sicut stercus super faciem terrae in agro Hiezrahel ita ut praetereuntes dicant haecine est illa Hiezabel"
      en: "And the flesh of Jezabel shall be as dung upon the face of the earth in the field of Jezrahel, so that they who pass by shall say: Is this that same Jezabel?"
    status: { la: verified, en: verified }
