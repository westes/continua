# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 9
verses:
  - n: 1
    text:
      la: "Eliseus autem prophetes vocavit unum de filiis prophetarum, et ait illi: Accinge lumbos tuos, et tolle lenticulam olei hanc in manu tua, et vade in Ramoth Galaad."
      en: "And Eliseus the prophet called one of the sons of the prophets, and said to him: Gird up thy loins, and take this little bottle of oil in thy hand, and go to Ramoth Galaad."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cumque veneris illuc, videbis Jehu filium Josaphat filii Namsi: et ingressus suscitabis eum de medio fratrum suorum, et introduces in interius cubiculum."
      en: "And when thou art come thither, thou shalt see Jehu the son of Josaphat the son of Namsi: and going in thou shalt make him rise up from amongst his brethren, and carry him into an inner chamber."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tenensque lenticulam olei, fundes super caput ejus, et dices: Haec dicit Dominus: Unxi te regem super Israel. Aperiesque ostium, et fugies, et non ibi subsistes."
      en: "Then taking the little bottle of oil, thou shalt pour it on his head, and shalt say: Thus saith the Lord: I have anointed thee king over Israel. And thou shalt open the door and flee, and shalt not stay there."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Abiit ergo adolescens puer prophetae in Ramoth Galaad,"
      en: "So the young man, the servant of the prophet, went away to Ramoth Galaad,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et ingressus est illuc: ecce autem principes exercitus sedebant, et ait: Verbum mihi ad te, o princeps. Dixitque Jehu: Ad quem ex omnibus nobis? At ille dixit: Ad te, o princeps."
      en: "And went in thither: and behold the captains of the army were sitting: and he said: I have a word to thee, O prince. And Jehu said: Unto whom of us all? And he said: To thee, O prince."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et surrexit et ingressus est cubiculum: at ille fudit oleum super caput ejus, et ait: Haec dicit Dominus Deus Israel: Unxi te regem super populum Domini Israel,"
      en: "And he arose, and went into the chamber: and he poured the oil upon his head, and said: Thus saith the Lord God of Israel: I have anointed thee king over Israel, the people of the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et percuties domum Achab domini tui, et ulciscar sanguinem servorum meorum prophetarum, et sanguinem omnium servorum Domini de manu Jezabel."
      en: "And thou shalt cut off the house of Achab thy master, and I will revenge the blood of my servants the prophets, and the blood of all the servants of the Lord at the hand of Jezabel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Perdamque omnem domum Achab: et interficiam de Achab mingentem ad parietem, et clausum et novissimum in Israel."
      en: "And I will destroy all the house of Achab, and I will cut off from Achab him that pisseth against the wall, and him that is shut up, and the meanest in Israel."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et dabo domum Achab, sicut domum Jeroboam filii Nabat, et sicut domum Baasa filii Ahia."
      en: "And I will make the house of Achab like the house of Jeroboam the son of Nabat, and like the house of Baasa the son of Ahias."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Jezabel quoque comedent canes in agro Jezrahel, nec erit qui sepeliat eam. Aperuitque ostium, et fugit."
      en: "And the dogs shall eat Jezabel in the field of Jezrahel, and there shall be no one to bury her. And he opened the door and fled."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Jehu autem egressus est ad servos domini sui: qui dixerunt ei: Rectene sunt omnia? quid venit insanus iste ad te? Qui ait eis: Nostis hominem, et quid locutus sit."
      en: "Then Jehu went forth to the servants of his lord: and they said to him: Are all things well? why came this mad man to thee? And he said to them: You know the man, and what he said."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "At ille responderunt: Falsum est, sed magis narra nobis. Qui ait eis: Haec et haec locutus est mihi, et ait: Haec dicit Dominus: Unxi te regem super Israel."
      en: "But they answered: It is false, but rather do thou tell us. And he said to them: Thus and thus did he speak to me: and he said: Thus saith the Lord: I have anointed thee king over Israel."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Festinaverunt itaque, et unusquisque tollens pallium suum posuerunt sub pedibus ejus, in similitudinem tribunalis, et cecinerunt tuba, atque dixerunt: Regnavit Jehu."
      en: "Then they made haste and taking every man his garment laid it under his feet, after the manner of a judgment seat, and they sounded the trumpet, and said: Jehu is king."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Conjuravit ergo Jehu filius Josaphat filii Namsi contra Joram: porro Joram obsederat Ramoth Galaad, ipse et omnis Israel contra Hazael regem Syriae:"
      en: "So Jehu the son of Josaphat the son of Namsi conspired against Joram. Now Joram had besieged Ramoth Galaad, he and all Israel fighting with Hazael king of Syria:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et reversus fuerat ut curaretur in Jezrahel propter vulnera, quia percusserant eum Syri, praeliantem contra Hazael regem Syriae. Dixitque Jehu: Si placet vobis, nemo egrediatur profugus de civitate, ne vadat, et nuntiet in Jezrahel."
      en: "And was returned to be healed in Jezrahel of his wounds, for the Syrians had wounded him, when he fought with Hazael king of Syria. And Jehu said: If it please you, let no man go forth or flee out of the city, lest he go, and tell in Jezrahel."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et ascendit, et profectus est in Jezrahel: Joram enim aegrotabat ibi, et Ochozias rex Juda descenderat ad visitandum Joram."
      en: "And he got up, and went into Jezrahel: for Joram was sick there, and Ochozias king of Juda was come down to visit Joram."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Igitur speculator qui stabat super turrim Jezrahel, vidit globum Jehu venientis, et ait: Video ego globum. Dixitque Joram: Tolle currum, et mitte in occursum eorum, et dicat vadens: Rectene sunt omnia?"
      en: "The watchmen therefore, that stood upon the tower of Jezrahel, saw the troop of Jehu coming, and said: I see a troop. And Joram said: Take a chariot, and send to meet them, and let him that goeth say: Is all well?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Abiit ergo, qui ascenderat currum, in occursum ejus, et ait: Haec dicit rex: Pacatane sunt omnia? Dixitque Jehu: Quid tibi et paci? Transi, et sequere me. Nuntiavit quoque speculator, dicens: Venit nuntius ad eos, et non revertitur."
      en: "So there went one in a chariot to meet him, and said: Thus saith the king: Are all things peaceable? And Jehu said: What hast thou to do with peace? go behind and follow me. And the watchman told, saying: The messenger came to them, but he returneth not."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Misit etiam currum equorum secundum: venitque ad eos, et ait: Haec dicit rex: Numquid pax est? Et ait Jehu: Quid tibi et paci? Transi, et sequere me."
      en: "And he sent a second chariot of horses: and he came to them, and said: Thus saith the king: Is there peace? And Jehu said: What hast thou to do with peace? pass, and follow me."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Nuntiavit autem speculator, dicens: Venitusque ad eos, et non revertitur: est autem incessus quasi incessus Jehu filii Namsi, praeceps enim graditur."
      en: "And the watchman told, saying: He came even to them, but returneth not: and the driving is like the driving of Jehu the son of Namsi, for he drives furiously."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et ait Joram: Junge currum. Junxeruntque currum ejus, et egressus est Joram rex Israel, et Ochozias rex Juda, singuli in curribus suis, egressique sunt in occursum Jehu, et invenerunt eum in agro Naboth Jezrahelitae."
      en: "And Joram said: Make ready the chariot. And they made ready his chariot, and Joram king of Israel, and Ochozias king of Juda went out, each in his chariot, and they went out to meet Jehu, and met him in the field of Naboth the Jezrahelite."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Cumque vidisset Joram Jehu, dixit: Pax est, Jehu? At ille respondit: Quae pax? Adhuc fornicationes Jezabel matris tuae, et veneficia ejus multa vigent."
      en: "And when Joram saw Jehu, he said: Is there peace, Jehu? And he answered: What peace? so long as the fornications of Jezabel thy mother, and her many sorceries are in their vigour."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Convertit autem Joram manum suam, et fugiens ait ad Ochoziam: Insidiae, Ochozia."
      en: "And Joram turned his hand, and fleeing, said to Ochozias: There is treachery, Ochozias."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Porro Jehu tetendit arcum manu, et percussit Joram inter scapulas: et egressa est sagitta per cor ejus, statimque corruit in curru suo."
      en: "But Jehu bent his bow with his hand, and shot Joram between the shoulders: and the arrow went out through his heart, and immediately he fell in his chariot."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Dixitque Jehu ad Badacer ducem: Tolle, projice eum in agro Naboth Jezrahelitae: memini enim quando ego et tu sedentes in curru sequebamur Achab patrem hujus, quod Dominus onus hoc levaverit super eum, dicens:"
      en: "And Jehu said to Badacer his captain: Take him, and cast him into the field of Naboth the Jezrahelite: for I remember when I and thou sitting in a chariot followed Achab this man's father, that the Lord laid this burden upon him, saying:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Si non pro sanguine Naboth, et pro sanguine filiorum ejus, quem vidi heri, ait Dominus, reddam tibi in agro isto, dicit Dominus. Nunc ergo tolle, et projice eum in agrum juxta verbum Domini."
      en: "If I do not requite thee in this field, saith the Lord, for the blood of Naboth, and for the blood of his children, which I saw yesterday, saith the Lord. So now take him, and cast him into the field, according to the word of the Lord."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ochozias autem rex Juda videns hoc, fugit per viam domus horti: persecutusque est eum Jehu, et ait: Etiam hunc percutite in curru suo. Et percusserunt eum in ascensu Gaver, qui est juxta Jeblaam: qui fugit in Mageddo, et mortuus est ibi."
      en: "But Ochozias king of Juda seeing this, fled by the way of the garden house: and Jehu pursued him, and said: Strike him also in his chariot. And they struck him in the going up to Gaver, which is by Jeblaam: and he fled into Mageddo, and died there."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et imposuerunt eum servi ejus super currum suum, et tulerunt in Jerusalem: sepelieruntque eum in sepulchro cum patribus suis in civitate David."
      en: "And his servants laid him upon his chariot, and carried him to Jerusalem: and they buried him in his sepulchre with his fathers in the city of David."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Anno undecimo Joram filii Achab, regnavit Ochozias super Judam,"
      en: "In the eleventh year of Joram the son of Achab, Ochozias reigned over Juda,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "venitque Jehu in Jezrahel. Porro Jezabel, introitu ejus audito, depinxit oculos suos stibio, et ornavit caput suum, et respexit per fenestram"
      en: "And Jehu came into Jezrahel. But Jezabel hearing of his coming in, painted her face with stibic stone, and adorned her head, and looked out of a window"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ingredientem Jehu per portam, et ait: Numquid pax potest esse Zambri, qui interfecit dominum suum?"
      en: "At Jehu coming in at the gate, and said: Can there be peace for Zambri, that hath killed his master?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Levavitque Jehu faciem suam ad fenestram, et ait: Quae est ista? et inclinaverunt se ad eum duo vel tres eunuchi."
      en: "And Jehu lifted up his face to the window, and said: Who is this? And two or three eunuchs bowed down to him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "At ille dixit eis: Praecipitate eam deorsum: et praecipitaverunt eam, aspersusque est sanguine paries, et equorum ungulae conculcaverunt eam."
      en: "And he said to them: Throw her down headlong: and they threw her down, and the wall was sprinkled with her blood, and the hoofs of the horses trod upon her."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Cumque introgressus esset, ut comederet biberetque, ait: Ite, et videte maledictam illam, et sepelite eam: quia filia regis est."
      en: "And when he was come in, to eat, and to drink, he said: Go, and see after that cursed woman, and bury her: because she is a king's daughter."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Cumque issent ut sepelirent eam, non invenerunt nisi calvariam, et pedes, et summas manus."
      en: "And when they went to bury her, they found nothing but the skull, and the feet, and the extremities of her hands."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Reversique nuntiaverunt ei. Et ait Jehu: Sermo Domini est, quem locutus est per servum suum Eliam Thesbiten, dicens: In agro Jezrahel comedent canes carnes Jezabel,"
      en: "And coming back they told him. And Jehu said: It is the word of the Lord, which he spoke by his servant Elias the Thesbite, saying: In the field of Jezrahel the dogs shall eat the flesh of Jezabel,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et erunt carnes Jezabel sicut stercus super faciem terrae in agro Jezrahel, ita ut praetereuntes dicant: Haeccine est illa Jezabel?"
      en: "And the flesh of Jezabel shall be as dung upon the face of the earth in the field of Jezrahel, so that they who pass by shall say: Is this that same Jezabel?"
    status: { la: verified, en: verified }
