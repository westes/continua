# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 20
verses:
  - n: 1
    text:
      la: "In anno quo ingressus est Thathan in Azotum, cum misisset eum Sargon, rex Assyriorum, et pugnasset contra Azotum, et cepisset eam:"
      en: "In the year that Tharthan entered into Azotus, when Sargon the king of the Assyrians had sent him, and he had fought against Azotus, and had taken it:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in tempore illo locutus est Dominus in manu Isaiae, filii Amos, dicens: Vade, et solve saccum de lumbis tuis, et calceamenta tua tolle de pedibus tuis. Et fecit sic, vadens nudus et discalceatus."
      en: "At that same time the Lord spoke by the hand of Isaias the son of Amos, saying: Go, and loose the sackcloth from off thy loins, and take off thy shoes from thy feet. And he did so, and went naked, and barefoot."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dixit Dominus: Sicut ambulavit servus meus Isaias nudus et discalceatus, trium annorum signum et portentum erit super Aegyptum et super Aethiopiam;"
      en: "And the Lord said: As my servant Isaias hath walked, naked and barefoot, it shall be a sign and a wonder of three years upon Egypt, and upon Ethiopia,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sic minabit rex Assyriorum captivitatem Aegypti, et transmigrationem Aethiopiae, juvenum et senum, nudam et discalceatam, discoopertis natibus, ad ignominiam Aegypti."
      en: "So shall the king of the Assyrians lead away the prisoners of Egypt, and the captivity of Ethiopia, young and old. naked and barefoot, with their buttocks uncovered to the shame of Egypt."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et timebunt, et confundentur ab Aethiopia spe sua, et ab Aegypto gloria sua."
      en: "And they shall be afraid, and ashamed of Ethiopia their hope, and of Egypt their glory."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et dicet habitator insulae hujus in die illa: Ecce haec erat spes nostra, ad quos confugimus in auxilium, ut liberarent nos a facie regis Assyriorum: et quomodo effugere poterimus nos?"
      en: "And the inhabitants of this isle shall say in that day: Lo this was our hope, to whom we fled for help, to deliver up from the face of the king of the Assyrians: and how shall we be able to escape?"
    status: { la: verified, en: verified }
