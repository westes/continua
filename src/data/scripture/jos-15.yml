# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jos
chapter: 15
verses:
  - n: 1
    text:
      la: "Igitur sors filiorum Judae per cognationes suas ista fuit: a termino Edom, desertum Sin, contra meridiem, et usque ad extremam partem australis plagae."
      en: "Now the lot of the children of Juda by their kindreds was this: From the frontier of Edom, to the desert of Sin southward, and to the uttermost part of the south coast."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Initium ejus a summitate maris salsissimi, et a lingua ejus, quae respicit meridiem."
      en: "Its beginning was from the top of the most salt sea, and from the bay thereof, that looketh to the south."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Egrediturque contra ascensum Scorpionis, et pertransit in Sina: ascenditque in Cadesbarne, et pervenit in Esron, ascendens ad Addar, et circuiens Carcaa,"
      en: "And it goeth out towards the ascent of the Scorpion, and passeth on to Sina: and ascendeth into Cadesbarne, and reacheth into Esron, going up to Addar, and compassing Carcaa."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "atque inde pertransiens in Asemona, et perveniens ad torrentem Aegypti: eruntque termini ejus mare magnum. Hic erit finis meridianae plagae."
      en: "And from thence passing along into Asemona, and reaching the torrent of Egypt: and the bounds thereof shall be the great sea, this shall be the limit of the south coast."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ab oriente vero erit initium, mare salsissimum usque ad extrema Jordanis: et ea quae respiciunt ad aquilonem, a lingua maris usque ad eumdem Jordanis fluvium."
      en: "But on the east side the beginning shall be the most salt sea even to the end of the Jordan: and towards the north, from the bay of the sea unto the same river Jordan."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ascenditque terminus in Beth Hagla, et transit ab aquilone in Beth Araba, ascendens ad lapidem Boen filii Ruben:"
      en: "And the border goeth up into Beth-Hagla, and passeth by the north into Beth-Araba: going up to the stone of Boen the son of Ruben."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et tendens usque ad terminos Debera de valle Achor, contra aquilonem respiciens Galgala, quae est ex adverso ascensionis Adommim, ab australi parte torrentis: transitque aquas, quae vocantur fons solis: et erunt exitus ejus ad fontem Rogel."
      en: "And reaching as far as the borders of Debara from the valley of Achor, and so northward looking towards Galgal, which is opposite to the ascent of Adommin, on the south side of the torrent: and the border passeth the waters that are called the fountain of the sun: and the goings out thereof shall be at the fountain Rogel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ascenditque per convallem filii Ennom ex latere Jebusaei ad meridiem, haec est Jerusalem: et inde se erigens ad verticem montis, qui est contra Geennom ad occidentem in summitate vallis Raphaim contra aquilonem:"
      en: "And it goeth up by the valley of the son of Ennom on the side of the Jebusite towards the south, the same is Jerusalem: and thence ascending to the top of the mountain, which is over against Geennom to the west in the end of the valley of Raphaim, northward."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "pertransitque a vertice montis usque ad fontem aquae Nephtoa: et pervenit usque ad vicos montis Ephron: inclinaturque in Baala, quae est Cariathiarim, id est, urbs silvarum."
      en: "And it passeth on from the top of the mountain to the fountain of the water of Nephtoa: and reacheth to the towns of mount Ephron: and it bendeth towards Baala, which is Cariathiarim, that is to say, the city of the woods."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et circuit de Baala contra occidentem, usque ad montem Seir: transitque juxta latus montis Jarim ad aquilonem in Cheslon: et descendit in Bethsames, transitque in Thamna."
      en: "And it compasseth from Baala westward unto mount Seir: and passeth by the side of mount Jarim to the north into Cheslon: and goeth down into Bethsames, and passeth into Thamna."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et pervenit contra aquilonem partis Accaron ex latere: inclinaturque Sechrona, et transit montem Baala: pervenitque in Jebneel, et magni maris contra occidentem fine concluditur."
      en: "And it reacheth northward to a part of Accaron at the side: and bendeth to Sechrona, and passeth mount Baala: and cometh into Jebneel, and is bounded westward with the great sea."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Hi sunt termini filiorum Juda per circuitum in cognationibus suis."
      en: "These are the borders round about of the children of Juda in their kindreds."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Caleb vero filio Jephone dedit partem in medio filiorum Juda, sicut praeceperat ei Dominus: Cariath Arbe patris Enac, ipsa est Hebron."
      en: "But to Caleb the son of Jephone he gave a portion in the midst of the children of Juda, as the Lord had commanded him: Cariath-Arbe the father of Enac. which is Hebron."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Delevitque ex ea Caleb tres filios Enac, Sesai et Ahiman et Tholmai de stirpe Enac."
      en: "And Caleb destroyed out of it the three sons of Enac, Sesai and Ahiman. and Tholmai of the race of Enac."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Atque inde conscendens venit ad habitatores Dabir, quae prius vocabatur Cariath Sepher, id est, civitas litterarum."
      en: "And going up from thence he came to the inhabitants of Dabir, which before was called Cariath-Sepher, that is to say, the city of letters."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Dixitque Caleb: Qui percusserit Cariath Sepher, et ceperit eam, dabo ei Axam filiam meam uxorem."
      en: "And Caleb said: He that shall smite Cariath-Sepher, and take it, I will give him Axa my daughter to wife."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cepitque eam Othoniel filius Cenez frater Caleb junior: deditque ei Axam filiam suam uxorem."
      en: "And Othoniel the son of Cenez, the younger brother of Caleb, took it: and he gave him Axa his daughter to wife."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quae, cum pergerent simul, suasa est a viro suo ut peteret a patre suo agrum. Suspiravitque ut sedebat in asino: cui Caleb: Quid habes? inquit."
      en: "And as they were going together, she was moved by her husband to ask a field of her father, and she sighed as she sat on her ass. And Caleb said to her: What aileth thee?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "At illa respondit: Da mihi benedictionem: terram australem et arentem dedisti mihi; junge et irriguam. Dedit itaque ei Caleb irriguum superius et inferius."
      en: "But she answered: Give me a blessing: thou hast given me a southern and dry land, give me also a land that is watered. And Caleb gave her the upper and the nether watery ground."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Haec est possessio tribus filiorum Juda per cognationes suas."
      en: "This is the possession of the tribe of the children of Juda by their kindreds."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Erantque civitates ab extremis partibus filiorum Juda juxta terminos Edom a meridie: Cabseel et Eder et Jagur,"
      en: "And the cities from the uttermost parts of the children of Juda by the borders of Edom to the south, were Cabseel and Eder and Jagur,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et Cyna et Dimona et Adada,"
      en: "And Cina and Dimona and Adada,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et Cades et Asor et Jethnam,"
      en: "And Cades and Asor and Jethnam,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ziph et Telem et Baloth,"
      en: "Ziph and Telem and Baloth,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Asor nova et Carioth, Hesron, haec est Asor;"
      en: "New Asor and Carioth, Hesron, which is Asor."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Amam, Sama, et Molada,"
      en: "Amam, Sama and Molada,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et Asergadda et Hassemon et Bethphelet,"
      en: "And Asergadda and Hassemon and Bethphelet,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et Hasersual et Bersabee et Baziothia,"
      en: "And Hasersual and Bersabee and Baziothia,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et Baala et Jim et Esem,"
      en: "And Baala and Jim and Esem,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et Eltholad et Cesil et Harma,"
      en: "And Eltholad and Cesil and Harma,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et Siceleg et Medemena et Sensenna,"
      en: "And Siceleg and Medemena and Sensenna,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Lebaoth et Selim et Aen et Remon. Omnes civitates viginti novem, et villae earum."
      en: "Lebaoth and Selim and Aen and Remmon: all the cities twenty-nine, and their villages."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "In campestribus vero: Estaol et Sarea et Asena,"
      en: "But in the plains: Estaol and Sarea and Asena,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et Zanoe et Aengannim et Taphua et Enaim,"
      en: "And Zanoe and Engannim and Taphua and Enaim,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et Jerimoth et Adullam, Socho et Azeca,"
      en: "And Jerimoth and Adullam, Socho and Azeca,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et Saraim et Adithaim et Gedera et Gederothaim: urbes quatuordecim, et villae earum."
      en: "And Saraim and Adithaim and Gedera and Gederothaim: fourteen cities, and their villages."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Sanan et Hadassa et Magdalgad,"
      en: "Sanan and Hadassa and Magdalgad,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Delean et Masepha et Jecthel,"
      en: "Delean and Masepha and Jecthel,"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Lachis et Bascath et Eglon,"
      en: "Lachis and Bascath and Eglon,"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Chebbon et Leheman et Cethlis,"
      en: "Chebbon and Leheman and Cethlis,"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et Gideroth et Bethdagon et Naama et Maceda: civitates sedecim, et villae earum."
      en: "And Gideroth and Bethdagon and Naama and Maceda: sixteen cities, and their villages."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Labana et Ether et Asan,"
      en: "Labana and Ether and Asan,"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Jephtha et Esna et Nesib,"
      en: "Jephtha and Esna and Nesib,"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et Ceila et Achzib et Maresa: civitates novem, et villae earum."
      en: "And Ceila and Achzib and Maresa: nine cities, and their villages."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Accaron cum vicis et villulis suis."
      en: "Accaron with the towns and villages thereof."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Ab Accaron usque ad mare: omnia quae vergunt ad Azotum et viculos ejus."
      en: "From Accaron even to the sea: all places that lie towards Azotus and the villages thereof."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Azotus cum vicis et villulis suis. Gaza cum vicis et villulis suis, usque ad torrentem Aegypti, et mare magnum terminus ejus."
      en: "Azotus with its towns and villages. Gaza with its towns and villages, even to the torrent of Egypt, and the great sea that is the border thereof."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Et in monte: Samir et Jether et Socoth"
      en: "And in the mountain Samir and Jether and Socoth,"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "et Danna et Cariathsenna, haec est Dabir:"
      en: "And Danna and Cariath-senna, this is Dabir:"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Anab et Istemo et Anim,"
      en: "Anab and Istemo and Anim,"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Gosen et Olon et Gilo: civitates undecim et villae earum."
      en: "Gosen and Olon and Gilo: eleven cities and their villages."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Arab et Ruma et Esaan,"
      en: "Arab and Ruma and Esaan,"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "et Janum et Beththaphua et Apheca,"
      en: "And Janum and Beththaphua and Apheca,"
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Athmatha, et Cariath Arbe, haec est Hebron, et Sior: civitates novem, et villae earum."
      en: "Athmatha and Cariath-Arbe, this is Hebron and Sior: nine cities and their villages."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Maon et Carmel et Ziph et Jota,"
      en: "Maon and Carmel and Ziph and Jota,"
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Jezrael et Jucadam et Zanoe,"
      en: "Jezrael and Jucadam and Zanoe,"
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Accain, Gabaa et Thamna: civitates decem et villae earum."
      en: "Accain, Gabaa and Thamna: ten cities and their villages."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Halhul, et Besur, et Gedor,"
      en: "Halhul, and Bessur, and Gedor,"
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Mareth, et Bethanoth, et Eltecon: civitates sex et villae earum."
      en: "Mareth, and Bethanoth, and Eltecon: six cities and their villages."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "Cariathbaal, haec est Cariathiarim urbs silvarum, et Arebba: civitates duae, et villae earum."
      en: "Cariathbaal, the same is Cariathiarim, the city of woods, and Arebba: two cities and their villages."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "In deserto Betharaba, Meddin, et Sachacha,"
      en: "In the desert Betharaba, Meddin and Sachacha,"
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "et Nebsan, et civitas salis, et Engaddi: civitates sex, et villae earum."
      en: "And Nebsan, and the city of salt, and Engaddi: six cities and their villages."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "Jebusaeum autem habitatorem Jerusalem non potuerunt filii Juda delere: habitavitque Jebusaeus cum filiis Juda in Jerusalem usque in praesentem diem."
      en: "But the children of Juda could not destroy the Jebusite that dwelt in Jerusalem: and the Jebusite dwelt with the children of Juda in Jerusalem until this present day."
    status: { la: verified, en: verified }
