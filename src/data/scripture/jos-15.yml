      la: "ab Accaron usque ad mare omnia quae vergunt ad Azotum et viculos eius"
      en: "From Accaron even to the sea: all places that lie towards Azotus and the villages thereof."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Azotus cum vicis et villulis suis Gaza cum viculis et villulis suis usque ad torrentem Aegypti mare Magnum terminus eius"
      en: "Azotus with its towns and villages. Gaza with its towns and villages, even to the torrent of Egypt, and the great sea that is the border thereof."
    status: { la: verified, en: verified }
  - n: 48
