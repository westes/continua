# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 4
verses:
  - n: 1
    text:
      la: "Respondens autem Eliphaz Themanites, dixit:"
      en: "Then Eliphaz the Themanite answered, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Si coeperimus loqui tibi, forsitan moleste accipies; sed conceptum sermonem tenere quis poterit?"
      en: "If we begin to speak to thee, perhaps thou wilt take it ill, but who can withhold the words he hath conceived?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ecce docuisti multos, et manus lassas roborasti;"
      en: "Behold thou hast taught many, and thou hast strengthened the weary hands:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "vacilantes confirmaverunt sermones tui, et genua trementia confortasti."
      en: "Thy words have confirmed them that were staggering, and thou hast strengthened the trembling knees:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Nunc autem venit super te plaga, et defecisti; tetigit te, et conturbatus es."
      en: "But now the scourge is come upon thee, and thou faintest: it hath touched thee, and thou art troubled."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ubi est timor tuus, fortitudo tua? patientia tua et perfectio viarum tuarum?"
      en: "Where is thy fear, thy fortitude, thy patience, and the perfection of thy ways?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Recordare, obsecro te, quis umquam innocens periit; aut quando recti deleti sunt?"
      en: "Remember, I pray thee, who ever perished being innocent? or when were the just destroyed?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quin potius vidi eos qui operantur iniquitatem, et seminant dolores, et metunt eos,"
      en: "On the contrary I have seen those who work iniquity, and sow sorrows, and reap them,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "flante Deo perisse, et spiritu irae ejus esse consumptos."
      en: "Perishing by the blast of God, and consumed by the spirit of his wrath."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Rugitus leonis, et vox leaenae, et dentes catulorum leonum contriti sunt."
      en: "The roaring of the lion, and the voice of the lioness, and the teeth of the whelps of lions are broken:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Tigris periit, eo quod non haberet praedam, et catuli leonis dissipati sunt."
      en: "The tiger hath perished for want of prey, and the young lions are scattered abroad."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Porro ad me dictum est verbum absconditum, et quasi furtive suscepit auris mea venas susurri ejus."
      en: "Now there was a word spoken to me in private, and my ears by stealth as it were received the veins of its whisper."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "In horrore visionis nocturnae, quando solet sopor occupare homines,"
      en: "In the horror of a vision by night, when deep sleep is wont to hold men,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "pavor tenuit me, et tremor, et omnia ossa mea perterrita sunt;"
      en: "Fear seized upon me, and trembling, and all my bones were affrighted:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et cum spiritus, me praesente, transiret, inhorruerunt pili carnis meae."
      en: "And when a spirit passed before me, the hair of my flesh stood up."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Stetit quidam, cujus non agnoscebam vultum, imago coram oculis meis, et vocem quasi aurae lenis audivi."
      en: "There stood one whose countenance I knew not, an image before my eyes, and I heard the voice as it were of a gentle wind:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Numquid homo, Dei comparatione, justificabitur? aut factore suo purior erit vir?"
      en: "Shall man be justified in comparison of God, or shall a man be more pure than his maker?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ecce qui serviunt ei, non sunt stabiles, et in angelis suis reperit pravitatem;"
      en: "Behold they that serve him are not steadfast, and in his angels he found wickedness:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quanto magis hi qui habitant domos luteas, qui terrenum habent fundamentum, consumentur velut a tinea!"
      en: "How much more shall they that dwell in houses of clay, who have an earthly foundation, be consumed as with the moth?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "De mane usque ad vesperam succidentur; et quia nullus intelligit, in aeternum peribunt."
      en: "From morning till evening they shall be cut down: and because no one understandeth, they shall perish for ever."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Qui autem reliqui fuerint, auferentur ex eis; morientur, et non in sapientia."
      en: "And they that shall be left, shall be taken away from them: they shall die, and not in wisdom."
    status: { la: verified, en: verified }
