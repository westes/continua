# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jos
chapter: 17
verses:
  - n: 1
    text:
      la: "Cecidit autem sors tribui Manasse ( ipse enim est primogenitus Joseph): Machir primogenito Manasse patri Galaad, qui fuit vir pugnator, habuitque possessionem Galaad et Basan:"
      en: "And this lot fell to the tribe of Manasses (for he is the firstborn of Joseph) to Machir the firstborn of Manasses the father of Galaad, who was a warlike man, and had for possession Galaad and Basan."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et reliquis filiorum Manasse juxta familias suas, filiis Abiezer, et filiis Helec, et filiis Esriel, et filiis Sechem, et filiis Hepher, et filiis Semida. Isti sunt filii Manasse filii Joseph, mares, per cognationes suas."
      en: "And to the rest of the children of Manasses according to their families: to the children of Abiezer, and to the children of Helec, and to the children of Esriel, and to the children of Sechem, and to the children of Hepher, and to the children of Semida: these are the male children of Manasses the son of Joseph, by their kindreds."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Salphaad vero filio Hepher filii Galaad filii Machir filii Manasse non erant filii, sed solae filiae: quarum ista sunt nomina: Maala et Noa et Hegla et Melcha et Thersa."
      en: "But Salphaad the son of Hepher the son of Galaad the son of Machir the son of Manasses had no sons, but only daughters: whose names are these, Maala and Noa and Hegla and Melcha and Thersa."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Veneruntque in conspectu Eleazari sacerdotis, et Josue filii Nun, et principum, dicentes: Dominus praecepit per manum Moysi, ut daretur nobis possessio in medio fratrum nostrorum. Deditque eis juxta imperium Domini possessionem in medio fratrum patris earum."
      en: "And they came in the presence of Eleazar the priest and of Josue the son of Nun, and of the princes, saying: The Lord commanded by the hand of Moses, that a possession should be given us in the midst of our brethren. And he gave them according to the commandment of the Lord a possession amongst the brethren of their father."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et ceciderunt funiculi Manasse, decem, absque terra Galaad et Basan trans Jordanem."
      en: "And there fell ten portions to Manasses, beside the land of Galaad and Basan beyond the Jordan."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Filiae enim Manasse possederunt haereditatem in medio filiorum ejus. Terra autem Galaad cecidit in sortem filiorum Manasse qui reliqui erant."
      en: "For the daughters of Manasses possessed inheritance in the midst of his sons. And the land of Galaad fell to the lot of the rest of the children of Manasses."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Fuitque terminus Manasse ab Aser, Machmethath quae respicit Sichem: et egreditur ad dexteram juxta habitatores fontis Taphuae."
      en: "And the border of Manasses was from Aser, Machmethath which looketh towards Sichem: and it goeth out on the right hand by the inhabitants of the fountain of Taphua."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Etenim in sorte Manasse ceciderat terra Taphuae, quae est juxta terminos Manasse filiorum Ephraim."
      en: "For the lot of Manasses took in the land of Taphua, which is on the borders of Manasses, and belongs to the children of Ephraim."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Descenditque terminus vallis arundineti in meridiem torrentis civitatum Ephraim, quae in medio sunt urbium Manasse: terminus Manasse ab aquilone torrentis, et exitus ejus pergit ad mare:"
      en: "And the border goeth down to the valley of the reeds, to the south of the torrent of the cities of Ephraim, which are in the midst of the cities of Manasses: the border of Manasses is on the north side of the torrent, and the outgoings of it are at the sea:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ita ut possessio Ephraim sit ab austro, et ab aquilone Manasse, et utramque claudat mare, et conjungantur sibi in tribu Aser ab aquilone, et in tribu Issachar ab oriente."
      en: "So that the possession of Ephraim is on the south, and on the north that of Manasses, and the sea is the border of both, and they are joined together in the tribe of Aser on the north, and in the tribe of Issachar on the east."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Fuitque haereditas Manasse in Issachar et in Aser, Bethsan et viculi ejus, et Jeblaam cum viculis suis, et habitatores Dor cum oppidis suis, habitatores quoque Endor cum viculis suis: similiterque habitatores Thenac cum viculis suis, et habitatores Mageddo cum viculis suis, et tertia pars urbis Nopheth."
      en: "And the inheritance of Manasses in Issachar and in Aser, was Bethsan and its villages, and Jeblaam with its villages, and the inhabitants of Dor, with the towns thereof: the inhabitants also of Endor with the villages thereof: and in like manner the inhabitants of Thenac with the villages thereof: and the inhabitants of Mageddo with their villages, and the third part of the city of Nopheth."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Nec potuerunt filii Manasse has civitates subvertere, sed coepit Chananaeus habitare in terra sua."
      en: "Neither could the children of Manasses overthrow these cities, but the Chanaanite began to dwell in his land."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Postquam autem convaluerunt filii Israel, subjecerunt Chananaeos, et fecerunt sibi tributarios, nec interfecerunt eos."
      en: "But after that the children of Israel were grown strong, they subdued the Chanaanites, and made them their tributaries, and they did not kill them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Locutique sunt filii Joseph ad Josue, et dixerunt: Quare dedisti mihi possessionem sortis et funiculi unius, cum sim tantae multitudinis, et benedixerit mihi Dominus?"
      en: "And the children of Joseph spoke to Josue, and said: Why hast thou given me but one lot and one portion to possess, whereas I am of so great a multitude, and the Lord hath blessed me?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ad quos Josue ait: Si populus multus es, ascende in silvam, et succide tibi spatia in terra Pherezaei et Raphaim: quia angusta est tibi possessio montis Ephraim."
      en: "And Josue said to them: If thou be a great people, go up into the woodland, and cut down room for thyself in the land of the Pherezite and the Raphaims: because the possession of mount Ephraim is too narrow for thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cui responderunt filii Joseph: Non poterimus ad montana conscendere, cum ferreis curribus utantur Chananaei, qui habitant in terra campestri, in qua sitae sunt Bethsan cum viculis suis, et Jezrael mediam possidens vallem."
      en: "And the children of Joseph answered him: We cannot go up to the mountains, for the Chanaanites that dwell in the low lands, wherein are situate Bethsan with its towns, and Jezrael in the midst of the valley, have chariots of iron."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dixitque Josue ad domum Joseph, Ephraim et Manasse: Populus multus es, et magnae fortitudinis: non habebis sortem unam,"
      en: "And Josue said to the house of Joseph, to Ephraim and Manasses: Thou art a great people, and of great strength, thou shalt not have one lot only:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sed transibis ad montem, et succides tibi, atque purgabis ad habitandum spatia: et poteris ultra procedere cum subverteris Chananaeum, quem dicis ferreos habere currus, et esse fortissimum."
      en: "But thou shalt pass to the mountain, and shalt cut down the wood, and make thyself room to dwell in: and mayst proceed farther, when thou hast destroyed the Chanaanites, who as thou sayest have iron chariots, and are very strong."
    status: { la: verified, en: verified }
