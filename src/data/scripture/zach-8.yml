# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: zach
chapter: 8
verses:
  - n: 1
    text:
      la: "Et factum est verbum Domini exercituum, dicens:"
      en: "And the word of the Lord of hosts came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Haec dicit Dominus exercituum: Zelatus sum Sion zelo magno, et indignatione magna zelatus sum eam."
      en: "Thus saith the Lord of hosts: I have been jealous for Sion with a great jealousy, and with a great indignation have I been jealous for her."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Haec dicit Dominus exercituum: Reversus sum ad Sion, et habitabo in medio Jerusalem: et vocabitur Jerusalem civitas veritatis, et mons Domini exercituum mons sanctificatus."
      en: "Thus saith the Lord of hosts: I am returned to Sion, and I will dwell in the midst of Jerusalem: and Jerusalem shall be called The city of truth, and the mountain of the Lord of hosts, The sanctified mountain."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Haec dicit Dominus exercituum: Adhuc habitabunt senes et anus in plateis Jerusalem, et viri baculus in manu ejus prae multitudine dierum."
      en: "Thus saith the Lord of hosts: There shall yet old men and old women dwell in the streets of Jerusalem: and every man with his staff in his hand through multitude of days."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et plateae civitatis complebuntur infantibus et puellis, ludentibus in plateis ejus."
      en: "And the streets of the city shall be full of boys and girls, playing in the streets thereof."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Haec dicit Dominus exercituum: Si videbitur difficile in oculis reliquiarum populi hujus in diebus illis, numquid in oculis meis difficile erit? dicit Dominus exercituum."
      en: "Thus saith the Lord of hosts: If it seem hard in the eyes of the remnant of this people in those days: shall it be hard in my eyes, saith the Lord of hosts?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Haec dicit Dominus exercituum: Ecce ego salvabo populum meum de terra orientis et de terra occasus solis."
      en: "Thus saith the Lord of hosts: Behold I will save my people from the land of the east, and from the land of the going down of the sun."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et adducam eos, et habitabunt in medio Jerusalem: et erunt mihi in populum, et ego ero eis in Deum, in veritate et in justitia."
      en: "And I will bring them, and they shall dwell in the midst of Jerusalem: and they shall be my people, and I will be their God in truth and in justice."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Haec dicit Dominus exercituum: Confortentur manus vestrae, qui auditis in his diebus sermones istos per os prophetarum, in die qua fundata est domus Domini exercituum, ut templum aedificaretur."
      en: "Thus saith the Lord of hosts: Let your hands be strengthened, you that hear in these days these words by the mouth of the prophets, in the day that the house of the Lord of hosts was founded, that the temple might be built."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Siquidem ante dies illos merces hominum non erat, nec merces jumentorum erat: neque introeunti, neque exeunti erat pax prae tribulatione: et dimisi omnes homines, unumquemque contra proximum suum."
      en: "For before those days there was no hire for men, neither was there hire for beasts, neither was there peace to him that came in, nor to him that went out, because of the tribulation: and I let all men go every one against his neighbour."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Nunc autem non juxta dies priores ego faciam reliquiis populi hujus, dicit Dominus exercituum,"
      en: "But now I will not deal with the remnant of this people according to the former days, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "sed semen pacis erit: vinea dabit fructum suum, et terra dabit germen suum, et caeli dabunt rorem suum: et possidere faciam reliquias populi hujus universa haec."
      en: "But there shall be the seed of peace: the vine shall yield her fruit, and the earth shall give her increase, and the heavens shall give their dew: and I will cause the remnant of this people to possess all these things."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et erit: sicut eratis maledictio in gentibus, domus Juda et domus Israel, sic salvabo vos, et eritis benedictio. Nolite timere; confortentur manus vestrae."
      en: "And it shall come to pass, that as you were a curse among the Gentiles, O house of Juda, and house of Israel: so will I save you, and you shall be a blessing: fear not, let your hands be strengthened."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quia haec dicit Dominus exercituum: Sicut cogitavi ut affligerem vos, cum ad iracundiam provocassent patres vestri me, dicit Dominus,"
      en: "For thus saith the Lord of hosts: As I purposed to afflict you, when your fathers had provoked me to wrath, saith the Lord,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et non sum misertus: sic conversus cogitavi, in diebus istis, ut benefaciam domui Juda et Jerusalem. Nolite timere."
      en: "And I had no mercy: so turning again I have thought in these days to do good to the house of Juda, and Jerusalem: fear not."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Haec sunt ergo verba quae facietis: loquimini veritatem unusquisque cum proximo suo: veritatem et judicium pacis judicate in portis vestris."
      en: "These then are the things, which you shall do: Speak ye truth every one to his neighbour: judge ye truth and judgment of peace in your gates."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et unusquisque malum contra amicum suum ne cogitetis in cordibus vestris, et juramentum mendax ne diligatis: omnia enim haec sunt quae odi, dicit Dominus."
      en: "And let none of you imagine evil in your hearts against his friend: and love not a false oath: for all these are the things that I hate, saith the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et factum est verbum Domini exercituum ad me, dicens:"
      en: "And the word of the Lord of hosts came to me, saying:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Haec dicit Dominus exercituum: Jejunium quarti, et jejunium quinti, et jejunium septimi, et jejunium decimi erit domui Juda in gaudium et laetitiam et in solemnitates praeclaras. Veritatem tantum et pacem diligite."
      en: "Thus saith the Lord of hosts: The fast of the fourth month, and the fast of the fifth, and the fast of the seventh, and the fast of the tenth shall be to the house of Juda, joy, and gladness, and great solemnities: only love ye truth and peace."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Haec dicit Dominus exercituum, usquequo veniant populi et habitent in civitatibus multis:"
      en: "Thus saith the Lord of hosts, until people come, and dwell in many cities,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et vadant habitatores, unus ad alterum, dicentes: Eamus, et deprecemur faciem Domini, et quaeramus Dominum exercituum: vadam etiam ego."
      en: "And the inhabitants go one to another, saying: Let us go, and entreat the face of the Lord, and let us seek the Lord of hosts: I also will go."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et venient populi multi, et gentes robustae, ad quaerendum Dominum exercituum in Jerusalem, et deprecandam faciem Domini."
      en: "And many peoples, and strong nations shall come to seek the Lord of hosts in Jerusalem, and to entreat the face of the Lord."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Haec dicit Dominus exercituum: In diebus illis, in quibus apprehendent decem homines ex omnibus linguis gentium, et apprehendent fimbriam viri Judaei, dicentes: Ibimus vobiscum: audivimus enim quoniam Deus vobiscum est."
      en: "Thus saith the Lord of hosts: In those days, wherein ten men of all languages of the Gentiles shall take hold, and shall hold fast the shirt of one that is a Jew, saying: We will go with you: for we have heard that God is with you."
    status: { la: verified, en: verified }
