# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jdc
chapter: 9
verses:
  - n: 1
    text:
      la: "Abiit autem Abimelech filius Jerobaal in Sichem ad fratres matris suae, et locutus est ad eos, et ad omnem cognationem domus patris matris suae, dicens:"
      en: "And Abimelech the son of Jerobaal went to Sichem to his mother's brethren and spoke to them, and to all the kindred of his mother's father, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Loquimini ad omnes viros Sichem: Quid vobis est melius, ut dominentur vestri septuaginta viri omnes filii Jerobaal, an ut dominetur unus vir? simulque considerate quod os vestrum et caro vestra sum."
      en: "Speak to all the men of Sichem: whether is better for you that seventy men all the sons of Jerobaal should rule over you, or that one man should rule over you? And withal consider that I am your bone, and your flesh."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Locutique sunt fratres matris ejus de eo ad omnes viros Sichem universos sermones istos, et inclinaverunt cor eorum post Abimelech, dicentes: Frater noster est."
      en: "And his mother's brethren spoke of him to all the men of Sichem, all these words, and they inclined their hearts after Abimelech, saying: He is our brother:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dederuntque illi septuaginta pondo argenti de fano Baalberit. Qui conduxit sibi ex eo viros inopes et vagos, secutique sunt eum."
      en: "And they gave him seventy weight of silver out of the temple of Baalberith: wherewith he hired to himself men that were needy, and vagabonds, and they followed him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et venit in domum patris sui in Ephra, et occidit fratres suos filios Jerobaal septuaginta viros, super lapidem unum: remansitque Joatham filius Jerobaal minimus, et absconditus est."
      en: "And he came to his father's house in Ephra, and slew his brethren the sons of Jerobaal, seventy men, upon one stone: and there remained only Joatham the youngest son of Jerobaal, who was hidden."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Congregati sunt autem omnes viri Sichem, et universae familiae urbis Mello: abieruntque et constituerunt regem Abimelech, juxta quercum quae stabat in Sichem."
      en: "And all the men of Sichem were gathered together, and all the families of the city of Mello: and they went and made Abimelech king, by the oak that stood in Sichem."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quod cum nuntiatum esset Joatham, ivit, et stetit in vertice montis Garizim: elevataque voce, clamavit, et dixit: Audite me, viri Sichem; ita audiat vos Deus."
      en: "This being told to Joatham, he went and stood on the top of mount Garizim: and lifting up his voice, he cried, and said: Hear me, ye men of Sichem, so may God hear you."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ierunt ligna, ut ungerent super se regem: dixeruntque olivae: Impera nobis."
      en: "The trees went to anoint a king over them: and they said to the olive tree: Reign thou over us."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quae respondit: Numquid possum deserere pinguedinem meam, qua et dii utuntur et homines, et venire ut inter ligna promovear?"
      en: "And it answered: Can I leave my fatness, which both gods and men make use of, to come to be promoted among the trees?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dixeruntque ligna ad arborem ficum: Veni, et super nos regnum accipe."
      en: "And the trees said to the fig tree: Come thou and reign over us."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quae respondit eis: Numquid possum deserere dulcedinem meam, fructusque suavissimos, et ire ut inter cetera ligna promovear?"
      en: "And it answered them: Can I leave my sweetness, and my delicious fruits, and go to be promoted among the other trees?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Locutaque sunt ligna ad vitem: Veni, et impera nobis."
      en: "And the trees said to the vine: Come thou and reign over us."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quae respondit eis: Numquid possum deserere vinum meum, quod laetificat Deum et homines, et inter ligna cetera promoveri?"
      en: "And it answered them: Can I forsake my wine, that cheereth God and men, and be promoted among the other trees?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dixeruntque omnia ligna ad rhamnum: Veni, et impera super nos."
      en: "And all the trees said to the bramble: Come thou and reign over us."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quae respondit eis: Si vere me regem vobis constituitis, venite, et sub umbra mea requiescite: si autem non vultis, egrediatur ignis de rhamno, et devoret cedros Libani."
      en: "And it answered them: If indeed you mean to make me king, come ye and rest under my shadow: but if you mean it not, let fire come out from the bramble, and devour the cedars of Libanus."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nunc igitur, si recte et absque peccato constituistis super vos regem Abimelech, et bene egistis cum Jerobaal, et cum domo ejus, et reddidistis vicem beneficiis ejus, qui pugnavit pro vobis,"
      en: "Now therefore if you have done well, and without sin in appointing Abimelech king over you, and have dealt well with Jerobaal, and with his house, and have made a suitable return for the benefits of him, who fought for you,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et animam suam dedit periculis, ut erueret vos de manu Madian,"
      en: "And exposed his life to dangers, to deliver you from the hands of Madian,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui nunc surrexistis contra domum patris mei, et interfecistis filios ejus septuaginta viros super unum lapidem, et constituistis regem Abimelech filium ancillae ejus super habitatores Sichem, eo quod frater vester sit:"
      en: "And you are now risen up against my father's house, and have killed his sons seventy men upon one stone, and have made Abimelech the son of his handmaid king over the inhabitants of Sichem, because he is your brother:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "si ergo recte et absque vitio egistis cum Jerobaal, et domo ejus, hodie laetamini in Abimelech, et ille laetetur in vobis."
      en: "If therefore you have dealt well, and without fault with Jerobaal, and his house, rejoice ye this day in Abimelech, and may he rejoice in you."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Sin autem perverse: egrediatur ignis ex eo, et consumat habitatores Sichem, et oppidum Mello: egrediaturque ignis de viris Sichem, et de oppido Mello, et devoret Abimelech."
      en: "But if unjustly: let fire come out from him, and consume the inhabitants of Sichem, and the town of Mello: and let fire come out from the men of Sichem, and from the town of Mello, and devour Abimelech."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quae cum dixisset, fugit, et abiit in Bera: habitavitque ibi ob metum Abimelech fratris sui."
      en: "And when he had said thus he fled, and went into Bera: and dwelt there for fear of Abimelech his brother."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Regnavit itaque Abimelech super Israel tribus annis."
      en: "So Abimelech reigned over Israel for three years."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Misitque Dominus spiritum pessimum inter Abimelech et habitatores Sichem: qui coeperunt eum detestari,"
      en: "And the Lord sent a very evil spirit between Abimelech and the inhabitants of Sichem: who began to detest him,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et scelus interfectionis septuaginta filiorum Jerobaal, et effusionem sanguinis eorum conferre in Abimelech fratrem suum, et in ceteros Sichimorum principes, qui eum adjuverant."
      en: "And to leave the crime of the murder of the seventy sons of Jerobaal, and the shedding of their blood upon Abimelech their brother, and upon the rest of the princes of the Sichemites, who aided him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Posueruntque insidias adversus eum in summitate montium: et dum illius praestolabantur adventum, exercebant latrocinia, agentes praedas de praetereuntibus: nuntiatumque est Abimelech."
      en: "And they set an ambush against him on the top of the mountains: and while they waited for his coming, they committed robberies, taking spoils of all that passed by: and it was told Abimelech."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Venit autem Gaal filius Obed cum fratribus suis, et transivit in Sichimam. Ad cujus adventum erecti habitatores Sichem,"
      en: "And Gaal the son of Obed came with his brethren, and went over to Sichem. And the inhabitants of Sichem taking courage at his coming,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "egressi sunt in agros, vastantes vineas, uvasque calcantes: et factis cantantium choris, ingressi sunt fanum dei sui, et inter epulas et pocula maledicebant Abimelech,"
      en: "Went out into the fields, wasting the vineyards, and treading down the grapes: and singing and dancing they went into the temple of their god, and in their banquets and cups they cursed Abimelech."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "clamante Gaal filio Obed: Quis est Abimelech, et quae est Sichem, ut serviamus ei? numquid non est filius Jerobaal, et constituit principem Zebul servum suum super viros Emor patris Sichem? cur ergo serviemus ei?"
      en: "And Gaal the son of Obed cried: Who is Abimelech, and what is Sichem, that we should serve him? Is he not the son of Jerobaal, and hath made Zebul his servant ruler over the men of Emor the father of Sichem? Why then shall we serve him?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "utinam daret aliquis populum istum sub manu mea, ut auferrem de medio Abimelech. Dictumque est Abimelech: Congrega exercitus multitudinem, et veni."
      en: "Would to God that some man would put this people under my hand, that I might remove Abimelech out of the way. And it was said to Abimelech: Gather together the multitude of an army, and come."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Zebul enim princeps civitatis, auditis sermonibus Gaal filii Obed, iratus est valde,"
      en: "For Zebul the ruler of the city, hearing the words of Gaal, the son of Obed, was very angry,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et misit clam ad Abimelech nuntios, dicens: Ecce Gaal filius Obed venit in Sichimam cum fratribus suis, et oppugnat adversum te civitatem."
      en: "And sent messengers privately to Abimelech, saying: Behold Gaal the son of Obed is come into Sichem with his brethren, and endeavoureth to set the city against thee."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Surge itaque nocte cum populo qui tecum est, et latita in agro:"
      en: "Arise therefore in the night with the people that is with thee and he hid in the field:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et primo mane, oriente sole, irrue super civitatem. Illo autem egrediente adversum te cum populo suo, fac ei quod potueris."
      en: "And betimes in the morning at sun rising set upon the city. And when he shall come out against thee with his people, do to him what thou shalt be able."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Surrexit itaque Abimelech cum omni exercitu suo nocte, et tetendit insidias juxta Sichimam in quatuor locis."
      en: "Abimelech therefore arose with all his army by night, and laid ambushes near Sichem in four places."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Egressusque est Gaal filius Obed, et stetit in introitu portae civitatis. Surrexit autem Abimelech, et omnis exercitus cum eo de insidiarum loco."
      en: "And Gaal the son of Obed went out, and stood in the entrance of the gate of the city. And Abimelech rose up, and all his army with him from the places of the ambushes."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Cumque vidisset populum Gaal, dixit ad Zebul: Ecce de montibus multitudo descendit. Cui ille respondit: Umbras montium vides quasi capita hominum, et hoc errore deciperis."
      en: "And when Gaal saw the people, he said to Zebul: Behold a multitude cometh down from the mountains. And he answered him: Thou seest the shadows of the mountains as if they were the heads of men, and this is thy mistake."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Rursumque Gaal ait: Ecce populus de umbilico terrae descendit, et unus cuneus venit per viam quae respicit quercum."
      en: "Again Gaal said: Behold there cometh people down from the middle of the land, and one troop cometh by the way that looketh towards the oak."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Cui dixit Zebul: Ubi est nunc os tuum, quo loquebaris: Quis est Abimelech ut serviamus ei? nonne hic populus est, quem despiciebas? egredere, et pugna contra eum."
      en: "And Zebul said to him: Where is now thy mouth wherewith thou saidst? Who is Abimelech that we should serve him? Is not this the people which thou didst despise? Go out, and fight against him."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Abiit ergo Gaal, spectante Sichimorum populo, et pugnavit contra Abimelech,"
      en: "So Gaal went out in the sight of the people of Sichem, and fought against Abimelech,"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "qui persecutus est eum fugientem, et in urbem compulit: cecideruntque ex parte ejus plurimi, usque ad portam civitatis."
      en: "Who chased and put him to flight, and drove him to the city: and many were slain of his people, even to the gate of the city:"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et Abimelech sedit in Ruma: Zebul autem, Gaal, et socios ejus expulit de urbe, nec in ea passus est commorari."
      en: "And Abimelech sat down in Ruma: but Zebul drove Gaal, and his companions out of the city, and would not suffer them to abide in it."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Sequenti ergo die, egressus est populus in campum. Quod cum nuntiatum esset Abimelech,"
      en: "So the day following the people went out into the field. And it was told Abimelech."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "tulit exercitum suum, et divisit in tres turmas, tendens insidias in agris. Vidensque quod egrederetur populus de civitate, surrexit, et irruit in eos"
      en: "And he took his army, and divided it into three companies, and laid ambushes in the fields. And seeing that the people came out of the city, he arose and set upon them,"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "cum cuneo suo, oppugnans, et obsidens civitatem: duae autem turmae palantes per campum adversarios persequebantur."
      en: "With his own company, assaulting and besieging the city: whilst the two other companies chased the enemies that were scattered about the field."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Porro Abimelech omni die illo oppugnabat urbem: quam cepit, interfectis habitatoribus ejus, ipsaque destructa, ita ut sal in ea dispergeret."
      en: "And Abimelech assaulted the city all that day: and took it, and killed the inhabitants thereof, and demolished it, so that he sowed salt in it."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Quod cum audissent qui habitabant in turre Sichimorum, ingressi sunt fanum dei sui Berith, ubi foedus cum eo pepigerant, et ex eo locus nomen acceperat, qui erat munitus valde."
      en: "And when they who dwelt in the tower of Sichem had heard this, they went into the temple of their god Berith where they had made a covenant with him, and from thence the place had taken its name, and it was exceeding strong."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Abimelech quoque audiens viros turris Sichimorum pariter conglobatos,"
      en: "Abimelech also hearing that the men of the tower of Sichem were gathered together,"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "ascendit in montem Selmon cum omni populo suo: et arrepta securi, praecidit arboris ramum, impositumque ferens humero, dixit ad socios: Quod me videtis facere, cito facite."
      en: "Went up into mount Selmon he and all his people with him: and taking an axe, he cut down the bough of a tree, and laying it on his shoulder and carrying it, he said to his companions: What you see me do, do you out of hand."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Igitur certatim ramos de arboribus praecidentes, sequebantur ducem. Qui circumdantes praesidium, succenderunt: atque ita factum est ut fumo et igne mille homines necarentur, viri pariter et mulieres, habitatorum turris Sichem."
      en: "So they cut down boughs from the trees, every man as fast as he could, and followed their leader. And surrounding the fort they set it on fire: and so it came to pass that with the smoke and with the fire a thousand persons were killed, men and women together, of the inhabitants of the tower of Sichem."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Abimelech autem inde proficiscens venit ad oppidum Thebes, quod circumdans obsidebat exercitu."
      en: "Then Abimelech departing from thence came to the town of Thebes, which he surrounded and besieged with his army."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Erat autem turris excelsa in media civitate, ad quam confugerant simul viri ac mulieres, et omnes principes civitatis, clausa firmissime janua, et super turris tectum stantes per propugnacula."
      en: "And there was in the midst of the city a high tower, to which both the men and the women were fled together, and all the princes of the city, and having shut and strongly barred the gate, they stood upon the battlements of the tower to defend themselves."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Accedensque Abimelech juxta turrim, pugnabat fortiter: et appropinquans ostio, ignem supponere nitebatur:"
      en: "And Abimelech coming near the tower, fought stoutly: and approaching to the gate, endeavoured to set fire to it:"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "et ecce una mulier fragmen molae desuper jaciens, illisit capiti Abimelech, et confregit cerebrum ejus."
      en: "And behold a certain woman casting a piece of a millstone from above, dashed it against the head of Abimelech, and broke his skull."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Qui vocavit cito armigerum suum, et ait ad eum: Evagina gladium tuum, et percute me, ne forte dicatur quod a femina interfectus sim. Qui jussa perficiens, interfecit eum."
      en: "And he called hastily to his armourbearer, and said to him: Draw thy sword, and kill me: lest it should be said that I was slain by a woman. He did as he was commanded, and slew him."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Illoque mortuo, omnes qui cum eo erant de Israel, reversi sunt in sedes suas:"
      en: "And when he was dead, all the men of Israel that were with him, returned to their homes."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "et reddidit Deus malum, quod fecerat Abimelech contra patrem suum, interfectis septuaginta fratribus suis."
      en: "And God repaid the evil, that Abimelech had done against his father, killing his seventy brethren."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Sichimitis quoque quod operati erant, retributum est, et venit super eos maledictio Joatham filii Jerobaal."
      en: "The Sichemites also were rewarded for what they had done, and the curse of Joatham the son of Jerobaal came upon them."
    status: { la: verified, en: verified }
