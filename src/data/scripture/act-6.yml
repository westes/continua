# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: act
chapter: 6
verses:
  - n: 1
    text:
      la: "In diebus illis, crescente numero discipulorum, factum est murmur Graecorum adversus Hebraeos, eo quod despicerentur in ministerio quotidiano viduae eorum."
      en: "And in those days, the number of the disciples increasing, there arose a murmuring of the Greeks against the Hebrews, for that their widows were neglected in the daily ministration."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Convocantes autem duodecim multitudinem discipulorum, dixerunt: Non est aequum nos derelinquere verbum Dei, et ministrare mensis."
      en: "Then the twelve calling together the multitude of the disciples, said: It is not reason that we should leave the word of God, and serve tables."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Considerate ergo fratres, viros ex vobis boni testimonii septem, plenos Spiritu Sancto, et sapientia, quos constituamus super hoc opus."
      en: "Wherefore, brethren, look ye out among you seven men of good reputation, full of the Holy Ghost and wisdom, whom we may appoint over this business."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nos vero orationi, et ministerio verbi instantes erimus."
      en: "But we will give ourselves continually to prayer, and to the ministry of the word."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et placuit sermo coram omni multitudine. Et elegerunt Stephanum, virum plenum fide, et Spiritu Sancto, et Philippum, et Prochorum, et Nicanorem, et Timonem, et Parmenam, et Nicolaum advenam Antiochenum."
      en: "And the saying was liked by all the multitude. And they chose Stephen, a man full of faith, and of the Holy Ghost, and Philip, and Prochorus, and Nicanor, and Timon, and Parmenas, and Nicolas, a proselyte of Antioch."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Hos statuerunt ante conspectum Apostolorum: et orantes imposuerunt eis manus."
      en: "These they set before the apostles; and they praying, imposed hands upon them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et verbum Domini crescebat, et multiplicabatur numerus discipulorum in Jerusalem valde: multa etiam turba sacerdotum obediebat fidei."
      en: "And the word of the Lord increased; and the number of the disciples was multiplied in Jerusalem exceedingly: a great multitude also of the priests obeyed the faith."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Stephanus autem plenus gratia et fortitudine, faciebat prodigia et signa magna in populo."
      en: "And Stephen, full of grace and fortitude, did great wonders and signs among the people."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Surrexerunt autem quidam de synagoga, quae appellatur Libertinorum, et Cyrenensium, et Alexandrinorum, et eorum qui erant a Cilicia, et Asia, disputantes cum Stephano:"
      en: "Now there arose some of that which is called the synagogue of the Libertines, and of the Cyrenians, and of the Alexandrians, and of them that were of Cilicia and Asia, disputing with Stephen."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et non poterant resistere sapientiae, et Spiritui, qui loquebatur."
      en: "And they were not able to resist the wisdom and the spirit that spoke."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Tunc summiserunt viros, qui dicerent se audivisse eum dicentem verba blasphemiae in Moysen et in Deum."
      en: "Then they suborned men to say, they had heard him speak words of blasphemy against Moses and against God."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Commoverunt itaque plebem, et seniores, et scribas: et concurrentes rapuerunt eum, et adduxerunt in concilium,"
      en: "And they stirred up the people, and the ancients, and the scribes; and running together, they took him, and brought him to the council."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et statuerunt falsos testes, qui dicerent: Homo iste non cessat loqui verba adversus locum sanctum, et legem:"
      en: "And they set up false witnesses, who said: This man ceaseth not to speak words against the holy place and the law."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "audivimus enim eum dicentem: quoniam Jesus Nazarenus hic destruet locum istum, et mutabit traditiones, quas tradidit nobis Moyses."
      en: "For we have heard him say, that this Jesus of Nazareth shall destroy this place, and shall change the traditions which Moses delivered unto us."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et intuentes eum omnes qui sedebant in concilio, viderunt faciem ejus tamquam faciem angeli."
      en: "And all that sat in the council, looking on him, saw his face as if it had been the face of an angel."
    status: { la: verified, en: verified }
