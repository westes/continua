# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: matt
chapter: 17
verses:
  - n: 1
    text:
      la: "et post dies sex adsumpsit Iesus Petrum et Iacobum et Iohannem fratrem eius et ducit illos in montem excelsum seorsum"
      en: "And after six days Jesus taketh unto him Peter and James, and John his brother, and bringeth them up into a high mountain apart:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et transfiguratus est ante eos et resplenduit facies eius sicut sol vestimenta autem eius facta sunt alba sicut nix"
      en: "And he was transfigured before them. And his face did shine as the sun: and his garments became white as snow."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ecce apparuit illis Moses et Helias cum eo loquentes"
      en: "And behold there appeared to them Moses and Elias talking with him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "respondens autem Petrus dixit ad Iesum Domine bonum est nos hic esse si vis faciamus hic tria tabernacula tibi unum et Mosi unum et Heliae unum"
      en: "And Peter answering, said to Jesus: Lord, it is good for us to be here: if thou wilt, let us make here three tabernacles, one for thee, and one for Moses, and one for Elias."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "adhuc eo loquente ecce nubes lucida obumbravit eos et ecce vox de nube dicens hic est Filius meus dilectus in quo mihi bene conplacuit ipsum audite"
      en: "And as he was yet speaking, behold a bright cloud overshadowed them. And lo, a voice out of the cloud, saying: This is my beloved Son, in whom I am well pleased: hear ye him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et audientes discipuli ceciderunt in faciem suam et timuerunt valde"
      en: "And the disciples hearing, fell upon their face, and were very much afraid."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et accessit Iesus et tetigit eos dixitque eis surgite et nolite timere"
      en: "And Jesus came and touched them: and said to them, Arise, and fear not."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "levantes autem oculos suos neminem viderunt nisi solum Iesum"
      en: "And they lifting up their eyes saw no one but only Jesus."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et descendentibus illis de monte praecepit Iesus dicens nemini dixeritis visionem donec Filius hominis a mortuis resurgat"
      en: "And as they came down from the mountain, Jesus charged them, saying: Tell the vision to no man, till the Son of man be risen from the dead."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et interrogaverunt eum discipuli dicentes quid ergo scribae dicunt quod Heliam oporteat primum venire"
      en: "And his disciples asked him, saying: Why then do the scribes say that Elias must come first?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "at ille respondens ait eis Helias quidem venturus est et restituet omnia"
      en: "But he answering, said to them: Elias indeed shall come, and restore all things."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dico autem vobis quia Helias iam venit et non cognoverunt eum sed fecerunt in eo quaecumque voluerunt sic et Filius hominis passurus est ab eis"
      en: "But I say to you, that Elias is already come, and they knew him not, but have done unto him whatsoever they had a mind. So also the Son of man shall suffer from them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "tunc intellexerunt discipuli quia de Iohanne Baptista dixisset eis"
      en: "Then the disciples understood, that he had spoken to them of John the Baptist."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et cum venisset ad turbam accessit ad eum homo genibus provolutus ante eum dicens Domine miserere filii mei quia lunaticus est et male patitur nam saepe cadit in ignem et crebro in aquam"
      en: "And when he was come to the multitude, there came to him a man falling down on his knees before him, saying: Lord, have pity on my son, for he is a lunatic, and suffereth much: for he falleth often into the fire, and often into the water."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et obtuli eum discipulis tuis et non potuerunt curare eum"
      en: "And I brought him to thy disciples, and they could not cure him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "respondens Iesus ait o generatio incredula et perversa quousque ero vobiscum usquequo patiar vos adferte huc illum ad me"
      en: "Then Jesus answered and said: O unbelieving and perverse generation, how long shall I be with you? How long shall I suffer you? bring him hither to me."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et increpavit ei Iesus et exiit ab eo daemonium et curatus est puer ex illa hora"
      en: "And Jesus rebuked him, and the devil went out of him, and the child was cured from that hour."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "tunc accesserunt discipuli ad Iesum secreto et dixerunt quare nos non potuimus eicere illum"
      en: "Then came the disciples to Jesus secretly, and said: Why could not we cast him out?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "dicit illis propter incredulitatem vestram amen quippe dico vobis si habueritis fidem sicut granum sinapis dicetis monti huic transi hinc et transibit et nihil inpossibile erit vobis"
      en: "Jesus said to them: Because of your unbelief. For, amen I say to you, if you have faith as a grain of mustard seed, you shall say to this mountain, Remove from hence hither, and it shall remove; and nothing shall be impossible to you."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "hoc autem genus non eicitur nisi per orationem et ieiunium"
      en: "But this kind is not cast out but by prayer and fasting."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "conversantibus autem eis in Galilaea dixit illis Iesus Filius hominis tradendus est in manus hominum"
      en: "And when they abode together in Galilee, Jesus said to them: The Son of man shall be betrayed into the hands of men:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et occident eum et tertio die resurget et contristati sunt vehementer"
      en: "And they shall kill him, and the third day he shall rise again. And they were troubled exceedingly."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et cum venissent Capharnaum accesserunt qui didragma accipiebant ad Petrum et dixerunt magister vester non solvit didragma"
      en: "And when they were come to Capharnaum, they that recieved the didrachmas, came to Peter and said to him: Doth not your master pay the didrachmas?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ait etiam et cum intrasset domum praevenit eum Iesus dicens quid tibi videtur Simon reges terrae a quibus accipiunt tributum vel censum a filiis suis an ab alienis"
      en: "He said: Yes. And when he was come into the house, Jesus prevented him, saying: What is thy opinion, Simon? The kings of the earth, of whom do they receive tribute or custom? of their own children, or of strangers?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et ille dixit ab alienis dixit illi Iesus ergo liberi sunt filii"
      en: "And he said: Of strangers. Jesus said to him: Then the children are free."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ut autem non scandalizemus eos vade ad mare et mitte hamum et eum piscem qui primus ascenderit tolle et aperto ore eius invenies staterem illum sumens da eis pro me et te"
      en: "But that we may not scandalize them, go to the sea, and cast in a hook: and that fish which shall first come up, take: and when thou hast opened its mouth, thou shalt find a stater: take that, and give it to them for me and thee."
    status: { la: verified, en: verified }
