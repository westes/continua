# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: joan
chapter: 12
verses:
  - n: 1
    text:
      la: "Iesus ergo ante sex dies paschae venit Bethaniam ubi fuerat Lazarus mortuus quem suscitavit Iesus"
      en: "Jesus therefore, six days before the pasch, came to Bethania, where Lazarus had been dead, whom Jesus raised to life."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fecerunt autem ei cenam ibi et Martha ministrabat Lazarus vero unus erat ex discumbentibus cum eo"
      en: "And they made him a supper there: and Martha served: but Lazarus was one of them that were at table with him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Maria ergo accepit libram unguenti nardi pistici pretiosi unxit pedes Iesu et extersit capillis suis pedes eius et domus impleta est ex odore unguenti"
      en: "Mary therefore took a pound of ointment of right spikenard, of great price, and anointed the feet of Jesus, and wiped his feet with her hair; and the house was filled with the odour of the ointment."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dicit ergo unus ex discipulis eius Iudas Scariotis qui erat eum traditurus"
      en: "Then one of his disciples, Judas Iscariot, he that was about to betray him, said:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quare hoc unguentum non veniit trecentis denariis et datum est egenis"
      en: "Why was not this ointment sold for three hundred pence, and given to the poor?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixit autem hoc non quia de egenis pertinebat ad eum sed quia fur erat et loculos habens ea quae mittebantur portabat"
      en: "Now he said this, not because he cared for the poor; but because he was a thief, and having the purse, carried the things that were put therein."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixit ergo Iesus sine illam ut in die sepulturae meae servet illud"
      en: "Jesus therefore said: Let her alone, that she may keep it against the day of my burial."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "pauperes enim semper habetis vobiscum me autem non semper habetis"
      en: "For the poor you have always with you; but me you have not always."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cognovit ergo turba multa ex Iudaeis quia illic est et venerunt non propter Iesum tantum sed ut Lazarum viderent quem suscitavit a mortuis"
      en: "A great multitude therefore of the Jews knew that he was there; and they came, not for Jesus' sake only, but that they might see Lazarus, whom he had raised from the dead."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cogitaverunt autem principes sacerdotum ut et Lazarum interficerent"
      en: "But the chief priests thought to kill Lazarus also:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quia multi propter illum abibant ex Iudaeis et credebant in Iesum"
      en: "Because many of the Jews, by reason of him, went away, and believed in Jesus."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "in crastinum autem turba multa quae venerat ad diem festum cum audissent quia venit Iesus Hierosolyma"
      en: "And on the next day, a great multitude that was to come to the festival day, when they had heard that Jesus was coming to Jerusalem,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "acceperunt ramos palmarum et processerunt obviam ei et clamabant osanna benedictus qui venit in nomine Domini rex Israhel"
      en: "Took branches of palm trees, and went forth to meet him, and cried: Hosanna, blessed is he that cometh in the name of the Lord, the king of Israel."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et invenit Iesus asellum et sedit super eum sicut scriptum est"
      en: "And Jesus found a young ass, and sat upon it, as it is written:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "noli timere filia Sion ecce rex tuus venit sedens super pullum asinae"
      en: "Fear not, daughter of Sion: behold, thy king cometh, sitting on an ass's colt."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "haec non cognoverunt discipuli eius primum sed quando glorificatus est Iesus tunc recordati sunt quia haec erant scripta de eo et haec fecerunt ei"
      en: "These things his disciples did not know at the first; but when Jesus was glorified, then they remembered that these things were written of him, and that they had done these things to him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "testimonium ergo perhibebat turba quae erat cum eo quando Lazarum vocavit de monumento et suscitavit eum a mortuis"
      en: "The multitude therefore gave testimony, which was with him, when he called Lazarus out of the grave, and raised him from the dead."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "propterea et obviam venit ei turba quia audierunt eum fecisse hoc signum"
      en: "For which reason also the people came to meet him, because they heard that he had done this miracle."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Pharisaei ergo dixerunt ad semet ipsos videtis quia nihil proficimus ecce mundus totus post eum abiit"
      en: "The Pharisees therefore said among themselves: Do you see that we prevail nothing? behold, the whole world is gone after him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "erant autem gentiles quidam ex his qui ascenderant ut adorarent in die festo"
      en: "Now there were certain Gentiles among them, who came up to adore on the festival day."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "hii ergo accesserunt ad Philippum qui erat a Bethsaida Galilaeae et rogabant eum dicentes domine volumus Iesum videre"
      en: "These therefore came to Philip, who was of Bethsaida of Galilee, and desired him, saying: Sir, we would see Jesus."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "venit Philippus et dicit Andreae Andreas rursum et Philippus dixerunt Iesu"
      en: "Philip cometh, and telleth Andrew. Again Andrew and Philip told Jesus."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Iesus autem respondit eis dicens venit hora ut clarificetur Filius hominis"
      en: "But Jesus answered them, saying: The hour is come, that the Son of man should be glorified."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "amen amen dico vobis nisi granum frumenti cadens in terram mortuum fuerit"
      en: "Amen, amen I say to you, unless the grain of wheat falling into the ground die,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ipsum solum manet si autem mortuum fuerit multum fructum adfert qui amat animam suam perdet eam et qui odit animam suam in hoc mundo in vitam aeternam custodit eam"
      en: "Itself remaineth alone. But if it die, it bringeth forth much fruit. He that loveth his life shall lose it; and he that hateth his life in this world, keepeth it unto life eternal."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "si quis mihi ministrat me sequatur et ubi sum ego illic et minister meus erit si quis mihi ministraverit honorificabit eum Pater meus"
      en: "If any man minister to me, let him follow me; and where I am, there also shall my minister be. If any man minister to me, him will my Father honour."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "nunc anima mea turbata est et quid dicam Pater salvifica me ex hora hac sed propterea veni in horam hanc"
      en: "Now is my soul troubled. And what shall I say? Father, save me from this hour. But for this cause I came unto this hour."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Pater clarifica tuum nomen venit ergo vox de caelo et clarificavi et iterum clarificabo"
      en: "Father, glorify thy name. A voice therefore came from heaven: I have both glorified it, and will glorify it again."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "turba ergo quae stabat et audierat dicebant tonitruum factum esse alii dicebant angelus ei locutus est"
      en: "The multitude therefore that stood and heard, said that it thundered. Others said: An angel spoke to him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "respondit Iesus et dixit non propter me vox haec venit sed propter vos"
      en: "Jesus answered, and said: This voice came not because of me, but for your sakes."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "nunc iudicium est mundi nunc princeps huius mundi eicietur foras"
      en: "Now is the judgment of the world: now shall the prince of this world be cast out."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et ego si exaltatus fuero a terra omnia traham ad me ipsum"
      en: "And I, if I be lifted up from the earth, will draw all things to myself."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "hoc autem dicebat significans qua morte esset moriturus"
      en: "(Now this he said, signifying what death he should die.)"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "respondit ei turba nos audivimus ex lege quia Christus manet in aeternum et quomodo tu dicis oportet exaltari Filium hominis quis est iste Filius hominis"
      en: "The multitude answered him: We have heard out of the law, that Christ abideth for ever; and how sayest thou: The Son of man must be lifted up? Who is this Son of man?"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "dixit ergo eis Iesus adhuc modicum lumen in vobis est ambulate dum lucem habetis ut non tenebrae vos conprehendant et qui ambulat in tenebris nescit quo vadat"
      en: "Jesus therefore said to them: Yet a little while, the light is among you. Walk whilst you have the light, that the darkness overtake you not. And he that walketh in darkness, knoweth not whither he goeth."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "dum lucem habetis credite in lucem ut filii lucis sitis haec locutus est Iesus et abiit et abscondit se ab eis"
      en: "Whilst you have the light, believe in the light, that you may be the children of light. These things Jesus spoke; and he went away, and hid himself from them."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "cum autem tanta signa fecisset coram eis non credebant in eum"
      en: "And whereas he had done so many miracles before them, they believed not in him:"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "ut sermo Esaiae prophetae impleretur quem dixit Domine quis credidit auditui nostro et brachium Domini cui revelatum est"
      en: "That the saying of Isaias the prophet might be fulfilled, which he said: Lord, who hath believed our hearing? and to whom hath the arm of the Lord been revealed?"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "propterea non poterant credere quia iterum dixit Esaias"
      en: "Therefore they could not believe, because Isaias said again:"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "excaecavit oculos eorum et induravit eorum cor ut non videant oculis et intellegant corde et convertantur et sanem eos"
      en: "He hath blinded their eyes, and hardened their heart, that they should not see with their eyes, nor understand with their heart, and be converted, and I should heal them."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "haec dixit Esaias quando vidit gloriam eius et locutus est de eo"
      en: "These things said Isaias, when he saw his glory, and spoke of him."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "verumtamen et ex principibus multi crediderunt in eum sed propter Pharisaeos non confitebantur ut de synagoga non eicerentur"
      en: "However, many of the chief men also believed in him; but because of the Pharisees they did not confess him, that they might not be cast out of the synagogue."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "dilexerunt enim gloriam hominum magis quam gloriam Dei"
      en: "For they loved the glory of men more than the glory of God."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Iesus autem clamavit et dixit qui credit in me non credit in me sed in eum qui misit me"
      en: "But Jesus cried, and said: He that believeth in me, doth not believe in me, but in him that sent me."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et qui videt me videt eum qui misit me"
      en: "And he that seeth me, seeth him that sent me."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "ego lux in mundum veni ut omnis qui credit in me in tenebris non maneat"
      en: "I am come a light into the world; that whosoever believeth in me, may not remain in darkness."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et si quis audierit verba mea et non custodierit ego non iudico eum non enim veni ut iudicem mundum sed ut salvificem mundum"
      en: "And if any man hear my words, and keep them not, I do not judge him: for I came not to judge the world, but to save the world."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "qui spernit me et non accipit verba mea habet qui iudicet eum sermo quem locutus sum ille iudicabit eum in novissimo die"
      en: "He that despiseth me, and receiveth not my words, hath one that judgeth him; the word that I have spoken, the same shall judge him in the last day."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "quia ego ex me ipso non sum locutus sed qui misit me Pater ipse mihi mandatum dedit quid dicam et quid loquar"
      en: "For I have not spoken of myself; but the Father who sent me, he gave me commandment what I should say, and what I should speak."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "et scio quia mandatum eius vita aeterna est quae ergo ego loquor sicut dixit mihi Pater sic loquor"
      en: "And I know that his commandment is life everlasting. The things therefore that I speak, even as the Father said unto me, so do I speak."
    status: { la: verified, en: verified }
