# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jdc
chapter: 3
verses:
  - n: 1
    text:
      la: "Hae sunt gentes quas Dominus dereliquit, ut erudiret in eis Israelem, et omnes qui non noverant bella Chananaeorum:"
      en: "These are the nations which the Lord left, that by them he might instruct Israel, and all that had not known the wars of the Chanaanites:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ut postea discerent filii eorum certare cum hostibus, et habere consuetudinem praeliandi:"
      en: "That afterwards their children might learn to fight with their enemies, and to be trained up to war:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quinque satrapas Philisthinorum, omnemque Chananaeum, et Sidonium, atque Hevaeum, qui habitabat in monte Libano, de monte Baal Hermon usque ad introitum Emath."
      en: "The five princes of the Philistines, and all the Chanaanites, and the Sidonians, and the Hevites that dwelt in mount Libanus, from mount Baal Hermon to the entering into Emath."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dimisitque eos, ut in ipsis experiretur Israelem, utrum audiret mandata Domini quae praeceperat patribus eorum per manum Moysi, an non."
      en: "And he left them, that he might try Israel by them, whether they would hear the commandments of the Lord, which he had commanded their fathers by the hand of Moses, or not."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Itaque filii Israel habitaverunt in medio Chananaei, et Hethaei, et Amorrhaei, et Pherezaei, et Hevaei, et Jebusaei:"
      en: "So the children of Israel dwelt in the midst of the Chanaanite, and the Hethite, and the Amorrhite, and the Pherezite, and the Hevite, and the Jebusite:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et duxerunt uxores filias eorum, ipsique filias suas filiis eorum tradiderunt, et servierunt diis eorum."
      en: "And they took their daughters to wives, and they gave their own daughters to their sons, and they served their gods."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Feceruntque malum in conspectu Domini, et obliti sunt Dei sui, servientes Baalim et Astaroth."
      en: "And they did evil in the sight of the Lord, and they forgot their God, and served Baalim and Astaroth."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Iratusque contra Israel Dominus, tradidit eos in manus Chusan Rasathaim regis Mesopotamiae, servieruntque ei octo annis."
      en: "And the Lord being angry with Israel, delivered them into the hands of Chusan Rasathaim king of Mesopotamia, and they served him eight years."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et clamaverunt ad Dominum, qui suscitavit eis salvatorem, et liberavit eos, Othoniel videlicet filium Cenez, fratrem Caleb minorem:"
      en: "And they cried to the Lord, who raised them up a saviour, and delivered them, to wit, Othoniel the son of Cenez, the younger brother of Caleb:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "fuitque in eo spiritus Domini, et judicavit Israel. Egressusque est ad pugnam, et tradidit Dominus in manus ejus Chusan Rasathaim regem Syriae, et oppressit eum."
      en: "And the spirit of the Lord was in him, and he judged Israel. And he went out to fight, and the Lord delivered into his hands Chusan Rasathaim king of Syria, and he overthrew him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quievitque terra quadraginta annis, et mortuus est Othoniel filius Cenez."
      en: "And the land rested forty years, and Othoniel the son of Cenez died."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Addiderunt autem filii Israel facere malum in conspectu Domini: qui confortavit adversum eos Eglon regem Moab, quia fecerunt malum in conspectu ejus."
      en: "And the children of Israel did evil again in the sight of the Lord: who strengthened against them Eglon king of Moab: because they did evil in his sight."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et copulavit ei filios Ammon, et Amalec: abiitque et percussit Israel, atque possedit urbem palmarum."
      en: "And he joined to him the children of Ammon, and Amalec: and he went and overthrew Israel, and possessed the city of palm trees."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Servieruntque filii Israel Eglon regi Moab decem et octo annis."
      en: "And the children of Israel served Eglon king of Moab eighteen years:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et postea clamaverunt ad Dominum, qui suscitavit eis salvatorem vocabulo Aod, filium Gera, filii Jemini, qui utraque manu pro dextera utebatur. Miseruntque filii Israel per illum munera Eglon regi Moab."
      en: "And afterwards they cried to the Lord, who raised them up a saviour called Aod, the son of Gera, the son of Jemini, who used the left hand as well as the right. And the children of Israel sent presents to Eglon king of Moab by him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Qui fecit sibi gladium ancipitem, habentem in medio capulum longitudinis palmae manus, et accinctus est eo subter sagum in dextro femore."
      en: "And he made himself a two-edged sword, with a haft in the midst of the length of the palm of the hand, and was girded therewith under his garment on the right thigh."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Obtulitque munera Eglon regi Moab. Erat autem Eglon crassus nimis."
      en: "And he presented the gifts to Eglon king of Moab. Now Eglon was exceeding fat."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Cumque obtulisset ei munera, prosecutus est socios, qui cum eo venerant."
      en: "And when he had presented the gifts unto him, he followed his companions that came along with him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et reversus de Galgalis, ubi erant idola, dixit ad regem: Verbum secretum habeo ad te, o rex. Et ille imperavit silentium: egressisque omnibus qui circa eum erant,"
      en: "Then returning from Galgal, where the idols were, he said to the king: I have a secret message to thee, O king. And he commanded silence: and all being gone out that were about him,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ingressus est Aod ad eum: sedebat autem in aestivo coenaculo solus, dixitque: Verbum Dei habeo ad te. Qui statim surrexit de throno."
      en: "Aod went in to him: now he was sitting in a summer parlour alone, and he said: I have a word from God to thee. And he forthwith rose up from his throne,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Extenditque Aod sinistram manum, et tulit sicam de dextro femore suo, infixitque eam in ventre ejus"
      en: "And Aod put forth his left hand, and took the dagger from his right thigh, and thrust it into his belly,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "tam valide, ut capulus sequeretur ferrum in vulnere, ac pinguissimo adipe stringeretur. Nec eduxit gladium, sed ita ut percusserat, reliquit in corpore: statimque per secreta naturae alvi stercora proruperunt."
      en: "With such force that the haft went in after the blade into the wound, and was closed up with the abundance of fat. So that he did not draw out the dagger, but left it in his body as he had struck it in. And forthwith by the secret parts of nature the excrements of the belly came out."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Aod autem clausis diligentissime ostiis coenaculi, et obfirmatis sera,"
      en: "But Aod carefully shutting the doors of the parlour and locking them,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "per posticum egressus est. Servique regis ingressi viderunt clausas fores coenaculi, atque dixerunt: Forsitan purgat alvum in aestivo cubiculo."
      en: "Went out by a postern door. And the king's servants going in, saw the doors of the parlour shut, and they said: Perhaps he is easing nature in his summer parlour."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Expectantesque diu donec erubescerent, et videntes quod nullus aperiret, tulerunt clavem: et aperientes invenerunt dominum suum in terra jacentem mortuum."
      en: "And waiting a long time till they were ashamed, and seeing that no man opened the door, they took a key: and opening, they found their lord lying dead on the ground."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Aod autem, dum illi turbarentur, effugit, et pertransiit locum idolorum, unde reversus fuerat. Venitque in Seirath:"
      en: "But Aod, while they were in confusion, escaped, and passed by the place of the idols, from whence he had returned. And he came to Seirath:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et statim insonuit buccina in monte Ephraim: descenderuntque cum eo filii Israel, ipso in fronte gradiente."
      en: "And forthwith he sounded the trumpet in mount Ephraim: and the children of Israel went down with him, he himself going in the front."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Qui dixit ad eos: Sequimini me: tradidit enim Dominus inimicos nostros Moabitas in manus nostras. Descenderuntque post eum, et occupaverunt vada Jordanis quae transmittunt in Moab: et non dimiserunt transire quemquam:"
      en: "And he said to them: Follow me: for the Lord hath delivered our enemies the Moabites into our hands. And they went down after him, and seized upon the fords of the Jordan, which are in the way to Moab: and they suffered no man to pass over."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "sed percusserunt Moabitas in tempore illo, circiter decem millia, omnes robustos et fortes viros. Nullus eorum evadere potuit."
      en: "But they slew of the Moabites at that time, about ten thousand, all strong and Valiant men: none of them could escape."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Humiliatusque est Moab in die illo sub manu Israel: et quievit terra octoginta annis."
      en: "And Moab was humbled that day under the hand of Israel: and the land rested eighty years."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Post hunc fuit Samgar filius Anath, qui percussit de Philisthiim sexcentos viros vomere: et ipse quoque defendit Israel."
      en: "After him was Samgar the son of Anath, who slew of the Philistines six hundred men with a ploughshare: and he also defended Israel."
    status: { la: verified, en: verified }
