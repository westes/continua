# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sap
chapter: 5
verses:
  - n: 1
    text:
      la: "Tunc stabunt justi in magna constantia adversus eos qui se angustiaverunt, et qui abstulerunt labores eorum."
      en: "Then shall the just stand with great constancy against those that have afflicted them, and taken away their labours."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Videntes turbabuntur timore horribili, et mirabuntur in subitatione insperatae salutis;"
      en: "These seeing it, shall be troubled with terrible fear, and shall be amazed at the suddenness of their unexpected salvation."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dicentes intra se, poenitentiam agentes, et prae angustia spiritus gementes: Hi sunt quos habuimus aliquando in derisum, et in similitudinem improperii."
      en: "Saying within themselves, repenting, and groaning for anguish of spirit: These are they, whom we had some time in derision, and for a parable of reproach."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nos insensati, vitam illorum aestimabamus insaniam, et finem illorum sine honore;"
      en: "We fools esteemed their life madness, and their end without honour."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ecce quomodo computati sunt inter filios Dei, et inter sanctos sors illorum est."
      en: "Behold how they are numbered among the children of God, and their lot is among the saints."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ergo erravimus a via veritatis, et justitiae lumen non luxit nobis, et sol intelligentiae non est ortus nobis."
      en: "Therefore we have erred from the way of truth, and the light of justice hath not shined unto us, and the sun of understanding hath not risen upon us."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Lassati sumus in via iniquitatis et perditionis; et ambulavimus vias difficiles, viam autem Domini ignoravimus."
      en: "We wearied ourselves in the way of iniquity and destruction, and have walked through hard ways, but the way of the Lord we have not known."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quid nobis profuit superbia? aut divitiarum jactantia quid contulit nobis?"
      en: "What hath pride profited us? or what advantage hath the boasting of riches brought us?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Transierunt omnia illa tamquam umbra, et tamquam nuntius percurrens,"
      en: "All those things are passed away like a shadow, and like a post that runneth on,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et tamquam navis quae pertransit fluctuantem aquam, cujus cum praeterierit non est vestigium invenire, neque semitam carinae illius in fluctibus;"
      en: "And as a ship that passeth through the waves: whereof when it is gone by, the trace cannot be found, nor the path of its keel in the waters:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "aut tamquam avis quae transvolat in aere, cujus nullum invenitur argumentum itineris, sed tantum sonitus alarum verberans levem ventum, et scindens per vim itineris aerem; commotis alis transvolavit, et post hoc nullum signum invenitur itineris illius;"
      en: "Or as when a bird flieth through the air, of the passage of which no mark can be found, but only the sound of the wings beating the light air, and parting it by the force of her flight; she moved her wings, and hath flown through, and there is no mark found afterwards of her way:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "aut tamquam sagitta emissa in locum destinatum, divisus aer continuo in se reclusus est, ut ignoretur transitus illius:"
      en: "Or as when an arrow is shot at a mark, the divided air presently cometh together again, so that the passage thereof is not known:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sic et nos nati continuo desivimus esse; et virtutis quidem nullum signum valuimus ostendere, in malignitate autem nostra consumpti sumus."
      en: "So we also being born, forthwith ceased to be: and have been able to shew no mark of virtue: but are consumed in our wickedness."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Talia dixerunt in inferno hi qui peccaverunt;"
      en: "Such things as these the sinners said in hell:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quoniam spes impii tamquam lanugo est quae a vento tollitur; et tamquam spuma gracilis quae a procella dispergitur, et tamquam fumus qui a vento diffusus est, et tamquam memoria hospitis unius diei praetereuntis."
      en: "For the hope of the wicked is as dust, which is blown away with the wind, and as a thin froth which is dispersed by the storm: and a smoke that is scattered abroad by the wind: and as the remembrance of a guest of one day that passeth by."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Justi autem in perpetuum vivent, et apud Dominum est merces eorum, et cogitatio illorum apud Altissimum."
      en: "But the just shall live for evermore: and their reward is with the Lord, and the care of them with the most High."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ideo accipient regnum decoris, et diadema speciei de manu Domini; quoniam dextera sua teget eos, et brachio sancto suo defendet illos."
      en: "Therefore shall they receive a kingdom of glory, and a crown of beauty at the hand of the Lord: for with his right hand he will cover them, and with his holy arm he will defend them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Accipiet armaturam zelus illius, et armabit creaturam ad ultionem inimicorum."
      en: "And his zeal will take armour, and he will arm the creature for the revenge of his enemies."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Induet pro thorace justitiam, et accipiet pro galea judicium certum;"
      en: "He will put on justice as a breastplate, and will take true judgment instead of a helmet."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sumet scutum inexpugnabile aequitatem."
      en: "He will take equity for an invincible shield:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Acuet autem duram iram in lanceam, et pugnabit cum illo orbis terrarum contra insensatos."
      en: "And he will sharpen his severe wrath for a spear, and the whole world shall fight with him against the unwise."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ibunt directe emissiones fulgurum, et tamquam a bene curvato arcu nubium exterminabuntur, et ad certum locum insilient."
      en: "Then shafts of lightning shall go directly from the clouds, as from a bow well bent, they shall be shot out, and shall fly to the mark."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et a petrosa ira plenae mittentur grandines; excandescet in illos aqua maris, et flumina concurrent duriter."
      en: "And thick hail shall be cast upon them from the stone casting wrath: the water of the sea shall rage against them, and the rivers shall run together in a terrible manner."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Contra illos stabit spiritus virtutis, et tamquam turbo venti dividet illos; et ad eremum perducet omnem terram iniquitas illorum, et malignitas evertet sedes potentium."
      en: "A mighty wind shall stand up against them, and as a whirlwind shall divide them: and their iniquity shall bring all the earth to a desert, and wickedness shall overthrow the thrones of the mighty."
    status: { la: verified, en: verified }
