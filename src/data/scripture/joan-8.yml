# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: joan
chapter: 8
verses:
  - n: 1
    text:
      la: "Jesus autem perrexit in montem Oliveti:"
      en: "And Jesus went unto mount Olivet."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et diluculo iterum venit in templum, et omnis populus venit ad eum, et sedens docebat eos."
      en: "And early in the morning he came again into the temple, and all the people came to him, and sitting down he taught them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Adducunt autem scribae et pharisaei mulierem in adulterio deprehensam: et statuerunt eam in medio,"
      en: "And the scribes and the Pharisees bring unto him a woman taken in adultery: and they set her in the midst,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dixerunt ei: Magister, haec mulier modo deprehensa est in adulterio."
      en: "And said to him: Master, this woman was even now taken in adultery."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "In lege autem Moyses mandavit nobis hujusmodi lapidare. Tu ergo quid dicis?"
      en: "Now Moses in the law commanded us to stone such a one. But what sayest thou?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Hoc autem dicebant tentantes eum, ut possent accusare eum. Jesus autem inclinans se deorsum, digito scribebat in terra."
      en: "And this they said tempting him, that they might accuse him. But Jesus bowing himself down, wrote with his finger on the ground."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cum ergo perseverarent interrogantes eum, erexit se, et dixit eis: Qui sine peccato est vestrum, primus in illam lapidem mittat."
      en: "When therefore they continued asking him, he lifted up himself, and said to them: He that is without sin among you, let him first cast a stone at her."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et iterum se inclinans, scribebat in terra."
      en: "And again stooping down, he wrote on the ground."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Audientes autem unus post unum exibant, incipientes a senioribus: et remansit solus Jesus, et mulier in medio stans."
      en: "But they hearing this, went out one by one, beginning at the eldest. And Jesus alone remained, and the woman standing in the midst."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Erigens autem se Jesus, dixit ei: Mulier, ubi sunt qui te accusabant? nemo te condemnavit?"
      en: "Then Jesus lifting up himself, said to her: Woman, where are they that accused thee? Hath no man condemned thee?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quae dixit: Nemo, Domine. Dixit autem Jesus: Nec ego te condemnabo: vade, et jam amplius noli peccare."
      en: "Who said: No man, Lord. And Jesus said: Neither will I condemn thee. Go, and now sin no more."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Iterum ergo locutus est eis Jesus, dicens: Ego sum lux mundi: qui sequitur me, non ambulat in tenebris, sed habebit lumen vitae."
      en: "Again therefore, Jesus spoke to them, saying: I am the light of the world: he that followeth me, walketh not in darkness, but shall have the light of life."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dixerunt ergo ei pharisaei: Tu de teipso testimonium perhibes; testimonium tuum non est verum."
      en: "The Pharisees therefore said to him: Thou givest testimony of thyself: thy testimony is not true."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Respondit Jesus, et dixit eis: Et si ego testimonium perhibeo de meipso, verum est testimonium meum: quia scio unde veni et quo vado; vos autem nescitis unde venio aut quo vado."
      en: "Jesus answered, and said to them: Although I give testimony of myself, my testimony is true: for I know whence I came, and whither I go: but you know not whence I come, or whither I go."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Vos secundum carnem judicatis: ego non judico quemquam;"
      en: "You judge according to the flesh: I judge not any man."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et si judico ego, judicium meum verum est, quia solus non sum: sed ego et qui misit me, Pater."
      en: "And if I do judge, my judgment is true: because I am not alone, but I and the Father that sent me."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et in lege vestra scriptum est, quia duorum hominum testimonium verum est."
      en: "And in your law it is written, that the testimony of two men is true."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ego sum qui testimonium perhibeo de meipso, et testimonium perhibet de me qui misit me, Pater."
      en: "I am one that give testimony of myself: and the Father that sent me giveth testimony of me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dicebant ergo ei: Ubi est Pater tuus? Respondit Jesus: Neque me scitis, neque Patrem meum: si me sciretis, forsitan et Patrem meum sciretis."
      en: "They said therefore to him: Where is thy Father? Jesus answered: Neither me do you know, nor my Father: if you did know me, perhaps you would know my Father also."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Haec verba locutus est Jesus in gazophylacio, docens in templo: et nemo apprehendit eum, quia necdum venerat hora ejus."
      en: "These words Jesus spoke in the treasury, teaching in the temple: and no man laid hands on him, because his hour was not yet come."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dixit ergo iterum eis Jesus: Ego vado, et quaeretis me, et in peccato vestro moriemini. Quo ego vado, vos non potestis venire."
      en: "Again therefore Jesus said to them: I go, and you shall seek me, and you shall die in your sin. Whither I go, you cannot come."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Dicebant ergo Judaei: Numquid interficiet semetipsum, quia dixit: Quo ego vado, vos non potestis venire?"
      en: "The Jews therefore said: Will he kill himself, because he said: Whither I go, you cannot come?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et dicebat eis: Vos de deorsum estis, ego de supernis sum. Vos de mundo hoc estis, ego non sum de hoc mundo."
      en: "And he said to them: You are from beneath, I am from above. You are of this world, I am not of this world."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Dixi ergo vobis quia moriemini in peccatis vestris: si enim non credideritis quia ego sum, moriemini in peccato vestro."
      en: "Therefore I said to you, that you shall die in your sins. For if you believe not that I am he, you shall die in your sin."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Dicebant ergo ei: Tu quis es? Dixit eis Jesus: Principium, qui et loquor vobis."
      en: "They said therefore to him: Who art thou? Jesus said to them: The beginning, who also speak unto you."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Multa habeo de vobis loqui, et judicare; sed qui me misit, verax est; et ego quae audivi ab eo, haec loquor in mundo."
      en: "Many things I have to speak and to judge of you. But he that sent me, is true: and the things I have heard of him, these same I speak in the world."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et non cognoverunt quia Patrem ejus dicebat Deum."
      en: "And they understood not, that he called God his Father."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Dixit ergo eis Jesus: Cum exaltaveris Filium hominis, tunc cognoscetis quia ego sum, et a meipso facio nihil, sed sicut docuit me Pater, haec loquor:"
      en: "Jesus therefore said to them: When you shall have lifted up the Son of man, then shall you know, that I am he, and that I do nothing of myself, but as the Father hath taught me, these things I speak:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et qui me misit, mecum est, et non reliquit me solum: quia ego quae placita sunt ei, facio semper."
      en: "And he that sent me, is with me, and he hath not left me alone: for I do always the things that please him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Haec illo loquente, multi crediderunt in eum."
      en: "When he spoke these things, many believed in him."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Dicebat ergo Jesus ad eos, qui crediderunt ei, Judaeos: Si vos manseritis in sermone meo, vere discipuli mei eritis,"
      en: "Then Jesus said to those Jews, who believed him: If you continue in my word, you shall be my disciples indeed."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et cognoscetis veritatem, et veritas liberabit vos."
      en: "And you shall know the truth, and the truth shall make you free."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Responderunt ei: Semen Abrahae sumus, et nemini servivimus umquam: quomodo tu dicis: Liberi eritis?"
      en: "They answered him: We are the seed of Abraham, and we have never been slaves to any man: how sayest thou: you shall be free?"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Respondit eis Jesus: Amen, amen dico vobis: quia omnis qui facit peccatum, servus est peccati."
      en: "Jesus answered them: Amen, amen I say unto you: that whosoever committeth sin, is the servant of sin."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Servus autem non manet in domo in aeternum: filius autem manet in aeternum."
      en: "Now the servant abideth not in the house for ever; but the son abideth for ever."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Si ergo vos filius liberaverit, vere liberi eritis."
      en: "If therefore the son shall make you free, you shall be free indeed."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Scio quia filii Abrahae estis: sed quaeritis me interficere, quia sermo meus non capit in vobis."
      en: "I know that you are the children of Abraham: but you seek to kill me, because my word hath no place in you."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Ego quod vidi apud Patrem meum, loquor: et vos quae vidistis apud patrem vestrum, facitis."
      en: "I speak that which I have seen with my Father: and you do the things that you have seen with your father."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Responderunt, et dixerunt ei: Pater noster Abraham est. Dicit eis Jesus: Si filii Abrahae estis, opera Abrahae facite."
      en: "They answered, and said to him: Abraham is our father. Jesus saith to them: If you be the children of Abraham, do the works of Abraham."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Nunc autem quaeritis me interficere, hominem, qui veritatem vobis locutus sum, quam audivi a Deo: hoc Abraham non fecit."
      en: "But now you seek to kill me, a man who have spoken the truth to you, which I have heard of God. This Abraham did not."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Vos facitis opera patris vestri. Dixerunt itaque ei: Nos ex fornicatione non sumus nati: unum patrem habemus Deum."
      en: "You do the works of your father. They said therefore to him: We are not born of fornication: we have one Father, even God."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Dixit ergo eis Jesus: Si Deus pater vester esset, diligeretis utique et me; ego enim ex Deo processi, et veni: neque enim a meipso veni, sed ille me misit."
      en: "Jesus therefore said to them: If God were your Father, you would indeed love me. For from God I proceeded, and came; for I came not of myself, but he sent me:"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Quare loquelam meam non cognoscitis? Quia non potestis audire sermonem meum."
      en: "Why do you not know my speech? Because you cannot hear my word."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Vos ex patre diabolo estis: et desideria patris vestri vultis facere. Ille homicida erat ab initio, et in veritate non stetit: quia non est veritas in eo: cum loquitur mendacium, ex propriis loquitur, quia mendax est, et pater ejus."
      en: "You are of your father the devil, and the desires of your father you will do. He was a murderer from the beginning, and he stood not in the truth; because truth is not in him. When he speaketh a lie, he speaketh of his own: for he is a liar, and the father thereof."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Ego autem si veritatem dico, non creditis mihi."
      en: "But if I say the truth, you believe me not."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Quis ex vobis arguet me de peccato? Si veritatem dico vobis, quare non creditis mihi?"
      en: "Which of you shall convict me of sin? If I say the truth to you, why do you not believe me?"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Qui ex Deo est, verba Dei audit. Propterea vos non auditis, quia ex Deo non estis."
      en: "He that is of God, heareth the words of God. Therefore you hear them not, because you are not of God."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Responderunt ergo Judaei, et dixerunt ei: Nonne bene dicimus nos quia Samaritanus es tu, et daemonium habes?"
      en: "The Jews therefore answered, and said to him: Do not we say well that thou art a Samaritan, and hast a devil?"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Respondit Jesus: Ego daemonium non habeo: sed honorifico Patrem meum, et vos inhonorastis me."
      en: "Jesus answered: I have not a devil: but I honour my Father, and you have dishonoured me."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Ego autem non quaero gloriam meam: est qui quaerat, et judicet."
      en: "But I seek not my own glory: there is one that seeketh and judgeth."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Amen, amen dico vobis: si quis sermonem meum servaverit, mortem non videbit in aeternum."
      en: "Amen, amen I say to you: If any man keep my word, he shall not see death for ever."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Dixerunt ergo Judaei: Nunc cognovimus quia daemonium habes. Abraham mortuus est, et prophetae; et tu dicis: Si quis sermonem meum servaverit, non gustabit mortem in aeternum."
      en: "The Jews therefore said: Now we know that thou hast a devil. Abraham is dead, and the prophets; and thou sayest: If any man keep my word, he shall not taste death for ever."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Numquid tu major es patre nostro Abraham, qui mortuus est? et prophetae mortui sunt. Quem teipsum facis?"
      en: "Art thou greater than our father Abraham, who is dead? and the prophets are dead. Whom dost thou make thyself?"
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Respondit Jesus: Si ego glorifico meipsum, gloria mea nihil est: est Pater meus, qui glorificat me, quem vos dicitis quia Deus vester est,"
      en: "Jesus answered: If I glorify myself, my glory is nothing. It is my Father that glorifieth me, of whom you say that he is your God."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "et non cognovistis eum: ego autem novi eum. Et si dixero quia non scio eum, ero similis vobis, mendax. Sed scio eum, et sermonem ejus servo."
      en: "And you have not known him, but I know him. And if I shall say that I know him not, I shall be like to you, a liar. But I do know him, and do keep his word."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Abraham pater vester exsultavit ut videret diem meum: vidit, et gavisus est."
      en: "Abraham your father rejoiced that he might see my day: he saw it, and was glad."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Dixerunt ergo Judaei ad eum: Quinquaginta annos nondum habes, et Abraham vidisti?"
      en: "The Jews therefore said to him: Thou art not yet fifty years old, and hast thou seen Abraham?"
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Dixit eis Jesus: Amen, amen dico vobis, antequam Abraham fieret, ego sum."
      en: "Jesus said to them: Amen, amen I say to you, before Abraham was made, I am."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Tulerunt ergo lapides, ut jacerent in eum: Jesus autem abscondit se, et exivit de templo."
      en: "They took up stones therefore to cast at him. But Jesus hid himself, and went out of the temple."
    status: { la: verified, en: verified }
