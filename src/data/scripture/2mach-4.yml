# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2mach
chapter: 4
verses:
  - n: 1
    text:
      la: "Simon autem praedictus pecuniarum, et patriae delator, male loquebatur de Onia, tamquam ipse Heliodorum instigasset ad haec, et ipse fuisset incentor malorum:"
      en: "But Simon, of whom we spoke before, and of his country, spoke ill of Onias, as though he had incited Heliodorus to do these things, and had been the promoter of evils:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "provisoremque civitatis, ac defensorem gentis suae, et aemulatorem legis Dei audebat insidiatorem regni dicere."
      en: "And he presumed to call him a traitor to the kingdom, who provided for the city, and defended his nation, and was zealous for the law of God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sed cum inimicitiae in tantum procederent, ut etiam per quosdam Simonis necessarios homicidia fierent:"
      en: "But when the enmities proceeded so far, that murders also were committed by some of Simon's friends:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "considerans Onias periculum contentionis, et Apollonium insanire, utpote ducem Coelesyriae et Phoenicis, ad augendam malitiam Simonis, ad regem se contulit,"
      en: "Onias considering the danger of this contention, and that Apollonius, who was the governor of Celesyria and Phenicia, was outrageous, which increased the malice of Simon, went to the king,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "non ut civium accusator, sed communem utilitatem apud semetipsum universae multitudinis considerans."
      en: "Not to be an accuser of his countrymen, but with a view to the common good of all the people."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Videbat enim sine regali providentia impossibile esse pacem rebus dari, nec Simonem posse cessare a stultitia sua."
      en: "For he saw that, except the king took care, it was impossible that matters should be settled in peace, or that Simon would cease from his folly."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Sed post Seleuci vitae excessum, cum suscepisset regnum Antiochus, qui Nobilis appellabatur, ambiebat Jason frater Oniae summum sacerdotium:"
      en: "But after the death of Seleucus, when Antiochus, who was called the Illustrious, had taken possession of the kingdom, Jason the brother of Onias ambitiously sought the high priesthood:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "adito rege, promittens ei argenti talenta trecenta sexaginta, et ex redditibus aliis talenta octoginta,"
      en: "And went to the king, promising him three hundred and sixty talents of silver, and out of other revenues fourscore talents."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "super haec promittebat et alia centum quinquaginta, si potestati ejus concederetur, gymnasium et ephebiam sibi constituere, et eos qui in Jerosolymis erant, Antiochenos scribere."
      en: "Besides this he promised also a hundred and fifty more, if he might have license to set him up a place for exercise, and a place for youth, and to entitle them, that were at Jerusalem, Antiochians."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quod cum rex annuisset, et obtinuisset principatum, statim ad gentilem ritum contribules suos transferre coepit,"
      en: "Which when the king had granted, and he had gotten the rule into his hands, forthwith he began to bring over his countrymen to the fashion of the heathens."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et amotis his, quae humanitatis causa Judaeis a regibus fuerant constituta, per Joannem patrem Eupolemi, qui apud Romanos de amicitia, et societate functus est legatione legitima, civium jura destituens, prava instituta sanciebat."
      en: "And abolishing those things, which had been decreed of special favour by the kings in behalf of the Jews, by the means of John the father of that Eupolemus, who went ambassador to Rome to make amity and alliance, he disannulled the lawful ordinances of the citizens, and brought in fashions that were perverse."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Etenim ausus est sub ipsa arce gymnasium constituere, et optimos quosque epheborum in lupanaribus ponere."
      en: "For he had the boldness to set up, under the very castle, a place of exercise, and to put all the choicest youths in brothel houses."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Erat autem hoc non initium, sed incrementum quoddam, et profectus gentilis, et alienigenae conversationis, propter impii, et non sacerdotis Jasonis nefarium, et inauditum scelus:"
      en: "Now this was not the beginning, but an increase, and progress of heathenish and foreign manners, through the abominable and unheard of wickedness of Jason, that impious wretch and no priest."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ita ut sacerdotes jam non circa altaris officia dediti essent, sed contempto templo, et sacrificiis neglectis festinarent participes fieri palaestrae, et praebitionis ejus injustae, et in exercitiis disci,"
      en: "Insomuch that the priests were not now occupied about the offices of the altar, but despising the temple and neglecting the sacrifices, hastened to be partakers of the games, and of the unlawful allowance thereof, and of the exercise of the discus."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et patrios quidem honores nihil habentes, graecas glorias optimas arbitrabantur:"
      en: "And setting nought by the honours of their fathers, they esteemed the Grecian glories for the best:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quarum gratia periculosa eos contentio habebat, et eorum instituta aemulabantur, ac per omnia his consimiles esse cupiebant, quos hoste et peremptores habuerant."
      en: "For the sake of which they incurred a dangerous contention, and followed earnestly their ordinances, and in all things they coveted to be like them, who were their enemies and murderers."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "In leges enim divinas impie agere impune non cedit: sed hoc tempus sequens declarabit."
      en: "For acting wickedly against the laws of God doth not pass unpunished: but this the time following will declare."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Cum autem quinquennalis agon Tyri celebraretur, et rex praesens esset,"
      en: "Now when the game that was used every fifth year was kept at Tyre, the king being present,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "misit Jason facinorosus ab Jerosolymis viros peccatores, portantes argenti didrachmas trecentas in sacrificum Herculis, quas postulaverunt hi qui asportaverant ne in sacrificiis erogarentur, quia non oporteret, sed in alios sumptus eas deputari."
      en: "The wicked Jason sent from Jerusalem sinful men to carry three hundred didrachmas of silver for the sacrifice of Hercules; but the bearers thereof desired it might not be bestowed on the sacrifices, because it was not necessary, but might be deputed for other charges."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Sed hae oblatae sunt quidem ab eo qui miserat in sacrificium Herculis: propter praesentes autem datae sunt in fabricam navium triremium."
      en: "So the money was appointed by him that sent it to the sacrifice of Hercules: but because of them that carried it was employed for the making of galleys."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Misso autem in Aegyptum Apollonio Mnesthei filio propter primates Ptolemaei Philometoris regis, cum cognovisset Antiochus alienum se a negotiis regni effectum, propriis utilitatibus consulens, profectus inde venit Joppen, et inde Jerosolymam."
      en: "Now when Apollonius the son of Mnestheus was sent into Egypt to treat with the nobles of king Philometor, and Antiochus understood that he was wholly excluded from the affairs of the kingdom, consulting his own interest, he departed thence and came to Joppe, and from thence to Jerusalem:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et magnifice ab Jasone, et civitate susceptus, cum facularum luminibus et laudibus ingressus est: et inde in Phoenicen exercitum convertit."
      en: "Where he was received in a, magnificent manner by Jason, and the city, and came in with torch lights, and with praises, and from thence he returned with his army into Phenicia."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et post triennii tempus misit Jason Menelaum supradicti Simonis fratrem portantem pecunias regi, et de negotiis necessariis responsa perlaturum."
      en: "Three years afterwards Jason sent Menelaus, brother of the aforesaid Simon, to carry money to the king, and to bring answers from him concerning certain necessary affairs."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "At ille commendatus regi, cum magnificasset faciem potestatis ejus, in semetipsum retorsit summum sacerdotium, superponens Jasoni talenta argenti trecenta."
      en: "But he being recommended to the king, when he had magnified the appearance of his power, got the high priesthood for himself, by offering more than Jason by three hundred talents of silver."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Acceptisque a rege mandatis, venit, nihil quidem habens dignum sacerdotio: animos vero crudelis tyranni, et ferae belluae iram gerens."
      en: "So having received the king's mandate, he returned bringing nothing worthy of the high priesthood: but having the mind of a cruel tyrant, and the rage of a savage beast."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et Jason quidem, qui proprium fratrem captivaverat, ipse deceptus profugus in Ammanitem expulsus est regionem."
      en: "Then Jason, who had undermined his own brother, being himself undermined, was driven out a fugitive into the country of the Ammonites."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Menelaus autem principatum quidem obtinuit: de pecuniis vero regi promissis, nihil agebat, cum exactionem faceret Sostratus, qui arci erat praepositus,"
      en: "So Menelaus got the principality: but as for the money he had promised to the king he took no care, when Sostratus the governor of the castle called for it."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "nam ad hunc exactio vectigalium pertinebant: quam ob causam utrique ad regem sunt evocati."
      en: "For to him appertained the gathering of the taxes: wherefore they were both called before the king."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et Menelaus amotus est a sacerdotio, succedente Lysimacho fratre suo: Sostratus autem praelatus est Cypriis."
      en: "And Menelaus was removed from the priesthood, Lysimachus his brother succeeding: and Sostratus was made governor of the Cyprians."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et cum haec agerentur, contigit, Tharsenses, et Mallotas seditionem movere, eo quod Antiochidi regis concubinae dono essent dati."
      en: "When these things were in doing, it fell out that they of Tharsus and Mallos raised a sedition, because they were given for a gift to Antiochis, the king's concubine."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Festinanter itaque rex venit sedare illos, relicto suffecto uno ex comitibus suis Andronico."
      en: "The king therefore went in all haste to appease them, leaving Andronicus, one of his nobles, for his deputy."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Ratus autem Menelaus accepisse se tempus opportunum, aurea quaedam vasa e templo furatus donavit Andronico, et alia vendiderat Tyri, et per vicinas civitates."
      en: "Then Menelaus supposing that he had found a convenient time, having stolen certain vessels of gold out of the temple, gave them to Andronicus, and others he had sold at Tyre, and in the neighbouring cities."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Quod cum certissime cognovisset Onias, arguebat eum, ipse in loco tuto se continens Antiochiae secus Daphnem."
      en: "Which when Onias understood most certainly, he reproved him, keeping himself in a safe place at Antioch beside Daphne."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Unde Menelaus accedens ad Andronicum, rogabat ut Oniam interficeret. Qui cum venisset ad Oniam, et datis dextris cum jurejurando ( quamvis esset ei suspectus) suasisset de asylo procedere, statim eum peremit, non veritus justitiam."
      en: "Whereupon Menelaus coming to Andronicus, desired him to kill Onias. And he went to Onias, and gave him his right hand with an oath, and (though he were suspected by him) persuaded him to come forth out of the sanctuary, and immediately slew him, without any regard to justice."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Ob quam causam non solum Judaei, sed aliae quoque nationes indignabantur, et moleste ferebant de nece tanti viri injusta."
      en: "For which cause not only the Jews, but also the other nations, conceived indignation, and were much grieved for the unjust murder of so great a man."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Sed regressum regem de Ciliciae locis adierunt Judaei apud Antiochiam, simul et Graeci, conquerentes de iniqua nece Oniae."
      en: "And when the king was come back from the places of Cilicia, the Jews that were at Antioch, and also the Greeks went to him: complaining of the unjust murder of Onias."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Contristatus itaque animo Antiochus propter Oniam, et flexus ad misericordiam, lacrimas fudit, recordatus defuncti sobrietatem et modestiam:"
      en: "Antiochus therefore was grieved in his mind for Onias, and being moved to pity, shed tears, remembering the sobriety and modesty of the deceased."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "accensisque animis Andronicum purpura exutum, per totam civitatem jubet circumduci: et in eodem loco, in quo in Oniam impietatem commiserat, sacrilegum vita privari, Domino illi condignam retribuente poenam."
      en: "And being inflamed to anger, he commanded Andronicus to be stripped of his purple, and to be led about through all the city: and that in the same place wherein he had committed the impiety against Onias, the sacrilegious wretch should be put to death, the Lord repaying him his deserved punishment."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Multis autem sacrilegiis in templo a Lysimacho commissis Menelai consilio, et divulgata fama, congregata est multitudo adversum Lysimachum multo jam auro exportato."
      en: "Now when many sacrileges had been committed by Lysimachus in the temple by the counsel of Menelaus, and the rumour of it was spread abroad, the multitude gathered themselves together against Lysimachus, a great quantity of gold being already carried away."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Turbis autem insurgentibus, et animis ira repletis, Lysimachus armatis fere tribus millibus iniquis manibus uti coepit, duce quodam tyranno, aetate pariter et dementia provecto."
      en: "Wherefore the multitude making an insurrection, and their minds being filled with anger, Lysimachus armed about three thousand men, and began to use violence, one Tyrannus being captain, a man far gone both in age, and in madness."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Sed ut intellexerunt conatum Lysimachi, alii lapides, alii fustes validos arripuere: quidam vero cinerem in Lysimachum jecere."
      en: "But when they perceived the attempt of Lysimachus, some caught up stones, some strong clubs: and some threw ashes upon Lysimachus,"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et multi quidem vulnerati, quidam autem et prostrati, omnes vero in fugam conversi sunt: ipsum etiam sacrilegum secus aerarium interfecerunt."
      en: "And many of them were wounded, and some struck down to the ground, but all were put to flight: and as for the sacrilegious fellow himself, they slew him beside the treasury."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "De his ergo coepit judicium adversus Menelaum agitari."
      en: "Now concerning these matters, an accusation was laid against Menelaus."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Et cum venisset rex Tyrum, ad ipsum negotium detulerunt missi tres viri a senioribus."
      en: "And when the king was come to Tyre, three men were sent from the ancients to plead the cause before him."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Et cum superaretur Menelaus, promisit Ptolemaeo multas pecunias dare ad suadendum regi."
      en: "But Menelaus being convicted, promised Ptolemee to give him much money to persuade the king to favour him."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Itaque Ptolemaeus in quodam atrio positum quasi refrigerandi gratia regem adiit, et deduxit a sententia:"
      en: "So Ptolemee went to the king in a certain court where he was, as it were to cool himself, and brought him to be of another mind:"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et Menelaum quidem universae malitiae reum criminibus absolvit: miseros autem qui, etiamsi apud Scythas causam dixissent, innocentes judicarentur, hos morte damnavit."
      en: "So Menelaus who was guilty of all the evil, was acquitted by him of the accusations: and those poor men, who, if they had pleaded their cause even before Scythians, should have been judged innocent, were condemned to death."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Cito ergo injustam poenam dederunt, qui pro civitate, et populo, et sacris vasis causam prosecuti sunt."
      en: "Thus they that prosecuted the cause for the city, and for the people, and the sacred vessels, did soon suffer unjust punishment."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Quam ob rem Tyrii quoque indignati, erga sepulturam eorum liberalissimi extiterunt."
      en: "Wherefore even the Tyrians being moved with indignation, were liberal towards their burial."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Menelaus autem, propter eorum, qui in potentia erant, avaritiam, permanebat in potestate, crescens in malitia ad insidias civium."
      en: "And so through the covetousness of them that were in power, Menelaus continued in authority, increasing in malice to the betraying of the citizens."
    status: { la: verified, en: verified }
