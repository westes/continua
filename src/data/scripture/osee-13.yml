# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: osee
chapter: 13
verses:
  - n: 1
    text:
      la: "loquente Ephraim horror invasit Israhel et deliquit in Baal et mortuus est"
      en: "When Ephraim spoke, a horror seized Israel: and he sinned in Baal and died."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et nunc addiderunt ad peccandum feceruntque sibi conflatile de argento suo quasi similitudinem idolorum factura artificum totum est his ipsi dicunt immolate homines vitulos adorantes"
      en: "And now they have sinned more and more : and they have made to themselves a molten thing of their silver as the likeness of idols: the whole is the work of craftsmen: to these that say: Sacrifice men, ye that adore calves."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "idcirco erunt quasi nubes matutina et sicut ros matutinus praeteriens sicut pulvis turbine raptus ex area et sicut fumus de fumario"
      en: "Therefore they shall be as a morning aloud, and as the early dew that passeth away, as the dust that is driven with a whirlwind out of the floor, and as the smoke out of the chimney."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ego autem Dominus Deus tuus ex terra Aegypti et Deum absque me nescies et salvator non est praeter me"
      en: "But I am the Lord thy God from the land of Egypt: and thou shalt know no God but me, and there is no saviour beside me."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ego cognovi te in deserto in terra solitudinis"
      en: "I knew thee in the desert, in the land of the wilderness."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "iuxta pascua sua et adimpleti sunt et saturati elevaverunt cor suum et obliti sunt mei"
      en: "According to their pastures they were filled, and were made full: and they lifted up their heart, and have forgotten me."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et ero eis quasi leaena sicut pardus in via Assyriorum"
      en: "And I will be to them as a lioness, as a leopard in the way of the Assyrians."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "occurram eis quasi ursa raptis catulis et disrumpam interiora iecoris eorum et consumam eos ibi quasi leo bestia agri scindet eos"
      en: "I will meet them as a bear that is robbed of her whelps, and I will rend the inner parts of their liver: and I will devour them there as a lion, the beast of the field shall tear them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "perditio tua Israhel tantummodo in me auxilium tuum"
      en: "Destruction is thy own, 0 Israel: thy help is only in me."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ubi est rex tuus maxime nunc salvet te in omnibus urbibus tuis et iudices tui de quibus dixisti da mihi regem et principes"
      en: "Where is thy king? now especially let him save thee in all thy cities: and thy judges, of whom thou saidst: Q Give me kings and princes."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dabo tibi regem in furore meo et auferam in indignatione mea"
      en: "I will give thee a king in my wrath, and will take him away in my indignation."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "conligata est iniquitas Ephraim absconditum peccatum eius"
      en: "The iniquity of Ephraim is bound up, his sin is hidden."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dolores parturientis venient ei ipse filius non sapiens nunc enim non stabit in contritione filiorum"
      en: "The sorrows of a woman in labour snail come upon him, he is an unwise son: for now he shall not stand in the breach of the children."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "de manu mortis liberabo eos de morte redimam eos ero mors tua o mors ero morsus tuus inferne consolatio abscondita est ab oculis meis"
      en: "I will deliver them out of the hand of death. I will redeem them from death : O death, I will be thy death; O hell, I will be thy bite: comfort is hidden from my eyes."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quia ipse inter fratres dividet adducet urentem ventum Dominus de deserto ascendentem et siccabit venas eius et desolabit fontem eius et ipse diripiet thesaurum omnis vasis desiderabilis"
      en: "Because he shall make a separation between brothers: s the Lord will bring a burning wind that shall rise from the desert, and it shall dry up his springs, and shall make his fountain desolate, and he shall carry off the treasure of every desirable vessel."
    status: { la: verified, en: verified }
