book: 1reg
chapter: 19
verses:
  - n: 1
    text:
      la: "locutus est autem Saul ad Ionathan filium suum et ad omnes servos suos ut occiderent David porro Ionathan filius Saul diligebat David valde"
      en: "And Saul spoke to Jonathan his son and to all his servants, that they should kill David. But Jonathan the son of Saul loved David exceedingly."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et indicavit Ionathan David dicens quaerit Saul pater meus occidere te quapropter observa te quaeso mane et manebis clam et absconderis"
      en: "And Jonathan told David, saying: Saul my father seeketh to kill thee: wherefore look to thyself, I beseech thee, in the morning, and thou shalt abide in a secret place and shalt be hid."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ego autem egrediens stabo iuxta patrem meum in agro ubicumque fueris et ego loquar de te ad patrem meum et quodcumque videro nuntiabo tibi"
      en: "And I will go out and stand beside my father in the field where thou art: and I will speak of thee to my father, and whatsoever I shall see, I will tell thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "locutus est ergo Ionathan de David bona ad Saul patrem suum dixitque ad eum ne pecces rex in servum tuum David quia non peccavit tibi et opera eius bona sunt tibi valde"
      en: "And Jonathan spoke good things of David to Saul his father: and said to him: Sin not, O king, against thy servant, David, because he hath not sinned against thee, and his works are very good towards thee."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et posuit animam suam in manu sua et percussit Philistheum et fecit Dominus salutem magnam universo Israhel vidisti et laetatus es quare ergo peccas in sanguine innoxio interficiens David qui est absque culpa"
      en: "And he put his life in his hand, and slew the Philistine, and the Lord wrought great salvation for all Israel. Thou sawest it and didst rejoice. Why therefore wilt thou sin against innocent blood by killing David, who is without fault?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quod cum audisset Saul placatus voce Ionathae iuravit vivit Dominus quia non occidetur"
      en: "And when Saul heard this he was appeased with the words of Jonathan, and swore: As the Lord liveth he shall not be slain."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "vocavit itaque Ionathan David et indicavit ei omnia verba haec et introduxit Ionathan David ad Saul et fuit ante eum sicut fuerat heri et nudius tertius"
      en: "Then Jonathan called David and told him all these words: and Jonathan brought in David to Saul, and he was before him, as he had been yesterday and the day before."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "motum est autem rursus bellum et egressus David pugnavit adversus Philisthim percussitque eos plaga magna et fugerunt a facie eius"
      en: "And the war began again, and David went out and fought against the Philistines, and defeated them with a great slaughter, and they fled from his face."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et factus est spiritus Domini malus in Saul sedebat autem in domo sua et tenebat lanceam porro David psallebat in manu sua"
      en: "And the evil spirit from the Lord came upon Saul, and he sat in his house, and held a spear in his hand: and David played with his hand."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "nisusque est Saul configere lancea David in pariete et declinavit David a facie Saul lancea autem casso vulnere perlata est in parietem et David fugit et salvatus est nocte illa"
      en: "And Saul endeavoured to nail David to the wall with his spear. And David slipt away out of the presence of Saul: and the spear missed him, and was fastened in the wall, and David fled and escaped that night."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "misit ergo Saul satellites suos in domum David ut custodirent eum et interficeretur mane quod cum adnuntiasset David Michol uxor sua dicens nisi salvaveris te nocte hac cras morieris"
      en: "Saul therefore sent his guards to David's house to watch him, that he might be killed in the morning. And when Michol David's wife had told him this, saying: Unless thou save thyself this night, to morrow thou wilt die,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "deposuit eum per fenestram porro ille abiit et aufugit atque salvatus est"
      en: "She let him down through a window. And he went and fled away and escaped."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "tulit autem Michol statuam et posuit eam super lectum et pellem pilosam caprarum posuit ad caput eius et operuit eam vestimentis"
      en: "And Michol took an image and laid it on the bed, and put a goat's skin with the hair at the head of it, and covered it with clothes."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "misit autem Saul apparitores qui raperent David et responsum est quod aegrotaret"
      en: "And Saul sent officers to seize David: and it was answered that he was sick."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "rursumque misit Saul nuntios ut viderent David dicens adferte eum ad me in lecto ut occidatur"
      en: "And again Saul sent to see David, saying: Bring him to me in the bed, that he may be slain."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cumque venissent nuntii inventum est simulacrum super lectum et pellis caprarum ad caput eius"
      en: "And when the messengers were come in, they found an image upon the bed, and a goat's skin at its head."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dixitque Saul ad Michol quare sic inlusisti mihi et dimisisti inimicum meum ut fugeret et respondit Michol ad Saul quia ipse locutus est mihi dimitte me alioquin interficiam te"
      en: "And Saul said to Michol: Why hast thou deceived me so, and let my enemy go and flee away? And Michol answered Saul: Because he said to me: Let me go, or else I will kill thee."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "David autem fugiens salvatus est et venit ad Samuhel in Ramatha et nuntiavit ei omnia quae fecerat sibi Saul et abierunt ipse et Samuhel et morati sunt in Nahioth"
      en: "But David fled and escaped, and came to Samuel in Ramatha, and told him all that Saul had done to him: and he and Samuel went and dwelt in Najoth."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "nuntiatum est autem Sauli a dicentibus ecce David in Nahioth in Rama"
      en: "And it was told Saul by some, saying: Behold David is in Najoth in Ramatha."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "misit ergo Saul lictores ut raperent David qui cum vidissent cuneum prophetarum vaticinantium et Samuhel stantem super eos factus est etiam in illis spiritus Domini et prophetare coeperunt etiam ipsi"
      en: "So Saul sent officers to take David: and when they saw a company of prophets prophesying, and Samuel presiding over them, the spirit of the Lord came also upon them, and they likewise began to prophesy."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quod cum nuntiatum esset Sauli misit alios nuntios prophetaverunt autem et illi et rursum Saul misit tertios nuntios qui et ipsi prophetaverunt"
      en: "And when this was told Saul, he sent other messengers: but they also prophesied. And again Saul sent messengers the third time: and they prophesied also. And Saul being exceedingly angry,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "abiit autem etiam ipse in Ramatha et venit usque ad cisternam magnam quae est in Soccho et interrogavit et dixit in quo loco sunt Samuhel et David dictumque est ei ecce in Nahioth sunt in Rama"
      en: "Went also himself to Ramatha, and came as far as the great cistern, which is in Socho, and he asked, and said: In what place are Samuel and David? And it was told him: Behold they axe in Najoth in Ramatha."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et abiit in Nahioth in Rama et factus est etiam super eum spiritus Dei et ambulabat ingrediens et prophetabat usque dum veniret in Nahioth in Rama"
      en: "And he went to Najoth in Ramatha, and the spirit of the Lord came upon him also, and he went on, and prophesied till he came to Najoth in Ramatha."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et expoliavit se etiam ipse vestimentis suis et prophetavit cum ceteris coram Samuhel et cecidit nudus tota die illa et nocte unde et exivit proverbium num et Saul inter prophetas"
      en: "And he stripped himself also of his garments, and prophesied with the rest before Samuel, and lay down naked all that day and night. This gave occasion to a proverb: What! is Saul too among the prophets?"
    status: { la: verified, en: verified }
