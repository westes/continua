# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1reg
chapter: 19
verses:
  - n: 1
    text:
      la: "Locutus est autem Saul ad Jonatham filium suum, et ad omnes servos suos, ut occiderent David. Porro Jonathas filius Saul diligebat David valde."
      en: "And Saul spoke to Jonathan his son and to all his servants, that they should kill David. But Jonathan the son of Saul loved David exceedingly."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et indicavit Jonathas David dicens: Quaerit Saul pater meus occidere te: quapropter observa te, quaeso, mane, et manebis clam, et absconderis."
      en: "And Jonathan told David, saying: Saul my father seeketh to kill thee: wherefore look to thyself, I beseech thee, in the morning, and thou shalt abide in a secret place and shalt be hid."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ego autem egrediens stabo juxta patrem meum, in agro ubicumque fueris: et ego loquar de te ad patrem meum: et quodcumque videro, nuntiabo tibi."
      en: "And I will go out and stand beside my father in the field where thou art: and I will speak of thee to my father, and whatsoever I shall see, I will tell thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Locutus est ergo Jonathas de David bona ad Saul patrem suum: dixitque ad eum: Ne pecces rex in servum tuum David, quia non peccavit tibi, et opera ejus bona sunt tibi valde."
      en: "And Jonathan spoke good things of David to Saul his father: and said to him: Sin not, O king, against thy servant, David, because he hath not sinned against thee, and his works are very good towards thee."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et posuit animam suam in manu sua, et percussit Philisthaeum, et fecit Dominus salutem magnam universo Israeli: vidisti, et laetatus es. Quare ergo peccas in sanguine innoxio, interficiens David, qui est absque culpa?"
      en: "And he put his life in his hand, and slew the Philistine, and the Lord wrought great salvation for all Israel. Thou sawest it and didst rejoice. Why therefore wilt thou sin against innocent blood by killing David, who is without fault?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quod cum audisset Saul, placatus voce Jonathae, juravit: Vivit Dominus, quia non occidetur."
      en: "And when Saul heard this he was appeased with the words of Jonathan, and swore: As the Lord liveth he shall not be slain."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Vocavit itaque Jonathas David, et indicavit ei omnia verba haec: et introduxit Jonathas David ad Saul, et fuit ante eum, sicut fuerat heri et nudiustertius."
      en: "Then Jonathan called David and told him all these words: and Jonathan brought in David to Saul, and he was before him, as he had been yesterday and the day before."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Motum est autem rursum bellum: et egressus David, pugnavit adversum Philisthiim: percussitque eos plaga magna, et fugerunt a facie ejus."
      en: "And the war began again, and David went out and fought against the Philistines, and defeated them with a great slaughter, and they fled from his face."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et factus est spiritus Domini malus in Saul, sedebat autem in domo sua, et tenebat lanceam: porro David psallebat manu sua."
      en: "And the evil spirit from the Lord came upon Saul, and he sat in his house, and held a spear in his hand: and David played with his hand."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nisusque est Saul configere David lancea in pariete, et declinavit David a facie Saul: lancea autem casso vulnere perlata est in parietem, et David fugit, et salvatus est nocte illa."
      en: "And Saul endeavoured to nail David to the wall with his spear. And David slipt away out of the presence of Saul: and the spear missed him, and was fastened in the wall, and David fled and escaped that night."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Misit ergo Saul satellites suos in domum David, ut custodirent eum, et interficeretur mane. Quod cum annuntiasset David Michol uxor sua, dicens: Nisi salvaveris te nocte hac, cras morieris:"
      en: "Saul therefore sent his guards to David's house to watch him, that he might be killed in the morning. And when Michol David's wife had told him this, saying: Unless thou save thyself this night, tomorrow thou wilt die,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "deposuit eum per fenestram. Porro ille abiit et aufugit, atque salvatus est."
      en: "She let him down through a window. And he went and fled away and escaped."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tulit autem Michol statuam, et posuit eam super lectum, et pellem pilosam caprarum posuit ad caput ejus, et operuit eam vestimentis."
      en: "And Michol took an image and laid it on the bed, and put a goat's skin with the hair at the head of it, and covered it with clothes."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Misit autem Saul apparitores, qui raperent David: et responsum est quod aegrotaret."
      en: "And Saul sent officers to seize David: and it was answered that he was sick."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Rursumque misit Saul nuntios ut viderent David, dicens: Afferte eum ad me in lecto, ut occidatur."
      en: "And again Saul sent to see David, saying: Bring him to me in the bed, that he may be slain."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cumque venissent nuntii, inventum est simulacrum super lectum, et pellis caprarum ad caput ejus."
      en: "And when the messengers were come in, they found an image upon the bed, and a goat's skin at its head."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dixitque Saul ad Michol: Quare sic illusisti mihi, et dimisisti inimicum meum ut fugeret? Et respondit Michol ad Saul: Quia ipse locutus est mihi: Dimitte me, alioquin interficiam te."
      en: "And Saul said to Michol: Why hast thou deceived me so, and let my enemy go and flee away? And Michol answered Saul: Because he said to me: Let me go, or else I will kill thee."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "David autem fugiens, salvatus est, et venit ad Samuel in Ramatha, et nuntiavit ei omnia quae fecerat sibi Saul: et abierunt ipse et Samuel, et morati sunt in Najoth."
      en: "But David fled and escaped, and came to Samuel in Ramatha, and told him all that Saul had done to him: and he and Samuel went and dwelt in Najoth."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Nuntiatum est autem Sauli a dicentibus: Ecce David in Najoth in Ramatha."
      en: "And it was told Saul by some, saying: Behold David is in Najoth in Ramatha."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Misit ergo Saul lictores, ut raperent David: qui cum vidissent cuneum prophetarum vaticinantium, et Samuelem stantem super eos, factus est etiam spiritus Domini in illis, et prophetare coeperunt etiam ipsi."
      en: "So Saul sent officers to take David: and when they saw a company of prophets prophesying, and Samuel presiding over them, the spirit of the Lord came also upon them, and they likewise began to prophesy."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quod cum nuntiatum esset Sauli, misit et alios nuntios: prophetaverunt autem et illi. Et rursum misit Saul tertios nuntios: qui et ipsi prophetaverunt. Et iratus iracundia Saul,"
      en: "And when this was told Saul, he sent other messengers: but they also prophesied. And again Saul sent messengers the third time: and they prophesied also. And Saul being exceedingly angry,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "abiit etiam ipse in Ramatha, et venit usque ad cisternam magnam, quae est in Socho, et interrogavit, et dixit: In quo loco sunt Samuel et David? Dictumque est ei: Ecce in Najoth sunt in Ramatha."
      en: "Went also himself to Ramatha, and came as far as the great cistern, which is in Socho, and he asked, and said: In what place are Samuel and David? And it was told him: Behold they are in Najoth in Ramatha."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et abiit in Najoth in Ramatha, et factus est etiam super eum spiritus Domini, et ambulabat ingrediens, et prophetabat usque dum veniret in Najoth in Ramatha."
      en: "And he went to Najoth in Ramatha, and the spirit of the Lord came upon him also, and he went on, and prophesied till he came to Najoth in Ramatha."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et expoliavit etiam ipse se vestimentis suis, et prophetavit cum ceteris coram Samuele, et cecidit nudus tota die illa et nocte. Unde et exivit proverbium: Num et Saul inter prophetas?"
      en: "And he stripped himself also of his garments, and prophesied with the rest before Samuel, and lay down naked all that day and night. This gave occasion to a proverb: What! is Saul too among the prophets?"
    status: { la: verified, en: verified }
