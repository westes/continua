# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: apoc
chapter: 8
verses:
  - n: 1
    text:
      la: "et cum aperuisset sigillum septimum factum est silentium in caelo quasi media hora"
      en: "And when he had opened the seventh seal, there was silence in heaven, as it were for half an hour."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et vidi septem angelos stantes in conspectu Dei et datae sunt illis septem tubae"
      en: "And I saw seven angels standing in the presence of God; and there were given to them seven trumpets."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et alius angelus venit et stetit ante altare habens turibulum aureum et data sunt illi incensa multa ut daret orationibus sanctorum omnium super altare aureum quod est ante thronum"
      en: "And another angel came, and stood before the altar, having a golden censer; and there was given to him much incense, that he should offer of the prayers of all saints upon the golden altar, which is before the throne of God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ascendit fumus incensorum de orationibus sanctorum de manu angeli coram Deo"
      en: "And the smoke of the incense of the prayers of the saints ascended up before God from the hand of the angel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et accepit angelus turibulum et implevit illud de igne altaris et misit in terram et facta sunt tonitrua et voces et fulgora et terraemotus"
      en: "And the angel took the censer, and filled it with the fire of the altar, and cast it on the earth, and there were thunders and voices and lightnings, and a great earthquake."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et septem angeli qui habebant septem tubas paraverunt se ut tuba canerent"
      en: "And the seven angels, who had the seven trumpets, prepared themselves to sound the trumpet."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et primus tuba cecinit et facta est grando et ignis mixta in sanguine et missum est in terram et tertia pars terrae conbusta est et tertia pars arborum conbusta est et omne faenum viride conbustum est"
      en: "And the first angel sounded the trumpet, and there followed hail and fire, mingled with blood, and it was cast on the earth, and the third part of the earth was burnt up, and the third part of the trees was burnt up, and all green grass was burnt up."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et secundus angelus tuba cecinit et tamquam mons magnus igne ardens missus est in mare et facta est tertia pars maris sanguis"
      en: "And the second angel sounded the trumpet: and as it were a great mountain, burning with fire, was cast into the sea, and the third part of the sea became blood:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et mortua est tertia pars creaturae quae habent animas et tertia pars navium interiit"
      en: "And the third part of those creatures died, which had life in the sea, and the third part of the ships was destroyed."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et tertius angelus tuba cecinit et cecidit de caelo stella magna ardens tamquam facula et cecidit in tertiam partem fluminum et in fontes aquarum"
      en: "And the third angel sounded the trumpet, and a great star fell from heaven, burning as it were a torch, and it fell on the third part of the rivers, and upon the fountains of waters:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et nomen stellae dicitur Absinthius et facta est tertia pars aquarum in absinthium et multi hominum mortui sunt de aquis quia amarae factae sunt"
      en: "And the name of the star is called Wormwood. And the third part of the waters became wormwood; and many men died of the waters, because they were made bitter."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et quartus angelus tuba cecinit et percussa est tertia pars solis et tertia pars lunae et tertia pars stellarum ut obscuraretur tertia pars eorum et diei non luceret pars tertia et nox similiter"
      en: "And the fourth angel sounded the trumpet, and the third part of the sun was smitten, and the third part of the moon, and the third part of the stars, so that the third part of them was darkened, and the day did not shine for a third part of it, and the night in like manner."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et vidi et audivi vocem unius aquilae volantis per medium caelum dicentis voce magna vae vae vae habitantibus in terra de ceteris vocibus tubae trium angelorum qui erant tuba canituri"
      en: "And I beheld, and heard the voice of one eagle flying through the midst of heaven, saying with a loud voice: Woe, woe, woe to the inhabitants of the earth: by reason of the rest of the voices of the three angels, who are yet to sound the trumpet."
    status: { la: verified, en: verified }
