# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 16
verses:
  - n: 1
    text:
      la: "igitur Sarai uxor Abram non genuerat liberos sed habens ancillam aegyptiam nomine Agar"
      en: "Now Sarai the wife of Abram, had brought forth no children; having a handmaid, an Egyptian, named Agar,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixit marito suo ecce conclusit me Dominus ne parerem ingredere ad ancillam meam si forte saltem ex illa suscipiam filios cumque ille adquiesceret deprecanti"
      en: "She said to her husband: Behold, the Lord hath restrained me from bearing: go in unto my handmaid, it may be I may have children of her at least. And when he agreed to her request,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "tulit Agar Aegyptiam ancillam suam post annos decem quam habitare coeperant in terra Chanaan et dedit eam viro suo uxorem"
      en: "She took Agar the Egyptian her handmaid, ten years after they first dwelt in the land of Chanaan, and gave her to her husband to wife."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui ingressus est ad eam at illa concepisse se videns despexit dominam suam"
      en: "And he went in to her. But she, perceiving that she was with child, despised her mistress."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixitque Sarai ad Abram inique agis contra me ego dedi ancillam meam in sinum tuum quae videns quod conceperit despectui me habet iudicet Dominus inter me et te"
      en: "And Sarai said to Abram: Thou dost unjustly with me: I gave my handmaid into thy bosom, and she perceiving herself to be with child, despiseth me. The Lord judge between me and thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "cui respondens Abram ecce ait ancilla tua in manu tua est utere ea ut libet adfligente igitur eam Sarai fugam iniit"
      en: "And Abram made answer, and said to her: Behold thy handmaid is in thy own hand, use her its it pleaseth thee. And when Sarai afflicted her, she ran away."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "cumque invenisset illam angelus Domini iuxta fontem aquae in solitudine qui est in via Sur"
      en: "And the angel of the Lord having found her, by a fountain of water in the wilderness, which is in the way to Sur in the desert,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixit ad eam Agar ancilla Sarai unde venis et quo vadis quae respondit a facie Sarai dominae meae ego fugio"
      en: "He said to her: Agar, handmaid of Sarai, whence comest thou? and whither goest thou? And she answered: I flee from the face of Sarai, my mistress."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dixitque ei angelus Domini revertere ad dominam tuam et humiliare sub manibus ipsius"
      en: "And the angel of the Lord said to her: Return to thy mistress, and humble thyself under her hand."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et rursum multiplicans inquit multiplicabo semen tuum et non numerabitur prae multitudine"
      en: "And again he said: I will multiply thy seed exceedingly, and it shall not be numbered for multitude."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ac deinceps ecce ait concepisti et paries filium vocabisque nomen eius Ismahel eo quod audierit Dominus adflictionem tuam"
      en: "And again: Behold, said he, thou art with child, and thou shalt bring forth a son: and thou shalt call his name Ismael, because the Lord hath heard thy affliction."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "hic erit ferus homo manus eius contra omnes et manus omnium contra eum et e regione universorum fratrum suorum figet tabernacula"
      en: "He shall be a wild man: his hand will be against all men, and all men's hands against him: and he shall pitch his tents over against all his brethren."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "vocavit autem nomen Domini qui loquebatur ad eam Tu Deus qui vidisti me dixit enim profecto hic vidi posteriora videntis me"
      en: "And she called the name of the Lord that spoke unto her: Thou the God who hast seen me. For she said: Verily here have I seen the hinder parts of him that seeth me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "propterea appellavit puteum illum puteum Viventis et videntis me ipse est inter Cades et Barad"
      en: "Therefore she called that well, The well of him that liveth and seeth me. The same is between Cades and Bared."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "peperitque Abrae filium qui vocavit nomen eius Ismahel"
      en: "And Agar brought forth a son to Abram: who called his name Ismael."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "octoginta et sex annorum erat quando peperit ei Agar Ismahelem"
      en: "Abram was fourscore and six years old when Agar brought him forth Ismael."
    status: { la: verified, en: verified }
