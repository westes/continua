# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: act
chapter: 24
verses:
  - n: 1
    text:
      la: "post quinque autem dies descendit princeps sacerdotum Ananias cum senioribus quibusdam et Tertullo quodam oratore qui adierunt praesidem adversus Paulum"
      en: "And after five days the high priest Ananias came down, with some of the ancients, and one Tertullus an orator, who went to the governor against Paul."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et citato Paulo coepit accusare Tertullus dicens cum in multa pace agamus per te et multa corrigantur per tuam providentiam"
      en: "And Paul being called for, Tertullus began to accuse him, saying: Whereas through thee we live in much peace, and many things are rectified by thy providence,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "semper et ubique suscipimus optime Felix cum omni gratiarum actione"
      en: "We accept it always and in all places, most excellent Felix, with all thanksgiving."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ne diutius autem te protraham oro breviter audias nos pro tua clementia"
      en: "But that I be no further tedious to thee, I desire thee of thy clemency to hear us in few words."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "invenimus hunc hominem pestiferum et concitantem seditiones omnibus Iudaeis in universo orbe et auctorem seditionis sectae Nazarenorum"
      en: "We have found this to be a pestilent man, and raising seditions among all the Jews throughout the world, and author of the sedition of the sect of the Nazarenes."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui etiam templum violare conatus est quem et adprehendimus"
      en: "Who also hath gone about to profane the temple: whom, we having apprehended, would also have judged according to our law."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "[]"
      en: "But Lysias the tribune coming upon us, with great violence took him away out of our hands;"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "a quo poteris ipse iudicans de omnibus istis cognoscere de quibus nos accusamus eum"
      en: "Commanding his accusers to come to thee: of whom thou mayest thyself, by examination, have knowledge of all these things, whereof we accuse him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "adiecerunt autem et Iudaei dicentes haec ita se habere"
      en: "And the Jews also added, and said that these things were so."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "respondit autem Paulus annuente sibi praeside dicere ex multis annis esse te iudicem genti huic sciens bono animo pro me satisfaciam"
      en: "Then Paul answered, (the governor making a sign to him to speak:) Knowing that for many years thou hast been judge over this nation, I will with good courage answer for myself."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "potes enim cognoscere quia non plus sunt dies mihi quam duodecim ex quo ascendi adorare in Hierusalem"
      en: "For thou mayest understand, that there are yet but twelve days, since I went up to adore in Jerusalem:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et neque in templo invenerunt me cum aliquo disputantem aut concursum facientem turbae neque in synagogis neque in civitate"
      en: "And neither in the temple did they find me disputing with any man, or causing any concourse of the people, neither in the synagogues, nor in the city:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "neque probare possunt tibi de quibus nunc accusant me"
      en: "Neither can they prove unto thee the things whereof they now accuse me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "confiteor autem hoc tibi quod secundum sectam quam dicunt heresim sic deservio patrio Deo meo credens omnibus quae in lege et prophetis scripta sunt"
      en: "But this I confess to thee, that according to the way, which they call a heresy, so do I serve the Father and my God, believing all things which are written in the law and the prophets:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "spem habens in Deum quam et hii ipsi expectant resurrectionem futuram iustorum et iniquorum"
      en: "Having hope in God, which these also themselves look for, that there shall be a resurrection of the just and unjust."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "in hoc et ipse studeo sine offendiculo conscientiam habere ad Deum et ad homines semper"
      en: "And herein do I endeavour to have always a conscience without offence toward God, and towards men."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "post annos autem plures elemosynas facturus in gentem meam veni et oblationes et vota"
      en: "Now after many years, I came to bring alms to my nation, and offerings, and vows."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "in quibus invenerunt me purificatum in templo non cum turba neque cum tumultu"
      en: "In which I was found purified in the temple: neither with multitude, nor with tumult."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quidam autem ex Asia Iudaei quos oportebat apud te praesto esse et accusare si quid haberent adversum me"
      en: "But certain Jews of Asia, who ought to be present before thee, and to accuse, if they had any thing against me:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "aut hii ipsi dicant si quid invenerunt in me iniquitatis cum stem in concilio"
      en: "Or let these men themselves say, if they found in me any iniquity, when standing before the council,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "nisi de una hac solummodo voce qua clamavi inter eos stans quoniam de resurrectione mortuorum ego iudicor hodie a vobis"
      en: "Except it be for this one voice only that I cried, standing among them, Concerning the resurrection of the dead am I judged this day by you."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "distulit autem illos Felix certissime sciens de via dicens cum tribunus Lysias descenderit audiam vos"
      en: "And Felix put them off, having most certain knowledge of this way, saying: When Lysias the tribune shall come down, I will hear you."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "iussitque centurioni custodiri eum et habere requiem nec quemquam prohibere de suis ministrare ei"
      en: "And he commanded a centurion to keep him, and that he should be easy, and that he should not prohibit any of his friends to minister unto him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "post aliquot autem dies veniens Felix cum Drusilla uxore sua quae erat Iudaea vocavit Paulum et audivit ab eo fidem quae est in Iesum Christum"
      en: "And after some days, Felix, coming with Drusilla his wife, who was a Jew, sent for Paul, and heard of him the faith, that is in Christ Jesus."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "disputante autem illo de iustitia et castitate et de iudicio futuro timefactus Felix respondit quod nunc adtinet vade tempore autem oportuno accersiam te"
      en: "And as he treated of justice, and chastity, and of the judgment to come, Felix being terrified, answered: For this time, go thy way: but when I have a convenient time, I will send for thee."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "simul et sperans quia pecunia daretur a Paulo propter quod et frequenter accersiens eum loquebatur cum eo"
      en: "Hoping also withal, that money should be given him by Paul; for which cause also oftentimes sending for him, he spoke with him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "biennio autem expleto accepit successorem Felix Porcium Festum volens autem gratiam praestare Iudaeis Felix reliquit Paulum vinctum"
      en: "But when two years were ended, Felix had for successor Portius Festus. And Felix being willing to shew the Jews a pleasure, left Paul bound."
    status: { la: verified, en: verified }
