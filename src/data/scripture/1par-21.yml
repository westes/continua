# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1par
chapter: 21
verses:
  - n: 1
    text:
      la: "consurrexit autem Satan contra Israhel et incitavit David ut numeraret Israhel"
      en: "And Satan rose up against Israel: and moved David to number Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixitque David ad Ioab et ad principes populi ite et numerate Israhel a Bersabee usque Dan et adferte mihi numerum ut sciam"
      en: "And David said to Joab, and to the rulers of the people: Go, and number Israel from Bersabee even to Dan, and bring me the number of them that I may know it."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "responditque Ioab augeat Dominus populum suum centuplum quam sunt nonne domine mi rex omnes servi tui sunt quare hoc quaerit dominus meus quod in peccatum reputetur Israheli"
      en: "And Joab answered: The Lord make his people a hundred times more than they are : but, my lord the king, are they not all thy servants: why doth my lord seek this thing, which may be imputed as a sin to Israel?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sed sermo regis magis praevaluit egressusque est Ioab et circuivit universum Israhel et reversus est Hierusalem"
      en: "But the king's word rather prevailed: and Joab departed, and went through all Israel: and returned to Jerusalem."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "deditque David numerum eorum quos circumierat et inventus est omnis Israhel numerus mille milia et centum milia virorum educentium gladium de Iuda autem trecenta septuaginta milia bellatorum"
      en: "And he gave David the number of them, whom he had surveyed: and all the number of Israel was found to be eleven hundred thousand men that drew the sword: and of Juda four hundred and seventy thousand fighting men."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "nam Levi et Beniamin non numeravit eo quod invitus exsequeretur regis imperium"
      en: "But Levi and Benjamin he did not number: for Joab unwillingly executed the king's orders."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "displicuit autem Deo quod iussum erat et percussit Israhel"
      en: "And God was displeased with this thing that was commanded: and he struck Israel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixitque David ad Deum peccavi nimis ut hoc facerem obsecro aufer iniquitatem servi tui quia insipienter egi"
      en: "8oor of Ornan the Jebusite."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et locutus est Dominus ad Gad videntem David dicens"
      en: "And the Lord spoke to Gad the seer of David, saying:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "vade et loquere ad David et dic haec dicit Dominus trium tibi optionem do unum quod volueris elige et faciam tibi"
      en: "Go, and speak to David, and tell him: Thus saith the Lord: I give thee the choice of three things: choose one which thou wilt, and I will do it to thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cumque venisset Gad ad David dixit ei haec dicit Dominus elige quod volueris"
      en: "And when Gad was come to David, he said to him: Thus saith the Lord: choose which thou wilt:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "aut tribus annis pestilentiam aut tribus mensibus fugere te hostes tuos et gladium eorum non posse evadere aut tribus diebus gladium Domini et mortem versari in terra et angelum Domini interficere in universis finibus Israhel nunc igitur vide quid respondeam ei qui misit me"
      en: "Either three years' famine: or three months to flee from thy enemies, and not to be able to escape their sword: or three days to have the sword of the Lord, and pestilence in the land, and the angel of the Lord destroying in all the coasts of Israel: now therefore see what I shall answer him who sent me."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et dixit David ad Gad ex omni parte me angustiae premunt sed melius mihi est ut incidam in manus Domini quia multae sunt miserationes eius quam in manus hominum"
      en: "And David said to Gad: I am on every side in a great strait: but it is better for me to fall into the hands of the Lord, for his mercies are many, than into the hands of men."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "misit ergo Dominus pestilentiam in Israhel et ceciderunt de Israhel septuaginta milia virorum"
      en: "So the Lord sent a pestilence upon Israel. And there fell of Israel seventy thousand men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "misit quoque angelum in Hierusalem ut percuteret eam cumque percuteretur vidit Dominus et misertus est super magnitudinem mali et imperavit angelo qui percutiebat sufficit iam cesset manus tua porro angelus Domini stabat iuxta aream Ornan Iebusei"
      en: "And he sent an angel to Jerusalem, to strike it: and as he was striking it, the Lord beheld, and took pity for the greatness of the evil: and said to the angel that destroyed: It is enough, now stop thy hand. And the angel of the Lord stood by the thrashing"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "levansque David oculos suos vidit angelum Domini stantem inter terram et caelum et evaginatum gladium in manu eius et versum contra Hierusalem et ceciderunt tam ipse quam maiores natu vestiti ciliciis et proni in terram"
      en: "And David lifting up his eyes, saw the angel of the Lord standing between heaven and earth, with a drawn sword in his hand, turned against Jerusalem: and both he and the ancients clothed in haircloth, fell down flat on the ground."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dixitque David ad Deum nonne ego sum qui iussi ut numeraretur populus ego qui peccavi ego qui malum feci iste grex quid commeruit Domine Deus meus vertatur obsecro manus tua in me et in domum patris mei populus autem tuus non percutiatur"
      en: "And David said to God: Am not I he that commanded the people to be numbered? It is I that have sinned: it is I that have done the evil: but as for this flock, what hath it deserved? O Lord my God, let thy hand be turned, I beseech thee, upon me, and upon my father's house: and let not thy people be destroyed."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "angelus autem Domini praecepit Gad ut diceret David et ascenderet extrueretque altare Domino Deo in area Ornan Iebusei"
      en: "And the angel of the Lord commanded Gad to tell David, to go up, and build an altar to the Lord God in the thrashingfloor of Ornan the Jebusite."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ascendit ergo David iuxta sermonem Gad quem locutus fuerat ex nomine Domini"
      en: "and David went up, according to the word of Gad, which he spoke to him in the name of the Lord."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "porro Ornan cum suspexisset et vidisset angelum quattuorque filii eius cum eo absconderunt se nam eo tempore terebat in area triticum"
      en: "Now when Ornan looked up, and saw the angel, he and his four sons hid themselves: for at that time he was thrashing wheat in the floor."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "igitur cum venisset David ad Ornan conspexit eum Ornan et processit ei obviam de area et adoravit illum pronus in terram"
      en: "And as David was coming to Ornan, Ornan saw him, and went out of the thrashingfloor to meet him, and bowed down to him with his face to the ground."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "dixitque ei David da mihi locum areae tuae ut aedificem in ea altare Domini ita ut quantum valet argenti accipias et cesset plaga a populo"
      en: "And David said to him: Give me this place of thy thrashingfloor, that I may build therein an altar to the Lord: but thou shalt take of me as much money as it is worth, that the plague may cease from the people."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "dixit autem Ornan ad David tolle et faciat dominus meus rex quodcumque ei placet sed et boves do in holocaustum et tribulas in ligna et triticum in sacrificium omnia libens praebeo"
      en: "And Ornan said to David: Take it, and let my lord the king do all that pleaseth him: and moreover the oxen also I give for a holocaust, and the drays for wood, and the wheat for the sacrifice: I will give it all willingly."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "dixitque ei rex David nequaquam ita fiet sed argentum dabo quantum valet neque enim tibi auferre debeo et sic offerre Domino holocausta gratuita"
      en: "And king David said to him: It shall not be so, but I will give thee money as much se it is worth: for I must not take it from thee, and so offer to the Lord holocausts free cost."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "dedit ergo David Ornan pro loco siclos auri iustissimi ponderis sescentos"
      en: "So David gave to Ornan for the place, six hundred sides of gold of just weight."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et aedificavit ibi altare Domino obtulitque holocausta et pacifica et invocavit Dominum et exaudivit eum in igne de caelo super altare holocausti"
      en: "And he built there an altar to the Lord: and he offered holocausts, and peace offerings, and he called upon the Lord, and he heard him by sending Are from heaven upon the altar of the holocaust."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "praecepitque Dominus angelo et convertit gladium suum in vaginam"
      en: "And the Lord commanded the angel: and he put up his sword again into the sheath."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "protinus ergo David videns quod exaudisset eum Dominus in area Ornan Iebusei immolavit ibi victimas"
      en: "And David seeing that the Lord had heard him in the thrashingfloor of Oman the Jebusite, forthwith offered victims there."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "tabernaculum autem Domini quod fecerat Moses in deserto et altare holocaustorum ea tempestate erat in excelso Gabaon"
      en: "But the tabernacle of the Lord, which Moses made in the desert, and the altar of holocausts, was at that time in the high place of Gabaon."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et non praevaluit David ire ad altare ut ibi obsecraret Deum nimio enim fuerat timore perterritus videns gladium angeli Domini"
      en: "And David could not go to the altar there to pray to God: for he was seized with an exceeding great fear, seeing the sword of the angel of the Lord."
    status: { la: verified, en: verified }
