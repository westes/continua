# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1par
chapter: 21
verses:
  - n: 1
    text:
      la: "Consurrexit autem Satan contra Israel, et concitavit David ut numeraret Israel."
      en: "And Satan rose up against Israel: and moved David to number Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dixitque David ad Joab, et ad principes populi: Ite, et numerate Israel a Bersabee usque Dan: et afferte mihi numerum ut sciam."
      en: "And David said to Joab, and to the rulers of the people: Go, and number Israel from Bersabee even to Dan, and bring me the number of them that I may know it."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Responditque Joab: Augeat Dominus populum suum centuplum, quam sunt: nonne, domine mi rex, omnes servi tui sunt? quare hoc quaerit dominus meus, quod in peccatum reputetur Israeli?"
      en: "And Joab answered: The Lord make his people a hundred times more than they are: but, my lord the king, are they not all thy servants: why doth my lord seek this thing, which may be imputed as a sin to Israel?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Sed sermo regis magis praevaluit: egressusque est Joab, et circuivit universum Israel: et reversus est Jerusalem,"
      en: "But the king's word rather prevailed: and Joab departed, and went through all Israel: and returned to Jerusalem."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "deditque David numerum eorum, quos circuierat: et inventus est omnis numerus Israel, mille millia et centum millia virorum educentium gladium: de Juda autem quadringenta septuaginta millia bellatorum."
      en: "And he gave David the number of them, whom he had surveyed: and all the number of Israel was found to be eleven hundred thousand men that drew the sword: and of Juda four hundred and seventy thousand fighting men."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Nam Levi et Benjamin non numeravit: eo quod Joab invitus exequeretur regis imperium."
      en: "But Levi and Benjamin he did not number: for Joab unwillingly executed the king's orders."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Displicuit autem Deo quod jussum erat: et percussit Israel."
      en: "And God was displeased with this thing that was commanded: and he struck Israel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dixitque David ad Deum: Peccavi nimis ut hoc facerem: obsecro, aufer iniquitatem servi tui, quia insipienter egi."
      en: "And David said to God: I have sinned exceedingly in doing this: I beseech thee take away the iniquity of thy servant, for I have done foolishly."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et locutus est Dominus ad Gad videntem David, dicens:"
      en: "And the Lord spoke to Gad the seer of David, saying:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Vade, et loquere ad David, et dic ei: Haec dicit Dominus: Trium tibi optionem do: unum, quod volueris, elige, et faciam tibi."
      en: "Go, and speak to David, and tell him: Thus saith the Lord: I give thee the choice of three things: choose one which thou wilt, and I will do it to thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cumque venisset Gad ad David, dixit ei: Haec dicit Dominus: Elige, quod volueris:"
      en: "And when Gad was come to David, he said to him: Thus saith the Lord: choose which thou wilt:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "aut tribus annis famem; aut tribus mensibus te fugere hostes tuos, et gladium eorum non posse evadere; aut tribus diebus gladium Domini, et pestilentiam versari in terra, et angelum Domini interficere in universis finibus Israel: nunc igitur vide quid respondeam ei, qui misit me."
      en: "Either three years' famine: or three months to flee from thy enemies, and not to be able to escape their sword: or three days to have the sword of the Lord, and pestilence in the land, and the angel of the Lord destroying in all the coasts of Israel: now therefore see what I shall answer him who sent me."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et dixit David ad Gad: Ex omni parte me angustiae premunt: sed melius mihi est, ut incidam in manus Domini, quia multae sunt miserationes ejus, quam in manus hominum."
      en: "And David said to Gad: I am on every side in a great strait: but it is better for me to fall into the hands of the Lord, for his mercies are many, than into the hands of men."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Misit ergo Dominus pestilentiam in Israel: et ceciderunt de Israel septuaginta millia virorum."
      en: "So the Lord sent a pestilence upon Israel. And there fell of Israel seventy thousand men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Misit quoque angelum in Jerusalem, ut percuteret eam: cumque percuteretur, vidit Dominus, et misertus est super magnitudine mali: et imperavit angelo, qui percutiebat: Sufficit, jam cesset manus tua. Porro angelus Domini stabat juxta aream Ornam Jebusaei."
      en: "And he sent an angel to Jerusalem, to strike it: and as he was striking it, the Lord beheld, and took pity for the greatness of the evil: and said to the angel that destroyed: It is enough, now stop thy hand. And the angel of the Lord stood by the thrashing floor of Ornan the Jebusite."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Levansque David oculos suos, vidit angelum Domini stantem inter caelum et terram, et evaginatum gladium in manu ejus, et versum contra Jerusalem: et ceciderunt tam ipse, quam majores natu, vestiti ciliciis, proni in terram."
      en: "And David lifting up his eyes, saw the angel of the Lord standing between heaven and earth, with a drawn sword in his hand, turned against Jerusalem: and both he and the ancients clothed in haircloth, fell down flat on the ground."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dixitque David ad Deum: Nonne ego sum, qui jussi ut numeraretur populus? ego, qui peccavi; ego, qui malum feci? iste grex, quid commeruit? Domine Deus meus, vertatur, obsecro, manus tua in me, et in domum patris mei: populus autem tuus non percutiatur."
      en: "And David said to God: Am not I he that commanded the people to be numbered? It is I that have sinned: it is I that have done the evil: but as for this flock, what hath it deserved? O Lord my God, let thy hand be turned, I beseech thee, upon me, and upon my father's house: and let not thy people be destroyed."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Angelus autem Domini praecepit Gad ut diceret Davidi ut ascenderet, exstrueretque altare Domino Deo in area Ornan Jebusaei."
      en: "And the angel of the Lord commanded Gad to tell David, to go up, and build an altar to the Lord God in the threshingfloor of Ornan the Jebusite."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ascendit ergo David juxta sermonem Gad, quem locutus ei fuerat ex nomine Domini."
      en: "And David went up, according to the word of Gad, which he spoke to him in the name of the Lord."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Porro Ornan cum suspexisset, et vidisset angelum, quatuorque filii ejus cum eo, absconderunt se: nam eo tempore terebat in area triticum."
      en: "Now when Ornan looked up, and saw the angel, he and his four sons hid themselves: for at that time he was thrashing wheat in the floor."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Igitur cum veniret David ad Ornan, conspexit eum Ornan, et processit ei obviam de area, et adoravit eum pronus in terram."
      en: "And as David was coming to Ornan, Ornan saw him, and went out of the threshingfloor to meet him, and bowed down to him with his face to the ground."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Dixitque ei David: Da mihi locum areae tuae, ut aedificem in ea altare Domino: ita ut quantum valet argenti accipias, et cesset plaga a populo."
      en: "And David said to him: Give me this place of thy threshingfloor, that I may build therein an altar to the Lord: but thou shalt take of me as much money as it is worth, that the plague may cease from the people."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Dixit autem Ornan ad David: Tolle, et faciat dominus meus rex quodcumque ei placet: sed et boves do in holocaustum, et tribulas in ligna, et triticum in sacrificium: omnia libens praebebo."
      en: "And Ornan said to David: Take it, and let my lord the king do all that pleaseth him: and moreover the oxen also I give for a holocaust, and the drays for wood, and the wheat for the sacrifice: I will give it all willingly."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Dixitque ei rex David: Nequaquam ita fiet, sed argentum dabo quantum valet: neque enim tibi auferre debeo, et sic offerre Domino holocausta gratuita."
      en: "And king David said to him: It shall not be so, but I will give thee money as much as it is worth: for I must not take it from thee, and so offer to the Lord holocausts free cost."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Dedit ergo David Ornan pro loco siclos auri justissimi ponderis sexcentos."
      en: "So David gave to Ornan for the place, six hundred sicles of gold of just weight."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et aedificavit ibi altare Domino, obtulitque holocausta, et pacifica, et invocavit Dominum, et exaudivit eum in igne de caelo super altare holocausti."
      en: "And he built there an altar to the Lord: and he offered holocausts, and peace offerings, and he called upon the Lord, and he heard him by sending fire from heaven upon the altar of the holocaust."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Praecepitque Dominus angelo: et convertit gladium suum in vaginam."
      en: "And the Lord commanded the angel: and he put up his sword again into the sheath."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Protinus ergo David, videns quod exaudisset eum Dominus in area Ornan Jebusaei, immolavit ibi victimas."
      en: "And David seeing that the Lord had heard him in the threshingfloor of Ornan the Jebusite, forthwith offered victims there."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Tabernaculum autem Domini, quod fecerat Moyses in deserto, et altare holocaustorum, ea tempestate erat in excelso Gabaon."
      en: "But the tabernacle of the Lord, which Moses made in the desert, and the altar of holocausts, was at that time in the high place of Gabaon."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et non praevaluit David ire ad altare ut ibi obsecraret Deum: nimio enim fuerat in timore perterritus, videns gladium angeli Domini."
      en: "And David could not go to the altar there to pray to God: for he was seized with an exceeding great fear, seeing the sword of the angel of the Lord."
    status: { la: verified, en: verified }
