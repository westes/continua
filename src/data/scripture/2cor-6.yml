book: 2cor
chapter: 6
verses:
  - n: 1
    text:
      la: "adiuvantes autem et exhortamur ne in vacuum gratiam Dei recipiatis"
      en: "And we helping do exhort you, that you receive not the grace of God in vain."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ait enim tempore accepto exaudivi te et in die salutis adiuvavi te ecce nunc tempus acceptabile ecce nunc dies salutis"
      en: "For he saith: In an accepted time have I heard thee; and in the day of salvation have I helped thee. Behold, now is the acceptable time; behold, now is the day of salvation."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "nemini dantes ullam offensionem ut non vituperetur ministerium"
      en: "Giving no offence to any man, that our ministry be not blamed:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sed in omnibus exhibeamus nosmet ipsos sicut Dei ministros in multa patientia in tribulationibus in necessitatibus in angustiis"
      en: "But in all things let us exhibit ourselves as the ministers of God, in much patience, in tribulation, in necessities, in distresses,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "in plagis in carceribus in seditionibus in laboribus in vigiliis in ieiuniis"
      en: "In stripes, in prisons, in seditions, in labours, in watchings, in fastings,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in castitate in scientia in longanimitate in suavitate in Spiritu Sancto in caritate non ficta"
      en: "In chastity, in knowledge, in longsuffering, in sweetness, in the Holy Ghost, in charity unfeigned,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in verbo veritatis in virtute Dei per arma iustitiae a dextris et sinistris"
      en: "In the word of truth, in the power of God; by the armour of justice on the right hand and on the left;"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "per gloriam et ignobilitatem per infamiam et bonam famam ut seductores et veraces sicut qui ignoti et cogniti"
      en: "By honour and dishonour, by evil report and good report; as deceivers, and yet true; as unknown, and yet known;"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quasi morientes et ecce vivimus ut castigati et non mortificati"
      en: "As dying, and behold we live; as chastised, and not killed;"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quasi tristes semper autem gaudentes sicut egentes multos autem locupletantes tamquam nihil habentes et omnia possidentes"
      en: "As sorrowful, yet always rejoicing; as needy, yet enriching many; as having nothing, and possessing all things."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "os nostrum patet ad vos o Corinthii cor nostrum dilatatum est"
      en: "Our mouth is open to you, O ye Corinthians, our heart is enlarged."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "non angustiamini in nobis angustiamini autem in visceribus vestris"
      en: "You are not straitened in us, but in your own bowels you are straitened."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "eandem autem habentes remunerationem tamquam filiis dico dilatamini et vos"
      en: "But having the same recompense, (I speak as to my children,) be you also enlarged."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "nolite iugum ducere cum infidelibus quae enim participatio iustitiae cum iniquitate aut quae societas luci ad tenebras"
      en: "Bear not the yoke with unbelievers. For what participation hath justice with injustice? Or what fellowship hath light with darkness?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quae autem conventio Christi ad Belial aut quae pars fideli cum infidele"
      en: "And what concord hath Christ with Belial? Or what part hath the faithful with the unbeliever?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "qui autem consensus templo Dei cum idolis vos enim estis templum Dei vivi sicut dicit Deus quoniam inhabitabo in illis et inambulabo et ero illorum Deus et ipsi erunt mihi populus"
      en: "And what agreement hath the temple of God with idols? For you are the temple of the living God; as God saith: I will dwell in them, and walk among them; and I will be their God, and they shall be my people."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "propter quod exite de medio eorum et separamini dicit Dominus et inmundum ne tetigeritis"
      en: "Wherefore, Go out from among them, and be ye separate, saith the Lord, and touch not the unclean thing:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ego recipiam vos et ero vobis in patrem et vos eritis mihi in filios et filias dicit Dominus omnipotens"
      en: "And I will receive you; and I will be a Father to you; and you shall be my sons and daughters, saith the Lord Almighty."
    status: { la: verified, en: verified }
