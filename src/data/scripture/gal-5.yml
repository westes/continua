# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gal
chapter: 5
verses:
  - n: 1
    text:
      la: "state et nolite iterum iugo servitutis contineri"
      en: "Stand fast, and be not held again under the yoke of bondage."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ecce ego Paulus dico vobis quoniam si circumcidamini Christus vobis nihil proderit"
      en: "Behold, I Paul tell you, that if you be circumcised, Christ shall profit you nothing."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "testificor autem rursum omni homini circumcidenti se quoniam debitor est universae legis faciendae"
      en: "And I testify again to every man circumcising himself, that he is a debtor to the whole law."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "evacuati estis a Christo qui in lege iustificamini a gratia excidistis"
      en: "You are made void of Christ, you who are justified in the law: you are fallen from grace."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "nos enim spiritu ex fide spem iustitiae expectamus"
      en: "For we in spirit, by faith, wait for the hope of justice."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "nam in Christo Iesu neque circumcisio aliquid valet neque praeputium sed fides quae per caritatem operatur"
      en: "For in Christ Jesus neither circumcision availeth any thing, nor uncircumcision: but faith that worketh by charity."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "currebatis bene quis vos inpedivit veritati non oboedire"
      en: "You did run well, who hath hindered you, that you should not obey the truth?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "persuasio non est ex eo qui vocat vos"
      en: "This persuasion is not from him that calleth you."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "modicum fermentum totam massam corrumpit"
      en: "A little leaven corrupteth the whole lump."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ego confido in vobis in Domino quod nihil aliud sapietis qui autem conturbat vos portabit iudicium quicumque est ille"
      en: "I have confidence in you in the Lord: that you will not be of another mind: but he that troubleth you, shall bear the judgment, whosoever he be."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ego autem fratres si circumcisionem adhuc praedico quid adhuc persecutionem patior ergo evacuatum est scandalum crucis"
      en: "And I, brethren, if I yet preach circumcision, why do I yet suffer persecution? Then is the scandal of the cross made void."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "utinam et abscidantur qui vos conturbant"
      en: "I would they were even cut off, who trouble you."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "vos enim in libertatem vocati estis fratres tantum ne libertatem in occasionem detis carnis sed per caritatem servite invicem"
      en: "For you, brethren, have been called unto liberty: only make not liberty an occasion to the flesh, but by charity of the spirit serve one another."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "omnis enim lex in uno sermone impletur diliges proximum tuum sicut te ipsum"
      en: "For all the law is fulfilled in one word: Thou shalt love thy neighbour as thyself."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quod si invicem mordetis et comeditis videte ne ab invicem consumamini"
      en: "But if you bite and devour one another; take heed you be not consumed one of another."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dico autem spiritu ambulate et desiderium carnis non perficietis"
      en: "I say then, walk in the spirit, and you shall not fulfil the lusts of the flesh."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "caro enim concupiscit adversus spiritum spiritus autem adversus carnem haec enim invicem adversantur ut non quaecumque vultis illa faciatis"
      en: "For the flesh lusteth against the spirit: and the spirit against the flesh; for these are contrary one to another: so that you do not the things that you would."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quod si spiritu ducimini non estis sub lege"
      en: "But if you are led by the spirit, you are not under the law."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "manifesta autem sunt opera carnis quae sunt fornicatio inmunditia luxuria"
      en: "Now the works of the flesh are manifest, which are fornication, uncleanness, immodesty, luxury,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "idolorum servitus veneficia inimicitiae contentiones aemulationes irae rixae dissensiones sectae"
      en: "Idolatry, witchcrafts, enmities, contentions, emulations, wraths, quarrels, dissensions, sects,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "invidiae homicidia ebrietates comesationes et his similia quae praedico vobis sicut praedixi quoniam qui talia agunt regnum Dei non consequentur"
      en: "Envies, murders, drunkenness, revellings, and such like. Of the which I foretell you, as I have foretold to you, that they who do such things shall not obtain the kingdom of God."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "fructus autem Spiritus est caritas gaudium pax longanimitas bonitas benignitas"
      en: "But the fruit of the Spirit is, charity, joy, peace, patience, benignity, goodness, longanimity,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "fides modestia continentia adversus huiusmodi non est lex"
      en: "Mildness, faith, modesty, continency, chastity. Against such there is no law."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "qui autem sunt Christi carnem crucifixerunt cum vitiis et concupiscentiis"
      en: "And they that are Christ's, have crucified their flesh, with the vices and concupiscences."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "si vivimus spiritu spiritu et ambulemus"
      en: "If we live in the Spirit, let us also walk in the Spirit."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "non efficiamur inanis gloriae cupidi invicem provocantes invicem invidentes"
      en: "Let us not be made desirous of vain glory, provoking one another, envying on another."
    status: { la: verified, en: verified }
