# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: rom
chapter: 4
verses:
  - n: 1
    text:
      la: "Quid ergo dicemus invenisse Abraham patrem nostrum secundum carnem?"
      en: "What shall we say then that Abraham hath found, who is our father according to the flesh."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Si enim Abraham ex operibus justificatus est, habet gloriam, sed non apud Deum."
      en: "For if Abraham were justified by works, he hath whereof to glory, but not before God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quid enim dicit Scriptura? Credidit Abraham Deo, et reputatam est illi ad justitiam."
      en: "For what saith the scripture? Abraham believed God, and it was reputed to him unto justice."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ei autem qui operatur, merces non imputatur secundum gratiam, sed secundum debitum."
      en: "Now to him that worketh, the reward is not reckoned according to grace, but according to debt."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ei vero qui non operatur, credenti autem in eum, qui justificat impium, reputatur fides ejus ad justitiam secundum propositum gratiae Dei."
      en: "But to him that worketh not, yet believeth in him that justifieth the ungodly, his faith is reputed to justice, according to the purpose of the grace of God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Sicut et David dicit beatitudinem hominis, cui Deus accepto fert justitiam sine operibus:"
      en: "As David also termeth the blessedness of a man, to whom God reputeth justice without works:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Beati, quorum remissae sunt iniquitates, et quorum tecta sunt peccata."
      en: "Blessed are they whose iniquities are forgiven, and whose sins are covered."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Beatus vir, cui non imputavit Dominus peccatum."
      en: "Blessed is the man to whom the Lord hath not imputed sin."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Beatitudo ergo haec in circumcisione tantum manet, an etiam in praeputio? Dicimus enim quia reputata est Abrahae fides ad justitiam."
      en: "This blessedness then, doth it remain in the circumcision only, or in the uncircumcision also? For we say that unto Abraham faith was reputed to justice."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quomodo ergo reputata est? in circumcisione, an in praeputio? Non in circumcisione, sed in praeputio."
      en: "How then was it reputed? When he was in circumcision, or in uncircumcision? Not in circumcision, but in uncircumcision."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et signum accepit circumcisionis, signaculum justitiae fidei, quae est in praeputio: ut sit pater omnium credentium per praeputium, ut reputetur et illis ad justitiam:"
      en: "And he received the sign of circumcision, a seal of the justice of the faith, which he had, being uncircumcised; that he might be the father of all them that believe, being uncircumcised, that unto them also it may be reputed to justice:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et sit pater circumcisionis non iis tantum, qui sunt ex circumcisione, sed et iis qui sectantur vestigia fidei, quae est in praeputio patris nostri Abrahae."
      en: "And might be the father of circumcision; not to them only, that are of the circumcision, but to them also that follow the steps of the faithful, that is in the uncircumcision of our father Abraham."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Non enim per legem promissio Abrahae, aut semini ejus ut haeres esset mundi: sed per justitiam fidei."
      en: "For not through the law was the promise to Abraham, or to his seed, that he should be heir of the world; but through the justice of faith."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Si enim qui ex lege, haeredes sunt: exinanita est fides, abolita est promissio."
      en: "For if they who are of the law be heirs, faith is made void, the promise is made of no effect."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Lex enim iram operatur. Ubi enim non est lex, nec praevaricatio."
      en: "For the law worketh wrath. For where there is no law, neither is there transgression."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ideo ex fide, ut secundum gratiam firma sit promissio omni semini, non ei qui ex lege est solum, sed et ei qui ex fide est Abrahae, qui pater est omnium nostrum"
      en: "Therefore is it of faith, that according to grace the promise might be firm to all the seed; not to that only which is of the law, but to that also which is of the faith of Abraham, who is the father of us all,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "( sicut scriptum est: Quia patrem multarum gentium posui te) ante Deum, cui credidit, qui vivificat mortuos, et vocat ea quae non sunt, tamquam ea quae sunt:"
      en: "(As it is written: I have made thee a father of many nations,) before God, whom he believed, who quickeneth the dead; and calleth those things that are not, as those that are."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui contra spem in spem credidit, ut fieret pater multarum gentium secundum quod dictum est ei: Sic erit semen tuum."
      en: "Who against hope believed in hope; that he might be made the father of many nations, according to that which was said to him: So shall thy seed be."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et non infirmatus est fide, nec consideravit corpus suum emortuum, cum jam fere centum esset annorum, et emortuam vulvam Sarae."
      en: "And he was not weak in faith; neither did he consider his own body now dead, whereas he was almost an hundred years old, nor the dead womb of Sara."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "In repromissione etiam Dei non haesitavit diffidentia, sed confortatus est fide, dans gloriam Deo:"
      en: "In the promise also of God he staggered not by distrust; but was strengthened in faith, giving glory to God:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "plenissime sciens, quia quaecumque promisit, potens est et facere."
      en: "Most fully knowing, that whatsoever he has promised, he is able also to perform."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ideo et reputatum est illi ad justitiam."
      en: "And therefore it was reputed to him unto justice."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Non est autem scriptum tantum propter ipsum quia reputatum est illi ad justitiam:"
      en: "Now it is not written only for him, that it was reputed to him unto justice,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "sed et propter nos, quibus reputabitur credentibus in eum, qui suscitavit Jesum Christum Dominum nostrum a mortuis,"
      en: "But also for us, to whom it shall be reputed, if we believe in him, that raised up Jesus Christ, our Lord, from the dead,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "qui traditus est propter delicta nostra, et resurrexit propter justificationem nostram."
      en: "Who was delivered up for our sins, and rose again for our justification."
    status: { la: verified, en: verified }
