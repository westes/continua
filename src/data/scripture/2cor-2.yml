# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2cor
chapter: 2
verses:
  - n: 1
    text:
      la: "Statui autem hoc ipsum apud me, ne iterum in tristitia venirem ad vos."
      en: "But I determined this with myself, not to come to you again in sorrow."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Si enim ego contristo vos: et quis est, qui me laetificet, nisi qui contristatur ex me?"
      en: "For if I make you sorrowful, who is he then that can make me glad, but the same who is made sorrowful by me?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et hoc ipsum scripsi vobis, ut non cum venero, tristitiam super tristitiam habeam, de quibus oportuerat me gaudere: confidens in omnibus vobis, quia meum gaudium, omnium vestrum est."
      en: "And I wrote this same to you; that I may not, when I come, have sorrow upon sorrow, from them of whom I ought to rejoice: having confidence in you all, that my joy is the joy of you all."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nam ex multa tribulatione et angustia cordis scripsi vobis per multas lacrimas: non ut contristemini, sed ut sciatis, quam caritatem habeam abundantius in vobis."
      en: "For out of much affliction and anguish of heart, I wrote to you with many tears: not that you should be made sorrowful: but that you might know the charity I have more abundantly towards you."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Si quis autem contristavit, non me contristavit: sed ex parte, ut non onerem omnes vos."
      en: "And if any one have caused grief, he hath not grieved me; but in part, that I may not burden you all."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Sufficit illi, qui ejusmodi est, objurgatio haec, quae fit a pluribus:"
      en: "To him who is such a one, this rebuke is sufficient, which is given by many:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ita ut e contrario magis donetis, et consolemini, ne forte abundantiori tristitia absorbeatur qui ejusmodi est."
      en: "So that on the contrary, you should rather forgive him and comfort him, lest perhaps such a one be swallowed up with overmuch sorrow."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Propter quod obsecro vos, ut confirmetis in illum caritatem."
      en: "Wherefore, I beseech you, that you would confirm your charity towards him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ideo enim et scripsi, ut cognoscam experimentum vestrum, an in omnibus obedientes sitis."
      en: "For to this end also did I write, that I may know the experiment of you, whether you be obedient in all things."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Cui autem aliquid donastis, et ego: nam et ego quod donavi, si quid donavi, propter vos in persona Christi,"
      en: "And to whom you have pardoned any thing, I also. For, what I have pardoned, if I have pardoned any thing, for your sakes have I done it in the person of Christ."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ut non circumveniamur a Satana: non enim ignoramus cogitationes ejus."
      en: "That we be not overreached by Satan. For we are not ignorant of his devices."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cum venissem autem Troadem propter Evangelium Christi, et ostium mihi apertum esset in Domino,"
      en: "And when I was come to Troas for the gospel of Christ, and a door was opened unto me in the Lord,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "non habui requiem spiritui meo, eo quod non invenerim Titum fratrem meum, sed valefaciens eis, profectus sum in Macedoniam."
      en: "I had no rest in my spirit, because I found not Titus my brother; but bidding them farewell, I went into Macedonia."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Deo autem gratias, qui semper triumphat nos in Christo Jesu, et odorem notitiae suae manifestat per nos in omni loco:"
      en: "Now thanks be to God, who always maketh us to triumph in Christ Jesus, and manifesteth the odour of his knowledge by us in every place."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quia Christi bonus odor sumus Deo in iis qui salvi fiunt, et in his qui pereunt:"
      en: "For we are the good odour of Christ unto God, in them that are saved, and in them that perish."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "aliis quidem odor mortis in mortem: aliis autem odor vitae in vitam. Et ad haec quis tam idoneus?"
      en: "To the one indeed the odour of death unto death: but to the others the odour of life unto life. And for these things who is so sufficient?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "non enim sumus sicut plurimi, adulterantes verbum Dei, sed ex sinceritate, sed sicut ex Deo, coram Deo, in Christo loquimur."
      en: "For we are not as many, adulterating the word of God; but with sincerity, but as from God, before God, in Christ we speak."
    status: { la: verified, en: verified }
