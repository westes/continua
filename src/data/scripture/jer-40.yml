# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 40
verses:
  - n: 1
    text:
      la: "Sermo qui factus est ad Jeremiam a Domino, postquam dimissus est a Nabuzardan magistro militiae de Rama, quando tulit eum vinctum catenis in medio omnium qui migrabant de Jerusalem et Juda, et ducebantur in Babylonem."
      en: "The word that came to Jeremias from the Lord, after that Nabuzardan the general had let him go from Rama, when he had taken him, being bound with chains, among all them that were carried away from Jerusalem and Juda, and were carried to Babylon."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Tollens ergo princeps militiae Jeremiam, dixit ad eum: Dominus Deus tuus locutus est malum hoc super locum istum:"
      en: "And the general of the army taking Jeremias, said to him: The Lord thy God hath pronounced this evil upon this place,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et adduxit, et fecit Dominus sicut locutus est, quia peccastis Domino, et non audistis vocem ejus: et factus est vobis sermo hic."
      en: "And he hath brought it: and the Lord hath done as he hath said: because you have sinned against the Lord, and have not hearkened to his voice, and this word is come upon you."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nunc ergo ecce solvi te hodie de catenis quae sunt in manibus tuis: si placet tibi ut venias mecum in Babylonem, veni, et ponam oculos meos super te: si autem displicet tibi venire mecum in Babylonem, reside: ecce omnis terra in conspectu tuo est: quod elegeris, et quo placuerit tibi ut vadas, illuc perge:"
      en: "Now then behold I have loosed thee this day from the chains which were upon thy hands: if it please thee to come with me to Babylon, come: and I will set my eyes upon thee: but if it do not please thee to come with me to Babylon, stay here: behold all the land is before thee, as thou shalt choose, and whither it shall please thee to go, thither go."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et mecum noli venire, sed habita apud Godoliam filium Ahicam filii Saphan, quem praeposuit rex Babylonis civitatibus Juda: habita ergo cum eo in medio populi: vel quocumque placuerit tibi ut vadas, vade. Dedit quoque ei magister militiae cibaria, et munuscula, et dimisit eum."
      en: "And come not with me: but dwell with Godolias the son of Ahicam the son of Saphan, whom the king of Babylon hath made governor over the cities of Juda: dwell therefore with him in the midst of the people: or whithersoever it shall please thee to go, go. And the general of the army gave him victuals and presents, and let him go."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Venit autem Jeremias ad Godoliam filium Ahicam in Masphath, et habitavit cum eo in medio populi qui relictus fuerat in terra."
      en: "And Jeremias went to Godolias the son of Ahicam to Masphath: and dwelt with him in the midst of the people that were left in the land."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cumque audissent omnes principes exercitus, qui dispersi fuerant per regiones, ipsi et socii eorum, quod praefecisset rex Babylonis Godoliam filium Ahicam terrae, et quod commendasset ei viros, et mulieres, et parvulos, et de pauperibus terrae, qui non fuerant translati in Babylonem,"
      en: "And when all the captains of the army that were scattered through the countries, they and their companions, had heard that the king of Babylon had made Godolias the son of Ahicam governor of the country, and that he had committed unto him men and women, and children, and of the poor of the land, them that had not been carried away captive to Babylon:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "venerunt ad Godoliam in Masphath, et Ismahel filius Nathaniae, et Johanan et Jonathan filii Caree, et Sareas filius Thanehumeth, et filii Ophi, qui erant de Netophathi, et Jezonias filius Maachathi, ipse et viri eorum."
      en: "They came to Godolias to Masphath: and Ismahel the son of Nathanias, and Johanan, and Jonathan, the sons of Caree, and Sareas the son of Thanehumeth, and the children of Ophi, that were of Netophathi, and Jezonias the son of Maachati, they and their men."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et juravit eis Godolias filius Ahicam filii Saphan, et comitibus eorum, dicens: Nolite timere servire Chaldaeis: habitate in terra, et servite regi Babylonis, et bene erit vobis."
      en: "And Godolias the son of Ahicam the son of Saphan swore to them and to their companions, saying: Fear not to serve the Chaldeans: dwell in the land, and serve the king of Babylon, and it shall be well with you."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ecce ego habito in Masphath, ut respondeam praecepto Chaldaeorum qui mittuntur ad nos: vos autem colligite vindemiam, et messem, et oleum, et condite in vasis vestris, et manete in urbibus vestris, quas tenetis."
      en: "Behold I dwell in Masphath, that I may answer the commandment of the Chaldeans that are sent to us: but as for you, gather ye the vintage, and the harvest, and the oil, and lay it up in your vessels, and abide in your cities which you hold."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sed et omnes Judaei qui erant in Moab, et in filiis Ammon, et in Idumaea, et in universis regionibus, audito quod dedisset rex Babylonis reliquias in Judaea, et quod praeposuisset super eos Godoliam filium Ahicam filii Saphan,"
      en: "Moreover all the Jews that were in Moab, and among the children of Ammon, and in Edom, and in all the countries, when they heard that the king of Babylon had left a remnant in Judea, and that he had made Godolias the son of Ahicam the son of Saphan ruler over them:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "reversi sunt, inquam, omnes Judaei de universis locis ad quae profugerant, et venerunt in terram Juda ad Godoliam in Masphath, et collegerunt vinum et messam multam nimis."
      en: "All the Jews, I say, returned out of all the places to which they had fled, and they came into the land of Juda to Godolias to Masphath: and they gathered wine, and a very great harvest."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Johanan autem filius Caree, et omnes principes exercitus, qui dispersi fuerant in regionibus, venerunt ad Godoliam in Masphath,"
      en: "Then Johanan the son of Caree, and all the captains of the army, that had been scattered about in the countries, came to Godolias to Masphath."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et dixerunt ei: Scito quod Baalis, rex filiorum Ammon, misit Ismahel filium Nathaniae percutere animam tuam. Et non credidit eis Godolias filius Ahicam."
      en: "And they said to him: Know that Baalis the king of the children of Ammon hath sent Ismahel the son of Nathanias to kill thee. And Godolias the son of Ahicam believed them not."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Johanan autem filius Caree dixit ad Godoliam seorsum in Masphath, loquens: Ibo, et percutiam Ismahel filium Nathaniae, nullo sciente, ne interficiat animam tuam, et dissipentur omnes Judaei qui congregati sunt ad te, et peribunt reliquiae Juda."
      en: "But Johanan the son of Caree, spoke to Godolias privately in Masphath, saying: I will go, and I will kill Ismahel the son of Nathanias, and no man shall know it, lest he kill thee, and all the Jews be scattered, that are gathered unto thee, and the remnant of Juda perish."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et ait Godolias filius Ahicam ad Johanan filium Caree: Noli facere verbum hoc: falsum enim tu loqueris de Ismahel."
      en: "And Godolias the son of Ahicam said to Johanan the son of Cares: Do not this thing: for what thou sayst of Ismahel is false."
    status: { la: verified, en: verified }
