# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2mach
chapter: 15
verses:
  - n: 1
    text:
      la: "Nicanor autem ut conperit Iudam esse in locis Samariae cogitavit die sabbati cum omni impetu committere"
      en: "But when Nicanor understood that Judas was in the places of Samaria, he purposed to set upon him with all violence on the sabbath day."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Iudaeis vero qui illum per necessitatem sequebantur dicentibus ne ita ferociter et barbare feceris sed honorem tribue diei sanctificationis et honora eum qui universa conspicit"
      en: "And when the Jews that were constrained to follow him, said: Do not act so fiercely and barbarously, but give honour to the day that is sanctified: and reverence him that beholdeth all things:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "at ille infelix interrogavit si est potens in saeculo qui imperavit agi diem sabbatorum"
      en: "That unhappy man asked, if there were a mighty One in heaven, that had commanded the sabbath day to be kept."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et respondentibus illis est Dominus vivus ipse in caelo potens qui iussit agi septimam diem"
      en: "And when they answered: There is the living Lord himself in heaven, the mighty One, that commanded the seventh day to be kept,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "at ille ait et ego potens sum super terram qui impero sumi arma et negotia regis impleri tamen non obtinuit ut consilium perficeret"
      en: "Then he said: And I am mighty upon the earth, and I command to take arms, and to do the king's business. Nevertheless he prevailed not to accomplish his design."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et Nicanor quidem cum summa superbia erectus cogitaverat commune tropeum statuere de Iuda"
      en: "So Nicanor being puffed up with exceeding great pride, thought to set up a public monument of his victory over Judas."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Macchabeus autem confidebat semper cum omni spe auxilium sibi a Domino adfuturum"
      en: "But Machabeus ever trusted with all hope that God would help them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et hortabatur suos ne formidarent ad adventum nationum sed in mente haberent adiutoria sibi facta de caelo et nunc sperarent ab Omnipotente adfuturam sibi victoriam"
      en: "And he exhorted his people not to fear the coming of the nations, but to remember the help they had before received from heaven, and now to hope for victory from the Almighty."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et adlocutus illos de lege et prophetis admonens etiam certaminum quae fecerant prius promptiores eos constituit"
      en: "And speaking to them out of the law, and the prophets, and withal putting them in mind of the battles they had fought before, he made them more cheerful:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et ita animis eorum erectis simul ostendens gentium fallaciam et iuramentorum praevaricationem"
      en: "Then after he had encouraged them, he shewed withal the falsehood of the Gentiles, and their breach of oaths."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "singulos autem illorum armavit non clypei et hastae munitione sed sermonibus optimis et hortationibus exposito digno fide somnio per quod universos laetificavit"
      en: "So he armed every one of them, not with defence of shield and spear, but with very good speeches and exhortations, and told them a dream worthy to be believed, whereby he rejoiced them all."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "erat autem huiusmodi visus Onian qui fuerat summus sacerdos virum bonum et benignum verecundum visu modestum moribus et eloquio decorum et qui a puero in virtutibus exercitatus sit manus protendentem orare pro omni populo Iudaeorum"
      en: "Now the vision was in this manner: Onias who had been high priest, a good and virtuous man, modest in his looks, gentle in his manners, and graceful in his speech, and who from a child was exercised in virtues, holding up his hands, prayed for all the people of the Jews:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "post haec apparuisse et alium virum aetate et gloria mirabilem et magni decoris habitudine circa illum"
      en: "After this there appeared also an- other man, admirable for age, and glory, and environed with great beauty and majesty :"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "respondentem vero Onian dixisse hic est fratrum amator et populi Israhel hic est qui multum orat pro populo et universa sancta civitate Hieremias propheta Dei"
      en: "Then Onias answering, Raid: This is a lover of his brethren, and of the people of Israel: this is he that prayeth much for the people, and for all the holy city, Jeremias the prophet of God."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "extendisse autem Hieremiam dexteram et dedisse Iudae gladium aureum dicentem"
      en: "Whereupon Jeremias stretched forth his right hand, and gave to Judas a sword of gold, saying:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "accipe sanctum gladium munus a Deo quo deicies adversarios populi mei Israhel"
      en: "Take this holy sword a gift from God, wherewith thou shalt overthrow the adversaries of my people Israel."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "exhortati itaque Iudae sermonibus bonis valde de quibus extolli possit impetus et animi iuvenum confortari statuerunt dimicare et confligere fortiter ut virtus de negotiis iudicaret eo quod civitas et sancta et templum periclitaretur"
      en: "Thus being exhorted with the words of Judas, which were very good, and proper to stir up the courage, and strengthen the hearts of the young men, they resolved to fight, and to set upon them manfully : that valour might decide the matter, because the holy city and the temple were in danger."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "erat enim pro uxoribus et filiis itemque pro fratribus et cognatis minor sollicitudo maximus vero et primus pro sanctitate timor erat templi"
      en: "For their concern was less for their wives, and children, and for their brethren, and kinsfolks: but their greatest and principal fear was for the holiness of the temple."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "sed et eos qui in civitate erant non minima sollicitudo habebat pro his qui congressi erant"
      en: "And they also that were in the city, had no little concern for them that were to be engaged in battle."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et cum iam omnes sperarent iudicium futurum hostisque adesset atque exercitus esset ordinatus bestiae equitesque oportuno in loco conpositi"
      en: "And now when all expected what judgment would be given, and the enemies were at hand, and the army was set in array, the beasts and the horsemen ranged in convenient places,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "considerans Macchabeus adventum multitudinis et adparatum varium armorum ac ferocitatem bestiarum extendens manum in caelum prodigia facientem Dominum invocavit qui non secundum armorum potentiam sed prout ipsi placet dat dignis victoriam"
      en: "Machabeus considering the coming of the multitude, and the divers preparations of armour, and the fierceness of the beasts, stretching out his hands to heaven, called upon the Lord, that worketh wonders, who giveth victory to them that are worthy, not according to the power of their arms, but according as it seemeth good to him."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "dixit autem invocans hoc modo tu Domine misisti angelum tuum sub Ezechia rege Iudae et interfecisti de castris Sennacherim centum octoginta quinque milia"
      en: "And in his prayer he said after this manner: Thou, O Lord, who didst send thy angel in the time of Ezechias king of Juda, and didst kill a hundred and eighty-five thousand of the army of Sennacherib:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et nunc Dominator caelorum mitte angelum tuum bonum ante nos in timore et tremore magnitudinis brachii tui"
      en: "Send now also, 0 Lord of heaven, thy good angel before us, for the fear and dread of the greatness of thy arm,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ut metuant qui cum blasphemia veniunt adversus sanctum populum tuum et hic quidem ita peroravit"
      en: "That they may be afraid, who come with blasphemy against thy holy people. And thus he concluded his prayer."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Nicanor autem et qui cum ipso erant cum tubis et canticis admovebant"
      en: "But Nicanor, and they that were with him came forward, with trumpets and songs."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Iudas vero et qui cum eo erant invocato Deo per orationes congressi sunt"
      en: "But Judas, and they that were with him, encountered them, calling upon God by prayers:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "manu quidem pugnantes sed cordibus Dominum orantes prostraverunt non minus triginta milia praesentia Dei magnifice delectati"
      en: "So fighting with their hands, but praying to the Lord with their hearts, they slew no less than five and thirty thousand, being greatly cheered with the presence of God."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "cumque cessassent et cum gaudio redirent cognoverunt Nicanorem ruisse cum armis suis"
      en: "And when the battle was over, and they were returning with joy, they understood that Nicanor was slain in his armour."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "facto itaque clamore et perturbatione suscitata patria voce omnipotentem Dominum benedicebant"
      en: "Then making a shout, and a great noise, they blessed the Almighty Lord in their own language."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "praecepit autem Iudas qui per omnia corpore et animo emori pro civibus paratus erat caput Nicanoris et manum cum umero abscisam Hierosolymam perferri"
      en: "And Judas, who was altogether ready, in body and mind, to die for his countrymen, commanded that Nicanor's head, and his hand with the shoulder should be cut off, and carried to Jerusalem."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "quo cum convenisset convocatis contribulibus et sacerdotibus ad altare arcersiit et eos qui in arce erant"
      en: "And when he was come thither, having called together his countrymen, and the priests to the altar, he sent also for them that were in the castle,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et ostenso capite Nicanoris et manu nefaria quam extendens contra domum sanctam omnipotentis Dei magnifice gloriatus est"
      en: "And shewing them the head of Nicenor, and the wicked hand, which he had stretched out, with proud boasts, against the holy house of the Almighty God,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "linguam etiam impii Nicanoris praecisam iussit particulatim avibus dari manum autem dementis contra templum suspendi"
      en: "He commanded also, that the tongue of the wicked Nicanor, should be cut out and given by pieces to birds, and the hand of the furious man to be hanged up over against the temple."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "omnes igitur caeli Dominum benedixerunt dicentes benedictus qui locum suum incontaminatum conservavit"
      en: "Then all blessed the Lord of heaven, saying: Blessed be he that hath kept his own place undefiled."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "suspendit autem Nicanoris caput in summa arce evidens ut esset et manifestum sit auxilii Dei"
      en: "And he hung up Nicanor's head in the top of the castle, that it might be an evident and manifest sign of the help of God."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "itaque omnes communi consilio decreverunt nullo modo diem istum absque celebritate praeterire"
      en: "And they all ordained by a common decree, by no means to let this day pass without solemnity:"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "habere autem celebritatem tertiadecima die mensis adar quod dicitur voce syriaca pridie Mardochei die"
      en: "But to celebrate the thirteenth day of the month of Adar, called, in the Syrian language, the day before Mardochias' day."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "igitur his erga Nicanorem gestis et ex illis temporibus ab Hebraeis civitate possessa ego quoque in his finem faciam sermonis"
      en: "So these things being done with relation to Nicanor, and from that time the city being possessed by the Hebrews, I also will here make an end of my narration."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et siquidem bene et ut historiae conpetit et ipse velim si autem minus digne concedendum est mihi"
      en: "Which if I have done well, and as it becometh the history, it is what I desired: but if not so perfectly, it must be pardoned me."
    status: { la: verified, en: verified }
