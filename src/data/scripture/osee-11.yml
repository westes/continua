# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: osee
chapter: 11
verses:
  - n: 1
    text:
      la: "Sicut mane transiit, pertransiit rex Israel. Quia puer Israel, et dilexi eum; et ex Aegypto vocavi filium meum."
      en: "As the morning passeth, so hath the king of Israel passed away. Because Israel was a child, and I loved him: and I called my son out of Egypt."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Vocaverunt eos, sic abierunt a facie eorum; Baalim immolabant, et simulacris sacrificabant."
      en: "As they called them, they went away from before their face: they offered victims to Baalim, and sacrificed to idols."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et ego quasi nutritius Ephraim: portabam eos in brachiis meis, et nescierunt quod curarem eos."
      en: "And I was like a foster father to Ephraim, I carried them in my arms: and they knew not that I healed them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "In funiculis Adam traham eos, in vinculis caritatis; et ero eis quasi exaltans jugum super maxillas eorum, et declinavi ad eum ut vesceretur."
      en: "I will draw them with the cords of Adam, with the bands of love: and I will be to them as one that taketh off the yoke on their jaws: and I put his meat to him that he might eat."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Non revertetur in terram Aegypti, et Assur ipse rex ejus, quoniam noluerunt converti."
      en: "He shall not return into the land of Egypt, but the Assyrian shall be his king: because they would not be converted."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Coepit gladius in civitatibus ejus, et consumet electos ejus, et comedet capita eorum."
      en: "The sword hath begun in his cities, and it shall consume his chosen men, and shall devour their heads."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et populus meus pendebit ad reditum meum; jugum autem imponetur eis simul, quod non auferetur."
      en: "And my people shall long for my return: but a yoke shall be put upon them together, which shall not be taken off."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quomodo dabo te, Ephraim? protegam te, Israel? Quomodo dabo te sicut Adama, ponam te ut Seboim? Conversum est in me cor meum, pariter conturbata est poenitudo mea."
      en: "How shall I deal with thee, O Ephraim, shall I protect thee, O Israel? how shall I make thee as Adama, shall I set thee as Seboim? my heart is turned within me, my repentance is stirred up."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Non faciam furorem irae meae; non convertar ut disperdam Ephraim, quoniam Deus ego, et non homo; in medio tui sanctus, et non ingrediar civitatem."
      en: "I will not execute the fierceness of my wrath: I will not return to destroy Ephraim: because I am God, and not man: the holy one in the midst of thee, and I will not enter into the city."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Post Dominum ambulabunt; quasi leo rugiet, quia ipse rugiet, et formidabunt filii maris."
      en: "They shall walk after the Lord, he shall roar as a lion: because he shall roar, and the children of the sea shall fear."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et avolabunt quasi avis ex Aegypto, et quasi columba de terra Assyriorum: et collocabo eos in domibus suis, dicit Dominus."
      en: "And they shall fly away like a bird out of Egypt, and like a dove out of the land of the Assyrians: and I will place them in their own houses, saith the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Circumdedit me in negatione Ephraim, et in dolo domus Israel; Judas autem testis descendit cum Deo, et cum sanctis fidelis."
      en: "Ephraim hath compassed me about with denials, and the house of Israel with deceit: but Juda went down as a witness with God, and is faithful with the saints."
    status: { la: verified, en: verified }
