# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 41
verses:
  - n: 1
    text:
      la: "Et introduxit me in templum, et mensus est frontes, sex cubitos latitudinis hinc, et sex cubitos latitudinis inde, latitudinem tabernaculi."
      en: "And he brought me into the temple, and he measured the fronts six cubits broad on this side, and six cubits on that side, the breadth of the tabernacle."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et latitudo portae, decem cubitorum erat: et latera portae, quinque cubitis hinc, et quinque cubitis inde: et mensus est longitudinem ejus quadraginta cubitoum, et latitudinem viginti cubitorum."
      en: "And the breadth of the gate was ten cubits: and the sides of the gate five cubits on this side, and five cubits on that side: and he measured the length thereof forty cubits, and the breadth twenty cubits."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et introgressus intrinsecus, mensus est in fronte portae duos cubitos: et portam, sex cubitorum: et latitudinem portae septem cubitorum."
      en: "Then going inward he measured the front of the gate two cubits: and the gate six cubits, and the breadth of the gate seven cubits."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et mensus est longitudinem ejus viginti cubitorum, et latitudinem ejus viginti cubitorum, ante faciem templi. Et dixit ad me: Hoc est Sanctum sanctorum."
      en: "And he measured the length thereof twenty cubits, and the breadth twenty cubits, before the face of the temple: and he said to me: This is the holy of holies."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et mensus est parietem domus sex cubitorum: et latitudinem lateris quatuor cubitorum undique per circuitum domus."
      en: "And he measured the wall of the house six cubits: and the breadth of every side chamber four cubits round about the house on every side."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Latera autem, latus ad latus, bis triginta tria: et erant eminentia, quae ingrederentur per parietem domus, in lateribus per circuitum, ut continerent, et non attingerent parietem templi."
      en: "And the side chambers one by another, were twice thirty-three: and they bore outwards, that they might enter in through the wall of the house in the sides round about, to hold in, and not to touch the wall of the temple."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et platea erat in rotundum, ascendens sursum per cochleam, et in coenaculum templi deferebat per gyrum: idcirco latius erat templum in superioribus: et sic de inferioribus ascendebatur ad superiora in medium."
      en: "And there was a broad passage round about, going up by winding stairs, and it led into the upper loft of the temple all round: therefore was the temple broader in the higher parts: and so from the lower parts they went to the higher by the midst."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et vidi in domo altitudinem per circuitum, fundata latera ad mensuram calami sex cubitorum spatio:"
      en: "And I saw in the house the height round about, the foundations of the side chambers which were the measure of a reed the space of six cubits:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et latitudinem per parietem lateris forinsecus quinque cubitorum: et erat interior domus in lateribus domus."
      en: "And the thickness of the wall for the side chamber without, which was five cubits: and the inner house was within the side chambers of the house."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et inter gazophylacia latitudinem viginti cubitorum in circuitu domus undique,"
      en: "And between the chambers was the breadth of twenty cubits round about the house on every side."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et ostium lateris ad orationem: ostium unum ad viam aquilonis, et ostium unum ad viam australem: et latitudinem loci ad orationem, quinque cubitorum in circuitu."
      en: "And the door of the side chambers was turned towards the place of prayer: one door was toward the north, and another door was toward the south: and the breadth of the place for prayer, was five cubits round about."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et aedificium, quod erat separatum, versumque ad viam respicientem ad mare, latitudinis septuaginta cubitorum: paries autem aedificii, quinque cubitorum latitudinis per circuitum: et longitudo ejus nonaginta cubitorum."
      en: "And the building that was separate, and turned to the way that looked toward the sea, was seventy cubits broad: and the wall of the building, five cubits thick round about: and ninety cubits long."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et mensus est domus longitudinem, centum cubitorum: et quod separatum erat aedificium, et parietes ejus, longitudinis centum cubitorum."
      en: "And he measured the length of the house, a hundred cubits: and the separate building, and the walls thereof, a hundred cubits in length."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Latitudo autem ante faciem domus, et ejus quod erat separatum contra orientem, centum cubitorum."
      en: "And the breadth before the face of the house, and of the separate place toward the east, a hundred cubits."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et mensus est longitudinem aedificii contra faciem ejus, quod erat separatum ad dorsum: ethecas ex utraque parte centum cubitorum: et templum interius, et vestibula atrii."
      en: "And he measured the length of the building over against it, which was separated at the back of it: and the galleries on both sides a hundred cubits: and the inner temple, and the porches of the court."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Limina, et fenestras obliquas, et ethecas in circuitu per tres partes, contra uniuscujusque limen, stratumque ligno per gyrum in circuitu: terra autem usque ad fenestras, et fenestrae clausae super ostia."
      en: "The thresholds, and the oblique windows, and the galleries round about on three sides, over against the threshold of every one, and floored with wood all round about: and the ground was up to the windows, and the windows were shut over the doors."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et usque ad domum interiorem, et forinsecus per omnem parietem in circuitu intrinsecus, et forinsecus, ad mensuram."
      en: "And even to the inner house, and without all the wall round about within and without, by measure."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et fabrefacta cherubim et palmae: et palma inter cherub et cherub, duasque facies habebat cherub."
      en: "And there were cherubims and palm trees wrought, so that a palm tree was between a cherub and a cherub, and every cherub had two faces."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Faciem hominis juxta palmam ex hac parte, et faciem leonis juxta palmam ex alia parte: expressam per omnem domum in circuitu."
      en: "The face of a man was toward the palm tree on one side, and the face of a lion was toward the palm tree on the other side: set forth through all the house round about."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "De terra usque ad superiora portae, cherubim, et palmae caelatae erant in pariete templi."
      en: "From the ground even to the upper parts of the gate, were cherubims and palm trees wrought in the wall of the temple."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Limen quadrangulum, et facies sanctuarii, aspectus contra aspectum."
      en: "The threshold was foursquare, and the face of the sanctuary, sight to sight."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Altaris lignei trium cubitorum altitudo: et longitudo ejus duorum cubitorum: et anguli ejus, et longitudo ejus, et parietes ejus lignei. Et locutus est ad me: Haec est mensa coram Domino."
      en: "The altar of wood was three cubits high: and the length thereof was two cubits: and the corners thereof, and the length thereof, and the walls thereof were of wood. And he said to me: This is the table before the Lord."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et duo ostia erant in templo et in sanctuario."
      en: "And there were two doors in the temple, and in the sanctuary."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et in duobus ostiis ex utraque parte bina erant ostiola quae in se invicem plicabantur: bina enim ostia erant ex utraque parte ostiorum."
      en: "And in the two doors on both sides were two little doors, which were folded within each other: for there were two wickets on both sides of the doors."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et caelata erant in ipsis ostiis templi cherubim, et sculpturae palmarum, sicut in parietibus quoque expressae erant: quam ob rem et grossiora erant ligna in vestibuli fronte forinsecus."
      en: "And there were cherubims also wrought in the doors of the temple, and the figures of palm trees, like as were made on the walls: for which cause also the planks were thicker in the front of the porch without."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Super quae fenestrae obliquae, et similitudo palmarum hinc atque inde in humerulis vestibuli, secundum latera domus, latitudinemque parietum."
      en: "Upon which were the oblique windows, and the representation of palm trees on this side, and on that side in the sides of the porch, according to the sides of the house, and the breadth of the walls."
    status: { la: verified, en: verified }
