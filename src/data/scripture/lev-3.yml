# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: lev
chapter: 3
verses:
  - n: 1
    text:
      la: "Quod si hostia pacificorum fuerit ejus oblatio, et de bobus voluerit offerre, marem sive feminam, immaculata offeret coram Domino."
      en: "And if his oblation be a sacrifice of peace offerings, and he will offer of the herd, whether male or female, he shall offer them without blemish before the Lord."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ponetque manum super caput victimae suae, quae immolabitur in introitu tabernaculi testimonii, fundentque filii Aaron sacerdotes sanguinem per altaris circuitum."
      en: "And he shall lay his hand upon the head of his victim, which shall be slain in the entry of the tabernacle of the testimony, and the sons of Aaron the priests shall pour the blood round about upon the altar."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et offerent de hostia pacificorum in oblationem Domino, adipem qui operit vitalia, et quidquid pinguedinis est intrinsecus:"
      en: "And they shall offer of the sacrifice of peace offerings, for an oblation to the Lord, the fat that covereth the entrails, and all the fat that is within."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "duos renes cum adipe quo teguntur ilia, et reticulum jecoris cum renunculis."
      en: "The two kidneys with the fat wherewith the flanks are covered, and the caul of the liver with the two little kidneys."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Adolebuntque ea super altare in holocaustum, lignis igne supposito, in oblationem suavissimi odoris Domino."
      en: "And they shall burn them upon the altar, for a holocaust, putting fire under the wood: for an oblation of most sweet savour to the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Si vero de ovibus fuerit ejus oblatio et pacificorum hostia, sive masculum obtulerit, sive feminam, immaculata erunt."
      en: "But if his oblation and the sacrifice of peace offering be of the flock, whether he offer male or female, they shall be without blemish."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Si agnum obtulerit coram Domino,"
      en: "If he offer a lamb before the Lord,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ponet manum suam super caput victimae suae: quae immolabitur in vestibulo tabernaculi testimonii: fundentque filii Aaron sanguinem ejus per circuitum altaris."
      en: "He shall put his hand upon the head of his victim: and it shall be slain in the entry of the tabernacle of the testimony: and the sons of Aaron shall pour the blood thereof round about upon the altar."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et offerent de pacificorum hostia sacrificium Domino: adipem et caudam totam"
      en: "And they shall offer of the victim of peace offerings a sacrifice to the Lord: the fat and the whole rump,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cum renibus, et pinguedinem quae operit ventrem atque universa vitalia, et utrumque renunculum cum adipe qui est juxta ilia, reticulumque jecoris cum renunculis."
      en: "With the kidneys, and the fat that covereth the belly and all the vitals and both the little kidneys, with the fat that is about the flanks, and the caul of the liver with the little kidneys."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et adolebit ea sacerdos super altare in pabulum ignis et oblationis Domini."
      en: "And the priest shall burn them upon the altar, for the food of the fire, and of the oblation of the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Si capra fuerit ejus oblatio, et obtulerit eam Domino,"
      en: "If his offering be a goat, and he offer it to the Lord,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ponet manum suam super caput ejus: immolabitque eam in introitu tabernaculi testimonii, et fundent filii Aaron sanguinem ejus per altaris circuitum."
      en: "He shall put his hand upon the head thereof: and shall immolate it in the entry of the tabernacle of the testimony. And the sons of Aaron shall pour the blood thereof round about upon the altar."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tollentque ex ea in pastum ignis dominici, adipem qui operit ventrem, et qui tegit universa vitalia:"
      en: "And they shall take of it for the food of the Lord's fire, the fat that covereth the belly, and that covereth all the vital parts:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "duos renunculos cum reticulo, quod est super eos juxta ilia, et arvinam jecoris cum renunculis:"
      en: "The two little kidneys with the caul that is upon them which is by the flanks, and the fat of the liver with the little kidneys:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "adolebitque ea super altare sacerdos in alimoniam ignis, et suavissimi odoris. Omnis adeps, Domini erit"
      en: "And the priest shall burn them upon the altar, for the food of the fire, and of a most sweet savour. All the fat shall be the Lord's."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "jure perpetuo in generationibus, et cunctis habitaculis vestris: nec sanguinem nec adipem omnino comedetis."
      en: "By a perpetual law for your generations, and in all your habitations: neither blood nor fat shall you eat at all."
    status: { la: verified, en: verified }
