# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sap
chapter: 11
verses:
  - n: 1
    text:
      la: "direxit opera illorum in manibus prophetae sancti"
      en: "She prospered their works in the hands of the holy prophet."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "iter fecerunt per deserta quae non inhabitabantur et in locis secretis fixerunt casas"
      en: "They went through wildernesses that were not inhabited, and in desert places they pitched their tents."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "steterunt contra hostes et de inimicis se vindicaverunt"
      en: "They stood against their enemies, and revenged themselves of their adversaries."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sitierunt et invocaverunt te et data est illis de petra altissima aqua et requies sitis de lapide duro"
      en: "They were thirsty, and they called upon thee, and water was given them out of the high rock, and a refreshment of their thirst out of the hard stone."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "per quae enim poenas passi sunt inimici illorum"
      en: "For by what things their enemies were punished, when their drink failed them, while the children of Israel abounded therewith and rejoiced:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "per haec cum illis deesset bene cum illis actum est"
      en: "By the same things they in their need were benefited."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nam pro fonte quidem sempiterni fluminis humanum sanguinem dedisti iniustis"
      en: "For instead of a fountain of an ever running river, thou gavest human blood to the unjust."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui comminuerentur in traductione infantum occisorum dedisti illis abundantem aquam insperate"
      en: "And whilst they were diminished for a manifest reproof of their murdering the infants, thou gavest to thine abundant water unlooked for:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ostendens per sitim quae tunc fuit quemadmodum tuos exaltares et adversarios illorum necares"
      en: "Shewing by the thirst that was then, how thou didst exalt thine, and didst kill their adversaries."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cum enim temptati sunt et quidem cum misericordia disciplinam accipientes scierunt quemadmodum cum ira iudicati impii tormenta paterentur"
      en: "For when they were tried, and chastised with mercy, they knew how the wicked were judged with wrath and tormented."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "hos quidem tamquam pater monens probasti illos autem tamquam durus rex interrogans condemnasti"
      en: "For thou didst admonish and try them as a father: but the others, as a severe king, thou didst examine and condemn."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "absentes enim et praesentes similiter torquebantur"
      en: "For whether absent or present, they were tormented alike."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "duplex enim illos acceperat taedium et gemitus cum memoria praeteritorum"
      en: "For a double affliction came upon them, and a groaning for the remembrance of things past."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "cum enim audirent per sua tormenta bene secum agi commemorati sunt Dominum"
      en: "For when they heard that by their punishments the others were benefited, they remembered the Lord, wondering at the end of what was come to pass."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quem enim in expositione prava proiectum deriserunt in finem eventus mirati sunt non similiter iustis faciens"
      en: "For whom they scorned before, when he was thrown out at the time of his being wickedly exposed to perish, him they admired in the end, when they saw the event: their thirsting being unlike to that of the just."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "pro cogitationibus autem insensatis iniquitates illorum quod quidam errantes colebant mutos serpentes et bestias supervacuas inmisisti illis multitudinem mutorum animalium in vindictam"
      en: "But for the foolish devices of their iniquity, because some being deceived worshipped dumb serpents and worthless beasts, thou didst send upon them a multitude of dumb beasts for vengeance."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ut scirent quia per quae peccat quis per haec et torquetur"
      en: "That they might know that by what things a man sinneth, by the same also he is tormented."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "non enim inpossibilis erat omnipotens manus tua quae creavit orbem terrarum ex materia invisa inmittere illis multitudinem ursorum aut audaces leones"
      en: "For thy almighty hand, which made the world of matter without form, was not unable to send upon them a multitude of bears, or fierce lions,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "aut novi generis ira plenas et ignotas bestias aut vaporem igneum spirantes aut odorem fumi proferentes aut horrendas ab oculis scintillas emittentes"
      en: "Or unknown beasts of a new kind, full of rage: either breathing out a fiery vapour, or sending forth a stinking smoke, or shooting horrible sparks out of their eyes:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quarum non solum laesura poterat illos exterminare sed et aspectus per timorem occidere"
      en: "Whereof not only the hurt might be able to destroy them, but also the very sight might kill them through fear."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "sed et sine his uno spiritu occidi poterant persecutionem passi ab ipsis factis suis et dispersi per spiritum virtutis tuae sed omnia mensura et numero et pondere disposuisti"
      en: "Yea and without these, they might have been slain with one blast, persecuted by their own deeds, and scattered by the breath of thy power: but thou hast ordered all things in measure, and number, and weight."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "multum enim valere tibi soli superat semper et virtuti brachii tui quis resistet"
      en: "For great power always belonged to thee alone: and who shall resist the strength of thy arm?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quoniam tamquam momentum staterae sic ante te est orbis terrarum et tamquam gutta roris antelucani quae descendit in terram"
      en: "For the whole world before thee is as the least grain of the balance, and as a drop of the morning dew, that falleth down upon the earth:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "sed misereris omnium quoniam omnia potes et dissimulas peccata hominum propter paenitentiam"
      en: "But thou hast mercy upon all, because thou canst do all things, and overlookest the sins of men for the sake of repentance."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "diligis enim omnia quae sunt et nihil odisti horum quae fecisti nec enim odiens aliquid constituisti"
      en: "For thou lovest all things that are, and hatest none of the things which thou hast made: for thou didst not appoint, or make any thing hating it."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "quomodo autem posset aliquid permanere nisi tu voluisses aut quod a te vocatum non esset conservaretur"
      en: "And how could any thing endure, if thou wouldst not? or be preserved, if not called by thee."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "parcis autem omnibus quoniam tua sunt Domine qui animas amas"
      en: "But thou sparest all: because they are thine, O Lord, who lovest souls."
    status: { la: verified, en: verified }
