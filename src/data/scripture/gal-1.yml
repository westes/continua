# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gal
chapter: 1
verses:
  - n: 1
    text:
      la: "Paulus, Apostolus non ab hominibus, neque per hominem, sed per Jesum Christum, et Deum Patrem, qui suscitavit eum a mortuis:"
      en: "Paul, an apostle, not of men, neither by man, but by Jesus Christ, and God the Father, who raised him from the dead,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et qui mecum sunt omnes fratres, ecclesiis Galatiae."
      en: "And all the brethren who are with me, to the churches of Galatia."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Gratia vobis, et pax a Deo Patre, et Domino nostro Jesu Christo,"
      en: "Grace be to you, and peace from God the Father, and from our Lord Jesus Christ,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui dedit semetipsum pro peccatis nostris, ut eriperet nos de praesenti saeculo nequam, secundum voluntatem Dei et Patris nostri,"
      en: "Who gave himself for our sins, that he might deliver us from this present wicked world, according to the will of God and our Father:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cui est gloria in saecula saeculorum. Amen."
      en: "To whom is glory for ever and ever. Amen."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Miror quod sic tam cito transferimini ab eo qui vos vocavit in gratiam Christi in aliud Evangelium:"
      en: "I wonder that you are so soon removed from him that called you into the grace of Christ, unto another gospel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quod non est aliud, nisi sunt aliqui qui vos conturbant, et volunt convertere Evangelium Christi."
      en: "Which is not another, only there are some that trouble you, and would pervert the gospel of Christ."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sed licet nos aut angelus de caelo evangelizet vobis praeterquam quod evangelizavimus vobis, anathema sit."
      en: "But though we, or an angel from heaven, preach a gospel to you besides that which we have preached to you, let him be anathema."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sicut praediximus, et nunc iterum dico: si quis vobis evangelizaverit praeter id quod accepistis, anathema sit."
      en: "As we said before, so now I say again: If any one preach to you a gospel, besides that which you have received, let him be anathema."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Modo enim hominibus suadeo, an Deo? an quaero hominibus placere? si adhuc hominibus placerem, Christi servus non essem."
      en: "For do I now persuade men, or God? Or do I seek to please men? If I yet pleased men, I should not be the servant of Christ."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Notum enim vobis facio, fratres, Evangelium, quod evangelizatum est a me, quia non est secundum hominem:"
      en: "For I give you to understand, brethren, that the gospel which was preached by me is not according to man."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "neque enim ego ab homine accepi illud, neque didici, sed per revelationem Jesu Christi."
      en: "For neither did I receive it of man, nor did I learn it; but by the revelation of Jesus Christ."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Audistis enim conversationem meam aliquando in Judaismo: quoniam supra modum persequebar Ecclesiam Dei, et expugnabam illam,"
      en: "For you have heard of my conversation in time past in the Jews' religion: how that, beyond measure, I persecuted the church of God, and wasted it."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et proficiebam in Judaismo supra multos coaetaneos meos in genere meo, abundantius aemulator existens paternarum mearum traditionum."
      en: "And I made progress in the Jews' religion above many of my equals in my own nation, being more abundantly zealous for the traditions of my fathers."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cum autem placuit ei, qui me segregavit ex utero matris meae, et vocavit per gratiam suam,"
      en: "But when it pleased him, who separated me from my mother's womb, and called me by his grace,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ut revelaret Filium suum in me, ut evangelizarem illum in gentibus: continuo non acquievi carni et sanguini,"
      en: "To reveal his Son in me, that I might preach him among the Gentiles, immediately I condescended not to flesh and blood."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "neque veni Jerosolymam ad antecessores meos Apostolos: sed abii in Arabiam, et iterum reversus sum Damascum:"
      en: "Neither went I to Jerusalem, to the apostles who were before me: but I went into Arabia, and again I returned to Damascus."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "deinde post annos tres veni Jerosolymam videre Petrum, et mansi apud eum diebus quindecim:"
      en: "Then, after three years, I went to Jerusalem, to see Peter, and I tarried with him fifteen days."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "alium autem Apostolorum vidi neminem, nisi Jacobum fratrem Domini."
      en: "But other of the apostles I saw none, saving James the brother of the Lord."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quae autem scribo vobis, ecce coram Deo, quia non mentior."
      en: "Now the things which I write to you, behold, before God, I lie not."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Deinde veni in partes Syriae, et Ciliciae."
      en: "Afterwards I came into the regions of Syria and Cilicia."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Eram autem ignotus facie ecclesiis Judaeae, quae erant in Christo:"
      en: "And I was unknown by face to the churches of Judea, which were in Christ:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "tantum autem auditum habebant quoniam qui persequebatur nos aliquando, nunc evangelizat fidem, quam aliquando expugnabat:"
      en: "But they had heard only: He, who persecuted us in times past, doth now preach the faith which once he impugned:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et in me clarificabant Deum."
      en: "And they glorified God in me."
    status: { la: verified, en: verified }
