# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 9
verses:
  - n: 1
    text:
      la: "Dixit autem Dominus ad Moysen: Ingredere ad Pharaonem, et loquere ad eum: Haec dicit Dominus Deus Hebraeorum: Dimitte populum meum ut sacrificet mihi."
      en: "And the Lord said to Moses: Go in to Pharao, and speak to him: Thus saith the Lord God of the Hebrews: Let my people go to sacrifice to me."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quod si adhuc renuis, et retines eos,"
      en: "But if thou refuse, and withhold them still:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ecce manus mea erit super agros tuos, et super equos, et asinos, et camelos, et boves, et oves, pestis valde gravis."
      en: "Behold my hand shall be upon thy fields: and a very grievous murrain upon thy horses, and asses, and camels, and oxen, and sheep."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et faciet Dominus mirabile inter possessiones Israel et possessiones Aegyptiorum, ut nihil omnino pereat ex eis quae pertinent ad filios Israel."
      en: "And the Lord will make a wonderful difference between the possessions of Israel and the possessions of the Egyptians, that nothing at all shall die of those things that belong to the children of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Constituitque Dominus tempus, dicens: Cras faciet Dominus verbum istud in terra."
      en: "And the Lord appointed a time, saying: Tomorrow will the Lord do this thing in the land."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Fecit ergo Dominus verbum hoc altera die: mortuaque sunt omnia animantia Aegyptiorum; de animalibus vero filiorum Israel, nihil omnino periit."
      en: "The Lord therefore did this thing the next day: and all the beasts of the Egyptians died, but of the beasts of the children of Israel there died not one."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et misit Pharao ad videndum: nec erat quidquam mortuum de his quae possidebat Israel. Ingravatumque est cor Pharaonis, et non dimisit populum."
      en: "And Pharao sent to see: and there was not any thing dead of that which Israel possessed. And Pharao's heart was hardened, and he did not let the people go."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et dixit Dominus ad Moysen et Aaron: Tollite plenas manus cineris de camino, et spargat illum Moyses in caelum coram Pharaone."
      en: "And the Lord said to Moses and Aaron: Take to you handfuls of ashes out of the chimney, and let Moses sprinkle it in the air in the presence of Pharao."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sitque pulvis super omnem terram Aegypti: erunt enim in hominibus et jumentis ulcera, et vesicae turgentes in universa terra Aegypti."
      en: "And be there dust upon all the land of Egypt: for there shall be boils and swelling blains both in men and beasts in the whole land of Egypt."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Tuleruntque cinerem de camino, et steterunt coram Pharaone, et sparsit illum Moyses in caelum: factaque sunt ulcera vesicarum turgentium in hominibus et jumentis:"
      en: "And they took ashes out of the chimney, and stood before Pharao, and Moses sprinkled it in the air: and there came boils with swelling blains in men and beasts."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "nec poterant malefici stare coram Moyse propter ulcera quae in illis erant, et in omni terra Aegypti."
      en: "Neither could the magicians stand before Moses for the boils that were upon them, and in all the land of Egypt."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Induravitque Dominus cor Pharaonis, et non audivit eos, sicut locutus est Dominus ad Moysen."
      en: "And the Lord hardened Pharao's heart, and he hearkened not unto them, as the Lord had spoken to Moses."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dixitque Dominus ad Moysen: Mane consurge, et sta coram Pharaone, et dices ad eum: Haec dicit Dominus Deus Hebraeorum: Dimitte populum meum ut sacrificet mihi."
      en: "And the Lord said to Moses: Arise in the morning, and stand before Pharao, and thou shalt say to him: Thus saith the Lord the God of the Hebrews: Let my people go to sacrifice to me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quia in hac vice mittam omnes plagas meas super cor tuum, et super servos tuos, et super populum tuum: ut scias quod non sit similis mei in omni terra."
      en: "For I will at this time send all my plagues upon thy heart, and upon thy servants, and upon thy people: that thou mayst know there is none like me in all the earth."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Nunc enim extendens manum percutiam te, et populum tuum peste, peribisque de terra."
      en: "For now I will stretch out my hand to strike thee, and thy people with pestilence, and thou shalt perish from the earth."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Idcirco autem posui te, ut ostendam in te fortitudinem meam, et narretur nomen meum in omni terra."
      en: "And therefore have I raised thee, that I may shew my power in thee, and my name may be spoken of throughout all the earth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Adhuc retines populum meum, et non vis dimittere eum?"
      en: "Dost thou yet hold back my people: and wilt thou not let them go?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "En pluam cras hac ipsa hora grandinem multam nimis, qualis non fuit in Aegypto a die qua fundata est, usque in praesens tempus."
      en: "Behold I will cause it to rain tomorrow at this same hour, an exceeding great hail: such as hath not been in Egypt from the day that it was founded, until this present time."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Mitte ergo jam nunc, et congrega jumenta tua, et omnia quae habes in agro: homines enim, et jumenta, et universa quae inventa fuerint foris, nec congregata de agris, cecideritque super ea grando, morientur."
      en: "Send therefore now presently, and gather together thy cattle, and all that thou hast in the field: for men and beasts, and all things that shall be found abroad, and not gathered together out of the fields, which the hail shall fall upon, shall die."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Qui timuit verbum Domini de servis Pharaonis, facit confugere servos suos et jumenta in domos:"
      en: "He that feared the word of the Lord among Pharao's servants, made his servants and his cattle flee into houses:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui autem neglexit sermonem Domini, dimisit servos suos et jumenta in agris."
      en: "But he that regarded not the word of the Lord, left his servants and his cattle in the fields:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et dixit Dominus ad Moysen: Extende manum tuam in caelum, ut fiat grando in universa terra Aegypti super homines, et super jumenta, et super omnem herbam agri in terra Aegypti."
      en: "And the Lord said to Moses: Stretch forth thy hand towards heaven, that there may be hail in the whole land of Egypt, upon men, and upon beasts, and upon every herb of the field in the land of Egypt."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Extenditque Moyses virgam in caelum, et Dominus dedit tonitrua, et grandinem, ac discurrentia fulgura super terram: pluitque Dominus grandinem super terram Aegypti."
      en: "And Moses stretched forth his rod towards heaven, and the Lord sent thunder and hail, and lightning running along the ground: and the Lord rained hail upon the land of Egypt."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et grando et ignis mista pariter ferebantur: tantaeque fuit magnitudinis, quanta ante numquam apparuit in universa terra Aegypti ex quo gens illa condita est."
      en: "And the hail and fire mixed with it drove on together: and it was of so great bigness, as never before was seen in the whole land of Egypt since that nation was founded."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et percussit grando in omni terra Aegypti cuncta quae fuerunt in agris, ab homine usque ad jumentum: cunctamque herbam agri percussit grando, et omne lignum regionis confregit."
      en: "And the hail destroyed through all the land of Egypt all things that were in the fields, both man and beast: and the hail smote every herb of the field, and it broke every tree of the country."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Tantum in terra Gessen, ubi erant filii Israel, grando non cecidit."
      en: "Only in the land of Gessen, where the children of Israel were, the hail fell not."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Misitque Pharao, et vocavit Moysen et Aaron, dicens ad eos: Peccavi etiam nunc: Dominus justus; ego et populus meus, impii."
      en: "And Pharao sent and called Moses and Aaron, saying to them: I have sinned this time also; the Lord is just: I and my people are wicked."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Orate Dominum ut desinant tonitrua Dei, et grando: ut dimittam vos, et nequaquam hic ultra maneatis."
      en: "Pray ye to the Lord, that the thunderings of God and the hail may cease: that I may let you go, and that you may stay here no longer."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Ait Moyses: Cum egressus fuero de urbe, extendam palmas meas ad Dominum, et cessabunt tonitrua, et grando non erit, ut scias quia Domini est terra:"
      en: "Moses said: As soon as I am gone out of the city, I will stretch forth my hands to the Lord, and the thunders shall cease, and the hail shall be no more: that thou mayst know that the earth is the Lord's."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "novi autem quod et tu et servi tui necdum timeatis Dominum Deum."
      en: "But I know that neither thou, nor thy servants do yet fear the Lord God."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Linum ergo et hordeum laesum est, eo quod hordeum esset virens, et linum jam folliculos germinaret:"
      en: "The flax therefore and the barley were hurt, because the barley was green, and the flax was now boiled:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "triticum autem et far non sunt laesa, quia serotina erant."
      en: "But the wheat, and other winter corn were not hurt, because they were lateward."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Egressusque Moyses a Pharaone ex urbe, tetendit manus ad Dominum: et cessaverunt tonitrua et grando, nec ultra stillavit pluvia super terram."
      en: "And when Moses was gone from Pharao out of the city, he stretched forth his hands to the Lord: and the thunders and the hail ceased, neither did there drop any more rain upon the earth."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Videns autem Pharao quod cessasset pluvia, et grando, et tonitrua, auxit peccatum:"
      en: "And Pharao seeing that the rain and the hail, and the thunders were ceased, increased his sin."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et ingravatum est cor ejus, et servorum illius, et induratum nimis: nec dimisit filios Israel, sicut praeceperat Dominus per manum Moysi."
      en: "And his heart was hardened, and the heart of his servants, and it was made exceeding hard: neither did he let the children of Israel go, as the Lord had commanded by the hand of Moses."
    status: { la: verified, en: verified }
