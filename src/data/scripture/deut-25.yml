# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: deut
chapter: 25
verses:
  - n: 1
    text:
      la: "Si fuerit causa inter aliquos, et interpellaverint judices: quem justum esse perspexerint, illi justitiae palmam dabunt: quem impium, condemnabunt impietatis."
      en: "If there be a controversy between men, and they call upon the judges: they shall give the prize of justice to him whom they perceive to be just: and him whom they find to be wicked, they shall condemn of wickedness."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Sin autem eum, qui peccavit, dignum viderint plagis: prosternent, et coram se facient verberari. Pro mensura peccati erit et plagarum modus:"
      en: "And if they see that the offender be worthy of stripes: they shall lay him down, and shall cause him to be beaten before them. According to the measure of the sin shall the measure also of the stripes be:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ita dumtaxat, ut quadragenarium numerum non excedant: ne foede laceratus ante oculos tuos abeat frater tuus."
      en: "Yet so, that they exceed not the number of forty: lest thy brother depart shamefully torn before thy eyes."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Non ligabis os bovis terentis in area fruges tuas."
      en: "Thou shalt not muzzle the ox that treadeth out thy corn on the floor."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quando habitaverint fratres simul, et unus ex eis absque liberis mortuus fuerit, uxor defuncti non nubet alteri: sed accipiet eam frater ejus, et suscitabit semen fratris sui:"
      en: "When brethren dwell together, and one of them dieth without children, the wife of the deceased shall not marry to another: but his brother shall take her, and raise up seed for his brother:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et primogenitum ex ea filium nomine illius appellabit, ut non deleatur nomen ejus ex Israel."
      en: "And the first son he shall have of her he shall call by his name, that his name be not abolished out of Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Sin autem noluerit accipere uxorem fratris sui, quae ei lege debetur, perget mulier ad portam civitatis, et interpellabit majores natu, dicetque: Non vult frater viri mei suscitare nomen fratris sui in Israel, nec me in conjugem sumere."
      en: "But if he will not take his brother's wife, who by law belongeth to him, the woman shall go to the gate of the city, and call upon the ancients, and say: My husband's brother refuseth to raise up his brother's name in Israel: and will not take me to wife."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Statimque accersiri eum facient, et interrogabunt. Si responderit: Nolo eam uxorem accipere:"
      en: "And they shall cause him to be sent for forthwith, and shall ask him. If he answer: I will not take her to wife:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "accedet mulier ad eum coram senioribus, et tollet calceamentum de pede ejus, spuetque in faciem illius, et dicet: Sic fiet homini, qui non aedificat domum fratris sui."
      en: "The woman shall come to him before the ancients, and shall take off his shoe from his foot, and spit in his face, and say: So shall it be done to the man that will not build up his brother's house:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et vocabitur nomen illius in Israel, Domus discalceati."
      en: "And his name shall be called in Israel, the house of the unshod."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Si habuerint inter se jurgium viri duo, et unus contra alterum rixari coeperit, volensque uxor alterius eruere virum suum de manu fortioris, miseritque manum, et apprehenderit verenda ejus:"
      en: "If two men have words together, and one begin to fight against the other, and the other's wife willing to deliver her husband out of the hand of the stronger, shall put forth her hand, and take him by the secrets,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "abscides manum illius, nec flecteris super eam ulla misericordia."
      en: "Thou shalt cut off her hand, neither shalt thou be moved with any pity in her regard."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Non habebis in sacculo diversa pondera, majus et minus:"
      en: "Thou shalt not have divers weights in thy bag, a greater and a less:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "nec erit in domo tua modius major, et minor."
      en: "Neither shall there be in thy house a greater bushel and a less."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Pondus habebis justum et verum, et modius aequalis et verus erit tibi: ut multo vivas tempore super terram, quam Dominus Deus tuus dederit tibi."
      en: "Thou shalt have a just and a true weight, and thy bushel shall be equal and true: that thou mayest live a long time upon the land which the Lord thy God shall give thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Abominatur enim Dominus tuus eum qui facit haec, et aversatur omnem injustitiam."
      en: "For the Lord thy God abhorreth him that doth these things, and he hateth all injustice."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Memento quae fecerit tibi Amalec in via quando egrediebaris ex Aegypto:"
      en: "Remember what Amalec did to thee in the way when thou camest out of Egypt:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quomodo occurrerit tibi, et extremos agminis tui, qui lassi residebant, ceciderit, quando tu eras fame et labore confectus: et non timuerit Deum."
      en: "How he met thee: and slew the hindmost of the army, who sat down, being weary, when thou wast spent with hunger and labour, and he feared not God."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Cum ergo Dominus Deus tuus dederit tibi requiem, et subjecerit cunctas per circuitum nationes in terra, quam tibi pollicitus est: delebis nomen ejus sub caelo. Cave ne obliviscaris."
      en: "Therefore when the Lord thy God shall give thee rest, and shall have subdued all the nations round about in the land which he hath promised thee: thou shalt blot out his name from under heaven. See thou forget it not."
    status: { la: verified, en: verified }
