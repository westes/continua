# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jos
chapter: 9
verses:
  - n: 1
    text:
      la: "Quibus auditis, cuncti reges trans Jordanem, qui versabantur in montanis et campestribus, in maritimis ac littore magni maris, hi quoque qui habitabant juxta Libanum, Hethaeus et Amorrhaeus, Chananaeus, Pherezaeus, et Hevaeus, et Jebusaeus,"
      en: "Now When these things were heard of, all the kings beyond the Jordan, that dwelt in the mountains and in the plains, in the places near the sea, and on the coasts of the great sea, they also that dwell by Libanus, the Hethite and the Amorrhite, the Chanaanite, the Pherezite, and the Hevite, and the Jebusite,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "congregati sunt pariter, ut pugnarent contra Josue et Israel uno animo, eademque sententia."
      en: "Gathered themselves together, to fight against Josue and Israel with one mind, and one resolution."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "At hi qui habitabant in Gabaon, audientes cuncta quae fecerat Josue Jericho, et Hai,"
      en: "But they that dwelt in Gabaon, hearing all that Josue had done to Jericho and Hai:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et callide cogitantes, tulerunt sibi cibaria, saccos veteres asinis imponentes, et utres vinarios scissos atque consutos,"
      en: "Cunningly devising took for themselves provisions, laying old sacks upon their asses, and wine bottles rent and sewed up again,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "calceamentaque perantiqua quae ad indicium vetustatis pittaciis consuta erant, induti veteribus vestimentis: panes quoque, quos portabant ob viaticum, duri erant, et in frustra comminuti:"
      en: "And very old shoes, which for a shew of age were clouted with patches, and old garments upon them: the loaves also, which they carried for provisions by the way, were hard, and broken into pieces:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "perrexeruntque ad Josue, qui tunc morabatur in castris Galgalae, et dixerunt ei, atque simul omni Israeli: De terra longinqua venimus, pacem vobiscum facere cupientes. Responderuntque viri Israel ad eos, atque dixerunt:"
      en: "And they went to Josue, who then abode in the camp at Galgal, and said to him, and to all Israel with him: We are come from a far country, desiring to make peace with you. And the children of Israel answered them, and said:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ne forte in terra, quae nobis sorte debetur, habitetis, et non possimus foedus inire vobiscum."
      en: "Perhaps you dwell in the land which falls to our lot; if so, we can make no league with you."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "At illi ad Josue: Servi, inquiunt, tui sumus. Quibus Josue ait: Quinam estis vos? et unde venistis?"
      en: "But they said to Josue: We are thy servants. Josue said to them: Who are you? and whence came you?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Responderunt: De terra longinqua valde venerunt servi tui in nomine Domini Dei tui. Audivimus enim famam potentiae ejus, cuncta quae fecit in Aegypto,"
      en: "They answered: From a very far country thy servants are come in the name of the Lord thy God. For we have heard the fame of his power, all the things that he did in Egypt."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et duobus regibus Amorrhaeorum qui fuerunt trans Jordanem, Sehon regi Hesebon, et Og regi Basan, qui erat in Astaroth:"
      en: "And to the two kings of the Amorrhites that were beyond the Jordan, Sehon king of Hesebon, and Og king of Basan, that was in Astaroth:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dixeruntque nobis seniores, et omnes habitatores terrae nostrae: Tollite in manibus cibaria ob longissimam viam, et occurrite eis, et dicite: Servi vestri sumus: foedus inite nobiscum."
      en: "And our ancients, and all the inhabitants of our country said to us: Take with you victuals for a long way, and go meet them, and say: We are your servants, make ye a league with us."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "En panes quando egressi sumus de domibus nostris, ut veniremus ad vos, calidos sumpsimus, nunc sicci facti sunt, et vetustate nimia comminuti."
      en: "Behold, these loaves we took hot, when we set out from our houses to come to you, now they are become dry, and broken in pieces, by being exceeding old."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Utres vini novos implevimus, nunc rupti sunt et soluti. Vestes et calceamenta quibus induimur, et quae habemus in pedibus, ob longitudinem longioris viae trita sunt, et pene consumpta."
      en: "These bottles of wine when we filled them were new, now they are rent and burst. These garments we have on, and the shoes we have on our feet, by reason of the very long journey are worn out, and almost consumed."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Susceperunt igitur de cibariis eorum, et os Domini non interrogaverunt."
      en: "They took therefore of their victuals, and consulted not the mouth of the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Fecitque Josue cum eis pacem, et inito foedere pollicitus est quod non occiderentur: principes quoque multitudinis juraverunt eis."
      en: "And Josue made peace with them, and entering into a league promised that they should not be slain: the princes also of the multitude swore to them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Post dies autem tres initi foederis, audierunt quod in vicino habitarent, et inter eos futuri essent."
      en: "Now three days after the league was made, they heard that they dwelt nigh, and they should be among them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Moveruntque castra filii Israel, et venerunt in civitates eorum die tertio, quarum haec vocabua sunt, Gabaon, et Caphira, et Beroth, et Cariathiarim."
      en: "And the children of Israel removed the camp, and came into their cities on the third day, the names of which are Gabaon, and Caphira, and Beroth, and Cariathiarim."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et non percusserunt eos, eo quod jurassent eis principes multitudinis in nomine Domini Dei Israel. Murmuravit itaque omne vulgus contra principes."
      en: "And they slew them not, because the princes of the multitude had sworn in the name of the Lord the God of Israel. Then all the common people murmured against the princes."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Qui responderunt eis: Juravimus illis in nomine Domini Dei Israel, et idcirco non possumus eos contingere."
      en: "And they answered them: We have sworn to them in the name of the Lord the God of Israel, and therefore we may not touch them."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Sed hoc faciemus eis: reserventur quidem ut vivant, ne contra nos ira Domini concitetur, si pejeraverimus:"
      en: "But this we will do to them: Let their lives be saved, lest the wrath of the Lord be stirred up against us, if we should be forsworn."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "sed sic vivant, ut in usus universae multitudinis ligna caedant, aquasque comportent. Quibus haec loquentibus,"
      en: "But so let them live, as to serve the whole multitude in hewing wood, and bringing in water. As they were speaking these things,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "vocavit Gabaonitas Josue, et dixit eis: Cur nos decipere fraude voluistis, ut diceretis: Procul valde habitamus a vobis, cum in medio nostri sitis?"
      en: "Josue called the Gabaonites and said to them: Why would you impose upon us, saying: We dwell far off from you, whereas you are in the midst of us?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "itaque sub maledictione eritis, et non deficiet de stirpe vestra ligna caedens, aquasque comportans in domum Dei mei."
      en: "Therefore you shall be under a curse, and your race shall always be hewers of wood, and carriers of water unto the house of my God."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Qui responderunt: Nuntiatum est nobis servis tuis, quod promisisset Dominus Deus tuus Moysi servo suo ut traderet vobis omnem terram, et disperderet cunctos habitatores ejus. Timuimus igitur valde, et providimus animabus nostris, vestro terrore compulsi, et hoc consilium inivimus."
      en: "They answered: It was told us thy servants, that the Lord thy God had promised his servant Moses to give you all the land, and to destroy all the inhabitants thereof. Therefore we feared exceedingly and provided for our lives. compelled by the dread we had of you and we took this counsel."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Nunc autem in manu tua sumus: quod tibi bonum et rectum videtur, fac nobis."
      en: "And now we are in thy hand: deal with us as it seemeth good and right unto thee."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Fecit ergo Josue ut dixerat, et liberavit eos de manu filiorum Israel, ut non occiderentur."
      en: "So Josue did as he had said, and delivered them from the hand of the children of Israel, that they should not be slain."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Decrevitque in illo die eos esse in ministerio cuncti populi, et altaris Domini, caedentes ligna, et aquas comportantes, usque in praesens tempus, in loco quem Dominus elegisset."
      en: "And he gave orders in that day that they should be in the service of all the people, and of the altar of the Lord, hewing wood and carrying water, until this present time, in the place which the Lord hath chosen."
    status: { la: verified, en: verified }
