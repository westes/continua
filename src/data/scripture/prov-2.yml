# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 2
verses:
  - n: 1
    text:
      la: "Fili mi, si susceperis sermones meos, et mandata mea absconderis penes te:"
      en: "My son, if thou wilt receive my words, and wilt hide my commandments with thee,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ut audiat sapientiam auris tua, inclina cor tuum ad cognoscendam prudentiam."
      en: "That thy ear may hearken to wisdom: Incline thy heart to know prudence:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Si enim sapientiam invocaveris, et inclinaveris cor tuum prudentiae;"
      en: "For if thou shalt call for wisdom, and incline thy heart to prudence:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "si quaesieris eam quasi pecuniam, et sicut thesauros effoderis illam:"
      en: "If thou shalt seek her as money, and shalt dig for her as for a treasure:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "tunc intelliges timorem Domini, et scientiam Dei invenies,"
      en: "Then shalt thou understand the fear of the Lord, and shalt find the knowledge of God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quia Dominus dat sapientiam, et ex ore ejus prudentia et scientia."
      en: "Because the Lord giveth wisdom: and out of his mouth cometh prudence and knowledge."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Custodiet rectorum salutem, et proteget gradientes simpliciter,"
      en: "He will keep the salvation of the righteous, and protect them that walk in simplicity."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "servans semitas justitiae, et vias sanctorum custodiens."
      en: "Keeping the paths of justice, and guarding the ways of saints."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Tunc intelliges justitiam, et judicium, et aequitatem, et omnem semitam bonam."
      en: "Then shalt thou understand justice, and judgment, and equity, and every good path."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Si intraverit sapientia cor tuum, et scientia animae tuae placuerit,"
      en: "If wisdom shall enter into thy heart, and knowledge please thy soul:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "consilium custodiet te, et prudentia servabit te;"
      en: "Counsel shall keep thee, and prudence shall preserve thee,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ut eruaris a via mala, et ab homine qui perversa loquitur;"
      en: "That thou mayst be delivered from the evil way, and from the man that speaketh perverse things:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui relinquunt iter rectum, et ambulant per vias tenebrosas;"
      en: "Who leave the right way, and walk by dark ways:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui laetantur cum malefecerint, et exsultant in rebus pessimis;"
      en: "Who are glad when they have done evil, and rejoice in most wicked things:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quorum viae perversae sunt, et infames gressus eorum."
      en: "Whose ways are perverse, and their steps infamous."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ut eruaris a muliere aliena, et ab extranea quae mollit sermones suos,"
      en: "That thou mayst be delivered from the strange women, and from the stranger, who softeneth her words:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et relinquit ducem pubertatis suae,"
      en: "And forsaketh the guide of her youth,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et pacti Dei sui oblita est. Inclinata est enim ad mortem domus ejus, et ad inferos semitae ipsius."
      en: "And hath forgotten the covenant of her God: for her house inclineth unto death, and her paths to hell."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Omnes qui ingrediuntur ad eam non revertentur, nec apprehendent semitas vitae."
      en: "None that go in unto her shall return again, neither shall they take hold of the paths of life,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Ut ambules in via bona, et cales justorum custodias:"
      en: "That thou mayst walk in a good way: and mayst keep the paths of the just."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui enim recti sunt habitabunt in terra, et simplices permanebunt in ea;"
      en: "For they that are upright shall dwell in the earth, and the simple shall continue in it."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "impii vero de terra perdentur, et qui inique agunt auferentur ex ea."
      en: "But the wicked shall be destroyed from the earth: and they that do unjustly shall be taken away from it."
    status: { la: verified, en: verified }
