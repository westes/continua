# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: luc
chapter: 18
verses:
  - n: 1
    text:
      la: "Dicebat autem et parabolam ad illos, quoniam oportet semper orare et non deficere,"
      en: "And he spoke also a parable to them, that we ought always to pray, and not to faint,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dicens: Judex quidam erat in quadam civitate, qui Deum non timebat, et hominem non reverebatur."
      en: "Saying: There was a judge in a certain city, who feared not God, nor regarded man."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Vidua autem quaedam erat in civitate illa, et veniebat ad eum, dicens: Vindica me de adversario meo."
      en: "And there was a certain widow in that city, and she came to him, saying: Avenge me of my adversary."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et nolebat per multum tempus. Post haec autem dixit intra se: Etsi Deum non timeo, nec hominem revereor:"
      en: "And he would not for a long time. But afterwards he said within himself: Although I fear not God, nor regard man,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "tamen quia molesta est mihi haec vidua, vindicabo illam, ne in novissimo veniens sugillet me."
      en: "Yet because this widow is troublesome to me, I will avenge her, lest continually coming she weary me."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ait autem Dominus: Audite quid judex iniquitatis dicit:"
      en: "And the Lord said: Hear what the unjust judge saith."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Deus autem non faciet vindictam electorum suorum clamantium ad se die ac nocte, et patientiam habebit in illis?"
      en: "And will not God revenge his elect who cry to him day and night: and will he have patience in their regard?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dico vobis quia cito faciet vindictam illorum. Verumtamen Filius hominis veniens, putas, inveniet fidem in terra?"
      en: "I say to you, that he will quickly revenge them. But yet the Son of man, when he cometh, shall he find, think you, faith on earth?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dixit autem et ad quosdam qui in se confidebant tamquam justi, et aspernabantur ceteros, parabolam istam:"
      en: "And to some who trusted in themselves as just, and despised others, he spoke also this parable:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Duo homines ascenderunt in templum ut orarent: unus pharisaeus et alter publicanus."
      en: "Two men went up into the temple to pray: the one a Pharisee, and the other a publican."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Pharisaeus stans, haec apud se orabat: Deus, gratias ago tibi, quia non sum sicut ceteri hominum: raptores, injusti, adulteri, velut etiam hic publicanus:"
      en: "The Pharisee standing, prayed thus with himself: O God, I give thee thanks that I am not as the rest of men, extortioners, unjust, adulterers, as also is this publican."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "jejuno bis in sabbato, decimas do omnium quae possideo."
      en: "I fast twice in a week: I give tithes of all that I possess."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et publicanus a longe stans, nolebat nec oculos ad caelum levare: sed percutiebat pectus suum, dicens: Deus propitius esto mihi peccatori."
      en: "And the publican, standing afar off, would not so much as lift up his eyes towards heaven; but struck his breast, saying: O God, be merciful to me a sinner."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dico vobis, descendit hic justificatus in domum suam ab illo: quia omnis qui se exaltat, humiliabitur, et qui se humiliat, exaltabitur."
      en: "I say to you, this man went down into his house justified rather than the other: because every one that exalteth himself, shall be humbled: and he that humbleth himself, shall be exalted."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Afferebant autem ad illum et infantes, ut eos tangeret. Quod cum viderent discipuli, increpabant illos."
      en: "And they brought unto him also infants, that he might touch them. Which when the disciples saw, they rebuked them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Jesus autem convocans illos, dixit: Sinite pueros venire ad me, et nolite vetare eos: talium est enim regnum Dei."
      en: "But Jesus, calling them together, said: Suffer children to come to me, and forbid them not: for of such is the kingdom of God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Amen dico vobis, quicumque non acceperit regnum Dei sicut puer, non intrabit in illud."
      en: "Amen, I say to you: Whosoever shall not receive the kingdom of God as a child, shall not enter into it."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et interrogavit eum quidam princeps, dicens: Magister bone, quid faciens vitam aeternam possidebo?"
      en: "And a certain ruler asked him, saying: Good master, what shall I do to possess everlasting life?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dixit autem ei Jesus: Quid me dicis bonum? nemo bonus nisi solus Deus."
      en: "And Jesus said to him: Why dost thou call me good? None is good but God alone."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Mandata nosti: non occides; non moechaberis; non furtum facies; non falsum testimonium dices; honora patrem tuum et matrem."
      en: "Thou knowest the commandments: Thou shalt not kill: Thou shalt not commit adultery: Thou shalt not steal: Thou shalt not bear false witness: Honour thy father and mother."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Qui ait: Haec omnia custodivi a juventute mea."
      en: "Who said: All these things have I kept from my youth."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Quo audito, Jesus ait ei: Adhuc unum tibi deest: omnia quaecumque habes vende, et da pauperibus, et habebis thesaurum in caelo: et veni, sequere me."
      en: "Which when Jesus had heard, he said to him: Yet one thing is wanting to thee: sell all whatever thou hast, and give to the poor, and thou shalt have treasure in heaven: and come, follow me."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "His ille auditis, contristatus est: quia dives erat valde."
      en: "He having heard these things, became sorrowful; for he was very rich."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Videns autem Jesus illum tristem factum, dixit: Quam difficile, qui pecunias habent, in regnum Dei intrabunt!"
      en: "And Jesus seeing him become sorrowful, said: How hardly shall they that have riches enter into the kingdom of God."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "facilius est enim camelum per foramen acus transire quam divitem intrare in regnum Dei."
      en: "For it is easier for a camel to pass through the eye of a needle, than for a rich man to enter into the kingdom of God."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et dixerunt qui audiebant: Et quis potest salvus fieri?"
      en: "And they that heard it, said: Who then can be saved?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ait illis: Quae impossibilia sunt apud homines, possibilia sunt apud Deum."
      en: "He said to them: The things that are impossible with men, are possible with God."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Ait autem Petrus: Ecce nos dimisimus omnia et secuti sumus te."
      en: "Then Peter said: Behold, we have left all things, and have followed thee."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Qui dixit eis: Amen dico vobis, nemo est qui reliquit domum, aut parentes, aut fratres, aut uxorem, aut filios propter regnum Dei,"
      en: "Who said to them: Amen, I say to you, there is no man that hath left house, or parents, or brethren, or wife, or children, for the kingdom of God's sake,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et non recipiat multo plura in hoc tempore, et in saeculo venturo vitam aeternam."
      en: "Who shall not receive much more in this present time, and in the world to come life everlasting."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Assumpsit autem Jesus duodecim, et ait illis: Ecce ascendimus Jerosolymam, et consummabuntur omnia quae scripta sunt per prophetas de Filio hominis:"
      en: "Then Jesus took unto him the twelve, and said to them: Behold, we go up to Jerusalem, and all things shall be accomplished which were written by the prophets concerning the Son of man."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "tradetur enim gentibus, et illudetur, et flagellabitur, et conspuetur:"
      en: "For he shall be delivered to the Gentiles, and shall be mocked, and scourged, and spit upon:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et postquam flagellaverint, occident eum, et tertia die resurget."
      en: "And after they have scourged him, they will put him to death; and the third day he shall rise again."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et ipsi nihil horum intellexerunt, et erat verbum istud absconditum ab eis, et non intelligebant quae dicebantur."
      en: "And they understood none of these things, and this word was hid from them, and they understood not the things that were said."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Factum est autem, cum appropinquaret Jericho, caecus quidam sedebat secus viam, mendicans."
      en: "Now it came to pass, when he drew nigh to Jericho, that a certain blind man sat by the way side, begging."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et cum audiret turbam praetereuntem, interrogabat quid hoc esset."
      en: "And when he heard the multitude passing by, he asked what this meant."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Dixerunt autem ei quod Jesus Nazarenus transiret."
      en: "And they told him, that Jesus of Nazareth was passing by."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et clamavit, dicens: Jesu, fili David, miserere mei."
      en: "And he cried out, saying: Jesus, son of David, have mercy on me."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et qui praeibant, increpabant eum ut taceret. Ipse vero multo magis clamabat: Fili David, miserere mei."
      en: "And they that went before, rebuked him, that he should hold his peace: but he cried out much more: Son of David, have mercy on me."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Stans autem Jesus jussit illum adduci ad se. Et cum appropinquasset, interrogavit illum,"
      en: "And Jesus standing, commanded him to be brought unto him. And when he was come near, he asked him,"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "dicens: Quid tibi vis faciam? At ille dixit: Domine, ut videam."
      en: "Saying: What wilt thou that I do to thee? But he said: Lord, that I may see."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et Jesus dixit illi: Respice, fides tua te salvum fecit."
      en: "And Jesus said to him: Receive thy sight: thy faith hath made thee whole."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Et confestim vidit, et sequebatur illum magnificans Deum. Et omnis plebs ut vidit, dedit laudem Deo."
      en: "And immediately he saw, and followed him, glorifying God. And all the people, when they saw it, gave praise to God."
    status: { la: verified, en: verified }
