# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: deut
chapter: 21
verses:
  - n: 1
    text:
      la: "quando inventum fuerit in terra quam Dominus Deus tuus daturus est tibi hominis cadaver occisi et ignoratur caedis reus"
      en: "Then there shall be found in the land, which the Lord thy God will give thee, the corpse of a man slain, and it is not known who is guilty of the murder,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "egredientur maiores natu et iudices tui et metientur a loco cadaveris singularum per circuitum spatia civitatum"
      en: "Thy ancients and judges shall go out, and shall measure from the place where the body lieth the distance of every city round about:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et quam viciniorem ceteris esse perspexerint seniores civitatis eius tollent vitulam de armento quae non traxit iugum nec terram scidit vomere"
      en: "And the ancients of that city which they shall perceive to be nearer than the rest, shall take a heifer of the herd, that hath not drawn in the yoke, nor ploughed the ground,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ducent eam ad vallem asperam atque saxosam quae numquam arata est nec sementem recepit et caedent in ea cervices vitulae"
      en: "And they shall bring her into a rough and stony valley, that never was ploughed, nor sown: and there they shall strike off the head of the heifer:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "accedentque sacerdotes filii Levi quos elegerit Dominus Deus tuus ut ministrent ei et benedicant in nomine eius et ad verbum eorum omne negotium et quicquid mundum vel inmundum est iudicetur"
      en: "And the priests the sons of Levi shall come, whom the Lord thy God hath chosen to minister to him, and to bless in his name, and that by their word every matter should be decided, and whatsoever is clean or unclean should be judged."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et maiores natu civitatis illius ad interfectum lavabuntque manus suas super vitulam quae in valle percussa est"
      en: "And the ancients of that city shall come to the person slain, and shall wash their hands over the heifer that was killed in the valley,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et dicent manus nostrae non effuderunt hunc sanguinem nec oculi viderunt"
      en: "And shall say: Our hands did not shed this blood, nor did our eyes see it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "propitius esto populo tuo Israhel quem redemisti Domine et non reputes sanguinem innocentem in medio populi tui Israhel et auferetur ab eis reatus sanguinis"
      en: "Be merciful to thy people Israel, whom thou hast redeemed, O Lord, and lay not innocent blood to their charge, in the midst of thy people Israel. And the guilt of blood shall be taken from them:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "tu autem alienus eris ab innocentis cruore qui fusus est cum feceris quod praecepit Dominus"
      en: "And thou shalt be free from the innocent's blood, that was shed, when thou shalt have done what the Lord hath commanded thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "si egressus fueris ad pugnam contra inimicos tuos et tradiderit eos Dominus Deus tuus in manu tua captivosque duxeris"
      en: "If thou go out to fight against thy enemies, and the Lord thy God deliver them into thy hand, and thou lead them away captives,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et videris in numero captivorum mulierem pulchram et adamaveris eam voluerisque habere uxorem"
      en: "And seest in the number of the captives a beautiful woman, and lovest her, and wilt have her to wife,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "introduces in domum tuam quae radet caesariem et circumcidet ungues"
      en: "Thou shalt bring her into thy house: and she shall shave her hair, and pare her nails,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et deponet vestem in qua capta est sedensque in domo tua flebit patrem et matrem suam uno mense et postea intrabis ad eam dormiesque cum illa et erit uxor tua"
      en: "And shall put off the raiment, wherein she was taken: and shall remain in thy house, and mourn for her father and mother one month: and after that thou shalt go in unto her, and shalt sleep with her, and she shall be thy wife."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sin autem postea non sederit animo tuo dimittes eam liberam nec vendere poteris pecunia nec opprimere per potentiam quia humiliasti eam"
      en: "Rut if afterwards she please thee not, thou shalt let her go free, but thou mayst not sell her for money nor oppress her by might because thou hast humbled her."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "si habuerit homo uxores duas unam dilectam et alteram odiosam genuerintque ex eo liberos et fuerit filius odiosae primogenitus"
      en: "If a man have two wives, one beloved, and the other hated, and they have had children by him, and the son of the hated be the firstborn,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "volueritque substantiam inter filios suos dividere non poterit filium dilectae facere primogenitum et praeferre filio odiosae"
      en: "And he meaneth to divide his substance among his sons: he may not make the son of the beloved the firstborn, and prefer him before the son of the hated."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sed filium odiosae agnoscet primogenitum dabitque ei de his quae habuerit cuncta duplicia iste est enim principium liberorum eius et huic debentur primogenita"
      en: "But he shall acknowledge the son of the hated for the firstborn, and shall give him a double portion of all he hath: for this is the first of his children, and to him are due the first birthrights."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "si genuerit homo filium contumacem et protervum qui non audiat patris aut matris imperium et coercitus oboedire contempserit"
      en: "If a man have a stubborn and unruly son, who will not hear the commandments of his father or mother, and being corrected, slighteth obedience:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "adprehendent eum et ducent ad seniores civitatis illius et ad portam iudicii"
      en: "They shall take him and bring him to the ancients of his city, and to the gate of judgment,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dicentque ad eos filius noster iste protervus et contumax est monita nostra audire contemnit comesationibus vacat et luxuriae atque conviviis"
      en: "And shall say to them: This our son is rebellious and stubborn, he slighteth hearing our admonitions, he giveth himself to revelling, and to debauchery and banquetings:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "lapidibus eum obruet populus civitatis et morietur ut auferatis malum de medio vestri et universus Israhel audiens pertimescat"
      en: "The people of the city shall stone him: and he shall die, that you may take away the evil out of the midst of you, and all Israel hearing it may be afraid."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quando peccaverit homo quod morte plectendum est et adiudicatus morti adpensus fuerit in patibulo"
      en: "When a man hath committed a crime for which he is to be punished with death, and being condemned to die is hanged on a gibbet:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "non permanebit cadaver eius in ligno sed in eadem die sepelietur quia maledictus a Deo est qui pendet in ligno et nequaquam contaminabis terram tuam quam Dominus Deus tuus dederit tibi in possessionem"
      en: "His body shall not remain upon the tree, but shall be buried the same day: for he is accursed of God that hangeth on a tree: and thou shalt not defile thy land, which the Lord thy God shall give thee in possession."
    status: { la: verified, en: verified }
