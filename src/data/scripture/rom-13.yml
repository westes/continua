# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: rom
chapter: 13
verses:
  - n: 1
    text:
      la: "Omnis anima potestatibus sublimioribus subdita sit: non est enim potestas nisi a Deo: quae autem sunt, a Deo ordinatae sunt."
      en: "Let every soul be subject to higher powers: for there is no power but from God: and those that are, are ordained of God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Itaque qui resistit potestati, Dei ordinationi resistit. Qui autem resistunt, ipsi sibi damnationem acquirunt:"
      en: "Therefore he that resisteth the power, resisteth the ordinance of God. And they that resist, purchase to themselves damnation."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "nam principes non sunt timori boni operis, sed mali. Vis autem non timere potestatem? Bonum fac: et habebis laudem ex illa:"
      en: "For princes are not a terror to the good work, but to the evil. Wilt thou then not be afraid of the power? Do that which is good: and thou shalt have praise from the same."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dei enim minister est tibi in bonum. Si autem malum feceris, time: non enim sine causa gladium portat. Dei enim minister est: vindex in iram ei qui malum agit."
      en: "For he is God's minister to thee, for good. But if thou do that which is evil, fear: for he beareth not the sword in vain. For he is God's minister: an avenger to execute wrath upon him that doth evil."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ideo necessitate subditi estote non solum propter iram, sed etiam propter conscientiam."
      en: "Wherefore be subject of necessity, not only for wrath, but also for conscience' sake."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ideo enim et tributa praestatis: ministri enim Dei sunt, in hoc ipsum servientes."
      en: "For therefore also you pay tribute. For they are the ministers of God, serving unto this purpose."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Reddite ergo omnibus debita: cui tribulatum, tributum: cui vectigal, vectigal: cui timorem, timorem: cui honorem, honorem."
      en: "Render therefore to all men their dues. Tribute, to whom tribute is due: custom, to whom custom: fear, to whom fear: honour, to whom honour."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Nemini quidquam debeatis, nisi ut invicem diligatis: qui enim diligit proximum, legem implevit."
      en: "Owe no man any thing, but to love one another. For he that loveth his neighbour, hath fulfilled the law."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Nam: non adultaberis: non occides: non furaberis: non falsum testimonium dices: non concupisces: et si quod est aliud mandatum, in hoc verbo instauratur: diliges proximum tuum sicut teipsum."
      en: "For Thou shalt not commit adultery: Thou shalt not kill: Thou shalt not steal, Thou shalt not bear false witness: Thou shalt not covet: and if there be any other commandment, it is comprised in this word, Thou shalt love thy neighbour as thyself."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dilectio proximi malum non operatur. Plenitudo ergo legis est dilectio."
      en: "The love of our neighbour worketh no evil. Love therefore is the fulfilling of the law."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et hoc scientes tempus: quia hora est jam nos de somno surgere. Nunc enim propior est nostra salus, quam cum credidimus."
      en: "And that knowing the season; that it is now the hour for us to rise from sleep. For now our salvation is nearer than when we believed."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Nox praecessit, dies autem appropinquavit. Abjiciamus ergo opera tenebrarum, et induamur arma lucis."
      en: "The night is passed, and the day is at hand. Let us therefore cast off the works of darkness, and put on the armour of light."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sicut in die honeste ambulemus: non in comessationibus, et ebrietatibus, non in cubilibus, et impudicitiis, non in contentione, et aemulatione:"
      en: "Let us walk honestly, as in the day: not in rioting and drunkenness, not in chambering and impurities, not in contention and envy:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sed induamini Dominum Jesum Christum, et carnis curam ne feceritis in desideriis."
      en: "But put ye on the Lord Jesus Christ, and make not provision for the flesh in its concupiscences."
    status: { la: verified, en: verified }
