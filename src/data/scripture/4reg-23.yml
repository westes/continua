# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 4reg
chapter: 23
verses:
  - n: 1
    text:
      la: "et renuntiaverunt regi quod dixerat qui misit et congregati sunt ad eum omnes senes Iuda et Hierusalem"
      en: "And they brought the king word again what she had said. And he sent: and all the ancients of Juda and Jerusalem were assembled to him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ascenditque rex templum Domini et omnes viri Iuda universique qui habitant in Hierusalem cum eo sacerdotes et prophetae et omnis populus a parvo usque ad magnum legitque cunctis audientibus omnia verba libri foederis qui inventus est in domo Domini"
      en: "And the king went up to the temple of the Lord, and all the men of Juda, and all the inhabitants of Jerusalem with him, the priests and the prophets, and all the people both little and great: and in the hearing of them all he read all the words of the book of the covenant, which was found in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "stetitque rex super gradum et percussit foedus coram Domino ut ambularent post Dominum et custodirent praecepta eius et testimonia et caerimonias in omni corde et in tota anima et suscitarent verba foederis huius quae scripta erant in libro illo adquievitque populus pacto"
      en: "And the king stood upon the step: and made a covenant with the Lord, to walk after the Lord, and to keep his commandments, and his testimonies and his ceremonies, with all their heart, and with all their soul, and to perform the words of this covenant, which were written in that book: and the people agreed to the covenant."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et praecepit rex Helciae pontifici et sacerdotibus secundi ordinis et ianitoribus ut proicerent de templo Domini omnia vasa quae facta fuerant Baal et in luco et universae militiae caeli et conbusit ea foris Hierusalem in convalle Cedron et tulit pulverem eorum in Bethel"
      en: "And the king commanded Helcias the high priest, and the priests of the second order, and the doorkeepers, to cast out of the temple of the Lord all the vessels that had been made for Baal, and for the grove, and for all the host of heaven: and he burnt them without Jerusalem in the valley of Cedron, and he carried the ashes of them to Bethel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et delevit aruspices quos posuerant reges Iuda ad sacrificandum in excelsis per civitates Iuda et in circuitu Hierusalem et eos qui adolebant incensum Baal et soli et lunae et duodecim signis et omni militiae caeli"
      en: "And he destroyed the soothsayers, whom the kings of Juda had appointed to sacrifice in the high places in the cities of Juda, and round about Jerusalem: them also that burnt incense to Baal, and to the sun, and to the moon, and to the twelve signs, and to all the host of heaven."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et efferri fecit lucum de domo Domini foras Hierusalem in convalle Cedron et conbusit eum ibi et redegit in pulverem et proiecit super sepulchrum vulgi"
      en: "And he caused the grove to be carried out from the house of the Lord without Jerusalem to the valley of Cedron, and he burnt it there, and reduced it to dust, and cast the dust upon the graves of the common people."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "destruxit quoque aediculas effeminatorum quae erant in domo Domini pro quibus mulieres texebant quasi domunculas luci"
      en: "He destroyed also the pavilions of the effeminate, which were in the house of the Lord, for which the women wove as it were little dwellings for the grove."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "congregavitque omnes sacerdotes de civitatibus Iuda et contaminavit excelsa ubi sacrificabant sacerdotes de Gabaa usque Bersabee et destruxit aras portarum in introitu ostii Iosue principis civitatis quod erat ad sinistram portae civitatis"
      en: "And he gathered together all the priests out of the cities of Juda: and he defiled the high places, where the priests offered sacrifice, from Gabaa to Bersabee: and he broke down the altars of the gates that were in the entering in of the gate of Josue governor of tile city, which was on the left hand of the gate of the city."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "verumtamen non ascendebant sacerdotes excelsorum ad altare Domini in Hierusalem sed tantum comedebant azyma in medio fratrum suorum"
      en: "However the priests of the high places came not up to the altar of the Lord in Jerusalem: but only ate of the unleavened bread among their brethren."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "contaminavit quoque Thafeth quod est in convalle filii Ennom ut nemo consecraret filium suum aut filiam per ignem Moloch"
      en: "And he defiled Topheth, which is in the valley of the son of Ennom: that no man should consecrate there his son or his daughter through fire to Moloch."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "abstulit quoque equos quos dederant reges Iudae soli in introitu templi Domini iuxta exedram Nathanmelech eunuchi qui erat in Farurim currus autem solis conbusit igni"
      en: "And he took away the horses which the kings of Juda had given to the sun, at the entering in of the temple of the Lord, near the chamber of Nathanmelech the eunuch, who was in Pharurim: and he burnt the chariots of the sun with fire."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "altaria quoque quae erant super tecta cenaculi Ahaz quae fecerant reges Iuda et altaria quae fecerat Manasses in duobus atriis templi Domini destruxit rex et cucurrit inde et dispersit cinerem eorum in torrentem Cedron"
      en: "And the altars that were upon the top of the upper chamber of Achaz, which the kings of Juda had made, and the altars which Manasses had made in the two courts of the temple of the Lord, the king broke down: and he ran from thence, and cast the ashes of them into the torrent Cedron."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "excelsa quoque quae erant in Hierusalem ad dexteram partem montis Offensionis quae aedificaverat Salomon rex Israhel Astharoth idolo Sidoniorum et Chamos offensioni Moab et Melchom abominationi filiorum Ammon polluit rex"
      en: "The high places also that were at Jerusalem on the right side of the Mount of Offence, O which Solomon king of Israel had built to Astaroth the idol of the Sidonians, and to Chamos the scandal of Moab, and to Melchom the abomination of the children of Ammon, the king defiled."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et contrivit statuas et succidit lucos replevitque loca eorum ossibus mortuorum"
      en: "And he broke in pieces the statues, and cut down the groves: and he filled their places with the bones of dead men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "insuper et altare quod erat in Bethel excelsum quod fecerat Hieroboam filius Nabath qui peccare fecit Israhel et altare illud et excelsum destruxit atque conbusit et comminuit in pulverem succenditque etiam lucum"
      en: "Moreover the altar also that was at Bethel, and the high place, which Jeroboam the son of Nabat, who made Israel to sin, had made: both the altar, and the high place he broke down and burnt, and reduced to powder, and burnt the grove."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et conversus Iosias vidit ibi sepulchra quae erant in monte misitque et tulit ossa de sepulchris et conbusit ea super altare et polluit illud iuxta verbum Domini quod locutus est vir Dei qui praedixerat verba haec"
      en: "And as Josias turned himself, he saw there the sepulchres that were in the mount: and he sent and took the bones out of the sepulchres, and burnt them upon the altar, and defiled it according to the word of the Lord, which the man of God spoke, who had foretold these things."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ait quis est titulus ille quem video responderuntque ei cives illius urbis sepulchrum est hominis Dei qui venit de Iuda et praedixit verba haec quae fecisti super altare Bethel"
      en: "And he said: What is that monument which I see? And the men of that city answered: It is the sepulchre of the man of God, who came from Juda, and foretold these things which thou hast done upon the altar of Bethel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ait dimittite eum nemo commoveat ossa eius et intacta manserunt ossa illius cum ossibus prophetae qui venerat de Samaria"
      en: "And he said: Let him alone, let no man move his bones. So his bones were left untouched with the bones of the prophet that came out of Samaria."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "insuper et omnia fana excelsorum quae erant in civitatibus Samariae quae fecerant reges Israhel ad inritandum Dominum abstulit Iosias et fecit eis secundum omnia opera quae fecerat in Bethel"
      en: "Moreover all the temples of the high places, which were in the cities of Samaria, which the kings of Israel had made to provoke the Lord, Josias took away: and he did to them according to all the acts that he had done in Bethel."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et occidit universos sacerdotes excelsorum qui erant ibi super altaria et conbusit ossa humana super ea reversusque est Hierusalem"
      en: "And he slew all the priests of the high places, that were there, upon the altars: and he burnt men's bones upon them: and returned to Jerusalem."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et praecepit omni populo dicens facite phase Domino Deo vestro secundum quod scriptum est in libro foederis huius"
      en: "And he commanded all the people, saying: Keep the phase to the Lord your God, according as it is written in the book of this covenant."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "nec enim factum est phase tale a diebus iudicum qui iudicaverunt Israhel et omnium dierum regum Israhel et regum Iuda"
      en: "Now there was no such a phase kept from the days of the judges, who judged Israel, nor in all the days of the kings of Israel, and of the kings of Juda,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sicut in octavodecimo anno regis Iosiae factum est phase istud Domino in Hierusalem"
      en: "As was this phase that was kept to the Lord in Jerusalem, in the eighteenth year of king Josias."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "sed et pythones et ariolos et figuras idolorum et inmunditias abominationesque quae fuerant in terra Iuda et in Hierusalem abstulit Iosias ut statueret verba legis quae scripta sunt in libro quem invenit Helcias sacerdos in templo Domini"
      en: "Moreover the diviners by spirits, and soothsayers, and the figures of idols, and the uncleannesses, and the abominations, that had been in the land of Juda, and Jerusalem, Josias took away: that he might perform the words of the law, that were written in the book which Helcias the priest had found in the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "similis illi non fuit ante eum rex qui reverteretur ad Dominum in omni corde suo et in tota anima sua et in universa virtute sua iuxta omnem legem Mosi neque post eum surrexit similis illi"
      en: "There was no king before him like unto him, that returned to the Lord with all his heart, and with all his soul, and with ail his strength, according to all the law of Moses: neither after him did there arise any like him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "verumtamen non est aversus Dominus ab ira furoris sui magni quo iratus est furor eius contra Iudam propter inritationes quibus provocaverat eum Manasses"
      en: "But yet the Lord turned not away from the wrath of his great indignation, wherewith his anger was kindled against Juda: because of the provocations, wherewith Manasses had provoked him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "dixit itaque Dominus etiam Iudam auferam a facie mea sicut abstuli Israhel et proiciam civitatem hanc quam elegi Hierusalem et domum de qua dixi erit nomen meum ibi"
      en: "And the Lord said: I will remove Juda also from before my face, as I have removed Israel: and I will cast off this city Jerusalem, which I chose, and the house, of which I said: My name shall be there."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "reliqua autem verba Iosiae et universa quae fecit nonne haec scripta sunt in libro verborum dierum regum Iuda"
      en: "Now the rest of the acts of Josias, and all that he did, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "in diebus eius ascendit Pharao Necho rex Aegypti contra regem Assyriorum ad flumen Eufraten et abiit Iosias rex in occursum eius et occisus est in Mageddo cum vidisset eum"
      en: "In his days Pharao Nechao king of Egypt went up against the king of Assyria to the river Euphrates: and king Josias went to meet him: and was slain at Mageddo, when he had seen him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et portaverunt eum servi sui mortuum de Mageddo et pertulerunt in Hierusalem et sepelierunt eum in sepulchro suo tulitque populus terrae Ioahaz filium Iosiae et unxerunt eum et constituerunt eum regem pro patre suo"
      en: "And his servants carried him dead from Mageddo: and they brought him to Jerusalem, and buried him in Iris own sepulchre. And the people of the land took Joachaz the son of Josias: and they anointed him, and made him king in his father's stead."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "viginti trium annorum erat Ioahaz cum regnare coepisset et tribus mensibus regnavit in Hierusalem nomen matris eius Amithal filia Hieremiae de Lobna"
      en: "Joachaz was three and twenty years old when he began to reign, and he reigned three months in Jerusalem: the name of his mother was Amital, the daughter of Jeremias of Lobna."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et fecit malum coram Domino iuxta omnia quae fecerant patres eius"
      en: "And he did evil before the Lord, according to all that his fathers had done."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "vinxitque eum Pharao Necho in Rebla quae est in terra Emath ne regnaret in Hierusalem et inposuit multam terrae centum talentis argenti et talento auri"
      en: "And Pharao Nechao bound him at Rebla, which is in the land of Emath, that he should not reign in Jerusalem: and he set a fine upon the land, of a hundred talents of silver, and a talent of gold."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "regemque constituit Pharao Necho Eliachim filium Iosiae pro Iosia patre eius vertitque nomen eius Ioiachim porro Ioahaz tulit et duxit in Aegyptum"
      en: "And Pharao Nechao made Eliacim the son of Josias king in the room of Josias his father: and turned his name to Joakim. And he took Joachaz away and carried him into Egypt, and he died there."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "argentum autem et aurum dedit Ioiachim Pharaoni cum indixisset terrae per singulos ut conferretur iuxta praeceptum Pharaonis et unumquemque secundum vires suas exegit tam argentum quam aurum de populo terrae ut daret Pharaoni Necho"
      en: "And Joakim gave the silver and the gold to Pharao, after he had taxed the land for every man, to contribute according to the commandment of Pharao: and he exacted both the silver and the gold of the people of the land, of every man according to his ability: to give to Pharao Nechao."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "viginti quinque annorum erat Ioiachim cum regnare coepisset et undecim annis regnavit in Hierusalem nomen matris eius Zebida filia Phadaia de Ruma"
      en: "Joakim was five and twenty years old when he began to reign: and he reigned eleven years in Jerusalem: the name of his mother was Zebida the daughter of Phadaia of Ruma."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et fecit malum coram Domino iuxta omnia quae fecerant patres eius"
      en: "And he did evil before the Lord according to all that his fathers had done."
    status: { la: verified, en: verified }
