# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 23
verses:
  - n: 1
    text:
      la: "Et renuntiaverunt regi quod dixerat. Qui misit: et congregati sunt ad eum omnes senes Juda et Jerusalem."
      en: "And they brought the king word again what she had said. And he sent: and all the ancients of Juda and Jerusalem were assembled to him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ascenditque rex templum Domini, et omnes viri Juda, universique qui habitabant in Jerusalem cum eo sacerdotes et prophetae, et omnis populus a parvo usque ad magnum: legitque, cunctis audientibus, omnia verba libri foederis, qui inventus est in domo Domini."
      en: "And the king went up to the temple of the Lord, and all the men of Juda, and all the inhabitants of Jerusalem with him, the priests and the prophets, and all the people both little and great: and in the hearing of them all he read all the words of the book of the covenant, which was found in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Stetitque rex super gradum: et foedus percussit coram Domino, ut ambularent post Dominum, et custodirent praecepta ejus, et testimonia, et caeremonias in omni corde, et in tota anima, et suscitarent verba foederis hujus, quae scripta erant in libro illo: acquievitque populus pacto."
      en: "And the king stood upon the step: and made a covenant with the Lord, to walk after the Lord, and to keep his commandments, and his testimonies and his ceremonies, with all their heart, and with all their soul, and to perform the words of this covenant, which were written in that book: and the people agreed to the covenant."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et praecepit rex Helciae pontifici, et sacerdotibus secundi ordinis, et janitoribus, ut projicerent de templo Domini omnia vasa, quae facta fuerant Baal, et in luco, et universae militiae caeli: et combussit ea foris Jerusalem in convalle Cedron, et tulit pulverem eorum in Bethel."
      en: "And the king commanded Helcias the high priest, and the priests of the second order, and the doorkeepers, to cast out of the temple of the Lord all the vessels that had been made for Baal, and for the grove, and for all the host of heaven: and he burnt them without Jerusalem in the valley of Cedron, and he carried the ashes of them to Bethel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et delevit aruspices, quos posuerant reges Juda ad sacrificandum in excelsis per civitates Juda, et in circuitu Jerusalem: et eos, qui adolebant incensum Baal, et soli, et lunae, et duodecim signis, et omni militiae caeli."
      en: "And he destroyed the soothsayers, whom the kings of Juda had appointed to sacrifice in the high places in the cities of Juda, and round about Jerusalem: them also that burnt incense to Baal, and to the sun, and to the moon, and to the twelve signs, and to all the host of heaven."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et efferri fecit lucum de domo Domini foras Jerusalem in convalle Cedron, et combussit eum ibi, et redegit in pulverem, et projecit super sepulchra vulgi."
      en: "And he caused the grove to be carried out from the house of the Lord without Jerusalem to the valley of Cedron, and he burnt it there, and reduced it to dust, and cast the dust upon the graves of the common people."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Destruxit quoque aediculas effeminatorum, quae erant in domo Domini, pro quibus mulieres texebant quasi domunculas luci."
      en: "He destroyed also the pavilions of the effeminate, which were in the house of the Lord, for which the women wove as it were little dwellings for the grove."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Congregavitque omnes sacerdotes de civitatibus Juda: et contaminavit excelsa, ubi sacrificabant sacerdotes de Gabaa usque Bersabee: et destruxit aras portarum in introitu ostii Josue principis civitatis, quod erat ad sinistram portae civitatis."
      en: "And he gathered together all the priests out of the cities of Juda: and he defiled the high places, where the priests offered sacrifice, from Gabaa to Bersabee: and he broke down the altars of the gates that were in the entering in of the gate of Josue governor of the city, which was on the left hand of the gate of the city."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Verumtamen non ascendebant sacerdotes excelsorum ad altare Domini in Jerusalem: sed tantum comedebant azyma in medio fratrum suorum."
      en: "However the priests of the high places came not up to the altar of the Lord in Jerusalem: but only ate of the unleavened bread among their brethren."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Contaminavit quoque Topheth, quod est in convalle filii Ennom: ut nemo consecraret filium suum aut filiam per ignem, Moloch."
      en: "And he defiled Topheth, which is in the valley of the son of Ennom: that no man should consecrate there his son or his daughter through fire to Moloch."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Abstulit quoque equos, quos dederant reges Juda soli, in introitu templi Domini juxta exedram Nathanmelech eunuchi, qui erat in Pharurim: currus autem solis combussit igni."
      en: "And he took away the horses which the kings of Juda had given to the sun, at the entering in of the temple of the Lord, near the chamber of Nathanmelech the eunuch, who was in Pharurim: and he burnt the chariots of the sun with fire."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Altaria quoque, quae erant super tecta coenaculi Achaz, quae fecerant reges Juda, et altaria quae fecerat Manasses in duobus atriis templi Domini, destruxit rex, et cucurrit inde, et dispersit cinerem eorum in torrentem Cedron."
      en: "And the altars that were upon the top of the upper chamber of Achaz, which the kings of Juda had made, and the altars which Manasses had made in the two courts of the temple of the Lord, the king broke down: and he ran from thence, and cast the ashes of them into the torrent Cedron."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Excelsa quoque, quae erant in Jerusalem ad dexteram partem montis offensionis, quae aedificaverat Salomon rex Israel Astaroth idolo Sidoniorum, et Chamos offensioni Moab, et Melchom abominationi filiorum Ammon, polluit rex."
      en: "The high places also that were at Jerusalem on the right side of the Mount of Offence, which Solomon king of Israel had built to Astaroth the idol of the Sidonians, and to Chamos the scandal of Moab, and to Melchom the abomination of the children of Ammon, the king defiled."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et contrivit statuas, et succidit lucos: replevitque loca eorum ossibus mortuorum."
      en: "And he broke in pieces the statues, and cut down the groves: and he filled their places with the bones of dead men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Insuper et altare, quod erat in Bethel, et excelsum, quod fecerat Jeroboam filius Nabat, qui peccare fecit Israel: et altare illud, et excelsum destruxit, atque combussit, et comminuit in pulverem, succenditque etiam lucum."
      en: "Moreover the altar also that was at Bethel, and the high place, which Jeroboam the son of Nabat, who made Israel to sin, had made: both the altar, and the high place he broke down and burnt, and reduced to powder, and burnt the grove."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et conversus Josias, vidit ibi sepulchra, quae erant in monte: misitque et tulit ossa de sepulchris, et combussit ea super altare, et polluit illud juxta verbum Domini, quod locutus est vir Dei, qui praedixerat verba haec."
      en: "And as Josias turned himself, he saw there the sepulchres that were in the mount: and he sent and took the bones out of the sepulchres, and burnt them upon the altar, and defiled it according to the word of the Lord, which the man of God spoke, who had foretold these things."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et ait: Quis est titulus ille, quem video? Responderuntque ei cives urbis illius: Sepulchrum est hominis Dei, qui venit de Juda, et praedixit verba haec, quae fecisti super altare Bethel."
      en: "And he said: What is that monument which I see? And the men of that city answered: It is the sepulchre of the man of God, who came from Juda, and foretold these things which thou hast done upon the altar of Bethel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et ait: Dimitte eum, nemo commoveat ossa ejus. Et intacta manserunt ossa illius cum ossibus prophetae, qui venerat de Samaria."
      en: "And he said: Let him alone, let no man move his bones. So his bones were left untouched with the bones of the prophet that came out of Samaria."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Insuper et omnia fana excelsorum, quae erant in civitatibus Samariae, quae fecerant reges Israel ad irritandum Dominum, abstulit Josias: et fecit eis secundum omnia opera quae fecerat in Bethel."
      en: "Moreover all the temples of the high places, which were in the cities of Samaria, which the kings of Israel had made to provoke the Lord, Josias took away: and he did to them according to all the acts that he had done in Bethel."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et occidit universos sacerdotes excelsorum, qui erant ibi super altaria: et combussit ossa humana super ea: reversusque est Jerusalem."
      en: "And he slew all the priests of the high places, that were there, upon the altars: and he burnt men's bones upon them: and returned to Jerusalem."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et praecepit omni populo, dicens: Facite Phase Domino Deo vestro, secundum quod scriptum est in libro foederis hujus."
      en: "And he commanded all the people, saying: Keep the phase to the Lord your God, according as it is written in the book of this covenant."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Nec enim factum est Phase tale a diebus judicum, qui judicaverunt Israel, et omnium dierum regum Israel, et regum Juda,"
      en: "Now there was no such a phase kept from the days of the judges, who judged Israel, nor in all the days of the kings of Israel, and of the kings of Juda,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sicut in octavodecimo anno regis Josiae factum est Phase istud Domino in Jerusalem."
      en: "As was this phase that was kept to the Lord in Jerusalem, in the eighteenth year of king Josias."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Sed et pythones, et ariolos, et figuras idolorum, et immunditias, et abominationes, quae fuerant in terra Juda et Jerusalem, abstulit Josias: ut statueret verba legis, quae scipta sunt in libro, quem invenit Helcias sacerdos in templo Domini."
      en: "Moreover the diviners by spirits, and soothsayers, and the figures of idols, and the uncleannesses, and the abominations, that had been in the land of Juda, and Jerusalem, Josias took away: that he might perform the words of the law, that were written in the book which Helcias the priest had found in the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Similis illi non fuit ante eum rex, qui reverteretur ad Dominum in omni corde suo, et in tota anima sua, et in universa virtute sua juxta omnem legem Moysi: neque post eum surrexit similis illi."
      en: "There was no king before him like unto him, that returned to the Lord with all his heart, and with all his soul, and with ail his strength, according to all the law of Moses: neither after him did there arise any like him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Verumtamen non est aversus Dominus ab ira furoris sui magni, quo iratus est furor ejus contra Judam: propter irritationes, quibus provocaverat eum Manasses."
      en: "But yet the Lord turned not away from the wrath of his great indignation, wherewith his anger was kindled against Juda: because of the provocations, wherewith Manasses had provoked him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Dixit itaque Dominus: Etiam Judam auferam a facie mea, sicut abstuli Israel: et projiciam civitatem hanc, quam elegi Jerusalem, et domum, de qua dixi: Erit nomen meum ibi."
      en: "And the Lord said: I will remove Juda also from before my face, as I have removed Israel: and I will cast off this city Jerusalem, which I chose, and the house, of which I said: My name shall be there."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Reliqua autem sermonum Josiae, et universa quae fecit, nonne haec scripta sunt in libro verborum dierum regum Juda?"
      en: "Now the rest of the acts of Josias, and all that he did, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "In diebus ejus ascendit Pharao Nechao rex Aegypti, contra regem Assyriorum ad flumen Euphraten: et abiit Josias rex in occursum ejus: et occisus est in Mageddo, cum vidisset eum."
      en: "In his days Pharao Nechao king of Egypt went up against the king of Assyria to the river Euphrates: and king Josias went to meet him: and was slain at Mageddo, when he had seen him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et portaverunt eum servi sui mortuum de Mageddo: et pertulerunt in Jerusalem, et sepelierunt eum in sepulchro suo. Tulitque populus terrae Joachaz filium Josiae: et unxerunt eum, et constituerunt eum regem pro patre suo."
      en: "And his servants carried him dead from Mageddo: and they brought him to Jerusalem, and buried him in his own sepulchre. And the people of the land took Joachaz the son of Josias: and they anointed him, and made him king in his father's stead."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Viginti trium annorum erat Joachaz cum regnare coepisset, et tribus mensibus regnavit in Jerusalem: nomen matris ejus Amital, filia Jeremiae, de Lobna."
      en: "Joachaz was three and twenty years old when he began to reign, and he reigned three months in Jerusalem: the name of his mother was Amital, the daughter of Jeremias of Lobna."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et fecit malum coram Domino, juxta omnia quae fecerant patres ejus."
      en: "And he did evil before the Lord, according to all that his fathers had done."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Vinxitque eum Pharao Nechao in Rebla, quae est in terra Emath, ne regnaret in Jerusalem: et imposuit mulctam terrae centum talentis argenti, et talento auri."
      en: "And Pharao Nechao bound him at Rebla, which is in the land of Emath, that he should not reign in Jerusalem: and he set a fine upon the land, of a hundred talents of silver, and a talent of gold."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Regemque constituit Pharao Nechao Eliacim filium Josiae pro Josia patre ejus: vertitque nomen ejus Joakim. Porro Joachaz tulit, et duxit in Aegyptum, et mortuus est ibi."
      en: "And Pharao Nechao made Eliacim the son of Josias king in the room of Josias his father: and turned his name to Joakim. And he took Joachaz away and carried him into Egypt, and he died there."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Argentum autem et aurum dedit Joakim Pharaoni, cum indixisset terrae per singulos, ut conferretur juxta praeceptum Pharaonis: et unumquemque juxta vires suas exegit, tam argentum quam aurum de populo terrae: ut daret Pharaoni Nechao."
      en: "And Joakim gave the silver and the gold to Pharao, after he had taxed the land for every man, to contribute according to the commandment of Pharao: and he exacted both the silver and the gold of the people of the land, of every man according to his ability: to give to Pharao Nechao."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Viginti quinque annorum erat Joakim cum regnare coepisset: et undecim annis regnavit in Jerusalem: nomen matris ejus Zebida filia Phadaia de Ruma."
      en: "Joakim was five and twenty years old when he began to reign: and he reigned eleven years in Jerusalem: the name of his mother was Zebida the daughter of Phadaia of Ruma."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et fecit malum coram Domino juxta omnia quae fecerant patres ejus."
      en: "And he did evil before the Lord according to all that his fathers had done."
    status: { la: verified, en: verified }
