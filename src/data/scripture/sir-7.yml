# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 7
verses:
  - n: 1
    text:
      la: "Noli facere mala, et non te apprehendent:"
      en: "Do no evils, and no evils shall lay hold of thee."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "discede ab iniquo, et deficient mala abs te."
      en: "Depart from the unjust, and evils shall depart from thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Fili, non semines mala in sulcis injustitiae, et non metes ea in septuplum."
      en: "My son, sow not evils in the furrows of injustice, and thou shalt not reap them sevenfold."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Noli quaerere a Domino ducatum, neque a rege cathedram honoris."
      en: "Seek not of the Lord a pre-eminence, nor of the king the seat of honour."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Non te justifices ante Deum, quoniam agnitor cordis ipse est: et penes regem noli velle videri sapiens."
      en: "Justify not thyself before God, for he knoweth the heart: and desire not to appear wise before the king."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Noli quaerere fieri judex, nisi valeas virtute irrumpere iniquitates: ne forte extimescas faciem potentis, et ponas scandalum in aequitate tua."
      en: "Seek not to be made a judge, unless thou have strength enough to extirpate iniquities: lest thou fear the person of the powerful, and lay a stumblingblock for thy integrity."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Non pecces in multitudinem civitatis, nec te immittas in populum:"
      en: "Offend not against the multitude of a city, neither cast thyself in upon the people,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "neque alliges duplicia peccata, nec enim in uno eris immunis."
      en: "Nor bind sin to sin: for even in one thou shalt not be unpunished."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Noli esse pusillanimis in animo tuo:"
      en: "Be not fainthearted in thy mind:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "exorare et facere eleemosynam ne despicias."
      en: "Neglect not to pray, and to give alms."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ne dicas: In multitudine munerum meorum respiciet Deus, et offerente me Deo altissimo, munera mea suscipiet."
      en: "Say not: God will have respect to the multitude of my gifts, and when I offer to the most high God, he will accept my offerings."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Non irrideas hominem in amaritudine animae: est enim qui humiliat et exaltat circumspector Deus."
      en: "Laugh no man to scorn in the bitterness of his soul: for there is one that humbleth and exalteth, God who seeth all."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Noli amare mendacium adversus fratrem tuum, neque in amicum similiter facias."
      en: "Devise not a lie against thy brother: neither do the like against thy friend."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Noli velle mentiri omne mendacium: assiduitas enim illius non est bona."
      en: "Be not willing to make any manner of lie: for the custom thereof is not good."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Noli verbosus esse in multitudine presbyterorum, et non iteres verbum in oratione tua."
      en: "Be not full of words in a multitude of ancients, and repeat not the word in thy prayer."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Non oderis laboriosa opera, et rusticationem creatam ab Altissimo."
      en: "Hate not laborious works, nor husbandry ordained by the most High."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Non te reputes in multitudine indisciplinatorum."
      en: "Number not thyself among the multitude of the disorderly."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Memento irae, quoniam non tardabit."
      en: "Remember wrath, for it will not tarry long."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Humilia valde spiritum tuum, quoniam vindicta carnis impii ignis et vermis."
      en: "Humble thy spirit very much: for the vengeance on the flesh of the ungodly is fire and worms."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Noli praevaricari in amicum pecuniam differentem, neque fratrem carissimum auro spreveris."
      en: "Do not transgress against thy friend deferring money, nor despise thy dear brother for the sake of gold."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Noli discedere a muliere sensata et bona, quam sortitus es in timore Domini: gratia enim verecundiae illius super aurum."
      en: "Depart not from a wise and good wife, whom thou hast gotten in the fear of the Lord: for the grace of her modesty is above gold."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Non laedas servum in veritate operantem, neque mercenarium dantem animam suam."
      en: "Hurt not the servant that worketh faithfully, nor the hired man that giveth thee his life."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Servus sensatus sit tibi dilectus quasi anima tua: non defraudes illum libertate, neque inopem derelinquas illum."
      en: "Let a wise servant be dear to thee as thy own soul, defraud him not of liberty, nor leave him needy."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Pecora tibi sunt, attende illis: et si sunt utilia, perseverent apud te."
      en: "Hast thou cattle? have an eye to them: and if they be for thy profit, keep them with thee."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Filii tibi sunt? erudi illos, et curva illos a pueritia illorum."
      en: "Hast thou children? instruct them, and bow down their neck from their childhood."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Filiae tibi sunt? serva corpus illarum, et non ostendas hilarem faciem tuam ad illas."
      en: "Hast thou daughters? have a care of their body, and shew not thy countenance gay towards them."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Trade filiam, et grande opus feceris: et homini sensato da illam."
      en: "Marry thy daughter well, and thou shalt do a great work, and give her to a wise man."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Mulier si est tibi secundum animam tuam, non projicias illam: et odibili non credas te. In toto corde tuo"
      en: "If thou hast a wife according to thy soul, cast her not off: and to her that is hateful, trust not thyself. With thy whole heart,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "honora patrem tuum, et gemitus matris tuae ne obliviscaris:"
      en: "Honour thy father, and forget not the groanings of thy mother:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "memento quoniam nisi per illos natus non fuisses: et retribue illis, quomodo et illi tibi."
      en: "Remember that thou hadst not been born but through them: and make a return to them as they have done for thee."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "In tota anima tua time Dominum, et sacerdotes illius sanctifica."
      en: "With all thy soul fear the Lord, and reverence his priests."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "In omni virtute tua dilige eum qui te fecit, et ministros ejus ne derelinquas."
      en: "With all thy strength love him that made thee: and forsake not his ministers."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Honora Deum ex tota anima tua, et honorifica sacerdotes, et propurga te cum brachiis."
      en: "Honour God with all thy soul, and give honour to the priests, and purify thyself with thy arms."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Da illis partem, sicut mandatum est tibi, primitiarum et purgationis, et de negligentia tua purga te cum paucis."
      en: "Give them their portion, as it is commanded thee, of the firstfruits and of purifications: and for thy negligences purify thyself with a few."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Datum brachiorum tuorum, et sacrificium sanctificationis offeres Domino, et initia sanctorum."
      en: "Offer to the Lord the gift of thy shoulders, and the sacrifice of sanctification, and the firstfruits of the holy things:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et pauperi porrige manum tuam, ut perficiatur propitiatio et benedictio tua."
      en: "And stretch out thy hand to the poor, that thy expiation and thy blessing may be perfected."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Gratia dati in conspectu omnis viventis, et mortuo non prohibeas gratiam."
      en: "A gift hath grace in the sight of all the living, and restrain not grace from the dead."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Non desis plorantibus in consolatione, et cum lugentibus ambula."
      en: "Be not wanting in comforting them that weep, and walk with them that mourn."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Non te pigeat visitare infirmum: ex his enim in dilectione firmaberis."
      en: "Be not slow to visit the sick: for by these things thou shalt be confirmed in love."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "In omnibus operibus tuis memorare novissima tua, et in aeternum non peccabis."
      en: "In all thy works remember thy last end, and thou shalt never sin."
    status: { la: verified, en: verified }
