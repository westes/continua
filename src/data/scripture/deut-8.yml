# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: deut
chapter: 8
verses:
  - n: 1
    text:
      la: "Omne mandatum, quod ego praecipio tibi hodie, cave diligenter ut facias, ut possitis vivere, et multiplicemini, ingressique possideatis terram, pro qua juravit Dominus patribus vestris."
      en: "All the commandments, that I command thee this day, take great care to observe: that you may live, and be multiplied, and going in may possess the land, for which the Lord swore to your fathers."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et recordaberis cuncti itineris, per quod adduxit te Dominus Deus tuus quadraginta annis per desertum, ut affligeret te, atque tentaret, et nota fierent quae in tuo animo versabantur, utrum custodires mandata illius, an non."
      en: "And thou shalt remember all the way through which the Lord thy God hath brought thee for forty years through the desert, to afflict thee and to prove thee, and that the things that were in thy heart might be made known, whether thou wouldst keep his commandments or no."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Afflixit te penuria, et dedit tibi cibum manna, quod ignorabas tu et patres tui: ut ostenderet tibi quod non in solo pane vivat homo, sed in omni verbo quod egreditur de ore Dei."
      en: "He afflicted thee with want, and gave thee manna for thy food, which neither thou nor thy fathers knew: to shew that not in bread alone doth man live, but in every word that proceedeth from the mouth of God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Vestimentum tuum, quo operiebaris, nequaquam vetustate defecit, et pes tuus non est subtritus, en quadragesimus annus est:"
      en: "Thy raiment, with which thou wast covered, hath not decayed for age, and thy foot is not worn, lo this is the fortieth year,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ut recogites in corde tuo, quia sicut erudit filium suum homo, sic Dominus Deus tuus erudivit te,"
      en: "That thou mayst consider in thy heart, that as a man traineth up his son, so the Lord thy God hath trained thee up."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ut custodias mandata Domini Dei tui, et ambules in viis ejus, et timeas eum."
      en: "That thou shouldst keep the commandments of the Lord thy God, and walk in his ways, and fear him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dominus enim Deus tuus introducet te in terram bonam, terram rivorum, aquarumque et fontium, in cujus campis et montibus erumpunt fluviorum abyssi:"
      en: "For the Lord thy God will bring thee into a good land, of brooks and of waters, and of fountains: in the plains of which and the hills deep rivers break out:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "terram frumenti, hordei ac vinearum, in qua ficus, et malogranata, et oliveta nascuntur: terram olei ac mellis,"
      en: "A land of wheat, and barley, and vineyards, wherein fig trees and pomegranates, and oliveyards grow: a land of oil and honey."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ubi absque ulla penuria comedes panem tuum, et rerum omnium abundantia perfrueris: cujus lapides ferrum sunt, et de montibus ejus aeris metalla fodiuntur:"
      en: "Where without any want thou shalt eat thy bread, and enjoy abundance of all things: where the stones are iron, and out of its hills are dug mines of brass:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ut cum comederis, et satiatus fueris, benedicas Domino Deo tuo pro terra optima, quam dedit tibi."
      en: "That when thou hast eaten, and art full, thou mayst bless the Lord thy God for the excellent land which he hath given thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Observa, et cave nequando obliviscaris Domini Dei tui, et negligas mandata ejus atque judicia et caeremonias, quas ego praecipio tibi hodie:"
      en: "Take heed, and beware lest at any time thou forget the Lord thy God, and neglect his commandments and judgments and ceremonies, which I command thee this day:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ne postquam comederis et satiatus fueris, domos pulchras aedificaveris, et habitaveris in eis,"
      en: "Lest after thou hast eaten and art filled, hast built goodly houses, and dwelt in them,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "habuerisque armenta boum, et ovium greges, argenti et auri, cunctarumque rerum copiam,"
      en: "And shalt have herds of oxen and flocks of sheep, and plenty of gold and of silver, and of all things,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "elevetur cor tuum, et non reminiscaris Domini Dei tui, qui eduxit te de terra Aegypti, de domo servitutis,"
      en: "Thy heart be lifted up, and thou remember not the Lord thy God, who brought thee out of the land of Egypt, out of the house of bondage:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ductor tuus fuit in solitudine magna atque terribili, in qua erat serpens flatu adurens, et scorpio, ac dipsas, et nullae omnino aquae: qui eduxit rivos de petra durissima,"
      en: "And was thy leader in the great and terrible wilderness, wherein there was the serpent burning with his breath, and the scorpion and the dipsas, and no waters at all: who brought forth streams out of the hardest rock,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et cibavit te manna in solitudine, quod nescierunt patres tui. Et postquam afflixit ac probavit, ad extremum misertus est tui,"
      en: "And fed thee in the wilderness with manna which thy fathers knew not. And after he had afflicted and proved thee, at the last he had mercy on thee,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ne diceres in corde tuo: Fortitudo mea, et robur manus meae, haec mihi omnia praestiterunt:"
      en: "Lest thou shouldst say in thy heart: My own might, and the strength of my own hand have achieved all these things for me."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sed recorderis Domini Dei tui, quod ipse vires tibi praebuerit, ut impleret pactum suum, super quo juravit patribus tuis, sicut praesens indicat dies."
      en: "But remember the Lord thy God, that he hath given thee strength, that he might fulfill his covenant, concerning which he swore to thy fathers, as this present day sheweth."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Sin autem oblitus Domini Dei tui, secutus fueris deos alienos, coluerisque illos et adoraveris: ecce nunc praedico tibi quod omnino dispereas."
      en: "But if thou forget the Lord thy God, and follow strange gods, and serve and adore them: behold now I foretell thee that thou shalt utterly perish."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Sicut gentes, quas delevit Dominus in introitu tuo, ita et vos peribitis, si inobedientes fueritis voci Domini Dei vestri."
      en: "As the nations, which the Lord destroyed at thy entrance, so shall you also perish, if you be disobedient to the voice of the Lord your God."
    status: { la: verified, en: verified }
