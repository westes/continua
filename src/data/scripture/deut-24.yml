# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: deut
chapter: 24
verses:
  - n: 1
    text:
      la: "Si acceperit homo uxorem, et habuerit eam, et non invenerit gratiam ante oculos ejus propter aliquam foeditatem: scribet libellum repudii, et dabit in manu illius, et dimittet eam de domo sua."
      en: "If a man take a wife, and have her, and she find not favour in his eyes, for some uncleanness: he shall write a bill of divorce, and shall give it in her hand, and send her out of his house."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cumque egressa alterum maritum duxerit,"
      en: "And when she is departed, and marrieth another husband,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ille quoque oderit eam, dederitque ei libellum repudii, et dimiserit de domo sua, vel certe mortuus fuerit:"
      en: "And he also hateth her, and hath given her a bill of divorce, and hath sent her out of his house or is dead:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "non poterit prior maritus recipere eam in uxorem: quia polluta est, et abominabilis facta est coram Domino: ne peccare facias terram tuam, quam Dominus Deus tuus tradiderit tibi possidendam."
      en: "The former husband cannot take her again to wife: because she is defiled, and is become abominable before the Lord: lest thou cause thy land to sin, which the Lord thy God shall give thee to possess."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cum acceperit homo nuper uxorem, non procedet ad bellum, nec ei quippiam necessitatis injungetur publicae, sed vacabit absque culpa domi suae, ut uno anno laetetur cum uxore sua."
      en: "When a man hath lately taken a wife, he shall not go out to war, neither shall any public business be enjoined him, but he shall be free at home without fault, that for one year he may rejoice with his wife."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Non accipies loco pignoris inferiorem, et superiorem molam: quia animam suam opposuit tibi."
      en: "Thou shalt not take the nether, nor the upper millstone to pledge: for he hath pledged his life to thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Si deprehensus fuerit homo sollicitans fratrem suum de filiis Israel, et vendito eo acceperit pretium, interficietur, et auferes malum de medio tui."
      en: "If any man be found soliciting his brother of the children of Israel, and selling him shall take a price, he shall be put to death, and thou shalt take away the evil from the midst of thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Observa diligenter ne incurras plagam leprae, sed facies quaecumque docuerint te sacerdotes Levitici generis, juxta id quod praecepi eis, et imple sollicite."
      en: "Observe diligently that thou incur not the stroke of the leprosy, but thou shalt do whatsoever the priests of the Levitical race shall teach thee, according to what I have commanded them, and fulfill thou it carefully."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Mementote quae fecerit Dominus Deus vester Mariae in via cum egrederemini de Aegypto."
      en: "Remember what the Lord your God did to Mary, in the way when you came out of Egypt."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Cum repetes a proximo tuo rem aliquam, quam debet tibi, non ingredieris domum ejus ut pignus auferas:"
      en: "When thou shalt demand of thy neighbour any thing that he oweth thee, thou shalt not go into his house to take away a pledge:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sed stabis foris, et ille tibi proferet quod habuerit."
      en: "But then shalt stand without, and he shall bring out to thee what he hath."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Sin autem pauper est, non pernoctabit apud te pignus,"
      en: "But if he be poor, the pledge shall not lodge with thee that night,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sed statim reddes ei ante solis occasum: ut dormiens in vestimento suo, benedicat tibi, et habeas justitiam coram Domino Deo tuo."
      en: "But thou shalt restore it to him presently before the going down of the sun: that he may sleep in his own raiment and bless thee, and thou mayst have justice before the Lord thy God."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Non negabis mercedem indigentis, et pauperis fratris tui, sive advenae, qui tecum moratur in terra, et intra portas tuas est:"
      en: "Thou shalt not refuse the hire of the needy, and the poor, whether he be thy brother, or a stranger that dwelleth with thee in the land, and is within thy gates:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sed eadem die reddes ei pretium laboris sui ante solis occasum, quia pauper est, et ex eo sustentat animam suam: ne clamet contra te ad Dominum, et reputetur tibi in peccatum."
      en: "But thou shalt pay him the price of his labour the same day, before the going down of the sun, because he is poor, and with it maintaineth his life: lest he cry against thee to the Lord, and it be reputed to thee for a sin."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Non occidentur patres pro filiis, neque filii pro patribus, sed unusquisque pro peccato suo morietur."
      en: "The fathers shall not be put to death for the children, nor the children for the fathers, but every one shall die for his own sin."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Non pervertes judicium advenae et pupilli, nec auferes pignoris loco viduae vestimentum."
      en: "Thou shalt not pervert the judgment of the stranger nor of the fatherless, neither shalt thou take away the widow's raiment for a pledge."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Memento quod servieris in Aegypto, et eruerit te Dominus Deus tuus inde. Idcirco praecipio tibi ut facias hanc rem."
      en: "Remember that thou wast a slave in Egypt, and the Lord thy God delivered thee from thence. Therefore I command thee to do this thing."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Quando messueris segetem in agro tuo, et oblitus manipulum reliqueris, non reverteris, ut tollas illum: sed advenam, et pupillum, et viduam auferre patieris, ut benedicat tibi Dominus Deus tuus in omni opere manuum tuarum."
      en: "When thou hast reaped the corn in thy field, and hast forgot and left a sheaf, thou shalt not return to take it away: but thou shalt suffer the stranger, and the fatherless and the widow to take it away: that the Lord thy God may bless thee in all the works of thy hands."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Si fruges collegeris olivarum, quidquid remanserit in arboribus, non reverteris ut colligas: sed relinques advenae, pupillo, ac viduae."
      en: "If thou have gathered the fruit of thy olive trees, thou shalt not return to gather whatsoever remaineth on the trees: but shalt leave it for the stranger, for the fatherless, and the widow."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Si vindemiaveris vineam tuam, non colliges remanentes racemos: sed cedent in usus advenae, pupilli, ac viduae."
      en: "If thou make the vintage of thy vineyard, thou shalt not gather the clusters that remain, but they shall be for the stranger, the fatherless, and the widow."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Memento quod et tu servieris in Aegypto, et idcirco praecipio tibi ut facias hanc rem."
      en: "Remember that thou also wast a bondman in Egypt, and therefore I command thee to do this thing."
    status: { la: verified, en: verified }
