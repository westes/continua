book: ezek
chapter: 20
verses:
  - n: 1
    text:
      la: "et factum est in anno septimo in quinto mense in decima mensis venerunt viri de senioribus Israhel ut interrogarent Dominum et sederunt coram me"
      en: "And it came to pass in the seventh year, in the fifth month, the tenth day of the month: there came men of the ancients of Israel to inquire of the Lord, and they sat before me."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et factus est sermo Domini ad me dicens"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "fili hominis loquere senioribus Israhel et dices ad eos haec dicit Dominus Deus num ad interrogandum me vos venistis vivo ego quia non respondebo vobis ait Dominus Deus"
      en: "Son of man, speak to the ancients of Israel, and say to them: Thus saith the Lord God: Are you come to inquire of me? As I live, I will not answer you, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "si iudicas eos si iudicas fili hominis abominationes patrum eorum ostende eis"
      en: "If thou judgest them, if thou judgest, son of man, declare to them the abominations of their fathers."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et dices ad eos haec dicit Dominus Deus in die qua elegi Israhel et levavi manum meam pro stirpe domus Iacob et apparui eis in terra Aegypti et levavi manum meam pro eis dicens ego Dominus Deus vester"
      en: "And say to them: Thus saith the Lord God : In the day when I chose Israel, and lifted up my hand for the race of the house of Jacob: and appeared to them in the land of Egypt, and lifted up my hand for them, saying: I am the Lord your God:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in die illa levavi manum meam pro eis ut educerem eos de terra Aegypti in terram quam provideram eis fluentem lacte et melle quae est egregia inter omnes terras"
      en: "In that day I lifted up my hand for them, to bring them out of the land of Egypt, into a land which I had provided for them, flowing with milk and honey, which excelleth amongst all lands."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et dixi ad eos unusquisque offensiones oculorum suorum abiciat et in idolis Aegypti nolite pollui ego Dominus Deus vester"
      en: "And I said to them: Let every man cast away the scandals of his eyes, and defile not yourselves with the idols of Egypt: I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et inritaverunt me nolueruntque audire unusquisque abominationes oculorum suorum non proiecit nec idola Aegypti reliquerunt et dixi ut effunderem indignationem meam super eos et implerem iram meam in eis in medio terrae Aegypti"
      en: "But they provoked me, and would not hearken to me: they did not every man cast away the abominations of his eyes, neither did they forsake the idols of Egypt: and I said I would pour out my indignation upon them, and accomplish my wrath against them in the midst of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et feci propter nomen meum ut non violaretur coram gentibus in quarum medio erant et inter quas apparui eis ut educerem eos de terra Aegypti"
      en: "But I did otherwise for my name's sake, that it might not be violated before the nations, in the midst of whom they were, and among whom I made myself known to them, to bring them out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "eieci ergo eos de terra Aegypti et eduxi in desertum"
      en: "Therefore I brought them out from the land of Egypt, and brought them into the desert."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dedi eis praecepta mea et iudicia mea ostendi eis quae faciat homo et vivat in eis"
      en: "And I gave them my statutes, and I shewed them my judgments, which if a man do, he shall live in them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "insuper et sabbata mea dedi eis ut esset signum inter me et eos et scirent quia ego Dominus sanctificans eos"
      en: "Moreover I gave them also my sabbaths, to be a sign between me and them: and that they might know that I am the Lord that sanctify them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et inritaverunt me domus Israhel in deserto in praeceptis meis non ambulaverunt et iudicia mea proiecerunt quae faciens homo vivet in eis et sabbata mea violaverunt vehementer dixi ergo ut effunderem furorem meum super eos in deserto et consumerem eos"
      en: "But the house of Israel provoked me in the desert: they walked not in my statutes, and they cast away my judgments, which if a man do he shall live in them: and they grievously violated my sabbaths. I said therefore that I would pour out my indignation upon them in the desert, and would consume them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et feci propter nomen meum ne violaretur coram gentibus de quibus eieci eos in conspectu earum"
      en: "But I spared them for the sake of my name, lest it should be profaned before the nations, from which I brought them out, in their sight."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ego igitur levavi manum meam super eos in deserto ne inducerem eos in terram quam dedi eis fluentem lacte et melle praecipuam terrarum omnium"
      en: "So I lifted up my hand over them in the desert, not to bring them into the land which I had given them flowing with milk and honey, the best of all lands."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quia iudicia mea proiecerunt et in praeceptis meis non ambulaverunt et sabbata mea violaverunt post idola enim cor eorum gradiebatur"
      en: "Because they cast off my judgments, and walked not in my statutes, and violated my sabbaths: for their heart went after idols."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et pepercit oculus meus super eos ut non interficerem eos nec consumpsi eos in deserto"
      en: "Yet my eye spared them, so that I destroyed them not: neither did I consume them in the desert."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dixi autem ad filios eorum in solitudine in praeceptis patrum vestrorum nolite incedere nec iudicia eorum custodiatis nec in idolis eorum polluamini"
      en: "And I said to their children in the wilderness: Walk not in the statutes of your fathers, and observe not their judgments, nor be ye defiled with their idols:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ego Dominus Deus vester in praeceptis meis ambulate et iudicia mea custodite et facite ea"
      en: "I am the Lord your God: walk ye in my statutes, and observe my judgments, and do them."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et sabbata mea sanctificate ut sit signum inter me et vos et sciatur quia ego Dominus Deus vester"
      en: "And sanctify my sabbaths, that they may be a sign between me and you: and that you may know that I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et exacerbaverunt me filii in praeceptis meis non ambulaverunt et iudicia mea non custodierunt ut facerent ea quae cum fecerit homo vivet in eis et sabbata mea violaverunt et comminatus sum ut effunderem furorem meum super eos et implerem iram meam in eis in deserto"
      en: "But their children provoked me, they walked not in my commandments, nor observed my judgments to do them: which if a man do, he shell live in them: and they violated my sabbaths: and I threatened to pour out my indignation upon them, and to accomplish my wrath in them in the desert."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "averti autem manum meam et feci propter nomen meum ut non violaretur coram gentibus de quibus eieci eos in oculis earum"
      en: "But I turned away my hand, and wrought for my name's sake, that it might not be violated before the nations, out of which I brought them forth in their sight."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "iterum levavi manum meam in eos in solitudine ut dispergerem illos in nationes et ventilarem in terras"
      en: "Again I lifted up my hand upon them in the wilderness, to disperse them among the nations, and scatter them through the countries :"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "eo quod iudicia mea non fecissent et praecepta mea reprobassent et sabbata mea violassent et post idola patrum suorum fuissent oculi eorum"
      en: "Because they had not done my judgments, and had cast off my statutes, and had violated my sabbaths, and their eyes had been after the idols of their fathers."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ergo et ego dedi eis praecepta non bona et iudicia in quibus non vivent"
      en: "Therefore I also gave them statutes that were not good, and judgments, in which they shall not live."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et pollui eos in muneribus suis cum offerrent omne quod aperit vulvam propter delicta sua et scient quia ego Dominus"
      en: "And I polluted them in their own gifts, when they offered all that opened the womb, for their offences: and they shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "quam ob rem loquere ad domum Israhel fili hominis et dices ad eos haec dicit Dominus Deus adhuc et in hoc blasphemaverunt me patres vestri cum sprevissent me contemnentes"
      en: "Wherefore speak to the house of Israel, O son of man, and say to them: Thus saith the Lord God: Moreover in this also your fathers blasphemed me, when they had despised and contemned me;"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et induxissem eos in terram super quam levavi manum meam ut darem eis viderunt omnem collem excelsum et omne lignum nemorosum et immolaverunt ibi victimas suas et dederunt ibi inritationem oblationis suae et posuerunt ibi odorem suavitatis suae et libaverunt libationes suas"
      en: "And I had brought them into the land, for which I lifted up my hand to give it them: they saw every high hill, and every shady tree, and there they sacrificed their victims: and there they presented the provocation of their offerings, and there they set their sweet odours, and poured forth their libations."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et dixi ad eos quid est excelsum ad quod vos ingredimini et vocatum est nomen eius Excelsum usque ad hanc diem"
      en: "And I said to them: What meaneth the high place to which you go? and the name thereof was called High-place even to this day."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "propterea dic ad domum Israhel haec dicit Dominus Deus certe in via patrum vestrorum vos polluimini et post offendicula eorum vos fornicamini"
      en: "Wherefore say to the house of Israel: Thus saith the Lord God: Verily, you are defiled in the way of your fathers, and you commit fornication with their abominations."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et in oblatione donorum vestrorum cum transducitis filios vestros per ignem vos polluimini in omnibus idolis vestris usque hodie et ego respondebo vobis domus Israhel vivo ego dicit Dominus Deus quia non respondebo vobis"
      en: "And you defile yourselves with all your: idols unto this day, in the offering of your gifts, when you make your children pass through the fire: and shall I answer you, O house of Israel? As I live, saith the Lord God, I will not answer you."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "neque cogitatio mentis vestrae fiet dicentium erimus sicut gentes et sicut cognationes terrae ut colamus ligna et lapides"
      en: "Neither shall the thought of your mind come to pass, by which you say: We will be as the Gentiles, and as the families of the earth, to worship stocks and stones."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "vivo ego dicit Dominus Deus quoniam in manu forti et brachio extento et in furore effuso regnabo super vos"
      en: "As I live, saith the Lord God, I will reign over you with a strong hand, and with a stretched out arm, and with fury poured out."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et educam vos de populis et congregabo vos de terris in quibus dispersi estis in manu valida et brachio extento et in furore effuso regnabo super vos"
      en: "And I will bring you out from the people, and I will gather you out of the countries, in which you are scattered, I will reign over you with a strong hand, and with a stretched out arm, and with fury poured out."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et adducam vos in desertum populorum et iudicabor vobiscum ibi facie ad faciem"
      en: "And I will bring you into the wilderness of people, and there will I plead with you face to face."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "sicut iudicio contendi adversum patres vestros in deserto terrae Aegypti sic iudicabo vos dicit Dominus Deus"
      en: "As I pleaded against your fathers in the desert of the land of Egypt; even so will I judge you, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et subiciam vos sceptro meo et inducam vos in vinculis foederis"
      en: "And I will make you subject to my sceptre, and will bring you into the bands of the covenant."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et eligam de vobis transgressores et impios et de terra incolatus eorum educam eos et terram Israhel non ingredientur et scietis quia ego Dominus"
      en: "And I will pick out from among you the transgressors, and the wicked, and will bring them out of the land where they sojourn, and they shall not enter into the land of Israel: and you shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et vos domus Israhel haec dicit Dominus Deus singuli post idola vestra ambulate et servite eis quod si et in hoc non audieritis me et nomen meum sanctum pollueritis ultra in muneribus vestris et in idolis vestris"
      en: "And as for you, O house of Israel: thus saith the Lord God: Walk ye every one after your idols, and serve them. But if in this also you hear me not, but defile my holy name any more with your gifts, and with your idols;"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "in monte sancto meo in monte excelso Israhel ait Dominus Deus ibi serviet mihi omnis domus Israhel omnes inquam in terra in qua placebunt mihi et ibi quaeram primitias vestras et initium decimarum vestrarum in omnibus sanctificationibus vestris"
      en: "In my holy mountain, in the high mountain of Israel, saith the Lord God, there shall all the house of Israel serve me; all of them I say, in the land in which they shall please me, and there will I require your firstfruits, and the chief of your tithes with all your sanctifications."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "in odorem suavitatis suscipiam vos cum eduxero vos de populis et congregavero vos de terris in quas dispersi estis et sanctificabor in vobis in oculis nationum"
      en: "I will accept of you for an odour of sweetness, when I shall have brought you out from the people, and shall have gathered you out of the lands into which you are scattered, and I will be sanctified in you in the sight of the nations."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et scietis quia ego Dominus cum induxero vos ad terram Israhel in terram pro qua levavi manum meam ut darem eam patribus vestris"
      en: "And you shall know that I am the Lord, when I shall have brought you into the land of Israel, into the land for which I lifted up my hand to give it to your fathers."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et recordabimini ibi viarum vestrarum et omnium scelerum vestrorum quibus polluti estis in eis et displicebitis vobis in conspectu vestro in omnibus malitiis vestris quas fecistis"
      en: "And there you shall remember your ways, and all your wicked doings with which you have been defiled; and you shall be displeased with yourselves in your own sight, for all your wicked deeds which you committed."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et scietis quia ego Dominus cum benefecero vobis propter nomen meum non secundum vias vestras malas neque secundum scelera vestra pessima domus Israhel ait Dominus Deus"
      en: "And you shall know that I am the Lord, when I shall have done well by you for my own name's sake, and not according to your evil ways, nor according to your wicked deeds, O house of Israel, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et factus est sermo Domini ad me dicens"
      en: "And the word of the Lord came to me, saying :"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "fili hominis pone faciem tuam contra viam austri et stilla ad africum et propheta ad saltum agri meridiani"
      en: "Son of man, set thy face against the way of the south, and drop towards the south, and prophesy against the forest of the south field."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et dices saltui meridiano audi verbum Domini haec dicit Dominus Deus ecce ego succendam in te ignem et conburam in te omne lignum viride et omne lignum aridum non extinguetur flamma succensionis et conburetur in ea omnis facies ab austro usque ad aquilonem"
      en: "And any to the south forest: Hear the word of the Lord: Thus saith the Lord God: Behold I will kindle a fire in thee, and will burn in thee every green tree, and every dry tree: the dame of the fire shall not be quenched: and every face shall be burned in it, from the south even to the north."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et videbit universa caro quia ego Dominus succendi eam nec extinguetur"
      en: "And all flesh shall see, that I the Lord have kindled it, and it shall not be quenched."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "et dixi ha ha ha Domine Deus ipsi dicunt de me numquid non per parabolas loquitur iste"
      en: "And I said: Ah, ah, ah, O Lord God: they say of me: Doth not this man speak by parables?"
    status: { la: verified, en: verified }
