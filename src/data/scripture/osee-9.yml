# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: osee
chapter: 9
verses:
  - n: 1
    text:
      la: "noli laetari Israhel noli exultare sicut populi quia fornicatus es a Deo tuo dilexisti mercedem super omnes areas tritici"
      en: "Rejoice not, O Israel: rejoice not as the nations do: for thou hast committed fornication against thy God, thou hast loved a reward upon every cornfloor."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "area et torcular non pascet eos et vinum mentietur eis"
      en: "The floor and the winepress shall not feed them, and the wine shall deceive them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "non habitabunt in terra Domini reversus est Ephraim Aegyptum et in Assyriis pollutum comedit"
      en: "They shall not dwell in the Lord's land: Ephraim is returned to Egypt, and hath eaten unclean things among the Assyrians."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "non libabunt Domino vinum et non placebunt ei sacrificia eorum quasi panis lugentium omnes qui comedunt eum contaminabuntur quia panis eorum animae ipsorum non intrabit in domum Domini"
      en: "They shall not offer wine to the Lord, neither shall they please him: their sacrifices shall be like the bread of mourners: all that shall eat it shall be defiled: for their bread is life for their soul, it shall not enter into the house of the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quid facietis in die sollemni in die festivitatis Domini"
      en: "What will you do in the solemn day, in the day of the feast of the Lord?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ecce enim profecti sunt a vastitate Aegyptus congregavit eos Memphis sepeliet eos desiderabile argenti eorum urtica hereditabit lappa in tabernaculis eorum"
      en: "For behold they are gone because of destruction: Egypt shall gather them together, Memphis shall bury them: nettles shall inherit their beloved silver, the bur shall be in their tabernacles."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "venerunt dies visitationis venerunt dies retributionis scitote Israhel stultum prophetam insanum virum spiritalem propter multitudinem iniquitatis tuae et multitudo amentiae"
      en: "The days of visitation are come, the days of repaying are come: know ye, O Israel, that the prophet was foolish, the spiritual man was mad, for the multitude of thy iniquity, and the multitude of thy madness."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "speculator Ephraim cum Deo meo propheta laqueus ruinae super omnes vias eius insania in domo Dei eius"
      en: "The watchman of Ephraim was with my God: the prophet is become a snare of ruin upon all his ways, madness is in the house of his God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "profunde peccaverunt sicut in diebus Gabaa recordabitur iniquitatis eorum et visitabit peccata eorum"
      en: "They have sinned deeply, as in the days of Gabaa: he will remember their iniquity, and will visit their sin."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quasi uvas in deserto inveni Israhel quasi prima poma ficulneae in cacumine eius vidi patres eorum ipsi autem intraverunt ad Beelphegor et abalienati sunt in confusione et facti sunt abominabiles sicut ea quae dilexerunt"
      en: "I found Israel like grapes in the desert, I saw their fathers like the firstfruits of the fig tree in the top thereof: but they went in to Beelphegor, and alienated themselves to that confusion, and became abominable, as those things were, which they loved."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ephraim quasi avis avolavit gloria eorum a partu et ab utero et a conceptu"
      en: "As for Ephraim, their glory hath flown away like a bird from the birth, and from the womb, and from the conception."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quod si et enutrierint filios suos absque liberis eos faciam in hominibus sed et vae eis cum recessero ab eis"
      en: "And though they should bring up their children, I will make them without children among men: yea, and woe to them, when I shall depart from them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ephraim ut vidi Tyrus erat fundata in pulchritudine et Ephraim educit ad interfectorem filios suos"
      en: "Ephraim, as I saw, was a Tyre founded in beauty: and Ephraim shall bring out his children to the murderer."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "da eis Domine quid dabis eis da eis vulvam sine liberis et ubera arentia"
      en: "Give them, O Lord. What wilt thou give them? Give them a womb without children, and dry breasts."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "omnes nequitiae eorum in Galgal quia ibi exosos habui eos propter malitiam adinventionum eorum de domo mea eiciam eos non addam ut diligam eos omnes principes eorum recedentes"
      en: "All their wickedness is in Galgal, for there I hated them: for the wickedness of their devices I will cast them forth out of my house: I will love them no more, all their princes are revolters."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "percussus est Ephraim radix eorum exsiccata est fructum nequaquam facient quod si et genuerint interficiam amantissima uteri eorum"
      en: "Ephraim is struck, their root is dried up, they shall yield no fruit. And if they should have issue, I will slay the best beloved fruit of their womb."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "abiciet eos Deus meus quia non audierunt eum et erunt vagi in nationibus"
      en: "My God will cast them away, because they hearkened not to him: and they shall be wanderers among the nations."
    status: { la: verified, en: verified }
