# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 5
verses:
  - n: 1
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Praecipe filiis Israel, ut ejiciant de castris omnem leprosum, et qui semine fluit, pollutusque est super mortuo:"
      en: "Command the children of Israel, that they cast out of the camp every leper, and whosoever hath an issue of seed, or is defiled by the dead:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "tam masculum quam feminam ejicite de castris, ne contaminent ea cum habitaverint vobiscum."
      en: "Whether it be man or woman, cast ye them out of the camp, lest they defile it when I shall dwell with you."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Feceruntque ita filii Israel, et ejecerunt eos extra castra, sicut locutus erat Dominus Moysi."
      en: "And the children of Israel did so, and they cast them forth without the camp, as the Lord had spoken to Moses."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Loquere ad filios Israel: Vir, sive mulier, cum fecerint ex omnibus peccatis, quae solent hominibus accidere, et per negligentiam transgressi fuerint mandatum Domini, atque deliquerint,"
      en: "Say to the children of Israel: When a man or woman shall have committed any of all the sins that men are wont to commit, and by negligence shall have transgressed the commandment of the Lord, and offended,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "confitebuntur peccatum suum, et reddent ipsum caput, quintamque partem desuper, ei in quem peccaverint."
      en: "They shall confess their sin, and restore the principal itself, and the fifth part over and above, to him against whom they have sinned."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sin autem non fuerit qui recipiat, dabunt Domino, et erit sacerdotis, excepto ariete, qui offertur pro expiatione, ut sit placabilis hostia."
      en: "But if there be no one to receive it, they shall give it to the Lord, and it shall be the priest's, besides the ram that is offered for expiation, to be an atoning sacrifice."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Omnes quoque primitiae, quas offerunt filii Israel, ad sacerdotem pertinent:"
      en: "All the firstfruits also, which the children of Israel offer, belong to the priest:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et quidquid in sanctuarium offertur a singulis, et traditur manibus sacerdotis, ipsius erit."
      en: "And whatsoever is offered into the sanctuary by every one, and is delivered into the hands of the priest, it shall be his."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Loquere ad filios Israel, et dices ad eos: Vir cujus uxor erraverit, maritumque contemnens"
      en: "Speak to the children of Israel, and thou shalt say to them: The man whose wife shall have gone astray, and contemning her husband,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dormierit cum altero viro, et hoc maritus deprehendere non quiverit, sed latet adulterium, et testibus argui non potest, quia non est inventa in stupro:"
      en: "Shall have slept with another man, and her husband cannot discover it, but the adultery is secret, and cannot be proved by witnesses, because she was not found in the adultery:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "si spiritus zelotypiae concitaverit virum contra uxorem suam, quae vel polluta est, vel falsa suspicione appetitur:"
      en: "If the spirit of jealousy stir up the husband against his wife, who either is defiled, or is charged with false suspicion,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "adducet eam ad sacerdotem, et offeret oblationem pro illa, decimam partem sati farinae hordeaceae: non fundet super eam oleum, nec imponet thus: quia sacrificium zelotypiae est, et oblatio investigans adulterium."
      en: "He shall bring her to the priest, and shall offer an oblation for her, the tenth part of a measure of barley meal: he shall not pour oil thereon, nor put frankincense upon it: because it is a sacrifice of jealousy, and an oblation searching out adultery."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Offeret igitur eam sacerdos, et statuet coram Domino,"
      en: "The priest therefore shall offer it, and set it before the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "assumetque aquam sanctam in vase fictili, et pauxillum terrae de pavimento tabernaculi mittet in eam."
      en: "And he shall take holy water in an earthen vessel, and he shall cast a little earth of the pavement of the tabernacle into it."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Cumque steterit mulier in conspectu Domini, discooperiet caput ejus, et ponet super manus illius sacrificium recordationis, et oblationem zelotypiae: ipse autem tenebit aquas amarissimas, in quibus cum execratione maledicta congessit."
      en: "And when the woman shall stand before the Lord, he shall uncover her head, and shall, put on her hands the sacrifice of remembrance, and the oblation of jealousy: and he himself shall hold the most bitter waters, whereon he hath heaped curses with execration."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Adjurabitque eam, et dicet: Si non dormivit vir alienus tecum, et si non polluta es deserto mariti throno, non te nocebunt aquae istae amarissimae, in quas maledicta congessi."
      en: "And he shall adjure her, and shall say: If another man hath not slept with thee, and if thou be not defiled by forsaking thy husband's bed, these most bitter waters, on which I have heaped curses, shall not hurt thee."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Sin autem declinasti a viro tuo, atque polluta es, et concubuisti cum altero viro:"
      en: "But if thou hast gone aside from thy husband, and art defiled, and hast lain with another man:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "his maledictionibus subjacebis: det te Dominus in maledictionem, exemplumque cunctorum in populo suo: putrescere faciat femur tuum, et tumens uterus tuus disrumpatur."
      en: "These curses shall light upon thee: The Lord make thee a curse, and an example for all among his people: may he make thy thigh to rot, and may thy belly swell and burst asunder."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ingrediantur aquae maledictae in ventrem tuum, et utero tumescente putrescat femur. Et respondebit mulier: Amen, amen."
      en: "Let the cursed waters enter into thy belly, and may thy womb swell and thy thigh rot. And the woman shall answer, Amen, amen."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Scribetque sacerdos in libello ista maledicta, et delebit ea aquis amarissimis, in quas maledicta congessit,"
      en: "And the priest shall write these curses in a book, and shall wash them out with the most bitter waters, upon which he hath heaped the curses,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et dabit ei bibere. Quas cum exhauserit,"
      en: "And he shall give them her to drink. And when she hath drunk them up,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "tollet sacerdos de manu ejus sacrificium zelotypiae, et elevabit illud coram Domino, imponetque illud super altare, ita dumtaxat ut prius:"
      en: "The priest shall take from her hand the sacrifice of jealousy, and shall elevate it before the Lord, and shall put it upon the altar: yet so as first,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "pugillum sacrificii tollat de eo, quod offertur, et incendat super altare: et sic potum det mulieri aquas amarissimas."
      en: "To take a handful of the sacrifice of that which is offered, and burn it upon the altar: and so give the most bitter waters to the woman to drink."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Quas cum biberit, si polluta est, et contempto viro adulterii rea, pertransibunt eam aquae maledictionis, et inflato ventre, computrescet femur: eritque mulier in maledictionem, et in exemplum omni populo."
      en: "And when she hath drunk them, if she be defiled, and having despised her husband be guilty of adultery, the malediction shall go through her, and her belly swelling, her thigh shall rot: and the woman shall be a curse, and an example to all the people."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Quod si polluta non fuerit, erit innoxia, et faciet liberos."
      en: "But if she be not defiled, she shall not be hurt, and shall bear children."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Ista est lex zelotypiae. Si declinaverit mulier a viro suo, et si polluta fuerit,"
      en: "This is the law of jealousy. If a woman hath gone aside from her husband, and be defiled,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "maritusque zelotypiae spiritu concitatus adduxerit eam in conspectu Domini, et fecerit ei sacerdos juxta omnia quae scripta sunt:"
      en: "And the husband stirred up by the spirit of jealousy bring her before the Lord, and the priest do to her according to all things that are here written:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "maritus absque culpa erit, et illa recipiet iniquitatem suam."
      en: "The husband shall be blameless, and she shall bear her iniquity."
    status: { la: verified, en: verified }
