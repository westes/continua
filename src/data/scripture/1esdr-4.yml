# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1esdr
chapter: 4
verses:
  - n: 1
    text:
      la: "audierunt autem hostes Iudae et Beniamin quia filii captivitatis aedificarent templum Domino Deo Israhel"
      en: "Now the enemies of Juda and Benjamin heard that the children of the captivity were building a temple to the Lord the God of Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et accedentes ad Zorobabel et ad principes patrum dixerunt eis aedificemus vobiscum quia ita ut vos quaerimus Deum vestrum ecce nos immolamus victimas ex diebus Asoraddan regis Assur qui adduxit nos huc"
      en: "And they came to Zorobabel, and the chief of the fathers, and said to them: Let us build with you, for we seek your God as ye do: behold we have sacrificed to him, since the days of Asor Haddan king of Assyria, who brought us hither."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dixit eis Zorobabel et Iosue et reliqui principes patrum Israhel non est vobis et nobis ut aedificemus domum Deo nostro sed nos ipsi soli aedificabimus Domino Deo nostro sicut praecepit nobis rex Cyrus rex Persarum"
      en: "But Zorobabel, and Josue, and the rest of the chief of the fathers of Israel said to them: You have nothing to do with us to build a house to our God, but we ourselves alone will build to the Lord our God, as Cyrus king of the Persians hath commanded us."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "factum est igitur ut populus terrae inpediret manus populi Iudae et turbaret eos in aedificando"
      en: "Then the people of the land hindered the hands of the people of Juda, and troubled them in building."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "conduxerunt quoque adversum eos consiliatores ut destruerent consilium eorum omnibus diebus Cyri regis Persarum et usque ad regnum Darii regis Persarum"
      en: "And they hired counsellors against them, to frustrate their design all the days of Cyrus king of Persia, even until the reign of Darius king of the Persians."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in regno autem Asueri principio regni eius scripserunt accusationem adversum habitatores Iudae et Hierusalem"
      en: "And in the reign of Assuerus, in the beginning of his reign, they wrote an accusation against the inhabitants of Juda and Jerusalem."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et in diebus Artarxersis scripsit Beselam Mitridatis et Tabel et reliqui qui erant in consilio eorum ad Artarxersen regem Persarum epistula autem accusationis scripta erat syriace et legebatur sermone syro"
      en: "And in the days of Artaxerxes, Beselam, Mithridates, and Thabeel, and the rest that were in the council wrote to Artaxerxes king of the Persians : and the letter of accusation was written in Syriac, and was read in the Syrian tongue."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Reum Beelteem et Samsai scriba scripserunt epistulam unam de Hierusalem Artarxersi regi huiuscemodi"
      en: "Reum Beelteem, and Samsai the scribe wrote a letter from Jerusalem to king Artaxerxes, in this manner:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Reum Beelteem et Samsai scriba et reliqui consiliatores eorum Dinei et Apharsathei Terphalei Apharsei Erchuei Babylonii Susannechei Deaei Aelamitae"
      en: "Reum Beelteem, and Samsai the scribe and the rest of their counsellors, the Dinites, and the Apharsathacites, the Therphalites, the Apharsites, the Erchuites, the Babylonians, the Susanechites, the Dievites, and the Elamites,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et ceteri de gentibus quas transtulit Asennaphar magnus et gloriosus et habitare eas fecit in civitatibus Samariae et in reliquis regionibus trans Flumen in pace"
      en: "And the rest of the nations, whom the great and glorious Asenaphar brought over: and made to dwell in the cities of Samaria and in the rest of the countries of this side of the river in peace."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "hoc est exemplar epistulae quam miserunt ad eum Artarxersi regi servi tui viri qui sunt trans Fluvium salutem dicunt"
      en: "(This is the copy of the letter, which they sent to him:) To Artaxerxes the king, thy servants, the men that are on this side of the river, send greeting."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "notum sit regi quia Iudaei qui ascenderunt a te ad nos venerunt in Hierusalem civitatem rebellem et pessimam quam aedificant extruentes muros eius et parietes conponentes"
      en: "Be it known to the king, that the Jews, who came up from thee to us, are come to Jerusalem a rebellious and wicked city, which they are building, setting up the ramparts thereof and repairing the walls."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "nunc igitur notum sit regi quia si civitas illa aedificata fuerit et muri eius instaurati tributum et vectigal et annuos reditus non dabunt et usque ad reges haec noxa perveniet"
      en: "And now be it known to the king, that if this city be built up, and the walls thereof repaired, they will not pay tribute nor toll, nor yearly revenues, and this loss will fail upon the kings."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "nos ergo memores salis quod in palatio comedimus et quia laesiones regis videre nefas ducimus idcirco misimus et nuntiavimus regi"
      en: "But we remembering the salt that we have eaten in the palace, and because we count it a crime to see the king wronged, have therefore sent and certified the king,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ut recenseas in libris historiarum patrum tuorum et invenies scriptum in commentariis et scies quoniam urbs illa urbs rebellis est et nocens regibus et provinciis et bella concitant in ea ex diebus antiquis quam ob rem et civitas ipsa destructa est"
      en: "That search may be made in the books of the histories of thy fathers, and thou shalt find written in the records: and shalt know that this city is a rebellious city, and hurtful to the kings and provinces, and that wars were raised therein of old time: for which cause also the city was destroyed."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "nuntiamus nos regi quoniam si civitas illa aedificata fuerit et muri ipsius instaurati possessionem trans Fluvium non habebis"
      en: "We certify the king, that if this city be built, and the walls thereof repaired, thou shalt have no possession on this side of the river."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "verbum misit rex ad Reum Beelteem et Samsai scribam et ad reliquos qui erant in consilio eorum habitatores Samariae et ceteris trans Fluvium salutem dicens et pacem"
      en: "The king sent word to Reum Beelteem and Samsai the scribe, and to the rest that were in their council, inhabitants of Samaria, and to the rest beyond the river, sending greeting and peace."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "accusationem quam misistis ad nos manifeste lecta est coram me"
      en: "The accusation, which you have sent to us, hath been plainly read before me,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et a me praeceptum est et recensuerunt inveneruntque quoniam civitas illa a diebus antiquis adversum reges rebellat et seditiones et proelia concitantur in ea"
      en: "And I commanded: and search hath been made, and it is found, that this city of old time hath rebelled against kings, and seditions and wars have been raised therein."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "nam et reges fortissimi fuerunt in Hierusalem qui et dominati sunt omni regioni quae trans Fluvium est tributum quoque et vectigal et reditus accipiebant"
      en: "For there have been powerful kings in Jerusalem, who hare had dominion over all the country that is beyond the river: and have received tribute, and toll and revenues."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "nunc ergo audite sententiam ut prohibeatis viros illos et urbs illa non aedificetur donec si forte a me iussum fuerit"
      en: "Now therefore hear the sentence: Hinder those men, that this city be not built, till further orders be given by me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "videte ne neglegenter hoc impleatis et paulatim crescat malum contra reges"
      en: "See that you be not negligent in executing this, lest by little and little the evil grow to the hurt of the kings."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "itaque exemplum edicti Artarxersis regis lectum est coram Reum et Samsai scriba et consiliariis eorum et abierunt festini in Hierusalem ad Iudaeos et prohibuerunt eos in brachio et robore"
      en: "Now the copy of the edict of king Artaxerxes was read before Reum Beelteem, and Samsai the scribe, and their counsellors: and they went up in haste to Jerusalem to the Jews, and hindered them with arm and power."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "tunc intermissum est opus domus Dei in Hierusalem et non fiebat usque ad annum secundum regni Darii regis Persarum"
      en: "Then the work of the house of the Lord in Jerusalem was interrupted, and ceased till the second year of the reign of Darius king of the Persians."
    status: { la: verified, en: verified }
