# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: bar
chapter: 4
verses:
  - n: 1
    text:
      la: "Hic liber mandatorum Dei, et lex quae est in aeternum: omnes qui tenent eam pervenient ad vitam: qui autem dereliquerunt eam, in mortem."
      en: "This is the book of the commandments of God, and the law, that is for ever: all they that keep it, shall come to life: but they that have forsaken it, to death."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Convertere, Jacob, et apprehende eam: ambula per viam ad splendorem ejus contra lumen ejus."
      en: "Return, O Jacob, and take hold of it, walk in the way by its brightness, in the presence of the light thereof."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ne tradas alteri gloriam tuam, et dignitatem tuam genti alienae."
      en: "Give not thy honour to another, nor thy dignity to a strange nation."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Beati sumus, Israel, quia quae Deo placent manifesta sunt nobis."
      en: "We are happy, O Israel: because the things that are pleasing to God, are made known to us."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Animaequior esto, populus Dei, memorabilis Israel:"
      en: "Be of good comfort, O people of God, the memorial of Israel:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "venundati estis gentibus non in perditionem: sed propter quod in ira ad iracundiam provocastis Deum, traditi estis adversariis."
      en: "You have been sold to the Gentiles, not for your destruction: but because you provoked God to wrath, you are delivered to your adversaries."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Exacerbastis enim eum qui fecit vos, Deum aeternum, immolantes daemoniis, et non Deo."
      en: "For you have provoked him who made you, the eternal God, offering sacrifice to devils, and not to God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Obliti enim estis Deum qui nutrivit vos, et contristastis nutricem vestram Jerusalem."
      en: "For you have forgotten God, who brought you up, and you have grieved Jerusalem that nursed you."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Vidit enim iracundiam a Deo venientem vobis, et dixit: Audite, confines Sion: adduxit enim mihi Deus luctum magnum."
      en: "For she saw the wrath of God coming upon you, and she said: Give ear, all you that dwell near Sion, for God hath brought upon me great mourning:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Vidi enim captivitatem populi mei, filiorum meorum et filiarum, quam superduxit illis Aeternus."
      en: "For I have seen the captivity of my people, of my sons, and my daughters, which the Eternal hath brought upon them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Nutrivi enim illos cum jucunditate; dimisi autem illos cum fletu et luctu."
      en: "For I nourished them with joy: but I sent them away with weeping and mourning."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Nemo gaudeat super me viduam et desolatam: a multis derelicta sum propter peccata filiorum meorum, quia declinaverunt a lege Dei."
      en: "Let no man rejoice over me, a widow, and desolate: I am forsaken of many for the sins of my children, because they departed from the law of God."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Justitias autem ipsius nescierunt, nec ambulaverunt per vias mandatorum Dei, neque per semitas veritatis ejus cum justitia ingressi sunt."
      en: "And they have not known his justices, nor walked by the ways of God's commandments, neither have they entered by the paths of his truth and justice."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Veniant confines Sion, et memorentur captivitatem filiorum et filiarum mearum, quam superduxit illis Aeternus."
      en: "Let them that dwell about Sion come, and remember the captivity of my sons and daughters, which the Eternal hath brought upon them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Adduxit enim super illos gentem de longinquo, gentem improbam, et alterius linguae,"
      en: "For he hath brought a nation upon them from afar, a wicked nation, and of a strange tongue:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "qui non sunt reveriti senem, neque puerorum miserti sunt, et abduxerunt dilectos viduae, et a filiis unicam desolaverunt."
      en: "Who have neither reverenced the ancient, nor pitied children, and have carried away the beloved of the widow, and have left me all alone without children."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ego autem, quid possum adjuvare vos?"
      en: "But as for me, what help can I give you?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui enim adduxit super vos mala, ipse vos eripiet de manibus inimicorum vestrorum."
      en: "But he that hath brought the evils upon you, he will deliver you out of the hands of your enemies."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ambulate, filii, ambulate: ego enim derelicta sum sola."
      en: "Go your way, my children, go your way: for I am left alone."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Exui me stola pacis, indui autem me sacco obsecrationis, et clamabo ad Altissimum in diebus meis."
      en: "I have put off the robe of peace, and have put upon me the sackcloth of supplication, and I will cry to the most High in my days."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Animaequiores estote, filii; clamate ad Dominum, et eripiet vos de manu principum inimicorum."
      en: "Be of good comfort, my children, cry to the Lord, and he will deliver you out of the hand of the princes your enemies."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ego enim speravi in aeternum salutem vestram, et venit mihi gaudium a Sancto, super misericordia quae veniet vobis ab aeterno salutari nostro."
      en: "For my hope is in the Eternal that he will save you: and joy is come upon me from the Holy One, because of the mercy which shall come to you from our everlasting Saviour."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Emisi enim vos cum luctu et ploratu: reducet autem vos mihi Dominus cum gaudio et jucunditate in sempiternum."
      en: "For I sent you forth with mourning and weeping: but the Lord will bring you back to me with joy and gladness for ever."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Sicut enim viderunt vicinae Sion captivitatem vestram a Deo, sic videbunt et in celeritate salutem vestram a Deo, quae superveniet vobis cum honore magno et splendore aeterno."
      en: "For as the neighbours of Sion have now seen your captivity from God: so shall they also shortly see your salvation from God, which shall come upon you with great honour, and everlasting glory."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Filii, patienter sustinete iram quae supervenit vobis: persecutus est enim te inimicus tuus: sed cito videbis perditionem ipsius, et super cervices ipsius ascendes."
      en: "My children, suffer patiently the wrath that is come upon you: for thy enemy hath persecuted thee, but thou shalt quickly see his destruction: and thou shalt get up upon his neck."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Delicati mei ambulaverunt vias asperas: ducti sunt enim ut grex direptus ab inimicis."
      en: "My delicate ones have walked rough ways, for they were taken away as a flock made a prey by the enemies."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Animaequiores estote, filii, et proclamate ad Dominum: erit enim memoria vestra ab eo qui duxit vos."
      en: "Be of good comfort, my children, and cry to the Lord: for you shall be remembered by him that hath led you away."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Sicut enim fuit sensus vester ut erraretis a Deo, decies tantum iterum convertentes requiretis eum:"
      en: "For as it was your mind to go astray from God; so when you return again you shall seek him ten times as much."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "qui enim induxit vobis mala, ipse rursum adducet vobis sempiternam jucunditatem cum salute vestra."
      en: "For he that hath brought evils upon you, shall bring you everlasting joy again with your salvation."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Animaequior esto, Jerusalem: exhortatur enim te, qui te nominavit."
      en: "Be of good heart, O Jerusalem: for he exhorteth thee, that named thee."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Nocentes peribunt, qui te vexaverunt: et qui gratulati sunt in tua ruina, punientur."
      en: "The wicked that have afflicted thee, shall perish: and they that have rejoiced at thy ruin, shall be punished."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Civitates quibus servierunt filii tui, punientur, et quae accepit filios tuos."
      en: "The cities which thy children have served, shall be punished: and she that received thy sons."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Sicut enim gavisa est in tua ruina, et laetata est in casu tuo, sic contristabitur in sua desolatione,"
      en: "For as she rejoiced at thy ruin, and was glad of thy fall: so shall she be grieved for her own desolation."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et amputabitur exsultatio multitudinis ejus, et gaudimonium ejus erit in luctum."
      en: "And the joy of her multitude shall be cut off: and her gladness shall be turned to mourning."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Ignis enim superveniet ei ab Aeterno in longiturnis diebus, et habitabitur a daemoniis in multitudine temporis."
      en: "For fire shall come upon her from the Eternal, long to endure, and she shall be inhabited by devils for a great time."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Circumspice, Jerusalem, ad orientem, et vide jucunditatem a Deo tibi venientem."
      en: "Look about thee, O Jerusalem, towards the east, and behold the joy that cometh to thee from God."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Ecce enim veniunt filii tui, quos dimisisti dispersos: veniunt collecti ab oriente usque ad occidentem, in verbo Sancti, gaudentes in honorem Dei."
      en: "For behold thy children come, whom thou sentest away scattered, they come gathered together from the east even to the west, at the word of the Holy One rejoicing for the honour of God."
    status: { la: verified, en: verified }
