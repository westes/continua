# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: osee
chapter: 4
verses:
  - n: 1
    text:
      la: "Audite verbum Domini, filii Israel, quia judicium Domino cum habitatoribus terrae: non est enim veritas, et non est misericordia, et non est scientia Dei in terra."
      en: "Hear the word of the Lord, ye children of Israel, for the Lord shall enter into judgment with the inhabitants of the land: for there is no truth, and there is no mercy, and there is no knowledge of God in the land."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Maledictum, et mendacium, et homicidium, et furtum, et adulterium inundaverunt, et sanguis sanguinem tetigit."
      en: "Cursing, and lying, and killing, and theft, and adultery have overflowed, and blood hath touched blood."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Propter hoc lugebit terra, et infirmabitur omnis qui habitat in ea, in bestia agri, et in volucre caeli; sed et pisces maris congregabuntur."
      en: "Therefore shall the land mourn, and every one that dwelleth in it shall languish with the beasts of the field, and with the fowls of the air: yea, the fishes of the sea also shall be gathered together."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Verumtamen unusquisque non judicet, et non arguatur vir: populus enim tuus sicut hi qui contradicunt sacerdoti."
      en: "But yet let not any man judge: and let not a man be rebuked: for thy people are as they that contradict the priest."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et corrues hodie, et corruet etiam propheta tecum. Nocte tacere feci matrem tuam."
      en: "And thou shalt fall today, and the prophet also shall fall with thee: in the night I have made thy mother to be silent."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Conticuit populus meus, eo quod non habuerit scientiam: quia tu scientiam repulisti, repellam te, ne sacerdotio fungaris mihi; et oblita es legis Dei tui, obliviscar filiorum tuorum et ego."
      en: "My people have been silent, because they had no knowledge: because thou hast rejected knowledge, I will reject thee, that thou shalt not do the office of priesthood to me: and thou hast forgotten the law of thy God, I also will forget thy children."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Secundum multitudinem eorum sic peccaverunt mihi: gloriam eorum in ignominiam commutabo."
      en: "According to the multitude of them so have they sinned against me: I will change their glory into shame."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Peccata populi mei comedent, et ad iniquitatem eorum sublevabunt animas eorum."
      en: "They shall eat the sins of my people, and shall lift up their souls to their iniquity."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et erit sicut populus, sic sacerdos; et visitabo super eum vias ejus, et cogitationes ejus reddam ei."
      en: "And there shall be like people like priest: and I will visit their ways upon them, and I will repay them their devices."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et comedent, et non saturabuntur; fornicati sunt, et non cessaverunt: quoniam Dominum dereliquerunt in non custodiendo."
      en: "And they shall eat and shall not be filled: they have committed fornication, and have not ceased: because they have forsaken the Lord in not observing his law."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Fornicatio, et vinum, et ebrietas auferunt cor."
      en: "Fornication, and wine, and drunkenness take away the understanding."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Populus meus in ligno suo interrogavit, et baculus ejus annuntiavit ei; spiritus enim fornicationum decepit eos, et fornicati sunt a Deo suo."
      en: "My people have consulted their stocks, and their staff hath declared unto them: for the spirit of fornication hath deceived them, and they have committed fornication against their God."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Super capita montium sacrificabant, et super colles ascendebant thymiama; subtus quercum, et populum, et terebinthum, quia bona erat umbra ejus; ideo fornicabuntur filiae vestrae, et sponsae vestrae adulterae erunt."
      en: "They offered sacrifice upon the tops of the mountains, and burnt incense upon the hills: under the oak, and the poplar, and the turpentine tree, because the shadow thereof was good: therefore shall your daughters commit fornication, and your spouses shall be adulteresses."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Non visitabo super filias vestras cum fuerint fornicatae, et super sponsas vestras cum adulteraverint, quoniam ipsi cum meretricibus conversabantur, et cum effeminatis sacrificabant; et populus non intelligens vapulabit."
      en: "I will not visit upon your daughters when they shall commit fornication, and upon your spouses when they shall commit adultery: because themselves conversed with harlots, and offered sacrifice with the effeminate, and the people that doth not understand shall be beaten."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Si fornicaris tu, Israel, non delinquat saltem Juda; et nolite ingredi in Galgala, et ne ascenderitis in Bethaven, neque juraveritis: Vivit Dominus!"
      en: "If thou play the harlot, O Israel, at least let not Juda offend: and go ye not into Galgal, and come not up into Bethaven, and do not swear: The Lord liveth."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quoniam sicut vacca lasciviens declinavit Israel; nunc pascet eos Dominus, quasi agnum in latitudine."
      en: "For Israel hath gone astray like a wanton heifer: now will the Lord feed them, as a lamb in a spacious place."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Particeps idolorum Ephraim: dimitte eum."
      en: "Ephraim is a partaker with idols, let him alone."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Separatum est convivium eorum; fornicatione fornicati sunt: dilexerunt afferre ignominiam protectores ejus."
      en: "Their banquet is separated, they have gone astray by fornication: they that should have protected them have loved to bring shame upon them."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ligavit eum spiritus in alis suis, et confundentur a sacrificiis suis."
      en: "The wind hath bound them up in its wings, and they shall be confounded because of their sacrifices."
    status: { la: verified, en: verified }
