# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 9
verses:
  - n: 1
    text:
      la: "Et ascendens in naviculam, transfretavit, et venit in civitatem suam."
      en: "And entering into a boat, he passed over the water and came into his own city."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et ecce offerebant ei paralyticum jacentem in lecto. Et videns Jesus fidem illorum, dixit paralytico: Confide fili, remittuntur tibi peccata tua."
      en: "And behold they brought to him one sick of the palsy lying in a bed. And Jesus, seeing their faith, said to the man sick of the palsy: Be of good heart, son, thy sins are forgiven thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et ecce quidam de scribis dixerunt intra se: Hic blasphemat."
      en: "And behold some of the scribes said within themselves: He blasphemeth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et cum vidisset Jesus cogitationes eorum, dixit: Ut quid cogitatis mala in cordibus vestris?"
      en: "And Jesus seeing their thoughts, said: Why do you think evil in your hearts?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quid est facilius dicere: Dimittuntur tibi peccata tua: an dicere: Surge, et ambula?"
      en: "Whether is easier, to say, Thy sins are forgiven thee: or to say, Arise, and walk?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ut autem sciatis, quia Filius hominis habet potestatem in terra dimittendi peccata, tunc ait paralytico: Surge, tolle lectum tuum, et vade in domum tuam."
      en: "But that you may know that the Son of man hath power on earth to forgive sins, (then said he to the man sick of palsy,) Arise, take up thy bed, and go into thy house."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et surrexit, et abiit in domum suam."
      en: "And he arose, and went into his house."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Videntes autem turbae timuerunt, et glorificaverunt Deum, qui dedit potestatem talem hominibus."
      en: "And the multitude seeing it, feared, and glorified God that gave such power to men."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et, cum transiret inde Jesus, vidit hominem sedentem in telonio, Matthaeum nomine. Et ait illi: Sequere me. Et surgens, secutus est eum."
      en: "And when Jesus passed on from hence, he saw a man sitting in the custom house, named Matthew; and he saith to him: Follow me. And he rose up and followed him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et factum est, discumbente eo in domo, ecce multi publicani et peccatores venientes, discumbebant cum Jesu, et discipulis ejus."
      en: "And it came to pass as he was sitting at meat in the house, behold many publicans and sinners came, and sat down with Jesus and his disciples."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et videntes pharisaei, dicebant discipulis ejus: Quare cum publicanis et peccatoribus manducat magister vester?"
      en: "And the Pharisees seeing it, said to his disciples: Why doth your master eat with publicans and sinners?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "At Jesus audiens, ait: Non est opus valentibus medicus, sed male habentibus."
      en: "But Jesus hearing it, said: They that are in health need not a physician, but they that are ill."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Euntes autem discite quid est: Misericordiam volo, et non sacrificium. Non enim veni vocare justos, sed peccatores."
      en: "Go then and learn what this meaneth, I will have mercy and not sacrifice. For I am not come to call the just, but sinners."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tunc accesserunt ad eum discipuli Joannis, dicentes: Quare nos, et pharisaei, jejunamus frequenter: discipuli autem tui non jejunant?"
      en: "Then came to him the disciples of John, saying: Why do we and the Pharisees fast often, but thy disciples do not fast?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et ait illis Jesus: Numquid possunt filii sponsi lugere, quamdiu cum illis est sponsus? Venient autem dies cum auferetur ab eis sponsus: et tunc jejunabunt."
      en: "And Jesus said to them: Can the children of the bridegroom mourn, as long as the bridegroom is with them? But the days will come, when the bridegroom shall be taken away from them, and then they shall fast."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nemo autem immittit commissuram panni rudis in vestimentum vetus: tollit enim plenitudinem ejus a vestimento, et pejor scissura fit."
      en: "And nobody putteth a piece of raw cloth unto an old garment. For it taketh away the fulness thereof from the garment, and there is made a greater rent."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Neque mittunt vinum novum in utres veteres: alioquin rumpuntur utres, et vinum effunditur, et utres pereunt. Sed vinum novum in utres novos mittunt: et ambo conservantur."
      en: "Neither do they put new wine into old bottles. Otherwise the bottles break, and the wine runneth out, and the bottles perish. But new wine they put into new bottles: and both are preserved."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Haec illo loquente ad eos, ecce princeps unus accessit, et adorabat eum, dicens: Domine, filia mea modo defuncta est: sed veni, impone manum tuam super eam, et vivet."
      en: "As he was speaking these things unto them, behold a certain ruler came up, and adored him, saying: Lord, my daughter is even now dead; but come, lay thy hand upon her, and she shall live."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et surgens Jesus, sequebatur eum, et discipuli ejus."
      en: "And Jesus rising up followed him, with his disciples."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et ecce mulier, quae sanguinis fluxum patiebatur duodecim annis, accessit retro, et tetigit fimbriam vestimenti ejus."
      en: "And behold a woman who was troubled with an issue of blood twelve years, came behind him, and touched the hem of his garment."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dicebat enim intra se: Si tetigero tantum vestimentum ejus, salva ero."
      en: "For she said within herself: If I shall touch only his garment, I shall be healed."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "At Jesus conversus, et videns eam, dixit: Confide, filia, fides tua te salvam fecit. Et salva facta est mulier ex illa hora."
      en: "But Jesus turning and seeing her, said: Be of good heart, daughter, thy faith hath made thee whole. And the woman was made whole from that hour."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et cum venisset Jesus in domum principis, et vidisset tibicines et turbam tumultuantem, dicebat:"
      en: "And when Jesus was come into the house of the ruler, and saw the minstrels and the multitude making a rout,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Recedite: non est enim mortua puella, sed dormit. Et deridebant eum."
      en: "He said: Give place, for the girl is not dead, but sleepeth. And they laughed him to scorn."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et cum ejecta esset turba, intravit: et tenuit manum ejus, et surrexit puella."
      en: "And when the multitude was put forth, he went in, and took her by the hand. And the maid arose."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et exiit fama haec in universam terram illam."
      en: "And the fame hereof went abroad into all that country."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et transeunte inde Jesu, secuti sunt eum duo caeci, clamantes, et dicentes: Miserere nostri, fili David."
      en: "And as Jesus passed from thence, there followed him two blind men crying out and saying, Have mercy on us, O Son of David."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Cum autem venisset domum, accesserunt ad eum caeci. Et dicit eis Jesus: Creditis quia hoc possum facere vobis? Dicunt ei: Utique, Domine."
      en: "And when he was come to the house, the blind men came to him. And Jesus saith to them, Do you believe, that I can do this unto you? They say to him, Yea, Lord."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Tunc tetigit oculos eorum, dicens: Secundum fidem vestram, fiat vobis."
      en: "Then he touched their eyes, saying, According to your faith, be it done unto you."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et aperti sunt oculi eorum: et comminatus est illis Jesus, dicens: Videte ne quis sciat."
      en: "And their eyes were opened, and Jesus strictly charged them, saying, See that no man know this."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Illi autem exeuntes, diffamaverunt eum in tota terra illa."
      en: "But they going out, spread his fame abroad in all that country."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Egressis autem illis, ecce obtulerunt ei hominem mutum, daemonium habentem."
      en: "And when they were gone out, behold they brought him a dumb man, possessed with a devil."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et ejecto daemonio, locutus est mutus, et miratae sunt turbae, dicentes: Numquam apparuit sic in Israel."
      en: "And after the devil was cast out, the dumb man spoke, and the multitudes wondered, saying, Never was the like seen in Israel."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Pharisaei autem dicebant: In principe daemoniorum ejicit daemones."
      en: "But the Pharisees said, By the prince of devils he casteth out devils."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et circuibat Jesus omnes civitates, et castella, docens in synagogis eorum, et praedicans Evangelium regni, et curans omnem languorem, et omnem infirmitatem."
      en: "And Jesus went about all the cities, and towns, teaching in their synagogues, and preaching the gospel of the kingdom, and healing every disease, and every infirmity."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Videns autem turbas, misertus est eis: quia erant vexati, et jacentes sicut oves non habentes pastorem."
      en: "And seeing the multitudes, he had compassion on them: because they were distressed, and lying like sheep that have no shepherd."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Tunc dicit discipulis suis: Messis quidem multa, operarii autem pauci."
      en: "Then he saith to his disciples, The harvest indeed is great, but the labourers are few."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Rogate ergo Dominum messis, ut mittat operarios in messem suam."
      en: "Pray ye therefore the Lord of the harvest, that he send forth labourers into his harvest."
    status: { la: verified, en: verified }
