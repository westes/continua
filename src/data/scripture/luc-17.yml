# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: luc
chapter: 17
verses:
  - n: 1
    text:
      la: "et ad discipulos suos ait inpossibile est ut non veniant scandala vae autem illi per quem veniunt"
      en: "And he said to his disciples: It is impossible that scandals should not come: but woe to him through whom they come."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "utilius est illi si lapis molaris inponatur circa collum eius et proiciatur in mare quam ut scandalizet unum de pusillis istis"
      en: "It were better for him, that a millstone were hanged about his neck, and he cast into the sea, than that he should scandalize one of these little ones."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "adtendite vobis si peccaverit frater tuus increpa illum et si paenitentiam egerit dimitte illi"
      en: "Take heed to yourselves. If thy brother sin against thee, reprove him: and if he do penance, forgive him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et si septies in die peccaverit in te et septies in die conversus fuerit ad te dicens paenitet me dimitte illi"
      en: "And if he sin against thee seven times in a day, and seven times in a day be converted unto thee, saying, I repent; forgive him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et dixerunt apostoli Domino adauge nobis fidem"
      en: "And the apostles said to the Lord: Increase our faith."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixit autem Dominus si haberetis fidem sicut granum sinapis diceretis huic arbori moro eradicare et transplantare in mare et oboediret vobis"
      en: "And the Lord said: If you had faith like to a grain of mustard seed, you might say to this mulberry tree, Be thou rooted up, and be thou transplanted into the sea: and it would obey you."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quis autem vestrum habens servum arantem aut pascentem qui regresso de agro dicet illi statim transi recumbe"
      en: "But which of you having a servant ploughing, or feeding cattle, will say to him, when he is come from the field: Immediately go, sit down to meat:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et non dicet ei para quod cenem et praecinge te et ministra mihi donec manducem et bibam et post haec tu manducabis et bibes"
      en: "And will not rather say to him: Make ready my supper, and gird thyself, and serve me, whilst I eat and drink, and afterwards thou shalt eat and drink?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "numquid gratiam habet servo illi quia fecit quae sibi imperaverat non puto"
      en: "Doth he thank that servant, for doing the things which he commanded him?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sic et vos cum feceritis omnia quae praecepta sunt vobis dicite servi inutiles sumus quod debuimus facere fecimus"
      en: "I think not. So you also, when you shall have done all these things that are commanded you, say: We are unprofitable servants; we have done that which we ought to do."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et factum est dum iret in Hierusalem transiebat per mediam Samariam et Galilaeam"
      en: "And it came to pass, as he was going to Jerusalem, he passed through the midst of Samaria and Galilee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et cum ingrederetur quoddam castellum occurrerunt ei decem viri leprosi qui steterunt a longe"
      en: "And as he entered into a certain town, there met him ten men that were lepers, who stood afar off;"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et levaverunt vocem dicentes Iesu praeceptor miserere nostri"
      en: "And lifted up their voice, saying: Jesus, master, have mercy on us."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quos ut vidit dixit ite ostendite vos sacerdotibus et factum est dum irent mundati sunt"
      en: "Whom when he saw, he said: Go, shew yourselves to the priests. And it came to pass, as they went, they were made clean."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "unus autem ex illis ut vidit quia mundatus est regressus est cum magna voce magnificans Deum"
      en: "And one of them, when he saw that he was made clean, went back, with a loud voice glorifying God."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et cecidit in faciem ante pedes eius gratias agens et hic erat Samaritanus"
      en: "And he fell on his face before his feet, giving thanks: and this was a Samaritan."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "respondens autem Iesus dixit nonne decem mundati sunt et novem ubi sunt"
      en: "And Jesus answering, said, Were not ten made clean? and where are the nine?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "non est inventus qui rediret et daret gloriam Deo nisi hic alienigena"
      en: "There is no one found to return and give glory to God, but this stranger."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et ait illi surge vade quia fides tua te salvum fecit"
      en: "And he said to him: Arise, go thy way; for thy faith hath made thee whole."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "interrogatus autem a Pharisaeis quando venit regnum Dei respondit eis et dixit non venit regnum Dei cum observatione"
      en: "And being asked by the Pharisees, when the kingdom of God should come? he answered them, and said: The kingdom of God cometh not with observation:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "neque dicent ecce hic aut ecce illic ecce enim regnum Dei intra vos est"
      en: "Neither shall they say: Behold here, or behold there. For lo, the kingdom of God is within you."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et ait ad discipulos venient dies quando desideretis videre unum diem Filii hominis et non videbitis"
      en: "And he said to his disciples: The days will come, when you shall desire to see one day of the Son of man; and you shall not see it."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et dicent vobis ecce hic ecce illic nolite ire neque sectemini"
      en: "And they will say to you: See here, and see there. Go ye not after, nor follow them:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "nam sicut fulgur coruscans de sub caelo in ea quae sub caelo sunt fulget ita erit Filius hominis in die sua"
      en: "For as the lightening that lighteneth from under heaven, shineth unto the parts that are under heaven, so shall the Son of man be in his day."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "primum autem oportet illum multa pati et reprobari a generatione hac"
      en: "But first he must suffer many things, and be rejected by this generation."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et sicut factum est in diebus Noe ita erit et in diebus Filii hominis"
      en: "And as it came to pass in the days of Noe, so shall it be also in the days of the Son of man."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "edebant et bibebant uxores ducebant et dabantur ad nuptias usque in diem qua intravit Noe in arcam et venit diluvium et perdidit omnes"
      en: "They did eat and drink, they married wives, and were given in marriage, until the day that Noe entered into the ark: and the flood came and destroyed them all."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "similiter sicut factum est in diebus Loth edebant et bibebant emebant et vendebant plantabant aedificabant"
      en: "Likewise as it came to pass, in the days of Lot: they did eat and drink, they bought and sold, they planted and built."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "qua die autem exiit Loth a Sodomis pluit ignem et sulphur de caelo et omnes perdidit"
      en: "And in the day that Lot went out of Sodom, it rained fire and brimstone from heaven, and destroyed them all."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "secundum haec erit qua die Filius hominis revelabitur"
      en: "Even thus shall it be in the day when the Son of man shall be revealed."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "in illa hora qui fuerit in tecto et vasa eius in domo ne descendat tollere illa et qui in agro similiter non redeat retro"
      en: "In that hour, he that shall be on the housetop, and his goods in the house, let him not go down to take them away: and he that shall be in the field, in like manner, let him not return back."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "memores estote uxoris Loth"
      en: "Remember Lot's wife."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "quicumque quaesierit animam suam salvare perdet illam et qui perdiderit illam vivificabit eam"
      en: "Whosoever shall seek to save his life, shall lose it: and whosoever shall lose it, shall preserve it."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "dico vobis illa nocte erunt duo in lecto uno unus adsumetur et alter relinquetur"
      en: "I say to you: in that night there shall be two men in one bed; the one shall be taken, and the other shall be left."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "duae erunt molentes in unum una adsumetur et altera relinquetur duo in agro unus adsumetur et alter relinquetur"
      en: "Two women shall be grinding together: the one shall be taken, and the other shall be left: two men shall be in the field; the one shall be taken, and the other shall be keft."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "respondentes dicunt illi ubi Domine"
      en: "They answering, say to him: Where, Lord?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "qui dixit eis ubicumque fuerit corpus illuc congregabuntur aquilae"
      en: "Who said to them: Wheresoever the body shall be, thither will the eagles also be gathered together."
    status: { la: verified, en: verified }
