# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 66
verses:
  - n: 1
    text:
      la: "haec dicit Dominus caelum sedis mea et terra scabillum pedum meorum quae ista domus quam aedificabitis mihi et quis iste locus quietis meae"
      en: "Thus saith the Lord: Heaven is my throne, and the earth my footstool: what is this house that you will build to me? and what is this place of my rest?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "omnia haec manus mea fecit et facta sunt universa ista dicit Dominus ad quem autem respiciam nisi ad pauperculum et contritum spiritu et trementem sermones meos"
      en: "My hand made all these things, and all these things were made, saith the Lord. But to whom shall I have respect, but to him that is poor and little, and of a contrite spirit, and that trembleth at my words?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "qui immolat bovem quasi qui interficiat virum qui mactat pecus quasi qui excerebret canem qui offert oblationem quasi qui sanguinem suillum offerat qui recordatur turis quasi qui benedicat idolo haec omnia elegerunt in viis suis et in abominationibus suis anima eorum delectata est"
      en: "He that sacrificeth an ox, is as if he slew a man: he that killeth a sheep in sacrifice, as if he should brain a dog: he that offereth an oblation, as if he should offer swine's blood; he that remembereth incense, as if he should bless an idol. All these things have they chosen in their ways, and their soul is delighted in their abominations."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "unde et ego eligam inlusiones eorum et quae timebant adducam eis quia vocavi et non erat qui responderet locutus sum et non audierunt feceruntque malum in oculis meis et quae nolui elegerunt"
      en: "Wherefore I also will choose their mockeries, and will bring upon them the things they feared: y because I called, and there was none that would answer; I have spoken, and they heard not; and they have done evil in my eyes, and have chosen the things that displease me."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "audite verbum Domini qui tremetis ad verbum eius dixerunt fratres vestri odientes vos et abicientes propter nomen meum glorificetur Dominus et videbimus in laetitia vestra ipsi autem confundentur"
      en: "Hear the word of the Lord, you that tremble at his word: Your brethren that hate you, and cast you out for my name's sake, have said: Let the Lord be glorified, and we shall see in your joy: but they shall be confounded."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "vox populi de civitate vox de templo vox Domini reddentis retributionem inimicis suis"
      en: "A voice of the people from the city, a voice from the temple, the voice of the Lord that rendereth recompense to his enemies."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "antequam parturiret peperit antequam veniret partus eius peperit masculum"
      en: "Before she was in labour, she brought forth; before her time came to be delivered, she brought forth a man child."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quis audivit umquam tale et quis vidit huic simile numquid parturiet terra in die una aut parietur gens simul quia parturivit et peperit Sion filios suos"
      en: "Who hath ever heard such a thing? and who hath seen the like to this? shall the earth bring forth in one day? or shall a nation be brought forth at once, because Sion hath been in labour, and hath brought forth her children?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "numquid ego qui alios parere facio ipse non pariam dicit Dominus si ego qui generationem ceteris tribuo sterilis ero ait Dominus Deus tuus"
      en: "Shall not I that make others to bring forth children, myself bring forth, saith the Lord? shall I, that give generation to others, be barren, saith the Lord thy God?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "laetamini cum Hierusalem et exultate in ea omnes qui diligitis eam gaudete cum ea gaudio universi qui lugetis super eam"
      en: "Rejoice with Jerusalem, and be glad with her, all you that love her: rejoice for joy with her, all you that mourn for her."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ut sugatis et repleamini ab ubere consolationis eius ut mulgeatis et deliciis affluatis ab omnimoda gloria eius"
      en: "That you may suck, and be filled with the breasts of her consolations: that you may milk out, and flow with delights, from the abundance of her glory."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quia haec dicit Dominus ecce ego declinabo super eam quasi fluvium pacis et quasi torrentem inundantem gloriam gentium quam sugetis ad ubera portabimini et super genua blandientur vobis"
      en: "For thus saith the Lord: Behold I will bring upon her as it were a river of peace, and as an overflowing torrent the glory of the Gentiles, which you shall suck; you shall be carried at the breasts, end upon the knees they shall caress you."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quomodo si cui mater blandiatur ita ego consolabor vos et in Hierusalem consolabimini"
      en: "As one whom the mother caresseth, so will I comfort you, and you shall be comforted in Jerusalem."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "videbitis et gaudebit cor vestrum et ossa vestra quasi herba germinabunt et cognoscetur manus Domini servis eius et indignabitur inimicis suis"
      en: "You shah see and your heart shall rejoice, and your bones shall flourish like an herb, and the hand of the Lord shall be known to his servants, and he shall be angry with his enemies."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quia ecce Dominus in igne veniet et quasi turbo quadrigae eius reddere in indignatione furorem suum et increpationem suam in flamma ignis"
      en: "For behold the Lord will come with fire, and his chariots are like a whirlwind, to render his wrath in indignation, and his rebuke with flames of fire."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quia in igne Dominus diiudicatur et in gladio suo ad omnem carnem et multiplicabuntur interfecti a Domino"
      en: "For the Lord shall judge by fire, and by his sword unto all flesh, and the slain of the Lord shall be many."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qui sanctificabantur et mundos se putabant in hortis post unam intrinsecus qui comedebant carnem suillam et abominationem et murem simul consumentur dicit Dominus"
      en: "They that were sanctified, and thought themselves clean in the gardens behind the gate within, they that did eat swine's flesh, and the abomination, and the mouse: they shall be consumed together, saith the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ego autem opera eorum et cogitationes eorum venio ut congregem cum omnibus gentibus et linguis et venient et videbunt gloriam meam"
      en: "But I know their works, and their thoughts: I come that I may gather them together with all nations and tongues: and they shall come and shall see my glory."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et ponam in eis signum et mittam ex eis qui salvati fuerint ad gentes in mari in Africa in Lydia tenentes sagittam in Italiam et Graeciam ad insulas longe ad eos qui non audierunt de me et non viderunt gloriam meam et adnuntiabunt gloriam meam gentibus"
      en: "And I will set a sign among them, and I will send of them that shall be saved, to the Gentiles into the sea, into Africa, and Lydia them that draw the bow: into Italy, and Greece, to the islands afar off, to them that have not heard of me, and have not seen my glory. And they shall declare my glory to the Gentiles:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et adducent omnes fratres vestros de cunctis gentibus donum Domino in equis et in quadrigis et in lecticis et in mulis et in carrucis ad montem sanctum meum Hierusalem dicit Dominus quomodo si inferant filii Israhel munus in vase mundo in domum Domini"
      en: "And they shall bring all your brethren out of all nations for a gift to the Lord, upon horses, and in chariots, and in litters, and on mules, and in coaches, to my holy mountain Jerusalem, saith the Lord, as if the children of Israel should bring an offering in a clean vessel into the house of the Lord."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et adsumam ex eis in sacerdotes et in Levitas dicit Dominus"
      en: "And I will take of them to be priests, and Levites, saith the Lord."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quia sicut caeli novi et terra nova quae ego facio stare coram me dicit Dominus sic stabit semen vestrum et nomen vestrum"
      en: "For as the new heavens, and the new earth, which I will make to stand before me, saith the Lord: so shall your seed stand, and your name."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et erit mensis ex mense et sabbatum ex sabbato veniet omnis caro ut adoret coram facie mea dicit Dominus"
      en: "And there shall be month after month, and sabbath after sabbath: and all flesh shall come to adore before my face, saith the Lord."
    status: { la: verified, en: verified }
