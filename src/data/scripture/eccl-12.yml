# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: eccl
chapter: 12
verses:
  - n: 1
    text:
      la: "memento creatoris tui in diebus iuventutis tuae antequam veniat tempus adflictionis et adpropinquent anni de quibus dicas non mihi placent"
      en: "Remember thy Creator in the days of thy youth, before the time of affliction come, and the years draw nigh of which thou shalt say: They please me not:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "antequam tenebrescat sol et lumen et luna et stellae et revertantur nubes post pluviam"
      en: "Before the sun, and the light, and the moon, and the stars be darkened, and the clouds return after the rain:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quando commovebuntur custodes domus et nutabuntur viri fortissimi et otiosae erunt molentes inminuto numero et tenebrescent videntes per foramina"
      en: "When the keepers of the house shall tremble, and the strong men shall stagger, and the grinders shall be idle in a small number, and they that look through the holes shall be darkened:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et claudent ostia in platea in humilitate vocis molentis et consurgent ad vocem volucris et obsurdescent omnes filiae carminis"
      en: "And they shall shut the doors in the street, when the grinder's voice shall be low, and they shall rise up at the voice of the bird, and all the daughters of music shall grow deaf."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "excelsa quoque timebunt et formidabunt in via florebit amigdalum inpinguabitur lucusta et dissipabitur capparis quoniam ibit homo in domum aeternitatis suae et circumibunt in platea plangentes"
      en: "And they shall fear high things, and they shall be afraid in the way, the almond tree shall flourish, the locust shall be made fat, and the caper tree shall be destroyed: because man shall go into the house of his eternity, and the mourners shall go round about in the street."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "antequam rumpatur funis argenteus et recurrat vitta aurea et conteratur hydria super fontem et confringatur rota super cisternam"
      en: "Before the silver cord be broken, and the golden fillet shrink back, and the pitcher be crushed at the fountain, and the wheel be broken upon the cistern,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et revertatur pulvis in terram suam unde erat et spiritus redeat ad Deum qui dedit illum"
      en: "And the dust return into its earth, from whence it was, and the spirit return to God, who gave it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "vanitas vanitatum dixit Ecclesiastes omnia vanitas"
      en: "Vanity of vanities, said Ecclesiastes, and all things are vanity."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cumque esset sapientissimus Ecclesiastes docuit populum et enarravit quae fecerit et investigans conposuit parabolas multas"
      en: "And whereas Ecclesiastes was very wise, he taught the people, and declared the things that he had done: and seeking out, he set forth many parables."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quaesivit verba utilia et conscripsit sermones rectissimos ac veritate plenos"
      en: "He sought profitable words, and wrote words most right, and full of truth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "verba sapientium sicut stimuli et quasi clavi in altum defixi quae per magistrorum concilium data sunt a pastore uno"
      en: "The words of the wise are as goads, and as nails deeply fastened in, which by the counsel of masters are given from one shepherd."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "his amplius fili mi ne requiras faciendi plures libros nullus est finis frequensque meditatio carnis adflictio est"
      en: "More than these, my son, require not. Of making many books there is no end: and much study is an affliction of the flesh."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "finem loquendi omnes pariter audiamus Deum time et mandata eius observa hoc est enim omnis homo"
      en: "Let us all hear together the conclusion of the discourse. Fear God, and keep his commandments: for this is all man:"
    status: { la: verified, en: verified }
