# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: deut
chapter: 27
verses:
  - n: 1
    text:
      la: "Praecepit autem Moyses et seniores Israel populo, dicentes: Custodite omne mandatum quod praecipio vobis hodie."
      en: "And Moses with the ancients of Israel commanded the people, saying: Keep every commandment that I command you this day."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cumque transieritis Jordanem in terram, quam Dominus Deus tuus dabit tibi, eriges ingentes lapides, et calce laevigabis eos,"
      en: "And when you are passed over the Jordan into the land which the Lord thy God will give thee, thou shalt set up great stones, and shalt plaster them over with plaster,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ut possis in eis scribere omnia verba legis hujus, Jordane transmisso: ut introeas terram, quam Dominus Deus tuus dabit tibi, terram lacte et melle manantem, sicut juravit patribus tuis."
      en: "That thou mayst write on them all the words of this law, when thou art passed over the Jordan: that thou mayst enter into the land which the Lord thy God will give thee, a land flowing with milk and honey, as he swore to thy fathers."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quando ergo transieritis Jordanem, erigite lapides, quos ego hodie praecipio vobis in monte Hebal, et laevigabis eos calce:"
      en: "Therefore when you are passed over the Jordan, set up the stones which I command you this day, in mount Hebal, and thou shalt plaster them with plaster:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et aedificabis ibi altare Domino Deo tuo de lapidibus, quos ferrum non tetigit,"
      en: "And thou shalt build there an altar to the Lord thy God, of stones which iron hath not touched,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et de saxis informibus et impolitis: et offeres super eo holocausta Domino Deo tuo,"
      en: "And of stones not fashioned nor polished: and thou shalt offer upon it holocausts to the Lord thy God:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et immolabis hostias pacificas, comedesque ibi, et epulaberis coram Domino Deo tuo."
      en: "And shalt immolate peace victims, and eat there, and feast before the Lord thy God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et scribes super lapides omnia verba legis hujus plane et lucide."
      en: "And thou shalt write upon the stones all the words of this law plainly and clearly,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dixeruntque Moyses et sacerdotes Levitici generis ad omnem Israelem: Attende, et audi, Israel: hodie factus es populus Domini Dei tui:"
      en: "And Moses and the priests of the race of Levi said to all Israel: Attend, and hear, O Israel: This day thou art made the people of the Lord thy God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "audies vocem ejus, et facies mandata atque justitias, quas ego praecipio tibi."
      en: "Thou shalt hear his voice, and do the commandments and justices which I command thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Praecepitque Moyses populo in die illo, dicens:"
      en: "And Moses commanded the people in that day, saying:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Hi stabunt ad benedicendum populo super montem Garizim, Jordane transmisso: Simeon, Levi, Judas, Issachar, Joseph, et Benjamin."
      en: "These shall stand upon mount Garizim to bless the people, when you are passed the Jordan: Simeon, Levi, Juda, Issachar, Joseph, and Benjamin."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et e regione isti stabunt ad maledicendum in monte Hebal: Ruben, Gad, et Aser, et Zabulon, Dan, et Nephthali."
      en: "And over against them shall stand on mount Hebal to curse: Ruben, Gad, and Aser, and Zabulon, Dan, and Nephtali."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et pronuntiabunt Levitae, dicentque ad omnes viros Israel excelsa voce:"
      en: "And the Levites shall pronounce, and say to all the men of Israel with a loud voice:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Maledictus homo qui facit sculptile et conflatile, abominationem Domini, opus manuum artificum, ponetque illud in abscondito: et respondebit omnis populus, et dicet: Amen."
      en: "Cursed be the man that maketh a graven and molten thing, the abomination of the Lord, the work of the hands of artificers, and shall put it in a secret place: and all the people shall answer and say: Amen."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Maledictus qui non honorat patrem suum, et matrem: et dicet omnis populus: Amen."
      en: "Cursed be he that honoureth not his father and mother: and all the people shall say: Amen."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Maledictus qui transfert terminos proximi sui: et dicet omnis populus: Amen."
      en: "Cursed be he that removeth his neighbour's landmarks: and all the people shall say: Amen."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Maledictus qui errare facit caecum in itinere: et dicet omnis populus: Amen."
      en: "Cursed be he that maketh the blind to wander out of his way: and all the people shall say: Amen."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Maledictus qui pervertit judicium advenae, pupilli et viduae: et dicet omnis populus: Amen."
      en: "Cursed be he that perverteth the judgment of the stranger, of the fatherless and the widow: and all the people shall say: Amen."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Maledictus qui dormit cum uxore patris sui, et revelat operimentum lectuli ejus: et dicet omnis populus: Amen."
      en: "Cursed be he that lieth with his father's wife, and uncovereth his bed: and all the people shall say: Amen."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Maledictus qui dormit cum omni jumento: et dicet omnis populus: Amen."
      en: "Cursed be he that lieth with any beast: and all the people shall say: Amen."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Maledictus qui dormit cum sorore sua, filia patris sui, vel matris suae: et dicet omnis populus: Amen."
      en: "Cursed be he that lieth with his sister, the daughter of his father, or of his mother: and all the people shall say: Amen."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Maledictus qui dormit cum socru sua: et dicet omnis populus: Amen."
      en: "Cursed be he that lieth with his mother in law: and all the people shall say: Amen."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Maledictus qui clam percusserit proximum suum: et dicet omnis populus: Amen."
      en: "Cursed be he that secretly killeth his neighbour: and all the people shall say: Amen."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Maledictus qui accipit munera, ut percutiat animam sanguinis innocentis: et dicet omnis populus: Amen."
      en: "Cursed be he that taketh gifts, to slay an innocent person: and all the people shall say: Amen."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Maledictus qui non permanet in sermonibus legis hujus, nec eos opere perficit: et dicet omnis populus: Amen."
      en: "Cursed be he that abideth not in the words of this law, and fulfilleth them not in work: and all the people shall say: Amen."
    status: { la: verified, en: verified }
