# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 16
verses:
  - n: 1
    text:
      la: "Ne jucunderis in filiis impiis, si multiplicentur: nec oblecteris super ipsos, si non est timor Dei in illis."
      en: "Rejoice not in ungodly children, if they be multiplied: neither be delighted in them, if the fear of God be not with them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Non credas vitae illorum, et ne respexeris in labores eorum."
      en: "Trust not to their life, and respect not their labours."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Melior est enim unus timens Deum, quam mille filii impii:"
      en: "For better is one that feareth God, than a thousand ungodly children."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et utile est mori sine filiis, quam relinquere filios impios."
      en: "And it is better to die without children, than to leave ungodly children."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ab uno sensato inhabitabitur patria: tribus impiorum deseretur."
      en: "By one that is wise a country shall be inhabited, the tribe of the ungodly shall become desolate."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Multa talia vidit oculis meus, et fortiora horum audivit auris mea."
      en: "Many such things hath my eyes seen, and greater things than these my ear hath heard."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "In synagoga peccantium exardebit ignis, et in gente incredibili exardescet ira."
      en: "In the congregation of sinners a fire shall be kindled, and in an unbelieving nation wrath shall flame out."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Non exoraverunt pro peccatis suis antiqui gigantes, qui destructi sunt confidentes suae virtuti."
      en: "The ancient giants did not obtain pardon for their sins, who were destroyed trusting to their own strength:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et non pepercit peregrinationi Lot, et execratus est eos prae superbia verbi illorum."
      en: "And he spared not the place where Lot sojourned, but abhorred them for the pride of their word."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Non misertus est illis, gentem totam perdens, et extollentem se in peccatis suis."
      en: "He had not pity on them, destroying the whole nation that extolled themselves in their sins."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et sicut sexcenta millia peditum, qui congregati sunt in duritia cordis sui: et si unus fuisset cervicatus, mirum si fuisset immunis."
      en: "So did he with the six hundred thousand footmen, who were gathered together in the hardness of their heart: and if one had been stiffnecked, it is a wonder if he had escaped unpunished:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Misericordia enim et ira est cum illo: potens exoratio, et effundens iram."
      en: "For mercy and wrath are with him. He is mighty to forgive, and to pour out indignation:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Secundum misericordiam suam, sic correptio illius homines secundum opera sua judicat."
      en: "According as his mercy is, so his correction judgeth a man according to his works."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Non effugiet in rapina peccator, et non retardabit sufferentia misericordiam facientis."
      en: "The sinner shall not escape in his rapines, and the patience of him that sheweth mercy shall not be put off."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Omnis misericordia faciet locum unicuique, secundum meritum operum suorum, et secundum intellectum peregrinationis ipsius."
      en: "All mercy shall make a place for every man according to the merit of his works, and according to the wisdom of his sojournment."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Non dicas: A Deo abscondar: et ex summo, quis mei memorabitur?"
      en: "Say not: I shall be hidden from God, and who shall remember me from on high?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "in populo magno non agnoscar: quae est enim anima mea in tam immensa creatura?"
      en: "In such a multitude I shall not be known: for what is my soul in such an immense creation?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ecce caelum et caeli caelorum, abyssus, et universa terra, et quae in eis sunt, in conspectu illius commovebuntur."
      en: "Behold the heaven, and the heavens of heavens, the deep, and all the earth, and the things that are in them, shall be moved in his sight,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Montes simul, et colles, et fundamenta terrae, cum conspexerit illa Deus, tremore concutientur."
      en: "The mountains also, and the hills, and the foundations of the earth: when God shall look upon them, they shall be shaken with trembling."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et in omnibus his insensatum est cor, et omne cor intelligitur ab illo."
      en: "And in all these things the heart is senseless: and every heart is understood by him:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et vias illius quis intelligit, et procellam quam nec oculus videbit hominis?"
      en: "And his ways who shall understand, and the storm, which no eye of man see?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Nam plurima illius opera sunt in absconsis: sed opera justitiae ejus quis enuntiabit, aut quis sustinebit? longe enim est testamentum a quibusdam, et interrogatio omnium in consummatione est."
      en: "For many of his works are hidden: but the works of his justice who shall declare? or who shall endure? for the testament is far from some, and the examination of all is in the end."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Qui minoratur corde cogitat inania, et vir imprudens et errans cogitat stulta."
      en: "He that wanteth understanding thinketh vain things: and the foolish, and erring man, thinketh foolish things."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Audi me, fili, et disce disciplinam sensus, et in verbis meis attende in corde tuo:"
      en: "Hearken to me, my son, and learn the discipline of understanding, and attend to my words in thy heart."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et dicam in aequitate disciplinam, et scrutabor enarrare sapientiam: et in verbis meis attende in corde tuo, et dico in aequitate spiritus virtutes quas posuit Deus in opera sua ab initio, et in veritate enuntio scientiam ejus."
      en: "And I will shew forth good doctrine in equity, and will seek to declare wisdom: and attend to my words in thy heart, whilst with equity of spirit I tell thee the virtues that God hath put upon his works from the beginning, and I shew forth in truth his knowledge."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "In judicio Dei opera ejus ab initio, et ab institutione ipsorum distinxit partes illorum, et initia eorum in gentibus suis."
      en: "The works of God are done in judgment from the beginning, and from the making of them he distinguished their parts, and their beginnings in their generations."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ornavit in aeternum opera illorum: nec esurierunt, nec laboraverunt, et non destiterunt ab operibus suis."
      en: "He beautified their works for ever, they have neither hungered, nor laboured, and they have not ceased from their works."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Unusquisque proximum sibi non angustiabit in aeternum:"
      en: "Nor shall any of them straiten his neighbour at any time."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "non sis incredibilis verbo illius."
      en: "Be not thou incredulous to his word."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Post haec Deus in terram respexit, et implevit illam bonis suis:"
      en: "After this God looked upon the earth, and filled it with his goods."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "anima omnis vitalis denuntiavit ante faciem ipsius, et in ipsam iterum reversio illorum."
      en: "The soul of every living thing hath shewn forth before the face thereof, and into it they return again."
    status: { la: verified, en: verified }
