# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2mach
chapter: 1
verses:
  - n: 1
    text:
      la: "fratribus qui sunt per Aegyptum Iudaeis salutem dicunt fratres qui sunt in Hierosolymis Iudaei et qui in regione Iudaeae et pacem bonam"
      en: "To the brethren the Jews that are I throughout Egypt, the brethren, the Jews that are in Jerusalem, and in the land of Judea, send health, and good peace."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "benefaciat vobis Deus et meminerit testamenti sui quod est ad Abraham et Isaac et Iacob servorum suorum fidelium"
      en: "May God be gracious to you, and remember his covenant that he made with Abraham, and Isaac, and Jacob, his faithful servants:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et det vobis cor omnibus ut colatis eum et faciatis eius voluntatem corde magno et animo volente"
      en: "And give you all a heart to worship him, and to do his will with a great heart, and a willing mind."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "adaperiat cor vestrum in lege sua et in praeceptis eius et faciat pacem"
      en: "May he open your heart in his law, and in his commandments, and send you peace."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "exaudiat orationes vestras et reconcilietur vobis nec vos deserat in tempore malo"
      en: "May he hear your prayers, and be reconciled unto you, and never forsake you in the evil time."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et nunc hic sumus orantes pro vobis"
      en: "And now here we are praying for you."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "regnante Demetrio anno centesimo sexagesimo nono nos Iudaei scripsimus vobis in tribulatione et impetu qui supervenit nobis in istis annis ex quo recessit Iason a sancta terra et a regno"
      en: "When Demetrius reigned, in the year one hundred and sixty-nine, we Jews wrote to you, in the trouble, and violence, that came upon us in those years, after Jason withdrew himself from the holy land, and from the kingdom."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "portam succenderunt et effuderunt sanguinem innocentem et oravimus ad Dominum et exauditi sumus et obtulimus sacrificium et similaginem et accendimus lucernas et proposuimus panes"
      en: "They burnt the gate, and shed innocent blood: then we prayed to the Lord, and were heard, and we offered sacrifices, and fine flour, and lighted the lamps, and set forth the leaves."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et nunc frequentate dies scenophegiae mensis casleu"
      en: "And now celebrate ye the days of Scenopegia in the month of Casleu."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "anno centesimo octogesimo octavo populus qui est Hierosolymis et in Iudaea senatusque et Iudas Aristobolo magistro Ptolomei regis qui est de genere christorum sacerdotum et his qui in Aegypto sunt Iudaeis salutem et sanitatem"
      en: "In the year Bone hundred and eighty- eight, the people that is at Jerusalem, and in Judea, and the senate, and Judas, to Aristobolus, the preceptor of king Ptolemee, who is of the stock of the anointed priests, and to the Jews that are in Egypt, health and welfare."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "de magnis periculis a Deo liberati magnifice gratias ipsi utpote qui adversus talem regem dimicavimus"
      en: "Having been delivered by God out of great dangers, we give him great thanks, forasmuch as we have been in war with such a king."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ipse enim ebullire fecit de Perside eos qui pugnaverunt contra nos"
      en: "For he made numbers of men swarm out of Persia that have fought against us, and the holy city."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "nam cum in Perside esset dux ipse et cum ipso inmensus exercitus cecidit in templo Naneae consilio deceptus sacerdotis Naneae"
      en: "For when the leader himself was in Persia, and with him a very great army, he fell in the temple of Nanea, being deceived by the counsel of the priests of Nanea."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ut enim cum ea habitaturus venit ad locum Antiochus et amici eius et ut acciperet pecunias multas dotis nomine"
      en: "For Antiochus, with his friends, came to the place as though he would marry her, and that he might receive great sums of money under the title of a dowry."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cumque proposuissent eas sacerdotes Naneae et ipse cum paucis ingressus esset intra ambitum fani clauserunt templum"
      en: "And when the priests of Nanea had set it forth, and he with a small company had entered into the compass of the temple, they shut the temple,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cum intrasset Antiochus apertoque occulto aditu templi mittentes lapides percusserunt ducem et qui cum eo erant et diviserunt membratim et capitibus amputatis foras proiecerunt"
      en: "When Antiochus was came in: and opening a secret entrance of the temple, they cast stones and slew the leader, and them that were with him, and hewed them in pieces, and cutting off their heads they threw them forth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "per omnia benedictus Deus qui tradidit impios"
      en: "Blessed be God in all things, who hath delivered up the wicked."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "facturi igitur quinta et vicesima mensis casleu purificationem templi necessarium duximus significare vobis ut vos quoque agatis diem scenophegiae et diem ignis qui datus est quando Neemias aedificato templo et altari obtulit sacrificia"
      en: "Therefore whereas we purpose to keep the purification of the temple on the five and twentieth day of the month of Casleu, we thought it necessary to signify it to you: that you also may keep the day of Scenopegia, and the day of the fire, that was given when Nehemias offered sacrifice, after the temple and the altar was built."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "nam cum in Persidem ducerentur patres nostri sacerdotes qui tunc Dei cultores erant acceptum ignem de altario occulte absconderunt in valle ubi erat puteus altus siccus et in eo contutati sunt eum ita ut omnibus ignotus esset locus"
      en: "For when our fathers were led in Persia, the priests that then were worshippers of God took privately the fire from the altar, and hid it in a valley where there was a deep pit without water, and there they kept it safe,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "cum praeterissent autem multi anni et placuit Deo ut mitteretur Neemias a rege Persidis nepotes sacerdotum illorum qui absconderant misit ad requirendum ignem et sicut narraverunt nobis non invenerunt ignem sed aquam crassam"
      en: "But when many years had passed, and it pleased God that Nehemias should be sent by the king of Persia, he sent some of the posterity of those priests that had hid it, to seek for the fire: and as they told us, they found no fire, but thick water."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et iussit eos haurire et adferre sibi et sacrificia quae inposita erant iussit sacerdos Neemias aspargi aqua ipsa et ligna et quae erant superposita"
      en: "Then he bade them draw it up, and bring it to him: and the priest Nehemias commanded the sacrifices that were laid on, to be sprinkled with the same water, both the wood, and the things that were laid upon it."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "utque hoc factum est et tempus adfuit quo sol refulsit qui prius erat in nubilo accensus est ignis magnus ita ut omnes mirarentur"
      en: "And when this was done, and the time came that the sun shone out, which before was in a cloud, there was a great fire kindled, so that all wondered."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "orationem autem faciebant omnes sacerdotes dum consummaretur sacrificium Ionatha inchoante ceteris autem respondentibus"
      en: "And all the priests made prayer, while the sacrifice was consuming, Jonathan beginning, and the rest answering."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et Neemiae erat oratio hunc habens modum Domine Deus omnium creator terribilis et fortis iustus et misericors qui solus es rex bonus"
      en: "And the prayer of Nehemias was after this manner: 0 Lord God, Creator of all things, dreadful and strong, just and merciful, who alone art the goad king,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "solus praestans solus iustus et omnipotens et aeternus qui liberas Israhel de omni malo qui fecisti patres electos et sanctificasti eos"
      en: "Who alone art gracious, who alone art just, and almighty, and eternal, who deliverest Israel from all evil, who didst choose the fathers and didst sanctify them :"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "accipe sacrificium pro universo populo tuo Israhel et custodi partem tuam et sanctifica"
      en: "Receive the sacrifice for all thy people Israel, and preserve thy own portion, and sanctify it."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "congrega dispersionem nostram libera eos qui serviunt gentibus contemptos et abominatos respice ut sciant gentes quod tu es Deus noster"
      en: "Gather together our scattered people, deliver them that are slaves to the Gentiles, and look upon them that are despised and abhorred: that the Gentiles may know that thou art our God."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "adflige opprimentes et contumeliam facientes in superbia"
      en: "Punish them that oppress us, and that treat us injuriously with pride."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "constitue populum tuum in loco sancto tuo sicut dixit Moses"
      en: "Establish thy people in thy holy place, as Moses hath spoken."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "sacerdotes autem psallebant hymnos usquequo consumptum esset sacrificium"
      en: "And the priests sung hymns till the sacrifice was consumed."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "cum autem consummatum fuisset sacrificium ex residua aqua Neemias iussit lapides maiores perfundi"
      en: "And when the sacrifice was consumed, Nehemias commanded the water that was left to be poured out upon the great stones."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quod ut factum est flamma ex eis accensa est sed ex lumine quod refulsit ab altari consumpta est"
      en: "Which being done, there -was kindled a dame from them: but it was consumed by the light that shined from the altar."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "ut vero manifestata essent haec renuntiatum est regi Persarum quod in loco in quo ignem absconderant hii qui translati erant sacerdotes aqua apparuit de qua Neemias et qui cum eo erant purificaverunt sacrificia"
      en: "And when this matter became public, it was told to the king of Persia, that in the place where the priests that were led away, had hid the fire, there appeared water, with which Nehemias and they that were with him had purified the sacrifices."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "considerans autem rex et rem diligenter examinans fecit ei templum"
      en: "And the king considering, and diligently examining the matter, made a temple for it, that he might prove what had happened."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et si quibus donaverat rex multa bona accipiebat ex hoc et tribuebat"
      en: "And when he had proved it, he gave the priests many goods, and divers presents, and he took end distributed them to them with his own hand."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "appellavit autem Neemias hoc Nepthar quod interpretatur purificatio vocatur autem apud plures Nephi"
      en: "And Nehemias called this place Nephthar, which is interpreted purification. But many call it Nephi."
    status: { la: verified, en: verified }
