# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2mach
chapter: 1
verses:
  - n: 1
    text:
      la: "Fratribus qui sunt per Aegyptum, Judaeis, salutem dicunt fratres qui sunt in Jerosolymis, Judaei, et qui in regione Judaeae, et pacem bonam."
      en: "To the brethren the Jews that are throughout Egypt, the brethren, the Jews that are in Jerusalem, and in the land of Judea, send health, and good peace."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Benefaciat vobis Deus, et meminerit testamenti sui, quod locutus est ad Abraham, et Isaac, et Jacob servorum suorum fidelium:"
      en: "May God be gracious to you, and remember his covenant that he made with Abraham, and Isaac, and Jacob, his faithful servants:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et det vobis cor omnibus ut colatis eum, et faciatis ejus voluntatem corde magno, et animo volenti."
      en: "And give you all a heart to worship him, and to do his will with a great heart, and a willing mind."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Adaperiat cor vestrum in lege sua, et in praeceptis suis, et faciat pacem."
      en: "May he open your heart in his law, and in his commandments, and send you peace."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Exaudiat orationes vestras, et reconcilietur vobis, nec vos deserat in tempore malo."
      en: "May he hear your prayers, and be reconciled unto you, and never forsake you in the evil time."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et nunc hic sumus orantes pro vobis."
      en: "And now here we are praying for you."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Regnante Demetrio, anno centesimo sexagesimo nono, nos Judaei scripsimus vobis in tribulatione, et impetu, qui supervenit nobis in istis annis, ex quo recessit Jason a sancta terra, et a regno."
      en: "When Demetrius reigned, in the year one hundred and sixty-nine, we Jews wrote to you, in the trouble, and violence, that came upon us in those years, after Jason withdrew himself from the holy land, and from the kingdom."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Portam succenderunt, et effuderunt sanguinem innocentem: et oravimus ad Dominum, et exauditi sumus, et obtulimus sacrificium, et similaginem, et accendimus lucernas, et proposuimus panes."
      en: "They burnt the gate, and shed innocent blood: then we prayed to the Lord, and were heard, and we offered sacrifices, and fine flour, and lighted the lamps, and set forth the loaves."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et nunc frequentate dies scenopegiae mensis Casleu."
      en: "And now celebrate ye the days of Scenopegia in the month of Casleu."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Anno centesimo octogesimo octavo, populus qui est Jerosolymis et in Judaea, senatusque et Judas, Aristobolo magistro Ptolemaei regis, qui est de genere christorum sacerdotum, et his qui in Aegypto sunt, Judaeis salutem et sanitatem."
      en: "In the year one hundred and eighty-eight, the people that is at Jerusalem, and in Judea, and the senate, and Judas, to Aristobolus, the preceptor of king Ptolemee, who is of the stock of the anointed priests, and to the Jews that are in Egypt, health and welfare."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "De magnis periculis a Deo liberati, magnifice gratias agimus ipsi, utpote qui adversus talem regem dimicavimus."
      en: "Having been delivered by God out of great dangers, we give him great thanks, forasmuch as we have been in war with such a king."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ipse enim ebullire fecit de Perside eos qui pugnaverunt contra nos et sanctam civitatem."
      en: "For he made numbers of men swarm out of Persia that have fought against us, and the holy city."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nam cum in Perside esset dux ipse, et cum ipso immensus exercitus, cecidit in templo Naneae, consilio deceptus sacerdotum Naneae."
      en: "For when the leader himself was in Persia, and with him a very great army, he fell in the temple of Nanea, being deceived by the counsel of the priests of Nanea."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Etenim cum ea habitaturus venit ad locum Antiochus, et amici ejus, et ut acciperet pecunias multas dotis nomine."
      en: "For Antiochus, with his friends, came to the place as though he would marry her, and that he might receive great sums of money under the title of a dowry."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cumque proposuissent eas sacerdotes Naneae, et ipse cum paucis ingressus esset intra ambitum fani, clauserunt templum,"
      en: "And when the priests of Nanea had set it forth, and he with a small company had entered into the compass of the temple, they shut the temple,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cum intrasset Antiochus: apertoque occulto aditu templi, mittentes lapides percusserunt ducem, et eos qui cum eo erant, et diviserunt membratim, et capitibus amputatis foras projecerunt."
      en: "When Antiochus was come in: and opening a secret entrance of the temple, they cast stones and slew the leader, and them that were with him, and hewed them in pieces, and cutting off their heads they threw them forth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Per omnia benedictus Deus, qui tradidit impios."
      en: "Blessed be God in all things, who hath delivered up the wicked."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Facturi igitur quinta et vigesima die mensis Casleu purificationem templi, necessarium duximus significare vobis: ut et vos quoque agatis diem scenopegiae, et diem ignis, qui datus est quando Nehemias aedificato templo et altari obtulit sacrificia."
      en: "Therefore whereas we purpose to keep the purification of the temple on the five and twentieth day of the month of Casleu, we thought it necessary to signify it to you: that you also may keep the day of Scenopegia, and the day of the fire, that was given when Nehemias offered sacrifice, after the temple and the altar was built."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Nam cum in Persidem ducerentur patres nostri, sacerdotes, qui tunc cultores Dei erant, acceptum ignem de altari occulte absconderunt in valle, ubi erat puteus altus et siccus, et in eo contutati sunt eum, ita ut omnibus ignotus esset locus."
      en: "For when our fathers were led into Persia, the priests that then were worshippers of God took privately the fire from the altar, and hid it in a valley where there was a deep pit without water, and there they kept it safe, so that the place was unknown to all men."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Cum autem praeterissent anni multi, et placuit Deo ut mitteretur Nehemias a rege Persidis: nepotes sacerdotum illorum, qui absconderant, misit ad requirendum ignem: et sicut narraverunt nobis, non invenerunt ignem, sed aquam crassam."
      en: "But when many years had passed, and it pleased God that Nehemias should be sent by the king of Persia, he sent some of the posterity of those priests that had hid it, to seek for the fire: and as they told us, they found no fire, but thick water."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et jussit eos haurire, et afferre sibi: et sacrificia, quae imposita erant, jussit sacerdos Nehemias aspergi ipsa aqua, et ligna, et quae erant superposita."
      en: "Then he bade them draw it up, and bring it to him: and the priest Nehemias commanded the sacrifices that were laid on, to be sprinkled with the same water, both the wood, and the things that were laid upon it."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Utque hoc factum est, et tempus affuit, quo sol refulsit, qui prius erat in nubilo, accensus est ignis magnus, ita ut omnes mirarentur."
      en: "And when this was done, and the time came that the sun shone out, which before was in a cloud, there was a great fire kindled, so that all wondered."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Orationem autem faciebant omnes sacerdotes, dum consummaretur sacrificium, Jonatha inchoante, ceteris autem respondentibus."
      en: "And all the priests made prayer, while the sacrifice was consuming, Jonathan beginning, and the rest answering."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et Nehemiae erat oratio hunc habens modum: Domine Deus omnium creator, terribilis et fortis, justus et misericors, qui solus est bonus rex,"
      en: "And the prayer of Nehemias was after this manner: O Lord God, Creator of all things, dreadful and strong, just and merciful, who alone art the good king,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "solus praestans, solus justus et omnipotens, et aeternus, qui liberas Israel de omni malo; qui fecisti patres electos, et sanctificasti eos:"
      en: "Who alone art gracious, who alone art just, and almighty, and eternal, who deliverest Israel from all evil, who didst choose the fathers and didst sanctify them:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "accipe sacrificium pro universo populo tuo Israel, et custodi partem tuam, et sanctifica."
      en: "Receive the sacrifice for all thy people Israel, and preserve thy own portion, and sanctify it."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Congrega dispersionem nostram, libera eos qui serviunt gentibus, et contemptos et abominatos respice, ut sciant gentes quia tu es Deus noster."
      en: "Gather together our scattered people, deliver them that are slaves to the Gentiles, and look upon them that are despised and abhorred: that the Gentiles may know that thou art our God."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Afflige opprimentes nos, et contumeliam facientes in superbia."
      en: "Punish them that oppress us, and that treat us injuriously with pride."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Constitue populum tuum in loco sancto tuo, sicut dixit Moyses."
      en: "Establish thy people in thy holy place, as Moses hath spoken."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Sacerdotes autem psallebant hymnos, usquequo consumptum esset sacrificium."
      en: "And the priests sung hymns till the sacrifice was consumed."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Cum autem consumptum esset sacrificium, ex residua aqua Nehemias jussit lapides majores perfundi."
      en: "And when the sacrifice was consumed, Nehemias commanded the water that was left to be poured out upon the great stones."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Quod ut factum est, ex eis flamma accensa est: sed ex lumine, quod refulsit ab altari, consumpta est."
      en: "Which being done, there was kindled a flame from them: but it was consumed by the light that shined from the altar."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Ut vero manifestata est res, renuntiatum est regi Persarum quod in loco, in quo ignem absconderent hi qui translati fuerant, sacerdotes, aqua apparuit, de qua Nehemias, et qui cum eo erant, purificaverunt sacrificia."
      en: "And when this matter became public, it was told to the king of Persia, that in the place where the priests that were led away, had hid the fire, there appeared water, with which Nehemias and they that were with him had purified the sacrifices."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Considerans autem rex, et rem diligenter examinans, fecit ei templum, ut probaret quod factum erat:"
      en: "And the king considering, and diligently examining the matter, made a temple for it, that he might prove what had happened."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et cum probasset, sacerdotibus donavit multa bona, et alia atque alia munera, et accipiens manu sua, tribuebat eis."
      en: "And when he had proved it, he gave the priests many goods, and divers presents, and he took and distributed them to them with his own hand."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Appellavit autem Nehemias hunc locum Nephthar, quod interpretatur Purificatio: vocatur autem apud plures Nephi."
      en: "And Nehemias called this place Nephthar, which is interpreted purification. But many call it Nephi."
    status: { la: verified, en: verified }
