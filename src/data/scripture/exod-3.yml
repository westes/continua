# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 3
verses:
  - n: 1
    text:
      la: "Moyses autem pascebat oves Jethro soceri sui sacerdotis Madian: cumque minasset gregem ad interiora deserti, venit ad montem Dei Horeb."
      en: "Now Moses fed the sheep of Jethro his father in law, the priest of Madian: and he drove the flock to the inner parts of the desert, and came to the mountain of God, Horeb."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Apparuitque ei Dominus in flamma ignis de medio rubi: et videbat quod rubus arderet, et non combureretur."
      en: "And the Lord appeared to him in a flame of fire out of the midst of a bush: and he saw that the bush was on fire and was not burnt."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dixit ergo Moyses: Vadam, et videbo visionem hanc magnam, quare non comburatur rubus."
      en: "And Moses said: I will go and see this great sight, why the bush is not burnt."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cernens autem Dominus quod pergeret ad videndum, vocavit eum de medio rubi, et ait: Moyses, Moyses. Qui respondit: Adsum."
      en: "And when the Lord saw that he went forward to see, he called to him out of the midst of the bush, and said: Moses, Moses. And he answered: Here I am."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "At ille: Ne appropies, inquit, huc: solve calceamentum de pedibus tuis: locus enim, in quo stas, terra sancta est."
      en: "And he said: Come not nigh hither, put off the shoes from thy feet: for the place whereon thou standest is holy ground."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et ait: Ego sum Deus patris tui, Deus Abraham, Deus Isaac et Deus Jacob. Abscondit Moyses faciem suam: non enim audebat aspicere contra Deum."
      en: "And he said: I am the God of thy father, the God of Abraham, the God of Isaac, and the God of Jacob. Moses hid his face: for he durst not look at God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cui ait Dominus: Vidi afflictionem populi mei in Aegypto, et clamorem ejus audivi propter duritiam eorum qui praesunt operibus:"
      en: "And the Lord said to him: I have seen the affliction of my people in Egypt, and I have heard their cry because of the rigour of them that are over the works:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et sciens dolorem ejus, descendi ut liberem eum de manibus Aegyptiorum, et educam de terra illa in terram bonam, et spatiosam, in terram quae fluit lacte et melle, ad loca Chananaei et Hethaei, et Amorrhaei, et Pherezaei, et Hevaei, et Jebusaei."
      en: "And knowing their sorrow, I am come down to deliver them out of the hands of the Egyptians, and to bring them out of that land into a good and spacious land, into a land that floweth with milk and honey, to the places of the Chanaanite, and Hethite, and Amorrhite, and Pherezite, and Hevite, and Jebusite."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Clamor ergo filiorum Israel venit ad me: vidique afflictionem eorum, qua ab Aegyptiis opprimuntur."
      en: "For the cry of the children of Israel is come unto me: and I have seen their affliction, wherewith they are oppressed by the Egyptians."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Sed veni, et mittam te ad Pharaonem, ut educas populum meum, filios Israel, de Aegypto."
      en: "But come, and I will send thee to Pharao, that thou mayst bring forth my people, the children of Israel out of Egypt."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Dixitque Moyses ad Deum: Quis sum ego ut vadam ad Pharaonem, et educam filios Israel de Aegypto?"
      en: "And Moses said to God: Who am I that I should go to Pharao, and should bring forth the children of Israel out of Egypt?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Qui dixit ei: Ego ero tecum: et hoc habebis signum, quod miserim te: cum eduxeris populum meum de Aegypto, immolabis Deo super montem istum."
      en: "And he said to him: I will be with thee: and this thou shalt have for a sign, that I have sent thee: When thou shalt have brought my people out of Egypt, thou shalt offer sacrifice to God upon this mountain."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ait Moyses ad Deum: Ecce ego vadam ad filios Israel, et dicam eis: Deus patrum vestrorum misit me ad vos. Si dixerint mihi: Quod est nomen ejus? quid dicam eis?"
      en: "Moses said to God: Lo, I shall go to the children of Israel, and say to them: The God of your fathers hath sent me to you. If they should say to me: What is his name? what shall I say to them?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dixit Deus ad Moysen: Ego sum qui sum. Ait: Sic dices filiis Israel: Qui est, misit me ad vos."
      en: "God said to Moses: I AM WHO AM. He said: Thus shalt thou say to the children of Israel: HE WHO IS, hath sent me to you."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dixitque iterum Deus ad Moysen: Haec dices filiis Israel: Dominus Deus patrum vestrorum, Deus Abraham, Deus Isaac et Deus Jacob, misit me ad vos: hoc nomen mihi est in aeternum, et hoc memoriale meum in generationem et generationem."
      en: "And God said again to Moses: Thus shalt thou say to the children of Israel: The Lord God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, hath sent me to you: This is my name for ever, and this is my memorial unto all generations."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Vade, et congrega seniores Israel, et dices ad eos: Dominus Deus patrum vestrorum apparuit mihi, Deus Abraham, Deus Isaac et Deus Jacob, dicens: Visitans visitavi vos: et vidi omnia quae acciderunt vobis in Aegypto."
      en: "Go, gather together the ancients of Israel, and thou shalt say to them: The Lord God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, hath appeared to me, saying: Visiting I have visited you: and I have seen all that hath befallen you in Egypt."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et dixi ut educam vos de afflictione Aegypti in terram Chananaei, et Hethaei, et Amorrhaei, et Pherezaei, et Hevaei, et Jebusaei, ad terram fluentem lacte et melle."
      en: "And I have said the word to bring you forth out of the affliction of Egypt, into the land of the Chanaanite, the Hethite, and the Amorrhite, and Pherezite, and Hevite, and Jebusite, to a land that floweth with milk and honey."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et audient vocem tuam: ingredierisque tu, et seniores Israel, ad regem Aegypti, et dices ad eum: Dominus Deus Hebraeorum vocavit nos: ibimus viam trium dierum in solitudinem, ut immolemus Domino Deo nostro."
      en: "And they shall hear thy voice: and thou shalt go in, thou and the ancients of Israel, to the king of Egypt, and thou shalt say to him: The Lord God of the Hebrews hath called us: we will go three days' journey into the wilderness, to sacrifice unto the Lord our God."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Sed ego scio quod non dimittet vos rex Aegypti ut eatis nisi per manum validam."
      en: "But I know that the king of Egypt will not let you go, but by a mighty hand."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Extendam enim manum meam, et percutiam Aegyptum in cunctis mirabilibus meis, quae facturus sum in medio eorum: post haec dimittet vos."
      en: "For I will stretch forth my hand and will strike Egypt with all my wonders which I will do in the midst of them: after these he will let you go."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Daboque gratiam populo huic coram Aegyptiis: et cum egrediemini, non exibitis vacui:"
      en: "And I will give favour to this people, in the sight of the Egyptians: and when you go forth, you shall not depart empty:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sed postulabit mulier a vicina sua et ab hospita sua, vasa argentea et aurea, ac vestes: ponetisque eas super filios et filias vestras, et spoliabitis Aegyptum."
      en: "But every woman shall ask of her neighbour, and of her that is in her house, vessels of silver and of gold, and raiment: and you shall put them on your sons and daughters, and shall spoil Egypt."
    status: { la: verified, en: verified }
