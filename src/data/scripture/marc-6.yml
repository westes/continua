# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: marc
chapter: 6
verses:
  - n: 1
    text:
      la: "Et egressus inde, abiit in patriam suam: et sequebantur eum discipuli sui:"
      en: "And going out from thence, he went into his own country; and his disciples followed him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et facto sabbato coepit in synagoga docere: et multi audientes admirabantur in doctrina ejus, dicentes: Unde huic haec omnia? et quae est sapientia, quae data est illi, et virtutes tales, quae per manus ejus efficiuntur?"
      en: "And when the sabbath was come, he began to teach in the synagogue: and many hearing him were in admiration at his doctrine, saying: How came this man by all these things? and what wisdom is this that is given to him, and such mighty works as are wrought by his hands?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Nonne hic est faber, filius Mariae, frater Jacobi, et Joseph, et Judae, et Simonis? nonne et sorores ejus hic nobiscum sunt? Et scandalizabantur in illo."
      en: "Is not this the carpenter, the son of Mary, the brother of James, and Joseph, and Jude, and Simon? are not also his sisters here with us? And they were scandalized in regard of him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et dicebat illis Jesus: Quia non est propheta sine honore nisi in patria sua, et in domo sua, et in cognatione sua."
      en: "And Jesus said to them: A prophet is not without honor, but in his own country, and in his own house, and among his own kindred."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et non poterat ibi virtutem ullam facere, nisi paucos infirmos impositis manibus curavit:"
      en: "And he could not do any miracles there, only that he cured a few that were sick, laying his hands upon them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et mirabatur propter incredulitatem eorum, et circuibat castella in circuitu docens."
      en: "And he wondered because of their unbelief, and he went through the villages round about teaching."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et vocavit duodecim: et coepit eos mittere binos, et dabat illis potestatem spirituum immundorum."
      en: "And he called the twelve; and began to send them two and two, and gave them power over unclean spirits."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et praecepit eis ne quid tollerent in via, nisi virgam tantum: non peram, non panem, neque in zona aes,"
      en: "And he commanded them that they should take nothing for the way, but a staff only: no scrip, no bread, nor money in their purse,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sed calceatos sandaliis, et ne induerentur duabus tunicis."
      en: "But to be shod with sandals, and that they should not put on two coats."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et dicebat eis: Quocumque introieritis in domum, illic manete donec exeatis inde:"
      en: "And he said to them: Wheresoever you shall enter into an house, there abide till you depart from that place."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et quicumque non receperint vos, nec audierint vos, exeuntes inde, excutite pulverem de pedibus vestris in testimonium illis."
      en: "And whosoever shall not receive you, nor hear you; going forth from thence, shake off the dust from your feet for a testimony to them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et exeuntes praedicabant ut poenitentiam agerent:"
      en: "And going forth they preached that men should do penance:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et daemonia multa ejiciebant, et ungebant oleo multos aegros, et sanabant."
      en: "And they cast out many devils, and anointed with oil many that were sick, and healed them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et audivit rex Herodes ( manifestum enim factum est nomen ejus), et dicebat: Quia Joannes Baptista resurrexit a mortuis: et propterea virtutes operantur in illo."
      en: "And king Herod heard, (for his name was made manifest,) and he said: John the Baptist is risen again from the dead, and therefore mighty works shew forth themselves in him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Alii autem dicebant: Quia Elias est; alii vero dicebant: Quia propheta est, quasi unus ex prophetis."
      en: "And others said: It is Elias. But others said: It is a prophet, as one of the prophets."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quo audito Herodes ait: Quem ego decollavi Joannem, hic a mortuis resurrexit."
      en: "Which Herod hearing, said: John whom I beheaded, he is risen again from the dead."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ipse enim Herodes misit, ac tenuit Joannem, et vinxit eum in carcere propter Herodiadem uxorem Philippi fratris sui, quia duxerat eam."
      en: "For Herod himself had sent and apprehended John, and bound him in prison for the sake of Herodias the wife of Philip his brother, because he had married her."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Dicebat enim Joannes Herodi: Non licet tibi habere uxorem fratris tui."
      en: "For John said to Herod: It is not lawful for thee to have thy brother's wife."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Herodias autem insidiabatur illi: et volebat occidere eum, nec poterat."
      en: "Now Herodias laid snares for him: and was desirous to put him to death, and could not."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Herodes enim metuebat Joannem, sciens eum virum justum et sanctum: et custodiebat eum, et audito eo multa faciebat, et libenter eum audiebat."
      en: "For Herod feared John, knowing him to be a just and holy man: and kept him, and when he heard him, did many things: and he heard him willingly."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et cum dies opportunus accidisset, Herodes natalis sui coenam fecit principibus, et tribunis, et primis Galilaeae:"
      en: "And when a convenient day was come, Herod made a supper for his birthday, for the princes, and tribunes, and chief men of Galilee."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "cumque introisset filia ipsius Herodiadis, et saltasset, et placuisset Herodi, simulque recumbentibus, rex ait puellae: Pete a me quod vis, et dabo tibi:"
      en: "And when the daughter of the same Herodias had come in, and had danced, and pleased Herod, and them that were at table with him, the king said to the damsel: Ask of me what thou wilt, and I will give it thee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et juravit illi: Quia quidquid petieris dabo tibi, licet dimidium regni mei."
      en: "And he swore to her: Whatsoever thou shalt ask I will give thee, though it be the half of my kingdom."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Quae cum exisset, dixit matri suae: Quid petam? At illa dixit: Caput Joannis Baptistae."
      en: "Who when she was gone out, said to her mother, What shall I ask? But she said: The head of John the Baptist."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Cumque introisset statim cum festinatione ad regem, petivit dicens: Volo ut protinus des mihi in disco caput Joannis Baptistae."
      en: "And when she was come in immediately with haste to the king, she asked, saying: I will that forthwith thou give me in a dish, the head of John the Baptist."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et contristatus est rex: propter jusjurandum, et propter simul discumbentes, noluit eam contristare:"
      en: "And the king was struck sad. Yet because of his oath, and because of them that were with him at table, he would not displease her:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "sed misso speculatore praecepit afferri caput ejus in disco. Et decollavit eum in carcere,"
      en: "But sending an executioner, he commanded that his head should be brought in a dish."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et attulit caput ejus in disco: et dedit illud puellae, et puella dedit matri suae."
      en: "And he beheaded him in the prison, and brought his head in a dish: and gave it to the damsel, and the damsel gave it to her mother."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Quo audito, discipuli ejus venerunt, et tulerunt corpus ejus: et posuerunt illud in monumento."
      en: "Which his disciples hearing came, and took his body, and laid it in a tomb."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et convenientes Apostoli ad Jesum, renuntiaverunt ei omnia quae egerant, et docuerant."
      en: "And the apostles coming together unto Jesus, related to him all things that they had done and taught."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et ait illis: Venite seorsum in desertum locum, et requiescite pusillum. Erant enim qui veniebant et redibant multi: et nec spatium manducandi habebant."
      en: "And he said to them: Come apart into a desert place, and rest a little. For there were many coming and going: and they had not so much as time to eat."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et ascendentes in navim, abierunt in desertum locum seorsum."
      en: "And going up into a ship, they went into a desert place apart."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et viderunt eos abeuntes, et cognoverunt multi: et pedestres de omnibus civitatibus concurrerunt illuc, et praevenerunt eos."
      en: "And they saw them going away, and many knew: and they ran flocking thither on foot from all the cities, and were there before them."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et exiens vidit turbam multam Jesus: et misertus est super eos, quia erant sicut oves non habentes pastorem, et coepit docere multa."
      en: "And Jesus going out saw a great multitude: and he had compassion on them, because they were as sheep not having a shepherd, and he began to teach them many things."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et cum jam hora multa fieret, accesserunt discipuli ejus, dicentes: Desertus est locus hic, et jam hora praeteriit:"
      en: "And when the day was now far spent, his disciples came to him, saying: This is a desert place, and the hour is now past:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "dimitte illos, ut euntes in proximas villas et vicos, emant sibi cibos, quos manducent."
      en: "Send them away, that going into the next villages and towns, they may buy themselves meat to eat."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et respondens ait illis: Date illis vos manducare. Et dixerunt ei: Euntes emamus ducentis denariis panes, et dabimus illis manducare."
      en: "And he answering said to them: Give you them to eat. And they said to him: Let us go and buy bread for two hundred pence, and we will give them to eat."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et dicit eis: Quot panes habetis? ite, et videte. Et cum cognovissent, dicunt: Quinque, et duos pisces."
      en: "And he saith to them: How many loaves have you? go and see. And when they knew, they say: Five, and two fishes."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et praecepit illis ut accumbere facerent omnes secundum contubernia super viride foenum."
      en: "And he commanded them that they should make them all sit down by companies upon the green grass."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et discubuerunt in partes per centenos et quinquagenos."
      en: "And they sat down in ranks, by hundreds and by fifties."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et acceptis quinque panibus et duobus pisces, intuens in caelum, benedixit, et fregit panes, et dedit discipulis suis, ut ponerent ante eos: et duos pisces divisit omnibus."
      en: "And when he had taken the five loaves, and the two fishes: looking up to heaven, he blessed, and broke the loaves, and gave to his disciples to set before them: and the two fishes he divided among them all."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et manducaverunt omnes, et saturati sunt."
      en: "And they all did eat, and had their fill."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Et sustulerunt reliquias, fragmentorum duodecim cophinos plenos, et de piscibus."
      en: "And they took up the leavings, twelve full baskets of fragments, and of the fishes."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Erant autem qui manducaverunt quinque millia virorum."
      en: "And they that did eat, were five thousand men."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Et statim coegit discipulos suos ascendere navim, ut praecederent eum trans fretum ad Bethsaidam, dum ipse dimitteret populum."
      en: "And immediately he obliged his disciples to go up into the ship, that they might go before him over the water to Bethsaida, whilst he dismissed the people."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Et cum dimisisset eos, abiit in montem orare."
      en: "And when he had dismissed them, he went up to the mountain to pray."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Et cum sero esset, erat navis in medio mari et ipse solus in terra."
      en: "And when it was late, the ship was in the midst of the sea, and himself alone on the land."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Et videns eos laborantes in remigando ( erat enim ventus contrarius eis) et circa quartam vigiliam noctis venit ad eos ambulans supra mare: et volebat praeterire eos."
      en: "And seeing them labouring in rowing, (for the wind was against them,) and about the fourth watch of the night, he cometh to them walking upon the sea, and he would have passed by them."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "At illi ut viderunt eum ambulantem supra mare, putaverunt phantasma esse, et exclamaverunt."
      en: "But they seeing him walking upon the sea, thought it was an apparition, and they cried out."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Omnes enim viderunt eum, et conturbati sunt. Et statim locutus est cum eis, et dixit eis: Confidite, ego sum: nolite timere."
      en: "For they all saw him, and were troubled. And immediately he spoke with them, and said to them: Have a good heart, it is I, fear ye not."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Et ascendit ad illos in navim, et cessavit ventus. Et plus magis intra se stupebant:"
      en: "And he went up to them into the ship, and the wind ceased: and they were far more astonished within themselves:"
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "non enim intellexerunt de panibus: erat enim cor eorum obcaecatum."
      en: "For they understood not concerning the loaves; for their heart was blinded."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Et cum transfretassent, venerunt in terram Genesareth, et applicuerunt."
      en: "And when they had passed over, they came into the land of Genezareth, and set to the shore."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Cumque egressi essent de navi, continuo cognoverunt eum:"
      en: "And when they were gone out of the ship, immediately they knew him:"
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "et percurrentes universam regionem illam, coeperunt in grabatis eos, qui se male habebant, circumferre, ubi audiebant eum esse."
      en: "And running through that whole country, they began to carry about in beds those that were sick, where they heard he was."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Et quocumque introibat, in vicos, vel in villas aut civitates, in plateis ponebant infirmos, et deprecabantur eum, ut vel fimbriam vestimenti ejus tangerent, et quotquot tangebant eum, salvi fiebant."
      en: "And whithersoever he entered, into towns or into villages or cities, they laid the sick in the streets, and besought him that they might touch but the hem of his garment: and as many as touched him were made whole."
    status: { la: verified, en: verified }
