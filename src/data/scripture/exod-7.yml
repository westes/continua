# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 7
verses:
  - n: 1
    text:
      la: "Dixitque Dominus ad Moysen: Ecce constitui te Deum Pharaonis: et Aaron frater tuus erit propheta tuus."
      en: "And the Lord said to Moses: Behold I have appointed thee the God of Pharao: and Aaron thy brother shall be thy prophet."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Tu loqueris ei omnia quae mando tibi: et ille loquetur ad Pharaonem, ut dimittat filios Israel de terra sua."
      en: "Thou shalt speak to him all that I command thee; and he shall speak to Pharao, that he let the children of Israel go out of his land."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sed ego indurabo cor ejus, et multiplicabo signa et ostenta mea in terra Aegypti,"
      en: "But I shall harden his heart, and shall multiply my signs and wonders in the land of Egypt,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et non audiet vos: immittamque manum meam super Aegyptum, et educam exercitum et populum meum filios Israel de terra Aegypti per judicia maxima."
      en: "And he will not hear you: and I will lay my hand upon Egypt, and will bring forth my army and my people the children of Israel out of the land of Egypt, by very great judgments."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et scient Aegyptii quia ego sum Dominus qui extenderim manum meam super Aegyptum, et eduxerim filios Israel de medio eorum."
      en: "And the Egyptians shall know that I am the Lord, who have stretched forth my hand upon Egypt, and have brought forth the children of Israel out of the midst of them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Fecit itaque Moyses et Aaron sicut praeceperat Dominus: ita egerunt."
      en: "And Moses and Aaron did as the Lord had commanded: so did they."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Erat autem Moyses octoginta annorum, et Aaron octoginta trium, quando locuti sunt ad Pharaonem."
      en: "And Moses was eighty years old, and Aaron eighty-three, when they spoke to Pharao."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dixitque Dominus ad Moysen et Aaron:"
      en: "And the Lord said to Moses and Aaron:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Cum dixerit vobis Pharao, Ostendite signa: dices ad Aaron: Tolle virgam tuam, et projice eam coram Pharaone, ac vertetur in colubrum."
      en: "When Pharao shall say to you, shew signs: thou shalt say to Aaron: Take thy rod, and cast it down before Pharao, and it shall be turned into a serpent."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ingressi itaque Moyses et Aaron ad Pharaonem, fecerunt sicut praeceperat Dominus: tulitque Aaron virgam coram Pharaone et servis ejus, quae versa est in colubrum."
      en: "So Moses and Aaron went in unto Pharao, and did as the Lord had commanded. And Aaron took the rod before Pharao, and his servants, and it was turned into a serpent."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Vocavit autem Pharao sapientes et maleficos: et fecerunt etiam ipsi per incantationes aegyptiacas et arcana quaedam similiter."
      en: "And Pharao called the wise men and the magicians: and they also by Egyptian enchantments and certain secrets did in like manner."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Projeceruntque singuli virgas suas, quae versae sunt in dracones: sed devoravit virga Aaron virgas eorum."
      en: "And they every one cast down their rods, and they were turned into serpents: but Aaron's rod devoured their rods."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Induratumque est cor Pharaonis, et non audivit eos, sicut praeceperat Dominus."
      en: "And Pharao's heart was hardened, and he did not hearken to them, as the Lord had commanded."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dixit autem Dominus ad Moysen: Ingravatum est cor Pharaonis: non vult dimittere populum."
      en: "And the Lord said to Moses: Pharao's heart is hardened, he will not let the people go."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Vade ad eum mane, ecce egredietur ad aquas: et stabis in occursum ejus super ripam fluminis: et virgam quae conversa est in draconem, tolles in manu tua."
      en: "Go to him in the morning, behold he will go out to the waters: and thou shalt stand to meet him on the bank of the river: and thou shalt take in thy hand the rod that was turned into a serpent."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Dicesque ad eum: Dominus Deus Hebraeorum misit me ad te, dicens: Dimitte populum meum ut sacrificet mihi in deserto: et usque ad praesens audire noluisti."
      en: "And thou shalt say to him: The Lord God of the Hebrews sent me to thee saying: Let my people go to sacrifice to me in the desert: and hitherto thou wouldst not hear."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Haec igitur dicit Dominus: In hoc scies quod sim Dominus: ecce percutiam virga, quae in manu mea est, aquam fluminis, et vertetur in sanguinem."
      en: "Thus therefore saith the Lord: In this thou shalt know that I am the Lord: behold I will strike with the rod that is in my hand, the water of the river, and it shall be turned into blood."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Pisces quoque, qui sunt in fluvio, morientur, et computrescent aquae, et affligentur Aegyptii bibentes aquam fluminis."
      en: "And the fishes that are in the river shall die, and the waters shall be corrupted, and the Egyptians shall be afflicted when they drink the water of the river."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dixit quoque Dominus ad Moysen: Dic ad Aaron: Tolle virgam tuam, et extende manum tuam super aquas Aegypti, et super fluvios eorum, et rivos ac paludes, et omnes lacus aquarum, ut vertantur in sanguinem: et sit cruor in omni terra Aegypti, tam in ligneis vasis quam in saxeis."
      en: "The Lord also said to Moses: Say to Aaron, Take thy rod, and stretch forth thy hand upon the waters of Egypt, and upon their rivers, and streams and pools, and all the ponds of waters, that they may be turned into blood: and let blood be in all the land of Egypt, both in vessels of wood and of stone."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Feceruntque Moyses et Aaron sicut praeceperat Dominus: et elevans virgam percussit aquam fluminis coram Pharaone et servis ejus: quae versa est in sanguinem."
      en: "And Moses and Aaron did as the Lord had commanded: and lifting up the rod he struck the water of the river before Pharao and his servants: and it was turned into blood."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et pisces, qui erant in flumine, mortui sunt: computruitque fluvius, et non poterant Aegyptii bibere aquam fluminis, et fuit sanguis in tota terra Aegypti."
      en: "And the fishes that were in the river died: and the river corrupted, and the Egyptians could not drink the water of the river, and there was blood in all the land of Egypt."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Feceruntque similiter malefici Aegyptiorum incantationibus suis: et induratum est cor Pharaonis, nec audivit eos, sicut praeceperat Dominus."
      en: "And the magicians of the Egyptians with their enchantments did in like manner: and Pharao's heart was hardened, neither did he hear them, as the Lord had commanded."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Avertitque se, et ingressus est domum suam, nec apposuit cor etiam hac vice."
      en: "And he turned himself away and went into his house, neither did he set his heart to it this time also."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Foderunt autem omnes Aegyptii per circuitum fluminis aquam ut biberent: non enim poterant bibere de aqua fluminis."
      en: "And all the Egyptians dug round about the river for water to drink: for they could not drink of the water of the river."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Impletique sunt septem dies, postquam percussit Dominus fluvium."
      en: "And seven days were fully ended, after that the Lord struck the river."
    status: { la: verified, en: verified }
