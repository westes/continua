# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 23
verses:
  - n: 1
    text:
      la: "onus Tyri ululate naves maris quia vastata est domus unde venire consueverant de terra Cetthim revelatum est eis"
      en: "The burden of Tyre. Howl, ye ships of the sea, for the house is destroyed, from whence they were wont to come: from the land of Cethim it is revealed to them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tacete qui habitatis in insula negotiatio Sidonis transfretantes mare repleverunt te"
      en: "Be silent, you that dwell in the island: the merchants of Sidon passing over the sea, have filled thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "in aquis multis semen Nili messis fluminis fruges eius et facta est negotiatio gentium"
      en: "The seed of the Nile in many waters, the harvest of the river is her revenue: and she is become the mart of the nations."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "erubesce Sidon ait enim mare fortitudo maris dicens non parturivi et non peperi et non enutrivi iuvenes nec ad incrementum perduxi virgines"
      en: "Be thou ashamed, O Sidon: for the sea speaketh, even the strength of the sea, saying: I have not been in labour, nor have I brought forth, nor have I nourished up young men, nor brought up virgins."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cum auditum fuerit in Aegypto dolebunt cum audierint de Tyro"
      en: "When it shall be heard in Egypt, they will be sorry when they shall hear of Tyre:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "transite maria ululate qui habitatis in insula"
      en: "Pass over the seas, howl, ye inhabitants of the island."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "numquid non haec vestra est quae gloriabatur a diebus pristinis in antiquitate sua ducent eam pedes sui longe ad peregrinandum"
      en: "Is not this your city, which gloried from of old in her antiquity? her feet shall carry her afar off to sojourn."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quis cogitavit hoc super Tyrum quondam coronatam cuius negotiatores principes institores eius incliti terrae"
      en: "Who hath taken this counsel against Tyre, that was formerly crowned, whose merchants were princes, and her traders the nobles of the earth?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dominus exercituum cogitavit hoc ut detraheret superbiam omnis gloriae et ad ignominiam deduceret universos inclitos terrae"
      en: "The Lord of hosts hath designed it, to pull down the pride of all glory, and bring to disgrace all the glorious ones of the earth."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "transi terram tuam quasi flumen filia maris non est cingulum ultra tibi"
      en: "Pass thy land as a river, O daughter of the sea, thou hast a girdle no more."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "manum suam extendit super mare conturbavit regna Dominus mandavit adversum Chanaan ut contereret fortes eius"
      en: "He stretched out his hand over the sea, he troubled kingdoms: the Lord hath given a charge against Chanaan, to destroy the strong ones thereof."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et dixit non adicies ultra ut glorieris calumniam sustinens virgo filia Sidonis in Cetthim consurgens transfreta ibi quoque non erit requies tibi"
      en: "And he said: Thou shalt glory no more, O virgin daughter of Sidon, who art oppressed: arise and sail over to Cethim, there also thou shalt have no, rest."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ecce terra Chaldeorum talis populus non fuit Assur fundavit eam in captivitatem transduxerunt robustos eius suffoderunt domos eius posuerunt eam in ruinam"
      en: "Behold the land of the Chaldeans, there was not such a people, the Assyrian founded it: they have led away the strong ones thereof into captivity, they have destroyed the houses thereof, they have brought it to ruin."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ululate naves maris quia devastata est fortitudo vestra"
      en: "Howl, O ye ships of the sea, for your strength is laid waste."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et erit in die illa in oblivione eris o Tyre septuaginta annis sicut dies regis unius post septuaginta autem annos erit Tyro quasi canticum meretricis"
      en: "And it shall come to pass in that day that thou, O Tyre, shalt be forgotten, seventy years, according to the days of one king: but after seventy years, there shall be unto Tyre as the song of a harlot."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sume citharam circui civitatem meretrix oblivioni tradita bene cane frequenta canticum ut memoria tui sit"
      en: "Take a harp, go about the city, thou harlot that hast been forgotten: sing well, sing many a song, that thou mayst be remembered."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et erit post septuaginta annos visitabit Dominus Tyrum et reducet eam ad mercedes suas et rursum fornicabitur cum universis regnis terrae super faciem terrae"
      en: "And it shall come to pass after seventy years, that the Lord will visit Tyre, and will bring her back again to her traffic: and she shall commit fornication again with all the kingdoms of the world upon the face of the earth."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et erunt negotiatio eius et mercedes eius sanctificatae Domino non condentur neque reponentur quia his qui habitaverint coram Domino erit negotiatio eius ut manducent in saturitatem et vestiantur usque ad vetustatem"
      en: "And her merchandise and her hire shall be sanctified to the Lord: they shall not be kept in store, nor laid up: for her merchandise shall be for them that shall dwell before the Lord, that they may eat unto fulness, and be clothed for a continuance."
    status: { la: verified, en: verified }
