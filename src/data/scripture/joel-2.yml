# Joel (cited "Joel"), chapter 2.
# Verses transcribed from pentecost-sunday-octave-day-3.yml (already pulled
# from Divinum Officium, Monastic Tridentinum 1617) as part of the
# migration to a dedicated scripture store (2026-08 decision).
book: joel
chapter: 2
verses:
  - n: 23
    text:
      la: "Et fílii Sion exsultáte, et lætámini in Dómino Deo vestro: quia dedit vobis doctórem justítiæ, et descéndere fáciet ad vos imbrem matutínum et serótinum, sicut in princípio."
      en: "And you, O children of Sion, rejoice, and be joyful in the Lord your God: because he hath given you a teacher of justice, and he will make the early and the latter rain to come down to you as in the beginning."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et implebúntur áreæ fruménto, et redundábunt torculária vino et óleo."
      en: "And the floors shall be full of wheat, and the presses shall overflow with wine and oil."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et reddam vobis annos, quos comédit locústa, bruchus, et rubígo, et erúca: fortitúdo mea magna quam misi in vos."
      en: "And I will restore to you the years which the locust, and the bruchus, and the mildew, and the palmerworm hath eaten; my great host which I sent upon you."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et comedétis vescéntes, et saturabímini: et laudábitis nomen Dómini Dei vestri, qui fecit mirabília vobíscum: et non confundétur pópulus meus in sempitérnum."
      en: "And you shall eat in plenty, and shall be filled: and you shall praise the name of the Lord your God, who hath done wonders with you: and my people shall not be confounded for ever."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et sciétis quia in médio Israël ego sum, et ego Dóminus Deus vester, et non est ámplius: et non confundétur pópulus meus in ætérnum."
      en: "And you shall know that I am in the midst of Israel: and I am the Lord your God, and there is none besides: and my people shall not be confounded for ever."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et erit post hæc: effúndam spíritum meum super omnem carnem, et prophetábunt fílii vestri et fíliæ vestræ: senes vestri sómnia somniábunt, et júvenes vestri visiónes vidébunt."
      en: "And it shall come to pass after this, that I will pour out my spirit upon all flesh: and your sons and your daughters shall prophesy: your old men shall dream dreams, and your young men shall see visions."
    status: { la: verified, en: verified }
