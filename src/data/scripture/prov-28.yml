# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: prov
chapter: 28
verses:
  - n: 1
    text:
      la: "fugit impius nemine persequente iustus autem quasi leo confidens absque terrore erit"
      en: "The wicked man fleeth, when no man pursueth: but the just, bold as a lion, shall be without dread."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "propter peccata terrae multi principes eius et propter hominis sapientiam et horum scientiam quae dicuntur vita ducis longior erit"
      en: "For the sine of the land many are the princes thereof: and for the wisdom of a man, and the knowledge of those things that are said, the life of the prince shall be prolonged."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "vir pauper calumnians pauperes similis imbri vehementi in quo paratur fames"
      en: "A poor man that oppresseth the poor, is like a violent shower, which bringeth a famine."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui derelinquunt legem laudant impium qui custodiunt succenduntur contra eum"
      en: "They that forsake the law, praise the wicked man: they that keep it, are incensed against him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "viri mali non cogitant iudicium qui autem requirunt Dominum animadvertunt omnia"
      en: "Evil men think not on judgment: but they that seek after the Lord, take notice of all things."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "melior est pauper ambulans in simplicitate sua quam dives pravis itineribus"
      en: "Better is the poor man walking in his simplicity, than the rich in crooked ways."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui custodit legem filius sapiens est qui pascit comesatores confundit patrem suum"
      en: "He that keepeth the law is a wise son: but he that feedeth gluttons, shameth his father."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui coacervat divitias usuris et fenore liberali in pauperes congregat eas"
      en: "He that heapeth together riches by usury and loan, gathereth them for him that will be bountiful to the poor."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "qui declinat aurem suam ne audiat legem oratio eius erit execrabilis"
      en: "He that turneth away his ears from hearing the law, his prayer shall be as abomination."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui decipit iustos in via mala in interitu suo corruet et simplices possidebunt bona"
      en: "He that deceiveth the just in a wicked way, shall fall in his own destruction: and the upright shall possess his goods."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sapiens sibi videtur vir dives pauper autem prudens scrutabitur eum"
      en: "The rich man seemeth to himself wise: but the poor man that is prudent shall search him out."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "in exultatione iustorum multa gloria regnantibus impiis ruinae hominum"
      en: "In the joy of the just there is great glory: when the wicked reign, men are ruined."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui abscondit scelera sua non dirigetur qui confessus fuerit et reliquerit ea misericordiam consequetur"
      en: "He that hideth his sins, shall not prosper: but he that shall confess, and forsake them, shall obtain mercy."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "beatus homo qui semper est pavidus qui vero mentis est durae corruet in malum"
      en: "Blessed is the man that is always fearful: but he that is hardened in mind, shall fall into evil."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "leo rugiens et ursus esuriens princeps impius super populum pauperem"
      en: "As a roaring lion, and a hungry bear, so is a wicked prince over the poor people."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dux indigens prudentia multos opprimet per calumniam qui autem odit avaritiam longi fient dies eius"
      en: "A prince void of prudence shall oppress many by calumny: but he that hateth covetousness, shall prolong his days."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "hominem qui calumniatur animae sanguinem si usque ad lacum fugerit nemo sustentet"
      en: "A man that doth violence to the blood of a person, if he flee even to the pit, no man will stay him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui ambulat simpliciter salvus erit qui perversis ingreditur viis concidet semel"
      en: "He that walketh uprightly, shall be saved: he that is perverse in his ways shall fall at once."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "qui operatur terram suam saturabitur panibus qui sectatur otium replebitur egestate"
      en: "He that tilleth his ground, shall be filled with bread: but he that followeth idleness shall be filled with poverty."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "vir fidelis multum laudabitur qui autem festinat ditari non erit innocens"
      en: "A faithful man shall be much praised: but he that maketh haste to be rich, shall not be innocent."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui cognoscit in iudicio faciem non facit bene iste et pro buccella panis deserit veritatem"
      en: "He that hath respect to a person in judgment, doth not well: such a man even for a morsel of bread forsaketh the truth."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "vir qui festinat ditari et aliis invidet ignorat quod egestas superveniat ei"
      en: "A man, that maketh haste to be rich, and envieth others, is ignorant that poverty shall come upon him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "qui corripit hominem gratiam postea inveniet apud eum magis quam ille qui per linguae blandimenta decipit"
      en: "He that rebuketh a man, shall afterward find favour with him, more than he that by a flattering tongue deceiveth him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "qui subtrahit aliquid a patre suo et matre et dicit hoc non est peccatum particeps homicidae est"
      en: "He that stealeth any thing from his father, or from his mother: and saith, This is no sin, is the partner of a murderer."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "qui se iactat et dilatat iurgia concitat qui sperat in Domino saginabitur"
      en: "He that boasteth, and puffeth up himself, stirreth up quarrels: but he that trusteth in the Lord, shall be healed."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "qui confidit in corde suo stultus est qui autem graditur sapienter iste salvabitur"
      en: "He that trusteth in his own heart, is a fool: but he that walketh wisely, he shall be saved."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "qui dat pauperi non indigebit qui despicit deprecantem sustinebit penuriam"
      en: "He that giveth to the poor, shall not want: he that despiseth his entreaty, shall suffer indigence."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "cum surrexerint impii abscondentur homines cum illi perierint multiplicabuntur iusti"
      en: "When the wicked rise up, men shall hide themselves: when they perish, the lust shall be multiplied."
    status: { la: verified, en: verified }
