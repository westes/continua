# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: num
chapter: 15
verses:
  - n: 1
    text:
      la: "locutus est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "loquere ad filios Israhel et dices ad eos cum ingressi fueritis terram habitationis vestrae quam ego dabo vobis"
      en: "Speak to the children of Israel and thou shalt say to them: When you shall be come into the land of your habitation, which I will give you,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et feceritis oblationem Domino in holocaustum aut victimam vota solventes vel sponte offerentes munera aut in sollemnitatibus vestris adolentes odorem suavitatis Domino de bubus sive de ovibus"
      en: "And shall make an offering to the Lord, for a holocaust, or a victim, paying your vows, or voluntarily offering gifts, or in your solemnities burning a sweet savour unto the Lord, of oxen or of sheep:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "offeret quicumque immolaverit victimam sacrificium similae decimam partem oephi conspersae oleo quod mensuram habebit quartam partem hin"
      en: "Whosoever immolateth the victim, shall offer a sacrifice of fine flour, the tenth part of an ephi, tempered with the fourth part of a hin of oil:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et vinum ad liba fundenda eiusdem mensurae dabit in holocausto sive in victima per agnos singulos"
      en: "And he shall give the same measure of wine to pour out in libations for the holocaust or for the victim. For every lamb,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et arietis erit sacrificium similae duarum decimarum quae conspersa sit oleo tertiae partis hin"
      en: "And for every ram there shall be a sacrifice of hour of two tenths, which shall be tempered with the third part of a hin of oil:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et vinum ad libamentum tertiae partis eiusdem mensurae offeret in odorem suavitatis Domino"
      en: "And he shall offer the third part of the same measure of wine for the libation, for a sweet savour to the Lord."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quando vero de bubus feceris holocaustum aut hostiam ut impleas votum vel pacificas victimas"
      en: "But when thou offerest a holocaust or sacrifice of oxen, to fulfil thy vow or for victims of peace offerings,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dabis per singulos boves similae tres decimas conspersae oleo quod habeat medium mensurae hin"
      en: "Thou shalt give for every ox three tenths of flour tempered with half a hin of oil,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et vinum ad liba fundenda eiusdem mensurae in oblationem suavissimi odoris Domino"
      en: "And wine for libations of the same measure, for an offering of most sweet savour to the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sic facietis"
      en: "Thus shalt thou do"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "per singulos boves et arietes et agnos et hedos"
      en: "For every ox and ram and lamb and kid."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "tam indigenae quam peregrini"
      en: "Both they that are born in the land, and the strangers"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "eodem ritu offerent sacrificia"
      en: "Shall offer sacrifices after the same rite."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "unum praeceptum erit atque iudicium tam vobis quam advenis terrae"
      en: "There shall be all one law and judgment both for you and for them who are strangers in the land."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "locutus est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "loquere filiis Israhel et dices ad eos"
      en: "Speak to the children of Israel, and thou shalt say to them:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cum veneritis in terram quam dabo vobis"
      en: "When you are come into the land which I will give you,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et comederitis de panibus regionis illius separabitis primitias Domino"
      en: "And shall eat of the bread of that country, you shall separate firstfruits to the Lord,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "de cibis vestris sicut de areis primitias separatis"
      en: "Of the things you eat. As you separate firstfruits of your barnfloors:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ita et de pulmentis dabitis primitiva Domino"
      en: "So also shall you give firstfruits of your dough to the Lord."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quod si per ignorantiam praeterieritis quicquam horum quae locutus est Dominus ad Mosen"
      en: "And if through ignorance you omit any of these things, which the Lord hath spoken to Moses,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et mandavit per eum ad vos a die qua coepit iubere et ultra"
      en: "And by him hath commanded you, from the day that he began to command and thenceforward,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "oblitaque fuerit facere multitudo offeret vitulum de armento holocaustum in odorem suavissimum Domino et sacrificium eius ac liba ut caerimoniae postulant hircumque pro peccato"
      en: "And the multitude have forgotten to do it: they shall offer a calf out of the herd, a holocaust for a most sweet savour to the Lord, and the sacrifice and libations thereof, as the ceremonies require, and a buck goat for sin:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et rogabit sacerdos pro omni multitudine filiorum Israhel et dimittetur eis quoniam non sponte peccaverunt nihilominus offerentes incensum Domino pro se et pro peccato atque errore suo"
      en: "And the priest shall pray for all the multitude of the children of Israel: and it shall be forgiven them, because they sinned ignorantly, offering notwithstanding a burnt offering to the Lord for themselves and for their sin and their ignorance:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et dimittetur universae plebi filiorum Israhel et advenis qui peregrinantur inter vos quoniam culpa est omnis populi per ignorantiam"
      en: "And it shall be forgiven all the people of the children of Israel: and the strangers that sojourn among them: because it is the fault of all the people through ignorance."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "quod si anima una nesciens peccaverit offeret capram anniculam pro peccato suo"
      en: "But if one soul shall sin ignorantly, he shall offer a she goat of a year old for his sin."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et deprecabitur pro ea sacerdos quod inscia peccaverit coram Domino inpetrabitque ei veniam et dimittetur illi"
      en: "And the priest shall pray for him, because he sinned ignorantly before the Lord: and he shall obtain his pardon, and it shall be forgiven him."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "tam indigenis quam advenis una lex erit omnium qui peccaverint ignorantes"
      en: "The same law shall be for all that sin by ignorance, whether they be natives or strangers."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "anima vero quae per superbiam aliquid commiserit sive civis sit ille sive peregrinus quoniam adversum Dominum rebellis fuit peribit de populo suo"
      en: "But the soul that committeth any thing through pride, whether he be born in the land or a stranger (because he hath been rebellious against the Lord) shall be cut off from among his people:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "verbum enim Domini contempsit et praeceptum illius fecit irritum idcirco delebitur et portabit iniquitatem suam"
      en: "For he hath contemned the word the Lord, and made void his precept: therefore shall he be destroyed, and shall bear his iniquity."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "factum est autem cum essent filii Israhel in solitudine et invenissent hominem colligentem ligna in die sabbati"
      en: "And it came to pass, when the children of Israel were in the wilderness, and had found a man gathering sticks on the sabbath day,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "obtulerunt eum Mosi et Aaron et universae multitudini"
      en: "That they brought him to Moses and Aaron and the whole multitude."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "qui recluserunt eum in carcerem nescientes quid super eo facere deberent"
      en: "And they put him into prison, not knowing what they should do with him."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "dixitque Dominus ad Mosen morte moriatur homo iste obruat eum lapidibus omnis turba extra castra"
      en: "And the Lord said to Moses: Let that man die, let all the multitude stone him without the camp."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "cumque eduxissent eum foras obruerunt lapidibus et mortuus est sicut praeceperat Dominus"
      en: "And when they had brought him out, they stoned him, and he died as the Lord had commanded."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "dixit quoque Dominus ad Mosen"
      en: "The Lord also said to Moses:"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "loquere filiis Israhel et dices ad eos ut faciant sibi fimbrias per angulos palliorum ponentes in eis vittas hyacinthinas"
      en: "Speak to the children of Israel, and thou shalt tell them I to make to themselves fringes in the corners of their garments, putting in them ribands of blue:"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "quas cum viderint recordentur omnium mandatorum Domini nec sequantur cogitationes suas et oculos per res varias fornicantes"
      en: "That when they shall see them, they may remember all the commandments of the Lord, and not follow their own thoughts and eyes going astray after divers things,"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "sed magis memores praeceptorum Domini faciant ea sintque sancti Deo suo"
      en: "But rather being mindful of the precepts of the Lord, may do them and be holy to their Cod."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "ego Dominus Deus vester qui eduxi vos de terra Aegypti ut essem vester Deus"
      en: "I am the Lord your God, who brought you out of the land of Egypt, that I might be your God."
    status: { la: verified, en: verified }
