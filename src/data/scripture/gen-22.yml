# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 22
verses:
  - n: 1
    text:
      la: "Quae postquam gesta sunt, tentavit Deus Abraham, et dixit ad eum: Abraham, Abraham. At ille respondit: Adsum."
      en: "After these things, God tempted Abraham, and said to him: Abraham, Abraham. And he answered: Here I am."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ait illi: Tolle filium tuum unigenitum, quem diligis, Isaac, et vade in terram visionis, atque ibi offeres eum in holocaustum super unum montium quem monstravero tibi."
      en: "He said to him: Take thy only begotten son Isaac, whom thou lovest, and go into the land of vision: and there thou shalt offer him for an holocaust upon one of the mountains which I will shew thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Igitur Abraham de nocte consurgens, stravit asinum suum, ducens secum duos juvenes, et Isaac filium suum: cumque concidisset ligna in holocaustum, abiit ad locum quem praeceperat ei Deus."
      en: "So Abraham rising up in the night, saddled his ass: and took with him two young men, and Isaac his son: and when he had cut wood for the holocaust he went his way to the place which God had commanded him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Die autem tertio, elevatis oculis, vidit locum procul:"
      en: "And on the third day, lifting up his eyes, he saw the place afar off."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixitque ad pueros suos: Expectate hic cum asino: ego et puer illuc usque properantes, postquam adoraverimus, revertemur ad vos."
      en: "And he said to his young men: Stay you here with the ass: I and the boy will go with speed as far as yonder, and after we have worshipped, will return to you."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Tulit quoque ligna holocausti, et imposuit super Isaac filium suum: ipse vero portabat in manibus ignem et gladium. Cumque duo pergerent simul,"
      en: "And he took the wood for the holocaust, and laid it upon Isaac his son: and he himself carried in his hands fire and a sword. And as they two went on together,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixit Isaac patri suo: Pater mi. At ille respondit: Quid vis, fili? Ecce, inquit, ignis et ligna: ubi est victima holocausti?"
      en: "Isaac said to his father: My father. And he answered: What wilt thou, son? Behold, saith he, fire and wood: where is the victim for the holocaust?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dixit autem Abraham: Deus providebit sibi victimam holocausti, fili mi. Pergebant ergo pariter."
      en: "And Abraham said: God will provide himself a victim for an holocaust, my son. So they went on together."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et venerunt ad locum quem ostenderat ei Deus, in quo aedificavit altare, et desuper ligna composuit; cumque alligasset Isaac filium suum, posuit eum in altare super struem lignorum."
      en: "And they came to the place which God had shewn him, where he built an altar, and laid the wood in order upon it: and when he had bound Isaac his son, he laid him on the altar upon the pile of wood."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Extenditque manum, et arripuit gladium, ut immolaret filium suum."
      en: "And he put forth his hand and took the sword, to sacrifice his son."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et ecce angelus Domini de caelo clamavit, dicens: Abraham, Abraham. Qui respondit: Adsum."
      en: "And behold an angel of the Lord from heaven called to him, saying: Abraham, Abraham. And he answered: Here I am."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dixitque ei: Non extendas manum tuam super puerum, neque facias illi quidquam: nunc cognovi quod times Deum, et non pepercisti unigenito filio tuo propter me."
      en: "And he said to him: Lay not thy hand upon the boy, neither do thou any thing to him: now I know that thou fearest God, and hast not spared thy only begotten son for my sake."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Levavit Abraham oculos suos, viditque post tergum arietem inter vepres haerentem cornibus, quem assumens obtulit holocaustum pro filio."
      en: "Abraham lifted up his eyes, and saw behind his back a ram amongst the briers sticking fast by the horns, which he took and offered for a holocaust instead of his son."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Appellavitque nomen loci illius, Dominus videt. Unde usque hodie dicitur: In monte Dominus videbit."
      en: "And he called the name of that place, The Lord seeth. Whereupon even to this day it is said: In the mountain the Lord will see."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Vocavit autem angelus Domini Abraham secundo de caelo, dicens:"
      en: "And the angel of the Lord called to Abraham a second time from heaven, saying:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Per memetipsum juravi, dicit Dominus: quia fecisti hanc rem, et non pepercisti filio tuo unigenito propter me:"
      en: "By my own self have I sworn, saith the Lord: because thou hast done this thing, and hast not spared thy only begotten son for my sake:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "benedicam tibi, et multiplicabo semen tuum sicut stellas caeli, et velut arenam quae est in littore maris: possidebit semen tuum portas inimicorum suorum,"
      en: "I will bless thee, and I will multiply thy seed as the stars of heaven, and as the sand that is by the sea shore: thy seed shall possess the gates of their enemies."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et benedicentur in semine tuo omnes gentes terrae, quia obedisti voci meae."
      en: "And in thy seed shall all the nations of the earth be blessed, because thou hast obeyed my voice."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Reversus est Abraham ad pueros suos, abieruntque Bersabee simul, et habitavit ibi."
      en: "Abraham returned to his young men, and they went to Bersabee together, and he dwelt there."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "His ita gestis, nuntiatum est Abrahae quod Melcha quoque genuisset filios Nachor fratri suo:"
      en: "After these things, it was told Abraham that Melcha also had borne children to Nachor his brother."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Hus primogenitum, et Buz fratrem ejus, et Camuel patrem Syrorum,"
      en: "Hus the firstborn, and Buz his brother, and Camuel the father of the Syrians,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et Cased, et Azau, Pheldas quoque et Jedlaph,"
      en: "And Cased, and Azau, and Pheldas, and Jedlaph,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ac Bathuel, de quo nata est Rebecca: octo istos genuit Melcha, Nachor fratri Abrahae."
      en: "And Bathuel, of whom was born Rebecca: These eight did Melcha bear to Nachor Abraham's brother."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Concubina vero illius, nomine Roma, peperit Tabee, et Gaham, et Thahas, et Maacha."
      en: "And his concubine, named Roma, bore Tabee, and Gaham, and Tahas, and Maacha."
    status: { la: verified, en: verified }
