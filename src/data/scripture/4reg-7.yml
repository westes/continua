book: 4reg
chapter: 7
verses:
  - n: 1
    text:
      la: "dixit autem Heliseus audite verbum Domini haec dicit Dominus in tempore hoc cras modius similae uno statere erit et duo modii hordei statere uno in porta Samariae"
      en: "And Eliseus said: Hear ye the word of the Lord: Thus saith the Lord: To morrow about this time a bushel of fine hour shall be sold for a stater, and two bushels of barley for a stater, in the gate of Samaria."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "respondens unus de ducibus super cuius manum rex incumbebat homini Dei ait si Dominus fecerit etiam cataractas in caelo numquid poterit esse quod loqueris qui ait videbis oculis tuis et inde non comedes"
      en: "Then one of the lords, upon whose hand the king leaned, answering the man of God, said: If the Lord should make hood-gates in heaven, can that possibly be which thou sayest? And he said: Thou shalt see it with thy eyes, but shalt not eat thereof."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quattuor ergo viri erant leprosi iuxta introitum portae qui dixerunt ad invicem quid hic esse volumus donec moriamur"
      en: "Now there were four lepers, at the entering in of the gate: and they said one to another: What mean we to stay here till we die?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sive ingredi voluerimus civitatem fame moriemur sive manserimus hic moriendum nobis est venite igitur et transfugiamus ad castra Syriae si pepercerint nobis vivemus si autem occidere voluerint nihilominus moriemur"
      en: "If we will enter into the city, we shall die with the famine: and if we will remain here, we must also die: come, therefore, and let us run over to the camp of the Syrians. If they spare us, we shall live: but if they kill us, we shall but die."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "surrexerunt igitur vesperi ut venirent ad castra Syriae cumque venissent ad principium castrorum Syriae nullum ibidem reppererunt"
      en: "So they arose in the evening, to go to the Syrian camp, And when they were come to the first part of the camp of the Syrians, they found no man there."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "siquidem Dominus sonitum audiri fecerat in castris Syriae curruum et equorum et exercitus plurimi dixeruntque ad invicem ecce mercede conduxit adversum nos rex Israhel reges Hettheorum et Aegyptiorum et venerunt super nos"
      en: "For the Lord had made them hear, in the camp of Syria, the noise of chariots, and of horses, and of a very great army, and they said one to another: Behold the king of Israel hath hired against us the kings of the Hethites, and of the Egyptians, and they are come upon us."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "surrexerunt ergo et fugerunt in tenebris et dereliquerunt tentoria sua et equos et asinos in castris fugeruntque animas tantum suas salvare cupientes"
      en: "Wherefore they arose, and fled away in the dark, and left their tents, and their horses and asses in the camp, and fled, desiring to save their lives."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "igitur cum venissent leprosi illi ad principium castrorum ingressi sunt unum tabernaculum et comederunt et biberunt tuleruntque inde argentum et aurum et vestes et abierunt et absconderunt et rursum reversi sunt ad aliud tabernaculum et inde similiter auferentes absconderunt"
      en: "So when these lepers were come to the beginning of the camp, they went into one tent, and ate and drank: and they took from thence silver, and gold, and raiment, and went, and hid it: and they came again, and went into another tent, and carried from thence in like manner, and hid it."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dixeruntque ad invicem non recte facimus haec enim dies boni nuntii est si tacuerimus et noluerimus nuntiare usque mane sceleris arguemur venite eamus et nuntiemus in aula regis"
      en: "Then they said one to another: We do not well: for this is a day of good tidings. If we hold our peace, and do not tell it till the morning, we shall be charged with a crime: come, let us go and tell it in the king's court."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cumque venissent ad portam civitatis narraverunt eis dicentes ivimus ad castra Syriae et nullum ibidem repperimus hominum nisi equos et asinos alligatos et fixa tentoria"
      en: "So they came to the gate of the city, and told them, saying: We went to the camp of the Syrians, and we found no man there, but horses, and asses tied, and the tents standing."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ierunt ergo portarii et nuntiaverunt in palatio regis intrinsecus"
      en: "Then the guards of the gate went, and told it within the king's palace."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "qui surrexit nocte et ait ad servos suos dico vobis quid fecerint nobis Syri sciunt quia fame laboramus et idcirco egressi sunt de castris et latitant in agris dicentes cum egressi fuerint de civitate capiemus eos viventes et tunc civitatem ingredi poterimus"
      en: "And he arose in the night and said to his servants: I tell you what the Syrians have done to us: They know that we suffer great famine, and therefore they are gone out of the camp, and lie hid in the fields, saying: When they come out of the city we shall take them alive, and then we may get into the city."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "respondit autem unus servorum eius tollamus quinque equos qui remanserunt in urbe quia ipsi tantum sunt in universa multitudine Israhel alii enim consumpti sunt et mittentes explorare poterimus"
      en: "And one of his servants answered: Let us take the five horses that are remaining in the city (because there are no more in the whole multitude of Israel, for the rest are consumed,) and let us send and see."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "adduxerunt ergo duos equos misitque rex ad castra Syrorum dicens ite videte"
      en: "They brought therefore two horses, and the king sent into the camp of the Syrians, saying: Go, and see."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui abierunt post eos usque ad Iordanem ecce autem omnis via plena erat vestibus et vasis quae proiecerant Syri cum turbarentur reversique nuntii indicaverunt regi"
      en: "And they went after them as far as the Jordan: and behold all the way was full of garments, and vessels, which the Syrians had cast away in their fright, and the messengers returned end told the king."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et egressus populus diripuit castra Syriae factusque est modius similae statere uno et duo modii hordei statere uno iuxta verbum Domini"
      en: "And the people going out pillaged the camp of the Syrians: and a bushel of fine flour was sold for a stater, and two bushels of barley for a stater, according to the word of the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "porro rex ducem illum in cuius manu incubuerat constituit ad portam quem conculcavit turba in introitu et mortuus est iuxta quod locutus fuerat vir Dei quando descenderat rex ad eum"
      en: "And the king appointed that lord on whose hand he leaned, to stand at the gate: and the people trod upon him in the entrance of the gate; and he died, as the man of God had said, when the king came down to him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "factumque est secundum sermonem viri Dei quem dixerat regi quando ait duo modii hordei statere uno erunt et modius similae statere uno hoc eodem tempore cras in porta Samariae"
      en: "And it came to pass according to the word of the man of God, which he spoke to the king, when he said: Two bushels of barley shall be for a stater, and a bushel of fine flour for a stater, at this very time to morrow in the gate of Samaria."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quando responderat dux ille viro Dei et dixerat etiam si Dominus fecerit cataractas in caelo numquid fieri poterit quod loqueris et dixit ei videbis oculis tuis et inde non comedes"
      en: "When that lord answered the mall of' God, and said: Although the Lord should make flood-gates in heaven, could this come to pass which thou sayest? And he said to him: Thou shalt see with thy eyes, and shalt not eat thereof."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "evenit ergo ei sicut praedictum erat et conculcavit eum populus in porta et mortuus est"
      en: "And so it fell out to him as it was foretold, and the people trod upon him in the gate, and he died."
    status: { la: verified, en: verified }
