# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: deut
chapter: 19
verses:
  - n: 1
    text:
      la: "cum disperderit Dominus Deus tuus gentes quarum tibi traditurus est terram et possederis eam habitaverisque in urbibus eius et in aedibus"
      en: "When the Lord thy God hath destroyed the nations, whose land he will deliver to thee, and thou shalt possess it, and shalt dwell in the cities and houses thereof :"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tres civitates separabis tibi in medio terrae quam Dominus Deus tuus dabit tibi in possessionem"
      en: "Thou shalt separate to thee three cities in the midst of the land, which the Lord will give thee in possession,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sternens diligenter viam et in tres aequaliter partes totam terrae tuae provinciam divides ut habeat e vicino qui propter homicidium profugus est quo possit evadere"
      en: "Paving diligently the way: and thou shalt divide the whole province of thy land equally into three parts: that he who is forced to flee for manslaughter, may have near at hand whither to escape."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "haec erit lex homicidae fugientis cuius vita servanda est qui percusserit proximum suum nesciens et qui heri et nudius tertius nullum contra eum habuisse odium conprobatur"
      en: "This shall be the law of the slayer that fleeth, whose life is to be saved: He that killeth his neighbour ignorantly, and who is proved to have had no hatred against him yesterday and the day before:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "sed abisse simpliciter cum eo in silvam ad ligna caedenda et in succisione lignorum securis fugerit manu ferrumque lapsum de manubrio amicum eius percusserit et occiderit hic ad unam supradictarum urbium confugiet et vivet"
      en: "But to have gone with him to the wood to hew wood, and in cutting down the tree the axe slipped out of his hand, and the iron slipping from the handle struck his friend, and killed him: he shall flee to one of the cities aforesaid, and live:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ne forsitan proximus eius cuius effusus est sanguis dolore stimulatus persequatur et adprehendat eum si longior via fuerit et percutiat animam eius qui non est reus mortis quia nullum contra eum qui occisus est odium prius habuisse monstratur"
      en: "Lest perhaps the next kinsman of him whose blood was shed, pushed on by his grief should pursue, and apprehend him. if the way be too long, and take away the life of him who is not guilty of death, because he is proved to have had no hatred before against him that was slain."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "idcirco praecipio tibi ut tres civitates aequalis inter se spatii dividas"
      en: "Therefore I command thee, that thou separate three cities at equal distance one from another."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cum autem dilataverit Dominus Deus tuus terminos tuos sicut iuravit patribus tuis et dederit tibi cunctam terram quam eis pollicitus est"
      en: "And when the Lord thy God shall have enlarged thy borders, as he swore to thy fathers, and shall give thee all the land that he promised them,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "si tamen custodieris mandata eius et feceris quae hodie praecipio tibi ut diligas Dominum Deum tuum et ambules in viis eius omni tempore addes tibi tres alias civitates et supradictarum trium urbium numerum duplicabis"
      en: "(Yet so, if thou keep his commandments, and do the things which I command thee this day, that thou love the Lord thy God, and walk in his ways at all times) thou shalt add to thee other three cities, and shalt double the number of the three cities aforesaid:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ut non effundatur sanguis innoxius in medio terrae quam Dominus Deus tuus dabit tibi possidendam nec sis sanguinis reus"
      en: "That innocent blood may not be shed in the midst of the land which the Lord thy God will give thee to possess, lest thou be guilty of blood."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "si quis autem odio habens proximum suum insidiatus fuerit vitae eius surgensque percusserit illum et mortuus fuerit fugeritque ad unam de supradictis urbibus"
      en: "But if any man hating his neighbour, lie in wait for his life, and rise and strike him, and he die, and he flee to one of the cities aforesaid,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "mittent seniores civitatis illius et arripient eum de loco effugii tradentque in manu proximi cuius sanguis effusus est et morietur"
      en: "The ancients of his city shall send, and take him out of the place of refuge, and shall deliver him into the hand of the kinsman of him whose blood was shed, and he shall die."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "nec misereberis eius et auferes innoxium sanguinem de Israhel ut bene sit tibi"
      en: "Thou shalt not pity him, and thou shalt take away the guilt of innocent blood out of Israel, that it may be well with thee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "non adsumes et transferes terminos proximi tui quos fixerunt priores in possessione tua quam Dominus Deus tuus dabit tibi in terra quam acceperis possidendam"
      en: "Thou shalt not take nor remove thy neighbour's landmark, which thy predecessors have set in thy possession. which the Lord thy God will give thee in the land that thou shalt receive to possess."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "non stabit testis unus contra aliquem quicquid illud peccati et facinoris fuerit sed in ore duorum aut trium testium stabit omne verbum"
      en: "One witness shall not rise up against any man, whatsoever the sin or wickedness be: but in the mouth of two or three witnesses every word shall stand."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "si steterit testis mendax contra hominem accusans eum praevaricationis"
      en: "If a lying witness stand against a man, accusing him of transgression,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "stabunt ambo quorum causa est ante Dominum in conspectu sacerdotum et iudicum qui fuerint in diebus illis"
      en: "Both of them, between whom the controversy is, shall stand before the Lord in the sight of the priests and the judges that shall be in those days."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cumque diligentissime perscrutantes invenerint falsum testem dixisse contra fratrem suum mendacium"
      en: "And when after most diligent inquisition, they shall find that the false witness hath told a lie against his brother:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "reddent ei sicut fratri suo facere cogitavit et auferes malum de medio tui"
      en: "They shall render to him as he meant to do to his brother, and thou shalt take away the evil out of the midst of thee:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ut audientes ceteri timorem habeant et nequaquam talia audeant facere"
      en: "That others hearing may fear, and may not dare to do such things."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "non misereberis eius sed animam pro anima oculum pro oculo dentem pro dente manum pro manu pedem pro pede exiges"
      en: "21Thou shalt not pity him, but shalt require life for life, eye for eye, tooth for tooth, hand for hand, foot for foot."
    status: { la: verified, en: verified }
