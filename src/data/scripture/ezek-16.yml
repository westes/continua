# Ezekiel (Vulgate "Ezechiel," cited "Ezech"), chapter 16.
# Verses transcribed from all-saints-octave-day-7.yml (already pulled
# from Divinum Officium, Monastic Tridentinum 1617) as part of the
# migration to a dedicated scripture store (2026-08 decision).
book: ezek
chapter: 16
verses:
  - n: 1
    text:
      la: "Et factus est sermo Dómini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fili hóminis, notas fac Jerúsalem abominatiónes suas,"
      en: "Son of man, make known to Jerusalem her abominations."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dices: Hæc dicit Dóminus Deus Jerúsalem: Radix tua et generátio tua de terra Chánaan, pater tuus Amorrhǽus, et mater tua Cethǽa."
      en: "And thou shalt say: Thus saith the Lord God to Jerusalem: thy root, and thy nativity is of the land of Chanaan, thy father was an Amorrhite, and thy mother a Cethite."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et quando nata es, in die ortus tui, non est præcísus umbilícus tuus, et aqua non es lota in salútem, nec sale salíta, nec involúta pannis."
      en: "And when thou wast born, in the day of thy nativity thy navel was not cut, neither wast thou washed with water for thy health, nor salted with salt, nor swaddled with clouts."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Non pepércit super te óculus, ut fáceret tibi unum de his, misértus tui, sed projécta es super fáciem terræ in abjectióne ánimæ tuæ, in die qua nata es."
      en: "No eye had pity on thee to do any of these things for thee, out of compassion to thee: but thou wast cast out upon the face of the earth in the abjection of thy soul, in the day that thou wast born."
    status: { la: verified, en: verified }
