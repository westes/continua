# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 4
verses:
  - n: 1
    text:
      la: "Mulier autem quaedam de uxoribus prophetarum clamabat ad Eliseum, dicens: Servus tuus vir meus mortuus est, et tu nosti quia servus tuus fuit timens Dominum: et ecce creditor venit ut tollat duos filios meos ad serviendum sibi."
      en: "Now a certain woman of the wives of the prophets cried to Eliseus, saying: Thy servant my husband is dead, and thou knowest that thy servant was one that feared God, and behold the creditor is come to take away my two sons to serve him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cui dixit Eliseus: Quid vis ut faciam tibi? Dic mihi, quid habes in domo tua? At illa respondit: Non habeo ancilla tua quidquam in domo mea nisi parum olei, quo ungar."
      en: "And Eliseus said to her: What wilt thou have me to do for thee? Tell me, what hast thou in thy house? And she answered: I thy handmaid have nothing in my house but a little oil, to anoint me."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cui ait: Vade, pete mutuo ab omnibus vicinis tuis vasa vacua non pauca:"
      en: "And he said to her: Go, borrow of all thy neighbours empty vessels not a few."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ingredere, et claude ostium tuum, cum intrinsecus fueris tu, et filii tui: et mitte inde in omnia vasa haec: et cum plena fuerint, tolles."
      en: "And go in, and shut thy door, when thou art within, and thy sons: and pour out thereof into all those vessels: and when they are full take them away."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ivit itaque mulier, et clausit ostium super se, et super filios suos: illi offerebant vasa, et illa infundebat."
      en: "So the woman went, and shut the door upon her, and upon her sons: they brought her the vessels, and she poured in."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Cumque plena fuissent vasa, dixit ad filium suum: Affer mihi adhuc vas. Et ille respondit: Non habeo. Stetitque oleum."
      en: "And when the vessels were full, she said to her son: Bring me yet a vessel. And he answered: I have no more. And the oil stood."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Venit autem illa, et indicavit homini Dei. Et ille: Vade, inquit, vende oleum, et redde creditori tuo: tu autem, et filii tui vivite de reliquo."
      en: "And she came, and told the man of God. And he said: Go, sell the oil, and pay thy creditor: and thou and thy sons live of the rest."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Facta est autem quaedam dies, et transibat Eliseus per Sunam: erat autem ibi mulier magna, quae tenuit eum ut comederet panem: cumque frequenter inde transiret, divertebat ad eam ut comederet panem."
      en: "And there was a day when Eliseus passed by Sunam: now there was a great woman there, who detained him to eat bread; and as he passed often that way, he turned into her house to eat bread."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quae dixit ad virum suum: Animadverto quod vir Dei sanctus est iste, qui transit per nos frequenter."
      en: "And she said to her husband: I perceive that this is a holy man of God, who often passeth by us."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Faciamus ergo ei coenaculum parvum, et ponamus ei in eo lectulum, et mensam, et sellam, et candelabrum, ut cum venerit ad nos, maneat ibi."
      en: "Let us therefore make him a little chamber, and put a little bed in it for him, and a table, and a stool, and a candlestick, that when he cometh to us, he may abide there."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Facta est ergo dies quaedam, et veniens divertit in coenaculum, et requievit ibi."
      en: "Now there was a certain day when he came and turned in to the chamber, and rested there."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dixitque ad Giezi puerum suum: Voca Sunamitidem istam. Qui cum vocasset eam, et illa stetisset coram eo,"
      en: "And he said to Giezi his servant Call this Sunamitess. And when he had called her, and she stood before him,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixit ad puerum suum: Loquere ad eam: Ecce, sedule in omnibus ministrasti nobis, quid vis ut faciam tibi? Numquid habes negotium, et vis ut loquar regi, sive principi militiae? Quae respondit: In medio populi mei habito."
      en: "He said to his servant: Say to her Behold thou hast diligently served us in all things, what wilt thou have me to do for thee? hast thou any business, and wilt thou that I speak to the king, or to the general of the army? And she answered: I dwell in the midst of my own people."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et ait: Quid ergo vult ut faciam ei? Dixitque Giezi: Ne quaeras: filium enim non habet, et vir ejus senex est."
      en: "And he said: What will she then that I do for her? And Giezi said: Do not ask, for she hath no son, and her husband is old."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Praecepit itaque ut vocaret eam: quae cum vocata fuisset, et stetisset ante ostium,"
      en: "Then he bid him call her: And when she was called, and stood before the door."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixit ad eam: In tempore isto, et in hac eadem hora, si vita comes fuerit, habebis in utero filium. At illa respondit: Noli quaeso, domine mi, vir Dei, noli mentiri ancillae tuae."
      en: "He said to her: At this time, and this same hour, if life accompany, thou shalt have a son in thy womb. But she answered: Do not, I beseech thee, my lord, thou man of God, do not lie to thy handmaid."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et concepit mulier, et peperit filium in tempore, et in hora eadem, qua dixerat Eliseus."
      en: "And the woman conceived, and brought forth a son in the time, and at the same hour, that Eliseus had said."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Crevit autem puer. Et cum esset quaedam dies, et egressus isset ad patrem suum, ad messores,"
      en: "And the child grew. And on a certain day, when he went out to his father to the reapers,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ait patri suo: Caput meum doleo, caput meum doleo. At ille dixit puero: Tolle, et duc eum ad matrem suam."
      en: "He said to his father: My head acheth, my head acheth. But he said to his servant: Take him, and carry him to his mother."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Qui cum tulisset, et duxisset eum ad matrem suam, posuit eum illa super genua sua usque ad meridiem, et mortuus est."
      en: "And when he had taken him, and brought him to his mother, she set him on her knees until noon, and then he died."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Ascendit autem, et collocavit eum super lectulum hominis Dei, et clausit ostium: et egressa,"
      en: "And she went up and laid him upon the bed of the man of God, and shut the door: and going out,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "vocavit virum suum, et ait: Mitte mecum, obsecro, unum de pueris, et asinam, ut excurram usque ad hominem Dei, et revertar."
      en: "She called her husband, and said: Send with me, I beseech thee, one of thy servants, and an ass that I may run to the man of God, and come again."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Qui ait illi: Quam ob causam vadis ad eum? hodie non sunt calendae, neque sabbatum. Quae respondit: Vadam."
      en: "And he said to her: Why dost thou go to him? today is neither new moon nor sabbath. She answered: I will go."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Stravitque asinam, et praecepit puero: Mina, et propera, ne mihi moram facias in eundo: et hoc age quod praecipio tibi."
      en: "And she saddled an ass, and commanded her servant: Drive, and make haste, make no stay in going. And do that which I bid thee."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Profecta est igitur, et venit ad virum Dei in montem Carmeli: cumque vidisset eam vir Dei econtra, ait ad Giezi puerum suum: Ecce Sunamitis illa."
      en: "So she went forward, and came to the man of God to mount Carmel: and when the man of God saw her coming towards, he said to Giezi his servant: Behold that Sunamitess."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Vade ergo in occursum ejus, et dic ei: Recte ne agitur circa te, et circa virum tuum, et circa filium tuum? Quae respondit: Recte."
      en: "Go therefore to meet her, and say to her: Is all well with thee, and with thy husband, and with thy son? and she answered: Well."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Cumque venisset ad virum Dei in montem, apprehendit pedes ejus: et accessit Giezi ut amoveret eam. Et ait homo Dei: Dimitte illam: anima enim ejus in amaritudine est, et Dominus celavit a me, et non indicavit mihi."
      en: "And when she came to the man of God to the mount, she caught hold on his feet: and Giezi came to remove her. And the man of God said: Let her alone for her soul is in anguish, and the Lord hath hid it from me, and hath not told me."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Quae dixit illi: Numquid petivi filium a domino meo? numquid non dixi tibi: Ne illudas me?"
      en: "And she said to him: Did I ask a son of my lord? did I not say to thee: Do not deceive me?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et ille ait ad Giezi: Accinge lumbos tuos, et tolle baculum meum in manu tua, et vade. Si occurrerit tibi homo, non salutes eum: et si salutaverit te quispiam, non respondeas illi: et pones baculum meum super faciem pueri."
      en: "Then he said to Giezi: Gird up thy loins, and take my staff in thy hand, and go. If any man meet thee, salute him not: and if any man salute thee, answer him not: and lay my staff upon the face of the child."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Porro mater pueri ait: Vivit Dominus, et vivit anima tua, non dimittam te. Surrexit ergo, et secutus est eam."
      en: "But the mother of the child said: As the Lord liveth, and as thy soul liveth, I will not leave thee. He arose, therefore, and followed her."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Giezi autem praecesserat ante eos, et posuerat baculum super faciem pueri, et non erat vox, neque sensus: reversusque est in occursum ejus, et nuntiavit ei, dicens: Non surrexit puer."
      en: "But Giezi was gone before them, and laid the staff upon the face of the child, and there was no voice nor sense: and he returned to meet him, and told him, saying: The child is not risen."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Ingressus est ergo Eliseus domum, et ecce puer mortuus jacebat in lectulo ejus:"
      en: "Eliseus therefore went into the house, and behold the child lay dead on his bed."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "ingressusque clausit ostium super se, et super puerum, et oravit ad Dominum."
      en: "And going in he shut the door upon him, and upon the child, and prayed to the Lord."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et ascendit, et incubuit super puerum: posuitque os suum super os ejus, et oculos suos super oculos ejus, et manus suas super manus ejus: et incurvavit se super eum, et calefacta est caro pueri."
      en: "And he went up, and lay upon the child: and he put his mouth upon his mouth, and his eyes upon his eyes, and his hands upon his hands: and he bowed himself upon him, and the child's flesh grew warm."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "At ille reversus, deambulavit in domo, semel huc atque illuc: et ascendit, et incubuit super eum: et oscitavit puer septies, aperuitque oculos."
      en: "Then he returned and walked in the house, once to and fro: and he went up, and lay upon him: and the child gaped seven times, and opened his eyes."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "At ille vocavit Giezi, et dixit ei: Voca Sunamitidem hanc. Quae vocata, ingressa est ad eum. Qui ait: Tolle filium tuum."
      en: "And he called Giezi, and said to him: Call this Sunamitess. And she being called, went in to him: and he said: Take up thy son."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Venit illa, et corruit ad pedes ejus, et adoravit super terram: tulitque filium suum, et egressa est."
      en: "She came and fell at his feet, and worshipped upon the ground: and took up her son, and went out."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et Eliseus reversus est in Galgala. Erat autem fames in terra, et filii prophetarum habitabant coram eo. Dixitque uni de pueris suis: Pone ollam grandem, et coque pulmentum filiis prophetarum."
      en: "And Eliseus returned to Galgal, and there was a famine in the land, and the sons of the prophets dwelt before him. And he said to one of his servants: Set on the great pot, and boil pottage for the sons of the prophets."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et egressus est unus in agrum ut colligeret herbas agrestes: invenitque quasi vitem silvestrem, et collegit ex ea colocynthidas agri, et implevit pallium suum, et reversus concidit in ollam pulmenti: nesciebat enim quid esset."
      en: "And one went out into the field to gather wild herbs: and he found something like a wild vine, and gathered of it wild gourds of the field, and filled his mantle, and coming back he shred them into the pot of pottage, for he knew not what it was."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Infuderunt ergo sociis, ut comederent: cumque gustassent de coctione, clamaverunt, dicentes: Mors in olla, vir Dei. Et non potuerunt comedere."
      en: "And they poured it out for their companions to eat: and when they had tasted of the pottage, they cried out, saying: Death is in the pot, O man of God. And they could not eat thereof."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "At ille: Afferte, inquit, farinam. Cumque tulissent, misit in ollam, et ait: Infunde turbae, ut comedant. Et non fuit amplius quidquam amaritudinis in olla."
      en: "But he said: Bring some meal. And when they had brought it, he cast it into the pot, and said: Pour out for the people, that they may eat. And there was now no bitterness in the pot."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Vir autem quidam venit de Baalsalisa deferens viro Dei panes primitiarum, viginti panes hordeaceos, et frumentum novum in pera sua. At ille dixit: Da populo, ut comedat."
      en: "And a certain man came from Baalsalisa bringing to the man of God bread of the firstfruits, twenty loaves of barley, and new corn in his scrip. And he said: Give to the people, that they may eat."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Responditque ei minister ejus: Quantum est hoc, ut apponam centum viris? Rursum ille ait: Da populo, ut comedat: haec enim dicit Dominus: Comedent, et supererit."
      en: "And his servant answered him: How much is this, that I should set it before a hundred men? He said again: Give to the people, that they may eat: for thus saith the Lord: They shall eat, and there shall be left."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Posuit itaque coram eis: qui comederunt, et superfuit juxta verbum Domini."
      en: "So he set it before them: and they ate, and there was left according to the word of the Lord."
    status: { la: verified, en: verified }
