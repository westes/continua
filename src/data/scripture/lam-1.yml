# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: lam
chapter: 1
verses:
  - n: 1
    text:
      la: "ALEPH. Quomodo sedet sola civitas plena populo! Facta est quasi vidua domina gentium; princeps provinciarum facta est sub tributo."
      en: "Aleph. How doth the city sit solitary that was full of people! how is the mistress of the Gentiles become as a widow: the princes of provinces made tributary!"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "BETH. Plorans ploravit in nocte, et lacrimae ejus in maxillis ejus: non est qui consoletur eam, et omnibus caris ejus; omnes amici ejus spreverunt eam, et facti sunt ei inimici."
      en: "Beth. Weeping she hath wept in the night, and her tears are on her cheeks: there is none to comfort her among all them that were dear to her: all her friends have despised her, and are become her enemies."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "GHIMEL. Migravit Judas propter afflictionem, et multitudinem servitutis; habitavit inter gentes, nec invenit requiem: omnes persecutores ejus apprehenderunt eam inter angustias."
      en: "Ghimel. Juda hath removed her dwelling place because of her affliction, and the greatness of her bondage: she hath dwelt among the nations, and she hath found no rest: all her persecutors have taken her in the midst of straits."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "DALETH. Viae Sion lugent, eo quod non sint qui veniant ad solemnitatem: omnes portae ejus destructae, sacerdotes ejus gementes; virgines ejus squalidae, et ipsa oppressa amaritudine."
      en: "Daleth. The ways of Sion mourn, because there are none that come to the solemn feast: all her gates are broken down: her priests sigh: her virgins are in affliction, and she is oppressed with bitterness."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "HE. Facti sunt hostes ejus in capite; inimici ejus locupletati sunt: quia Dominus locutus est super eam propter multitudinem iniquitatum ejus. Parvuli ejus ducti sunt in captivitatem ante faciem tribulantis."
      en: "He. Her adversaries are become her lords, her enemies are enriched: because the Lord hath spoken against her for the multitude of her iniquities: her children are led into captivity: before the face of the oppressor."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "VAU. Et egressus est a filia Sion omnis decor ejus; facti sunt principes ejus velut arietes non invenientes pascua, et abierunt absque fortitudine ante faciem subsequentis."
      en: "Vau. And from the daughter of Sion all her beauty is departed: her princes are become like rams that find no pastures: and they are gone away without strength before the face of the pursuer."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ZAIN. Recordata est Jerusalem dierum afflictionis suae, et praevaricationis, omnium desiderabilium suorum, quae habuerat a diebus antiquis, cum caderet populus ejus in manu hostili, et non esset auxiliator: viderunt eam hostes, et deriserunt sabbata ejus."
      en: "Zain. Jerusalem hath remembered the days of her affliction, and prevarication of all her desirable things which she had from the days of old, when her people fell in the enemy's hand, and there was no helper: the enemies have seen her, and have mocked at her sabbaths."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "HETH. Peccatum peccavit Jerusalem, propterea instabilis facta est; omnes qui glorificabant eam spreverunt illam, quia viderunt ignominiam ejus: ipsa autem gemens conversa est retrorsum."
      en: "Heth. Jerusalem hath grievously sinned, therefore is she become unstable: all that honoured her have despised her, because they have seen her shame: but she sighed and turned backward."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "TETH. Sordes ejus in pedibus ejus, nec recordata est finis sui; deposita est vehementer, non habens consolatorem. Vide, Domine, afflictionem meam, quoniam erectus est inimicus."
      en: "Teth. Her filthiness is on her feet, and she hath not remembered her end: she is wonderfully cast down, not having a comforter: behold, O Lord, my affliction, because the enemy is lifted up."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "JOD. Manum suam misit hostis ad omnia desiderabilia ejus, quia vidit gentes ingressas sanctuarium suum, de quibus praeceperas ne intrarent in ecclesiam tuam."
      en: "Jod. The enemy hath put out his hand to all her desirable things: for she hath seen the Gentiles enter into her sanctuary, of whom thou gavest commandment that they should not enter into thy church."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "CAPH. Omnis populus ejus gemens, et quaerens panem; dederunt pretiosa quaeque pro cibo ad refocillandam animam. Vide, Domine, et considera quoniam facta sum vilis!"
      en: "Caph. All her people sigh, they seek bread: they have given all their precious things for food to relieve the soul: see, O Lord, and consider, for I am become vile."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "LAMED. O vos omnes qui transitis per viam, attendite, et videte si est dolor sicut dolor meus! quoniam vindemiavit me, ut locutus est Dominus, in die irae furoris sui."
      en: "Lamed. O all ye that pass by the way, attend, and see if there be any sorrow like to my sorrow: for he hath made a vintage of me, as the Lord spoke in the day of his fierce anger."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "MEM. De excelso misit ignem in ossibus meis, et erudivit me: expandit rete pedibus meis, convertit me retrorsum; posuit me desolatam, tota die moerore confectam."
      en: "Mem. From above he hath sent fire into my bones, and hath chastised me: he hath spread a net for my feet, he hath turned me back: he hath made me desolate, wasted with sorrow all the day long."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "NUN. Vigilavit jugum iniquitatum mearum; in manu ejus convolutae sunt, et impositae collo meo. Infirmata est virtus mea: dedit me Dominus in manu de qua non potero surgere."
      en: "Nun. The yoke of my iniquities hath watched: they are folded together in his hand, and put upon my neck: my strength is weakened: the Lord hath delivered me into a hand out of which I am not able to rise."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "SAMECH. Abstulit omnes magnificos meos Dominus de medio mei; vocavit adversum me tempus ut contereret electos meos. Torcular calcavit Dominus virgini filiae Juda."
      en: "Samech. The Lord hath taken away all my mighty men out of the midst of me: he hath called against me the time, to destroy my chosen men: the Lord hath trodden the winepress for the virgin daughter of Juda."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "AIN. Idcirco ego plorans, et oculus meus deducens aquas, quia longe factus est a me consolator, convertens animam meam. Facti sunt filii mei perditi, quoniam invaluit inimicus."
      en: "Ain. Therefore do I weep, and my eyes run down with water: because the comforter, the relief of my soul, is far from me: my children are desolate because the enemy hath prevailed."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "PHE. Expandit Sion manus suas; non est qui consoletur eam. Mandavit Dominus adversum Jacob in circuitu ejus hostes ejus; facta est Jerusalem quasi polluta menstruis inter eos."
      en: "Phe. Sion hath spread forth her hands, there is none to comfort her: the Lord hath commanded against Jacob, his enemies are round about him: Jerusalem is as a menstruous woman among them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "SADE. Justus est Dominus, quia os ejus ad iracundiam provocavi. Audite, obsecro, universi populi, et videte dolorem meum: virgines meae et juvenes mei abierunt in captivitatem."
      en: "Sade. The Lord is just, for I have provoked his mouth to wrath: hear, I pray you, all ye people, and see my sorrow: my virgins, and my young men are gone into captivity."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "COPH. Vocavi amicos meos, et ipsi deceperunt me; sacerdotes mei et senes mei in urbe consumpti sunt, quia quaesierunt cibum sibi ut refocillarent animam suam."
      en: "Coph. I called for my friends, but they deceived me: my priests and my ancients pined away in the city: while they sought their food, to relieve their souls."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "RES. Vide, Domine, quoniam tribulor: conturbatus est venter meus, subversum est cor meum in memetipsa, quoniam amaritudine plena sum. Foris interfecit gladius, et domi mors similis est."
      en: "Res. Behold, O Lord, for I am in distress, my bowels are troubled: my heart is turned within me, for I am full of bitterness: abroad the sword destroyeth, and at home there is death alike."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "SIN. Audierunt quia ingemisco ego, et non est qui consoletur me; omnes inimici mei audierunt malum meum, laetati sunt quoniam tu fecisti: adduxisti diem consolationis, et fient similes mei."
      en: "Sin. They have heard that I sigh, and there is none to comfort me: all my enemies have heard of my evil, they have rejoiced that thou hast done it: thou hast brought a day of consolation, and they shall be like unto me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "THAU. Ingrediatur omne malum eorum coram te: et vindemia eos, sicut vindemiasti me propter omnes iniquitates meas: multi enim gemitus mei, et cor meum moerens."
      en: "Thau. Let all their evil be present before thee: and make vintage of them, as thou hast made vintage of me for all my iniquities: for my sighs are many, and my heart is sorrowful."
    status: { la: verified, en: verified }
