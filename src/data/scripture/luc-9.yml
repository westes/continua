# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: luc
chapter: 9
verses:
  - n: 1
    text:
      la: "Convocatis autem duodecim Apostolis, dedit illis virtutem et potestatem super omnia daemonia, et ut languores curarent."
      en: "Then calling together the twelve apostles, he gave them power and authority over all devils, and to cure diseases."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et misit illos praedicare regnum Dei, et sanare infirmos."
      en: "And he sent them to preach the kingdom of God, and to heal the sick."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et ait ad illos: Nihil tuleritis in via, neque virgam, neque peram, neque panem, neque pecuniam, neque duas tunicas habeatis."
      en: "And he said to them: Take nothing for your journey; neither staff, nor scrip, nor bread, nor money; neither have two coats."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et in quamcumque domum intraveritis, ibi manete, et inde ne exeatis."
      en: "And whatsoever house you shall enter into, abide there, and depart not from thence."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et quicumque non receperint vos: exeuntes de civitate illa, etiam pulverem pedum vestrorum excutite in testimonium supra illos."
      en: "And whosoever will not receive you, when ye go out of that city, shake off even the dust of your feet, for a testimony against them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Egressi autem circuibant per castella evangelizantes, et curantes ubique."
      en: "And going out, they went about through the towns, preaching the gospel, and healing everywhere."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Audivit autem Herodes tetrarcha omnia quae fiebant ab eo, et haesitabat eo quod diceretur"
      en: "Now Herod, the tetrarch, heard of all things that were done by him; and he was in a doubt, because it was said"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "a quibusdam: Quia Joannes surrexit a mortuis: a quibusdam vero: Quia Elias apparuit: ab aliis autem: Quia propheta unus de antiquis surrexit."
      en: "By some, that John was risen from the dead: but by other some, that Elias had appeared; and by others, that one of the old prophets was risen again."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ait Herodes: Joannem ego decollavit: quis est autem iste, de quo ego talia audio? Et quaerebat videre eum."
      en: "And Herod said: John I have beheaded; but who is this of whom I hear such things? And he sought to see him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et reversi Apostoli, narraverunt illi quaecumque fecerunt: et assumptis illis secessit seorsum in locum desertum, qui est Bethsaidae."
      en: "And the apostles, when they were returned, told him all they had done. And taking them, he went aside into a desert place, apart, which belongeth to Bethsaida."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quod cum cognovissent turbae, secutae sunt illum: et excepit eos, et loquebatur illis de regno Dei, et eos, qui cura indigebant, sanabat."
      en: "Which when the people knew, they followed him; and he received them, and spoke to them of the kingdom of God, and healed them who had need of healing."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dies autem coeperat declinare, et accedentes duodecim dixerunt illi: Dimitte turbas, ut euntes in castella villasque quae circa sunt, divertant, et inveniant escas: quia hic in loco deserto sumus."
      en: "Now the day began to decline. And the twelve came and said to him: Send away the multitude, that going into the towns and villages round about, they may lodge and get victuals; for we are here in a desert place."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ait autem ad illos: Vos date illis manducare. At illi dixerunt: Non sunt nobis plus quam quinque panes et duo pisces: nisi forte nos eamus, et emamus in omnem hanc turbam escas."
      en: "But he said to them: Give you them to eat. And they said: We have no more than five loaves and two fishes; unless perhaps we should go and buy food for all this multitude."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Erant autem fere viri quinque millia. Ait autem ad discipulos suos: Facite illos discumbere per convivia quinquagenos."
      en: "Now there were about five thousand men. And he said to his disciples: Make them sit down by fifties in a company."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et ita fecerunt: et discumbere fecerunt omnes."
      en: "And they did so; and made them all sit down."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Acceptis autem quinque panibus et duobus piscibus, respexit in caelum, et benedixit illis: et fregit, et distribuit discipulis suis, ut ponerent ante turbas."
      en: "And taking the five loaves and the two fishes, he looked up to heaven, and blessed them; and he broke, and distributed to his disciples, to set before the multitude."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et manducaverunt omnes, et saturati sunt. Et sublatum est quod superfuit illis, fragmentorum cophini duodecim."
      en: "And they did all eat, and were filled. And there were taken up of fragments that remained to them, twelve baskets."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et factum est cum solus esset orans, erant cum illo et discipuli: et interrogavit illos, dicens: Quem me dicunt esse turbae?"
      en: "And it came to pass, as he was alone praying, his disciples also were with him: and he asked them, saying: Whom do the people say that I am?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "At illi responderunt, et dixerunt: Joannem Baptistam, alii autem Eliam, alii vero unus propheta de prioribus surrexit."
      en: "But they answered, and said: John the Baptist; but some say Elias; and others say that one of the former prophets is risen again."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dixit autem illis: Vos autem quem me esse dicitis? Respondens Simon Petrus, dixit: Christum Dei."
      en: "And he said to them: But whom do you say that I am? Simon Peter answering, said: The Christ of God."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "At ille increpans illos, praecepit ne cui dicerent hoc,"
      en: "But he strictly charging them, commanded they should tell this to no man."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "dicens: Quia oportet Filium hominis multa pati, et reprobari a senioribus, et principibus sacerdotum, et scribis, et occidi, et tertia die resurgere."
      en: "Saying: The Son of man must suffer many things, and be rejected by the ancients and chief priests and scribes, and be killed, and the third day rise again."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Dicebat autem ad omnes: Si quis vult post me venire, abneget semetipsum, et tollat crucem suam quotidie, et sequatur me."
      en: "And he said to all: If any man will come after me, let him deny himself, and take up his cross daily, and follow me."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Qui enim voluerit animam suam salvam facere, perdet illam: nam qui perdiderit animam suam propter me, salvam faciet illam."
      en: "For whosoever will save his life, shall lose it; for he that shall lose his life for my sake, shall save it."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Quid enim proficit homo, si lucretur universum mundum, se autem ipsum perdat, et detrimentum sui faciat?"
      en: "For what is a man advantaged, if he gain the whole world, and lose himself, and cast away himself?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Nam qui me erubuerit, et meos sermones: hunc Filius hominis erubescet cum venerit in majestate sua, et Patris, et sanctorum angelorum."
      en: "For he that shall be ashamed of me and of my words, of him the Son of man shall be ashamed, when he shall come in his majesty, and that of his Father, and of the holy angels."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Dico autem vobis vere: sunt aliqui hic stantes, qui non gustabunt mortem donec videant regnum Dei."
      en: "But I tell you of a truth: There are some standing here that shall not taste death, till they see the kingdom of God."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Factum est autem post haec verba fere dies octo, et assumpsit Petrum, et Jacobum, et Joannem, et ascendit in montem ut oraret."
      en: "And it came to pass about eight days after these words, that he took Peter, and James, and John, and went up into a mountain to pray."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et facta est, dum oraret, species vultus ejus altera: et vestitus ejus albus et refulgens."
      en: "And whilst he prayed, the shape of his countenance was altered, and his raiment became white and glittering."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et ecce duo viri loquebantur cum illo. Erant autem Moyses et Elias,"
      en: "And behold two men were talking with him. And they were Moses and Elias,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "visi in majestate: et dicebant excessum ejus, quem completurus erat in Jerusalem."
      en: "Appearing in majesty. And they spoke of his decease that he should accomplish in Jerusalem."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Petrus vero, et qui cum illo erant, gravati erant somno. Et evigilantes viderunt majestatem ejus, et duos viros qui stabant cum illo."
      en: "But Peter and they that were with him were heavy with sleep. And waking, they saw his glory, and the two men that stood with him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et factum est cum discederent ab illo, ait Petrus ad Jesum: Praeceptor, bonum est nos hic esse: et faciamus tria tabernacula, unum tibi, et unum Moysi, et unum Eliae: nesciens quid diceret."
      en: "And it came to pass, that as they were departing from him, Peter saith to Jesus: Master, it is good for us to be here; and let us make three tabernacles, one for thee, and one for Moses, and one for Elias; not knowing what he said."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Haec autem illo loquente, facta est nubes, et obumbravit eos: et timuerunt, intrantibus illis in nubem."
      en: "And as he spoke these things, there came a cloud, and overshadowed them; and they were afraid, when they entered into the cloud."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et vox facta est de nube, dicens: Hic est Filius meus dilectus, ipsum audite."
      en: "And a voice came out of the cloud, saying: This is my beloved Son; hear him."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et dum fieret vox, inventus est Jesus solus. Et ipsi tacuerunt, et nemini dixerunt in illis diebus quidquam ex his quae viderant."
      en: "And whilst the voice was uttered, Jesus was found alone. And they held their peace, and told no man in those days any of these things which they had seen."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Factum est autem in sequenti die, descendentibus illis de monte, occurrit illis turba multa."
      en: "And it came to pass the day following, when they came down from the mountain, there met him a great multitude."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et ecce vir de turba exclamavit, dicens: Magister, obsecro te, respice in filium meum quia unicus est mihi:"
      en: "And behold a man among the crowd cried out, saying: Master, I beseech thee, look upon my son, because he is my only one."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et ecce spiritus apprehendit eum, et subito clamat, et elidit, et dissipat eum cum spuma, et vix discedit dilanians eum:"
      en: "And lo, a spirit seizeth him, and he suddenly crieth out, and he throweth him down and teareth him, so that he foameth; and bruising him, he hardly departeth from him."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et rogavi discipulos tuos ut ejicerent illum, et non potuerunt."
      en: "And I desired thy disciples to cast him out, and they could not."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Respondens autem Jesus, dixit: O generatio infidelis, et perversa, usquequo ero apud vos, et patiar vos? adduc huc filium tuum."
      en: "And Jesus answering, said: O faithless and perverse generation, how long shall I be with you, and suffer you? Bring hither thy son."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et cum accederet, elisit illum daemonium, et dissipavit."
      en: "And as he was coming to him, the devil threw him down, and tore him."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Et increpavit Jesus spiritum immundum, et sanavit puerum, et reddidit illum patri ejus."
      en: "And Jesus rebuked the unclean spirit, and cured the boy, and restored him to his father."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Stupebant autem omnes in magnitudine Dei: omnibusque mirantibus in omnibus quae faciebat, dixit ad discipulos suos: Ponite vos in cordibus vestris sermones istos: Filius enim hominis futurum est ut tradatur in manus hominum."
      en: "And all were astonished at the mighty power of God. But while all wondered at all the things he did, he said to his disciples: Lay you up in your hearts these words, for it shall come to pass, that the Son of man shall be delivered into the hands of men."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "At illi ignorabant verbum istud, et erat velatum ante eos ut non sentirent illud: et timebant eum interrogare de hoc verbo."
      en: "But they understood not this word; and it was hid from them, so that they perceived it not. And they were afraid to ask him concerning this word."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Intravit autem cogitatio in eos quis eorum major esset."
      en: "And there entered a thought into them, which of them should be greater."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "At Jesus videns cogitationes cordis illorum, apprehendit puerum, et statuit illum secus se,"
      en: "But Jesus seeing the thoughts of their heart, took a child and set him by him,"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et ait illis: Quicumque susceperit puerum istum in nomine meo, me recipit: et quicumque me receperit, recipit eum qui me misit. Nam qui minor est inter vos omnes, hic major est."
      en: "And said to them: Whosoever shall receive this child in my name, receiveth me; and whosoever shall receive me, receiveth him that sent me. For he that is the lesser among you all, he is the greater."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Respondens autem Joannes dixit: Praeceptor, vidimus quemdam in nomine tuo ejicientem daemonia, et prohibuimus eum: quia non sequitur nobiscum."
      en: "And John, answering, said: Master, we saw a certain man casting out devils in thy name, and we forbade him, because he followeth not with us."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Et ait ad illum Jesus: Nolite prohibere: qui enim non est adversum vos, pro vobis est."
      en: "And Jesus said to him: Forbid him not; for he that is not against you, is for you."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Factum est autem dum complerentur dies assumptionis ejus, et ipse faciem suam firmavit ut iret in Jerusalem."
      en: "And it came to pass, when the days of his assumption were accomplishing, that he steadfastly set his face to go to Jerusalem."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Et misit nuntios ante conspectum suum: et euntes intraverunt in civitatem Samaritanorum ut parerent illi."
      en: "And he sent messengers before his face; and going, they entered into a city of the Samaritans, to prepare for him."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Et non receperunt eum, quia facies ejus erat euntis in Jerusalem."
      en: "And they received him not, because his face was of one going to Jerusalem."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Cum vidissent autem discipuli ejus Jacobus et Joannes, dixerunt: Domine, vis dicimus ut ignis descendat de caelo, et consumat illos?"
      en: "And when his disciples James and John had seen this, they said: Lord, wilt thou that we command fire to come down from heaven, and consume them?"
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Et conversus increpavit illos, dicens: Nescitis cujus spiritus estis."
      en: "And turning, he rebuked them, saying: You know not of what spirit you are."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Filius hominis non venit animas perdere, sed salvare. Et abierunt in aliud castellum."
      en: "The Son of man came not to destroy souls, but to save. And they went into another town."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Factum est autem: ambulantibus illis in via, dixit quidam ad illum: Sequar te quocumque ieris."
      en: "And it came to pass, as they walked in the way, that a certain man said to him: I will follow thee whithersoever thou goest."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Dixit illi Jesus: Vulpes foveas habent, et volucres caeli nidos: Filius autem hominis non habet ubi caput reclinet."
      en: "Jesus said to him: The foxes have holes, and the birds of the air nests; but the Son of man hath not where to lay his head."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Ait autem ad alterum: Sequere me: ille autem dixit: Domine, permitte mihi primum ire, et sepelire patrem meum."
      en: "But he said to another: Follow me. And he said: Lord, suffer me first to go, and to bury my father."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "Dixitque ei Jesus: Sine ut mortui sepeliant mortuos suos: tu autem vade, et annuntia regnum Dei."
      en: "And Jesus said to him: Let the dead bury their dead: but go thou, and preach the kingdom of God."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "Et ait alter: Sequar te Domine, sed permitte mihi primum renuntiare his quae domi sunt."
      en: "And another said: I will follow thee, Lord; but let me first take my leave of them that are at my house."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "Ait ad illum Jesus: Nemo mittens manum suam ad aratrum, et respiciens retro, aptus est regno Dei."
      en: "Jesus said to him: No man putting his hand to the plough, and looking back, is fit for the kingdom of God."
    status: { la: verified, en: verified }
