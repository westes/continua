# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 28
verses:
  - n: 1
    text:
      la: "Et factus est sermo Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fili hominis, dic principi Tyri: Haec dicit Dominus Deus: Eo quod elevatum est cor tuum, et dixisti: Deus ego sum, et in cathedra Dei sedi in corde maris, cum sis homo, et non Deus: et dedisti cor tuum quasi cor Dei:"
      en: "Son of man, say to the prince of Tyre: Thus saith the Lord God: Because thy heart is lifted up, and thou hast said: I am God, and I sit in the chair of God in the heart of the sea: whereas thou art a man, and not God: and hast set thy heart as if it were the heart of God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ecce sapientior es tu Daniele, omne secretum non est absconditum a te:"
      en: "Behold thou art wiser than Daniel: no secret is hid from thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "in sapientia et prudentia tua fecisti tibi fortitudinem, et acquisisti aurum et argentum in thesauris tuis:"
      en: "In thy wisdom and thy understanding thou hast made thyself strong: and hast gotten gold and silver into thy treasures."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "in multitudine sapientiae tuae, et in negotiatione tua multiplicasti tibi fortitudinem, et elevatum est cor tuum in robore tuo."
      en: "By the greatness of thy wisdom, and by thy traffic thou hast increased thy strength: and thy heart is lifted up with thy strength."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Propterea haec dicit Dominus Deus: Eo quod elevatum est cor tuum quasi cor Dei,"
      en: "Therefore, thus saith the Lord God: Because thy heart is lifted up as the heart of God:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "idcirco ecce ego adducam super te alienos robustissimos gentium, et nudabunt gladios suos super pulchritudinem sapientiae tuae, et polluent decorem tuum."
      en: "Therefore behold, I will bring upon thee strangers the strongest of the nations: and they shall draw their swords against the beauty of thy wisdom, and they shall defile thy beauty."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Interficient, et detrahent te: et morieris in interitu occisorum in corde maris."
      en: "They shall kill thee, and bring thee down: and thou shalt die the death of them that are slain in the heart of the sea."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Numquid dicens loqueris: Deus ego sum, coram interficientibus te, cum sis homo, et non Deus, in manu occidentium te?"
      en: "Wilt thou yet say before them that slay thee: I am God; whereas thou art a man, and not God, in the hand of them that slay thee?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "morte incircumcisorum morieris in manu alienorum, quia ego locutus sum, ait Dominus Deus."
      en: "Thou shalt die the death of the uncircumcised by the hand of strangers: for I have spoken it, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et factus est sermo Domini ad me, dicens: Fili hominis, leva planctum super regem Tyri,"
      en: "And the word of the Lord came to me, saying: Son of man, take up a lamentation upon the king of Tyre:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et dices ei: Haec dicit Dominus Deus: Tu signaculum similitudinis, plenus sapientia, et perfectus decore:"
      en: "And say to him: Thus saith the Lord God: Thou wast the seal of resemblance, full of wisdom, and perfect in beauty."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "in deliciis paradisi Dei fuisti: omnis lapis pretiosus operimentum tuum: sardius, topazius, et jaspis, chrysolithus, et onyx, et beryllus, sapphirus, et carbunculus, et smaragdus, aurum, opus decoris tui: et foramina tua, in die qua conditus es, praeparata sunt."
      en: "Thou wast in the pleasures of the paradise of God: every precious stone was thy covering: the sardius, the topaz, and the jasper, the chrysolite, and the onyx, and the beryl, the sapphire, and the carbuncle, and the emerald: gold the work of thy beauty: and thy pipes were prepared in the day that thou wast created."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tu cherub extentus, et protegens: et posui te in monte sancto Dei, in medio lapidum ignitorum ambulasti."
      en: "Thou a cherub stretched out, and protecting, and I set thee in the holy mountain of God, thou hast walked in the midst of the stones of fire."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Perfectus in viis tuis a die conditionis tuae, donec inventa est iniquitas in te."
      en: "Thou wast perfect in thy ways from the day of thy creation, until iniquity was found in thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "In multitudine negotiationis tuae repleta sunt interiora tua iniquitate, et peccasti: et ejeci te de monte Dei, et perdidi te, o cherub protegens, de medio lapidum ignitorum."
      en: "By the multitude of thy merchandise, thy inner parts were filled with iniquity, and thou hast sinned: and I cast thee out from the mountain of God, and destroyed thee, O covering cherub, out of the midst of the stones of fire."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et elevatum est cor tuum in decore tuo: perdidisti sapientiam tuam in decore tuo: in terram projeci te; ante faciem regum dedi te ut cernerent te."
      en: "And thy heart was lifted up with thy beauty: thou hast lost thy wisdom in thy beauty, I have cast thee to the ground: I have set thee before the face of kings, that they might behold thee."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "In multitudine iniquitatum tuarum, et iniquitate negotiationis tuae, polluisti sanctificationem tuam: producam ergo ignem de medio tui, qui comedat te, et dabo te in cinerem super terram, in conspectu omnium videntium te."
      en: "Thou hast defiled thy sanctuaries by the multitude of thy iniquities, and by the iniquity of thy traffic: therefore I will bring forth a fire from the midst of thee, to devour thee, and I will make thee as ashes upon the earth in the sight of all that see thee."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Omnes qui viderint te in gentibus, obstupescent super te: nihili factus es, et non eris in perpetuum."
      en: "All that shall see thee among the nations, shall be astonished at thee: thou art brought to nothing, and thou shalt never be any more."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et factus est sermo Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Fili hominis, pone faciem tuam contra Sidonem, et prophetabis de ea."
      en: "Son of man, set thy face against Sidon: and thou shalt prophesy of it,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et dices: Haec dicit Dominus Deus: Ecce ego ad te, Sidon, et glorificabor in medio tui: et scient quia ego Dominus, cum fecero in ea judicia, et sanctificatus fuero in ea."
      en: "And shalt say: Thus saith the Lord God: Behold I come against thee, Sidon, and I will be glorified in the midst of thee: and they shall know that I am the Lord, when I shall execute judgments in her, and shall be sanctified in her."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et immittam ei pestilentiam, et sanguinem in plateis ejus: et corruent interfecti in medio ejus gladio per circuitum, et scient quia ego Dominus."
      en: "And I will send into her pestilence, and blood in her streets: and they shall fall being slain by the sword on all sides in the midst thereof: and they shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et non erit ultra domui Israel offendiculum amaritudinis, et spina dolorem inferens undique per circuitum eorum qui adversantur eis: et scient quia ego Dominus Deus."
      en: "And the house of Israel shall have no more a stumblingblock of bitterness, nor a thorn causing pain on every side round about them, of them that are against them: and they shall know that I am the Lord God."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Haec dicit Dominus Deus: Quando congregavero domum Israel de populis in quibus dispersi sunt, sanctificabor in eis coram gentibus: et habitabunt in terra sua, quam dedi servo meo Jacob:"
      en: "Thus saith the Lord God: When I shall have gathered together the house of Israel out of the people among whom they are scattered: I will be sanctified in them before the Gentiles: and they shall dwell in their own land, which I gave to my servant Jacob."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et habitabunt in ea securi: et aedificabunt domos, et plantabunt vineas, et habitabunt confidenter, cum fecero judicia in omnibus qui adversantur eis per circuitum: et scient quia ego Dominus Deus eorum."
      en: "And they shall dwell therein secure, and they shall build houses, and shall plant vineyards, and shall dwell with confidence, when I shall have executed judgments upon all that are their enemies round about: and they shall know that I am the Lord their God."
    status: { la: verified, en: verified }
