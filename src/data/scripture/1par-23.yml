# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1par
chapter: 23
verses:
  - n: 1
    text:
      la: "igitur David senex et plenus dierum regem constituit Salomonem filium suum super Israhel"
      en: "And David being old and full of days, made Solomon his son king over Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et congregavit omnes principes Israhel et sacerdotes atque Levitas"
      en: "And he gathered together all the princes of Israel, and the priests and Levites."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "numeratique sunt Levitae a triginta annis et supra et inventa sunt triginta octo milia virorum"
      en: "And the Levites were numbered from the age of thirty years, and upwards: and there were found of them thirty-eight thousand men."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ex his electi sunt et distributi in ministerium domus Domini viginti quattuor milia praepositorum autem et iudicum sex milia"
      en: "Of these twenty-four thousand were chosen, and distributed unto the ministry of the house of the Lord: and six thousand were the overseers and judges."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "porro quattuor milia ianitores et totidem psaltae canentes Domino in organis quae fecerat ad canendum"
      en: "Moreover four thousand were porters: and as many singers singing to the Lord with the instruments, which he had made to sing with."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et distribuit eos David per vices filiorum Levi Gersom videlicet et Caath et Merari"
      en: "And David distributed them into courses by the families of the sons of Levi, to wit, of Gerson, and of Caath, and of Merari."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Gersom Leedan et Semei"
      en: "The sons of Gerson were Leedan and Semei."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "filii Leedan princeps Ieihel et Zetham et Iohel tres"
      en: "The sons of Leedan: the chief Jahiel, and Zethan, and Joel, three."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "filii Semei Salomith et Ozihel et Aran tres isti principes familiarum Leedan"
      en: "The sons of Semei: Salomith, and Hosiel, and Aran, three: these were the heads of the families of Leedan."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "porro filii Semei Ieeth et Ziza et Iaus et Baria isti filii Semei quattuor"
      en: "And the sons of Semei were Leheth, and Ziza, and Jaus, and Baria: these were the sons of Semei, four."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "erat autem Ieeth prior Ziza secundus porro Iaus et Baria non habuerunt plurimos filios et idcirco in una familia unaque domo conputati sunt"
      en: "And Leheth was the first, Ziza the second: but Jaus and Baria had not many children, and therefore they were counted in one family, and in one house."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "filii Caath Amram et Isaar Hebron et Ozihel quattuor"
      en: "The sons of Caath were Amram, and Isaar, Hebron, and Oziel, four."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "filii Amram Aaron et Moses separatusque est Aaron ut ministraret in sancto sanctorum ipse et filii eius in sempiternum et adoleret incensum Domino secundum ritum suum ac benediceret nomini eius in perpetuum"
      en: "The sons of Amram, Aaron, and Moses. And Aaron was separated to minister in the holy of holies, he and his sons for ever, and to burn incense before the Lord, according to his ceremonies, and to bless his name for ever."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Mosi quoque hominis Dei filii adnumerati sunt in tribu Levi"
      en: "The sons also of Moses, the man of God, were numbered in the tribe of Levi."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "filii Mosi Gersom et Eliezer"
      en: "The sons of Moses were Gersom and Eliezer:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "filii Gersom Subuhel primus"
      en: "The sons of Gersom: Subuel the first."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "fuerunt autem filii Eliezer Roobia primus et non erant Eliezer filii alii porro filii Roobia multiplicati sunt nimis"
      en: "And the sons of Eliezer were: Rohobia the first: and Eliezer had no more sons. But the sons of Rohobia were multiplied exceedingly."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "filii Isaar Salumith primus"
      en: "The sons of Isaar: Salomith the first."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "filii Hebron Ieriau primus Amarias secundus Iazihel tertius Iecmaam quartus"
      en: "The sons of Hebron: Jeriau the first, Amarias the second, Jahaziel the third, Jecmaam the fourth."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "filii Ozihel Micha primus Iesia secundus"
      en: "The sons of Oziel: Micha the first, Jesia the second."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "filii Merari Mooli et Musi filii Mooli Eleazar et Cis"
      en: "The sons of Merari: Moholi, and Musi. The sons of Moholi: Eleazar and Cia."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "mortuus est autem Eleazar et non habuit filios sed filias acceperuntque eas filii Cis fratres earum"
      en: "And Eleazar died, and had no sons but daughters: and the sons of Cis their brethren took them."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "filii Musi Mooli et Eder et Ierimuth tres"
      en: "The sons of Musi: Moholi, and Eder, and Jerimoth, three."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "hii filii Levi in cognationibus et familiis suis principes per vices et numerum capitum singulorum qui faciebant opera ministerii domus Domini a viginti annis et supra"
      en: "These are the sons of Levi in their kindreds and families, princes by their courses, and the number of every head that did the works of the ministry of the house of the Lord from twenty years old and upward."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "dixit enim David requiem dedit Dominus Deus Israhel populo suo et habitationem Hierusalem usque in aeternum"
      en: "For David said: The Lord the God of Israel hath given rest to his people, and a habitation in Jerusalem for ever."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "nec erit officii Levitarum ut ultra portent tabernaculum et omnia vasa eius ad ministrandum"
      en: "And it shall not be the office of the Levites to carry any more the tabernacle, and all the vessels for the service thereof."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "iuxta praecepta quoque David novissima supputabitur numerus filiorum Levi a viginti annis et supra"
      en: "So according to the last precepts of David, the sons of Levi are to be numbered from twenty years old and upward."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et erunt sub manu filiorum Aaron in cultum domus Domini in vestibulis et in exedris et in loco purificationis et in sanctuario et in universis operibus ministerii templi Domini"
      en: "And they are to be under the hand of the sons of Aaron for the service of the house of the Lord, in the porches, and in the chambers, and in the place of purification, and in the sanctuary, and in all the works of the ministry of the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "sacerdotes autem super panes propositionis et ad similae sacrificium et ad lagana et azyma et sartaginem et ad ferventem similam et super omne pondus atque mensuram"
      en: "And the priests have the charge of the leaves of proposition, and of the sacrifice of fine flour, and of the unleavened cakes, and of the fryingpan, and of the roasting, and of every weight and measure."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Levitae vero ut stent mane ad confitendum et canendum Domino similiterque ad vesperam"
      en: "And the Levites are to stand in the morning to give thanks, and to sing praises to the Lord: and in like manner in the evening,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "tam in oblatione holocaustorum Domini quam in sabbatis et kalendis et sollemnitatibus reliquis iuxta numerum et caerimonias uniuscuiusque rei iugiter coram Domino"
      en: "As well in the oblation of the holocausts of the Lord, as in the sabbaths and in the new moons, and the rest of the solemnities, according to the number and ceremonies prescribed for every thing, continually before the Lord."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et custodiant observationes tabernaculi foederis et ritum sanctuarii et observationem filiorum Aaron fratrum suorum ut ministrent in domo Domini"
      en: "And let them keep the observances of the tabernacle of the covenant, and the ceremonies of the sanctuary, and the charge of the sons of Aaron their brethren, that they may minister in the house of the Lord."
    status: { la: verified, en: verified }
