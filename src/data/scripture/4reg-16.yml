# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 16
verses:
  - n: 1
    text:
      la: "Anno decimo septimo Phacee filii Romeliae, regnavit Achaz filius Joatham regis Juda."
      en: "In the seventeenth year of Phacee the son of Romelia reigned Achaz the son of Joatham king of Juda."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Viginti annorum erat Achaz cum regnare coepisset, et sedecim annis regnavit in Jerusalem: non fecit quod erat placitum in conspectu Domini Dei sui, sicut David pater ejus:"
      en: "Achaz was twenty years old when he began to reign, and he reigned sixteen years in Jerusalem: he did not that which was pleasing in the sight of the Lord his God, as David his father."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sed ambulavit in via regum Israel: insuper et filium suum consecravit, transferens per ignem secundum idola gentium, quae dissipavit Dominus coram filiis Israel."
      en: "But he walked in the way of the kings of Israel: moreover he consecrated also his son, making him pass through the fire according to the idols of the nations: which the Lord destroyed before the children of Israel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Immolabat quoque victimas, et adolebat incensum in excelsis, et in collibus, et sub omni ligno frondoso."
      en: "He sacrificed also and burnt incense in the high places and on the hills, and under every green tree."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Tunc ascendit Rasin rex Syriae, et Phacee filius Romeliae rex Israel, in Jerusalem ad praeliandum: cumque obsiderent Achaz, non valuerunt superare eum."
      en: "Then Rasin king of Syria, and Phacee son of Romelia king of Israel came up to Jerusalem to fight: and they besieged Achaz, but were not able to overcome him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "In tempore illo restituit Rasin rex Syriae, Ailam Syriae, et ejecit Judaeos de Aila: et Idumaei venerunt in Ailam, et habitaverunt ibi usque in diem hanc."
      en: "At that time Rasin king of Syria restored Aila to Syria, and drove the men of Juda out of Aila: and the Edomites came into Aila, and dwelt there unto this day."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Misit autem Achaz nuntios ad Theglathphalasar regem Assyriorum, dicens: Servus tuus, et filius tuus ego sum: ascende, et salvum me fac de manu regis Syriae, et de manu regis Israel, qui consurrexerunt adversum me."
      en: "And Achaz sent messengers to Theglathphalasar king of the Assyrians, saying: I am thy servant, and thy son: come up, and save me out of the hand of the king of Syria, and out of the hand of the king of Israel, who are risen up together against me."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et cum collegisset argentum et aurum, quod inveniri potuit in domo Domini, et in thesauris regis, misit regi Assyriorum munera."
      en: "And when he had gathered together the silver and gold that could be found in the house of the Lord, and in the king's treasures, he sent it for a present to the king of the Assyrians."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Qui et acquievit voluntati ejus: ascendit enim rex Assyriorum in Damascum, et vastavit eam: et transtulit habitatores ejus Cyrenen, Rasin autem interfecit."
      en: "And he agreed to his desire: for the king of the Assyrians went up against Damascus, and laid it waste: and he carried away the inhabitants thereof to Cyrene, but Rasin he slew."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Perrexitque rex Achaz in occursum Theglathphalasar regis Assyriorum in Damascum: cumque vidisset altare Damasci, misit rex Achaz ad Uriam sacerdotem exemplar ejus, et similitudinem juxta omne opus ejus."
      en: "And king Achaz went to Damascus to meet Theglathphalasar king of the Assyrians, and when he had seen the altar of Damascus, king Achaz sent to Urias the priest a pattern of it, and its likeness according to all the work thereof."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Exstruxitque Urias sacerdos altare: juxta omnia quae praeceperat rex Achaz de Damasco, ita fecit sacerdos Urias donec veniret rex Achaz de Damasco."
      en: "And Urias the priest built an altar according to all that king Achaz had commanded from Damascus, so did Urias the priest, until king Achaz came from Damascus."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cumque venisset rex de Damasco, vidit altare, et veneratus est illud: ascenditque et immolavit holocausta, et sacrificium suum,"
      en: "And when the king was come from Damascus, he saw the altar and worshipped it: and went up and offered holocausts, and his own sacrifice."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et libavit libamina, et fudit sanguinem pacificorum, quae obtulerat super altare."
      en: "And offered libations and poured the blood of the peace offerings, which he had offered upon the altar."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Porro altare aereum, quod erat coram Domino, transtulit de facie templi, et de loco altaris, et de loco templi Domini: posuitque illud ex latere altaris ad aquilonem."
      en: "But the altar of brass that was before the Lord, he removed from the face of the temple, and from the place of the altar, and from the place of the temple of the Lord: and he set it at the side of the altar toward the north."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Praecepit quoque rex Achaz Uriae sacerdoti, dicens: Super altare majus offer holocaustum matutinum, et sacrificium vespertinum, et holocaustum regis, et sacrificium ejus, et holocaustum universi populi terrae, et sacrificia eorum, et libamina eorum: et omnem sanguinem holocausti, et universum sanguinem victimae super illud effundes: altare vero aereum erit paratum ad voluntatem meam."
      en: "And king Achaz commanded Urias the priest saying: Upon the great altar offer the morning holocaust, and the evening sacrifice, and the king's holocaust, and his sacrifice, and the holocaust of the whole people of the land, and their sacrifices, and their libations: and all the blood of the holocaust, and all the blood of the victim thou shalt pour out upon it: but the altar of brass shall be ready at my pleasure."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Fecit igitur Urias sacerdos juxta omnia quae praeceperat rex Achaz."
      en: "So Urias the priest did according to all that king Achaz had commanded him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Tulit autem rex Achaz caelatas bases, et luterem, qui erat desuper: et mare deposuit de bobus aereis, qui sustentabant illud, et posuit super pavimentum stratum lapide."
      en: "And king Achaz took away the graven bases, and the laver that was upon them: and he took down the sea from the brazen oxen that held it up, and put it upon a pavement of stone."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Musach quoque sabbati, quod aedificaverat in templo: et ingressum regis exterius convertit in templum Domini propter regem Assyriorum."
      en: "The Musach also for the sabbath, which he had built in the temple: and the king's entry from without he turned into the temple of the Lord, because of the king of the Assyrians."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Reliqua autem verborum Achaz, quae fecit, nonne haec scripta sunt in libro sermonum dierum regum Juda?"
      en: "Now the rest of the acts of Achaz, which he did, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dormivitque Achaz cum patribus suis, et sepultus est cum eis in civitate David, et regnavit Ezechias filius ejus pro eo."
      en: "And Achaz slept with his fathers, and was buried with them in the city of David, and Ezechias his son reigned in his stead."
    status: { la: verified, en: verified }
