# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 24
verses:
  - n: 1
    text:
      la: "Mosi quoque dixit ascende ad Dominum tu et Aaron Nadab et Abiu et septuaginta senes ex Israhel et adorabitis procul"
      en: "And he said to Moses: Come up to the Lord, thou, and Aaron, Nadab, and Abiu, and seventy of the ancients of Israel, and you shall adore afar off."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "solusque Moses ascendet ad Dominum et illi non adpropinquabunt nec populus ascendet cum eo"
      en: "And Moses alone shall come up to the Lord, but they shall not come nigh; neither shall the people come up with him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "venit ergo Moses et narravit plebi omnia verba Domini atque iudicia responditque cunctus populus una voce omnia verba Domini quae locutus est faciemus"
      en: "So Moses came and told the people all the words of the Lord, and all the judgments: and all the people answered with one voice: We will do all the words of the Lord, which he hath spoken."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "scripsit autem Moses universos sermones Domini et mane consurgens aedificavit altare ad radices montis et duodecim titulos per duodecim tribus Israhel"
      en: "And Moses wrote all the words of the Lord: and rising in the morning he built an altar at the foot of the mount, and twelve titles according to the twelve tribes of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "misitque iuvenes de filiis Israhel et obtulerunt holocausta immolaveruntque victimas pacificas Domino vitulos"
      en: "And he sent young men of the children of Israel, and they offered holocausts, and sacrificed pacific victims of calves to the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "tulit itaque Moses dimidiam partem sanguinis et misit in crateras partem autem residuam fudit super altare"
      en: "Then Moses took half of the blood, and put it into bowls: and the rest he poured upon the altar."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "adsumensque volumen foederis legit audiente populo qui dixerunt omnia quae locutus est Dominus faciemus et erimus oboedientes"
      en: "And taking the book of the covenant, he read it in the hearing of the people: and they said: All things that the Lord hath spoken we will do, we will be obedient."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ille vero sumptum sanguinem respersit in populum et ait hic est sanguis foederis quod pepigit Dominus vobiscum super cunctis sermonibus his"
      en: "And he took the blood and sprinkled it upon the people, and he said: This is the blood of the covenant which the Lord hath made with you concerning all these words."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ascenderuntque Moses et Aaron Nadab et Abiu et septuaginta de senioribus Israhel"
      en: "Then Moses and Aaron, Nadab and Abiu, and seventy of the ancients of Israel went up:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et viderunt Deum Israhel sub pedibus eius quasi opus lapidis sapphirini et quasi caelum cum serenum est"
      en: "And they saw the God of Israel: and under his feet as it were a work of sapphire stone, and as the heaven, when clear."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "nec super eos qui procul recesserant de filiis Israhel misit manum suam videruntque Deum et comederunt ac biberunt"
      en: "Neither did he lay his hand upon those of the children of Israel, that retired afar off, and they saw God, and they did eat and drink."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dixit autem Dominus ad Mosen ascende ad me in montem et esto ibi daboque tibi tabulas lapideas et legem ac mandata quae scripsi ut doceas eos"
      en: "And the Lord said to Moses: Come up to me into the mount, and be there: and I will give thee tables of stone, and the law, and the commandments which I have written: that thou mayst teach them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "surrexerunt Moses et Iosue minister eius ascendensque Moses in montem Dei"
      en: "Moses rose up, and his minister Josue: and Moses going up into the mount of God,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "senioribus ait expectate hic donec revertamur ad vos habetis Aaron et Hur vobiscum si quid natum fuerit quaestionis referetis ad eos"
      en: "Said to the ancients: Wait ye here till we return to you. You have Aaron and Hur with you: if any question shall arise, you shall refer it to them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cumque ascendisset Moses operuit nubes montem"
      en: "And when Moses was gone up, a cloud covered the mount."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et habitavit gloria Domini super Sinai tegens illum nube sex diebus septimo autem die vocavit eum de medio caliginis"
      en: "And the glory of the Lord dwelt upon Sinai, covering it with a cloud six days: and the seventh day he called him out of the midst of the cloud."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "erat autem species gloriae Domini quasi ignis ardens super verticem montis in conspectu filiorum Israhel"
      en: "And the sight of the glory of the Lord was like a burning fire upon the top of the mount, in the eyes of the children of Israel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ingressusque Moses medium nebulae ascendit in montem et fuit ibi quadraginta diebus et quadraginta noctibus"
      en: "And Moses, entering into the midst of the cloud, went up into the mountain: and he was there forty days, and forty nights."
    status: { la: verified, en: verified }
