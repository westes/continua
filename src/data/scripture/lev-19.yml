# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: lev
chapter: 19
verses:
  - n: 1
    text:
      la: "locutus est Dominus ad Mosen dicens"
      en: "The Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "loquere ad omnem coetum filiorum Israhel et dices ad eos sancti estote quia ego sanctus sum Dominus Deus vester"
      en: "Speak to all the congregation of the children of Israel, and thou shalt say to them: Be ye holy, because I the Lord your God am holy."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "unusquisque matrem et patrem suum timeat sabbata mea custodite ego Dominus Deus vester"
      en: "Let every one fear his father, and his mother. Keep my sabbaths. I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "nolite converti ad idola nec deos conflatiles faciatis vobis ego Dominus Deus vester"
      en: "Turn ye not to idols, nor make to yourselves molten gods. I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "si immolaveritis hostiam pacificorum Domino ut sit placabilis"
      en: "If ye offer in sacrifice a peace offering to the Lord, that he may be favourable,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "eo die quo fuerit immolata comedetis eam et die altero quicquid autem residuum fuerit in diem tertium igne conburetis"
      en: "You shall eat it on the same day it was offered, and the next day: and whatsoever shall be left until the third day, you shall burn with fire."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "si quis post biduum comederit ex ea profanus erit et impietatis reus"
      en: "If after two days ally man eat thereof, he shall be profane and guilty of impiety:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "portabit iniquitatem suam quia sanctum Domini polluit et peribit anima illa de populo suo"
      en: "And shall bear his iniquity, because he hath defiled the holy thing of the Lord, and that soul shall perish from among his people."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cum messueris segetes terrae tuae non tondebis usque ad solum superficiem terrae nec remanentes spicas colliges"
      en: "When thou reapest the corn of thy land, thou shalt not cut down all that is on the face of the earth to the very ground: nor shalt thou gather the ears that remain."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "neque in vinea tua racemos et grana decidentia congregabis sed pauperibus et peregrinis carpenda dimittes ego Dominus Deus vester"
      en: "Neither shalt thou gather the bunches and grapes that fall down in thy vineyard, but shalt leave them to the poor and the strangers to take. I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "non facietis furtum non mentiemini nec decipiet unusquisque proximum suum"
      en: "You shall not steal. You shall not lie, neither shall any man deceive his neighbour."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "non peierabis in nomine meo nec pollues nomen Dei tui ego Dominus"
      en: "Thou shalt not swear falsely by my name, nor profane the name of thy God. I am the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "non facies calumniam proximo tuo nec vi opprimes eum non morabitur opus mercennarii apud te usque mane"
      en: "Thou shalt not calumniate thy neighbour, nor oppress him by violence. The wages of him that hath been hired by thee shall not abide with thee until the morning."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "non maledices surdo nec coram caeco pones offendiculum sed timebis Deum tuum quia ego sum Dominus"
      en: "Thou shalt not speak evil of the deaf, nor put a stumblingblock before the blind: but thou shalt fear the Lord thy God, because I am the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "non facies quod iniquum est nec iniuste iudicabis nec consideres personam pauperis nec honores vultum potentis iuste iudica proximo tuo"
      en: "Thou shalt not do that which is unjust, nor judge unjustly. Respect not the person of the poor, nor honour the countenance of the mighty. But judge thy neighbour according to justice."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "non eris criminator et susurro in populis non stabis contra sanguinem proximi tui ego Dominus"
      en: "Thou shalt not be a detractor nor a whisperer among the people. Thou shalt not stand against the blood of thy neighbour. I am the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ne oderis fratrem tuum in corde tuo sed publice argue eum ne habeas super illo peccatum"
      en: "Thou shalt not hate thy brother in thy heart, but reprove him openly, lest thou incur sin through him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "non quaeres ultionem nec memor eris iniuriae civium tuorum diliges amicum tuum sicut temet ipsum ego Dominus"
      en: "Seek not revenge, nor be mindful of the injury of thy citizens. Thou shalt love thy friend as thyself. I am the Lord."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "leges meas custodite iumenta tua non facies coire cum alterius generis animantibus agrum non seres diverso semine veste quae ex duobus texta est non indueris"
      en: "Keep ye my laws. Thou shalt not make thy cattle to gender with beasts of any other kind. Thou shalt not sow thy field with different seeds. Thou shalt not wear a garment that is woven of two sorts."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "homo si dormierit cum muliere coitu seminis quae sit ancilla etiam nubilis et tamen pretio non redempta nec libertate donata vapulabunt ambo et non morientur quia non fuit libera"
      en: "If a man carnally lie with a woman that is a bondservant and marriageable, and yet not redeemed with a price, nor made free: they both shall be scourged, and they shall not be put to death, because she was not a free woman."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "pro delicto autem suo offeret Domino ad ostium tabernaculi testimonii arietem"
      en: "And for his trespass he shall offer a ram to the Lord, at the door of the tabernacle of the testimony:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "orabitque pro eo sacerdos et pro delicto eius coram Domino et repropitiabitur ei dimitteturque peccatum"
      en: "And the priest shall pray for him and for his sin before the Lord, and he shall have mercy on him, and the sin shall be forgiven."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quando ingressi fueritis terram et plantaveritis in ea ligna pomifera auferetis praeputia eorum poma quae germinant inmunda erunt vobis nec edetis ex eis"
      en: "When you shall be come into the land, and shall have planted in it fruit trees, you shall take away the firstfruits of them: the fruit that comes forth shall be unclean to you, neither shall you eat of them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "quarto anno omnis fructus eorum sanctificabitur laudabilis Domino"
      en: "But in the fourth year, all their fruit shall be sanctified, to the praise of the Lord."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quinto autem anno comedetis fructus congregantes poma quae proferunt ego Dominus Deus vester"
      en: "And in the fifth year you shall eat the fruits thereof, gathering the increase thereof. I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "non comedetis cum sanguine non augurabimini nec observabitis somnia"
      en: "You shall not eat with blood. You shall not divine nor observe dreams."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "neque in rotundum adtondebitis comam nec radatis barbam"
      en: "Nor shall you cut your hair roundwise: nor shave your beard."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et super mortuo non incidetis carnem vestram neque figuras aliquas et stigmata facietis vobis ego Dominus"
      en: "You shall not make any cuttings in your flesh, for the dead, neither shall you make in yourselves any figures or marks: I am the Lord."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ne prostituas filiam tuam et contaminetur terra et impleatur piaculo"
      en: "Make not thy daughter a common strumpet, lest the land be defiled, and filled with wickedness."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "sabbata mea custodite et sanctuarium meum metuite ego Dominus"
      en: "Keep ye my sabbaths, and reverence my sanctuary. I am the Lord."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ne declinetis ad magos nec ab ariolis aliquid sciscitemini ut polluamini per eos ego Dominus Deus vester"
      en: "Go not aside after wizards, neither ask any thing of soothsayers, to be defiled by them: I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "coram cano capite consurge et honora personam senis et time Deum tuum ego sum Dominus"
      en: "Rise up before the hoary head, and honour the person of the aged man: and fear the Lord thy God. I am the Lord."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "si habitaverit advena in terra vestra et moratus fuerit inter vos ne exprobretis ei"
      en: "If a stranger dwell in your land, and abide among you, do not upbraid him :"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "sed sit inter vos quasi indigena et diligetis eum quasi vosmet ipsos fuistis enim et vos advenae in terra Aegypti ego Dominus Deus vester"
      en: "But let him be among you as one of the same country: and you shall love him as yourselves: for you were strangers in the land of Egypt. I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "nolite facere iniquum aliquid in iudicio in regula in pondere in mensura"
      en: "Do not any unjust thing in judgment, in rule, in weight, or in measure."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "statera iusta et aequa sint pondera iustus modius aequusque sextarius ego Dominus Deus vester qui eduxi vos de terra Aegypti"
      en: "Let the balance be just and the weights equal, the bushel just, and the sextary equal. I am the Lord your God, that brought you out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "custodite omnia praecepta mea et universa iudicia et facite ea ego Dominus"
      en: "Keep all my precepts, and all my judgments, and do them. I am the Lord."
    status: { la: verified, en: verified }
