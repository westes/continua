# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 15
verses:
  - n: 1
    text:
      la: "Tunc accesserunt ad eum ab Jerosolymis scribae et pharisaei, dicentes:"
      en: "Then came to him from Jerusalem scribes and Pharisees, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quare discipuli tui transgrediuntur traditionem seniorum? non enim lavant manus suas cum panem manducant."
      en: "Why do thy disciples transgress the tradition of the ancients? For they wash not their hands when they eat bread."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ipse autem respondens ait illis: Quare et vos transgredimini mandatum Dei propter traditionem vestram? Nam Deus dixit:"
      en: "But he answering, said to them: Why do you also transgress the commandment of God for your tradition? For God said:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Honora patrem, et matrem: et, Qui maledixerit patri, vel matri, morte moriatur."
      en: "Honour thy father and mother: And: He that shall curse father or mother, let him die the death."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Vos autem dicitis: Quicumque dixerit patri, vel matri: Munus, quodcumque est ex me, tibi proderit:"
      en: "But you say: Whosoever shall say to father or mother, The gift whatsoever proceedeth from me, shall profit thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et non honorificavit patrem suum, aut matrem suam: et irritum fecistis mandatum Dei propter traditionem vestram."
      en: "And he shall not honour his father or his mother: and you have made void the commandment of God for your tradition."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Hypocritae, bene prophetavit de vobis Isaias, dicens:"
      en: "Hypocrites, well hath Isaias prophesied of you, saying:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Populus hic labiis me honorat: cor autem eorum longe est a me."
      en: "This people honoureth me with their lips: but their heart is far from me."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sine causa autem colunt me, docentes doctrinas et mandata hominum."
      en: "And in vain do they worship me, teaching doctrines and commandments of men."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et convocatis ad se turbis, dixit eis: Audite, et intelligite."
      en: "And having called together the multitudes unto him, he said to them: Hear ye and understand."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Non quod intrat in os, coinquinat hominem: sed quod procedit ex ore, hoc coinquinat hominem."
      en: "Not that which goeth into the mouth defileth a man: but what cometh out of the mouth, this defileth a man."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tunc accedentes discipuli ejus, dixerunt ei: Scis quia pharisaei audito verbo hoc, scandalizati sunt?"
      en: "Then came his disciples, and said to him: Dost thou know that the Pharisees, when they heard this word, were scandalized?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "At ille respondens ait: Omnis plantatio, quam non plantavit Pater meus caelestis, eradicabitur."
      en: "But he answering them, said: Every plant which my heavenly Father hath not planted, shall be rooted up."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sinite illos: caeci sunt, et duces caecorum; caecus autem si caeco ducatum praestet, ambo in foveam cadunt."
      en: "Let them alone: they are blind, and leaders of the blind. And if the blind lead the blind, both will fall into the pit."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Respondens autem Petrus dixit ei: Edissere nobis parabolam istam."
      en: "And Peter answering, said to him: Expound to us this parable."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "At ille dixit: Adhuc et vos sine intellectu estis?"
      en: "But he said: Are you also yet without understanding?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Non intelligitis quia omne quod in os intrat, in ventrem vadit, et in secessum emittitur?"
      en: "Do you not understand, that whatsoever entereth into the mouth, goeth into the belly, and is cast out into the privy?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quae autem procedunt de ore, de corde exeunt, et ea coinquinant hominem:"
      en: "But the things which proceed out of the mouth, come forth from the heart, and those things defile a man."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "de corde enim exeunt cogitationes malae, homicidia, adulteria, fornicationes, furta, falsa testimonia, blasphemiae:"
      en: "For from the heart come forth evil thoughts, murders, adulteries, fornications, thefts, false testimonies, blasphemies."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "haec sunt, quae coinquinant hominem. Non lotis autem manibus manducare, non coinquinat hominem."
      en: "These are the things that defile a man. But to eat with unwashed hands doth not defile a man."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et egressus inde Jesus secessit in partes Tyri et Sidonis."
      en: "And Jesus went from thence, and retired into the coasts of Tyre and Sidon."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et ecce mulier chananaea a finibus illis egressa clamavit, dicens ei: Miserere mei, Domine fili David: filia mea male a daemonio vexatur."
      en: "And behold a woman of Canaan who came out of those coasts, crying out, said to him: Have mercy on me, O Lord, thou son of David: my daughter is grieviously troubled by the devil."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Qui non respondit ei verbum. Et accedentes discipuli ejus rogabant eum dicentes: Dimitte eam: quia clamat post nos."
      en: "Who answered her not a word. And his disciples came and besought him, saying: Send her away, for she crieth after us:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ipse autem respondens ait: Non sum missus nisi ad oves, quae perierunt domus Israel."
      en: "And he answering, said: I was not sent but to the sheep that are lost of the house of Israel."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "At illa venit, et adoravit eum, dicens: Domine, adjuva me."
      en: "But she came and adored him, saying: Lord, help me."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Qui respondens ait: Non est bonum sumere panem filiorum, et mittere canibus."
      en: "Who answering, said: It is not good to take the bread of the children, and to cast it to the dogs."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "At illa dixit: Etiam Domine: nam et catelli edunt de micis quae cadunt de mensa dominorum suorum."
      en: "But she said: Yea, Lord; for the whelps also eat of the crumbs that fall from the table of their masters."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Tunc respondens Jesus, ait illi: O mulier, magna est fides tua: fiat tibi sicut vis. Et sanata est filia ejus ex illa hora."
      en: "Then Jesus answering, said to her: O woman, great is thy faith: be it done to thee as thou wilt: and her daughter was cured from that hour."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et cum transisset inde Jesus, venit secus mare Galilaeae: et ascendens in montem, sedebat ibi."
      en: "And when Jesus had passed away from thence, he came nigh the sea of Galilee. And going up into a mountain, he sat there."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et accesserunt ad eum turbae multae, habentes secum mutos, caecos, claudos, debiles, et alios multos: et projecerunt eos ad pedes ejus, et curavit eos,"
      en: "And there came to him great multitudes, having with them the dumb, the blind, the lame, the maimed, and many others: and they cast them down at his feet, and he healed them:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ita ut turbae mirarentur, videntes mutos loquentes, claudos ambulantes, caecos videntes: et magnificabant Deum Israel."
      en: "So that the multitudes marvelled seeing the dumb speak, the lame walk, and the blind see: and they glorified the God of Israel."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Jesus autem, convocatis discipulis suis, dixit: Misereor turbae, quia triduo jam perseverant mecum, et non habent quod manducent: et dimittere eos jejunos nolo, ne deficiant in via."
      en: "And Jesus called together his disciples, and said: I have compassion on the multitudes, because they continue with me now three days, and have not what to eat, and I will not send them away fasting, lest they faint in the way."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et dicunt ei discipuli: Unde ergo nobis in deserto panes tantos, ut saturemus turbam tantam?"
      en: "And the disciples say unto him: Whence then should we have so many loaves in the desert, as to fill so great a multitude?"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et ait illis Jesus: Quot habetis panes? At illi dixerunt: Septem, et paucos pisciculos."
      en: "And Jesus said to them: How many loaves have you? But they said: Seven, and a few little fishes."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et praecepit turbae ut discumberent super terram."
      en: "And he commanded the multitude to sit down upon the ground."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et accipiens septem panes, et pisces, et gratias agens, fregit, et dedit discipulis suis, et discipuli dederunt populo."
      en: "And taking the seven loaves and the fishes, and giving thanks, he brake, and gave to his disciples, and the disciples to the people."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et comederunt omnes, et saturati sunt. Et quod superfuit de fragmentis, tulerunt septem sportas plenas."
      en: "And they did all eat, and had their fill. And they took up seven baskets full, of what remained of the fragments."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Erant autem qui manducaverunt quatuor millia hominum, extra parvulos et mulieres."
      en: "And they that did eat, were four thousand men, beside children and women."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et, dimissa turba, ascendit in naviculam: et venit in fines Magedan."
      en: "And having dismissed the multitude, he went up into a boat, and came into the coasts of Magedan."
    status: { la: verified, en: verified }
