# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: act
chapter: 22
verses:
  - n: 1
    text:
      la: "Viri fratres, et patres, audite quam ad vos nunc reddo rationem."
      en: "Men, brethren, and fathers, hear ye the account which I now give unto you."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cum audissent autem quia hebraea lingua loqueretur ad illos, magis praestiterunt silentium."
      en: "(And when they heard that he spoke to them in the Hebrew tongue, they kept the more silence.)"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dicit: Ego sum vir Judaeus, natus in Tarso Ciliciae, nutritus autem in ista civitate, secus pedes Gamaliel eruditus juxta veritatem paternae legis, aemulator legis, sicut et vos omnes estis hodie:"
      en: "And he saith: I am a Jew, born at Tarsus in Cilicia, but brought up in this city, at the feet of Gamaliel, taught according to the truth of the law of the fathers, zealous for the law, as also all you are this day:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui hanc viam persecutus sum usque ad mortem, alligans et tradens in custodias viros ac mulieres,"
      en: "Who persecuted this way unto death, binding and delivering into prisons both men and women."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "sicut princeps sacerdotum mihi testimonium reddit, et omnes majores natu, a quibus et epistolas accipiens, ad fratres Damascum pergebam, ut adducerem inde vinctos in Jerusalem ut punirentur."
      en: "As the high priest doth bear me witness, and all the ancients: from whom also receiving letters to the brethren, I went to Damascus, that I might bring them bound from thence to Jerusalem to be punished."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Factum est autem, eunte me, et appropinquante Damasco media die, subito de caelo circumfulsit me lux copiosa:"
      en: "And it came to pass, as I was going, and drawing nigh to Damascus at midday, that suddenly from heaven there shone round about me a great light:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et decidens in terram, audivi vocem dicentem mihi: Saule, Saule, quid me persequeris?"
      en: "And falling on the ground, I heard a voice saying to me: Saul, Saul, why persecutest thou me?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ego autem respondi: Quis es, Domine? Dixitque ad me: Ego sum Jesus Nazarenus, quem tu persequeris."
      en: "And I answered: Who art thou, Lord? And he said to me: I am Jesus of Nazareth, whom thou persecutest."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et qui mecum erant, lumen quidem viderunt, vocem autem non audierunt ejus qui loquebatur mecum."
      en: "And they that were with me, saw indeed the light, but they heard not the voice of him that spoke with me."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et dixi: Quid faciam, Domine? Dominus autem dixit ad me: Surgens vade Damascum: et ibi tibi dicetur de omnibus quae te oporteat facere."
      en: "And I said: What shall I do, Lord? And the Lord said to me: Arise, and go to Damascus; and there it shall be told thee of all things that thou must do."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et cum non viderem prae claritate luminis illius, ad manum deductus a comitibus, veni Damascum."
      en: "And whereas I did not see for the brightness of that light, being led by the hand by my companions, I came to Damascus."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ananias autem quidam, vir secundum legem testimonium habens ab omnibus cohabitantibus Judaeis,"
      en: "And one Ananias, a man according to the law, having testimony of all the Jews who dwelt there,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "veniens ad me, et astans dixit mihi: Saule frater respice. Et ego eadem hora respexi in eum."
      en: "Coming to me, and standing by me, said to me: Brother Saul, look up. And I the same hour looked upon him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "At ille dixit: Deus patrum nostrorum praeordinavit te, ut cognosceres voluntatem ejus, et videres justum, et audires vocem ex ore ejus:"
      en: "But he said: The God of our fathers hath preordained thee that thou shouldst know his will, and see the Just One, and shouldst hear the voice from his mouth."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quia eris testis illius ad omnes homines eorum quae vidisti et audisti."
      en: "For thou shalt be his witness to all men, of those things which thou hast seen and heard."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et nunc quid moraris? Exsurge, et baptizare, et ablue peccata tua, invocato nomine ipsius."
      en: "And now why tarriest thou? Rise up, and be baptized, and wash away thy sins, invoking his name."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Factum est autem revertenti mihi in Jerusalem, et oranti in templo, fieri me in stupore mentis,"
      en: "And it came to pass, when I was come again to Jerusalem, and was praying in the temple, that I was in a trance,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et videre illum dicentem mihi: Festina, et exi velociter ex Jerusalem: quoniam non recipient testimonium tuum de me."
      en: "And saw him saying unto me: Make haste, and get thee quickly out of Jerusalem; because they will not receive thy testimony concerning me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et ego dixi: Domine ipsi sciunt quia ego eram concludens in carcerem, et caedans per synagogas eos qui credebant in te:"
      en: "And I said: Lord, they know that I cast into prison, and beat in every synagogue, them that believed in thee."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et cum funderetur sanguis Stephani testis tui, ego astabam, et consentiebam, et custodiebam vestimenta interficientium illum."
      en: "And when the blood of Stephen thy witness was shed, I stood by and consented, and kept the garments of them that killed him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et dixit ad me: Vade quoniam ego in nationes longe mittam te."
      en: "And he said to me: Go, for unto the Gentiles afar off, will I send thee."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Audiebant autem eum usque ad hoc verbum, et levaverunt vocem suam dicentes: Tolle de terra hujusmodi: non enim fas est eum vivere."
      en: "And they heard him until this word, and then lifted up their voice, saying: Away with such an one from the earth; for it is not fit that he should live."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Vociferantibus autem eis, et projicientibus vestimenta sua, et pulverem jactantibus in aerem,"
      en: "And as they cried out and threw off their garments, and cast dust into the air,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "jussit tribunus induci eum in castra, et flagellis caedi, et torqueri eum, ut sciret propter quam causam sic acclamarent ei."
      en: "The tribune commanded him to be brought into the castle, and that he should be scourged and tortured: to know for what cause they did so cry out against him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et cum astrinxissent eum loris, dicit astanti sibi centurioni Paulus: Si hominem Romanum, et indemnatum licet vobis flagellare?"
      en: "And when they had bound him with thongs, Paul saith to the centurion that stood by him: Is it lawful for you to scourge a man that is a Roman, and uncondemned?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Quo audito, centurio accessit ad tribunum, et nuntiavit ei, dicens: Quid acturus es? hic enim homo civis Romanus est."
      en: "Which the centurion hearing, went to the tribune, and told him, saying: What art thou about to do? For this man is a Roman citizen."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Accedens autem tribunus, dixit illi: Dic mihi si tu Romanus es? At ille dixit: Etiam."
      en: "And the tribune coming, said to him: Tell me, art thou a Roman? But he said: Yea."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et respondit tribunus: Ego multa summa civilitatem hanc consecutus sum. Et Paulus ait: Ego autem et natus sum."
      en: "And the tribune answered: I obtained the being free of this city with a great sum. And Paul said: But I was born so."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Protinus ergo discesserunt ab illo qui eum torturi erant. Tribunus quoque timuit postquam rescivit, quia civis Romanus esset, et quia alligasset eum."
      en: "Immediately therefore they departed from him that were about to torture him. The tribune also was afraid after he understood that he was a Roman citizen, and because he had bound him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Postera autem die volens scire diligentius qua ex causa accusaretur a Judaeis, solvit eum, et jussit sacerdotes convenire, et omne concilium, et producens Paulum, statuit inter illos."
      en: "But on the next day, meaning to know more diligently for what cause he was accused by the Jews, he loosed him, and commanded the priests to come together, and all the council: and bringing forth Paul, he set him before them."
    status: { la: verified, en: verified }
