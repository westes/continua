# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jon
chapter: 3
verses:
  - n: 1
    text:
      la: "Et factum est verbum Domini ad Jonam secundo, dicens:"
      en: "And the word of the Lord came to Jonas the second time, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Surge, et vade in Niniven, civitatem magnam, et praedica in ea praedicationem quam ego loquor ad te."
      en: "Arise, and go to Ninive the great city: and preach in it the preaching that I bid thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et surrexit Jonas, et abiit in Niniven juxta verbum Domini: et Ninive erat civitas magna, itinere trium dierum."
      en: "And Jonas arose, and went to Ninive, according to the word of the Lord: now Ninive was a great city of three days' journey."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et coepit Jonas introire in civitatem itinere diei unius: et clamavit, et dixit: Adhuc quadraginta dies, et Ninive subvertetur."
      en: "And Jonas began to enter into the city one day's journey: and he cried, and said: Yet forty days, and Ninive shall be destroyed."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et crediderunt viri Ninivitae in Deum, et praedicaverunt jejunium, et vestiti sunt saccis, a majore usque ad minorem."
      en: "And the men of Ninive believed in God: and they proclaimed a fast, and put on sackcloth from the greatest to the least."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et pervenit verbum ad regem Ninive: et surrexit de solio suo, et abjecit vestimentum suum a se, et indutus est sacco, et sedit in cinere."
      en: "And the word came to the king of Ninive; and he rose up out of his throne, and cast away his robe from him, and was clothed with sackcloth, and sat in ashes."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et clamavit, et dixit in Ninive ex ore regis et principum ejus, dicens: Homines, et jumenta, et boves, et pecora non gustent quidquam: nec pascantur, et aquam non bibant."
      en: "And he caused it to be proclaimed and published in Ninive from the mouth of the king and of his princes, saying: Let neither men nor beasts, oxen nor sheep, taste any thing: let them not feed, nor drink water."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et operiantur saccis homines et jumenta, et clament ad Dominum in fortitudine: et convertatur vir a via sua mala, et ab iniquitate quae est in manibus eorum."
      en: "And let men and beasts be covered with sackcloth, and cry to the Lord with all their strength, and let them turn every one from his evil way, and from the iniquity that is in their hands."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quis scit si convertatur et ignoscat Deus, et revertatur a furore irae suae, et non peribimus?"
      en: "Who can tell if God will turn, and forgive: and will turn away from his fierce anger, and we shall not perish?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et vidit Deus opera eorum, quia conversi sunt de via sua mala: et misertus est Deus super malitiam quam locutus fuerat ut faceret eis, et non fecit."
      en: "And God saw their works, that they were turned from their evil way: and God had mercy with regard to the evil which he had said that he would do to them, and he did it not."
    status: { la: verified, en: verified }
