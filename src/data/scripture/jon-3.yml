# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jon
chapter: 3
verses:
  - n: 1
    text:
      la: "et factum est verbum Domini ad Ionam secundo dicens"
      en: "And the word of the Lord came to Jonas the second time, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "surge vade ad Nineven civitatem magnam et praedica in ea praedicationem quam ego loquor ad te"
      en: "Arise, and go to Ninive the great city: and preach in it the preaching that I bid thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et surrexit Iona et abiit in Nineven iuxta verbum Domini et Nineve erat civitas magna Dei itinere dierum trium"
      en: "And Jonas arose, and went to Ninive, according to the word of the Lord: now Ninive was a great city of three days' journey."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et coepit Iona introire in civitatem itinere diei unius et clamavit et dixit adhuc quadraginta dies et Nineve subvertetur"
      en: "And Jonas began to enter into the city one day's journey: and he cried, and said: Yet forty days, and Ninive shall be destroyed."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et crediderunt viri ninevitae in Deo et praedicaverunt ieiunium et vestiti sunt saccis a maiore usque ad minorem"
      en: "And the men of Ninive believed in God: and they proclaimed a fast, and put on sackcloth from the greatest to the least."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et pervenit verbum ad regem Nineve et surrexit de solio suo et abiecit vestimentum suum a se et indutus est sacco et sedit in cinere"
      en: "And the word came to the king of Ninive; and he rose up out of his throne, and cast away his robe from him, and was clothed with sackcloth, and sat in ashes."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et clamavit et dixit in Nineve ex ore regis et principum eius dicens homines et iumenta et boves et pecora non gustent quicquam nec pascantur et aquam non bibant"
      en: "And he caused it to be proclaimed and published in Ninive from the mouth of the king and of his princes, saying: Let neither men nor beasts, oxen nor sheep, taste any thing: let them not feed, nor drink water."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et operiantur saccis homines et iumenta et clament ad Dominum in fortitudine et convertatur vir a via sua mala et ab iniquitate quae est in manibus eorum"
      en: "And let men and beasts be covered with sackcloth, and cry to the Lord with all their strength, and let them turn every one from his evil way, and from the iniquity that is in their hands."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quis scit si convertatur et ignoscat Deus et revertatur a furore irae suae et non peribimus"
      en: "Who can tell if God will turn, and forgive: and will turn away from his fierce anger, and we shall not perish?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et vidit Deus opera eorum quia conversi sunt a via sua mala et misertus est Deus super malitiam quam locutus fuerat ut faceret eis et non fecit"
      en: "And God saw their works, that they were turned from their evil way: and God had mercy with regard to the evil which he had said that he would do to them, and he did it not."
    status: { la: verified, en: verified }
