# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 11
verses:
  - n: 1
    text:
      la: "et dixit Dominus ad Mosen adhuc una plaga tangam Pharaonem et Aegyptum et post haec dimittet vos et exire conpellet"
      en: "And the Lord said to Moses: Yet one plague more will I bring upon Pharao and Egypt, and after that he shall let you go and thrust you out."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dices ergo omni plebi ut postulet vir ab amico suo et mulier a vicina sua vasa argentea et aurea"
      en: "Therefore thou shalt tell all the people that every man ask of his friend, and every woman of her neighbour, vessels of silver, and of gold."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dabit autem Dominus gratiam populo coram Aegyptiis fuitque Moses vir magnus valde in terra Aegypti coram servis Pharao et omni populo"
      en: "And the Lord will give favour to his people in the sight of the Egyptians. And Moses was a very great man in the land of Egypt, in the sight of Pharao's servants, and of all the people."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ait haec dicit Dominus media nocte egrediar in Aegyptum"
      en: "And he said: Thus said the Lord: At midnight I will enter into Egypt."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et morietur omne primogenitum in terra Aegyptiorum a primogenito Pharaonis qui sedet in solio eius usque ad primogenitum ancillae quae est ad molam et omnia primogenita iumentorum"
      en: "And every firstborn in the land of the Egyptians shall die, from the firstborn of Pharao who sitteth on his throne, even to the first born of the handmaid that is at the mill, and all the firstborn of beasts."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "eritque clamor magnus in universa terra Aegypti qualis nec ante fuit nec postea futurus est"
      en: "And there shall be a great cry in all the land of Egypt, such as neither hath been before, nor shall be hereafter."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "apud omnes autem filios Israhel non muttiet canis ab homine usque ad pecus ut sciatis quanto miraculo dividat Dominus Aegyptios et Israhel"
      en: "But with all the children of Israel there shall not a dog make the least noise, from man even to beast: that you may know how wonderful a difference the Lord maketh between the Egyptians and Israel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "descendentque omnes servi tui isti ad me et adorabunt me dicentes egredere tu et omnis populus qui subiectus est tibi post haec egrediemur"
      en: "And all these thy servants shall come down to me, and shall worship me, saying: Go forth thou, and all the people that is under thee: after that we will go out."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et exivit a Pharaone iratus nimis dixit autem Dominus ad Mosen non audiet vos Pharao ut multa signa fiant in terra Aegypti"
      en: "And he went out from Pharao exceeding angry. But the Lord said to Moses: Pharao will not hear you, that many signs may be done in the land of Egypt."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Moses autem et Aaron fecerunt omnia ostenta quae scripta sunt coram Pharaone et induravit Dominus cor Pharaonis nec dimisit filios Israhel de terra sua"
      en: "And Moses and Aaron did all the wonders that are written, before Pharao. And the Lord hardened Pharao's heart, neither did he let the children of Israel go out of his land."
    status: { la: verified, en: verified }
