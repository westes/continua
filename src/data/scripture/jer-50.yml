# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 50
verses:
  - n: 1
    text:
      la: "verbum quod locutus est Dominus de Babylone et de terra Chaldeorum in manu Hieremiae prophetae"
      en: "The word that the Lord hath spoken against Babylon, and against the land of the Chaldeans in the hand of Jeremias the prophet."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "adnuntiate in gentibus et auditum facite levate signum praedicate et nolite celare dicite capta est Babylon confusus est Bel victus est Marodach confusa sunt sculptilia eius superata sunt idola eorum"
      en: "Declare ye among the nations, and publish it, lift up a standard: proclaim, and conceal it not: say: Babylon is taken, Bel is confounded, Merodach is overthrown, their graven things are confounded, their idols are overthrown."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quoniam ascendit contra eam gens ab aquilone quae ponet terram eius in solitudinem et non erit qui habitet in ea ab homine usque ad pecus et moti sunt et abierunt"
      en: "For a nation is come up against her out of the north, which shall make her land desolate: and there shall be none to dwell therein, from man even to beast:: yea they are removed, and gone away."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "in diebus illis et in tempore illo ait Dominus venient filii Israhel ipsi et filii Iuda simul ambulantes et flentes properabunt et Dominum Deum suum quaerent"
      en: "In those days, and at that time, saith the Lord, the children of Israel shall come, they and the children of Juda together: going and weeping they shall make haste, and shall seek the Lord their God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "in Sion interrogabunt viam huc facies eorum venient et adponentur ad Dominum foedere sempiterno quod nulla oblivione delebitur"
      en: "They shall ask the way to Sion, their faces are hitherward. They shall come, and shall be joined to the Lord by an everlasting covenant, which shall never be forgotten."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "grex perditus factus est populus meus pastores eorum seduxerunt eos feceruntque vagari in montibus de monte in collem transierunt obliti sunt cubilis sui"
      en: "My people have been a lost flock, their shepherds have caused them to go astray, and have made them wander in the mountains: they have gone from mountain to hill, they have forgotten their resting place."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "omnes qui invenerunt comederunt eos et hostes eorum dixerunt non peccavimus pro eo quod peccaverunt Domino decori iustitiae et expectationi patrum eorum Domino"
      en: "All that found them, have devoured them: and their enemies said: We have not sinned in so doing: because they have sinned against the Lord the beauty of justice, and against the Lord the hope of their fathers."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "recedite de medio Babylonis et de terra Chaldeorum egredimini et estote quasi hedi ante greges"
      en: "Remove out of the midst of Babylon, and go forth out of the land of the Chaldeans: and be ye as kids at the head of the flock."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quoniam ecce ego suscito et adducam in Babylonem congregationem gentium magnarum de terra aquilonis et praeparabuntur adversum eam et inde capietur sagitta eius quasi viri fortis interfectoris non revertetur vacua"
      en: "For behold I raise up, and will bring against Babylon an assembly of great nations from the land of the north: and they shall be prepared against her, and from thence she shall be taken: their arrows, like those of a mighty man, a destroyer, shall not return in vain."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et erit Chaldea in praedam omnes vastantes eam replebuntur ait Dominus"
      en: "And Chaldea shall be made a prey: all that waste her shall be filled, saith the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quoniam exultatis et magna loquimini diripientes hereditatem meam quoniam effusi estis sicut vitulus super herbam et mugistis ut tauri"
      en: "Because you rejoice, and speak great things, pillaging my inheritance: because you are spread abroad as calves upon the grass, and have bellowed as bulls."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "confusa est mater vestra nimis et adaequata pulveri quae genuit vos ecce novissima erit in gentibus deserta invia et arens"
      en: "Your mother is confounded exceedingly, and she that bore you is made even with the dust: behold she shall be the last among the nations, a wilderness unpassable, and dry."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ab ira Domini non habitabitur sed redigetur tota in solitudinem omnis qui transit per Babylonem stupebit et sibilabit super universis plagis eius"
      en: "Because of the wrath of the Lord it shall not be inhabited, but shall be wholly desolate: every one that shall pass by Babylon, shall be astonished, and hiss at all her plagues."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "praeparamini contra Babylonem per circuitum omnes qui intenditis arcum debellate eam non parcatis iaculis quia Domino peccavit"
      en: "Prepare yourselves against Babylon round about, all you that bend the bow: fight against her, spare not arrows: because she hath sinned against the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "clamate adversus eam ubique dedit manum ceciderunt fundamenta eius destructi sunt muri eius quoniam ultio Domini est ultionem accipite de ea sicut fecit facite ei"
      en: "Shout against her, she hath every where given her hand, her foundations are fallen, her walls are thrown down, for it is the vengeance of the Lord. Take vengeance upon her: as she hath done, so do to her."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "disperdite satorem de Babylone et tenentem falcem in tempore messis a facie gladii columbae unusquisque ad populum suum convertetur et singuli ad terram suam fugient"
      en: "Destroy the sower out of Babylon, and him that holdeth the sickle in the time of harvest: for fear of the sword of the dove every man shall return to his people, and every one shall flee to his own land."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "grex dispersus Israhel leones eiecerunt eum primus comedit eum rex Assur iste novissimus exossavit eum Nabuchodonosor rex Babylonis"
      en: "Israel is a scattered flock, the lions have driven him away: first the king of Assyria devoured him: and last this Nabuchodonosor king of Babylon hath broken his bones."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "propterea haec dicit Dominus exercituum Deus Israhel ecce ego visitabo regem Babylonis et terram eius sicut visitavi regem Assur"
      en: "Therefore thus saith the Lord of hosts the God of Israel: Behold I will visit the king of Babylon and his land, as I have visited the king of Assyria."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et reducam Israhel ad habitaculum suum et pascetur Carmelum et Basan et in monte Ephraim et Galaad saturabitur anima eius"
      en: "And I will bring Israel again to his habitation: and he shall feed on Carmel, and Bason, and his soul shall be satisfied in mount Ephraim, and Galaad."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "in diebus illis et in tempore illo ait Dominus quaeretur iniquitas Israhel et non erit et peccatum Iuda et non invenietur quoniam propitius ero eis quos reliquero"
      en: "In those days, and at that time, saith the Lord, the iniquity of Israel shall be sought for, and there shall be none: and the sin of Juda, and there shall none be found: for I will be merciful to them, whom I shall leave."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "super terram dominantium ascende et super habitatores eius visita dissipa et interfice quae post eos sunt ait Dominus et fac iuxta omnia quae praecepi tibi"
      en: "Go up against the land of the rulers, and punish the inhabitants thereof, waste, and destroy all behind them, saith the Lord: and do according to all that I have commanded thee."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "vox belli in terra et contritio magna"
      en: "A noise of war in the land, and a great destruction."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quomodo confractus est et contritus est malleus universae terrae quomodo versa est in desertum Babylon in gentibus"
      en: "How is the hammer of the whole earth broken, and destroyed! how is Babylon turned into a desert among the nations!"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "inlaqueavi te et capta es Babylon et nesciebas inventa es et adprehensa quoniam Dominum provocasti"
      en: "I have caused thee to fall into a snare, and thou art taken, O Babylon, and thou wast not aware of it: thou art found and caught, because thou hast provoked the Lord."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "aperuit Dominus thesaurum suum et protulit vasa irae suae quoniam opus est Domino Deo exercituum in terra Chaldeorum"
      en: "The Lord hath opened his armoury, and hath brought forth the weapons of his wrath : for the Lord the God of hosts hath a work to be done in the land of the Chaldeans."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "venite ad eam ab extremis finibus aperite ut exeant qui conculcent eam tollite de via lapides et redigite in acervos et interficite eam nec sit quicquam reliquum"
      en: "Come ye against her from the uttermost borders: open that they may go forth that shall tread her down: take the stones out of the way, and make heaps, and destroy her: and let nothing of her be left."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "dissipate universos fortes eius descendant in occisionem vae eis quia venit dies eorum tempus visitationis eorum"
      en: "Destroy all her valiant men, let them go down to the slaughter: woe to them, for their day is come, the time of their visitation."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "vox fugientium et eorum qui evaserunt de terra Babylonis ut adnuntient in Sion ultionem Domini Dei nostri ultionem templi eius"
      en: "The voice of them that flee, and of them that have escaped out of the land of Babylon: to declare in Sion the revenge of the Lord our God, the revenge of his temple."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "adnuntiate in Babylonem plurimis omnibus qui tendunt arcum consistite adversum eam per gyrum et nullus evadat reddite ei secundum opus suum iuxta omnia quae fecit facite illi quia contra Dominum erecta est adversum Sanctum Israhel"
      en: "Declare to many against Babylon, to all that bend the bow: stand together against her round about, and let nose escape; pay her according to her work: according to all that she hath done, do ye to her: for she hath lifted up herself against the Lord, against the Holy One of Israel."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "idcirco cadent iuvenes eius in plateis eius et omnes viri bellatores eius conticescent in die illa ait Dominus"
      en: "Therefore shall her young men fall in her streets: and all her men of war shall hold their peace in that day, saith the Lord."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ecce ego ad te superbe dicit Dominus Deus exercituum quia venit dies tuus tempus visitationis tuae"
      en: "Behold I come against thee, O proud one, saith the Lord the God of hosts: for thy day is come, the time of thy visitation."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et cadet superbus et corruet et non erit qui suscitet eum et succendam ignem in urbibus eius et devorabit omnia in circuitu eius"
      en: "And the proud one shall fall, he shall fall down, and there shall be none to lift him up: and I will kindle a fire in his cities, and it shall devour all round about him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "haec dicit Dominus exercituum calumniam sustinent filii Israhel et filii Iuda simul omnes qui ceperunt eos tenent nolunt dimittere eos"
      en: "Thus saith the Lord of hosts: The children of Israel, and the children of Juda are oppressed together: all that have taken them captives, hold them fast, they will not let them go."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "redemptor eorum Fortis Dominus exercituum nomen eius iudicio defendet causam eorum ut exterreat terram et commoveat habitatores Babylonis"
      en: "Their redeemer is strong, the Lord of hosts is his name : he will defend their cause in judgment, to terrify the land, and to disquiet the inhabitants of Babylon."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "gladius ad Chaldeos ait Dominus et ad habitatores Babylonis et ad principes et ad sapientes eius"
      en: "A sword is upon the Chaldeans, saith the Lord, and upon the inhabitants of Babylon, and upon her princes, and upon her wise men."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "gladius ad divinos eius qui stulti erunt gladius ad fortes illius qui timebunt"
      en: "A sword upon her diviners, and they shall be foolish: a sword upon her valiant ones, and they shall be dismayed."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "gladius ad equos eius et ad currus eius et ad omne vulgus quod est in medio eius et erunt quasi mulieres gladius ad thesauros eius qui diripientur"
      en: "A sword upon their horses, and upon their chariots, and upon all the people that are in the midst of her: and they shall become as women: a sword upon her treasures, and they shall be made a spoil."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "siccitas super aquas eius erit et arescent quia terra sculptilium est et in portentis gloriantur"
      en: "A drought upon her waters, and they shall be dried up: because it is a land of idols, and they glory in monstrous things."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "propterea habitabunt dracones cum fatuis ficariis et habitabunt in ea strutiones et non habitabitur ultra usque ad sempiternum nec extruetur usque ad generationem et generationem"
      en: "Therefore shall dragons dwell there with the fig fauns: and ostriches shall dwell therein, and it shall be no more inhabited for ever, neither shall it be built up from generation to generation."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "sicut subvertit Deus Sodomam et Gomorram et vicinas eius ait Dominus non habitabit ibi vir nec incolet eam filius hominis"
      en: "As the Lord overthrew Sodom and Gomorrha, and their neighbour cities, saith the Lord: no man shall dwell there, neither shall the son of man inhabit it."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "ecce populus venit ab aquilone et gens magna et reges multi consurgent a finibus terrae"
      en: "Behold a people cometh from the north, and a great nation, and many kings shall rise from the ends of the earth."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "arcum et scutum adprehendent crudeles sunt et inmisericordes vox eorum quasi mare sonabit et super equos ascendent sicut vir paratus ad proelium contra te filia Babylon"
      en: "They shall take the bow and the shield: they are cruel and unmerciful: their voice shall roar like the sea, and they shall ride upon horses: like a man prepared for battle against thee, O daughter of Babylon."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "audivit rex Babylonis famam eorum et dissolutae sunt manus eius angustia adprehendit eum dolor quasi parturientem"
      en: "The king of Babylon hath heard the report of them, and his hands are grown feeble: anguish hath taken hold of him, pangs as a, woman in labour."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "ecce quasi leo ascendet de superbia Iordanis ad pulchritudinem robustam quia subito currere eum faciam ad illam et quis erit electus quem praeponam ei quis enim similis mei et quis sustinebit me et quis est iste pastor qui resistat vultui meo"
      en: "Behold he shall come up like a lion from the swelling of the Jordan to the strong and beautiful: for I will make him run suddenly upon her: and who shall be the chosen one whom I may appoint over her? for who is like to me? and who shall bear up against me? and who is that shepherd that can withstand my countenance?"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "propterea audite consilium Domini quod mente concepit adversum Babylonem et cogitationes eius quas cogitavit super terram Chaldeorum nisi detraxerint eos parvuli gregum nisi dissipatum fuerit cum ipsis habitaculum eorum"
      en: "Therefore hear ye the counsel of the Lord, which he hath taken against Babylon: and his thoughts which he hath thought against the land of the Chaldeans: surely the little ones of the flocks shall pull them down, of a truth their habitation shall be destroyed with them."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "a voce captivitatis Babylonis commota est terra et clamor inter gentes auditus est"
      en: "At the noise of the taking of Babylon the earth is moved, and the cry is heard amongst the nations."
    status: { la: verified, en: verified }
