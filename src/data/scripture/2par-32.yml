# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 32
verses:
  - n: 1
    text:
      la: "post quae et huiuscemodi veritatem venit Sennacherib rex Assyriorum et ingressus Iudam obsedit civitates munitas volens eas capere"
      en: "After these things, and this truth, Sennacherib king of the Assyrians came and entered into Juda, and besieged the fenced cities, desiring to take them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quod cum vidisset Ezechias venisse scilicet Sennacherib et totum belli impetum verti contra Hierusalem"
      en: "And when Ezechias saw that Sennacherib was come, and that the whole force of the war was turning against Jerusalem,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "inito cum principibus consilio virisque fortissimis ut obturarent capita fontium quae erant extra urbem et hoc omnium decernente sententia"
      en: "He took counsel with the princes, and the most valiant men, to stop up the heads of the springs, that were without the city: and as they were all of this mind,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "congregavit plurimam multitudinem et obturaverunt cunctos fontes et rivum qui fluebat in medio terrae dicentes ne veniant reges Assyriorum et inveniant aquarum abundantiam"
      en: "He gathered together a very great multitude, and they stopped up all the springs, and the brook, that ran through the midst of the land, saying: Lest the kings of the Assyrians should come, and And abundance of water."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "aedificavit quoque agens industrie omnem murum qui fuerat dissipatus et extruxit turres desuper et forinsecus alterum murum instauravitque Mello in civitate David et fecit universi generis armaturam et clypeos"
      en: "He built up also with great diligence all the wall that had been broken down, and built towers upon it, and another wall without: and he repaired Mello in the city of David, and made all sorts of arms and shields:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "constituitque principes bellatorum in exercitu et convocavit universos in platea portae civitatis ac locutus est ad cor eorum dicens"
      en: "And he appointed captains of the soldiers of the army: and he called them all together in the street of the gate of the city, and spoke to their heart, saying:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "viriliter agite et confortamini nolite timere nec paveatis regem Assyriorum et universam multitudinem quae est cum eo multo enim plures nobiscum sunt quam cum illo"
      en: "Behave like men, and take courage: be not afraid nor dismayed for the king of the Assyrians, nor for all the multitude that is with him: for there are many more with us than with him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cum illo est brachium carneum nobiscum Dominus Deus noster qui auxiliator est noster pugnatque pro nobis confortatusque est populus huiuscemodi verbis Ezechiae regis Iuda"
      en: "For with him is an arm of flesh: with us the Lord our God, who is our helper, and fighteth for us. And the people were encouraged with these words of Ezechias king of Juda."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quae postquam gesta sunt misit Sennacherib rex Assyriorum servos suos Hierusalem ipse enim cum universo exercitu obsidebat Lachis ad Ezechiam regem Iuda et ad omnem populum qui erat in urbe dicens"
      en: "After this, Sennacherib king of the Assyrians sent his servants to Jerusalem, (for he with all his army was besieging Lachis,) to Ezechias king of Juda, and to all the people that were in the city, saying:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "haec dicit Sennacherib rex Assyriorum in quo habentes fiduciam sedetis obsessi in Hierusalem"
      en: "Thus saith Sennacherib king of the Assyrians: In whom do you trust, that you sit still besieged in Jerusalem?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "num Ezechias decipit vos ut tradat morti in fame et siti adfirmans quod Dominus Deus vester liberet vos de manu regis Assyriorum"
      en: "Doth not Ezechias deceive you, to give you up to die by hunger and thirst, affirming that the Lord your God shall deliver you from the hand of the king of the Assyrians?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "numquid non iste est Ezechias qui destruxit excelsa illius et altaria et praecepit Iudae et Hierusalem dicens coram altari uno adorabitis et in ipso conburetis incensum"
      en: "Is it not this same Ezechias, that hath destroyed his high places, and his altars, and commanded Juda and Jerusalem, saying: You shall worship before one altar, and upon it you shall burn incense?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "an ignoratis quae ego fecerim et patres mei cunctis terrarum populis numquid praevaluerunt dii gentium omniumque terrarum liberare regionem suam de manu mea"
      en: "Know you not what I and my fathers have done to all the people of the lands? have the gods of any nations and lands been able to deliver their country out of my hand?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quis est de universis diis gentium quas vastaverunt patres mei qui potuerit eruere populum suum de manu mea ut possit etiam Deus vester eruere vos de hac manu"
      en: "Who is there among all the gods of the nations, which my fathers have destroyed, that could deliver his people out of my hand, that your God should be able to deliver you out of this hand?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "non vos ergo decipiat Ezechias nec vana persuasione deludat neque credatis ei si enim nullus potuit deus cunctarum gentium atque regnorum liberare populum suum de manu mea et de manu patrum meorum consequenter nec Deus vester poterit eruere vos de hac manu"
      en: "Therefore let not Ezechias deceive you, nor delude you with a vain persuasion, and do not believe him. For if no god of all the nations and kingdoms, could deliver his people out of my hand, and out of the hand of my fathers, consequently neither shall your God be able to deliver you out of my hand."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sed et alia multa locuti sunt servi eius contra Dominum Deum et contra Ezechiam servum eius"
      en: "And many other things did his servants speak against the Lord God, and against Ezechias his servant."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "epistulas quoque scripsit plenas blasphemiae in Dominum Deum Israhel et locutus est adversus eum sicut dii gentium ceterarum non potuerunt liberare populos suos de manu mea sic et Deus Ezechiae eruere non poterit populum suum de manu ista"
      en: "He wrote also letters full of blasphemy against the Lord the God of Israel, and he spoke against him: As the gods of other nations could not deliver their people out of my hand, so neither can the God of Ezechias deliver his people out of this hand."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "insuper et clamore magno lingua iudaica contra populum qui sedebat in muris Hierusalem personabat ut terreret eos et caperet civitatem"
      en: "Moreover he cried out with a loud voice, in the Jews' tongue, to the people that sat on the walls of Jerusalem, that he might frighten them, and take the city."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "locutusque est contra Deum Hierusalem sicut adversum deos populorum terrae opera manuum hominum"
      en: "And he spoke against the God of Jerusalem, as against the gods of the people of the earth, the works of the hands of men."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "oraverunt igitur Ezechias rex et Esaias filius Amos prophetes adversum hanc blasphemiam ac vociferati sunt usque in caelum"
      en: "And Ezechias the king, and Isaias the prophet the son of Amos, prayed against this blasphemy, and cried out to heaven."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et misit Dominus angelum qui percussit omnem virum robustum et bellatorem et principem exercitus regis Assyriorum reversusque est cum ignominia in terram suam cumque ingressus esset domum dei sui filii qui egressi fuerant de utero eius interfecerunt eum gladio"
      en: "And the Lord sent an angel who cut off all the stout men and the warriors, and the captains of the army of the king of the Assyrians: and he returned with disgrace into his own country. And when he was come into the house of his god, his sons that came out of his bowels, slew him with the sword."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "salvavitque Dominus Ezechiam et habitatores Hierusalem de manu Sennacherib regis Assyriorum et de manu omnium et praestitit ei quietem per circuitum"
      en: "And the Lord saved Ezechias and the inhabitants of Jerusalem, out of the hand of Sennacherib king of the Assyrians, and out of the hand of all, and gave them treasures on every side."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "multi etiam deferebant hostias et sacrificia Domino Hierusalem et munera Ezechiae regi Iuda qui exaltatus est post haec coram cunctis gentibus"
      en: "Many also brought victims, and sacrifices to the Lord to Jerusalem, and presents to Ezechias king of Juda: and he was magnified thenceforth in the sight of all nations."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "in diebus illis aegrotavit Ezechias usque ad mortem et oravit Dominum exaudivitque eum et dedit ei signum"
      en: "In those days Ezechias was sick even to death, and he prayed to the Lord: and he heard him, and gave him a sign."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "sed non iuxta beneficia quae acceperat retribuit quia elevatum est cor eius et facta est contra eum ira et contra Iudam ac Hierusalem"
      en: "But he did not render again according to the benefits which he had received, for his heart was lifted up: and wrath was enkindled against him, and against Juda and Jerusalem."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "humiliatusque est postea eo quod exaltatum fuisset cor eius tam ipse quam habitatores Hierusalem et idcirco non venit super eos ira Domini in diebus Ezechiae"
      en: "And he humbled himself afterwards, because his heart had been lifted up, both he and the inhabitants of Jerusalem: and therefore the wrath of the Lord came not upon them in the days of Ezechias."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "fuit autem Ezechias dives et inclitus valde et thesauros sibi plurimos congregavit argenti auri et lapidis pretiosi aromatum et armorum universi generis et vasorum magni pretii"
      en: "And Ezechias was rich, and very glorious, and he gathered himself great treasures of silver and of gold, and of precious stones, of spices, and of arms, of all kinds, and of vessels of great price."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "apothecas quoque frumenti vini et olei et praesepia omnium iumentorum caulasque pecoribus"
      en: "Storehouses also of corn, of wine, and of oil, and stalls for all beasts, and folds for cattle."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et urbes exaedificavit habebat quippe greges ovium et armentorum innumerabiles eo quod dedisset ei Dominus substantiam multam nimis"
      en: "And he built himself cities: for he had docks of sheep, and herds without number, for the Lord had given him very much substance."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ipse est Ezechias qui obturavit superiorem fontem aquarum Gion et avertit eas subter ad occidentem urbis David in omnibus operibus suis fecit prospere quae voluit"
      en: "This same Ezechias was, he that stopped the upper source of the waters of Gihon, and turned them away underneath toward the west of the city of David : in ail his works he did prosperously what he would."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "attamen in legatione principum Babylonis qui missi fuerant ad eum ut interrogarent de portento quod acciderat super terram dereliquit eum Deus ut temptaretur et nota fierent omnia quae erant in corde eius"
      en: "But yet in the embassy of the princes of Babylon, that were sent to him, to inquire of the wonder that had happened upon the earth, God left him that he might be tempted, and all things might be made known that were in his heart."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "reliqua autem sermonum Ezechiae et misericordiarum eius scripta sunt in visione Esaiae filii Amos prophetae et in libro regum Iuda et Israhel"
      en: "Now the rest of the acts of Ezechias, and of his mercies are written in the book of the kings of Juda and Israel."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "dormivitque Ezechias cum patribus suis et sepelierunt eum supra sepulchra filiorum David et celebravit eius exequias universus Iuda et omnes habitatores Hierusalem regnavitque Manasses filius eius pro eo"
      en: "And Ezechias slept with his fathers, m and they buried him above the sepulchres of the sons of David: and all Juda, and all the inhabitants of Jerusalem celebrated his funeral: and Manasses his son reigned in his stead."
    status: { la: verified, en: verified }
