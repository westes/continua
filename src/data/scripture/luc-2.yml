# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: luc
chapter: 2
verses:
  - n: 1
    text:
      la: "factum est autem in diebus illis exiit edictum a Caesare Augusto ut describeretur universus orbis"
      en: "And it came to pass, that in those days there went out a decree from Caesar Augustus, that the whole world should be enrolled."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "haec descriptio prima facta est praeside Syriae Cyrino"
      en: "This enrolling was first made by Cyrinus, the governor of Syria."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ibant omnes ut profiterentur singuli in suam civitatem"
      en: "And all went to be enrolled, every one into his own city."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ascendit autem et Ioseph a Galilaea de civitate Nazareth in Iudaeam civitatem David quae vocatur Bethleem eo quod esset de domo et familia David"
      en: "And Joseph also went up from Galilee, out of the city of Nazareth into Judea, to the city of David, which is called Bethlehem: because he was of the house and family of David,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ut profiteretur cum Maria desponsata sibi uxore praegnate"
      en: "To be enrolled with Mary his espoused wife, who was with child."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "factum est autem cum essent ibi impleti sunt dies ut pareret"
      en: "And it came to pass, that when they were there, her days were accomplished, that she should be delivered."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et peperit filium suum primogenitum et pannis eum involvit et reclinavit eum in praesepio quia non erat eis locus in diversorio"
      en: "And she brought forth her firstborn son, and wrapped him up in swaddling clothes, and laid him in a manger; because there was no room for them in the inn."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et pastores erant in regione eadem vigilantes et custodientes vigilias noctis supra gregem suum"
      en: "And there were in the same country shepherds watching, and keeping the night watches over their flock."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et ecce angelus Domini stetit iuxta illos et claritas Dei circumfulsit illos et timuerunt timore magno"
      en: "And behold an angel of the Lord stood by them, and the brightness of God shone round about them; and they feared with a great fear."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et dixit illis angelus nolite timere ecce enim evangelizo vobis gaudium magnum quod erit omni populo"
      en: "And the angel said to them: Fear not; for, behold, I bring you good tidings of great joy, that shall be to all the people:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quia natus est vobis hodie salvator qui est Christus Dominus in civitate David"
      en: "For, this day, is born to you a Saviour, who is Christ the Lord, in the city of David."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et hoc vobis signum invenietis infantem pannis involutum et positum in praesepio"
      en: "And this shall be a sign unto you. You shall find the infant wrapped in swaddling clothes, and laid in a manger."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et subito facta est cum angelo multitudo militiae caelestis laudantium Deum et dicentium"
      en: "And suddenly there was with the angel a multitude of the heavenly army, praising God, and saying:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "gloria in altissimis Deo et in terra pax in hominibus bonae voluntatis"
      en: "Glory to God in the highest; and on earth peace to men of good will."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et factum est ut discesserunt ab eis angeli in caelum pastores loquebantur ad invicem transeamus usque Bethleem et videamus hoc verbum quod factum est quod fecit Dominus et ostendit nobis"
      en: "And it came to pass, after the angels departed from them into heaven, the shepherds said one to another: Let us go over to Bethlehem, and let us see this word that is come to pass, which the Lord hath shewed to us."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et venerunt festinantes et invenerunt Mariam et Ioseph et infantem positum in praesepio"
      en: "And they came with haste; and they found Mary and Joseph, and the infant lying in the manger."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "videntes autem cognoverunt de verbo quod dictum erat illis de puero hoc"
      en: "And seeing, they understood of the word that had been spoken to them concerning this child."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et omnes qui audierunt mirati sunt et de his quae dicta erant a pastoribus ad ipsos"
      en: "And all that heard, wondered; and at those things that were told them by the shepherds."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Maria autem conservabat omnia verba haec conferens in corde suo"
      en: "But Mary kept all these words, pondering them in her heart."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et reversi sunt pastores glorificantes et laudantes Deum in omnibus quae audierant et viderant sicut dictum est ad illos"
      en: "And the shepherds returned, glorifying and praising God, for all the things they had heard and seen, as it was told unto them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et postquam consummati sunt dies octo ut circumcideretur vocatum est nomen eius Iesus quod vocatum est ab angelo priusquam in utero conciperetur"
      en: "And after eight days were accomplished, that the child should be circumcised, his name was called JESUS, which was called by the angel, before he was conceived in the womb."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et postquam impleti sunt dies purgationis eius secundum legem Mosi tulerunt illum in Hierusalem ut sisterent eum Domino"
      en: "And after the days of her purification, according to the law of Moses, were accomplished, they carried him to Jerusalem, to present him to the Lord:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sicut scriptum est in lege Domini quia omne masculinum adaperiens vulvam sanctum Domino vocabitur"
      en: "As it is written in the law of the Lord: Every male opening the womb shall be called holy to the Lord:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et ut darent hostiam secundum quod dictum est in lege Domini par turturum aut duos pullos columbarum"
      en: "And to offer a sacrifice, according as it is written in the law of the Lord, a pair of turtledoves, or two young pigeons:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et ecce homo erat in Hierusalem cui nomen Symeon et homo iste iustus et timoratus expectans consolationem Israhel et Spiritus Sanctus erat in eo"
      en: "And behold there was a man in Jerusalem named Simeon, and this man was just and devout, waiting for the consolation of Israel; and the Holy Ghost was in him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et responsum acceperat ab Spiritu Sancto non visurum se mortem nisi prius videret Christum Domini"
      en: "And he had received an answer from the Holy Ghost, that he should not see death, before he had seen the Christ of the Lord."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et venit in Spiritu in templum et cum inducerent puerum Iesum parentes eius ut facerent secundum consuetudinem legis pro eo"
      en: "And he came by the Spirit into the temple. And when his parents brought in the child Jesus, to do for him according to the custom of the law,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et ipse accepit eum in ulnas suas et benedixit Deum et dixit"
      en: "He also took him into his arms, and blessed God, and said:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "nunc dimittis servum tuum Domine secundum verbum tuum in pace"
      en: "Now thou dost dismiss thy servant, O Lord, according to thy word in peace;"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quia viderunt oculi mei salutare tuum"
      en: "Because my eyes have seen thy salvation,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "quod parasti ante faciem omnium populorum"
      en: "Which thou hast prepared before the face of all peoples:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "lumen ad revelationem gentium et gloriam plebis tuae Israhel"
      en: "A light to the revelation of the Gentiles, and the glory of thy people Israel."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et erat pater eius et mater mirantes super his quae dicebantur de illo"
      en: "And his father and mother were wondering at those things which were spoken concerning him."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et benedixit illis Symeon et dixit ad Mariam matrem eius ecce positus est hic in ruinam et resurrectionem multorum in Israhel et in signum cui contradicetur"
      en: "And Simeon blessed them, and said to Mary his mother: Behold this child is set for the fall, and for the resurrection of many in Israel, and for a sign which shall be contradicted;"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et tuam ipsius animam pertransiet gladius ut revelentur ex multis cordibus cogitationes"
      en: "And thy own soul a sword shall pierce, that, out of many hearts, thoughts may be revealed."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et erat Anna prophetissa filia Phanuhel de tribu Aser haec processerat in diebus multis et vixerat cum viro suo annis septem a virginitate sua"
      en: "And there was one Anna, a prophetess, the daughter of Phanuel, of the tribe of Aser; she was far advanced in years, and had lived with her husband seven years from her virginity."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et haec vidua usque ad annos octoginta quattuor quae non discedebat de templo ieiuniis et obsecrationibus serviens nocte ac die"
      en: "And she was a widow until fourscore and four years; who departed not from the temple, by fastings and prayers serving night and day."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et haec ipsa hora superveniens confitebatur Domino et loquebatur de illo omnibus qui expectabant redemptionem Hierusalem"
      en: "Now she, at the same hour, coming in, confessed to the Lord; and spoke of him to all that looked for the redemption of Israel."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et ut perfecerunt omnia secundum legem Domini reversi sunt in Galilaeam in civitatem suam Nazareth"
      en: "And after they had performed all things according to the law of the Lord, they returned into Galilee, to their city Nazareth."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "puer autem crescebat et confortabatur plenus sapientia et gratia Dei erat in illo"
      en: "And the child grew, and waxed strong, full of wisdom; and the grace of God was in him."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et ibant parentes eius per omnes annos in Hierusalem in die sollemni paschae"
      en: "And his parents went every year to Jerusalem, at the solemn day of the pasch,"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et cum factus esset annorum duodecim ascendentibus illis in Hierosolymam secundum consuetudinem diei festi"
      en: "And when he was twelve years old, they going up into Jerusalem, according to the custom of the feast,"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "consummatisque diebus cum redirent remansit puer Iesus in Hierusalem et non cognoverunt parentes eius"
      en: "And having fulfilled the days, when they returned, the child Jesus remained in Jerusalem; and his parents knew it not."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "existimantes autem illum esse in comitatu venerunt iter diei et requirebant eum inter cognatos et notos"
      en: "And thinking that he was in the company, they came a day's journey, and sought him among their kinsfolks and acquaintance."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et non invenientes regressi sunt in Hierusalem requirentes eum"
      en: "And not finding him, they returned into Jerusalem, seeking him."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et factum est post triduum invenerunt illum in templo sedentem in medio doctorum audientem illos et interrogantem"
      en: "And it came to pass, that, after three days, they found him in the temple, sitting in the midst of the doctors, hearing them, and asking them questions."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "stupebant autem omnes qui eum audiebant super prudentia et responsis eius"
      en: "And all that heard him were astonished at his wisdom and his answers."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et videntes admirati sunt et dixit mater eius ad illum fili quid fecisti nobis sic ecce pater tuus et ego dolentes quaerebamus te"
      en: "And seeing him, they wondered. And his mother said to him: Son, why hast thou done so to us? behold thy father and I have sought thee sorrowing."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "et ait ad illos quid est quod me quaerebatis nesciebatis quia in his quae Patris mei sunt oportet me esse"
      en: "And he said to them: How is it that you sought me? did you not know, that I must be about my father's business?"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "et ipsi non intellexerunt verbum quod locutus est ad illos"
      en: "And they understood not the word that he spoke unto them."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "et descendit cum eis et venit Nazareth et erat subditus illis et mater eius conservabat omnia verba haec in corde suo"
      en: "And he went down with them, and came to Nazareth, and was subject to them. And his mother kept all these words in her heart."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "et Iesus proficiebat sapientia aetate et gratia apud Deum et homines"
      en: "And Jesus advanced in wisdom, and age, and grace with God and men."
    status: { la: verified, en: verified }
