# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 39
verses:
  - n: 1
    text:
      la: "Igitur Joseph ductus est in Aegyptum, emitque eum Putiphar eunuchus Pharaonis, princeps exercitus, vir aegyptius, de manu Ismaelitarum, a quibus perductus erat."
      en: "And Joseph was brought into Egypt, and Putiphar an eunuch of Pharao, chief captain of the army, an Egyptian, bought him of the Ismaelites, by whom he was brought."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fuitque Dominus cum eo, et erat vir in cunctis prospere agens: habitavitque in domo domini sui,"
      en: "And the Lord was with him, and he was a prosperous man in all things: and he dwelt in his master's house,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "qui optime noverat Dominum esse cum eo, et omnia, quae gerebat, ab eo dirigi in manu illius."
      en: "Who knew very well that the Lord was with him, and made all that he did to prosper in his hand."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Invenitque Joseph gratiam coram domino suo, et ministrabat ei: a quo praepositus omnibus gubernabat creditam sibi domum, et universa quae ei tradita fuerant:"
      en: "And Joseph found favour in the sight of his master, and ministered to him: and being set over all by him, he governed the house committed to him, and all things that were delivered to him:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "benedixitque Dominus domui Aegyptii propter Joseph, et multiplicavit tam in aedibus quam in agris cunctam ejus substantiam:"
      en: "And the Lord blessed the house of the Egyptian for Joseph's sake, and multiplied all his substance, both at home, and in the fields."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "nec quidquam aliud noverat, nisi panem quo vescebatur. Erat autem Joseph pulchra facie, et decorus aspectu."
      en: "Neither knew he any other thing, but the bread which he ate. And Joseph was of a beautiful countenance, and comely to behold."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Post multos itaque dies injecit domina sua oculos suos in Joseph, et ait: Dormi mecum."
      en: "And after many days his mistress cast her eyes on Joseph, and said: Lie with me."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Qui nequaquam acquiescens operi nefario, dixit ad eam: Ecce dominus meus, omnibus mihi traditis, ignorat quid habeat in domo sua:"
      en: "But he, in no wise consenting to that wicked act, said to her: Behold, my master hath delivered all things to me, and knoweth not what he hath in his own house:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "nec quidquam est quod non in mea sit potestate, vel non tradiderit mihi, praeter te, quae uxor ejus es: quomodo ergo possum hoc malum facere, et peccare in Deum meum?"
      en: "Neither is there any thing which is not in my power, or that he hath not delivered to me, but thee, who art his wife: how then can I do this wicked thing, and sin against my God?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Hujuscemodi verbis per singulos dies, et mulier molesta erat adolescenti: et ille recusabat stuprum."
      en: "With such words as these day by day, both the woman was importunate with the young man, and he refused the adultery."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Accidit autem quadam die ut intraret Joseph domum, et operis quippiam absque arbitris faceret:"
      en: "Now it happened on a certain day, that Joseph went into the house, and was doing some business without any man with him:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et illa, apprehensa lacinia vestimenti ejus, diceret: Dormi mecum. Qui relicto in manu ejus pallio fugit, et egressus est foras."
      en: "And she catching the skirt of his garment, said: Lie with me. But he leaving the garment in her hand, fled, and went out."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Cumque vidisset mulier vestem in manibus suis, et se esse contemptam,"
      en: "And when the woman saw the garment in her hands, and herself disregarded,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "vocavit ad se homines domus suae, et ait ad eos: En introduxit virum hebraeum, ut illuderet nobis: ingressus est ad me, ut coiret mecum: cumque ego succlamassem,"
      en: "She called to her the men of her house, and said to them: See, he hath brought in a Hebrew, to abuse us: he came in to me, to lie with me: and when I cried out,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et audisset vocem meam, reliquit pallium quod tenebam, et fugit foras."
      en: "And he heard my voice, he left the garment that I held, and got him out."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "In argumentum ergo fidei retentum pallium ostendit marito revertenti domum,"
      en: "For a proof therefore of her fidelity, she kept the garment, and shewed it to her husband when he returned home:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ait: Ingressus est ad me servus hebraeus quem adduxisti, ut illuderet mihi:"
      en: "And said: The Hebrew servant, whom thou hast brought, came to me to abuse me."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cumque audisset me clamare, reliquit pallium quod tenebam, et fugit foras."
      en: "And when he heard me cry, he left the garment which I held, and fled out."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "His auditis dominus, et nimium credulus verbis conjugis, iratus est valde:"
      en: "His master hearing these things, and giving too much credit to his wife's words, was very angry."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "tradiditque Joseph in carcerem, ubi vincti regis custodiebantur, et erat ibi clausus."
      en: "And cast Joseph into the prison, where the king's prisoners were kept, and he was there shut up."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Fuit autem Dominus cum Joseph, et misertus illius dedit ei gratiam in conspectu principis carceris."
      en: "But the Lord was with Joseph and having mercy upon him gave him favour in the sight of the chief keeper of the prison:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Qui tradidit in manu illius universos vinctos qui in custodia tenebantur: et quidquid fiebat, sub ipso erat."
      en: "Who delivered into his hand all the prisoners that were kept in custody: and whatsoever was done was under him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Nec noverat aliquid, cunctis ei creditis: Dominus enim erat cum illo, et omnia opera ejus dirigebat."
      en: "Neither did he himself know any thing, having committed all things to him: for the Lord was with him, and made all that he did to prosper."
    status: { la: verified, en: verified }
