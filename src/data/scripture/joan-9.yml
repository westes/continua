# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: joan
chapter: 9
verses:
  - n: 1
    text:
      la: "et praeteriens vidit hominem caecum a nativitate"
      en: "And Jesus passing by, saw a man, who was blind from his birth:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et interrogaverunt eum discipuli sui rabbi quis peccavit hic aut parentes eius ut caecus nasceretur"
      en: "And his disciples asked him: Rabbi, who hath sinned, this man, or his parents, that he should be born blind?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "respondit Iesus neque hic peccavit neque parentes eius sed ut manifestetur opera Dei in illo"
      en: "Jesus answered: Neither hath this man sinned, nor his parents; but that the works of God should be made manifest in him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "me oportet operari opera eius qui misit me donec dies est venit nox quando nemo potest operari"
      en: "I must work the works of him that sent me, whilst it is day: the night cometh, when no man can work."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quamdiu in mundo sum lux sum mundi"
      en: "As long as I am in the world, I am the light of the world."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "haec cum dixisset expuit in terram et fecit lutum ex sputo et linuit lutum super oculos eius"
      en: "When he had said these things, he spat on the ground, and made clay of the spittle, and spread the clay on his eyes,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et dixit ei vade lava in natatoria Siloae quod interpretatur Missus abiit ergo et lavit et venit videns"
      en: "And said to him: Go, wash in the pool of Siloe, which is interpreted, Sent. He went therefore, and washed, and he came seeing."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "itaque vicini et qui videbant eum prius quia mendicus erat dicebant nonne hic est qui sedebat et mendicabat alii dicebant quia hic est"
      en: "The neighbours therefore, and they who had seen him before that he was a beggar, said: Is not this he that sat and begged? Some said: This is he."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "alii autem nequaquam sed similis est eius ille dicebat quia ego sum"
      en: "But others said: No, but he is like him. But he said: I am he."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dicebant ergo ei quomodo aperti sunt oculi tibi"
      en: "They said therefore to him: How were thy eyes opened?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "respondit ille homo qui dicitur Iesus lutum fecit et unxit oculos meos et dixit mihi vade ad natatoriam Siloae et lava et abii et lavi et vidi"
      en: "He answered: That man that is called Jesus made clay, and anointed my eyes, and said to me: Go to the pool of Siloe, and wash. And I went, I washed, and I see."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dixerunt ei ubi est ille ait nescio"
      en: "And they said to him: Where is he? He saith: I know not."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "adducunt eum ad Pharisaeos qui caecus fuerat"
      en: "They bring him that had been blind to the Pharisees."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "erat autem sabbatum quando lutum fecit Iesus et aperuit oculos eius"
      en: "Now it was the sabbath, when Jesus made the clay, and opened his eyes."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "iterum ergo interrogabant eum Pharisaei quomodo vidisset ille autem dixit eis lutum posuit mihi super oculos et lavi et video"
      en: "Again therefore the Pharisees asked him, how he had received his sight. But he said to them: He put clay upon my eyes, and I washed, and I see."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dicebant ergo ex Pharisaeis quidam non est hic homo a Deo quia sabbatum non custodit alii dicebant quomodo potest homo peccator haec signa facere et scisma erat in eis"
      en: "Some therefore of the Pharisees said: This man is not of God, who keepeth not the sabbath. But others said: How can a man that is a sinner do such miracles? And there was a division among them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dicunt ergo caeco iterum tu quid dicis de eo qui aperuit oculos tuos ille autem dixit quia propheta est"
      en: "They say therefore to the blind man again: What sayest thou of him that hath opened they eyes? And he said: He is a prophet."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "non crediderunt ergo Iudaei de illo quia caecus fuisset et vidisset donec vocaverunt parentes eius qui viderat"
      en: "The Jews then did not believe concerning him, that he had been blind, and had received his sight, until they called the parents of him that had received his sight,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et interrogaverunt eos dicentes hic est filius vester quem vos dicitis quia caecus natus est quomodo ergo nunc videt"
      en: "And asked them, saying: Is this your son, who you say was born blind? How then doth he now see?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "responderunt eis parentes eius et dixerunt scimus quia hic est filius noster et quia caecus natus est"
      en: "His parents answered them, and said: We know that this is our son, and that he was born blind:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quomodo autem nunc videat nescimus aut quis eius aperuit oculos nos nescimus ipsum interrogate aetatem habet ipse de se loquatur"
      en: "But how he now seeth, we know not; or who hath opened his eyes, we know not: ask himself: he is of age, let him speak for himself."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "haec dixerunt parentes eius quia timebant Iudaeos iam enim conspiraverant Iudaei ut si quis eum confiteretur Christum extra synagogam fieret"
      en: "These things his parents said, because they feared the Jews: for the Jews had already agreed among themselves, that if any man should confess him to be Christ, he should be put out of the synagogue."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "propterea parentes eius dixerunt quia aetatem habet ipsum interrogate"
      en: "Therefore did his parents say: He is of age, ask himself."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "vocaverunt ergo rursum hominem qui fuerat caecus et dixerunt ei da gloriam Deo nos scimus quia hic homo peccator est"
      en: "They therefore called the man again that had been blind, and said to him: Give glory to God. We know that this man is a sinner."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "dixit ergo ille si peccator est nescio unum scio quia caecus cum essem modo video"
      en: "He said therefore to them: If he be a sinner, I know not: one thing I know, that whereas I was blind, now I see."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "dixerunt ergo illi quid fecit tibi quomodo aperuit tibi oculos"
      en: "They said then to him: What did he to thee? How did he open thy eyes?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "respondit eis dixi vobis iam et audistis quid iterum vultis audire numquid et vos vultis discipuli eius fieri"
      en: "He answered them: I have told you already, and you have heard: why would you hear it again? will you also become his disciples?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "maledixerunt ei et dixerunt tu discipulus illius es nos autem Mosi discipuli sumus"
      en: "They reviled him therefore, and said: Be thou his disciple; but we are the disciples of Moses."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "nos scimus quia Mosi locutus est Deus hunc autem nescimus unde sit"
      en: "We know that God spoke to Moses: but as to this man, we know not from whence he is."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "respondit ille homo et dixit eis in hoc enim mirabile est quia vos nescitis unde sit et aperuit meos oculos"
      en: "The man answered, and said to them: Why, herein is a wonderful thing, that you know not from whence he is, and he hath opened my eyes."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "scimus autem quia peccatores Deus non audit sed si quis Dei cultor est et voluntatem eius facit hunc exaudit"
      en: "Now we know that God doth not hear sinners: but if a man be a server of God, and doth his will, him he heareth."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "a saeculo non est auditum quia aperuit quis oculos caeci nati"
      en: "From the beginning of the world it hath not been heard, that any man hath opened the eyes of one born blind."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "nisi esset hic a Deo non poterat facere quicquam"
      en: "Unless this man were of God, he could not do any thing."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "responderunt et dixerunt ei in peccatis natus es totus et tu doces nos et eiecerunt eum foras"
      en: "They answered, and said to him: Thou wast wholly born in sins, and dost thou teach us? And they cast him out."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "audivit Iesus quia eiecerunt eum foras et cum invenisset eum dixit ei tu credis in Filium Dei"
      en: "Jesus heard that they had cast him out: and when he had found him, he said to him: Dost thou believe in the Son of God?"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "respondit ille et dixit quis est Domine ut credam in eum"
      en: "He answered, and said: Who is he, Lord, that I may believe in him?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et dixit ei Iesus et vidisti eum et qui loquitur tecum ipse est"
      en: "And Jesus said to him: Thou hast both seen him; and it is he that talketh with thee."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "at ille ait credo Domine et procidens adoravit eum"
      en: "And he said: I believe, Lord. And falling down, he adored him."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "dixit ei Iesus in iudicium ego in hunc mundum veni ut qui non vident videant et qui vident caeci fiant"
      en: "And Jesus said: For judgment I am come into this world; that they who see not, may see; and they who see, may become blind."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et audierunt ex Pharisaeis qui cum ipso erant et dixerunt ei numquid et nos caeci sumus"
      en: "And some of the Pharisees, who were with him, heard: and they said unto him: Are we also blind?"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "dixit eis Iesus si caeci essetis non haberetis peccatum nunc vero dicitis quia videmus peccatum vestrum manet"
      en: "Jesus said to them: If you were blind, you should not have sin: but now you say: We see. Your sin remaineth."
    status: { la: verified, en: verified }
