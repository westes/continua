# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1reg
chapter: 22
verses:
  - n: 1
    text:
      la: "Abiit ergo David inde, et fugit in speluncam Odollam. Quod cum audissent fratres ejus, et omnis domus patris ejus, descenderunt ad eum illuc."
      en: "David therefore went from thence and fled to the cave of Odollam. And when his brethren, and all his father's house had heard of it, they went down to him thither;"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et convenerunt ad eum omnes, qui erant in angustia constituti, et oppressi aere alieno, et amaro animo: et factus est eorum princeps, fueruntque cum eo quasi quadringenti viri."
      en: "And all that were in distress and oppressed with debt, and under affliction of mind gathered themselves unto him: and he became their prince, and there were with him about four hundred men."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et profectus est David inde in Maspha, quae est Moab: et dixit ad regem Moab: Maneat, oro, pater meus et mater mea vobiscum, donec sciam quid faciat mihi Deus."
      en: "And David departed from thence into Maspha of Moab: and he said to the king of Moab: Let my father and my mother tarry with you, I beseech thee, till I know what God will do for me."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et reliquit eos ante faciem regis Moab: manseruntque apud eum cunctis diebus, quibus David fuit in praesidio."
      en: "And he left them under the eyes of the king of Moab, and they abode with him all the days that David was in the hold."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dixitque Gad propheta ad David: Noli manere in praesidio: proficiscere, et vade in terram Juda. Et profectus est David, et venit in saltum Haret."
      en: "And Gad the prophet said to David: Abide not in the hold, depart, and go into the land of Juda. And David departed, and came into the forest of Haret."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et audivit Saul quod apparuisset David, et viri qui erant cum eo. Saul autem cum maneret in Gabaa, et esset in nemore, quod est in Rama, hastam manu tenens, cunctique servi ejus circumstarent eum,"
      en: "And Saul heard that David was seen, and the men that were with him. Now whilst Saul abode in Gabaa, and was in the wood, which is by Rama, having his spear in his hand, and all his servants were standing about him,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ait ad servos suos qui assistebant ei: Audite nunc filii Jemini: numquid omnibus vobis dabit filius Isai agros, et vineas, et universos vos faciet tribunos, et centuriones?"
      en: "He said to his servants that stood about him: Hear me now, ye sons of Jemini: will the son of Isai give everyone of you fields, and vineyards, and make you all tribunes, and centurions:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quoniam conjurastis omnes adversum me, et non est qui mihi renuntiet, maxime cum et filius meus foedus inierit cum filio Isai. Non est qui vicem meam doleat ex vobis, nec qui annuntiet mihi: eo quod suscitaverit filius meus servum meum adversum me, insidiantem mihi usque hodie."
      en: "That all of you have conspired against me, and there is no one to inform me, especially when even my son hath entered into league with the soil of Isai? There is not one of you that pitieth my case, nor that giveth me any information: because my son hath raised up my servant against me, plotting against me to this day."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Respondens autem Doeg Idumaeus, qui assistebat, et erat primus inter servos Saul: Vidi, inquit, filium Isai in Nobe apud Achimelech filium Achitob sacerdotem."
      en: "And Doeg the Edomite who stood by, and was the chief among the servants of Saul, answering, said: I saw the son of Isai, in Nobe with Achimelech the son of Achitob the priest."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Qui consuluit pro eo Dominum, et cibaria dedit ei: sed et gladium Goliath Philisthaei dedit illi."
      en: "And he consulted the Lord for him, and gave him victuals, and gave him the sword of Goliath the Philistine."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Misit ergo rex ad accersendum Achimelech sacerdotem filium Achitob, et omnem domum patris ejus, sacerdotum, qui erant in Nobe, qui universi venerunt ad regem."
      en: "Then the king sent to call for Achimelech the priest the son of Achitob, and all his father's house, the priests that were in Nobe, and they came all of them to the king."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et ait Saul ad Achimelech: Audi fili Achitob. Qui respondit: Praesto sum, domine."
      en: "And Saul said to Achimelech: Hear, thou son of Achitob. He answered: Here I am, my lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dixitque ad eum Saul: Quare conjurastis adversum me, tu et filius Isai, et dedisti ei panes et gladium, et consuluisti pro eo Deum, ut consurgeret adversum me, insidiator usque hodie permanens?"
      en: "And Saul said to him: Why have you conspired against me, thou, and the son of Isai, and thou hast given him bread and a sword, and hast consulted the Lord for him, that he should rise up against me, continuing a traitor to this day."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Respondensque Achimelech regi, ait: Et quis in omnibus servis tuis, sicut David fidelis, et gener regis, et pergens ad imperium tuum, et gloriosus in domo tua?"
      en: "And Achimelech answering the king, said: And who amongst all thy servants is so faithful as David, who is the king's son in law, and goeth forth at thy bidding, and is honourable in thy house?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Num hodie coepi pro eo consulere Deum? absit hoc a me: ne suspicetur rex adversus servum suum rem hujuscemodi, in universa domo patris mei: non enim scivit servus tuus quidquam super hoc negotio, vel modicum vel grande."
      en: "Did I begin today to consult the Lord for him? far be this from me: let not the king suspect such a thing against his servant, or any one in all my father's house: for thy servant knew nothing of this matter, either little or great."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Dixitque rex: Morte morieris Achimelech, tu et omnis domus patris tui."
      en: "And the king said: Dying thou shalt die, Achimelech, thou and all thy father's house."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et ait rex emissariis, qui circumstabant eum: Convertimini, et interficite sacerdotes Domini: nam manus eorum cum David est: scientes quod fugisset, et non indicaverunt mihi. Noluerunt autem servi regis extendere manus suas in sacerdotes Domini."
      en: "And the king said to the messengers that stood about him: Turn, and kill the priests of the Lord, for their hand is with David, because they knew that he was fled, and they told it not to me. And the king's servants would not put forth their hands against the priests of the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et ait rex ad Doeg: Convertere tu, et irrue in sacerdotes. Conversusque Doeg Idumaeus, irruit in sacerdotes, et trucidavit in die illa octoginta quinque viros vestitos ephod lineo."
      en: "And the king said to Doeg: Turn thou, and fall upon the priests. And Doeg the Edomite turned, and fell upon the priests and slew in that day eighty-five men that wore the linen ephod."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Nobe autem civitatem sacerdotum percussit in ore gladii, viros et mulieres, et parvulos, et lactentes, bovemque, et asinum, et ovem in ore gladii."
      en: "And Nobe the city of the priests he smote with the edge of his sword, both men and women, children, and sucklings, and ox and ass, and sheep with the edge of the sword."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Evadens autem unus filius Achimelech, filii Achitob, cujus nomen erat Abiathar, fugit ad David,"
      en: "But one of the sons of Achimelech the son of Achitob, whose name was Abiathar, escaped, and fled to David,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et annuntiavit ei quod occidisset Saul sacerdotes Domini."
      en: "And told him that Saul had slain the priests of the Lord."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et ait David ad Abiathar: Sciebam in die illa, quod cum ibi esset Doeg Idumaeus, procul dubio annuntiaret Sauli: ego sum reus omnium animarum patris tui."
      en: "And David said to Abiathar: I knew that day when Doeg the Edomite was there, that without doubt he would tell Saul: I have been the occasion of the death of all the souls of thy father's house."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Mane mecum, ne timeas: si quis quaesierit animam meam, quaeret et animam tuam, mecumque servaberis."
      en: "Abide thou with me, fear not: for he that seeketh my life, seeketh thy life also, and with me thou shalt be saved."
    status: { la: verified, en: verified }
