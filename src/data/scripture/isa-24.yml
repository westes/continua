# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 24
verses:
  - n: 1
    text:
      la: "ecce Dominus dissipabit terram et nudabit eam et adfliget faciem eius et disperget habitatores eius"
      en: "Behold the Lord shall lay waste the earth, and shall strip it, and shall afflict the face thereof, and scatter abroad the inhabitants thereof."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et erit sicut populus sic sacerdos et sicut servus sic dominus eius sicut ancilla sic domina eius sicut emens sic ille qui vendit sicut fenerator sic is qui mutuum accipit sicut qui repetit sic qui debet"
      en: "And it shall be as with the people, so with the priest: and as with the servant, so with his master: as with the handmaid, so with her mistress: as with the buyer, so with the seller: as with the lender, so with the borrower: as with him that calleth for his money, so with him that oweth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dissipatione dissipabitur terra et direptione praedabitur Dominus enim locutus est verbum hoc"
      en: "With desolation shall the earth be laid waste, and it shall be utterly spoiled: for the Lord hath spoken this word."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "luxit et defluxit terra et infirmata est defluxit orbis infirmata est altitudo populi terrae"
      en: "The earth mourned, and faded away, and is weakened: the world faded away, the height of the people of the earth is weakened."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et terra interfecta est ab habitatoribus suis quia transgressi sunt leges mutaverunt ius dissipaverunt foedus sempiternum"
      en: "And the earth is infected by the in- habitants thereof: because they have transgressed the laws, they have changed the ordinance, they have broken the everlasting covenant."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "propter hoc maledictio vorabit terram et peccabunt habitatores eius ideoque insanient cultores eius et relinquentur homines pauci"
      en: "Therefore shall a curse devour the earth, and the inhabitants thereof shall sin: and therefore they that dwell therein shall be mad, and few men shall be left."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "luxit vindemia infirmata est vitis ingemuerunt omnes qui laetabantur corde"
      en: "The vintage hath mourned, the vine hath languished away, all the merryhearted have sighed."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cessavit gaudium tympanorum quievit sonitus laetantium conticuit dulcedo citharae"
      en: "The mirth of timbrels hath ceased, the noise of them that rejoice is ended, the melody of the harp is silent."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cum cantico non bibent vinum amara erit potio bibentibus illam"
      en: "They shall not drink wine with a song: the drink shall be bitter to them that drink it."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "adtrita est civitas vanitatis clausa est omnis domus nullo introeunte"
      en: "The city of vanity is broken down, every house is shut up, no man cometh in."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "clamor erit super vino in plateis deserta est omnis laetitia translatum est gaudium terrae"
      en: "There shall be a crying for wine in the streets: all mirth is forsaken: the joy of the earth is gone away."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "relicta est in urbe solitudo et calamitas opprimet portas"
      en: "Desolation is left in the city, and calamity shall oppress the gates."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quia haec erunt in medio terrae in medio populorum quomodo si paucae olivae quae remanserunt excutiantur ex olea et racemi cum fuerit finita vindemia"
      en: "For it shall be thus in the midst of the earth, in the midst of the people, as if a few olives, that remain, should be shaken out of the olive tree: or grapes, when the vintage is ended."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "hii levabunt vocem suam atque laudabunt cum glorificatus fuerit Dominus hinnient de mari"
      en: "These shall lift up their voice, and shall give praise: when the Lord shall be glorified, they shall make a joyful noise from the sea."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "propter hoc in doctrinis glorificate Dominum in insulis maris nomen Domini Dei Israhel"
      en: "Therefore glorify ye the Lord in instruction: the name of the Lord God of Israel in the islands of the sea."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "a finibus terrae laudes audivimus gloriam iusti et dixi secretum meum mihi secretum meum mihi vae mihi praevaricantes praevaricati sunt et praevaricatione transgressorum praevaricati sunt"
      en: "From the ends of the earth we have heard praises, the glory of the just one. And I said: My secret to myself, my secret to myself, woe is me: the prevaricators have prevaricated, and with the prevarication of transgressors they have prevaricated."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "formido et fovea et laqueus super te qui habitator es terrae"
      en: "Fear, and the pit, and the snare are upon thee, O thou inhabitant of the earth."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et erit qui fugerit a voce formidinis cadet in foveam et qui se explicuerit de fovea tenebitur laqueo quia cataractae de excelsis apertae sunt et concutientur fundamenta terrae"
      en: "And it shall come to pass, that he that shall flee from the noise of the fear, shall fall into the pit: and he that shall rid himself out of the pit, shall be taken in the snare: for the flood-gates from on high are opened, and the foundations of the earth shall be shaken."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "confractione confringetur terra contritione conteretur terra commotione commovebitur terra"
      en: "With breaking shall the earth be broken, with crushing shall the earth be crushed, with trembling shall the earth be moved."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "agitatione agitabitur terra sicut ebrius et auferetur quasi tabernaculum unius noctis et gravabit eam iniquitas sua et corruet et non adiciet ut resurgat"
      en: "With shaking shall the earth be shaken as a drunken man, and shall be removed as the tent of one night: and the iniquity thereof shall be heavy upon it, and it shall fell, and not rise again."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et erit in die illa visitabit Dominus super militiam caeli in excelso et super reges terrae qui sunt super terram"
      en: "And it shall come to pass, that in that day the Lord shall visit upon the host of heaven on high, and upon the kings of the earth, on the earth."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et congregabuntur in congregationem unius fascis in lacum et cludentur ibi in carcerem et post multos dies visitabuntur"
      en: "And they shall be gathered together as in the gathering of one bundle into the pit, and they shall be shut up there in prison: and after many days they shall be visited."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et erubescet luna et confundetur sol cum regnaverit Dominus exercituum in monte Sion et in Hierusalem et in conspectu senum suorum fuerit glorificatus"
      en: "fend the moon shall blush, and the sun shall be ashamed, when the Lord of hosts shall reign in mount Sion, and in Jerusalem, and shall be glorified in the sight of his ancients."
    status: { la: verified, en: verified }
