# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: osee
chapter: 1
verses:
  - n: 1
    text:
      la: "verbum Domini quod factum est ad Osee filium Beeri in diebus Oziae Ioatham Ahaz Ezechiae regum Iuda et in diebus Hieroboam filii Ioas regis Israhel"
      en: "The word of the Lord, that came to Osee the son of Beeri, in the days of Ozias, Joathan, Achaz, and Ezechias kings of Juda, and in the days of Jeroboam the son of Joas king of Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "principium loquendi Dominum in Osee et dixit Dominus ad Osee vade sume tibi uxorem fornicationum et filios fornicationum quia fornicans fornicabitur terra a Domino"
      en: "The beginning of the Lord's speaking by Osse: and the Lord said to Osee: Go, take thee a wife of fornications, and have of her children of fornications: for the land by fornication shall depart from the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et abiit et accepit Gomer filiam Debelaim et concepit et peperit filium"
      en: "So he went, and took Gomer the daughter of Debelaim: and she conceived and bore him a son."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dixit Dominus ad eum voca nomen eius Hiezrahel quoniam adhuc modicum et visitabo sanguinem Hiezrahel super domum Hieu et quiescere faciam regnum domus Israhel"
      en: "And the Lord said to him: Call his name Jezrahel: for yet a little while, and I will visit the blood of Jezrahel upon the house of Jehu, and I will cause to cease the kingdom of the house of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et in illa die conteram arcum Israhel in valle Hiezrahel"
      en: "And in that day I will break in pieces the bow of Israel in the valley of Jezrahel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et concepit adhuc et peperit filiam et dixit ei voca nomen eius Absque misericordia quia non addam ultra misereri domui Israhel sed oblivione obliviscar eorum"
      en: "And she conceived again, and bore a daughter, and he said to him: Call her name, Without mercy: for I will not add any more to have mercy on the house of Israel, but I will utterly forget them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et domui Iuda miserebor et salvabo eos in Domino Deo suo et non salvabo eos in arcu et gladio et in bello et in equis et in equitibus"
      en: "And I will have mercy on the house of Juda, and I will save them by the Lord their God: and Iwill not save them by bow, nor by sword, nor by battle, nor by horses, nor by horsemen."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et ablactavit eam quae erat absque misericordia et concepit et peperit filium"
      en: "And she weaned her that was called Without mercy. And she conceived, and bore a son."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dixit voca nomen eius Non populus meus quia vos non populus meus et ego non ero vester"
      en: "And he said: Call his name, Not my people: for you are not my people, and I will not be yours."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et erit numerus filiorum Israhel quasi harena maris quae sine mensura est et non numerabitur et erit in loco ubi dicetur eis non populus meus vos dicetur eis filii Dei viventis"
      en: "And the number of the children of Israel shall be as the sand of the sea, that is without measure, and shall not be numbered. And it shall be in the place where it shall be said to them: You are not my people: it shall be said to them: Ye are the sons of the living God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et congregabuntur filii Iuda et filii Israhel pariter et ponent sibimet caput unum et ascendent de terra quia magnus dies Hiezrahel"
      en: "And the children of Juda, and the children of Israel shall be gathered together: and they shall appoint themselves one head, and shall come up out of the land: for great is the day of Jezrahel."
    status: { la: verified, en: verified }
