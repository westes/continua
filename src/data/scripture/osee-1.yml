# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: osee
chapter: 1
verses:
  - n: 1
    text:
      la: "Verbum Domini, quod factum est ad Osee, filium Beeri, in diebus Oziae, Joathan, Achaz, Ezechiae, regum Juda; et in diebus Jeroboam, filii Joas, regis Israel."
      en: "The word of the Lord, that came to Osee the son of Beeri, in the days of Ozias, Joathan, Achaz, and Ezechias kings of Juda, and in the days of Jeroboam the son of Joas king of Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Principium loquendi Domino in Osee. Et dixit Dominus ad Osee: Vade, sume tibi uxorem fornicationum, et fac tibi filios fornicationum, quia fornicans fornicabitur terra a Domino."
      en: "The beginning of the Lord's speaking by Osee: and the Lord said to Osee: Go, take thee a wife of fornications, and have of her children of fornications: for the land by fornication shall depart from the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et abiit, et accepit Gomer, filiam Debelaim: et concepit, et peperit ei filium."
      en: "So he went, and took Gomer the daughter of Debelaim: and she conceived and bore him a son."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et dixit Dominus ad eum: Voca nomen ejus Jezrahel, quoniam adhuc modicum, et visitabo sanguinem Jezrahel super domum Jehu, et quiescere faciam regnum domus Israel."
      en: "And the Lord said to him: Call his name Jezrahel: for yet a little while, and I will visit the blood of Jezrahel upon the house of Jehu, and I will cause to cease the kingdom of the house of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et in illa die conteram arcum Israel in valle Jezrahel."
      en: "And in that day I will break in pieces the bow of Israel in the valley of Jezrahel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et concepit adhuc, et peperit filiam. Et dixit ei: Voca nomen ejus, Absque misericordia, quia non addam ultra misereri domui Israel, sed oblivione obliviscar eorum."
      en: "And she conceived again, and bore a daughter, and he said to him: Call her name, Without mercy: for I will not add any more to have mercy on the house of Israel, but I will utterly forget them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et domui Juda miserebor, et salvabo eos in Domino Deo suo; et non salvabo eos in arcu et gladio, et in bello, et in equis, et in equitibus."
      en: "And I will have mercy on the house of Juda, and I will save them by the Lord their God: and I will not save them by bow, nor by sword, nor by battle, nor by horses, nor by horsemen."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et ablactavit eam quae erat Absque misericordia. Et concepit, et peperit filium."
      en: "And she weaned her that was called Without mercy. And she conceived, and bore a son."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et dixit: Voca nomen ejus, Non populus meus, quia vos non populus meus, et ego non ero vester."
      en: "And he said: Call his name, Not my people: for you are not my people, and I will not be yours."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et erit numerus filiorum Israel quasi arena maris, quae sine mensura est, et non numerabitur. Et erit in loco ubi dicetur eis: Non populus meus vos: dicetur eis: Filii Dei viventis."
      en: "And the number of the children of Israel shall be as the sand of the sea, that is without measure, and shall not be numbered. And it shall be in the place where it shall be said to them: You are not my people: it shall be said to them: Ye are the sons of the living God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et congregabuntur filii Juda et filii Israel pariter; et ponent sibimet caput unum, et ascendent de terra, quia magnus dies Jezrahel."
      en: "And the children of Juda, and the children of Israel shall be gathered together: and they shall appoint themselves one head, and shall come up out of the land: for great is the day of Jezrahel."
    status: { la: verified, en: verified }
