# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 33
verses:
  - n: 1
    text:
      la: "audi igitur Iob eloquia mea et omnes sermones meos ausculta"
      en: "Hear therefore, O Job, my speeches, and hearken to all my words."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ecce aperui os meum loquatur lingua mea in faucibus meis"
      en: "Behold now I have opened my mouth, let my tongue speak within my jaws."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "simplici corde meo sermones mei et sententiam labia mea puram loquentur"
      en: "My words are from my upright heart, and my lips shall speak a pure sentence."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "spiritus Dei fecit me et spiraculum Omnipotentis vivificavit me"
      en: "The spirit of God made me, and the breath of the Almighty gave me life."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "si potes responde mihi et adversus faciem meam consiste"
      en: "If thou canst, answer me, and stand up against my face."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ecce et me sicut et te fecit Deus et de eodem luto ego quoque formatus sum"
      en: "Behold God hath made me as well as thee, and of the same clay I also was formed."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "verumtamen miraculum meum non te terreat et eloquentia mea non sit tibi gravis"
      en: "But yet let not my wonder terrify thee, and let not my eloquence be burdensome to thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixisti ergo in auribus meis et vocem verborum audivi"
      en: "Now thou has said in my hearing, and I have heard the voice of thy words :"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "mundus sum ego absque delicto inmaculatus et non est iniquitas in me"
      en: "I am clean, and without sin : I am unspotted, and there is no iniquity in me."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quia querellas in me repperit ideo arbitratus est me inimicum sibi"
      en: "Because he hath found complaints against me, therefore he hath counted me for his enemy."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "posuit in nervo pedes meos custodivit omnes semitas meas"
      en: "He hath put my feet in the stocks, he hath observed all my paths."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "hoc est ergo in quo non es iustificatus respondebo tibi quia maior sit Deus homine"
      en: "Now this is the thing in which thou art not justified : I will answer thee, that God is greater than man."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "adversum eum contendis quod non ad omnia verba responderit tibi"
      en: "Dost thou strive against him, because he hath not answered thee to all words?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "semel loquitur Deus et secundo id ipsum non repetit"
      en: "God speaketh once, and repeateth not the selfsame thing the second time."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "per somnium in visione nocturna quando inruit sopor super homines et dormiunt in lectulo"
      en: "By a dream in a vision by night, when deep sleep falleth upon men, and they are sleeping in their beds :"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tunc aperit aures virorum et erudiens eos instruit disciplinam"
      en: "Then he openeth the ears of men, and teaching instructeth them in what they are to learn."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ut avertat hominem ab his quae facit et liberet eum de superbia"
      en: "That he may withdraw a man from the things he is doing, and may deliver him from pride."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "eruens animam eius a corruptione et vitam illius ut non transeat in gladium"
      en: "Rescuing his soul from corruption : and his life from passing to the sword."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "increpat quoque per dolorem in lectulo et omnia ossa eius marcescere facit"
      en: "He rebuketh also by sorrow in the bed, and he maketh all his bones to wither."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "abominabilis ei fit in vita sua panis et animae illius cibus ante desiderabilis"
      en: "Bread becometh abominable to him in his life, and to his soul the meat which before he desired."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "tabescet caro eius et ossa quae tecta fuerant nudabuntur"
      en: "His flesh shall be consumed away, and his bones that were covered shall be made bare."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "adpropinquabit corruptioni anima eius et vita illius mortiferis"
      en: "His soul hath drawn near to corruption, and his life to the destroyers."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "si fuerit pro eo angelus loquens unum de milibus ut adnuntiet hominis aequitatem"
      en: "If there shall be an angel speaking for him, one among thousands, to declare man's uprightness,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "miserebitur eius et dicet libera eum et non descendat in corruptionem inveni in quo ei propitier"
      en: "He shall have mercy on him, and shall say : Deliver him, that he may not go down to corruption : I have found wherein I may be merciful to him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "consumpta est caro eius a suppliciis revertatur ad dies adulescentiae suae"
      en: "His flesh is consumed with punishment, let him return to the days of his youth."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "deprecabitur Deum et placabilis ei erit et videbit faciem eius in iubilo et reddet homini iustitiam suam"
      en: "He shall pray to God, and he will be gracious to him : and he shall see his face with joy, and he will render to man his justice."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "respiciet homines et dicet peccavi et vere deliqui et ut eram dignus non recepi"
      en: "He shall look upon men, and shall say : I have sinned, and indeed I have offended, and I have not received what I have deserved."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "liberavit animam suam ne pergeret in interitum sed vivens lucem videret"
      en: "He hath delivered his soul from going into destruction, that it may live and see the light."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ecce haec omnia operatur Deus tribus vicibus per singulos"
      en: "Behold, all these things God worketh three times within every one."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ut revocet animas eorum a corruptione et inluminet luce viventium"
      en: "That he may withdraw their souls from corruption, and enlighten them with the light of the living."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "adtende Iob et audi me et tace dum ego loquar"
      en: "Attend, Job, and hearken to me : and hold thy peace, whilst I speak."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "si autem habes quod loquaris responde mihi loquere volo enim te apparere iustum"
      en: "But if thou hast any thing to say, answer me, speak : for I would have thee to appear just."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "quod si non habes audi me tace et docebo te sapientiam"
      en: "And if thou have not, hear me : hold thy peace, and I will teach thee wisdom."
    status: { la: verified, en: verified }
