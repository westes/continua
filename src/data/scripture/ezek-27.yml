book: ezek
chapter: 27
verses:
  - n: 1
    text:
      la: "et factum est verbum Domini ad me dicens"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tu ergo fili hominis adsume super Tyrum lamentum"
      en: "Thou therefore, O son of man, take up a lamentation for Tyre:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dices Tyro quae habitat in introitu maris negotiationi populorum ad insulas multas haec dicit Dominus Deus o Tyre tu dixisti perfecti decoris ego sum"
      en: "And say to Tyre that dwelleth at the entry of the sea, being the mart of the people for many islands: Thus saith the Lord God: O Tyre, thou hast said: I am of perfect beauty,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et in corde maris sita finitimi tui qui te aedificaverunt impleverunt decorem tuum"
      en: "And situate in the heart of the sea. Thy neighbours, that built thee, have perfected thy beauty:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "abietibus de Sanir extruxerunt te cum omnibus tabulatis maris cedrum de Libano tulerunt ut facerent tibi malum"
      en: "With fir trees of Sanir they have built thee with all sea planks: they have taken cedars from Libanus to make thee masts."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quercus de Basan dolaverunt in remos tuos transtra tua fecerunt tibi ex ebore indico et praetoriola de insulis Italiae"
      en: "They have cut thy oars out of the oaks of Basan: and they have made thee benches of Indian ivory and cabins with things brought from the islands of Italy."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "byssus varia de Aegypto texta est tibi in velum ut poneretur in malo hyacinthus et purpura de insulis Elisa facta sunt operimentum tuum"
      en: "Fine broidered linen from Egypt was woven for thy sail, to be spread on thy mast: blue and purple from the islands of Elisa, were made thy covering."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "habitatores Sidonis et Aradii fuerunt remiges tui sapientes tui Tyre facti sunt gubernatores tui"
      en: "The inhabitants of Sidon, and the Arabians were thy rowers : thy wise men, O Tyre, were thy pilots."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "senes Bibli et prudentes eius habuerunt nautas ad ministerium variae supellectilis tuae omnes naves maris et nautae earum fuerunt in populo negotiationis tuae"
      en: "The ancients of Gebal, and the wise men thereof furnished mariners for the service of thy various furniture: all the ships of the sea, and their mariners were thy factors."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Persae et Lydi et Lybies erant in exercitu tuo viri bellatores tui clypeum et galeam suspenderunt in te pro ornatu tuo"
      en: "The Persians, and Lydians, and the Libyans were thy soldiers in thy army: they hung up the buckler and the helmet in thee for thy ornament."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "filii Aradii cum exercitu tuo erant super muros tuos in circuitu sed et Pigmei qui erant in turribus tuis faretras suas suspenderunt in muris tuis per gyrum ipsi conpleverunt pulchritudinem tuam"
      en: "The men of Arad were with thy army upon thy walls round about: the Pygmeans also that were in thy towers, hung up their quivers on thy walls round about: they perfected thy beauty."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Carthaginienses negotiatores tui a multitudine cunctarum divitiarum argento ferro stagno plumboque repleverunt nundinas tuas"
      en: "The Carthaginians thy merchants supplied thy fairs with a multitude of all kinds of riches, with silver, iron, tin, and lead."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Graecia Thubal et Mosoch ipsi institores tui mancipia et vasa aerea adduxerunt populo tuo"
      en: "Greece, Thubal, and Mosoch, they were thy merchants: they brought to thy people slaves and vessels of brass."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "de domo Thogorma equos et equites et mulos adduxerunt ad forum tuum"
      en: "From the house of Thogorma they brought horses, and horsemen, and mules to thy market."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "filii Dadan negotiatores tui insulae multae negotiatio manus tuae dentes eburneos et hebeninos commutaverunt in pretio tuo"
      en: "The men of Dedan were thy merchants: many islands were the traffic of thy hand, they exchanged for thy price teeth of ivory and ebony."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Syrus negotiator tuus propter multitudinem operum tuorum gemmam purpuram et scutulata et byssum et sericum et chodchod proposuerunt in mercatu tuo"
      en: "The Syrian was thy merchant: by reason of the multitude of thy works, they set forth precious stones, and purple, and broidered works, and fine linen, and silk, and chodchod in thy market."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Iuda et terra Israhel ipsi institores tui in frumento primo balsamum et mel et oleum et resinam proposuerunt in nundinis tuis"
      en: "Juda and the land of Israel, they were thy merchants with the best corn: they set forth balm, and honey, and oil, and rosin in thy fairs."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Damascenus negotiator tuus in multitudine operum tuorum in multitudine diversarum opum in vino pingui in lanis coloris optimi"
      en: "The men of Damascus were thy merchants in the multitude of thy works, in the multitude of divers riches, in rich wine, in wool of the best colour."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dan et Graecia et Mozel in nundinis tuis proposuerunt ferrum fabrefactum stacte et calamus in negotiatione tua"
      en: "Dan, and Greece, and Mosel have set forth in thy marts wrought iron: stacte, and calamus were in thy market."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dadan institores tui in tapetibus ad sedendum"
      en: "The men of Dedan were thy merchants in tapestry for seats."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Arabia et universi principes Cedar ipsi negotiatores manus tuae cum agnis et arietibus et hedis venerunt ad te negotiatores tui"
      en: "Arabia, and all the princes of Cedar, they were the merchants of thy hand: thy merchants came to thee with lambs, and rants, and kids."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "venditores Saba et Reema ipsi negotiatores tui cum universis primis aromatibus et lapide pretioso et auro quod proposuerunt in mercatu tuo"
      en: "The sellers of Saba, and Reema, they were thy merchants: with all the best spices, and precious stones, and gold, which they set forth in thy market."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Aran et Chenne et Eden negotiatores Saba Assur Chelmad venditores tui"
      en: "Haran, and Chene, and Eden were thy merchants; Saba, Assur, and Chelmad sold to thee."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ipsi negotiatores tui multifariam involucris hyacinthi et polymitorum gazarumque pretiosarum quae obvolutae et adstrictae erant funibus cedros quoque habebant in negotiationibus tuis"
      en: "They were thy merchants in divers manners, with bales of blue cloth, and of embroidered work, and of precious riches, which were wrapped up and bound with cords: they had cedars also in thy merchandise."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "naves maris principes tuae in negotiatione tua et repleta es et glorificata nimis in corde maris"
      en: "The ships of the sea, were thy chief in thy merchandise : and thou wast replenished, and glorified exceedingly in the heart of the sea."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "in aquis multis adduxerunt te remiges tui ventus auster contrivit te in corde maris"
      en: "Thy rowers have brought thee into great waters: the south wind hath broken thee in the heart of the sea."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "divitiae tuae et thesauri tui et multiplex instrumentum tuum nautae tui et gubernatores tui qui tenebant supellectilem tuam et populo tuo praeerant viri quoque bellatores tui qui erant in te cum universa multitudine tua quae est in medio tui cadent in corde maris in die ruinae tuae"
      en: "Thy riches, and thy treasures, and thy manifold furniture, thy mariners, and thy pilots, who kept thy goods, and were chief over thy people: thy men of war also, that were in thee, with all thy multitude that is in the midst of thee: shall fall in the heart of the sea in the day of thy ruin."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "a sonitu clamoris gubernatorum tuorum conturbabuntur classes"
      en: "Thy fleets shall be troubled at the sound of the cry of thy pilots."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et descendent de navibus suis omnes qui tenebant remum nautae et universi gubernatores maris in terra stabunt"
      en: "And all that handled the oar shall come down from their ships: the mariners, and all the pilots of the sea shall stand upon the land:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et heiulabunt super te voce magna et clamabunt amare et superiacient pulverem capitibus suis et cinere conspergentur"
      en: "And they shall mourn over thee with a loud voice, and shall cry bitterly: and they shall cast up dust upon their heads, and shall be sprinkled with ashes."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et radent super te calvitium et accingentur ciliciis et plorabunt te in amaritudine animae ploratu amarissimo"
      en: "And they shall shave themselves bald for thee, and shall be girded with haircloth: and they shall weep for thee with bitterness of soul, with most bitter weeping."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et adsument super te carmen lugubre et plangent te quae est ut Tyrus quae obmutuit in medio maris"
      en: "And they shall take up a mournful song for thee, and snail lament thee: What city is like Tyre, which is become silent in the midst of the sea?"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "quae in exitu negotiationum tuarum de mari implesti populos multos in multitudine divitiarum tuarum et populorum tuorum ditasti reges terrae"
      en: "Which by thy merchandise that went from thee by sea didst fill many people: which by the multitude of thy riches, and of thy people didst enrich the kings of the earth."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "nunc contrita es a mari in profundis aquarum opes tuae et omnis multitudo tua quae erat in medio tui ceciderunt"
      en: "Now thou art destroyed by the sea, thy riches are in the bottom of the waters, and all the multitude that was in the midst of thee is fallen."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "universi habitatores insularum obstipuerunt super te et reges earum omnes tempestate perculsi mutaverunt vultus"
      en: "All the inhabitants of the islands are astonished at thee: and all their kings being struck with the storm have changed their countenance."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "negotiatores populorum sibilaverunt super te ad nihilum deducta es et non eris usque in perpetuum"
      en: "The merchants of people have hissed at thee: thou art brought to nothing, and thou shalt never be any more."
    status: { la: verified, en: verified }
