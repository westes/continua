# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 3reg
chapter: 7
verses:
  - n: 1
    text:
      la: "Domum autem suam aedificavit Salomon tredecim annis, et ad perfectum usque perduxit."
      en: "And Solomon built his own house in thirteen years, and brought it to perfection."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Aedificavit quoque domum saltus Libani centum cubitorum longitudinis, et quinquaginta cubitorum latitudinis, et triginta cubitorum altitudinis: et quatuor deambulacra inter columnas cedrinas: ligna quippe cedrina exciderat in columnas."
      en: "He built also the house of the forest of Libanus, the length of it was a hundred cubits, and the breadth fifty cubits, and the height thirty cubits: and four galleries between pillars of cedar: for he had cut cedar trees into pillars."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et tabulatis cedrinis vestivit totam cameram, quae quadraginta quinque columnis sustentabatur. Unus autem ordo habebat columnas quindecim"
      en: "And he covered the whole vault with boards of cedar, and it was held up with five and forty pillars. And one row had fifteen pillars,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "contra se invicem positas,"
      en: "Set one against another,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et e regione se respicientes, aequali spatio inter columnas, et super columnas quadrangulata ligna in cunctis aequalia."
      en: "And looking one upon another, with equal space between the pillars, and over the pillars were square beams in all things equal."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et porticum columnarum fecit quinquaginta cubitorum longitudinis, et triginta cubitorum latitudinis: et alteram porticum in facie majoris porticus: et columnas, et epistylia super columnas."
      en: "And he made a porch of pillars of fifty cubits in length, and thirty cubits in breadth: and another porch before the greater porch: and pillars, and chapiters upon the pillars."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Porticum quoque solii, in qua tribunal est, fecit: et texit lignis cedrinis a pavimento usque ad summitatem."
      en: "He made also the porch of the throne, wherein is the seat of judgment: and covered it with cedar wood from the floor to the top."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et domuncula, in qua sedebatur ad judicandum, erat in media porticu simili opere. Domum quoque fecit filiae Pharaonis ( quam uxorem duxerat Salomon) tali opere, quali et hanc porticum."
      en: "And in the midst of the porch, was a small house where he sat in judgment, of the like work. He made also a house for the daughter of Pharao (whom Solomon had taken to wife) of the same work, as this porch,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Omnia lapidibus pretiosis, qui ad normam quamdam atque mensuram tam intrinsecus quam extrinsecus serrati erant: a fundamento usque ad summitatem parietum, et extrinsecus usque ad atrium majus."
      en: "All of costly stones, which were sawed by a certain rule and measure both within and without: from the foundation to the top of the walls, and without unto the great court."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Fundamenta autem de lapidibus pretiosis, lapidibus magnis decem sive octo cubitorum."
      en: "And the foundations were of costly stones, great stones of ten cubits or eight cubits:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et desuper lapides pretiosi aequalis mensurae secti erant, similiterque de cedro."
      en: "And above there were costly stones, or equal measure, hewed; and, in like manner, planks of cedar:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et atrium majus rotundum trium ordinum de lapidibus sectis, et unius ordinis de dolata cedro: necnon et in atrio domus Domini interiori, et in porticu domus."
      en: "And the greater court was made round with three rows of hewed stones, and one row of planks of cedar, moreover also in the inner court of the house of the Lord, and in the porch of the house."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Misit quoque rex Salomon, et tulit Hiram de Tyro,"
      en: "And king Solomon sent, and brought Hiram from Tyre,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "filium mulieris viduae de tribu Nephthali, patre Tyrio, artificem aerarium, et plenum sapientia, et intelligentia, et doctrina ad faciendum omne opus ex aere. Qui cum venisset ad regem Salomonem, fecit omne opus ejus."
      en: "The son of a widow woman of the tribe of Nephtali, whose father was a Tyrian, an artificer in brass, and full of wisdom, and understanding, and skill to work all work in brass. And when he was come to king Solomon, he wrought all his work."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et finxit duas columnas aereas, decem et octo cubitorum altitudinis columnam unam: et linea duodecim cubitorum ambiebat columnam utramque."
      en: "And he cast two pillars in brass, each pillar was eighteen cubits high: and a line of twelve cubits compassed both the pillars."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Duo quoque capitella fecit, quae ponerentur super capita columnarum, fusilia ex aere: quinque cubitorum altitudinis capitellum unum, et quinque cubitorum altitudinis capitellum alterum:"
      en: "He made also two chapiters of molten brass, to be set upon the tops of the pillars: the height of one chapiter was five cubits, and the height of the other chapiter was five cubits:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et quasi in modum retis, et catenarum sibi invicem miro opere contextarum. Utrumque capitellum columnarum fusile erat: septena versuum retiacula in capitello uno, et septena retiacula in capitello altero."
      en: "And a kind of network, and chain work wreathed together with wonderful art. Both the chapiters of the pillars were cast: seven rows of nets were on one chapiter, and seven nets on the other chapiter."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et perfecit columnas, et duos ordines per circuitum retiaculorum singulorum, ut tegerent capitella, quae erant super summitatem, malogranatorum: eodem modo fecit et capitello secundo."
      en: "And he made the pillars, and two rows round about each network to cover the chapiters, that were upon the top, with pomegranates: and in like manner did he to the other chapiter."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Capitella autem, quae erant super capita columnarum, quasi opere lilii fabricata erant in porticu quatuor cubitorum."
      en: "And the chapiters that were upon the top of the pillars, were of lily work in the porch, of four cubits."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et rursum alia capitella in summitate columnarum desuper juxta mensuram columnae contra retiacula: malogranatorum autem ducenti ordines erant in circuitu capitelli secundi."
      en: "And again other chapiters in the top of the pillars above, according to the measure of the pillar over against the network: and of pomegranates there were two hundred in rows round about the other chapiter."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et statuit duas columnas in porticu templi: cumque statuisset columnam dexteram, vocavit eam nomine Jachin: similiter erexit columnam secundam: et vocavit nomen ejus Booz."
      en: "And he set up the two pillars in the porch of the temple: and when he had set up the pillar on the right hand, he called the name thereof Jachin: in like manner he set up the second pillar, and called the name thereof Booz."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et super capita columnarum opus in modum lilii posuit: perfectumque est opus columnarum."
      en: "And upon the tops of the pillars he made lily work: so the work of the pillars was finished."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Fecit quoque mare fusile decem cubitorum a labio usque ad labium, rotundum in circuitu: quinque cubitorum altitudo ejus, et resticula triginta cubitorum cingebat illud per circuitum."
      en: "He made also a molten sea of ten cubits from brim to brim, round all about; the height of it was five cubits, and a line of thirty cubits compassed it round about."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et sculptura subter labium circuibat illud decem cubitis ambiens mare: duo ordines sculpturarum striatarum erant fusiles."
      en: "And a graven work under the brim of it compassed it, for ten cubits going about the sea: there were two rows cast of chamfered sculptures."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et stabat super duodecim boves, e quibus tres respiciebant ad aquilonem, et tres ad occidentem, et tres ad meridiem, et tres ad orientem, et mare super eos desuper erat: quorum posteriora universa intrinsecus latitabant."
      en: "And it stood upon twelve oxen, of which three looked towards the north, and three towards the west, and three towards the south, and three towards the east, and the sea was above upon them, and their hinder parts were all hid within."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Grossitudo autem luteris, trium unciarum erat: labiumque ejus, quasi labium calicis, et folium repandi lilii: duo millia batos capiebat."
      en: "And the laver was a handbreadth thick: and the brim thereof was like the brim of a cup, or the leaf of a crisped lily: it contained two thousand bates."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et fecit decem bases aeneas, quatuor cubitorum longitudinis bases singulas, et quatuor cubitorum latitudinis, et trium cubitorum altitudinis."
      en: "And he made ten bases of brass, every base was four cubits in length, and four cubits in breadth, and three cubits high."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et ipsum opus basium, interrasile erat: et sculpturae inter juncturas."
      en: "And the work itself of the bases, was intergraven: and there were gravings between the joinings."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et inter coronulas et plectas, leones et boves et cherubim, et in juncturis similiter desuper: et subter leones et boves, quasi lora ex aere dependentia."
      en: "And between the little crowns and the ledges were lions, and oxen, and cherubims: and in the joinings likewise above: and under the lions and oxen, as it were bands of brass hanging down."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et quatuor rotae per bases singulas, et axes aerei: et per quatuor partes quasi humeruli subter luterem fusiles, contra se invicem respectantes."
      en: "And every base had four wheels, and axletrees of brass: and at the four sides were undersetters under the laver molten, looking one against another."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Os quoque luteris intrinsecus erat in capitis summitate: et quod forinsecus apparebat, unius cubiti erat totum rotundum, pariterque habebat unum cubitum et dimidium: in angulis autem columnarum variae caelaturae erant: et media intercolumnia, quadrata non rotunda."
      en: "The mouth also of the laver within, was in the top of the chapiter: and that which appeared without, was of one cubit all round, and together it was one cubit and a half: and in the corners of the pillars were divers engravings: and the spaces between the pillars were square, not round."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Quatuor quoque rotae, quae per quatuor angulos basis erant, cohaerebant sibi subter basim: una rota habebat altitudinis cubitum et semis."
      en: "And the four wheels, which were at the four corners of the base, were joined one to another under the base: the height of a wheel was a cubit and a half."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Tales autem rotae erant quales solent in curru fieri: et axes earum, et radii, et canthi, et modioli, omnia fusilia."
      en: "And they were such wheels as are used to be made in a chariot: and their axletrees, and spokes, and strakes, and naves, were all east."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Nam et humeruli illi quatuor per singulos angulos basis unius, ex ipsa basi fusiles et conjuncti erant."
      en: "And the four undersetters that were at every corner of each base, were of the base itself cast and joined together."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "In summitate autem basis erat quaedam rotunditas dimidii cubiti, ita fabrefacta, ut luter desuper posset imponi, habens caelaturas suas, variasque sculpturas ex semetipsa."
      en: "And in the top of the base there was a round compass of half a cubit, so wrought that the laver might be set thereon, having its gravings, and divers sculptures of itself."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Sculpsit quoque in tabulatis illis quae erant ex aere, et in angulis, cherubim, et leones, et palmas, quasi in similitudinem hominis stantis, ut non caelata, sed apposita per circuitum viderentur."
      en: "He engraved also in those plates, which were of brass. and in the corners, cherubims, and lions, and palm trees, in likeness of a man standing, so that they seemed not to be engraven, but added round about."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "In hunc modum fecit decem bases, fusura una, et mensura, sculpturaque consimili."
      en: "After this manner he made ten bases, of one casting and measure, and the like graving."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Fecit quoque decem luteres aeneos: quadraginta batos capiebat luter unus, eratque quatuor cubitorum: singulos quoque luteres per singulas, id est, decem bases, posuit."
      en: "He made also ten lavers of brass: one laver contained four bases, and was of four cubits: and upon every base, in all ten, he put as many lavers."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et constituit decem bases, quinque ad dexteram partem templi, et quinque ad sinistram: mare autem posuit ad dexteram partem templi contra orientem ad meridiem."
      en: "And he set the ten bases, five on the right side of the temple, and five on the left: and the sea he put on the right side of the temple over against the east southward."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Fecit ergo Hiram lebetes, et scutras, et hamulas, et perfecit omne opus regis Salomonis in templo Domini."
      en: "And Hiram made caldrons, and shovels, and basins, and finished all the work of king Solomon in the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Columnas duas, et funiculos capitellorum super capitella columnarum duos: et retiacula duo, ut operirent duos funiculos, qui erant super capita columnarum."
      en: "The two pillars and the two cords of the chapiters, upon the chapiters of the pillars: and the two networks, to cover the two cords, that were upon the top of the pillars."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et malogranata quadringenta in duobus retiaculis: duos versus malogranatorum in retiaculis singulis, ad operiendos funiculos capitellorum, qui erant super capita columnarum."
      en: "And four hundred pomegranates for the two networks: two rows of pomegranates for each network, to cover the cords of the chapiters, which were upon the tops of the pillars."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Et bases decem, et luteres decem super bases."
      en: "And the ten bases, and the ten lavers on the bases."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Et mare unum, et boves duodecim subter mare."
      en: "And one sea, and twelve oxen under the sea."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Et lebetes, et scutras, et hamulas, omnia vasa, quae fecit Hiram regi Salomoni in domo Domini, de auricalco erant."
      en: "And the caldrons, and the shovels, and the basins. All the vessels that Hiram made for king Solomon for the house of the Lord, were of fine brass."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "In campestri regione Jordanis fudit ea rex in argillosa terra, inter Sochoth et Sarthan."
      en: "In the plains of the Jordan did the king cast them in a clay ground, between Socoth and Sartham."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Et posuit Salomon omnia vasa: propter multitudinem autem nimiam non erat pondus aeris."
      en: "And Solomon placed all the vessels: but for exceeding great multitude the brass could not be weighed."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Fecitque Salomon omnia vasa in domo Domini: altare aureum, et mensam, super quam ponerentur panes propositionis, auream:"
      en: "And Solomon made all the vessels for the house of the Lord: the altar of gold, and the table of gold, upon which the loaves of proposition should be set:"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "et candelabra aurea, quinque ad dexteram, et quinque ad sinistram contra oraculum, ex auro puro: et quasi lilii flores, et lucernas desuper aureas: et forcipes aureos,"
      en: "And the golden candlesticks, five on the right hand, and five on the left, over against the oracle, of pure gold: and the flowers like lilies, and the lamps over them of gold: and golden snuffers,"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "et hydrias, et fuscinulas, et phialas, et mortariola, et thuribula, de auro purissimo: et cardines ostiorum domus interioris Sancti sanctorum, et ostiorum domus templi, ex auro erant."
      en: "And pots, and fleshhooks, and bowls, and mortars, and censers, of most pure gold: and the hinges for the doors of the inner house of the holy of holies, and for the doors of the house of the temple were of gold."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Et perfecit omne opus quod faciebat Salomon in domo Domini, et intulit quae sanctificaverat David pater suus argentum et aurum, et vasa, reposuitque in thesauris domus Domini."
      en: "And Solomon finished all the work that he made in the house of the Lord, and brought in the things that David his father had dedicated, the silver and the gold, and the vessels, and laid them up in the treasures of the house of the Lord."
    status: { la: verified, en: verified }
