# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: luc
chapter: 6
verses:
  - n: 1
    text:
      la: "Factum est autem in sabbato secundo, primo, cum transiret per sata, vellebant discipuli ejus spicas, et manducabant confricantes manibus."
      en: "And it came to pass on the second first sabbath, that as he went through the corn fields, his disciples plucked the ears, and did eat, rubbing them in their hands."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quidam autem pharisaeorum, dicebant illis: Quid facitis quod non licet in sabbatis?"
      en: "And some of the Pharisees said to them: Why do you that which is not lawful on the sabbath days?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et respondens Jesus ad eos, dixit: Nec hoc legistis quod fecit David, cum esurisset ipse, et qui cum illo erant?"
      en: "And Jesus answering them, said: Have you not read so much as this, what David did, when himself was hungry, and they that were with him:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quomodo intravit in domum Dei, et panes propositionis sumpsit, et manducavit, et dedit his qui cum ipso erant: quos non licet manducare nisi tantum sacerdotibus?"
      en: "How he went into the house of God, and took and ate the bread of proposition, and gave to them that were with him, which is not lawful to eat but only for the priests?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et dicebat illis: Quia dominus est Filius hominis etiam sabbati."
      en: "And he said to them: The Son of man is Lord also of the sabbath."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Factum est autem in alio sabbato, ut intraret in synagogam, et doceret. Et erat ibi homo, et manus ejus dextra erat arida."
      en: "And it came to pass also on another sabbath, that he entered into the synagogue, and taught. And there was a man, whose right hand was withered."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Observabant autem scribae et pharisaei si in sabbato curaret, ut invenirent unde accusarent eum."
      en: "And the scribes and Pharisees watched if he would heal on the sabbath; that they might find an accusation against him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ipse vero sciebat cogitationes eorum: et ait homini qui habebat manum aridam: Surge, et sta in medium. Et surgens stetit."
      en: "But he knew their thoughts; and said to the man who had the withered hand: Arise, and stand forth in the midst. And rising he stood forth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ait autem ad illos Jesus: Interrogo vos si licet sabbatis benefacere, an male: animam salvam facere, an perdere?"
      en: "Then Jesus said to them: I ask you, if it be lawful on the sabbath days to do good, or to do evil; to save life, or to destroy?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et circumspectis omnibus dixit homini: Extende manum tuam. Et extendit: et restituta est manus ejus."
      en: "And looking round about on them all, he said to the man: Stretch forth thy hand. And he stretched it forth: and his hand was restored."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ipsi autem repleti sunt insipientia, et colloquebantur ad invicem, quidnam facerent Jesu."
      en: "And they were filled with madness; and they talked one with another, what they might do to Jesus."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Factum est autem in illis diebus, exiit in montem orare, et erat pernoctans in oratione Dei."
      en: "And it came to pass in those days, that he went out into a mountain to pray, and he passed the whole night in the prayer of God."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et cum dies factus esset, vocavit discipulos suos: et elegit duodecim ex ipsis ( quos et apostolos nominavit):"
      en: "And when day was come, he called unto him his disciples; and he chose twelve of them (whom also he named apostles)."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Simonem, quem cognominavit Petrum, et Andream fratrem ejus, Jacobum, et Joannem, Philippum, et Bartholomaeum,"
      en: "Simon, whom he surnamed Peter, and Andrew his brother, James and John, Philip and Bartholomew,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Matthaeum, et Thomam, Jacobum Alphaei, et Simonem, qui vocatur Zelotes,"
      en: "Matthew and Thomas, James the son of Alpheus, and Simon who is called Zelotes,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et Judam Jacobi, et Judam Iscariotem, qui fuit proditor."
      en: "And Jude, the brother of James, and Judas Iscariot, who was the traitor."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et descendens cum illis, stetit in loco campestri, et turba discipulorum ejus, et multitudo copiosa plebis ab omni Judaea, et Jerusalem, et maritima, et Tyri, et Sidonis,"
      en: "And coming down with them, he stood in a plain place, and the company of his disciples, and a very great multitude of people from all Judea and Jerusalem, and the sea coast both of Tyre and Sidon,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui venerant ut audirent eum, et sanarentur a languoribus suis. Et qui vexabantur a spiritibus immundis, curabantur."
      en: "Who were come to hear him, and to be healed of their diseases. And they that were troubled with unclean spirits, were cured."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et omnis turba quaerebat eum tangere: quia virtus de illo exibat, et sanabat omnes."
      en: "And all the multitude sought to touch him, for virtue went out from him, and healed all."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et ipse elevatis oculis in discipulis suis, dicebat: Beati pauperes, quia vestrum est regnum Dei."
      en: "And he, lifting up his eyes on his disciples, said: Blessed are ye poor, for yours is the kingdom of God."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Beati qui nunc esuritis, quia saturabimini. Beati qui nunc fletis, quia ridebitis."
      en: "Blessed are ye that hunger now: for you shall be filled. Blessed are ye that weep now: for you shall laugh."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Beati eritis cum vos oderint homines, et cum separaverint vos, et exprobraverint, et ejicerint nomen vestrum tamquam malum propter Filium hominis."
      en: "Blessed shall you be when men shall hate you, and when they shall separate you, and shall reproach you, and cast out your name as evil, for the Son of man's sake."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Gaudete in illa die, et exsultate: ecce enim merces vestra multa est in caelo: secundum haec enim faciebant prophetis patres eorum."
      en: "Be glad in that day and rejoice; for behold, your reward is great in heaven. For according to these things did their fathers to the prophets."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Verumtamen vae vobis divitibus, quia habetis consolationem vestram."
      en: "But woe to you that are rich: for you have your consolation."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Vae vobis, qui saturati estis: quia esurietis. Vae vobis, qui ridetis nunc: quia lugebitis et flebitis."
      en: "Woe to you that are filled: for you shall hunger. Woe to you that now laugh: for you shall mourn and weep."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Vae cum benedixerint vobis homines: secundum haec enim faciebant pseudoprophetis patres eorum."
      en: "Woe to you when men shall bless you: for according to these things did their fathers to the false prophets."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Sed vobis dico, qui auditis: diligite inimicos vestros, benefacite his qui oderunt vos."
      en: "But I say to you that hear: Love your enemies, do good to them that hate you."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Benedicite maledicentibus vobis, et orate pro calumniantibus vos."
      en: "Bless them that curse you, and pray for them that calumniate you."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et qui te percutit in maxillam, praebe et alteram. Et ab eo qui aufert tibi vestimentum, etiam tunicam noli prohibere."
      en: "And to him that striketh thee on the one cheek, offer also the other. And him that taketh away from thee thy cloak, forbid not to take thy coat also."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Omni autem petenti te, tribue: et qui aufert quae tua sunt, ne repetas."
      en: "Give to every one that asketh thee, and of him that taketh away thy goods, ask them not again."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et prout vultis ut faciant vobis homines, et vos facite illis similiter."
      en: "And as you would that men should do to you, do you also to them in like manner."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et si diligitis eos qui vos diligunt, quae vobis est gratia? nam et peccatores diligentes se diligunt."
      en: "And if you love them that love you, what thanks are to you? for sinners also love those that love them."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et si benefeceritis his qui vobis benefaciunt, quae vobis est gratia? siquidem et peccatores hoc faciunt."
      en: "And if you do good to them who do good to you, what thanks are to you? for sinners also do this."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et si mutuum dederitis his a quibus speratis recipere, quae gratia est vobis? nam et peccatores peccatoribus foenerantur, ut recipiant aequalia."
      en: "And if you lend to them of whom you hope to receive, what thanks are to you? for sinners also lend to sinners, for to receive as much."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Verumtamen diligite inimicos vestros: benefacite, et mutuum date, nihil inde sperantes: et erit merces vestra multa, et eritis filii Altissimi, quia ipse benignus est super ingratos et malos."
      en: "But love ye your enemies: do good, and lend, hoping for nothing thereby: and your reward shall be great, and you shall be the sons of the Highest; for he is kind to the unthankful, and to the evil."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Estote ergo misericordes sicut et Pater vester misericors est."
      en: "Be ye therefore merciful, as your Father also is merciful."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Nolite judicare, et non judicabimini: nolite condemnare, et non condemnabimini. Dimitte, et dimittemini."
      en: "Judge not, and you shall not be judged. Condemn not, and you shall not be condemned. Forgive, and you shall be forgiven."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Date, et dabitur vobis: mensuram bonam, et confertam, et coagitatam, et supereffluentem dabunt in sinum vestrum. Eadem quippe mensura, qua mensi fueritis, remetietur vobis."
      en: "Give, and it shall be given to you: good measure and pressed down and shaken together and running over shall they give into your bosom. For with the same measure that you shall mete withal, it shall be measured to you again."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Dicebat autem illis et similitudinem: Numquid potest caecus caecum ducere? nonne ambo in foveam cadunt?"
      en: "And he spoke also to them a similitude: Can the blind lead the blind? do they not both fall into the ditch?"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Non est discipulus super magistrum: perfectus autem omnis erit, si sit sicut magister ejus."
      en: "The disciple is not above his master: but every one shall be perfect, if he be as his master."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Quid autem vides festucam in oculo fratris tui, trabem autem, quae in oculo tuo est, non consideras?"
      en: "And why seest thou the mote in thy brother's eye: but the beam that is in thy own eye thou considerest not?"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "aut quomodo potes dicere fratri tuo: Frater, sine ejiciam festucam de oculo tuo: ipse in oculo tuo trabem non videns? Hypocrita, ejice primum trabem de oculo tuo: et tunc perspicies ut educas festucam de oculo fratris tui."
      en: "Or how canst thou say to thy brother: Brother, let me pull the mote out of thy eye, when thou thyself seest not the beam in thy own eye? Hypocrite, cast first the beam out of thy own eye; and then shalt thou see clearly to take out the mote from thy brother's eye."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Non est enim arbor bona, quae facit fructus malos: neque arbor mala, faciens fructum bonum."
      en: "For there is no good tree that bringeth forth evil fruit; nor an evil tree that bringeth forth good fruit."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Unaquaeque enim arbor de fructu suo cognoscitur. Neque enim de spinis colligunt ficus: neque de rubo vindemiant uvam."
      en: "For every tree is known by its fruit. For men do not gather figs from thorns; nor from a bramble bush do they gather the grape."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Bonus homo de bono thesauro cordis sui profert bonum: et malus homo de malo thesauro profert malum. Ex abundantia enim cordis os loquitur."
      en: "A good man out of the good treasure of his heart bringeth forth that which is good: and an evil man out of the evil treasure bringeth forth that which is evil. For out of the abundance of the heart the mouth speaketh."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Quid autem vocatis me Domine, Domine: et non facitis quae dico?"
      en: "And why call you me, Lord, Lord; and do not the things which I say?"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Omnis qui venit ad me, et audit sermones meos, et facit eos, ostendam vobis cui similis sit:"
      en: "Every one that cometh to me, and heareth my words, and doth them, I will shew you to whom he is like."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "similis est homini aedificanti domum, qui fodit in altum, et posuit fundamentum super petram: inundatione autem facta, illisum est flumen domui illi, et non potuit eam movere: fundata enim erat super petram."
      en: "He is like to a man building a house, who digged deep, and laid the foundation upon a rock. And when a flood came, the stream beat vehemently upon that house, and it could not shake it; for it was founded on a rock."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Qui autem audit, et non facit, similis est homini aedificanti domum suam super terram sine fundamento: in quam illisus est fluvius, et continuo cecidit: et facta est ruina domus illius magna."
      en: "But he that heareth, and doth not, is like to a man building his house upon the earth without a foundation: against which the stream beat vehemently, and immediately it fell, and the ruin of that house was great."
    status: { la: verified, en: verified }
