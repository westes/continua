# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2mach
chapter: 11
verses:
  - n: 1
    text:
      la: "Sed parvo post tempore, Lysias procurator regis, et propinquus, ac negotiorum praepositus, graviter ferens de his quae acciderant,"
      en: "A short time after this Lysias the king's lieutenant, and cousin, and who had chief charge over all the affairs, being greatly displeased with what had happened,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "congregatis octoginta millibus, et equitatu universo, veniebat adversus Judaeos, existimans se civitatem quidem captam gentibus habitaculum facturum,"
      en: "Gathered together fourscore thousand men, and all the horsemen, and came against the Jews, thinking to take the city, and make it a habitation of the Gentiles:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "templum vero in pecuniae quaestum, sicut cetera delubra gentium, habiturum, et per singulos annos venale sacerdotium:"
      en: "And to make a gain of the temple, as of the other temples of the Gentiles, and to set the high priesthood to sale every year:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "nusquam recogitans Dei potestatem, sed mente effrenatus in multitudine peditum, et in millibus equitum, et in octoginta elephantis confidebat."
      en: "Never considering the power of God, but puffed up in mind, and trusting in the multitude of his foot soldiers, and the thousands of his horsemen, and his fourscore elephants."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ingressus autem Judaeam, et appropians Bethsurae, quae erat in angusto loco, ab Jerosolyma intervallo quinque stadiorum, illud praesidium expugnabat."
      en: "So he came into Judea, and approaching to Bethsura, which was in a narrow place, the space of five furlongs from Jerusalem, he laid siege to that fortress."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ut autem Machabaeus, et qui cum eo erant, cognoverunt expugnari praesidia, cum fletu et lacrimis rogabant Dominum, et omnis turba simul, ut bonum angelum mitteret ad salutem Israel."
      en: "But when Machabeus and they that were with him, understood that the strong holds were besieged, they and all the people besought the Lord with lamentations and tears, that he would send a good angel to save Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et ipse primus Machabaeus, sumptis armis, ceteros adhortatus est simul secum periculum subire, et ferre auxilium fratribus suis."
      en: "Then Machabeus himself, first taking his arms, exhorted the rest to expose themselves together with him, to the danger, and to succour their brethren."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cumque pariter prompto animo procederent, Jerosolymis apparuit praecedens eos eques in veste candida, armis aureis hastam vibrans."
      en: "And when they were going forth together with a willing mind, there appeared at Jerusalem a horseman going before them in white clothing, with golden armour, shaking a spear."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Tunc omnes simul benedixerunt misericordem Dominum, et convaluerunt animis: non solum homines, sed et bestias ferocissimas, et muros ferreos parati penetrare."
      en: "Then they all together blessed the merciful Lord, and took great courage, being ready to break through not only men, but also the fiercest beasts, and walls of iron."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ibant igitur prompti, de caelo habentes adjutorem et miserantem super eos Dominum."
      en: "So they went on courageously, having a helper from Heaven, and the Lord who shewed mercy to them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Leonum autem more impetu irruentes in hostes, prostraverunt ex eis undecim millia peditum, et equitum mille sexcentos:"
      en: "And rushing violently upon the enemy, like lions, they slew of them eleven thousand footmen, and one thousand six hundred horsemen:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "universos autem in fugam verterunt, plures autem ex eis vulnerati nudi evaserunt. Sed et ipse Lysias turpiter fugiens evasit."
      en: "And put all the rest to flight: many of them being wounded, escaped naked: yea and Lysias himself fled away shamefully, and escaped."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et quia non insensatus erat, secum ipse reputans, factam erga se diminutionem, et intelligens invictos esse Hebraeos, omnipotentis Dei auxilio innitentes, misit ad eos:"
      en: "And as he was a man of understanding considering with himself, the loss he had suffered, and perceiving that the Hebrews could not be overcome, because they relied upon the help of the Almighty God, he sent to them:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "promisitque se consensurum omnibus quae justa sunt, et regem compulsurum amicum fieri."
      en: "And promised that he would agree to all things that are just, and that he would persuade the king to be their friend."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Annuit autem Machabaeus precibus Lysiae, in omnibus utilitati consulens: et quaecumque Machabaeus scripsit Lysiae de Judaeis, ea rex concessit."
      en: "Then Machabeus consented to the request of Lysias, providing for the common good in all things, and whatsoever Machabeus wrote to Lysias concerning the Jews, the king allowed of."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nam erant scriptae Judaeis epistolae a Lysia quidem hunc modum continentes: Lysias populo Judaeorum salutem."
      en: "For there were letters written to the Jews from Lysias, to this effect: Lysias to the people of the Jews, greeting."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Joannes et Abesalom, qui missi fuerant a vobis, tradentes scripta, postulabant ut ea, quae per illos significabantur, implerem."
      en: "John and Abesalom who were sent from you, delivering your writings, requested that I would accomplish those things which were signified by them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quaecumque igitur regi potuerunt perferri, exposui: et quae res permittebat, concessit."
      en: "Therefore whatsoever things could be reported to the king I have represented to him: and he hath granted as much as the matter permitted."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Si igitur in negotiis fidem conservaveritis, et deinceps bonorum vobis causa esset tentabo."
      en: "If therefore you will keep yourselves loyal in affairs, hereafter also I will endeavour to be a means of your good."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "De ceteris autem per singula verbo mandavi et istis, et his, qui a me missi sunt, colloqui vobiscum."
      en: "But as concerning other particulars, I have given orders by word both to these, and to them that are sent by me, to commune with you."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Bene valete. Anno centesimo, quadragesimo octavo mensis Dioscori, die vigesima et quarta."
      en: "Fare ye well. In the year one hundred and forty-eight, the four and twentieth day of the month of Dioscorus."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Regis autem epistola ista continebat: Rex Antiochus Lysiae fratri salutem."
      en: "But the king's letter contained these words: King Antiochus to Lysias his brother, greeting."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Patre nostro inter deos translato, nos volentes eos qui sunt in regno nostro sine tumultu agere, et rebus suis adhibere diligentiam,"
      en: "Our father being translated amongst the gods, we are desirous that they that are in our realm should live quietly, and apply themselves diligently to their own concerns,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "audivimus Judaeos non consensisse patri meo ut transferrentur ad ritum Graecorum, sed tenere velle suum institutum, ac propterea postulare a nobis concedi sibi legitima sua."
      en: "And we have heard that the Jews would not consent to my father to turn to the rites of the Greeks, but that they would keep to their own manner of living, and therefore that they request us to allow them to live after their own laws."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Volentes igitur hanc quoque gentem quietam esse, statuentes judicavimus templum restitui illis, ut agerent secundum suorum majorum consuetudinem."
      en: "Wherefore being desirous that this nation also should be at rest, we have ordained and decreed, that the temple should be restored to them, and that they may live according to the custom of their ancestors."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Bene igitur feceris, si miseris ad eos, et dexteram dederis: ut cognita nostra voluntate, bono animo sint, et utilitatibus propriis deserviant."
      en: "Thou shalt do well therefore to send to them, and grant them peace, that our pleasure being known, they may be of good comfort, and look to their own affairs."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ad Judaeos vero regis epistola talis erat: Rex Antiochus senatui Judaeorum, et ceteris Judaeis salutem."
      en: "But the king's letter to the Jews was in this manner: King Antiochus to the senate of the Jews, and to the rest of the Jews, greeting."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Si valetis, sic estis ut volumus: sed et ipsi bene valemus."
      en: "If you are well, you are as we desire, we ourselves also are well."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Adiit nos Menelaus, dicens velle vos descendere ad vestros, qui sunt apud nos."
      en: "Menelaus came to us, saying that you desired to come down to your countrymen, that are with us."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "His igitur qui commeant usque ad diem trigesimum mensis Xanthici, damus dextras securitatis,"
      en: "We grant therefore a safe conduct to all that come and go, until the thirtieth day of the month of Xanthicus,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ut Judaei utantur cibis, et legibus suis, sicut et prius: et nemo eorum ullo modo molestiam patiatur de his quae per ignorantiam gesta sunt."
      en: "That the Jews may use their own kind of meats, and their own laws as before, and that none of them any manner of ways be molested for things which have been done by ignorance."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Misimus autem et Menelaum, qui vos alloquatur."
      en: "And we have sent also Menelaus to speak to you."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Valete. Anno centesimo quadragesimo octavo, Xanthici mensis quintadecima die."
      en: "Fare ye well. In the year one hundred and forty-eight, the fifteenth day of the month of Xanthicus."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Miserunt autem etiam Romani epistolam, ita se habentem: Quintus Memmius et Titus Manilius legati Romanorum, populo Judaeorum salutem."
      en: "The Romans also sent them a letter, to this effect. Quintus Memmius, and Titus Manilius, ambassadors of the Romans, to the people of the Jews, greeting."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "De his, quae Lysias cognatus regis concessit vobis, et nos concessimus."
      en: "Whatsoever Lysias the king's cousin hath granted you, we also have granted."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "De quibus autem ad regem judicavit referendum, confestim aliquem mittere, diligentius inter vos conferentes, ut decernamus, sicut congruit vobis: nos enim Antiochiam accedimus."
      en: "But touching such things as he thought should be referred to the king, after you have diligently conferred among yourselves, send some one forthwith, that we may decree as it is convenient for you: for we are going to Antioch."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Ideoque festinate rescribere, ut nos quoque sciamus cujus estis voluntatis."
      en: "And therefore make haste to write back, that we may know of what mind you are."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Bene valete. Anno centesimo quadragesimo octavo, quintadecima die mensis Xanthici."
      en: "Fare ye well. In the year one hundred and forty-eight, the fifteenth day of the month of Xanthicus."
    status: { la: verified, en: verified }
