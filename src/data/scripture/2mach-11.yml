book: 2mach
chapter: 11
verses:
  - n: 1
    text:
      la: "sed parvo post tempore Lysias procurator regis et propinquus ac negotiorum praepositus graviter ferens de his quae acciderant"
      en: "A short time after this Lysias the king's lieutenant, and cousin, and who had chief charge over all the affairs, being greatly displeased with what had happened,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "congregatis octoginta milibus et equitatu universo veniebat adversus Iudaeos existimans se civitatem quidem captam gentibus habitaculum facturum"
      en: "Gathered together fourscore thousand men, and all the horsemen, and came against the Jews, thinking to take the city, and make it a habitation of the Gentiles :"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "templum vero in pecuniae quaestu sicut cetera delubra gentium habiturum et per singulos annos venale sacerdotium"
      en: "And to make a gain of the temple, as of the other temples of the Gentiles, and to set the high priesthood to sale every year:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "nusquam recogitans Dei potestatem sed mente effrenatus in multitudine peditum et in milibus equitum et in octoginta elefantis confidebat"
      en: "Never considering the power of God, but puffed up in mind, and trusting in the multitude of his foot soldiers, and the thousands of his horsemen, and his four- score elephants."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ingressus autem Iudaeam et adpropians Bethsurae quod erat in angusto loco ab Hierosolyma intervallo quinque stadiorum illud praesidium expugnabat"
      en: "So he came into Judea, and approaching to Bethsura, which was in a narrow place, the space of five furlongs from Jerusalem, he laid siege to that fortress."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ut autem Macchabeus et qui cum eo erant cognoverunt expugnari praesidia cum fletu et lacrimis rogabant Dominum et omnis turba simul ut bonum angelum mitteret ad salutem Israhel"
      en: "But when Machabeus and they that were with him, understood that the strong holds were besieged, they and all the people besought the Lord with lamentations and tears, that he would send a good angel to save Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et ipse primus Macchabeus sumptis armis ceteros adhortatus est simul secum periculum subire et ferre auxilium fratribus suis"
      en: "Then Machabeus himself, first taking his arms, exhorted the rest to expose themselves together with him, to the danger, and to succour their brethren."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cumque pariter prompto animo procederent Hierosolymis apparuit praecedens eos eques in veste candida armis aureis hastam vibrans"
      en: "And when they were going forth together with a willing mind, there appeared at Jerusatem a horseman going before them in white clothing, with golden armour, shaking a spear."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "tum simul omnes benedixerunt misericordem Dominum et convaluerunt animis non solum homines sed et bestias ferocissimas et muros ferreos parati penetrare"
      en: "Then they all together blessed merciful Lord, and took great courage, being ready to break through not only men, but also the fiercest beasts, walls of iron."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ibant igitur prompti de caelo habentes adiutorem et miserantem eos Dominum"
      en: "So they went on courageously, having a helper from Peaven, and the who shewed mercy to them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "leonum autem impetu inruentes hostibus prostraverunt ex eis undecim milia peditum et equites mille sescentos"
      en: "And rushing violently upon the my, like lions, they slew of them eleven thousand footmen, and one thousand hundred horsemen:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "universos autem in fugam verterunt plures vero ex eis vulnerati nudi evaserunt sed et ipse Lysias turpiter fugiens evasit"
      en: "And put all the rest to flight: many of them being wounded, escaped naked: yea and Lysias himself fled away shamefully, and escaped."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et quia non insensatus erat secum ipse reputans factam erga se diminutionem et intellegens invictos esse Hebraeos Dei auxilio nitentes misit ad eos"
      en: "And as he was a man of understanding considering with himself, the loss he had suffered, and perceiving that the Hebrews could not be overcome, because they relied upon the help of the Almighty God, he sent to them:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "promisitque consensurum se omnibus quae iusta sunt et regem conpulsurum amicum fieri"
      en: "And promised that he would agree to all things that are just, and that he would persuade the king to be their friend."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "annuit autem Macchabeus precibus Lysiae in omnibus utilitati consulens et quaecumque Macchabeus scripsit Lysiae de Iudaeis ea rex concessit"
      en: "Then Machabeus consented to the request of Lysias, providing for the common Food in all things, and whatsoever Machabeus wrote to Lysias concerning the Jews, the king allowed of."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "nam erant scriptae Iudaeis epistulae a Lysia quidem hunc modum continentes Lysias populo Iudaeorum salutem"
      en: "For there were letters written to the Jews from Lysias, to this effect: Lysias to the people of the Jews, greeting."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Iohannes et Abessalom qui missi sunt a vobis tradentes scripta postulabant ut ea quae per illos significabantur implerem"
      en: "John and Abesalom who were sent from you, delivering your writings, re- quested that I would accomplish those things which were signified by them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quaecumque igitur regi potuerunt perferri exposui et quae res permittebat concessit"
      en: "Therefore whatsoever things could be reported to the king I have represented to him: and he hath granted as much as the matter permitted."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "si igitur in negotiis fidem conservaveritis etiam deinceps honorum vobis causa esse temptabo"
      en: "If therefore you will keep yourselves loyal in affairs, hereafter also I will endeavour to be a means of your good."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "de ceteris autem per singula verbo mandavi et istis et his qui a me missi sunt conloqui vobiscum"
      en: "But as concerning other particulars, I have given orders by word both to these, and to them that are sent by me, to commune with you."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "bene valete anno centesimo quadragesimo octavo dioscori die mensis vicesima et quarta"
      en: "Fare ye well. In the year one hundred and forty-eight, the four and twentieth day of the month of Dioscorus."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "regis autem epistula ista continebat rex Antiochus Lysiae fratri salutem"
      en: "But the king's letter contained these words: King Antiochus to Lysias his brother, greeting."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "patre nostro inter deos translato nos volentes eos qui sunt in regno nostro sine tumultu agere et rebus suis adhibere diligentiam"
      en: "Our father being translated amongst the gods, we are desirous that they that are in our realm should live quietly, and apply themselves diligently to their own concerns,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "audivimus Iudaeos non consensisse patri ut transferrentur ad ritum Graecorum sed tenere velle suum institutum ac propterea postulare concedi sibi legitima sua"
      en: "And we have heard that the Jews would not consent to my father to turn to the rites of the Greeks, but that they would keep to their own manner of living, and therefore that they request us to allow them to live after their own laws."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "volentes igitur hanc quoque gentem quietam esse statuentes iudicavimus templum restitui illis ut agerent secundum maiorum suorum consuetudinem"
      en: "Wherefore being desirous that this nation also should be at rest, we have ordained and decreed, that the temple should be restored to them, and that they may live according to the custom of their ancestors."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "bene igitur feceris si miseris ad eos et dextram dederis ut cognita nostra voluntate bono animo sint et utilitatibus propriis deserviant"
      en: "Thou shalt do well therefore to send to them, and grant them peace, that our pleasure being known, they may be of good comfort, and look to their own affairs."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ad Iudaeos autem regis epistula talis erat rex Antiochus senatui Iudaeorum et ceteris Iudaeis salutem"
      en: "But the king's letter to the Jews was in this manner: King Antiochus to the senate of the Jews, and to the rest of the Jews, greeting."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "si valetis sic estis ut volumus sed et ipsi bene valemus"
      en: "If you are well, you are as we desire, we ourselves also are well."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "adiit nos Menelaus dicens velle vos descendere ad vestros qui sunt apud nos"
      en: "Menelaus came to us, saying that you desired to come down to your countrymen, that are with us."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "his igitur qui commeant usque ad diem tricesimum mensis xandici damus dextras securitatis"
      en: "We grant therefore a safe conduct to all that come and go, until the thirtieth day of the month of Xanthicus,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ut Iudaei utantur cibis et legibus suis sicut et prius et nemo eorum ullo modo molestiam patiatur de his quae per ignorantiam gesta sunt"
      en: "That the Jews may use their own Bind of meats, and their own laws as be- fore, and that none of them any manner of ways be molested for things which have been done by ignorance."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "misi autem et Menelaum qui vos adloquatur"
      en: "And we have sent also Menelaus to speak to you."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "valete anno centesimo quadragesimo octavo xandici mensis quintadecima"
      en: "Fare ye well. In the year one hundred and forty-eight, the fifteenth day of the month of Xanthicus."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "miserunt autem etiam Romani epistulam ita se habentem Quintus Memmius et Titus Manilius legati Romanorum populo Iudaeorum salutem"
      en: "The Romans also sent them a letter, to this effect. Quintus Memmius, and Titus Manilius, ambassadors of the Romans, to the people of the Jews, greeting."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "de his quae Lysias cognatus regis concessit vobis et nos concessimus"
      en: "Whatsoever Lysias the king's cousin hath granted you, we also have granted."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "de quibus autem iudicavit referendum confestim aliquem mittite diligentius inter vos conferentes ut decernamus sicut congruit vobis nos enim Antiochiam accedimus"
      en: "But touching such things as he thought should be referred to the king, after you have diligently conferred among yourselves, send some one forthwith, that we may decree as it is convenient for you: for we are going to Antioch."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "ideoque festinate scribere ut nos quoque sciamus cuius estis voluntatis"
      en: "And therefore make haste to write back, that we may know of what mind you are."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "bene valete anno centesimo quadragesimo octavo quintadecima die mensis xandici"
      en: "Fare ye well. In the year one hundred and forty-eight, the fifteenth day of the month of Xanthicus."
    status: { la: verified, en: verified }
