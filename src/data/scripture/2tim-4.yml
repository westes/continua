# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2tim
chapter: 4
verses:
  - n: 1
    text:
      la: "testificor coram Deo et Christo Iesu qui iudicaturus est vivos ac mortuos et adventum ipsius et regnum eius"
      en: "I charge thee, before God and Jesus Christ, who shall judge the living and the dead, by his coming, and his kingdom:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "praedica verbum insta oportune inportune argue obsecra increpa in omni patientia et doctrina"
      en: "Preach the word: be instant in season, out of season: reprove, entreat, rebuke in all patience and doctrine."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "erit enim tempus cum sanam doctrinam non sustinebunt sed ad sua desideria coacervabunt sibi magistros prurientes auribus"
      en: "For there shall be a time, when they will not endure sound doctrine; but, according to their own desires, they will heap to themselves teachers, having itching ears:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et a veritate quidem auditum avertent ad fabulas autem convertentur"
      en: "And will indeed turn away their hearing from the truth, but will be turned unto fables."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "tu vero vigila in omnibus labora opus fac evangelistae ministerium tuum imple"
      en: "But be thou vigilant, labour in all things, do the work of an evangelist, fulfil thy ministry. Be sober."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ego enim iam delibor et tempus meae resolutionis instat"
      en: "For I am even now ready to be sacrificed: and the time of my dissolution is at hand."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "bonum certamen certavi cursum consummavi fidem servavi"
      en: "I have fought a good fight, I have finished my course, I have kept the faith."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "in reliquo reposita est mihi iustitiae corona quam reddet mihi Dominus in illa die iustus iudex non solum autem mihi sed et his qui diligunt adventum eius"
      en: "As to the rest, there is laid up for me a crown of justice, which the Lord the just judge will render to me in that day: and not only to me, but to them also that love his coming. Make haste to come to me quickly."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "festina venire ad me cito"
      en: "For Demas hath left me, loving this world, and is gone to Thessalonica:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Demas enim me dereliquit diligens hoc saeculum et abiit Thessalonicam Crescens in Galliam Titus in Dalmatiam"
      en: "Crescens into Galatia, Titus into Dalmatia."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Lucas est mecum solus Marcum adsume et adduc tecum est enim mihi utilis in ministerium"
      en: "Only Luke is with me. Take Mark, and bring him with thee: for he is profitable to me for the ministry."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tychicum autem misi Ephesum"
      en: "But Tychicus I have sent to Ephesus."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "paenulam quam reliqui Troade apud Carpum veniens adfers et libros maxime autem membranas"
      en: "The cloak that I left at Troas, with Carpus, when thou comest, bring with thee, and the books, especially the parchments."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Alexander aerarius multa mala mihi ostendit reddat ei Dominus secundum opera eius"
      en: "Alexander the coppersmith hath done me much evil: the Lord will reward him according to his works:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quem et tu devita valde enim restitit verbis nostris"
      en: "Whom do thou also avoid, for he hath greatly withstood our words."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "in prima mea defensione nemo mihi adfuit sed omnes me dereliquerunt non illis reputetur"
      en: "At my first answer no man stood with me, but all forsook me: may it not be laid to their charge."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dominus autem mihi adstitit et confortavit me ut per me praedicatio impleatur et audiant omnes gentes et liberatus sum de ore leonis"
      en: "But the Lord stood by me, and strengthened me, that by me the preaching may be accomplished, and that all the Gentiles may hear: and I was delivered out of the mouth of the lion."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "liberabit me Dominus ab omni opere malo et salvum faciet in regnum suum caeleste cui gloria in saecula saeculorum amen"
      en: "The Lord hath delivered me from every evil work: and will preserve me unto his heavenly kingdom, to whom be glory for ever and ever. Amen."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "saluta Priscam et Aquilam et Onesifori domum"
      en: "Salute Prisca and Aquila, and the household of Onesiphorus."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Erastus remansit Corinthi Trophimum autem reliqui infirmum Mileti"
      en: "Erastus remained at Corinth. And Trophimus I left sick at Miletus."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "festina ante hiemem venire salutat te Eubulus et Pudens et Linus et Claudia et fratres omnes"
      en: "Make haste to come before winter Eubulus and Pudens, and Linus and Claudia, and all the brethren, salute thee."
    status: { la: verified, en: verified }
