# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: marc
chapter: 1
verses:
  - n: 1
    text:
      la: "Initium Evangelii Jesu Christi, Filii Dei."
      en: "The beginning of the gospel of Jesus Christ, the Son of God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Sicut scriptum est in Isaia propheta: Ecce ego mitto angelum meum ante faciem tuam, qui praeparabit viam tuam ante te."
      en: "As it is written in Isaias the prophet: Behold I send my angel before thy face, who shall prepare the way before thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Vox clamantis in deserto: Parate viam Domini, rectas facite semitas ejus."
      en: "A voice of one crying in the desert: Prepare ye the way of the Lord, make straight his paths."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Fuit Joannes in deserto baptizans, et praedicans baptismum poenitentiae in remissionem peccatorum."
      en: "John was in the desert baptizing, and preaching the baptism of penance, unto remission of sins."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et egrediebatur ad eum omnis Judaeae regio, et Jerosolymitae universi, et baptizabantur ab illo in Jordanis flumine, confitentes peccata sua."
      en: "And there went out to him all the country of Judea, and all they of Jerusalem, and were baptized by him in the river of Jordan, confessing their sins."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et erat Joannes vestitus pilis cameli, et zona pellicea circa lumbos ejus, et locustas et mel silvestre edebat."
      en: "And John was clothed with camel's hair, and a leathern girdle about his loins; and he ate locusts and wild honey."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et praedicabat dicens: Venit fortior post me, cujus non sum dignus procumbens solvere corrigiam calceamentorum ejus."
      en: "And he preached, saying: There cometh after me one mightier than I, the latchet of whose shoes I am not worthy to stoop down and loose."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ego baptizavi vos aqua, ille vero baptizabit vos Spiritu Sancto."
      en: "I have baptized you with water; but he shall baptize you with the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et factum est: in diebus illis venit Jesus a Nazareth Galilaeae: et baptizatus est a Joanne in Jordane."
      en: "And it came to pass, in those days, Jesus came from Nazareth of Galilee, and was baptized by John in the Jordan."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et statim ascendens de aqua, vidit caelos apertos, et Spiritum tamquam columbam descendentem, et manentem in ipso."
      en: "And forthwith coming up out of the water, he saw the heavens opened, and the Spirit as a dove descending, and remaining on him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et vox facta est de caelis: Tu es Filius meus dilectus, in te complacui."
      en: "And there came a voice from heaven: Thou art my beloved Son; in thee I am well pleased."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et statim Spiritus expulit eum in desertum."
      en: "And immediately the Spirit drove him out into the desert."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et erat in deserto quadraginta diebus, et quadraginta noctibus: et tentabatur a Satana: eratque cum bestiis, et angeli ministrabant illi."
      en: "And he was in the desert forty days and forty nights, and was tempted by Satan; and he was with beasts, and the angels ministered to him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Postquam autem traditus est Joannes, venit Jesus in Galilaeam, praedicans Evangelium regni Dei,"
      en: "And after that John was delivered up, Jesus came into Galilee, preaching the gospel of the kingdom of God,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et dicens: Quoniam impletum est tempus, et appropinquavit regnum Dei: poenitemini, et credite Evangelio."
      en: "And saying: The time is accomplished, and the kingdom of God is at hand: repent, and believe the gospel."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et praeteriens secus mare Galilaeae, vidit Simonem, et Andream fratrem ejus, mittentes retia in mare ( erant enim piscatores),"
      en: "And passing by the sea of Galilee, he saw Simon and Andrew his brother, casting nets into the sea (for they were fishermen)."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et dixit eis Jesus: Venite post me, et faciam vos fieri piscatores hominum."
      en: "And Jesus said to them: Come after me, and I will make you to become fishers of men."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et protinus relictis retibus, secuti sunt eum."
      en: "And immediately leaving their nets, they followed him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et progressus inde pusillum, vidit Jacobum Zebedaei, et Joannem fratrem ejus, et ipsos componentes retia in navi:"
      en: "And going on from thence a little farther, he saw James the son of Zebedee, and John his brother, who also were mending their nets in the ship:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et statim vocavit illos. Et relicto patre suo Zebedaeo in navi cum mercenariis, secuti sunt eum."
      en: "And forthwith he called them. And leaving their father Zebedee in the ship with his hired men, they followed him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et ingrediuntur Capharnaum: et statim sabbatis ingressus in synagogam, docebat eos."
      en: "And they entered into Capharnaum, and forthwith upon the sabbath days going into the synagogue, he taught them."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et stupebant super doctrina ejus: erat enim docens eos quasi potestatem habens, et non sicut scribae."
      en: "And they were astonished at his doctrine. For he was teaching them as one having power, and not as the scribes."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et erat in synagoga eorum homo in spiritu immundo: et exclamavit,"
      en: "And there was in their synagogue a man with an unclean spirit; and he cried out,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "dicens: Quid nobis et tibi, Jesu Nazarene? venisti perdere nos? scio qui sis, Sanctus Dei."
      en: "Saying: What have we to do with thee, Jesus of Nazareth? art thou come to destroy us? I know who thou art, the Holy One of God."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et comminatus est ei Jesus, dicens: Obmutesce, et exi de homine."
      en: "And Jesus threatened him, saying: Speak no more, and go out of the man."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et discerpens eum spiritus immundus, et exclamans voce magna, exiit ab eo."
      en: "And the unclean spirit tearing him, and crying out with a loud voice, went out of him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et mirati sunt omnes, ita ut conquirerent inter se dicentes: Quidnam est hoc? quaenam doctrina haec nova? quia in potestate etiam spiritibus immundis imperat, et obediunt ei."
      en: "And they were all amazed, insomuch that they questioned among themselves, saying: What thing is this? what is this new doctrine? for with power he commandeth even the unclean spirits, and they obey him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et processit rumor ejus statim in omnem regionem Galilaeae."
      en: "And the fame of him was spread forthwith into all the country of Galilee."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et protinus egredientes de synagoga, venerunt in domum Simonis et Andreae, cum Jacobo et Joanne."
      en: "And immediately going out of the synagogue they came into the house of Simon and Andrew, with James and John."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Decumbebat autem socrus Simonis febricitans: et statim dicunt ei de illa."
      en: "And Simon's wife's mother lay in a fit of a fever: and forthwith they tell him of her."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et accedens elevavit eam, apprehensa manu ejus: et continuo dimisit eam febris, et ministrabat eis."
      en: "And coming to her, he lifted her up, taking her by the hand; and immediately the fever left her, and she ministered unto them."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Vespere autem facto cum occidisset sol, afferebant ad eum omnes male habentes, et daemonia habentes:"
      en: "And when it was evening, after sunset, they brought to him all that were ill and that were possessed with devils."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et erat omnis civitas congregata ad januam."
      en: "And all the city was gathered together at the door."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et curavit multos, qui vexabantur variis languoribus, et daemonia multa ejiciebat, et non sinebat ea loqui, quoniam sciebant eum."
      en: "And he healed many that were troubled with divers diseases; and he cast out many devils, and he suffered them not to speak, because they knew him."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et diluculo valde surgens, egressus abiit in desertum locum, ibique orabat."
      en: "And rising very early, going out, he went into a desert place: and there he prayed."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et prosecutus est eum Simon, et qui cum illo erant."
      en: "And Simon, and they that were with him, followed after him."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et cum invenissent eum, dixerunt ei: Quia omnes quaerunt te."
      en: "And when they had found him, they said to him: All seek for thee."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et ait illis: Eamus in proximos vicos, et civitates, ut et ibi praedicem: ad hoc enim veni."
      en: "And he saith to them: Let us go into the neighbouring towns and cities, that I may preach there also; for to this purpose am I come."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et erat praedicans in synagogis eorum, et in omni Galilaea, et daemonia ejiciens."
      en: "And he was preaching in their synagogues, and in all Galilee, and casting out devils."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et venit ad eum leprosus deprecans eum: et genu flexo dixit ei: Si vis, potes me mundare."
      en: "And there came a leper to him, beseeching him, and kneeling down said to him: If thou wilt, thou canst make me clean."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Jesus autem misertus ejus, extendit manum suam: et tangens eum, ait illi: Volo: mundare."
      en: "And Jesus having compassion on him, stretched forth his hand; and touching him, saith to him: I will. Be thou made clean."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et cum dixisset, statim discessit ab eo lepra, et mundatus est."
      en: "And when he had spoken, immediately the leprosy departed from him, and he was made clean."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Et comminatus est ei, statimque ejecit illum,"
      en: "And he strictly charged him, and forthwith sent him away."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et dicit ei: Vide nemini dixeris: sed vade, ostende te principi sacerdotum, et offer pro emundatione tua, quae praecepit Moyses in testimonium illis."
      en: "And he saith to him: See thou tell no one; but go, shew thyself to the high priest, and offer for thy cleansing the things that Moses commanded, for a testimony to them."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "At ille egressus coepit praedicare, et diffamare sermonem, ita ut jam non posset manifeste introire in civitatem, sed foris in desertis locis esset, et conveniebant ad eum undique."
      en: "But he being gone out, began to publish and to blaze abroad the word: so that he could not openly go into the city, but was without in desert places: and they flocked to him from all sides."
    status: { la: verified, en: verified }
