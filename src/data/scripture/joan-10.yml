# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: joan
chapter: 10
verses:
  - n: 1
    text:
      la: "Amen, amen dico vobis: qui non intrat per ostium in ovile ovium, sed ascendit aliunde, ille fur est et latro."
      en: "Amen, amen I say to you: He that entereth not by the door into the sheepfold, but climbeth up another way, the same is a thief and a robber."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Qui autem intrat per ostium, pastor est ovium."
      en: "But he that entereth in by the door is the shepherd of the sheep."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Huic ostiarius aperit, et oves vocem ejus audiunt, et proprias ovas vocat nominatim, et educit eas."
      en: "To him the porter openeth; and the sheep hear his voice: and he calleth his own sheep by name, and leadeth them out."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et cum proprias oves emiserit, ante eas vadit: et oves illum sequuntur, quia sciunt vocem ejus."
      en: "And when he hath let out his own sheep, he goeth before them: and the sheep follow him, because they know his voice."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Alienum autem non sequuntur, sed fugiunt ab eo: quia non noverunt vocem alienorum."
      en: "But a stranger they follow not, but fly from him, because they know not the voice of strangers."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Hoc proverbium dixit eis Jesus: illi autem non cognoverunt quid loqueretur eis."
      en: "This proverb Jesus spoke to them. But they understood not what he spoke to them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dixit ergo eis iterum Jesus: Amen, amen dico vobis, quia ego sum ostium ovium."
      en: "Jesus therefore said to them again: Amen, amen I say to you, I am the door of the sheep."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Omnes quotquot venerunt, fures sunt, et latrones, et non audierunt eos oves."
      en: "All others, as many as have come, are thieves and robbers: and the sheep heard them not."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ego sum ostium. Per me si quis introierit, salvabitur: et ingredietur, et egredietur, et pascua inveniet."
      en: "I am the door. By me, if any man enter in, he shall be saved: and he shall go in, and go out, and shall find pastures."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Fur non venit nisi ut furetur, et mactet, et perdat. Ego veni ut vitam habeant, et abundantius habeant."
      en: "The thief cometh not, but for to steal, and to kill, and to destroy. I am come that they may have life, and may have it more abundantly."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ego sum pastor bonus. Bonus pastor animam suam dat pro ovibus suis."
      en: "I am the good shepherd. The good shepherd giveth his life for his sheep."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Mercenarius autem, et qui non est pastor, cujus non sunt oves propriae, videt lupum venientem, et dimittit oves, et fugit: et lupus rapit, et dispergit oves;"
      en: "But the hireling, and he that is not the shepherd, whose own the sheep are not, seeth the wolf coming, and leaveth the sheep, and flieth: and the wolf catcheth, and scattereth the sheep:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "mercenarius autem fugit, quia mercenarius est, et non pertinet ad eum de ovibus."
      en: "And the hireling flieth, because he is a hireling: and he hath no care for the sheep."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ego sum pastor bonus: et cognosco meas, et cognoscunt me meae."
      en: "I am the good shepherd; and I know mine, and mine know me."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Sicut novit me Pater, et ego agnosco Patrem: et animam meam pono pro ovibus meis."
      en: "As the Father knoweth me, and I know the Father: and I lay down my life for my sheep."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et alias oves habeo, quae non sunt ex hoc ovili: et illas oportet me adducere, et vocem meam audient, et fiet unum ovile et unus pastor."
      en: "And other sheep I have, that are not of this fold: them also I must bring, and they shall hear my voice, and there shall be one fold and one shepherd."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Propterea me diligit Pater: quia ego pono animam meam, ut iterum sumam eam."
      en: "Therefore doth the Father love me: because I lay down my life, that I may take it again."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Nemo tollit eam a me: sed ego pono eam a meipso, et potestatem habeo ponendi eam, et potestatem habeo iterum sumendi eam. Hoc mandatum accepi a Patre meo."
      en: "No man taketh it away from me: but I lay it down of myself, and I have power to lay it down: and I have power to take it up again. This commandment have I received of my Father."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dissensio iterum facta est inter Judaeos propter sermones hos."
      en: "A dissension rose again among the Jews for these words."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dicebant autem multi ex ipsis: Daemonium habet, et insanit: quid eum auditis?"
      en: "And many of them said: He hath a devil, and is mad: why hear you him?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Alii dicebant: Haec verba non sunt daemonium habentis: numquid daemonium potest caecorum oculos aperire?"
      en: "Others said: These are not the words of one that hath a devil: Can a devil open the eyes of the blind?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Facta sunt autem Encaenia in Jerosolymis, et hiems erat."
      en: "And it was the feast of the dedication at Jerusalem: and it was winter."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et ambulabat Jesus in templo, in porticu Salomonis."
      en: "And Jesus walked in the temple, in Solomon's porch."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Circumdederunt ergo eum Judaei, et dicebant ei: Quousque animam nostram tollis? si tu es Christus, dic nobis palam."
      en: "The Jews therefore came round about him, and said to him: How long dost thou hold our souls in suspense? If thou be the Christ, tell us plainly."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Respondit eis Jesus: Loquor vobis, et non creditis: opera quae ego facio in nomine Patris mei, haec testimonium perhibent de me:"
      en: "Jesus answered them: I speak to you, and you believe not: the works that I do in the name of my Father, they give testimony of me."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "sed vos non creditis, quia non estis ex ovibus meis."
      en: "But you do not believe, because you are not of my sheep."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Oves meae vocem meam audiunt, et ego cognosco eas, et sequuntur me:"
      en: "My sheep hear my voice: and I know them, and they follow me."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et ego vitam aeternam do eis, et non peribunt in aeternum, et non rapiet eas quisquam de manu mea."
      en: "And I give them life everlasting; and they shall not perish for ever, and no man shall pluck them out of my hand."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Pater meus quod dedit mihi, majus omnibus est: et nemo potest rapere de manu Patris mei."
      en: "That which my Father hath given me, is greater than all: and no one can snatch them out of the hand of my Father."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Ego et Pater unum sumus."
      en: "I and the Father are one."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Sustulerunt ergo lapides Judaei, ut lapidarent eum."
      en: "The Jews then took up stones to stone him."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Respondit eis Jesus: Multa bona opera ostendi vobis ex Patre meo: propter quod eorum opus me lapidatis?"
      en: "Jesus answered them: Many good works I have shewed you from my Father; for which of these works do you stone me?"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Responderunt ei Judaei: De bono opere non lapidamus te, sed de blasphemia; et quia tu homo cum sis, facis teipsum Deum."
      en: "The Jews answered him: For a good work we stone thee not, but for blasphemy; and because that thou, being a man, maketh thyself God."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Respondit eis Jesus: Nonne scriptum est in lege vestra, Quia ego dixi: Dii estis?"
      en: "Jesus answered them: Is it not written in your law: I said you are gods?"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Si illos dixit deos, ad quos sermo Dei factus est, et non potest solvi Scriptura:"
      en: "If he called them gods, to whom the word of God was spoken, and the scripture cannot be broken;"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "quem Pater sanctificavit, et misit in mundum vos dicitis: Quia blasphemas, quia dixi: Filius Dei sum?"
      en: "Do you say of him whom the Father hath sanctified and sent into the world: Thou blasphemest, because I said, I am the Son of God?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Si non facio opera Patris mei, nolite credere mihi."
      en: "If I do not the works of my Father, believe me not."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Si autem facio: etsi mihi non vultis credere, operibus credite, ut cognoscatis, et credatis quia Pater in me est, et ego in Patre."
      en: "But if I do, though you will not believe me, believe the works: that you may know and believe that the Father is in me, and I in the Father."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Quaerebant ergo eum apprehendere: et exivit de manibus eorum."
      en: "They sought therefore to take him; and he escaped out of their hands."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et abiit iterum trans Jordanem, in eum locum ubi erat Joannes baptizans primum, et mansit illic;"
      en: "And he went again beyond the Jordan, into that place where John was baptizing first; and there he abode."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et multi venerunt ad eum, et dicebant: Quia Joannes quidem signum fecit nullum."
      en: "And many resorted to him, and they said: John indeed did no sign."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Omnia autem quaecumque dixit Joannes de hoc, vera erant. Et multi crediderunt in eum."
      en: "But all things whatsoever John said of this man, were true. And many believed in him."
    status: { la: verified, en: verified }
