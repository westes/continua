# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jos
chapter: 8
verses:
  - n: 1
    text:
      la: "Dixit autem Dominus ad Josue: Ne timeas, neque formides: tolle tecum omnem multitudinem pugnatorum, et consurgens ascende in oppidum Hai. Ecce tradidi in manu tua regem ejus, et populum, urbemque et terram."
      en: "And the Lord said to Josue: Fear not, nor be thou dismayed: take with thee all the multitude of fighting men, arise and go up to the town of Hai. Behold I have delivered into thy hand the king thereof, and the people, and the city, and the land."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Faciesque urbi Hai, et regi ejus, sicut fecisti Jericho, et regi illius: praedam vero, et omnia animantia diripietis vobis: pone insidias urbi post eam."
      en: "And thou shalt do to the city of Hai, and to the king thereof, as thou hast done to Jericho, and to the king thereof: but the spoils and all the cattle you shall take for a prey to yourselves: lay an ambush for the city behind it."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Surrexitque Josue, et omnis exercitus bellatorum cum eo, ut ascenderent in Hai: et electa triginta millia virorum fortium misit nocte,"
      en: "And Josue arose, and all the army of the fighting men with him, to go up against Hai: and he sent thirty thousand chosen valiant men in the night,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "praecepitque eis, dicens: Ponite insidias post civitatem: nec longius recedatis: et eritis omnes parati."
      en: "And commanded them, saying: Lay an ambush behind the city: and go not very far from it: and be ye all ready."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ego autem, et reliqua multitudo, quae mecum est, accedemus ex adverso contra urbem. Cumque exierint contra nos, sicut ante fecimus: fugiemus, et terga vertemus,"
      en: "But I and the rest of the multitude which is with me; will approach on the contrary side against the city. And when they shall come out against us, we will flee, and turn our backs, as we did before:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "donec persequentes ab urbe longius protrahantur: putabunt enim nos fugere sicut prius."
      en: "Till they pursuing us be drawn farther from the city: for they will think that we flee as before."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nobis ergo fugientibus, et illis persequentibus, consurgetis de insidiis, et vastabitis civitatem: tradetque eam Dominus Deus vester in manus vestras."
      en: "And whilst we are fleeing, and they pursuing, you shall arise out of the ambush, and shall destroy the city: and the Lord your God will deliver it into our hands."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cumque ceperitis, succendite eam, et sic omnia facietis, ut jussi."
      en: "And when you shall have taken it, set it on fire, and you shall do all things so as I have commanded."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dimisitque eos, et perrexerunt ad locum insidiarum, sederuntque inter Bethel et Hai, ad occidentalem plagam urbis Hai: Josue autem nocte illa in medio mansit populi,"
      en: "And he sent them away, and they went on to the place of the ambush, and abode between Bethel and Hai, on the west side of the city of Hai. But Josue stayed that night in the midst of the people,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "surgensque diluculo recensuit socios, et ascendit cum senioribus in fronte exercitus, vallatus auxilio pugnatorum."
      en: "And rising early in the morning, he mustered his soldiers, and went up with the ancients in the front of the army environed with the aid of the fighting men."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cumque venissent et ascendissent ex adverso civitatis, steterunt ad septentrionalem urbis plagam, inter quam et eos erat vallis media."
      en: "And when they were come, and were gone up over against the city, they stood on the north side of the city, between which and them there was a valley in the midst."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quinque autem millia viros elegerat, et posuerat in insidiis inter Bethel et Hai ex occidentali parte ejusdem civitatis:"
      en: "And he had chosen five thousand men, and set them to lie in ambush between Bethel and Hai, on the west side of the same city:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "omnis vero reliquus exercitus ad aquilonem aciem dirigebat, ita ut novissimi illius multitudinis occidentalem plagam urbis attingerent. Abiit ergo Josue nocte illa, et stetit in vallis medio."
      en: "But all the rest of the army went in battle array on the north side, so that the last of that multitude reached to the west side of the city. So Josue went that night, and stood in the midst of the valley."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quod cum vidisset rex Hai, festinavit mane, et egressus est cum omni exercitu civitatis, direxitque aciem contra desertum, ignorans quod post tergum laterent insidiae."
      en: "And when the king of Hai saw this, he made haste in the morning, and went out with all the army of the city, and set it in battle array toward the desert, not knowing that there lay an ambush behind his back."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Josue vero et omnis Israel cesserunt loco, simulantes metum, et fugientes per solitudinis viam."
      en: "But Josue, and all Israel gave back, making as if they were afraid, and fleeing by the way of the wilderness."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "At illi vociferante pariter, et se mutuo cohortantes, persecuti sunt eos. Cumque recessissent a civitate,"
      en: "But they shouting together, and encouraging one another, pursued them. And when they were come from the city,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ne unus quidem in urbe Hai et Bethel remansisset qui non persequeretur Israel ( sicut eruperant aperta oppida relinquentes),"
      en: "And not one remained in the city of Hai and of Bethel, that did not pursue after Israel, leaving the towns open as they had rushed out,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dixit Dominus ad Josue: Leva clypeum, qui in manu tua est, contra urbem Hai, quoniam tibi tradam eam."
      en: "The Lord said to Josue: Lift up the shield that is in thy hand, towards the city of Hai, for I will deliver it to thee."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Cumque elevasset clypeum ex adverso civitatis, insidiae, quae latebant, surrexerunt confestim: et pergentes ad civitatem, ceperunt, et succenderunt eam."
      en: "And when he had lifted up his shield towards the city, the ambush that lay hid, rose up immediately: and going to the city, took it and set it on fire."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Viri autem civitatis, qui persequebantur Josue, respicientes et videntes fumum urbis ad caelum usque conscendere, non potuerunt ultra huc illucque diffugere: praesertim cum hi qui simulaverant fugam, et tendebant ad solitudinem, contra persequentes fortissime restitissent."
      en: "And the men of the city, that pursued after Josue, looking back and seeing the smoke of the city rise up to heaven, had no more power to flee this way or that way: especially as they that had counterfeited flight, and were going toward the wilderness, turned back most valiantly against them that pursued."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Vidensque Josue et omnis Israel quod capta esset civitas, et fumus urbis ascenderet, reversus percussit viros Hai."
      en: "So Josue and all Israel seeing that the city was taken, and that the smoke of the city rose up, returned and slew the men of Hai."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Siquidem et illi qui ceperant et succenderant civitatem, egressi ex urbe contra suos, medios hostium ferire coeperunt. Cum ergo ex utraque parte adversarii caederentur, ita ut nullus de tanta multitudine salvaretur,"
      en: "And they also that had taken and set the city on fire, issuing out of the city to meet their own men, began to cut off the enemies who were surrounded by them. So that the enemies being cut off on both sides, not one of so great a multitude was saved."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "regem quoque urbis Hai apprehenderunt viventem, et obtulerunt Josue."
      en: "And they took the king of the city of Hai alive, and brought him to Josue."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Igitur omnibus interfectis, qui Israelem ad deserta tendentem fuerant persecuti, et in eodem loco gladio corruentibus, reversi filii Israel percusserunt civitatem."
      en: "So all being slain that had pursued after Israel in his flight to the wilderness, and tailing by the sword in the same place, the children of Israel returned and laid waste the city."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Erant autem qui in eodem die conciderant a viro usque ad mulierem, duodecim millia hominum, omnes urbis Hai."
      en: "And the number of them that fell that day, both of men and women, was twelve thousand persons all of the city of Hai."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Josue vero non contraxit manum, quam in sublime porrexerat, tenens clypeum donec interficerentur omnes habitatores Hai."
      en: "But Josue drew not back his hand, which he had stretched out on high, holding the shield, till all the inhabitants of Hai were slain."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Jumenta autem et praedam civitatis diviserunt sibi filii Israel, sicut praeceperat Dominus Josue."
      en: "And the children of Israel divided among them the cattle and the prey of the city, as the Lord had commanded Josue."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Qui succendit urbem, et fecit eam tumulum sempiternum:"
      en: "And he burned the city, and made it a heap for ever:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "regem quoque ejus suspendit in patibulo usque ad vesperam et solis occasum. Praecepitque Josue, et deposuerunt cadaver ejus de cruce: projeceruntque in ipso introitu civitatis, congesto super eum magno acervo lapidum, qui permanet usque in praesentem diem."
      en: "And he hung the king thereof on a gibbet until the evening and the going down of the sun. Then Josue commanded, and they took down his carcass from the gibbet: and threw it in the very entrance of the city, heaping upon it a great heap of stones, which remaineth until this present day."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Tunc aedificavit Josue altare Domino Deo Israel in monte Hebal,"
      en: "Then Josue built an altar to the Lord the God of Israel in mount Hebal,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "sicut praeceperat Moyses famulus Domini filiis Israel, et scriptum est in volumine legis Moysi: altare vero de lapidibus impolitis, quos ferrum non tetigit: et obtulit super eo holocausta Domino, immolavitque pacificas victimas."
      en: "As Moses the servant of the Lord had commanded the children of Israel, and it is written in the book of the law of Moses: an altar of unhewn stones which iron had not touched: and he offered upon it holocausts to the Lord, and immolated victims of peace offerings."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et scripsit super lapides Deuteronomium legis Moysi, quod ille digesserat coram filiis Israel."
      en: "And he wrote upon stones the Deuteronomy of the law of Moses, which he had ordered before the children of Israel."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Omnis autem populus, et majores natu, ducesque ac judices, stabant ex utraque parte arcae, in conspectu sacerdotum qui portabant arcam foederis Domini, ut advena, ita et indigena. Media pars eorum juxta montem Garizim, et media juxta montem Hebal, sicut praeceperat Moyses famulus Domini. Et primum quidem benedixit populo Israel."
      en: "And all the people, and the ancients, and the princes and judges stood on both sides of the ark, before the priests that carried the ark of the covenant of the Lord, both the stranger and he that was born among them, half of them by mount Garizim, and half by mount Hebal, as Moses the servant of the Lord had commanded. And first he blessed the people of Israel."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Post haec legit omnia verba benedictionis et maledictionis, et cuncta quae scripta erant in legis volumine."
      en: "After this he read all the words of the blessing and the cursing and all things that were written in the book of the law."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Nihil ex his quae Moyses jusserat, reliquit intactum, sed universa replicavit coram omni multitudine Israel, mulieribus ac parvulis et advenis, qui inter eos morabantur."
      en: "He left out nothing of those things which Moses had commanded, but he repeated all before all the people of Israel, with the women and children and strangers that dwelt among them."
    status: { la: verified, en: verified }
