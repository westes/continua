# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: eccl
chapter: 6
verses:
  - n: 1
    text:
      la: "est et aliud malum quod vidi sub sole et quidem frequens apud homines"
      en: "There is also another evil, which I have seen under the sun, and that frequent among men:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "vir cui dedit Deus divitias et substantiam et honorem et nihil deest animae eius ex omnibus quae desiderat nec tribuit ei potestatem Deus ut comedat ex eo sed homo extraneus vorabit illud hoc vanitas et magna miseria est"
      en: "A man to whom God hath given riches, and substance, and honour, and his soul wanteth nothing of all that he desireth: yet God doth not give him power to eat thereof, but a stranger shall eat it up. This is vanity and a great misery."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "si genuerit quispiam centum et vixerit multos annos et plures dies aetatis habuerit et anima illius non utatur bonis substantiae suae sepulturaque careat de hoc ego pronuntio quod melior illo sit abortivus"
      en: "If a man beget a hundred children, and live many years, and attain to a great age, and his soul make no use of the goods of his substance, and he be without burial: of this man I pronounce, that the untimely born is better than he."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "frustra enim venit et pergit ad tenebras et oblivione delebitur nomen eius"
      en: "For he came in vain, and goeth to darkness, and his name shall be wholly forgotten."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "non vidit solem neque cognovit distantiam boni et mali"
      en: "He hath not seen the sun, nor known the distance of good and evil:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "etiam si duobus milibus annis vixerit et non fuerit perfruitus bonis nonne ad unum locum properant omnia"
      en: "Although he lived two thousand years, and hath not enjoyed good things: do not all make haste to one place?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "omnis labor hominis in ore eius sed anima illius non impletur"
      en: "All the labour of man is for his mouth, but his soul shall not be filled."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quid habet amplius sapiens ab stulto et quid pauper nisi ut pergat illuc ubi est vita"
      en: "What hath the wise man more than the fool? and what the poor man, but to go thither, where there is life?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "melius est videre quod cupias quam desiderare quod nescias sed et hoc vanitas est et praesumptio spiritus"
      en: "Better it is to see what thou mayst desire, than to desire that which thou canst not know. But this also is vanity, and presumption of spirit."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui futurus est iam vocatum est nomen eius et scitur quod homo sit et non possit contra fortiorem se in iudicio contendere"
      en: "He that shall be, his name is already called: and it is known, that he is man, and cannot contend in judgment with him that is stronger than himself."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "verba sunt plurima multa in disputando habentia vanitatem"
      en: "There are many words that have much vanity in disputing."
    status: { la: verified, en: verified }
