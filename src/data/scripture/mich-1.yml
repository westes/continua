# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: mich
chapter: 1
verses:
  - n: 1
    text:
      la: "verbum Domini quod factum est ad Micham Morasthiten in diebus Ioatham Ahaz Ezechiae regum Iuda quod vidit super Samariam et Hierusalem"
      en: "The word of the Lord that came to Micheas the Morasthite, in the days of Joathan, Achaz, and Ezechias, kings of Juda: which he saw concerning Samaria and Jerusalem."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "audite populi omnes et adtendat terra et plenitudo eius et sit Dominus Deus vobis in testem Dominus de templo sancto suo"
      en: "Hear, all ye people: and let the earth give ear, and all that is therein: and let the Lord God be a witness to you, the Lord from his holy temple."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quia ecce Dominus egreditur de loco suo et descendet et calcabit super excelsa terrae"
      en: "For behold the Lord will come forth out of his place: and he will come down, and will tread upon the high places of the earth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et consumentur montes subtus eum et valles scindentur sicut cera a facie ignis sicut aquae quae decurrunt in praeceps"
      en: "And the mountains shall be melted under him: and the valleys shall be cleft, as wax before the fire, and as waters that run down a steep place."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "in scelere Iacob omne istud et in peccatis domus Israhel quod scelus Iacob nonne Samaria et quae excelsa Iudae nonne Hierusalem"
      en: "For the wickedness of Jacob is all this, and for the sins of the house of Israel. What is the wickedness of Jacob? is it not Samaria? and what are the high places of Juda? are they not Jerusalem ?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et ponam Samariam quasi acervum lapidum in agro cum plantatur vinea et detraham in vallem lapides eius et fundamenta eius revelabo"
      en: "And I will make Samaria as a heap of stones in the field when a vineyard is planted: and I will bring down the stones thereof into the valley, and will lay her foundations bare."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et omnia sculptilia eius concidentur et omnes mercedes eius conburentur igni et omnia idola eius ponam in perditionem quia de mercedibus meretricis congregata sunt et usque ad mercedem meretricis revertentur"
      en: "And all her graven things shall be cut in pieces, and all her wages shall be burnt with fire, and I will bring to destruction all her idols: for they were gathered together of the hire of a harlot, and unto the hire of a harlot they shall return."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "super hoc plangam et ululabo vadam spoliatus et nudus faciam planctum velut draconum et luctum quasi strutionum"
      en: "Therefore will I lament and howl: I will go stripped and naked: I will make a wailing like the dragons, and a mourning like the ostriches."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quia desperata est plaga eius quia venit usque ad Iudam tetigit portam populi mei usque ad Hierusalem"
      en: "Because her wound is desperate, because it is come even to Juda, it hath touched the gate of my people even to Jerusalem."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in Geth nolite adnuntiare lacrimis ne ploretis in domo Pulveris pulvere vos conspergite"
      en: "Declare ye it not in Geth, weep ya not with tears: in the house of Dust sprinkle yourselves with dust."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et transite vobis habitatio Pulchra confusa ignominia non est egressa quae habitat in Exitu planctum domus Vicinae accipiet ex vobis quae stetit sibimet"
      en: "And pass away, O thou that dwellest in the Beautiful place, covered with thy shame: she went not forth that dwelleth in the confines: the House adjoining shall receive mourning from you, which stood by herself."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quia infirmata est in bonum quae habitat in Amaritudinibus quia descendit malum a Domino in portam Hierusalem"
      en: "For she is become weak unto good that dwelleth in bitterness: for evil is come down from the Lord into the gate of Jerusalem."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "tumultus quadrigae stuporis habitanti Lachis principium peccati est filiae Sion quia in te inventa sunt scelera Israhel"
      en: "A tumult of chariots hath astonished the inhabitants of Lachis: it is the beginning of sin to the daughter of Sion, for in thee were found the crimes of Israel."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "propterea dabit emissarios super hereditatem Geth domus Mendacii in deceptionem regibus Israhel"
      en: "Therefore shall she send messengers to the inheritance of Geth : the houses of lying to deceive the kings of Israel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "adhuc heredem adducam tibi quae habitas in Maresa usque Adollam veniet gloria Israhel"
      en: "Yet will I bring an heir to thee that dwellest in Maresa: even to Odollam shall the glory of Israel come."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "decalvare et tondere super filios deliciarum tuarum dilata calvitium tuum sicut aquila quoniam captivi ducti sunt ex te"
      en: "Make thee bald, and be polled for thy delicate children: enlarge thy baldness as the eagle: for they are carried into captivity from thee."
    status: { la: verified, en: verified }
