# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jdc
chapter: 16
verses:
  - n: 1
    text:
      la: "Abiit quoque in Gazam, et vidit ibi mulierem meretricem, ingressusque est ad eam."
      en: "He went also into Gaza, and saw there a woman a harlot, and went in unto her."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quod cum audissent Philisthiim, et percrebruisset apud eos, intrasse urbem Samson, circumdederunt eum, positis in porta civitatis custodibus: et ibi tota nocte cum silentio praestolantes, ut facto mane exeuntem occiderent."
      en: "And when the Philistines had heard this, and it was noised about among them, that Samson was come into the city, they surrounded him, setting guards at the gate of the city, and watching there all the night in silence, that in the morning they might kill him as he went out."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dormivit autem Samson usque ad medium noctem: et inde consurgens, apprehendit ambas portae fores cum postibus suis et sera, impositasque humeris suis portavit ad verticem montis, qui respicit Hebron."
      en: "But Samson slept till midnight, and then rising he took both the doors of the gate, with the posts thereof, and the bolt, and laying them on his shoulders, carried them up to the top of the hill, which looketh towards Hebron."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Post haec amavit mulierem, quae habitabat in valle Sorec, et vocabatur Dalila."
      en: "After this he loved a woman, who dwelt in the valley of Sorec, and she was called Dalila."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Veneruntque ad eam principes Philisthinorum, atque dixerunt: Decipe eum, et disce ab illo, in quo habeat tantam fortitudinem, et quomodo eam superare valeamus, et vinctum affligere: quod si feceris, dabimus tibi singuli mille et centum argenteos."
      en: "And the princes of the Philistines came to her, and said: Deceive him, and learn of him wherein his great strength lieth, and how we may be able to overcome him, to bind and afflict him: which if thou shalt do, we will give thee every one of us eleven hundred pieces of silver."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Locuta est ergo Dalila ad Samson: Dic mihi, obsecro, in quo sit tua maxima fortitudo, et quid sit quo ligatus erumpere nequeas?"
      en: "And Dalila said to Samson: Tell me, I beseech thee, wherein thy greatest strength lieth, and what it is wherewith if thou wert bound thou couldst not break loose."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cui respondit Samson: Si septem nerviceis funibus necdum siccis, et adhuc humentibus, ligatus fuero, infirmus ero ut ceteri homines."
      en: "And Samson answered her: If I shall be bound with seven cords made of sinews not yet dry, but still moist, I shall be weak like other men."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Attuleruntque ad eam satrapae Philisthinorum septem funes, ut dixerat: quibus vinxit eam,"
      en: "And the princes of the Philistines brought unto her seven cords, such is he spoke of, with which she bound him;"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "latentibus apud se insidiis, et in cubiculo finem rei expectantibus, clamavitque ad eum: Philisthiim super te, Samson. Qui rupit vincula, quomodo si rumpat quis filum de stuppae tortum putamine, cum odorem ignis acceperit: et non est cognitum in quo esset fortitudo ejus."
      en: "Men lying privately in wait with her, and in the chamber expecting the event of the thing, and she cried out to him: The Philistines are upon thee, Samson. And he broke the bands, as a man would break a thread of tow twined with spittle, when it smelleth the fire: so it was not known wherein his strength lay."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dixitque ad eum Dalila: Ecce illusisti mihi, et falsum locutus es: saltem nunc indica mihi quo ligari debeas."
      en: "And Dalila said to him: Behold thou hast mocked me, and hast told me a false thing: but now at least tell me wherewith thou mayest be bound."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cui ille respondit: Si ligatus fuero novis funibus, qui numquam fuerunt in opere, infirmus ero, et aliorum hominum similis."
      en: "And he answered her: If I shall be bound with new ropes, that were never in work, I shall be weak and like other men."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quibus rursum Dalila vinxit eum, et clamavit: Philisthiim super te, Samson: in cubiculo insidiis praeparatis. Qui ita rupit vincula quasi fila telarum."
      en: "Dalila bound him again with these, and cried out: The Philistines are upon thee, Samson, there being an ambush prepared for him in the chamber. But he broke the bands like threads of webs."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dixitque Dalila rursum ad eum: Usquequo decipis me, et falsum loqueris? ostende quo vinciri debeas. Cui respondit Samson: Si septem crines capitis mei cum licio plexueris, et clavum his circumligatum terrae fixeris, infirmus ero."
      en: "And Dalila said to him again: How long dost thou deceive me, and tell me lies? shew me wherewith thou mayest be bound. And Samson answered her: If thou plattest the seven locks of my head with a lace, and tying them round about a nail fastenest it in the ground, I shall be weak."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quod cum fecisset Dalila, dixit ad eum: Philisthiim super te, Samson. Qui consurgens de somno extraxit clavum cum crinibus et licio."
      en: "And when Dalila had done this, she said to him: The Philistines are upon thee, Samson. And awaking out of his sleep he drew out the nail with the hairs and the lace."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dixitque ad eum Dalila: Quomodo dicis quod amas me, cum animus tuus non sit mecum? Per tres vices mentitus es mihi, et noluisti dicere in quo sit maxima fortitudo tua."
      en: "And Dalila said to him: How dost thou say thou lovest me, when thy mind is not with me? Thou hast told me lies these three times, and wouldst not tell me wherein thy great strength lieth."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cumque molesta esset ei, et per multos dies jugiter adhaereret, spatium ad quietem non tribuens, defecit anima ejus, et ad mortem usque lassata est."
      en: "And when she pressed him much, and continually hung upon him for many days, giving him no time to rest, his soul fainted away, and was wearied even until death."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Tunc aperiens veritatem rei, dixit ad eam: Ferrum numquam ascendit super caput meum, quia nazaraeus, id est, consecratus Deo sum de utero matris meae: si rasum fuerit caput meum, recedet a me fortitudo mea, et deficiam, eroque sicut ceteri homines."
      en: "Then opening the truth of the thing, he said to her: The razor hath never come upon my head, for I am a Nazarite, that is to say, consecrated to God from my mother's womb: if my head be shaven, my strength shall depart from me, and I shall become weak, and shall be like other men."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vidensque illa quod confessus ei esset omnem animum suum, misit ad principes Philisthinorum ac mandavit: Ascende adhuc semel, quia nunc mihi aperuit cor suum. Qui ascenderunt assumpta pecunia, quam promiserant."
      en: "Then seeing that he had discovered to her all his mind, she sent to the princes of the Philistines, saying: Come up this once more, for now he hath opened his heart to me. And they went up taking with them the money which they had promised."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "At illa dormire eum fecit super genua sua, et in sinu suo reclinare caput. Vocavitque tonsorem, et rasit septem crines ejus, et coepit abigere eum, et a se repellere: statim enim ab eo fortitudo discessit."
      en: "But she made him sleep upon her knees, and lay his head in her bosom. And she called a barber, and shaved his seven locks, and began to drive him away, and thrust him from her: for immediately his strength departed from him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dixitque: Philisthiim super te, Samson. Qui de somno consurgens, dixit in animo suo: Egrediar sicut ante feci, et me excutiam, nesciens quod recessisset ab eo Dominus."
      en: "And she said: The Philistines are upon thee, Samson. And awaking from sleep, he said in his mind: I will go out as I did before, and shake myself, not knowing that the Lord was departed from him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quem cum apprehendissent Philisthiim, statim eruerunt oculos ejus, et duxerunt Gazam vinctum catenis, et clausum in carcere molere fecerunt."
      en: "Then the Philistines seized upon him, and forthwith pulled out his eyes, and led him bound in chains to Gaza, and shutting him up in prison made him grind."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Jamque capilli ejus renasci coeperunt,"
      en: "And now his hair began to grow again."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "principes Philisthinorum convenerunt in unum ut immolarent hostias magnificas Dagon deo suo, et epularentur, dicentes: Tradidit deus noster inimicum nostrum Samson in manus nostras."
      en: "And the princes of the Philistines assembled together, to offer great sacrifices to Dagon their god, and to make merry, saying: Our god hath delivered our enemy Samson into our hands."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Quod etiam populus videns, laudabat deum suum, eademque dicebat: Tradidit deus noster adversarium nostrum in manus nostras, qui delevit terram nostram, et occidit plurimos."
      en: "And the people also seeing this, praised their god, and said the same: Our god hath delivered our adversary into our bands, him that destroyed our country and killed very many."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Laetantesque per convivia, sumptis jam epulis, praeceperunt ut vocaretur Samson, et ante eos luderet. Qui adductus de carcere ludebat ante eos, feceruntque eum stare inter duas columnas."
      en: "And rejoicing in their feasts, when they had now taken their good cheer, they commanded that Samson should be called, and should play before them. And being brought out of prison he played before them, and they made him stand between two pillars."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Qui dixit puero regenti gressus suos: Dimitte me, ut tangam columnas, quibus omnis imminet domus, et recliner super eas, et paululum requiescam."
      en: "And he said to the lad that guided his steps: Suffer me to touch the pillars which support the whole house, and let me lean upon them, and rest a little."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Domus autem erat plena virorum ac mulierum, et erant ibi omnes principes Philisthinorum, ac de tecto et solario circiter tria millia utriusque sexus spectantes ludentem Samson."
      en: "Now the house was full of men and women, and all the princes of the Philistines were there. Moreover about three thousand persons of both sexes from the roof and the higher part of the house, were beholding Samson's play."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "At ille invocato Domino ait: Domine Deus, memento mei, et redde mihi nunc fortitudinem pristinam, Deus meus, ut ulciscar me de hostibus meis, et pro amissione duorum luminum unam ultionem recipiam."
      en: "But he called upon the Lord, saying: O Lord God, remember me, and restore to me now my former strength, O my God, that I may revenge myself on my enemies, and for the loss of my two eyes I may take one revenge."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et apprehendens ambas columnas, quibus innitebatur domus, alteramque earum dextera, et alteram laeva tenens,"
      en: "And laying hold on both the pillars on which the house rested, and holding the one with his right hand, and the other with his left,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ait: Moriatur anima mea cum Philisthiim. Concussisque fortiter columnis, cecidit domus super omnes principes, et ceteram multitudinem, quae ibi erat: multoque plures interfecit moriens, quam ante vivus occiderat."
      en: "He said: Let me die with the Philistines. And when he had strongly shook the pillars, the house fell upon all the princes, and the rest of the multitude that was there: and he killed many more at his death, than he had killed before in his life."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Descendentes autem fratres ejus et universa cognatio, tulerunt corpus ejus, et sepelierunt inter Saraa et Esthaol in sepulchro patris sui Manue: judicavitque Israel viginti annis."
      en: "And his brethren and all his kindred, going down took his body, and buried it between Saraa and Esthaol in the buryingplace of his father Manue: and he judged Israel twenty years."
    status: { la: verified, en: verified }
