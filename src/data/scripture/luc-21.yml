# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: luc
chapter: 21
verses:
  - n: 1
    text:
      la: "respiciens autem vidit eos qui mittebant munera sua in gazofilacium divites"
      en: "And looking on, he saw the rich men cast their gifts into the treasury."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "vidit autem et quandam viduam pauperculam mittentem aera minuta duo"
      en: "And he saw also a certain poor widow casting in two brass mites."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dixit vere dico vobis quia vidua haec pauper plus quam omnes misit"
      en: "And he said: Verily I say to you, that this poor widow hath cast in more than they all:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "nam omnes hii ex abundanti sibi miserunt in munera Dei haec autem ex eo quod deest illi omnem victum suum quem habuit misit"
      en: "For all these have of their abundance cast into the offerings of God: but she of her want, hath cast in all the living that she had."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et quibusdam dicentibus de templo quod lapidibus bonis et donis ornatum esset dixit"
      en: "And some saying of the temple, that it was adorned with goodly stones and gifts, he said:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "haec quae videtis venient dies in quibus non relinquetur lapis super lapidem qui non destruatur"
      en: "These things which you see, the days will come in which there shall not be left a stone upon a stone that shall not be thrown down."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "interrogaverunt autem illum dicentes praeceptor quando haec erunt et quod signum cum fieri incipient"
      en: "And they asked him, saying: Master, when shall these things be? and what shall be the sign when they shall begin to come to pass?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui dixit videte ne seducamini multi enim venient in nomine meo dicentes quia ego sum et tempus adpropinquavit nolite ergo ire post illos"
      en: "Who said: Take heed you be not seduced; for many will come in my name, saying, I am he; and the time is at hand: go ye not therefore after them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cum autem audieritis proelia et seditiones nolite terreri oportet primum haec fieri sed non statim finis"
      en: "And when you shall hear of wars and seditions, be not terrified: these things must first come to pass; but the end is not yet presently."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "tunc dicebat illis surget gens contra gentem et regnum adversus regnum"
      en: "Then he said to them: Nation shall rise against nation, and kingdom against kingdom."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "terraemotus magni erunt per loca et pestilentiae et fames terroresque de caelo et signa magna erunt"
      en: "And there shall be great earthquakes in divers places, and pestilences, and famines, and terrors from heaven; and there shall be great signs."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "sed ante haec omnia inicient vobis manus suas et persequentur tradentes in synagogas et custodias trahentes ad reges et praesides propter nomen meum"
      en: "But before all these things, they will lay their hands upon you, and persecute you, delivering you up to the synagogues and into prisons, dragging you before kings and governors, for my name's sake."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "continget autem vobis in testimonium"
      en: "And it shall happen unto you for a testimony."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ponite ergo in cordibus vestris non praemeditari quemadmodum respondeatis"
      en: "Lay it up therefore into your hearts, not to meditate before how you shall answer:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ego enim dabo vobis os et sapientiam cui non poterunt resistere et contradicere omnes adversarii vestri"
      en: "For I will give you a mouth and wisdom, which all your adversaries shall not be able to resist and gainsay."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "trademini autem a parentibus et fratribus et cognatis et amicis et morte adficient ex vobis"
      en: "And you shall be betrayed by your parents and brethren, and kinsmen and friends; and some of you they will put to death."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et eritis odio omnibus propter nomen meum"
      en: "And you shall be hated by all men for my name's sake."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et capillus de capite vestro non peribit"
      en: "But a hair of your head shall not perish."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "in patientia vestra possidebitis animas vestras"
      en: "In your patience you shall possess your souls."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "cum autem videritis circumdari ab exercitu Hierusalem tunc scitote quia adpropinquavit desolatio eius"
      en: "And when you shall see Jerusalem compassed about with an army; then know that the desolation thereof is at hand."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "tunc qui in Iudaea sunt fugiant in montes et qui in medio eius discedant et qui in regionibus non intrent in eam"
      en: "Then let those who are in Judea, flee to the mountains; and those who are in the midst thereof, depart out: and those who are in the countries, not enter into it."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quia dies ultionis hii sunt ut impleantur omnia quae scripta sunt"
      en: "For these are the days of vengeance, that all things may be fulfilled, that are written."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "vae autem praegnatibus et nutrientibus in illis diebus erit enim pressura magna supra terram et ira populo huic"
      en: "But woe to them that are with child, and give suck in those days; for there shall be great distress in the land, and wrath upon this people."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et cadent in ore gladii et captivi ducentur in omnes gentes et Hierusalem calcabitur a gentibus donec impleantur tempora nationum"
      en: "And they shall fall by the edge of the sword; and shall be led away captives into all nations; and Jerusalem shall be trodden down by the Gentiles; till the times of the nations be fulfilled."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et erunt signa in sole et luna et stellis et in terris pressura gentium prae confusione sonitus maris et fluctuum"
      en: "And there shall be signs in the sun, and in the moon, and in the stars; and upon the earth distress of nations, by reason of the confusion of the roaring of the sea and of the waves;"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "arescentibus hominibus prae timore et expectatione quae supervenient universo orbi nam virtutes caelorum movebuntur"
      en: "Men withering away for fear, and expectation of what shall come upon the whole world. For the powers of heaven shall be moved;"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et tunc videbunt Filium hominis venientem in nube cum potestate magna et maiestate"
      en: "And then they shall see the Son of man coming in a cloud, with great power and majesty."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "his autem fieri incipientibus respicite et levate capita vestra quoniam adpropinquat redemptio vestra"
      en: "But when these things begin to come to pass, look up, and lift up your heads, because your redemption is at hand."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et dixit illis similitudinem videte ficulneam et omnes arbores"
      en: "And he spoke to them in a similitude. See the fig tree, and all the trees:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "cum producunt iam ex se fructum scitis quoniam prope est aestas"
      en: "When they now shoot forth their fruit, you know that summer is nigh;"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ita et vos cum videritis haec fieri scitote quoniam prope est regnum Dei"
      en: "So you also, when you shall see these things come to pass, know that the kingdom of God is at hand."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "amen dico vobis quia non praeteribit generatio haec donec omnia fiant"
      en: "Amen, I say to you, this generation shall not pass away, till all things be fulfilled."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "caelum et terra transibunt verba autem mea non transient"
      en: "Heaven and earth shall pass away, but my words shall not pass away."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "adtendite autem vobis ne forte graventur corda vestra in crapula et ebrietate et curis huius vitae et superveniat in vos repentina dies illa"
      en: "And take heed to yourselves, lest perhaps your hearts be overcharged with surfeiting and drunkenness, and the cares of this life, and that day come upon you suddenly."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "tamquam laqueus enim superveniet in omnes qui sedent super faciem omnis terrae"
      en: "For as a snare shall it come upon all that sit upon the face of the whole earth."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "vigilate itaque omni tempore orantes ut digni habeamini fugere ista omnia quae futura sunt et stare ante Filium hominis"
      en: "Watch ye, therefore, praying at all times, that you may be accounted worthy to escape all these things that are to come, and to stand before the Son of man."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "erat autem diebus docens in templo noctibus vero exiens morabatur in monte qui vocatur Oliveti"
      en: "And in the daytime, he was teaching in the temple; but at night, going out, he abode in the mount that is called Olivet."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et omnis populus manicabat ad eum in templo audire eum"
      en: "And all the people came early in the morning to him in the temple, to hear him."
    status: { la: verified, en: verified }
