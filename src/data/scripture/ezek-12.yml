# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 12
verses:
  - n: 1
    text:
      la: "Et factus est sermo Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fili hominis, in medio domus exasperantis tu habitas, qui oculos habent ad videndum, et non vident, et aures ad audiendum, et non audiunt, quia domus exasperans est."
      en: "Son of man, thou dwellest in the midst of a provoking house: who have eyes to see, and see not: and ears to hear, and hear not: for they are a provoking house."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tu ergo, fili hominis, fac tibi vasa transmigrationis, et transmigrabis per diem coram eis. Transmigrabis autem de loco tuo ad locum alterum, in conspectu eorum, si forte aspiciant, quia domus exasperans est:"
      en: "Thou, therefore, O son of man, prepare thee all necessaries for removing, and remove by day in their sight: and thou shalt remove out of thy place to another place in their sight, if so be they will regard it: for they are a provoking house."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et efferes foras vasa tua quasi vasa transmigrantis per diem in conspectu eorum: tu autem egredieris vespere coram eis, sicut egreditur migrans."
      en: "And thou shalt bring forth thy furniture as the furniture of one that is removing by day in their sight: and thou shalt go forth in the evening in their presence, as one goeth forth that removeth his dwelling."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ante oculos eorum perfode tibi parietem, et egredieris per eum:"
      en: "Dig thee a way through the wall before their eyes: and thou shalt go forth through it."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in conspectu eorum in humeris portaberis, in caligine effereris: faciem tuam velabis, et non videbis terram, quia portentum dedi te domui Israel."
      en: "In their sight thou shalt be carried out upon men's shoulders, thou shalt be carried out in the dark: thou shalt cover thy face, and shalt not see the ground: for I have set thee for a sign of things to come to the house of Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Feci ergo sicut praeceperat mihi Dominus: vasa mea protuli quasi vasa transmigrantis per diem: et vespere perfodi mihi parietem manu, et in caligine egressus sum, in humeris portatus in conspectu eorum."
      en: "I did therefore as he had commanded me: I brought forth my goods by day, as the goods of one that removeth: and in the evening I digged through the wall with my hand: and I went forth in the dark, and was carried on men's shoulders in their sight."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et factus est sermo Domini mane ad me, dicens:"
      en: "And the word of the Lord came to me in the morning, saying:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Fili hominis, numquid non dixerunt ad te domus Israel, domus exasperans: Quid tu facis?"
      en: "Son of man, hath not the house of Israel, the provoking house, said to thee: What art thou doing?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dic ad eos: Haec dicit Dominus Deus: Super ducem onus istud, qui est in Jerusalem, et super omnem domum Israel, quae est in medio eorum."
      en: "Say to them: Thus saith the Lord God: This burden concerneth my prince that is in Jerusalem, and all the house of Israel, that are among them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Dic: Ego portentum vestrum: quomodo feci, sic fiet illis: in transmigrationem et in captivitatem ibunt."
      en: "Say: I am a sign of things to come to you: as I have done, so shall it be done to them: they shall be removed from their dwellings, and go into captivity."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et dux qui est in medio eorum, in humeris portabitur, in caligine egredietur: parietem perfodient, ut educant eum: facies ejus operietur, ut non videat oculo terram:"
      en: "And the prince that is in the midst of them, shall be carried on shoulders, he shall go forth in the dark: they shall dig through the wall to bring him out: his face shall be covered, that he may not see the ground with his eyes."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et extendam rete meum super eum, et capietur in sagena mea: et adducam eum in Babylonem, in terram Chaldaeorum: et ipsam non videbit, ibique morietur."
      en: "And I will spread my net over him, and he shall be taken in my net: and I will bring him into Babylon, into the land of the Chaldeans, and he shall not see it, and there he shall die."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et omnes qui circa eum sunt, praesidium ejus, et agmina ejus, dispergam in omnem ventum, et gladium evaginabo post eos."
      en: "And all that are about him, his guards, and his troops I will scatter into every wind: and I will draw out the sword after them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et scient quia ego Dominus, quando dispersero illos in gentibus, et disseminavero eos in terris."
      en: "And they shall know that I am the Lord, when I shall have dispersed them among the nations, and scattered them in the countries."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et relinquam ex eis viros paucos a gladio, et fame, et pestilentia, ut enarrent omnia scelera eorum in gentibus ad quas ingredientur, et scient quia ego Dominus."
      en: "And I will leave a few men of them from the sword, and from the famine, and from the pestilence: that they may declare all their wicked deeds among the nations whither they shall go: and they shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et factus est sermo Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Fili hominis, panem tuum in conturbatione comede, sed et aquam tuam in festinatione et moerore bibe."
      en: "Son of man, eat thy bread in trouble: and drink thy water in hurry and sorrow."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et dices ad populum terrae: Haec dicit Dominus Deus ad eos qui habitant in Jerusalem, in terra Israel: Panem suum in sollicitudine comedent, et aquam suam in desolatione bibent: ut desoletur terra a multitudine sua, propter iniquitatem omnium qui habitant in ea."
      en: "And say to the people of the land: Thus saith the Lord God to them that dwell in Jerusalem in the land of Israel: They shall eat their bread in care, and drink their water in desolation: that the land may become desolate from the multitude that is therein, for the iniquity of all that dwell therein."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et civitates quae nunc habitantur, desolatae erunt, terraque deserta, et scietis quia ego Dominus."
      en: "And the cities that are now inhabited shall be laid waste, and the land shall be desolate: and you shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et factus est sermo Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Fili hominis, quod est proverbium istud vobis in terra Israel, dicentium: In longum differentur dies, et peribit omnis visio?"
      en: "Son of man, what is this proverb that you have in the land of Israel? saying: The days shall be prolonged, and every vision shall fail."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ideo dic ad eos: Haec dicit Dominus Deus: Quiescere faciam proverbium istud, neque vulgo dicetur ultra in Israel: et loquere ad eos quod appropinquaverint dies et sermo omnis visionis."
      en: "Say to them therefore: Thus saith the Lord God: I will make this proverb to cease, neither shall it be any more a common saying in Israel: and tell them that the days are at hand, and the effect of every vision."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Non enim erit ultra omnis visio cassa, neque divinatio ambigua in medio filiorum Israel,"
      en: "For there shall be no more any vain visions, nor doubtful divination in the midst of the children of Israel."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quia ego Dominus loquar, et quodcumque locutus fuero verbum, fiet, et non prolongabitur amplius: sed in diebus vestris, domus exasperans, loquar verbum, et faciam illud, dicit Dominus Deus."
      en: "For I the Lord will speak: and what word soever I shall speak, it shall come to pass, and shall not be prolonged any more: but in your days, ye provoking house, I will speak the word, and will do it, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et factus est sermo Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Fili hominis, ecce domus Israel dicentium: Visio quam hic videt, in dies multos, et in tempora longa iste prophetat."
      en: "Son of man, behold the house of Israel, they that say: The vision that this man seeth, is for many days to come: and this man prophesieth of times afar off."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Propterea dic ad eos: Haec dicit Dominus Deus: Non prolongabitur ultra omnis sermo meus: verbum quod locutus fuero, complebitur, dicit Dominus Deus."
      en: "Therefore say to them: Thus saith the Lord God: Not one word of mine shall be prolonged any more: the word that I shall speak shall be accomplished, saith the Lord God."
    status: { la: verified, en: verified }
