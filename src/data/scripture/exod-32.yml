# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 32
verses:
  - n: 1
    text:
      la: "videns autem populus quod moram faceret descendendi de monte Moses congregatus adversus Aaron ait surge fac nobis deos qui nos praecedant Mosi enim huic viro qui nos eduxit de terra Aegypti ignoramus quid acciderit"
      en: "And the people seeing that Moses delayed to come down from the mount, gathering together against Aaron, said: Arise, make us gods, that may go before us: for as to this Moses, the man that brought us out of the land of Egypt, we know not what has befallen him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixitque ad eos Aaron tollite inaures aureas de uxorum filiorumque et filiarum vestrarum auribus et adferte ad me"
      en: "And Aaron said to them: Take the golden earrings from the ears of your wives, and your sons and daughters, and bring them to me."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "fecit populus quae iusserat deferens inaures ad Aaron"
      en: "And the people did what he had commanded, bringing the earrings to Aaron."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quas cum ille accepisset formavit opere fusorio et fecit ex eis vitulum conflatilem dixeruntque hii sunt dii tui Israhel qui te eduxerunt de terra Aegypti"
      en: "And when he had received them, he fashioned them by founders' work, and made of them a molten calf. And they said: These are thy gods, O Israel, that have brought thee out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quod cum vidisset Aaron aedificavit altare coram eo et praeconis voce clamavit dicens cras sollemnitas Domini est"
      en: "And when Aaron saw this, he built an altar before it, and made proclamation by a crier's voice, saying: To morrow is the solemnity of the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "surgentesque mane obtulerunt holocausta et hostias pacificas et sedit populus comedere ac bibere et surrexerunt ludere"
      en: "And rising in the morning, they offered holocausts, and peace victims, and the people sat down to eat, and drink, and they rose up to play."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "locutus est autem Dominus ad Mosen vade descende peccavit populus tuus quem eduxisti de terra Aegypti"
      en: "And the Lord spoke to Moses, saying: Go, get thee down: thy people, which thou hast brought out of the land of Egypt, hath sinned."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "recesserunt cito de via quam ostendisti eis feceruntque sibi vitulum conflatilem et adoraverunt atque immolantes ei hostias dixerunt isti sunt dii tui Israhel qui te eduxerunt de terra Aegypti"
      en: "They have quickly strayed from the way which thou didst shew them: and they have made to themselves a molten calf, and have adored it, and sacrificing victims to it, have said: These are thy gods, O Israel, that have brought thee out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "rursumque ait Dominus ad Mosen cerno quod populus iste durae cervicis sit"
      en: "And again the Lord said to Moses: See that this people is stiffnecked:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dimitte me ut irascatur furor meus contra eos et deleam eos faciamque te in gentem magnam"
      en: "Let me alone, that my wrath may be kindled against them, and that I may destroy them, and I will make of thee a great nation."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Moses autem orabat Dominum Deum suum dicens cur Domine irascitur furor tuus contra populum tuum quem eduxisti de terra Aegypti in fortitudine magna et in manu robusta"
      en: "But Moses besought the Lord his God, saying: Why, O Lord, is thy indignation kindled against thy people, whom thou hast brought out of the land of Egypt, with great power, and with a mighty hand?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ne quaeso dicant Aegyptii callide eduxit eos ut interficeret in montibus et deleret e terra quiescat ira tua et esto placabilis super nequitia populi tui"
      en: "Let not the Egyptians say, I beseech thee: He craftily brought them out, that he might kill them in the mountains, and destroy them from the earth: let thy anger cease, and be appeased upon the wickedness of thy people."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "recordare Abraham Isaac et Israhel servorum tuorum quibus iurasti per temet ipsum dicens multiplicabo semen vestrum sicut stellas caeli et universam terram hanc de qua locutus sum dabo semini vestro et possidebitis eam semper"
      en: "Remember Abraham, Isaac, and Israel, thy servants, to whom thou sworest by thy own self, saying: I will multiply your seed as the stars of heaven: and this whole land that I have spoken of, I will give to you seed, and you shall possess it for ever."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "placatusque est Dominus ne faceret malum quod locutus fuerat adversus populum suum"
      en: "And the Lord was appeased from doing the evil which he had spoken against his people."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et reversus est Moses de monte portans duas tabulas testimonii manu scriptas ex utraque parte"
      en: "And Moses returned from the mount, carrying the two tables of the testimony in his hand, written on both sides,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et factas opere Dei scriptura quoque Dei erat sculpta in tabulis"
      en: "And made by the work of God: the writing also of God was graven in the tables."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "audiens autem Iosue tumultum populi vociferantis dixit ad Mosen ululatus pugnae auditur in castris"
      en: "And Josue hearing the noise of the people shouting, said to Moses: The noise of battle is heard in the camp."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui respondit non est clamor adhortantium ad pugnam neque vociferatio conpellentium ad fugam sed vocem cantantium ego audio"
      en: "But he answered: It is not the cry of men encouraging to fight, nor the shout of men compelling to flee: but I hear the voice of singers."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "cumque adpropinquasset ad castra vidit vitulum et choros iratusque valde proiecit de manu tabulas et confregit eas ad radices montis"
      en: "And when he came nigh to the camp, he saw the calf, and the dances: and being very angry, he threw the tables out of his hand, and broke them at the foot of the mount:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "arripiensque vitulum quem fecerant conbusit et contrivit usque ad pulverem quem sparsit in aqua et dedit ex eo potum filiis Israhel"
      en: "And laying hold of the calf which they had made, he burnt it, and beat it to powder, which he strowed into water, and gave thereof to the children of Israel to drink."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "dixitque ad Aaron quid tibi fecit hic populus ut induceres super eum peccatum maximum"
      en: "And he said to Aaron: What has this people done to thee, that thou shouldst bring upon them a most heinous sin?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "cui ille respondit ne indignetur dominus meus tu enim nosti populum istum quod pronus sit ad malum"
      en: "And he answered him: Let not my lord be offended: for thou knowest this people, that they are prone to evil."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "dixerunt mihi fac nobis deos qui praecedant nos huic enim Mosi qui nos eduxit de terra Aegypti nescimus quid acciderit"
      en: "They said to me: Make us gods, that may go before us: for as to this Moses, who brought us forth out of the land of Egypt, we know not what is befallen him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "quibus ego dixi quis vestrum habet aurum tulerunt et dederunt mihi et proieci illud in ignem egressusque est hic vitulus"
      en: "And I said to them: Which of you hath any gold? and they took and brought it to me: and I cast it into the fire, and this calf came out."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "videns ergo Moses populum quod esset nudatus spoliaverat enim eum Aaron propter ignominiam sordis et inter hostes nudum constituerat"
      en: "And when Moses saw that the people were naked, (for Aaron had stripped them by occasion of the shame of the filth, and had set them naked among their enemies,)"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et stans in porta castrorum ait si quis est Domini iungatur mihi congregatique sunt ad eum omnes filii Levi"
      en: "Then standing in the gate of the camp, he said: If any man be on the Lord's side let him join with me. And all the sons of Levi gathered themselves together unto him:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "quibus ait haec dicit Dominus Deus Israhel ponat vir gladium super femur suum ite et redite de porta usque ad portam per medium castrorum et occidat unusquisque fratrem et amicum et proximum suum"
      en: "And he said to them: Thus saith the Lord God of Israel: Put every man his sword upon his thigh: go, and return from gate to gate through the midst of the camp, and let every man kill his brother, and friend, and neighbour."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "fecerunt filii Levi iuxta sermonem Mosi cecideruntque in die illo quasi tria milia hominum"
      en: "And the sons of Levi did according to the words of Moses, and there were slain that day about three and twenty thousand men."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et ait Moses consecrastis manus vestras hodie Domino unusquisque in filio et fratre suo ut detur vobis benedictio"
      en: "And Moses said: You have consecrated your hands this day to the Lord, every man in his son and in his brother, that a blessing may be given to you."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "facto autem die altero locutus est Moses ad populum peccastis peccatum maximum ascendam ad Dominum si quo modo eum quivero deprecari pro scelere vestro"
      en: "And when the next day was come, Moses spoke to the people: You have sinned a very great sin: I will go up to the Lord, if by any means I may be able to entreat him for your crime."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "reversusque ad Dominum ait obsecro peccavit populus iste peccatum magnum feceruntque sibi deos aureos aut dimitte eis hanc noxam"
      en: "And returning to the Lord, he said: I beseech thee: this people hath sinned a heinous sin, and they have made to themselves gods of gold: either forgive them this trespass,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "aut si non facis dele me de libro tuo quem scripsisti"
      en: "Or if thou do not, strike me out of the book that thou hast written."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "cui respondit Dominus qui peccaverit mihi delebo eum de libro meo"
      en: "And the Lord answered him: He that hath sinned against me, him will I strike out of my book:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "tu autem vade et duc populum istum quo locutus sum tibi angelus meus praecedet te ego autem in die ultionis visitabo et hoc peccatum eorum"
      en: "But go thou, and lead this people whither I have told thee: my angel shall go before thee. And I in the day of revenge will visit this sin also of theirs."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "percussit ergo Dominus populum pro reatu vituli quem fecit Aaron"
      en: "The Lord therefore struck the people for the guilt on occasion of the calf which Aaron had made."
    status: { la: verified, en: verified }
