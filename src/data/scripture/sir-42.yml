# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 42
verses:
  - n: 1
    text:
      la: "non duplices sermonem auditus de revelatione sermonis absconditi et eris vere sine confusione et invenies gratiam in conspectu omnium hominum ne pro his omnibus confundaris et ne accipias personam ut delinquas"
      en: "Repeat not the word which thou hast heard, and disclose not the thing that is secret; so shalt thou be truly without confusion, and shah find favour before all men: be not ashamed of any of these things, and accept no person to sin thereby:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "de lege Altissimi et testamento et de iudicio iustificare impium"
      en: "Of the law of the most High, and of his covenant, and of judgment to justify the ungodly:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "de verbo sociorum et viatorum et de datione hereditatis amicorum"
      en: "Of the affair of companions and travellers, and of the gift of the inheritance of friends:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "de aequalitate staterae et ponderum et de adquisitione multorum et paucorum"
      en: "Of exactness of balance and weights, of getting much or little:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "de correptione emptionis et negotiatorum et de multa disciplina filiorum servo pessimo latus sanguinare"
      en: "Of the corruption of buying, and of merchants, and of much correction of children, and to make the side of a wicked slave to bleed."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "super mulierem nequam bonum est signum"
      en: "Sure keeping is good over a wicked wife."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ubi manus multae sunt clude et quodcumque trades numera et adpende datum vero et acceptum omne describe"
      en: "Where there are many hands, shut up, and deliver all things in number, and weight: and put all in writing that thou givest out or receivest in."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "de disciplina insensati et fatui et de senioribus qui iudicantur ab adulescentibus et eris eruditus in omnibus et probabilis in conspectu omnium virorum"
      en: "Be not ashamed to inform the unwise and foolish, and the aged, that are judged I by young men: and thou shalt be well instructed in all things, and well approved in the sight of all men living."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "filia patri abscondita est vigilia et sollicitudo eius auferet somnum ne forte in adulescentia sua adultera efficiatur et commorata cum viro odibilis fiat"
      en: "The father waketh for the daughter when no man knoweth, and the care for her taketh away his sleep, when she is young, lest she pass away the flower of her age, and when she is married, lest she should be hateful:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "nequando polluatur in virginitate sua et in paternis suis gravida inveniatur ne forte cum viro commorata transgrediatur aut certe sterilis efficiatur"
      en: "In her virginity, lest she should be corrupted, and be found with child in her father's house: and having a husband, lest she should misbehave herself, or at the least become barren."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "super filiam luxuriosam confirma custodiam nequando faciat te in obprobrium venire inimicis a detractatione in civitate et abiectione plebis et confundat te in multitudine populi"
      en: "Keep a sure watch over a shameless daughter: lest at any time she make thee become a laughingstock to thy enemies, and a byword in the city, and a reproach among the people, and she make thee ashamed before all the multitude."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "omni homini noli intendere in specie et in medio mulierum noli commorari"
      en: "Behold not everybody's beauty: and tarry not among women."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "de vestimentis enim procedit tinea et a muliere iniquitas viri"
      en: "For from garments cometh a moth, end from a woman the iniquity of a man."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "melior est iniquitas viri quam benefaciens mulier et mulier confundens in obprobrium"
      en: "For better is the iniquity of a man, than a woman doing a good turn, and a woman bringing shame and reproach."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "memor ero igitur operum Domini et quae vidi adnuntiabo in sermonibus Domini opera eius"
      en: "I will now remember the works of the Lord, and I will declare the things I have seen. By the words of the Lord are his works."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sol inluminans per omnia respexit et gloria Domini plenum est opus eius"
      en: "The sun giving light hath looked upon all things, and full of the glory of the Lord is his work."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "nonne Dominus fecit sanctos enarrare omnia mirabilia sua quae confirmavit Dominus omnipotens stabiliri in gloria sua"
      en: "Hath not the Lord made the saints to declare all his wonderful works, which the Lord Almighty hath firmly settled to be established for his glory?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "abyssum et cor hominum investigavit et in astutia illorum excogitavit"
      en: "He hath searched out the deep, and the heart of men: and considered their crafty devices."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "cognovit enim Dominus omnem scientiam et inspexit in signum aevi adnuntians quae praeterierunt et quae superventura sunt revelans vestigia occultorum"
      en: "For the Lord knoweth all knowledge, and hath beheld the signs of the world, he declareth the things that are past, and the things that are to come, and revealeth the traces of hidden things."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "non praeterit illum omnis cogitatus et non abscondit se ab eo ullus sermo"
      en: "No thought escapeth him, and no word can hide itself from him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "magnalia sapientiae suae decoravit qui est ante saeculum et usque in saeculum neque adiectum est"
      en: "He hath beautified the glorious works of his wisdom: and he Is from eternity to eternity, and to him nothing may be added,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "neque minuitur et non eget alicuius consilio"
      en: "Nor can he be diminished, and he hath no need of any counsellor."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quam desiderabilia omnia opera eius et tamquam scintillam quam est considerare"
      en: "O how desirable are all his works, and what we can know is but as a spark!"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "omnia haec vivent et manent in saeculum et in omni necessitate omnia obaudiunt ei"
      en: "All these things live, and remain for ever, and for every use all things obey him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "omnia duplicia unum contra unum et non fecit quicquam deesse"
      en: "All things are double, one against another, and he hath made nothing defective."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "uniuscuiusque confirmavit bona et quis satiabitur videns gloriam eius"
      en: "He hath established the good things of every one. And who shall be filled with beholding his glory?"
    status: { la: verified, en: verified }
