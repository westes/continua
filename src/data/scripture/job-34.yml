# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 34
verses:
  - n: 1
    text:
      la: "pronuntians itaque Heliu etiam haec locutus est"
      en: "And Eliu continued his discourse, and said :"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "audite sapientes verba mea et eruditi auscultate me"
      en: "Hear ye, wise men, my words, and ye learned, hearken to me :"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "auris enim verba probat et guttur escas gustu diiudicat"
      en: "For the ear trieth words, and the mouth discerneth meats by the taste."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "iudicium eligamus nobis et inter nos videamus quid sit melius"
      en: "Let us choose to us judgment, and let us see among ourselves what is the best."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quia dixit Iob iustus sum et Deus subvertit iudicium meum"
      en: "For Job hath said : I am just, and God hath overthrown my judgment."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in iudicando enim me mendacium est violenta sagitta mea absque ullo peccato"
      en: "For in judging me there is a lie : my arrow is violent without any sin."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quis est vir ut est Iob qui bibit subsannationem quasi aquam"
      en: "What man is there like Job, who drinketh up scorning like water?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui graditur cum operantibus iniquitatem et ambulat cum viris impiis"
      en: "Who goeth in company with them that work iniquity, and walketh with wicked men?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dixit enim non placebit vir Deo etiam si cucurrerit cum eo"
      en: "For he hath said : Man shall not please God, although he run with him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ideo viri cordati audite me absit a Deo impietas et ab Omnipotente iniquitas"
      en: "Therefore, ye men of understanding, hear me : far from god be wickedness, and iniquity from the Almighty."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "opus enim hominis reddet ei et iuxta vias singulorum restituet"
      en: "For he will render to a man his work, and according to the ways of every one he will reward them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "vere enim Deus non condemnabit frustra nec Omnipotens subvertet iudicium"
      en: "For in very deed God will not condemn without cause, neither will the Almighty pervert judgment."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quem constituit alium super terram aut quem posuit super orbem quem fabricatus est"
      en: "What other hath he appointed over the earth? or whom hath he set over the world which he made?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "si direxerit ad eum cor suum spiritum illius et flatum ad se trahet"
      en: "If he turn his heart to him, he shall draw his spirit and breath unto himself."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "deficiet omnis caro simul et homo in cinerem revertetur"
      en: "All flesh shall perish together, and man shall return into ashes."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "si habes ergo intellectum audi quod dicitur et ausculta vocem eloquii mei"
      en: "If then thou hast understanding, hear what is said, and hearken to the voice of my words."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "numquid qui non amat iudicium sanare potest et quomodo tu eum qui iustus est in tantum condemnas"
      en: "Can he be healed that loveth not judgment? and how dost thou so far condemn him that is just?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui dicit regi apostata qui vocat duces impios"
      en: "Who saith to the king : Thou art an apostate : who calleth rulers ungodly?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "qui non accipit personas principum nec cognovit tyrannum cum disceptaret contra pauperem opus enim manuum eius sunt universi"
      en: "Who accepteth not the persons of princes : nor hath regarded the tyrant, when he contended against the poor man : for all are the work of his hands."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "subito morientur et in media nocte turbabuntur populi et pertransibunt et auferent violentum absque manu"
      en: "They shall suddenly die, and the people shall be troubled at midnight, and they shall pass, and take away the violent without hand."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "oculi enim eius super vias hominum et omnes gressus eorum considerat"
      en: "For his eyes are upon the ways of men, and he considereth all their steps."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "non sunt tenebrae et non est umbra mortis ut abscondantur ibi qui operantur iniquitatem"
      en: "There is no darkness, and there is no shadow of death, where they may be hid who work iniquity."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "neque enim ultra in hominis potestate est ut veniat ad Deum in iudicium"
      en: "For it is no longer in the power of man to enter into judgment with God."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "conteret multos innumerabiles et stare faciet alios pro eis"
      en: "He shall break in pieces many and innumerable, and shall make others to stand in their stead."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "novit enim opera eorum et idcirco inducet noctem et conterentur"
      en: "For he knoweth their works : and therefore he shall bring night on them, and they shall be destroyed."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "quasi impios percussit eos in loco videntium"
      en: "He hath struck them, as being wicked, in open sight."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "qui quasi de industria recesserunt ab eo et omnes vias eius intellegere noluerunt"
      en: "Who as it were on purpose have revolted from him, and would not understand all his ways :"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "ut pervenire facerent ad eum clamorem egeni et audiret vocem pauperum"
      en: "So that they caused the cry of the needy to come to him, and he heard the voice of the poor."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ipso enim concedente pacem quis est qui condemnet ex quo absconderit vultum quis est qui contempletur eum et super gentem et super omnes homines"
      en: "For when he granteth peace, who is there that can condemn? When he hideth his countenance, who is there that can behold him, whether it regard nations, or all men?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "qui regnare facit hominem hypocritam propter peccata populi"
      en: "Who maketh a man that is a hypocrite to reign for the sins of the people?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "quia ergo ego locutus sum ad Deum te quoque non prohibeo"
      en: "Seeing then I have spoken of God, I will not hinder thee in thy turn."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "si erravi tu doce me si iniquitatem locutus sum ultra non addam"
      en: "If I have erred, teach thou me : if I have spoken iniquity, I will add no more."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "numquid a te Deus expetit eam quia displicuit tibi tu enim coepisti loqui et non ego quod si quid nosti melius loquere"
      en: "Doth God require it of thee, because it hath displeased thee? for thou begannest to speak, and not I. : but if thou know any thing better, speak."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "viri intellegentes loquantur mihi et vir sapiens audiat me"
      en: "Let men of understanding speak to me, and let a wise man hearken to me."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Iob autem stulte locutus est et verba illius non sonant disciplinam"
      en: "But Job hath spoken foolishly, and his words sound not discipline."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "pater mi probetur Iob usque ad finem ne desinas in hominibus iniquitatis"
      en: "My father, let Job be tried even to the end : cease not from the man of iniquity."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "quia addit super peccata sua blasphemiam inter nos interim constringatur et tunc ad iudicium provocet sermonibus suis Deum"
      en: "Because he addeth blasphemy upon his sins, let him be tied fast in the mean time amongst us : and then let him provoke God to judgment with his speeches."
    status: { la: verified, en: verified }
