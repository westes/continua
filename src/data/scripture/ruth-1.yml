# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ruth
chapter: 1
verses:
  - n: 1
    text:
      la: "In diebus unius judicis, quando judices praeerant, facta est fames in terra. Abiitque homo de Bethlehem Juda, ut peregrinaretur in regione Moabitide cum uxore sua ac duobus liberis."
      en: "In the days of one of the judges, when the judges ruled, there came a famine in the land. And a certain man of Bethlehem Juda, went to sojourn in the land of Moab with his wife and his two sons."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ipse vocabatur Elimelech, et uxor ejus Noemi: et duo filii, alter Mahalon, et alter Chelion, Ephrathaei de Bethlehem Juda. Ingressique regionem Moabitidem, morabantur ibi."
      en: "He was named Elimelech, and his wife, Noemi: and his two sons, the one Mahalon, and the other Chelion, Ephrathites of Bethlehem Juda. And entering into the country of Moab, they abode there."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et mortuus est Elimelech maritus Noemi: remansitque ipsa cum filiis."
      en: "And Elimelech the husband of Noemi died: and she remained with her sons."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Qui acceperunt uxores Moabitidas, quarum una vocabatur Orpha, altera vero Ruth. Manseruntque ibi decem annis,"
      en: "And they took wives of the women of Moab, of which one was called Orpha, and the other Ruth. And they dwelt there ten years."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et ambo mortui sunt, Mahalon videlicet et Chelion: remansitque mulier orbata duobus liberis ac marito."
      en: "And they both died, to wit, Mahalon and Chelion: and the woman was left alone, having lost both her sons and her husband."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et surrexit ut in patriam pergeret cum utraque nuru sua de regione Moabitide: audierat enim quod respexisset Dominus populum suum, et dedisset eis escas."
      en: "And she arose to go from the land of Moab to her own country with both her daughters in law: for she had heard that the Lord had looked upon his people, and had given them food."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Egressa est itaque de loco peregrinationis suae, cum utraque nuru: et jam in via revertendi posita in terram Juda,"
      en: "Wherefore she went forth out of the place of her sojournment, with both her daughters in law: and being now in the way to return into the land of Juda,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixit ad eas: Ite in domum matris vestrae: faciat vobiscum Dominus misericordiam, sicut fecistis cum mortuis et mecum."
      en: "She said to them: Go ye home to your mothers: the Lord deal mercifully with you, as you have dealt with the dead and with me."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Det vobis invenire requiem in domibus virorum quos sortiturae estis. Et osculata est eas. Quae elevata voce flere coeperunt,"
      en: "May he grant you to find rest in the houses of the husbands which you shall take. And she kissed them. And they lifted up their voice and began to weep,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et dicere: Tecum pergemus ad populum tuum."
      en: "And to say: We will go on with thee to thy people."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quibus illa respondit: Revertimini, filiae meae, cur venitis mecum? num ultra habeo filios in utero meo, ut viros ex me sperare possitis?"
      en: "But she answered them: Return, my daughters: why come ye with me? have I any more sons in my womb, that you may hope for husbands of me?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Revertimini, filiae meae, et abite: jam enim senectute confecta sum, nec apta vinculo conjugali: etiamsi possem hac nocte concipere, et parere filios,"
      en: "Return again, my daughters, and go your ways: for I am now spent with age, and not fit for wedlock. Although I might conceive this night, and bear children,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "si eos expectare velitis donec crescant, et annos pubertatis impleant, ante eritis vetulae quam nubatis. Nolite, quaeso, filiae meae: quia vestra angustia magis me premit, et egressa est manus Domini contra me."
      en: "If you would wait till they were grown up, and come to man's estate, you would be old women before you marry. Do not so, my daughters, I beseech you: for I am grieved the more for your distress, and the hand of the Lord is gone out against me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Elevata igitur voce, rursum flere coeperunt: Orpha osculata est socrum, ac reversa est: Ruth adhaesit socrui suae:"
      en: "And they lifted up their voice, and began to weep again: Orpha kissed her mother in law and returned: Ruth stuck close to her mother in law."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cui dixit Noemi: En reversa est cognata tua ad populum suum, et ad deos suos, vade cum ea."
      en: "And Noemi said to her: Behold thy kinswoman is returned to her people, and to her gods, go thou with her."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quae respondit: Ne adverseris mihi ut relinquam te et abeam: quocumque enim perrexeris, pergam, et ubi morata fueris, et ego pariter morabor. Populus tuus populus meus, et Deus tuus Deus meus."
      en: "She answered: Be not against me, to desire that I should leave thee and depart: for whithersoever thou shalt go, I will go: and where thou shalt dwell, I also will dwell. Thy people shall be my people, and thy God my God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quae te terra morientem susceperit, in ea moriar: ibique locum accipiam sepulturae. Haec mihi faciat Dominus, et haec addat, si non sola mors me et te separaverit."
      en: "The land that shall receive thee dying, in the same will I die: and there will I be buried. The Lord do so and so to me, and add more also, if aught but death part me and thee."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Videns ergo Noemi quod obstinato animo Ruth decrevisset secum pergere, adversari noluit, nec ad suos ultra reditum persuadere:"
      en: "Then Noemi, seeing that Ruth was steadfastly determined to go with her, would not be against it, nor persuade her any more to return to her friends:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "profectaeque sunt simul, et venerunt in Bethlehem. Quibus urbem ingressis, velox apud cunctos fama percrebruit: dicebantque mulieres: Haec est illa Noemi."
      en: "So they went together and came to Bethlehem. And when they were come into the city, the report was quickly spread among all: and the women said: This is that Noemi."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quibus ait: Ne vocetis me Noemi ( id est, pulchram), sed vocate me Mara ( id est, amaram), quia amaritudine valde replevit me Omnipotens."
      en: "But she said to them: Call me not Noemi, (that is, beautiful,) but call me Mara, (that is, bitter,) for the Almighty hath quite filled me with bitterness."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Egressa sum plena, et vacuam reduxit me Dominus. Cur ergo vocatis me Noemi, quam Dominus humiliavit, et afflixit Omnipotens?"
      en: "I went out full, and the Lord hath brought me back empty. Why then do you call me Noemi, whom the Lord hath humbled and the Almighty hath afflicted?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Venit ergo Noemi cum Ruth Moabitide nuru sua, de terra peregrinationis suae: ac reversa est in Bethlehem, quando primum hordea metebantur."
      en: "So Noemi came with Ruth the Moabitess her daughter in law, from the land of her sojournment: and returned into Bethlehem, in the beginning of the barley harvest."
    status: { la: verified, en: verified }
