# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1mach
chapter: 4
verses:
  - n: 1
    text:
      la: "Et assumpsit Gorgias quinque millia virorum, et mille equites electos: et moverunt castra nocte,"
      en: "Then Gorgias took five thousand men, and a thousand of the best horsemen: and they removed out of the camp by night."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ut applicarent ad castra Judaeorum, et percuterent eos subito: et filii, qui erant ex arce, erant illis duces."
      en: "That they might come upon the camp of the Jews, and strike them suddenly: and the men that were of the castle were their guides."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et audivit Judas, et surrexit ipse et potentes percutere virtutem exercituum regis, qui erant in Emmaum:"
      en: "And Judas heard of it, and rose up, he and the valiant men, to attack the king's forces that were in Emmaus."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "adhuc enim dispersus erat exercitus a castris."
      en: "For as yet the army was dispersed from the camp."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et venit Gorgias in castra Judae noctu, et neminem invenit: et quaerebat eos in montibus, quoniam dixit: Fugiunt hi a nobis."
      en: "And Gorgias came by night into the camp of Judas, and found no man, and he sought them in the mountains: for he said: These men flee from us."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et cum dies factus esset, apparuit Judas in campo cum tribus millibus virorum tantum, qui tegumenta et gladios non habebant:"
      en: "And when it was day, Judas shewed himself in the plain with three thousand men only, who neither had armour nor swords."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et viderunt castra gentium valida, et loricatos et equitatus in circuitu eorum, et hi docti ad praelium."
      en: "And they saw the camp of the Gentiles that it was strong, and the men in breastplates, and the horsemen round about them, and these were trained up to war."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et ait Judas viris, qui secum erant: Ne timueritis multitudinem eorum, et impetum eorum ne formidetis."
      en: "And Judas said to the men that were with him: Fear ye not their multitude, neither be ye afraid of their assault."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Mementote qualiter salvi facti sunt patres nostri in mari Rubro, cum sequeretur eos Pharao cum exercitu multo."
      en: "Remember in what manner our fathers were saved in the Red Sea, when Pharao pursued them with a great army."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et nunc clamemus in caelum: et miserebitur nostri Dominus, et memor erit testamenti patrum nostrorum, et conteret exercitum istum ante faciem nostram hodie:"
      en: "And now let us cry to heaven: and the Lord will have mercy on us, and will remember the covenant of our fathers, and will destroy this army before our face this day:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et scient omnes gentes quia est qui redimat et liberet Israel."
      en: "And all nations shall know that there is one that redeemeth and delivereth Israel."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et elevaverunt alienigenae oculos suos, et viderunt eos venientes ex adverso."
      en: "And the strangers lifted up their eyes, and saw them coming against them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et exierunt de castris in praelium, et tuba cecinerunt hi qui erant cum Juda."
      en: "And they went out of the camp to battle, and they that were with Judas sounded the trumpet."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et congressi sunt: et contritae sunt gentes, et fugerunt in campum."
      en: "And they joined battle: and the Gentiles were routed, and fled into the plain."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Novissimi autem omnes ceciderunt in gladio, et persecuti sunt eos usque Gezeron, et usque in campos Idumaeae, et Azoti, et Jamniae: et ceciderunt ex illis usque ad tria millia virorum."
      en: "But all the hindmost of them fell by the sword, and they pursued them as far as Gezeron, and even to the plains of Idumea, and of Azotus, and of Jamnia: and there fell of them to the number of three thousand men."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et reversus est Judas, et exercitus ejus sequens eum."
      en: "And Judas returned again with his army that followed him,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dixitque ad populum: Non concupiscatis spolia: quia bellum contra nos est,"
      en: "And he said to the people: Be not greedy of the spoils: for there is war before us:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et Gorgias et exercitus ejus prope nos in monte: sed state nunc contra inimicos nostros, et expugnate eos, et sumetis postea spolia securi."
      en: "And Gorgias and his army are near us in the mountain: but stand ye now against our enemies, and overthrow them, and you shall take the spoils afterwards with safety."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et adhuc loquente Juda haec, ecce apparuit pars quaedam prospiciens de monte."
      en: "And as Judas was speaking these words, behold part of them appeared looking forth from the mountain."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et vidit Gorgias quod in fugam conversi sunt sui, et succenderunt castra: fumus enim, qui videbatur, declarabat quod factum est."
      en: "And Gorgias saw that his men were put to flight, and that they had set fire to the camp: for the smoke that was seen declared what was done."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quibus illi conspectis timuerunt valde, aspicientes simul et Judam, et exercitum in campo paratum ad praelium."
      en: "And when they had seen this, they were seized with great fear, seeing at the same time Judas and his army in the plain ready to fight."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et fugerunt omnes in campum alienigenarum:"
      en: "So they all fled away into the land of the strangers."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et Judas reversus est ad spolia castrorum, et acceperunt aurum multum, et argentum, et hyacinthinum, et purpuram marinam, et opes magnas."
      en: "And Judas returned to take the spoils of the camp, and they got much gold, and silver, and blue silk, and purple of the sea, and great riches."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et conversi, hymnum canebant, et benedicebant Deum in caelum, quoniam bonus est, quoniam in saeculum misericordia ejus."
      en: "And returning home they sung a hymn, and blessed God in heaven, because he is good, because his mercy endureth for ever."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et facta est salus magna in Israel in die illa."
      en: "So Israel had a great deliverance that day."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Quicumque autem alienigenarum evaserunt, venerunt, et nuntiaverunt Lysiae universa quae acciderant."
      en: "And such of the strangers as escaped, went and told Lysias all that had happened."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Quibus ille auditis, consternatus animo deficiebat: quod non qualia voluit, talia contigerunt in Israel, et qualia mandavit rex."
      en: "And when he heard these things, he was amazed and discouraged: because things had not succeeded in Israel according to his mind, and as the king had commanded."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et sequenti anno, congregavit Lysias virorum electorum sexaginta millia, et equitum quinque millia, ut debellaret eos."
      en: "So the year following Lysias gathered together threescore thousand chosen men, and five thousand horsemen, that he might subdue them."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et venerunt in Judaeam, et castra posuerunt in Bethoron, et occurrit illis Judas cum decem millibus viris."
      en: "And they came into Judea, and pitched their tents in Bethoron, and Judas met them with ten thousand men."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et viderunt exercitum fortem, et oravit, et dixit: Benedictus es, salvator Israel, qui contrivisti impetum potentis in manu servi tui David, et tradidisti castra alienigenarum in manu Jonathae filii Saul, et armigeri ejus."
      en: "And they saw that the army was strong, and he prayed, and said: Blessed art thou, O Saviour of Israel, who didst break the violence of the mighty by the hand of thy servant David, and didst deliver up the camp of the strangers into the hands of Jonathan the son of Saul and of his armourbearer."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Conclude exercitum istum in manu populi tui Israel, et confundantur in exercitu suo et equitibus."
      en: "Shut up this army in the hands of thy people Israel, and let them be confounded in their host and their horsemen."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Da illis formidinem, et tabefac audaciam virtutis eorum, et commoveantur contritione sua."
      en: "Strike them with fear, and cause the boldness of their strength to languish, and let them quake at their own destruction."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Dejice illos gladio diligentium te: et collaudent te omnes, qui noverunt nomen tuum, in hymnis."
      en: "Cast them down with the sword of them that love thee: and let all that know thy name, praise thee with hymns."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et commiserunt praelium: et ceciderunt de exercitu Lysiae quinque millia virorum."
      en: "And they joined battle: and there fell of the army of Lysias five thousand men."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Videns autem Lysias fugam suorum, et Judaeorum audaciam, et quod parati sunt aut vivere, aut mori fortiter, abiit Antiochiam, et elegit milites, ut multiplicati rursus venirent in Judaeam."
      en: "And when Lysias saw that his men were put to flight, and how bold the Jews were, and that they were ready either to live, or to die manfully, he went to Antioch, and chose soldiers, that they might come again into Judea with greater numbers."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Dixit autem Judas, et fratres ejus: Ecce contriti sunt inimici nostri: ascendamus nunc mundare sancta, et renovare."
      en: "Then Judas, and his brethren said: Behold our enemies are discomfited: let us go up now to cleanse the holy places and to repair them."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et congregatus est omnis exercitus, et ascenderunt in montem Sion."
      en: "And all the army assembled together, and they went up into mount Sion."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et viderunt sanctificationem desertam, et altare profanatum, et portas exustas, et in atriis virgulta nata sicut in saltu vel in montibus, et pastophoria diruta."
      en: "And they saw the sanctuary desolate, and the altar profaned, and the gates burnt, and shrubs growing up in the courts as in a forest, or on the mountains, and the chambers joining to the temple thrown down."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et sciderunt vestimenta sua, et planxerunt planctu magno, et imposuerunt cinerem super caput suum,"
      en: "And they rent their garments, and made great lamentation, and put ashes on their heads:"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et ceciderunt in faciem super terram, et exclamaverunt tubis signorum, et clamaverunt in caelum."
      en: "And they fell face down to the ground on their faces, and they sounded with the trumpets of alarm, and they cried towards heaven."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Tunc ordinavit Judas viros ut pugnarent adversus eos qui erant in arce, donec emundarent sancta."
      en: "Then Judas appointed men to fight against them that were in the castle, till they had cleansed the holy places."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et elegit sacerdotes sine macula, voluntatem habentes in lege Dei:"
      en: "And he chose priests without blemish, whose will was set upon the law of God:"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et mundaverunt sancta, et tulerunt lapides contaminationis in locum immundum."
      en: "And they cleansed the holy places, and took away the stones that had been defiled into an unclean place."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Et cogitavit de altari holocaustorum, quod profanatum erat, quid de eo faceret."
      en: "And he considered about the altar of holocausts that had been profaned, what he should do with it."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Et incidit illis consilium bonum ut destruerent illud: ne forte illis esset in opprobrium, quia contaminaverunt illud gentes, et demoliti sunt illud."
      en: "And a good counsel came into their minds, to pull it down: lest it should be a reproach to them, because the Gentiles had defiled it; so they threw it down."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Et reposuerunt lapides in monte domus in loco apto, quoadusque veniret propheta, et responderet de eis."
      en: "And they laid up the stones in the mountain of the temple in a convenient place, till there should come a prophet, and give answer concerning them."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Et acceperunt lapides integros secundum legem, et aedificaverunt altare novum secundum illud quod fuit prius:"
      en: "Then they took whole stones according to the law, and built a new altar according to the former:"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et aedificaverunt sancta, et quae intra domum erant intrinsecus: et aedem, et atria sanctificaverunt."
      en: "And they built up the holy places, and the things that were within the temple: and they sanctified the temple, and the courts."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Et fecerunt vasa sancta nova, et intulerunt candelabrum, et altare incensorum, et mensam, in templum."
      en: "And they made new holy vessels, and brought in the candlestick, and the altar of incense, and the table into the temple."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Et incensum posuerunt super altare, et accenderunt lucernas quae super candelabrum erant, et lucebant in templo."
      en: "And they put incense upon the altar, and lighted up the lamps that were upon the candlestick, and they gave light in the temple."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Et posuerunt super mensam panes, et appenderunt vela, et consummaverunt omnia opera quae fecerant."
      en: "And they set the loaves upon the table, and hung up the veils, and finished all the works that they had begun to make."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Et ante matutinum surrexerunt quinta et vigesima die mensis noni ( hic est mensis Casleu) centesimi quadragesimi octavi anni:"
      en: "And they arose before the morning on the five and twentieth day of the ninth month (which is the month of Casleu) in the hundred and forty-eighth year."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "et obtulerunt sacrificium secundum legem super altare holocaustorum novum, quod fecerunt."
      en: "And they offered sacrifice according to the law upon the new altar of holocausts which they had made."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Secundum tempus et secundum diem in qua contaminaverunt illud gentes, in ipsa renovatum est in canticis, et citharis, et cinyris, et in cymbalis."
      en: "According to the time, and according to the day wherein the heathens had defiled it, in the same was it dedicated anew with canticles, and harps, and lutes, and cymbals."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Et cecidit omnis populus in faciem, et adoraverunt, et benedixerunt in caelum eum, qui prosperavit eis."
      en: "And all the people fell upon their faces, and adored, and blessed up to heaven, him that had prospered them."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Et fecerunt dedicationem altaris diebus octo, et obtulerunt holocausta cum laetitia, et sacrificium salutaris et laudis."
      en: "And they kept the dedication of the altar eight days, and they offered holocausts with joy, and sacrifices of salvation, and of praise."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Et ornaverunt faciem templi coronis aureis et scutulis, et dedicaverunt portas et pastophoria, et imposuerunt eis januas."
      en: "And they adorned the front of the temple with crowns of gold, and escutcheons, and they renewed the gates, and the chambers, and hanged doors upon them."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Et facta est laetitia in populo magna valde, et aversum est opprobrium gentium."
      en: "And there was exceeding great joy among the people, and the reproach of the Gentiles was turned away."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Et statuit Judas, et fratres ejus, et universa ecclesia Israel, ut agatur dies dedicationis altaris in temporibus suis ab anno in annum per dies octo a quinta et vigesima die mensis Casleu, cum laetitia et gaudio."
      en: "And Judas, and his brethren, and all the church of Israel decreed, that the day of the dedication of the altar should be kept in its season from year to year for eight days, from the five and twentieth day of the month of Casleu, with joy and gladness."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "Et aedificaverunt in tempore illo montem Sion, et per circuitum muros altos et turres firmas, nequando venirent gentes, et conculcarent eum sicut antea fecerunt."
      en: "They built up also at that time mount Sion, with high walls, and strong towers round about, lest the Gentiles should at any time come, and tread it down as they did before."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "Et collocavit illic exercitum, ut servarent eum, et munivit eum ad custodiendum Bethsuram, ut haberet populus munitionem contra faciem Idumaeae."
      en: "And he placed a garrison there to keep it, and he fortified it to secure Bethsura, that the people might have a defence against Idumea."
    status: { la: verified, en: verified }
