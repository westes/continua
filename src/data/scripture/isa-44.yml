# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 44
verses:
  - n: 1
    text:
      la: "et nunc audi Iacob serve meus et Israhel quem elegi"
      en: "And now hear, O Jacob, my servant, and Israel whom I have chosen."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "haec dicit Dominus faciens et formans te ab utero auxiliator tuus noli timere serve meus Iacob et Rectissime quem elegi"
      en: "Thus saith the Lord that made and formed thee, thy helper from the womb: Fear not, O my servant Jacob, and thou most righteous whom I have chosen."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "effundam enim aquas super sitientem et fluenta super aridam effundam spiritum meum super semen tuum et benedictionem meam super stirpem tuam"
      en: "For I will pour out waters upon the thirsty ground, and streams upon the dry land: I will pour out my spirit upon thy seed, and my blessing upon thy stock."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et germinabunt inter herbas quasi salices iuxta praeterfluentes aquas"
      en: "And they shall spring up among the herbs, as willows beside the running waters."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "iste dicet Domini ego sum et ille vocabit in nomine Iacob et hic scribet manu sua Domino et in nomine Israhel adsimilabitur"
      en: "One shall say: I am the Lord's, and another shall call himself by the name of Jacob, and another shall subscribe with his hand, To the Lord, and surname himself by the name of Israel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "haec dicit Dominus rex Israhel et redemptor eius Dominus exercituum ego primus et ego novissimus et absque me non est deus"
      en: "Thus saith the Lord the king of Israel, and his redeemer the Lord of hosts: I am the brat, and I am the last, and besides me there is no God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quis similis mei vocet et adnuntiet et ordinem exponat mihi ex quo constitui populum antiquum ventura et quae futura sunt adnuntient eis"
      en: "Who is like to me? let him call and declare: and let him set before me the order, since I appointed the ancient people: and the things to come, and that shall be hereafter, let them shew unto them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "nolite timere neque conturbemini ex tunc audire te feci et adnuntiavi vos estis testes mei numquid est deus absque me et formator quem ego non noverim"
      en: "Fear ye not, neither be ye troubled, from that time I have made thee to hear, and have declared: you are my witnesses. Is there a God besides me, a maker, whom I have not known?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "plastae idoli omnes nihil sunt et amantissima eorum non proderunt eis ipsi sunt testes eorum quia non vident neque intellegunt ut confundantur"
      en: "The makers of idols are all of them nothing, and their best beloved things shall not profit them. They are their witnesses, that they do not see, nor understand, that they may be ashamed."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quis formavit deum et sculptile conflavit ad nihil utile"
      en: "Who hath formed a god, and made a graven thing that is profitable for nothing?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ecce omnes participes eius confundentur fabri enim sunt ex hominibus convenient omnes stabunt et pavebunt et confundentur simul"
      en: "Behold, all the partakers thereof shall be confounded: for the makers are men: they shall all assemble together, they shall stand and fear, and shall be confounded together."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "faber ferrarius lima operatus est in prunis et in malleis formavit illud et operatus est in brachio fortitudinis suae esuriet et deficiet non bibet aquam et lassescet"
      en: "The smith hath wrought with his file, with coals, and with hammers he hath formed it, and hath wrought with the strength of his arm: he shall hunger and faint, he shall drink no water, and shall be weary."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "artifex lignarius extendit normam formavit illud in runcina fecit illud in angularibus et in circino tornavit illud et fecit imaginem viri quasi speciosum hominem habitantem in domo"
      en: "The carpenter hath stretched out his rule, he hath formed it with a plane: he hath made it with corners, and hath fashioned it round with the compass: and he hath made the image of a man as it were a beautiful man dwelling in a house."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "succidit cedros tulit ilicem et quercum quae steterat inter ligna saltus plantavit pinum quam pluvia nutrivit"
      en: "He hath cut down cedars, taken the holm, and the oak that stood among the trees of the forest: he hath planted the pine tree, which the rain hath nourished."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et facta est hominibus in focum sumpsit ex eis et calefactus est et succendit et coxit panes de reliquo autem operatus est deum et adoravit fecit sculptile et curvatus est ante illud"
      en: "And it hath served men for fuel: he took thereof, and warmed himself: and he kindled it, and baked bread: but of the rest he made a god, and adored it: he made a graven thing, and bowed down before it."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "medium eius conbusit igni et de medio eius carnes comedit coxit pulmentum et saturatus est et calefactus est et dixit va calefactus sum vidi focum"
      en: "Part of it he burnt with fire, and with part of it he dressed his meat: he boiled pottage, and was filled, and was warmed, and said: Aha, I am warm, I have seen the fire."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "reliquum autem eius deum fecit sculptile sibi curvatur ante illud et adorat illud et obsecrat dicens libera me quia deus meus es tu"
      en: "But the residue thereof he made a god, and a graven thing for himself: he boweth down before it, and adoreth it, and prayeth unto it, saying: Deliver me, for thou art my God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "nescierunt neque intellexerunt lutati enim sunt ne videant oculi eorum et ne intellegant corde suo"
      en: "They have not known, nor understood: for their eyes are covered that they may not see, and that they may not understand with their heart."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "non recogitant in mente sua neque cognoscunt neque sentiunt ut dicant medietatem eius conbusi igne et coxi super carbones eius panes coxi carnes et comedi et de reliquo eius idolum faciam ante truncum ligni procidam"
      en: "They do not consider in their mind, nor know, nor have the thought to say: I have burnt part of it in the fire, and I have baked bread upon the coals thereof: I have broiled flesh and have eaten, and of the residue thereof shall I make an idol? shall I fall down before the stock of a tree?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "pars eius cinis est cor insipiens adoravit illud et non liberabit animam suam neque dicet forte mendacium est in dextera mea"
      en: "Part thereof is ashes: his foolish heart adoreth it, and he will not save his soul, nor say: Perhaps there is a lie in my right hand."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "memento horum Iacob et Israhel quoniam servus meus es tu formavi te servus meus es tu Israhel non oblivisceris mei"
      en: "Remember these things, O Jacob, and Israel, for thou art my servant. I have formed thee, thou art my servant, O Israel, forget me not."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "delevi ut nubem iniquitates tuas et quasi nebulam peccata tua revertere ad me quoniam redemi te"
      en: "I have blotted out thy iniquities as a cloud, and thy sins as a mist: return to me, for I have redeemed thee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "laudate caeli quoniam fecit Dominus iubilate extrema terrae resonate montes laudationem saltus et omne lignum eius quoniam redemit Dominus Iacob et Israhel gloriabitur"
      en: "Give praise, O ye heavens, for the Lord hath shewn mercy: shout with joy, ye ends of the earth: ye mountains, resound with praise, thou, O forest, and every tree therein: for the Lord hath redeemed Jacob, and Israel shall be glorified."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "haec dicit Dominus redemptor tuus et formator tuus ex utero ego sum Dominus faciens omnia extendens caelos solus stabiliens terram et nullus mecum"
      en: "Thus saith the Lord thy redeemer, and thy maker, from the womb: I am the Lord, that make all things, that alone stretch out the heavens, that establish the earth, and there is none with me."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "irrita faciens signa divinorum et ariolos in furorem vertens convertens sapientes retrorsum et scientiam eorum stultam faciens"
      en: "That make void the tokens of diviners, and make the soothsayers mad. That turn the wise backward, and that, make their knowledge foolish."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "suscitans verbum servi sui et consilium nuntiorum suorum conplens qui dico Hierusalem habitaberis et civitatibus Iuda aedificabimini et deserta eius suscitabo"
      en: "That raise up the word of my servant and perform the counsel of my messengers, who say to Jerusalem: Thou shalt be inhabited: and to the cities of Juda: You shall be built, and I will raise up the wastes thereof."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "qui dico profundo desolare et flumina tua arefaciam"
      en: "Who say to the deep: Be thou desolate, and I will dry up thy rivers."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "qui dico Cyro pastor meus es et omnem voluntatem meam conplebis qui dico Hierusalem aedificaberis et templo fundaberis"
      en: "Who say to Cyrus: Thou art my shepherd, and thou shalt perform all my pleasure. Who say to Jerusalem: Thou shalt be built: and to the temple: Thy foundations shall be laid."
    status: { la: verified, en: verified }
