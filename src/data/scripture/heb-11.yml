# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: heb
chapter: 11
verses:
  - n: 1
    text:
      la: "Est autem fides sperandarum substantia rerum, argumentum non apparentium."
      en: "Now faith is the substance of things to be hoped for, the evidence of things that appear not."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "In hac enim testimonium consecuti sunt senes."
      en: "For by this the ancients obtained a testimony."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Fide intelligimus aptata esse saecula verbo Dei: ut ex invisibilibus visibilia fierent."
      en: "By faith we understand that the world was framed by the word of God; that from invisible things visible things might be made."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Fide plurimam hostiam Abel, quam Cain, obtulit Deo, per quam testimonium consecutus est esse justus, testimonium perhibente muneribus ejus Deo, et per illam defunctus adhuc loquitur."
      en: "By faith Abel offered to God a sacrifice exceeding that of Cain, by which he obtained a testimony that he was just, God giving testimony to his gifts; and by it he being dead yet speaketh."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Fide Henoch translatus est ne videret mortem, et non inveniebatur, quia transtulit illum Deus: ante translationem enim testimonium habuit placuisse Deo."
      en: "By faith Henoch was translated, that he should not see death; and he was not found, because God had translated him: for before his translation he had testimony that he pleased God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Sine fide autem impossibile est placere Deo. Credere enim oportet accedentem ad Deum quia est, et inquirentibus se remunerator sit."
      en: "But without faith it is impossible to please God. For he that cometh to God, must believe that he is, and is a rewarder to them that seek him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Fide Noe responso accepto de iis quae adhuc non videbantur, metuens aptavit arcam in salutem domus suae, per quam damnavit mundum: et justitiae, quae per fidem est, haeres est institutus."
      en: "By faith Noe, having received an answer concerning those things which as yet were not seen, moved with fear, framed the ark for the saving of his house, by the which he condemned the world; and was instituted heir of the justice which is by faith."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Fide qui vocatur Abraham obedivit in locum exire, quem accepturus erat in haereditatem: et exiit, nesciens quo iret."
      en: "By faith he that is called Abraham, obeyed to go out into a place which he was to receive for an inheritance; and he went out, not knowing whither he went."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Fide demoratus est in terra repromissionis, tamquam in aliena, in casulis habitando cum Isaac et Jacob cohaeredibus repromissionis ejusdem."
      en: "By faith he abode in the land, dwelling in cottages, with Isaac and Jacob, the co-heirs of the same promise."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Exspectabat enim fundamenta habentem civitatem: cujus artifex et conditor Deus."
      en: "For he looked for a city that hath foundations; whose builder and maker is God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Fide et ipsa Sara sterilis virtutem in conceptionem seminis accepit, etiam praeter tempus aetatis: quoniam fidelem credidit esse eum qui repromiserat."
      en: "By faith also Sara herself, being barren, received strength to conceive seed, even past the time of age; because she believed that he was faithful who had promised,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Propter quod et ab uno orti sunt ( et hoc emortuo) tamquam sidera caeli in multitudinem, et sicut arena, quae est ad oram maris, innumerabilis."
      en: "For which cause there sprung even from one (and him as good as dead) as the stars of heaven in multitude, and as the sand which is by the sea shore innumerable."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Juxta fidem defuncti sunt omnes isti, non acceptis repromissionibus, sed a longe eas aspicientes, et salutantes, et confitentes quia peregrini et hospites sunt super terram."
      en: "All these died according to faith, not having received the promises, but beholding them afar off, and saluting them, and confessing that they are pilgrims and strangers on the earth."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Qui enim haec dicunt, significant se patriam inquirere."
      en: "For they that say these things, do signify that they seek a country."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et si quidem ipsius meminissent de qua exierunt, habebant utique tempus revertendi:"
      en: "And truly if they had been mindful of that from whence they came out, they had doubtless time to return."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "nunc autem meliorem appetunt, id est, caelestem. Ideo non confunditur Deus vocari Deus eorum: paravit enim illis civitatem."
      en: "But now they desire a better, that is to say, a heavenly country. Therefore God is not ashamed to be called their God; for he hath prepared for them a city."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Fide obtulit Abraham Isaac, cum tentaretur, et unigenitum offerebat, qui susceperat repromissiones:"
      en: "By faith Abraham, when he was tried, offered Isaac: and he that had received the promises, offered up his only begotten son;"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ad quem dictum est: Quia in Isaac vocabitur tibi semen:"
      en: "(To whom it was said: In Isaac shall thy seed be called.)"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "arbitrans quia et a mortuis suscitare potens est Deus: unde eum et in parabolam accepit."
      en: "Accounting that God is able to raise up even from the dead. Whereupon also he received him for a parable."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Fide et de futuris benedixit Isaac Jacob et Esau."
      en: "By faith also of things to come, Isaac blessed Jacob and Esau."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Fide Jacob, moriens, singulos filiorum Joseph benedixit: et adoravit fastigium virgae ejus."
      en: "By faith Jacob dying, blessed each of the sons of Joseph, and adored the top of his rod."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Fide Joseph, moriens, de profectione filiorum Israel memoratus est, et de ossibus suis mandavit."
      en: "By faith Joseph, when he was dying, made mention of the going out of the children of Israel; and gave commandment concerning his bones."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Fide Moyses, natus, occultatus est mensibus tribus a parentibus suis, eo quod vidissent elegantem infantem, et non timuerunt regis edictum."
      en: "By faith Moses, when he was born, was hid three months by his parents; because they saw he was a comely babe, and they feared not the king's edict."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Fide Moyses grandis factus negavit se esse filium filiae Pharaonis,"
      en: "By faith Moses, when he was grown up, denied himself to be the son of Pharao's daughter;"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "magis eligens affligi cum populo Dei, quam temporalis peccati habere jucunditatem,"
      en: "Rather choosing to be afflicted with the people of God, than to have the pleasure of sin for a time,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "majores divitias aestimans thesauro Aegyptiorum, improperium Christi: aspiciebat enim in remunerationem."
      en: "Esteeming the reproach of Christ greater riches than the treasure of the Egyptians. For he looked unto the reward."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Fide reliquit Aegyptum, non veritus animositatem regis: invisibilem enim tamquam videns sustinuit."
      en: "By faith he left Egypt, not fearing the fierceness of the king: for he endured as seeing him that is invisible."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Fide celebravit Pascha, et sanguinis effusionem: ne qui vastabat primitiva, tangeret eos."
      en: "By faith he celebrated the pasch, and the shedding of the blood; that he, who destroyed the firstborn, might not touch them."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Fide transierunt mare Rubrum tamquam per aridam terram: quod experti Aegyptii, devorati sunt."
      en: "By faith they passed through the Red Sea, as by dry land: which the Egyptians attempting, were swallowed up."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Fide muri Jericho corruerunt, circuitu dierum septem."
      en: "By faith the walls of Jericho fell down, by the going round them seven days."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Fide Rahab meretrix non periit cum incredulis, excipiens exploratores cum pace."
      en: "By faith Rahab the harlot perished not with the unbelievers, receiving the spies with peace."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et quid adhuc dicam? deficiet enim me tempus enarrantem de Gedeon, Barac, Samson, Jephte, David, Samuel, et prophetis:"
      en: "And what shall I yet say? For the time would fail me to tell of Gedeon, Barac, Samson, Jephthe, David, Samuel, and the prophets:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "qui per fidem vicerunt regna, operati sunt justitiam, adepti sunt repromissiones, obturaverunt ora leonum,"
      en: "Who by faith conquered kingdoms, wrought justice, obtained promises, stopped the mouths of lions,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "extinxerunt impetum ignis, effugerunt aciem gladii, convaluerunt de infirmitate, fortes facti sunt in bello, castra verterunt exterorum:"
      en: "Quenched the violence of fire, escaped the edge of the sword, recovered strength from weakness, became valiant in battle, put to flight the armies of foreigners:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "acceperunt mulieres de resurrectione mortuos suos: alii autem distenti sunt non suscipientes redemptionem ut meliorem invenirent resurrectionem."
      en: "Women received their dead raised to life again. But others were racked, not accepting deliverance, that they might find a better resurrection."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Alii vero ludibria, et verbera experti, insuper et vincula, et carceres:"
      en: "And others had trial of mockeries and stripes, moreover also of bands and prisons."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "lapidati sunt, secti sunt, tentati sunt, in occisione gladii mortui sunt, circuierunt in melotis, in pellibus caprinis, egentes, angustiati, afflicti:"
      en: "They were stoned, they were cut asunder, they were tempted, they were put to death by the sword, they wandered about in sheepskins, in goatskins, being in want, distressed, afflicted:"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "quibus dignus non erat mundus: in solitudinibus errantes, in montibus, in speluncis, et in cavernis terrae."
      en: "Of whom the world was not worthy; wandering in deserts, in mountains, and in dens, and in caves of the earth."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et hi omnes testimonio fidei probati, non acceperunt repromissionem,"
      en: "And all these being approved by the testimony of faith, received not the promise;"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Deo pro nobis melius aliquid providente, ut non sine nobis consummarentur."
      en: "God providing some better thing for us, that they should not be perfected without us."
    status: { la: verified, en: verified }
