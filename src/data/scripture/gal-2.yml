# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gal
chapter: 2
verses:
  - n: 1
    text:
      la: "Deinde post annos quatuordecim, iterum ascendi Jerosolymam cum Barnaba, assumpto et Tito."
      en: "Then, after fourteen years, I went up again to Jerusalem with Barnabas, taking Titus also with me."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ascendi autem secundum revelationem: et contuli cum illis Evangelium, quod praedico in gentibus, seorsum autem iis qui videbantur aliquid esse: ne forte in vacuum currerem, aut cucurrissem."
      en: "And I went up according to revelation; and communicated to them the gospel, which I preach among the Gentiles, but apart to them who seemed to be some thing: lest perhaps I should run, or had run in vain."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sed neque Titus, qui mecum erat, cum esset gentilis, compulsus est circumcidi:"
      en: "But neither Titus, who was with me, being a Gentile, was compelled to be circumcised."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sed propter subintroductos falsos fratres, qui subintroierunt explorare libertatem nostram, quam habemus in Christo Jesu, ut nos in servitutem redigerent."
      en: "But because of false brethren unawares brought in, who came in privately to spy our liberty, which we have in Christ Jesus, that they might bring us into servitude."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quibus neque ad horam cessimus subjectione, ut veritas Evangelii permaneat apud vos:"
      en: "To whom we yielded not by subjection, no not for an hour, that the truth of the gospel might continue with you."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ab iis autem, qui videbantur esse aliquid ( quales aliquando fuerint, nihil mea interest: Deus personam hominis non accipit): mihi enim qui videbantur esse aliquid, nihil contulerunt."
      en: "But of them who seemed to be some thing, (what they were some time, it is nothing to me, God accepteth not the person of man,) for to me they that seemed to be some thing added nothing."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Sed e contra cum vidissent quod creditum est mihi Evangelium praeputii, sicut et Petro circumcisionis"
      en: "But contrariwise, when they had seen that to me was committed the gospel of the uncircumcision, as to Peter was that of the circumcision."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "( qui enim operatus est Petro in apostolatum circumcisionis, operatus est et mihi inter gentes):"
      en: "(For he who wrought in Peter to the apostleship of the circumcision, wrought in me also among the Gentiles.)"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et cum cognovissent gratiam, quae data est mihi, Jacobus, et Cephas, et Joannes, qui videbantur columnae esse, dextras dederunt mihi, et Barnabae societatis: ut nos in gentes, ipsi autem in circumcisionem:"
      en: "And when they had known the grace that was given to me, James and Cephas and John, who seemed to be pillars, gave to me and Barnabas the right hands of fellowship: that we should go unto the Gentiles, and they unto the circumcision:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "tantum ut pauperum memores essemus, quod etiam sollicitus fui hoc ipsum facere."
      en: "Only that we should be mindful of the poor: which same thing also I was careful to do."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cum autem venisset Cephas Antiochiam, in faciem ei restiti, quia reprehensibilis erat."
      en: "But when Cephas was come to Antioch, I withstood him to the face, because he was to be blamed."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Prius enim quam venirent quidam a Jacobo, cum gentibus edebat: cum autem venissent, subtrahebat, et segregabat se, timens eos qui ex circumcisione erant."
      en: "For before that some came from James, he did eat with the Gentiles: but when they were come, he withdrew and separated himself, fearing them who were of the circumcision."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et simulationi ejus consenserunt ceteri Judaei, ita ut et Barnabas duceretur ab eis in illam simulationem."
      en: "And to his dissimulation the rest of the Jews consented, so that Barnabas also was led by them into that dissimulation."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sed cum vidissem quod non recte ambularent ad veritatem Evangelii, dixi Cephae coram omnibus: Si tu, cum Judaeus sis, gentiliter vivis, et non judaice: quomodo gentes cogis judaizare?"
      en: "But when I saw that they walked not uprightly unto the truth of the gospel, I said to Cephas before them all: If thou, being a Jew, livest after the manner of the Gentiles, and not as the Jews do, how dost thou compel the Gentiles to live as do the Jews?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Nos natura Judaei, et non ex gentibus peccatores."
      en: "We by nature are Jews, and not of the Gentiles sinners."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Scientes autem quod non justificatur homo ex operibus legis, nisi per fidem Jesu Christi: et nos in Christo Jesu credimus, ut justificemur ex fide Christi, et non ex operibus legis: propter quod ex operibus legis non justificabitur omnis caro."
      en: "But knowing that man is not justified by the works of the law, but by the faith of Jesus Christ; we also believe in Christ Jesus, that we may be justified by the faith of Christ, and not by the works of the law: because by the works of the law no flesh shall be justified."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quod si quaerentes justificari in Christo, inventi sumus et ipsi peccatores, numquid Christus peccati minister est? Absit."
      en: "But if while we seek to be justified in Christ, we ourselves also are found sinners; is Christ then the minister of sin? God forbid."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Si enim quae destruxi, iterum haec aedifico: praevaricatorem me constituo."
      en: "For if I build up again the things which I have destroyed, I make myself a prevaricator."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ego enim per legem, legi mortuus sum, ut Deo vivam: Christo confixus sum cruci."
      en: "For I, through the law, am dead to the law, that I may live to God: with Christ I am nailed to the cross."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Vivo autem, jam non ego: vivit vero in me Christus. Quod autem nunc vivo in carne: in fide vivo Filii Dei, qui dilexit me, et tradidit semetipsum pro me."
      en: "And I live, now not I; but Christ liveth in me. And that I live now in the flesh: I live in the faith of the Son of God, who loved me, and delivered himself for me."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Non abjicio gratiam Dei. Si enim per legem justitia, ergo gratis Christus mortuus est."
      en: "I cast not away the grace of God. For if justice be by the law, then Christ died in vain."
    status: { la: verified, en: verified }
