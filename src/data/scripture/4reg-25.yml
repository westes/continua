# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 25
verses:
  - n: 1
    text:
      la: "Factum est autem anno nono regni ejus, mense decimo, decima die mensis, venit Nabuchodonosor rex Babylonis, ipse et omnis exercitus ejus in Jerusalem, et circumdederunt eam: et exstruxerunt in circuitu ejus munitiones."
      en: "And it came to pass in the ninth year of his reign, in the tenth month, the tenth day of the month, that Nabuchodonosor king of Babylon came, he and all his army against Jerusalem: and they surrounded it: and raised works round about it."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et clausa est civitas atque vallata usque ad undecimum annum regis Sedeciae,"
      en: "And the city was shut up and besieged till the eleventh year of king Sedecias,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "nona die mensis: praevaluitque fames in civitate, nec erat panis populo terrae."
      en: "The ninth day of the month: and a famine prevailed in the city, and there was no bread for the people of the land."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et interrupta est civitas: et omnes viri bellatores nocte fugerunt per viam portae, quae est inter duplicem murum ad hortum regis. Porro Chaldaei obsidebant in circuitu civitatem. Fugit itaque Sedecias per viam, quae ducit ad campestria solitudinis."
      en: "And a breach was made into the city: and all the men of war fled in the night between the two walls by the king's garden, (now the Chaldees besieged the city round about,) and Sedecias fled by the way that leadeth to the plains of the wilderness."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et persecutus est exercitus Chaldaeorum regem, comprehenditque eum in planitie Jericho: et omnes bellatores, qui erant cum eo, dispersi sunt, et reliquerunt eum."
      en: "And the army of the Chaldees pursued after the king, and overtook him in the plains of Jericho: and all the warriors that were with him were scattered, and left him:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Apprehensum ergo regem duxerunt ad regem Babylonis in Reblatha: qui locutus est cum eo judicium."
      en: "So they took the king, and brought him to the king of Babylon to Reblatha, and he gave judgment upon him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Filios autem Sedeciae occidit coram eo, et oculos ejus effodit, vinxitque eum catenis, et adduxit in Babylonem."
      en: "And he slew the sons of Sedecias before his face, and he put out his eyes, and bound him with chains, and brought him to Babylon."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Mense quinto, septima die mensis, ipse est annus nonusdecimus regis Babylonis: venit Nabuzardan princeps exercitus, servus regis Babylonis, in Jerusalem."
      en: "In the fifth month, the seventh day of the month, that is, the nineteenth year of the king of Babylon, came Nabuzardan commander of the army, a servant of the king of Babylon, into Jerusalem."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et succendit domum Domini, et domum regis: et domos Jerusalem, omnemque domum combussit igni."
      en: "And he burnt the house of the Lord, and the king's house, and the houses of Jerusalem, and every house he burnt with fire."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et muros Jerusalem in circuitu destruxit omnis exercitus Chaldaeorum, qui erat cum principe militum."
      en: "And all the army of the Chaldees, which was with the commander of the troops, broke down the walls of Jerusalem round about."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Reliquam autem populi partem, quae remanserat in civitate, et perfugas, qui transfugerant ad regem Babylonis, et reliquum vulgus transtulit Nabuzardan princeps militiae."
      en: "And Nabuzardan the commander of the army, carried away the rest of the people that remained in the city, and the fugitives that had gone over to the king of Babylon, and the remnant of the common people."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et de pauperibus terrae reliquit vinitores et agricolas."
      en: "But of the poor of the land he left some dressers of vines and husbandmen."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Columnas autem aereas, quae erant in templo Domini, et bases, et mare aereum, quod erat in domo Domini, confregerunt Chaldaei, et transtulerunt aes omne in Babylonem."
      en: "And the pillars of brass that were in the temple of the Lord, and the bases, and the sea of brass which was in the house of the Lord, the Chaldees broke in pieces, and carried all the brass of them to Babylon."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ollas quoque aereas, et trullas, et tridentes, et scyphos, et mortariola, et omnia vasa aerea, in quibus ministrabant, tulerunt."
      en: "They took away also the pots of brass, and the mazers, and the forks, and the cups, and the mortars, and all the vessels of brass with which they ministered."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Necnon et thuribula, et phialas: quae aurea, aurea: et quae argentea, argentea tulit princeps militiae,"
      en: "Moreover also the censers, and the bowls, such as were of gold in gold, and such as were of silver in silver, the general of the army took away."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "id est, columnas duas, mare unum, et bases quas fecerat Salomon in templo Domini: non erat pondus aeris omnium vasorum."
      en: "That is, two pillars, one sea, and the bases which Solomon had made in the temple of the Lord: the brass of all these vessels was without weight."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Decem et octo cubitos altitudinis habebat columna una: et capitellum aereum super se altitudinis trium cubitorum: et retiaculum, et malogranata super capitellum columnae, omnia aerea: similem et columna secunda habebat ornatum."
      en: "One pillar was eighteen cubits high, and the chapiter of brass which was upon it was three cubits high: and the network, and the pomegranates that were upon the chapiter of the pillar, were all of brass: and the second pillar had the like adorning."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Tulit quoque princeps militiae Saraiam sacerdotem primum, et Sophoniam sacerdotem secundum, et tres janitores."
      en: "And the general of the army took Seraias the chief priest, and Sophonias the second priest, and three doorkeepers."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et de civitate eunuchum unum, qui erat praefectus super bellatores viros: et quinque viros de his, qui steterant coram rege, quos reperit in civitate: et Sopher principem exercitus, qui probabat tyrones de populo terrae: et sexaginta viros e vulgo, qui inventi fuerant in civitate."
      en: "And out of the city one eunuch, who was captain over the men of war: and five men of them that had stood before the king, whom he found in the city, and Sopher the captain of the army who exercised the young soldiers of the people of the land: and threescore men of the common people, who were found in the city."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quos tollens Nabuzardan princeps militum, duxit ad regem Babylonis in Reblatha."
      en: "These Nabuzardan the general of the army took away, and carried them to the king of Babylon to Reblatha."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Percussitque eos rex Babylonis, et interfecit eos in Reblatha in terra Emath: et translatus est Juda de terra sua."
      en: "And the king of Babylon smote them, and slew them at Reblatha in the land of Emath: so Juda was carried away out of their land."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Populo autem, qui relictus erat in terra Juda, quem dimiserat Nabuchodonosor rex Babylonis, praefecit Godoliam filium Ahicam filii Saphan."
      en: "But over the people that remained in the land of Juda, which Nabuchodonosor king of Babylon had left, he gave the government to Godolias the son of Ahicam the son of Saphan."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Quod cum audissent omnes duces militum, ipsi et viri qui erant cum eis, videlicet quod constituisset rex Babylonis Godoliam, venerunt ad Godoliam in Maspha, Ismahel filius Nathaniae, et Johanan filius Caree, et Saraia filius Thanehumeth Netophathites, et Jezonias filius Maachathi, ipsi et socii eorum."
      en: "And when all the captains of the soldiers had heard this, they and the men that were with them, to wit, that the king of Babylon had made Godolias governor, they came to Godolias to Maspha, Ismael the son of Nathanias, and Johanan the son of Caree, and Saraia the son of Thanehumeth the Netophathite, and Jezonias the son of Maachathi, they and their men."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Juravitque Godolias ipsis et sociis eorum, dicens: Nolite timere servire Chaldaeis: manete in terra, et servite regi Babylonis, et bene erit vobis."
      en: "And Godolias swore to them and to their men, saying: Be not afraid to serve the Chaldees: stay in the land, and serve the king of Babylon, and it shall be well with you."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Factum est autem in mense septimo, venit Ismahel filius Nathaniae filii Elisama de semine regio, et decem viri cum eo: percusseruntque Godoliam, qui et mortuus est: sed et Judaeos et Chaldaeos, qui erant cum eo in Maspha."
      en: "But it came to pass in the seventh month, that Ismael the son of Nathanias, the son of Elisama of the seed royal came, and ten men with him: and smote Godolias so that he died: and also the Jews and the Chaldees that were with him in Maspha."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Consurgensque omnis populus a parvo usque ad magnum, et principes militum, venerunt in Aegyptum timentes Chaldaeos."
      en: "And all the people both little and great, and the captains of the soldiers, rising up went to Egypt, fearing the Chaldees."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Factum est vero in anno trigesimo septimo transmigrationis Joachin regis Juda, mense duodecimo, vigesima septima die mensis: sublevavit Evilmerodach rex Babylonis, anno quo regnare coeperat, caput Joachin regis Juda de carcere."
      en: "And it came to pass in the seven and thirtieth year of the captivity of Joachin king of Juda, in the twelfth month the seven and twentieth day of the month: Evilmerodach king of Babylon, in the year that he began to reign, lifted up the head of Joachin king of Juda out of prison."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et locutus est ei benigne: et posuit thronum ejus super thronum regum, qui erant cum eo in Babylone."
      en: "And he spoke kindly to him: and he set his throne above the throne of the kings that were with him in Babylon."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et mutavit vestes ejus, quas habuerat in carcere, et comedebat panem semper in conspectu ejus cunctis diebus vitae suae."
      en: "And he changed his garments which he had in prison, and he ate bread always before him, all the days of his life."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Annonam quoque constituit ei sine intermissione, quae et dabatur ei a rege per singulos dies omnibus diebus vitae suae."
      en: "And he appointed him a continual allowance, which was also given him by the king day by day, all the days of his life."
    status: { la: verified, en: verified }
