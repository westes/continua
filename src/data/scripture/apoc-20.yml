# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: apoc
chapter: 20
verses:
  - n: 1
    text:
      la: "Et vidi angelum descendentem de caelo, habentem clavem abyssi, et catenam magnam in manu sua."
      en: "And I saw an angel coming down from heaven, having the key of the bottomless pit, and a great chain in his hand."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et apprehendit draconem, serpentem antiquum, qui est diabolus, et Satanas, et ligavit eum per annos mille:"
      en: "And he laid hold on the dragon the old serpent, which is the devil and Satan, and bound him for a thousand years."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et misit eum in abyssum, et clausit, et signavit super illum ut non seducat amplius gentes, donec consummentur mille anni: et post haec oportet illum solvi modico tempore."
      en: "And he cast him into the bottomless pit, and shut him up, and set a seal upon him, that he should no more seduce the nations, till the thousand years be finished. And after that, he must be loosed a little time."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et vidi sedes, et sederunt super eas, et judicium datum est illis: et animas decollatorum propter testimonium Jesu, et propter verbum Dei, et qui non adoraverunt bestiam, neque imaginem ejus, nec acceperunt caracterem ejus in frontibus, aut in manibus suis, et vixerunt, et regnaverunt cum Christo mille annis."
      en: "And I saw seats; and they sat upon them; and judgment was given unto them; and the souls of them that were beheaded for the testimony of Jesus, and for the word of God, and who had not adored the beast nor his image, nor received his character on their foreheads, or in their hands; and they lived and reigned with Christ a thousand years."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ceteri mortuorum non vixerunt, donec consummentur mille anni. Haec est resurrectio prima."
      en: "The rest of the dead lived not, till the thousand years were finished. This is the first resurrection."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Beatus, et sanctus, qui habet partem in resurrectione prima: in his secunda mors non habet potestatem: sed erunt sacerdotes Dei et Christi, et regnabunt cum illo mille annis."
      en: "Blessed and holy is he that hath part in the first resurrection. In these the second death hath no power; but they shall be priests of God and of Christ; and shall reign with him a thousand years."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et cum consummati fuerint mille anni, solvetur Satanas de carcere suo, et exibit, et seducet gentes, quae sunt super quatuor angulos terrae, Gog, et Magog, et congregabit eos in praelium, quorum numerus est sicut arena maris."
      en: "And when the thousand years shall be finished, Satan shall be loosed out of his prison, and shall go forth, and seduce the nations, which are over the four quarters of the earth, Gog, and Magog, and shall gather them together to battle, the number of whom is as the sand of the sea."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et ascenderunt super latitudinem terrae, et circuierunt castra sanctorum, et civitatem dilectam."
      en: "And they came upon the breadth of the earth, and encompassed the camp of the saints, and the beloved city."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et descendit ignis a Deo de caelo, et devoravit eos: et diabolus, qui seducebat eos, missus est in stagnum ignis, et sulphuris, ubi et bestia"
      en: "And there came down fire from God out of heaven, and devoured them; and the devil, who seduced them, was cast into the pool of fire and brimstone, where both the beast"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et pseudopropheta cruciabuntur die ac nocte in saecula saeculorum."
      en: "And the false prophet shall be tormented day and night for ever and ever."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et vidi thronum magnum candidum, et sedentem super eum, a cujus conspectu fugit terra, et caelum, et locus non est inventus eis."
      en: "And I saw a great white throne, and one sitting upon it, from whose face the earth and heaven fled away, and there was no place found for them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et vidi mortuos, magnos et pusillos, stantes in conspectu throni, et libri aperti sunt: et alius liber apertus est, qui est vitae: et judicati sunt mortui ex his, quae scripta erant in libris, secundum opera ipsorum:"
      en: "And I saw the dead, great and small, standing in the presence of the throne, and the books were opened; and another book was opened, which is the book of life; and the dead were judged by those things which were written in the books, according to their works."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et dedit mare mortuos, qui in eo erant: et mors et infernus dederunt mortuos suos, qui in ipsis erant: et judicatum est de singulis secundum opera ipsorum."
      en: "And the sea gave up the dead that were in it, and death and hell gave up their dead that were in them; and they were judged every one according to their works."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et infernus et mors missi sunt in stagnum ignis. Haec est mors secunda."
      en: "And hell and death were cast into the pool of fire. This is the second death."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et qui non inventus est in libro vitae scriptus, missus est in stagnum ignis."
      en: "And whosoever was not found written in the book of life, was cast into the pool of fire."
    status: { la: verified, en: verified }
