# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 6
verses:
  - n: 1
    text:
      la: "confortamini filii Beniamin in medio Hierusalem et in Thecua clangite bucina et super Bethaccharem levate vexillum quia malum visum est ab aquilone et contritio magna"
      en: "Strengthen yourselves, ye sons of Benjamin, in the midst of Jerusalem, and sound the trumpet in Thecua, and set up the standard over Bethacarem: for evil is seen out of the north, and a great destruction."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "speciosae et delicatae adsimilavi filiam Sion"
      en: "I have likened the daughter of Sion to a beautiful and delicate woman."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ad eam venient pastores et greges eorum fixerunt in ea tentoria in circuitu pascet unusquisque eos qui sub manu sua sunt"
      en: "The shepherds shall come to her with their flocks: they have pitched their tents against her round about: every one shall feed them that are under his hand."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sanctificate super eam bellum consurgite et ascendamus in meridie vae nobis quia declinavit dies quia longiores factae sunt umbrae vesperi"
      en: "Prepare ye war against her: arise, and let us go up at midday: woe unto us, for the day is declined, for the shadows of the evening are grown longer."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "surgite et ascendamus in nocte et dissipemus domos eius"
      en: "Arise, and let us go up in the night, and destroy her houses."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quia haec dicit Dominus exercituum caedite lignum eius et fundite circa Hierusalem aggerem haec est civitas visitationis omnis calumnia in medio eius"
      en: "For thus saith the Lord of hosts: Hew down her trees, cast up a trench about Jerusalem: this is the city to be visited, all oppression is in the midst of her."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sicut frigidam facit cisterna aquam suam sic frigidam fecit malitiam suam iniquitas et vastitas audietur in ea coram me semper infirmitas et plaga"
      en: "As a cistern maketh its water cold, so hath she made her wickedness cold: violence and spoil shall be heard in her, infirmity and stripes are continually before me."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "erudire Hierusalem ne forte recedat anima mea a te ne forte ponam te desertam terram inhabitabilem"
      en: "Be thou instructed, O Jerusalem, lest my soul depart from thee, lest I make thee desolate, a land uninhabited."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "haec dicit Dominus exercituum usque ad racemum colligent quasi in vinea reliquias Israhel converte manum tuam quasi vindemiator ad cartallum"
      en: "Thus saith the Lord of hosts: They shall gather the remains of Israel, as in a vine, even to one cluster: turn back thy hand, as a grape gatherer into the basket."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cui loquar et quem contestabor ut audiant ecce incircumcisae aures eorum et audire non possunt ecce verbum Domini factum est eis in obprobrium et non suscipient illud"
      en: "To whom shall I speak? and to whom shall I testify, that he may hear? behold, their ears are uncircumcised, and they cannot hear: behold the word of the Lord is become unto them a reproach: and and they will not receive it."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "idcirco furore Domini plenus sum laboravi sustinens effunde super parvulum foris et super concilium iuvenum simul vir enim cum muliere capietur senex cum pleno dierum"
      en: "Therefore am I full of the fury of the Lord, I am weary with holding in: pour it out upon the child abroad, and upon the council of the young men together: for man and woman shall be taken, the ancient and he that is full of days."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et transibunt domus eorum ad alteros agri et uxores pariter quia extendam manum meam super habitantes terram dicit Dominus"
      en: "And their houses shall be turned over to others, with their lands and their wives together: for I will stretch for my hand upon the inhabitants of the land, saith the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "a minore quippe usque ad maiorem omnes avaritiae student et a propheta usque ad sacerdotem cuncti faciunt dolum"
      en: "For from the least of them even to the greatest, all are given to covetousness: and from the prophet even to the priest, all are guilty of deceit."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et curabant contritionem filiae populi mei cum ignominia dicentes pax pax et non erat pax"
      en: "And they healed the breach of the daughter of my people disgracefully, saying: Peace, peace: and there was no peace."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "confusi sunt quia abominationem fecerunt quin potius confusione non sunt confusi et erubescere nescierunt quam ob rem cadent inter ruentes in tempore visitationis suae corruent dicit Dominus"
      en: "They were confounded, because they commmitted abomination: yea, rather they were not confounded with confusion, and they knew not how to blush: wherefore they shall fall among them that fall: in the time of their visitation they shall fall down, saith the Lord."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "haec dicit Dominus state super vias et videte et interrogate de semitis antiquis quae sit via bona et ambulate in ea et invenietis refrigerium animabus vestris et dixerunt non ambulabimus"
      en: "Thus saith the Lord: Stand ye on the ways, and see and ask for the old paths which is the good way, and walk ye in it: and you shall find refreshment for your souls. And they said: we will not walk."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et constitui super vos speculatores audite vocem tubae et dixerunt non audiemus"
      en: "And I appointed watchmen over you, saying: Hearken ye to the sound of the trumpet. And they said: We will not hearken."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ideo audite gentes et cognosce congregatio quanta ego faciam eis"
      en: "Therefore hear, ye nations, and know, O congregation, what great things I will do to them."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "audi terra ecce ego adducam mala super populum istum fructum cogitationum eius quia verba mea non audierunt et legem meam proiecerunt"
      en: "Hear, O earth: Behold I will bring evils upon this people, the fruits of their own thoughts: because they have not heard my words, and they have cast away my law."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ut quid mihi tus de Saba adfertis et calamum suave olentem de terra longinqua holocaustomata vestra non sunt accepta et victimae vestrae non placuerunt mihi"
      en: "To what purpose do you bring me frankincense from Saba, and the sweet smelling cane from a far country? your holocausts are not acceptable, nor are your sacrifices pleasing to me."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "propterea haec dicit Dominus ecce ego dabo in populum istum ruinas et ruent in eis patres et filii simul vicinus et proximus et peribunt"
      en: "Therefore thus saith the Lord: Behold, I will bring destruction upon this people, by which fathers and sons together shall fall, neighbor and kinsman shall perish."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "haec dicit Dominus ecce populus venit de terra aquilonis et gens magna consurget a finibus terrae"
      en: "Thus saith the Lord: Behold a people cometh from the land of the north, and a great nation shall rise up from the ends of the earth."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sagittam et scutum arripiet crudelis est et non miserebitur vox eius quasi mare sonabit et super equos ascendent praeparati quasi vir ad proelium adversum te filia Sion"
      en: "They shall lay hold on arrow and shield: they are cruel, and will have no mercy. Their voice shall roar like the sea: and they shall mount upon horses, prepared as men for war, against thee, O daughter of Sion."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "audivimus famam eius dissolutae sunt manus nostrae tribulatio adprehendit nos dolores ut parturientem"
      en: "We have heard the fame thereof, our hands grow feeble: anguish hath taken hold of us, as a woman in labor."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "nolite exire ad agros et in via ne ambuletis quoniam gladius inimici pavor in circuitu"
      en: "Go not out into the fields, nor walk in the highway: for the sword of the enemy, and fear is on every side."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "filia populi mei accingere cilicio et conspergere cinere luctum unigeniti fac tibi planctum amarum quia repente veniet vastator super nos"
      en: "Gird thee with sackcloth, O daughter of my people, and sprinkle thee with ashes: make thee mourning as for an only son, a bitter lamentation, because the destroyer shall suddenly come upon us."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "probatorem dedi te in populo meo robustum et scies et probabis viam eorum"
      en: "I have set thee for a strong trier among my people: and thou shalt know and prove their way."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "omnes isti principes declinantum ambulantes fraudulenter aes et ferrum universi corrupti sunt"
      en: "All of these princes go out of the way, they walk deceitfully, they are brass and iron: they are all corrupted."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "defecit sufflatorium in igne consumptum est plumbum frustra conflavit conflator malitiae enim eorum non sunt consumptae"
      en: "The bellows have failed, the lead is consumed in the fire, the founder hath melted in vain: for their wicked deeds are not consumed."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "argentum reprobum vocate eos quia Dominus proiecit illos"
      en: "Call them reprobate silver, for the Lord hath rejected them."
    status: { la: verified, en: verified }
