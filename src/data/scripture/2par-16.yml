# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 16
verses:
  - n: 1
    text:
      la: "anno autem tricesimo sexto regni eius ascendit Baasa rex Israhel in Iudam et muro circumdabat Rama ut nullus tute posset egredi et ingredi de regno Asa"
      en: "And in the six and thirtieth year of his kingdom, Baasa the king of Israel came up against Juda, and built a wall about Rama, that no one might safely go out or come in of the kingdom of Asa."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "protulit ergo Asa argentum et aurum de thesauris domus Domini et de thesauris regis misitque ad Benadad regem Syriae qui habitabat in Damasco dicens"
      en: "Then Asa brought out silver and gold out of the treasures of the house of the Lord, and of the king's treasures, and sent to Benadad king of Syria, who dwelt in Damascus, saying:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "foedus inter me et te est pater quoque meus et pater tuus habuere concordiam quam ob rem misi tibi argentum et aurum ut rupto foedere quod habes cum Baasa rege Israhel facias eum a me recedere"
      en: "There is a league between me and thee, as there was between my father and thy father, wherefore I have sent thee silver and gold, that thou mayst break thy league with Baasa king of Israel, and make him depart from me."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quo conperto Benadad misit principes exercituum suorum ad urbes Israhel qui percusserunt Ahion et Dan et Abelmaim et universas urbes muratas Nepthalim"
      en: "And then Benadad heard this, he sent the captains of his armies against the cities of Israel: and they took Ahion, and Dan, and Abelmaim, and all the walled cities of Nephtali."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quod cum audisset Baasa desivit aedificare Rama et intermisit opus suum"
      en: "And when Baasa heard of it, he left off the building of Rama, and interrupted his work."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "porro Asa rex adsumpsit universum Iudam et tulerunt lapides Rama et ligna quae aedificationi praeparaverat Baasa aedificavitque ex eis Gabaa et Maspha"
      en: "Then king Asa took all Juda, and they carried away from Rama the stones, and the timber that Baasa had prepared for the building: and he built with them Gabaa, and Maspha."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in tempore illo venit Anani propheta ad Asam regem Iuda et dixit ei quia habuisti fiduciam in rege Syriae et non in Domino Deo tuo idcirco evasit Syriae regis exercitus de manu tua"
      en: "At that time Hanani the prophet came to Asa king of Juda, and said to him: Because thou hast had confidence in the king of Syria, and not in the Lord thy God, therefore hath the army of the king of Syria escaped out of thy hand."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "nonne Aethiopes et Lybies multo plures erant quadrigis et equitibus et multitudine nimia quos cum Domino credidisses tradidit in manu tua"
      en: "Were not the Ethiopians, and the Libyans much more numerous in chariots, and horsemen, and an exceeding great multitude: yet because thou trustedst in the Lord, he delivered them into thy hand?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "oculi enim eius contemplantur universam terram et praebent fortitudinem his qui corde perfecto credunt in eum stulte igitur egisti et propter hoc ex praesenti tempore contra te bella consurgent"
      en: "For the eyes of the Lord behold all the earth, and give strength to those who with a perfect heart trust in him. Wherefore thou hast done foolishly, and for this cause from this time wars shall arise against thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "iratusque Asa adversus videntem iussit eum mitti in nervum valde quippe super hoc fuerat indignatus et interfecit de populo in tempore illo plurimos"
      en: "And Asa was angry with the seer, and commanded him to be put in prison: for he was greatly enraged because of this thing: and he put to death many of the people at that time."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "opera autem Asa prima et novissima scripta sunt in libro regum Iuda et Israhel"
      en: "But the works of Asa the first and last are written in the book of the kings of Juda and Israel."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "aegrotavit etiam Asa anno tricesimo nono regni sui dolore pedum vehementissimo et nec in infirmitate sua quaesivit Dominum sed magis in medicorum arte confisus est"
      en: "And Asa fell sick in the nine and thirtieth year of his reign, of a most violent pain in his feet, and yet in his illness he did not seek the Lord, but rather trusted in the skill of physicians."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dormivitque cum patribus suis et mortuus est anno quadragesimo primo regni sui"
      en: "And he slept with his fathers: and he died in the one and fortieth year of his reign."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et sepelierunt eum in sepulchro suo quod foderat sibi in civitate David posueruntque eum super lectulum suum plenum aromatibus et unguentis meretriciis quae erant pigmentariorum arte confecta et conbuserunt super eum ambitione nimia"
      en: "And they buried him in his own sepulchre, which he had made for himself in the city of David: and they laid him on his bed full of spices and odoriferous ointments, which were made by the art of the perfumers, and they burnt them over him with very great pomp."
    status: { la: verified, en: verified }
