# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: act
chapter: 1
verses:
  - n: 1
    text:
      la: "primum quidem sermonem feci de omnibus o Theophile quae coepit Iesus facere et docere"
      en: "The former treatise I made, O Theophilus, of all things which Jesus began to do and to teach,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "usque in diem qua praecipiens apostolis per Spiritum Sanctum quos elegit adsumptus est"
      en: "Until the day on which, giving commandments by the Holy Ghost to the apostles whom he had chosen, he was taken up."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quibus et praebuit se ipsum vivum post passionem suam in multis argumentis per dies quadraginta apparens eis et loquens de regno Dei"
      en: "To whom also he shewed himself alive after his passion, by many proofs, for forty days appearing to them, and speaking of the kingdom of God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et convescens praecepit eis ab Hierosolymis ne discederent sed expectarent promissionem Patris quam audistis per os meum"
      en: "And eating together with them, he commanded them, that they should not depart from Jerusalem, but should wait for the promise of the Father, which you have heard (saith he) by my mouth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quia Iohannes quidem baptizavit aqua vos autem baptizabimini Spiritu Sancto non post multos hos dies"
      en: "For John indeed baptized with water, but you shall be baptized with the Holy Ghost, not many days hence."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "igitur qui convenerant interrogabant eum dicentes Domine si in tempore hoc restitues regnum Israhel"
      en: "They therefore who were come together, asked him, saying: Lord, wilt thou at this time restore again the kingdom to Israel?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixit autem eis non est vestrum nosse tempora vel momenta quae Pater posuit in sua potestate"
      en: "But he said to them: It is not for you to know the times or moments, which the Father hath put in his own power:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sed accipietis virtutem supervenientis Spiritus Sancti in vos et eritis mihi testes in Hierusalem et in omni Iudaea et Samaria et usque ad ultimum terrae"
      en: "But you shall receive the power of the Holy Ghost coming upon you, and you shall be witnesses unto me in Jerusalem, and in all Judea, and Samaria, and even to the uttermost part of the earth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et cum haec dixisset videntibus illis elevatus est et nubes suscepit eum ab oculis eorum"
      en: "And when he had said these things, while they looked on, he was raised up: and a cloud received him out of their sight."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cumque intuerentur in caelum eunte illo ecce duo viri adstiterunt iuxta illos in vestibus albis"
      en: "And while they were beholding him going up to heaven, behold two men stood by them in white garments."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "qui et dixerunt viri galilaei quid statis aspicientes in caelum hic Iesus qui adsumptus est a vobis in caelum sic veniet quemadmodum vidistis eum euntem in caelum"
      en: "Who also said: Ye men of Galilee, why stand you looking up to heaven? This Jesus who is taken up from you into heaven, shall so come, as you have seen him going into heaven."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tunc reversi sunt Hierosolymam a monte qui vocatur Oliveti qui est iuxta Hierusalem sabbati habens iter"
      en: "Then they returned to Jerusalem from the mount that is called Olivet, which is nigh Jerusalem, within a sabbath day's journey."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et cum introissent in cenaculum ascenderunt ubi manebant Petrus et Iohannes Iacobus et Andreas Philippus et Thomas Bartholomeus et Mattheus Iacobus Alphei et Simon Zelotes et Iudas Iacobi"
      en: "And when they were come in, they went up into an upper room, where abode Peter and John, James and Andrew, Philip and Thomas, Bartholomew and Matthew, James of Alpheus, and Simon Zelotes, and Jude the brother of James."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "hii omnes erant perseverantes unianimiter in oratione cum mulieribus et Maria matre Iesu et fratribus eius"
      en: "All these were persevering with one mind in prayer with the women, and Mary the mother of Jesus, and with his brethren."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et in diebus illis exsurgens Petrus in medio fratrum dixit erat autem turba nominum simul fere centum viginti"
      en: "In those days Peter rising up in the midst of the brethren, said: (now the number of persons together was about an hundred and twenty:)"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "viri fratres oportet impleri scripturam quam praedixit Spiritus Sanctus per os David de Iuda qui fuit dux eorum qui conprehenderunt Iesum"
      en: "Men, brethren, the scripture must needs be fulfilled, which the Holy Ghost spoke before by the mouth of David concerning Judas, who was the leader of them that apprehended Jesus:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quia connumeratus erat in nobis et sortitus est sortem ministerii huius"
      en: "Who was numbered with us, and had obtained part of this ministry."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et hic quidem possedit agrum de mercede iniquitatis et suspensus crepuit medius et diffusa sunt omnia viscera eius"
      en: "And he indeed hath possessed a field of the reward of iniquity, and being hanged, burst asunder in the midst: and all his bowels gushed out."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et notum factum est omnibus habitantibus Hierusalem ita ut appellaretur ager ille lingua eorum Acheldemach hoc est ager Sanguinis"
      en: "And it became known to all the inhabitants of Jerusalem: so that the same field was called in their tongue, Haceldama, that is to say, The field of blood."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "scriptum est enim in libro Psalmorum fiat commoratio eius deserta et non sit qui inhabitet in ea et episcopatum eius accipiat alius"
      en: "For it is written in the book of Psalms: Let their habitation become desolate, and let there be none to dwell therein. And his bishopric let another take."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "oportet ergo ex his viris qui nobiscum congregati sunt in omni tempore quo intravit et exivit inter nos Dominus Iesus"
      en: "Wherefore of these men who have companied with us all the time that the Lord Jesus came in and went out among us,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "incipiens a baptismate Iohannis usque in diem qua adsumptus est a nobis testem resurrectionis eius nobiscum fieri unum ex istis"
      en: "Beginning from the baptism of John, until the day wherein he was taken up from us, one of these must be made a witness with us of his resurrection."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et statuerunt duos Ioseph qui vocabatur Barsabban qui cognominatus est Iustus et Matthiam"
      en: "And they appointed two, Joseph, called Barsabas, who was surnamed Justus, and Matthias."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et orantes dixerunt tu Domine qui corda nosti omnium ostende quem elegeris ex his duobus unum"
      en: "And praying, they said: Thou, Lord, who knowest the hearts of all men, shew whether of these two thou hast chosen,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "accipere locum ministerii huius et apostolatus de quo praevaricatus est Iudas ut abiret in locum suum"
      en: "To take the place of this ministry and apostleship, from which Judas hath by transgression fallen, that he might go to his own place."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et dederunt sortes eis et cecidit sors super Matthiam et adnumeratus est cum undecim apostolis"
      en: "And they gave them lots, and the lot fell upon Matthias, and he was numbered with the eleven apostles."
    status: { la: verified, en: verified }
