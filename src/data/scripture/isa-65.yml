# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 65
verses:
  - n: 1
    text:
      la: "Quaesierunt me qui ante non interrogabant, invenerunt qui non quaesierunt me. Dixi: Ecce ego, ecce ego, ad gentem quae non invocabat nomen meum."
      en: "They have sought me that before asked not for me, they have found me that sought me not. I said: Behold me, behold me, to a nation that did not call upon my name."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Expandi manus meas tota die ad populum incredulum, qui graditur in via non bona post cogitationes suas."
      en: "I have spread forth my hands all the day to an unbelieving people, who walk in a way that is not good after their own thoughts."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Populus qui ad iracundiam provocat me ante faciem meam semper; qui immolant in hortis, et sacrificant super lateres;"
      en: "A people that continually provoke me to anger before my face: that immolate in gardens, and sacrifice upon bricks."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui habitant in sepulchris, et in delubris idolorum dormiunt; qui comedunt carnem suillam, et jus profanum in vasis eorum;"
      en: "That dwell in sepulchres, and sleep in the temple of idols: that eat swine's flesh, and profane broth is in their vessels."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "qui dicunt: Recede a me, non appropinques mihi, quia immundus es. Isti fumus erunt in furore meo, ignis ardens tota die."
      en: "That say: Depart from me, come not near me, because thou art unclean: these shall be smoke in my anger, a fire burning all the day."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ecce scriptum est coram me: Non tacebo, sed reddam, et retribuam in sinum eorum."
      en: "Behold it is written before me: I will not be silent, but I will render and repay into their bosom."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Iniquitates vestras, et iniquitates patrum vestrorum simul, dicit Dominus; qui sacrificaverunt super montes, et super colles exprobraverunt mihi; et remetiar opus eorum primum in sinu eorum."
      en: "Your iniquities, and the iniquities of your fathers together, saith the Lord, who have sacrificed upon the mountains, and have reproached me upon the hills; and I will measure back their first work in their bosom."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Haec dicit Dominus: Quomodo si inveniatur granum in botro, et dicatur: Ne dissipes illud, quoniam benedictio est, sic faciam propter servos meos, ut non disperdam totum."
      en: "Thus saith the Lord: As if a grain be found in a cluster, and it be said: Destroy it not, because it is a blessing: so will I do for the sake of my servants, that I may not destroy the whole."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et educam de Jacob semen, et de Juda possidentem montes meos; et haereditabunt eam electi mei, et servi mei habitabunt ibi."
      en: "And I will bring forth a seed out of Jacob, and out of Juda a possessor of my mountains: and my elect shall inherit it, and my servants shall dwell there."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et erunt campestria in caulas gregum, et vallis Achor in cubile armentorum, populo meo qui requisierunt me."
      en: "And the plains shall be turned to folds of flocks, and the valley of Achor into a place for the herds to lie down in, for my people that have sought me."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et vos qui dereliquistis Dominum, qui obliti estis montem sanctum meum, qui ponitis Fortunae mensam, et libatis super eam;"
      en: "And you, that have forsaken the Lord, that have forgotten my holy mount, that set a table for fortune, and offer libations upon it,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "numerabo vos in gladio, et omnes in caede corruetis: pro eo quod vocavi, et non respondistis; locutus sum, et non audistis; et faciebatis malum in oculis meis, et quae nolui elegistis."
      en: "I will number you in the sword, and you shall all fall by slaughter: because I called and you did not answer: I spoke, and you did not hear: and you did evil in my eyes, and you have chosen the things that displease me."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Propter hoc haec dicit Dominus Deus: Ecce servi mei comedent, et vos esurietis; ecce servi mei bibent, et vos sitietis;"
      en: "Therefore thus saith the Lord God: Behold my servants shall eat, and you shall be hungry: behold my servants shall drink, and you shall be thirsty."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ecce servi mei laetabuntur, et vos confundemini; ecce servi mei laudabunt prae exsultatione cordis, et vos clamabitis prae dolore cordis, et prae contritione spiritus ululabitis,"
      en: "Behold my servants shall rejoice, and you shall be confounded: behold my servants shall praise for joyfulness of heart, and you shall cry for sorrow of heart, and shall howl for grief of spirit."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et dimittetis nomen vestrum in juramentum electis meis; et interficiet te Dominus Deus, et servos suos vocabit nomine alio:"
      en: "And you shall leave your name for an execration to my elect: and the Lord God shall slay thee, and call his servants by another name."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "in quo qui benedictus est super terram benedicetur in Deo amen, et qui jurat in terra jurabit in Deo amen; quia oblivioni traditae sunt angustiae priores, et quia absconditae sunt ab oculis meis."
      en: "In which he that is blessed upon the earth, shall be blessed in God, amen: and he that sweareth in the earth, shall swear by God, amen: because the former distresses are forgotten, and because they are hid from my eyes."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ecce enim ego creo caelos novos, et terram novam; et non erunt in memoria priora, et non ascendent super cor."
      en: "For behold I create new heavens, and a new earth: and the former things shall not be in remembrance, and they shall not come upon the heart."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Sed gaudebitis et exsultabitis usque in sempiternum in his quae ego creo: quia ecce ego creo Jerusalem exsultationem, et populum ejus gaudium."
      en: "But you shall be glad and rejoice for ever in these things, which I create: for behold I create Jerusalem a rejoicing, and the people thereof joy."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et exsultabo in Jerusalem, et gaudebo in populo meo, et non audietur in eo ultra vox fletus et vox clamoris."
      en: "And I will rejoice in Jerusalem, and joy in my people, and the voice of weeping shall no more be heard in her, nor the voice of crying."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Non erit ibi amplius infans dierum, et senex qui non impleat dies suos, quoniam puer centum annorum morietur, et peccator centum annorum maledictus erit."
      en: "There shall no more be an infant of days there, nor an old man that shall not fill up his days: for the child shall die a hundred years old, and the sinner being a hundred years old shall be accursed."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et aedificabunt domos, et habitabunt; et plantabunt vineas, et comedent fructus earum."
      en: "And they shall build houses, and inhabit them; and they shall plant vineyards, and eat the fruits of them."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Non aedificabunt, et alius habitabit; non plantabunt, et alius comedet: secundum enim dies ligni erunt dies populi mei, et opera manuum eorum inveterabunt."
      en: "They shall not build, and another inhabit; they shall not plant, and another eat: for as the days of a tree, so shall be the days of my people, and the works of their hands shall be of long continuance."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Electi mei non laborabunt frustra, neque generabunt in conturbatione, quia semen benedictorum Domini est, et nepotes eorum cum eis."
      en: "My elect shall not labour in vain, nor bring forth in trouble; for they are the seed of the blessed of the Lord, and their posterity with them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Eritque antequam clament, ego exaudiam; adhuc illis loquentibus, ego audiam."
      en: "And it shall come to pass, that before they call, I will hear; as they are yet speaking, I will hear."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Lupus et agnus pascentur simul, leo et bos comedent paleas, et serpenti pulvis panis ejus. Non nocebunt, neque occident in omni monte sancto meo, dicit Dominus."
      en: "The wolf and the lamb shall feed together; the lion and the ox shall eat straw; and dust shall be the serpent's food: they shall not hurt nor kill in all my holy mountain, saith the Lord."
    status: { la: verified, en: verified }
