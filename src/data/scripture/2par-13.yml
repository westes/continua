# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 13
verses:
  - n: 1
    text:
      la: "Anno octavodecimo regis Jeroboam, regnavit Abia super Judam."
      en: "In the eighteenth year of king Jeroboam, Abia reigned over Juda."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Tribus annis regnavit in Jerusalem, nomenque matris ejus Michaia, filia Uriel de Gabaa: et erat bellum inter Abiam et Jeroboam."
      en: "Three years he reigned in Jerusalem, and his mother's name was Michaia, the daughter of Uriel of Gabaa: and there was war between Abia and Jeroboam."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cumque iniisset Abia certamen, et haberet bellicosissimos viros, et electorum quadringenta millia: Jeroboam instruxit econtra aciem octingenta millia virorum, qui et ipsi electi erant, et ad bella fortissimi."
      en: "And when Abia had begun battle, and had with him four hundred thousand most valiant and chosen men, Jeroboam put his army in array against him, eight hundred thousand men, who were also chosen and most valiant for war."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Stetit ergo Abia super montem Semeron, qui erat in Ephraim, et ait: Audi, Jeroboam, et omnis Israel."
      en: "And Abia stood upon mount Semeron, which was in Ephraim, and said: Hear me, O Jeroboam, and all Israel:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Num ignoratis quod Dominus Deus Israel dederit regnum David super Israel in sempiternum, ipsi et filiis ejus in pactum salis?"
      en: "Do you not know that the Lord God of Israel gave to David the kingdom over Israel for ever, to him and to his sons by a covenant of salt?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et surrexit Jeroboam filius Nabat, servus Salomonis filii David: et rebellavit contra dominum suum."
      en: "And Jeroboam the son of Nabat, the servant of Solomon the son of David, rose up: and rebelled against his lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Congregatique sunt ad eum viri vanissimi, et filii Belial: et praevaluerunt contra Roboam filium Salomonis: porro Roboam erat rudis, et corde pavido, nec potuit resistere eis."
      en: "And there were gathered to him vain men, and children of Belial: and they prevailed against Roboam the son of Solomon: for Roboam was unexperienced, and of a fearful heart, and could not resist them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Nunc ergo vos dicitis quod resistere possitis regno Domini, quod possidet per filios David, habetisque grandem populi multitudinem, atque vitulos aureos, quos fecit vobis Jeroboam in deos."
      en: "And now you say that you are able to withstand the kingdom of the Lord, which he possesseth by the sons of David, and you have a great multitude of people, and golden calves, which Jeroboam hath made you for gods."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ejecistis sacerdotes Domini, filios Aaron, atque Levitas: et fecistis vobis sacerdotes sicut omnes populi terrarum: quicumque venerit, et initiaverit manum suam in tauro de bobus, et in arietibus septem, fit sacerdos eorum qui non sunt dii."
      en: "And you have cast out the priests of the Lord, the sons of Aaron, and the Levites: and you have made you priests, like all the nations of the earth: whosoever cometh and consecrateth his hand with a bullock of the herd, and with seven rams, is made a priest of those who are no gods."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Noster autem Dominus, Deus est, quem non relinquimus, sacerdotesque ministrant Domino, de filiis Aaron, et Levitae sunt in ordine suo:"
      en: "But the Lord is our God, whom we forsake not, and the priests who minister to the Lord are the sons of Aaron, and the Levites are in their order."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "holocausta quoque offerunt Domino per singulos dies mane et vespere, et thymiama juxta legis praecepta confectum, et proponuntur panes in mensa mundissima, estque apud nos candelabrum aureum, et lucernae ejus, ut accendantur semper ad vesperam: nos quippe custodimus praecepta Domini Dei nostri, quem vos reliquistis."
      en: "And they offer holocausts to the Lord, every day, morning and evening, and incense made according to the ordinance of the law, and the loaves are set forth on a most clean table, and there is with us the golden candlestick, and the lamps thereof, to be lighted always in the evening: for we keep the precepts of the Lord our God, whom you have forsaken."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ergo in exercitu nostro dux Deus est, et sacerdotes ejus, qui clangunt tubis, et resonant contra vos: filii Israel, nolite pugnare contra Dominum Deum patrum vestrorum, quia non vobis expedit."
      en: "Therefore God is the leader in our army, and his priests who sound with trumpets, and resound against you: O children of Israel, fight not against the Lord the God of your fathers, for it is not good for you."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Haec illo loquente, Jeroboam retro moliebatur insidias. Cumque ex adverso hostium staret, ignorantem Judam suo ambiebat exercitu."
      en: "While he spoke these things, Jeroboam caused an ambushment to come about behind him. And while he stood facing the enemies, he encompassed Juda. who perceived it not, with his army."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Respiciensque Judas, vidit instare bellum ex adverso et post tergum, et clamavit ad Dominum; ac sacerdotes tubis canere coeperunt."
      en: "And when Juda looked back, they saw the battle coming upon them both before and behind, and they cried to the Lord: and the priests began to sound with the trumpets."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Omnesque viri Juda vociferati sunt: et ecce illis clamantibus, perterruit Deus Jeroboam, et omnem Israel qui stabat ex adverso Abia et Juda."
      en: "And all the men of Juda shouted: and behold when they shouted, God terrified Jeroboam, and all Israel that stood against Abia and Juda."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Fugeruntque filii Israel Judam, et tradidit eos Deus in manu eorum."
      en: "And the children of Israel fled before Juda, and the Lord delivered them into their hand."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Percussit ergo eos Abia et populus ejus plaga magna: et corruerunt vulnerati ex Israel quingenta millia virorum fortium."
      en: "And Abia and his people slew them with a great slaughter, and there fell wounded of Israel five hundred thousand valiant men."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Humiliatique sunt filii Israel in tempore illo, et vehementissime confortati filii Juda, eo quod sperassent in Domino Deo patrum suorum."
      en: "And the children of Israel were brought down, at that time, and the children of Juda were exceedingly strengthened, because they had trusted in the Lord the God of their fathers."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Persecutus est autem Abia fugientem Jeroboam, et cepit civitates ejus, Bethel et filias ejus, et Jesana cum filiabus suis, Ephron quoque et filias ejus:"
      en: "And Abia pursued after Jeroboam, and took cities from him, Bethel and her daughters, and Jesana with her daughters, Ephron also and her daughters."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "nec valuit ultra resistere Jeroboam in diebus Abia: quem percussit Dominus, et mortuus est."
      en: "And Jeroboam was not able to resist any more, in the days of Abia: and the Lord struck him, and he died."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Igitur Abia, confortato imperio suo, accepit uxores quatuordecim: procreavitque viginti duos filios, et sedecim filias."
      en: "But Abia, being strengthened in his kingdom, took fourteen wives: and begot two and twenty sons, and sixteen daughters."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Reliqua autem sermonum Abia, viarumque et operum ejus, scripta sunt diligentissime in libro Addo prophetae."
      en: "And the rest of the acts of Abia, and of his ways and works, are written diligently in the book of Addo the prophet."
    status: { la: verified, en: verified }
