# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 13
verses:
  - n: 1
    text:
      la: "anno octavodecimo regis Hieroboam regnavit Abia super Iudam"
      en: "In the eighteenth year of king Jeroboam, Abia reigned over Juda."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tribus annis regnavit in Hierusalem nomenque matris eius Michaia filia Urihel de Gabaa et erat bellum inter Abia et Hieroboam"
      en: "Three years he reigned in Jerusalem, and his mother's name was Michaia, the daughter of Uriel of Gabaa: and there was war between Abia and Jeroboam."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cumque inisset Abia certamen et haberet bellicosissimos viros et electorum quadringenta milia Hieroboam instruxit e contra aciem octingenta milia virorum qui et ipsi electi erant et ad bella fortissimi"
      en: "And when Abia had begun battle, and had with him four hundred thou- sand most valiant and chosen men, Jeroboam put his army in array against him, eight hundred thousand men, who were also chosen and most valiant for war."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "stetit igitur Abia super montem Someron qui erat in Ephraim et ait audi Hieroboam et omnis Israhel"
      en: "And Abia stood upon mount Semeron, which was in Ephraim, and said: Hear me, O Jeroboam, and all Israel:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "num ignoratis quod Dominus Deus Israhel dederit regnum David super Israhel in sempiternum ipsi et filiis eius pactum salis"
      en: "Do you not know that the Lord God of Israel gave to David the kingdom over Israel for ever, to him and to his sons by a covenant of salt?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et surrexit Hieroboam filius Nabath servus Salomonis filii David et rebellavit contra dominum suum"
      en: "And Jeroboam the son of Nabat, the servant of Solomon the son of David, rose up: m and rebelled against his lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "congregatique sunt ad eum viri vanissimi et filii Belial et praevaluerunt contra Roboam filium Salomonis porro Roboam erat rudis et corde pavido nec potuit resistere eis"
      en: "And there were gathered to him vain men, and children of Belial: and they prevailed against Roboam the son of Solomon: for Roboam was unexperienced, and of a fearful heart, and could not resist them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "nunc ergo vos dicitis quod resistere possitis regno Domini quod possidet per filios David habetisque grandem populi multitudinem atque vitulos aureos quos fecit vobis Hieroboam in deos"
      en: "And now you say that you are able to withstand the kingdom of the Lord, which he possesseth by the sons of David, and you have a great multitude of people, and golden calves, which Jeroboam hath made you for gods."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et eiecistis sacerdotes Domini filios Aaron atque Levitas et fecistis vobis sacerdotes sicut omnes populi terrarum quicumque venerit et initiaverit manum suam in tauro in bubus et in arietibus septem fit sacerdos eorum qui non sunt dii"
      en: "And you have cast out the priests of the Lord, the sons of Aaron, and the Levites: and you have made you priests, like all the nations of the earth: whosoever cometh and consecrateth his hand with a bullock of the herd, and with seven rams, is made a priest of those who are no gods."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "noster autem Dominus Deus est quem non relinquimus sacerdotesque ministrant Domino de filiis Aaron et Levitae sunt in ordine suo"
      en: "But the Lord is our God, whom we forsake not, and the priests who minister to the Lord are the sons of Aaron, and the Levites are in their order."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "holocausta quoque offerunt Domino per singulos dies mane et vespere et thymiama iuxta legis praecepta confectum et proponuntur panes in mensa mundissima estque apud nos candelabrum aureum et lucernae eius ut accendantur semper ad vesperam nos quippe custodimus praecepta Domini Dei nostri quem vos reliquistis"
      en: "And they offer holocausts to the Lord, every day, morning and evening, and incense made according to the ordinance of the law, and the leaves are set forth on a most clean table, and there is with us the golden candlestick, and the lamps thereof, to be lighted always in the evening: for we keep the precepts of the Lord our God, whom you have forsaken."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ergo in exercitu nostro dux Deus est et sacerdotes eius qui clangunt tubis et resonant contra vos filii Israhel nolite pugnare contra Dominum Deum patrum vestrorum quia non vobis expedit"
      en: "Therefore God is the leader in our army, and his priests who sound with trumpets, and resound against you: O children of Israel, fight not against the Lord the God of your fathers, for it is not good for you."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "haec illo loquente Hieroboam retro moliebatur insidias cumque ex adverso hostium staret ignorantem Iudam suo ambiebat exercitu"
      en: "While he spoke these things, Jeroboam caused an ambushment to come about behind him. And while he stood facing the enemies, he encompassed Juda. who perceived it not, with his army."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "respiciensque Iudas vidit instare bellum ex adverso et post tergum et clamavit ad Dominum ac sacerdotes tubis canere coeperunt"
      en: "And when Juda looked back, they saw the battle coming upon them both before and behind, and they cried to the Lord: and the priests began to sound with the trumpets."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "omnesque viri Iuda vociferati sunt et ecce illis clamantibus perterruit Deus Hieroboam et omnem Israhel qui stabat ex adverso Abia et Iuda"
      en: "And all the men of Juda shouted: and behold when they shouted, God terrified Jeroboam, and all Israel that stood against Abia and Juda."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "fugeruntque filii Israhel Iudam et tradidit eos Deus in manu eorum"
      en: "And the children of Israel fled before Juda, and the Lord delivered them into their hand."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "percussit ergo eos Abia et populus eius plaga magna et corruerunt vulnerati ex Israhel quingenta milia virorum fortium"
      en: "And Abia and his people slew them with a great slaughter, and there fell wounded of Israel five hundred thousand valiant men."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "humiliatique sunt filii Israhel in tempore illo et vehementissime confortati filii Iuda eo quod sperassent in Domino Deo patrum suorum"
      en: "And the children of Israel were brought down, at that time, and the children of Juda were exceedingly strengthened, because they had trusted in the Lord the God of their fathers."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "persecutus est autem Abia fugientem Hieroboam et cepit civitates eius Bethel et filias eius et Hiesena cum filiabus suis Ephron quoque et filias eius"
      en: "And Abia pursued after Jeroboam, and took cities from him, Bethel and her daughters, and Jesana with her daughters, Ephron also and her daughters."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "nec valuit ultra resistere Hieroboam in diebus Abia quem percussit Dominus et mortuus est"
      en: "And Jeroboam was not able to resist any more, in the days of Abia: and the Lord struck him, and he died."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "igitur Abia confortato imperio suo accepit uxores quattuordecim procreavitque viginti duos filios et sedecim filias"
      en: "But Abia, being strengthened in his kingdom, took fourteen wives: and begot two and twenty sons, and sixteen daughters."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "reliqua autem sermonum Abia viarumque et operum eius scripta sunt diligentissime in libro prophetae Addo"
      en: "And the rest of the acts of Abia, and of his ways and works, are written diligently in the book of Addo the prophet."
    status: { la: verified, en: verified }
