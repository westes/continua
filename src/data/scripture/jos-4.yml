# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jos
chapter: 4
verses:
  - n: 1
    text:
      la: "quibus transgressis dixit Dominus ad Iosue"
      en: "And when they were passed over, the Lord said to Josue:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "elige duodecim viros singulos per singulas tribus"
      en: "Choose twelve men, one of every tribe:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et praecipe eis ut tollant de medio Iordanis alveo ubi steterunt sacerdotum pedes duodecim durissimos lapides quos ponetis in loco castrorum ubi fixeritis hac nocte tentoria"
      en: "And command them to take out of the midst of the Jordan, where the feet of the priests stood, twelve very hard stones, which you shall set in the place of the camp, where you shall pitch your tents this night."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "vocavitque Iosue duodecim viros quos elegerat de filiis Israhel singulos de tribubus singulis"
      en: "And Josue called twelve men, whom he had chosen out of the children of Israel, one out of every tribe,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et ait ad eos ite ante arcam Domini Dei vestri ad Iordanis medium et portate singuli singulos lapides in umeris vestris iuxta numerum filiorum Israhel"
      en: "And he said to them: Go before the ark of the Lord your God to the midst of the Jordan, and carry from thence every man a stone on your shoulders, according to the number of the children of Israel,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ut sit signum inter vos et quando interrogaverint vos filii vestri cras dicentes quid sibi volunt isti lapides"
      en: "That it may be a sign among you end when your children shall ask you to morrow, saying: What mean these stones?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "respondebitis eis defecerunt aquae Iordanis ante arcam foederis Domini cum transiret eum idcirco positi sunt lapides isti in monumentum filiorum Israhel usque in aeternum"
      en: "You shall answer them: The waters of the Jordan ran off before the ark of the covenant of the Lord, when it passed over the same: therefore were these atones set for a monument of the children of Israel for ever."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "fecerunt ergo filii Israhel sicut eis praecepit Iosue portantes de medio Iordanis alveo duodecim lapides ut ei Dominus imperarat iuxta numerum filiorum Israhel usque ad locum in quo castrametati sunt ibique posuerunt eos"
      en: "The children of Israel therefore did as Josue commanded them, carrying out of the channel of the Jordan twelve stones, as the Lord had commanded him, according to the number of the children of Israel, unto the place wherein they camped, and there they set them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "alios quoque duodecim lapides posuit Iosue in medio Iordanis alveo ubi steterunt sacerdotes qui portabant arcam foederis et sunt ibi usque in praesentem diem"
      en: "And Josue put other twelve stones in the midst of the channel of the Jordan, where the priests stood that carried the ark of the covenant: and they are there until this present day."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sacerdotes autem qui portabant arcam stabant in Iordanis medio donec omnia conplerentur quae Iosue ut loqueretur ad populum praeceperat Dominus et dixerat ei Moses festinavitque populus et transiit"
      en: "Now the priests that carried the ark, stood in the midst of the Jordan till all things were accomplished which the Lord had commanded Josue to speak to the people, and Moses had said to him. And the people made haste and passed over."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cumque transissent omnes transivit et arca Domini sacerdotesque pergebant ante populum"
      en: "And when they had all passed over, the ark also of the Lord passed over, and the priests went before the people."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "filii quoque Ruben et Gad et dimidiae tribus Manasse armati praecedebant filios Israhel sicut eis praeceperat Moses"
      en: "The children of Ruben also and Gad, and half the tribe of Manasses, went armed before the children of Israel as Moses had commanded them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et quadraginta pugnatorum milia per turmas et cuneos incedebant per plana atque campestria urbis Hiericho"
      en: "And forty thousand fighting men by their troops, and bands, marched through the plains and fields of the city of Jericho."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "in illo die magnificavit Dominus Iosue coram omni Israhel ut timerent eum sicut timuerant Mosen dum adviveret"
      en: "In that day the Lord magnified Josue in the sight of all Israel, that they should fear him, as they had feared Moses, while he lived."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "dixitque ad eum"
      en: "And he said to him:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "praecipe sacerdotibus qui portant arcam foederis ut ascendant de Iordane"
      en: "Command the priests, that carry the ark of the covenant, to come up out of the Jordan."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qui praecepit eis dicens ascendite de Iordane"
      en: "And he commanded them, saying: Come ye up out of the Jordan."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cumque ascendissent portantes arcam foederis Domini et siccam humum calcare coepissent reversae sunt aquae in alveum suum et fluebant sicut ante consueverant"
      en: "And when they that carried the ark of the covenant of the Lord, were come up, and began to tread on the dry ground, the waters returned into the channel, and ran as they were wont before."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "populus autem ascendit de Iordane decimo mensis primi die et castrametati sunt in Galgalis contra orientalem plagam urbis Hiericho"
      en: "And the people came up out of the Jordan, the tenth day of the first month, and camped in Galgal, over against the east side of the city of Jericho."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "duodecim quoque lapides quos de Iordanis alveo sumpserant posuit Iosue in Galgalis"
      en: "And the twelve stones which they had taken out of the channel of the Jordan, Josue pitched in Galgal,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et dixit ad filios Israhel quando interrogaverint filii vestri cras patres suos et dixerint eis quid sibi volunt isti lapides"
      en: "And said to the children of Israel: When your children shall ask their fathers, to morrow, and shall say to them: What mean these stones?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "docebitis eos atque dicetis per arentem alveum transivit Israhel Iordanem istum"
      en: "You shall teach them and say: Israel passed over this Jordan through the dry channel."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "siccante Domino Deo vestro aquas eius in conspectu vestro donec transiretis"
      en: "The Lord your God drying up the waters thereof in your sight, until you passed over:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "sicut fecerat prius in mari Rubro quod siccavit donec transiremus"
      en: "As he had done before in the Red Sea, which he dried up till we passed through :"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ut discant omnes terrarum populi fortissimam Domini manum et ut vos timeatis Dominum Deum vestrum omni tempore"
      en: "That all the people of the earth may learn the most mighty hand of the Lord, that you also may fear the Lord your God for ever."
    status: { la: verified, en: verified }
