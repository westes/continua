# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: dan
chapter: 9
verses:
  - n: 1
    text:
      la: "In anno primo Darii filii Assueri de semine Medorum, qui imperavit super regnum Chaldaeorum,"
      en: "In the first year of Darius the son of Assuerus of the seed of the Medes, who reigned over the kingdom of the Chaldeans:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "anno uno regni ejus, ego Daniel intellexi in libris numerum annorum, de quo factus est sermo Domini ad Jeremiam prophetam, ut complerentur desolationis Jerusalem septuaginta anni."
      en: "The first year of his reign, I Daniel understood by books the number of the years, concerning which the word of the Lord came to Jeremias the prophet, that seventy years should be accomplished of the desolation of Jerusalem."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et posui faciem meam ad Dominum Deum meum rogare et deprecari in jejuniis, sacco, et cinere."
      en: "And I set my face to the Lord my God, to pray and make supplication with fasting, and sackcloth, and ashes."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et oravi Dominum Deum meum, et confessus sum, et dixi: Obsecro, Domine Deus magne et terribilis, custodiens pactum, et misericordiam diligentibus te, et custodientibus mandata tua:"
      en: "And I prayed to the Lord my God, and I made my confession, and said: I beseech thee, O Lord God, great and terrible, who keepest the covenant, and mercy to them that love thee, and keep thy commandments."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "peccavimus, iniquitatem fecimus, impie egimus, et recessimus: et declinavimus a mandatis tuis ac judiciis."
      en: "We have sinned, we have committed iniquity, we have done wickedly, and have revolted: and we have gone aside from thy commandments, and thy judgments."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Non obedivimus servis tuis prophetis, qui locuti sunt in nomine tuo regibus nostris, principibus nostris, patribus nostris, omnique populo terrae."
      en: "We have not hearkened to thy servants the prophets, that have spoken in thy name to our kings, to our princes, to our fathers, and to all the people of the land."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Tibi, Domine, justitia: nobis autem confusio faciei, sicut est hodie viro Juda, et habitatoribus Jerusalem, et omni Israel, his qui prope sunt, et his qui procul in universis terris, ad quas ejecisti eos propter iniquitates eorum, in quibus peccaverunt in te."
      en: "To thee, O Lord, justice: but to us confusion of face, as at this day to the men of Juda, and to the inhabitants of Jerusalem, and to all Israel to them that are near, and to them that are far off in all the countries whither thou hast driven them, for their iniquities by which they have sinned against thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Domine, nobis confusio faciei, regibus nostris, principibus nostris, et patribus nostris, qui peccaverunt."
      en: "O Lord, to us belongeth confusion of face, to our princes, and to our fathers that have sinned."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Tibi autem Domino Deo nostro misericordia et propitiatio, quia recessimus a te,"
      en: "But to thee, the Lord our God, mercy and forgiveness, for we have departed from thee:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et non audivimus vocem Domini Dei nostri ut ambularemus in lege ejus, quam posuit nobis per servos suos prophetas."
      en: "And we have not hearkened to the voice of the Lord our God, to walk in his law, which he set before us by his servants the prophets."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et omnis Israel praevaricati sunt legem tuam, et declinaverunt ne audirent vocem tuam: et stillavit super nos maledictio et detestatio quae scripta est in libro Moysi servi Dei, quia peccavimus ei."
      en: "And all Israel have transgressed thy law, and have turned away from hearing thy voice, and the malediction, and the curse, which is written in the book of Moses the servant of God, is fallen upon us, because we have sinned against him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et statuit sermones suos, quos locutus est super nos et super principes nostros, qui judicaverunt nos, ut superinduceret in nos magnum malum, quale numquam fuit sub omni caelo, secundum quod factum est in Jerusalem."
      en: "And he hath confirmed his words which he spoke against us, and against our princes that judged us, that he would bring in upon us a great evil, such as never was under all the heaven, according to that which hath been done in Jerusalem."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sicut scriptum est in lege Moysi, omne malum hoc venit super nos: et non rogavimus faciem tuam, Domine Deus noster, ut reverteremur ab iniquitatibus nostris, et cogitaremus veritatem tuam."
      en: "As it is written in the law of Moses, all this evil is come upon us: and we entreated not thy face, O Lord our God, that we might turn from our iniquities, and think on thy truth."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et vigilavit Dominus super malitiam, et adduxit eam super nos. Justus Dominus Deus noster in omnibus operibus suis, quae fecit: non enim audivimus vocem ejus."
      en: "And the Lord hath watched upon the evil, and hath brought it upon us: the Lord our God is just in all his works which he hath done: for we have not hearkened to his voice."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et nunc Domine Deus noster, qui eduxisti populum tuum de terra Aegypti in manu forti, et fecisti tibi nomen secundum diem hanc: peccavimus, iniquitatem fecimus."
      en: "And now, O Lord our God, who hast brought forth thy people out of the land of Egypt with a strong hand, and hast made thee a name as at this day: we have sinned, we have committed iniquity,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Domine, in omnem justitiam tuam avertatur, obsecro, ira tua et furor tuus a civitate tua Jerusalem, et monte sancto tuo. Propter peccata enim nostra, et iniquitates patrum nostrorum, Jerusalem et populus tuus in opprobrium sunt omnibus per circuitum nostrum."
      en: "O Lord, against all thy justice: let thy wrath and thy indignation be turned away, I beseech thee, from thy city Jerusalem, and from thy holy mountain. For by reason of our sins, and the iniquities of our fathers, Jerusalem, and thy people are a reproach to all that are round about us."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Nunc ergo exaudi, Deus noster, orationem servi tui, et preces ejus: et ostende faciem tuam super sanctuarium tuum, quod desertum est propter temetipsum."
      en: "Now therefore, O our God, hear the supplication of thy servant, and his prayers: and shew thy face upon thy sanctuary which is desolate, for thy own sake."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Inclina, Deus meus, aurem tuam, et audi: aperi oculos tuos, et vide desolationem nostram, et civitatem super quam invocatum est nomen tuum: neque enim in justificationibus nostris prosternimus preces ante faciem tuam, sed in miserationibus tuis multis."
      en: "Incline, O my God, thy ear, and hear: open thy eyes, and see our desolation, and the city upon which thy name is called: for it is not for our justifications that we present our prayers before thy face, but for the multitude of thy tender mercies."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Exaudi, Domine; placare Domine: attende et fac: ne moreris propter temetipsum, Deus meus, quia nomen tuum invocatum est super civitatem et super populum tuum."
      en: "O Lord, hear: O Lord, be appeased: hearken and do: delay not for thy own sake, O my God: because thy name is invocated upon thy city, and upon thy people."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Cumque adhuc loquerer, et orarem, et confiterer peccata mea, et peccata populi mei Israel, et prosternerem preces meas in conspectu Dei mei, pro monte sancto Dei mei:"
      en: "Now while I was yet speaking, and praying, and confessing my sins, and the sins of my people of Israel, and presenting my supplications in the sight of my God, for the holy mountain of my God:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "adhuc me loquente in oratione, ecce vir Gabriel, quem videram in visione a principio, cito volans tetigit me in tempore sacrificii vespertini."
      en: "As I was yet speaking in prayer, behold the man Gabriel, whom I had seen in the vision at the beginning, flying swiftly touched me at the time of the evening sacrifice."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et docuit me, et locutus est mihi, dixitque: Daniel, nunc egressus sum ut docerem te, et intelligeres."
      en: "And he instructed me, and spoke to me, and said: O Daniel, I am now come forth to teach thee, and that thou mightest understand."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ab exordio precum tuarum egressus est sermo: ego autem veni ut indicarem tibi, quia vir desideriorum es: tu ergo animadverte sermonem, et intellige visionem."
      en: "From the beginning of thy prayers the word came forth: and I am come to shew it to thee, because thou art a man of desires: therefore do thou mark the word, and understand the vision."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Septuaginta hebdomades abbreviatae sunt super populum tuum et super urbem sanctam tuam, ut consummetur praevaricatio, et finem accipiat peccatum, et deleatur iniquitas, et adducatur justitia sempiterna, et impleatur visio et prophetia, et ungatur Sanctus sanctorum."
      en: "Seventy weeks are shortened upon thy people, and upon thy holy city, that transgression may be finished, and sin may have an end, and iniquity may be abolished; and everlasting justice may be brought; and vision and prophecy may be fulfilled; and the saint of saints may be anointed."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Scito ergo, et animadverte: ab exitu sermonis, ut iterum aedificetur Jerusalem, usque ad Christum ducem, hebdomades septem, et hebdomades sexaginta duae erunt: et rursum aedificabitur platea, et muri in angustia temporum."
      en: "Know thou therefore, and take notice: that from the going forth of the word, to build up Jerusalem again, unto Christ the prince, there shall be seven weeks, and sixty-two weeks: and the street shall be built again, and the walls in straitness of times."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et post hebdomades sexaginta duas occidetur Christus: et non erit ejus populus qui eum negaturus est. Et civitatem et sanctuarium dissipabit populus cum duce venturo: et finis ejus vastitas, et post finem belli statuta desolatio."
      en: "And after sixty-two weeks Christ shall be slain: and the people that shall deny him shall not be his. And a people with their leader that shall come, shall destroy the city and the sanctuary: and the end thereof shall be waste, and after the end of the war the appointed desolation."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Confirmabit autem pactum multis hebdomada una: et in dimidio hebdomadis deficiet hostia et sacrificium: et erit in templo abominatio desolationis: et usque ad consummationem et finem perseverabit desolatio."
      en: "And he shall confirm the covenant with many, in one week: and in the half of the week the victim and the sacrifice shall fail: and there shall be in the temple the abomination of desolation: and the desolation shall continue even to the consummation, and to the end."
    status: { la: verified, en: verified }
