# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2reg
chapter: 9
verses:
  - n: 1
    text:
      la: "et dixit David putasne est aliquis qui remanserit de domo Saul ut faciam cum eo misericordiam propter Ionathan"
      en: "And David said: Is there any one, think you, left of the house of Saul, that I may shew kindness to him for Jonathan's sake?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "erat autem de domo Saul servus nomine Siba quem cum vocasset rex ad se dixit ei tune es Siba et ille respondit ego sum servus tuus"
      en: "Now there was of the house of Saul, a servant named Siba: and when the king had called him to him, he said to him: Art thou Siba? And he answered: I am Siba thy servant."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ait rex num superest aliquis de domo Saul ut faciam cum eo misericordiam Dei dixitque Siba regi superest filius Ionathan debilis pedibus"
      en: "And the king said: Is there any one left of the house of Saul, that I may shew the mercy of God unto him? And Siba said to the king: There is a son of Jonathan left, who is lame of his feet."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ubi inquit est et Siba ad regem ecce ait in domo est Machir filii Amihel in Lodabar"
      en: "Where is he? said he. And Siba said to the king: Behold he is in the house of Machir the son of Ammiel in Lodabar."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "misit ergo rex David et tulit eum de domo Machir filii Amihel de Lodabar"
      en: "Then king David sent, and brought him out of the house of Machir the son of Ammiel of Lodabar."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "cum autem venisset Mifiboseth filius Ionathan filii Saul ad David corruit in faciem suam et adoravit dixitque David Mifiboseth qui respondit adsum servus tuus"
      en: "And when Miphiboseth the son of Jonathan the son of Saul was come to David, he fell on his face and worshipped. And David said: Miphiboseth? And he answered: Behold thy servant."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et ait ei David ne timeas quia faciens faciam in te misericordiam propter Ionathan patrem tuum et restituam tibi omnes agros Saul patris tui et tu comedes panem in mensa mea semper"
      en: "And David said to him: Fear not, for I will surely shew thee mercy for Jonathan thy father's sake, and I will restore the lands of Saul thy father, and thou shalt eat bread at my table always."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui adorans eum dixit quis ego sum servus tuus quoniam respexisti super canem mortuum similem mei"
      en: "He bowed down to him, and said: Who am I thy servant, that thou shouldst look upon such a dead dog as I am?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "vocavit itaque rex Sibam puerum Saul et dixit ei omnia quaecumque fuerunt Saul et universam domum eius dedi filio domini tui"
      en: "Then the king called Siba the servant of Saul, and said to him: All that belonged to Saul, and all his house, I have given to thy master's son."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "operare igitur ei terram tu et filii tui et servi tui et inferes filio domini tui cibos ut alatur Mifiboseth autem filius domini tui comedet semper panem super mensam meam erant autem Sibae quindecim filii et viginti servi"
      en: "Thou therefore and thy sons and thy servants shall till the land for him: and thou shalt bring in food for thy master's son, that he may be maintained: and Miphiboseth the son of thy master shall always eat bread at my table. And Siba had fifteen sons and twenty servants."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dixitque Siba ad regem sicut iussisti domine mi rex servo tuo sic faciet servus tuus et Mifiboseth comedet super mensam tuam quasi unus de filiis regis"
      en: "And Siba said to the king: As thou my lord the king hast commanded thy servant, so will thy servant do: and Miphiboseth shall eat at my table, as one of the sons of the king."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "habebat autem Mifiboseth filium parvulum nomine Micha omnis vero cognatio domus Siba serviebat Mifiboseth"
      en: "And Miphiboseth had a young son whose name was Micha: and all the kindred of the house of Siba served Miphiboseth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "porro Mifiboseth habitabat in Hierusalem quia de mensa regis iugiter vescebatur et erat claudus utroque pede"
      en: "But Miphiboseth dwelt in Jerusalem: because he ate always of the king's table: and he was lame of both feet."
    status: { la: verified, en: verified }
