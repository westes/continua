# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 2
verses:
  - n: 1
    text:
      la: "igitur perfecti sunt caeli et terra et omnis ornatus eorum"
      en: "So the heavens and the earth were finished, and all the furniture of them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "conplevitque Deus die septimo opus suum quod fecerat et requievit die septimo ab universo opere quod patrarat"
      en: "And on the seventh day God ended his work which he had made: and he rested on the seventh day from all his work which he had done."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et benedixit diei septimo et sanctificavit illum quia in ipso cessaverat ab omni opere suo quod creavit Deus ut faceret"
      en: "And he blessed the seventh day, and sanctified it: because in it he had rested from all his work which God created and made."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "istae generationes caeli et terrae quando creatae sunt in die quo fecit Dominus Deus caelum et terram"
      en: "These are the generations of the heaven and the earth, when they were created, in the day that the Lord God made the heaven and the earth:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et omne virgultum agri antequam oreretur in terra omnemque herbam regionis priusquam germinaret non enim pluerat Dominus Deus super terram et homo non erat qui operaretur terram"
      en: "And every plant of the field before it spring up in the earth, and every herb of the ground before it grew: for the Lord God had not rained upon the earth; and there was not a man to till the earth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sed fons ascendebat e terra inrigans universam superficiem terrae"
      en: "But a spring rose out the earth, watering all the surface of the earth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "formavit igitur Dominus Deus hominem de limo terrae et inspiravit in faciem eius spiraculum vitae et factus est homo in animam viventem"
      en: "And the Lord God formed man of the slime of the earth: and breathed into his face the breath of life, and man became a living soul."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "plantaverat autem Dominus Deus paradisum voluptatis a principio in quo posuit hominem quem formaverat"
      en: "And the Lord God had planted a paradise of pleasure from the beginning: wherein he placed man whom he had formed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "produxitque Dominus Deus de humo omne lignum pulchrum visu et ad vescendum suave lignum etiam vitae in medio paradisi lignumque scientiae boni et mali"
      en: "And the Lord God brought forth of the ground all manner of trees, fair to behold, and pleasant to eat of: the tree of life also in the midst of paradise: and the tree of knowledge of good and evil."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et fluvius egrediebatur de loco voluptatis ad inrigandum paradisum qui inde dividitur in quattuor capita"
      en: "And a river went out the place of pleasure to water paradise, which from thence is divided into four heads."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "nomen uni Phison ipse est qui circuit omnem terram Evilat ubi nascitur aurum"
      en: "The name of the one is Phison: that is it which compasseth all the land of Hevilath, where gold groweth."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et aurum terrae illius optimum est ibique invenitur bdellium et lapis onychinus"
      en: "And the gold of that land is very good: there is found bdellium, and the onyx stone."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et nomen fluvio secundo Geon ipse est qui circuit omnem terram Aethiopiae"
      en: "And the name of the second river is Gehon: the same is it that compasseth all the land of Ethiopia"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "nomen vero fluminis tertii Tigris ipse vadit contra Assyrios fluvius autem quartus ipse est Eufrates"
      en: "And the name of the third river is Tigris: the same passeth along by the Assyrians. And the fourth river is Euphrates."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "tulit ergo Dominus Deus hominem et posuit eum in paradiso voluptatis ut operaretur et custodiret illum"
      en: "And the Lord God took man, and put him into the paradise for pleasure, to dress it, and keep it."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "praecepitque ei dicens ex omni ligno paradisi comede"
      en: "And he commanded him, saying: Of every tree of paradise thou shalt eat:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "de ligno autem scientiae boni et mali ne comedas in quocumque enim die comederis ex eo morte morieris"
      en: "But of the tree of knowledge of good and evil, thou shalt not eat. for in what day soever thou shalt eat of it, thou shalt die the death."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dixit quoque Dominus Deus non est bonum esse hominem solum faciamus ei adiutorium similem sui"
      en: "And the Lord God said: It is not good for man to be alone: let us make him a help like unto himself."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "formatis igitur Dominus Deus de humo cunctis animantibus terrae et universis volatilibus caeli adduxit ea ad Adam ut videret quid vocaret ea omne enim quod vocavit Adam animae viventis ipsum est nomen eius"
      en: "And the Lord God having formed out of the ground all the beasts of the earth, and all the fowls of the air, brought them to Adam to see what he would call them: for whatsoever Adam called any living creature the same is its name."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "appellavitque Adam nominibus suis cuncta animantia et universa volatilia caeli et omnes bestias terrae Adam vero non inveniebatur adiutor similis eius"
      en: "And Adam called all the beasts by their names, and all the fowls of the air, and all the cattle of the field: but for Adam there was not found a helper like himself."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "inmisit ergo Dominus Deus soporem in Adam cumque obdormisset tulit unam de costis eius et replevit carnem pro ea"
      en: "Then the Lord God cast a deep sleep upon Adam: and when he was fast asleep, he took one of his ribs, and filled up flesh for it."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et aedificavit Dominus Deus costam quam tulerat de Adam in mulierem et adduxit eam ad Adam"
      en: "And the Lord God built the rib which he took from Adam into a woman: and brought her to Adam."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "dixitque Adam hoc nunc os ex ossibus meis et caro de carne mea haec vocabitur virago quoniam de viro sumpta est"
      en: "And Adam said: This now is bone of my bones, and flesh of my flesh; she shall be called woman, because she was taken out of man."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "quam ob rem relinquet homo patrem suum et matrem et adherebit uxori suae et erunt duo in carne una"
      en: "Wherefore a man shall leave father and mother, and shall cleave to his wife: and they shall be two in one flesh."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "erant autem uterque nudi Adam scilicet et uxor eius et non erubescebant"
      en: "And they were both naked: to wit, Adam and his wife: and were not ashamed."
    status: { la: verified, en: verified }
