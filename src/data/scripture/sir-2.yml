# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 2
verses:
  - n: 1
    text:
      la: "fili accedens servituti Dei sta in iustitia et timore et praepara animam tuam ad temptationem"
      en: "Son, when thou comest to the service of God, stand in justice and in fear, and prepare thy soul for temptation."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "deprime cor tuum et sustine declina aurem et excipe verba intellectus et ne festines in tempus obductionis"
      en: "Humble thy heart, and endure: incline thy ear, and receive the words of understanding: and make not haste in the time of clouds."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sustine sustentationes Dei coniungere Deo et sustine ut crescat in novissimo vita tua"
      en: "Wait on God with patience: join thyself to God, and endure, that thy life may be increased in the latter end."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "omne quod tibi adplicitum fuerit accipe et in dolore sustine et in humilitate tua habe patientiam"
      en: "Take all that shall be brought upon thee: and in thy sorrow endure, and in thy humiliation keep patience."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quoniam in igne probatur aurum et argentum homines vero receptibiles in camino humiliationis"
      en: "For gold and silver are tried in the fire, but acceptable men in the furnace of humiliation."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "crede Deo et recuperabit te et dirige viam tuam et spera in illum serva timorem illius et in illo veteresce"
      en: "Believe God, and he will recover thee: and direct thy way, and trust in him. Keep his fear, and grow old therein."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "metuentes Deum sustinete misericordiam eius et non deflectatis ab illo ne cadatis"
      en: "Ye that fear the Lord, wait for his mercy: and go not aside from him, lest ye fall."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui timetis Deum credite illi et non evacuabitur merces vestra"
      en: "Ye that fear the Lord, believe him: and your reward shall not be made void."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "qui timetis Deum sperate in illum et in oblectatione veniet vobis misericordia"
      en: "Ye that fear the Lord, hope in him: and mercy shall come to you for your delight."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui timetis Deum diligite illum et inluminabuntur corda vestra"
      en: "Ye that fear the Lord, love him, and your hearts shall be enlightened."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "respicite filii nationes hominum et scitote quis speravit in Dominum et confusus est"
      en: "My children behold the generations of men: and know ye that no one hath hoped in the Lord, and hath been confounded."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "permansit in mandatis eius et derelictus est et quis invocavit illum et despexit illum"
      en: "For who hath continued in his commandment, and hath been forsaken? or who hath called upon him, and he despised him?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quoniam pius et misericors Deus et remittit in tempore tribulationis peccata omnibus exquirentibus se in veritate"
      en: "For God is compassionate and merciful, and will forgive sins in the day of tribulation: and he is a protector to all that seek him in truth."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "vae duplici corde et labiis scelestis et manibus malefacientibus et peccatori terram ingredienti duabus viis"
      en: "Woe to them that are of a double heart and to wicked lips, and to the hands that do evil, and to the sinner that goeth on the earth two ways."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "vae dissolutis corde qui non credunt Deo ideo non protegentur ab eo"
      en: "Woe to them that are fainthearted, who believe not God: and therefore they shall not be protected by him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "vae his qui perdiderunt sustinentiam qui dereliquerunt vias rectas et deverterunt in vias pravas"
      en: "Woe to them that have lost patience, and that have forsaken the right ways, and have gone aside into crooked ways."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et quid facietis cum inspicere coeperit Deus"
      en: "And what will they do, when the Lord shall begin to examine?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui timent Dominum non erunt incredibiles verbo illius et qui diligunt illum conservabunt viam illius"
      en: "They that fear the Lord, will not be incredulous to his word: and they that love him, will keep his way."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "qui timent Dominum inquirent quae beneplacita sunt illi et qui diligunt eum replebuntur lege ipsius"
      en: "They that fear the Lord, will seek after the things that are well pleasing to him: and they that love him, shall be filled with his law."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "qui timent Dominum parabunt corda sua et in conspectu illius sanctificabunt animas suas"
      en: "They that fear the Lord, will prepare their hearts, and in his sight will sanctify their souls."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui timent Dominum custodiunt mandata illius et patientiam habebunt usque ad inspectionem illius"
      en: "They that fear the Lord, keep his Commandments, and will have patience even until his visitation,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "dicentes si paenitentiam non egerimus incidemus in Dei manus et non in manus hominum"
      en: "Saying: If we do not penance, we shall fall into the hands of the Lord, and not into the hands of men."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "secundum enim magnitudinem illius sic et misericordia ipsius cum ipso"
      en: "For according to his greatness, so also is his mercy with him."
    status: { la: verified, en: verified }
