# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: apoc
chapter: 12
verses:
  - n: 1
    text:
      la: "Et signum magnum apparuit in caelo: mulier amicta sole, et luna sub pedibus ejus, et in capite ejus corona stellarum duodecim:"
      en: "And a great sign appeared in heaven: A woman clothed with the sun, and the moon under her feet, and on her head a crown of twelve stars:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et in utero habens, clamabat parturiens, et cruciabatur ut pariat."
      en: "And being with child, she cried travailing in birth, and was in pain to be delivered."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et visum est aliud signum in caelo: et ecce draco magnus rufus habens capita septem, et cornua decem: et in capitibus ejus diademata septem,"
      en: "And there was seen another sign in heaven: and behold a great red dragon, having seven heads, and ten horns: and on his heads seven diadems:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et cauda ejus trahebat tertiam partem stellarum caeli, et misit eas in terram: et draco stetit ante mulierem, quae erat paritura, ut cum peperisset, filium ejus devoraret."
      en: "And his tail drew the third part of the stars of heaven, and cast them to the earth: and the dragon stood before the woman who was ready to be delivered; that, when she should be delivered, he might devour her son."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et peperit filium masculum, qui recturus erat omnes gentes in virga ferrea: et raptus est filius ejus ad Deum, et ad thronum ejus,"
      en: "And she brought forth a man child, who was to rule all nations with an iron rod: and her son was taken up to God, and to his throne."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et mulier fugit in solitudinem ubi habebat locum paratum a Deo, ut ibi pascant eam diebus mille ducentis sexaginta."
      en: "And the woman fled into the wilderness, where she had a place prepared by God, that there they should feed her a thousand two hundred sixty days."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et factum est praelium magnum in caelo: Michael et angeli ejus praeliabantur cum dracone, et draco pugnabat, et angeli ejus:"
      en: "And there was a great battle in heaven, Michael and his angels fought with the dragon, and the dragon fought and his angels:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et non valuerunt, neque locus inventus est eorum amplius in caelo."
      en: "And they prevailed not, neither was their place found any more in heaven."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et projectus est draco ille magnus, serpens antiquus, qui vocatur diabolus, et Satanas, qui seducit universum orbem: et projectus est in terram, et angeli ejus cum illo missi sunt."
      en: "And that great dragon was cast out, that old serpent, who is called the devil and Satan, who seduceth the whole world; and he was cast unto the earth, and his angels were thrown down with him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et audivi vocem magnam in caelo dicentem: Nunc facta est salus, et virtus, et regnum Dei nostri, et potestas Christi ejus: quia projectus est accusator fratrum nostrorum, qui accusabat illos ante conspectum Dei nostri die ac nocte."
      en: "And I heard a loud voice in heaven, saying: Now is come salvation, and strength, and the kingdom of our God, and the power of his Christ: because the accuser of our brethren is cast forth, who accused them before our God day and night."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et ipsi vicerunt eum propter sanguinem Agni, et propter verbum testimonii sui, et non dilexerunt animas suas usque ad mortem."
      en: "And they overcame him by the blood of the Lamb, and by the word of the testimony, and they loved not their lives unto death."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Propterea laetamini caeli, et qui habitatis in eis. Vae terrae, et mari, quia descendit diabolus ad vos habens iram magnam, sciens quod modicum tempus habet."
      en: "Therefore rejoice, O heavens, and you that dwell therein. Woe to the earth, and to the sea, because the devil is come down unto you, having great wrath, knowing that he hath but a short time."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et postquam vidit draco quod projectus esset in terram, persecutus est mulierem, quae peperit masculum:"
      en: "And when the dragon saw that he was cast unto the earth, he persecuted the woman, who brought forth the man child:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et datae sunt mulieri alae duae aquilae magnae ut volaret in desertum in locum suum, ubi alitur per tempus et tempora, et dimidium temporis a facie serpentis."
      en: "And there were given to the woman two wings of a great eagle, that she might fly into the desert unto her place, where she is nourished for a time and times, and half a time, from the face of the serpent."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et misit serpens ex ore suo post mulierem, aquam tamquam flumen, ut eam faceret trahi a flumine."
      en: "And the serpent cast out of his mouth after the woman, water as it were a river; that he might cause her to be carried away by the river."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et adjuvit terra mulierem, et aperuit terra os suum, et absorbuit flumen, quod misit draco de ore suo."
      en: "And the earth helped the woman, and the earth opened her mouth, and swallowed up the river, which the dragon cast out of his mouth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et iratus est draco in mulierem: et abiit facere praelium cum reliquis de semine ejus, qui custodiunt mandata Dei, et habent testimonium Jesu Christi."
      en: "And the dragon was angry against the woman: and went to make war with the rest of her seed, who keep the commandments of God, and have the testimony of Jesus Christ."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et stetit supra arenam maris."
      en: "And he stood upon the sand of the sea."
    status: { la: verified, en: verified }
