# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 11
verses:
  - n: 1
    text:
      la: "Athalia vero mater Ochoziae, videns mortuum filium suum, surrexit, et interfecit omne semen regium."
      en: "And Athalia the mother of Ochozias seeing that her son was dead, arose, and slew all the royal seed."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Tollens autem Josaba filia regis Joram, soror Ochoziae, Joas filium Ochoziae, furata est eum de medio filiorum regis, qui interficiebantur, et nutricem ejus de triclinio: et abscondit eum a facie Athaliae ut non interficeretur."
      en: "But Josaba the daughter of king Joram, sister of Ochozias, took Joas the son of Ochozias, and stole him from among the king's sons that were slain, out of the bedchamber with his nurse: and hid him from the face of Athalia, so that he was not slain."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Eratque cum ea sex annis clam in domo Domini: porro Athalia regnavit super terram."
      en: "And he was with her six years hid in the house of the Lord. And Athalia reigned over the land."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Anno autem septimo misit Jojada, et assumens centuriones et milites, introduxit ad se in templum Domini, pepigitque cum eis foedus: et adjurans eos in domo Domini, ostendit eis filium regis:"
      en: "And in the seventh year Joiada sent, and taking the centurions and the soldiers, brought them in to him into the temple of the Lord, and made a covenant with them: and taking an oath of them in the house of the Lord, shewed them the king's son:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et praecepit illis, dicens: Iste est sermo, quem facere debetis:"
      en: "And he commanded them, saying: This is the thing that you must do:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "tertia pars vestrum introeat sabbato, et observet excubias domus regis. Tertia autem pars sit ad portam Sur, et tertia pars sit ad portam, quae est post habitaculum scutariorum: et custodietis excubias domus Messa."
      en: "Let a third part of you go in on the sabbath, and keep the watch of the king's house. And let a third part be at the gate of Sur: and let a third part be at the gate behind the dwelling of the shieldbearers: and you shall keep the watch of the house of Messa."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Duae vero partes e vobis, omnes egredientes sabbato, custodiant excubias domus Domini circa regem."
      en: "But let two parts of you, all that go forth on the sabbath, keep the watch of the house of the Lord about the king."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et vallabitis eum, habentes arma in manibus vestris: si quis autem ingressus fuerit septum templi, interficiatur: eritisque cum rege introeunte et egrediente."
      en: "And you shall compass him round about, having weapons in your hands: and if any man shall enter the precinct of the temple, let him be slain: and you shall be with the king coming in and going out."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et fecerunt centuriones juxta omnia quae praeceperat eis Jojada sacerdos: et assumentes singuli viros suos, qui ingrediebantur sabbato, cum his qui egrediebantur sabbato, venerunt ad Jojadam sacerdotem."
      en: "And the centurions did according to all things that Joiada the priest had commanded them: and taking every one their men, that went in on the sabbath, with them that went out on the sabbath, came to Joiada the priest."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Qui dedit eis hastas, et arma regis David, quae erant in domo Domini."
      en: "And he gave them the spears, and the arms of king David, which were in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et steterunt singuli habentes arma in manu sua a parte templi dextera, usque ad partem sinistram altaris, et aedis, circum regem."
      en: "And they stood having every one their weapons in their hands, from the right side of the temple, unto the left side of the altar, and of the temple, about the king."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Produxitque filium regis, et posuit super eum diadema, et testimonium: feceruntque eum regem, et unxerunt: et plaudentes manu, dixerunt: Vivat rex."
      en: "And he brought forth the king's son, and put the diadem upon him, and the testimony: and they made him king, and anointed him: and clapping their hands. they said, God save the king."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Audivit autem Athalia vocem populi currentis: et ingressa ad turbas in templum Domini,"
      en: "And Athalia heard the noise of the people running: and going in to the people into the temple of the Lord,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "vidit regem stantem super tribunal juxta morem, et cantores, et tubas prope eum, omnemque populum terrae laetantem, et canentem tubis: et scidit vestimenta sua, clamavitque: Conjuratio, conjuratio."
      en: "She saw the king standing upon a tribunal, as the manner was, and the singers, and the trumpets near him, and all the people of the land rejoicing, and sounding the trumpets: and she rent her garments, and cried: A conspiracy, a conspiracy."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Praecepit autem Jojada centurionibus, qui erant super exercitum, et ait eis: Educite eam extra septa templi, et quicumque eam secutus fuerit, feriatur gladio. Dixerat enim sacerdos: Non occidatur in templo Domini."
      en: "But Joiada commended the centurions that were over the army, and said to them: Have her forth without the precinct of the temple, and whosoever shall follow her, let him be slain with the sword. For the priest had said: Let her not be slain in the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Imposueruntque ei manus, et impegerunt eam per viam introitus equorum, juxta palatium, et interfecta est ibi."
      en: "And they laid hands on her: and thrust her out by the way by which the horses go in, by the palace, and she was slain there."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Pepigit ergo Jojada foedus inter Dominum, et inter regem, et inter populum, ut esset populus Domini, et inter regem et populum."
      en: "And Joiada made a covenant between the Lord, and the king, and the people, that they should be the people of the Lord, and between the king and the people."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ingressusque est omnis populus terrae templum Baal, et destruxerunt aras ejus, et imagines contriverunt valide: Mathan quoque sacerdotem Baal occiderunt coram altari. Et posuit sacerdos custodias in domo Domini."
      en: "And all the people of the land went into the temple of Baal, and broke down his altars, and his images they broke in pieces thoroughly: they slew also Mathan the priest of Baal before the altar. And the priest set guards in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Tulitque centuriones, et Cerethi et Phelethi legiones, et omnem populum terrae, deduxeruntque regem de domo Domini: et venerunt per viam portae scutariorum in palatium, et sedit super thronum regum."
      en: "And he took the centurions, and the bands of the Cerethi and the Phelethi, and all the people of the land, and they brought the king from the house of the Lord: and they came by the way of the gate of the shieldbearers into the palace. and he sat on the throne of the kings."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Laetatusque est omnis populus terrae, et civitas conquievit: Athalia autem occisa est gladio in domo regis."
      en: "And all the people of the land rejoiced, and the city was quiet: but Athalia was slain with the sword in the king's house."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Septemque annorum erat Joas, cum regnare coepisset."
      en: "Now Joas was seven years old, when he began to reign."
    status: { la: verified, en: verified }
