# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: lev
chapter: 9
verses:
  - n: 1
    text:
      la: "Facto autem octavo die, vocavit Moyses Aaron, et filios ejus, ac majores natu Israel, dixitque ad Aaron:"
      en: "And when the eighth day was come, Moses called Aaron and his sons, and the ancients of Israel, and said to Aaron:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Tolle de armento vitulum pro peccato, et arietem in holocaustum, utrumque immaculatum, et offer illos coram Domino."
      en: "Take of the herd a calf for sin, and a ram for a holocaust, both without blemish, and offer them before the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et ad filios Israel loqueris: Tollite hircum pro peccato, et vitulum, atque agnum, anniculos, et sine macula in holocaustum,"
      en: "And to the children of Israel thou shalt say: Take ye a he goat for sin, and a calf, and a lamb, both of a year old, and without blemish for a holocaust,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "bovem et arietem pro pacificis: et immolate eos coram Domino, in sacrificio singulorum similam conspersam oleo offerentes: hodie enim Dominus apparebit vobis."
      en: "Also a bullock and a ram for peace offerings: and immolate them before the Lord, offering for the sacrifice of every one of them flour tempered with oil; for today the Lord will appear to you."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Tulerunt ergo cuncta quae jusserat Moyses ad ostium tabernaculi: ubi cum omnis multitudo astaret,"
      en: "They brought therefore all things that Moses had commanded before the door of the tabernacle: where when all the multitude stood,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ait Moyses: Iste est sermo, quem praecepit Dominus: facite, et apparebit vobis gloria ejus."
      en: "Moses said: This is the word, which the Lord hath commanded: do it, and his glory will appear to you."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et dixit ad Aaron: Accede ad altare, et immola pro peccato tuo: offer holocaustum, et deprecare pro te et pro populo: cumque mactaveris hostiam populi, ora pro eo, sicut praecepit Dominus."
      en: "And he said to Aaron: Approach to the altar, and offer sacrifice for thy sin: offer the holocaust, and pray for thyself and for the people: and when thou hast slain the people's victim, pray for them, as the Lord hath commanded."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Statimque Aaron accedens ad altare, immolavit vitulum pro peccato suo:"
      en: "And forthwith Aaron, approaching to the altar, immolated the calf for his sin:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cujus sanguinem obtulerunt ei filii sui: in quo tingens digitum, tetigit cornua altaris, et fudit residuum ad basim ejus."
      en: "And his sons brought him the blood of it: and he dipped his finger therein, and touched the horns of the altar, and poured the rest at the foot thereof."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Adipemque, et renunculos, ac reticulum jecoris, quae sunt pro peccato, adolevit super altare, sicut praeceperat Dominus Moysi:"
      en: "And the fat, and the little kidneys, and the caul of the liver, which are for sin, he burnt upon the altar, as the Lord had commanded Moses:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "carnes vero et pellem ejus extra castra combussit igni."
      en: "But the flesh and skins thereof he burnt with fire without the camp."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Immolavit et holocausti victimam: obtuleruntque ei filii sui sanguinem ejus, quem fudit per altaris circuitum."
      en: "He immolated also the victim of holocaust: and his sons brought him the blood thereof, which he poured round about on the altar."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ipsam etiam hostiam in frusta concisam, cum capite et membris singulis obtulerunt; quae omnia super altare cremavit igni,"
      en: "And the victim being cut into pieces, they brought to him the head and all the members, all which he burnt with fire upon the altar,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "lotis aqua prius intestinis et pedibus."
      en: "Having first washed the entrails and the feet with water."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et pro peccato populi offerens, mactavit hircum: expiatoque altari,"
      en: "Then offering for the sin of the people, he slew the he goat: and expiating the altar,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "fecit holocaustum,"
      en: "He offered the holocaust:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "addens in sacrificio libamenta, quae pariter offeruntur, et adolens ea super altare, absque caeremoniis holocausti matutini."
      en: "Adding in the sacrifice the libations, which are offered withal, and burning them upon the altar, besides the ceremonies of the morning holocaust."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Immolavit et bovem atque arietem, hostias pacificas populi: obtuleruntque ei filii sui sanguinem, quem fudit super altare in circuitum."
      en: "He immolated also the bullock and the ram, the peace offerings of the people: and his sons brought him the blood, which he poured upon the altar round about."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Adipem autem bovis, et caudam arietis, renunculosque cum adipibus suis, et reticulum jecoris,"
      en: "The fat also of the bullock, and the rump of the ram, and the two little kidneys, with their fat, and the caul of the liver,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "posuerunt super pectora: cumque cremati essent adipes super altare,"
      en: "They put upon the breasts. And after the fat was burnt upon the altar,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "pectora eorum, et armos dextros separavit Aaron, elevans coram Domino, sicut praeceperat Moyses."
      en: "Aaron separated their breasts, and the right shoulders, elevating them before the Lord, as Moses had commanded."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et extendens manus ad populum, benedixit ei. Sicque completis hostiis pro peccato, et holocaustis, et pacificis, descendit."
      en: "And stretching forth his hands to the people, he blessed them. And so the victims for sin, and the holocausts, and the peace offerings being finished, he came down."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ingressi autem Moyses et Aaron in tabernaculum testimonii, et deinceps egressi, benedixerunt populo. Apparuitque gloria Domini omni multitudini:"
      en: "And Moses and Aaron went into the tabernacle of the testimony, and afterwards came forth and blessed the people. And the glory of the Lord appeared to all the multitude:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et ecce egressus ignis a Domino, devoravit holocaustum, et adipes qui erant super altare. Quod cum vidissent turbae, laudaverunt Dominum, ruentes in facies suas."
      en: "And behold a fire, coming forth from the Lord, devoured the holocaust, and the fat that was upon the altar: which when the multitude saw, they praised the Lord, falling on their faces."
    status: { la: verified, en: verified }
