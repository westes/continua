# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 33
verses:
  - n: 1
    text:
      la: "Elevans autem Jacob oculos suos, vidit venientem Esau, et cum eo quadringentos viros: divisitque filios Liae et Rachel, ambarumque famularum:"
      en: "And Jacob lifting up his eyes, saw Esau coming, and with him four hundred men: and he divided the children of Lia, and of Rachel, and of the two handmaids:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et posuit utramque ancillam, et liberos earum, in principio: Liam vero, et filios ejus, in secundo loco: Rachel autem et Joseph novissimos."
      en: "And he put both the handmaids and their children foremost: and Lia and her children in the second place: and Rachel and Joseph last."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et ipse progrediens adoravit pronus in terram septies, donec appropinquaret frater ejus."
      en: "And he went forward and bowed down with his face to the ground seven times until his brother came near."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Currens itaque Esau obviam fratri suo, amplexatus est eum: stringensque collum ejus, et osculans flevit."
      en: "Then Esau ran to meet his brother, and embraced him: and clasping him fast about the neck, and kissing him, wept."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Levatisque oculis, vidit mulieres et parvulos earum, et ait: Quid sibi volunt isti? et si ad te pertinent? Respondit: Parvuli sunt quos donavit mihi Deus servo tuo."
      en: "And lifting up his eyes, he saw the women and their children, and said: What mean these? And do they belong to thee? He answered: They are the children which God hath given to me thy servant."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et appropinquantes ancillae et filii earum, incurvati sunt."
      en: "Then the handmaids and their children came near, and bowed themselves."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Accessit quoque Lia cum pueris suis: et cum similiter adorassent, extremi Joseph et Rachel adoraverunt."
      en: "Lia also with her children came near, and bowed down in like manner, and last of all Joseph and Rachel bowed down."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dixitque Esau: Quaenam sunt istae turmae quas obviam habui? Respondit: Ut invenirem gratiam coram domino meo."
      en: "And Esau said: What are the droves that I met? He answered: That I might find favour before my lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "At ille ait: Habeo plurima, frater mi, sint tua tibi."
      en: "But he said: I have plenty, my brother, keep what is thine for thyself."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dixitque Jacob: Noli ita, obsecro: sed si inveni gratiam in oculis tuis, accipe munusculum de manibus meis. Sic enim vidi faciem tuam, quasi viderim vultum Dei: esto mihi propitius,"
      en: "And Jacob said: Do not so I beseech thee, but if I have found favour in thy eyes, receive a little present at my hands: for I have seen thy face, as if I should have seen the countenance of God: be gracious to me,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et suscipe benedictionem quam attuli tibi, et quam donavit mihi Deus tribuens omnia. Vix fratre compellente, suscipiens,"
      en: "And take the blessing, which I have brought thee, and which God hath given me, who giveth all things. He took it with much ado at his brother's earnest pressing him,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ait: Gradiamur simul, eroque socius itineris tui."
      en: "And said: Let us go on together, and I will accompany thee in thy journey."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dixitque Jacob: Nosti, domine mi, quod parvulos habeam teneros, et oves, et boves foetas mecum: quas si plus in ambulando fecero laborare, morientur una die cuncti greges."
      en: "And Jacob said: My lord, thou knowest that I have with me tender children, and sheep, and kine with young: which if I should cause to be overdriven, in one day all the flocks will die."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Praecedat dominus meus ante servum suum: et ego sequar paulatim vestigia ejus, sicut videro parvulos meos posse, donec veniam ad dominum meum in Seir."
      en: "May it please my lord to go before his servant: and I will follow softly after him, as I shall see my children to be able, until I come to my lord in Seir."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Respondit Esau: Oro te, ut de populo qui mecum est, saltem socri remaneant viae tuae. Non est, inquit, necesse: hoc uno tantum indigeo, ut inveniam gratiam in conspectu tuo, domine mi."
      en: "Esau answered: I beseech thee, that some of the people at least, who are with me, may stay to accompany thee in the way. And he said: There is no necessity: I want nothing else but only to find favour, my lord, in thy sight."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Reversus est itaque illo die Esau itinere quo venerat in Seir."
      en: "So Esau returned, that day, the way that he came, to Seir."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et Jacob venit in Socoth: ubi aedificata domo et fixis tentoriis appellavit nomen loci illius Socoth, id est, Tabernacula."
      en: "And Jacob came to Socoth: where having built a house, and pitched tents, he called the name of the place Socoth, that is, Tents."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Transivitque in Salem urbem Sichimorum, quae est in terra Chanaan, postquam reversus est de Mesopotamia Syriae: et habitavit juxta oppidum."
      en: "And he passed over to Salem, a city of the Sichemites, which is in the land of Chanaan, after he returned from Mesopotamia of Syria: and he dwelt by the town:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Emitque partem agri, in qua fixerat tabernacula, a filiis Hemor patris Sichem centum agnis."
      en: "And he bought that part of the field, in which he pitched his tents, of the children of Hemor, the father of Sichem for a hundred lambs."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et erecto ibi altari, invocavit super illud fortissimum Deum Israel."
      en: "And raising an altar there, he invoked upon it the most mighty God of Israel."
    status: { la: verified, en: verified }
