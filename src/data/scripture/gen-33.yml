# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 33
verses:
  - n: 1
    text:
      la: "levans autem Iacob oculos suos vidit venientem Esau et cum eo quadringentos viros divisitque filios Liae et Rahel ambarumque famularum"
      en: "And Jacob lifting up his eyes, saw Esau coming, and with him four hundred men: and he divided the children of Lia, and of Rachel, and of the two handmaids:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et posuit utramque ancillam et liberos earum in principio Liam vero et filios eius in secundo loco Rahel autem et Ioseph novissimos"
      en: "And he put both the handmaids and their children foremost: and Lia and her children in the second place: and Rachel and Joseph last."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ipse praegrediens adoravit pronus in terram septies donec adpropinquaret frater eius"
      en: "And he went forward and bowed down with his face to the ground seven times until his brother came near."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "currens itaque Esau obviam fratri suo amplexatus est eum stringensque collum et osculans flevit"
      en: "Then Esau ran to meet his brother, and embraced him: and clasping him fast about the neck, and kissing him, wept."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "levatisque oculis vidit mulieres et parvulos earum et ait quid sibi volunt isti et si ad te pertinent respondit parvuli sunt quos donavit mihi Deus servo tuo"
      en: "And lifting up his eyes, he saw the women and their children, and said: What mean these? And do they belong to thee? He answered: They are the children which God hath given to me thy servant."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et adpropinquantes ancillae et filii earum incurvati sunt"
      en: "Then the handmaids and their children came near, and bowed themselves."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "accessitque Lia cum liberis suis et cum similiter adorassent extremi Ioseph et Rahel adoraverunt"
      en: "Lia also with her children came near, and bowed down in like manner, and last of all Joseph and Rachel bowed down."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quaenam sunt inquit istae turmae quas obvias habui respondit ut invenirem gratiam coram domino meo"
      en: "And Esau said: What are the droves that I met? He answered: That I might find favor before my lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et ille habeo ait plurima frater mi sint tua tibi"
      en: "But he said: I have plenty, my brother, keep what is thine for thyself."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dixit Iacob noli ita obsecro sed si inveni gratiam in oculis tuis accipe munusculum de manibus meis sic enim vidi faciem tuam quasi viderim vultum Dei esto mihi propitius"
      en: "And Jacob said: Do not so I beseech thee, but if I have found favor in thy eyes, receive a little present at my hands: for I have seen thy face, as if I should have seen the countenance of God: be gracious to me,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et suscipe benedictionem quam adtuli tibi et quam donavit mihi Deus tribuens omnia vix fratre conpellente suscipiens"
      en: "And take the blessing, which I have brought thee, and which God hath given me, who giveth all things. He took it with much ado at his brother's earnest pressing him,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ait gradiamur simul eroque socius itineris tui"
      en: "And said: Let us go on together, and I will accompany thee in thy journey."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixit Iacob nosti domine mi quod parvulos habeam teneros et oves ac boves fetas mecum quas si plus in ambulando fecero laborare morientur una die cuncti greges"
      en: "And Jacob said: My lord, thou knowest that I have with me tender children, and sheep, and kine with young: which if I should cause to be overdriven, in one day all the flocks will die."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "praecedat dominus meus ante servum suum et ego sequar paulatim vestigia eius sicut videro posse parvulos meos donec veniam ad dominum meum in Seir"
      en: "May it please my lord to go before his servant: and I will follow softly after him, as I shall see my children to be able, until I come to my lord in Seir."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "respondit Esau oro te ut de populo qui mecum est saltem socii remaneant viae tuae non est inquit necesse hoc uno indigeo ut inveniam gratiam in conspectu domini mei"
      en: "Esau answered: I beseech thee, that some of the people at least, who are with me, may stay to accompany thee in the way. And he said: There is no necessity: I want nothing else but only to find favor, my lord, in thy sight."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "reversus est itaque illo die Esau itinere quo venerat in Seir"
      en: "So Esau returned, that day, the way that he came, to Seir."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et Iacob venit in Soccoth ubi aedificata domo et fixis tentoriis appellavit nomen loci illius Soccoth id est Tabernacula"
      en: "And Jacob came to Socoth: where having built a house, and pitched tents, he called the name of the place Socoth, that is, Tents."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "transivitque in Salem urbem Sycimorum quae est in terra Chanaan postquam regressus est de Mesopotamiam Syriae et habitavit iuxta oppidum"
      en: "And he passed over to Salem, a city of the Sichemites, which is in the land of Chanaan, after he returned from Mesopotamia of Syria: and he dwelt by the town:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "emitque partem agri in qua fixerat tabernaculum a filiis Emor patris Sychem centum agnis"
      en: "And he bought that part of the field, in which he pitched his tents, of the children of Hemor, the father of Sichem for a hundred lambs."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et erecto ibi altari invocavit super illud Fortissimum Deum Israhel"
      en: "And raising an altar there, he invoked upon it the most mighty God of Israel."
    status: { la: verified, en: verified }
