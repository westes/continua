# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 20
verses:
  - n: 1
    text:
      la: "Locutusque est Dominus cunctos sermones hos:"
      en: "And the Lord spoke all these words:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ego sum Dominus Deus tuus, qui eduxi te de terra Aegypti, de domo servitutis."
      en: "I am the Lord thy God, who brought thee out of the land of Egypt, out of the house of bondage."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Non habebis deos alienos coram me."
      en: "Thou shalt not have strange gods before me."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Non facies tibi sculptile, neque omnem similitudinem quae est in caelo desuper, et quae in terra deorsum, nec eorum quae sunt in aquis sub terra."
      en: "Thou shalt not make to thyself a graven thing, nor the likeness of any thing that is in heaven above, or in the earth beneath, nor of those things that are in the waters under the earth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Non adorabis ea, neque coles: ego sum Dominus Deus tuus fortis, zelotes, visitans iniquitatem patrum in filios, in tertiam et quartam generationem eorum qui oderunt me:"
      en: "Thou shalt not adore them, nor serve them: I am the Lord thy God, mighty, jealous, visiting the iniquity of the fathers upon the children, unto the third and fourth generation of them that hate me:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et faciens misericordiam in millia his qui diligunt me, et custodiunt praecepta mea."
      en: "And shewing mercy unto thousands to them that love me, and keep my commandments."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Non assumes nomen Domini Dei tui in vanum: nec enim habebit insontem Dominus eum qui assumpserit nomen Domini Dei sui frustra."
      en: "Thou shalt not take the name of the Lord thy God in vain: for the Lord will not hold him guiltless that shall take the name of the Lord his God in vain."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Memento ut diem sabbati sanctifices."
      en: "Remember that thou keep holy the sabbath day."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sex diebus operaberis, et facies omnia opera tua."
      en: "Six days shalt thou labour, and shalt do all thy works."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Septimo autem die sabbatum Domini Dei tui est: non facies omne opus in eo, tu, et filius tuus et filia tua, servus tuus et ancilla tua, jumentum tuum, et advena qui est intra portas tuas."
      en: "But on the seventh day is the sabbath of the Lord thy God: thou shalt do no work on it, thou nor thy son, nor thy daughter, nor thy manservant, nor thy maidservant, nor thy beast, nor the stranger that is within thy gates."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sex enim diebus fecit Dominus caelum et terram, et mare, et omnia quae in eis sunt, et requievit in die septimo: idcirco benedixit Dominus diei sabbati, et sanctificavit eum."
      en: "For in six days the Lord made heaven and earth, and the sea, and all things that are in them, and rested on the seventh day: therefore the Lord blessed the seventh day, and sanctified it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Honora patrem tuum et matrem tuam, ut sis longaevus super terram, quam Dominus Deus tuus dabit tibi."
      en: "Honour thy father and thy mother, that thou mayest be longlived upon the land which the Lord thy God will give thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Non occides."
      en: "Thou shalt not kill."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Non moechaberis."
      en: "Thou shalt not commit adultery."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Non furtum facies."
      en: "Thou shalt not steal."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Non loqueris contra proximum tuum falsum testimonium."
      en: "Thou shalt not bear false witness against thy neighbour."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Non concupisces domum proximi tui, nec desiderabis uxorem ejus, non servum, non ancillam, non bovem, non asinum, nec omnia quae illius sunt."
      en: "Thou shalt not covet thy neighbour's house: neither shalt thou desire his wife, nor his servant, nor his handmaid, nor his ox, nor his ass, nor any thing that is his."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Cunctus autem populus videbat voces et lampades, et sonitum buccinae, montemque fumantem: et perterriti ac pavore concussi, steterunt procul,"
      en: "And all the people saw the voices and the flames, and the sound of the trumpet, and the mount smoking: and being terrified and struck with fear, they stood afar off,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "dicentes Moysi: Loquere tu nobis, et audiemus: non loquatur nobis Dominus, ne forte moriamur."
      en: "Saying to Moses: Speak thou to us, and we will hear: let not the Lord speak to us, lest we die."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et ait Moyses ad populum: Nolite timere: ut enim probaret vos venit Deus, et ut terror illius esset in vobis, et non peccaretis."
      en: "And Moses said to the people: Fear not: for God is come to prove you, and that the dread of him might be in you, and you should not sin."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Stetitque populus de longe. Moyses autem accessit ad caliginem in qua erat Deus."
      en: "And the people stood afar off. But Moses went to the dark cloud wherein God was."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Dixit praeterea Dominus ad Moysen: Haec dices filiis Israel: Vos vidistis quod de caelo locutus sim vobis."
      en: "And the Lord said to Moses: Thus shalt thou say to the children of Israel: You have seen that I have spoken to you from heaven."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Non facietis deos argenteos, nec deos aureos facietis vobis."
      en: "You shall not make gods of silver, nor shall you make to yourselves gods of gold."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Altare de terra facietis mihi, et offeretis super eo holocausta et pacifica vestra, oves vestras et boves in omni loco in quo memoria fuerit nominis mei: veniam ad te, et benedicam tibi."
      en: "You shall make an altar of earth unto me, and you shall offer upon it your holocausts and peace offerings, your sheep and oxen, in every place where the memory of my name shall be: I will come to thee, and will bless thee."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Quod si altare lapideum feceris mihi, non aedificabis illud de sectis lapidibus: si enim levaveris cultrum super eo, polluetur."
      en: "And if thou make an altar of stone unto me, thou shalt not build it of hewn stones: for if thou lift up a tool upon it, it shall be defiled."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Non ascendes per gradus ad altare meum, ne reveletur turpitudo tua."
      en: "Thou shalt not go up by steps unto my altar, lest thy nakedness be discovered."
    status: { la: verified, en: verified }
