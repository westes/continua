# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: tit
chapter: 1
verses:
  - n: 1
    text:
      la: "Paulus servus Dei apostolus autem Iesu Christi secundum fidem electorum Dei et agnitionem veritatis quae secundum pietatem est"
      en: "Paul, a servant of God, and an apostle of Jesus Christ, according to the faith of the elect of God and the acknowledging of the truth, which is according to godliness:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in spem vitae aeternae quam promisit qui non mentitur Deus ante tempora saecularia"
      en: "Unto the hope of life everlasting, which God, who lieth not, hath promised before the times of the world:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "manifestavit autem temporibus suis verbum suum in praedicatione quae credita est mihi secundum praeceptum salvatoris nostri Dei"
      en: "But hath in due times manifested his word in preaching, which is committed to me according to the commandment of God our Savior:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Tito dilecto filio secundum communem fidem gratia et pax a Deo Patre et Christo Iesu salvatore nostro"
      en: "To Titus my beloved son, according to the common faith, grace and peace from God the Father, and from Christ Jesus our Savior."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "huius rei gratia reliqui te Cretae ut ea quae desunt corrigas et constituas per civitates presbyteros sicut ego tibi disposui"
      en: "For this cause I left thee in Crete, that thou shouldest set in order the things that are wanting, and shouldest ordain priests in every city, as I also appointed thee:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "si quis sine crimine est unius uxoris vir filios habens fideles non in accusatione luxuriae aut non subditos"
      en: "If any be without crime, the husband of one wife, having faithful children, not accused of riot, or unruly."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "oportet enim episcopum sine crimine esse sicut Dei dispensatorem non superbum non iracundum non vinolentum non percussorem non turpilucri cupidum"
      en: "For a bishop must be without crime, as the steward of God: not proud, not subject to anger, not given to wine, no striker, not greedy of filthy lucre:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sed hospitalem benignum sobrium iustum sanctum continentem"
      en: "But given to hospitality, gentle, sober, just, holy, continent:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "amplectentem eum qui secundum doctrinam est fidelem sermonem ut potens sit et exhortari in doctrina sana et eos qui contradicunt arguere"
      en: "Embracing that faithful word which is according to doctrine, that he may be able to exhort in sound doctrine, and to convince the gainsayers."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sunt enim multi et inoboedientes vaniloqui et seductores maxime qui de circumcisione sunt"
      en: "For there are also many disobedient, vain talkers, and seducers: especially they who are of the circumcision:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quos oportet redargui qui universas domos subvertunt docentes quae non oportet turpis lucri gratia"
      en: "Who must be reproved, who subvert whole houses, teaching things which they ought not, for filthy lucre's sake."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dixit quidam ex illis proprius ipsorum propheta Cretenses semper mendaces malae bestiae ventres pigri"
      en: "One of them a prophet of their own, said, The Cretians are always liars, evil beasts, slothful bellies."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "testimonium hoc verum est quam ob causam increpa illos dure ut sani sint in fide"
      en: "This testimony is true. Wherefore rebuke them sharply, that they may be sound in the faith;"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "non intendentes iudaicis fabulis et mandatis hominum aversantium se a veritate"
      en: "Not giving heed to Jewish fables and commandments of men, who turn themselves away from the truth."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "omnia munda mundis coinquinatis autem et infidelibus nihil mundum sed inquinatae sunt eorum et mens et conscientia"
      en: "All things are clean to the clean: but to them that are defiled, and to unbelievers, nothing is clean: but both their mind and their conscience are defiled."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "confitentur se nosse Deum factis autem negant cum sunt abominati et incredibiles et ad omne opus bonum reprobi"
      en: "They profess that they know God: but in their works they deny him; being abominable, and incredulous, and to every good work reprobate."
    status: { la: verified, en: verified }
