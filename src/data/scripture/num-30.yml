# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: num
chapter: 30
verses:
  - n: 1
    text:
      la: "narravitque Moses filiis Israhel omnia quae ei Dominus imperarat"
      en: "And Moses told the children of Israel all that the Lord had commanded him :"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et locutus est ad principes tribuum filiorum Israhel iste est sermo quem praecepit Dominus"
      en: "And he said to the princes of the tribes of the children of Israel: This is the word that the Lord hath commanded:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "si quis virorum votum Domino voverit aut se constrinxerit iuramento non faciet irritum verbum suum sed omne quod promisit implebit"
      en: "If any man make a vow to the Lord, or bind himself by an oath: he shall not make his word void but shall fulfil all that he promised."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "mulier si quippiam voverit et se constrinxerit iuramento quae est in domo patris sui et in aetate adhuc puellari si cognoverit pater votum quod pollicita est et iuramentum quo obligavit animam suam et tacuerit voti rea erit"
      en: "If a woman vow any thing, and bind herself by an oath, being in her father's house, and but yet a girl in age: if her father knew the vow that she hath promised, and the oath wherewith she hath bound her soul, and held his peace, she shall be bound by the vow:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quicquid pollicita est et iuravit opere conplebit"
      en: "Whatsoever she promised and swore, she shall fulfil in deed."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sin autem statim ut audierit contradixerit pater et vota et iuramenta eius irrita erunt nec obnoxia tenebitur sponsioni eo quod contradixerit pater"
      en: "But if her father, immediately as soon as he heard it, gainsaid it, both her vows and her oaths shall be void, neither shall she be bound to what she promised, because her father hath gainsaid it."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "si maritum habuerit et voverit aliquid et semel verbum de ore eius egrediens animam illius obligaverit iuramento"
      en: "If she have a husband, and shall vow any thing, and the word once going out of her mouth shall bind her soul by an oath:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quo die audierit vir et non contradixerit voti rea erit reddet quodcumque promiserat"
      en: "The day that her husband shall hear it, and not gainsay it, she shall be bound to the vow, and shall give whatsoever she promised."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sin autem audiens statim contradixerit et irritas fecerit pollicitationes eius verbaque quibus obstrinxerat animam suam propitius ei erit Dominus"
      en: "But if as soon as he heareth he gainsay it, and make her promises and the words wherewith she had bound her soul of no effect : the Lord will forgive her."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "vidua et repudiata quicquid voverint reddent"
      en: "The widow, and she that is divorced, shall fulfil whatsoever they vow."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "uxor in domo viri cum se voto constrinxerit et iuramento"
      en: "If the wife in the house of her husband, hath bound herself by vow and by oath,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "si audierit vir et tacuerit nec contradixerit sponsioni reddet quodcumque promiserat"
      en: "If her husband hear, and hold his peace, and doth not disallow the promise, she shall accomplish whatsoever she had promised."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sin autem extemplo contradixerit non tenebitur promissionis rea quia maritus contradixit et Dominus ei propitius erit"
      en: "But if forthwith he gainsay it, she shall not be bound by the promise: because her husband gainsaid it, and the Lord will be merciful to her."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "si voverit et iuramento se constrinxerit ut per ieiunium vel ceterarum rerum abstinentiam adfligat animam suam in arbitrio viri erit ut faciat sive non faciat"
      en: "If she vow and bind herself by oath, to afflict her soul by fasting, or abstinence from other things, it shall depend on the will of her husband, whether she shall do it, or not do it."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quod si audiens vir tacuerit et in alteram diem distulerit sententiam quicquid voverat atque promiserat reddet quia statim ut audivit tacuit"
      en: "But if the husband hearing it hold his peace, and defer the declaring his mind till another day: whatsoever she had vowed and promised, she shall fulfil: because immediately as he heard it, he held his peace."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sin autem contradixerit postquam rescivit portabit ipse iniquitatem eius"
      en: "But if he gainsay it after that he knew it, he shall bear her iniquity."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "istae sunt leges quas constituit Dominus Mosi inter virum et uxorem inter patrem et filiam quae in puellari adhuc aetate est vel quae manet in parentis domo"
      en: "These are the laws which the Lord appointed to Moses between the husband and the wife, between the father and the daughter that is as yet but a girl in age, or that abideth in her father's house."
    status: { la: verified, en: verified }
