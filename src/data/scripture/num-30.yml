# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 30
verses:
  - n: 1
    text:
      la: "Narravitque Moyses filiis Israel omnia quae ei Dominus imperarat."
      en: "And Moses told the children of Israel all that the Lord had commanded him:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et locutus est ad principes tribuum filiorum Israel: Iste est sermo quem praecepit Dominus:"
      en: "And he said to the princes of the tribes of the children of Israel: This is the word that the Lord hath commanded:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Si quis virorum votum Domino voverit, aut se constrinxerit juramento: non faciet irritum verbum suum, sed omne quod promisit, implebit."
      en: "If any man make a vow to the Lord, or bind himself by an oath: he shall not make his word void but shall fulfill all that he promised."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Mulier si quippiam voverit, et se constrinxerit juramento, quae est in domo patris sui, et in aetate adhuc puellari: si cognoverit pater votum quod pollicita est, et juramentum quo obligavit animam suam, et tacuerit, voti rea erit:"
      en: "If a woman vow any thing, and bind herself by an oath, being in her father's house, and but yet a girl in age: if her father knew the vow that she hath promised, and the oath wherewith she hath bound her soul, and held his peace, she shall be bound by the vow:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quidquid pollicita est, et juravit, opere complebit."
      en: "Whatsoever she promised and swore, she shall fulfill in deed."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Sin autem statim ut audierit, contradixerit pater: et vota et juramenta ejus irrita erunt, nec obnoxia tenebitur sponsioni, eo quod contradixerit pater."
      en: "But if her father, immediately as soon as he heard it, gainsaid it, both her vows and her oaths shall be void, neither shall she be bound to what she promised, because her father hath gainsaid it."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Si maritum habuerit, et voverit aliquid, et semel de ore ejus verbum egrediens animam ejus obligaverit juramento:"
      en: "If she have a husband, and shall vow any thing, and the word once going out of her mouth shall bind her soul by an oath:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quo die audierit vir, et non contradixerit, voti rea erit, reddetque quodcumque promiserat."
      en: "The day that her husband shall hear it, and not gainsay it, she shall be bound to the vow, and shall give whatsoever she promised."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sin autem audiens statim contradixerit, et irritas fecerit pollicitationes ejus, verbaque quibus obstrinxerat animam suam, propitius erit ei Dominus."
      en: "But if as soon as he heareth he gainsay it, and make her promises and the words wherewith she had bound her soul of no effect: the Lord will forgive her."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Vidua et repudiata quidquid voverint, reddent."
      en: "The widow, and she that is divorced, shall fulfill whatsoever they vow."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Uxor in domo viri cum se voto constrinxerit et juramento,"
      en: "If the wife in the house of her husband, hath bound herself by vow and by oath,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "si audierit vir, et tacuerit, nec contradixerit sponsioni, reddet quodcumque promiserat."
      en: "If her husband hear, and hold his peace, and doth not disallow the promise, she shall accomplish whatsoever she had promised."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sin autem extemplo contradixerit, non tenebitur promissionis rea: quia maritus contradixit, et Dominus ei propitius erit."
      en: "But if forthwith he gainsay it, she shall not be bound by the promise: because her husband gainsaid it, and the Lord will be merciful to her."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Si voverit, et juramento se constrinxerit, ut per jejunium, vel ceterarum rerum abstinentiam affligat animam suam, in arbitrio viri erit ut faciat, sive non faciat."
      en: "If she vow and bind herself by oath, to afflict her soul by fasting, or abstinence from other things, it shall depend on the will of her husband, whether she shall do it, or not do it."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quod si audiens vir tacuerit, et in alteram diem distulerit sententiam, quidquid voverat atque promiserat, reddet: quia statim ut audivit, tacuit."
      en: "But if the husband hearing it hold his peace, and defer the declaring his mind till another day: whatsoever she had vowed and promised, she shall fulfill: because immediately as he heard it, he held his peace."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sin autem contradixerit postquam rescivit, portabit ipse iniquitatem ejus."
      en: "But if he gainsay it after that he knew it, he shall bear her iniquity."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Istae sunt leges, quas constituit Dominus Moysi inter virum et uxorem, inter patrem et filiam, quae in puellari adhuc aetate est, vel quae manet in parentis domo."
      en: "These are the laws which the Lord appointed to Moses between the husband and the wife, between the father and the daughter that is as yet but a girl in age, or that abideth in her father's house."
    status: { la: verified, en: verified }
