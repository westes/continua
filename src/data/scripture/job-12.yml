# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 12
verses:
  - n: 1
    text:
      la: "respondens autem Iob dixit"
      en: "When Job answered, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ergo vos estis soli homines et vobiscum morietur sapientia"
      en: "Are you then men alone, and shall wisdom die with you?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et mihi est cor sicut et vobis nec inferior vestri sum quis enim haec quae nostis ignorat"
      en: "I also have a heart as well as you: for who is ignorant of these things, which you know?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui deridetur ab amico suo sicut ego invocabit Deum et exaudiet eum deridetur enim iusti simplicitas"
      en: "He that is mocked by his friends as I, shall call upon God and he will hear him: for the simplicity of the just man is laughed to scorn."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "lampas contempta apud cogitationes divitum parata ad tempus statutum"
      en: "The lamp despised in the thoughts of the rich, is ready for the time appointed."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "abundant tabernacula praedonum et audacter provocant Deum cum ipse dederit omnia in manibus eorum"
      en: "The tabernacles of robbers abound, and they provoke God boldly; whereas it is he that hath given all into their hands:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nimirum interroga iumenta et docebunt te et volatilia caeli et indicabunt tibi"
      en: "But ask now the beasts, and they shall teach thee: and the birds of the air, and they shall tell thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "loquere terrae et respondebit tibi et narrabunt pisces maris"
      en: "Speak to the earth, and it shall answer thee: and the fishes of the sea shall tell."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quis ignorat quod omnia haec manus Domini fecerit"
      en: "Who is ignorant that the hand of the Lord hath made all these things?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in cuius manu anima omnis viventis et spiritus universae carnis hominis"
      en: "In whose hand is the soul of every living thing, and the spirit of all flesh of man."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "nonne auris verba diiudicat et fauces comedentis saporem"
      en: "Doth not the ear discern words, and the palate of him that eateth, the taste?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "in antiquis est sapientia et in multo tempore prudentia"
      en: "In the ancient is wisdom, and in length of days prudence."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "apud ipsum est sapientia et fortitudo ipse habet consilium et intellegentiam"
      en: "With him is wisdom and strength, he hath counsel and understanding."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "si destruxerit nemo est qui aedificet et si incluserit hominem nullus est qui aperiat"
      en: "If he pull down, there is no man that can build up: if he shut up a. man, there is none that can open."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "si continuerit aquas omnia siccabuntur et si emiserit eas subvertent terram"
      en: "If he withhold the waters, all things shall be dried up: and if he send them out, they shall overturn the earth."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "apud ipsum est fortitudo et sapientia ipse novit et decipientem et eum qui decipitur"
      en: "With him is strength and wisdom: he knoweth both the deceiver, and him that is deceived."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "adducit consiliarios in stultum finem et iudices in stuporem"
      en: "He bringeth counsellors to a foolish end, and judges to insensibility."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "balteum regum dissolvit et praecingit fune renes eorum"
      en: "He looseth the belt of kings, and girdeth their loins with a cord."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ducit sacerdotes inglorios et optimates subplantat"
      en: "He leadeth away priests without glory, and overthroweth nobles."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "commutans labium veracium et doctrinam senum auferens"
      en: "He changeth the speech of the true speakers, and taketh away the doctrine of the aged."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "effundit despectionem super principes et eos qui oppressi fuerant relevans"
      en: "He poureth contempt upon princes, and relieveth them that were oppressed."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "qui revelat profunda de tenebris et producit in lucem umbram mortis"
      en: "He discovereth deep things out of darkness, and bringeth up to light the shadow of death."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "qui multiplicat gentes et perdet eas et subversas in integrum restituet"
      en: "He multiplieth nations, and destroyeth them, and restoreth them again after they were overthrown."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "qui inmutat cor principum populi terrae et decipit eos ut frustra incedant per invium"
      en: "He changeth the heart of the princes of the people of the earth, and deceiveth them that they walk in vain where there is no way."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "palpabunt quasi in tenebris et non in luce et errare eos faciet quasi ebrios"
      en: "They shall grope as in the dark, and not in the light, and he shall make them stagger like men that are drunk."
    status: { la: verified, en: verified }
