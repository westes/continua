book: 1reg
chapter: 11
verses:
  - n: 1
    text:
      la: "ascendit autem Naas Ammonites et pugnare coepit adversus Iabesgalaad dixeruntque omnes viri Iabes ad Naas habeto nos foederatos et serviemus tibi"
      en: "And it came to pass about a month after this that Naas, the Ammonite came up, and began to fight against Jabes Galaad. And all the men of Jabes said to Naas: Make a covenant with us, and we will serve thee."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et respondit ad eos Naas Ammonites in hoc feriam vobiscum foedus ut eruam omnium vestrum oculos dextros ponamque vos obprobrium in universo Israhel"
      en: "And Naas the Ammonite answered them: On this condition will I make a covenant with you, that I may pluck out all your right eyes, and make you a reproach in all Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dixerunt ad eum seniores Iabes concede nobis septem dies ut mittamus nuntios in universos terminos Israhel et si non fuerit qui defendat nos egrediemur ad te"
      en: "And the ancients of Jabes said to him: Allow us seven days, that we may send messengers to all the coasts of Israel: and if there be no one to defend us, we will come out to thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "venerunt ergo nuntii in Gabaath Saulis et locuti sunt verba audiente populo et levavit omnis populus vocem suam et flevit"
      en: "The messengers therefore came to Gabaa of Saul: and they spoke these words in the hearing of the people: and all the people lifted up their voices, and wept."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et ecce Saul veniebat sequens boves de agro et ait quid habet populus quod plorat et narraverunt ei verba virorum Iabes"
      en: "And behold Saul came, following oxen out of the field, and he said: What aileth the people that they weep? And they told him the words of the men of Jabes."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et insilivit spiritus Domini in Saul cum audisset verba haec et iratus est furor eius nimis"
      en: "And the spirit of the Lord came upon Saul, when he had heard these words, and his anger was exceedingly kindled."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et adsumens utrumque bovem concidit in frusta misitque in omnes terminos Israhel per manum nuntiorum dicens quicumque non exierit secutusque fuerit Saul et Samuhelem sic fiet bubus eius invasit ergo timor Domini populum et egressi sunt quasi vir unus"
      en: "And taking both the oxen, he cut them in pieces, and sent them into all the coasts of Israel by messengers, saying: Whosoever shall not come forth, and follow Saul and Samuel, so shall it be done to his oxen. And the fear of the Lord fell upon the people, and they went out as one man."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et recensuit eos in Bezec fueruntque filiorum Israhel trecenta milia virorum autem Iuda triginta milia"
      en: "And he numbered them in Bezec: and there were of the children of Israel three hundred thousand: and of the men of Juda thirty thousand."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dixerunt nuntiis qui venerant sic dicetis viris qui sunt in Iabesgalaad cras erit vobis salus cum incaluerit sol venerunt ergo nuntii et adnuntiaverunt viris Iabes qui laetati sunt"
      en: "And they said to the messengers that came: Thus shall you say to the men of Jabes Galaad: Tomorrow, when the sun shall be hot, you shall have relief. The messengers therefore came, and told the men of Jabes: and they were glad."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et dixerunt mane exibimus ad vos et facietis nobis omne quod placuerit vobis"
      en: "And they said: In the morning we will come out to you: and you shall do what you please with us."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et factum est cum venisset dies crastinus constituit Saul populum in tres partes et ingressus est media castra in vigilia matutina et percussit Ammon usque dum incalesceret dies reliqui autem dispersi sunt ita ut non relinquerentur in eis duo pariter"
      en: "And it came to pass, when the morrow was come that Saul put the people in three companies: and he came into the midst of the camp in the morning watch, and he slew the Ammonites until the day grew hot, and the rest were scattered, so that two of them were not left together."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et ait populus ad Samuhel quis est iste qui dixit Saul non regnabit super nos date viros et interficiemus eos"
      en: "And the people said to Samuel: Who is he that said: Shall Saul reign over us? Bring the men and we will kill them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et ait Saul non occidetur quisquam in die hac quia hodie fecit Dominus salutem in Israhel"
      en: "And Saul said: No man shall be killed this day, because the Lord this day hath wrought salvation in Israel:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "dixit autem Samuhel ad populum venite et eamus in Galgala et innovemus ibi regnum"
      en: "And Samuel said to the people: Come and let us go to Galgal, and let us renew the kingdom there."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et perrexit omnis populus in Galgala et fecerunt ibi regem Saul coram Domino in Galgala et immolaverunt ibi victimas pacificas coram Domino et laetatus est ibi Saul et cuncti viri Israhel nimis"
      en: "And all the people went to Galgal, and there they made Saul king before the Lord in Galgal, and they sacrificed there victims of peace before the Lord. And there Saul and all the men of Israel rejoiced exceedingly"
    status: { la: verified, en: verified }
