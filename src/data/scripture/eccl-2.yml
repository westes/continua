# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: eccl
chapter: 2
verses:
  - n: 1
    text:
      la: "dixi ego in corde meo vadam et affluam deliciis et fruar bonis et vidi quod hoc quoque esset vanitas"
      en: "I said in my heart: I will go, and abound with delights, and enjoy good things. And I saw that this also was vanity."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "risum reputavi errorem et gaudio dixi quid frustra deciperis"
      en: "Laughter I counted error: and to mirth I said: Why art thou vainly deceived?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cogitavi in corde meo abstrahere a vino carnem meam ut animum meum transferrem ad sapientiam devitaremque stultitiam donec viderem quid esset utile filiis hominum quod facto opus est sub sole numero dierum vitae suae"
      en: "I thought in my heart, to withdraw my flesh from wine, that I might turn my mind to wisdom, and might avoid folly, till I might see what was profitable for the children of men: and what they ought to do under the sun, all the days of their life."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "magnificavi opera mea aedificavi mihi domos plantavi vineas"
      en: "I made me great works, I built me houses, and planted vineyards,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "feci hortos et pomeria et consevi ea cuncti generis arboribus"
      en: "I made gardens, and orchards, and set them with trees of all kinds,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "extruxi mihi piscinas aquarum ut inrigarem silvam lignorum germinantium"
      en: "And I made me ponds of water, to water therewith the wood of the young trees,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "possedi servos et ancillas multamque familiam habui armenta quoque et magnos ovium greges ultra omnes qui fuerunt ante me in Hierusalem"
      en: "I got me menservants, and maidservants, and had a great family: and herds of oxen, and great flocks of sheep, above all that were before me in Jerusalem:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "coacervavi mihi argentum et aurum et substantias regum ac provinciarum feci mihi cantores et cantrices et delicias filiorum hominum scyphos et urceos in ministerio ad vina fundenda"
      en: "I heaped together for myself silver and gold, and the wealth of kings, and provinces: I made me singing men, and singing women, and the delights of the sons of men, cups and vessels to serve to pour out wine:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et supergressus sum opibus omnes qui fuerunt ante me in Hierusalem sapientia quoque perseveravit mecum"
      en: "And I surpassed in riches all that were before me in Jerusalem: my wisdom also remained with me."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et omnia quae desideraverunt oculi mei non negavi eis nec prohibui cor quin omni voluptate frueretur et oblectaret se in his quae paraveram et hanc ratus sum partem meam si uterer labore meo"
      en: "And whatsoever my eyes desired, I refused them not: and I withheld not my heart from enjoying every pleasure, and delighting itself in the things which I had prepared: and esteemed this my portion, to make use of my own labour."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cumque me convertissem ad universa opera quae fecerant manus meae et ad labores in quibus frustra sudaveram vidi in omnibus vanitatem et adflictionem animi et nihil permanere sub sole"
      en: "And when I turned myself to all the works which my hands had wrought, and to the labours wherein I had laboured in vain, I saw in all things vanity, and vexation of mind, and that nothing was lasting under the sun."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "transivi ad contemplandam sapientiam erroresque et stultitiam quid est inquam homo ut sequi possit regem factorem suum"
      en: "I passed further to behold wisdom, and errors and folly, (What is man, said I, that he can follow the King his maker?)"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et vidi quia tantum praecederet sapientia stultitiam quantum differt lux tenebris"
      en: "And I saw that wisdom excelled folly, as much as light differeth from darkness."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sapientis oculi in capite eius stultus in tenebris ambulat et didici quod unus utriusque esset interitus"
      en: "The eyes of a wise man are in his head: the fool walketh in darkness: and I learned that they were to die both alike."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et dixi in corde meo si unus et stulti et meus occasus erit quid mihi prodest quod maiorem sapientiae dedi operam locutusque cum mente mea animadverti quod hoc quoque esset vanitas"
      en: "And I said in my heart: If the death of the fool and mine shall be one, what doth it avail me, that I have applied myself more to the study of wisdom? And speaking with my own mind, I perceived that this also was vanity."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "non enim erit memoria sapientis similiter ut stulti in perpetuum et futura tempora oblivione cuncta pariter obruent moritur doctus similiter et indoctus"
      en: "For there shall be no remembrance of the wise no more than of the fool for ever, and the times to come shall cover all things together with oblivion: the learned dieth in like manner as the unlearned."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et idcirco taeduit me vitae meae videntem mala esse universa sub sole et cuncta vanitatem atque adflictionem spiritus"
      en: "And therefore I was weary of my life, when I saw that all things under the sun are evil, and all vanity and vexation of spirit."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "rursum detestatus sum omnem industriam meam quae sub sole studiosissime laboravi habiturus heredem post me"
      en: "Again I hated all my application wherewith I had earnestly laboured under the sun, being like to have an heir after me,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quem ignoro utrum sapiens an stultus futurus sit et dominabitur in laboribus meis quibus desudavi et sollicitus fui et est quicquam tam vanum"
      en: "Whom I know not whether he will be a wise man or a fool, and he shall have rule over all my labours with which I have laboured and been solicitous: and is there any thing so vain?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "unde cessavi renuntiavitque cor meum ultra laborare sub sole"
      en: "Wherefore I left off and my heart renounced labouring any more under the sun."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "nam cum alius laboret in sapientia et doctrina et sollicitudine homini otioso quaesita dimittit et hoc ergo vanitas et magnum malum"
      en: "For when a man laboureth in wisdom, and knowledge, and carefulness, he leaveth what he hath gotten to an idle man: so this also is vanity, and a great evil."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quid enim proderit homini de universo labore suo et adflictione spiritus qua sub sole cruciatus est"
      en: "For what profit shall a man have of all his labour, and vexation of spirit, with which he bath been tormented under the sun?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "cuncti dies eius doloribus et aerumnis pleni sunt nec per noctem mente requiescit et haec non vanitas est"
      en: "All his days axe full of sorrows and miseries, even in the night he doth not rest in mind: and is not this vanity?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "nonne melius est comedere et bibere et ostendere animae suae bona de laboribus suis et hoc de manu Dei est"
      en: "Is it not better to eat and drink, and to shew his soul good things of his labours? and this is from the hand of God."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quis ita vorabit et deliciis affluet ut ego"
      en: "Who shall so feast and abound with delights as I?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "homini bono in conspectu suo dedit Deus sapientiam et scientiam et laetitiam peccatori autem dedit adflictionem et curam superfluam ut addat et congreget et tradat ei qui placuit Deo sed et hoc vanitas et cassa sollicitudo mentis"
      en: "God hath given to a man that is good in his sight, wisdom, and knowledge, and joy: but to the sinner he hath given vexation, and superfluous care, to heap up and to gather together, and to give it to him that hath pleased God: but this also is vanity, and a fruitless solicitude of the mind."
    status: { la: verified, en: verified }
