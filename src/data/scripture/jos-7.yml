book: jos
chapter: 7
verses:
  - n: 1
    text:
      la: "filii autem Israhel praevaricati sunt mandatum et usurpaverunt de anathemate nam Achan filius Charmi filii Zabdi filii Zare de tribu Iuda tulit aliquid de anathemate iratusque est Dominus contra filios Israhel"
      en: "But the children of Israel transgressed the commandment, and took to their own use of the anathema. For Achan the son of Charmi, the son of Zabdi, the son of Zare of the tribe of Juda, took something of the anathema: and the Lord was angry against the children of Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "cumque mitteret Iosue de Hiericho viros contra Ahi quae est iuxta Bethaven ad orientalem plagam oppidi Bethel dixit eis ascendite et explorate terram qui praecepta conplentes exploraverunt Ahi"
      en: "And when Josue sent men from Jericho against Hai, which is beside Bethaven, on the east side of the town of Bethel, he said to them: Go up, and view the country: and they fulfilled his command, and viewed Hai."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et reversi dixerunt ei non ascendat omnis populus sed duo vel tria milia virorum pergant et deleant civitatem quare omnis populus frustra vexatur contra hostes paucissimos"
      en: "And returning they said to him: Let not all the people go up, but let two or three thousand men go and destroy the city: why should all the people be troubled in vain against enemies that are very few?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ascenderunt ergo tria milia pugnatores qui statim terga vertentes"
      en: "There went up therefore three thou- sand fighting men: who immediately turned their backs,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "percussi sunt a viris urbis Ahi et corruerunt ex eis triginta et sex homines persecutique sunt eos adversarii de porta usque Sabarim et ceciderunt per prona fugientes pertimuitque cor populi et instar aquae liquefactum est"
      en: "And were defeated by the men of the city of Hai, and there fell of them six and thirty men : and the enemies pursued them from the gate as far as Sabarim, and they slew them as they fled by the descent: and the heart of the people was struck with fear, and melted like water."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Iosue vero scidit vestimenta sua et cecidit pronus in terram coram arca Domini usque ad vesperum tam ipse quam omnes senes Israhel miseruntque pulverem super capita sua"
      en: "But Josue rent his garments, and fell flat on the ground before the ark of the Lord until the evening, both he and all the ancients of Israel: and they put dust upon their heads."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et dixit Iosue heu Domine Deus quid voluisti transducere populum istum Iordanem fluvium ut traderes nos in manus Amorrei et perderes utinam ut coepimus mansissemus trans Iordanem"
      en: "And Josue said: Alas, O Lord God, why wouldst thou bring this people over the river Jordan, to deliver us into the hand of the Amorrhite, and to destroy us? would God, we had stayed beyond the Jordan as we began."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "mi Domine Deus quid dicam videns Israhelem hostibus suis terga vertentem"
      en: "My Lord God, what shall I say, seeing Israel turning their backs to their enemies?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "audient Chananei et omnes habitatores terrae ac pariter conglobati circumdabunt nos atque delebunt nomen nostrum de terra et quid facies magno nomini tuo"
      en: "The Chanaanites, and all the inhabitants of the land will hear of it, and being gathered together will surround us and cut off our name from the earth: and what wilt thou do to thy great name?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dixitque Dominus ad Iosue surge cur iaces pronus in terra"
      en: "And the Lord said to Josue: Arise, why liest thou flat on the ground?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "peccavit Israhel et praevaricatus est pactum meum tuleruntque de anathemate et furati sunt atque mentiti et absconderunt inter vasa sua"
      en: "Israel hath sinned, and transgressed my covenant: and they have taken of the anathema, and have stolen and lied, and have hidden it among their goods."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nec poterit Israhel stare ante hostes suos eosque fugiet quia pollutus est anathemate non ero ultra vobiscum donec conteratis eum qui huius sceleris reus est"
      en: "Neither can Israel stand before his enemies, but he shall flee from them: because he is defiled with the anathema. I will be no more with you, till you destroy him that is guilty of this wickedness."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "surge sanctifica populum et dic eis sanctificamini in crastinum haec enim dicit Dominus Deus Israhel anathema in medio tui est Israhel non poteris stare coram hostibus tuis donec deleatur ex te qui hoc contaminatus est scelere"
      en: "Arise, sanctify the people, and say to them: Be ye sanctified against to morrow: for thus saith the Lord God of Israel: The anathema is in the midst of thee, O Israel: thou canst not stand before thy enemies, till he be destroyed out of thee that is defiled with this wickedness."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "accedetisque mane singuli per tribus vestras et quamcumque tribum sors invenerit accedet per cognationes suas et cognatio per domos domusque per viros"
      en: "And you shall come in the morning every one by your tribes: and what tribe soever the lot shall find, it shall come by its kindreds and the kindred by its houses, and the house by the men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et quicumque ille in hoc facinore fuerit deprehensus conburetur igni cum omni substantia sua quoniam praevaricatus est pactum Domini et fecit nefas in Israhel"
      en: "And whosoever he be that shall be found guilty of this fact, he shall be burnt with fire with all his substance, because he hath transgressed the covenant of the Lord, and hath done wickedness in Israel."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "surgens itaque Iosue mane adplicavit Israhel per tribus suas et inventa est tribus Iuda"
      en: "Josue, therefore, when he rose in the morning, made Israel to come by their tribes, and the tribe of Juda was found,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quae cum iuxta familias suas esset oblata inventa est familia Zarai illam quoque per viros offerens repperit Zabdi"
      en: "Which being brought by its families, it was found to be the family of Zare. Bringing that also by the houses, he found it to be Zabdi."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cuius domum in singulos dividens viros invenit Achan filium Charmi filii Zabdi filii Zare de tribu Iuda"
      en: "And bringing his house man by man, he found Achan the son of Charmi, the son of Zabdi, the son of Zare of the tribe of Juda."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et ait ad Achan fili mi da gloriam Domino Deo Israhel et confitere atque indica mihi quid feceris ne abscondas"
      en: "And Josue said to Achan: My son, give glory to the Lord God of Israel, and confess, and tell me what thou hast done, hide it not."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "responditque Achan Iosue et dixit ei vere ego peccavi Domino Deo Israhel et sic et sic feci"
      en: "And Achan answered Josue, and said to him: Indeed I have sinned against the Lord the God of Israel, and thus and thus have I done."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "vidi enim inter spolia pallium coccineum valde bonum et ducentos siclos argenti regulamque auream quinquaginta siclorum et concupiscens abstuli et abscondi in terra contra medium tabernaculi mei argentumque fossa humo operui"
      en: "For I saw among the spoils a scarlet garment exceeding good, and two hundred sides of silver, and a golden rule of fifty sides: and I coveted them, and I took them away, and hid them in the ground is the midst of my tent, and the silver I covered with the earth that I dug up."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "misit ergo Iosue ministros qui currentes ad tabernaculum illius reppererunt cuncta abscondita in eodem loco et argentum simul"
      en: "Josue therefore sent ministers: who running to his tent, found all hidden in the same place, together with the silver."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "auferentesque de tentorio tulerunt ea ad Iosue et ad omnes filios Israhel proieceruntque ante Dominum"
      en: "And taking them away out of the tent, they brought them to Josue, and to all the children of Israel, and threw them down before the Lord."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "tollens itaque Iosue Achan filium Zare argentumque et pallium et auream regulam filiosque eius et filias boves et asinos et oves ipsumque tabernaculum et cunctam supellectilem et omnis Israhel cum eo duxerunt eos ad vallem Achor"
      en: "Then Josue and all Israel with him took Achan the son of Zare, and the silver and the garments, and the golden rule, his sons also and his daughters, his oxen and asses and sheep, the tent also, and all the goods: and brought them to the valley of Achor:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ubi dixit Iosue quia turbasti nos exturbet te Dominus in die hac lapidavitque eum omnis Israhel et cuncta quae illius erant igne consumpta sunt"
      en: "Where Josue said: Because thou hast troubled us, the Lord trouble thee this day. And all Israel stoned him: and all things that were his, were consumed with fire."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "congregaverunt quoque super eum acervum magnum lapidum qui permanet usque in praesentem diem et aversus est furor Domini ab eis vocatumque est nomen loci illius vallis Achor usque hodie"
      en: "And they gathered together upon him a great heap of stones, which remaineth until this present day. And the wrath of the Lord was turned away from them. And the name of that place was called the Valley of Achor, until this day."
    status: { la: verified, en: verified }
