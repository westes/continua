# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jdth
chapter: 3
verses:
  - n: 1
    text:
      la: "Tunc miserunt legatos suos universarum urbium, ac provinciarum reges ac principes, Syriae scilicet Mesopotamiae, et Syriae Sobal, et Libyae, atque Ciliciae, qui venientes ad Holofernem, dixerunt:"
      en: "Then the kings and the princes of all the cities and provinces, of Syria, Mesopotamia, and Syria Sobal, and Libya, and Cilicia sent their ambassadors, who coming to Holofernes, said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Desinat indignatio tua circa nos: melius est enim ut viventes serviamus Nabuchodonosor regi magno, et subditi simus tibi, quam morientes cum interitu nostro ipsi servitutis nostrae damna patiamur."
      en: "Let thy indignation towards us cease: for it is better for us to live and serve Nabuchodonosor the great king, and be subject to thee, than to die and to perish, or suffer the miseries of slavery."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Omnis civitas nostra, omnisque possessio, omnes montes, et colles, et campi, et armenta boum, gregesque ovium, et caprarum, equorumque et camelorum, et universae facultates nostrae, atque familiae, in conspectu tuo sunt:"
      en: "All our cities and our possessions, all mountains and hills, and fields, and herds of oxen, and flocks of sheep, and goats, and horses, and camels, and all our goods, and families are in thy sight:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sint omnia nostra sub lege tua."
      en: "Let all we have be subject to thy law."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Nos, et filii nostri, servi tui sumus."
      en: "Both we and our children are thy servants."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Veni nobis pacificus dominus, et utere servitio nostro, sicut placuerit tibi."
      en: "Come to us a peaceable lord, and use our service as it shall please thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Tunc descendit de montibus cum equitibus in virtute magna, et obtinuit omnem civitatem, et omnem inhabitantem terram."
      en: "Then he came down from the mountains with horsemen, in great power, and made himself master of every city, and all the inhabitants of the land."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "De universis autem urbibus assumpsit sibi auxiliarios viros fortes, et electos ad bellum."
      en: "And from all the cities he took auxiliaries valiant men, and chosen for war."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Tantusque metus provinciis illis incubuit, ut universarum urbium habitatores principes, et honorati simul cum populis exirent obviam venienti,"
      en: "And so great a fear lay upon all those provinces, that the inhabitants of all the cities, both princes and nobles, as well as the people, went out to meet him at his coming."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "excipientes eum cum coronis, et lampadibus, ducentes choros in tympanis, et tibiis."
      en: "And received him with garlands, and lights, and dances, and timbrels, and flutes."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Nec ista tamen facientes, ferocitatem ejus pectoris mitigare potuerunt:"
      en: "And though they did these things, they could not for all that mitigate the fierceness of his heart:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nam et civitates eorum destruxit, et lucos eorum excidit."
      en: "For he both destroyed their cities and cut down their groves."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Praeceperat enim illi Nabuchodonosor rex, ut omnes deos terrae exterminaret, videlicet ut ipse solus diceretur deus ab his nationibus, quae potuissent Holofernis potentia subjugari."
      en: "For Nabuchodonosor the king had commanded him to destroy all the gods of the earth, that he only might be called God by those nations which could be brought under him by the power of Holofernes."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Pertransiens autem Syriam Sobal, et omnem Apameam, omnemque Mesopotamiam, venit ad Idumaeos in terram Gabaa,"
      en: "And when he had passed through all Syria Sobal, and all Apamea, and all Mesopotamia, he came to the Idumeans into the land of Gabaa,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "accepitque civitates eorum, et sedit ibi per triginta dies, in quibus diebus adunari praecepit universum exercitum virtutis suae."
      en: "And he took possession of their cities, and stayed there for thirty days, in which days he commanded all the troops of his army to be united."
    status: { la: verified, en: verified }
