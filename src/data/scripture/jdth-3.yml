# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdth
chapter: 3
verses:
  - n: 1
    text:
      la: "tunc miserunt legatos suos universarum urbium et provinciarum reges ac principes Syriae scilicet Mesopotamiae et Syriae Sobal et Lybiae atque Ciliciae qui venientes ad Holofernem dixerunt"
      en: "Then the kings and the princes of all the cities and provinces, of Syria, Mesopotamia, and Syria Sobal, and Libya, and Cilicia sent their ambassadors, who coming to Holofernes, said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "desinat indignatio tua circa nos melius est enim ut viventes serviamus Nabuchodonosor regi magno et subditi simus tibi quam morientes cum interitu nostro ipsi servitutis nostrae damna patiamini"
      en: "Let thy indignation towards us cease: for it is better for us to live and serve Nabuchodonosor the great king, and be subject to thee, than to die and to perish, or suffer the miseries of slavery."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "omnis civitas nostra omnisque possessio omnes colles et montes et campi armenta boum greges ovium caprarumque equorum camelorumque et universae facultates nostrae atque familiae in conspectu tuo sunt"
      en: "All our cities and our possessions, all mountains and hills, and fields, and herds of oxen, and flocks of cheep, and goats, and horses, and camels, and all our goods, and families are in thy sight:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sint omnia sub lege tua"
      en: "Let all we have be subject to thy law."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "nos iam et filii nostri servi tui sumus"
      en: "Both we and our children are thy servants."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "veni nobis pacificus dominus et utere servitia nostra sicut placuerit tibi"
      en: "Come to us a peaceable lord, and use our service as it shall please thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "tunc descendit de montibus cum equitibus in virtute magna et obtinuit omnem civitatem et omnem inhabitantem terram"
      en: "Then he came down from the mountains with horsemen, in great power, and made himself master of every city, and all the inhabitants of the land."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "de universis autem urbibus adsumpsit sibi auxiliarios viros fortes et electos ad bellum"
      en: "And from all the cities he took auxiliaries valiant men, and chosen for war."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "tantusque metus provinciis illius incubuit ut universarum urbium habitatores principes et honorati simul cum populis exirent in obviam venienti"
      en: "And so great a fear lay upon all those provinces, that the inhabitants of all the cities, both princes and nobles, as well as the people, went out to meet him at his coming."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "excipientes eum cum coronis et lampadibus ducentes choros in tibiis et tympanis"
      en: "And received him with garlands, and lights, and dances, and tumbrels, and flutes."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "nec ista tamen facientes ferocitatem eius pectoris mitigare potuerunt"
      en: "And though they did these things, they could not for all that mitigate the fierceness of his heart:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nam et civitates eorum destruxit et lucos eorum excidit"
      en: "For he both destroyed their cities and cut down their groves."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "praeceperat enim illi Nabuchodonosor rex ut omnes deos terrae exterminaret videlicet ut ipse solus diceretur deus ab his nationibus quae potuissent Holofernis potentia subiugari"
      en: "For Nabuchodonosor the king had commanded him to destroy all the gods of the earth, that he only might be called God by those nations which could be brought under him by the power of Holofernes."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "pertransiens autem Syriam Subal et omnem Apamiam omnemque Mesopotamiam venit ad Idumeos in terra Gabaa"
      en: "And when he had passed through all Syria Sobal, and all Apamea, and all Mesopotamia, he came to the Idumeans into the land of Gabaa,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "accepitque civitates eorum et sedit ibi per triginta dies in quibus diebus adunari praecepit universum exercitum virtutis suae"
      en: "And he took possession of their cities, and stayed there for thirty days, in which days he commanded all the troops of his army to be united."
    status: { la: verified, en: verified }
