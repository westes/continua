# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2reg
chapter: 24
verses:
  - n: 1
    text:
      la: "et addidit furor Domini irasci contra Israhel commovitque David in eis dicentem vade numera Israhel et Iudam"
      en: "And the anger of the Lord was again kindled against Israel, and stirred up David among them, saying: Go, number Israel and Juda."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixitque rex ad Ioab principem exercitus sui perambula omnes tribus Israhel a Dan usque Bersabee et numerate populum ut sciam numerum eius"
      en: "And the king said to Joab the general of his army: Go through all the tribes of Israel from Dan to Bersabee, and number ye the people that I may know the number of them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixitque Ioab regi adaugeat Dominus Deus tuus ad populum quantus nunc est iterumque centuplicet in conspectu domini mei regis sed quid sibi dominus meus rex vult in re huiuscemodi"
      en: "And Joab said to the king: The Lord thy God increase thy people, and make them as many more as they are now, and again multiply them a hundredfold in the sight of my lord the king: but what meaneth my lord the king by this kind of thing?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "obtinuit autem sermo regis verba Ioab et principum exercitus egressusque est Ioab et principes militum a facie regis ut numerarent populum Israhel"
      en: "But the king's words prevailed over the words of Joab, and of the captains of the army: and Joab, and the captains of the soldiers went out from the presence of the king, to number the people of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cumque pertransissent Iordanem venerunt in Aroer ad dextram urbis quae est in valle Gad"
      en: "And when they had passed the Jordan, they came to Aroer to the right side of the city, which is in the vale of Gad."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et per Iazer transierunt in Galaad et in terram inferiorem Hodsi et venerunt in Dan silvestria circumeuntesque iuxta Sidonem"
      en: "And by Jazer they passed into Galaad, and to the lower land of Hodsi, and they came into the woodlands of Dan. And going about by Sidon,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "transierunt propter moenia Tyri et omnem terram Hevei et Chananei veneruntque ad meridiem Iuda in Bersabee"
      en: "They passed near the walls of Tyre, and all the land of the Hevite, and the Chanaanite, and they came to the south of Juda into Bersabee:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et lustrata universa terra adfuerunt post novem menses et viginti dies in Hierusalem"
      en: "And having gone through the whole land, after nine months and twenty days, they came to Jerusalem."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dedit ergo Ioab numerum descriptionis populi regi et inventa sunt de Israhel octingenta milia virorum fortium qui educerent gladium et de Iuda quingenta milia pugnatorum"
      en: "And Joab gave up the sum of the number of the people to the king, and there were found of Israel eight hundred thousand valiant men that drew the sword: and of Juda five hundred thousand fighting men."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "percussit autem cor David eum postquam numeratus est populus et dixit David ad Dominum peccavi valde in hoc facto sed precor Domine ut transferas iniquitatem servi tui quia stulte egi nimis"
      en: "But David's heart struck him, after the people were numbered: and David said to the Lord: I have sinned very much in what I have done: but I pray thee, O Lord, to take away the iniquity of thy servant, because I have done exceeding foolishly."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "surrexit itaque David mane et sermo Domini factus est ad Gad propheten et videntem David dicens"
      en: "And David arose in the morning, and the word of the Lord came to Gad the prophet and the seer of David, saying:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "vade et loquere ad David haec dicit Dominus trium tibi datur optio elige unum quod volueris ex his ut faciam tibi"
      en: "Go, and say to David: Thus saith the Lord: I give thee thy choice of three things, choose one of them which thou wilt, that I may do it to thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cumque venisset Gad ad David nuntiavit ei dicens aut septem annis veniet tibi fames in terra tua aut tribus mensibus fugies adversarios tuos et illi persequentur aut certe tribus diebus erit pestilentia in terra tua nunc ergo delibera et vide quem respondeam ei qui me misit sermonem"
      en: "And when Gad was come to David, he told him, saying: Either seven years of famine shall come to thee in thy land: or thou shalt flee three months before thy adversaries, and they shall pursue thee: or for three days there shall be a pestilence in thy land. Now therefore deliberate, and see what answer I shall return to him that sent me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "dixit autem David ad Gad artor nimis sed melius est ut incidam in manu Domini multae enim misericordiae eius sunt quam in manu hominis"
      en: "And David said to Gad: I am in a great strait: but it is better that I should fall into the hands of the Lord (for his mercies are many) than into the hands of men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "inmisitque Dominus pestilentiam in Israhel de mane usque ad tempus constitutum et mortui sunt ex populo a Dan usque Bersabee septuaginta milia virorum"
      en: "And the Lord sent a pestilence upon Israel, from the morning unto the time appointed, and there died of the people from Dan to Bersabee seventy thousand men."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cumque extendisset manum angelus Dei super Hierusalem ut disperderet eam misertus est Dominus super adflictione et ait angelo percutienti populum sufficit nunc contine manum tuam erat autem angelus Domini iuxta aream Areuna Iebusei"
      en: "And when the angel of the Lord had stretched out his hand over Jerusalem to destroy it, the Lord had pity on the affliction, and said to the angel that slew the people: It is enough: now hold thy hand. And the angel of the Lord was by the thrashingfloor of Areuna the Jebusite."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dixitque David ad Dominum cum vidisset angelum caedentem populum ego sum qui peccavi ego inique egi isti qui oves sunt quid fecerunt vertatur obsecro manus tua contra me et contra domum patris mei"
      en: "And David said to the Lord, when he saw the angel striking the people: It is I; I am he that have sinned, I have done wickedly: these that are the sheep, what have they done? let thy hand, I beseech thee, be turned against me, and against my father's house."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "venit autem Gad ad David in die illa et dixit ei ascende constitue Domino altare in area Areuna Iebusei"
      en: "And Gad came to David that day, and said: Go up, and build an altar to the Lord in the thrashingfloor of Areuna the Jebusite."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et ascendit David iuxta sermonem Gad quem praeceperat ei Dominus"
      en: "And David went up according to the word of Gad which the Lord had commanded him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "conspiciensque Areuna animadvertit regem et servos eius transire ad se"
      en: "And Areuna looked, and saw the king and his servants coming towards him:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et egressus adoravit regem prono vultu in terra et ait quid causae est ut veniat dominus meus rex ad servum suum cui David ait ut emam a te aream et aedificem altare Domino et cesset interfectio quae grassatur in populo"
      en: "An going out he worshipped the king, bowing with his face to the earth, and said: Wherefore is my lord the king come to his servant? Arid David said to him: To buy the thrashingfloor of thee, and build an altar to the Lord, that the plague, which rageth among the people, may cease."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et ait Areuna ad David accipiat et offerat dominus meus rex sicut ei placet habes boves in holocaustum et plaustrum et iuga boum in usum lignorum"
      en: "And Areuna said to David: Let my lord the king take, and offer, as it seemeth good to him: thou hast here oxen for a holocaust, and the wain, and the yokes of the oxen for wood."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "omnia dedit Areuna rex regi dixitque Areuna ad regem Dominus Deus tuus suscipiat votum tuum"
      en: "All these things Areuna as a king gave to the king: and Areuna said to the king: The Lord thy God receive thy vow."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "cui respondens rex ait nequaquam ut vis sed emam pretio a te et non offeram Domino Deo meo holocausta gratuita emit ergo David aream et boves argenti siclis quinquaginta"
      en: "And the king answered him, and said: Nay, but I will buy it of thee at a price, and I will not offer to the Lord my God holocausts free cost. So David bought the floor, and the oxen, for fifty sicles of silver:"
    status: { la: verified, en: verified }
