# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 2
verses:
  - n: 1
    text:
      la: "verbum quod vidit Isaias filius Amos super Iudam et Hierusalem"
      en: "The word that Isaias the son of Amos saw, concerning Juda and Jerusalem."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et erit in novissimis diebus praeparatus mons domus Domini in vertice montium et elevabitur super colles et fluent ad eum omnes gentes"
      en: "And in the last days the mountain of the house of the Lord shall be prepared on the top of mountains, and it shall be exalted above the hills, and all nations shall flow unto it."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ibunt populi multi et dicent venite et ascendamus ad montem Domini et ad domum Dei Iacob et docebit nos vias suas et ambulabimus in semitis eius quia de Sion exibit lex et verbum Domini de Hierusalem"
      en: "And many people shall go, and say: Come and let us go up to the mountain of the Lord, and to the house of the God of Jacob, and he will teach us his ways, and we will walk in his paths: for the law shall come forth from Sion, and the word of the Lord from Jerusalem."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et iudicabit gentes et arguet populos multos et conflabunt gladios suos in vomeres et lanceas suas in falces non levabit gens contra gentem gladium nec exercebuntur ultra ad proelium"
      en: "And he shall judge the Gentiles, and rebuke many people: and they shall turn their swords into ploughshares, and their spears into sickles: nation shall not lift up sword against nation, neither shall they be exercised any more to war."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "domus Iacob venite et ambulemus in lumine Domini"
      en: "O house of Jacob, come ye, and let us walk in the light of the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "proiecisti enim populum tuum domum Iacob quia repleti sunt ut olim et augures habuerunt ut Philisthim et pueris alienis adheserunt"
      en: "For thou hast cast off thy people, the house of Jacob: because they are filled as in times past, and have had soothsayers as the Philistines, and have adhered to strange children."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "repleta est terra argento et auro et non est finis thesaurorum eius"
      en: "Their land is filled with silver and gold: and there is no end of their treasures."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et repleta est terra eius equis et innumerabiles quadrigae eius et repleta est terra eius idolis opus manuum suarum adoraverunt quod fecerunt digiti eorum"
      en: "And their land is filled with horses: and their chariots are innumerable. Their land also is full of idols: they have adored the work of their own hands, which their own fingers have made."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et incurvavit se homo et humiliatus est vir ne ergo dimittas eis"
      en: "And man hath bowed himself down, and man hath been debased: therefore forgive them not."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ingredere in petram abscondere fossa humo a facie timoris Domini et a gloria maiestatis eius"
      en: "Enter thou into the rock, and hide thee in the pit from the face of the fear of the Lord, and from the glory of his majesty."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "oculi sublimis hominis humiliati sunt et incurvabitur altitudo virorum exaltabitur autem Dominus solus in die illa"
      en: "The lofty eyes of man are humbled, and the haughtiness of men shall be made to stoop: and the Lord alone shall be exalted in that day."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quia dies Domini exercituum super omnem superbum et excelsum et super omnem arrogantem et humiliabitur"
      en: "Because the day of the Lord of hosts shall be upon every one that is proud and highminded, and upon every one that is arrogant, and he shall be humbled."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et super omnes cedros Libani sublimes et erectas et super omnes quercus Basan"
      en: "And upon all the tall and lofty cedars of Libanus, and upon all the oaks of Basan."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et super omnes montes excelsos et super omnes colles elevatos"
      en: "And upon all the high mountains, and upon all the elevated hills."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et super omnem turrem excelsam et super omnem murum munitum"
      en: "And upon every high tower, and every fenced wall."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et super omnes naves Tharsis et super omne quod visu pulchrum est"
      en: "And upon all the ships of Tharsis, and upon all that is fair to behold."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et incurvabitur sublimitas hominum et humiliabitur altitudo virorum et elevabitur Dominus solus in die illa"
      en: "And the loftiness of men shall be bowed down, and the haughtiness of men shall be humbled, and the Lord alone shall be exalted in that day."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et idola penitus conterentur"
      en: "And idols shall be utterly destroyed."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et introibunt in speluncas petrarum et in voragines terrae a facie formidinis Domini et a gloria maiestatis eius cum surrexerit percutere terram"
      en: "And they shall go into the holes of rocks, and into the caves of the earth from the face of the fear of the Lord, and from the glory of his majesty, when he shall rise up to strike the earth."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "in die illa proiciet homo idola argenti sui et simulacra auri sui quae fecerat sibi ut adoraret talpas et vespertiliones"
      en: "In that day a man shall cast away his idols of silver, and his idols of gold, which he had made for himself to adore, moles and bats."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et ingredietur fissuras petrarum et cavernas saxorum a facie formidinis Domini et a gloria maiestatis eius cum surrexerit percutere terram"
      en: "And he shall go into the clefts of rocks, and into the holes of stones from the face of the fear of the Lord, and from the glory of his majesty, when he shall rise up to strike the earth."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quiescite ergo ab homine cuius spiritus in naribus eius quia excelsus reputatus est ipse"
      en: "Cease ye therefore from the man, whose breath is in his nostrils, for he is reputed high."
    status: { la: verified, en: verified }
