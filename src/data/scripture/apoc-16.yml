# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: apoc
chapter: 16
verses:
  - n: 1
    text:
      la: "Et audivi vocem magnam de templo, dicentem septem angelis: Ite, et effundite septem phialas irae Dei in terram."
      en: "And I heard a great voice out of the temple, saying to the seven angels: Go, and pour out the seven vials of the wrath of God upon the earth."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et abiit primus, et effudit phialam suam in terram, et factum est vulnus saevum et pessimum in homines, qui habebant caracterem bestiae, et in eos qui adoraverunt imaginem ejus."
      en: "And the first went, and poured out his vial upon the earth, and there fell a sore and grievous wound upon men, who had the character of the beast; and upon them that adored the image thereof."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et secundus angelus effudit phialam suam in mare, et factus est sanguis tamquam mortui: et omnis anima vivens mortua est in mari."
      en: "And the second angel poured out his vial upon the sea, and there came blood as it were of a dead man; and every living soul died in the sea."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et tertius effudit phialam suam super flumina, et super fontes aquarum, et factus est sanguis."
      en: "And the third poured out his vial upon the rivers and the fountains of waters; and there was made blood."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et audivi angelum aquarum dicentem: Justus es, Domine, qui es, et qui eras sanctus, qui haec judicasti:"
      en: "And I heard the angel of the waters saying: Thou art just, O Lord, who art, and who wast, the Holy One, because thou hast judged these things:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quia sanguinem sanctorum et prophetarum effuderunt, et sanguinem eis dedisti bibere: digni enim sunt."
      en: "For they have shed the blood of saints and prophets, and thou hast given them blood to drink; for they are worthy."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et audivi alterum ab altari dicentem: Etiam Domine Deus omnipotens, vera et justa judicia tua."
      en: "And I heard another, from the altar, saying: Yea, O Lord God Almighty, true and just are thy judgments."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et quartus angelus effudit phialam suam in solem, et datum est illi aestu affligere homines, et igni:"
      en: "And the fourth angel poured out his vial upon the sun, and it was given unto him to afflict men with heat and fire:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et aestuaverunt homines aestu magno, et blasphemaverunt nomen Dei habentis potestatem super has plagas, neque egerunt poenitentiam ut darent illi gloriam."
      en: "And men were scorched with great heat, and they blasphemed the name of God, who hath power over these plagues, neither did they penance to give him glory."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et quintus angelus effudit phialam suam super sedem bestiae: et factum est regnum ejus tenebrosum, et commanducaverunt linguas suas prae dolore:"
      en: "And the fifth angel poured out his vial upon the seat of the beast; and his kingdom became dark, and they gnawed their tongues for pain:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et blasphemaverunt Deum caeli prae doloribus, et vulneribus suis, et non egerunt poenitentiam ex operibus suis."
      en: "And they blasphemed the God of heaven, because of their pains and wounds, and did not penance for their works."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et sextus angelus effudit phialam suam in flumen illud magnum Euphraten: et siccavit aquam ejus, ut praepararetur via regibus ab ortu solis."
      en: "And the sixth angel poured out his vial upon that great river Euphrates; and dried up the water thereof, that a way might be prepared for the kings from the rising of the sun."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et vidi de ore draconis, et de ore bestiae, et de ore pseudoprophetae spiritus tres immundos in modum ranarum."
      en: "And I saw from the mouth of the dragon, and from the mouth of the beast, and from the mouth of the false prophet, three unclean spirits like frogs."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sunt enim spiritus daemoniorum facientes signa, et procedunt ad reges totius terrae congregare illos in praelium ad diem magnum omnipotentis Dei."
      en: "For they are the spirits of devils working signs, and they go forth unto the kings of the whole earth, to gather them to battle against the great day of the Almighty God."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ecce venio sicut fur. Beatus qui vigilat, et custodit vestimenta sua, ne nudus ambulet, et videant turpitudinem ejus."
      en: "Behold, I come as a thief. Blessed is he that watcheth, and keepeth his garments, lest he walk naked, and they see his shame."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et congregabit illos in locum qui vocatur hebraice Armagedon."
      en: "And he shall gather them together into a place, which in Hebrew is called Armagedon."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et septimus angelus effudit phialam suam in aerem, et exivit vox magna de templo a throno, dicens: Factum est."
      en: "And the seventh angel poured out his vial upon the air, and there came a great voice out of the temple from the throne, saying: It is done."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et facta sunt fulgura, et voces, et tonitrua, et terraemotus factus est magnus, qualis numquam fuit ex quo homines fuerunt super terram: talis terraemotus, sic magnus."
      en: "And there were lightnings, and voices, and thunders, and there was a great earthquake, such an one as never had been since men were upon the earth, such an earthquake, so great."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et facta est civitas magna in tres partes: et civitates gentium ceciderunt. Et Babylon magna venit in memoriam ante Deum, dare illi calicem vini indignationis irae ejus."
      en: "And the great city was divided into three parts; and the cities of the Gentiles fell. And great Babylon came in remembrance before God, to give her the cup of the wine of the indignation of his wrath."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et omnis insula fugit, et montes non sunt inventi."
      en: "And every island fled away, and the mountains were not found."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et grando magna sicut talentum descendit de caelo in homines: et blasphemaverunt Deum homines propter plagam grandinis: quoniam magna facta est vehementer."
      en: "And great hail, like a talent, came down from heaven upon men: and men blasphemed God for the plague of the hail: because it was exceeding great."
    status: { la: verified, en: verified }
