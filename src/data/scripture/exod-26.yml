# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 26
verses:
  - n: 1
    text:
      la: "Tabernaculum vero ita facies: decem cortinas de bysso retorta, et hyacintho, ac purpura, coccoque bis tincto, variatas opere plumario facies."
      en: "And thou shalt make the tabernacle in this manner: Thou shalt make ten curtains of fine twisted linen, and violet and purple, and scarlet twice dyed, diversified with embroidery."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Longitudo cortinae unius habebit viginti octo cubitos: latitudo, quatuor cubitorum erit. Unius mensurae fient universa tentoria."
      en: "The length of one curtain shall be twenty-eight cubits, the breadth shall be four cubits. All the curtains shall be of one measure."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quinque cortinae sibi jungentur mutuo, et aliae quinque nexu simili cohaerebunt."
      en: "Five curtains shall be joined one to another, and the other five shall be coupled together in like manner."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ansulas hyacinthinas in lateribus ac summitatibus facies cortinarum, ut possint invicem copulari."
      en: "Thou shalt make loops of violet in the sides and tops of the curtains, that they may be joined one to another."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quinquagenas ansulas cortina habebit in utraque parte, ita insertas ut ansa contra ansam veniat, et altera alteri possit aptari."
      en: "Every curtain shall have fifty loops on both sides, so set on, that one loop may be against another loop, and one may be fitted to the other."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Facies et quinquaginta circulos aureos quibus cortinarum vela jungenda sunt, ut unum tabernaculum fiat."
      en: "Thou shalt make also fifty rings of gold wherewith the veils of the curtains are to be joined, that it may be made one tabernacle."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Facies et saga cilicina undecim, ad operiendum tectum tabernaculi."
      en: "Thou shalt make also eleven curtains of goats' hair, to cover the top of the tabernacle."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Longitudo sagi unius habebit triginta cubitos, et latitudo, quatuor: aequa erit mensura sagorum omnium."
      en: "The length of one hair curtain shall be thirty cubits: and the breadth four: the measure of all the curtains shall be equal."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "E quibus quinque junges seorsum, et sex sibi mutuo copulabis, ita ut sextum sagum in fronte tecti duplices."
      en: "Five of which thou shalt couple by themselves, and the six others thou shalt couple one to another, so as to double the sixth curtain in the front of the roof."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Facies et quinquaginta ansas in ora sagi unius, ut conjungi cum altero queat, et quinquaginta ansas in ora sagi alterius, ut cum altero copuletur."
      en: "Thou shalt make also fifty loops in the edge of one curtain, that it may be joined with the other: and fifty loops in the edge of the other curtain, that it may be coupled with its fellow."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Facies et quinquaginta fibulas aeneas quibus jungantur ansae, ut unum ex omnibus operimentum fiat."
      en: "Thou shalt make also fifty buckles of brass, wherewith the loops may be joined, that of all there may be made one covering."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quod autem superfuerit in sagis quae parantur tecto, id est unum sagum quod amplius est, ex medietate ejus operies posteriora tabernaculi."
      en: "And that which shall remain of the curtains, that are prepared for the roof, to wit, one curtain that is over and above, with the half thereof thou shalt cover the back parts of the tabernacle."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et cubitus ex una parte pendebit, et alter ex altera qui plus est in sagorum longitudine, utrumque latus tabernaculi protegens."
      en: "And there shall hang down a cubit on the one side, and another on the other side, which is over and above in the length of the curtains, fencing both sides of the tabernacle."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Facies et operimentum aliud tecto de pellibus arietum rubricatis: et super hoc rursum aliud operimentum de janthinis pellibus."
      en: "Thou shalt make also another cover to the roof, of rams' skins dyed red; and over that again another cover of violet coloured skins."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Facies et tabulas stantes tabernaculi de lignis setim,"
      en: "Thou shalt make also the boards of the tabernacle standing upright of setim wood."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quae singulae denos cubitos in longitudine habeant, et in latitudine singulos ac semissem."
      en: "Let every one of them be ten cubits in length, and in breadth one cubit and a half."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "In lateribus tabulae, duae incastraturae fient, quibus tabula alteri tabulae connectatur: atque in hunc modum cunctae tabulae parabuntur."
      en: "In the sides of the boards shall be made two mortises, whereby one board may be joined to another board: and after this manner shall all the boards be prepared."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quarum viginti erunt in latere meridiano quod vergit ad austrum."
      en: "Of which twenty shall be in the south side southward."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Quibus quadraginta bases argenteas fundes, ut binae bases singulis tabulis per duos angulos subjiciantur."
      en: "For which thou shalt cast forty sockets of silver, that under every board may be put two sockets at the two corners."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "In latere quoque secundo tabernaculi quod vergit ad aquilonem, viginti tabulae erunt,"
      en: "In the second side also the tabernacle that looketh to the north, there shall be twenty boards,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quadraginta habentes bases argenteas, binae bases singulis tabulis supponentur."
      en: "Having forty sockets of silver, two sockets shall be put under each board."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ad occidentalem vero plagam tabernaculi facies sex tabulas,"
      en: "But on the west side of the tabernacle thou shalt make six boards."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et rursum alias duas quae in angulis erigantur post tergum tabernaculi."
      en: "And again other two which shall be erected in the corners at the back of the tabernacle."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Eruntque conjunctae a deorsum usque sursum, et una omnes compago retinebit. Duabus quoque tabulis quae in angulis ponendae sunt, similis junctura servabitur."
      en: "And they shall be joined together from beneath unto the top, and one joint shall hold them all. The like joining shall be observed for the two boards also that are to be put in the corners."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et erunt simul tabulae octo, bases earum argenteae sedecim, duabus basibus per unam tabulam supputatis."
      en: "And they shall be in all eight boards, and their silver sockets sixteen, reckoning two sockets for each board."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Facies et vectes de lignis setim quinque ad continendas tabulas in uno latere tabernaculi,"
      en: "Thou shalt make also five bars of setim wood, to hold together the boards on one side of the tabernacle."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et quinque alios in altero, et ejusdem numeri ad occidentalem plagam:"
      en: "And five others on the other side, and as many at the west side:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "qui mittentur per medias tabulas a summo usque ad summum."
      en: "And they shall be put along by the midst of the boards from one end to the other."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Ipsas quoque tabulas deaurabis, et fundes in eis annulos aureos per quos vectes tabulata contineant: quos operies laminis aureis."
      en: "The boards also themselves thou shalt overlay with gold, and shall cast rings of gold to be set upon them, for places for the bars to hold together boardwork: which bars thou shalt cover with plates of gold."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et eriges tabernaculum juxta exemplar quod tibi in monte monstratum est."
      en: "And thou shalt rear up the tabernacle according to the pattern that was shewn thee in the mount."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Facies et velum de hyacintho, et purpura, coccoque bis tincto, et bysso retorta, opere plumario et pulchra varietate contextum:"
      en: "Thou shalt make also a veil of violet and purple, and scarlet twice dyed, and fine twisted linen, wrought with embroidered work, and goodly variety:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quod appendes ante quatuor columnas de lignis setim, quae ipsae quidem deauratae erunt, et habebunt capita aurea, sed bases argenteas."
      en: "And thou shalt hang it up before four pillars of setim wood, which themselves also shall be overlaid with gold, and shall have heads of gold, but sockets of silver."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Inseretur autem velum per circulos, intra quod pones arcam testimonii, quo et sanctuarium, et sanctuarii sanctuaria dividentur."
      en: "And the veils shall be hanged on with rings, and within it thou shalt put the ark of the testimony, and the sanctuary, and the holy of holies shall be divided with it."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Pones et propitiatorium super arcam testimonii in Sancto sanctorum,"
      en: "And thou shalt set the propitiatory upon the ark of the testimony in the holy of holies."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "mensamque extra velum, et contra mensam candelabrum in latere tabernaculi meridiano: mensa enim stabit in parte aquilonis."
      en: "And the table without the veil: and over against the table the candlestick in the south side of the tabernacle; for the table shall stand in the north side."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Facies et tentorium in introitu tabernaculi de hyacintho, et purpura, coccoque bis tincto, et bysso retorta, opere plumarii."
      en: "Thou shalt make also a hanging in the entrance of the tabernacle of violet and purple, and scarlet twice dyed, and fine twisted linen with embroidered work."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et quinque columnas deaurabis lignorum setim, ante quas ducetur tentorium: quarum erunt capita aurea, et bases aeneae."
      en: "And thou shalt overlay with gold five pillars of setim wood, before which the hanging shall be drawn: their heads shall be of gold, and the sockets of brass."
    status: { la: verified, en: verified }
