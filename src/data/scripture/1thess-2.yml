# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1thess
chapter: 2
verses:
  - n: 1
    text:
      la: "Nam ipsi scitis, fratres, introitum nostrum ad vos, quia non inanis fuit:"
      en: "For yourselves know, brethren, our entrance in unto you, that it was not in vain:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sed ante passi, et contumeliis affecti ( sicut scitis) in Philippis, fiduciam habuimus in Deo nostro, loqui ad vos Evangelium Dei in multa sollicitudine."
      en: "But having suffered many things before, and been shamefully treated (as you know) at Philippi, we had confidence in our God, to speak unto you the gospel of God in much carefulness."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Exhortatio enim nostra non de errore, neque de immunditia, neque in dolo,"
      en: "For our exhortation was not of error, nor of uncleanness, nor in deceit:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sed sicut probati sumus a Deo ut crederetur nobis Evangelium: ita loquimur non quasi hominibus placentes, sed Deo, qui probat corda nostra."
      en: "But as we were approved by God that the gospel should be committed to us: even so we speak, not as pleasing men, but God, who proveth our hearts."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Neque enim aliquando fuimus in sermone adulationis, sicut scitis: neque in occasione avaritiae: Deus testis est:"
      en: "For neither have we used, at any time, the speech of flattery, as you know; nor taken an occasion of covetousness, God is witness:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "nec quaerentes ab hominibus gloriam, neque a vobis, neque ab aliis."
      en: "Nor sought we glory of men, neither of you, nor of others."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cum possemus vobis oneri esse ut Christi apostoli: sed facti sumus parvuli in medio vestrum, tamquam si nutrix foveat filios suos."
      en: "Whereas we might have been burdensome to you, as the apostles of Christ: but we became little ones in the midst of you, as if a nurse should cherish her children:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ita desiderantes vos, cupide volebamus tradere vobis non solum Evangelium Dei, sed etiam animas nostras: quoniam carissimi nobis facti estis."
      en: "So desirous of you, we would gladly impart unto you not only the gospel of God, but also our own souls: because you were become most dear unto us."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Memores enim estis, fratres, laboris nostri, et fatigationis: nocte ac die operantes, ne quem vestrum gravaremus, praedicavimus in vobis Evangelium Dei."
      en: "For you remember, brethren, our labour and toil: working night and day, lest we should be chargeable to any of you, we preached among you the gospel of God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Vos testes estis, et Deus, quam sancte, et juste, et sine querela, vobis, qui credidistis, fuimus:"
      en: "You are witnesses, and God also, how holily, and justly, and without blame, we have been to you that have believed:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sicut scitis, qualiter unumquemque vestrum ( sicut pater filios suos)"
      en: "As you know in what manner, entreating and comforting you, (as a father doth his children,)"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "deprecantes vos, et consolantes, testificati sumus, ut ambularetis digne Deo, qui vocavit vos in suum regnum et gloriam."
      en: "We testified to every one of you, that you would walk worthy of God, who hath called you unto his kingdom and glory."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ideo et nos gratias agimus Deo sine intermissione: quoniam cum accepissetis a nobis verbum auditus Dei, accepistis illud, non ut verbum hominum, sed ( sicut est vere) verbum Dei, qui operatur in vobis, qui credidistis:"
      en: "Therefore, we also give thanks to God without ceasing: because, that when you had received of us the word of the hearing of God, you received it not as the word of men, but (as it is indeed) the word of God, who worketh in you that have believed."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "vos enim imitatores facti estis, fratres, ecclesiarum Dei, quae sunt in Judaea in Christo Jesu: quia eadem passi estis et vos a contribulibus vestris, sicut et ipsi a Judaeis:"
      en: "For you, brethren, are become followers of the churches of God which are in Judea, in Christ Jesus: for you also have suffered the same things from your own countrymen, even as they have from the Jews,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui et Dominum occiderunt Jesum, et prophetas, et nos persecuti sunt, et Deo non placent, et omnibus hominibus adversantur,"
      en: "Who both killed the Lord Jesus, and the prophets, and have persecuted us, and please not God, and are adversaries to all men;"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "prohibentes nos gentibus loqui ut salvae fiant, ut impleant peccata sua semper: pervenit enim ira Dei super illos usque in finem."
      en: "Prohibiting us to speak to the Gentiles, that they may be saved, to fill up their sins always: for the wrath of God is come upon them to the end."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Nos autem fratres desolati a vobis ad tempus horae, aspectu, non corde, abundantius festinavimus faciem vestram videre cum multo desiderio:"
      en: "But we, brethren, being taken away from you for a short time, in sight, not in heart, have hastened the more abundantly to see your face with great desire."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quoniam voluimus venire ad vos, ego quidem Paulus, et semel, et iterum: sed impedivit nos Satanas."
      en: "For we would have come unto you, I Paul indeed, once and again: but Satan hath hindered us."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Quae est enim nostra spes aut gaudium, aut corona gloriae? nonne vos ante Dominum nostrum Jesum Christum estis in adventu ejus?"
      en: "For what is our hope, or joy, or crown of glory? Are not you, in the presence of our Lord Jesus Christ at his coming?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "vos enim estis gloria nostra et gaudium."
      en: "For you are our glory and joy."
    status: { la: verified, en: verified }
