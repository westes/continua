# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 3reg
chapter: 10
verses:
  - n: 1
    text:
      la: "Sed et regina Saba, audita fama Salomonis in nomine Domini, venit tentare eum in aenigmatibus."
      en: "And the queen of Saba, having; heard of the fame of Solomon in the name of the Lord, came to try him with hard questions."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et ingressa Jerusalem multo cum comitatu, et divitiis, camelis portantibus aromata, et aurum infinitum nimis, et gemmas pretiosas, venit ad regem Salomonem, et locuta est ei universa quae habebat in corde suo."
      en: "And entering into Jerusalem with a great train, and riches, and camels that carried spices, and an immense quantity of gold, and precious stones, she came to king Solomon, and spoke to him all that she had in her heart."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et docuit eam Salomon omnia verba quae proposuerat: non fuit sermo, qui regem posset latere, et non responderet ei."
      en: "And Solomon informed her of all the things she proposed to him: there was not any word the king was ignorant of, and which he could not answer her."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Videns autem regina Saba omnem sapientiam Salomonis, et domum quam aedificaverat,"
      en: "And when the queen of Saba saw all the wisdom of Solomon, and the house which he had built,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et cibos mensae ejus, et habitacula servorum, et ordines ministrantium, vestesque eorum, et pincernas, et holocausta quae offerebat in domo Domini: non habebat ultra spiritum."
      en: "And the meat of his table, and the apartments of his servants, and the order of his ministers, and their apparel, and the cupbearers, and the holocausts, which he offered in the house of the Lord: she had no longer any spirit in her,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dixitque ad regem: Verus est sermo quem audivi in terra mea"
      en: "And she said to the king: The report is true, which I heard in my own country,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "super sermonibus tuis, et super sapientia tua: et non credebam narrantibus mihi, donec ipsa veni, et vidi oculis meis, et probavi quod media pars mihi nuntiata non fuerit: major est sapientia et opera tua, quam rumor quem audivi."
      en: "Concerning thy words, and concerning thy wisdom. And I did not believe them that told me, till I came myself, and saw with my own eyes, and have found that the half hath not been told me: thy wisdom and thy works, exceed the fame which I heard."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Beati viri tui, et beati servi tui, qui stant coram te semper, et audiunt sapientiam tuam."
      en: "Blessed are thy men, and blessed are thy servants, who stand before thee always, and hear thy wisdom."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sit Dominus Deus tuus benedictus, cui complacuisti, et posuit te super thronum Israel, eo quod dilexerit Dominus Israel in sempiternum, et constituit te regem, ut faceres judicium et justitiam."
      en: "Blessed be the Lord thy God, whom thou hast pleased, and who hath set thee upon the throne of Israel, because the Lord hath loved Israel for ever, and hath appointed thee king, to do judgment and justice."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dedit ergo regi centum viginti talenta auri, et aromata multa nimis, et gemmas pretiosas: non sunt allata ultra aromata tam multa, quam ea quae dedit regina Saba regi Salomoni."
      en: "And she gave the king a hundred and twenty talents of gold, and of spices a very great store, and precious stones: there was brought no more such abundance of spices as these which the queen of Saba gave to king Solomon."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "( Sed et classis Hiram, quae portabat aurum de Ophir, attulit ex Ophir ligna thyina multa nimis, et gemmas pretiosas."
      en: "(The navy also of Hiram, which brought gold from Ophir, brought from Ophir great plenty of thyine trees, and precious stones."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Fecitque rex de lignis thyinis fulcra domus Domini, et domus regiae, et citharas lyrasque cantoribus: non sunt allata hujuscemodi ligna thyina, neque visa usque in praesentem diem.)"
      en: "And the king made of the thyine trees the rails of the house of the Lord, and of the king's house, and citterns and harps for singers: there were no such thyine trees as these brought, nor seen unto this day.)"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Rex autem Salomon dedit reginae Saba omnia quae voluit et petivit ab eo: exceptis his, quae ultro obtulerat ei munere regio. Quae reversa est, et abiit in terram suam cum servis suis."
      en: "And king Solomon gave the queen of Saba all that she desired, and asked of him: besides what he offered he himself of his royal bounty. And she returned, and went to her own country with her servants."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Erat autem pondus auri, quod afferebatur Salomoni per annos singulos, sexcentorum sexaginta sex talentorum auri:"
      en: "And the weight of the gold that was brought to Solomon every year, was six hundred and sixty-six talents of gold:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "excepto eo, quod afferebant viri qui super vectigalia erant, et negotiatores, universique scruta vendentes, et omnes reges Arabiae, ducesque terrae."
      en: "Besides that which the men brought him that were over the tributes, and the merchants, and they that sold by retail, and all the kings of Arabia, and the governors of the country."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Fecit quoque rex Salomon ducenta scuta de auro purissimo, sexcentos auri siclos dedit in laminas scuti unius."
      en: "And Solomon made two hundred shields of the purest gold: he allowed six hundred sicles of gold for the plates of one shield."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et trecentas peltas ex auro probato: trecentae minae auri unam peltam vestiebant: posuitque eas rex in domo saltus Libani."
      en: "And three hundred targets of fine gold: three hundred pounds of gold covered one target: and the king put them in the house of the forest of Libanus."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Fecit etiam rex Salomon thronum de ebore grandem: et vestivit eum auro fulvo nimis,"
      en: "King Solomon also made a great throne of ivory: and overlaid it with the finest gold."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "qui habebat sex gradus: et summitas throni rotunda erat in parte posteriori: et duae manus hinc atque inde tenentes sedile: et duo leones stabant juxta manus singulas."
      en: "It had six steps: and the top of the throne was round behind: and there were two hands on either side holding the seat: and two lions stood, one at each hand."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et duodecim leunculi stantes super sex gradus hinc atque inde: non est factum tale opus in universis regnis."
      en: "And twelve little lions stood upon the six steps on the one side and on the other: there was no such work made in any kingdom."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Sed et omnia vasa, quibus potabat rex Salomon, erant aurea: et universa supellex domus saltus Libani de auro purissimo: non erat argentum, nec alicujus pretii putabatur in diebus Salomonis,"
      en: "Moreover all the vessels, out of which king Solomon drank, were of gold: and all the furniture of the house of the forest of Libanus was of most pure gold: there was no silver, nor was any account made of it in the days of Solomon:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quia classis regis per mare cum classe Hiram semel per tres annos ibat in Tharsis, deferens inde aurum, et argentum, et dentes elephantorum, et simias, et pavos."
      en: "For the king's navy, once in three years, went with the navy of Hiram by sea to Tharsis, and brought from thence gold, and silver, and elephants' teeth, and apes, and peacocks."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Magnificatus est ergo rex Salomon super omnes reges terrae divitiis et sapientia."
      en: "And king Solomon exceeded all the kings of the earth in riches, and wisdom."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et universa terra desiderabat vultum Salomonis, ut audiret sapientiam ejus, quam dederat Deus in corde ejus."
      en: "And all the earth desired to see Solomon's face, to hear his wisdom, which God had given in his heart."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et singuli deferebant ei munera, vasa argentea et aurea, vestes et arma bellica, aromata quoque, et equos et mulos per annos singulos."
      en: "And every one brought him presents, vessels of silver and of gold, garments and armour, and spices, and horses and mules every year."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Congregavitque Salomon currus et equites, et facti sunt ei milla quadringenti currus, et duodecim millia equitum: et disposuit eos per civitates munitas, et cum rege in Jerusalem."
      en: "And Solomon gathered together chariots and horsemen, and he had a thousand four hundred chariots, and twelve thousand horseman: and he bestowed them in fenced cities, and with the king in Jerusalem."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Fecitque ut tanta esset abundantia argenti in Jerusalem, quanta et lapidum: et cedrorum praebuit multitudinem quasi sycomoros quae nascuntur in campestribus."
      en: "And he made silver to be as plentiful in Jerusalem as stones: and cedars to be as common as sycamores which grow in the plains."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et educebantur equi Salomoni de Aegypto, et de Coa. Negotiatores enim regis emebant de Coa, et statuto pretio perducebant."
      en: "And horses were brought for Solomon out of Egypt, and Coa: for the king's merchants brought them out of Coa, and bought them at a set price."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Egrediebatur autem quadriga ex Aegypto sexcentis siclis argenti, et equus centum quinquaginta. Atque in hunc modum cuncti reges Hethaeorum et Syriae equos venundabant."
      en: "And a chariot of four horses came out of Egypt, for six hundred sicles of silver, and a horse for a hundred and fifty. And after this manner did all the kings of the Hethites, and of Syria, sell horses."
    status: { la: verified, en: verified }
