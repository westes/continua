# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 46
verses:
  - n: 1
    text:
      la: "Quod factum est verbum Domini ad Jeremiam prophetam contra gentes."
      en: "The word of the Lord that came to Jeremias the prophet against the Gentiles,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ad Aegyptum, adversum exercitum Pharaonis Nechao regis Aegypti, qui erat juxta fluvium Euphraten in Charcamis, quem percussit Nabuchodonosor rex Babylonis, in quarto anno Joakim filii Josiae regis Juda."
      en: "Against Egypt, against the army of Pharao Nechao king of Egypt, which was by the river Euphrates in Charcamis, whom Nabuchodonosor the king of Babylon defeated, in the fourth year of Joakim the son of Josias king of Juda."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Praeparate scutum et clypeum, et procedite ad bellum."
      en: "Prepare ye the shield and buckler, and go forth to battle."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Jungite equos, et ascendite, equites: state in galeis, polite lanceas, induite vos loricis."
      en: "Harness the horses, and get up, ye horsemen: stand forth with helmets, furbish the spears, put on coats of mail."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quid igitur? vidi ipsos pavidos, et terga vertentes, forte eorum caesos: fugerunt conciti, nec respexerunt: terror undique, ait Dominus."
      en: "What then? I have seen them dismayed, and turning their backs, their valiant ones slain: they fled apace, and they looked not back: terror was round about, saith the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Non fugiat velox, nec salvari se putet fortis: ad aquilonem juxta flumen Euphraten victi sunt, et ruerunt."
      en: "Let not the swift flee away, nor the strong think to escape: they are overthrown, and fallen down, towards the north by the river Euphrates."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quis est iste, qui quasi flumen ascendit, et veluti fluviorum intumescunt gurgites ejus?"
      en: "Who is this that cometh up as a flood: and his streams swell like those of rivers?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Aegyptus fluminis instar ascendit, et velut flumina movebuntur fluctus ejus, et dicet: Ascendens operiam terram: perdam civitatem, et habitatores ejus."
      en: "Egypt riseth up like a flood, and the waves thereof shall be moved as rivers, and he shall say: I will go up and will cover the earth: I will destroy the city, and its inhabitants."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ascendite equos, et exsultate in curribus, et procedant fortes, Aethiopia et Libyes tenentes scutum, et Lydii arripientes et jacientes sagittas."
      en: "Get ye up on horses, and glory in chariots, and let the valiant men come forth, the Ethiopians, and the Libyans that hold the shield, and the Lydians that take, and shoot arrows."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dies autem ille Domini Dei exercituum, dies ultionis, ut sumat vindictam de inimicis suis: devorabit gladius, et saturabitur, et inebriabitur sanguine eorum: victima enim Domini Dei exercituum, in terra aquilonis juxta flumen Euphraten."
      en: "For this is the day of the Lord the God of hosts, a day of vengeance, that he may revenge himself of his enemies: the sword shall devour, and shall be filled, and shall be drunk with their blood: for there is a sacrifice of the Lord God of hosts in the north country, by the river Euphrates."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ascende in Galaad, et tolle resinam, virgo filia Aegypti: frustra multiplicas medicamina, sanitas non erit tibi."
      en: "Go up into Galaad, and take balm, O virgin daughter of Egypt: in vain dost thou multiply medicines, there shall be no cure for thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Audierunt gentes ignominiam tuam et ululatus tuus replevit terram, quia fortis impegit in fortem, et ambo pariter conciderunt."
      en: "The nations have heard of thy disgrace, and thy howling hath filled the land: for the strong hath stumbled against the strong, and both are fallen together."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Verbum quod locutus est Dominus ad Jeremiam prophetam, super eo quod venturus esset Nabuchodonosor rex Babylonis, et percussurus terram Aegypti:"
      en: "The word that the Lord spoke to Jeremias the prophet, how Nabuchodonosor king of Babylon should come and strike the land of Egypt:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Annuntiate Aegypto, et auditum facite in Magdalo, et resonet in Memphis, et in Taphnis: dicite: Sta, et praepara te, quia devorabit gladius ea quae per circuitum tuum sunt."
      en: "Declare ye to Egypt, and publish it in Magdal, and let it be known in Memphis, and in Taphnis: say ye: Stand up, and prepare thyself: for the sword shall devour all round about thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quare computruit fortis tuus? non stetit, quoniam Dominus subvertit eum."
      en: "Why are thy valiant men come to nothing? they stood not: because the Lord hath overthrown them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Multiplicavit ruentes, ceciditque vir ad proximum suum, et dicent: Surge, et revertamur ad populum nostrum, et ad terram nativitatis nostrae, a facie gladii columbae."
      en: "He hath multiplied them that fall, and one hath fallen upon another, and they shall say: Arise, and let us return to our own people, and to the land of our nativity, from the sword of the dove."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Vocate nomen Pharaonis regis Aegypti: tumultum adduxit tempus."
      en: "Call ye the name of Pharao king Egypt, a tumult time hath brought."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vivo ego, inquit rex ( Dominus exercituum nomen ejus), quoniam sicut Thabor in montibus, et sicut Carmelus in mari, veniet."
      en: "As I live, (saith the King, whose name is the Lord of hosts,) as Thabor is among the mountains, and as Carmel by the sea, so shall he come."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Vasa transmigrationis fac tibi, habitatrix filia Aegypti: quia Memphis in solitudinem erit, et deseretur, et inhabitabilis erit."
      en: "Furnish thyself to go into captivity, thou daughter inhabitant of Egypt: for Memphis shall be made desolate, and shall be forsaken and uninhabited."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Vitula elegans atque formosa Aegyptus, stimulator ab aquilone veniet ei."
      en: "Egypt is like a fair and beautiful heifer: there shall come from the north one that shall goad her."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Mercenarii quoque ejus, qui versabantur in medio ejus quasi vituli saginati, versi sunt, et fugerunt simul, nec stare potuerunt, quia dies interfectionis eorum venit super eos, tempus visitationis eorum."
      en: "Her hirelings also that lived in the midst of her, like fatted calves are turned back, and are fled away together, and they could not stand, for the day of their slaughter is come upon them, the time of their visitation."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Vox ejus quasi aeris sonabit: quoniam cum exercitu properabunt, et cum securibus venient ei quasi caedentes ligna."
      en: "Her voice shall sound like brass, for they shall hasten with an army, and with axes they shall come against her, as hewers of wood."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Succiderunt saltum ejus, ait Dominus, qui supputari non potest: multiplicati sunt super locustas, et non est eis numerus."
      en: "They have cut down her forest, saith the Lord, which cannot be counted: they are multiplied above locusts, and are without number."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Confusa est filia Aegypti, et tradita in manu populo aquilonis."
      en: "The daughter of Egypt is confounded, and delivered into the hand of the people of the north."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Dixit Dominus exercituum, Deus Israel: Ecce ego visitabo super tumultum Alexandriae, et super Pharaonem, et super Aegyptum, et super deos ejus, et super reges ejus, et super Pharaonem, et super eos qui confidunt in eo:"
      en: "The Lord of hosts the God of Israel hath said: Behold I will visit upon the tumult of Alexandria, and upon Pharao, and upon Egypt, and upon her gods, and upon her kings, and upon Pharao, and upon them that trust in him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et dabo eos in manu quaerentium animam eorum, et in manu Nabuchodonosor regis Babylonis, et in manu servorum ejus: et post haec habitabitur sicut diebus pristinis, ait Dominus."
      en: "And I will deliver them into the hand of them that seek their lives, and into the hand of Nabuchodonosor king of Babylon, and into the hand of his servants: and afterwards it shall be inhabited, as in the days of old, saith the Lord."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et tu ne timeas, serve meus Jacob: et ne paveas, Israel: quia ecce ego salvum te faciam de longinquo, et semen tuum de terra captivitatis tuae: et revertetur Jacob, et requiescet, et prosperabitur, et non erit qui exterreat eum."
      en: "And thou my servant Jacob, fear not and be not thou dismayed, O Israel: for behold I will save thee from afar off, and thy seed out of the land of thy captivity: and Jacob shall return and be at rest, and prosper: and there shall be none to terrify him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et tu noli timere, serve meus Jacob, ait Dominus, quia tecum ego sum: quia ego consumam cunctas gentes ad quas ejeci te, te vero non consumam: sed castigabo te in judicio, nec quasi innocenti parcam tibi."
      en: "And thou, my servant Jacob, fear not, saith the Lord: because I am with thee, for I will consume all the nations to which I have cast thee out: but thee I will not consume, but I will correct thee in judgment, neither will I spare thee as if thou wert innocent."
    status: { la: verified, en: verified }
