# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: heb
chapter: 12
verses:
  - n: 1
    text:
      la: "Ideoque et nos tantam habentes impositam nubem testium, deponentes omne pondus, et circumstans nos peccatum, per patientiam curramus ad propositum nobis certamen:"
      en: "And therefore we also having so great a cloud of witnesses over our head, laying aside every weight and sin which surrounds us, let us run by patience to the fight proposed to us:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "aspicientes in auctorem fidei, et consummatorem Jesum, qui proposito sibi gaudio sustinuit crucem, confusione contempta, atque in dextera sedis Dei sedet."
      en: "Looking on Jesus, the author and finisher of faith, who having joy set before him, endured the cross, despising the shame, and now sitteth on the right hand of the throne of God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Recogitate enim eum qui talem sustinuit a peccatoribus adversum semetipsum contradictionem: ut ne fatigemini, animis vestris deficientes."
      en: "For think diligently upon him that endured such opposition from sinners against himself; that you be not wearied, fainting in your minds."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nondum enim usque ad sanguinem restitistis, adversus peccatum repugnantes:"
      en: "For you have not yet resisted unto blood, striving against sin:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et obliti estis consolationis, quae vobis tamquam filiis loquitur, dicens: Fili mi, noli negligere disciplinam Domini: neque fatigeris dum ab eo argueris."
      en: "And you have forgotten the consolation, which speaketh to you, as unto children, saying: My son, neglect not the discipline of the Lord; neither be thou wearied whilst thou art rebuked by him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quem enim diligit Dominus, castigat: flagellat autem omnem filium, quem recipit."
      en: "For whom the Lord loveth, he chastiseth; and he scourgeth every son whom he receiveth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "In disciplina perseverate. Tamquam filiis vobis offert se Deus: quis enim filius, quem non corripit pater?"
      en: "Persevere under discipline. God dealeth with you as with his sons; for what son is there, whom the father doth not correct?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quod si extra disciplinam estis, cujus participes facti sunt omnes: ergo adulteri, et non filii estis."
      en: "But if you be without chastisement, whereof all are made partakers, then are you bastards, and not sons."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Deinde patres quidem carnis nostrae, eruditores habuimus, et reverebamur eos, non multo magis obtemperabimus Patri spirituum, et vivemus?"
      en: "Moreover we have had fathers of our flesh, for instructors, and we reverenced them: shall we not much more obey the Father of spirits, and live?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et illi quidem in tempore paucorum dierum, secundum voluntatem suam erudiebant nos: hic autem ad id quod utile est in recipiendo sanctificationem ejus."
      en: "And they indeed for a few days, according to their own pleasure, instructed us: but he, for our profit, that we might receive his sanctification."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Omnis autem disciplina in praesenti quidem videtur non esse gaudii, sed moeroris: postea autem fructum pacatissimum exercitatis per eam, reddet justitiae."
      en: "Now all chastisement for the present indeed seemeth not to bring with it joy, but sorrow: but afterwards it will yield, to them that are exercised by it, the most peaceable fruit of justice."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Propter quod remissas manus, et soluta genua erigite,"
      en: "Wherefore lift up the hands which hang down, and the feeble knees,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et gressus rectos facite pedibus vestris: ut non claudicans quis erret, magis autem sanetur."
      en: "And make straight steps with your feet: that no one, halting, may go out of the way; but rather be healed."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Pacem sequimini cum omnibus, et sanctimoniam, sine qua nemo videbit Deum:"
      en: "Follow peace with all men, and holiness: without which no man shall see God."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "contemplantes nequis desit gratiae Dei: ne qua radix amaritudinis sursum germinans impediat, et per illam inquinentur multi."
      en: "Looking diligently, lest any man be wanting to the grace of God; lest any root of bitterness springing up do hinder, and by it many be defiled."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ne quis fornicator, aut profanus ut Esau: qui propter unam escam vendidit primitiva sua:"
      en: "Lest there be any fornicator, or profane person, as Esau; who for one mess, sold his first birthright."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "scitote enim quoniam et postea cupiens haereditare benedictionem, reprobatus est: non enim invenit poenitentiae locum, quamquam cum lacrimis inquisisset eam."
      en: "For know ye that afterwards, when he desired to inherit the benediction, he was rejected; for he found no place of repentance, although with tears he had sought it."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Non enim accessistis ad tractabilem montem, et accensibilem ignem, et turbinem, et caliginem, et procellam,"
      en: "For you are not come to a mountain that might be touched, and a burning fire, and a whirlwind, and darkness, and storm,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et tubae sonum, et vocem verborum, quam qui audierunt, excusaverunt se, ne eis fieret verbum."
      en: "And the sound of a trumpet, and the voice of words, which they that heard excused themselves, that the word might not be spoken to them:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Non enim portabant quod dicebatur: Et si bestia tetigerit montem, lapidabitur."
      en: "For they did not endure that which was said: And if so much as a beast shall touch the mount, it shall be stoned."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et ita terribile erat quod videbatur. Moyses dixit: Exterritus sum, et tremebundus."
      en: "And so terrible was that which was seen, Moses said: I am frighted, and tremble."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Sed accessistis ad Sion montem, et civitatem Dei viventis, Jerusalem caelestem, et multorum millium angelorum frequentiam,"
      en: "But you are come to mount Sion, and to the city of the living God, the heavenly Jerusalem, and to the company of many thousands of angels,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et ecclesiam primitivorum, qui conscripti sunt in caelis, et judicem omnium Deum, et spiritus justorum perfectorum,"
      en: "And to the church of the firstborn, who are written in the heavens, and to God the judge of all, and to the spirits of the just made perfect,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et testamenti novi mediatorem Jesum, et sanguinis aspersionem melius loquentem quam Abel."
      en: "And to Jesus the mediator of the new testament, and to the sprinkling of blood which speaketh better than that of Abel."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Videte ne recusetis loquentem. Si enim illi non effugerunt, recusantes eum, qui super terram loquebatur: multo magis nos, qui de caelis loquentem nobis avertimus."
      en: "See that you refuse him not that speaketh. For if they escaped not who refused him that spoke upon the earth, much more shall not we, that turn away from him that speaketh to us from heaven."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Cujus vox movit terram tunc: nunc autem repromittit, dicens: Adhuc semel, et ego movebo non solum terram, sed et caelum."
      en: "Whose voice then moved the earth; but now he promiseth, saying: Yet once more, and I will move not only the earth, but heaven also."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Quod autem, Adhuc semel, dicit: declarat mobilium translationem tamquam factorum, ut maneant ea quae sunt immobilia."
      en: "And in that he saith, Yet once more, he signifieth the translation of the moveable things as made, that those things may remain which are immoveable."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Itaque regnum immobile suscipientes, habemus gratiam: per quam serviamus placentes Deo, cum metu et reverentia."
      en: "Therefore receiving an immoveable kingdom, we have grace; whereby let us serve, pleasing God, with fear and reverence."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Etenim Deus noster ignis consumens est."
      en: "For our God is a consuming fire."
    status: { la: verified, en: verified }
