# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 3
verses:
  - n: 1
    text:
      la: "Fili mi, ne obliviscaris legis meae, et praecepta mea cor tuum custodiat;"
      en: "My son, forget not my law, and let thy heart keep my commandments."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "longitudinem enim dierum, et annos vitae, et pacem apponent tibi."
      en: "For they shall add to thee length of days, and years of life and peace."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Misericordia et veritas te non deserant; circumda eas gutturi tuo, et describe in tabulis cordis tui;"
      en: "Let not mercy and truth leave thee, put them about thy neck, and write them in the tables of thy heart:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et invenies gratiam, et disciplinam bonam, coram Deo et hominibus."
      en: "And thou shalt find grace and good understanding before God and men."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Habe fiduciam in Domino ex toto corde tuo, et ne innitaris prudentiae tuae."
      en: "Have confidence in the Lord with all thy heart, and lean not upon thy own prudence."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "In omnibus viis tuis cogita illum, et ipse diriget gressus tuos."
      en: "In all thy ways think on him, and he will direct thy steps."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ne sis sapiens apud temetipsum; time Deum, et recede a malo:"
      en: "Be not wise in thy own conceit: fear God, and depart from evil:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sanitas quippe erit umbilico tuo, et irrigatio ossium tuorum."
      en: "For it shall be health to thy navel, and moistening to thy bones."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Honora Dominum de tua substantia, et de primitiis omnium frugum tuarum da ei;"
      en: "Honour the Lord with thy substance, and give him of the first of all thy fruits:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et implebuntur horrea tua saturitate, et vino torcularia tua redundabunt."
      en: "And thy barns shall be filled with abundance, and thy presses shall run over with wine."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Disciplinam Domini, fili mi, ne abjicias, nec deficias cum ab eo corriperis:"
      en: "My son, reject not the correction of the Lord: and do not faint when thou art chastised by him:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quem enim diligit Dominus corripit, et quasi pater in filio complacet sibi."
      en: "For whom the Lord loveth, he chastiseth: and as a father in the son he pleaseth himself."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Beatus homo qui invenit sapientiam, et qui affluit prudentia."
      en: "Blessed is the man that findeth wisdom and is rich in prudence:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Melior est acquisitio ejus negotiatione argenti, et auri primi et purissimi fructus ejus."
      en: "The purchasing thereof is better than the merchandise of silver, and her fruit than the chiefest and purest gold:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Pretiosior est cunctis opibus, et omnia quae desiderantur huic non valent comparari."
      en: "She is more precious than all riches: and all the things that are desired, are not to be compared with her."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Longitudo dierum in dextera ejus, et in sinistra illius divitiae et gloria."
      en: "Length of days is in her right hand, and in her left hand riches and glory."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Viae ejus viae pulchrae, et omnes semitae illius pacificae."
      en: "Her ways are beautiful ways, and all her paths are peaceable."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Lignum vitae est his qui apprehenderint eam, et qui tenuerit eam beatus."
      en: "She is a tree of life to them that lay hold on her: and he that shall retain her is blessed."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dominus sapientia fundavit terram, stabilivit caelos prudentia."
      en: "The Lord by wisdom hath founded the earth, hath established the heavens by prudence."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Sapientia illius eruperunt abyssi, et nubes rore concrescunt."
      en: "By his wisdom the depths have broken out, and the clouds grow thick with dew."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Fili mi, ne effluant haec ab oculis tuis. Custodi legem atque consilium,"
      en: "My son, let not these things depart from thy eyes: keep the law and counsel:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et erit vita animae tuae, et gratia faucibus tuis."
      en: "And there shall be life to thy soul, and grace to thy mouth."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Tunc ambulabis fiducialiter in via tua, et pes tuus non impinget."
      en: "Then shalt thou walk confidently in thy way, and thy foot shall not stumble:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Si dormieris, non timebis; quiesces, et suavis erit somnus tuus."
      en: "If thou sleep, thou shalt not fear: thou shalt rest, and thy sleep shall be sweet."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Ne paveas repentino terrore, et irruentes tibi potentias impiorum."
      en: "Be not afraid of sudden fear, nor of the power of the wicked falling upon thee."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Dominus enim erit in latere tuo, et custodiet pedem tuum, ne capiaris."
      en: "For the Lord will be at thy side, and will keep thy foot that thou be not taken."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Noli prohibere benefacere eum qui potest; si vales, et ipse benefac."
      en: "Do not withhold him from doing good, who is able: if thou art able, do good thyself also."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Ne dicas amico tuo: Vade, et revertere, cras dabo tibi, cum statim possis dare."
      en: "Say not to thy friend: Go, and come again: and tomorrow I will give to thee: when thou canst give at present."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Ne moliaris amico tuo malum, cum ille in te habeat fiduciam."
      en: "Practise not evil against thy friend, when he hath confidence in thee."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Ne contendas adversus hominem frustra, cum ipse tibi nihil mali fecerit."
      en: "Strive not against a man without cause, when he hath done thee no evil."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Ne aemuleris hominem injustum, nec imiteris vias ejus:"
      en: "Envy not the unjust man, and do not follow his ways:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quia abominatio Domini est omnis illusor, et cum simplicibus sermocinatio ejus."
      en: "For every mocker is an abomination to the Lord, and his communication is with the simple."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Egestas a Domino in domo impii; habitacula autem justorum benedicentur."
      en: "Want is from the Lord in the house of the wicked: but the habitations of the just shall be blessed."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Ipse deludet illusores, et mansuetis dabit gratiam."
      en: "He shall scorn the scorners, and to the meek he will give grace."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Gloriam sapientes possidebunt; stultorum exaltatio ignominia."
      en: "The wise shall possess glory: the promotion of fools is disgrace."
    status: { la: verified, en: verified }
