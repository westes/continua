# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 50
verses:
  - n: 1
    text:
      la: "Simon, Oniae filius, sacerdos magnus, qui in vita sua suffulsit domum, et in diebus suis corroboravit templum."
      en: "Simon the high priest, the son of Onias, who in his life propped up the house, and in his days fortified the temple."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Templi etiam altitudo ab ipso fundata est, duplex aedificatio, et excelsi parietes templi."
      en: "By him also the height of the temple was founded, the double building and the high walls of the temple."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "In diebus ipsius emanaverunt putei aquarum, et quasi mare adimpleti sunt supra modum."
      en: "In his days the wells of water flowed out, and they were filled as the sea above measure."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Qui curavit gentem suam, et liberavit eam a perditione:"
      en: "He took care of his nation, and delivered it from destruction."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "qui praevaluit amplificare civitatem, qui adeptus est gloriam in conversatione gentis, et ingressum domus et atrii amplificavit."
      en: "He prevailed to enlarge the city, and obtained glory in his conversation with the people: and enlarged the entrance of the house and the court."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quasi stella matutina in medio nebulae, et quasi luna plena, in diebus suis lucet:"
      en: "He shone in his days as the morning star in the midst of a cloud, and as the moon at the full."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et quasi sol refulgens, sic ille effulsit in templo Dei."
      en: "And as the sun when it shineth, so did he shine in the temple of God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quasi arcus refulgens inter nebulas gloriae, et quasi flos rosarum in diebus vernis, et quasi lilia quae sunt in transitu aquae, et quasi thus redolens in diebus aestatis:"
      en: "And as the rainbow giving light in the bright clouds, and as the flower of roses in the days of the spring, and as the lilies that are on the brink of the water, and as the sweet smelling frankincense in the time of summer."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quasi ignis effulgens, et thus ardens in igne:"
      en: "As a bright fire, and frankincense burning in the fire."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quasi vas auri solidum, ornatum omni lapide pretioso:"
      en: "As a massy vessel of gold, adorned with every precious stone."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quasi oliva pullulans, et cypressus in altitudinem se extollens, in accipiendo ipsum stolam gloriae, et vestiri eum in consummationem virtutis."
      en: "As an olive tree budding forth, and a cypress tree rearing itself on high, when he put on the robe of glory, and was clothed with the perfection of power."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "In ascensu altaris sancti gloriam dedit sanctitatis amictum."
      en: "When he went up to the holy altar, he honoured the vesture of holiness."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "In accipiendo autem partes de manu sacerdotum, et ipse stans juxta aram: et circa illum corona fratrum: quasi plantatio cedri in monte Libano,"
      en: "And when he took the portions out of the hands of the priests, he himself stood by the altar. And about him was the ring of his brethren: and as the cedar planted in mount Libanus,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sic circa illum steterunt quasi rami palmae: et omnes filii Aaron in gloria sua."
      en: "And as branches of palm trees, they stood round about him, and all the sons of Aaron in their glory."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Oblatio autem Domini in manibus ipsorum coram omni synagoga Israel: et consummatione fungens in ara, amplificare oblationem excelsi Regis,"
      en: "And the oblation of the Lord was in their hands, before all the congregation of Israel: and finishing his service, on the altar, to honour the offering of the most high King,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "porrexit manum suam in libatione, et libavit de sanguine uvae."
      en: "He stretched forth his hand to make a libation, and offered of the blood of the grape."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Effudit in fundamento altaris odorem divinum excelso Principi."
      en: "He poured out at the foot of the altar a divine odour to the most high Prince."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Tunc exclamaverunt filii Aaron, in tubis productilibus sonuerunt: et auditam fecerunt vocem magnam in memoriam coram Deo."
      en: "Then the sons of Aaron shouted, they sounded with beaten trumpets, and made a great noise to be heard for a remembrance before God."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Tunc omnis populus simul properaverunt, et ceciderunt in faciem super terram, adorare Dominum Deum suum, et dare preces omnipotenti Deo excelso."
      en: "Then all the people together made haste, and fell down to the earth upon their faces, to adore the Lord their God, and to pray to the Almighty God the most High."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et amplificaverunt psallentes in vocibus suis, et in magna domo auctus est sonus suavitatis plenus."
      en: "And the singers lifted up their voices. and in the great house the sound of sweet melody was increased."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et rogavit populus Dominum excelsum in prece, usque dum perfectus est honor Domini, et munus suum perfecerunt."
      en: "And the people in prayer besought the Lord the most High, until the worship of the Lord was perfected, and they had finished their office."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Tunc descendens, manus suas extulit in omne congregationem filiorum Israel, dare gloriam Deo a labiis suis, et in nomine ipsius gloriari:"
      en: "Then coming down, he lifted up his hands over all the congregation of the children of Israel, to give glory to God with his lips, and to glory in his name:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et iteravit orationem suam, volens ostendere virtutem Dei."
      en: "And he repeated his prayer, willing to shew the power of God."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et nunc orate Deum omnium, qui magna fecit in omni terra, qui auxit dies nostros a ventre matris nostrae, et fecit nobiscum secundum suam misericordiam:"
      en: "And now pray ye to the God of all, who hath done great things in all the earth, who hath increased our days from our mother's womb, and hath done with us according to his mercy."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "det nobis jucunditatem cordis, et fieri pacem in diebus nostris in Israel per dies sempiternos:"
      en: "May he grant us joyfulness of heart, and that there be peace in our days in Israel for ever:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "credere Israel nobiscum esse Dei misericordiam, ut liberet nos in diebus suis."
      en: "That Israel may believe that the mercy of God is with us, to deliver us in his days."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Duas gentes odit anima mea: tertia autem non est gens quam oderim:"
      en: "There are two nations which my soul abhorreth: and the third is no nation, which I hate:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "qui sedent in monte Seir, et Philisthiim, et stultus populus qui habitat in Sichimis."
      en: "They that sit on mount Seir, and the Philistines, and the foolish people that dwell in Sichem."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Doctrinam sapientiae et disciplinae scripsit in codice isto Jesus, filius Sirach, Jerosolymita, qui renovavit sapientiam de corde suo."
      en: "Jesus the son of Sirach, of Jerusalem, hath written in this book the doctrine of wisdom and instruction, who renewed wisdom from his heart."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Beatus qui in istis versatur bonis: qui ponit illa in corde suo, sapiens erit semper."
      en: "Blessed is he that is conversant in these good things: and he that layeth them up in his heart, shall be wise always."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Si enim haec fecerit, ad omnia valebit, quia lux Dei vestigium ejus est."
      en: "For if he do them, he shall be strong to do all things: because the light of God guideth his steps."
    status: { la: verified, en: verified }
