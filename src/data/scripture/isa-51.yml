# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 51
verses:
  - n: 1
    text:
      la: "Audite me, qui sequimini quod justum est, et quaeritis Dominum; attendite ad petram unde excisi estis, et ad cavernam laci de qua praecisi estis."
      en: "Give ear to me, you that follow that which is just, and you that seek the Lord: look unto the rock whence you are hewn, and to the hole of the pit from which you are dug out."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Attendite ad Abraham, patrem vestrum, et ad Saram, quae peperit vos; quia unum vocavi eum, et benedixi ei, et multiplicavi eum."
      en: "Look unto Abraham your father, and to Sara that bore you: for I called him alone, and blessed him, and multiplied him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Consolabitur ergo Dominus Sion, et consolabitur omnes ruinas ejus; et ponet desertum ejus quasi delicias, et solitudinem ejus quasi hortum Domini. Gaudium et laetitia invenietur in ea, gratiarum actio et vox laudis."
      en: "The Lord therefore will comfort Sion, and will comfort all the ruins thereof: and he will make her desert as a place of pleasure, and her wilderness as the garden of the Lord. Joy and gladness shall be found therein, thanksgiving, and the voice of praise."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Attendite ad me, popule meus, et, tribus mea, me audite: quia lex a me exiet, et judicium meum in lucem populorum requiescet."
      en: "Hearken unto me, O my people, and give ear to me, O my tribes: for a law shall go forth from me, and my judgment shall rest to be a light of the nations."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Prope est justus meus, egressus est salvator meus, et brachia mea populos judicabunt; me insulae exspectabunt, et brachium meum sustinebunt."
      en: "My just one is near at hand, my saviour is gone forth, and my arms shall judge the people: the islands shall look for me, and shall patiently wait for my arm."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Levate in caelum oculos vestros, et videte sub terra deorsum; quia caeli sicut fumus liquescent, et terra sicut vestimentum atteretur, et habitatores ejus sicut haec interibunt, salus autem mea in sempiternum erit, et justitia mea non deficiet."
      en: "Lift up your eyes to heaven, and look down to the earth beneath: for the heavens shall vanish like smoke, and the earth shall be worn away like a garment, and the inhabitants thereof shall perish in like manner: but my salvation shall be for ever, and my justice shall not fail."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Audite me, qui scitis justum: populus meus, lex mea in corde eorum; nolite timere opprobrium hominum, et blasphemias eorum ne metuatis;"
      en: "Hearken to me, you that know what is just, my people who have my law in your heart: fear ye not the reproach of men, and be not afraid of their blasphemies."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sicut enim vestimentum, sic comedet eos vermis; et sicut lanam, sic devorabit eos tinea: salus autem mea in sempiternum erit; et justitia mea in generationes generationum."
      en: "For the worm shall eat them up as a garment: and the moth shall consume them as wool: but my salvation shall be for ever, and my justice from generation to generation,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Consurge, consurge, induere fortitudinem, brachium Domini! Consurge sicut in diebus antiquis, in generationibus saeculorum. Numquid non tu percussisti superbum, vulnerasti draconem?"
      en: "Arise, arise, put on strength, O thou arm of the Lord, arise as in the days of old, in the ancient generations. Hast not thou struck the proud one, and wounded the dragon?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Numquid non tu siccasti mare, aquam abyssi vehementis; qui posuisti profundum maris viam, ut transirent liberati?"
      en: "Hast not thou dried up the sea, the water of the mighty deep, who madest the depth of the sea a way, that the delivered might pass over?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et nunc qui redempti sunt a Domino, revertentur; et venient in Sion laudantes, et laetitia sempiterna super capita eorum, gaudium et laetitiam tenebunt; fugiet dolor et gemitus."
      en: "And now they that are redeemed by the Lord, shall return, and shall come into Sion singing praises, and joy everlasting shall be upon their heads, they shall obtain joy and gladness, sorrow and mourning shall flee away."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ego, ego ipse consolabor vos. Quis tu, ut timeres ab homine mortali, et a filio hominis qui quasi foenum ita arescet?"
      en: "I, I myself will comfort you: who art thou, that thou shouldst be afraid of a mortal man, and of the son of man, who shall wither away like grass?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et oblitus es Domini, factoris tui, qui tetendit caelos et fundavit terram; et formidasti jugiter tota die a facie furoris ejus qui te tribulabat, et paraverat ad perdendum. Ubi nunc est furor tribulantis?"
      en: "And thou hast forgotten the Lord thy maker, who stretched out the heavens, and founded the earth: and thee hast been afraid continually all the day at the presence of his fury who afflicted thee, and had prepared himself to destroy thee: where is now the fury of the oppressor?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cito veniet gradiens ad aperiendum; et non interficiet usque ad internecionem nec deficiet panis ejus."
      en: "He shall quickly come that is going to open unto you, and he shall not kill unto utter destruction, neither shall his bread fail."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ego autem sum Dominus Deus tuus, qui conturbo mare, et intumescunt fluctus ejus; Dominus exercituum nomen meum."
      en: "But I am the Lord thy God, who trouble the sea, and the waves thereof swell: the Lord of hosts is my name."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Posui verba mea in ore tuo, et in umbra manus meae protexi te, ut plantes caelos, et fundes terram, et dicas ad Sion: Populus meus es tu."
      en: "I have put my words in thy mouth, and have protected thee in the shadow of my hand, that thou mightest plant the heavens, and found the earth: and mightest say to Sion: Thou art my people."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Elevare, elevare, consurge, Jerusalem, quae bibisti de manu Domini calicem irae ejus; usque ad fundum calicis soporis bibisti, et potasti usque ad faeces."
      en: "Arise, arise, stand up, O Jerusalem, which hast drunk at the hand of the Lord the cup of his wrath; thou hast drunk even to the bottom of the cup of dead sleep, and thou hast drunk even to the dregs."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Non est qui sustentet eam, ex omnibus filiis quos genuit; et non est qui apprehendat manum ejus, ex omnibus filiis quos enutrivit."
      en: "There is none that can uphold her among all the children that she hath brought forth: and there is none that taketh her by the hand among all the children that she hath brought up."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Duo sunt quae occurrerunt tibi; quis contristabitur super te? Vastitas, et contritio, et fames, et gladius; quis consolabitur te?"
      en: "There are two things that have happened to thee: who shall be sorry for thee? desolation, and destruction, and the famine, and the sword, who shall comfort thee?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Filii tui projecti sunt, dormierunt in capite omnium viarum sicut oryx illaqueatus; pleni indignatione Domini, increpatione Dei tui."
      en: "Thy children are cast forth, they have slept at the head of all the ways, as the wild ox that is snared: full of the indignation of the Lord, of the rebuke of thy God."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Idcirco audi hoc, paupercula, et ebria non a vino."
      en: "Therefore hear this, thou poor little one, and thou that art drunk but not with wine."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Haec dicit dominator tuus Dominus et Deus tuus, qui pugnabit pro populo suo: Ecce tuli de manu tua calicem soporis, fundum calicis indignationis meae; non adjicies ut bibas illum ultra."
      en: "Thus saith thy Sovereign the Lord and thy God, who will fight for his people: Behold I have taken out of thy hand the cup of dead sleep, the dregs of the cup of my indignation, thou shalt not drink it again any more."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et ponam illum in manu eorum qui te humiliaverunt, et dixerunt animae tuae: Incurvare, ut transeamus; et posuisti ut terram corpus tuum, et quasi viam transeuntibus."
      en: "And I will put it in the hand of them that have oppressed thee, and have said to thy soul: Bow down, that we may go over: and thou hast laid thy body as the ground, and as a way to them that went over."
    status: { la: verified, en: verified }
