# Acts of the Apostles (cited "Act"), chapter 19.
# Verses transcribed from pentecost-sunday-octave-day-2.yml (already pulled
# from Divinum Officium, Monastic Tridentinum 1617) as part of the
# migration to a dedicated scripture store (2026-08 decision).
book: act
chapter: 19
verses:
  - n: 1
    text:
      la: "Factum est autem cum Apóllo esset Corínthi, ut Paulus peragrátis superióribus pártibus veníret Ephesum, et inveníret quosdam discípulos:"
      en: "And it came to pass, while Apollo was at Corinth, that Paul having passed through the upper coasts, came to Ephesus, and found certain disciples:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dixítque ad eos: Si Spíritum Sanctum accepístis credéntes? At illi dixérunt ad eum: Sed neque si Spíritus Sanctus est, audívimus."
      en: "And he said to them: Have you received the Holy Ghost since ye believed? But they said to him: We have not so much as heard whether there be a Holy Ghost."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ille vero ait: In quo ergo baptizáti estis? Qui dixérunt: In Ioánnis baptísmate."
      en: "And he said: In what then were you baptized? Who said: In John's baptism."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dixit autem Paulus: Joánnes baptizávit baptísmo pœniténtiæ pópulum, dicens in eum qui ventúrus esset post ipsum ut créderent, hoc est, in Jesum."
      en: "Then Paul said: John baptized the people with the baptism of penance, saying: That they should believe in him who was to come after him, that is to say, in Jesus."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "His audítis, baptizáti sunt in nómine Dómini Jesu."
      en: "Having heard these things, they were baptized in the name of the Lord Jesus."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et cum imposuísset illis manus Paulus, venit Spíritus Sanctus super eos, et loquebántur linguis, et prophetábant."
      en: "And when Paul had imposed his hands on them, the Holy Ghost came upon them, and they spoke with tongues, and prophesied."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Erant autem omnes viri fere duódecim."
      en: "And all the men were about twelve."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Introgréssus autem synagógam, cum fidúcia loquebátur per tres menses, dísputans et suádens de regno Dei."
      en: "And entering into the synagogue, he spoke boldly for the space of three months, disputing and exhorting concerning the kingdom of God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Cum autem quidam induraréntur, et non créderent, maledicéntes viam Dómini coram multitúdine, discédens ab eis, segregávit discípulos, quotídie dísputans in schola tyránni cujúsdam."
      en: "But when some were hardened, and believed not, speaking evil of the way of the Lord before the multitude, departing from them, he separated the disciples, disputing daily in the school of one Tyrannus."
    status: { la: verified, en: verified }
