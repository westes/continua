# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1par
chapter: 3
verses:
  - n: 1
    text:
      la: "David vero hos habuit filios qui ei nati sunt in Hebron primogenitum Amnon ex Achinaam Iezrahelitide secundum Danihel de Abigail Carmelitide"
      en: "Now these were the sons of David that were born to him in Hebron: the firstborn Amnon of Achinoam the Jezrahelitess, the second Daniel of Abigail the Carmelitess."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tertium Absalom filium Maacha filiae Tholmei regis Gessur quartum Adoniam filium Aggith"
      en: "The third Absalom the son of Maacha the daughter of Tolmai king of Gessur, the fourth Adonias the son of Aggith,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quintum Saphatiam ex Abital sextum Iethraam de Egla uxore sua"
      en: "The fifth Saphatias of Abital, the sixth Jethrahem of Egla, his wife."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sex ergo nati sunt ei in Hebron ubi regnavit septem annis et sex mensibus triginta autem et tribus annis regnavit in Hierusalem"
      en: "So six sons were born to him in Hebron, where he reigned seven years and six months. And in Jerusalem he reigned three and thirty years."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "porro in Hierusalem nati sunt ei filii Samaa et Sobab et Nathan et Salomon quattuor de Bethsabee filia Amihel"
      en: "And these sons were born to him in Jerusalem: Simmaa, and Sobab, and Nathan, and Solomon, four of Bethsabee the daughter of Ammiel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Iebaar quoque et Elisama"
      en: "Jebaar also and Elisama,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et Eliphalet et Noge et Napheg et Iaphie"
      en: "And Eliphaleeh, and Noge, and Nepheg, and Japhia,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "necnon Elisama et Heliade et Eliphalet novem"
      en: "And Elisama, and Eliada, and Elipheleth, nine:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "omnes hii filii David absque filiis concubinarum habuerunt sororem Thamar"
      en: "All these the sons of David, beside the sons of the concubines: and they had a sister Thamar."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "filius autem Salomonis Roboam cuius Abia filius genuit Asa de hoc quoque natus est Iosaphat"
      en: "And Solomon's son was Roboam: whose son Abia beget Asa. And his son was Josaphat,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "pater Ioram qui Ioram genuit Ohoziam ex quo ortus est Ioas"
      en: "The father of Joram: and Joram be- got Ochozias, of whom was born Joas:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et huius Amasias filius genuit Azariam porro Azariae filius Ioatham"
      en: "And his son Amasias begot Azarias. And Joathan the son of Azarias"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "procreavit Achaz patrem Ezechiae de quo natus est Manasses"
      en: "Beget Achaz, the father of Ezechias, of whom was born Manasses."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sed et Manasses genuit Amon patrem Iosiae"
      en: "And Manasses beget Amen the father of Josias."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "filii autem Iosiae fuerunt primogenitus Iohanan secundus Ioacim tertius Sedecias quartus Sellum"
      en: "And the sons of Josias were, the firstborn Johanan, the second Joakim, the third Sedecias, the fourth Sellum."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "de Ioacim natus est Iechonias et Sedecias"
      en: "Of Joakim was born Jechonias, and Sedecias."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "filii Iechoniae fuerunt Asir Salathihel"
      en: "The sons of Jechonias were Asir, Salathiel,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Melchiram Phadaia Sennaser et Iecemia Sama et Nadabia"
      en: "Melchiram, Phadaia, Senneser and Jecemia, Sama, and Nadabia."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "de Phadaia orti sunt Zorobabel et Semei Zorobabel genuit Mosollam Ananiam et Salomith sororem eorum"
      en: "Of Phadaia were born Zorobabel and Semei. Zorobabel beget Mosollam, Hananias, and Salomith their sister:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Asabamque et Ohol et Barachiam et Asadiam Iosabesed quinque"
      en: "Hasaba also, and Ohol, and Barachias, and Hasadias, Josabhesed, five."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "filius autem Ananiae Phaltias pater Ieseiae cuius filius Raphaia huius quoque filius Arnam de quo natus est Obdia cuius filius fuit Sechenia"
      en: "And the son of Hananias was Phaltias the father of Jeseias, whose son was Raphaia. And his son was Arnan, of whom was born Obdia, whose son was Sechenias."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "filius Secheniae Semeia cuius filii Attus et Iegal et Baria et Naaria et Saphat sex numero"
      en: "The son of Sechenias, was Semeia, whose sons were Hattus, and Jegaal, and Baria, and Naaria, and Saphat, six in number."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "filius Naariae Helioenai et Ezechias et Ezricam tres"
      en: "The sons of Naaria, Elioenai, and Ezechias, and Ezricam, three."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "filii Helioenai Oduia et Heliasub et Pheleia et Accub et Iohanan et Dalaia et Anani septem"
      en: "The sons of Elioenai, Oduia, and Eliasub, and Pheleia, and Accub, and Johanan, and Dalaia, and Anani, seven."
    status: { la: verified, en: verified }
