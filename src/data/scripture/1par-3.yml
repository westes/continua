# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1par
chapter: 3
verses:
  - n: 1
    text:
      la: "David vero hos habuit filios, qui ei nati sunt in Hebron: primogenitum Amnon ex Achinoam Jezrahelitide, secundum Daniel de Abigail Carmelitide,"
      en: "Now these were the sons of David that were born to him in Hebron: the firstborn Amnon of Achinoam the Jezrahelitess, the second Daniel of Abigail the Carmelitess."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tertium Absalom filium Maacha filiae Tholmai regis Gessur, quartum Adoniam filium Aggith,"
      en: "The third Absalom the son of Maacha the daughter of Tolmai king of Gessur, the fourth Adonias the son of Aggith,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quintum Saphathiam ex Abital, sextum Jethraham de Egla uxore sua."
      en: "The fifth Saphatias of Abital, the sixth Jethrahem of Egla, his wife."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Sex ergo nati sunt ei in Hebron, ubi regnavit septem annis et sex mensibus. Triginta autem et tribus annis regnavit in Jerusalem."
      en: "So six sons were born to him in Hebron, where he reigned seven years and six months. And in Jerusalem he reigned three and thirty years."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Porro in Jerusalem nati sunt ei filii, Simmaa, et Sobab, et Nathan, et Salomon, quatuor de Bethsabee filia Ammiel,"
      en: "And these sons were born to him in Jerusalem: Simmaa, and Sobab, and Nathan, and Solomon, four of Bethsabee the daughter of Ammiel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Jebaar quoque et Elisama,"
      en: "Jebaar also and Elisama,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et Eliphaleth, et Noge, et Nepheg, et Japhia,"
      en: "And Eliphaleeh, and Noge, and Nepheg, and Japhia,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "necnon Elisama, et Eliada, et Elipheleth, novem:"
      en: "And Elisama, and Eliada, and Elipheleth, nine:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "omnes hi, filii David absque filiis concubinarum: habueruntque sororem Thamar."
      en: "All these the sons of David, beside the sons of the concubines: and they had a sister Thamar."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Filius autem Salomonis, Roboam: cujus Abia filius genuit Asa. De hoc quoque natus est Josaphat,"
      en: "And Solomon's son was Roboam: whose son Abia beget Asa. And his son was Josaphat,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "pater Joram: qui Joram genuit Ochoziam, ex quo ortus est Joas:"
      en: "The father of Joram: and Joram begot Ochozias, of whom was born Joas:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et hujus Amasias filius genuit Azariam. Porro Azariae filius Joatham"
      en: "And his son Amasias begot Azarias. And Joathan the son of Azarias"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "procreavit Achaz patrem Ezechiae, de quo natus est Manasses."
      en: "Beget Achaz, the father of Ezechias, of whom was born Manasses."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sed et Manasses genuit Amon patrem Josiae."
      en: "And Manasses beget Amen the father of Josias."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Filii autem Josiae fuerunt: primogenitus Johanan, secundus Joakim, tertius Sedecias quartus Sellum."
      en: "And the sons of Josias were, the firstborn Johanan, the second Joakim, the third Sedecias, the fourth Sellum."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "De Joakim natus est Jechonias, et Sedecias."
      en: "Of Joakim was born Jechonias, and Sedecias."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Filii Jechoniae fuerunt: Asir, Salathiel,"
      en: "The sons of Jechonias were Asir, Salathiel,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Melchiram, Phadaia, Senneser, et Jecemia, Sama, et Nadabia."
      en: "Melchiram, Phadaia, Senneser and Jecemia, Sama, and Nadabia."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "De Phadaia orti sunt Zorobabel et Semei. Zorobabel genuit Mosollam, Hananiam, et Salomith sororem eorum:"
      en: "Of Phadaia were born Zorobabel and Semei. Zorobabel beget Mosollam, Hananias, and Salomith their sister:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Hasaban quoque, et Ohol, et Barachian, et Hasadian, Josabhesed, quinque."
      en: "Hasaba also, and Ohol, and Barachias, and Hasadias, Josabhesed, five."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Filius autem Hananiae, Phaltias pater Jeseiae, cujus filius Raphaia: hujus quoque filius, Arnan, de quo natus est Obdia, cujus filius fuit Sechenias."
      en: "And the son of Hananias was Phaltias the father of Jeseias, whose son was Raphaia. And his son was Arnan, of whom was born Obdia, whose son was Sechenias."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Filius Secheniae, Semeia: cujus filii Hattus, et Jegaal, et Baria, et Naaria, et Saphat, sex numero."
      en: "The son of Sechenias, was Semeia, whose sons were Hattus, and Jegaal, and Baria, and Naaria, and Saphat, six in number."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Filius Naariae, Elioenai, et Ezechias, et Ezricam, tres."
      en: "The sons of Naaria, Elioenai, and Ezechias, and Ezricam, three."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Filii Elioenai, Oduia, et Eliasub, et Pheleia, et Accub, et Johanan, et Dalaia, et Anani, septem."
      en: "The sons of Elioenai, Oduia, and Eliasub, and Pheleia, and Accub, and Johanan, and Dalaia, and Anani, seven."
    status: { la: verified, en: verified }
