# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: prov
chapter: 19
verses:
  - n: 1
    text:
      la: "melior est pauper qui ambulat in simplicitate sua quam torquens labia insipiens"
      en: "Better is the poor man, that walketh in his simplicity, than a rich man that is perverse in his lips, and unwise."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ubi non est scientia animae non est bonum et qui festinus est pedibus offendit"
      en: "Where there is no knowledge of the soul, there is no good: and he that is hasty with his feet shall stumble."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "stultitia hominis subplantat gressus eius et contra Deum fervet animo suo"
      en: "The folly of a man supplanteth his seeps: and he fretteth in his mind against God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "divitiae addunt amicos plurimos a paupere autem et hii quos habuit separantur"
      en: "Riches make many friends: but from the poor man, even they whom he had, depart."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "testis falsus non erit inpunitus et qui mendacia loquitur non effugiet"
      en: "A false witness shall not be unpunished: and he that speaketh lies shall not escape."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "multi colunt personam potentis et amici sunt dona tribuenti"
      en: "Many honour the person of him that is mighty, and are friends of him that giveth gifts."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "fratres hominis pauperis oderunt eum insuper et amici procul recesserunt ab eo qui tantum verba sectatur nihil habebit"
      en: "The brethren of the poor man hate him: moreover also his friends have departed far from him. He that followeth after words only, shall have nothing."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui autem possessor est mentis diligit animam suam et custos prudentiae inveniet bona"
      en: "But he that possesseth a mind, loveth his own soul, and he that keepeth prudence shall find good things."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "testis falsus non erit inpunitus et qui loquitur mendacia peribit"
      en: "A false witness shall not be unpunished: and he that speaketh lies, shall perish."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "non decent stultum deliciae nec servum dominari principibus"
      en: "Delicacies are not seemly for a fool: nor for a servant to have rule over princes."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "doctrina viri per patientiam noscitur et gloria eius est iniqua praetergredi"
      en: "The learning of a man is known by patience and his glory is to pass over wrongs."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "sicut fremitus leonis ita et regis ira et sicut ros super herbam ita hilaritas eius"
      en: "As the roaring of a lion, so also is the anger of a king: and his cheerfulness as the dew upon the grass."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dolor patris filius stultus et tecta iugiter perstillantia litigiosa mulier"
      en: "A foolish son is the grief of his father: and a wrangling wife is like a roof continually dropping through."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "domus et divitiae dantur a patribus a Domino autem proprie uxor prudens"
      en: "House and riches are given by parents: but a prudent wife is properly from the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "pigredo inmittit soporem et anima dissoluta esuriet"
      en: "Slothfulness casteth into a deep sleep, and an idle soul shall suffer hunger."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "qui custodit mandatum custodit animam suam qui autem neglegit vias suas mortificabitur"
      en: "He that keepeth the commandment, keepeth his own soul: but he that neglecteth his own way, shall die."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "feneratur Domino qui miseretur pauperis et vicissitudinem suam reddet ei"
      en: "He that hath mercy on the poor, lendeth to the Lord: and he will repay him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "erudi filium tuum ne desperes ad interfectionem autem eius ne ponas animam tuam"
      en: "Chastise thy son, despair not: but to the killing of him set not thy soul."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "qui inpatiens est sustinebit damnum et cum rapuerit aliud adponet"
      en: "He that is impatient, shall suffer damage: and when he shall take away he shall add another thing."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "audi consilium et suscipe disciplinam ut sis sapiens in novissimis tuis"
      en: "Hear counsel, and receive instruction, that thou mayst be wise in thy latter end."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "multae cogitationes in corde viri voluntas autem Domini permanebit"
      en: "There are many thoughts in the heart of a man: but the will of the Lord shall stand firm."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "homo indigens misericors est et melior pauper quam vir mendax"
      en: "A needy man is merciful: and better is the poor than the lying man."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "timor Domini ad vitam et in plenitudine commorabitur absque visitatione pessimi"
      en: "The fear of the Lord is unto life: and he shall abide in fulness without being visited with evil."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "abscondit piger manum suam sub ascella nec ad os suum adplicat eam"
      en: "The slothful hideth his hand under his armpit, and will not so much as bring it to his mouth."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "pestilente flagellato stultus sapientior erit sin autem corripueris sapientem intelleget disciplinam"
      en: "The wicked man being; scourged, the fool shall be wiser: but if thou rebuke a wise man he will understand discipline."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "qui adfligit patrem et fugat matrem ignominiosus est et infelix"
      en: "He that afflicteth his father, and chaseth away his mother, is infamous and unhappy."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "non cesses fili audire doctrinam nec ignores sermones scientiae"
      en: "Cease not, O my son, to hear instruction, and be not ignorant of the words of knowledge."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "testis iniquus deridet iudicium et os impiorum devorat iniquitatem"
      en: "An unjust witness scorneth judgment: and the mouth of the wicked devoureth iniquity."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "parata sunt derisoribus iudicia et mallei percutientes stultorum corporibus"
      en: "Judgments are prepared for scorners: and striking hammers for the bodies of fools."
    status: { la: verified, en: verified }
