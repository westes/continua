# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1pet
chapter: 3
verses:
  - n: 1
    text:
      la: "Similiter et mulieres subditae sint viris suis: ut etsi qui non credunt verbo, per mulierem conversationem sine verbo lucrifiant:"
      en: "In like manner also let wives be subject to their husbands: that if any believe not the word, they may be won without the word, by the conversation of the wives."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "considerantes in timore castam conversationem vestram."
      en: "Considering your chaste conversation with fear."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quarum non sit extrinsecus capillatura, aut circumdatio auri, aut indumenti vestimentorum cultus:"
      en: "Whose adorning let it not be the outward plaiting of the hair, or the wearing of gold, or the putting on of apparel:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sed qui absconditus est cordis homo, in incorruptibilitate quieti, et modesti spiritus, qui est in conspectu Dei locuples."
      en: "But the hidden man of the heart in the incorruptibility of a quiet and a meek spirit, which is rich in the sight of God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Sic enim aliquando et sanctae mulieres, sperantes in Deo, ornabant se, subjectae propriis viris."
      en: "For after this manner heretofore the holy women also, who trusted in God, adorned themselves, being in subjection to their own husbands:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Sicut Sara obediebat Abrahae, dominum eum vocans: cujus estis filiae benefacientes, et non pertimentes ullam perturbationem."
      en: "As Sara obeyed Abraham, calling him lord: whose daughters you are, doing well, and not fearing any disturbance."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Viri similiter cohabitantes secundum scientiam, quasi infirmiori vasculo muliebri impartientes honorem, tamquam et cohaeredibus gratiae vitae: ut non impediantur orationes vestrae."
      en: "Ye husbands, likewise dwelling with them according to knowledge, giving honour to the female as to the weaker vessel, and as to the co-heirs of the grace of life: that your prayers be not hindered."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "In fine autem omnes unanimes, compatientes fraternitatis amatores, misericordes, modesti, humiles:"
      en: "And in fine, be ye all of one mind, having compassion one of another, being lovers of the brotherhood, merciful, modest, humble:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "non reddentes malum pro malo, nec maledictum pro maledicto, sed e contrario benedicentes: quia in hoc vocati estis, ut benedictionem haereditate possideatis."
      en: "Not rendering evil for evil, nor railing for railing, but contrariwise, blessing: for unto this are you called, that you may inherit a blessing."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Qui enim vult vitam diligere, et dies videre bonos, coerceat linguam suam a malo, et labia ejus ne loquantur dolum."
      en: "For he that will love life, and see good days, let him refrain his tongue from evil, and his lips that they speak no guile."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Declinet a malo, et faciat bonum: inquirat pacem, et sequatur eam:"
      en: "Let him decline from evil, and do good: let him seek after peace and pursue it:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quia oculi Domini super justos, et aures ejus in preces eorum: vultus autem Domini super facientes mala."
      en: "Because the eyes of the Lord are upon the just, and his ears unto their prayers: but the countenance of the Lord upon them that do evil things."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et quis est qui vobis noceat, si boni aemulatores fueritis?"
      en: "And who is he that can hurt you, if you be zealous of good?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sed et si quid patimini propter justitiam, beati. Timorem autem eorum ne timueritis, et non conturbemini."
      en: "But if also you suffer any thing for justice' sake, blessed are ye. And be not afraid of their fear, and be not troubled."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dominum autem Christum sanctificate in cordibus vestris, parati semper ad satisfactionem omni poscenti vos rationem de ea, quae in vobis est, spe."
      en: "But sanctify the Lord Christ in your hearts, being ready always to satisfy every one that asketh you a reason of that hope which is in you."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sed cum modestia, et timore, conscientiam habentes bonam: ut in eo, quod detrahunt vobis, confundantur, qui calumniantur vestram bonam in Christo conversationem."
      en: "But with modesty and fear, having a good conscience: that whereas they speak evil of you, they may be ashamed who falsely accuse your good conversation in Christ."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Melius est enim benefacientes ( si voluntas Dei velit) pati, quam malefacientes."
      en: "For it is better doing well (if such be the will of God) to suffer, than doing ill."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quia et Christus semel pro peccatis nostris mortuus est, justus pro injustis, ut nos offerret Deo, mortificatus quidem carne, vivificatus autem spiritu."
      en: "Because Christ also died once for our sins, the just for the unjust: that he might offer us to God, being put to death indeed in the flesh, but enlivened in the spirit,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "In quo et his, qui in carcere erant, spiritibus veniens praedicavit:"
      en: "In which also coming he preached to those spirits that were in prison:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "qui increduli fuerant aliquando, quando exspectabant Dei patientiam in diebus Noe, cum fabricaretur arca: in qua pauci, id est octo animae, salvae factae sunt per aquam."
      en: "Which had been some time incredulous, when they waited for the patience of God in the days of Noe, when the ark was a building: wherein a few, that is, eight souls, were saved by water."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quod et vos nunc similis formae salvos fecit baptisma: non carnis depositio sordium, sed conscientiae bonae interrogatio in Deum per resurrectionem Jesu Christi."
      en: "Whereunto baptism being of the like form, now saveth you also: not the putting away of the filth of the flesh, but the examination of a good conscience towards God by the resurrection of Jesus Christ."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Qui est in dextera Dei, deglutiens mortem ut vitae aeternae haeredes efficeremur: profectus in caelum subjectis sibi angelis, et potestatibus, et virtutibus."
      en: "Who is on the right hand of God, swallowing down death, that we might be made heirs of life everlasting: being gone into heaven, the angels and powers and virtues being made subject to him."
    status: { la: verified, en: verified }
