# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 5
verses:
  - n: 1
    text:
      la: "Voca ergo, si est qui tibi respondeat, et ad aliquem sanctorum convertere."
      en: "Call now if there be any that will answer thee, and turn to some of the saints."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Vere stultum interficit iracundia, et parvulum occidit invidia."
      en: "Anger indeed killeth the foolish, and envy slayeth the little one."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ego vidi stultum firma radice; et maledixi pulchritudini ejus statim."
      en: "I have seen a fool with a strong root, and I cursed his beauty immediately."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Longe fient filii ejus a salute, et conterentur in porta, et non erit qui eruat."
      en: "His children shall be far from safety, and shall be destroyed in the gate, and there shall be none to deliver them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cujus messem famelicus comedet, et ipsum rapiet armatus, et bibent sitientes divitias ejus."
      en: "Whose harvest the hungry shall eat, and the armed man shall take him by violence, and the thirsty shall drink up his riches."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Nihil in terra sine causa fit, et de humo non oritur dolor."
      en: "Nothing upon earth is done without a voice cause, and sorrow doth not spring out of the ground."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Homo nascitur ad laborem, et avis ad volatum."
      en: "Man is born to labour and the bird to fly."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quam ob rem ego deprecabor Dominum, et ad Deum ponam eloquium meum,"
      en: "Wherefore I will pray to the Lord, and address my speech to God:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "qui facit magna et inscrutabilia, et mirabilia absque numero;"
      en: "Who doth great things and unsearchable and wonderful things without number:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui dat pluviam super faciem terrae, et irrigat aquis universa;"
      en: "Who giveth rain upon the face of the earth, and watereth all things with waters:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "qui ponit humiles in sublime, et moerentes erigit sospitate;"
      en: "Who setteth up the humble on high, and comforteth with health those that mourn."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "qui dissipat cogitationes malignorum, ne possint implere manus eorum quod coeperant;"
      en: "Who bringeth to nought the designs of the malignant, so that their hands cannot accomplish what they had begun:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui apprehendit sapientes in astutia eorum, et consilium pravorum dissipat."
      en: "Who catcheth the wise in their craftiness, and disappointeth the counsel of the wicked:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Per diem incurrent tenebras, et quasi in nocte, sic palpabunt in meridie."
      en: "They shall meet with darkness in the day, and grope at noonday as in the night."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Porro salvum faciet egenum a gladio oris eorum, et de manu violenti pauperem."
      en: "But he shall save the needy from the sword of their mouth, and the poor from the hand of the violent."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et erit egeno spes; iniquitas autem contrahet os suum."
      en: "And to the needy there shall be hope, but iniquity shall draw in her mouth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Beatus homo qui corripitur a Deo. Increpationem ergo Domini ne reprobes;"
      en: "Blessed is the man whom God correcteth: refuse not therefore the chastising of the lord:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quia ipse vulnerat, et medetur; percutit, et manus ejus sanabunt."
      en: "For he woundeth, and cureth: he striketh, and his hands shall heal."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "In sex tribulationibus liberabit te, et in septima non tangent te malum."
      en: "In six troubles he shall deliver thee, and in the seventh, evil shall not touch thee."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "In fame eruet te de morte, et in bello de manu gladii."
      en: "In famine he shall deliver thee from death: and in battle, from the hand of the sword."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "A flagello linguae absconderis, et non timebis calamitatem cum venerit."
      en: "Thou shalt be hidden from the scourge of the tongue: and thou shalt not fear calamity when it cometh."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "In vastitate et fame ridebis, et bestias terrae non formidabis."
      en: "In destruction and famine then shalt laugh: and thou shalt not be afraid of the beasts of the earth."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Sed cum lapidibus regionum pactum tuum, et bestiae terrae pacificae erunt tibi."
      en: "But thou shalt have a covenant with the stones of the lands, and the beasts of the earth shall be at peace with thee."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et scies quod pacem habeat tabernaculum tuum; et visitans speciem tuam, non peccabis."
      en: "And thou shalt know that thy tabernacle is in peace, and visiting thy beauty thou shalt not sin."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Scies quoque quoniam multiplex erit semen tuum, et progenies tua quasi herba terrae."
      en: "Thou shalt know also that thy seed shall be multiplied, and thy offspring like the grass of the earth."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Ingredieris in abundantia sepulchrum, sicut infertur acervus tritici in tempore suo."
      en: "Thou shalt enter into the grave in abundance, as a heap of wheat is brought in its season."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ecce hoc, ut investigavimus, ita est. Quod auditum, mente pertracta."
      en: "Behold, this is even so, as we have searched out: which thou having heard, consider it thoroughly in thy mind."
    status: { la: verified, en: verified }
