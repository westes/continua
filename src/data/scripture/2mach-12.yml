# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2mach
chapter: 12
verses:
  - n: 1
    text:
      la: "his factis pactionibus Lysias pergebat ad regem Iudaei autem agriculturae operam dabant"
      en: "When these covenants were made, Lyslas went to the king, and the Jews gave themselves to husbandry."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sed hii qui resederant Timotheus et Apollonius gehennae filius sed et Hieronimus et Demofon super hos et Nicanor cypriarches non sinebant eos in silentio agere et quiete"
      en: "But they that were behind, namely, Timotheus and Apollonius the son of Genneus, also Hieronymus, and Demophon, and besides them Nicanor the governor of Cyprus, would not suffer them to live in peace, and to be quiet."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ioppitae vero tale quoddam flagitium perpetrarunt rogaverunt Iudaeos cum quibus habitabant ascendere scaphas quas paraverant cum uxoribus et filiis quasi nullis inimicitiis inter eos subiacentibus"
      en: "The men of Joppe also were guilty of this kind of wickedness: they desired the Jews who dwelt among them to go with their wives and children into the boats, which they had prepared, as though they had no enmity to them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "secundum communem itaque decretum civitatis et ipsis adquiescentibus pacisque causa nihil suspectum habentibus cum in altum processissent submerserunt non minus ducentos"
      en: "Which when they had consented to, according to the common decree of the city, suspecting nothing, because of the peace : when they were gone forth into the deep, they drowned no fewer than two hundred of them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quam crudelitatem Iudas in suae gentis homines factam ut cognovit praecepit viris qui erant cum ipso et invocato iusto iudice Deo"
      en: "But as soon as Judas heard of this cruelty done to his countrymen, he commanded the men that were with him: and after having called upon God the just judge,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "venit adversus interfectores fratrum et portum quidem noctu succendit scaphas exusit eos autem qui ab igne refugerant gladio peremit"
      en: "He came against those murderers of his brethren, and set the haven on fire in the night, burnt the boats, and slew with the sword them that escaped from the fire."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et cum haec ita egisset discessit quasi iterum reversurus et universos Ioppitas eradicaturus"
      en: "And when he had done these things in this manner, he departed as if he would return again, and root out all the Joppites."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sed cum cognovisset et eos qui erant Iamniae velle pari modo facere habitantibus secum Iudaeis"
      en: "But when he understood that the men of Jamnia also designed to do in like manner to the Jews that dwelt among them,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Iamnitis quoque nocte supervenit et portum cum navibus succendit ita ut lumen ignis pareret Hierosolymis ab stadiis ducentis quadraginta"
      en: "He came upon the Jamnites also by night, end set the haven on fire with the ships, so that the light of the fire was seen at Jerusalem two hundred and forty furlongs off."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "inde cum abissent novem stadiis et iter facerent ad Timotheum commiserunt cum eo Arabes quinque milia viri et equites quingenti"
      en: "And when they were now gone from thence nine furlongs, and were marching towards Timotheus, five thousand footmen and Ave hundred horsemen of the Arabians set upon them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cumque pugna valida fieret et auxilio Dei prospere cessisset residui victi Arabes petebant a Iuda dextras sibi dari promittentes pascua daturos et in ceteris profuturos"
      en: "And after a hard fight, in which by the help of God they got the victory, the rest of the Arabians being overcome, besought Judas for peace, promising to give him pastures, and to assist him in other things."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Iudas autem arbitratus vere in multis eos utiles promisit pacem dextrisque acceptis discessere ad tabernacula sua"
      en: "And Judas thinking that they might be profitable indeed in many things, promised them peace, and after having joined hands, they departed to their tents."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "adgressus est autem et civitatem quandam firmam pontibus murisque circumseptam quae a turbis habitabatur gentium promiscuarum cui nomen Caspin"
      en: "He also laid siege to a certain strong city, encompassed with bridges and walls, and inhabited by multitudes of different nations, the name of which is Casphin."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "hii vero qui intus erant confidentes in stabilitate murorum et adparatu alimoniarum remissius agebant maledictis lacessentes Iudam ac blasphemantes et loquentes quae fas non est"
      en: "But they that were within it, trusting in the strength of the walls, and the provision of victuals, behaved in a more negligent manner, and provoked Judas with railing and blaspheming, and uttering such words as were not to be spoken."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Macchabeus autem invocato magno mundi principe qui sine arietibus et machinis temporibus Iesu praecipitavit Hiericho inruit ferociter muris"
      en: "But Machabeus calling upon the great Lord of the world, who without any rams or engines of war threw down the walls of Jericho in the time of Josue, fiercely assaulted the walls."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et capta civitate per Domini voluntatem inenarrabiles caedes fecit ita ut adiacens stagnum stadiorum duo latitudinis sanguine infectum fluere videretur"
      en: "And having taken the city by the will of the Lord, he made an unspeakable slaughter, so that a pool adjoining of two furlongs broad seemed to run with the blood of the slain."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "inde discesserunt stadia septingenta quinquaginta et venerunt in Characa ad eos qui dicuntur Tubianei Iudaeos"
      en: "From thence they departed seven hundred and fifty furlongs, and came to Characa to the Jews that are called Tubianites."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et Timotheum quidem in illis locis conprehenderunt nulloque negotio perfecto regressus est relicto in quodam loco firmissimo praesidio"
      en: "But as for Timotheus, they found him not in those places, for before he had dispatched any thing he went back, having left a very strong garrison in a certain hold :"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dositheus autem et Sosipater qui erant duces cum Macchabeo peremerunt a Timotheo relictos in praesidio decem milia viros"
      en: "But Dositheus, and Sosipater, who were captains with Machabeus, slew them that were left by Timotheus in the hold, to the number of ten thousand men."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "at Macchabeus ordinatis circum se sex milibus et constitutis per cohortes adversus Timotheum processit habentem secum centum viginti milia peditum equitumque duo milia quingentos"
      en: "And Machabeus having set in order about him six thousand men, and divided them by bands, went forth against Timetheus, who had with him a hundred and twenty thousand footmen, and two thousand five hundred horsemen."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "cognito autem Iudae adventu Timotheus praemisit mulieres et filios et reliquum adparatum in praesidium quod Carnion dicitur erat enim inexpugnabile et accessu difficile propter locorum angustias"
      en: "Now when Timotheus had knowledge of the coming of Judas, he sent the women and children, and the other baggage before him into a fortress, called Carnion: for it was impregnable and hard to come at, by reason of the straitness of the places."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "cumque cohors Iudae prima apparuisset timor hostibus incussus est ex praesentia Dei qui universa conspicit et in fugam versi sunt alius alio ita ut magis a suis deicerentur et gladiorum suorum ictibus debilitarentur"
      en: "But when the first band of Judas came in sight, the enemies were struck with fear, by the presence of God, who seeth all things, and they were put to flight one from another, so that they were often thrown down by their own companions, and wounded with the strokes of their own swords."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Iudas autem vehementer instabat puniens profanos et prostravit ex eis triginta milia virorum"
      en: "But Judas was vehemently earnest in punishing the profane, of whom he slew thirty thousand men."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ipse vero Timotheus incidit in partes Dosithei et Sosipatri et multis precibus postulabat ut vivus dimitteretur eo quod multorum ex Iudaeis parentes haberet ac fratres quos morte eius decipi eveniret"
      en: "And Timotheus himself fell into the hands of the band of Dositheus and Sosipater, and with many prayers he besought them to let him go with his life, because he had the parents and brethren of many of the Jews, who, by his death, might happen to be deceived."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et cum fidem dedisset restituturum se eos secundum constitutum inlaesum eum dimiserunt propter fratrum salutem"
      en: "And when he had given his faith that he would restore them according to the agreement, they let him go without hurt, for the saving of their brethren."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Iudas autem egressus est a Carnio interfectis viginti quinque milibus"
      en: "Then Judas went away to Carnion, where he slew five and twenty thousand persons."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "post horum fugam et necem movit exercitum ad Efron civitatem munitam in qua multitudo diversarum gentium habitabat et robusti iuvenes pro muris consistentes fortiter repugnabant in hac autem machinae multae et telorum erat adparatus"
      en: "And after he had put to flight and destroyed these, he removed his army to Ephron, a strong city, wherein there dwelt a multitude of divers nations: and stout young men standing upon the walls made a vigorous resistance: and in this place there were many engines of war, and a provision of darts."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "sed cum Omnipotentem invocassent qui potestate vires hostium confregit ceperunt civitatem et ex eis qui intus erant viginti quinque milia prostraverunt"
      en: "But when they had invocated the Almighty, who with his power breaketh the strength of the enemies, they took the city; and slew five and twenty thou- sand of them that were within."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "inde ad civitatem Scytarum abierunt quae ab Hierosolymis sescentis stadiis aberat"
      en: "From thence they departed to Scythopolis, which lieth six hundred furlongs from Jerusalem."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "contestantibus autem his qui apud Scytopolitas erant Iudaeis quod benigne ab eis haberentur etiam temporibus infelicitatis quod modeste secum egerint"
      en: "But the Jews that were among the Scythopolitans testifying that they were used kindly by them, and that even in the times of their adversity they had treated them with humanity:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "gratias agentes eis exhortati etiam de cetero erga genus suum benignos esse venerunt Hierosolymam die sollemni septimanarum instante"
      en: "They gave them thanks exhorting them to be still friendly to their nation, and so they came to Jerusalem, the feast of the weeks being at hand."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et post pentecosten abierunt contra Gorgiam praepositum Idumeae"
      en: "And after Pentecost they marched against Gorgias the governor of Idumea."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "exivit autem cum peditibus tribus milibus et equitibus quadringentis"
      en: "And he came out with three thousand footmen, and four hundred horsemen."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "quibus congressis contigit paucos ruere Iudaeorum"
      en: "And when they had joined battle, it happened that a few of the Jews were slain."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Dositheus vero quidam de Bachenoris eques vir fortis Gorgiam tenebat et cum vellet illum capere vivum eques quidam de Thracibus inruit in eum umerumque eius amputavit atque ita Gorgias effugit in Marisa"
      en: "But Dositheus, a horseman, one of Bacenor's band, a valiant man, took hold of Gorgias: and when he would have taken him alive, a certain horseman of the Thracians came upon him, and cut off his shoulder: and so Gorgias escaped to Maresa."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "at illis qui cum Esdrin erant diutius pugnantibus et fatigatis invocavit Dominum Iudas adiutorem et ducem belli fieri"
      en: "But when they that were with Esdrin had fought long, and were weary, Judas called upon the Lord to be their helper, and leader of the battle:"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "incipiens voce patria et cum hymnis clamorem extollens fugam Gorgiae militibus incussit"
      en: "Then beginning in his own language, and singing hymns with a loud voice, he put Gorgias' soldiers to flight."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Iudas autem collecto exercitu venit in civitatem Odollam et cum septima dies superveniret secundum consuetudinem purificati in eodem loco sabbatum egerunt"
      en: "So Judas having gathered together his army, came into the city Odollam: and when the seventh day came, they purified themselves according to the custom, and kept the sabbath in the place."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et sequenti die venit cum suis Iudas ut corpora prostratorum tolleret et cum parentibus poneret in sepulchris paternis"
      en: "And the day following Judas cam with his company, to take away the bodies of them that were slain, and to bury them with their kinsmen, in the sepulchres of their fathers."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "invenerunt autem sub tunicis interfectorum de donariis idolorum quae apud Iamnian fuerunt a quibus lex prohibet Iudaeos omnibus ergo manifestum factum est ob hanc causam eos corruisse"
      en: "And they found under the coats o the slain some of the donaries of the idols of Jamnia, which the law forbiddeth the Jews:"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "omnes itaque benedixerunt iustum iudicium Domini qui occulta fecerit manifesta"
      en: "Then they all blessed the just judgment of the Lord, who had discovered the things that were hidden."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "atque ita ad preces conversi rogaverunt ut id quod factum erat delictum obliteraretur at vero fortissimus Iudas hortabatur populum conservare se sine peccato sub oculis videntes quae facta sint pro peccato eorum qui prostrati sunt"
      en: "And so betaking themselves to prayers, they besought him, that the sin which had been committed might be forgotten. But the most valiant Judas exhorted the people to keep themselves from sin, forasmuch as they saw before their eyes what had happened, because of the sins of those that were slain."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et facta conlatione duodecim milia dragmas argenti misit Hierosolymam offerri pro peccato sacrificium bene et religiose de resurrectione cogitans"
      en: "And making a gathering, he twelve thousand drachms of silver to Jerusalem for sacrifice to be offered for the sins of the dead, thinking well and religiously concerning the resurrection,"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "nisi enim eos qui ceciderant resurrecturos speraret superfluum videretur et vanum orare pro mortuis"
      en: "(For if he had not hoped that the that were slain should rise again, it would have seemed superfluous and vain to pray for the dead,)"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et quia considerabat quod hii qui cum pietate dormitionem acceperant optimam haberent repositam gratiam"
      en: "And because he considered that the who had fallen asleep with godliness, had great grace laid up for them."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "sancta ergo et salubris cogitatio pro defunctis exorare ut a peccato solverentur"
      en: "It is therefore a holy and wholesome thought to pray for the dead, that they may be loosed from sins."
    status: { la: verified, en: verified }
