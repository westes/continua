# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 25
verses:
  - n: 1
    text:
      la: "Morabatur autem eo tempore Israel in Settim, et fornicatus est populus cum filiabus Moab,"
      en: "And Israel at that time abode in Settim, and the people committed fornication with the daughters of Moab,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quae vocaverunt eos ad sacrificia sua. At ille comederunt et adoraverunt deos earum."
      en: "Who called them to their sacrifices. And they ate of them, and adored their gods."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Initiatusque est Israel Beelphegor: et iratus Dominus,"
      en: "And Israel was initiated to Beelphegor: upon which the Lord being angry,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ait ad Moysen: Tolle cunctos principes populi, et suspende eos contra solem in patibulis, ut avertatur furor meus ab Israel."
      en: "Said to Moses: Take all the princes of the people, and hang them up on gibbets against the sun: that my fury may be turned away from Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dixitque Moyses ad judices Israel: Occidat unusquisque proximos suos, qui initiati sunt Beelphegor."
      en: "And Moses said to the judges of Israel: Let every man kill his neighbours, that have been initiated to Beelphegor."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et ecce unus de filiis Israel intravit coram fratribus suis ad scortum Madianitidem, vidente Moyse, et omni turba filiorum Israel, qui flebant ante fores tabernaculi."
      en: "And behold one of the children of Israel went in before his brethren to a harlot of Madian, in the sight of Moses, and of all the children of Israel, who were weeping before the door of the tabernacle."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quod cum vidisset Phinees filius Eleazari filii Aaron sacerdotis, surrexit de medio multitudinis, et arrepto pugione,"
      en: "And when Phinees the son of Eleazar the son of Aaron the priest saw it, he rose up from the midst; of the multitude, and taking a dagger,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ingressus est post virum Israelitem in lupanar, et perfodit ambos simul, virum scilicet et mulierem in locis genitalibus. Cessavitque plaga a filiis Israel:"
      en: "Went in after the Israelite into the brothel house, and thrust both of them through together, to wit, the man and the woman in the genital parts. And the scourge ceased from the children of Israel:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et occisi sunt viginti quatuor millia hominum."
      en: "And there were slain four and twenty thousand men."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dixitque Dominus ad Moysen:"
      en: "And the Lord said to Moses:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Phinees filius Eleazari filii Aaron sacerdotis avertit iram meam a filiis Israel: quia zelo meo commotus est contra eos, ut non ipse delerem filios Israel in zelo meo."
      en: "Phinees the son of Eleazar the son of Aaron the priest, hath turned away my wrath from the children of Israel: because he was moved with my zeal against them, that I myself might not destroy the children of Israel in my zeal."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Idcirco loquere ad eum: Ecce do ei pacem foederis mei,"
      en: "Therefore say to him: Behold I give him the peace of my covenant,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et erit tam ipsi quam semini ejus pactum sacerdotii sempiternum: quia zelatus est pro Deo suo, et expiavit scelus filiorum Israel."
      en: "And the covenant of the priesthood for ever shall be both to him and his seed, because he hath been zealous for his God, and hath made atonement for the wickedness of the children of Israel."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Erat autem nomen viri Israelitae, qui occisus est cum Madianitide, Zambri filius Salu, dux de cognatione et tribu Simeonis."
      en: "And the name of the Israelite, that was slain with the woman of Madian, was Zambri the son of Salu, a prince of the kindred and tribe of Simeon."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Porro mulier Madianitis, quae pariter interfecta est, vocabatur Cozbi filia Sur principis nobilissimi Madianitarum."
      en: "And the Madianite woman, that was slain with him, was called Cozbi the daughter of Sur, a most noble prince among the Madianites."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Hostes vos sentiant Madianitae, et percutite eos:"
      en: "Let the Madianites find you enemies, and slay you them:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quia et ipsi hostiliter egerunt contra vos, et decepere insidiis per idolum Phogor, et Cozbi filiam ducis Madian sororem suam, quae percussa est in die plagae pro sacrilegio Phogor."
      en: "Because they also have acted like enemies against you, and have guilefully deceived you by the idol Phogor, and Cozbi their sister, a daughter of a prince of Madian, who was slain in the day the plague for the sacrilege of Phogor."
    status: { la: verified, en: verified }
