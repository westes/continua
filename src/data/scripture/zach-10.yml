# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: zach
chapter: 10
verses:
  - n: 1
    text:
      la: "Petite a Domino pluviam in tempore serotino, et Dominus faciet nives: et pluviam imbris dabit eis, singulis herbam in agro."
      en: "Ask ye of the Lord rain in the latter season, and the Lord will make snows, and will give them showers of rain, to every one grass in the field."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quia simulacra locuta sunt inutile, et divini viderunt mendacium: et somniatores locuti sunt frustra, vane consolabantur: idcirco abducti sunt quasi grex: affligentur, quia non est eis pastor."
      en: "For the idols have spoken what was unprofitable, and the diviners have seen a lie, and the dreamers have spoken vanity: they comforted in vain: therefore they were led away as a flock: they shall be afflicted, because they have no shepherd."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Super pastores iratus est furor meus, et super hircos visitabo: quia visitavit Dominus exercituum gregem suum, domum Juda, et posuit eos quasi equum gloriae suae in bello."
      en: "My wrath is kindled against the shepherds, and I will visit upon the buck goats: for the Lord of hosts hath visited his flock, the house of Juda, and hath made them as the horse of his glory in the battle."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ex ipso angulus, ex ipso paxillus, ex ipso arcus praelii, ex ipso egredietur omnis exactor simul."
      en: "Out of him shall come forth the corner, out of him the pin, out of him the bow of battle, out of him every exacter together."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et erunt quasi fortes conculcantes lutum viarum in praelio, et bellabunt, quia Dominus cum eis: et confundentur ascensores equorum."
      en: "And they shall be as mighty men, treading under foot the mire of the ways in battle: and they shall fight, because the Lord is with them, and the riders of horses shall be confounded."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et confortabo domum Juda, et domum Joseph salvabo: et convertam eos, quia miserebor eorum: et erunt sicut fuerunt quando non projeceram eos: ego enim Dominus Deus eorum, et exaudiam eos."
      en: "And I will strengthen the house of Juda, and save the house of Joseph: and I will bring them back again, because I will have mercy on them: and they shall be as they were when I had cast them off, for I am the Lord their God, and will hear them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et erunt quasi fortes Ephraim, et laetabitur cor eorum quasi a vino: et filii eorum videbunt, et laetabuntur, et exsultabit cor eorum in Domino."
      en: "And they shall be as the valiant men of Ephraim, and their heart shall rejoice as through wine: and their children shall see, and shall rejoice, and their heart shall be joyful in the Lord."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sibilabo eis, et congregabo illos, quia redemi eos: et multiplicabo eos sicut ante fuerant multiplicati."
      en: "I will whistle for them, and I will gather them together, because I have redeemed them: and I will multiply them as they were multiplied before."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et seminabo eos in populis, et de longe recordabuntur mei: et vivent cum filiis suis, et revertentur."
      en: "And I will sow them among peoples: and from afar they shall remember me: and they shall live with their children, and shall return."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et reducam eos de terra Aegypti, et de Assyriis congregabo eos, et ad terram Galaad et Libani adducam eos, et non invenietur eis locus:"
      en: "And I will bring them back out of the land of Egypt, and will gather them from among the Assyrians: and will bring them to the land of Galaad, and Libanus, and place shall not be found for them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et transibit in maris freto, et percutiet in mari fluctus, et confundentur omnia profunda fluminis: et humiliabitur superbia Assur, et sceptrum Aegypti recedet."
      en: "And he shall pass over the strait of the sea, and shall strike the waves in the sea, and all the depths of the river shall be confounded, and the pride of Assyria shall be humbled, and the sceptre of Egypt shall depart."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Confortabo eos in Domino, et in nomine ejus ambulabunt, dicit Dominus."
      en: "I will strengthen them in the Lord, and they shall walk in his name, saith the Lord."
    status: { la: verified, en: verified }
