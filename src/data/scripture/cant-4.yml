# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: cant
chapter: 4
verses:
  - n: 1
    text:
      la: "SPONSUS. Quam pulchra es, amica mea! quam pulchra es! Oculi tui columbarum, absque eo quod intrinsecus latet. Capilli tui sicut greges caprarum quae ascenderunt de monte Galaad."
      en: "How beautiful art thou, my love, how beautiful art thou! thy eyes are doves' eyes, besides what is hid within. Thy hair is as flocks of goats, which Come up from mount Galaad."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dentes tui sicut greges tonsarum quae ascenderunt de lavacro; omnes gemellis foetibus, et sterilis non est inter eas."
      en: "Thy teeth as flocks of sheep, that are shorn which come up from the washing, all with twins, and there is none barren among them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sicut vitta coccinea labia tua, et eloquium tuum dulce. Sicut fragmen mali punici, ita genae tuae, absque eo quod intrinsecus latet."
      en: "Thy lips are as a scarlet lace: and thy speech sweet. Thy cheeks are as a piece of a pomegranate, besides that which lieth hid within."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Sicut turris David collum tuum, quae aedificata est cum propugnaculis; mille clypei pendant ex ea, omnis armatura fortium."
      en: "Thy neck, is as the tower of David, which is built with bulwarks: a thousand bucklers hang upon it, all the armour of valiant men."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Duo ubera tua sicut duo hinnuli, capreae gemelli, qui pascuntur in liliis."
      en: "Thy two breasts like two young roes that are twins, which feed among the lilies."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Donec aspiret dies, et inclinentur umbrae, vadam ad montem myrrhae, et ad collem thuris."
      en: "Till the day break, and the shadows retire, I will go to the mountain of myrrh, and to the hill of frankincense."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Tota pulchra es, amica mea, et macula non est in te."
      en: "Thou art all fair, O my love, and there is not a spot in thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Veni de Libano, sponsa mea: veni de Libano, veni, coronaberis: de capite Amana, de vertice Sanir et Hermon, de cubilibus leonum, de montibus pardorum."
      en: "Come from Libanus, my spouse, come from Libanus, come: thou shalt be crowned from the top of Amana, from the top of Sanir and Hermon, from the dens of the lions, from the mountains of the leopards."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Vulnerasti cor meum, soror mea, sponsa; vulnerasti cor meum in uno oculorum tuorum, et in uno crine colli tui."
      en: "Thou hast wounded my heart, my sister, my spouse, thou hast wounded my heart with one of thy eyes, and with one hair of thy neck."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quam pulchrae sunt mammae tuae, soror mea sponsa! pulchriora sunt ubera tua vino, et odor unguentorum tuorum super omnia aromata."
      en: "How beautiful are thy breasts, my sister, my spouse! thy breasts are more beautiful than wine, and the sweet smell of thy ointments above all aromatical spices."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Favus distillans labia tua, sponsa; mel et lac sub lingua tua: et odor vestimentorum tuorum sicut odor thuris."
      en: "Thy lips, my spouse, are as a dropping honeycomb, honey and milk are under thy tongue; and the smell of thy garments, as the smell of frankincense."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Hortus conclusus soror mea, sponsa, hortus conclusus, fons signatus."
      en: "My sister, my spouse, is a garden enclosed, a garden enclosed, a fountain sealed up."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Emissiones tuae paradisus malorum punicorum, cum pomorum fructibus, cypri cum nardo."
      en: "Thy plants are a paradise of pomegranates with the fruits of the orchard. Cypress with spikenard."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Nardus et crocus, fistula et cinnamomum, cum universis lignis Libani; myrrha et aloe, cum omnibus primis unguentis."
      en: "Spikenard and saffron, sweet cane and cinnamon, with all the trees of Libanus, myrrh and aloes with all the chief perfumes."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Fons hortorum, puteus aquarum viventium, quae fluunt impetu de Libano."
      en: "The fountain of gardens: the well of living waters, which run with a strong stream from Libanus."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "SPONSA. Surge, aquilo, et veni, auster: perfla hortum meum, et fluant aromata illius."
      en: "Arise, O north wind, and come, O south wind, blow through my garden, and let the aromatical spices thereof flow."
    status: { la: verified, en: verified }
