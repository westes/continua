book: ezek
chapter: 10
verses:
  - n: 1
    text:
      la: "et vidi et ecce in firmamento quod erat super caput cherubin quasi lapis sapphyrus quasi species similitudinis solii apparuit super ea"
      en: "And saw and behold in the firmament that was over the heads of the cherubims, there appeared over them as it were the sapphire stone, as the appearance of the likeness of a throne."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et dixit ad virum qui indutus erat lineis et ait ingredere in medio rotarum quae sunt subtus cherub et imple manum tuam prunis ignis quae sunt inter cherubin et effunde super civitatem ingressusque est in conspectu meo"
      en: "And he spoke to the man, that was clothed with linen, and said: Go in between the wheels that are under the cherubims and fill thy hand with the coals of fire that are between the cherubims, and pour them out upon the city. And he went in, in my sight:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cherubin autem stabant a dextris domus cum ingrederetur vir et nubes implevit atrium interius"
      en: "And the cherubims stood on the right side of the house, when the man went in, and a cloud filled the inner court."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et elevata est gloria Domini desuper cherub ad limen domus et repleta est domus nube et atrium repletum est splendore gloriae Domini"
      en: "And the glory of the Lord was lifted up from above the cherub to the threshold of the house: and the house was filled with the cloud, and the court was filled with the brightness of the glory of the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et sonitus alarum cherubin audiebatur usque ad atrium exterius quasi vox Dei omnipotentis loquentis"
      en: "And the sound of the wings of the cherubims was heard even to the out- ward court as the voice of God Almighty speaking."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "cumque praecepisset viro qui indutus erat lineis dicens sume ignem de medio rotarum quae sunt inter cherubin ingressus ille stetit iuxta rotam"
      en: "And when he had commanded the man that was clothed with linen, saying: Take fire from the midst of the wheels that are between the cherubims: he went in and stood beside the wheel,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et extendit cherub manum de medio cherubin ad ignem qui erat inter cherubin et sumpsit et dedit in manus eius qui indutus erat lineis qui accipiens egressus est"
      en: "And one cherub stretched out his arm from the midst of the cherubims to the fire that was between the cherubims: and he took, and put it into the hands of him that was clothed with linen: who took it and went forth."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et apparuit in cherubin similitudo manus hominis subtus pinnas eorum"
      en: "And there appeared in the cherubims the likeness of a man's hand under their wings."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et vidi et ecce quattuor rotae iuxta cherubin rota una iuxta cherub unum et rota alia iuxta cherub unum species autem erat rotarum quasi visio lapidis chrysoliti"
      en: "And I saw, and behold there were four wheels by the cherubims: one wheel by one cherub, and another wheel by an- other cherub: and the appearance of the wheels was to the sight like the chrysolite stone:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et aspectus earum similitudo una quattuor quasi sit rota in medio rotae"
      en: "And as to their appearance, all four were alike: as if a wheel were in the midst of a wheel."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cumque ambularent in quattuor partes gradiebantur non revertebantur ambulantes sed ad locum ad quem ire declinabat quae prima erat sequebantur et ceterae nec convertebantur"
      en: "And when they went, they went by four ways: and they turned not when they went: but to the place whither they first turned, the rest also followed, and did not turn back."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et omne corpus earum et colla et manus et pinnae et circuli plena erant oculis in circuitu quattuor rotarum"
      en: "And their whole body, and their necks, and their hands, and their wings, and the circles were full of eyes, round about the four wheels."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et rotas istas vocavit volubiles audiente me"
      en: "And these wheels he called voluble, in my hearing."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quattuor autem facies habebat unum facies una facies cherub et facies secunda facies hominis et in tertio facies leonis et in quarto facies aquilae"
      en: "And every one had four faces: one face was the face of a cherub, and the second face, the face of a man: and in the third was the face of a lion: and in the fourth the face of an eagle."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et elevata sunt cherubin ipsum est animal quod videram iuxta flumen Chobar"
      en: "And the cherubims were lifted up: this is the living creature that I had seen by the river Chobar."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cumque ambularent cherubin ibant pariter et rotae iuxta ea et cum levarent cherubin alas suas ut exaltarentur de terra non residebant rotae sed et ipsae iuxta erant"
      en: "And when the cherubims went, the wheels also went by them: and when the cherubims lifted up their wings, to mount up from the earth, the wheels stayed not behind, but were by them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "stantibus illis stabant et cum elevatis elevabantur spiritus enim vitae erat in eis"
      en: "When they stood, these stood: and when they were lifted up, these were lifted up: for the spirit of life was in them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et egressa est gloria Domini a limine templi et stetit super cherubin"
      en: "And the glory of the Lord went forth from the threshold of the temple: and stood over the cherubims."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et elevantia cherubin alas suas exaltata sunt a terra coram me et illis egredientibus rotae quoque subsecutae sunt et stetit in introitu portae domus Domini orientalis et gloria Dei Israhel erat super ea"
      en: "And the cherubims lifting up their wings, were raised from the earth before me: and as they went out, the wheels also followed: and it stood in the entry of the east gate of the house of the Lord: and the glory of the God of Israel was over them."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ipsum est animal quod vidi subter Deum Israhel iuxta fluvium Chobar et intellexi quia cherubin essent"
      en: "This is the living creature, which I saw under the God of Israel by the river Chobar: and I understood that they were cherubims."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quattuor per quattuor vultus uni et quattuor alae uni et similitudo manus hominis sub alis eorum"
      en: "Each one had four faces, and each one had four wings: and the likeness of a man's hand was under their wings."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et similitudo vultuum eorum ipsi vultus quos videram iuxta fluvium Chobar et intuitus eorum et impetus singulorum ante faciem suam ingredi"
      en: "And as to the likeness of their faces, they were the same faces which I had seen by the river Chobar, and their looks, and the impulse of every one to go straight forward."
    status: { la: verified, en: verified }
