# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2reg
chapter: 17
verses:
  - n: 1
    text:
      la: "Dixit ergo Achitophel ad Absalom: Eligam mihi duodecim millia virorum, et consurgens persequar David hac nocte."
      en: "And Achitophel said to Absalom: I will choose me twelve thousand men, and I will arise and pursue after David this night."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et irruens super eum ( quippe qui lassus est, et solutis manibus) percutiam eum: cumque fugerit omnis populus qui cum eo est, percutiam regem desolatum."
      en: "And coming upon him (for he is now weary, and weak handed) I will defeat him: and when all the people is put to flight that is with him, I will kill the king who will be left alone."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et reducam universum populum, quomodo unus homo reverti solet: unum enim virum tu quaeris: et omnis populus erit in pace."
      en: "And I will bring back all the people, as if they were but one man: for thou seekest but one man: and all the people shall be in peace."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Placuitque sermo ejus Absalom, et cunctis majoribus natu Israel."
      en: "And his saying pleased Absalom, and all the ancients of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ait autem Absalom: Vocate Chusai Arachiten, et audiamus quid etiam ipse dicat."
      en: "But Absalom said: Call Chusai the Arachite, and let us hear what he also saith."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Cumque venisset Chusai ad Absalom, ait Absalom ad eum: Hujuscemodi sermonem locutus est Achitophel: facere debemus an non? quod das consilium?"
      en: "And when Chusai was come to Absalom, Absalom said to him: Achitophel hath spoken after this manner: shall we do it or not? what counsel dost thou give?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et dixit Chusai ad Absalom: Non est bonum consilium, quod dedit Achitophel hac vice."
      en: "And Chusai said to Absalom: The counsel that Achitophel hath given this time is not good."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et rursum intulit Chusai: Tu nosti patrem tuum, et viros qui cum eo sunt, esse fortissimos et amaro animo, veluti si ursa raptis catulis in saltu saeviat: sed et pater tuus vir bellator est, nec morabitur cum populo."
      en: "And again Chusai said: Thou knowest thy father, and the men that are with him, that they are very valiant, and bitter in their mind, as a bear raging in the wood when her whelps are taken away: and thy father is a warrior, and will not lodge with the people."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Forsitan nunc latitat in foveis, aut in uno, quo voluerit, loco: et cum ceciderit unus quilibet in principio, audiet quicumque audierit, et dicet: Facta est plaga in populo qui sequebatur Absalom."
      en: "Perhaps he now lieth hid in pits, or in some other place where he list: and when any one shall fall at the first, every one that heareth it shall say: There is a slaughter among the people that followed Absalom."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et fortissimus quisque, cujus cor est quasi leonis, pavore solvetur: scit enim omnis populus Israel fortem esse patrem tuum, et robustos omnes qui cum eo sunt."
      en: "And the most valiant man whose heart is as the heart of a lion, shall melt for fear: for all the people of Israel know thy father to be a valiant man, and that all who are with him are valiant."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sed hoc mihi videtur rectum esse consilium. Congregetur ad te universus Israel, a Dan usque Bersabee, quasi arena maris innumerabilis: et tu eris in medio eorum."
      en: "But this seemeth to me to be good counsel: Let all Israel be gathered to thee, from Dan to Bersabee, as the sand of the sea which cannot be numbered: and thou shalt be in the midst of them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et irruemus super eum in quocumque loco inventus fuerit: et operiemus eum, sicut cadere solet ros super terram: et non relinquemus de viris, qui cum eo sunt, ne unum quidem."
      en: "And we shall come upon him in what place soever he shall be found: and we shall cover him, as the dew falleth upon the ground, and we shall not leave of the men that are with him, not so much as one."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quod si urbem aliquam fuerit ingressus, circumdavit omnis Israel civitati illi funes, et trahemus eam in torrentem, ut non reperiatur ne calculus quidem ex ea."
      en: "And if he shall enter into any city, all Israel shall cast ropes round about that city, and we will draw it into the river, so that there shall not be found so much as one small stone thereof."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dixitque Absalom, et omnes viri Israel: Melius est consilium Chusai Arachitae, consilio Achitophel: Domini autem nutu dissipatum est consilium Achitophel utile, ut induceret Dominus super Absalom malum."
      en: "And Absalom, and all the men of Israel said: The counsel of Chusai the Arachite is better than the counsel of Achitophel: and by the will of the Lord the profitable counsel of Achitophel was defeated, that the Lord might bring evil upon Absalom."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et ait Chusai Sadoc et Abiathar sacerdotibus: Hoc et hoc modo consilium dedit Achitophel Absalom, et senioribus Israel: et ego tale et tale dedi consilium."
      en: "And Chusai said to Sadoc and Abiathar the priests: Thus and thus did Achitophel counsel Absalom, and the ancients of Israel: and thus and thus did I counsel them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nunc ergo mittite cito, et nuntiate David dicentes: Ne moreris nocte hac in campestribus deserti, sed absque dilatione transgredere: ne forte absorbeatur rex, et omnis populus qui cum eo est."
      en: "Now therefore send quickly, and tell David, saying: Tarry not this night in the plains of the wilderness, but without delay pass over: lest the king be swallowed up, and all the people that is with him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Jonathas autem et Achimaas stabant juxta fontem Rogel: abiit ancilla et nuntiavit eis: et illi profecti sunt, ut referrent ad regem David nuntium: non enim poterant videri, aut introire civitatem."
      en: "And Jonathan and Achimaas stayed by the fountain Rogel: and there went a maid and told them: and they went forward, to carry the message to king David, for they might not be seen, nor enter into the city."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vidit autem eos quidam puer, et indicavit Absalom: illi vero concito gradu ingressi sunt domum cujusdam viri in Bahurim, qui habebat puteum in vestibulo suo, et descenderunt in eum."
      en: "But a certain boy saw them, and told Absalom: but they making haste went into the house of a certain man in Bahurim, who had a well in his court, and they went down into it."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Tulit autem mulier, et expandit velamen super os putei, quasi siccans ptisanas: et sic latuit res."
      en: "And a woman took, and spread a covering over the mouth of the well, as it were to dry sodden barley: and so the thing was not known."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Cumque venissent servi Absalom in domum, ad mulierem dixerunt: Ubi est Achimaas et Jonathas? Et respondit eis mulier: Transierunt festinanter, gustata paululum aqua. At hi qui quaerebant, cum non reperissent, reversi sunt in Jerusalem."
      en: "And when Absalom's servants were come into the house, they said to the woman: Where is Achimaas and Jonathan? and the woman answered them: They passed on in haste, after they had tasted a little water. But they that sought them, when they found them not, returned into Jerusalem."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Cumque abiissent, ascenderunt illi de puteo, et pergentes nuntiaverunt regi David, et dixerunt: Surgite, et transite cito fluvium: quoniam hujuscemodi dedit consilium contra vos Achitophel."
      en: "And when they were gone, they came up out of the well, and going on told king David, and said: Arise, and pass quickly over the river: for this manner of counsel has Achitophel given against you."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Surrexit ergo David, et omnis populus qui cum eo erat, et transierunt Jordanem, donec dilucesceret: et ne unus quidem residuus fuit, qui non transisset fluvium."
      en: "So David arose, and all the people that were with him, and they passed over the Jordan, until it grew light, and not one of them was left that was not gone over the river."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Porro Achitophel videns quod non fuisset factum consilium suum, stravit asinum suum, surrexitque, et abiit in domum suam et in civitatem suam: et disposita domo sua, suspendio interiit, et sepultus est in sepulchro patris sui."
      en: "But Achitophel seeing that his counsel was not followed, saddled his ass, and arose and went home to his house and to his city, and putting his house in order, hanged himself, and was buried in the sepulchre of his father."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "David autem venit in castra, et Absalom transivit Jordanem, ipse et omnes viri Israel cum eo."
      en: "But David came to the camp, and Absalom passed over the Jordan, he and all the men of Israel with him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Amasam vero constituit Absalom pro Joab super exercitum: Amasa autem erat filius viri, qui vocabatur Jetra de Jezraeli, qui ingressus est ad Abigail, filiam Naas, sororem Sarviae, quae fuit mater Joab."
      en: "Now Absalom appointed Amasa in Joab's stead over the army: and Amasa was the son of a man who was called Jethra of Jezrael, who went in to Abigail the daughter of Naas, the sister of Sarvia who was the mother of Joab."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et castrametatus est Israel cum Absalom in terra Galaad."
      en: "And Israel camped with Absalom in the land of Galaad."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Cumque venisset David in castra, Sobi filius Naas de Rabbath filiorum Ammon, et Machir filius Ammihel de Lodabar, et Berzellai Galaadites de Rogelim,"
      en: "And when David was come to the camp, Sobi the son of Naas of Rabbath of the children of Ammon, and Machir the son of Ammihel of Lodabar, and Berzellai the Galaadite of Rogelim,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "obtulerunt ei stratoria, et tapetia, et vasa fictilia, frumentum, et hordeum, et farinam, et polentam, et fabam, et lentem, et frixum cicer,"
      en: "Brought him beds, and tapestry, and earthen vessels, and wheat, and barley, and meal, and parched corn, and beans, and lentils, and fried pulse,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et mel, et butyrum, oves, et pingues vitulos; dederuntque David, et populo qui cum eo erat, ad vescendum: suspicati enim sunt populum fame et siti fatigari in deserto."
      en: "And honey, and butter, and sheep, and fat calves, and they gave to David and the people that were with him, to eat: for they suspected that the people were faint with hunger and thirst in the wilderness."
    status: { la: verified, en: verified }
