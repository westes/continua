# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: joan
chapter: 11
verses:
  - n: 1
    text:
      la: "erat autem quidam languens Lazarus a Bethania de castello Mariae et Marthae sororis eius"
      en: "Now there was a certain man sick, named Lazarus, of Bethania, of the town of Mary and Martha her sister."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Maria autem erat quae unxit Dominum unguento et extersit pedes eius capillis suis cuius frater Lazarus infirmabatur"
      en: "(And Mary was she that anointed the Lord with ointment, and wiped his feet with her hair: whose brother Lazarus was sick.)"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "miserunt ergo sorores ad eum dicentes Domine ecce quem amas infirmatur"
      en: "His sisters therefore sent to him, saying: Lord, behold, he whom thou lovest is sick."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "audiens autem Iesus dixit eis infirmitas haec non est ad mortem sed pro gloria Dei ut glorificetur Filius Dei per eam"
      en: "And Jesus hearing it, said to them: This sickness is not unto death, but for the glory of God: that the Son of God may be glorified by it."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "diligebat autem Iesus Martham et sororem eius Mariam et Lazarum"
      en: "Now Jesus loved Martha, and her sister Mary, and Lazarus."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ut ergo audivit quia infirmabatur tunc quidem mansit in eodem loco duobus diebus"
      en: "When he had heard therefore that he was sick, he still remained in the same place two days."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "deinde post haec dicit discipulis suis eamus in Iudaeam iterum"
      en: "Then after that, he said to his disciples: Let us go into Judea again."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dicunt ei discipuli rabbi nunc quaerebant te Iudaei lapidare et iterum vadis illuc"
      en: "The disciples say to him: Rabbi, the Jews but now sought to stone thee: and goest thou thither again?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "respondit Iesus nonne duodecim horae sunt diei si quis ambulaverit in die non offendit quia lucem huius mundi videt"
      en: "Jesus answered: Are there not twelve hours of the day? If a man walk in the day, he stumbleth not, because he seeth the light of this world:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "si autem ambulaverit nocte offendit quia lux non est in eo"
      en: "But if he walk in the night, he stumbleth, because the light is not in him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "haec ait et post hoc dicit eis Lazarus amicus noster dormit sed vado ut a somno exsuscitem eum"
      en: "These things he said; and after that he said to them: Lazarus our friend sleepeth; but I go that I may awake him out of sleep."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dixerunt ergo discipuli eius Domine si dormit salvus erit"
      en: "His disciples therefore said: Lord, if he sleep, he shall do well."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixerat autem Iesus de morte eius illi autem putaverunt quia de dormitione somni diceret"
      en: "But Jesus spoke of his death; and they thought that he spoke of the repose of sleep."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "tunc ergo dixit eis Iesus manifeste Lazarus mortuus est"
      en: "Then therefore Jesus said to them plainly: Lazarus is dead."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et gaudeo propter vos ut credatis quoniam non eram ibi sed eamus ad eum"
      en: "And I am glad, for your sakes, that I was not there, that you may believe: but let us go to him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixit ergo Thomas qui dicitur Didymus ad condiscipulos eamus et nos ut moriamur cum eo"
      en: "Thomas therefore, who is called Didymus, said to his fellow disciples: Let us also go, that we may die with him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "venit itaque Iesus et invenit eum quattuor dies iam in monumento habentem"
      en: "Jesus therefore came, and found that he had been four days already in the grave."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "erat autem Bethania iuxta Hierosolyma quasi stadiis quindecim"
      en: "(Now Bethania was near Jerusalem, about fifteen furlongs off.)"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "multi autem ex Iudaeis venerant ad Martham et Mariam ut consolarentur eas de fratre suo"
      en: "And many of the Jews were come to Martha and Mary, to comfort them concerning their brother."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Martha ergo ut audivit quia Iesus venit occurrit illi Maria autem domi sedebat"
      en: "Martha therefore, as soon as she heard that Jesus had come, went to meet him: but Mary sat at home."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "dixit ergo Martha ad Iesum Domine si fuisses hic frater meus non fuisset mortuus"
      en: "Martha therefore said to Jesus: Lord, if thou hadst been here, my brother had not died."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sed et nunc scio quia quaecumque poposceris a Deo dabit tibi Deus"
      en: "But now also I know that whatsoever thou wilt ask of God, God will give it thee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "dicit illi Iesus resurget frater tuus"
      en: "Jesus saith to her: Thy brother shall rise again."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "dicit ei Martha scio quia resurget in resurrectione in novissima die"
      en: "Martha saith to him: I know that he shall rise again, in the resurrection at the last day."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "dixit ei Iesus ego sum resurrectio et vita qui credit in me et si mortuus fuerit vivet"
      en: "Jesus said to her: I am the resurrection and the life: he that believeth in me, although he be dead, shall live:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et omnis qui vivit et credit in me non morietur in aeternum credis hoc"
      en: "And every one that liveth, and believeth in me, shall not die for ever. Believest thou this?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ait illi utique Domine ego credidi quia tu es Christus Filius Dei qui in mundum venisti"
      en: "She saith to him: Yea, Lord, I have believed that thou art Christ the Son of the living God, who art come into this world."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et cum haec dixisset abiit et vocavit Mariam sororem suam silentio dicens magister adest et vocat te"
      en: "And when she had said these things, she went, and called her sister Mary secretly, saying: The master is come, and calleth for thee."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "illa ut audivit surgit cito et venit ad eum"
      en: "She, as soon as she heard this, riseth quickly, and cometh to him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "nondum enim venerat Iesus in castellum sed erat adhuc in illo loco ubi occurrerat ei Martha"
      en: "For Jesus was not yet come into the town: but he was still in that place where Martha had met him."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Iudaei igitur qui erant cum ea in domo et consolabantur eam cum vidissent Mariam quia cito surrexit et exiit secuti sunt eam dicentes quia vadit ad monumentum ut ploret ibi"
      en: "The Jews therefore, who were with her in the house, and comforted her, when they saw Mary that she rose up speedily and went out, followed her, saying: She goeth to the grave to weep there."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Maria ergo cum venisset ubi erat Iesus videns eum cecidit ad pedes eius et dixit ei Domine si fuisses hic non esset mortuus frater meus"
      en: "When Mary therefore was come where Jesus was, seeing him, she fell down at his feet, and saith to him: Lord, if thou hadst been here, my brother had not died."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Iesus ergo ut vidit eam plorantem et Iudaeos qui venerant cum ea plorantes fremuit spiritu et turbavit se ipsum"
      en: "Jesus, therefore, when he saw her weeping, and the Jews that were come with her, weeping, groaned in the spirit, and troubled himself,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et dixit ubi posuistis eum dicunt ei Domine veni et vide"
      en: "And said: Where have you laid him? They say to him: Lord, come and see."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et lacrimatus est Iesus"
      en: "And Jesus wept."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "dixerunt ergo Iudaei ecce quomodo amabat eum"
      en: "The Jews therefore said: Behold how he loved him."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "quidam autem dixerunt ex ipsis non poterat hic qui aperuit oculos caeci facere ut et hic non moreretur"
      en: "But some of them said: Could not he that opened the eyes of the man born blind, have caused that this man should not die?"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Iesus ergo rursum fremens in semet ipso venit ad monumentum erat autem spelunca et lapis superpositus erat ei"
      en: "Jesus therefore again groaning in himself, cometh to the sepulchre. Now it was a cave; and a stone was laid over it."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "ait Iesus tollite lapidem dicit ei Martha soror eius qui mortuus fuerat Domine iam fetet quadriduanus enim est"
      en: "Jesus saith: Take away the stone. Martha, the sister of him that was dead, saith to him: Lord, by this time he stinketh, for he is now of four days."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "dicit ei Iesus nonne dixi tibi quoniam si credideris videbis gloriam Dei"
      en: "Jesus saith to her: Did not I say to thee, that if thou believe, thou shalt see the glory of God?"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "tulerunt ergo lapidem Iesus autem elevatis sursum oculis dixit Pater gratias ago tibi quoniam audisti me"
      en: "They took therefore the stone away. And Jesus lifting up his eyes said: Father, I give thee thanks that thou hast heard me."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "ego autem sciebam quia semper me audis sed propter populum qui circumstat dixi ut credant quia tu me misisti"
      en: "And I knew that thou hearest me always; but because of the people who stand about have I said it, that they may believe that thou hast sent me."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "haec cum dixisset voce magna clamavit Lazare veni foras"
      en: "When he had said these things, he cried with a loud voice: Lazarus, come forth."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et statim prodiit qui fuerat mortuus ligatus pedes et manus institis et facies illius sudario erat ligata dicit Iesus eis solvite eum et sinite abire"
      en: "And presently he that had been dead came forth, bound feet and hands with winding bands; and his face was bound about with a napkin. Jesus said to them: Loose him, and let him go."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "multi ergo ex Iudaeis qui venerant ad Mariam et viderant quae fecit crediderunt in eum"
      en: "Many therefore of the Jews, who were come to Mary and Martha, and had seen the things that Jesus did, believed in him."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "quidam autem ex ipsis abierunt ad Pharisaeos et dixerunt eis quae fecit Iesus"
      en: "But some of them went to the Pharisees, and told them the things that Jesus had done."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "collegerunt ergo pontifices et Pharisaei concilium et dicebant quid facimus quia hic homo multa signa facit"
      en: "The chief priests therefore, and the Pharisees, gathered a council, and said: What do we, for this man doth many miracles?"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "si dimittimus eum sic omnes credent in eum et venient Romani et tollent nostrum et locum et gentem"
      en: "If we let him alone so, all will believe in him; and the Romans will come, and take away our place and nation."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "unus autem ex ipsis Caiaphas cum esset pontifex anni illius dixit eis vos nescitis quicquam"
      en: "But one of them, named Caiphas, being the high priest that year, said to them: You know nothing."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "nec cogitatis quia expedit nobis ut unus moriatur homo pro populo et non tota gens pereat"
      en: "Neither do you consider that it is expedient for you that one man should die for the people, and that the whole nation perish not."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "hoc autem a semet ipso non dixit sed cum esset pontifex anni illius prophetavit quia Iesus moriturus erat pro gente"
      en: "And this he spoke not of himself: but being the high priest of that year, he prophesied that Jesus should die for the nation."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "et non tantum pro gente sed et ut filios Dei qui erant dispersi congregaret in unum"
      en: "And not only for the nation, but to gather together in one the children of God, that were dispersed."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "ab illo ergo die cogitaverunt ut interficerent eum"
      en: "From that day therefore they devised to put him to death."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Iesus ergo iam non in palam ambulabat apud Iudaeos sed abiit in regionem iuxta desertum in civitatem quae dicitur Efrem et ibi morabatur cum discipulis"
      en: "Wherefore Jesus walked no more openly among the Jews; but he went into a country near the desert, unto a city that is called Ephrem, and there he abode with his disciples."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "proximum autem erat pascha Iudaeorum et ascenderunt multi Hierosolyma de regione ante pascha ut sanctificarent se ipsos"
      en: "And the pasch of the Jews was at hand; and many from the country went up to Jerusalem, before the pasch to purify themselves."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "quaerebant ergo Iesum et conloquebantur ad invicem in templo stantes quid putatis quia non veniat ad diem festum"
      en: "They sought therefore for Jesus; and they discoursed one with another, standing in the temple: What think you that he is not come to the festival day? And the chief priests and Pharisees had given a commandment, that if any man knew where he was, he should tell, that they might apprehend him."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "dederant autem pontifices et Pharisaei mandatum ut si quis cognoverit ubi sit indicet ut adprehendant eum"
      en: ""
    status: { la: verified, en: missing }
