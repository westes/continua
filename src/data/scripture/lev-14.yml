# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: lev
chapter: 14
verses:
  - n: 1
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Hic est ritus leprosi, quando mundandus est. Adducetur ad sacerdotem:"
      en: "This is the rite of a leper, when he is to be cleansed: he shall be brought to the priest:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "qui egressus de castris, cum invenerit lepram esse mundatam,"
      en: "Who going out of the camp when he shall find that the leprosy is cleansed,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "praecipiet ei, qui purificatur, ut offerat duos passeres vivos pro se, quibus vesci licitum est, et lignum cedrinum, vermiculumque et hyssopum."
      en: "Shall command him that is to be purified, to offer for himself two living sparrows, which it is lawful to eat, and cedar wood, and scarlet, and hyssop."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et unum ex passeribus immolari jubebit in vase fictili super aquas viventes:"
      en: "And he shall command one of the sparrows to be immolated in an earthen vessel over living waters:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "alium autem vivum cum ligno cedrino, et cocco et hyssopo, tinget in sanguine passeris immolati,"
      en: "But the other that is alive he shall dip, with the cedar wood, and the scarlet and the hyssop, in the blood of the sparrow that is immolated:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quo asperget illum, qui mundandus est, septies, ut jure purgetur: et dimittet passerem vivum, ut in agrum avolet."
      en: "Wherewith he shall sprinkle him that is to be cleansed seven times, that he may be rightly purified: and he shall let go the living sparrow, that it may fly into the field."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cumque laverit homo vestimenta sua, radet omnes pilos corporis, et lavabitur aqua: purificatusque ingredietur castra, ita dumtaxat ut maneat extra tabernaculum suum septem diebus,"
      en: "And when the man hath washed his clothes, he shall shave all the hair of his body, and shall be washed with water: and being purified, he shall enter into the camp, yet so that he tarry without his own tent seven days:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et die septimo radet capillos capitis, barbamque et supercilia, ac totius corporis pilos. Et lotis rursum vestibus et corpore,"
      en: "And on the seventh day he shall shave the hair of his head, and his beard and his eyebrows, and the hair of all his body. And having washed again his clothes, and his body,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "die octavo assumet duos agnos immaculatos, et ovem anniculam absque macula, et tres decimas similae in sacrificium, quae conspersa sit oleo, et seorsum olei sextarium."
      en: "On the eighth day he shall take two lambs without blemish, and an ewe of a year old without blemish, and three tenths of flour tempered with oil for a sacrifice, and a sextary of oil apart."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cumque sacerdos purificans hominem, statuerit eum, et haec omnia coram Domino in ostio tabernaculi testimonii,"
      en: "And when the priest that purifieth the man, hath presented him, and all these things before the Lord, at the door of the tabernacle of the testimony,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tollet agnum et offeret eum pro delicto, oleique sextarium: et oblatis ante Dominum omnibus,"
      en: "He shall take a lamb, and offer it for a trespass offering with the sextary of oil: and having offered all before the Lord,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "immolabit agnum, ubi solet immolari hostia pro peccato, et holocaustum, id est, in loco sancto. Sicut enim pro peccato, ita et pro delicto ad sacerdotem pertinet hostia: Sancta sanctorum est."
      en: "He shall immolate the lamb, where the victim for sin is wont to be immolated, and the holocaust, that is, in the holy place: for as that which is for sin, so also the victim for a trespass offering pertaineth to the priest: it is holy of holies."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Assumensque sacerdos de sanguine hostiae, quae immolata est pro delicto, ponet super extremum auriculae dextrae ejus qui mundatur, et super pollices manus dextrae et pedis:"
      en: "And the priest taking of the blood of the victim that was immolated for trespass, shall put it upon the tip of the right ear of him that is cleansed, and upon the thumb of his right hand and the great toe of his right foot:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et de olei sextario mittet in manum suam sinistram,"
      en: "And he shall pour of the sextary of oil into his own left hand,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tingetque digitum dextrum in eo, et asperget coram Domino septies."
      en: "And shall dip his right finger in it, and sprinkle it before the Lord seven times."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quod autem reliquum est olei in laeva manu, fundet super extremum auriculae dextrae ejus qui mundatur, et super pollices manus ac pedis dextri, et super sanguinem qui effusus est pro delicto,"
      en: "And the rest of the oil in his left hand, he shall pour upon the tip of the right ear of him that is cleansed, and upon the thumb of his right hand and the great toe of his right foot, and upon the blood that was shed for trespass,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et super caput ejus."
      en: "And upon his head."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Rogabitque pro eo coram Domino, et faciet sacrificium pro peccato: tunc immolabit holocaustum,"
      en: "And he shall pray for him before the Lord, and shall offer the sacrifice for sin: then shall he immolate the holocaust,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et ponet illud in altari cum libamentis suis, et homo rite mundabitur."
      en: "And put it on the altar with the libations thereof, and the man shall be rightly cleansed."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quod si pauper est, et non potest manus ejus invenire quae dicta sunt pro delicto, assumet agnum ad oblationem, ut roget pro eo sacerdos, decimamque partem similae conspersae oleo in sacrificium, et olei sextarium,"
      en: "But if he be poor, and his hand cannot find the things aforesaid: he shall take a lamb for an offering for trespass, that the priest may pray for him, and a tenth part of flour tempered with oil for a sacrifice, and a sextary of oil,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "duosque turtures sive duos pullos columbae, quorum unus sit pro peccato, et alter in holocaustum:"
      en: "And two turtles or two young pigeons, of which one may be for sin, and the other for a holocaust:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "offeretque ea die octavo purificationis suae sacerdoti, ad ostium tabernaculi testimonii coram Domino."
      en: "And he shall offer them on the eighth day of his purification to the priest, at the door of the tabernacle of the testimony before the Lord."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Qui suscipiens agnum pro delicto et sextarium olei, levabit simul:"
      en: "And the priest receiving the lamb for trespass, and the sextary of oil, shall elevate them together."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "immolatoque agno, de sanguine ejus ponet super extremum auriculae dextrae illius qui mundatur, et super pollices manus ejus ac pedis dextri:"
      en: "And the lamb being immolated, he shall put of the blood thereof upon the tip of the right ear of him that is cleansed, and upon the thumb of his right hand, and the great toe of his right foot:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "olei vero partem mittet in manum suam sinistram,"
      en: "But he shall pour part of the oil into his own left hand,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "in quo tingens digitum dextrae manus asperget septies coram Domino:"
      en: "And dipping the finger of his right hand in it, he shall sprinkle it seven times before the Lord:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "tangetque extremum dextrae auriculae illius qui mundatur, et pollices manus ac pedis dextri, in loco sanguinis qui effusus est pro delicto:"
      en: "And he shall touch the tip of the right ear of him that is cleansed, and the thumb of his right hand and the great toe of his right foot, in the place of the blood that was shed for trespass."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "reliquam autem partem olei, quae est in sinistra manu, mittet super caput purificati, ut placet pro eo Dominum:"
      en: "And the other part of the oil that is in his left hand, he shall pour upon the head of the purified person, that he may appease the Lord for him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et turturem sive pullum columbae offeret,"
      en: "And he shall offer a turtle, or young pigeon,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "unum pro delicto, et alterum in holocaustum cum libamentis suis."
      en: "One for trespass, and the other for a holocaust, with their libations."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Hoc est sacrificium leprosi, qui habere non potest omnia in emundationem sui."
      en: "This is the sacrifice of a leper, that is not able to have all things that appertain to his cleansing."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Locutusque est Dominus ad Moysen et Aaron, dicens:"
      en: "And the Lord spoke to Moses and Aaron, saying:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Cum ingressi fueritis terram Chanaan, quam ego dabo vobis in possessionem, si fuerit plaga leprae in aedibus,"
      en: "When you shall be come into the land of Chanaan, which I will give you for a possession, if there be the plague of leprosy in a house,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "ibit cujus est domus, nuntians sacerdoti, et dicet: Quasi plaga leprae videtur mihi esse in domo mea."
      en: "He whose house it is, shall go and tell the priest, saying: It seemeth to me, that there is the plague of leprosy in my house,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "At ille praecipiet ut efferant universa de domo, priusquam ingrediatur eam, et videat utrum leprosa sit, ne immunda fiant omnia quae in domo sunt. Intrabitque postea ut consideret lepram domus:"
      en: "And he shall command, that they carry forth all things out of the house, before he go into it, and see whether it have the leprosy, lest all things become unclean that are in the house. And afterwards he shall go in to view the leprosy of the house."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et cum viderit in parietibus illius quasi valliculas pallore sive rubore deformes, et humiliores superficie reliqua,"
      en: "And if he see in the walls thereof as it were little dints, disfigured with paleness or redness, and lower than all the rest,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "egredietur ostium domus, et statim claudet illam septem diebus."
      en: "He shall go out of the door of the house, and forthwith shut it up seven days,"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Reversusque die septimo, considerabit eam: si invenerit crevisse lepram,"
      en: "And returning on the seventh day, he shall look upon it. If he find that the leprosy is spread,"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "jubebit erui lapides in quibus lepra est, et projici eos extra civitatem in locum immundum:"
      en: "He shall command, that the stones wherein the leprosy is, be taken out, and cast without the city into an unclean place:"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "domum autem ipsam radi intrinsecus per circuitum, et spargi pulverem rasurae extra urbem in locum immundum,"
      en: "And that the house be scraped on the inside round about, and the dust of the scraping be scattered without the city into an unclean place:"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "lapidesque alios reponi pro his qui ablati fuerint, et luto alio liniri domum."
      en: "And that other stones be laid in the place of them that were taken away, and the house be plastered with other mortar."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Sin autem postquam eruti sunt lapides, et pulvis erasus, et alia terra lita,"
      en: "But if, after the stones be taken out, and the dust scraped off, and it be plastered with other earth,"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "ingressus sacerdos viderit reversam lepram, et parietes respersos maculis, lepra est perseverans, et immunda domus:"
      en: "The priest going in perceive that the leprosy is returned, and the walls full of spots, it is a lasting leprosy, and the house is unclean:"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "quam statim destruent, et lapides ejus ac ligna, atque universum pulverem projicient extra oppidum in locum immundum."
      en: "And they shall destroy it forthwith, and shall cast the stones and timber thereof, and all the dust without the town into an unclean place."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Qui intraverit domum quando clausa est, immundus erit usque ad vesperum:"
      en: "He that entereth into the house when it is shut, shall be unclean until evening,"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et qui dormierit in ea, et comederit quippiam, lavabit vestimenta sua."
      en: "And he that sleepeth in it, and eateth any thing, shall wash his clothes."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Quod si introiens sacerdos viderit lepram non crevisse in domo, postquam denuo lita fuerit, purificabit eam reddita sanitate:"
      en: "But if the priest going in perceive that the leprosy is not spread in the house, after it was plastered again, he shall purify it, it being cured,"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "et in purificationem ejus sumet duos passeres, lignumque cedrinum, et vermiculum atque hyssopum:"
      en: "And for the purification thereof he shall take two sparrows, and cedar wood, and scarlet, and hyssop:"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "et immolato uno passere in vase fictili super aquas vivas,"
      en: "And having immolated one sparrow In an earthen vessel over living waters,"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "tollet lignum cedrinum, et hyssopum, et coccum, et passerem vivum, et tinget omnia in sanguine passeris immolati, atque in aquis viventibus, et asperget domum septies,"
      en: "He shall take the cedar wood, and the hyssop, and the scarlet, and the living sparrow, and shall dip all in the blood of the sparrow that is immolated, and in the living water, and he shall sprinkle the house seven times:"
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "purificabitque eam tam in sanguine passeris quam in aquis viventibus, et in passere vivo, lignoque cedrino et hyssopo atque vermiculo."
      en: "And shall purify it as well with the blood of the sparrow, as with the living water, and with the living sparrow, and with the cedar wood, and the hyssop, and the scarlet."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Cumque dimiserit passerem avolare in agrum libere, orabit pro domo, et jure mundabitur."
      en: "And when he hath let go the sparrow to fly freely away into the field, he shall pray for the house, and it shall be rightly cleansed."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Ista est lex omnis leprae et percussurae,"
      en: "This is the law of every kind of leprosy and stroke."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "leprae vestium et domorum,"
      en: "Of the leprosy of garments and houses,"
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "cicatricis et erumpentium papularum, lucentis maculae, et in varias species, coloribus immutatis,"
      en: "Of a scar and of blisters breaking out, of a shining spot, and when the colours are diversely changed:"
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "ut possit sciri quo tempore mundum quid, vel immundum sit."
      en: "That it may be known when a thing is clean or unclean."
    status: { la: verified, en: verified }
