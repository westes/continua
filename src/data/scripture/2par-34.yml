# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 34
verses:
  - n: 1
    text:
      la: "octo annorum erat Iosias cum regnare coepisset et triginta et uno annis regnavit in Hierusalem"
      en: "Josias was eight years old when he began to reign, and he reigned one and thirty years in Jerusalem."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fecitque quod erat rectum in conspectu Domini et ambulavit in viis David patris sui non declinavit neque ad dexteram neque ad sinistram"
      en: "And he did that which was right in the sight of the Lord, and walked in the ways of David his father: he declined not, neither to the right hand, nor to the left."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "octavo autem anno regni sui cum adhuc esset puer coepit quaerere Deum patris sui David et duodecimo anno postquam coeperat mundavit Iudam et Hierusalem ab excelsis et lucis simulacrisque et sculptilibus"
      en: "And in the eighth year of his reign, when he was yet a boy, he began to seek the God of his father David: and in the twelfth year after he began to reign, he cleansed Juda and Jerusalem from the high places, and the groves, and the idols, and the graven things."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "destruxeruntque coram eo aras Baalim et simulacra quae superposita fuerant demoliti sunt lucos etiam et sculptilia succidit atque comminuit et super tumulos eorum qui eis immolare consueverant fragmenta dispersit"
      en: "And they broke down before him the altars of Baalim, and demolished the idols that had been set upon them: and be cut down the groves and the graven things, and broke them in pieces: and strewed the fragments upon the graves of them that had sacrificed to them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ossa praeterea sacerdotum conbusit in altaribus idolorum mundavitque Iudam et Hierusalem"
      en: "And he burnt the bones of the priests on the altars of the idols, and he cleansed Juda and Jerusalem."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sed et in urbibus Manasse et Ephraim et Symeon usque Nepthalim cuncta subvertit"
      en: "And in the cities of Manasses, and of Ephraim, and of Simeon, even to Nephtali he demolished all."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "cumque altaria dissipasset et lucos et sculptilia contrivisset in frusta cunctaque delubra demolitus esset de universa terra Israhel reversus est Hierusalem"
      en: "And when he had destroyed the altars, and the groves, and had broken the idols in pieces, and had demolished all profane temples throughout all the land of Israel, he returned to Jerusalem."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "igitur anno octavodecimo regni sui mundata iam terra et templo Domini misit Saphan filium Eseliae et Maasiam principem civitatis et Ioha filium Ioachaz a commentariis ut instaurarent domum Domini Dei sui"
      en: "Now in the eighteenth year of his reign, when he had cleansed the land, and the temple of the Lord, he sent Saphan the son of Eselias, and Maasias the governor of the city, Joha the son of Joachaz the recorder, to repair the house of the Lord his God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "qui venerunt ad Helciam sacerdotem magnum acceptamque ab eo pecuniam quae inlata fuerat in domum Domini et quam congregaverant Levitae ianitores de Manasse et Ephraim et universis reliquiis Israhel ab omni quoque Iuda et Beniamin et habitatoribus Hierusalem"
      en: "And they came to Helcias the high priest: and received of him the money which had been brought into the house of the Lord, and which the Levites and porters had gathered together from Manasses, and Ephraim, and all the remnant of Israel, and from all Juda, and Benjamin, and the inhabitants of Jerusalem,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "tradiderunt in manibus eorum qui praeerant operariis in domo Domini ut instaurarent templum et infirma quaeque sarcirent"
      en: "Which they delivered into the hands of them that were over the workmen in the house of the Lord, to repair the temple, and mend all that was weak."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "at illi dederunt eam artificibus et cementariis ut emerent lapides de lapidicinis et ligna ad commissuras aedificii et ad contignationem domorum quas destruxerant reges Iuda"
      en: "But they gave it to the artificers, and to the masons, to buy stones out of the quarries, and timber for the couplings of the building, and to rafter the houses, which the kings of Juda had destroyed."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "qui fideliter cuncta faciebant erant autem praepositi operantium Iaath et Abdias de filiis Merari Zaccharias et Mosollam de filiis Caath qui urguebant opus omnes Levitae scientes organis canere"
      en: "And they did all faithfully. Now the overseers of the workmen were Jahath and Abdias of the sons of Merari, Zacharias and Mosollam of the sons of Caath, who hastened the work: all Levites skilful to play on instruments."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "super eos vero qui ad varios usus onera portabant erant scribae et magistri de Levitis ianitores"
      en: "But over them that carried burdens for divers uses, were scribes, and masters of the number of the Levites, and porters."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "cumque efferrent pecuniam quae inlata fuerat in templum Domini repperit Helcias sacerdos librum legis Domini per manum Mosi"
      en: "Now when they carried out the money that had been brought into the temple of the Lord, Helcias the priest found the book of the law of the Lord, by the hand of Moses."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ait ad Saphan scribam librum legis inveni in domo Domini et tradidit ei"
      en: "And he said to Saphan the scribe: I have found the book of the law in the house of the Lord: and he delivered it to him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "at ille intulit volumen ad regem et nuntiavit ei dicens omnia quae dedisti in manu servorum tuorum ecce conplentur"
      en: "But he carried the book to the king, and told him, saying: Lo, all that thou hast committed to thy servants, is accomplished."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "argentum quod reppertum est in domo Domini conflaverunt datumque est praefectis artificum et diversa opera fabricantium"
      en: "They have gathered together the silver that was found in the house of the Lord: and it is given to the overseers of the artificers, and of the workmen, for divers works."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "praeterea tradidit mihi Helcias sacerdos hunc librum quem cum rege praesente recitasset"
      en: "Moreover Helcias the priest gave me this book. And he read it before the king."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "audissetque ille verba legis scidit vestimenta sua"
      en: "And when he had heard the words of the law, he rent his garments:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et praecepit Helciae et Ahicam filio Saphan et Abdon filio Micha Saphan quoque scribae et Asaiae servo regis dicens"
      en: "And he commanded Helcias, and Ahicam the son of Saphan, and Abdon the son of Micha, and Saphan the scribe, and Asaa the king's servant, saying:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ite et orate Dominum pro me et pro reliquiis Israhel et Iuda super universis sermonibus libri istius qui reppertus est magnus enim furor Domini stillavit super nos eo quod non custodierint patres nostri verba Domini ut facerent omnia quae scripta sunt in isto volumine"
      en: "Go, and pray to the Lord for me, and for the remnant of Israel, and Juda, concerning all the words of this book, which is found: for the great wrath of the Lord hath fallen upon us, because our fathers have not kept the words of the Lord, to do all things that are written in this book."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "abiit igitur Helcias et hii qui simul a rege missi fuerant ad Holdan propheten uxorem Sellum filii Thecuath filii Hasra custodis vestium quae habitabat Hierusalem in secunda et locuti sunt ei verba quae supra narravimus"
      en: "And Helcias and they that were sent with him by the king, went to Olda the prophetess, the wife of Sellum the son of Thecuath, the son of Hasra keeper of the wardrobe: who dwelt in Jerusalem in the Second part: and they spoke to her the words above mentioned."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "at illa respondit eis haec dicit Dominus Deus Israhel dicite viro qui misit vos ad me"
      en: "And she answered them: Thus saith the Lord the God of Israel: Tell the man that sent you to me:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "haec dicit Dominus ecce ego inducam mala super locum istum et super habitatores eius cunctaque maledicta quae scripta sunt in libro hoc quem legerunt coram rege Iuda"
      en: "Thus saith the Lord: Behold I will bring evils upon this place, and upon the inhabitants thereof, and all the curses that are written in this book which they read before the king of Juda."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quia dereliquerunt me et sacrificaverunt diis alienis ut me ad iracundiam provocarent in cunctis operibus manuum suarum idcirco stillavit furor meus super locum istum et non extinguetur"
      en: "Because they have forsaken me, and have sacrificed to strange gods, to provoke me to wrath with all the works of their hands, therefore my wrath shall fall upon this place, and shall not be quenched."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ad regem autem Iuda qui misit vos pro Domino deprecando sic loquimini haec dicit Dominus Deus Israhel quoniam audisti verba voluminis"
      en: "But as to the king of Juda that sent you to beseech the Lord, thus shall you say to him: Thus saith the Lord the God of Israel: Because thou hast heard the words of this book,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "atque emollitum est cor tuum et humiliatus es in conspectu Dei super his quae dicta sunt contra locum hunc et habitatores Hierusalem reveritusque faciem meam scidisti vestimenta tua et flevisti coram me ego quoque exaudivi te dicit Dominus"
      en: "And thy heart was softened. and thou hast humbled thyself in the sight of God for the things that are spoken against this place, and the inhabitants of Jerusalem, and reverencing my face, hast rent thy garments, and wept before me: I also have heard thee, saith the Lord."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "iam enim colligam te ad patres tuos et infereris in sepulchrum tuum in pace nec videbunt oculi tui omne malum quod ego inducturus sum super locum istum et super habitatores eius rettulerunt itaque regi cuncta quae dixerat"
      en: "For now I will gather thee to thy fathers, and thou shalt be brought to thy tomb in peace: and thy eyes shall not see all the evil that I will bring upon this place, and the inhabitants thereof. They therefore reported to the king all that she had said."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "at ille convocatis universis maioribus natu Iuda et Hierusalem"
      en: "And he called together all the ancients of Juda and Jerusalem."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ascendit domum Domini unaque omnes viri Iuda et habitatores Hierusalem sacerdotes et Levitae et cunctus populus a minimo usque ad maximum quibus audientibus in domo Domini legit rex omnia verba voluminis"
      en: "And went up to the house of the Lord, and all the men of Juda, and the inhabitants of Jerusalem, the priests and the Levites, and all the people from the least to the greatest. And the king read in their hearing, in the house of the Lord, all the words of the book."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et stans in tribunali suo percussit foedus coram Domino ut ambularet post eum et custodiret praecepta et testimonia et iustificationes eius in toto corde suo et in tota anima sua faceretque quae scripta sunt in volumine illo quem legerat"
      en: "And standing up in his tribunal, he made a covenant before the Lord to walk after him, and keep his commandments, and testimonies, and justifications with all his heart, and with all his soul, and to do the things that were written in that book which he had read."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "adiuravit quoque super hoc omnes qui repperti fuerant in Hierusalem et Beniamin et fecerunt habitatores Hierusalem iuxta pactum Domini Dei patrum suorum"
      en: "And he adjured all that were found in Jerusalem and Benjamin to do the same: and the inhabitants of Jerusalem did according to the covenant of the Lord the God of their fathers."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "abstulit ergo Iosias cunctas abominationes de universis regionibus filiorum Israhel et fecit omnes qui residui erant in Israhel servire Domino Deo suo cunctis diebus eius non recesserunt a Domino Deo patrum suorum"
      en: "And Josias took away all the abominations out of all the countries of the children of Israel: and made all that were left in Israel, to serve the Lord their God. As long as he lived they departed not from the Lord the God of their fathers."
    status: { la: verified, en: verified }
