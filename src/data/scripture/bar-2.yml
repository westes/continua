# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: bar
chapter: 2
verses:
  - n: 1
    text:
      la: "Propter quod statuit Dominus Deus noster verbum suum, quod locutus est ad nos, et ad judices nostros qui judicaverunt Israel, et ad reges nostros, et ad principes nostros, et ad omnem Israel et Juda:"
      en: "Wherefore the Lord our God hath made good his word, that he spoke to us, and to our judges that have judged Israel, and to our kings, and to our princes, and to all Israel and Juda:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ut adduceret Dominus super nos mala magna, quae non sunt facta sub caelo quemadmodum facta sunt in Jerusalem, secundum quae scripta sunt in lege Moysi,"
      en: "That the Lord would bring upon us great evils, such as never happened under heaven, as they have come to pass in Jerusalem, according to the things that are written in the law of Moses:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et manducaret homo carnes filii sui et carnes filiae suae."
      en: "That a man should eat the flesh of his own son, and the flesh of his own daughter."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et dedit eos sub manu regum omnium qui sunt in circuitu nostro, in improperium et in desolationem in omnibus populis in quibus nos dispersit Dominus:"
      en: "And he hath delivered them up to be under the hand of all the kings that are round about us, to be a reproach, and desolation among all the people, among whom the Lord hath scattered us."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et facti sumus subtus, et non supra, quia peccavimus Domino Deo nostro, non obaudiendo voci ipsius."
      en: "And we are brought under, and are not uppermost: because we have sinned against the Lord our God, by not obeying his voice."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Domino Deo nostro justitia, nobis autem et patribus nostris confusio faciei, sicut est dies haec:"
      en: "To the Lord our God belongeth justice: but to us, and to our fathers confusion of face, as at this day."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quia locutus est Dominus super nos omnia mala haec quae venerunt super nos:"
      en: "For the Lord hath pronounced against us all these evils that are come upon us:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et non sumus deprecati faciem Domini Dei nostri, ut reverteremur unusquisque nostrum a viis nostris pessimis."
      en: "And we have not entreated the face of the Lord our God, that we might return every one of us from our most wicked ways."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et vigilavit Dominus in malis, et adduxit ea super nos: quia justus est Dominus in omnibus operibus suis quae mandavit nobis,"
      en: "And the Lord hath watched over us for evil, and hath brought it upon us: for the Lord is just in all his works which he hath commanded us:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et non audivimus vocem ipsius ut iremus in praeceptis Domini, quae dedit ante faciem nostram."
      en: "And we have not hearkened to his voice to walk in the commandments of the Lord which he hath set before us."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et nunc, Domine Deus Israel, qui eduxisti populum tuum de terra Aegypti in manu valida, et in signis, et in prodigiis, et in virtute tua magna, et in brachio excelso, et fecisti tibi nomen sicut est dies iste:"
      en: "And now, O Lord God of Israel, who hast brought thy people out of the land of Egypt with a strong hand, and with signs, and with wonders, and with thy great power, and with a mighty arm, and hast made thee a name as at this day,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "peccavimus, impie egimus, inique gessimus, Domine Deus noster, in omnibus justitiis tuis."
      en: "We have sinned, we have done wickedly, we have acted unjustly, O Lord our God, against all thy justices."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Avertatur ira tua a nobis, quia derelicti sumus pauci inter gentes ubi dispersisti nos."
      en: "Let thy wrath be turned away from us: for we are left a few among the nations where thou hast scattered us."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Exaudi, Domine, preces nostras et orationes nostras, et educ nos propter te, et da nobis invenire gratiam ante faciem eorum qui nos abduxerunt:"
      en: "Hear, O Lord, our prayers, and our petitions, and deliver us for thy own sake: and grant that we may find favour in the sight of them that have led us away:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ut sciat omnis terra quia tu es Dominus Deus noster, et quia nomen tuum invocatum est super Israel, et super genus ipsius."
      en: "That all the earth may know that thou art the Lord our God, and that thy name is called upon Israel, and upon his posterity."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Respice, Domine, de domo sancta tua in nos, et inclina aurem tuam, et exaudi nos."
      en: "Look down upon us, O Lord, from thy holy house, and incline thy ear, and hear us."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Aperi oculos tuos et vide: quia non mortui qui sunt in inferno, quorum spiritus acceptus est a visceribus suis, dabunt honorem et justificationem Domino:"
      en: "Open thy eyes, and behold: for the dead that are in hell, whose spirit is taken away from their bowels, shall not give glory and justice to the Lord:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sed anima quae tristis est super magnitudine mali, et incedit curva et infirma, et oculi deficientes, et anima esuriens, dat tibi gloriam et justitiam Domino."
      en: "But the soul that is sorrowful for the greatness of evil she hath done, and goeth bowed down, and feeble, and the eyes that fail, and the hungry soul giveth glory and justice to thee the Lord."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Quia non secundum justitias patrum nostrorum nos fundimus preces et petimus misericordiam ante conspectum tuum, Domine Deus noster:"
      en: "For it is not for the justices of our fathers that we pour out our prayers, and beg mercy in thy sight, O Lord our God:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sed quia misisti iram tuam et furorem tuum super nos, sicut locutus es in manu puerorum tuorum prophetarum, dicens:"
      en: "But because thou hast sent out thy wrath, and thy indignation upon us, as thou hast spoken by the hand of thy servants the prophets, saying:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Sic dicit Dominus: Inclinate humerum vestrum et cervicem vestram, et opera facite regi Babylonis, et sedebitis in terra quam dedi patribus vestris."
      en: "Thus saith the Lord: Bow down your shoulder, and your neck, and serve the king of Babylon: and you shall remain in the land which I have given to your fathers."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Quod si non audieritis vocem Domini Dei vestri, operari regi Babyloniae, defectionem vestram faciam de civitatibus Juda, et a foris Jerusalem,"
      en: "But if you will not hearken to the voice of the Lord your God, to serve the king of Babylon: I will cause you to depart out of the cities of Juda, and from without Jerusalem."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et auferam a vobis vocem jucunditatis et vocem gaudii, et vocem sponsi et vocem sponsae, et erit omnis terra sine vestigio ab inhabitantibus eam."
      en: "And I will take away from you the voice of mirth, and the voice of joy, and the voice of the bridegroom, and the voice of the bride, and all the land shall be without any footstep of inhabitants."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et non audierunt vocem tuam, ut operarentur regi Babylonis: et statuisti verba tua, quae locutus es in manibus puerorum tuorum prophetarum, ut transferrentur ossa regum nostrorum et ossa patrum nostrorum de loco suo:"
      en: "And they hearkened not to thy voice, to serve the king of Babylon: and thou hast made good thy words, which thou spokest by the hands of thy servants the prophets, that the bones of our kings, and the bones of our fathers should be removed out of their place:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et ecce projecta sunt in calore solis et in gelu noctis, et mortui sunt in doloribus pessimis, in fame et in gladio, et in emissione."
      en: "And behold they are cast out to the heat of the sun, and to the frost of the night: and they have died in grievous pains, by famine, and by the sword, and in banishment."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et posuisti templum in quo invocatum est nomen tuum in ipso sicut haec dies, propter iniquitatem domus Israel et domus Juda."
      en: "And thou hast made the temple, in which thy name was called upon, as it is at this day, for the iniquity of the house of Israel, and the house of Juda."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et fecisti in nobis, Domine Deus noster, secundum omnem bonitatem tuam et secundum omnem miserationem tuam illam magnam:"
      en: "And thou hast dealt with us, O Lord our God, according to all thy goodness, and according to all that great mercy of thine:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "sicut locutus es in manu pueri tui Moysi, in die qua praecepisti ei scribere legem tuam coram filiis Israel,"
      en: "As thou spokest by the hand of thy servant Moses, in the day when thou didst command him to write thy law before the children of Israel,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "dicens: Si non audieritis vocem meam, multitudo haec magna convertetur in minimam inter gentes, quo ego eos dispergam:"
      en: "Saying: If you will not hear my voice, this great multitude shall be turned into a very small number among the nations, where I will scatter them:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quia scio quod me non audiet populus: populus est enim dura cervice. Et convertetur ad cor suum in terra captivitatis suae,"
      en: "For I know that the people will not hear me, for they are a people of a stiff neck: but they shall turn to their heart in the land of their captivity:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et scient quia ego sum Dominus Deus eorum: et dabo eis cor, et intelligent; aures, et audient:"
      en: "And they shall know that I am the Lord their God: and I will give them a heart, and they shall understand: and ears, and they shall hear."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et laudabunt me in terra captivitatis suae, et memores erunt nominis mei,"
      en: "And they shall praise me in the land of their captivity, and shall be mindful of my name."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et avertent se a dorso suo duro, et a malignitatibus suis: quia reminiscentur viam patrum suorum, qui peccaverunt in me."
      en: "And they shall turn away themselves from their stiff neck, and from their wicked deeds: for they shall remember the way of their fathers, that sinned against me."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et revocabo illos in terram quam juravi patribus eorum, Abraham, Isaac, et Jacob: et dominabuntur ejus, et multiplicabo eos, et non minorabuntur:"
      en: "And I will bring them back again into the land which I promised with an oath to their fathers, Abraham, Isaac, and Jacob, and they shall be masters thereof: and I will multiply them, and they shall not be diminished."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et statuam illis testamentum alterum sempiternum, ut sim illis in Deum, et ipsi erunt mihi in populum: et non movebo amplius populum meum, filios Israel, a terra quam dedi illis."
      en: "And I will make with them another covenant that shall be everlasting, to be their God, and they shall be my people: and I will no more remove my people, the children of Israel, out of the land that I have given them."
    status: { la: verified, en: verified }
