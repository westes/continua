# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 28
verses:
  - n: 1
    text:
      la: "Dixit quoque Dominus ad Moysen:"
      en: "The Lord also said to Moses:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Praecipe filiis Israel, et dices ad eos: Oblationem meam et panes, et incensum odoris suavissimi offerte per tempora sua."
      en: "Command the children of Israel, and thou shalt say to them: Offer ye my oblation and my bread, and burnt sacrifice of most sweet odour, in their due seasons."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Haec sunt sacrificia quae offerre debetis: agnos anniculos immaculatos duos quotidie in holocaustum sempiternum:"
      en: "These are the sacrifices which you shall offer: Two lambs of a year old without blemish every day for the perpetual holocaust:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "unum offeretis mane, et alterum ad vesperum:"
      en: "One you shall offer in the morning, and the other in the evening:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "decimam partem ephi similae, quae conspersa sit oleo purissimo, et habeat quartam partem hin."
      en: "And the tenth part of an ephi of flour, which shall be tempered with the purest oil, of the measure of the fourth part of a hin."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Holocaustum juge est quod obtulistis in monte Sinai in odorem suavissimum incensi Domini."
      en: "It is the continual holocaust which you offered in mount Sinai for a most sweet odour of a sacrifice by fire to the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et libabitis vini quartam partem hin per agnos singulos in sanctuario Domini."
      en: "And for a libation you shall offer of wine the fourth part of a hin for every lamb in the sanctuary of the Lord."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Alterumque agnum similiter offeretis ad vesperam juxta omnem ritum sacrificii matutini, et libamentorum ejus, oblationem suavissimi odoris Domino."
      en: "And you shall offer the other lamb in like manner in the evening according to all the rites of the morning sacrifice, and of the libations thereof, an oblation of most sweet odour to the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Die autem sabbati offeretis duos agnos anniculos immaculatos, et duas decimas similae oleo conspersae in sacrificio, et liba:"
      en: "And on the sabbath day you shall offer two lambs of a year old without blemish, and two tenths of flour tempered with oil in sacrifice, and the libations,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quae rite funduntur per singula sabbata in holocaustum sempiternum."
      en: "Which regularly are poured out every sabbath for the perpetual holocaust."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "In calendis autem offeretis holocaustum Domino, vitulos de armento duos, arietem unum, agnos anniculos septem immaculatos,"
      en: "And on the first day of the month you shall offer a holocaust to the Lord, two calves of the herd, one ram, and seven lambs of a year old, without blemish,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et tres decimas similae oleo conspersae in sacrificio per singulos vitulos: et duas decimas similae oleo conspersae per singulos arietes:"
      en: "And three tenths of flour tempered with oil in sacrifice for every calf: and two tenths of flour tempered with oil for every ram:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et decimam decimae similae ex oleo in sacrificio per agnos singulos: holocaustum suavissimi odoris atque incensi est Domino."
      en: "And the tenth of a tenth of flour tempered with oil in sacrifice for every lamb. It is a holocaust of most sweet odour and an offering by fire to the Lord."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Libamenta autem vini, quae per singulas fundenda sunt victimas, ista erunt: media pars hin per singulos vitulos, tertia per arietem, quarta per agnum. Hoc erit holocaustum per omnes menses, qui sibi anno vertente succedunt."
      en: "And these shall be the libations of wine that are to be poured out for every victim: Half a hin for every calf, a third for a ram, and a fourth for a lamb. This shall be the holocaust for every month, as they succeed one another in the course of the year."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Hircus quoque offeretur Domino pro peccatis in holocaustum sempiternum cum libamentis suis."
      en: "A buck goat also shall be offered to the Lord for a sin offering over and above the perpetual holocaust with its libations."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Mense autem primo, quartadecima die mensis, Phase Domini erit,"
      en: "And in the first month, on the fourteenth day of the month, shall be the phase of the Lord,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et quintadecima die solemnitas: septem diebus vescentur azymis."
      en: "And on the fifteenth day the solemn feast: seven days shall they eat unleavened bread."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quarum dies prima venerabilis et sancta erit: omne opus servile non facietis in ea."
      en: "And the first day of them shall be venerable and holy: you shall not do any servile work therein."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Offeretisque incensum holocaustum Domino, vitulos de armento duos, arietem unum, agnos anniculos immaculatos septem:"
      en: "And you shall offer a burnt sacrifice a holocaust to the Lord, two calves of the herd, one ram, seven lambs of a year old, without blemish:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et sacrificia singulorum ex simila quae conspersa sit oleo, tres decimas per singulos vitulos, et duas decimas per arietem,"
      en: "And for the sacrifices of every one three tenths of flour which shall be tempered with oil to every calf, and two tenths to every ram,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et decimam decimae per agnos singulos, id est, per septem agnos."
      en: "And the tenth of a tenth, to every lamb, that is to say, to all the seven lambs:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et hircum pro peccato unum, ut expietur pro vobis,"
      en: "And one buck goat for sin, to make atonement for you,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "praeter holocaustum matutinum, quod semper offeretis."
      en: "Besides the morning holocaust which you shall always offer."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ita facietis per singulos dies septem dierum in fomitem ignis, et in odorem suavissimum Domino, qui surget de holocausto, et de libationibus singulorum."
      en: "So shall you do every day of the seven days for the food of the fire, and for a most sweet odour to the Lord, which shall rise from the holocaust, and from the libations of each."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Dies quoque septimus celeberrimus et sanctus erit vobis: omne opus servile non facietis in eo."
      en: "The seventh day also shall be most solemn and holy unto you: you shall do no servile work therein."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Dies etiam primitivorum, quando offeretis novas fruges Domino, expletis hebdomadibus, venerabilis et sancta erit: omne opus servile non facietis in ea."
      en: "The day also of firstfruits, when after the weeks are accomplished, you shall offer new fruits to the Lord, shall be venerable and holy: you shall do no servile work therein."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Offeretisque holocaustum in odorem suavissimum Domino, vitulos de armento duos, arietem unum, et agnos anniculos immaculatos septem:"
      en: "And you shall offer a holocaust for a most sweet odour to the Lord, two calves of the herd, one ram, and seven lambs of a year old, without blemish:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "atque in sacrificiis eorum, similae oleo conspersae tres decimas per singulos vitulos, per arietes duas,"
      en: "And in the sacrifices of them three tenths of flour tempered with oil to every calf, two to every ram,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "per agnos decimam decimae, qui simul sunt agni septem. Hircum quoque,"
      en: "The tenth of a tenth to every lamb, which in all are seven lambs: a buck goat also,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "qui mactatur pro expiatione: praeter holocaustum sempiternum et liba ejus."
      en: "Which is slain for expiation: besides the perpetual holocaust and the libations thereof."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Immaculata offeretis omnia cum libationibus suis."
      en: "You shall offer them all without blemish with their libations."
    status: { la: verified, en: verified }
