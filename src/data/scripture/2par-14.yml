# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 14
verses:
  - n: 1
    text:
      la: "dormivit autem Abia cum patribus suis et sepelierunt eum in civitate David regnavitque Asa filius eius pro eo in cuius diebus quievit terra annis decem"
      en: "And Abia slept with his fathers, and they buried him in the city of David: and Asa his son reigned in his stead: in his days the land was quiet ten years."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fecit autem Asa quod bonum et placitum erat in conspectu Dei sui et subvertit altaria peregrini cultus et excelsa"
      en: "And Asa did that which was good and pleasing in the sight of his God, and he destroyed the altars of foreign worship, and the high places."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et confregit statuas lucosque succidit"
      en: "And broke the statues, and cut down the groves."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ac praecepit Iudae ut quaereret Dominum Deum patrum suorum et faceret legem et universa mandata"
      en: "And he commanded Juda to seek the Lord the God of their fathers, and to do the law, and all the commandments."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et abstulit e cunctis urbibus Iuda aras et fana et regnavit in pace"
      en: "And he took away out of all the cities of Juda the altars, and temples, and reigned in peace."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "aedificavit quoque urbes munitas in Iuda quia quietus erat et nulla temporibus eius bella surrexerant pacem Domino largiente"
      en: "He built also strong cities in Juda, for he was quiet, and there had no wars risen in his time, the Lord giving peace."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixit autem Iudae aedificemus civitates istas et vallemus muris et roboremus turribus et portis et seris donec a bellis quieta sunt omnia eo quod quaesierimus Dominum Deum patrum nostrorum et dederit nobis pacem per gyrum aedificaverunt igitur et nullum in extruendo inpedimentum fuit"
      en: "And he said to Juda: Let us build these cities, and compass them with walls, and fortify them with towers, and gates, and bars, while all is quiet from wars, because we have sought the Lord the God of our fathers, and he hath given us peace round about. So they built, and there was no hinderance in building."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "habuit autem Asa in exercitu suo portantium scuta et hastas de Iuda trecenta milia de Beniamin vero scutariorum et sagittariorum ducenta octoginta milia omnes isti viri fortissimi"
      en: "And Asa had in his army of men that bore shields and spears of Juda three hundred thousand, and of Benjamin that bore shields and drew bows, two hundred and eighty thousand, all these were most valiant men."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "egressus est autem contra eos Zara Aethiops cum exercitu decies centena milia et curribus trecentis et venit usque Maresa"
      en: "And Zara the Ethiopian came out against them with his army of ten hundred thousand men, and with three hundred chariots: and he came as far as Maresa."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "porro Asa perrexit obviam et instruxit aciem ad bellum in valle Sephata quae est iuxta Maresa"
      en: "And Asa went out to meet him, and set his army in array for battle in the vale of Sephata, which is near Maresa:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et invocavit Dominum Deum et ait Domine non est apud te ulla distantia utrum in paucis auxilieris an in pluribus adiuva nos Domine Deus noster in te enim et in tuo nomine habentes fiduciam venimus contra hanc multitudinem Domine Deus noster tu es non praevaleat contra te homo"
      en: "And he called upon the Lord God, and said: O Lord, there is no difference with thee, whether thou help with few, or with many: help us, O Lord our God: for with confidence in thee, and in thy name, we are come against this multitude. O Lord thou art our God, let not man prevail against thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "exterruit itaque Dominus Aethiopas coram Asa et Iuda fugeruntque Aethiopes"
      en: "And the Lord terrified the Ethiopians before Asa and Juda: and the Ethiopians fled."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et persecutus est eos Asa et populus qui cum eo erat usque Gerar et ruerunt Aethiopes usque ad internicionem quia Domino caedente contriti sunt et exercitu illius proeliante tulerunt ergo spolia multa"
      en: "And Asa and the people that were with him pursued them to Gerara: and the Ethiopians fell even to utter destruction, for the Lord slew them, and his army fought against them, and they were destroyed. And they took abundance of spoils,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et percusserunt omnes civitates per circuitum Gerare grandis quippe cunctos terror invaserat et diripuerunt urbes et multam praedam asportaverunt"
      en: "And they took all the cities round about Gerara: for a great fear was come upon all men: and they pillaged the cities, and carried off much booty."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sed et caulas ovium destruentes tulerunt pecorum infinitam multitudinem et camelorum reversique sunt Hierusalem"
      en: "And they destroyed the sheepcotes, and took an infinite number of cattle, and of camels: and returned to Jerusalem."
    status: { la: verified, en: verified }
