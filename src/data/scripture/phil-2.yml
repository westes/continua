# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: phil
chapter: 2
verses:
  - n: 1
    text:
      la: "Si qua ergo consolatio in Christo, si quod solatium caritatis, si qua societas spiritus, si qua viscera miserationis:"
      en: "If there be therefore any consolation in Christ, if any comfort of charity, if any society of the spirit, if any bowels of commiseration:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "implete gaudium meum ut idem sapiatis, eamdem caritatem habentes, unanimes, idipsum sentientes,"
      en: "Fulfill ye my joy, that you may be of one mind, having the same charity, being of one accord, agreeing in sentiment."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "nihil per contentionem, neque per inanem gloriam: sed in humilitate superiores sibi invicem arbitrantes,"
      en: "Let nothing be done through contention, neither by vain glory: but in humility, let each esteem others better than themselves:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "non quae sua sunt singuli considerantes, sed ea quae aliorum."
      en: "Each one not considering the things that are his own, but those that are other men's."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Hoc enim sentite in vobis, quod et in Christo Jesu:"
      en: "For let this mind be in you, which was also in Christ Jesus:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui cum in forma Dei esset, non rapinam arbitratus est esse se aequalem Deo:"
      en: "Who being in the form of God, thought it not robbery to be equal with God:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sed semetipsum exinanivit, formam servi accipiens, in similitudinem hominum factus, et habitu inventus ut homo."
      en: "But emptied himself, taking the form of a servant, being made in the likeness of men, and in habit found as a man."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Humiliavit semetipsum factus obediens usque ad mortem, mortem autem crucis."
      en: "He humbled himself, becoming obedient unto death, even to the death of the cross."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Propter quod et Deus exaltavit illum, et donavit illi nomen, quod est super omne nomen:"
      en: "For which cause God also hath exalted him, and hath given him a name which is above all names:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ut in nomine Jesu omne genu flectatur caelestium, terrestrium et infernorum,"
      en: "That in the name of Jesus every knee should bow, of those that are in heaven, on earth, and under the earth:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et omnis lingua confiteatur, quia Dominus Jesus Christus in gloria est Dei Patris."
      en: "And that every tongue should confess that the Lord Jesus Christ is in the glory of God the Father."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Itaque carissimi mei ( sicut semper obedistis), non ut in praesentia mei tantum, sed multo magis nunc in absentia mea, cum metu et tremore vestram salutem operamini."
      en: "Wherefore, my dearly beloved, (as you have always obeyed, not as in my presence only, but much more now in my absence,) with fear and trembling work out your salvation."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Deus est enim, qui operatur in vobis et velle, et perficere pro bona voluntate."
      en: "For it is God who worketh in you, both to will and to accomplish, according to his good will."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Omnia autem facite sine murmurationibus et haesitationibus:"
      en: "And do ye all things without murmurings and hesitations;"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ut sitis sine querela, et simplices filii Dei, sine reprehensione in medio nationis pravae et perversae: inter quos lucetis sicut luminaria in mundo,"
      en: "That you may be blameless, and sincere children of God, without reproof, in the midst of a crooked and perverse generation; among whom you shine as lights in the world."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "verbum vitae continentes ad gloriam meam in die Christi, quia non in vacuum cucurri, neque in vacuum laboravi."
      en: "Holding forth the word of life to my glory in the day of Christ, because I have not run in vain, nor laboured in vain."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Sed et si immolor supra sacrificium, et obsequium fidei vestrae, gaudeo, et congratulor omnibus vobis."
      en: "Yea, and if I be made a victim upon the sacrifice and service of your faith, I rejoice, and congratulate with you all."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Idipsum autem et vos gaudete, et congratulamini mihi."
      en: "And for the selfsame thing do you also rejoice, and congratulate with me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Spero autem in Domino Jesu, Timotheum me cito mittere ad vos: ut et ego bono animo sim, cognitis quae circa vos sunt."
      en: "And I hope in the Lord Jesus to send Timothy unto you shortly, that I also may be of good comfort, when I know the things concerning you."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Neminem enim habeo tam unanimem, qui sincera affectione pro vobis sollicitus sit."
      en: "For I have no man so of the same mind, who with sincere affection is solicitous for you."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Omnes enim quae sua sunt quaerunt, non quae sunt Jesu Christi."
      en: "For all seek the things that are their own; not the things that are Jesus Christ's."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Experimentum autem ejus cognoscite, quia sicut patri filius, mecum servivit in Evangelio."
      en: "Now know ye the proof of him, that as a son with the father, so hath he served with me in the gospel."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Hunc igitur spero me mittere ad vos, mox ut videro quae circa me sunt."
      en: "Him therefore I hope to send unto you immediately, so soon as I shall see how it will go with me."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Confido autem in Domino quoniam et ipse veniam ad vos cito."
      en: "And I trust in the Lord, that I myself also shall come to you shortly."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Necessarium autem existimavi Epaphroditum fratrem, et cooperatorem, et commilitonem meum, vestrum autem apostolum, et ministrum necessitatis meae, mittere ad vos:"
      en: "But I have thought it necessary to send to you Epaphroditus, my brother and fellow labourer, and fellow soldier, but your apostle, and he that hath ministered to my wants."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "quoniam quidem omnes vos desiderabat: et moestus erat, propterea quod audieratis illum infirmatum."
      en: "For indeed he longed after you all: and was sad, for that you had heard that he was sick."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Nam et infirmatus est usque ad mortem: sed Deus misertus est ejus: non solum autem ejus, verum etiam et mei, ne tristitiam super tristitiam haberem."
      en: "For indeed he was sick, nigh unto death; but God had mercy on him; and not only on him, but on me also, lest I should have sorrow upon sorrow."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Festinantius ergo misi illum, ut viso eo iterum gaudeatis, et ego sine tristitia sim."
      en: "Therefore I sent him the more speedily: that seeing him again, you may rejoice, and I may be without sorrow."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Excipite itaque illum cum omni gaudio in Domino, et ejusmodi cum honore habetote;"
      en: "Receive him therefore with all joy in the Lord; and treat with honour such as he is."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quoniam propter opus Christi usque ad mortem accessit, tradens animam suam ut impleret id quod ex vobis deerat erga meum obsequium."
      en: "Because for the work of Christ he came to the point of death: delivering his life, that he might fulfill that which on your part was wanting towards my service."
    status: { la: verified, en: verified }
