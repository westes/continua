# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: nah
chapter: 1
verses:
  - n: 1
    text:
      la: "onus Nineve liber visionis Naum Helcesei"
      en: "The burden of Ninive. The book of the vision of Nahum the Elcesite."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Deus aemulator et ulciscens Dominus ulciscens Dominus et habens furorem ulciscens Dominus in hostes suos et irascens ipse inimicis suis"
      en: "The Lord is a jealous God, and a revenger: the Lord is a revenger, and hath wrath: the Lord taketh vengeance on his adversaries, and he is angry with his enemies."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dominus patiens et magnus fortitudine et mundans non faciet innocentem Dominus in tempestate et turbine viae eius et nebulae pulvis pedum eius"
      en: "The Lord is patient, and great in power, and will not cleanse and acquit the guilty. The Lord's ways are in a tempest, and a whirlwind, and clouds are the dust of his feet."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "increpans mare et exsiccans illud et omnia flumina ad desertum deducens infirmatus est Basan et Carmelus et flos Libani elanguit"
      en: "He rebuketh the sea, and drieth it up: and bringeth all the rivers to be a desert. Basan languisheth and Carmel: and the dower of Libanus fadeth away."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "montes commoti sunt ab eo et colles adsolati sunt et contremuit terra a facie eius et orbis et omnes habitantes in eo"
      en: "The mountains tremble at him, and the hills are made desolate: and the earth hath quaked at his presence, and the world, and all that dwell therein."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ante faciem indignationis eius quis stabit et quis resistet in ira furoris eius indignatio eius effusa est ut ignis et petrae dissolutae sunt ab eo"
      en: "Who can stand before the face of his indignation? and who shall resist in the fierceness of his anger? his indignation is poured out like fire: and the rocks are melted by him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "bonus Dominus et confortans in die tribulationis et sciens sperantes in se"
      en: "The Lord is good and giveth strength in the day of trouble: and knoweth them that hope in him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et in diluvio praetereunte consummationem faciet loci eius et inimicos eius persequentur tenebrae"
      en: "But with a flood that passeth by, he will make an utter end of the place thereof: and darkness shall pursue his enemies."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quid cogitatis contra Dominum consummationem ipse faciet non consurget duplex tribulatio"
      en: "What do ye devise against the Lord? he will make an utter end: there shall not rise a double affliction."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quia sicut spinae se invicem conplectuntur sic convivium eorum pariter potantium consumentur quasi stipula ariditate plena"
      en: "For as thorns embrace one another: so while they are feasting and drinking together, they shall be consumed as stubble that is fully dry."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ex te exivit cogitans contra Dominum malitiam mente pertractans praevaricationem"
      en: "Out of thee shall come forth one that imagineth evil against the Lord, contriving treachery in his mind."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "haec dicit Dominus si perfecti fuerint et ita plures sic quoque adtondentur et pertransibit adflixi te et non adfligam te ultra"
      en: "Thus saith the Lord: Though they were perfect: and many of them so, yet thus shall they be cut off, and he shall pass: I have afflicted thee, and I will afflict thee no more."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et nunc conteram virgam eius de dorso tuo et vincula tua disrumpam"
      en: "And now I will break in pieces his rod with which he struck thy back, and I will burst thy bonds asunder."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et praecipiet super te Dominus non seminabitur ex nomine tuo amplius de domo Dei tui interficiam sculptile et conflatile ponam sepulchrum tuum quia inhonoratus es"
      en: "And the Lord will give a commandment concerning thee, that no more of thy name shall be sown: I will destroy the graven and molten thing out of the house of thy God, I will make it thy grave, for thou art disgraced."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ecce super montes pedes evangelizantis et adnuntiantis pacem celebra Iuda festivitates tuas et redde vota tua quia non adiciet ultra ut pertranseat in te Belial universus interiit"
      en: "Behold upon the mountains the feet of him that bringeth good tidings, and that preacheth peace: O Juda, keep thy festivals, and pay thy vows: for Belial shall no more pass through thee again, he is utterly cut off."
    status: { la: verified, en: verified }
