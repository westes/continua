book: sir
chapter: 0
verses:
  - n: 1
    text:
      la: "multorum nobis et magnorum per Legem et Prophetas aliosque qui secuti sunt illos sapientiam demonstratam, in quibus oportet laudare Israhel doctrinae et sapientiae causa; quia non solum ipsos loquentes necesse est peritos, sed etiam extraneos posse et dicentes et scribentes doctissimos fieri."
      en: "The knowledge of many and great things hath been shewn us by the law, and the prophets, and others that have followed them: for which things Israel is to be commended for doctrine and wisdom, because not only they that speak must needs be skilful, but strangers also, both speaking and writing, may by their means become most learned."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "avus meus Iesus postquam se amplius dedit ad diligentiam lectionis Legis et Prophetarum et aliorum librorum qui nobis a parentibus nostris traditi sunt, volui et ipse scribere aliquid horum quae ad doctrinam et sapientiam pertinent, ut desiderantes discere et illorum periti facti magis magisque adtendant animo et confirmentur ad legitimam vitam."
      en: "My grandfather Jesus, after he had much given himself to a diligent reading of the law, and the prophets, and other books, that were delivered to us from our fathers, had a mind also to write something himself, pertaining to doctrine and wisdom: that such as are desirous to learn, and are made knowing in these things, may be more and more attentive in mind, and be strengthened to live according to the law."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "hortor itaque venire vos cum benevolentia et adtentiore studio lectionem facere, et veniam habere in illis in quibus videmur sequentes imaginem sapientiae et deficere in verborum conpositione. nam deficiunt verba hebraica quando translata fuerint ad alteram linguam; non solum autem haec, sed et ipsa Lex et Prophetae ceteraque librorum non parvam habent differentiam quando inter se dicuntur."
      en: "I entreat you therefore to come with benevolence, and to read with attention, and to pardon us for those things wherein we may seem, while we follow the image of wisdom, to come short in the composition of words; for the Hebrew words have not the same force in them when translated into another tongue. And not only these, but the law also itself, and the prophets, and the rest of the books, have no small difference, when they are spoken in their own language."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "nam in octavo et tricesimo anno temporibus Ptolomei Euergetis regis, postquam perveni in Aegyptum et cum multum temporis ibi fecissem, inveni libros relictos non parvae neque contemnendae doctrinae."
      en: "For in the eight and thirtieth year coming into Egypt, when Ptolemy Evergetes was king, and continuing there a long time, I found there books left, of no small nor contemptible learning."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "itaque bonum et necessarium putavi et ipse aliquam addere diligentiam et laborem interpretandi istum librum; et multa vigilia adtuli doctrinam in spatio temporis, ad illa quae ad finem ducunt librum dare, et illis qui volunt animum intendere et discere quemadmodum oporteat instituere mores qui secundum legem Domini proposuerunt vitam agere."
      en: "Therefore I thought it good, and necessary for me to bestow some diligence and labour to interpret this book; and with much watching and study in some space of time, I brought the book to an end, and set it forth for the service of them that are willing to apply their mind, and to learn how they ought to conduct themselves, who purpose to lead their life according to the law of the Lord."
    status: { la: verified, en: verified }
