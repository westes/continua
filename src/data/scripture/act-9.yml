# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: act
chapter: 9
verses:
  - n: 1
    text:
      la: "Saulus autem adhuc spirans minarum, et caedis in discipulos Domini, accessit ad principem sacerdotum,"
      en: "And Saul, as yet breathing out threatenings and slaughter against the disciples of the Lord, went to the high priest,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et petiit ab eo epistolas in Damascum ad synagogas: ut si quos invenisset hujus viae viros, ac mulieres, vinctos perduceret in Jerusalem."
      en: "And asked of him letters to Damascus, to the synagogues: that if he found any men and women of this way, he might bring them bound to Jerusalem."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et cum iter faceret, contigit ut appropinquaret Damasco: et subito circumfulsit eum lux de caelo."
      en: "And as he went on his journey, it came to pass that he drew nigh to Damascus; and suddenly a light from heaven shined round about him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et cadens in terram audivit vocem dicentem sibi: Saule, Saule, quid me persequeris?"
      en: "And falling on the ground, he heard a voice saying to him: Saul, Saul, why persecutest thou me?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Qui dixit: Quis es Domine? Et ille: Ego sum Jesus, quem tu persequeris: durum est tibi contra stimulum calcitrare."
      en: "Who said: Who art thou, Lord? And he: I am Jesus whom thou persecutest. It is hard for thee to kick against the goad."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et tremens ac stupens dixit: Domine, quid me vis facere?"
      en: "And he trembling and astonished, said: Lord, what wilt thou have me to do?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et Dominus ad eum: Surge, et ingredere civitatem, et ibi dicetur tibi quid te oporteat facere. Viri autem illi, qui comitabantur cum eo, stabant stupefacti, audientes quidem vocem, neminem autem videntes."
      en: "And the Lord said to him: Arise, and go into the city, and there it shall be told thee what thou must do. Now the men who went in company with him, stood amazed, hearing indeed a voice, but seeing no man."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Surrexit autem Saulus de terra, apertisque oculis nihil videbat. Ad manus autem illum trahentes, introduxerunt Damascum."
      en: "And Saul arose from the ground; and when his eyes were opened, he saw nothing. But they leading him by the hands, brought him to Damascus."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et erat ibi tribus diebus non videns, et non manducavit, neque bibit."
      en: "And he was there three days, without sight, and he did neither eat nor drink."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Erat autem quidam discipulus Damasci, nomine Ananias: et dixit ad illum in visu Dominus: Anania. At ille ait: Ecce ego, Domine."
      en: "Now there was a certain disciple at Damascus, named Ananias. And the Lord said to him in a vision: Ananias. And he said: Behold I am here, Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et Dominus ad eum: Surge, et vade in vicum qui vocatur Rectus: et quaere in domo Judae Saulum nomine Tarsensem: ecce enim orat."
      en: "And the Lord said to him: Arise, and go into the street that is called Strait, and seek in the house of Judas, one named Saul of Tarsus. For behold he prayeth."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "( Et vidit virum Ananiam nomine, introeuntem, et imponentem sibi manus ut visum recipiat.)"
      en: "(And he saw a man named Ananias coming in, and putting his hands upon him, that he might receive his sight.)"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Respondit autem Ananias: Domine, audivi a multis de viro hoc, quanta mala fecerit sanctis tuis in Jerusalem:"
      en: "But Ananias answered: Lord, I have heard by many of this man, how much evil he hath done to thy saints in Jerusalem."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et hic habet potestatem a principibus sacerdotum alligandi omnes qui invocant nomen tuum."
      en: "And here he hath authority from the chief priests to bind all that invoke thy name."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dixit autem ad eum Dominus: Vade, quoniam vas electionis est mihi iste, ut portet nomen meum coram gentibus, et regibus, et filiis Israel."
      en: "And the Lord said to him: Go thy way; for this man is to me a vessel of election, to carry my name before the Gentiles, and kings, and the children of Israel."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ego enim ostendam illi quanta oporteat eum pro nomine meo pati."
      en: "For I will shew him how great things he must suffer for my name's sake."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et abiit Ananias, et introivit in domum: et imponens ei manus, dixit: Saule frater, Dominus misit me Jesus, qui apparuit tibi in via qua veniebas, ut videas, et implearis Spiritu Sancto."
      en: "And Ananias went his way, and entered into the house. And laying his hands upon him, he said: Brother Saul, the Lord Jesus hath sent me, he that appeared to thee in the way as thou camest; that thou mayest receive thy sight, and be filled with the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et confestim ceciderunt ab oculis ejus, tamquam squamae, et visum recepit: et surgens baptizatus est."
      en: "And immediately there fell from his eyes as it were scales, and he received his sight; and rising up, he was baptized."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et cum accepisset cibum, confortatus est. Fuit autem cum discipulis qui erant Damasci, per dies aliquot."
      en: "And when he had taken meat, he was strengthened. And he was with the disciples that were at Damascus, for some days."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et continuo in synagogis praedicabat Jesum, quoniam hic est Filius Dei."
      en: "And immediately he preached Jesus in the synagogues, that he is the Son of God."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Stupebant autem omnes qui audiebant, et dicebant: Nonne hic est qui expugnabat in Jerusalem eos qui invocabant nomen istud: et huc ad hoc venit ut vinctos illos duceret ad principes sacerdotum?"
      en: "And all that heard him, were astonished, and said: Is not this he who persecuted in Jerusalem those that called upon this name: and came hither for that intent, that he might carry them bound to the chief priests?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Saulus autem multo magis convalescebat, et confundebat Judaeos, qui habitabant Damasci, affirmans quoniam hic est Christus."
      en: "But Saul increased much more in strength, and confounded the Jews who dwelt at Damascus, affirming that this is the Christ."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cum autem implerentur dies multi, consilium fecerunt in unum Judaei, ut eum interficerent."
      en: "And when many days were passed, the Jews consulted together to kill him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Notae autem factae sunt Saulo insidiae eorum. Custodiebant autem et portas die ac nocte, ut eum interficerent."
      en: "But their laying in wait was made known to Saul. And they watched the gates also day and night, that they might kill him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Accipientes autem eum discipuli nocte, per murum dimiserunt eum, submittentes in sporta."
      en: "But the disciples taking him in the night, conveyed him away by the wall, letting him down in a basket."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Cum autem venisset in Jerusalem, tentabat se jungere discipulis, et omnes timebant eum, non credentes quod esset discipulus."
      en: "And when he was come into Jerusalem, he essayed to join himself to the disciples; and they all were afraid of him, not believing that he was a disciple."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Barnabas autem apprehensum illum duxit ad Apostolos: et narravit illis quomodo in via vidisset Dominum, et quia locutus est ei, et quomodo in Damasco fiducialiter egerit in nomine Jesu."
      en: "But Barnabas took him, and brought him to the apostles, and told them how he had seen the Lord, and that he had spoken to him; and how in Damascus he had dealt confidently in the name of Jesus."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et erat cum illis intrans et exiens in Jerusalem, et fiducialiter agens in nomine Domini."
      en: "And he was with them coming in and going out in Jerusalem, and dealing confidently in the name of the Lord."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Loquebatur quoque gentibus, et disputabat cum Graecis: illi autem quaerebant occidere eum."
      en: "He spoke also to the Gentiles, and disputed with the Greeks; but they sought to kill him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Quod cum cognovissent fratres, deduxerunt eum Caesaream, et dimiserunt Tarsum."
      en: "Which when the brethren had known, they brought him down to Caesarea, and sent him away to Tarsus."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Ecclesia quidem per totam Judaeam, et Galilaeam, et Samariam habebat pacem, et aedificabatur ambulans in timore Domini, et consolatione Sancti Spiritus replebatur."
      en: "Now the church had peace throughout all Judea, and Galilee, and Samaria; and was edified, walking in the fear of the Lord, and was filled with the consolation of the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Factum est autem, ut Petrus dum pertransiret universos, deveniret ad sanctos qui habitabant Lyddae."
      en: "And it came to pass that Peter, as he passed through, visiting all, came to the saints who dwelt at Lydda."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Invenit autem ibi hominem quemdam, nomine Aeneam, ab annis octo jacentem in grabato, qui erat paralyticus."
      en: "And he found there a certain man named Eneas, who had kept his bed for eight years, who was ill of the palsy."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et ait illi Petrus: Aenea, sanat te Dominus Jesus Christus: surge, et sterne tibi. Et continuo surrexit."
      en: "And Peter said to him: Eneas, the Lord Jesus Christ healeth thee: arise, and make thy bed. And immediately he arose."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et viderunt eum omnes qui habitabant Lyddae et Saronae: qui conversi sunt ad Dominum."
      en: "And all that dwelt at Lydda and Saron, saw him: who were converted to the Lord."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "In Joppe autem fuit quaedam discipula, nomine Tabitha, quae interpretata dicitur Dorcas. Haec erat plena operibus bonis, et eleemosynis, quas faciebat."
      en: "And in Joppe there was a certain disciple named Tabitha, which by interpretation is called Dorcas. This woman was full of good works and almsdeeds which she did."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Factum est autem in diebus illis ut infirmata moreretur. Quam cum lavissent, posuerunt eam in coenaculo."
      en: "And it came to pass in those days that she was sick, and died. Whom when they had washed, they laid her in an upper chamber."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Cum autem prope esset Lydda ad Joppen, discipuli audientes quia Petrus esset in ea, miserunt duos viros ad eum, rogantes: Ne pigriteris venire ad nos."
      en: "And forasmuch as Lydda was nigh to Joppe, the disciples hearing that Peter was there, sent unto him two men, desiring him that he would not be slack to come unto them."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Exsurgens autem Petrus venit cum illis. Et cum advenisset, duxerunt illum in coenaculum: et circumsteterunt illum omnes viduae flentes, et ostendentes ei tunicas, et vestes, quas faciebat illis Dorcas."
      en: "And Peter rising up, went with them. And when he was come, they brought him into the upper chamber. And all the widows stood about him weeping, and shewing him the coats and garments which Dorcas made them."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Ejectis autem omnibus foras, Petrus ponens genua oravit: et conversus ad corpus, dixit: Tabitha, surge. At illa aperuit oculos suos: et viso Petro, resedit."
      en: "And they all being put forth, Peter kneeling down prayed, and turning to the body, he said: Tabitha, arise. And she opened her eyes; and seeing Peter, she sat up."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Dans autem illi manum, erexit eam. Et cum vocasset sanctos, et viduas, assignavit eam vivam."
      en: "And giving her his hand, he lifted her up. And when he had called the saints and the widows, he presented her alive."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Notum autem factum est per universam Joppen: et crediderunt multi in Domino."
      en: "And it was made known throughout all Joppe; and many believed in the Lord."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Factum est autem ut dies multos moraretur in Joppe, apud Simonem quemdam coriarium."
      en: "And it came to pass, that he abode many days in Joppe, with one Simon a tanner."
    status: { la: verified, en: verified }
