# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 3reg
chapter: 18
verses:
  - n: 1
    text:
      la: "Post dies multos factum est verbum Domini ad Eliam, in anno tertio, dicens: Vade, et ostende te Achab, ut dem pluviam super faciem terrae."
      en: "After many days the word of the Lord came to Elias, in the third year, saying: Go and shew thyself to Achab, that I may give rain upon the face of the earth."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ivit ergo Elias, ut ostenderet se Achab: erat autem fames vehemens in Samaria."
      en: "And Elias went to shew himself to Achab, and there was a grievous famine in Samaria."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Vocavitque Achab Abdiam dispensatorem domus suae: Abdias autem timebat Dominum valde."
      en: "And Achab called Abdias the governor of his house: now Abdias feared the Lord very much."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nam cum interficeret Jezabel prophetas Domini, tulit ille centum prophetas, et abscondit eos quinquagenos et quinquagenos in speluncis, et pavit eos pane et aqua."
      en: "For when Jezabel killed the prophets of the Lord, he took a hundred prophets and hid them by fifty and fifty in caves, and fed them with bread and water."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dixit ergo Achab ad Abdiam: Vade in terram ad universos fontes aquarum, et in cunctas valles, si forte possimus invenire herbam, et salvare equos et mulos, et non penitus jumenta intereant."
      en: "And Achab said to Abdias: Go into the land unto all fountains of waters, and into all valleys, to see if we can find grass, and save the horses and mules, that the beasts may not utterly perish."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Diviseruntque sibi regiones ut circuirent eas: Achab ibat per viam unam, et Abdias per viam alteram seorsum."
      en: "And they divided the countries between them, that they might go round about them: Achab went one way, and Abdias another way by himself."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cumque esset Abdias in via, Elias occurrit ei: qui cum cognovisset eum, cecidit super faciem suam, et ait: Num tu es, domine mi, Elias?"
      en: "And as Abdias was in the way, Elias met him: and he knew him, and fell on his face, and said: Art thou my lord Elias?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cui ille respondit: Ego. Vade, et dic domino tuo: Adest Elias."
      en: "And he answered: I am. Go, and tell thy master: Elias is here."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ille, quid peccavi, inquit, quoniam tradis me servum tuum in manu Achab, ut interficiat me?"
      en: "And he said: What have I sinned, that thou wouldst deliver me thy servant into the hand of Achab, that he should kill me?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Vivit Dominus Deus tuus, quia non est gens aut regnum, quo non miserit dominus meus te requirens: et respondentibus cunctis: Non est hic: adjuravit regna singula et gentes, eo quod minime reperireris."
      en: "As the Lord thy God liveth, there is no nation or kingdom, whither my lord hath not sent to seek thee: and when all answered: He is not here: he took an oath of every kingdom and nation, because thou wast not found."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et nunc tu dicis mihi: Vade, et dic domino tuo: Adest Elias."
      en: "And now thou sayest to me: Go, and tell thy master: Elias is here."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cumque recessero a te, spiritus Domini asportabit te in locum quem ego ignoro: et ingressus nuntiabo Achab, et non inveniens te, interficiet me: servus autem tuus timet Dominum ab infantia sua."
      en: "And when I am gone from thee, the spirit of the Lord will carry thee into a place that I know not: and I shall go in and tell Achab, and he not finding thee, will kill me: but thy servant feareth the Lord from his infancy."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Numquid non indicatum est tibi domino meo, quid fecerim cum interficeret Jezabel prophetas Domini, quod absconderim de prophetis Domini centum viros, quinquagenos et quinquagenos, in speluncis, et paverim eos pane et aqua?"
      en: "Hath it not been told thee, my lord, what I did when Jezabel killed the prophets of the Lord, how I hid a hundred men of the prophets of the Lord, by fifty and fifty in caves, and fed them with bread and water?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et nunc tu dicis: Vade, et dic domino tuo: Adest Elias: ut interficiat me?"
      en: "And now thou sayest: Go, and tell thy master: Elias is here: that he may kill me."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et dixit Elias: Vivit Dominus exercituum, ante cujus vultum sto, quia hodie apparebo ei."
      en: "And Elias said: As the Lord of hosts liveth, before whose face I stand, this day I will shew myself unto him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Abiit ergo Abdias in occursum Achab, et indicavit ei: venitque Achab in occursum Eliae."
      en: "Abdias therefore went to meet Achab, and told him: and Achab came to meet Elias."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et cum vidisset eum, ait: Tune es ille, qui conturbas Israel?"
      en: "And when he had seen him, he said: Art thou he that troublest Israel?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et ille ait: Non ego turbavi Israel, sed tu, et domus patris tui, qui dereliquistis mandata Domini, et secuti estis Baalim."
      en: "And he said: I have not troubled Israel, but thou and thy father's house, who have forsaken the commandments of the Lord, and have followed Baalim."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Verumtamen nunc mitte, et congrega ad me universum Israel in monte Carmeli, et prophetas Baal quadringentos quinquaginta, prophetasque lucorum quadringentos, qui comedunt de mensa Jezabel."
      en: "Nevertheless send now, and gather unto me all Israel, unto mount Carmel, and the prophets of Baal four hundred and fifty, and the prophets of the groves four hundred, who eat at Jezabel's table."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Misit Achab ad omnes filios Israel, et congregavit prophetas in monte Carmeli."
      en: "Achab sent to all the children of Israel, and gathered together the prophets unto mount Carmel."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Accedens autem Elias ad omnem populum, ait: Usquequo claudicatis in duas partes? Si Dominus est Deus, sequimini eum: si autem Baal, sequimini illum. Et non respondit ei populus verbum."
      en: "And Elias coming to all the people, said: How long do you halt between two sides? if the Lord be God, follow him: but if Baal, then follow him. And the people did not answer him a word."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et ait rursus Elias ad populum: Ego remansi propheta Domini solus: prophetae autem Baal quadringenti et quinquaginta viri sunt."
      en: "And Elias said again to the people: I only remain a prophet of the Lord: but the prophets of Baal are four hundred and fifty men."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Dentur nobis duo boves, et illi eligant sibi bovem unum, et in frustra caedentes ponant super ligna, ignem autem non supponant: et ego faciam bovem alterum, et imponam super ligna, ignem autem non supponam."
      en: "Let two bullocks be given us, and let them choose one bullock for themselves, and cut it in pieces and lay it upon wood, but put no fire under: and I will dress the other bullock, and lay it on wood, and put no fire under it."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Invocate nomina deorum vestrorum, et ego invocabo nomen Domini mei: et Deus qui exaudierit per ignem, ipse sit Deus. Respondens omnis populus ait: Optima propositio."
      en: "Call ye on the names of your gods, and I will call on the name of my Lord: and the God that shall answer by fire, let him be God. And all the people answering said: A very good proposal."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Dixit ergo Elias prophetis Baal: Eligite vobis bovem unum, et facite primi, quia vos plures estis: et invocate nomina deorum vestrorum, ignemque non supponatis."
      en: "Then Elias said to the prophets of Baal: Choose you one bullock and dress it first, because you are many: and call on the names of your gods, but put no fire under."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Qui cum tulissent bovem, quem dederat ei, fecerunt: et invocabant nomen Baal de mane usque ad meridiem, dicentes: Baal, exaudi nos. Et non erat vox, nec qui responderet: transiliebantque altare quod fecerant."
      en: "And they took the bullock which he gave them, and dressed it: and they called on the name of Baal from morning even till noon, saying: O Baal, hear us. But there was no voice, nor any that answered: and they leaped over the altar that they had made."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Cumque esset jam meridies, illudebat illis Elias, dicens: Clamate voce majore: deus enim est, et forsitan loquitur, aut in diversorio est, aut in itinere, aut certe dormit, ut excitetur."
      en: "And when it was now noon, Elias jested at them, saying: Cry with a louder voice: for he is a God, and perhaps he is talking, or is in an inn, or on a journey, or perhaps he is asleep, and must be awaked."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Clamabant ergo voce magna, et incidebant se juxta ritum suum cultris et lanceolis, donec perfunderentur sanguine."
      en: "So they cried with a loud voice, and cut themselves after their manner with knives and lancets, till they were all covered with blood."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Postquam autem transiit meridies, et illis prophetantibus venerat tempus quo sacrificium offerri solet, nec audiebatur vox, nec aliquis respondebat, nec attendebat orantes:"
      en: "And after midday was past, and while they were prophesying, the time was come of offering sacrifice, and there was no voice heard, nor did any one answer, nor regard them as they prayed:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "dixit Elias omni populo: Venite ad me. Et accedente ad se populo, curavit altare Domini, quod destructum fuerat."
      en: "Elias said to all the people: Come ye unto me. And the people coming near unto him, he repaired the altar of the Lord, that was broken down:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et tulit duodecim lapides juxta numerum tribuum filiorum Jacob, ad quem factus est sermo Domini, dicens: Israel erit nomen tuum."
      en: "And he took twelve stones according to the number of the tribes of the sons of Jacob, to whom the word of the Lord came, saying: Israel shall be thy name."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et aedificavit de lapidibus altare in nomine Domini: fecitque aquaeductum, quasi per duas aratiunculas in circuitu altaris,"
      en: "And he built with the stones an altar to the name of the Lord: and he made a trench for water, of the breadth of two furrows round about the altar."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et composuit ligna: divisitque per membra bovem, et posuit super ligna,"
      en: "And he laid the wood in order, and cut the bullock in pieces, and laid it upon the wood."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et ait: Implete quatuor hydrias aqua, et fundite super holocaustum, et super ligna. Rursumque dixit: Etiam secundo hoc facite. Qui cum fecissent secundo, ait: Etiam tertio idipsum facite. Feceruntque tertio,"
      en: "And he said: Fill four buckets with water, and pour it upon the burnt offering, and upon the wood. And again he said: Do the same the second time. And when they had done it the second time, he said: Do the same also the third time. And they did so the third time."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et currebant aquae circum altare, et fossa aquaeductus repleta est."
      en: "And the water run round about the altar, and the trench was filled with water."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Cumque jam tempus esset ut offerretur holocaustum, accedens Elias propheta ait: Domine Deus Abraham, et Isaac, et Israel, ostende hodie quia tu es Deus Israel, et ego servus tuus, et juxta praeceptum tuum feci omnia verba haec."
      en: "And when it was now time to offer the holocaust, Elias the prophet came near and said: O Lord God of Abraham, and Isaac, and Israel, shew this day that thou art the God of Israel, and I thy servant, and that according to thy commandment I have done all these things."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Exaudi me Domine, exaudi me: ut discat populus iste, quia tu es Dominus Deus, et tu convertisti cor eorum iterum."
      en: "Hear me, O Lord, hear me: that this people may learn, that thou art the Lord God, and that thou hast turned their heart again."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Cecidit autem ignis Domini, et voravit holocaustum, et ligna, et lapides, pulverem quoque, et aquam quae erat in aquaeductu lambens."
      en: "Then the fire of the Lord fell, and consumed the holocaust, and the wood, and the stones, and the dust, and licked up the water that was in the trench."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Quod cum vidisset omnis populus, cecidit in faciem suam, et ait: Dominus ipse est Deus, Dominus ipse est Deus."
      en: "And when all the people saw this, they fell on their faces, and they said: The Lord he is God, the Lord he is God."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Dixitque Elias ad eos: Apprehendite prophetas Baal, et ne unus quidem effugiat ex eis. Quos cum apprehendissent, duxit eos Elias ad torrentem Cison, et interfecit eos ibi."
      en: "And Elias said to them: Take the prophets of Baal, and let not one of them escape. And when they had taken them, Elias brought them down to the torrent Cison, and killed them there."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et ait Elias ad Achab: Ascende, comede, et bibe: quia sonus multae pluviae est."
      en: "And Elias said to Achab: Go up, eat, and drink: for there is a sound of abundance of rain."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Ascendit Achab ut comederet et biberet: Elias autem ascendit in verticem Carmeli, et pronus in terram posuit faciem suam inter genua sua,"
      en: "Achab went up to eat and drink: and Elias went up to the top of Carmel, and casting himself down upon the earth put his face between his knees,"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et dixit ad puerum suum: Ascende, et prospice contra mare. Qui cum ascendisset, et contemplatus esset, ait: Non est quidquam. Et rursum ait illi: Revertere septem vicibus."
      en: "And he said to his servant: Go up, and look toward the sea. And he went up, and looked, and said: There is nothing. And again he said to him: Return seven times."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "In septima autem vice, ecce nubecula parva quasi vestigium hominis ascendebat de mari. Qui ait: Ascende, et dic Achab: Junge currum tuum et descende, ne occupet te pluvia."
      en: "And at the seventh time, behold, a little cloud arose out of the sea like a man's foot. And he said: Go up and say to Achab: Prepare thy chariot and go down, lest the rain prevent thee."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Cumque se verteret huc itaque illuc, ecce caeli contenebrati sunt, et nubes, et ventus, et facta est pluvia grandis. Ascendens itaque Achab abiit in Jezrahel:"
      en: "And while he turned himself this way and that way, behold the heavens grew dark, with clouds, and wind, and there fell a great rain. And Achab getting up went away to Jezrahel:"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et manus Domini facta est super Eliam, accinctisque lumbis currebat ante Achab, donec veniret in Jezrahel."
      en: "And the hand of the Lord was upon Elias, and he girded up his loins and ran before Achab, till he came to Jezrahel."
    status: { la: verified, en: verified }
