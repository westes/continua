# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sap
chapter: 13
verses:
  - n: 1
    text:
      la: "Vani autem sunt omnes homines in quibus non subest scientia Dei; et de his quae videntur bona, non potuerunt intelligere eum qui est, neque operibus attendentes agnoverunt quis esset artifex;"
      en: "But all men are vain, in whom there is not the knowledge of God: and who by these good things that are seen, could not understand him that is, neither by attending to the works have acknowledged who was the workman:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sed aut ignem, aut spiritum, aut citatum aerem, aut gyrum stellarum, aut nimiam aquam, aut solem et lunam, rectores orbis terrarum deos putaverunt."
      en: "But have imagined either the fire, or the wind, or the swift air, or the circle of the stars, or the great water, or the sun and moon, to be the gods that rule the world."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quorum si specie delectati, deos putaverunt, sciant quanto his dominator eorum speciosior est; speciei enim generator haec omnia constituit."
      en: "With whose beauty, if they, being delighted, took them to be gods: let them know how much the Lord of them is more beautiful than they: for the first author of beauty made all those things."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Aut si virtutem et opera eorum mirati sunt, intelligant ab illis quoniam qui haec fecit fortior est illis;"
      en: "Or if they admired their power and their effects, let them understand by them, that he that made them, is mightier than they:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "a magnitudine enim speciei et creaturae cognoscibiliter poterit creator horum videri."
      en: "For by the greatness of the beauty, and of the creature, the creator of them may be seen, so as to be known thereby."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Sed tamen adhuc in his minor est querela; et hi enim fortasse errant, Deum quaerentes, et volentes invenire."
      en: "But yet as to these they are less to be blamed. For they perhaps err, seeking God, and desirous to find him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Etenim cum in operibus illius conversentur inquirunt, et persuasum habent quoniam bona sunt quae videntur."
      en: "For being conversant among his works, they search: and they are persuaded that the things are good which are seen."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Iterum autem nec his debet ignosci."
      en: "But then again they are not to be pardoned."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Si enim tantum potuerunt scire ut possent aestimare saeculum, quomodo hujus Dominum non facilius invenerunt?"
      en: "For if they were able to know so much as to make a judgment of the world: how did they not more easily find out the Lord thereof?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Infelices autem sunt, et inter mortuos spes illorum est, qui appellaverunt deos opera manuum hominum, aurum et argentum, artis inventionem et similitudines animalium, aut lapidem inutilem opus manus antiquae."
      en: "But unhappy are they, and their hope is among the dead, who have called gods the works of the hands of men, gold and silver, the inventions of art, and the resemblances of beasts, or an unprofitable stone the work of an ancient hand."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Aut si quis artifex faber de silva lignum rectum secuerit, et hujus docte eradat omnem corticem, et arte sua usus, diligenter fabricet vas utile in conversationem vitae;"
      en: "Or if an artist, a carpenter, hath cut down a tree proper for his use in the wood, and skillfully taken off all the bark thereof, and with his art, diligently formeth a vessel profitable for the common uses of life,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "reliquiis autem ejus operis ad praeparationem escae abutatur;"
      en: "And useth the chips of his work to dress his meat:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et reliquum horum quod ad nullos usus facit, lignum curvum et vorticibus plenum, sculpat diligenter per vacuitatem suam, et per scientiam suae artis figuret illud, et assimilet illud imagini hominis,"
      en: "And taking what was left thereof, which is good for nothing, being a crooked piece of wood, and full of knots, carveth it diligently when he hath nothing else to do, and by the skill of his art fashioneth it and maketh it like the image of a man:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "aut alicui ex animalibus illud comparet: perliniens rubrica, et rubicundum faciens fuco colorem illius, et omnem maculam quae in illo est perliniens;"
      en: "Or the resemblance of some beast, laying it over with vermilion, and painting it red, and covering every spot that is in it:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et faciat ei dignam habitationem, et in pariete ponens illud, et confirmans ferro,"
      en: "And maketh a convenient dwelling place for it, and setting it in a wall, and fastening it with iron,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ne forte cadat; prospiciens illi, sciens quoniam non potest adjuvare se: imago enim est, et opus est illi adjutorium."
      en: "Providing for it, lest it should fall, knowing that it is unable to help itself: for it is an image, and hath need of help."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et de substantia sua, et de filiis suis, et de nuptiis votum faciens inquirit. Non erubescit loqui cum illo qui sine anima est."
      en: "And then maketh prayer to it, inquiring concerning his substance, and his children, or his marriage. And he is not ashamed to speak to that which hath no life:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et pro sanitate quidem infirmum deprecatur, et pro vita rogat mortuum, et in adjutorium inutilem invocat."
      en: "And for health he maketh supplication to the weak, and for life prayeth to that which is dead, and for help calleth upon that which is unprofitable:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et pro itinere petit ab eo qui ambulare non potest; et de acquirendo, et de operando, et de omnium rerum eventu, petit ab eo qui in omnibus est inutilis."
      en: "And for a good journey he petitioneth him that cannot walk: and for getting, and for working, and for the event of all things he asketh him that is unable to do any thing."
    status: { la: verified, en: verified }
