# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 49
verses:
  - n: 1
    text:
      la: "Ad filios Ammon. Haec dicit Dominus: Numquid non filii sunt Israel, aut haeres non est ei? Cur igitur haereditate possedit Melchom Gad, et populus ejus in urbibus ejus habitavit?"
      en: "Against the children of Ammon. Thus saith the Lord: Hath Israel no sons? or hath he no heir? Why then hath Melchom inherited Gad: and his people dwelt in his cities?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ideo dies veniunt, dicit Dominus, et auditum faciam super Rabbath filiorum Ammon fremitum praelii, et erit in tumultum dissipata, filiaeque ejus igni succendentur, et possidebit Israel possessores suos, ait Dominus."
      en: "Therefore behold the days come, saith the Lord, and I will cause the noise of war to be heard in Rabbath of the children of Ammon, and it shall be destroyed into a heap, and her daughters shall be burnt with fire, and Israel shall possess them that have possessed him, saith the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ulula, Hesebon, quoniam vastata est Hai: clamate, filiae Rabbath, accingite vos ciliciis, plangite et circuite per sepes, quoniam Melchom in transmigrationem ducetur, sacerdotes ejus et principes ejus simul."
      en: "Howl, O Hesebon, for Hai is wasted. Cry, ye daughters of Rabbath, gird yourselves with haircloth: mourn and go about by the hedges: for Melchom shall be carried into captivity, his priests, and his princes together."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quid gloriaris in vallibus? defluxit vallis tua, filia delicata, quae confidebas in thesauris tuis, et dicebas: Quis veniet ad me?"
      en: "Why gloriest thou in the valleys? thy valley hath flowed away, O delicate daughter, that hast trusted in thy treasures, and hast said: Who shall come to me?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ecce ego inducam super te terrorem, ait Dominus Deus exercituum, ab omnibus qui sunt in circuitu tuo: et dispergemini singuli a conspectu vestro, nec erit qui congreget fugientes."
      en: "Behold I will bring a fear upon thee, saith the Lord God of hosts, from all that are round about thee: and you shall be scattered every one out of one another's sight, neither shall there be any to gather together them that flee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et post haec reverti faciam captivos filiorum Ammon, ait Dominus."
      en: "And afterwards I will cause the captives of the children of Ammon to return, saith the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ad Idumaeam. Haec dicit Dominus exercituum: Numquid non ultra est sapientia in Theman? Periit consilium a filiis, inutilis facta est sapientia eorum."
      en: "Against Edom. Thus saith the Lord of hosts: Is wisdom no more in Theman? counsel is perished from her children: their wisdom is become unprofitable."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Fugite et terga vertite: descendite in voraginem, habitatores Dedan: quoniam perditionem Esau adduxi super eum, tempus visitationis ejus."
      en: "Flee and turn your backs, go down into the deep hole, ye inhabitants of Dedan: for I have brought the destruction of Esau upon him, the time of his visitation."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Si vindemiatores venissent super te, non reliquissent racemum: si fures in nocte, rapuissent quod sufficeret sibi."
      en: "If grapegatherers had come to thee, would they not have left a bunch? if thieves in the night, they would have taken what was enough for them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ego vero, discooperui Esau: revelavi abscondita ejus, et celari non poterit: vastatum est semen ejus, et fratres ejus, et vicini ejus, et non erit."
      en: "But I have made Esau bare, I have revealed his secrets, and he cannot be hid: his seed is laid waste, and his brethren, and his neighbours, and he shall not be."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Relinque pupillos tuos: ego faciam eos vivere: et viduae tuae in me sperabunt."
      en: "Leave thy fatherless children: I will make them live: and thy widows shall hope in me."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quia haec dicit Dominus: Ecce quibus non erat judicium ut biberent calicem, bibentes bibent: et tu, quasi innocens relinqueris? non eris innocens, sed bibens bibes."
      en: "For thus saith the Lord: Behold they whose judgment was not to drink of the cup, shall certainly drink: and shalt thou come off as innocent? thou shalt not come off as innocent, but drinking thou shalt drink."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quia per memetipsum juravi, dicit Dominus, quod in solitudinem, et in opprobrium, et in desertum, et in maledictionem erit Bosra, et omnes civitates ejus erunt in solitudines sempiternas."
      en: "For I have sworn by myself, saith the Lord, that Bosra shall become a desolation, and a reproach, and a desert, and a curse: and all her cities shall be everlasting wastes."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Auditum audivi a Domino, et legatus ad gentes missus est: Congregamini, et venite contra eam, et consurgamus in praelium."
      en: "I have heard a rumour from the Lord, and an ambassador is sent to the nations: Gather yourselves together, and come against her, and let us rise up to battle."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ecce enim parvulum dedi te in gentibus, contemptibilem inter homines."
      en: "For behold I have made thee a little one among the nations, despicable among men."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Arrogantia tua decepit te, et superbia cordis tui, qui habitas in cavernis petrae, et apprehendere niteris altitudinem collis: cum exaltaveris quasi aquila nidum tuum, inde detraham te, dicit Dominus."
      en: "Thy arrogancy hath deceived thee, and the pride of thy heart: O thou that dwellest in the clefts of the rock, and endeavourest to lay hold on the height of the hill: but though thou shouldst make thy nest as high as an eagle, I will bring thee down from thence, saith the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et erit Idumaea deserta: omnis qui transibit per eam stupebit, et sibilabit super omnes plagas ejus."
      en: "And Edom shall be desolate: every one that shall pass by it, shall be astonished, and shall hiss at all its plagues."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Sicut subversa est Sodoma, et Gomorrha, et vicinae ejus, ait Dominus: non habitabit ibi vir, et non incolet eam filius hominis."
      en: "As Sodom was overthrown and Gomorrha, and the neighbours thereof, saith the Lord: there shall not a man dwell there, and there shall no son of man inhabit it."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ecce quasi leo ascendet de superbia Jordanis ad pulchritudinem robustam, quia subito currere faciam eum ad illam. Et quis erit electus, quem praeponam ei? quis enim similis mei? et quis sustinebit me? et quis est iste pastor, qui resistat vultui meo?"
      en: "Behold one shall come up as a lion from the swelling of the Jordan, against the strong and beautiful: for I will make him run suddenly upon her: and who shall be the chosen one whom I may appoint over her? for who is like to me? and who shall abide me? and who is that shepherd that can withstand my countenance?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Propterea audite consilium Domini, quod iniit de Edom, et cogitationes ejus, quas cogitavit de habitatoribus Theman: si non dejecerint eos parvuli gregis, nisi dissipaverint cum eis habitaculum eorum."
      en: "Therefore hear ye the counsel of the Lord, which he hath taken concerning Edom: and his thoughts which he hath thought concerning the inhabitants of Theman: surely the little ones of the flock shall cast them down, of a truth they shall destroy them with their habitation."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "A voce ruinae eorum commota est terra, clamor in mari Rubro auditus est vocis ejus."
      en: "The earth is moved at the noise of their fall: the cry of their voice is heard in the Red Sea."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ecce quasi aquila ascendet, et avolabit, et expandet alas suas super Bosran: et erit cor fortium Idumaeae in die illa quasi cor mulieris parturientis."
      en: "Behold he shall come up as an eagle, and fly: and he shall spread his wings over Bosra: and in that day the heart of the valiant ones of Edom shall be as the heart of a woman in labour."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ad Damascum: Confusa est Emath et Arphad, quia auditum pessimum audierunt: turbati sunt in mari; prae sollicitudine quiescere non potuit."
      en: "Against Damascus. Emath is confounded and Arphad: for they have heard very bad tidings, they are troubled as in the sea: through care they could not rest."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Dissoluta est Damascus, versa est in fugam: tremor apprehendit eam, angustia et dolores tenuerunt eam quasi parturientem."
      en: "Damascus is undone, she is put to flight, trembling hath seized on her: anguish and sorrows have taken her as a woman in labour."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Quomodo dereliquerunt civitatem laudabilem, urbem laetitiae?"
      en: "How have they forsaken the city of renown, the city of joy!"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Ideo cadent juvenes ejus in plateis ejus, et omnes viri praelii conticescent in die illa, ait Dominus exercituum."
      en: "Therefore her young men shall fall in her streets: and all the men of war shall be silent in that day, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et succendam ignem in muro Damasci, et devorabit moenia Benadad."
      en: "And I will kindle a fire in the wall of Damascus, and it shall devour the strong holds of Benadad."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Ad Cedar, et ad regna Asor, quae percussit Nabuchodonosor rex Babylonis. Haec dicit Dominus: Surgite, et ascendite ad Cedar, et vastate filios orientis."
      en: "Against Cedar and against the kingdoms of Asor, which Nabuchodonosor king of Babylon destroyed. Thus saith the Lord: Arise, and go ye up to Cedar, and waste the children of the east."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Tabernacula eorum, et greges eorum capient: pelles eorum, et omnia vasa eorum, et camelos eorum tollent sibi, et vocabunt super eos formidinem in circuitu."
      en: "They shall take their tents, and their flocks: and shall carry off for themselves their curtains, and all their vessels, and their camels: and they shall call fear upon them round about."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Fugite, abite vehementer, in voraginibus sedete, qui habitatis Asor, ait Dominus: iniit enim contra vos Nabuchodonosor rex Babylonis consilium, et cogitavit adversum vos cogitationes."
      en: "Flee ye, get away speedily, sit in deep holes, you that inhabit Asor, saith the Lord: for Nabuchodonosor king of Babylon hath taken counsel against you, and hath conceived designs against you."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Consurgite, et ascendite ad gentem quietam, et habitantem confidenter, ait Dominus: non ostia, nec vectes eis: soli habitant."
      en: "Arise, and go up to a nation that is at ease, and that dwelleth securely, saith the Lord: they have neither gates, nor bars: they dwell alone."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et erunt cameli eorum in direptionem, et multitudo jumentorum in praedam: et dispergam eos in omnem ventum, qui sunt attonsi in comam, et ex omni confinio eorum adducam interitum super eos, ait Dominus."
      en: "And their camels shall be for a spoil, and the multitude of their cattle for a booty, and I will scatter into every wind them that have their hair cut round, and I will bring destruction upon them from all their confines, saith the Lord."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et erit Asor in habitaculum draconum, deserta usque in aeternum: non manebit ibi vir, nec incolet eam filius hominis."
      en: "And Asor shall be a habitation for dragons, desolate for ever: no man shall abide there, nor son of man inhabit it."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Quod facum est verbum Domini ad Jeremiam prophetam adversus Aelam, in principio regni Sedeciae regis Juda, dicens:"
      en: "The word of the Lord that came to Jeremias the prophet against Elam, in the beginning of the reign of Sedecias king of Juda, saying:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Haec dicit Dominus exercituum: Ecce ego confrigam arcum Aelam, et summam fortitudinem eorum:"
      en: "Thus saith the Lord of hosts: Behold I will break the bow of Elam, and their chief strength."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et inducam super Aelam quatuor ventos a quatuor plagis caeli, et ventilabo eos in omnes ventos istos, et non erit gens ad quam non perveniant profugi Aelam."
      en: "And I will bring upon Elam the four winds from the four quarters of heaven: and I will scatter them into all these winds: and there shall be no nation, to which the fugitives of Elam shall not come."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et pavere faciam Aelam coram inimicis suis, et in conspectu quaerentium animam eorum: et adducam super eos malum, iram furoris mei, dicit Dominus, et mittam post eos gladium donec consumam eos."
      en: "And I will cause Elam to be afraid before their enemies, and in the sight of them that seek their life: and I will bring evil upon them, my fierce wrath, saith the Lord: and will send the sword after them, till I consume them."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et ponam solium meum in Aelam, et perdam inde reges et principes, ait Dominus."
      en: "And I will set my throne in Elam, and destroy kings and princes from thence, saith the Lord."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "In novissimis autem diebus reverti faciam captivos Aelam, dicit Dominus."
      en: "But in the latter days I will cause the captives of Elam, to return, saith the Lord."
    status: { la: verified, en: verified }
