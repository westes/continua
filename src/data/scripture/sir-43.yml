# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 43
verses:
  - n: 1
    text:
      la: "Altitudinis firmamentum pulchritudo ejus est, species caeli in visione gloriae."
      en: "The firmament on high is his beauty, the beauty of heaven with its glorious shew."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Sol in aspectu annuntians in exitu, vas admirabile, opus Excelsi."
      en: "The sun when he appeareth shewing forth at his rising, an admirable instrument, the work of the most High."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "In meridiano exurit terram, et in conspectu ardoris ejus quis poterit sustinere? fornacem custodiens in operibus ardoris:"
      en: "At noon he burneth the earth, and who can abide his burning heat? As one keeping a furnace in the works of heat:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "tripliciter sol exurens montes, radios igneos exsufflans, et refulgens radiis suis obcaecat oculos."
      en: "The sun three times as much, burneth the mountains, breathing out fiery vapours, and shining with his beams, he blindeth the eyes."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Magnus Dominus qui fecit illum, et in sermonibus ejus festinavit iter."
      en: "Great is the Lord that made him, and at his words he hath hastened his course."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et luna in omnibus in tempore suo, ostensio temporis, et signum aevi."
      en: "And the moon in all in her season, is for a declaration of times and a sign of the world."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "A luna signum diei festi: luminare quod minuitur in consummatione."
      en: "From the moon is the sign of the festival day, a light that decreaseth in her perfection."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Mensis secundum nomen ejus est, crescens mirabiliter in consummatione."
      en: "The month is called after her name, increasing wonderfully in her perfection."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Vas castrorum in excelsis, in firmamento caeli resplendens gloriose."
      en: "Being an instrument of the armies on high, shining gloriously in the Armament of heaven."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Species caeli gloria stellarum: mundum illuminans in excelsis Dominus."
      en: "The glory of the stars is the beauty of heaven; the Lord enlighteneth the world on high."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "In verbis Sancti stabunt ad judicium, et non deficient in vigiliis suis."
      en: "By the words of the holy one they shall stand in judgment, and shall never fail in their watches."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Vide arcum, et benedic eum qui fecit illum: valde speciosus est in splendore suo."
      en: "Look upon the rainbow, and bless him that made it: it is very beautiful in its brightness."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Gyravit caelum in circuitu gloriae suae: manus Excelsi aperuerunt illum."
      en: "It encompasseth the heaven about with the circle of its glory, the hands of the most High have displayed it."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Imperio suo acceleravit nivem, et accelerat coruscationes emittere judicii sui."
      en: "By his commandment he maketh the snow to fall apace, and sendeth forth swiftly the lightnings of his judgment."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Propterea aperti sunt thesauri, et evolaverunt nebulae sicut aves."
      en: "Through this are the treasures opened, and the clouds fly out like birds."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "In magnitudine sua posuit nubes, et confracti sunt lapides grandinis."
      en: "By his greatness he hath fixed the clouds, and the hailstones are broken."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "In conspectu ejus commovebuntur montes, et in voluntate ejus aspirabit notus."
      en: "At his sight shall the mountains be shaken, and at his will the south wind shall blow."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vox tonitrui ejus verberavit terram, tempestas aquilonis, et congregatio spiritus:"
      en: "The noise of his thunder shall strike the earth, so doth the northern storm, and the whirlwind:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et sicut avis deponens ad sedendum, aspergit nivem, et sicut locusta demergens descensus ejus."
      en: "And as the birds lighting upon the earth, he scattereth snow, and the falling thereof, is as the coming down of locusts."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Pulchritudinem candoris ejus admirabitur oculus, et super imbrem ejus expavescet cor."
      en: "The eye admireth at the beauty of the whiteness thereof, and the heart is astonished at the shower thereof."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Gelu sicut salem effundet super terram: et dum gelaverit, fiet tamquam cacumina tribuli."
      en: "He shall pour frost as salt upon the earth: and when it freezeth, it shall become like the tops of thistles."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Frigidus ventus aquilo flavit, et gelavit crystallus ab aqua: super omnem congregationem aquarum requiescet, et sicut lorica induet se aquis:"
      en: "The cold north wind bloweth, and the water is congealed into crystal; upon every gathering together of waters it shall rest, and shall clothe the waters as a breastplate."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et devorabit montes, et exuret desertum, et extinguet viride, sicut igne."
      en: "And it shall devour the mountains, and burn the wilderness, and consume all that is green as with fire."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Medicina omnium in festinatione nebulae: et ros obvians ab ardore venienti humilem efficiet eum."
      en: "A present remedy of all is the speedy coming of a cloud, and a dew that meeteth it, by the heat that cometh, shall overpower it."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "In sermone ejus siluit ventus, et cogitatione sua placavit abyssum: et plantavit in illa Dominus insulas."
      en: "At his word the wind is still, and with his thought he appeaseth the deep, and the Lord hath planted islands therein."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Qui navigant mare enarrent pericula ejus, et audientes auribus nostris admirabimur."
      en: "Let them that sail on the sea, tell the dangers thereof: and when we hear with our ears, we shall admire."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Illic praeclara opera et mirabilia, varia bestiarum genera, et omnium pecorum, et creatura belluarum."
      en: "There are great and wonderful works: a variety of beasts, and of all living things, and the monstrous creatures of whales."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Propter ipsum confirmatus est itineris finis, et in sermone ejus composita sunt omnia."
      en: "Through him is established the end of their journey, and by his word all things are regulated."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Multa dicemus, et deficiemus in verbis: consummatio autem sermonum ipse est in omnibus."
      en: "We shall say much, and yet shall want words: but the sum of our words is, He is all."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Gloriantes ad quid valebimus? ipse enim omnipotens super omnia opera sua."
      en: "What shall we be able to do to glorify him? for the Almighty himself is above all his works."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Terribilis Dominus, et magnus vehementer, et mirabilis potentia ipsius."
      en: "The Lord is terrible, and exceeding great, and his power is admirable."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Glorificantes Dominum quantumcumque potueritis, supervalebit enim adhuc: et admirabilis magnificentia ejus."
      en: "Glorify the Lord as much as ever you can, for he will yet far exceed, and his magnificence is wonderful."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Benedicentes Dominum, exaltate illum quantum potestis: major enim est omni laude."
      en: "Blessing the Lord, exalt him as much as you can: for he is above all praise."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Exaltantes eum, replemini virtute, ne laboretis, non enim comprehendetis."
      en: "When you exalt him put forth all your strength, and be not weary: for you can never go far enough."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Quis videbit eum et enarrabit? et quis magnificabit eum sicut est ab initio?"
      en: "Who shall see him, and declare him? and who shall magnify him as he is from the beginning?"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Multa abscondita sunt majora his: pauca enim vidimus operum ejus."
      en: "There are many things hidden from us that are greater than these: for we have seen but a few of his works."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Omnia autem Dominus fecit, et pie agentibus dedit sapientiam."
      en: "But the Lord hath made all things, and to the godly he hath given wisdom."
    status: { la: verified, en: verified }
