# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: zach
chapter: 9
verses:
  - n: 1
    text:
      la: "Onus verbi Domini in terra Hadrach et Damasci requiei ejus, quia Domini est oculus hominis et omnium tribuum Israel."
      en: "The burden of the word of the Lord in the land of Hadrach, and of Damascus the rest thereof: for the eye of man, and of all the tribes of Israel is the Lord's."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Emath quoque in terminis ejus, et Tyrus, et Sidon: assumpserunt quippe sibi sapientiam valde."
      en: "Emath also in the borders thereof, and Tyre, and Sidon: for they have taken to themselves to be exceeding wise."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et aedificavit Tyrus munitionem suam, et coacervavit argentum quasi humum, et aurum ut lutum platearum."
      en: "And Tyre hath built herself a strong hold, and heaped together silver as earth, and gold as the mire of the streets."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ecce Dominus possidebit eam: et percutiet in mari fortitudinem ejus, et haec igni devorabitur."
      en: "Behold the Lord shall possess her, and shall strike her strength in the sea, and she shall be devoured with fire."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Videbit Ascalon, et timebit, et Gaza, et dolebit nimis, et Accaron, quoniam confusa est spes ejus: et peribit rex de Gaza, et Ascalon non habitabitur."
      en: "Ascalon shall see, and shall fear, and Gaza, and shall be very sorrowful: and Accaron, because her hope is confounded: and the king shall perish from Gaza, and Ascalon shall not be inhabited."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et sedebit separator in Azoto, et disperdam superbiam Philisthinorum."
      en: "And the divider shall sit in Azotus, and I will destroy the pride of the Philistines."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et auferam sanguinem ejus de ore ejus, et abominationes ejus de medio dentium ejus: et relinquetur etiam ipse Deo nostro, et erit quasi dux in Juda, et Accaron quasi Jebusaeus."
      en: "And I will take away his blood out of his mouth, and his abominations from between his teeth: and even he shall be left to our God, and he shall be as a governor in Juda, and Accaron as a Jebusite."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et circumdabo domum meam ex his qui militant mihi euntes et revertentes: et non transibit super eos ultra exactor, quia nunc vidi in oculis meis."
      en: "And I will encompass my house with them that serve me in war, going and returning, and the oppressor shall no more pass through them: for now I have seen with my eyes."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Exsulta satis, filia Sion; jubila, filia Jerusalem: ecce rex tuus veniet tibi justus, et salvator: ipse pauper, et ascendens super asinam et super pullum filium asinae."
      en: "Rejoice greatly, O daughter of Sion, shout for joy, O daughter of Jerusalem: BEHOLD THY KING will come to thee, the just and saviour: he is poor, and riding upon an ass, and upon a colt the foal of an ass."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et disperdam quadrigam ex Ephraim, et equum de Jerusalem, et dissipabitur arcus belli: et loquetur pacem gentibus, et potestas ejus a mari usque ad mare, et a fluminibus usque ad fines terrae."
      en: "And I will destroy the chariot out of Ephraim, and the horse out of Jerusalem, and the bow for war shall be broken: and he shall speak peace to the Gentiles, and his power shall be from sea to sea, and from the rivers even to the end of the earth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Tu quoque in sanguine testamenti tui emisisti vinctos tuos de lacu in quo non est aqua."
      en: "Thou also by the blood of thy testament hast sent forth thy prisoners out of the pit, wherein is no water."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Convertimini ad munitionem, vincti spei: hodie quoque annuntians duplicia reddam tibi."
      en: "Return to the strong hold, ye prisoners of hope, I will render thee double as I declare today."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quoniam extendi mihi Judam quasi arcum: implevi Ephraim: et suscitabo filios tuos, Sion, super filios tuos, Graecia: et ponam te quasi gladium fortium."
      en: "Because I have bent Juda for me as a bow, I have filled Ephraim: and I will raise up thy sons, O Sion, above thy sons, O Greece, and I will make thee as the sword of the mighty."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et Dominus Deus super eos videbitur, et exibit ut fulgur jaculum ejus: et Dominus Deus in tuba canet, et vadet in turbine austri."
      en: "And the Lord God shall be seen over them, and his dart shall go forth as lightning: and the Lord God will sound the trumpet, and go in the whirlwind of the south."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dominus exercituum proteget eos: et devorabunt, et subjicient lapidibus fundae: et bibentes inebriabuntur quasi a vino, et replebuntur ut phialae, et quasi cornua altaris."
      en: "The Lord of hosts will protect them: and they shall devour, and subdue with the stones of the sling: and drinking they shall be inebriated as it were with wine, and they shall be filled as bowls, and as the horns of the altar."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et salvabit eos Dominus Deus eorum in die illa, ut gregem populi sui, quia lapides sancti elevabuntur super terram ejus."
      en: "And the Lord their God will save them in that day, as the flock of his people: for holy stones shall be lifted up over his land."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quid enim bonum ejus est, et quid pulchrum ejus, nisi frumentum electorum, et vinum germinans virgines?"
      en: "For what is the good thing of him, and what is his beautiful thing, but the corn of the elect, and wine springing forth virgins?"
    status: { la: verified, en: verified }
