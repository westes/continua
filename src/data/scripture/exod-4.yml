# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 4
verses:
  - n: 1
    text:
      la: "Respondens Moyses ait: Non credent mihi, neque audient vocem meam, sed dicent: Non apparuit tibi Dominus."
      en: "Moses answered and said: They will not believe me, nor hear my voice, but they will say: The Lord hath not appeared to thee."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dixit ergo ad eum: Quid est quod tenes in manu tua? Respondit: Virga."
      en: "Then he said to him: What is that thou holdest in thy hand? He answered: A rod."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dixitque Dominus: Projice eam in terram. Projecit, et versa est in colubrum, ita ut fugeret Moyses."
      en: "And the Lord said: Cast it down upon the ground. He cast it down, and it was turned into a serpent: so that Moses fled from it."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dixitque Dominus: Extende manum tuam, et apprehende caudam ejus. Extendit, et tenuit, versaque est in virgam."
      en: "And the Lord said: Put out thy hand and take it by the tail. He put forth his hand, and took hold of it, and it was turned into a rod."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ut credant, inquit, quod apparuerit tibi Dominus Deus patrum suorum, Deus Abraham, Deus Isaac et Deus Jacob."
      en: "That they may believe, saith he, that the Lord God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob, hath appeared to thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dixitque Dominus rursum: Mitte manum tuam in sinum tuum. Quam cum misisset in sinum, protulit leprosam instar nivis."
      en: "And the Lord said again: Put thy hand into thy bosom. And when he had put it into his bosom, he brought it forth leprous as snow."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Retrahe, ait, manum tuam in sinum tuum. Retraxit, et protulit iterum, et erat similis carni reliquae."
      en: "And he said: Put back thy hand into thy bosom. He put it back, and brought it out again, and it was like the other flesh."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Si non crediderint, inquit, tibi, neque audierint sermonem signi prioris, credent verbo signi sequentis."
      en: "If they will not believe thee, saith he, nor hear the voice of the former sign, they will believe the word of the latter sign."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quod si nec duobus quidem his signis crediderint, neque audierint vocem tuam: sume aquam fluminis, et effunde eam super aridam, et quidquid hauseris de fluvio, vertetur in sanguinem."
      en: "But if they will not even believe these two signs, nor hear thy voice: take of the river water, and pour it out upon the dry land, and whatsoever thou drawest out of the river shall be turned into blood."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ait Moyses: Obsecro, Domine, non sum eloquens ab heri et nudiustertius: et ex quo locutus es ad servum tuum, impeditioris et tardioris linguae sum."
      en: "Moses said: I beseech thee, Lord. I am not eloquent from yesterday and the day before: and since thou hast spoken to thy servant, I have more impediment and slowness of tongue."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Dixit Dominus ad eum: Quis fecit os hominis? aut quis fabricatus est mutum et surdum, videntem et caecum? nonne ego?"
      en: "The Lord said to him: Who made man's mouth? or who made the dumb and the deaf, the seeing and the blind? did not I?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Perge, igitur, et ego ero in ore tuo: doceboque te quid loquaris."
      en: "Go therefore and I will be in thy mouth: and I will teach thee what thou shalt speak."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "At ille: Obsecro, inquit, Domine, mitte quem missurus es."
      en: "But he said: I beseech thee, Lord send whom thou wilt send."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Iratus Dominus in Moysen, ait: Aaron frater tuus Levites, scio quod eloquens sit: ecce ipse egreditur in occursum tuum, vidensque te laetabitur corde."
      en: "The Lord being angry at Moses, said Aaron the Levite is thy brother, I know that he is eloquent: behold he cometh forth to meet thee, and seeing thee shall be glad at heart."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Loquere ad eum, et pone verba mea in ore ejus: et ego ero in ore tuo, et in ore illius, et ostendam vobis quid agere debeatis."
      en: "Speak to him, and put my words in his mouth: and I will be in thy mouth, and in his mouth, and will shew you what you must do."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ipse loquetur pro te ad populum, et erit os tuum: tu autem eris ei in his quae ad Deum pertinent."
      en: "He shall speak in thy stead to the people, and shall be thy mouth: but thou shalt be to him in those things that pertain to God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Virgam quoque hanc sume in manu tua, in qua facturus es signa."
      en: "And take this rod in thy hand, wherewith thou shalt do the signs."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Abiit Moyses, et reversus est ad Jethro socerum suum, dixitque ei: Vadam et revertar ad fratres meos in Aegyptum, ut videam si adhuc vivant. Cui ait Jethro: Vade in pace."
      en: "Moses went his way, and returned to Jethro his father in law and said to him: I will go and return to my brethren into Egypt, that I may see if they be yet alive. And Jethro said to him: Go in peace."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dixit ergo Dominus ad Moysen in Madian: Vade, et revertere in Aegyptum, mortui sunt enim omnes qui quaerebant animam tuam."
      en: "And the Lord said to Moses, in Madian: Go, and return into Egypt: for they are all dead that sought thy life."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Tulit ergo Moyses uxorem suam, et filios suos, et imposuit eos super asinum: reversusque est in Aegyptum, portans virgam Dei in manu sua."
      en: "Moses therefore took his wife, and his sons, and set them upon an ass: and returned into Egypt, carrying the rod of God in his hand."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dixitque ei Dominus revertenti in Aegyptum: Vide ut omnia ostenta quae posui in manu tua, facias coram Pharaone: ego indurabo cor ejus, et non dimittet populum."
      en: "And the Lord said to him as he was returning into Egypt: See that thou do all the wonders before Pharao, which I have put in thy hand: I shall harden his heart, and he will not let the people go."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Dicesque ad eum: Haec dicit Dominus: Filius meus primogenitus Israel."
      en: "And thou shalt say to him: Thus saith the Lord: Israel is my son, my firstborn."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Dixi tibi: Dimitte filium meum ut serviat mihi; et noluisti dimittere eum: ecce ego interficiam filium tuum primogenitum."
      en: "I have said to thee: Let my son go, that he may serve me, and thou wouldst not let him go: behold I will kill thy son, thy firstborn."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Cumque esset in itinere, in diversorio occurrit ei Dominus, et volebat occidere eum."
      en: "And when he was in his journey, in the inn, the Lord met him, and would have killed him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Tulit idcirco Sephora acutissimam petram, et circumcidit praeputium filii sui, tetigitque pedes ejus, et ait: Sponsus sanguinum tu mihi es."
      en: "Immediately Sephora took a very sharp stone, and circumcised the fore skin of her son, and touched his feet and said: A bloody spouse art thou to me."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et dimisit eum postquam dixerat: Sponsus sanguinum ob circumcisionem."
      en: "And he let him go after she had said A bloody spouse art thou to me, because of the circumcision."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Dixit autem Dominus ad Aaron: Vade in occursum Moysi in desertum. Qui perrexit obviam ei in montem Dei, et osculatus est eum."
      en: "And the Lord said to Aaron: Go into the desert to meet Moses. And he went forth to meet him in the mountain of God, and kissed him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Narravitque Moyses Aaron omnia verba Domini quibus miserat eum, et signa quae mandaverat."
      en: "And Moses told Aaron all the words of the Lord, by which he had sent him, and the signs that he had commanded."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Veneruntque simul, et congregaverunt cunctos seniores filiorum Israel."
      en: "And they came together, and they assembled all the ancients of the children of Israel."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Locutusque est Aaron omnia verba quae dixerat Dominus ad Moysen: et fecit signa coram populo,"
      en: "And Aaron spoke all the words which the Lord had said to Moses: and he wrought the signs before the people,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et credidit populus. Audieruntque quod visitasset Dominus filios Israel, et respexisset afflictionem illorum: et proni adoraverunt."
      en: "And the people believed. And they heard that the Lord had visited the children of Israel: and that he had looked upon their affliction: and falling down they adored."
    status: { la: verified, en: verified }
