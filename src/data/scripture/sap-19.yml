# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sap
chapter: 19
verses:
  - n: 1
    text:
      la: "impiis autem usque in novissimum sine misericordia ira supervenit praesciebat enim et futura illorum"
      en: "But as to the wicked, even to the end there came upon them wrath without mercy. For he knew before also what they would do:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quoniam ipsi cum reversi essent ut se ducerent et cum magna sollicitudine praemisissent illos consequebantur illos paenitentia acti"
      en: "For when they had given them leave to depart, and had sent them away with great care, they repented, and pursued after them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "adhuc enim inter manus habentes luctus et deplorantes ad monumenta mortuorum aliam sibi adsumpserunt cogitationem inscientiae et quos rogantes proiecerunt hos tamquam fugitivos persequebantur"
      en: "For whilst they were yet mourning, and lamenting at the graves of the dead, they took up another foolish device: and pursued them as fugitives whom they had pressed to be gone:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ducebat enim illos ad hunc finem digna necessitas et horum quae acciderant memorationem amittebant"
      en: "For a necessity, of which they were worthy, brought them to this end: and they lost the remembrance of those things which had happened, that their punishment might fill up what was wanting to their torments:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ut eam quae deerat tormentis replerent punitionem et populus quidem tuus mirabiliter transiret illi autem novam mortem invenirent"
      en: "And that thy people might wonderfully pass through, but they might find a new death."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "omnis enim creatura ad suum genus ab initio refigurabatur deserviens tuis praeceptis ut pueri tui custodirentur inlaesi"
      en: "For every creature according to its kind was fashioned again as from the beginning, obeying thy commandments, that thy children might be kept without hurt."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nam nubis castra eorum adumbrabat et ex aqua quae ante erat terra arida apparuit et ex mari Rubro via sine inpedimento et campus germinans de profundo nimio"
      en: "For a cloud overshadowed their camp, and where water was before, dry land appeared, and in the Red Sea a way without hinderance, and out of the great deep a springing field:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "per quem omnis natio transivit quae tegebatur tua manu videntes mirabilia monstra"
      en: "Through which all the nation passed which was protected with thy hand, seeing thy miracles and wonders."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "tamquam equi enim depaverunt et tamquam agni exultaverunt magnificantes te Domine qui liberasti illos"
      en: "For they fed on their food like horses, and they skipped like lambs, praising thee, O Lord, who hadst delivered them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "memores enim erant adhuc eorum quae in incolatu illorum facta fuerant quemadmodum pro natione animalium eduxit terra muscas et pro piscibus eructavit fluvius multitudinem ranarum"
      en: "For they were yet mindful of those things which had been done in the time of their sojourning, how the ground brought forth flies instead of cattle, and how the river cast up a multitude of frogs instead of fishes."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "novissime autem viderunt novam creaturam avium cum abducti concupiscentia postulaverunt escam epulationis"
      en: "And at length they saw a new generation of birds, when being led by their appetite they asked for delicate meats."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "in adlocutione enim desiderii ascendit illis de mari ortygometra et vexationes peccatoribus supervenerunt non sine illis quae ante facta erant argumentis per vim fluminum iuste enim patiebantur secundum suas nequitias"
      en: "For to satisfy their desire, the quail came up to them from the sea: and punishments came upon the sinners, not without foregoing signs by the force of thunders: for they suffered justly according to their own wickedness."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "etenim detestabiliorem inhospitalitatem instituerunt alii quidem ignotos non recipiebant advenas alii autem bonos hospites in servitutem accipiebant"
      en: "For they exercised a more detestable inhospitality than any: others indeed received not strangers unknown to them, but these brought their guests into bondage that had deserved well of them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et non solum hoc sed et alius quis respectus erit illorum quoniam inviti recipiebant extraneos"
      en: "And not only so, but in another respect also they were worse: for the others against their will received the strangers."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui autem cum laetitia receperunt hos qui eisdem usi erant iustitiis saevissimis adflixerunt doloribus"
      en: "But these grievously afflicted them whom they had received with joy, and who lived under the same laws."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "percussi sunt autem caecitate sicut illi in foribus iusti cum subitaneis cooperti essent tenebris unusquisque ostii sui transitum quaerebat"
      en: "But they were struck with blindness: as those others were at the doors of the just man, when they were covered with sudden darkness, and every one sought the passage of his own door."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "in se enim elementa dum convertuntur sicut in organo qualitatis sonus inmutatur et omnia suum sonum custodiunt unde est aestimare et ex ipso certo visu"
      en: "For while the elements are changed in themselves, as in an instrument the sound of the quality is changed, yet all keep their sound: which may clearly be perceived by the very sight."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "agrestia enim in aquatica convertebantur et quaecumque erant natantia in terram transiebant"
      en: "For the things of the land were turned into things of the water: and the things before swam in the water passed upon the land."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ignis in aqua valebat supra suam virtutem et aqua extinguentis naturae obliviscebatur"
      en: "The fire had power in water above its own virtue, and the water forgot its quenching nature."
    status: { la: verified, en: verified }
