book: num
chapter: 29
verses:
  - n: 1
    text:
      la: "mensis etiam septimi prima dies venerabilis et sancta erit vobis omne opus servile non facietis in ea quia dies clangoris est et tubarum"
      en: "The first day also of the seventh month shall be venerable and holy unto you; you shall do no servile work therein, because it is the day of the sounding and of trumpets."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "offeretisque holocaustum in odorem suavissimum Domino vitulum de armento unum arietem unum agnos anniculos inmaculatos septem"
      en: "And you shall offer a holocaust for a most sweet odour to the Lord, one calf of the herd, one ram and seven lambs of a year old, without blemish."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et in sacrificiis eorum similae oleo conspersae tres decimas per singulos vitulos duas decimas per arietem"
      en: "And for their sacrifices, three tenths of flour tempered with oil to every calf, two tenths to a ram,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "unam decimam per agnum qui simul sunt agni septem"
      en: "One tenth to a lamb, which in all are seven lambs:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et hircum pro peccato qui offertur in expiationem populi"
      en: "And a buck goat for sin, which is offered for the expiation of the people,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "praeter holocaustum kalendarum cum sacrificiis suis et holocaustum sempiternum cum libationibus solitis hisdem caerimoniis offeretis in odorem suavissimum incensum Domino"
      en: "Besides the holocaust of the first day of the month with the sacrifices thereof, and the perpetual holocaust with the accustomed libations. With the same ceremonies you shall offer a burnt sacrifice for a most sweet odour to the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "decima quoque dies mensis huius septimi erit vobis sancta atque venerabilis et adfligetis animas vestras omne opus servile non facietis in ea"
      en: "The tenth day also of this seventh month shall be holy and venerable unto you, and you shall afflict your souls: you shall do no servile work therein."
