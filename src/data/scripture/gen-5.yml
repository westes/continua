book: gen
chapter: 5
verses:
  - n: 1
    text:
      la: "hic est liber generationis Adam in die qua creavit Deus hominem ad similitudinem Dei fecit illum"
      en: "This is the book of the generation of Adam. In the day that God created man, he made him to the likeness of God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "masculum et feminam creavit eos et benedixit illis et vocavit nomen eorum Adam in die qua creati sunt"
      en: "He created them male and female; and blessed them: and called their name Adam, in the day when they were created."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "vixit autem Adam centum triginta annis et genuit ad similitudinem et imaginem suam vocavitque nomen eius Seth"
      en: "And Adam lived a hundred and thirty years, and begot a son to his own image and likeness, and called his name Seth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et facti sunt dies Adam postquam genuit Seth octingenti anni genuitque filios et filias"
      en: "And the days of Adam, after he begot Seth, were eight hundred years: and he begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et factum est omne tempus quod vixit Adam anni nongenti triginta et mortuus est"
      en: "And all the time that Adam lived came to nine hundred and thirty years, and he died."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "vixit quoque Seth centum quinque annos et genuit Enos"
      en: "Seth also lived a hundred and five years, and begot Enos."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "vixitque Seth postquam genuit Enos octingentis septem annis genuitque filios et filias"
      en: "And Seth lived after he begot Enos, eight hundred and seven years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et facti sunt omnes dies Seth nongentorum duodecim annorum et mortuus est"
      en: "And all the days of Seth were nine hundred and twelve years, and he died."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "vixit vero Enos nonaginta annis et genuit Cainan"
      en: "And Enos lived ninety years, and begot Cainan."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "post cuius ortum vixit octingentis quindecim annis et genuit filios et filias"
      en: "After whose birth he lived eight hundred and fifteen years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "factique sunt omnes dies Enos nongentorum quinque annorum et mortuus est"
      en: "And the days of Enos were nine hundred and five years, and he died."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "vixit quoque Cainan septuaginta annis et genuit Malalehel"
      en: "And Cainan lived seventy years, and begot Malaleel."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et vixit Cainan postquam genuit Malalehel octingentos quadraginta annos genuitque filios et filias"
      en: "And Cainan lived after he begot Malaleel, eight hundred forty years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et facti sunt omnes dies Cainan nongenti decem anni et mortuus est"
