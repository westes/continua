# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 5
verses:
  - n: 1
    text:
      la: "Hic est liber generationis Adam. In die qua creavit Deus hominem, ad similitudinem Dei fecit illum."
      en: "This is the book of the generation of Adam. In the day that God created man, he made him to the likeness of God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Masculum et feminam creavit eos, et benedixit illis: et vocavit nomen eorum Adam, in die quo creati sunt."
      en: "He created them male and female; and blessed them: and called their name Adam, in the day when they were created."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Vixit autem Adam centum triginta annis: et genuit ad imaginem et similitudinem suam, vocavitque nomen ejus Seth."
      en: "And Adam lived a hundred and thirty years, and begot a son to his own image and likeness, and called his name Seth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et facti sunt dies Adam, postquam genuit Seth, octingenti anni: genuitque filios et filias."
      en: "And the days of Adam, after he begot Seth, were eight hundred years: and he begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et factum est omne tempus quod vixit Adam, anni nongenti triginta, et mortuus est."
      en: "And all the time that Adam lived came to nine hundred and thirty years, and he died."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Vixit quoque Seth centum quinque annis, et genuit Enos."
      en: "Seth also lived a hundred and five years, and begot Enos."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Vixitque Seth, postquam genuit Enos, octingentis septem annis, genuitque filios et filias."
      en: "And Seth lived after he begot Enos, eight hundred and seven years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et facti sunt omnes dies Seth nongentorum duodecim annorum, et mortuus est."
      en: "And all the days of Seth were nine hundred and twelve years, and he died."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Vixit vero Enos nonaginta annis, et genuit Cainan."
      en: "And Enos lived ninety years, and begot Cainan."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Post cujus ortum vixit octingentis quindecim annis, et genuit filios et filias."
      en: "After whose birth he lived eight hundred and fifteen years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Factique sunt omnes dies Enos nongenti quinque anni, et mortuus est."
      en: "And all the days of Enos were nine hundred and five years, and he died."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Vixit quoque Cainan septuaginta annis, et genuit Malaleel."
      en: "And Cainan lived seventy years, and begot Malaleel."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et vixit Cainan, postquam genuit Malaleel, octingentis quadraginta annis, genuitque filios et filias."
      en: "And Cainan lived after he begot Malaleel, eight hundred and forty years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et facti sunt omnes dies Cainan nongenti decem anni, et mortuus est."
      en: "And all the days of Cainan were nine hundred and ten years, and he died."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Vixit autem Malaleel sexaginta quinque annis, et genuit Jared."
      en: "And Malaleel lived sixty-five years, and begot Jared."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et vixit Malaleel, postquam genuit Jared, octingentis triginta annis, et genuit filios et filias."
      en: "And Malaleel lived after he begot Jared, eight hundred and thirty years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et facti sunt omnes dies Malaleel octingenti nonaginta quinque anni, et mortuus est."
      en: "And all the days of Malaleel were eight hundred and ninety-five years, and he died."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vixitque Jared centum sexaginta duobus annis, et genuit Henoch."
      en: "And Jared lived a hundred and sixty-two years, and begot Henoch."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et vixit Jared, postquam genuit Henoch, octingentis annis, et genuit filios et filias."
      en: "And Jared lived after he begot Henoch, eight hundred years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et facti sunt omnes dies Jared nongenti sexaginta duo anni, et mortuus est."
      en: "And all the days of Jared were nine hundred and sixty-two years, and he died."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Porro Henoch vixit sexaginta quinque annis, et genuit Mathusalam."
      en: "And Henoch lived sixty-five years, and begot Mathusala."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et ambulavit Henoch cum Deo: et vixit, postquam genuit Mathusalam, trecentis annis, et genuit filios et filias."
      en: "And Henoch walked with God: and lived after he begot Mathusala, three hundred years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et facti sunt omnes dies Henoch trecenti sexaginta quinque anni."
      en: "And all the days of Henoch were three hundred and sixty-five years."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ambulavitque cum Deo, et non apparuit: quia tulit eum Deus."
      en: "And he walked with God, and was seen no more: because God took him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Vixit quoque Mathusala centum octoginta septem annis, et genuit Lamech."
      en: "And Mathusala lived a hundred and eighty-seven years, and begot Lamech."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et vixit Mathusala, postquam genuit Lamech, septingentis octoginta duobus annis, et genuit filios et filias."
      en: "And Mathusala lived after he begot Lamech, seven hundred and eighty-two years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et facti sunt omnes dies Mathusala nongenti sexaginta novem anni, et mortuus est."
      en: "And all the days of Mathusala were nine hundred and sixty-nine years, and he died."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Vixit autem Lamech centum octoginta duobus annis, et genuit filium:"
      en: "And Lamech lived a hundred and eighty-two years, and begot a son."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "vocavitque nomen ejus Noe, dicens: Iste consolabitur nos ab operibus et laboribus manuum nostrarum in terra, cui maledixit Dominus."
      en: "And he called his name Noe, saying: This same shall comfort us from the works and labours of our hands on the earth, which the Lord hath cursed."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Vixitque Lamech, postquam genuit Noe, quingentis nonaginta quinque annis, et genuit filios et filias."
      en: "And Lamech lived after he begot Noe, five hundred and ninety-five years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et facti sunt omnes dies Lamech septingenti septuaginta septem anni, et mortuus est. Noe vero cum quingentorum esset annorum, genuit Sem, Cham et Japheth."
      en: "And all the days of Lamech came to seven hundred and seventy-seven years, and he died. And Noe, when he was five hundred years old, begot Sem, Cham, and Japheth."
    status: { la: verified, en: verified }
