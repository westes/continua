# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 3reg
chapter: 5
verses:
  - n: 1
    text:
      la: "Misit quoque Hiram rex Tyri servos suos ad Salomonem: audivit enim quod ipsum unxissent regem pro patre ejus: quia amicus fuerat Hiram David omni tempore."
      en: "And Hiram king of Tyre sent his servants to Solomon: for he heard that they had anointed him king in the room of his father: for Hiram had always been David's friend."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Misit autem Salomon ad Hiram, dicens:"
      en: "And Solomon sent to Hiram, saying:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tu scis voluntatem David patris mei, et quia non potuerit aedificare domum nomini Domini Dei sui propter bella imminentia per circuitum, donec daret Dominus eos sub vestigio pedum ejus."
      en: "Thou knowest the will of David my father, and that he could not build a house to the name of the Lord his God, because of the wars that were round about him, until the Lord put them under the soles of his feet."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nunc autem requiem dedit Dominus Deus meus mihi per circuitum: et non est satan, neque occursus malus."
      en: "But now the Lord my God hath given me rest round about: and there is no adversary nor evil occurrence."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quam ob rem cogito aedificare templum nomini Domini Dei mei, sicut locutus est Dominus David patri meo, dicens: Filius tuus, quem dabo pro te super solium tuum, ipse aedificabit domum nomini meo."
      en: "Wherefore I purpose to build a temple to the name of the Lord my God, as the Lord spoke to David my father, saying: Thy son, whom I will set upon the throne in thy place, he shall build a house to my name."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Praecipe igitur ut praecidant mihi servi tui cedros de Libano, et servi mei sint cum servis tuis: mercedem autem servorum tuorum dabo tibi quamcumque petieris: scis enim quomodo non est in populo meo vir qui noverit ligna caedere sicut Sidonii."
      en: "Give orders therefore that thy servants cut me down cedar trees out of Libanus, and let my servants be with thy servants: and I will give thee the hire of thy servants whatsoever thou wilt ask, for thou knowest how there is not among my people a man that has skill to hew wood like to the Sidonians."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cum ergo audisset Hiram verba Salomonis, laetatus est valde, et ait: Benedictus Dominus Deus hodie, qui dedit David filium sapientissimum super populum hunc plurimum."
      en: "Now when Hiram had heard the words of Solomon, he rejoiced exceedingly, and said: Blessed be the Lord God this day, who hath given to David a very wise son over this numerous people."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et misit Hiram ad Salomonem, dicens: Audivi quaecumque mandasti mihi: ego faciam omnem voluntatem tuam in lignis cedrinis et abiegnis."
      en: "And Hiram sent to Solomon, saying: I have heard all thou hast desired of me: and I will do all thy desire concerning cedar trees, and fir trees."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Servi mei deponent ea de Libano ad mare: et ego componam ea in ratibus in mari usque ad locum quem significaveris mihi: et applicabo ea ibi, et tu tolles ea: praebebisque necessaria mihi, ut detur cibus domui meae."
      en: "My servants shall bring them down from Libanus to the sea: and I will put them together in floats in the sea, and convey them to the place, which thou shalt signify to me; and will land them there, and thou shalt receive them: and thou shalt allow me necessaries, to furnish food for my household."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Itaque Hiram dabat Salomoni ligna cedrina, et ligna abiegna, juxta omnem voluntatem ejus."
      en: "So Hiram gave Solomon cedar trees, and fir trees, according to all his desire."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Salomon autem praebebat Hiram coros tritici viginti millia, in cibum domui ejus, et viginti coros purissimi olei: haec tribuebat Salomon Hiram per singulos annos."
      en: "And Solomon allowed Hiram twenty thousand measures of wheat, for provision for his house, and twenty measures of the purest oil: thus gave Solomon to Hiram every year."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dedit quoque Dominus sapientiam Salomoni, sicut locutus est ei: et erat pax inter Hiram et Salomonem, et percusserunt ambo foedus."
      en: "And the Lord gave wisdom to Solomon, as he promised him: and there was peace between Hiram and Solomon, and they two made a league together."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Elegitque rex Salomon operarios de omni Israel, et erat indictio triginta millia virorum."
      en: "And king Solomon chose workmen out of all Israel, and the levy was of thirty thousand men."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Mittebatque eos in Libanum, decem millia per menses singulos vicissim, ita ut duobus mensibus essent in domibus suis: et Adoniram erat super hujuscemodi indictione."
      en: "And he sent them to Libanus, ten thousand every month by turns, so that two months they were at home: and Adoniram was over this levy."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Fueruntque Salomoni septuaginta millia eorum qui onera portabant, et octoginta millia latomorum in monte:"
      en: "And Solomon had seventy thousand to carry burdens, and eighty thousand to hew stones in the mountain:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "absque praepositis qui praeerant singulis operibus, numero trium millium et trecentorum praecipientium populo et his qui faciebant opus."
      en: "Besides the overseers who were over every work, in number three thousand, and three hundred that ruled over the people, and them that did the work."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Praecepitque rex, ut tollerent lapides grandes, lapides pretiosos in fundamentum templi, et quadrarent eos:"
      en: "And the king commanded, that they should bring great stones, costly stones, for the foundation of the temple, and should square them:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quos dolaverunt caementarii Salomonis, et caementarii Hiram: porro Giblii praeparaverunt ligna et lapides ad aedificandam domum."
      en: "And the masons of Solomon, and the masons of Hiram hewed them: and the Giblians prepared timber and stones to build the house."
    status: { la: verified, en: verified }
