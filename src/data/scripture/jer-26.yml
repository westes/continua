# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 26
verses:
  - n: 1
    text:
      la: "In principio regni Joakim filii Josiae regis Juda, factum est verbum istud a Domino, dicens:"
      en: "In the beginning of the reign of Joakim the son of Josias king of Juda, came this word from the Lord, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Haec dicit Dominus: Sta in atrio domus Domini, et loqueris ad omnes civitates Juda, de quibus veniunt ut adorent in domo Domini universos sermones quos ego mandavi tibi ut loquaris ad eos: noli subtrahere verbum,"
      en: "Thus saith the Lord: Stand in the court of the house of the Lord, and speak to all the cities of Juda, out of which they come, to adore in the house of the Lord, all the words which I have commanded thee to to speak unto them: leave not out one word."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "si forte audiant, et convertantur unusquisque a via sua mala, et poeniteat me mali quod cogito facere eis propter malitiam studiorum eorum."
      en: "If so be they will hearken and be converted every one from his evil way; that I may repent me of the evil that I think to do unto them for the wickedness of their doings."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et dices ad eos: Haec dicit Dominus: Si non audieritis me, ut ambuletis in lege mea, quam dedi vobis,"
      en: "And thou shalt say to them: Thus saith the Lord: If you will not hearken to me to walk in my law, which I have given to you:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ut audiatis sermones servorum meorum prophetarum, quos ego misi ad vos de nocte consurgens, et dirigens, et non audistis:"
      en: "To give ear to the words of my servants the prophets, whom I sent to you rising up early: and sending, and you have not hearkened:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dabo domum istam sicut Silo, et urbem hanc dabo in maledictionem cunctis gentibus terrae."
      en: "I will make this house like Silo: and I will make this city a curse to all the nations of the earth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et audierunt sacerdotes, et prophetae, et omnis populus, Jeremiam loquentem verba haec in domo Domini."
      en: "And the priests, and the prophets, and all the people heard Jeremias speaking these words in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cumque complesset Jeremias, loquens omnia quae praeceperat ei Dominus ut loqueretur ad universum populum, apprehenderunt eum sacerdotes, et prophetae, et omnis populus, dicens: Morte moriatur."
      en: "And when Jeremias made an end of speaking all that the Lord had commanded him to speak to all the people, the priests, and the prophets, and all the people laid hold on him, saying: Let him be put to death."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quare prophetavit in nomine Domini, dicens: Sicut Silo erit domus haec, et urbs ista desolabitur eo quod non sit habitator? Et congregatus est omnis populus adversus Jeremiam in domo Domini."
      en: "Why hath he prophesied in the name of the Lord, saying: This house shall be like Silo; and this city shall be made desolate, without an inhabitant? And all the people were gathered together against Jeremias in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et audierunt principes Juda verba haec, et ascenderunt de domo regis in domum Domini, et sederunt in introitu portae domus Domini novae."
      en: "And the princes of Juda heard these words: and they went up from the king's house into the house of the Lord, and sat in the entry of the new gate of the house of the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et locuti sunt sacerdotes et prophetae ad principes, et ad omnem populum, dicentes: Judicium mortis est viro huic, quia prophetavit adversus civitatem istam, sicut audistis auribus vestris."
      en: "And the priests and the prophets spoke to the princes, and to all the people, saying: The judgment of death is for this man: because he hath prophesied against this city, as you have heard with your ears."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et ait Jeremias ad omnes principes, et ad universum populum, dicens: Dominus misit me ut prophetarem ad domum istam, et ad civitatem hanc, omnia verba quae audistis."
      en: "Then Jeremias spoke to all the princes, and to all the people, saying: The Lord sent me to prophesy concerning this house, and concerning this city all the words that you have heard."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nunc ergo bonas facite vias vestras, et studia vestra, et audite vocem Domini Dei vestri, et poenitebit Dominum mali quod locutus est adversum vos."
      en: "Now therefore amend your ways, and your doings, and hearken to the voice of the Lord your God: and the Lord will repent him of the evil that he hath spoken against you."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ego autem ecce in manibus vestris sum: facite mihi quod bonum et rectum est in oculis vestris."
      en: "But as for me, behold I am in your hands: do with me what is good and right in your eyes:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Verumtamen scitote et cognoscite quod, si occideritis me, sanguinem innocentem tradetis contra vosmetipsos, et contra civitatem istam, et habitatores ejus: in veritate enim misit me Dominus ad vos, ut loquerer in auribus vestris omnia verba haec."
      en: "But know ye, and understand, that if you put me to death, you will shed innocent blood against your own selves, and against this city, and the inhabitants thereof. For in truth the Lord sent me to you, to speak all these words in your hearing."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et dixerunt principes et omnis populus ad sacerdotes et ad prophetas: Non est viro huic judicium mortis, quia in nomine Domini Dei nostri locutus est ad nos."
      en: "Then the princes, and all the people said to the priests, and to the prophets: There is no judgment of death for this man: for he hath spoken to us in the name of the Lord our God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Surrexerunt ergo viri de senioribus terrae, et dixerunt ad omnem coetum populi, loquentes:"
      en: "And some of the ancients of the land rose up: and they spoke to all the assembly of the people, saying:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Michaeas de Morasthi fuit propheta in diebus Ezechiae regis Juda, et ait ad omnem populum Juda, dicens: Haec dicit Dominus exercituum: Sion quasi ager arabitur, et Jerusalem in acervum lapidum erit, et mons domus in excelsa silvarum."
      en: "Micheas of Morasthi was a prophet in the days of Ezechias king of Juda, and he spoke to all the people of Juda, saying: Thus saith the Lord of hosts: Sion shall be ploughed like a field, and Jerusalem shall be a heap of stones: and the mountain of the house the high places of woods."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Numquid morte condemnavit eum Ezechias rex Juda, et omnis Juda? numquid non timuerunt Dominum, et deprecati sunt faciem Domini, et poenituit Dominum mali quod locutus fuerat adversum eos? Itaque nos facimus malum grande contra animas nostras."
      en: "Did Ezechias king of Juda, and all Juda, condemn him to death? did they not fear the Lord, and beseech the face of the Lord: and the Lord repented of the evil that he had spoken against them? therefore we are doing a great evil against our souls."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Fuit quoque vir prophetans in nomine Domini, Urias filius Semei de Cariathiarim, et prophetavit adversus civitatem istam, et adversus terram hanc, juxta omnia verba Jeremiae."
      en: "There was also a man that prophesied in the name of the Lord, Urias the son of Semei of Cariathiarim: and he prophesied against this city, and against this land, according to all the words of Jeremias."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et audivit rex Joakim, et omnes potentes et principes ejus, verba haec, et quaesivit rex interficere eum: et audivit Urias, et timuit, fugitque et ingressus est Aegyptum."
      en: "And Joakim, and all his men in power, and his princes heard these words: and the king sought to put him to death. And Urias heard it, and was afraid, and fled and went into Egypt."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et misit rex Joakim viros in Aegyptum, Elnathan filium Achobor, et viros cum eo, in Aegyptum,"
      en: "And king Joakim sent men into Egypt, Elnathan the son of Achobor, and men with him into Egypt."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et eduxerunt Uriam de Aegypto, et adduxerunt eum ad regem Joakim, et percussit eum gladio, et projecit cadaver ejus in sepulchris vulgi ignobilis."
      en: "And they brought Urias out of Egypt: and brought him to king Joakim, and he slew him with the sword: and he cast his dead body into the graves of the common people."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Igitur manus Ahicam filii Saphan fuit cum Jeremia, ut non traderetur in manus populi, et interficerent eum."
      en: "So the hand of Ahicam the son of Saphan was with Jeremias, that he should not be delivered into the hands of the people, to put him to death."
    status: { la: verified, en: verified }
