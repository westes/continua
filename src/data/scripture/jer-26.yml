# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 26
verses:
  - n: 1
    text:
      la: "in principio regis Ioachim filii Iosiae regis Iuda factum est verbum istud a Domino dicens"
      en: "In the beginning of the reign of Joakim the son of Josias king of Juda, came this word from the Lord, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "haec dicit Dominus sta in atrio domus Domini et loqueris ad omnes civitates Iuda de quibus veniunt ut adorent in domo Domini universos sermones quos ego mandavi tibi ut loquaris ad eos noli subtrahere verbum"
      en: "Thus saith the Lord: Stand in the court of the house of the Lord, and speak to all the cities of Juda, out of which they come, to adore in the house of the Lord, all the words which I have commanded thee to to speak unto them: leave not out one word."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "si forte audiant et convertantur unusquisque a via sua mala et paeniteat me mali quod cogito facere eis propter malitias studiorum eorum"
      en: "If so be they will hearken and be converted every one from his evil way; that I may repent me of the evil that I think to do unto them for the wickedness of their doings."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dices ad eos haec dicit Dominus si non audieritis me ut ambuletis in lege mea quam dedi vobis"
      en: "And thou shalt say to them: Thus saith the Lord: If you will not hearken to me to walk in my law, which I have given to you:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ut audiatis sermones servorum meorum prophetarum quos ego misi ad vos de nocte consurgens et dirigens et non audistis"
      en: "To give ear to the words of my servants the prophets, whom I sent to you rising up early: and sending, and you have not hearkened:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dabo domum istam sicut Silo et urbem hanc dabo in maledictionem cunctis gentibus terrae"
      en: "I will make this house like Silo: and I will make this city a curse to all the nations of the earth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et audierunt sacerdotes et prophetae et omnis populus Hieremiam loquentem verba haec in domo Domini"
      en: "And the priests, and the prophets, and all the people heard Jeremias speaking these words in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cumque conplesset Hieremias loquens omnia quae praeceperat ei Dominus ut loqueretur ad universum populum adprehenderunt eum sacerdotes et prophetae et omnis populus dicens morte morietur"
      en: "And when Jeremias made an end of speaking all that the Lord had commanded him to speak to all the people, the priests, and the prophets, and all the people laid hold on him, saying: Let him be put to death."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quare prophetavit in nomine Domini dicens sicut Silo erit domus haec et urbs ista desolabitur eo quod non sit habitator et congregatus est omnis populus adversum Hieremiam in domum Domini"
      en: "Why hath he prophesied in the name of the Lord, saying: This house shall be like Silo; and this city shall be made desolate, without an inhabitant? And all the people were gathered together against Jeremias in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et audierunt principes Iuda verba haec et ascenderunt de domo regis in domum Domini et sederunt in introitu portae Domini novae"
      en: "And the princes of Juda heard these words: and they went up from the king's house into the house of the Lord, and sat in the entry of the new gate of the house of the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et locuti sunt sacerdotes et prophetae ad principes et ad omnem populum dicentes iudicium mortis est viro huic quia prophetavit adversum civitatem istam sicut audistis auribus vestris"
      en: "And the priests and the prophets spoke to the princes, and to all the people, saying: The judgement of death is for this man: because he hath prophesied against this city, as you have heard with your ears."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et ait Hieremias ad omnes principes et ad universum populum dicens Dominus misit me ut prophetarem ad domum istam et ad civitatem hanc omnia verba quae audistis"
      en: "Then Jeremias spoke to all the princes, and to all the people, saying: The Lord sent me to prophesy concerning this house, and concerning this city all the words you have heard."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "nunc ergo bonas facite vias vestras et studia vestra et audite vocem Domini Dei vestri et paenitebit Dominum mali quod locutus est adversum vos"
      en: "Now therefore amend your ways, and your doings, and hearken to the voice of the Lord your God: and the Lord will repent of the evil that he hath spoken against you."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ego autem ecce in manibus vestris sum facite mihi ut bonum et rectum est in oculis vestris"
      en: "But as for me, behold I am in your hands: do with me what is good and right in your eyes:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "verumtamen scitote et cognoscite quod si occideritis me sanguinem innocentem traditis contra vosmet ipsos et contra civitatem istam et habitatores eius in veritate enim misit me Dominus ad vos ut loquerer in auribus vestris omnia verba haec"
      en: "But know ye, and understand, that if you put me to death, you will shed innocent blood against your own selves, and against this city, and the inhabitants thereof. For in truth the Lord sent me to you, to speak all these words in your hearing."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et dixerunt principes et omnis populus ad sacerdotes et prophetas non est viro huic iudicium mortis quia in nomine Domini Dei nostri locutus est ad nos"
      en: "Then the princes, and all the people said to the priests, and to the prophets: There is no judgement of death for this man: for he hath spoken to us in the name of the Lord our God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "surrexerunt ergo viri de senioribus terrae et dixerunt ad omnem coetum populi loquentes"
      en: "And some of the ancients of the land rose up: and they spoke to all the assembly of the people, saying:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Michas de Morasthim fuit propheta in diebus Ezechiae regis Iudae et ait ad omnem populum Iudae dicens haec dicit Dominus exercituum Sion quasi ager arabitur et Hierusalem in acervum lapidum erit et mons domus in excelsa silvarum"
      en: "Micheas of Morasthi was a prophet in the days of Ezechias king of Juda, and he spoke to all the people of Juda, saying: Thus saith the Lord of hosts: Sion shall be ploughed like a field, and Jerusalem shall be a heap of stones: and the mountain of the house the high places of woods."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "numquid morte condemnavit eum Ezechias rex Iuda et omnis Iuda numquid non timuerunt Dominum et deprecati sunt faciem Domini et paenituit Dominum mali quod locutus erat adversum eos itaque nos facimus malum grande contra animas nostras"
      en: "Did Ezechias king of Juda, and all Juda, condemn him to death? did they not fear the Lord, and beseech the face of the Lord: and the Lord repented of the evil that they had spoken against them? therefore we are doing a great evil against our souls."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "fuit quoque vir prophetans in nomine Domini Urias filius Semei de Cariathiarim et prophetavit adversum civitatem istam et adversum terram hanc iuxta universa verba Hieremiae"
      en: "There was also a man that prophesied in the name of the Lord, Urias the son of Semei of Cariathiarim: and he prophesied against this city, and against this land, according to all the words of Jeremias."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et audivit rex Ioachim et omnes potentes et principes eius verba haec et quaesivit rex interficere eum et audivit Urias et timuit fugitque et ingressus est Aegyptum"
      en: "And Joakim, and all his men in power, and his princes heard these words: and the king sought to put him to death. And Urias heard it, and was afraid, and fled and went into Egypt."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et misit rex Ioachim viros in Aegyptum Elnathan filium Achobor et viros cum eo in Aegyptum"
      en: "And king Joakim sent men into Egypt, Elnathan the son of Achobor, and men with him into Egypt."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et eduxerunt Uriam de Aegypto et adduxerunt eum ad regem Ioachim et percussit eum gladio et proiecit cadaver eius in sepulchris vulgi ignobilis"
      en: "And they brought Urias out of Egypt: and brought him to king Joakim, and he slew him with the sword: and he cast his dead body into the graves of the common people."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "igitur manus Ahicam filii Saphan fuit cum Hieremia ut non traderetur in manu populi et interficerent eum"
      en: "So the hand of Ahicam the son of Saphan was with Jeremias, that he should not be delivered into the hands of the people, to put him to death."
    status: { la: verified, en: verified }
