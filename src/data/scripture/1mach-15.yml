# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1mach
chapter: 15
verses:
  - n: 1
    text:
      la: "et misit rex Antiochus filius Demetrii epistulas ab insulis maris Simoni sacerdoti et principi gentis Iudaeorum et universae genti"
      en: "And king Antiochus the son of Demetrius sent letters from the isles of the sea to Simon the priest, and prince of the nation of the Jews, and to all the people:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et erant continentes hunc modum rex Antiochus Simoni sacerdoti magno et genti Iudaeorum salutem"
      en: "And the contents were these: King Antiochus to Simon the high priest, and to the nation of the Jews, greeting."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quoniam quidem pestilentes obtinuerunt regnum patrum nostrorum volo autem vindicare regnum et restituere illud sicut erat antea electum feci multitudinem exercitus et feci naves bellicas"
      en: "Forasmuch as certain pestilent men have usurped the kingdom of our fathers, and my purpose is to challenge the kingdom, and to restore it to its former estate: and I have chosen a great army, and have built ships of war."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "volo autem procedere per regiones ut ulciscar in eos qui corruperunt regionem nostram et qui desolaverunt civitates multas in regno meo"
      en: "And I design to go through the country that I may take revenge of them that have destroyed our country, and that have made many cities desolate in my realm."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "nunc ergo statuo tibi omnes oblationes quas remiserunt tibi ante me reges et quaecumque alia dona remiserunt tibi"
      en: "Now therefore I confirm unto thee all the oblations which all the kings before me remitted to thee, and what other gifts soever they remitted to thee:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et permitto tibi facere percussuram proprii nomismatis in regione tua"
      en: "And I give thee leave to coin thy own money in thy country:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Hierusalem autem sanctam esse et liberam et omnia arma quae fabricata sunt et praesidia quae struxisti quae tenes maneant tibi"
      en: "And let Jerusalem be holy and free, and all the armour that hath been made, and the fortresses which thou hast built, and which thou keepest in thy hands, let them remain to thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "[]"
      en: "And all that is due to the king, and what should be the king's hereafter, from this present and for ever, is forgiven thee."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cum autem obtinuerimus regnum nostrum glorificabimus te et gentem tuam et templum gloria magna ita ut manifestetur gloria vestra in universa terra"
      en: "And when we shall have recovered our kingdom, we will glorify thee, and thy nation, and the temple with great glory, so that your glory shall be made manifest in all the earth."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "anno centesimo septuagesimo quarto exiit Antiochus in terram patrum suorum et convenerunt ad eum omnis exercitus ita ut pauci relicti essent cum Tryfone"
      en: "In the year one hundred and seventy-four Antiochus entered into the land of this fathers, and all the forces assembled to him, so that few were left with Tryphon."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et insecutus est eum Antiochus rex et venit Doram fugiens per maritimam"
      en: "And king Antiochus pursued after him, and he fled along by the sea coast and came to Dora."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "sciebat enim quod congregata sunt in eum mala et reliquit eum exercitus"
      en: "For he perceived that evils were gathered together upon him, and his troops had forsaken him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et adplicuit Antiochus super Doram cum centum viginti milibus virorum belligeratorum et octo milibus equitum"
      en: "And Antiochus camped above Dora with a hundred and twenty thousand men of war, and eight thousand horsemen:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et circuivit civitatem et naves a mari accesserunt et vexabant civitatem a terra et mari et neminem sinebant egredi"
      en: "And he invested the city, and the ships drew near by sea: and they annoyed the city by land, and by sea, and suffered none to come in, or to go out."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "venit autem Numenius et qui cum eo fuerant ab urbe Roma habentes epistulas regibus et regionibus scriptas in quibus continebantur haec"
      en: "And Numenius, and they that had been with him, came from the city of Rome, having letters written to the kings, and countries, the contents whereof were these:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Lucius consul Romanorum Ptolomeo regi salutem"
      en: "Lucius the consul of the Romans, to king Ptolemee, greeting."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "legati Iudaeorum venerunt ad nos amici nostri renovantes pristinam amicitiam et societatem missi a Simone principe sacerdotum et populo Iudaeorum"
      en: "The ambassadors of the Jews our friends came to us, to renew the former friendship and alliance, being sent from Simon the high priest, and the people of the Jews."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "adtulerunt autem et clypeum aureum minarum mille"
      en: "And they brought also a shield of gold of a thousand pounds."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "placuit itaque nobis scribere regibus et regionibus ut non inferant illis mala neque inpugnent eos et civitates eorum et regiones eorum et ut non ferant auxilium pugnantibus adversus eos"
      en: "It hath seemed good therefore to us to write to the kings, and countries, that they should do them no harm, nor fight against them, their cities, or countries: and that they should give no aid to them that fight against them."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "visum est autem nobis accipere ab eis clypeum"
      en: "And it hath seemed good to us to received the shield of them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "si qui ergo pestilentes refugerunt de regione ipsorum ad vos tradite eos Simoni principi sacerdotum ut vindicet in eos secundum legem suam"
      en: "If therefore any pestilent men are fled out of their country to you, deliver them to Simon the high priest, that he may punish them according to their law."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "haec eadem scripta sunt Demetrio regi et Attalo et Arahae et Arsaci"
      en: "These same things were written to king Demetrius, and to Attalus, and to Ariarathes, and to Arsaces,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et in omnes regiones et Samsamae et Spartanis et Delo et Mydo et Sicyone et Cariae et Samum et Pamphiliam et Lyciam et Alacarnasum et Rhodum et Faselida et Choo et Siden et Arado et Gortinam et Cnidum et Cyprum et Cyrenen"
      en: "And to all the countries; and to Lampsacus, and to the Spartans, and to Delus, and Myndus, and Sicyon, and Caria, and Samus, and Pamphylia, and Lycia, and Alicarnassus, and Cos, and Side, and Aradus, and Rhodes, and Phaselis, and Gortyna, and Gnidus, and Cyprus, and Cyrene."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "exemplum autem eorum scripserunt Simoni principi sacerdotum"
      en: "And they wrote a copy thereof to Simon the high priest, and to the people of the Jews."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Antiochus autem rex adplicuit castra in Dora secundo admovens ei semper manus et machinas faciens et conclusit Tryfonem ne procederet"
      en: "But king Antiochus moved his camp to Dora the second time, assaulting it continually, and making engines: and shut up Tryphon, that he could not go out."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et misit ei Simon duo milia virorum electorum in auxilium et argentum et aurum et vasa copiosa"
      en: "And Simon sent to him two thousand chosen men to aid him, silver also, and gold, and abundance of furniture."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et noluit ea accipere sed inrupit omnia quae pactus est cum eo antea et alienavit se ab eo"
      en: "And he would not receive them, but broke all the covenant that he had made with him before, and alienated himself from him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et misit ad eum Athenovium unum de amicis suis ut tractaret cum ipso dicens vos tenetis Ioppen et Gazaram et arcem quae est in Hierusalem civitates regni mei"
      en: "And he sent to him Athenobius one of his friends, to treat with him, saying: You hold Joppe, and Gazara, and the castle that is in Jerusalem, which are cities of my kingdom:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "fines earum desolastis et fecistis plagam magnam super terram et dominati estis per loca multa in regno meo"
      en: "Their borders you have wasted, and you have made great havock in the land, and have got the dominion of many places in my kingdom."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "nunc ergo tradite civitates quas occupastis et tributa locorum quibus dominati estis extra fines Iudaeae"
      en: "Now therefore deliver up the cities that you have taken, and the tributes of the places whereof you have gotten the dominion without the borders of Judea."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "sin autem date pro illis quingenta talenta argenti et exterminii quod exterminastis et tributorum civitatium alia talenta quingenta sin autem veniemus et expugnabimus vos"
      en: "But if not, give me for them five hundred talents of silver, and for the havock that you have made, and the tributes of the cities other five hundred talents: or else we will come and fight against you."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et venit Athenovius amicus regis in Hierusalem et vidit gloriam Simonis et claritatem in auro et argento et adparatum copiosum et obstipuit et rettulit ei verba regis"
      en: "So Athenobius the king's friend came to Jerusalem, and saw the glory of Simon and his magnificence in gold, and silver, and his great equipage, and he was astonished, and told him the king's words."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et respondit Simon et dixit ei neque alienam terram sumpsimus neque aliena detinemus sed hereditatem patrum nostrorum quae ab inimicis nostris iniuste aliquo tempore possessa est"
      en: "And Simon answered him, and said to him: We have neither taken other men's land, neither do we hold that which is other men's: but the inheritance of our fathers, which was for some time unjustly possessed by our enemies."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "nos vero tempus habentes vindicamus hereditatem patrum nostrorum"
      en: "But we having opportunity claim the inheritance of our fathers."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "nam de Ioppen et Gazara quae expostulas ipsi faciebant in populo plagam magnam et in regione nostra horum damus talenta centum et non respondit illi verbum"
      en: "And as to thy complaints concerning Joppe and Gazara, they did great harm to the people, and to our country: yet for these we will give a hundred talents. And Athenobius answered him not a word:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "reversus autem cum ira ad regem renuntiavit ei verba ista et gloriam Simonis et universa quae vidit et iratus est rex ira magna"
      en: "But returning in a rage to the king, made report to him of these words, and of the glory of Simon, and of all that he had seen, and the king was exceeding angry."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Tryfon autem fugit navi in Orthosiada"
      en: "And Tryphon fled away by ship to Orthosias."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et constituit rex Cendebeum ducem maritimum et exercitum equitum et peditum dedit illi"
      en: "And the king appointed Cendebeus captain of the sea coast, and gave him an army of footmen and horsemen."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et mandavit illi movere castra contra faciem Iudaeae et mandavit ei aedificare Caedronem et obstruere portas civitatis et debellare populum rex autem persequebatur Tryfonem"
      en: "And he commanded him to march with his army towards Judea: and he commanded him to build up Gedor, and to fortify the gates of the city, and to war against the people. But the king himself pursued after Tryphon."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et pervenit Cendebeus Iamniam et coepit inritare plebem et conculcare Iudaeam et captivare populum et interficere et aedificare Caedronem"
      en: "And Cendebeus came to Jamnia, and began to provoke the people, and to ravage Judea, and to take the people prisoners, and to kill, and to build Gedor."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et conlocavit illic equites et exercitum ut egressi perambularent viam Iudaeae sicut constituit ei rex"
      en: "And he placed there horsemen, and an army: that they might issue forth, and make incursions upon the ways of Judea, as the king had commanded him."
    status: { la: verified, en: verified }
