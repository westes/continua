# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1reg
chapter: 15
verses:
  - n: 1
    text:
      la: "et dixit Samuhel ad Saul me misit Dominus ut unguerem te in regem super populum eius Israhel nunc ergo audi vocem Domini"
      en: "And Samuel said to Saul: The Lord sent me to anoint thee king over his People Israel: now therefore hearken thou unto the voice of the Lord:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "haec dicit Dominus exercituum recensui quaecumque fecit Amalech Israheli quomodo restitit ei in via cum ascenderet de Aegypto"
      en: "Thus saith the Lord of hosts: I have reckoned up all that Amalec hath done to Israel: I how he opposed them in the way when they came up out of Egypt."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "nunc igitur vade et percute Amalech et demolire universa eius non parcas ei sed interfice a viro usque ad mulierem et parvulum atque lactantem bovem et ovem camelum et asinum"
      en: "Now therefore go, and smite Amalec, and utterly destroy all that he hath: spare him not, nor covet any thing that is his: but slay both man and woman, child and suckling, ox and sheep, camel and ass."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "praecepit itaque Saul populo et recensuit eos quasi agnos ducenta milia peditum et decem milia virorum Iuda"
      en: "So Saul commanded the people, and numbered them as lambs: two hundred thousand footmen, and ten thousand of the men of Juda."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cumque venisset Saul usque ad civitatem Amalech tetendit insidias in torrente"
      en: "And when Saul was come to the city of Amalec, he laid ambushes in the torrent."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixitque Saul Cineo abite recedite atque descendite ab Amalech ne forte involvam te cum eo tu enim fecisti misericordiam cum omnibus filiis Israhel cum ascenderent de Aegypto et recessit Cineus de medio Amalech"
      en: "And Saul said to the Cinite: Go, depart and get ye down from Amalec: lest I destroy thee with him. For thou hast shewn kindness to all the children of Israel, when they came up out of Egypt. And the Cinite departed from the midst of Amalec."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "percussitque Saul Amalech ab Evila donec venias Sur quae est e regione Aegypti"
      en: "And Saul smote Amalec from Hevila, until thou comest to Sur, which is over against Egypt."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et adprehendit Agag regem Amalech vivum omne autem vulgus interfecit in ore gladii"
      en: "And he took Agag the king of Amalec alive: but all the common people he slew with the edge of the sword."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et pepercit Saul et populus Agag et optimis gregibus ovium et armentorum et vestibus et arietibus et universis quae pulchra erant nec voluerunt disperdere ea quicquid vero vile fuit et reprobum hoc demoliti sunt"
      en: "And Saul and the people spared Agag and the best of the flocks of sheep and of the herds, and the garments and the rams, and all that was beautiful, and would not destroy them: but every thing that was vile and good for nothing, that they destroyed."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "factum est autem verbum Domini ad Samuhel dicens"
      en: "And the word of the Lord came to Samuel, saying:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "paenitet me quod constituerim Saul regem quia dereliquit me et verba mea opere non implevit contristatusque est Samuhel et clamavit ad Dominum tota nocte"
      en: "It repenteth me that I have made Saul king: for he hath forsaken me, and hath not executed my commandments. And Samuel was grieved, and he cried unto the Lord all night."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cumque de nocte surrexisset Samuhel ut iret ad Saul mane nuntiatum est Samuheli eo quod venisset Saul in Carmelum et erexisset sibi fornicem triumphalem et reversus transisset descendissetque in Galgala venit ergo Samuhel ad Saul et"
      en: "And when Samuel rose early, to go to Saul in the morning, it was told Samuel, that Saul was come to Carmel, and had erected for himself a triumphant arch, and returning had passed on, and gone down to Galgal. And Samuel came to Saul, and Saul was offering a holocaust to the Lord out of the choicest of the spoils which he had brought from Amalec."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixit ei Saul benedictus tu Domino implevi verbum Domini"
      en: "And when Samuel was come to Saul, Saul said to him: Blessed be thou of the Lord, I have fulfilled the word of the Lord."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "dixitque Samuhel et quae est haec vox gregum quae resonat in auribus meis et armentorum quam ego audio"
      en: "And Samuel said: What meaneth then this bleating of the flocks, which soundeth in my ears, and the lowing of the herds, which I hear?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ait Saul de Amalech adduxerunt ea pepercit enim populus melioribus ovibus et armentis ut immolarentur Domino Deo tuo reliqua vero occidimus"
      en: "And Saul said: They have brought them from Amalec: for the people spared the best of the sheep and of the herds that they might be sacrificed to the Lord thy God, but the rest we have slain."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixit autem Samuhel ad Saul sine me et indicabo tibi quae locutus sit Dominus ad me nocte dixitque ei loquere"
      en: "And Samuel said to Saul: Suffer me, and I will tell thee what the Lord hath said to me this night. And he said to him: Speak."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ait Samuhel nonne cum parvulus esses in oculis tuis caput in tribubus Israhel factus es unxitque te Dominus regem super Israhel"
      en: "And Samuel said: When thou wast a little one in thy own eyes, wast thou not made the head of the tribes of Israel? And the Lord anointed thee to be king over Israel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et misit te Dominus in via et ait vade et interfice peccatores Amalech et pugnabis contra eos usque ad internicionem eorum"
      en: "And the Lord sent thee on the way, and said: Go, and kill the sinners of Amalec, and thou shalt fight against them until thou hast utterly destroyed them."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quare ergo non audisti vocem Domini sed versus ad praedam es et fecisti malum in oculis Domini"
      en: "Why then didst thou not hearken to the voice of the Lord: but hast turned to the prey, and hast done evil in the eyes of the Lord."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et ait Saul ad Samuhelem immo audivi vocem Domini et ambulavi in via per quam misit me Dominus et adduxi Agag regem Amalech et Amalech interfeci"
      en: "And Saul said to Samuel: Yea I have hearkened to the voice of the Lord, and have walked in the way by which the Lord sent me, and have brought Agag the king of Amalec, and Amalec I have slain."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "tulit autem populus de praeda oves et boves primitias eorum quae caesa sunt ut immolet Domino Deo suo in Galgalis"
      en: "But the people took of the spoils sheep and oxen, as the firstfruits of those things that were slain, to offer sacrifice to the Lord their God in Galgal."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et ait Samuhel numquid vult Dominus holocausta aut victimas et non potius ut oboediatur voci Domini melior est enim oboedientia quam victimae et auscultare magis quam offerre adipem arietum"
      en: "And Samuel said: Doth the Lord desire holocausts and victims, and not rather that the voice of the Lord should be obeyed? For obedience is better than sacrifices: and to hearken rather than to offer the fat of rams."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quoniam quasi peccatum ariolandi est repugnare et quasi scelus idolatriae nolle adquiescere pro eo ergo quod abiecisti sermonem Domini abiecit te ne sis rex"
      en: "Because it is like the sin of witchcraft, to rebel: and like the crime of idolatry, to refuse to obey. Forasmuch therefore as thou hast rejected the word of the Lord, the Lord hath also rejected thee from being king."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "dixitque Saul ad Samuhel peccavi quia praevaricatus sum sermonem Domini et verba tua timens populum et oboediens voci eorum"
      en: "And Saul said to Samuel: I have sinned because I have transgressed the commandment of the Lord, and thy words, fearing the people, and obeying their voice."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "sed nunc porta quaeso peccatum meum et revertere mecum ut adorem Dominum"
      en: "But now bear, I beseech thee, my sin, and return with me, that I may adore the Lord."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et ait Samuhel ad Saul non revertar tecum quia proiecisti sermonem Domini et proiecit te Dominus ne sis rex super Israhel"
      en: "And Samuel said to Saul: I will not return with thee, because thou hast rejected the word of the Lord, and the Lord hath rejected thee from being king over Israel."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et conversus est Samuhel ut abiret ille autem adprehendit summitatem pallii eius quae et scissa est"
      en: "And Samuel turned about to go away: but he laid hold upon the skirt of his mantle, and it rent."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et ait ad eum Samuhel scidit Dominus regnum Israhel a te hodie et tradidit illud proximo tuo meliori te"
      en: "And Samuel said to him: The Lord hath rent the kingdom of Israel from thee this day, and hath given it to thy neighbour who is better than thee."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "porro Triumphator in Israhel non parcet et paenitudine non flectetur neque enim homo est ut agat paenitentiam"
      en: "But the triumpher in Israel will riot spare, and will not be moved to repentance: for he is not a mail that he should repent."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "at ille ait peccavi sed nunc honora me coram senibus populi mei et coram Israhel et revertere mecum ut adorem Dominum Deum tuum"
      en: "Then he said: I have sinned: yet honour me now before the ancients of my people, and before Israel, and return with me, that I may adore the Lord thy God."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "reversus ergo Samuhel secutus est Saulem et adoravit Saul Dominum"
      en: "So Samuel turned again after Saul: and Saul adored the Lord."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "dixitque Samuhel adducite ad me Agag regem Amalech et oblatus est ei Agag pinguissimus et dixit Agag sicine separat amara mors"
      en: "And Samuel said: Bring hitherto me Agag the king of Amalec. And Agag was presented to him very fat, and trembling. And Agag said: Doth bitter death separate in this manner?"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et ait Samuhel sicut fecit absque liberis mulieres gladius tuus sic absque liberis erit inter mulieres mater tua et in frusta concidit Samuhel Agag coram Domino in Galgalis"
      en: "And Samuel said: As thy sword hath made women childless, so shall thy mother be childless among women. And Samuel hewed him in pieces before the Lord in Galgal."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "abiit autem Samuhel in Ramatha Saul vero ascendit in domum suam in Gabaath"
      en: "And Samuel departed to Ramatha: but Saul went up to his house in Gabaa."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et non vidit Samuhel ultra Saul usque ad diem mortis suae verumtamen lugebat Samuhel Saul quoniam Dominum paenitebat quod constituisset regem Saul super Israhel"
      en: "And Samuel saw Saul no more till the day of his death: nevertheless Samuel mourned for Saul, because the Lord repented that he had made him king over Israel."
    status: { la: verified, en: verified }
