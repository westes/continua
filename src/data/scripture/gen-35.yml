# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 35
verses:
  - n: 1
    text:
      la: "interea locutus est Deus ad Iacob surge et ascende Bethel et habita ibi facque altare Deo qui apparuit tibi quando fugiebas Esau fratrem tuum"
      en: "In the meantime God said to Jacob: Arise, and go up to Bethel, and dwell there, and make there an altar to God, who appeared to thee when thou didst flee from Esau thy brother."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Iacob vero convocata omni domo sua ait abicite deos alienos qui in medio vestri sunt et mundamini ac mutate vestimenta vestra"
      en: "And Jacob having called together all his household, said: Cast away the strange gods that are among you, and be cleansed and change your garments."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "surgite et ascendamus in Bethel ut faciamus ibi altare Deo qui exaudivit me in die tribulationis meae et fuit socius itineris mei"
      en: "Arise, and let us go up to Bethel, that we may make there an altar to God: who heard me in the day of my affliction, and accompanied me in my journey."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dederunt ergo ei omnes deos alienos quos habebant et inaures quae erant in auribus eorum at ille infodit ea subter terebinthum quae est post urbem Sychem"
      en: "So they gave him all the strange gods they had, and the earrings which were in their ears: and he buried them under the turpentine tree, that is behind the city of Sichem."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cumque profecti essent terror Dei invasit omnes per circuitum civitates et non sunt ausi persequi recedentes"
      en: "And when they were departed, the terror of God fell upon all the cities round about, and they durst not pursue after them as they went away."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "venit igitur Iacob Luzam quae est in terra Chanaan cognomento Bethel ipse et omnis populus cum eo"
      en: "And Jacob came to Luza, which is in the land of Chanaan, surnamed Bethel: he and all the people that were with him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "aedificavitque ibi altare et appellavit nomen loci Domus Dei ibi enim apparuit ei Deus cum fugeret fratrem suum"
      en: "And he built there an altar, and called the name of that place, The house of God: for there God appeared to him when he fled from his brother."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "eodem tempore mortua est Debbora nutrix Rebeccae et sepulta ad radices Bethel subter quercum vocatumque est nomen loci quercus Fletus"
      en: "At the same time Debora the nurse of Rebecca died, and was buried at the foot of Bethel under an oak: and the name of that place was called, The oak of weeping."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "apparuit autem iterum Deus Iacob postquam reversus est de Mesopotamiam Syriae benedixitque ei"
      en: "And God appeared again to Jacob, after he returned from Mesopotamia of Syria, and he blessed him,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dicens non vocaberis ultra Iacob sed Israhel erit nomen tuum et appellavit eum Israhel"
      en: "Saying: Thou shalt not be called any more Jacob, but Israel shall be thy name. And he called him Israel."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dixitque ei ego Deus omnipotens cresce et multiplicare gentes et populi nationum erunt ex te reges de lumbis tuis egredientur"
      en: "And said to him: I am God Almighty, increase thou and be multiplied. Nations and peoples of nations shall be from thee, and kings shall come out of thy loins."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "terramque quam dedi Abraham et Isaac dabo tibi et semini tuo post te"
      en: "And the land which I gave to Abraham and Isaac, I will give to thee, and to thy seed after thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et recessit ab eo"
      en: "And he departed from him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ille vero erexit titulum lapideum in loco quo locutus ei fuerat Deus libans super eum libamina et effundens oleum"
      en: "But he set up a monument of stone, in the place where God had spoken to him: pouring drink offerings upon it, and pouring oil thereon:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "vocansque nomen loci Bethel"
      en: "And calling the name of that place Bethel."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "egressus inde venit verno tempore ad terram quae ducit Efratham in qua cum parturiret Rahel"
      en: "And going forth from thence, he came in the springtime to the land which leadeth to Ephrata: wherein when Rachel was in travail,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ob difficultatem partus periclitari coepit dixitque ei obsetrix noli timere quia et hunc habebis filium"
      en: "By reason of her hard labor she began to be in danger, and the midwife said to her: Fear not, for thou shalt have this son also."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "egrediente autem anima prae dolore et inminente iam morte vocavit nomen filii sui Benoni id est filius doloris mei pater vero appellavit eum Beniamin id est filius dexterae"
      en: "And when her soul was departing for pain, and death was now at hand, she called the name of her son Benoni, that is, The son of my pain: but his father called him Benjamin, that is, The son of the right hand."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "mortua est ergo Rahel et sepulta in via quae ducit Efratham haec est Bethleem"
      en: "So Rachel died, and was buried in the highway that leadeth to Ephrata, that is Bethlehem."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "erexitque Iacob titulum super sepulchrum eius hic est titulus monumenti Rahel usque in praesentem diem"
      en: "And Jacob erected a pillar over her sepulcher: this is the pillar of Rachel's monument, to this day."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "egressus inde fixit tabernaculum trans turrem Gregis"
      en: "Departing thence, he pitched his tent beyond the Flock tower."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "cumque habitaret in illa regione abiit Ruben et dormivit cum Bala concubina patris sui quod illum minime latuit erant autem filii Iacob duodecim"
      en: "And when he dwelt in that country, Ruben went, and slept with Bala, the concubine of his father: which he was not ignorant of. Now the sons of Jacob were twelve."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "filii Liae primogenitus Ruben et Symeon et Levi et Iudas et Isachar et Zabulon"
      en: "The sons of Lia: Ruben the firstborn, and Simeon, and Levi, and Juda, and Issachar, and Zebulon."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "filii Rahel Ioseph et Beniamin"
      en: "The sons of Rachel: Joseph and Benjamin."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "filii Balae ancillae Rahelis Dan et Nepthalim"
      en: "The sons of Bala, Rachel's handmaid: Dan and Naphthali."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "filii Zelphae ancillae Liae Gad et Aser hii filii Iacob qui nati sunt ei in Mesopotamiam Syriae"
      en: "The sons of Zelpha, Lia's handmaid: Gad and Aser: these are the sons of Jacob, that were born to him in Mesopotamia of Syria."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "venit etiam ad Isaac patrem suum in Mambre civitatem Arbee haec est Hebron in qua peregrinatus est Abraham et Isaac"
      en: "And he came to Isaac his father in Mambre, the city of Arbee, this is Hebron: Wherein Abraham and Isaac sojourned."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et conpleti sunt dies Isaac centum octoginta annorum"
      en: "And the days of Isaac were a hundred and eighty years."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "consumptusque aetate mortuus est et adpositus populo suo senex et plenus dierum et sepelierunt eum Esau et Iacob filii sui"
      en: "And being spent with age he died, and was gathered to his people, being old and full of days: and his sons Esau and Jacob buried him."
    status: { la: verified, en: verified }
