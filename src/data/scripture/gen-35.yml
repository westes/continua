# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 35
verses:
  - n: 1
    text:
      la: "Interea locutus est Deus ad Jacob: Surge, et ascende Bethel, et habita ibi, facque altare Deo qui apparuit tibi quando fugiebas Esau fratrem tuum."
      en: "In the meantime God said to Jacob: Arise, and go up to Bethel, and dwell there, and make there an altar to God, who appeared to thee when thou didst flee from Esau thy brother."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Jacob vero convocata omni domo sua, ait: Abjicite deos alienos qui in medio vestri sunt, et mundamini, ac mutate vestimenta vestra."
      en: "And Jacob having called together all his household, said: Cast away the strange gods that are among you, and be cleansed and change your garments."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Surgite, et ascendamus in Bethel, ut faciamus ibi altare Deo: qui exaudivit me in die tribulationis meae, et socius fuit itineris mei."
      en: "Arise, and let us go up to Bethel, that we may make there an altar to God: who heard me in the day of my affliction, and accompanied me in my journey."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dederunt ergo ei omnes deos alienos quos habebant, et inaures quae erant in auribus eorum: at ille infodit ea subter terebinthum, quae est post urbem Sichem."
      en: "So they gave him all the strange gods they had, and the earrings which were in their ears: and he buried them under the turpentine tree, that is behind the city of Sichem."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cumque profecti essent, terror Dei invasit omnes per circuitum civitates, et non sunt ausi persequi recedentes."
      en: "And when they were departed, the terror of God fell upon all the cities round about, and they durst not pursue after them as they went away."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Venit igitur Jacob Luzam, quae est in terra Chanaan, cognomento Bethel: ipse et omnis populus cum eo."
      en: "And Jacob came to Luza, which is in the land of Chanaan, surnamed Bethel: he and all the people that were with him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Aedificavitque ibi altare, et appellavit nomen loci illius, Domus Dei: ibi enim apparuit ei Deus cum fugeret fratrem suum."
      en: "And he built there an altar, and called the name of that place, The house of God: for there God appeared to him when he fled from his brother."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Eodem tempore mortua est Debora nutrix Rebeccae, et sepulta est ad radices Bethel subter quercum: vocatumque est nomen loci illius, Quercus fletus."
      en: "At the same time Debora the nurse of Rebecca died, and was buried at the foot of Bethel under an oak: and the name of that place was called, The oak of weeping."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Apparuit autem iterum Deus Jacob postquam reversus est de Mespotamia Syriae, benedixitque ei"
      en: "And God appeared again to Jacob, after he returned from Mesopotamia of Syria, and he blessed him,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dicens: Non vocaberis ultra Jacob, sed Israel erit nomen tuum. Et appellavit eum Israel,"
      en: "Saying: Thou shalt not be called any more Jacob, but Israel shall be thy name. And he called him Israel."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dixitque ei: Ego Deus omnipotens: cresce, et multiplicare: gentes et populi nationum ex te erunt, reges de lumbis tuis egredientur,"
      en: "And said to him: I am God Almighty, increase thou and be multiplied. Nations and peoples of nations shall be from thee, and kings shall come out of thy loins."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "terramque quam dedi Abraham et Isaac, dabo tibi et semini tuo post te."
      en: "And the land which I gave to Abraham and Isaac, I will give to thee, and to thy seed after thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et recessit ab eo."
      en: "And he departed from him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ille vero erexit titulum lapideum in loco quo locutus fuerat ei Deus: libans super eum libamina, et effundens oleum:"
      en: "But he set up a monument of stone, in the place where God had spoken to him: pouring drink offerings upon it, and pouring oil thereon:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "vocansque nomen loci illius Bethel."
      en: "And calling the name of that place Bethel."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Egressus autem inde, venit verno tempore ad terram quae ducit Ephratam: in qua cum parturiret Rachel,"
      en: "And going forth from thence, he came in the springtime to the land which leadeth to Ephrata: wherein when Rachel was in travail,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ob difficultatem partus periclitari coepit. Dixitque ei obstetrix: Noli timere, quia et hunc habebis filium."
      en: "By reason of her hard labour she began to be in danger, and the midwife said to her: Fear not, for thou shalt have this son also."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Egrediente autem anima prae dolore, et imminente jam morte, vocavit nomen filii sui Benomi, id est, Filius doloris mei: pater vero appellavit eum Benjamin, id est, Filius dextrae."
      en: "And when her soul was departing for pain, and death was now at hand, she called the name of her son Benoni, that is, The son of my pain: but his father called him Benjamin, that is, The son of the right hand."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Mortua est ergo Rachel, et sepulta est in via quae ducit Ephratam, haec est Bethlehem."
      en: "So Rachel died, and was buried in the highway that leadeth to Ephrata, this is Bethlehem."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Erexitque Jacob titulum super sepulchrum ejus: hic est titulus monumenti Rachel, usque in praesentem diem."
      en: "And Jacob erected a pillar over her sepulchre: this is the pillar of Rachel's monument, to this day."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Egressus inde, fixit tabernaculum trans Turrem gregis."
      en: "Departing thence, he pitched his tent beyond the Flock tower."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Cumque habitaret in illa regione, abiit Ruben, et dormivit cum Bala concubina patris sui: quod illum minime latuit. Erant autem filii Jacob duodecim."
      en: "And when he dwelt in that country, Ruben went, and slept with Bala, the concubine of his father: which he was not ignorant of. Now the sons of Jacob were twelve."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Filii Liae: primogenitus Ruben, et Simeon, et Levi, et Judas, et Issachar, et Zabulon."
      en: "The sons of Lia: Ruben the first born, and Simeon, and Levi, and Juda, and Issachar, and Zabulon."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Filii Rachel: Joseph et Benjamin."
      en: "The sons of Rachel: Joseph and Benjamin."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Filii Balae ancillae Rachelis: Dan et Nephthali."
      en: "The sons of Bala, Rachel's handmaid: Dan and Nephtali."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Filii Zelphae ancillae Liae: Gad et Aser: hi sunt filii Jacob, qui nati sunt ei in Mesopotamia Syriae."
      en: "The sons of Zelpha, Lia's handmaid: Gad and Aser: these are the sons of Jacob, that were born to him in Mesopotamia of Syria."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Venit etiam ad Isaac patrem suum in Mambre, civitatem Arbee, haec est Hebron, in qua peregrinatus est Abraham et Isaac."
      en: "And he came to Isaac his father in Mambre, the city of Arbee, this is Hebron: wherein Abraham and Isaac sojourned."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et completi sunt dies Isaac centum octoginta annorum."
      en: "And the days of Isaac were a hundred and eighty years."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Consumptusque aetate mortuus est: et appositus est populo suo senex et plenus dierum: et sepelierunt eum Esau et Jacob filii sui."
      en: "And being spent with age he died, and was gathered to his people, being old and full of days: and his sons Esau and Jacob buried him."
    status: { la: verified, en: verified }
