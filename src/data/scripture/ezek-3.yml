# Ezekiel (Vulgate "Ezechiel," cited "Ezech"), chapter 3.
# Verses transcribed from all-saints-octave-day-4.yml (already pulled
# from Divinum Officium, Monastic Tridentinum 1617) as part of the
# migration to a dedicated scripture store (2026-08 decision).
book: ezek
chapter: 3
verses:
  - n: 1
    text:
      la: "Et dixit ad me: Fili hóminis, quodcúmque invéneris, cómede: cómede volúmen istud, et vadens lóquere ad fílios Israël."
      en: "And he said to me: Son of man, eat all that thou shalt find: eat this book, and go speak to the children of Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et apérui os meum, et cibávit me volúmine illo:"
      en: "And I opened my mouth, and he caused me to eat that book."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dixit ad me: Fili hóminis, venter tuus cómedet, et víscera tua complebúntur volúmine isto quod ego do tibi. Et comédi illud, et factum est in ore meo sicut mel dulce."
      en: "And he said to me: Son of man, thy belly shall eat, and thy bowels shall be filled with this book, which I give thee. And I did eat it: and it was sweet as honey in my mouth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et dixit ad me: Fili hóminis, vade ad domum Israël, et loquéris verba mea ad eos."
      en: "And he said to me: Son of man, go to the house of Israel, and thou shalt speak my words to them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Non enim ad pópulum profúndi sermónis et ignótæ linguæ, tu mítteris ad domum Israël;"
      en: "For thou art not sent to a people of a profound speech, and of an unknown tongue, but to the house of Israel:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Neque ad pópulos multos profúndi sermónis et ignótæ linguæ, quorum non possis audíre sermónes; et, si ad illos mitteréris, ipsi audírent te;"
      en: "Nor to many nations of a strange speech, and of an unknown tongue, whose words thou canst not understand: and if thou wert sent to them, they would hearken to thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Domus autem Israël nolunt audíre te, quia nolunt audíre me; omnis quippe domus Israël attríta fronte est, et duro corde."
      en: "But the house of Israel will not hearken to thee: because they will not hearken to me: for all the house of Israel are of a hard forehead and an obstinate heart."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ecce dedi fáciem tuam valentiórem faciébus eórum, et frontem tuam duriórem fróntibus eórum:"
      en: "Behold I have made thy face stronger than their faces: and thy forehead harder than their foreheads."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ut adamántem et ut sílicem dedi fáciem tuam; ne tímeas eos neque métuas a fácie eórum, quia domus exásperans est."
      en: "I have made thy face like an adamant and like flint: fear them not, neither be thou dismayed at their presence: for they are a provoking house."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et dixit ad me: fili hóminis, omnes sermónes meos, quos ego loquor ad te, assúme in corde tuo et áuribus tuis audi;"
      en: "And he said to me: Son of man, receive in thy heart, and hear with thy ears, all the words that I speak to thee:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et vade, ingrédere ad transmigratiónem, ad fílios pópuli tui, et loquéris ad eos; et dices eis: Hæc dicit Dóminus Deus: Si forte áudiant et quiéscant."
      en: "And go get thee in to them of the captivity, to the children of thy people, and thou shalt speak to them, and shalt say to them: Thus saith the Lord: If so be they will hear and will forbear."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et assúmpsit me spíritus, et audívi post me vocem commotiónis magnæ: Benedícta glória Dómini de loco suo;"
      en: "And the spirit took me up, and I heard behind me the voice of a great commotion, saying: Blessed be the glory of the Lord, from his place."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et vocem alárum animálium percutiéntium álteram ad álteram, et vocem rotárum sequéntium animália, et vocem commotiónis magnæ."
      en: "And the noise of the wings of the living creatures striking one against another, and the noise of the wheels following the living creatures, and the noise of a great commotion."
    status: { la: verified, en: verified }
