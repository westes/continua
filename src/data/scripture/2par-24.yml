# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 24
verses:
  - n: 1
    text:
      la: "Septem annorum erat Joas cum regnare coepisset, et quadraginta annis regnavit in Jerusalem: nomen matris ejus Sebia de Bersabee."
      en: "Joas was seven years old when he began to reign: and he reigned forty years in Jerusalem: the name of his mother was Sebia of Bersabee."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fecitque quod bonum est coram Domino cunctis diebus Jojadae sacerdotis."
      en: "And he did that which is good before the Lord all the days of Joiada the priest."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Accepit autem ei Jojada uxores duas, e quibus genuit filios et filias."
      en: "And Joiada took for him two wives, by whom he had sons and daughters."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Post quae placuit Joas ut instauraret domum Domini."
      en: "After this Joas had a mind to repair the house of the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Congregavitque sacerdotes, et Levitas, et dixit eis: Egredimini ad civitates Juda, et colligite de universo Israel pecuniam ad sartatecta templi Dei vestri, per singulos annos, festinatoque hoc facite: porro Levitae egere negligentius."
      en: "And he assembled the priests, and the Levites, and said to them: Go out to the cities of Juda, and gather of all Israel money to repair the temple of your God, from year to year: and do this with speed: but the Levites were negligent."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Vocavitque rex Jojadam principem, et dixit ei: Quare tibi non fuit curae, ut cogeres Levitas inferre de Juda et de Jerusalem pecuniam quae constituta est a Moyse servo Domini, ut inferret eam omnis multitudo Israel in tabernaculum testimonii?"
      en: "And the king called Joiada the chief, and said to him: Why hast thou not taken care to oblige the Levites to bring in out of Juda and Jerusalem the money that was appointed by Moses the servant of the Lord for all the multitude of Israel to bring into the tabernacle of the testimony?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Athalia enim impiissima, et filii ejus destruxerunt domum Dei, et de universis, quae sanctificata fuerant in templo Domini, ornaverunt fanum Baalim."
      en: "For that wicked woman Athalia, and her children have destroyed the house of God, and adorned the temple of Baal with all the things that had been dedicated in the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Praecepit ergo rex, et fecerunt arcam: posueruntque eam juxta portam domus Domini forinsecus."
      en: "And the king commanded, and they made a chest: and set it by the gate of the house of the Lord on the outside."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et praedicatum est in Juda et Jerusalem ut deferrent singuli pretium Domino, quod constituit Moyses servus Dei super omnem Israel in deserto."
      en: "And they made a proclamation in Juda and Jerusalem, that every man should bring to the Lord the money which Moses the servant of God appointed for all Israel, in the desert."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Laetatique sunt cuncti principes, et omnis populus: et ingressi contulerunt in arcam Domini, atque miserunt ita ut impleretur."
      en: "And all the princes, and all the people rejoiced: and going In they contributed and cast so much into the chest of the Lord, that it was filled."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cumque tempus esset ut deferrent arcam coram rege per manus Levitarum ( videbant enim multam pecuniam), ingrediebatur scriba regis, et quem primus sacerdos constituerat: effundebantque pecuniam quae erat in arca: porro arcam reportabant ad locum suum: sicque faciebant per singulos dies, et congregata est infinita pecunia,"
      en: "And when it was time to bring the chest before the king by the hands of the Levites, (for they saw there was much money,) the king's scribe, and he whom the high priest had appointed went in: and they poured out the money that was in the chest: and they carried back the chest to its place: and thus they did from day to day, and there was gathered an immense sum of money."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quam dederunt rex et Jojada his, qui praeerant operibus domus Domini: at illi conducebant ex ea caesores lapidum, et artifices operum singulorum ut instaurarent domum Domini: fabros quoque ferri et aeris, ut quod cadere coeperat, fulciretur."
      en: "And the king and Joiada gave it to those who were over the works of the house of the Lord: but they hired with it stonecutters, and artificers of every kind of work to repair the house of the Lord: and such as wrought in iron and brass, to uphold what began to be falling."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Egeruntque hi qui operabantur industrie, et obducebatur parietum cicatrix per manus eorum, ac suscitaverunt domum Domini in statum pristinum, et firmiter eam stare fecerunt."
      en: "And the workmen were diligent, and the breach of the walls was closed up by their hands, and they set up the house of the Lord in its former state, and made it stand firm."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cumque complessent omnia opera, detulerunt coram rege, et Jojada reliquam partem pecuniae: de qua facta sunt vasa templi in ministerium, et ad holocausta, phialae quoque, et cetera vasa aurea et argentea: offerebantur holocausta in domo Domini jugiter cunctis diebus Jojadae."
      en: "And when they had finished all the works, they brought the rest of the money before the king and Joiada: and with it were made vessels for the temple for the ministry, and for holocausts and bowls, and other vessels of gold and silver: and holocausts were offered in the house of the Lord continually all the days of Joiada."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Senuit autem Jojada plenus dierum, et mortuus est cum esset centum triginta annorum:"
      en: "But Joiada grew old and was full of days, and died when he was a hundred and thirty years old."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sepelieruntque eum in civitate David cum regibus, eo quod fecisset bonum cum Israel, et cum domo ejus."
      en: "And they buried him in the city of David among the kings, because he had done good to Israel, and to his house."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Postquam autem obiit Jojada, ingressi sunt principes Juda, et adoraverunt regem, qui delinitus obsequiis eorum, acquievit eis."
      en: "And after the death of Joiada, the princes of Juda went in, and worshipped the king: and he was soothed by their services and hearkened to them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et dereliquerunt templum Domini Dei patrum suorum, servieruntque lucis et sculptilibus, et facta est ira contra Judam et Jerusalem propter hoc peccatum."
      en: "And they forsook the temple of the Lord the God of their fathers, and served groves and idols, and wrath came upon Juda and Jerusalem for this sin."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Mittebatque eis prophetas ut reverterentur ad Dominum, quos protestantes illi audire nolebant."
      en: "And he sent prophets to them to bring them back to the Lord, and they would not give ear when they testified against them."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Spiritus itaque Dei induit Zachariam filium Jojadae sacerdotem, et stetit in conspectu populi, et dixit eis: Haec dicit Dominus Deus: Quare transgredimini praeceptum Domini, quod vobis non proderit, et dereliquistis Dominum ut derelinqueret vos?"
      en: "The spirit of God then came upon Zacharias the son of Joiada the priest, and he stood in the sight of the people, and said to them: Thus saith the Lord God: Why transgress you the commandment of the Lord which will not be for your good, and have forsaken the Lord, to make him forsake you?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Qui congregati adversus eum, miserunt lapides juxta regis imperium in atrio domus Domini."
      en: "And they gathered themselves together against him, and stoned him at the king's commandment in the court of the house of the Lord."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et non est recordatus Joas rex misericordiae, quam fecerat Jojada pater illius secum, sed interfecit filium ejus. Qui cum moreretur, ait: Videat Dominus, et requirat."
      en: "And king Joas did not remember the kindness that Joiada his father had done to him, but killed his son. And when he died, he said: The Lord see, and require it."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cumque evolutus esset annus, ascendit contra eum exercitus Syriae: venitque in Judam et Jerusalem, et interfecit cunctos principes populi, atque universam praedam miserunt regi in Damascum."
      en: "And when a year was come about, the army of Syria came up against him: and they came to Juda and Jerusalem, and killed all the princes of the people, and they sent all the spoils to the king of Damascus."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et certe cum permodicus venisset numerus Syrorum, tradidit Dominus in manibus eorum infinitam multitudinem, eo quod dereliquissent Dominum Deum patrum suorum: in Joas quoque ignominiosa exercuere judicia."
      en: "And whereas there came a very small number of the Syrians, the Lord delivered into their hands an infinite multitude, because they had forsaken the Lord the God of their fathers: and on Joas they executed shameful judgments."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et abeuntes dimiserunt eum in languoribus magnis: surrexerunt autem contra eum servi sui in ultionem sanguinis filii Jojadae sacerdotis, et occiderunt eum in lectulo suo, et mortuus est: sepelieruntque eum in civitate David, sed non in sepulchris regum."
      en: "And departing they left him in diseases: and his servants rose up against him, for revenge of the blood of the son of Joiada the priest, and they slew him in his bed, and he died: and they buried him in the city of David, but not in the sepulchres of the kings."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Insidiati vero sunt ei Zabad filius Semaath Ammanitidis, et Jozabad filius Semmarith Moabitidis."
      en: "Now the men that conspired against him were Zabad the son of Semmaath an Ammonitess, and Jozabad the son of Semarith a Moabitess."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Porro filii ejus, ac summa pecuniae quae adunata fuerat sub eo, et instauratio domus Dei, scripta sunt diligentius in libro regum: regnavit autem Amasias filius ejus pro eo."
      en: "And concerning his sons, and the sum of money which was gathered under him, and the repairing the house of God; they are written more diligently in the book of kings: and Amasias his son reigned in his stead."
    status: { la: verified, en: verified }
