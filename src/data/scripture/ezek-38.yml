book: ezek
chapter: 38
verses:
  - n: 1
    text:
      la: "et factus est sermo Domini ad me dicens"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fili hominis pone faciem tuam contra Gog terram Magog principem capitis Mosoch et Thubal et vaticinare de eo"
      en: "Son of man, set thy face against Gog, the land of Magog, the chief prince of Mosoch and Thubal: and prophesy of him,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dices ad eum haec dicit Dominus Deus ecce ego ad te Gog principem capitis Mosoch et Thubal"
      en: "And say to him: Thus saith the Lord God: Behold, I come against thee, O Gog, the chief prince of Mosoch and Thubal."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et circumagam te et ponam frenum in maxillis tuis et educam te et omnem exercitum tuum equos et equites vestitos loricis universos multitudinem magnam hastam et clypeum arripientium et gladium"
      en: "And I will turn thee about, and I will put a bit in thy jaws: and I will bring thee forth, and ail thy army, horses and horsemen all clothed with coats of mail, a great multitude, armed with spears and shields and swords."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Persae Aethiopes et Lybies cum eis omnes scutati et galeati"
      en: "The Persians, Ethiopians, and Libyans with them, all with shields and helmets."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Gomer et universa agmina eius domus Thogorma latera aquilonis et totum robur eius populique multi tecum"
      en: "Gomer, and all his bands, the house of Thogorma, the northern parts and all his strength, and many peoples with thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "praepara et instrue te et omnem multitudinem tuam quae coacervata est ad te et esto eis in praeceptum"
      en: "Prepare and make thyself ready, and all thy multitude that is assembled about thee, and be thou commander over them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "post dies multos visitaberis in novissimo annorum venies ad terram quae reversa est a gladio congregata est de populis multis ad montes Israhel qui fuerunt deserti iugiter haec de populis educta est et habitaverunt in ea confidenter universi"
      en: "After many days thou shalt be visited: at the end of years thou shalt come to the land that is returned from the sword, and is gathered out of many nations, to the mountains of Israel which have been continually waste: but it hath been brought forth out of the nations, and they shall all of them dwell securely in"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ascendens autem quasi tempestas venies et quasi nubes ut operias terram tu et omnia agmina tua et populi multi tecum"
      en: "And thou shalt go up and come like a storm, and like a cloud to cover the land, thou and all thy bands and many people with thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "haec dicit Dominus Deus in die illa ascendent sermones super cor tuum et cogitabis cogitationem pessimam"
      en: "Thus saith the Lord God: In that day projects shall enter into thy heart, and thou shalt conceive a mischievous design."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dices ascendam ad terram absque muro veniam ad quiescentes habitantesque secure omnes habitant sine muro vectes et portae non sunt eis"
      en: "And thou shalt say: I will go up to the land which is without a wall, I will come to them that are at rest, and dwell securely: all these dwell without a wall, they have no bars nor gates :"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ut diripias spolia et invadas praedam ut inferas manum tuam super eos qui deserti fuerant et postea restituti et super populum qui est congregatus ex gentibus qui possidere coepit et esse habitator umbilici terrae"
      en: "To take spoils, and lay hold on the prey, to lay thy hand upon them that had been wasted, and afterwards restored, and upon the people that is gathered together out of the nations, which hath begun to possess and to dwell in the midst of the earth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Seba et Dedan et negotiatores Tharsis et omnes leones eius dicent tibi numquid ad sumenda spolia tu venis ecce ad diripiendam praedam congregasti multitudinem tuam ut tollas argentum et aurum auferas supellectilem atque substantiam et diripias manubias infinitas"
      en: "Saba, and Dedan, and the merchants of Tharsis, and all the lions thereof shall say to thee: Art thou come to take spoils? behold, thou hast gathered thy multitude to take a prey, to take silver, and gold, and to carry away goods and substance, and to take rich spoils."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "propterea vaticinare fili hominis et dices ad Gog haec dicit Dominus Deus numquid non in die illo cum habitaverit populus meus Israhel confidenter scies"
      en: "Therefore, thou son of man, prophesy and say to Cog: Thus saith the Lord God: Shalt thou not know, in that day, when my people of Israel shall dwell securely?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et venies de loco tuo a lateribus aquilonis tu et populi multi tecum ascensores equorum universi coetus magnus et exercitus vehemens"
      en: "And then shalt come out of thy place from the northern parts, thou and many people with thee, all of them riding upon horses, a great company and a mighty army."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et ascendes super populum meum Israhel quasi nubes ut operias terram in novissimis diebus eris et adducam te super terram meam ut sciant gentes me cum sanctificatus fuero in te in oculis eorum o Gog"
      en: "And thou shalt come upon my people of Israel like a cloud, to cover the earth. Thou shalt be in the latter days, and I will bring thee upon my land: that the nations may know me, when I shall be sanctified in thee, O Gog, before their eyes."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "haec dicit Dominus Deus tu ergo ille es de quo locutus sum in diebus antiquis in manu servorum meorum prophetarum Israhel qui prophetaverunt in diebus illorum temporum ut adducerem te super eos"
      en: "Thus saith the Lord God: Thou then art he, of whom I have spoken in the days of old, by my servants the prophets of Israel, who prophesied in the days of those times that I would bring thee upon them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et erit in die illa in die adventus Gog super terram Israhel ait Dominus Deus ascendet indignatio mea in furore meo"
      en: "And it shall come to pass in that day, in the day of the coming of Gog upon the land of Israel, saith the Lord God, that my indignation shall come up in my wrath."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et in zelo meo in igne irae meae locutus sum quia in die illa erit commotio magna super terram Israhel"
      en: "And I have spoken in my zeal, and in the fire of my anger, that in that day there shall be a great commotion upon the land of Israel:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et commovebuntur a facie mea pisces maris et volucres caeli et bestiae agri et omne reptile quod movetur super humum cunctique homines qui sunt super faciem terrae et subvertentur montes et cadent sepes et omnis murus in terra corruet"
      en: "So that the fishes of the sea, and the birds of the air, and the beasts of the field, and every creeping thing that creepeth upon the ground, and all men that are upon the face of the earth, shall be moved at my presence: and the mountains shall be thrown down, and the hedges shall fall, and every wall shall fall to the ground."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et convocabo adversum eum in cunctis montibus meis gladium ait Dominus Deus gladius uniuscuiusque in fratrem suum dirigetur"
      en: "And I will call in the sword against him in all my mountains, saith the Lord God: every man's sword shall be pointed against his brother."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et iudicabo eum peste et sanguine et imbre vehementi et lapidibus inmensis ignem et sulphur pluam super eum et super exercitum eius et super populos multos qui sunt cum eo"
      en: "And I will judge him with pestilence, and with blood, and with violent rain, and vast hailstones: I will rain fire and brimstone upon him, and upon his army, and upon the many nations that are with him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et magnificabor et sanctificabor et notus ero in oculis gentium multarum et scient quia ego Dominus"
      en: "And I will be magnified, and I will be sanctified: and I will be known in the eyes of many nations: and they shall know that I am the Lord."
    status: { la: verified, en: verified }
