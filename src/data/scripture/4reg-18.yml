# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 18
verses:
  - n: 1
    text:
      la: "Anno tertio Osee filii Ela regis Israel, regnavit Ezechias filius Achaz regis Juda."
      en: "In the third year of Osee the son of Ela king of Israel, reigned Ezechias the son of Achaz king of Juda."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Viginti quinque annorum erat cum regnare coepisset, et viginti novem annis regnavit in Jerusalem: nomen matris ejus Abi filia Zachariae."
      en: "He was five and twenty years old when he began to reign: and he reigned nine and twenty years in Jerusalem: the name of his mother was Abi the daughter of Zacharias."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Fecitque quod erat bonum coram Domino, juxta omnia quae fecerat David pater ejus."
      en: "And he did that which was good before the Lord, according to all that David his father had done."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ipse dissipavit excelsa, et contrivit statuas, et succidit lucos, confregitque serpentem aeneum, quem fecerat Moyses: siquidem usque ad illud tempus filii Israel adolebant ei incensum: vocavitque nomen ejus Nohestan."
      en: "He destroyed the high places, and broke the statues in pieces, and cut down the groves, and broke the brazen serpent, which Moses had made: for till that time the children of Israel burnt incense to it: and he called its name Nohestan."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "In Domino Deo Israel speravit: itaque post eum non fuit similis ei de cunctis regibus Juda, sed neque in his qui ante eum fuerunt:"
      en: "He trusted in the Lord the God of Israel: so that after him there was none like him among all the kings of Juda, nor any of them that were before him:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et adhaesit Domino, et non recessit a vestigiis ejus, fecitque mandata ejus, quae praeceperat Dominus Moysi."
      en: "And he stuck to the Lord, and departed not from his steps, but kept his commandments, which the Lord commanded Moses."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Unde et erat Dominus cum eo, et in cunctis, ad quae procedebat, sapienter se agebat. Rebellavit quoque contra regem Assyriorum, et non servivit ei."
      en: "Wherefore the Lord also was with him, and in all things, to which he went forth, he behaved himself wisely. And he rebelled against the king of the Assyrians, and served him not."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ipse percussit Philisthaeos usque ad Gazam, et omnes terminos eorum, a turre custodum usque ad civitatem munitam."
      en: "He smote the Philistines as far as Gaza, and all their borders, from the tower of the watchmen to the fenced city."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Anno quarto regis Ezechiae, qui erat annus septimus Osee filii Ela regis Israel, ascendit Salmanasar rex Assyriorum in Samariam, et oppugnavit eam,"
      en: "In the fourth year of king Ezechias, which was the seventh year of Osee the son of Ela king of Israel, Salmanasar king of the Assyrians came up to Samaria, and besieged it,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et cepit. Nam post annos tres, anno sexto Ezechiae, id est nono anno Osee regis Israel, capta est Samaria:"
      en: "And took it. For after three years, in the sixth year of Ezechias, that is, in the ninth year of Osee king of Israel, Samaria was taken:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et transtulit rex Assyriorum Israel in Assyrios, collocavitque eos in Hala, et in Habor fluviis Gozan in civitatibus Medorum:"
      en: "And the king of the Assyrians carried away Israel into Assyria, and placed them in Hale, and in Habor by the rivers of Gozan in the cities of the Medes:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quia non audierunt vocem Domini Dei sui, sed praetergressi sunt pactum ejus: omnia, quae praeceperat Moyses servus Domini, non audierunt, neque fecerunt."
      en: "Because they hearkened not to the voice of the Lord their God, but transgressed his covenant: all that Moses the servant of the Lord commanded, they would not hear nor do."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Anno quartodecimo regis Ezechiae, ascendit Sennacherib rex Assyriorum ad universas civitates Juda munitas: et cepit eas."
      en: "In the fourteenth year of king Ezechias, Sennacherib king of the Assyrians came up against the fenced cities of Juda: and took them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tunc misit Ezechias rex Juda nuntios ad regem Assyriorum in Lachis, dicens: Peccavi, recede a me: et omne, quod imposueris mihi, feram. Indixit itaque rex Assyriorum Ezechiae regi Judae trecenta talenta argenti, et triginta talenta auri."
      en: "Then Ezechias king of Juda sent messengers to the king of the Assyrians to Lachis, saying: I have offended, depart from me: and all that thou shalt put upon me, I will bear. And the king of the Assyrians put a tax upon Ezechias king of Juda, of three hundred talents of silver, and thirty talents of gold."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Deditque Ezechias omne argentum quod repertum fuerat in domo Domini, et in thesauris regis."
      en: "And Ezechias gave all the silver that was found in the house of the Lord, and in the king's treasures."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "In tempore illo confregit Ezechias valvas templi Domini, et laminas auri, quas ipse affixerat, et dedit eas regi Assyriorum."
      en: "At that time Ezechias broke the doors of the temple of the Lord, and the plates of gold which he had fastened on them, and gave them to the king of the Assyrians."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Misit autem rex Assyriorum Tharthan, et Rabsaris, et Rabsacen de Lachis ad regem Ezechiam cum manu valida Jerusalem: qui cum ascendissent, venerunt Jerusalem, et steterunt juxta aquaeductum piscinae superioris, quae est in via Agrifullonis."
      en: "And the king of the Assyrians sent Tharthan and Rabsaris, and Rabsaces from Lachis to king Ezechias with a strong army to Jerusalem: and they went up and came to Jerusalem, and they stood by the conduit of the upper pool, which is in the way of the fuller's field."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vocaveruntque regem: egressus est autem ad eos Eliacim filius Helciae praepositus domus, et Sobna scriba, et Joahe filius Asaph a commentariis."
      en: "And they called for the king: and there went out to them Eliacim the son of Helcias who was over the house, and Sobna the scribe, and Joahe the son of Asaph the recorder."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dixitque ad eos Rabsaces: Loquimini Ezechiae: Haec dicit rex magnus, rex Assyriorum: Quae est ista fiducia, qua niteris?"
      en: "And Rabsaces said to them: Speak to Ezechias: Thus saith the great king, the king of the Assyrians: What is this confidence, wherein thou trustest?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Forsitan inisti consilium, ut praepares te ad praelium. In quo confidis, ut audeas rebellare?"
      en: "Perhaps thou hast taken counsel, to prepare thyself for battle. On whom dost thou trust, that thou darest to rebel?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "An speras in baculo arundineo atque confracto Aegypto, super quem, si incubuerit homo, comminutus ingredietur manum ejus, et perforabit eam? sic est Pharao rex Aegypti omnibus qui confidunt in se."
      en: "Dost thou trust in Egypt a staff of a broken reed, upon which if a man lean, it will break and go into his hand, and pierce it? so is Pharao king of Egypt, to all that trust in him."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Quod si dixeritis mihi: In Domino Deo nostro habemus fiduciam: nonne iste est, cujus abstulit Ezechias excelsa et altaria: et praecepit Judae et Jerusalem: Ante altare hoc adorabitis in Jerusalem?"
      en: "But if you say to me: We trust in the Lord our God: is it not he, whose high places and altars Ezechias hath taken away: and hath commanded Juda and Jerusalem: You shall worship before this altar in Jerusalem?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Nunc igitur transite ad dominum meum regem Assyriorum, et dabo vobis duo millia equorum, et videte an habere valeatis ascensores eorum."
      en: "Now therefore come over to my master the king of the Assyrians, and I will give you two thousand horses, and see whether you be able to have riders for them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et quomodo potestis resistere ante unum satrapam de servis domini mei minimis? An fiduciam habes in Aegypto propter currus et equites?"
      en: "And how can you stand against one lord of the least of my master's servants? Dost thou trust in Egypt for chariots and for horsemen?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Numquid sine Domini voluntate ascendi ad locum istum, ut demolirer eum? Dominus dixit mihi: Ascende ad terram hanc, et demolire eam."
      en: "Is it without the will of the Lord that I am come up to this place to destroy it? The Lord said to me: Go up to this land and destroy it."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Dixerunt autem Eliacim filius Helciae, et Sobna, et Joahe Rabsaci: Precamur ut loquaris nobis servis tuis syriace: siquidem intelligimus hanc linguam: et non loquaris nobis judaice, audiente populo, qui est super murum."
      en: "Then Eliacim the son of Helcias, and Sobna, and Joahe said to Rabsaces: We pray thee speak to us thy servants in Syriac: for we understand that tongue: and speak not to us in the Jews' language, in the hearing of the people that are upon the wall."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Responditque eis Rabsaces, dicens: Numquid ad dominum tuum, et ad te misit me dominus meus, ut loquerer sermones hos, et non potius ad viros, qui sedent super murum, ut comedant stercora sua, et bibant urinam suam vobiscum?"
      en: "And Rabsaces answered them, saying: Hath my master sent me to thy master and to thee, to speak these words, and not rather to the men that sit upon the wall, that they may eat their own dung, and drink their urine with you?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Stetit itaque Rabsaces, et exclamavit voce magna judaice, et ait: Audite verba regis magni, regis Assyriorum."
      en: "Then Rabsaces stood, and cried out with a loud voice in the Jews' language, and said: Hear the words of the great king, the king of the Assyrians."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Haec dicit rex: Non vos seducat Ezechias: non enim poterit eruere vos de manu mea."
      en: "Thus saith the king: Let not Ezechias deceive you: for he shall not be able to deliver you out of my hand."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Neque fiduciam vobis tribuat super Dominum, dicens: Eruens liberabit nos Dominus, et non tradetur civitas haec in manu regis Assyriorum."
      en: "Neither let him make you trust in the Lord, saying: The Lord will surely deliver us, and this city shall not be given into the hand of the king of the Assyrians."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Nolite audire Ezechiam. Haec enim dicit rex Assyriorum: Facite mecum quod vobis est utile, et egredimini ad me: et comedet unusquisque de vinea sua, et de ficu sua: et bibetis aquas de cisternis vestris,"
      en: "Do not hearken to Ezechias. For thus saith the king of the Assyrians: Do with me that which is for your advantage, and come out to me: and every man of you shall eat of his own vineyard, and of his own fig tree: and you shall drink water of your own cisterns,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "donec veniam, et transferam vos in terram, quae similis est terrae vestrae, in terram fructiferam, et fertilem vini, terram panis et vinearum, terram olivarum, et olei ac mellis, et vivetis, et non moriemini. Nolite audire Ezechiam, qui vos decipit, dicens: Dominus liberabit nos."
      en: "Till I come, and take you away to a land, like to your own land, a fruitful land, and plentiful in wine, a land of bread and vineyards, a land of olives, and oil and honey, and you shall live, and not die. Hearken not to Ezechias, who deceiveth you, saying: The Lord will deliver us."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Numquid liberaverunt dii gentium terram suam de manu regis Assyriorum?"
      en: "Have any of the gods of the nations delivered their land from the hand of the king of Assyria?"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Ubi est deus Emath, et Arphad? ubi est deus Sepharvaim, Ana, et Ava? numquid liberaverunt Samariam de manu mea?"
      en: "Where is the god of Emath, and of Arphad? where is the god of Sepharvaim, of Ana, and of Ava? have they delivered Samaria out of my hand?"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Quinam illi sunt in universis diis terrarum, qui eruerunt regionem suam de manu mea ut possit eruere Dominus Jerusalem de manu mea?"
      en: "Who are they among all the gods of the nations, that have delivered their country out of my hand, that the Lord may deliver Jerusalem out of my hand?"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Tacuit itaque populus, et non respondit ei quidquam: siquidem praeceptum regis acceperant ut non responderent ei."
      en: "But the people held their peace, and answered him not a word: for they had received commandment from the king that they should not answer him."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Venitque Eliacim filius Helciae, praepositus domus, et Sobna scriba, et Joahe filius Asaph a commentariis ad Ezechiam scissis vestibus, et nuntiaverunt ei verba Rabsacis."
      en: "And Eliacim the son of Helcias, who was over the house, and Sobna the scribe, and Joahe the son of Asaph the recorder, came to Ezechias, with their garments rent, and told him the words of Rabsaces."
    status: { la: verified, en: verified }
