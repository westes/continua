# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: lev
chapter: 23
verses:
  - n: 1
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Loquere filiis Israel, et dices ad eos: Hae sunt feriae Domini, quas vocabitis sanctas."
      en: "Speak to the children of Israel, and thou shalt say to them: These are the feasts of the Lord, which you shall call holy."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sex diebus facietis opus: dies septimus, quia sabbati requies est, vocabitur sanctus: omne opus non facietis in eo: sabbatum Domini est in cunctis habitationibus vestris."
      en: "Six days shall ye do work: the seventh day, because it is the rest of the sabbath, shall be called holy. You shall do no work on that day: it is the sabbath of the Lord in all your habitations."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Hae sunt ergo feriae Domini sanctae, quas celebrare debetis temporibus suis."
      en: "These also are the holy days of the Lord, which you must celebrate in their seasons."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Mense primo, quartadecima die mensis ad vesperum, Phase Domini est:"
      en: "The first month, the fourteenth day of the month at evening, is the phase of the Lord:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et quintadecima die mensis hujus, solemnitas azymorum Domini est. Septem diebus azyma comedetis."
      en: "And the fifteenth day of the same month is the solemnity of the unleavened bread of the Lord. Seven days shall you eat unleavened bread."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dies primus erit vobis celeberrimus, sanctusque: omne opus servile non facietis in eo,"
      en: "The first day shall be most solemn unto you, and holy: you shall do no servile work therein:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sed offeretis sacrificium in igne Domino septem diebus. Dies autem septimus erit celebrior et sanctior: nullumque servile opus facietis in eo."
      en: "But you shall offer sacrifice in fire to the Lord seven days. And the seventh day shall be more solemn, and more holy: and you shall do no servile work therein."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Loquere filiis Israel, et dices ad eos: Cum ingressi fueritis terram, quam ego dabo vobis, et messueritis segetem, feretis manipulos spicarum, primitias messis vestrae, ad sacerdotem:"
      en: "Speak to the children of Israel, and thou shalt say to them: When you shall have entered into the land which I will give you, and shall reap your corn, you shall bring sheaves of ears, the firstfruits of your harvest to the priest:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "qui elevabit fasciculum coram Domino, ut acceptabile sit pro vobis, altero die sabbati, et sanctificabit illum."
      en: "Who shall lift up the sheaf before the Lord, the next day after the sabbath, that it may be acceptable for you, and shall sanctify it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Atque in eodem die quo manipulus consecratur, caedetur agnus immaculatus anniculus in holocaustum Domini."
      en: "And on the same day that the sheaf is consecrated, a lamb without blemish of the first year shall be killed for a holocaust of the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et libamenta offerentur cum eo, duae decimae similae conspersae oleo in incensum Domini, odoremque suavissimum: liba quoque vini, quarta pars hin."
      en: "And the libations shall be offered with it, two tenths of flour tempered with oil for a burnt offering of the Lord, and a most sweet odour: libations also of wine, the fourth part of a hin."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Panem, et polentam, et pultes non comedetis ex segete, usque ad diem qua offeretis ex ea Deo vestro. Praeceptum est sempiternum in generationibus, cunctisque habitaculis vestris."
      en: "You shall not eat either bread, or parched corn, or frumenty of the harvest, until the day that you shall offer thereof to your God. It is a precept for ever throughout your generations, and all your dwellings."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Numerabitis ergo ab altero die sabbati, in quo obtulistis manipulum primitiarum, septem hebdomadas plenas,"
      en: "You shall count therefore from the morrow after the sabbath, wherein you offered the sheaf of the firstfruits, seven full weeks."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "usque ad alteram diem expletionis hebdomadae septimae, id est, quinquaginta dies: et sic offeretis sacrificium novum Domino"
      en: "Even unto the morrow after the seventh week be expired, that is to say, fifty days, and so you shall offer a new sacrifice to the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ex omnibus habitaculis vestris, panes primitiarum duos de duabus decimis similae fermentatae, quos coquetis in primitias Domini."
      en: "Out of all your dwellings, two loaves of the firstfruits, of two tenths of flour leavened, which you shall bake for the firstfruits of the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Offeretisque cum panibus septem agnos immaculatos anniculos, et vitulum de armento unum, et arietes duos, et erunt in holocaustum cum libamentis suis, in odorem suavissimum Domini."
      en: "And you shall offer with the loaves seven lambs without blemish of the first year, and one calf from the herd, and two rams, and they shall be for a holocaust with their libations for a most sweet odour to the Lord."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Facietis et hircum pro peccato, duosque agnos anniculos hostias pacificorum."
      en: "You shall offer also a buck goat for sin, and two lambs of the first year for sacrifices of peace offerings."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Cumque elevaverit eos sacerdos cum panibus primitiarum coram Domino, cedent in usum ejus."
      en: "And when the priest hath lifted them up with the loaves of the firstfruits before the Lord, they shall fall to his use."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et vocabitis hunc diem celeberrimum, atque sanctissimum: omne opus servile non facietis in eo. Legitimum sempiternum erit in cunctis habitaculis, et generationibus vestris."
      en: "And you shall call this day most solemn, and most holy. You shall do no servile work therein. It shall be an everlasting ordinance in all your dwellings and generations."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Postquam autem messueritis segetem terrae vestrae, nec secabitis eam usque ad solum, nec remanentes spicas colligetis: sed pauperibus et peregrinis dimittetis eas. Ego sum Dominus Deus vester."
      en: "And when you reap the corn of your land, you shall not cut it to the very ground: neither shall you gather the ears that remain; but you shall leave them for the poor and for the strangers. I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Loquere filiis Israel: Mense septimo, prima die mensis, erit vobis sabbatum, memoriale, clangentibus tubis, et vocabitur sanctum:"
      en: "Say to the children of Israel: The seventh month, on the first day of the month, you shall keep a sabbath, a memorial, with the sound of trumpets, and it shall be called holy."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "omne opus servile non facietis in eo, et offeretis holocaustum Domino."
      en: "You shall do no servile work therein, and you shall offer a holocaust to the Lord."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Decimo die mensis hujus septimi, dies expiationum erit celeberrimus, et vocabitur sanctus: affligetisque animas vestras in eo, et offeretis holocaustum Domino."
      en: "Upon the tenth day of this seventh month shall be the day of atonement, it shall be most solemn, and shall be called holy: and you shall afflict your souls on that day, and shall offer a holocaust to the Lord."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Omne opus servile non facietis in tempore diei hujus: quia dies propitiationis est, ut propitietur vobis Dominus Deus vester."
      en: "You shall do no servile work in the time of this day: because it is a day of propitiation, that the Lord your God may be merciful unto you."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Omnis anima, quae afflicta non fuerit die hac, peribit de populis suis:"
      en: "Every soul that is not afflicted on this day, shall perish from among his people:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et quae operis quippiam fecerit, delebo eam de populo suo."
      en: "And every soul that shall do any work, the same will I destroy from among his people."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Nihil ergo operis facietis in eo: legitimum sempiternum erit vobis in cunctis generationibus, et habitationibus vestris."
      en: "You shall do no work therefore on that day: it shall be an everlasting ordinance unto you in all your generations, and dwellings."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Sabbatum requietionis est, et affligetis animas vestras die nono mensis: a vespera usque ad vesperam celebrabitis sabbata vestra."
      en: "It is a sabbath of rest, and you shall afflict your souls beginning on the ninth day of the month: from evening until evening you shall celebrate your sabbaths."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et locutus est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Loquere filiis Israel: A quintodecimo die mensis hujus septimi, erunt feriae tabernaculorum septem diebus Domino."
      en: "Say to the children of Israel: From the fifteenth day of this same seventh month, shall be kept the feast of tabernacles seven days to the Lord."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Dies primus vocabitur celeberrimus atque sanctissimus: omne opus servile non facietis in eo."
      en: "The first day shall be called most solemn and most holy: you shall do no servile work therein. And seven days you shall offer holocausts to the Lord."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et septem diebus offeretis holocausta Domino. Dies quoque octavus erit celeberrimus, atque sanctissimus, et offeretis holocaustum Domino: est enim coetus atque collectae: omne opus servile non facietis in eo."
      en: "The eighth day also shall be most solemn and most holy, and you shall offer holocausts to the Lord: for it is the day of assembly and congregation: you shall do no servile work therein."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Hae sunt feriae Domini, quas vocabitis celeberrimas atque sanctissimas, offeretisque in eis oblationes Domino, holocausta et libamenta juxta ritum uniuscujusque diei:"
      en: "These are the feasts of the Lord, which you shall call most solemn and most holy, and shall offer on them oblations to the Lord, holocausts and libations according to the rite of every day,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "exceptis sabbatis Domini, donisque vestris, et quae offeretis ex voto, vel quae sponte tribuetis Domino."
      en: "Besides the sabbaths of the Lord, and your gifts, and those things that you offer by vow, or which you shall give to the Lord voluntarily."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "A quintodecimo ergo die mensis septimi, quando congregaveritis omnes fructus terrae vestrae, celebrabitis ferias Domini septem diebus: die primo et die octavo erit sabbatum, id est, requies."
      en: "So from the fifteenth day of the seventh month, when you shall have gathered in all the fruits of your land, you shall celebrate the feast of the Lord seven days: on the first day and the eighth shall be a sabbath, that is a day of rest."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Sumetisque vobis die primo fructus arboris pulcherrimae, spatulasque palmarum, et ramos ligni densarum frondium, et salices de torrente, et laetabimini coram Domino Deo vestro."
      en: "And you shall take to you on the first day the fruits of the fairest tree, and branches of palm trees, and boughs of thick trees, and willows of the brook, and you shall rejoice before the Lord your God."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Celebrabitisque solemnitatem ejus septem diebus per annum: legitimum sempiternum erit in generationibus vestris. Mense septimo festa celebrabitis,"
      en: "And you shall keep the solemnity thereof seven days in the year. It shall be an everlasting ordinance in your generations. In the seventh month shall you celebrate this feast."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et habitabitis in umbraculis septem diebus: omnis, qui de genere est Israel, manebit in tabernaculis,"
      en: "And you shall dwell in bowers seven days: every one that is of the race of Israel, shall dwell in tabernacles:"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "ut discant posteri vestri quod in tabernaculis habitare fecerim filios Israel, cum educerem eos de terra Aegypti. Ego Dominus Deus vester."
      en: "That your posterity may know, that I made the children of Israel to dwell in tabernacles, when I brought them out of the land of Egypt. I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Locutusque est Moyses super solemnitatibus Domini ad filios Israel."
      en: "And Moses spoke concerning the feasts of the Lord to the children of Israel."
    status: { la: verified, en: verified }
