# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 6
verses:
  - n: 1
    text:
      la: "cumque coepissent homines multiplicari super terram et filias procreassent"
      en: "And after that men began to be multiplied upon the earth, and daughters were born to them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "videntes filii Dei filias eorum quod essent pulchrae acceperunt uxores sibi ex omnibus quas elegerant"
      en: "The sons of God seeing the daughters of men, that they were fair, took themselves wives of all which they chose."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixitque Deus non permanebit spiritus meus in homine in aeternum quia caro est eruntque dies illius centum viginti annorum"
      en: "And God said: My spirit shall not remain in man for ever, because he is flesh, and his days shall be a hundred and twenty years."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "gigantes autem erant super terram in diebus illis postquam enim ingressi sunt filii Dei ad filias hominum illaeque genuerunt isti sunt potentes a saeculo viri famosi"
      en: "Now giants were upon the earth in those days. For after the sons of God went in to the daughters of men and they brought forth children, these are the mighty men of old, men of renown."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "videns autem Deus quod multa malitia hominum esset in terra et cuncta cogitatio cordis intenta esset ad malum omni tempore"
      en: "And God seeing that the wickedness of men was great on the earth, and that all the thought of their heart was bent upon evil at all times,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "paenituit eum quod hominem fecisset in terra et tactus dolore cordis intrinsecus"
      en: "It repented him that he had made man on the earth. And being touched inwardly with sorrow of heart,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "delebo inquit hominem quem creavi a facie terrae ab homine usque ad animantia a reptili usque ad volucres caeli paenitet enim me fecisse eos"
      en: "He said: I will destroy man, whom I have created, from the face of the earth, from man even to beasts, from the creeping thing even to the fowls of the air, for it repenteth me that I have made them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Noe vero invenit gratiam coram Domino"
      en: "But Noe found grace before the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "hae generationes Noe Noe vir iustus atque perfectus fuit in generationibus suis cum Deo ambulavit"
      en: "These are the generations of Noe: Noe was a just and perfect man in his generations, he walked with God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et genuit tres filios Sem Ham et Iafeth"
      en: "And he begot three sons, Sem, Cham, and Japheth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "corrupta est autem terra coram Deo et repleta est iniquitate"
      en: "And the earth was corrupted before God, and was filled with iniquity."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cumque vidisset Deus terram esse corruptam omnis quippe caro corruperat viam suam super terram"
      en: "And when God had seen that the earth was corrupted (for all flesh had corrupted its way upon the earth,)"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixit ad Noe finis universae carnis venit coram me repleta est terra iniquitate a facie eorum et ego disperdam eos cum terra"
      en: "He said to Noe: The end of all flesh is come before me, the earth is filled with iniquity through them, and I will destroy them with the earth."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "fac tibi arcam de lignis levigatis mansiunculas in arca facies et bitumine linies intrinsecus et extrinsecus"
      en: "Make thee an ark of timber planks: thou shalt make little rooms in the ark, and thou shalt pitch it within and without."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et sic facies eam trecentorum cubitorum erit longitudo arcae quinquaginta cubitorum latitudo et triginta cubitorum altitudo illius"
      en: "And thus shalt thou make it: The length of the ark shall be three hundred cubits: the breadth of it fifty cubits, and the height of it thirty cubits."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "fenestram in arca facies et in cubito consummabis summitatem ostium autem arcae pones ex latere deorsum cenacula et tristega facies in ea"
      en: "Thou shalt make a window in the ark, and in a cubit shalt thou finish the top of it: and the door of the ark thou shalt set in the side: with lower, middle chambers, and third stories shalt thou make it."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ecce ego adducam diluvii aquas super terram ut interficiam omnem carnem in qua spiritus vitae est subter caelum universa quae in terra sunt consumentur"
      en: "Behold I will bring the waters of a great flood upon the earth, to destroy all flesh, wherein is the breath of life, under heaven. All things that are in the earth shall be consumed."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ponamque foedus meum tecum et ingredieris arcam tu et filii tui uxor tua et uxores filiorum tuorum tecum"
      en: "And I will establish my covenant with thee, and thou shalt enter into the ark, thou and thy sons, and thy wife, and the wives of thy sons with thee."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et ex cunctis animantibus universae carnis bina induces in arcam ut vivant tecum masculini sexus et feminini"
      en: "And of every living creature of all flesh, thou shalt bring two of each sort into the ark, that they may live with thee: of the male sex, and the female."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "de volucribus iuxta genus suum et de iumentis in genere suo et ex omni reptili terrae secundum genus suum bina de omnibus ingredientur tecum ut possint vivere"
      en: "Of fowls according to their kind, and of beasts in their kind, and of every thing that creepeth on earth according to its kind; two of every sort shall go in with thee, that they may live."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "tolles igitur tecum ex omnibus escis quae mandi possunt et conportabis apud te et erunt tam tibi quam illis in cibum"
      en: "Thou shalt take unto thee of all food that may be eaten, and thou shalt lay it up with thee: and it shall be food for thee and them."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "fecit ergo Noe omnia quae praeceperat illi Deus"
      en: "And Noe did all things which God commanded him."
    status: { la: verified, en: verified }
