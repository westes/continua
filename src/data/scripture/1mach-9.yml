# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1mach
chapter: 9
verses:
  - n: 1
    text:
      la: "Interea, ut audivit Demetrius quia cecidit Nicanor et exercitus ejus in praelio, apposuit Bacchidem et Alcimum rursum mittere in Judaeam, et dextrum cornu cum illis."
      en: "In the mean time when Demetrius heard that Nicanor and his army were fallen in battle, he sent again Bacchides and Alcimus into Judea; and the right wing of his army with them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et abierunt viam quae ducit in Galgala, et castra posuerunt in Masaloth, quae est in Arbellis: et occupaverunt eam, et peremerunt animas hominum multas."
      en: "And they took the road that leadeth to Galgal, and they camped in Masaloth, which is in Arabella: and they made themselves masters of it, and slew many people."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "In mense primo anni centesimi et quinquagesimi secundi, applicuerunt exercitum ad Jerusalem:"
      en: "In the first month of the hundred and fifty-second year they brought the army to Jerusalem:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et surrexerunt, et abierunt in Beream viginti millia virorum, et duo millia equitum."
      en: "And they arose, and went to Berea with twenty thousand men, and two thousand horsemen."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et Judas posuerat castra in Laisa, et tria millia viri electi cum eo:"
      en: "Now Judas had pitched his tents in Laisa, and three thousand chosen men with him:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et viderunt multitudinem exercitus, quia multi sunt, et timuerunt valde: et multi subtraxerunt se de castris, et non remanserunt ex eis nisi octingenti viri."
      en: "And they saw the multitude of the army that they were many, and they were seized with great fear: and many withdrew themselves out of the camp, and there remained of them no more than eight hundred men."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et vidit Judas quod defluxit exercitus suus, et bellum perurgebat eum, et confractus est corde, quia non habebat tempus congregandi eos, et dissolutus est."
      en: "And Judas saw that his army slipped away, and the battle pressed upon him, and his heart was cast down: because he had not time to gather them together, and he was discouraged."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et dixit his qui residui erant: Surgamus, et eamus ad adversarios nostros, si poterimus pugnare adversus eos."
      en: "Then he said to them that remained: Let us arise, and go against our enemies, if we may be able to fight against them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et avertebant eum, dicentes: Non poterimus, sed liberemus animas nostras modo, et revertamur ad fratres nostros, et tunc pugnabimus adversus eos: nos autem pauci sumus."
      en: "But they dissuaded him, saying: We shall not be able, but let us save our lives now, and return to our brethren, and then we will fight against them: for we are but few."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et ait Judas: Absit istam rem facere ut fugiamus ab eis: et si appropiavit tempus nostrum, moriamur in virtute propter fratres nostros, et non inferamus crimen gloriae nostrae."
      en: "Then Judas said: God forbid we should do this thing, and flee away from them: but if our time be come, let us die manfully for our brethren, and let us not stain our glory."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et movit exercitus de castris, et steterunt illis obviam: et divisi sunt equites in duas partes, et fundibularii et sagittarii praeibant exercitum, et primi certaminis omnes potentes."
      en: "And the army removed out of the camp, and they stood over against them: and the horsemen were divided into two troops, and the slingers, and the archers went before the army, and they that were in the front were all men of valour."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Bacchides autem erat in dextro cornu, et proximavit legio ex duabus partibus, et clamabant tubis:"
      en: "And Bacchides was in the right wing, and the legion drew near on two sides, and they sounded the trumpets:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "exclamaverunt autem et hi qui erant ex parte Judae etiam ipsi, et commota est terra a voce exercituum: et commissum est praelium a mane usque ad vesperam."
      en: "And they also were on Judas' side, even they also cried out, and the earth shook at the noise of the armies: and the battle was fought from morning even unto the evening."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et vidit Judas quod firmior est pars exercitus Bacchidis in dextris, et convenerunt cum ipso omnes constantes corde:"
      en: "And Judas perceived that the stronger part of the army of Bacchides was on the right side, and all the stout of heart came together with him:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et contrita est dextera pars ab eis, et persecutus est eos usque ad montem Azoti."
      en: "And the right wing was discomfited by them, and he pursued them even to the mount Azotus."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et qui in sinistro cornu erant, viderunt quod contritum est dextrum cornu, et secuti sunt post Judam, et eos qui cum ipso erant, a tergo:"
      en: "And they that were in the left wing saw that the right wing was discomfited, and they followed after Judas, and them that were with him, at their back:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ingravatum est praelium, et ceciderunt vulnerati multi ex his et ex illis."
      en: "And the battle was hard fought, and there fell many wounded of the one side and of the other."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et Judas cecidit, et ceteri fugerunt."
      en: "And Judas was slain, and the rest fled away."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et Jonathas et Simon tulerunt Judam fratrem suum, et sepelierunt eum in sepulchro patrum suorum in civitate Modin."
      en: "And Jonathan and Simon took Judas their brother, and buried him in the sepulchre of their fathers in the city of Modin."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et fleverunt eum omnis populus Israel planctu magno, et lugebant dies multos,"
      en: "And all the people of Israel bewailed him with great lamentation, and they mourned for him many days."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et dixerunt: Quomodo cecidit potens, qui salvum faciebat populum Israel!"
      en: "And said: How is the mighty man fallen, that saved the people of Israel!"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et cetera verba bellorum Judae, et virtutum, quas fecit, et magnitudinis ejus, non sunt descripta: multa enim erant valde."
      en: "But the rest of the words of the wars of Judas, and of the noble acts that he did, and of his greatness, are not written: for they were very many."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et factum est: post obitum Judae emerserunt iniqui in omnibus finibus Israel, et exorti sunt omnes qui operabantur iniquitatem."
      en: "And it came to pass after the death of Judas, that the wicked began to put forth their heads in all the confines of Israel, and all the workers of iniquity rose up."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "In diebus illis facta est fames magna valde, et tradidit se Bacchidi omnis regio eorum cum ipsis."
      en: "In those days there was a very great famine, and they and all their country yielded to Bacchides."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et elegit Bacchides viros impios, et constituit eos dominos regionis:"
      en: "And Bacchides chose the wicked men, and made them lords of the country:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et exquirebant, et perscrutabantur amicos Judae, et adducebant eos ad Bacchidem, et vindicabat in illos, et illudebat."
      en: "And they sought out, and made diligent search after the friends of Judas, and brought them to Bacchides, and he took vengeance of them, and abused them."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et facta est tribulatio magna in Israel, qualis non fuit ex die qua non est visus propheta in Israel."
      en: "And there was a great tribulation in Israel, such as was not since the day, that there was no prophet seen in Israel."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et congregati sunt omnes amici Judae, et dixerunt Jonathae:"
      en: "And all the friends of Judas came together, and said to Jonathan:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Ex quo frater tuus Judas defunctus est, vir similis ei non est, qui exeat contra inimicos nostros, Bacchidem et eos qui inimici sunt gentis nostrae."
      en: "Since thy brother Judas died, there is not a man like him to go forth against our enemies, Bacchides, and them that are the enemies of our nation."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Nunc itaque, te hodie elegimus esse pro eo nobis in principem, et ducem ad bellandum bellum nostrum."
      en: "Now therefore we have chosen thee this day to be our prince, and captain in his stead to fight our battles."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et suscepit Jonathas tempore illo principatum, et surrexit loco Judae fratris sui."
      en: "So Jonathan took upon him the government at that time, and rose up in the place of Judas his brother."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et cognovit Bacchides, et quaerebat eum occidere."
      en: "And Bacchides had knowledge of it, and sought to kill him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et cognovit Jonathas, et Simon frater ejus, et omnes qui cum eo erant: et fugerunt in desertum Thecuae et consederunt ad aquam lacus Asphar."
      en: "And Jonathan and Simon his brother, knew it, and all that were with them: and they fled into the desert of Thecua, and they pitched by the water of the lake of Asphar,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et cognovit Bacchides, et die sabbatorum venit ipse et omnis exercitus ejus trans Jordanem."
      en: "And Bacchides understood it, and he came himself with all his army over the Jordan on the sabbath day."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et Jonathas misit fratrem suum ducem populi, et rogavit Nabuthaeos amicos suos, ut commodarent illis apparatum suum, qui erat copiosus."
      en: "And Jonathan sent his brother a captain of the people, to desire the Nabutheans his friends, that they would lend them their equipage, which was copious."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et exierunt filii Jambri ex Madaba, et comprehenderunt Joannem et omnia quae habebat, et abierunt habentes ea."
      en: "And the children of Jambri came forth out of Madaba, and took John, and all that he had, and went away with them."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Post haec verba, renuntiatum est Jonathae et Simoni fratri ejus, quia filii Jambri faciunt nuptias magnas, et ducunt sponsam ex Madaba filiam unius de magnis principibus Chanaan cum ambitione magna."
      en: "After this it was told Jonathan, and Simon his brother, that the children of Jambri made a great marriage, and were bringing the bride out of Madaba, the daughter of one of the great princes of Chanaan, with great pomp."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et recordati sunt sanguinis Joannis fratris sui: et ascenderunt, et absconderunt se sub tegumento montis."
      en: "And the remembered the blood of John their brother: and they went up, and hid themselves under the covert of the mountain."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et elevaverunt oculos suos, et viderunt: et ecce tumultus, et apparatus multus: et sponsus processit, et amici ejus, et fratres ejus obviam illis cum tympanis, et musicis, et armis multis."
      en: "And they lifted up their eyes, and saw: and behold a tumult, and great preparation: and the bridegroom came forth, and his friends, and his brethren to meet them with timbrels, and musical instruments, and many weapons."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et surrexerunt ad eos ex insidiis, et occiderunt eos, et ceciderunt vulnerati multi, et residui fugerunt in montes: et acceperunt omnia spolia eorum:"
      en: "And they rose up against them from the place where they lay in ambush, and slew them, and there fell many wounded, and the rest fled into the mountains, and they took all their spoils:"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et conversae sunt nuptiae in luctum, et vox musicorum ipsorum in lamentum."
      en: "And the marriage was turned into mourning, and the noise of their musical instruments into lamentation."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et vindicaverunt vindictam sanguinis fratris sui: et reversi sunt ad ripam Jordanis."
      en: "And they took revenge for the blood of their brother: and they returned to the bank of the Jordan."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Et audivit Bacchides, et venit die sabbatorum usque ad oram Jordanis in virtute magna."
      en: "And Bacchides heard it, and he came on the sabbath day even to the bank of the Jordan with a great power."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Et dixit ad suos Jonathas: Surgamus, et pugnemus contra inimicos nostros: non est enim hodie sicut heri et nudiustertius:"
      en: "And Jonathan said to his company: Let us arise, and fight against our enemies: for it is not now as yesterday, and the day before."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "ecce enim bellum ex adverso, aqua vero Jordanis hinc et inde, et ripae, et paludes, et saltus: et non est locus divertendi."
      en: "And behold the battle is before us, and the water of the Jordan on this side and on that side, and banks, and marshes, and woods: and there is no place for us to turn aside."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Nunc ergo, clamate in caelum, ut liberemini de manu inimicorum vestrorum. Et commissum est bellum."
      en: "Now therefore cry ye to heaven, that ye may be delivered from the hand of your enemies. And they joined battle."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Et extendit Jonathas manum suam percutere Bacchidem, et divertit ab eo retro:"
      en: "And Jonathan stretched forth his hand to strike Bacchides, but he turned away from him backwards."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et desiliit Jonathas, et qui cum eo erant, in Jordanem, et transnataverunt ad eos Jordanem."
      en: "And Jonathan, and they that were with him leaped into the Jordan, and swam over the Jordan to them:"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Et ceciderunt de parte Bacchidis die illa mille viri. Et reversi sunt in Jerusalem,"
      en: "And there fell of Bacchides' side that day a thousand men: and they returned to Jerusalem,"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "et aedificaverunt civitates munitas in Judaea, munitionem quae erat in Jericho, et in Ammaum, et in Bethoron, et in Bethel, et Thamnata, et Phara, et Thopo muris excelsis, et portis, et seris."
      en: "And they built strong cities in Judea, the fortress that was in Jericho, and in Ammaus, and in Bethoron, and in Bethel, and Thamnata, and Phara, and Thopo, with high walls, and gates, and bars."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Et posuit custodiam in eis, ut inimicitias exercerent in Israel:"
      en: "And he placed garrisons in them, that they might wage war against Israel:"
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "et munivit civitatem Bethsuram, et Gazaram, et arcem, et posuit in eis auxilia, et apparatum escarum:"
      en: "And he fortified the city of Bethsura, and Gazara, and the castle, and set garrisons in them, and provisions of victuals:"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "et accepit filios principum regionis obsides, et posuit eos in arce in Jerusalem in custodiam."
      en: "And he took the sons of the chief men of the country for hostages, and put them in the castle in Jerusalem in custody."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Et anno centesimo quinquagesimo tertio, mense secundo, praecepit Alcimus destrui muros domus sanctae interioris, et destrui opera prophetarum: et coepit destruere."
      en: "Now in the year one hundred and fifty-three, the second month, Alcimus commanded the walls of the inner court of the sanctuary to be thrown down, and the works of the prophets to be destroyed: and he began to be destroyed: and he began to destroy."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "In tempore illo percussus est Alcimus: et impedita sunt opera illius, et occlusum est os ejus, et dissolutus est paralysi, nec ultra potuit loqui verbum, et mandare de domo sua."
      en: "At that time Alcimus was struck: and his works were hindered, and his mouth was stopped, and he was taken with a palsy, so that he could no more speak a word, nor give order concerning his house."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Et mortuus est Alcimus in tempore illo cum tormento magno."
      en: "And Alcimus died at that time in great torment."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Et vidit Bacchides quoniam mortuus est Alcimus, et reversus est ad regem. Et siluit terra annis duobus."
      en: "And Bacchides saw that Alcimus was dead: and he returned to the king, and the land was quiet for two years."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Et cogitaverunt omnes iniqui, dicentes: Ecce Jonathas, et qui cum eo sunt, in silentio habitant confidenter: nunc ergo adducamus Bacchidem, et comprehendet eos omnes una nocte."
      en: "And all the wicked held a council, saying: Behold Jonathan, and they that are with him, dwell at ease, and without fear: now therefore let us bring Bacchides hither, and he shall take them all in one night."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Et abierunt, et consilium ei dederunt."
      en: "So they went, and gave him counsel."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "Et surrexit ut veniret cum exercitu multo: et misit occulte epistolas sociis suis qui erant in Judaea, ut comprehenderent Jonathan, et eos qui cum eo erant: sed non potuerunt, quia innotuit eis consilium eorum."
      en: "And he arose to come with a great army: and he sent secretly letters to his adherents that were in Judea, to seize upon Jonathan, and them that were with him: but they could not, for their design was known to them."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "Et apprehendit de viris regionis, qui principes erant malitiae, quinquaginta viros, et occidit eos:"
      en: "And he apprehended of the men of the country, that were the principal authors of the mischief, fifty men, and slew them."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "et secessit Jonathas, et Simon, et qui cum eo erant, in Bethbessen, quae est in deserto: et exstruxit diruta ejus, et firmaverunt eam."
      en: "And Jonathan, and Simon, and they that were with him retired into Bethbessen, which is in the desert: and he repaired the breaches thereof, and they fortified it."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "Et cognovit Bacchides, et congregavit universam multitudinem suam: et his, qui de Judaea erant, denuntiavit."
      en: "And when Bacchides knew it, he gathered together all his multitude: and sent word to them that were of Judea."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "Et venit, et castra posuit desuper Bethbessen: et oppugnavit eam dies multos, et fecit machinas."
      en: "And he came, and camped above Bethbessen, and fought against it many days, and made engines."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "Et reliquit Jonathas Simonem fratrem suum in civitate, et exiit in regionem, et venit cum numero:"
      en: "But Jonathan left his brother Simon in the city, and went forth into the country: and came with a number of men."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "et percussit Odaren et fratres ejus, et filios Phaseron in tabernaculis ipsorum: et coepit caedere, et crescere in virtutibus."
      en: "And struck Odares, and his brethren, and the children of Phaseron in their tents, and he began to slay, and to increase in forces."
    status: { la: verified, en: verified }
  - n: 67
    text:
      la: "Simon vero, et qui cum ipso erant, exierunt de civitate, et succenderunt machinas,"
      en: "But Simon and they that were with him, sallied out of the city, and burnt the engines."
    status: { la: verified, en: verified }
  - n: 68
    text:
      la: "et pugnaverunt contra Bacchidem, et contritus est ab eis: et afflixerunt eum valde, quoniam consilium ejus et congressus ejus erat inanis."
      en: "And they fought against Bacchides, and he was discomfited by them: and they afflicted him exceedingly, for his counsel, and his enterprise was in vain."
    status: { la: verified, en: verified }
  - n: 69
    text:
      la: "Et iratus contra viros iniquos, qui ei consilium dederant ut veniret in regionem ipsorum, multos ex eis occidit: ipse autem cogitavit cum reliquis abire in regionem suam."
      en: "And he was angry with the wicked men that had given him counsel to come into their country, and he slew many of them: and he purposed to return with the rest into their country."
    status: { la: verified, en: verified }
  - n: 70
    text:
      la: "Et cognovit Jonathas: et misit ad eum legatos componere pacem cum ipso, et reddere ei captivitatem."
      en: "And Jonathan had knowledge of it, and he sent ambassadors to him to make peace with him, and to restore to him the prisoners."
    status: { la: verified, en: verified }
  - n: 71
    text:
      la: "Et libenter accepit, et fecit secundum verba ejus, et juravit se nihil facturum ei mali omnibus diebus vitae ejus."
      en: "And he accepted it willingly, and did according to his words, and swore that he would do him no harm all the days of his life."
    status: { la: verified, en: verified }
  - n: 72
    text:
      la: "Et reddidit ei captivitatem, quam prius erat praedatus de terra Juda: et conversus abiit in terram suam, et non apposuit amplius venire in fines ejus."
      en: "And he restored to him the prisoners which he before had taken out of the land of Juda: and he returned and went away into his own country, and he came no more into their borders."
    status: { la: verified, en: verified }
  - n: 73
    text:
      la: "Et cessavit gladius ex Israel: et habitavit Jonathas in Machmas, et coepit Jonathas ibi judicare populum, et exterminavit impios ex Israel."
      en: "So the sword ceased from Israel: and Jonathan dwelt in Machmas, and Jonathan began there to judge the people, and he destroyed the wicked out of Israel."
    status: { la: verified, en: verified }
