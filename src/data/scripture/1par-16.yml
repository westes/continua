# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1par
chapter: 16
verses:
  - n: 1
    text:
      la: "Attulerunt igitur arcam Dei, et constituerunt eam in medio tabernaculi, quod tetenderat ei David: et obtulerunt holocausta, et pacifica coram Deo."
      en: "So they brought the ark of God, and set it in the midst of the tent, which David had pitched for it: and they offered holocausts, and peace offerings before God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cumque complesset David offerens holocausta, et pacifica, benedixit populo in nomine Domini."
      en: "And when David had made an end of offering holocausts, and peace offerings, he blessed the people in the name of the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et divisit universis per singulos, a viro usque ad mulierem, tortam panis, et partem assae carnis bubalae, et frixam oleo similam."
      en: "And he divided to all and every one, both men and women, a loaf of bread, and a piece of roasted beef, and flour fried with oil."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Constituitque coram arca Domini de Levitis, qui ministrarent, et recordarentur operum ejus, et glorificarent, atque laudarent Dominum Deum Israel:"
      en: "And he appointed Levites to minister before the ark of the Lord, and to remember his works, and to glorify, and praise the Lord God of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Asaph principem, et secundum ejus Zachariam: porro Jahiel, et Semiramoth, et Jehiel, et Mathathiam, et Eliab, et Banaiam, et Obededom: Jehiel super organa psalterii, et lyras: Asaph autem ut cymbalis personaret:"
      en: "Asaph the chief, and next after him Zacharias: moreover Jahiel, and Semiramoth, and Jehiel, and Mathathias, and Eliab, and Banaias, and Obededom: and Jehiel over the instruments of psaltery, and harps: and Asaph sounded with cymbals:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Banaiam vero, et Jaziel sacerdotes, canere tuba jugiter coram arca foederis Domini."
      en: "But Banaias, and Jaziel the priests, to sound the trumpet continually before the ark of the covenant of the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "In illo die fecit David principem ad confitendum Domino Asaph, et fratres ejus:"
      en: "In that day David made Asaph the chief to give praise to the Lord with his brethren."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Confitemini Domino, et invocate nomen ejus: notas facite in populis adinventiones ejus."
      en: "Praise ye the Lord, and call upon his name: make known his doings among the nations."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Cantate ei, et psallite ei: et narrate omnia mirabilia ejus."
      en: "Sing to him, yea, sing praises to him: and relate all his wondrous works."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Laudate nomen sanctum ejus: laetetur cor quaerentium Dominum."
      en: "Praise ye his holy name: let the heart of them rejoice, that seek the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quaerite Dominum, et virtutem ejus: quaerite faciem ejus semper."
      en: "Seek ye the Lord, and his power: seek ye his face evermore."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Recordamini mirabilium ejus quae fecit: signorum illius, et judiciorum oris ejus,"
      en: "Remember his wonderful works, which he hath done: his signs, and the judgments of his mouth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "semen Israel servi ejus; filii Jacob electi ejus."
      en: "O ye seed of Israel his servants, ye children of Jacob his chosen."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ipse Dominus Deus noster: in universa terra judicia ejus."
      en: "He is the Lord our God: his judgments are in all the earth."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Recordamini in sempiternum pacti ejus: sermonis, quem praecepit in mille generationes,"
      en: "Remember for ever his covenant: the word, which he commanded to a thousand generations."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quem pepigit cum Abraham: et juramenti illius cum Isaac."
      en: "The covenant which he made with Abraham: and his oath to Isaac."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et constituit illud Jacob in praeceptum: et Israel in pactum sempiternum,"
      en: "And he appointed the same to Jacob for a precept: and to Israel for an everlasting covenant:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dicens: Tibi dabo terram Chanaan, funiculum haereditatis vestrae,"
      en: "Saying: To thee will I give the land of Chanaan: the lot of your inheritance."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "cum essent pauci numero, parvi et coloni ejus."
      en: "When they were but a small number: very few and sojourners in it."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et transierunt de gente in gentem, et de regno ad populum alterum."
      en: "And they passed from nation to nation: and from a kingdom to another people."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Non dimisit quemquam calumniari eos, sed increpavit pro eis reges."
      en: "He suffered no man to do them wrong: and reproved kings for their sake."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Nolite tangere christos meos: et in prophetis meis nolite malignari."
      en: "Touch not my anointed: and do no evil to my prophets."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cantate Domino omnis terra, annuntiate ex die in diem salutare ejus,"
      en: "Sing ye to the Lord, all the earth: shew forth from day to day his salvation."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "narrate in gentibus gloriam ejus: in cunctis populis mirabilia ejus."
      en: "Declare his glory among the Gentiles: his wonders among all people."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Quia magnus Dominus, et laudabilis nimis: et horribilis super omnes deos."
      en: "For the Lord is great and exceedingly to be praised: and he is to be feared above all gods."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Omnes enim dii populorum, idola: Dominus autem caelos fecit."
      en: "For all the gods of the nations are idols: but the Lord made the heavens."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Confessio et magnificentia coram eo: fortitudo et gaudium in loco ejus."
      en: "Praise and magnificence are before him: strength and joy in his place."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Afferte Domino, familiae populorum: afferte Domino gloriam et imperium."
      en: "Bring ye to the Lord, O ye families of the nations: bring ye to the Lord glory and empire."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Date Domino gloriam; nomini ejus levate sacrificium, et venite in conspectu ejus: et adorate Dominum in decore sancto."
      en: "Give to the Lord glory to his name, bring up sacrifice, and come ye in his sight: and adore the Lord in holy becomingness."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Commoveatur a facie ejus omnis terra: ipse enim fundavit orbem immobilem."
      en: "Let all the earth be moved at his presence: for he hath founded the world immoveable."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Laetentur caeli, et exultet terra; et dicant in nationibus: Dominus regnavit."
      en: "Let the heavens rejoice, and the earth be glad: and let them say among the nations: The Lord hath reigned."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Tonet mare, et plenitudo ejus: exultent agri, et omnia quae in eis sunt."
      en: "Let the sea roar, and the fulness thereof: let the fields rejoice, and all things that are in them."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Tunc laudabunt ligna saltus coram Domino: quia venit judicare terram."
      en: "Then shall the trees of the wood give praise before the Lord: because he is come to judge the earth."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Confitemini Domino, quoniam bonus: quoniam in aeternum misericordia ejus."
      en: "Give ye glory to the Lord, for he is good: for his mercy endureth for ever."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et dicite: Salva nos, Deus salvator noster: et congrega nos, et erue de gentibus, ut confiteamur nomini sancto tuo, et exultemus in carminibus tuis."
      en: "And say ye: Save us, O God our saviour: and gather us together, and deliver us from the nations, that we may give glory to thy holy name, and may rejoice in singing thy praises."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Benedictus Dominus Deus Israel, ab aeterno usque in aeternum. Et dicat omnis populo: Amen, et hymnum Domino."
      en: "Blessed be the Lord the God of Israel from eternity to eternity: and let all the people say Amen, and a hymn to God."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Reliquit itaque ibi coram arca foederis Domini Asaph, et fratres ejus, ut ministrarent in conspectu arcae jugiter per singulos dies, et vices suas."
      en: "So he left there before the ark of the covenant of the Lord, Asaph and his brethren to minister in the presence of the ark continually day by day, and in their courses."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Porro Obededom, et fratres ejus sexaginta octo: et Obededom filium Idithun, et Hosa constituit janitores."
      en: "And Obededom, with his brethren sixty-eight: and Obededom the son of Idithun, and Hosa he appointed to be porters."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Sadoc autem sacerdotem, et fratres ejus sacerdotes, coram tabernaculo Domini in excelso, quod erat in Gabaon,"
      en: "And Sadoc the priest, and his brethren priests, before the tabernacle of the Lord in the high place, which was in Gabaon."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "ut offerrent holocausta Domino super altare holocautomatis jugiter, mane et vespere, juxta omnia quae scripta sunt in lege Domini, quam praecepit Israeli."
      en: "That they should offer holocausts to the Lord upon the altar of holocausts continually, morning and evening, according to all that is written in the law of the Lord, which he commanded Israel."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et post eum Heman, et Idithun, et reliquos electos, unumquemque vocabulo suo ad confitendum Domino, quoniam in aeternum misericordia ejus."
      en: "And after him Heman, and Idithun, and the rest that were chosen, every one by his name to give praise to the Lord: because his mercy endureth for ever."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Heman quoque, et Idithun canentes tuba, et quatientes cymbala, et omnia musicorum organa et canendum Deo: filios autem Idithun fecit esse portarios."
      en: "And Heman and Idithun sounded the trumpet, and played on the cymbals, and all kinds of musical instruments to sing praises to God: and the sons of Idithun he made porters."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Reversusque est omnis populus in domum suam: et David, ut benediceret etiam domui suae."
      en: "And all the people returned to their houses: and David to bless also his own house."
    status: { la: verified, en: verified }
