# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: prov
chapter: 12
verses:
  - n: 1
    text:
      la: "qui diligit disciplinam diligit scientiam qui autem odit increpationes insipiens est"
      en: "He that loveth correction, loveth knowledge: but he that hateth reproof is foolish."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "qui bonus est hauriet a Domino gratiam qui autem confidit cogitationibus suis impie agit"
      en: "He that is good, shall draw grace from the Lord : but he that trusteth in his own devices doth wickedly."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "non roborabitur homo ex impietate et radix iustorum non commovebitur"
      en: "Men shall not be strengthened by wickedness: and the root of the just shall not be moved."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "mulier diligens corona viro suo et putredo in ossibus eius quae confusione res dignas gerit"
      en: "A diligent woman is a crown to her husband: and she that doth things worthy of confusion, is a rottenness in his bones."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cogitationes iustorum iudicia et consilia impiorum fraudulentia"
      en: "The thoughts of the just are judgments: and the counsels of the wicked are deceitful."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "verba impiorum insidiantur sanguini os iustorum liberabit eos"
      en: "The words of the wicked lie in wait for blood: the mouth of the just shall deliver them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "verte impios et non erunt domus autem iustorum permanebit"
      en: "Turn the wicked, and they shall not be: but the house of the just shall stand firm."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "doctrina sua noscetur vir qui autem vanus et excors est patebit contemptui"
      en: "A man shall be known by his learning: but he that is vain and foolish, shall be exposed to contempt."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "melior est pauper et sufficiens sibi quam gloriosus et indigens pane"
      en: "Better is the poor man that provideth for himself, than he that is glorious and wanteth bread."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "novit iustus animas iumentorum suorum viscera autem impiorum crudelia"
      en: "The just regardeth the lives of his beasts: but the bowels of the wicked are cruel."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "qui operatur terram suam saturabitur panibus qui autem sectatur otium stultissimus est"
      en: "He that tilleth his land shall be satisfied with bread: but he that pursueth idleness is very foolish. He that is delighted in passing his time over wine, leaveth a reproach in his strong holds."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "desiderium impii munimentum est pessimorum radix autem iustorum proficiet"
      en: "The desire of the wicked is the fortification of evil men: but the root of the just shall prosper."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "propter peccata labiorum ruina proximat malo effugiet autem iustus de angustia"
      en: "For the sins of the lips ruin draweth nigh to the evil mall: but the just shall escape out of distress."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "de fructu oris sui unusquisque replebitur bonis et iuxta opera manuum suarum retribuetur ei"
      en: "By the fruit of his own mouth shall a man be filled with good things, and according to the works of his hands it shall be repaid him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "via stulti recta in oculis eius qui autem sapiens est audit consilia"
      en: "The way of a fool is right in his own eyes: but he that is wise hearkeneth unto counsels."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "fatuus statim indicat iram suam qui autem dissimulat iniuriam callidus est"
      en: "A fool immediately sheweth his anger: but he that dissembleth injuries is wise."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qui quod novit loquitur index iustitiae est qui autem mentitur testis est fraudulentus"
      en: "He that speaketh that which he knoweth, sheweth forth justice: but he that lieth, is a deceitful witness."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "est qui promittit et quasi gladio pungitur conscientiae lingua autem sapientium sanitas est"
      en: "There is that promiseth, and is pricked as it were with a sword of conscience: but the tongue of the wise is health."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "labium veritatis firmum erit in perpetuum qui autem testis est repentinus concinnat linguam mendacii"
      en: "The lip of truth shall be steadfast for ever: but he that is a hasty witness, frameth a lying tongue."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dolus in corde cogitantium mala qui autem ineunt pacis consilia sequitur eos gaudium"
      en: "Deceit is in the heart of them that think evil things: but joy followeth them that take counsels of peace."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "non contristabit iustum quicquid ei acciderit impii autem replebuntur malo"
      en: "Whatsoever shall befall the just man. it shall not make him sad: but the wicked shall be filled with mischief."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "abominatio Domino labia mendacia qui autem fideliter agunt placent ei"
      en: "Lying lips are an abomination to the Lord: but they that deal faithfully please him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "homo versutus celat scientiam et cor insipientium provocabit stultitiam"
      en: "A cautious man concealeth knowledge: and the heart of fools publisheth folly."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "manus fortium dominabitur quae autem remissa est tributis serviet"
      en: "The hand of the valiant shall bear rule: but that which is slothful, shall be under tribute."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "maeror in corde viri humiliabit illud et sermone bono laetificabitur"
      en: "Grief in the heart of a man shall bring him low, but with a good word he shall be made glad."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "qui neglegit damnum propter amicum iustus est iter autem impiorum decipiet eos"
      en: "He that neglecteth a loss for the sake of a friend, is just: but the way of the wicked shall deceive them."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "non inveniet fraudulentus lucrum et substantia hominis erit auri pretium"
      en: "The deceitful man shall not find gain: but the substance of a just man shall be precious gold."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "in semita iustitiae vita iter autem devium ducit ad mortem"
      en: "In the path of justice is life: but the by-way leadeth to death."
    status: { la: verified, en: verified }
