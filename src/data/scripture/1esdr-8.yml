# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1esdr
chapter: 8
verses:
  - n: 1
    text:
      la: "hii sunt ergo principes familiarum et genealogia eorum qui ascenderunt mecum in regno Artarxersis regis de Babylone"
      en: "Now these are the chiefs of families, and the genealogy of them, who came up with me from Babylon in the reign of Artaxerxes the king."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "de filiis Finees Gersom de filiis Ithamar Danihel de filiis David Attus"
      en: "Of the sons of Phinees, Gersom. Of the sons of Ithamar, Daniel. Of the sons of David, Hattus."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "de filiis Secheniae et de filiis Pharos Zaccharias et cum eo numerati sunt viri centum quinquaginta"
      en: "Of the sons of Sechenias, the son of Pharos, Zacharias, and with him were numbered a hundred and fifty men."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "de filiis Phaethmoab Helioenai filius Zareae et cum eo ducenti viri"
      en: "Of the sons of Phahath Moab, Eleoenai the son of Zareha, and with him two hundred men."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "de filiis Secheniae filius Hiezihel et cum eo trecenti viri"
      en: "Of the sons of Sechenias, the son of Ezechiel, and with him three hundred men."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "de filiis Adden Abeth filius Ionathan et cum eo quinquaginta viri"
      en: "Of the sons of Adan, Abed the son of Jonathan, and with him fifty men."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "de filiis Helam Isaias filius Athaliae et cum eo septuaginta viri"
      en: "Of the sons of Alam, Isaias the son of Athalias, and with him seventy men."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "de filiis Saphatiae Zebedia filius Michahel et cum eo octoginta viri"
      en: "Of the sons of Saphatia: Zebodia the son of Michael, and with him eighty men."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "de filiis Ioab Obedia filius Iehihel et cum eo ducenti decem et octo viri"
      en: "Of the sons of Joab, Obedia the son of Jahiel, and with him two hundred and eighteen men."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "de filiis Selomith filius Iosphiae et cum eo centum sexaginta viri"
      en: "Of the sons of Selomith, the son of Josphia, and with him a hundred and sixty men."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "de filiis Bebai Zaccharias filius Bebai et cum eo viginti octo viri"
      en: "Of the sons of Bebai, Zacharias the son of Bebai: and with him eight and twenty men."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "de filiis Ezgad Iohanan filius Eccetan et cum eo centum decem viri"
      en: "Of the sons of Azgad, Joanan the son of Eccetan, and with him a hundred and ten men."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "de filiis Adonicam qui erant novissimi et haec nomina eorum Helifeleth et Heihel et Samaias et cum eis sexaginta viri"
      en: "Of the sons of Adonicam, who were the last: and these are their names: Eliphelet, and Jehiel, and Samaias, and with them sixty men."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "de filiis Beggui Uthai et Zacchur et cum eo septuaginta viri"
      en: "Of the sons of Begui, Uthai and Zachur, and with them seventy men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "congregavi autem eos ad fluvium qui decurrit ad Ahavva et mansimus ibi diebus tribus quaesivique in populo et in sacerdotibus de filiis Levi et non inveni ibi"
      en: "And I gathered them together to the river, which runneth down to Ahava, and we stayed there three days: and I sought among the people and among the priests for the sons of Levi, and found none there."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "itaque misi Heliezer et Arihel et Semeam et Helnathan et Iarib et alterum Helnathan et Nathan et Zacchariam et Mesolam principes et Ioarib et Helnathan sapientes"
      en: "So I sent Eliezer, and Ariel, and Semeias, and Elnathan, and Jarib, and another Elnathan, and Nathan, and Zacharias, and Mosollam, chief men: and Joiarib, and Elnathan, wise men."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et misi eos ad Heddo qui est primus in Casphiae loco et posui in ore eorum verba quae loquerentur ad Addom et ad fratres eius Nathinneos in loco Casphiae ut adducerent nobis ministros domus Dei nostri"
      en: "And I sent them to Eddo, who is chief in the place of Chasphia, and I put in their mouth the words that they should speak to Eddo, and his brethren the Nathinites in the place of Chasphia, that they should bring us ministers of the house of our God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et adduxerunt nobis per manum Dei nostri bonam super nos virum doctissimum de filiis Moolli filii Levi filii Israhel et Sarabiam et filios eius et fratres eius decem et octo"
      en: "And by the good hand of our God upon us, they brought us a most learned man of the sons of Moholi the son of Levi the son of Israel, and Sarabias and his sons, and his brethren eighteen,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et Asabiam et cum eo Isaiam de filiis Merari fratres eius et filios eius viginti"
      en: "And Hasabias, and with him Isaias of the sons of Merari, and his brethren, and his sons twenty."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et de Nathinneis quos dederat David et principes ad ministeria Levitarum Nathinneos ducentos viginti omnes hii suis nominibus vocabantur"
      en: "And of the Nathinites, whom David, and the princes gave for the service of the Levites, Nathinites two hundred and twenty: all these were called by their names."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et praedicavi ibi ieiunium iuxta fluvium Ahavva ut adfligeremur coram Domino Deo nostro et peteremus ab eo viam rectam nobis et filiis nostris universaeque substantiae nostrae"
      en: "And I proclaimed there a fast by the river Ahava, that we might afflict ourselves before the Lord our God, and might ask of him a right way for us and for our children, and for all our substance."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "erubui enim petere regem auxilium et equites qui defenderent nos ab inimico in via quia dixeramus regi manus Dei nostri est super omnes qui quaerunt eum in bonitate et imperium eius et fortitudo eius et furor super omnes qui derelinquunt eum"
      en: "For I was ashamed to ask the king for aid and for horsemen, to defend us from the enemy in the way: because we had said to the king: The hand of our God is upon all them that seek him in goodness: and his power and strength, and wrath upon all them that forsake him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ieiunavimus autem et rogavimus Deum nostrum pro hoc et evenit nobis prospere"
      en: "And we fasted, and besought our God for this: and it fell out prosperously unto us."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et separavi de principibus sacerdotum duodecim Sarabian Asabian et cum eis de fratribus eorum decem"
      en: "And I separated twelve of the chief of the priests, Sarabias, and Hasabias, and with them ten of their brethren,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "adpendique eis argentum et aurum et vasa consecrata domus Dei nostri quae obtulerat rex et consiliatores eius et principes eius universusque Israhel eorum qui inventi fuerant"
      en: "And I weighed unto them the silver and gold, and the vessels consecrated for the house of our God, which the king and his counsellors, and his princes, and all Israel, that were found had offered."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et adpendi in manibus eorum argenti talenta sescenta quinquaginta et vasa argentea centum auri centum talenta"
      en: "And I weighed to their hands six hundred and fifty talents of silver, and a hundred vessels of silver, and a hundred talents of gold,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et crateras aureos viginti qui habebant solidos millenos et vasa aeris fulgentis optimi duo pulchra ut aurum"
      en: "And twenty cups of gold, of a thousand solids, and two vessels of the best shining brass, beautiful as gold."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et dixi eis vos sancti Domini et vasa sancta et argentum et aurum quod sponte oblatum est Domino Deo patrum vestrorum"
      en: "And I said to them: You are the holy ones of the Lord, and the vessels are holy, and the silver and gold, that is freely offered to the Lord the God of our fathers."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "vigilate et custodite donec adpendatis coram principibus sacerdotum et Levitarum et ducibus familiarum Israhel in Hierusalem et thesaurum domus Domini"
      en: "Watch ye and beep them, till you deliver them by weight before the chief of the priests, and of the Levites, and the heads of the families of Israel in Jerusalem, into the treasure of the house of the Lord."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "susceperunt autem sacerdotes et Levitae pondus argenti et auri et vasorum ut deferrent in Hierusalem in domum Dei nostri"
      en: "And the priests and the Levites received the weight of the silver and gold, and the vessels, to carry them to Jerusalem to the house of our God."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "promovimus ergo a flumine Ahavva duodecimo die mensis primi ut pergeremus Hierusalem et manus Dei nostri fuit super nos et liberavit nos de manu inimici et insidiatoris in via"
      en: "Then we set forward from the river Ahava on the twelfth day of the first month to go to Jerusalem: and the hand of our God was upon us, and delivered us from the hand of the enemy, and of such as lay in wait by the way."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et venimus Hierusalem et mansimus ibi diebus tribus"
      en: "And we came to Jerusalem, and we stayed there three days."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "die autem quarta adpensum est argentum et aurum et vasa in domo Dei nostri per manum Meremoth filii Uriae sacerdotis et cum eo Eleazar filius Finees cumque eis Iozaded filius Iosue et Noadaia filius Bennoi Levitae"
      en: "And on the fourth day the silver and the gold, and the vessels were weighed in the house of our God by the hand of Meremoth the son of Urias the priest, and with him was Eleazar the son of Phinees, and with them Jozabad the son of Josue, and Noadaia the son of Benoi, Levites."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "iuxta numerum et pondus omnium descriptumque est omne pondus in tempore illo"
      en: "According to the number and weight of every thing: and all the weight was written at that time."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "sed et qui venerant de captivitate filii transmigrationis obtulerunt holocaustomata Deo Israhel vitulos duodecim pro omni Israhel arietes nonaginta sex agnos septuaginta septem hircos pro peccato duodecim omnia in holocaustum Domino"
      en: "Moreover the children of them that had been carried away that were come out of the captivity, offered holocausts to the God of Israel, twelve calves for all the people of Israel, ninety-six rams, seventy- seven lambs, and twelve he goats for sin: all for a holocaust to the Lord."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "dederunt autem edicta regis satrapis qui erant de conspectu regis et ducibus trans Flumen et elevaverunt populum et domum Dei"
      en: "And they gave the king's edicts to the lords that were from the king's court, and the governors beyond the river, and they furthered the people and the house of God."
    status: { la: verified, en: verified }
