# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 13
verses:
  - n: 1
    text:
      la: "Ascendit ergo Abram de Aegypto, ipse et uxor ejus, et omnia quae habebat, et Lot cum eo, ad australem plagam."
      en: "And Abram went up out of Egypt, he and his wife, and all that he had, and Lot with him, into the south."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Erat autem dives valde in possessione auri et argenti."
      en: "And he was very rich in possession of gold and silver."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Reversusque est per iter, quo venerat, a meridie in Bethel, usque ad locum ubi prius fixerat tabernaculum inter Bethel et Hai,"
      en: "And he returned by the way that he came, from the south to Bethel, to the place where before he had pitched his tent between Bethel and Hai:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "in loco altaris quod fecerat prius: et invocavit ibi nomen Domini."
      en: "In the place of the altar which he had made before; and there he called upon the name of the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Sed et Lot qui erat cum Abram, fuerunt greges ovium, et armenta, et tabernacula."
      en: "But Lot also, who was with Abram, had flocks of sheep, and herds of beasts, and tents."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Nec poterat eos capere terra, ut habitarent simul: erat quippe substantia eorum multa, et nequibant habitare communiter."
      en: "Neither was the land able to bear them, that they might dwell together: for their substance was great, and they could not dwell together."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Unde et facta est rixa inter pastores gregum Abram et Lot. Eo autem tempore Chananaeus et Pherezaeus habitabant in terra illa."
      en: "Whereupon also there arose a strife between the herdsmen of Abram and of Lot. And at that time the Chanaanite and the Pherezite dwelled in that country."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dixit ergo Abram ad Lot: Ne quaeso sit jurgium inter me et te, et inter pastores meos et pastores tuos: fratres enim sumus."
      en: "Abram therefore said to Lot: Let there be no quarrel, I beseech thee, between me and thee, and between my herdsmen and thy herdsmen: for we are brethren."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ecce universa terra coram te est: recede a me, obsecro: si ad sinistram ieris, ego dexteram tenebo: si tu dexteram elegeris, ego ad sinistram pergam."
      en: "Behold the whole land is before thee: depart from me I pray thee: if thou wilt go to the left hand, I will take the right: if thou choose the right hand, I will pass to the left."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Elevatis itaque Lot oculis, vidit omnem circa regionem Jordanis, quae universa irrigabatur antequam subverteret Dominus Sodomam et Gomorrham, sicut paradisus Domini, et sicut Aegyptus venientibus in Segor."
      en: "And Lot, lifting up his eyes, saw all the country about the Jordan, which was watered throughout, before the Lord destroyed Sodom and Gomorrha, as the paradise of the Lord, and like Egypt as one comes to Segor."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Elegitque sibi Lot regionem circa Jordanem, et recessit ab oriente: divisique sunt alterutrum a fratre suo."
      en: "And Lot chose to himself the country about the Jordan, and he departed from the east: and they were separated one brother from the other."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Abram habitavit in terra Chanaan; Lot vero moratus est in oppidis, quae erant circa Jordanem, et habitavit in Sodomis."
      en: "Abram dwelt in the land of Chanaan; and Lot abode in the towns that were about the Jordan, and dwelt in Sodom."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Homines autem Sodomitae pessimi erant, et peccatores coram Domino nimis."
      en: "And the men of Sodom were very wicked, and sinners before the face of the Lord, beyond measure."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dixitque Dominus ad Abram, postquam divisus est ab eo Lot: Leva oculos tuos et vide a loco, in quo nunc es, ad aquilonem et meridiem, ad orientem et occidentem."
      en: "And the Lord said to Abram, after Lot was separated from him: Lift up thy eyes, and look from the place wherein thou now art, to the north and to the south, to the east and to the west."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Omnem terram, quam conspicis, tibi dabo, et semini tuo usque in sempiternum."
      en: "All the land which thou seest, I will give to thee, and to thy seed for ever."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Faciamque semen tuum sicut pulverem terrae: si quis potest hominum numerare pulverem terrae, semen quoque tuum numerare poterit."
      en: "And I will make thy seed as the dust of the earth: if any man be able to number the dust of the earth, he shall be able to number thy seed also."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Surge, et perambula terram in longitudine et in latitudine sua: quia tibi daturus sum eam."
      en: "Arise and walk through the land in the length, and in the breadth thereof: for I will give it to thee."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Movens igitur tabernaculum suum Abram, venit, et habitavit juxta convallem Mambre, quae est in Hebron: aedificavitque ibi altare Domino."
      en: "So Abram removing his tent came and dwelt by the vale of Mambre, which is in Hebron: and he built there an altar to the Lord."
    status: { la: verified, en: verified }
