# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1thess
chapter: 5
verses:
  - n: 1
    text:
      la: "de temporibus autem et momentis fratres non indigetis ut scribamus vobis"
      en: "But of the times and moments, brethren, you need not, that we should write to you;"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ipsi enim diligenter scitis quia dies Domini sicut fur in nocte ita veniet"
      en: "For yourselves know perfectly, that the day of the Lord shall so come, as a thief in the night."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cum enim dixerint pax et securitas tunc repentinus eis superveniet interitus sicut dolor in utero habenti et non effugient"
      en: "For when they shall say, peace and security; then shall sudden destruction come upon them, as the pains upon her that is with child, and they shall not escape."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "vos autem fratres non estis in tenebris ut vos dies ille tamquam fur conprehendat"
      en: "But you, brethren, are not in darkness, that that day should overtake you as a thief."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "omnes enim vos filii lucis estis et filii diei non sumus noctis neque tenebrarum"
      en: "For all you are the children of light, and children of the day: we are not of the night, nor of darkness. 6 Therefore, let us not sleep, as others do; but let us watch, and be sober."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "igitur non dormiamus sicut ceteri sed vigilemus et sobrii simus"
      en: ""
    status: { la: verified, en: missing }
  - n: 7
    text:
      la: "qui enim dormiunt nocte dormiunt et qui ebrii sunt nocte ebrii sunt"
      en: "For they that sleep, sleep in the night; and they that are drunk, are drunk in the night."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "nos autem qui diei sumus sobrii simus induti loricam fidei et caritatis et galeam spem salutis"
      en: "But let us, who are of the day, be sober, having on the breastplate of faith and charity, and for a helmet the hope of salvation."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quoniam non posuit nos Deus in iram sed in adquisitionem salutis per Dominum nostrum Iesum Christum"
      en: "For God hath not appointed us unto wrath, but unto the purchasing of salvation by our Lord Jesus Christ,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui mortuus est pro nobis ut sive vigilemus sive dormiamus simul cum illo vivamus"
      en: "Who died for us; that, whether we watch or sleep, we may live together with him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "propter quod consolamini invicem et aedificate alterutrum sicut et facitis"
      en: "For which cause comfort one another; and edify one another, as you also do."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "rogamus autem vos fratres ut noveritis eos qui laborant inter vos et praesunt vobis in Domino et monent vos"
      en: "And we beseech you, brethren, to know them who labour among you, and are over you in the Lord, and admonish you:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ut habeatis illos abundantius in caritate propter opus illorum pacem habete cum eis"
      en: "That you esteem them more abundantly in charity, for their work's sake. Have peace with them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "rogamus autem vos fratres corripite inquietos consolamini pusillianimes suscipite infirmos patientes estote ad omnes"
      en: "And we beseech you, brethren, rebuke the unquiet, comfort the feeble minded, support the weak, be patient towards all men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "videte ne quis malum pro malo alicui reddat sed semper quod bonum est sectamini et in invicem et in omnes"
      en: "See that none render evil for evil to any man; but ever follow that which is good towards each other, and towards all men."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "semper gaudete"
      en: "Always rejoice."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sine intermissione orate"
      en: "Pray without ceasing."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "in omnibus gratias agite haec enim voluntas Dei est in Christo Iesu in omnibus vobis"
      en: "In all things give thanks; for this is the will of God in Christ Jesus concerning you all."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Spiritum nolite extinguere"
      en: "Extinguish not the spirit."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "prophetias nolite spernere"
      en: "Despise not prophecies."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "omnia autem probate quod bonum est tenete"
      en: "But prove all things; hold fast that which is good."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ab omni specie mala abstinete vos"
      en: "From all appearance of evil refrain yourselves."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ipse autem Deus pacis sanctificet vos per omnia et integer spiritus vester et anima et corpus sine querella in adventu Domini nostri Iesu Christi servetur"
      en: "And may the God of peace himself sanctify you in all things; that your whole spirit, and soul, and body, may be preserved blameless in the coming of our Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "fidelis est qui vocavit vos qui etiam faciet"
      en: "He is faithful who hath called you, who also will do it."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "fratres orate pro nobis"
      en: "Brethren, pray for us."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "salutate fratres omnes in osculo sancto"
      en: "Salute all the brethren with a holy kiss."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "adiuro vos per Dominum ut legatur epistula omnibus sanctis fratribus"
      en: "I charge you by the Lord, that this epistle be read to all the holy brethren."
    status: { la: verified, en: verified }
