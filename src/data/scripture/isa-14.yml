# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 14
verses:
  - n: 1
    text:
      la: "prope est ut veniat tempus eius et dies eius non elongabuntur miserebitur enim Dominus Iacob et eliget adhuc de Israhel et requiescere eos faciet super humum suam adiungetur advena ad eos et adherebit domui Iacob"
      en: "Her time is near at hand, and her days shall not be prolonged. For the Lord will have mercy on Jacob, and will yet choose out of Israel, and will make them rest upon their own ground: and the stranger shall be joined with them, and shall adhere to the house of Jacob."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et tenebunt eos populi et adducent eos in locum suum et possidebit eos domus Israhel super terram Domini in servos et ancillas et erunt capientes eos qui se ceperant et subicient exactores suos"
      en: "And the people shall take them, and bring them into their place: and the house of Israel shall possess them in the land of the Lord for servants and handmaids: and they shall make them captives that had taken them, and shall subdue their oppressors."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et erit in die illa cum requiem dederit tibi Deus a labore tuo et a concussione tua et a servitute dura qua ante servisti"
      en: "And it shall come to pass in that day, that when God shall give thee rest from thy labour, and from thy vexation, and from the hard bondage, wherewith thou didst serve before,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sumes parabolam istam contra regem Babylonis et dices quomodo cessavit exactor quievit tributum"
      en: "Thou shalt take up this parable against the king of Babylon, and shalt say: How is the oppressor come to nothing, the tribute hath ceased?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "contrivit Dominus baculum impiorum virgam dominantium"
      en: "The Lord hath broken the staff of the wicked, the rod of the rulers,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "caedentem populos in indignatione plaga insanabili subicientem in furore gentes persequentem crudeliter"
      en: "That struck the people in wrath with an incurable wound, that brought nations under in fury, that persecuted in a cruel manner."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "conquievit et siluit omnis terra gavisa est et exultavit"
      en: "The whole earth is quiet and still, it is glad and hath rejoiced."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "abietes quoque laetatae sunt super te et cedri Libani ex quo dormisti non ascendit qui succidat nos"
      en: "The fir trees also have rejoiced over thee, and the cedars of Libanus, saying: Since thou hast slept, there hath none come up to cut us down."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "infernus subter conturbatus est in occursum adventus tui suscitavit tibi gigantas omnes principes terrae surrexerunt de soliis suis omnes principes nationum"
      en: "Hell below was in an uproar to meet thee at thy coming, it stirred up the giants for thee. All the princes of the earth are risen up from their thrones, all the princes of nations."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "universi respondebunt et dicent tibi et tu vulneratus es sicut nos nostri similis effectus es"
      en: "All shall answer, and say to thee: Thou also art wounded as well as we, thou art become like unto us."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "detracta est ad inferos superbia tua concidit cadaver tuum subter te sternetur tinea et operimentum tuum erunt vermes"
      en: "Thy pride is brought down to hell, thy carcass is fallen down: under thee shall the moth be strewed, and worms shall be thy covering."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quomodo cecidisti de caelo lucifer qui mane oriebaris corruisti in terram qui vulnerabas gentes"
      en: "How art thou fallen from heaven, O Lucifer, who didst rise in the morning? how art thou fallen to the earth, that didst wound the nations?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui dicebas in corde tuo in caelum conscendam super astra Dei exaltabo solium meum sedebo in monte testamenti in lateribus aquilonis"
      en: "And thou saidst in thy heart: I will ascend into heaven, I will exalt my throne above the stars of God, I will sit in the mountain of the covenant, in the sides of the north."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ascendam super altitudinem nubium ero similis Altissimo"
      en: "I will ascend above the height of the clouds, I will be like the most High."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "verumtamen ad infernum detraheris in profundum laci"
      en: "But yet thou shalt be brought down to hell, into the depth of the pit."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "qui te viderint ad te inclinabuntur teque prospicient numquid iste est vir qui conturbavit terram qui concussit regna"
      en: "They that shall see thee, shall turn toward thee, and behold thee. Is this the man that troubled the earth, that shook kingdoms,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qui posuit orbem desertum et urbes eius destruxit vinctis eius non aperuit carcerem"
      en: "That made the world a wilderness, and destroyed the cities thereof, that opened not the prison to his prisoners?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "omnes reges gentium universi dormierunt in gloria vir in domo sua"
      en: "All the kings of the nations have all of them slept in glory, every one in his own house."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "tu autem proiectus es de sepulchro tuo quasi stirps inutilis pollutus et obvolutus qui interfecti sunt gladio et descenderunt ad fundamenta laci quasi cadaver putridum"
      en: "But thou art cast out of thy grave, as an unprofitable branch defiled, and wrapped up among them that were slain by the sword, and art gone down to the bottom of the pit, as a rotten carcass."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "non habebis consortium neque cum eis in sepultura tu enim terram disperdisti tu populum occidisti non vocabitur in aeternum semen pessimorum"
      en: "Thou shalt not keep company with them, even in burial: for thou hast destroyed thy land, thou hast slain thy people: the seed of the wicked shall not be named for ever."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "praeparate filios eius occisioni in iniquitate patrum eorum non consurgent nec hereditabunt terram neque implebunt faciem orbis civitatum"
      en: "Prepare his children for slaughter for the iniquity of their fathers: they shall not rise up, nor inherit the land, nor fill the face of the world with cities."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et consurgam super eos dicit Dominus exercituum et perdam Babylonis nomen et reliquias et germen et progeniem ait Dominus"
      en: "And I will rise up against them, saith the Lord of hosts: and I will destroy the name of Babylon, and the remains, and the bud, and the offspring, saith the Lord."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et ponam eam in possessionem ericii et in paludes aquarum et scopabo eam in scopa terens dicit Dominus exercituum"
      en: "And I will make it a possession for the ericius and pools of waters, and I will sweep it and wear it out with a besom, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "iuravit Dominus exercituum dicens si non ut putavi ita erit et quomodo mente tractavi"
      en: "The Lord of hosts hath sworn, saying: Surely as I have thought, so shall it be: and as I have purposed,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "sic eveniet ut conteram Assyrium in terra mea et in montibus meis conculcem eum et auferetur ab eis iugum eius et onus illius ab umero eorum tolletur"
      en: "So shall it fall out: That I will destroy the Assyrian in my land, and upon my mountains tread him under foot: and his yoke shall be taken away from them, and his burden shall be taken off their shoulder."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "hoc consilium quod cogitavi super omnem terram et haec est manus extenta super universas gentes"
      en: "This is the counsel, that I have purposed upon all the earth, and this is the hand that is stretched out upon all nations."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Dominus enim exercituum decrevit et quis poterit infirmare et manus eius extenta et quis avertet eam"
      en: "For the Lord of hosts hath decreed, and who can disannul it? and his hand is stretched out: and who shall turn it away?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "in anno quo mortuus est rex Ahaz factum est onus istud"
      en: "In the year that king Achaz died, was this burden:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ne laeteris Philisthea omnis tu quoniam comminuta est virga percussoris tui de radice enim colubri egredietur regulus et semen eius absorbens volucrem"
      en: "Rejoice not thou, whole Philistia, that the rod of him that struck thee is broken in pieces: for out of the root of the serpent shall come forth a basilisk, and his seed shall swallow the bird."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et pascentur primogeniti pauperum et pauperes fiducialiter requiescent et interire faciam in fame radicem tuam et reliquias tuas interficiam"
      en: "And the firstborn of the poor shall be fed, and the poor shall rest with confidence: and I will make thy root perish with famine, and I will kill thy remnant."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ulula porta clama civitas prostrata est Philisthea omnis ab aquilone enim fumus venit et non est qui effugiat agmen eius"
      en: "Howl, O gate; cry, O city: all Philistia is thrown down: for a smoke shall come from the north, and there is none that shall escape his troop."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et quid respondebitur nuntiis gentis quia Dominus fundavit Sion et in ipsa sperabunt pauperes populi eius"
      en: "And what shall be answered to the messengers of the nations? That the Lord hath founded Sion, and the poor of his people shall hope in him."
    status: { la: verified, en: verified }
