# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 24
verses:
  - n: 1
    text:
      la: "Ab Omnipotente non sunt abscondita tempora: qui autem noverunt eum, ignorant dies illius."
      en: "Times are not hid from the Almighty: but they that know him, know not his days."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Alii terminos transtulerunt, diripuerunt greges, et paverunt eos."
      en: "Some have removed landmarks, have taken away flocks by force, and fed them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Asinum pupillorum abegerunt, et abstulerunt pro pignore bovem viduae."
      en: "They have driven away the ass of the fatherless, and have taken away the widow's ox for a pledge."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Subverterunt pauperum viam, et oppresserunt pariter mansuetos terrae."
      en: "They have overturned the way of the poor, and have oppressed together the meek of the earth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Alii quasi onagri in deserto egrediuntur ad opus suum: vigilantes ad praedam, praeparant panem liberis."
      en: "Others like wild asses in the desert go forth to their work: by watching for a prey they get bread for their children."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Agrum non suum demetunt, et vineam ejus, quem vi oppresserint, vindemiant."
      en: "They reap the field that is not their own, and gather the vintage of his vineyard whom by violence they have oppressed."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nudos dimittunt homines, indumenta tollentes, quibus non est operimentum in frigore:"
      en: "They send men away naked, taking away their clothes who have no covering in the cold:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quos imbres montium rigant, et non habentes velamen, amplexantur lapides."
      en: "Who are wet, with the showers of the mountains, and having no covering embrace the stones."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Vim fecerunt depraedantes pupillos, et vulgum pauperem spoliaverunt."
      en: "They have violently robbed the fatherless, and stripped the poor common people."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nudis et incedentibus absque vestitu, et esurientibus tulerunt spicas."
      en: "From the naked and them that go without clothing, and from the hungry they have taken away the ears of corn."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Inter acervos eorum meridiati sunt, qui calcatis torcularibus sitiunt."
      en: "They have taken their rest at noon among the stores of them, who after having trodden the winepresses suffer thirst."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "De civitatibus fecerunt viros gemere, et anima vulneratorum clamavit: et Deus inultum abire non patitur."
      en: "Out of the cities they have made men to groan, and the soul of the wounded hath cried out, and God doth not suffer it to pass unrevenged."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ipsi fuerunt rebelles lumini: nescierunt vias ejus, nec reversi sunt per semitas ejus."
      en: "They have been rebellious to the light, they have not known his ways, neither have they returned by his paths."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Mane primo consurgit homicida, interficit egenum et pauperem: per noctem vero erit quasi fur."
      en: "The murderer riseth at the very break of day, he killeth the needy, and the poor man: but in the night he will be as a thief."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Oculus adulteri observat caliginem, dicens: Non me videbit oculus: et operiet vultum suum."
      en: "The eye of the adulterer observeth darkness, saying: No eye shall see me: and he will cover his face."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Perfodit in tenebris domos, sicut in die condixerant sibi, et ignoraverunt lucem."
      en: "He diggeth through houses in the dark, as in the day they had appointed for themselves, and they have not known the light."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Si subito apparuerit aurora, arbitrantur umbram mortis: et sic in tenebris quasi in luce ambulant."
      en: "If the morning suddenly appear, it is to them the shadow of death: and they walk in darkness as if it were in light."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Levis est super faciem aquae: maledicta sit pars ejus in terra, nec ambulet per viam vinearum."
      en: "He is light upon the face of the water: cursed be his portion on the earth, let him not walk by the way of the vineyards."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ad nimium calorem transeat ab aquis nivium, et usque ad inferos peccatum illius."
      en: "Let him pass from the snow waters to excessive heat, and his sin even to hell."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Obliviscatur ejus misericordia, dulcedo illius vermes: non sit in recordatione, sed conteratur quasi lignum infructuosum."
      en: "Let mercy forget him: may worms be his sweetness: let him be remembered no more, but be broken in pieces as an unfruitful tree."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Pavit enim sterilem quae non parit, et viduae bene non fecit."
      en: "For he hath fed the barren that beareth not, and to the widow he hath done no good."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Detraxit fortes in fortitudine sua, et cum steterit, non credet vitae suae."
      en: "He hath pulled down the strong by his might: and when he standeth up, he shall not trust to his life."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Dedit ei Deus locum poenitentiae, et ille abutitur eo in superbiam: oculi autem ejus sunt in viis illius."
      en: "God hath given him place for penance, and he abuseth it unto pride: but his eyes are upon his ways."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Elevati sunt ad modicum, et non subsistent: et humiliabuntur sicut omnia, et auferentur, et sicut summitates spicarum conterentur."
      en: "They are lifted up for a little while and shall not stand, and shall be brought down as all things, and shall be taken away, and as the tops of the ears of corn they shall be broken."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Quod si non est ita, quis me potest arguere esse mentitum, et ponere ante Deum verba mea?"
      en: "And if it be not so, who can convince me that I have lied, and set my words before God?"
    status: { la: verified, en: verified }
