# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: apoc
chapter: 18
verses:
  - n: 1
    text:
      la: "et post haec vidi alium angelum descendentem de caelo habentem potestatem magnam et terra inluminata est a gloria eius"
      en: "And after these things, I saw another angel come down from heaven, having great power: and the earth was enlightened with his glory."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et exclamavit in forti voce dicens cecidit cecidit Babylon magna et facta est habitatio daemoniorum et custodia omnis spiritus inmundi et custodia omnis volucris inmundae"
      en: "And he cried out with a strong voice, saying: Babylon the great is fallen, is fallen; and is become the habitation of devils, and the hold of every unclean spirit, and the hold of every unclean and hateful bird:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quia de ira fornicationis eius biberunt omnes gentes et reges terrae cum illa fornicati sunt et mercatores terrae de virtute deliciarum eius divites facti sunt"
      en: "Because all nations have drunk of the wine of the wrath of her fornication; and the kings of the earth have committed fornication with her; and the merchants of the earth have been made rich by the power of her delicacies."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et audivi aliam vocem de caelo dicentem exite de illa populus meus ut ne participes sitis delictorum eius et de plagis eius non accipiatis"
      en: "And I heard another voice from heaven, saying: Go out from her, my people; that you be not partakers of her sins, and that you receive not of her plagues."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quoniam pervenerunt peccata eius usque ad caelum et recordatus est Deus iniquitatum eius"
      en: "For her sins have reached unto heaven, and the Lord hath remembered her iniquities."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "reddite illi sicut ipsa reddidit et duplicate duplicia secundum opera eius in poculo quo miscuit miscite illi duplum"
      en: "Render to her as she also hath rendered to you; and double unto her double according to her works: in the cup wherein she hath mingled, mingle ye double unto her."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quantum glorificavit se et in deliciis fuit tantum date illi tormentum et luctum quia in corde suo dicit sedeo regina et vidua non sum et luctum non videbo"
      en: "As much as she hath glorified herself, and lived in delicacies, so much torment and sorrow give ye to her; because she saith in her heart: I sit a queen, and am no widow; and sorrow I shall not see."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ideo in una die venient plagae eius mors et luctus et fames et igni conburetur quia fortis est Deus qui iudicavit illam"
      en: "Therefore shall her plagues come in one day, death, and mourning, and famine, and she shall be burnt with the fire; because God is strong, who shall judge her."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et flebunt et plangent se super illam reges terrae qui cum illa fornicati sunt et in deliciis vixerunt cum viderint fumum incendii eius"
      en: "And the kings of the earth, who have committed fornication, and lived in delicacies with her, shall weep, and bewail themselves over her, when they shall see the smoke of her burning:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "longe stantes propter timorem tormentorum eius dicentes vae vae civitas illa magna Babylon civitas illa fortis quoniam una hora venit iudicium tuum"
      en: "Standing afar off for fear of her torments, saying: Alas! alas! that great city Babylon, that mighty city: for in one hour is thy judgment come."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et negotiatores terrae flebunt et lugebunt super illam quoniam merces eorum nemo emet amplius"
      en: "And the merchants of the earth shall weep, and mourn over her: for no man shall buy their merchandise any more."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "mercem auri et argenti et lapidis pretiosi et margaritis et byssi et purpurae et serici et cocci et omne lignum thyinum et omnia vasa eboris et omnia vasa de lapide pretioso et aeramento et ferro et marmore"
      en: "Merchandise of gold and silver, and precious stones; and of pearls, and fine linen, and purple, and silk, and scarlet, and all thyine wood, and all manner of vessels of ivory, and all manner of vessels of precious stone, and of brass, and of iron, and of marble,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et cinnamomum et amomum et odoramentorum et unguenti et turis et vini et olei et similae et tritici et iumentorum et ovium et equorum et raedarum et mancipiorum et animarum hominum"
      en: "And cinnamon, and odours, and ointment, and frankincense, and wine, and oil, and fine flour, and wheat, and beasts, and sheep, and horses, and chariots, and slaves, and souls of men."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et poma tua desiderii animae discessit a te et omnia pinguia et clara perierunt a te et amplius illa iam non invenient"
      en: "And the fruits of the desire of thy soul are departed from thee, and all fat and goodly things are perished from thee, and they shall find them no more at all."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "mercatores horum qui divites facti sunt ab ea longe stabunt propter timorem tormentorum eius flentes ac lugentes"
      en: "The merchants of these things, who were made rich, shall stand afar off from her, for fear of her torments, weeping and mourning."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et dicentes vae vae civitas illa magna quae amicta erat byssino et purpura et cocco et deaurata est auro et lapide pretioso et margaritis"
      en: "And saying: Alas! alas! that great city, which was clothed with fine linen, and purple, and scarlet, and was gilt with gold, and precious stones, and pearls."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quoniam una hora destitutae sunt tantae divitiae et omnis gubernator et omnis qui in locum navigat et nautae et qui maria operantur longe steterunt"
      en: "For in one hour are so great riches come to nought; and every shipmaster, and all that sail into the lake, and mariners, and as many as work in the sea, stood afar off."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et clamaverunt videntes locum incendii eius dicentes quae similis civitati huic magnae"
      en: "And cried, seeing the place of her burning, saying: What city is like to this great city?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et miserunt pulverem super capita sua et clamaverunt flentes et lugentes dicentes vae vae civitas magna in qua divites facti sunt omnes qui habent naves in mari de pretiis eius quoniam una hora desolata est"
      en: "And they cast dust upon their heads, and cried, weeping and mourning, saying: Alas! alas! that great city, wherein all were made rich, that had ships at sea, by reason of her prices: for in one hour she is made desolate."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "exulta super eam caelum et sancti et apostoli et prophetae quoniam iudicavit Deus iudicium vestrum de illa"
      en: "Rejoice over her, thou heaven, and ye holy apostles and prophets; for God hath judged your judgment on her."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et sustulit unus angelus fortis lapidem quasi molarem magnum et misit in mare dicens hoc impetu mittetur Babylon magna illa civitas et ultra iam non invenietur"
      en: "And a mighty angel took up a stone, as it were a great millstone, and cast it into the sea, saying: With such violence as this shall Babylon, that great city, be thrown down, and shall be found no more at all."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et vox citharoedorum et musicorum et tibia canentium et tuba non audietur in te amplius et omnis artifex omnis artis non invenietur in te amplius et vox molae non audietur in te amplius"
      en: "And the voice of harpers, and of musicians, and of them that play on the pipe, and on the trumpet, shall no more be heard at all in thee; and no craftsman of any art whatsoever shall be found any more at all in thee; and the sound of the mill shall be heard no more at all in thee;"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et lux lucernae non lucebit tibi amplius et vox sponsi et sponsae non audietur adhuc in te quia mercatores tui erant principes terrae quia in veneficiis tuis erraverunt omnes gentes"
      en: "And the light of the lamp shall shine no more at all in thee; and the voice of the bridegroom and the bride shall be heard no more at all in thee: for thy merchants were the great men of the earth, for all nations have been deceived by thy enchantments."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et in ea sanguis prophetarum et sanctorum inventus est et omnium qui interfecti sunt in terra"
      en: "And in her was found the blood of prophets and of saints, and of all that were slain upon the earth."
    status: { la: verified, en: verified }
