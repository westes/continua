# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 3reg
chapter: 17
verses:
  - n: 1
    text:
      la: "Et dixit Elias Thesbites de habitatoribus Galaad ad Achab: Vivit Dominus Deus Israel, in cujus conspectu sto, si erit annis his ros et pluvia, nisi juxta oris mea verba."
      en: "And Elias the Thesbite of the inhabitants of Galaad said to Achab: As the Lord liveth the God of Israel, in whose sight I stand, there shall not be dew nor rain these years, but according to the words of my mouth."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et factum est verbum Domini ad eum, dicens:"
      en: "And the word of the Lord came to him, saying:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Recede hinc, et vade contra orientem, et abscondere in torrente Carith, qui est contra Jordanem,"
      en: "Get thee hence, and go towards the east and hide thyself by the torrent of Carith, which is over against the Jordan,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ibi de torrente bibes: corvisque praecepi ut pascant te ibi."
      en: "And there thou shalt drink of the torrent: and I have commanded the ravens to feed thee there."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Abiit ergo, et fecit juxta verbum Domini: cumque abiisset, sedit in torrente Carith, qui est contra Jordanem."
      en: "So he went, and did according to the word of the Lord: and going, he dwelt by the torrent Carith, which is over against the Jordan."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Corvi quoque deferebant ei panem et carnes mane, similiter panem et carnes vesperi, et bibebat de torrente."
      en: "And the ravens brought him bread and flesh in the morning, and bread and flesh in the evening, and he drank of the torrent."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Post dies autem siccatus est torrens: non enim pluerat super terram."
      en: "But after some time the torrent was dried up, for it had not rained upon the earth."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Factus est ergo sermo Domini ad eum, dicens:"
      en: "Then the word of the Lord came to him, saying:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Surge, et vade in Sarephta Sidoniorum, et manebis ibi: praecepi enim ibi mulieri viduae ut pascat te."
      en: "Arise, and go to Sarephta of the Sidonians, and dwell there: for I have commanded a widow woman there to feed thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Surrexit, et abiit in Sarephta. Cumque venisset ad portam civitatis, apparuit ei mulier vidua colligens ligna, et vocavit eam, dixitque ei: Da mihi paululum aquae in vase ut bibam."
      en: "He arose, and went to Sarephta. And when he was come to the gate of the city, he saw the widow woman gathering sticks, and he called her, and said to her: Give me a little water in a vessel, that I may drink."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cumque illa pergeret ut afferret, clamavit post tergum ejus, dicens: Affer mihi, obsecro, et buccellam panis in manu tua."
      en: "And when she was going to fetch it he called after her, saying: Bring me also, I beseech thee, a morsel of bread in thy hand."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quae respondit: Vivit Dominus Deus tuus, quia non habeo panem, nisi quantum pugillus capere potest farinae in hydria, et paululum olei in lecytho: en colligo duo ligna ut ingrediar et faciam illum mihi et filio meo, ut comedamus, et moriamur."
      en: "And she answered: As the Lord thy God liveth, I have no bread, but only a handful of meal in a pot, and a little oil in a cruse: behold I am gathering two sticks that I may go in and dress it, for me and my son, that we may eat it, and die."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ad quam Elias ait: Noli timere, sed vade, et fac sicut dixisti: verumtamen mihi primum fac de ipsa farinula subcinericium panem parvulum, et affer ad me: tibi autem et filio tuo facies postea."
      en: "And Elias said to her: Fear not, but go, and do as thou hast said: but first make for me of the same meal a little hearth cake, and bring it to me: and after make for thyself and thy son."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Haec autem dicit Dominus Deus Israel: Hydria farinae non deficiet, nec lecythus olei minuetur usque ad diem in qua Dominus daturus est pluviam super faciem terrae."
      en: "For thus saith the Lord the God of Israel: The pot of meal shall not waste, nor the cruse of oil be diminished, until the day wherein the Lord will give rain upon the face of the earth."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quae abiit, et fecit juxta verbum Eliae: et comedit ipse, et illa, et domus ejus: et ex illa die"
      en: "She went and did according to the word of Elias: and he ate, and she, and her house: and from that day"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "hydria farinae non defecit, et lecythus olei non est imminutus, juxta verbum Domini, quod locutus fuerat in manu Eliae."
      en: "The pot of meal wasted not, and the cruse of oil was not diminished, according to the word of the Lord, which he spoke in the hand of Elias."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Factum est autem post haec, aegrotavit filius mulieris matrisfamilias, et erat languor fortissimus, ita ut non remaneret in eo halitus."
      en: "And it came to pass after this that the son of the woman, the mistress of the house, fell sick, and the sickness was very grievous, so that there was no breath left in him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Dixit ergo ad Eliam: Quid mihi et tibi, vir Dei? Ingressus es ad me, ut rememorarentur iniquitates meae, et interficeres filium meum?"
      en: "And she said to Elias: What have I to do with thee, thou man of God? art thou come to me that my iniquities should be remembered, and that thou shouldst kill my son?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et ait ad eam Elias: Da mihi filium tuum. Tulitque eum de sinu ejus, et portavit in coenaculum ubi ipse manebat, et posuit super lectulum suum."
      en: "And Elias said to her: Give me thy son. And he took him out of her bosom, and carried him into the upper chamber where he abode, and laid him upon his own bed."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et clamavit ad Dominum, et dixit: Domine Deus meus, etiam ne viduam, apud quam ego utcumque sustentor, afflixisti ut interficeres filium ejus?"
      en: "And he cried to the Lord, and said: O Lord my God, hast thou afflicted also the widow, with whom I am after a sort maintained, so as to kill her son?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et expandit se, atque mensus est super puerum tribus vicibus, et clamavit ad Dominum, et ait: Domine Deus meus, revertatur, obsecro, anima pueri hujus in viscera ejus."
      en: "And he stretched, and measured himself upon the child three times, and cried to the Lord, and said: O Lord my God, let the soul of this child, I beseech thee, return into his body."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et exaudivit Dominus vocem Eliae: et reversa est anima pueri intra eum, et revixit."
      en: "And the Lord heard the voice of Elias: and the soul of the child returned into him, and he revived."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Tulitque Elias puerum, et deposuit eum de coenaculo in inferiorem domum, et tradidit matri suae, et ait illi: En vivit filius tuus."
      en: "And Elias took the child, and brought him down from the upper chamber to the house below, and delivered him to his mother, and said to her: Behold thy son liveth."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Dixitque mulier ad Eliam: Nunc in isto cognovi quoniam vir Dei es tu, et verbum Domini in ore tuo verum est."
      en: "And the woman said to Elias: Now, by this I know that thou art a man of God, and the word of the Lord in thy mouth is true."
    status: { la: verified, en: verified }
