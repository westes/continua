# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: eph
chapter: 1
verses:
  - n: 1
    text:
      la: "Paulus Apostolus Jesu Christi per voluntatem Dei, omnibus sanctis qui sunt Ephesi, et fidelibus in Christo Jesu."
      en: "Paul, an apostle of Jesus Christ, by the will of God, to all the saints who are at Ephesus, and to the faithful in Christ Jesus."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Gratia vobis, et pax a Deo Patre nostro, et Domino Jesu Christo."
      en: "Grace be to you, and peace from God the Father, and from the Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Benedictus Deus et Pater Domini nostri Jesu Christi, qui benedixit nos in omni benedictione spirituali in caelestibus in Christo,"
      en: "Blessed be the God and Father of our Lord Jesus Christ, who hath blessed us with spiritual blessings in heavenly places, in Christ:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sicut elegit nos in ipso ante mundi constitutionem, ut essemus sancti et immaculati in conspectu ejus in caritate."
      en: "As he chose us in him before the foundation of the world, that we should be holy and unspotted in his sight in charity."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Qui praedestinavit nos in adoptionem filiorum per Jesum Christum in ipsum: secundum propositum voluntatis suae,"
      en: "Who hath predestinated us unto the adoption of children through Jesus Christ unto himself: according to the purpose of his will:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in laudem gloriae gratiae suae, in qua gratificavit nos in dilecto Filio suo."
      en: "Unto the praise of the glory of his grace, in which he hath graced us in his beloved son."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "In quo habemus redemptionem per sanguinem ejus, remissionem peccatorum secundum divitias gratiae ejus,"
      en: "In whom we have redemption through his blood, the remission of sins, according to the riches of his grace,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quae superabundavit in nobis in omni sapientia et prudentia:"
      en: "Which hath superabounded in us in all wisdom and prudence,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ut notum faceret nobis sacramentum voluntatis suae, secundum beneplacitum ejus, quod proposuit in eo,"
      en: "That he might make known unto us the mystery of his will, according to his good pleasure, which he hath purposed in him,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in dispensatione plenitudinis temporum, instaurare omnia in Christo, quae in caelis et quae in terra sunt, in ipso;"
      en: "In the dispensation of the fulness of times, to re-establish all things in Christ, that are in heaven and on earth, in him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in quo etiam et nos sorte vocati sumus praedestinati secundum propositum ejus qui operatur omnia secundum consilium voluntatis suae:"
      en: "In whom we also are called by lot, being predestinated according to the purpose of him who worketh all things according to the counsel of his will."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ut simus in laudem gloriae ejus nos, qui ante speravimus in Christo;"
      en: "That we may be unto the praise of his glory, we who before hoped in Christ:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "in quo et vos, cum audissetis verbum veritatis, Evangelium salutis vestrae, in quo et credentes signati estis Spiritu promissionis Sancto,"
      en: "In whom you also, after you had heard the word of truth, (the gospel of your salvation;) in whom also believing, you were signed with the holy Spirit of promise,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui est pignus haereditatis nostrae, in redemptionem acquisitionis, in laudem gloriae ipsius."
      en: "Who is the pledge of our inheritance, unto the redemption of acquisition, unto the praise of his glory."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Propterea et ego audiens fidem vestram, quae est in Domino Jesu, et dilectionem in omnes sanctos,"
      en: "Wherefore I also, hearing of your faith that is in the Lord Jesus, and of your love towards all the saints,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "non cesso gratias agens pro vobis, memoriam vestri faciens in orationibus meis:"
      en: "Cease not to give thanks for you, making commemoration of you in my prayers,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ut Deus Domini nostri Jesu Christi, Pater gloriae, det vobis spiritum sapientiae et revelationis in agnitione ejus,"
      en: "That the God of our Lord Jesus Christ, the Father of glory, may give unto you the spirit of wisdom and of revelation, in the knowledge of him:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "illuminatos oculos cordis vestri, ut sciatis quae sit spes vocationis ejus, et quae divitiae gloriae haereditatis ejus in sanctis,"
      en: "The eyes of your heart enlightened, that you may know what the hope is of the glory of his inheritance in the saints."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et quae sit supereminens magnitudo virtutis ejus in nos, qui credimus secundum operationem potentiae virtutis ejus,"
      en: "And what is the exceeding greatness of his power towards us, who believe according to the operation of the might of his power,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quam operatus est in Christo, suscitans illum a mortuis, et constituens ad dexteram suam in caelestibus:"
      en: "Which he wrought in Christ, raising him up from the dead, and setting him on his right hand in the heavenly places."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "supra omnem principatum, et potestatem, et virtutem, et dominationem, et omne nomen, quod nominatur non solum in hoc saeculo, sed etiam in futuro."
      en: "Above all principality, and power, and virtue, and dominion, and every name that is named, not only in this world, but also in that which is to come."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et omnia subjecit sub pedibus ejus: et ipsum dedit caput supra omnem ecclesiam,"
      en: "And he hath subjected all things under his feet, and hath made him head over all the church,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quae est corpus ipsius, et plenitudo ejus, qui omnia in omnibus adimpletur."
      en: "Which is his body, and the fulness of him who is filled all in all."
    status: { la: verified, en: verified }
