book: lev
chapter: 17
verses:
  - n: 1
    text:
      la: "et locutus est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "loquere Aaron et filiis eius et cunctis filiis Israhel et dices ad eos iste est sermo quem mandavit Dominus dicens"
      en: "Speak to Aaron and his sons, and to all the children of Israel, saying to them: This is the word, which the Lord hath commanded, saying:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "homo quilibet de domo Israhel si occiderit bovem aut ovem sive capram in castris vel extra castra"
      en: "Any man whosoever of the house of Israel if he kill an ox, or a sheep, or a goat in the camp, or without the camp,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et non obtulerit ad ostium tabernaculi oblationem Domino sanguinis reus erit quasi sanguinem fuderit sic peribit de medio populi sui"
      en: "And offer it not at the door of the tabernacle an oblation to the Lord, shall be guilty of blood: as if he had shed blood, so shall he perish from the midst of his people."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ideo offerre debent sacerdoti filii Israhel hostias suas quas occidunt in agro ut sanctificentur Domino ante ostium tabernaculi testimonii et immolent eas hostias pacificas Domino"
      en: "Therefore the children of Israel shall bring to the priest their victims, which they kill in the field, that they may be sanctified to the Lord before the door of the tabernacle of the testimony, and they may sacrifice them for peace offerings to the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "fundetque sacerdos sanguinem super altare Domini ad ostium tabernaculi testimonii et adolebit adipem in odorem suavitatis Domino"
      en: "And the priest shall pour the blood upon the altar of the Lord, at the door of the tabernacle of the testimony, and shall burn the fat for a sweet odour to the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et nequaquam ultra immolabunt hostias suas daemonibus cum quibus fornicati sunt legitimum sempiternum erit illis et posteris eorum"
      en: "And they shall no more sacrifice their victims to devils, with whom they have committed fornication. It shall be an ordinance for ever to them and to their posterity."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et ad ipsos dices homo de domo Israhel et de advenis qui peregrinantur apud vos qui obtulerit holocaustum sive victimam"
      en: "And thou shalt say to them: The man of the house of Israel, and of the strangers who sojourn among you, that offereth a holocaust or a victim,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et ad ostium tabernaculi testimonii non adduxerit eam ut offeratur Domino interibit de populo suo"
      en: "And bringeth it not to the door of the tabernacle of the testimony, that it may be offered to the Lord, shall perish from among his people."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "homo quilibet de domo Israhel et de advenis qui peregrinantur inter eos si comederit sanguinem obfirmabo faciem meam contra animam illius et disperdam eam de populo suo"
      en: "If any man whosoever of the house of Israel, and of the strangers that sojourn among them, eat blood, I will set my face against his soul, and will cut him off from among his people:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quia anima carnis in sanguine est et ego dedi illum vobis ut super altare in eo expietis pro animabus vestris et sanguis pro animae piaculo sit"
      en: "Because the life of the flesh is in the blood: and I have given it to you, that you may make atonement with it upon the altar for your souls, and the blood may be for an expiation of the soul."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "idcirco dixi filiis Israhel omnis anima ex vobis non comedet sanguinem nec ex advenis qui peregrinantur inter vos"
      en: "Therefore I have said to the children of Israel: No soul of you, nor of the strangers that sojourn among you, shall eat blood."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "homo quicumque de filiis Israhel et de advenis qui peregrinantur apud vos si venatione atque aucupio ceperit feram vel avem quibus vesci licitum est fundat sanguinem eius et operiat illum terra"
      en: "Any man whosoever of the children of Israel, and of the strangers that sojourn among you, if by hunting or fowling, he take a wild beast or a bird, which is lawful to eat, let him pour out its blood, and cover it with earth."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "anima enim omnis carnis in sanguine est unde dixi filiis Israhel sanguinem universae carnis non comedetis quia anima carnis in sanguine est et quicumque comederit illum interibit"
      en: "For the life of all flesh is in the blood: therefore I said to the children of Israel: You shall not eat the blood of any flesh at all, because the life of the flesh is in the blood, and whosoever eateth it, shall be cut off."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "anima quae comederit morticinum vel captum a bestia tam de indigenis quam de advenis lavabit vestes suas et semet ipsum aqua et contaminatus erit usque ad vesperum et hoc ordine mundus fiet"
      en: "The soul that eateth that which died of itself, or has been caught by a beast, whether he be one of your own country or a stranger, shall wash his clothes and himself with water, and shall be defiled until the evening: and in this manner he shall be made clean."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quod si non laverit vestimenta sua nec corpus portabit iniquitatem suam"
      en: "But if he do not wash his clothes, and his body, he shall bear his iniquity."
    status: { la: verified, en: verified }
