# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: luc
chapter: 12
verses:
  - n: 1
    text:
      la: "multis autem turbis circumstantibus ita ut se invicem conculcarent coepit dicere ad discipulos suos adtendite a fermento Pharisaeorum quae est hypocrisis"
      en: "And when great multitudes stood about him, so that they trod one upon another, he began to say to his disciples: Beware ye of the leaven of the Pharisees, which is hypocrisy."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "nihil autem opertum est quod non reveletur neque absconditum quod non sciatur"
      en: "For there is nothing covered, that shall not be revealed: nor hidden, that shall not be known."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quoniam quae in tenebris dixistis in lumine dicentur et quod in aurem locuti estis in cubiculis praedicabitur in tectis"
      en: "For whatsoever things you have spoken in darkness, shall be published in the light: and that which you have spoken in the ear in the chambers, shall be preached on the housetops."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dico autem vobis amicis meis ne terreamini ab his qui occidunt corpus et post haec non habent amplius quod faciant"
      en: "And I say to you, my friends: Be not afraid of them who kill the body, and after that have no more that they can do."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ostendam autem vobis quem timeatis timete eum qui postquam occiderit habet potestatem mittere in gehennam ita dico vobis hunc timete"
      en: "But I will shew you whom you shall fear: fear ye him, who after he hath killed, hath power to cast into hell. Yea, I say to you, fear him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "nonne quinque passeres veneunt dipundio et unus ex illis non est in oblivione coram Deo"
      en: "Are not five sparrows sold for two farthings, and not one of them is forgotten before God?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sed et capilli capitis vestri omnes numerati sunt nolite ergo timere multis passeribus pluris estis"
      en: "Yea, the very hairs of your head are all numbered. Fear not therefore: you are of more value than many sparrows."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dico autem vobis omnis quicumque confessus fuerit in me coram hominibus et Filius hominis confitebitur in illo coram angelis Dei"
      en: "And I say to you, Whosoever shall confess me before men, him shall the Son of man also confess before the angels of God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "qui autem negaverit me coram hominibus denegabitur coram angelis Dei"
      en: "But he that shall deny me before men, shall be denied before the angels of God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et omnis qui dicit verbum in Filium hominis remittetur illi ei autem qui in Spiritum Sanctum blasphemaverit non remittetur"
      en: "And whosoever speaketh a word against the Son of man, it shall be forgiven him: but to him that shall blaspheme against the Holy Ghost, it shall not be forgiven."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cum autem inducent vos in synagogas et ad magistratus et potestates nolite solliciti esse qualiter aut quid respondeatis aut quid dicatis"
      en: "And when they shall bring you into the synagogues, and to magistrates and powers, be not solicitous how or what you shall answer, or what you shall say;"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Spiritus enim Sanctus docebit vos in ipsa hora quae oporteat dicere"
      en: "For the Holy Ghost shall teach you in the same hour what you must say."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ait autem quidam ei de turba magister dic fratri meo ut dividat mecum hereditatem"
      en: "And one of the multitude said to him: Master, speak to my brother that he divide the inheritance with me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "at ille dixit ei homo quis me constituit iudicem aut divisorem super vos"
      en: "But he said to him: Man, who hath appointed me judge, or divider, over you?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "dixitque ad illos videte et cavete ab omni avaritia quia non in abundantia cuiusquam vita eius est ex his quae possidet"
      en: "And he said to them: Take heed and beware of all covetousness; for a man's life doth not consist in the abundance of things which he possesseth."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixit autem similitudinem ad illos dicens hominis cuiusdam divitis uberes fructus ager adtulit"
      en: "And he spoke a similitude to them, saying: The land of a certain rich man brought forth plenty of fruits."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et cogitabat intra se dicens quid faciam quod non habeo quo congregem fructus meos"
      en: "And he thought within himself, saying: What shall I do, because I have no room where to bestow my fruits?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et dixit hoc faciam destruam horrea mea et maiora faciam et illuc congregabo omnia quae nata sunt mihi et bona mea"
      en: "And he said: This will I do: I will pull down my barns, and will build greater; and into them will I gather all things that are grown to me, and my goods."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et dicam animae meae anima habes multa bona posita in annos plurimos requiesce comede bibe epulare"
      en: "And I will say to my soul: Soul, thou hast much goods laid up for many years take thy rest; eat, drink, make good cheer."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dixit autem illi Deus stulte hac nocte animam tuam repetunt a te quae autem parasti cuius erunt"
      en: "But God said to him: Thou fool, this night do they require thy soul of thee: and whose shall those things be which thou hast provided?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "sic est qui sibi thesaurizat et non est in Deum dives"
      en: "So is he that layeth up treasure for himself, and is not rich towards God."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "dixitque ad discipulos suos ideo dico vobis nolite solliciti esse animae quid manducetis neque corpori quid vestiamini"
      en: "And he said to his disciples: Therefore I say to you, be not solicitous for your life, what you shall eat; nor for your body, what you shall put on."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "anima plus est quam esca et corpus quam vestimentum"
      en: "The life is more than the meat, and the body is more than the raiment."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "considerate corvos quia non seminant neque metunt quibus non est cellarium neque horreum et Deus pascit illos quanto magis vos pluris estis illis"
      en: "Consider the ravens, for they sow not, neither do they reap, neither have they storehouse nor barn, and God feedeth them. How much are you more valuable than they?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quis autem vestrum cogitando potest adicere ad staturam suam cubitum unum"
      en: "And which of you, by taking thought, can add to his stature one cubit?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "si ergo neque quod minimum est potestis quid de ceteris solliciti estis"
      en: "If then ye be not able to do so much as the least thing, why are you solicitous for the rest?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "considerate lilia quomodo crescunt non laborant non nent dico autem vobis nec Salomon in omni gloria sua vestiebatur sicut unum ex istis"
      en: "Consider the lilies, how they grow: they labour not, neither do they spin. But I say to you, not even Solomon in all his glory was clothed like one of these."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "si autem faenum quod hodie in agro est et cras in clibanum mittitur Deus sic vestit quanto magis vos pusillae fidei"
      en: "Now if God clothe in this manner the grass that is to day in the field, and to morrow is cast into the oven; how much more you, O ye of little faith?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et vos nolite quaerere quid manducetis aut quid bibatis et nolite in sublime tolli"
      en: "And seek not you what you shall eat, or what you shall drink: and be not lifted up on high."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "haec enim omnia gentes mundi quaerunt Pater autem vester scit quoniam his indigetis"
      en: "For all these things do the nations of the world seek. But your Father knoweth that you have need of these things."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "verumtamen quaerite regnum Dei et haec omnia adicientur vobis"
      en: "But seek ye first the kingdom of God and his justice, and all these things shall be added unto you."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "nolite timere pusillus grex quia conplacuit Patri vestro dare vobis regnum"
      en: "Fear not, little flock, for it hath pleased your Father to give you a kingdom."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "vendite quae possidetis et date elemosynam facite vobis sacculos qui non veterescunt thesaurum non deficientem in caelis quo fur non adpropiat neque tinea corrumpit"
      en: "Sell what you possess and give alms. Make to yourselves bags which grow not old, a treasure in heaven which faileth not: where no thief approacheth, nor moth corrupteth."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "ubi enim thesaurus vester est ibi et cor vestrum erit"
      en: "For where your treasure is, there will your heart be also."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "sint lumbi vestri praecincti et lucernae ardentes"
      en: "Let your loins be girt, and lamps burning in your hands."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et vos similes hominibus expectantibus dominum suum quando revertatur a nuptiis ut cum venerit et pulsaverit confestim aperiant ei"
      en: "And you yourselves like to men who wait for their lord, when he shall return from the wedding; that when he cometh and knocketh, they may open to him immediately."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "beati servi illi quos cum venerit dominus invenerit vigilantes amen dico vobis quod praecinget se et faciet illos discumbere et transiens ministrabit illis"
      en: "Blessed are those servants, whom the Lord when he cometh, shall find watching. Amen I say to you, that he will gird himself, and make them sit down to meat, and passing will minister unto them."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et si venerit in secunda vigilia et si in tertia vigilia venerit et ita invenerit beati sunt servi illi"
      en: "And if he shall come in the second watch, or come in the third watch, and find them so, blessed are those servants."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "hoc autem scitote quia si sciret pater familias qua hora fur veniret vigilaret utique et non sineret perfodiri domum suam"
      en: "But this know ye, that if the householder did know at what hour the thief would come, he would surely watch, and would not suffer his house to be broken open."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et vos estote parati quia qua hora non putatis Filius hominis venit"
      en: "Be you then also ready: for at what hour you think not, the Son of man will come."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "ait autem ei Petrus Domine ad nos dicis hanc parabolam an et ad omnes"
      en: "And Peter said to him: Lord, dost thou speak this parable to us, or likewise to all?"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "dixit autem Dominus quis putas est fidelis dispensator et prudens quem constituet dominus super familiam suam ut det illis in tempore tritici mensuram"
      en: "And the Lord said: Who (thinkest thou) is the faithful and wise steward, whom his lord setteth over his family, to give them their measure of wheat in due season?"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "beatus ille servus quem cum venerit dominus invenerit ita facientem"
      en: "Blessed is that servant, whom when his lord shall come, he shall find so doing."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "vere dico vobis quia supra omnia quae possidet constituet illum"
      en: "Verily I say to you, he will set him over all that he possesseth."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "quod si dixerit servus ille in corde suo moram facit dominus meus venire et coeperit percutere pueros et ancillas et edere et bibere et inebriari"
      en: "But if that servant shall say in his heart: My lord is long a coming; and shall begin to strike the menservants and maidservants, and to eat and to drink and be drunk:"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "veniet dominus servi illius in die qua non sperat et hora qua nescit et dividet eum partemque eius cum infidelibus ponet"
      en: "The lord of that servant will come in the day that he hopeth not, and at the hour that he knoweth not, and shall separate him, and shall appoint him his portion with unbelievers."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "ille autem servus qui cognovit voluntatem domini sui et non praeparavit et non fecit secundum voluntatem eius vapulabit multas"
      en: "And that servant who knew the will of his lord, and prepared not himself, and did not according to his will, shall be beaten with many stripes."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "qui autem non cognovit et fecit digna plagis vapulabit paucis omni autem cui multum datum est multum quaeretur ab eo et cui commendaverunt multum plus petent ab eo"
      en: "But he that knew not, and did things worthy of stripes, shall be beaten with few stripes. And unto whomsoever much is given, of him much shall be required: and to whom they have committed much, of him they will demand the more."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "ignem veni mittere in terram et quid volo si accendatur"
      en: "I am come to cast fire on the earth; and what will I, but that it be kindled?"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "baptisma autem habeo baptizari et quomodo coartor usque dum perficiatur"
      en: "And I have a baptism wherewith I am to be baptized: and how am I straitened until it be accomplished?"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "putatis quia pacem veni dare in terram non dico vobis sed separationem"
      en: "Think ye, that I am come to give peace on earth? I tell you, no; but separation."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "erunt enim ex hoc quinque in domo una divisi tres in duo et duo in tres"
      en: "For there shall be from henceforth five in one house divided: three against two, and two against three."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "dividentur pater in filium et filius in patrem suum mater in filiam et filia in matrem socrus in nurum suam et nurus in socrum suam"
      en: "The father shall be divided against the son, and the son against his father, the mother against the daughter, and the daughter against the mother, the mother in law against her daughter in law, and the daughter in law against her mother in law."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "dicebat autem et ad turbas cum videritis nubem orientem ab occasu statim dicitis nimbus venit et ita fit"
      en: "And he said also to the multitudes: When you see a cloud rising from the west, presently you say: A shower is coming: and so it happeneth:"
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "et cum austrum flantem dicitis quia aestus erit et fit"
      en: "And when ye see the south wind blow, you say: There will be heat: and it cometh to pass."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "hypocritae faciem terrae et caeli nostis probare hoc autem tempus quomodo non probatis"
      en: "You hypocrites, you know how to discern the face of the heaven and of the earth: but how is it that you do not discern this time?"
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "quid autem et a vobis ipsis non iudicatis quod iustum est"
      en: "And why even of yourselves, do you not judge that which is just?"
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "cum autem vadis cum adversario tuo ad principem in via da operam liberari ab illo ne forte trahat te apud iudicem et iudex tradat te exactori et exactor mittat te in carcerem"
      en: "And when thou goest with thy adversary to the prince, whilst thou art in the way, endeavour to be delivered from him: lest perhaps he draw thee to the judge, and the judge deliver thee to the exacter, and the exacter cast thee into prison."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "dico tibi non exies inde donec etiam novissimum minutum reddas"
      en: "I say to thee, thou shalt not go out thence, until thou pay the very last mite."
    status: { la: verified, en: verified }
