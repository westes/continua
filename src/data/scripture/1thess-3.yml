# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1thess
chapter: 3
verses:
  - n: 1
    text:
      la: "Propter quod non sustinentes amplius, placuit nobis remanere Athenis, solis:"
      en: "For which cause, forbearing no longer, we thought it good to remain at Athens alone:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et misimus Timotheum fratrem nostrum, et ministrum Dei in Evangelio Christi, ad confirmandos vos, et exhortandos pro fide vestra:"
      en: "And we sent Timothy, our brother, and the minister of God in the gospel of Christ, to confirm you and exhort you concerning your faith:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ut nemo moveatur in tribulationibus istis: ipsi enim scitis quod in hoc positi sumus."
      en: "That no man should be moved in these tribulations: for yourselves know, that we are appointed thereunto."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nam et cum apud vos essemus, praedicebamus vobis passuros nos tribulationes, sicut et factum est, et scitis."
      en: "For even when we were with you, we foretold you that we should suffer tribulations, as also it is come to pass, and you know."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Propterea et ego amplius non sustinens, misi ad cognoscendam fidem vestram: ne forte tentaverit vos is qui tentat, et inanis fiat labor noster."
      en: "For this cause also, I, forbearing no longer, sent to know your faith: lest perhaps he that tempteth should have tempted you, and our labour should be made vain."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Nunc autem veniente Timotheo ad nos a vobis, et annuntiante nobis fidem et caritatem vestram, et quia memoriam nostri habetis bonam semper, desiderantes nos videre, sicut et nos quoque vos:"
      en: "But now when Timothy came to us from you, and related to us your faith and charity, and that you have a good remembrance of us always, desiring to see us as we also to see you;"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ideo consolati sumus, fratres, in vobis in omni necessitate et tribulatione nostra, per fidem vestram,"
      en: "Therefore we were comforted, brethren, in you, in all our necessity and tribulation, by your faith,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quoniam nunc vivimus, si vos statis in Domino."
      en: "Because now we live, if you stand in the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quam enim gratiarum actionem possumus Deo retribuere pro vobis in omni gaudio, quo gaudemus propter vos ante Deum nostrum,"
      en: "For what thanks can we return to God for you, in all the joy wherewith we rejoice for you before our God,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "nocte ac die abundantius orantes, ut videamus faciem vestram, et compleamus ea quae desunt fidei vestrae?"
      en: "Night and day more abundantly praying that we may see your face, and may accomplish those things that are wanting to your faith?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ipse autem Deus, et Pater noster, et Dominus noster Jesus Christus, dirigat viam nostram ad vos."
      en: "Now God himself and our Father, and our Lord Jesus Christ, direct our way unto you."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Vos autem Dominus multiplicet, et abundare faciat caritatem vestram in invicem, et in omnes, quemadmodum et nos in vobis:"
      en: "And may the Lord multiply you, and make you abound in charity towards one another, and towards all men: as we do also towards you,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ad confirmanda corda vestra sine querela in sanctitate, ante Deum et Patrem nostrum, in adventu Domini nostri Jesu Christi cum omnibus sanctis ejus. Amen."
      en: "To confirm your hearts without blame, in holiness, before God and our Father, at the coming of our Lord Jesus Christ, with all his saints. Amen."
    status: { la: verified, en: verified }
