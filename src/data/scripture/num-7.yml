book: num
chapter: 7
verses:
  - n: 1
    text:
      la: "factum est autem in die qua conplevit Moses tabernaculum et erexit illud unxitque et sanctificavit cum omnibus vasis suis altare similiter et vasa eius"
      en: "And it came to pass in the day that Moses had finished the tabernacle, and set it up, and had anointed and sanctified it with all its vessels, the altar likewise and all the vessels thereof,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "obtulerunt principes Israhel et capita familiarum qui erant per singulas tribus praefecti eorum qui numerati fuerant"
      en: "The princes of Israel and the heads of the families, in every tribe, who were the rulers of them who had been numbered, offered"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "munera coram Domino sex plaustra tecta cum duodecim bubus unum plaustrum obtulere duo duces et unum bovem singuli obtuleruntque ea in conspectu tabernaculi"
      en: "3l Offered a silver dish weighing one hundred and thirty sides, a silver bowl of seventy sides according to the weight of the sanctuary, both full of flour tempered with oil for a sacrifice:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ait autem Dominus ad Mosen"
      en: "And the Lord said to Moses:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "suscipe ab eis ut serviant in ministerio tabernaculi et tradas ea Levitis iuxta ordinem ministerii sui"
      en: "Receive them from them to serve in the ministry of the tabernacle, and thou shalt deliver them to the Levites according to the order of their ministry."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "itaque cum suscepisset Moses plaustra et boves tradidit eos Levitis"
      en: "Moses therefore receiving the wagons and the oxen, delivered them to the Levites."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "duo plaustra et quattuor boves dedit filiis Gerson iuxta id quod habebant necessarium"
      en: "Two wagons and four oxen he gave to the sons of Gerson, according to their necessity."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quattuor alia plaustra et octo boves dedit filiis Merari secundum officia et cultum suum sub manu Ithamar filii Aaron sacerdotis"
      en: "The other four wagons, and eight oxen he gave to the sons of Merari, according to their offices and service, under the hand of Ithamar the son of Aaron the priest."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "filiis autem Caath non dedit plaustra et boves quia in sanctuario serviunt et onera propriis portant umeris"
      en: "But to the sons of Caath he gave no wagons or oxen: because they serve in the sanctuary and carry their burdens upon their own shoulders."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "igitur obtulerunt duces in dedicationem altaris die qua unctum est oblationem suam ante altare"
      en: "And the princes offered for the dedication of the altar on the day when it was anointed, their oblation before the altar."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dixitque Dominus ad Mosen singuli duces per singulos dies offerant munera in dedicationem altaris"
      en: "And the Lord said to Moses: Let each of the princes one day after another offer their gifts for the dedication of the altar."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "primo die obtulit oblationem suam Naasson filius Aminadab de tribu Iuda"
      en: "The first day Nahasson the son of Aminadab of the tribe of Juda offered his offering:"
    status: { la: verified, en: verified }
  - n: 13
