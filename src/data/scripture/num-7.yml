# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 7
verses:
  - n: 1
    text:
      la: "Factum est autem in die qua complevit Moyses tabernaculum, et erexit illud, unxitque et sanctificavit cum omnibus vasis suis, altare similiter et omnia vasa ejus:"
      en: "And it came to pass in the day that Moses had finished the tabernacle, and set it up, and had anointed and sanctified it with all its vessels, the altar likewise and all the vessels thereof,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "obtulerunt principes Israel et capita familiarum, qui erant per singulas tribus, praefectique eorum, qui numerati fuerant,"
      en: "The princes of Israel and the heads of the families, in every tribe, who were the rulers of them who had been numbered, offered"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "munera coram Domino sex plaustra tecta cum duodecim bobus. Unum plaustrum obtulere duo duces, et unum bovem singuli, obtuleruntque ea in conspectu tabernaculi."
      en: "Their gifts before the Lord, six wagons covered, and twelve oxen. Two princes offered one wagon, and each one an ox, and they offered them before the tabernacle."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ait autem Dominus ad Moysen:"
      en: "And the Lord said to Moses:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Suscipe ab eis ut serviant in ministerio tabernaculi, et trades ea Levitis juxta ordinem ministerii sui."
      en: "Receive them from them to serve in the ministry of the tabernacle, and thou shalt deliver them to the Levites according to the order of their ministry."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Itaque cum suscepisset Moyses plaustra et boves, tradidit eos Levitis."
      en: "Moses therefore receiving the wagons and the oxen, delivered them to the Levites."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Duo plaustra et quatuor boves dedit filiis Gerson, juxta id quod habebant necessarium."
      en: "Two wagons and four oxen he gave to the sons of Gerson, according to their necessity."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quatuor alia plaustra et octo boves dedit filiis Merari secundum officia et cultum suum, sub manu Ithamar filii Aaron sacerdotis."
      en: "The other four wagons, and eight oxen he gave to the sons of Merari, according to their offices and service, under the hand of Ithamar the son of Aaron the priest."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Filiis autem Caath non dedit plaustra et boves: quia in sanctuario serviunt, et onera propriis portant humeris."
      en: "But to the sons of Caath he gave no wagons or oxen: because they serve in the sanctuary and carry their burdens upon their own shoulders."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Igitur obtulerunt duces in dedicationem altaris, die qua unctum est, oblationem suam ante altare."
      en: "And the princes offered for the dedication of the altar on the day when it was anointed, their oblation before the altar."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Dixitque Dominus ad Moysen: Singuli duces per singulos dies offerant munera in dedicationem altaris."
      en: "And the Lord said to Moses: Let each of the princes one day after another offer their gifts for the dedication of the altar."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Primo die obtulit oblationem suam Nahasson filius Aminadab de tribu Juda:"
      en: "The first day Nahasson the son of Aminadab of the tribe of Juda offered his offering:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "fueruntque in ea acetabulum argenteum pondo centum triginta siclorum, phiala argentea habens septuaginta siclos, juxta pondus sanctuarii, utrumque plenum simila conspersa oleo in sacrificium:"
      en: "And his offering was a silver dish weighing one hundred and thirty sicles, a silver bowl of seventy sicles according to the weight of the sanctuary, both full of flour tempered with oil for a sacrifice:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "mortariolum ex decem siclis aureis plenum incenso:"
      en: "A little mortar of ten sicles of gold full of incense:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "bovem de armento, et arietem, et agnum anniculum in holocaustum:"
      en: "An ox of the herd, and a ram, and a lamb of a year old for a holocaust:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "hircumque pro peccato:"
      en: "And a buck goat for sin:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et in sacrificio pacificorum boves duos, arietes quinque, hircos quinque, agnos anniculos quinque. Haec est oblatio Nahasson filii Aminadab."
      en: "And for the sacrifice of peace offerings, two oxen, five rams, five he goats, five lambs of a year old. This was the offering of Nahasson the son of Aminadab."
    status: { la: verified, en: verified }
