# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 7
verses:
  - n: 1
    text:
      la: "Verbum quod factum est ad Jeremiam a Domino, dicens:"
      en: "The word that came to Jeremias from the Lord, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Sta in porta domus Domini, et praedica ibi verbum istud, et dic: Audite verbum Domini, omnis Juda, qui ingredimini per portas has ut adoretis Dominum."
      en: "Stand in the gate of the house of the Lord, and proclaim there this word, and say: Hear ye the word of the Lord, all ye men of Juda, that enter in at these gates, to adore the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Haec dicit Dominus exercituum, Deus Israel: Bonas facite vias vestras, et studia vestra, et habitabo vobiscum in loco isto."
      en: "Thus saith the Lord of hosts the God of Israel: Make your ways and your doings good: and I will dwell with you in this place."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nolite confidere in verbis mendacii, dicentes: Templum Domini, templum Domini, templum Domini est!"
      en: "Trust not in lying words, saying: The temple of the Lord, the temple of the Lord, it is the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quoniam si bene direxeritis vias vestras, et studia vestra: si feceritis judicium inter virum et proximum ejus:"
      en: "For if you will order well your ways, and your doings: if you will execute judgment between a man and his neighbour,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "advenae, et pupillo, et viduae non feceritis calumniam, nec sanguinem innocentem effuderitis in loco hoc, et post deos alienos non ambulaveritis in malum vobismetipsis:"
      en: "If you oppress not the stranger, the fatherless, and the widow, and shed not innocent blood in this place, and walk not after strange gods to your own hurt,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "habitabo vobiscum in loco isto, in terra quam dedi patribus vestris a saeculo et usque in saeculum."
      en: "I will dwell with you in this place: in the land, which I gave to your fathers from the beginning and for evermore."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ecce vos confiditis vobis in sermonibus mendacii, qui non proderunt vobis:"
      en: "Behold you put your trust in lying words, which shall not profit you:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "furari, occidere, adulterari, jurare mendaciter, libare Baalim, et ire post deos alienos quos ignoratis:"
      en: "To steal, to murder, to commit adultery, to swear falsely, to offer to Baalim, and to go after strange gods, which you know not."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et venistis, et stetistis coram me in domo hac, in qua invocatum est nomen meum, et dixistis: Liberati sumus, eo quod fecerimus omnes abominationes istas."
      en: "And you have come, and stood before me in this house, in which my name is called upon, and have said: We are delivered, because we have done all these abominations."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Numquid ergo spelunca latronum facta est domus ista, in qua invocatum est nomen meum in oculis vestris? Ego, ego sum: ego vidi, dicit Dominus."
      en: "Is this house then, in which my name hath been called upon, in your eyes become a den of robbers? I, I am he: I have seen it, saith the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ite ad locum meum in Silo, ubi habitavit nomen meum a principio, et videte quae fecerim ei propter malitiam populi mei Israel."
      en: "Go ye to my place in Silo, where my name dwelt from the beginning: and see what I did to it for the wickedness of my people Israel:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et nunc, quia fecistis omnia opera haec, dicit Dominus, et locutus sum ad vos mane consurgens, et loquens, et non audistis: et vocavi vos, et non respondistis:"
      en: "And now, because you have done all these works, saith the Lord: and I have spoken to you rising up early, and speaking, and you have not heard: and I have called you, and you have not answered:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "faciam domui huic, in qua invocatum est nomen meum, et in qua vos habetis fiduciam, et loco quem dedi vobis et patribus vestris, sicut feci Silo:"
      en: "I will do to this house, in which my name is called upon, and in which you trust, and to the places which I have given you and your fathers, as I did to Silo."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et projiciam vos a facie mea sicut projeci omnes fratres vestros, universum semen Ephraim."
      en: "And I will cast you away from before my face, as I have cast away all your brethren, the whole seed of Ephraim."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Tu ergo, noli orare pro populo hoc, nec assumas pro eis laudem et orationem. et non obsistas mihi, quia non exaudiam te."
      en: "Therefore, do not thou pray for this people, nor take to thee praise and supplication for them: and do not withstand me: for I will not hear thee."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Nonne vides quid isti faciunt in civitatibus Juda, et in plateis Jerusalem?"
      en: "Seest thou not what they do in the cities of Juda, and in the streets of Jerusalem?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Filii colligunt ligna, et patres succendunt ignem, et mulieres conspergunt adipem, ut faciant placentas reginae caeli, et libent diis alienis, et me ad iracundiam provocent."
      en: "The children gather wood, and the fathers kindle the fire and the women knead the dough, to make cakes to the queen of heaven, and to offer libations to strange gods, and to provoke me to anger."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Numquid me ad iracundiam provocant? dicit Dominus; nonne semetipsos in confusionem vultus sui?"
      en: "Do they provoke me to anger, saith the Lord? Is it not themselves, to the confusion of their countenance?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Ideo haec dicit Dominus Deus: Ecce furor meus et indignatio mea conflatur super locum istum, super viros, et super jumenta, et super lignum regionis, et super fruges terrae: et succendetur, et non extinguetur."
      en: "Therefore thus saith the Lord God: Behold my wrath and my indignation was enkindled against this place, upon men and upon beasts, and upon the trees of the field, and upon the fruits of the land, and it shall burn, and shall not be quenched."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Haec dicit Dominus exercituum, Deus Israel: Holocautomata vestra addite victimis vestris, et comedite carnes:"
      en: "Thus saith the Lord of hosts the God of Israel: Add your burnt offerings to your sacrifices, and eat ye the flesh."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quia non sum locutus cum patribus vestris, et non praecepi eis, in die qua eduxi eos de terra Aegypti, de verbo holocautomatum et victimarum:"
      en: "For I spoke not to your fathers, and I commanded them not, in the day that I brought them out of the land of Egypt, concerning the matter of burnt offerings and sacrifices."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sed hoc verbum praecepi eis, dicens: Audite vocem meam, et ero vobis Deus, et vos eritis mihi populus: et ambulate in omni via quam mandavi vobis, ut bene sit vobis."
      en: "But this thing I commanded them, saying: Hearken to my voice, and I will be your God, and you shall be my people: and walk ye in all the way that I have commanded you, that it may be well with you."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et non audierunt, nec inclinaverunt aurem suam: sed abierunt in voluntatibus et in pravitate cordis sui mali: factique sunt retrorsum, et non in ante,"
      en: "But they hearkened not, nor inclined their ear: but walked in their own will, and in the perversity of their wicked heart: and went backward and not forward,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "a die qua egressi sunt patres eorum de terra Aegypti usque ad diem hanc. Et misi ad vos omnes servos meos prophetas per diem consurgens diluculo, et mittens:"
      en: "From the day that their fathers came out of the land of Egypt, even to this day. And I have sent to you all my servants the prophets from day to day, rising up early and sending."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et non audierunt me, nec inclinaverunt aurem suam: sed induraverunt cervicem suam, et pejus operati sunt quam patres eorum."
      en: "And they have not hearkened to me: nor inclined their ear: but have hardened their neck, and have done worse than their fathers."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et loqueris ad eos omnia verba haec, et non audient te: et vocabis eos, et non respondebunt tibi."
      en: "And thou shalt speak to them all these words, but they will not hearken to thee: and thou shalt call them, but they will not answer thee."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et dices ad eos: Haec est gens quae non audivit vocem Domini Dei sui, nec recepit disciplinam; periit fides, et ablata est de ore eorum."
      en: "And thou shalt say to them: This is a nation which hath not hearkened to the voice of the Lord their God, nor received instruction: Faith is lost, and is carried away out of their mouth."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Tonde capillum tuum, et projice, et sume in directum planctum, quia projecit Dominus et reliquit generationem furoris sui:"
      en: "Cut off thy hair, and cast it away: and take up a lamentation on high: for the Lord hath rejected and forsaken the generation of his wrath,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quia fecerunt filii Juda malum in oculis meis, dicit Dominus. Posuerunt offendicula sua in domo in qua invocatum est nomen meum, ut polluerent eam:"
      en: "Because the children of Juda have done evil in my eyes, saith the Lord. They have set their abominations in the house in which my name is called upon, to pollute it;"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et aedificaverunt excelsa Topheth, quae est in valle filii Ennom, ut incenderent filios suos et filias suas igni, quae non praecepi, nec cogitavi in corde meo."
      en: "And they have built the high places of Topeth, which is in the valley of the son of Ennom, to burn their sons, and their daughters in the fire: which I commanded not, nor thought on in my heart."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Ideo ecce dies venient, dicit Dominus, et non dicetur amplius Topheth, et vallis filii Ennom, sed vallis interfectionis: et sepelient in Topheth, eo quod non sit locus."
      en: "Therefore behold the days shall come, saith the Lord, and it shall no more be called Topeth, nor the valley of the son of Ennom: but the valley of slaughter, and they shall bury in Topeth, because there is no place."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et erit morticinum populi hujus in cibos volucribus caeli, et bestiis terrae, et non erit qui abigat."
      en: "And the carcasses of this people shall be meat for the fowls of the air, and for the beasts of the earth, and there shall be none to drive them away."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et quiescere faciam de urbibus Juda, et de plateis Jerusalem, vocem gaudii et vocem laetitiae, vocem sponsi et vocem sponsae: in desolationem enim erit terra."
      en: "And I will cause to cease out of the cities of Juda, and out of the streets of Jerusalem, the voice of joy, and the voice of gladness, the voice of the bridegroom and the voice of the bride: for the land shall be desolate."
    status: { la: verified, en: verified }
