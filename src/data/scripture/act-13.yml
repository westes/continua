# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: act
chapter: 13
verses:
  - n: 1
    text:
      la: "Erant autem in ecclesia, quae erat Antiochiae, prophetae, et doctores, in quibus Barnabas, et Simon, qui vocabatur Niger, et Lucius Cyrenensis, et Manahen, qui erat Herodis Tetrarchae collactaneus, et Saulus."
      en: "Now there were in the church which was at Antioch, prophets and doctors, among whom was Barnabas, and Simon who was called Niger, and Lucius of Cyrene, and Manahen, who was the foster brother of Herod the tetrarch, and Saul."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ministrantibus autem illis Domino, et jejunantibus, dixit illis Spiritus Sanctus: Segregate mihi Saulum et Barnabam in opus ad quod assumpsi eos."
      en: "And as they were ministering to the Lord, and fasting, the Holy Ghost said to them: Separate me Saul and Barnabas, for the work whereunto I have taken them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tunc jejunantes, et orantes, imponentesque eis manus, dimiserunt illos."
      en: "Then they, fasting and praying, and imposing their hands upon them, sent them away."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et ipsi quidem missi a Spiritu Sancto abierunt Seleuciam: et inde navigaverunt Cyprum."
      en: "So they being sent by the Holy Ghost, went to Seleucia: and from thence they sailed to Cyprus."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et cum venissent Salaminam, praedicabant verbum Dei in synagogis Judaeorum. Habebant autem et Joannem in ministerio."
      en: "And when they were come to Salamina, they preached the word of God in the synagogues of the Jews. And they had John also in the ministry."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et cum perambulassent universam insulam usque Paphum, invenerunt quemdam virum magnum pseudoprophetam, Judaeum, cui nomen erat Barjesu,"
      en: "And when they had gone through the whole island, as far as Paphos, they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-jesu:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui erat cum proconsule Sergio Paulo viro prudente. Hic, accersitis Barnaba et Saulo, desiderabat audire verbum Dei."
      en: "Who was with the proconsul Sergius Paulus, a prudent man. He sending for Barnabas and Saul, desired to hear the word of God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Resistebat autem illis Elymas magus ( si enim interpretatur nomen ejus), quaerens avertere proconsulem a fide."
      en: "But Elymas the magician (for so his name is interpreted) withstood them, seeking to turn away the proconsul from the faith."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Saulus autem, qui et Paulus, repletus Spiritu Sancto, intuens in eum,"
      en: "Then Saul, otherwise Paul, filled with the Holy Ghost, looking upon him,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dixit: O plene omni dolo et omni fallacia, fili diaboli, inimice omnis justitiae, non desinis subvertere vias Domini rectas."
      en: "Said: O full of all guile, and of all deceit, child of the devil, enemy of all justice, thou ceasest not to pervert the right ways of the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et nunc ecce manus Domini super te, et eris caecus, non videns solem usque ad tempus. Et confestim cecidit in eum caligo, et tenebrae, et circuiens quaerebat qui ei manum daret."
      en: "And now behold, the hand of the Lord is upon thee, and thou shalt be blind, not seeing the sun for a time. And immediately there fell a mist and darkness upon him, and going about, he sought some one to lead him by the hand."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tunc proconsul cum vidisset factum, credidit admirans super doctrina Domini."
      en: "Then the proconsul, when he had seen what was done, believed, admiring at the doctrine of the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et cum a Papho navigassent Paulus, et qui cum eo erant, venerunt Pergen Pamphyliae. Joannes autem discedens ab eis, reversus est Jerosolymam."
      en: "Now when Paul and they that were with him had sailed from Paphos, they came to Perge in Pamphylia. And John departing from them, returned to Jerusalem."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Illi vero pertranseuntes Pergen, venerunt Antiochiam Pisidiae: et ingressi synagogam die sabbatorum, sederunt."
      en: "But they passing through Perge, came to Antioch in Pisidia: and entering into the synagogue on the sabbath day, they sat down."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Post lectionem autem legis, et prophetarum, miserunt principes synagogae ad eos, dicentes: Viri fratres, si quis est in vobis sermo exhortationis ad plebem, dicite."
      en: "And after the reading of the law and the prophets, the rulers of the synagogue sent to them, saying: Ye men, brethren, if you have any word of exhortation to make to the people, speak."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Surgens autem Paulus, et manu silentium indicens, ait: Viri Israelitae, et qui timetis Deum, audite:"
      en: "Then Paul rising up, and with his hand bespeaking silence, said: Ye men of Israel, and you that fear God, give ear."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Deus plebis Israel elegit patres nostros, et plebem exaltavit cum essent incolae in terra Aegypti, et in brachio excelso eduxit eos ex ea,"
      en: "The God of the people of Israel chose our fathers, and exalted the people when they were sojourners in the land of Egypt, and with an high arm brought them out from thence,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et per quadraginta annorum tempus mores eorum sustinuit in deserto."
      en: "And for the space of forty years endured their manners in the desert."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et destruens gentes septem in terra Chanaan, sorte distribuit eis terram eorum,"
      en: "And destroying seven nations in the land of Chanaan, divided their land among them, by lot,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quasi post quadringentos et quinquaginta annos: et post haec dedit judices, usque ad Samuel prophetam."
      en: "As it were, after four hundred and fifty years: and after these things, he gave unto them judges, until Samuel the prophet."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et exinde postulaverunt regem: et dedit illis Deus Saul filium Cis, virum de tribu Benjamin, annis quadraginta:"
      en: "And after that they desired a king: and God gave them Saul the son of Cis, a man of the tribe of Benjamin, forty years."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et amoto illo, suscitavit illis David regem: cui testimonium perhibens, dixit: Inveni David filium Jesse, virum secundum cor meum, qui faciet omnes voluntates meas."
      en: "And when he had removed him, he raised them up David to be king: to whom giving testimony, he said: I have found David, the son of Jesse, a man according to my own heart, who shall do all my wills."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Hujus Deus ex semine secundum promissionem eduxit Israel salvatorem Jesum,"
      en: "Of this man's seed God according to his promise, hath raised up to Israel a Saviour, Jesus:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "praedicante Joanne ante faciem adventus ejus baptismum poenitentiae omni populo Israel."
      en: "John first preaching, before his coming, the baptism of penance to all the people of Israel."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Cum impleret autem Joannes cursum suum, dicebat: Quem me arbitramini esse, non sum ego, sed ecce venit post me, cujus non sum dignus calceamenta pedum solvere."
      en: "And when John was fulfilling his course, he said: I am not he, whom you think me to be: but behold, there cometh one after me, whose shoes of his feet I am not worthy to loose."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Viri fratres, filii generis Abraham, et qui in vobis timent Deum, vobis verbum salutis hujus missum est."
      en: "Men, brethren, children of the stock of Abraham, and whosoever among you fear God, to you the word of this salvation is sent."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Qui enim habitabant Jerusalem, et principes ejus hunc ignorantes, et voces prophetarum, quae per omne sabbatum leguntur, judicantes impleverunt,"
      en: "For they that inhabited Jerusalem, and the rulers thereof, not knowing him, nor the voices of the prophets, which are read every sabbath, judging him have fulfilled them."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et nullam causam mortis invenientes in eo, petierunt a Pilato, ut interficerent eum."
      en: "And finding no cause of death in him, they desired of Pilate, that they might kill him."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Cumque consummassent omnia quae de eo scripta erant, deponentes eum de ligno, posuerunt eum in monumento."
      en: "And when they had fulfilled all things that were written of him, taking him down from the tree, they laid him in a sepulchre."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Deus vero suscitavit eum a mortuis tertia die:"
      en: "But God raised him up from the dead the third day:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "qui visus est per dies multos his, qui simul ascenderant cum eo de Galilaea in Jerusalem: qui usque nunc sunt testes ejus ad plebem."
      en: "Who was seen for many days, by them who came up with him from Galilee to Jerusalem, who to this present are his witnesses to the people."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et nos vobis annuntiamus eam, quae ad patres nostros repromissio facta est:"
      en: "And we declare unto you, that the promise which was made to our fathers,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "quoniam hanc Deus adimplevit filiis nostris resuscitans Jesum, sicut et in Psalmo secundo scriptum est: Filius meus es tu, ego hodie genui te."
      en: "This same God hath fulfilled to our children, raising up Jesus, as in the second psalm also is written: Thou art my Son, this day have I begotten thee."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Quod autem suscitavit eum a mortuis, amplius jam non reversurum in corruptionem, ita dixit: Quia dabo vobis sancta David fidelia."
      en: "And to shew that he raised him up from the dead, not to return now any more to corruption, he said thus: I will give you the holy things of David faithful."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Ideoque et alias dicit: Non dabis sanctum tuum videre corruptionem."
      en: "And therefore, in another place also, he saith: Thou shalt not suffer thy holy one to see corruption."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "David enim in sua generatione cum administrasset, voluntati Dei dormivit: et appositus est ad patres suos, et vidit corruptionem."
      en: "For David, when he had served in his generation, according to the will of God, slept: and was laid unto his fathers, and saw corruption."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Quem vero Deus suscitavit a mortuis, non vidit corruptionem."
      en: "But he whom God hath raised from the dead, saw no corruption."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Notum igitur sit vobis, viri fratres, quia per hunc vobis remissio peccatorum annuntiatur, et ab omnibus quibus non potuistis in lege Moysi justificari,"
      en: "Be it known therefore to you, men, brethren, that through him forgiveness of sins is preached to you: and from all the things, from which you could not be justified by the law of Moses."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "in hoc omnis qui credit, justificatur."
      en: "In him every one that believeth, is justified."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Videte ergo ne superveniat vobis quod dictum est in prophetis:"
      en: "Beware, therefore, lest that come upon you which is spoken in the prophets:"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Videte contemptores, et admiramini, et disperdimini: quia opus operor ego in diebus vestris, opus quod non credetis, si quis enarraverit vobis."
      en: "Behold, ye despisers, and wonder, and perish: for I work a work in your days, a work which you will not believe, if any man shall tell it you."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Exeuntibus autem illis rogabant ut sequenti sabbato loquerentur sibi verba haec."
      en: "And as they went out, they desired them, that on the next sabbath, they would speak unto them these words."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Cumque dimissa esset synagoga, secuti sunt multi Judaeorum, et colentium advenarum, Paulum et Barnabam: qui loquentes suadebant eis ut permanerent in gratia Dei."
      en: "And when the synagogue was broken up, many of the Jews, and of the strangers who served God, followed Paul and Barnabas: who speaking to them, persuaded them to continue in the grace of God."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Sequenti vero sabbato pene universa civitas convenit audire verbum Dei."
      en: "But the next sabbath day, the whole city almost came together, to hear the word of God."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Videntes autem turbas Judaei, repleti sunt zelo, et contradicebant his quae a Paulo dicebantur, blasphemantes."
      en: "And the Jews seeing the multitudes, were filled with envy, and contradicted those things which were said by Paul, blaspheming."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Tunc constanter Paulus et Barnabas dixerunt: Vobis oportebat primum loqui verbum Dei: sed quoniam repellitis illud, et indignos vos judicatis aeternae vitae, ecce convertimur ad gentes."
      en: "Then Paul and Barnabas said boldly: To you it behoved us first to speak the word of God: but because you reject it, and judge yourselves unworthy of eternal life, behold we turn to the Gentiles."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Sic enim praecepit nobis Dominus: Posui te in lucem gentium, ut sis in salutem usque ad extremum terrae."
      en: "For so the Lord hath commanded us: I have set thee to be the light of the Gentiles; that thou mayest be for salvation unto the utmost part of the earth."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Audientes autem gentes gavisae sunt, et glorificabant verbum Domini: et crediderunt quotquot erant praeordinati ad vitam aeternam."
      en: "And the Gentiles hearing it, were glad, and glorified the word of the Lord: and as many as were ordained to life everlasting, believed."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Disseminabatur autem verbum Domini per universam regionem."
      en: "And the word of the Lord was published throughout the whole country."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Judaei autem concitaverunt mulieres religiosas, et honestas, et primos civitatis, et excitaverunt persecutionem in Paulum et Barnabam: et ejecerunt eos de finibus suis."
      en: "But the Jews stirred up religious and honourable women, and the chief men of the city, and raised persecution against Paul and Barnabas: and cast them out of their coasts."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "At illi excusso pulvere pedum in eos, venerunt Iconium."
      en: "But they, shaking off the dust of their feet against them, came to Iconium."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Discipuli quoque replebantur gaudio, et Spiritu Sancto."
      en: "And the disciples were filled with joy and with the Holy Ghost."
    status: { la: verified, en: verified }
