# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 3reg
chapter: 19
verses:
  - n: 1
    text:
      la: "Nuntiavit autem Achab Jezabel omnia quae fecerat Elias, et quomodo occidisset universos prophetas gladio."
      en: "And Achab told Jezabel all that Elias had done, and how he had slain all the prophets with the sword."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Misitque Jezabel nuntium ad Eliam, dicens: Haec mihi faciant dii, et haec addant, nisi hac hora cras posuero animam tuam sicut animam unius ex illis."
      en: "And Jezabel sent a messenger to Elias, saying: Such and such things may the gods do to me, and add still more, if by this hour tomorrow I make not thy life as the life of one of them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Timuit ergo Elias, et surgens abiit quocumque eum ferebat voluntas: venitque in Bersabee Juda, et dimisit ibi puerum suum,"
      en: "Then Elias was afraid, and rising up he went whithersoever he had a mind: and he came to Bersabee of Juda, and left his servant there,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et perrexit in desertum, viam unius diei. Cumque venisset, et sederet subter unam juniperum, petivit animae suae ut moreretur, et ait: Sufficit mihi Domine, tolle animam meam: neque enim melior sum quam patres mei."
      en: "And he went forward, one day's journey into the desert. And when he was there, and sat under a juniper tree, he requested for his soul that he might die, and said: It is enough for me, Lord, take away my soul: for I am no better than my fathers."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Projecitque se, et obdormivit in umbra juniperi: et ecce angelus Domini tetigit eum, et dixit illi: Surge, et comede."
      en: "And he cast himself down, and slept in the shadow of the juniper tree: and behold an angel of the Lord touched him, and said to him: Arise and eat."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Respexit, et ecce ad caput suum subcinericius panis, et vas aquae: comedit ergo, et bibit, et rursum obdormivit."
      en: "He looked, and behold there was at his head a hearth cake, and a vessel of water: and he ate and drank, and he fell asleep again."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Reversusque est angelus Domini secundo, et tetigit eum, dixitque illi: Surge, comede: grandis enim tibi restat via."
      en: "And the angel of the Lord came again the second time, and touched him, and said to him: Arise, eat: for thou hast yet a great way to go."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Qui cum surrexisset, comedit et bibit, et ambulavit in fortitudine cibi illius quadraginta diebus et quadraginta noctibus usque ad montem Dei Horeb."
      en: "And he arose, and ate, and drank, and walked in the strength of that food forty days and forty nights, unto the mount of God, Horeb."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Cumque venisset illuc, mansit in spelunca: et ecce sermo Domini ad eum, dixitque illi: Quid hic agis Elia?"
      en: "And when he was come thither, he abode in a cave: and behold the word of the Lord came unto him, and he said to him: What dost thou here, Elias?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "At ille respondit: Zelo zelatus sum pro Domino Deo exercituum, quia dereliquerunt pactum tuum filii Israel: altaria tua destruxerunt, prophetas tuos occiderunt gladio, derelictus sum ego solus, et quaerunt animam meam ut auferant eam."
      en: "And he answered: With zeal have I been zealous for the Lord God of hosts: for the children of Israel have forsaken thy covenant: they have thrown down thy altars, they have slain thy prophets with the sword, and I alone am left, and they seek my life to take it away."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et ait ei: Egredere, et sta in monte coram Domino: et ecce Dominus transit, et spiritus grandis et fortis subvertens montes, et conterens petras ante Dominum: non in spiritu Dominus, et post spiritum commotio: non in commotione Dominus,"
      en: "And he said to him: Go forth, and stand upon the mount before the Lord: and behold the Lord passeth, and a great and strong wind before the Lord over throwing the mountains, and breaking the rocks in pieces: the Lord is not in the wind, and after the wind an earthquake: the Lord is not in the earthquake."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et post commotionem ignis: non in igne Dominus, et post ignem sibilus aurae tenuis."
      en: "And after the earthquake a fire: the Lord is not in the fire, and after the fire a whistling of a gentle air."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quod cum audisset Elias, operuit vultum suum pallio, et egressus stetit in ostio speluncae, et ecce vox ad eum dicens: Quid hic agis Elia? Et ille respondit:"
      en: "And when Elias heard it, he covered his face with his mantle, and coming forth stood in the entering in of the cave, and behold a voice unto him, saying: What dost thou here, Elias? And he answered:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Zelo zelatus sum pro Domino Deo exercituum: quia dereliquerunt pactum tuum filii Israel: altaria tua destruxerunt, prophetas tuos occiderunt gladio, derelictus sum ego solus, et quaerunt animam meam ut auferant eam."
      en: "With zeal have I been zealous for the Lord God of hosts: because the children of Israel have forsaken thy covenant: they have destroyed thy altars, they have slain thy prophets with the sword, and I alone am left, and they seek my life to take it away."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et ait Dominus ad eum: Vade, et revertere in viam tuam per desertum in Damascum: cumque perveneris illuc, unges Hazael regem super Syriam,"
      en: "And the Lord said to him: Go, and return on thy way through the desert to Damascus: and when thou art come thither, thou shalt anoint Hazael to be king over Syria."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et Jehu filium Namsi unges regem super Israel: Eliseum autem filium Saphat, qui est de Abelmeula, unges prophetam pro te."
      en: "And thou shalt anoint Jehu the son of Namsi to be king over Israel: and Eliseus the son of Saphat, of Abelmeula, thou shalt anoint to be prophet in thy room."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et erit, quicumque fugerit gladium Hazael, occidet eum Jehu: et quicumque fugerit gladium Jehu, interficiet eum Eliseus."
      en: "And it shall come to pass, that whosoever shall escape the sword of Hazael, shall be slain by Jehu: and whosoever shall escape the sword of Jehu, shall be slain by Eliseus."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et derelinquam mihi in Israel septem millia virorum, quorum genua non sunt incurvata ante Baal, et omne os, quod non adoravit eum osculans manus."
      en: "And I will leave me seven thousand men in Israel, whose knees have not been bowed before Baal, and every mouth that hath not worshipped him kissing the hands."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Profectus ergo inde Elias, reperit Eliseum filium Saphat, arantem in duodecim jugis boum. Et ipse in duodecim jugis boum arantibus unus erat: cumque venisset Elias ad eum, misit pallium suum super illum."
      en: "And Elias departing from thence, found Eliseus the son of Saphat, ploughing with twelve yoke of oxen: and he was one of them that were ploughing with twelve yoke of oxen: and when Elias came up to him, he cast his mantle upon him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Qui statim relictis bobus cucurrit post Eliam, et ait: Osculer, oro, patrem meum, et matrem meam, et sic sequar te. Dixitque ei: Vade, et revertere: quod enim meum erat feci tibi."
      en: "And he forthwith left the oxen and ran after Elias, and said: Let me, I pray thee, kiss my father and my mother, and then I will follow thee. And he said to him: Go, and return back: for that which was my part, I have done to thee."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Reversus autem ab eo, tulit par boum, et mactavit illud, et in aratro boum coxit carnes, et dedit populo, et comederunt: consurgensque abiit, et secutus est Eliam, et ministrabat ei."
      en: "And returning back from him, he took a yoke of oxen, and killed them, and boiled the flesh with the plough of the oxen, and gave to the people, and they ate: and rising up he went away, and followed Elias, and ministered to him."
    status: { la: verified, en: verified }
