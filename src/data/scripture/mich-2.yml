# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: mich
chapter: 2
verses:
  - n: 1
    text:
      la: "vae qui cogitatis inutile et operamini malum in cubilibus vestris in luce matutina faciunt illud quoniam contra Deum est manus eorum"
      en: "Woe to you that devise that which is unprofitable, and work evil in your beds: in the morning light they execute it, because their hand is against God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et concupierunt agros et violenter tulerunt et domos rapuerunt et calumniabantur virum et domum eius virum et hereditatem eius"
      en: "And they have coveted fields, and taken them by violence, and houses they have forcibly taken away: and oppressed a man and his house, a man and his inheritance."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "idcirco haec dicit Dominus ecce ego cogito super familiam istam malum unde non auferetis colla vestra et non ambulabitis superbi quoniam tempus pessimum est"
      en: "Therefore thus saith the Lord : Behold, I devise an evil against this family: from which you shall not withdraw your necks, and you shall not walk haughtily, for this is a very evil time."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "in die illa sumetur super vos parabola et cantabitur canticum cum suavitate dicentium depopulatione vastati sumus pars populi mei commutata est quomodo recedet a me cum revertatur qui regiones nostras dividat"
      en: "In that day a parable shall be taken up upon you, and a song shall be sung with melody by them that say: We are laid waste and spoiled: the portion of my people is changed: how shall he depart from me, whereas he is returning that will divide our land?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "propter hoc non erit tibi mittens funiculum sortis in coetu Domini"
      en: "Therefore thou shalt have none that shall cast the cord of a lot in the assembly of the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ne loquamini loquentes non stillabit super istos non conprehendet confusio"
      en: "Speak ye not, saying: It shall not drop upon these, confusion shall not take them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dicit domus Iacob numquid adbreviatus est spiritus Domini aut tales sunt cogitationes eius nonne verba mea bona sunt cum eo qui recte graditur"
      en: "The house of Jacob saith: Is the spirit of the Lord straitened, or are these his thoughts? Are not my words good to him that walketh uprightly?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et e contrario populus meus in adversarium consurrexit desuper tunica pallium sustulistis eos qui transiebant simpliciter convertistis in bellum"
      en: "But my people, on the contrary, are risen up as an enemy: you have taken away the cloak off from the coat: and them that passed harmless you have turned to war."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "mulieres populi mei eiecistis de domo deliciarum suarum a parvulis earum tulistis laudem meam in perpetuum"
      en: "You have cast out the women of my people from their houses, in which they took delight: you have taken my praise for ever from their children."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "surgite et ite quia non habetis hic requiem propter inmunditiam eius corrumpetur putredine pessima"
      en: "Arise ye, and depart, for there is no rest here for you. For that uncleanness of the land, it shall be corrupted with a grievous corruption."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "utinam non essem vir habens spiritum et mendacium potius loquerer stillabo tibi in vinum et in ebrietatem et erit super quem stillatur populus iste"
      en: "Would God I were not a man that hath the spirit, and that I rather spoke a lie: I will let drop to thee of wine, and of drunkenness: and it shall be this people upon whom it shall drop."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "congregatione congregabo Iacob totum te in unum conducam reliquias Israhel pariter ponam illum quasi gregem in ovili quasi pecus in medio caularum tumultuabuntur a multitudine hominum"
      en: "I will assemble and gather together all of thee, O Jacob: I will bring together the remnant of Israel, I will put them together as a flock in the fold, as the sheep in the midst of the sheepcotes, they shall make a tumult by reason of the multitude of men."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ascendet enim pandens iter ante eos divident et transibunt portam et egredientur per eam et transibit rex eorum coram eis et Dominus in capite eorum"
      en: "For he shall go up that shall open the way before them: they shall divide, and pass through the gate, and shall come in by it: and their king shall pass before them, and the Lord at the head of them."
    status: { la: verified, en: verified }
