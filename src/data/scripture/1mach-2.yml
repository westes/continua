# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1mach
chapter: 2
verses:
  - n: 1
    text:
      la: "In diebus illis surrexit Mathathias filius Joannis filii Simeonis, sacerdos ex filiis Joarib, ab Jerusalem, et consedit in monte Modin:"
      en: "In those days arose Mathathias the son of John, the son of Simeon, a priest of the sons of Joarib, from Jerusalem, and he abode in the mountain of Modin."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et habebat filios quinque, Joannem, qui cognominabatur Gaddis:"
      en: "And he had five sons: John who was surnamed Gaddis:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et Simonem, qui cognominabatur Thasi:"
      en: "And Simon, who was surnamed Thasi:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et Judam, qui vocabatur Machabaeus:"
      en: "And Judas, who was called Machabeus:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et Eleazarum, qui cognominabatur Abaron: et Jonathan, qui cognominabatur Apphus:"
      en: "And Eleazar, who was surnamed Abaron: and Jonathan, who was surnamed Apphus."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "hi viderunt mala, quae fiebant in populo Juda, et in Jerusalem."
      en: "These saw the evils that were done in the people of Juda, and in Jerusalem."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et dixit Mathathias: Vae mihi! ut quid natus sum videre contritionem populi mei, et contritionem civitatis sanctae, et sedere illic, cum datur in manibus inimicorum?"
      en: "And Mathathias said: Woe is me, wherefore was I born to see the ruin of my people, and the ruin of the holy city, and to dwell there, when it is given into the hands of the enemies?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sancta in manu extraneorum facta sunt: templum ejus sicut homo ignobilis."
      en: "The holy places are come into the hands of strangers: her temple is become as a man without honour."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Vasa gloriae ejus captiva abducta sunt: trucidati sunt senes ejus in plateis, et juvenes ejus ceciderunt in gladio inimicorum."
      en: "The vessels of her glory are carried away captive: her old men are murdered in the streets, and her young men are fallen by the sword of the enemies."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quae gens non haereditavit regnum ejus et non obtinuit spolia ejus?"
      en: "What nation hath not inherited her kingdom, and gotten of her spoils?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Omnis compositio ejus ablata est. Quae erat libera, facta est ancilla."
      en: "All her ornaments are taken away. She that was free is made a slave."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et ecce sancta nostra, et pulchritudo nostra, et claritas nostra desolata est, et coinquinaverunt ea gentes."
      en: "And behold our sanctuary, and our beauty, and our glory is laid waste, and the Gentiles have defiled them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quo ergo nobis adhuc vivere?"
      en: "To what end then should we live any longer?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et scidit vestimenta sua Mathathias, et filii ejus: et operuerunt se ciliciis, et planxerunt valde."
      en: "And Mathathias and his sons rent their garments, and they covered themselves with haircloth, and made great lamentation."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et venerunt illuc qui missi erant a rege Antiocho, ut cogerent eos, qui confugerant in civitatem Modin, immolare, et accendere thura, et a lege Dei discedere."
      en: "And they that were sent from king Antiochus came thither, to compel them that were fled into the city of Modin, to sacrifice, and to burn incense, and to depart from the law of God."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et multi de populo Israel consentientes accesserunt ad eos: sed Mathathias et filii ejus constanter steterunt."
      en: "And many of the people of Israel consented, and came to them: but Mathathias and his sons stood firm."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et respondentes qui missi erant ab Antiocho, dixerunt Mathathiae: Princeps, et clarissimus et magnus es in hac civitate, et ornatus filiis et fratribus:"
      en: "And they that were sent from Antiochus, answering, said to Mathathias: Thou art a ruler, and an honourable, and great man in this city, and adorned with sons, and brethren."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ergo accede prior, et fac jussum regis, sicut fecerunt omnes gentes, et viri Juda, et qui remanserunt in Jerusalem: et eris tu, et filii tui, inter amicos regis, et amplificatus auro, et argento, et muneribus multis."
      en: "Therefore come thou first, and obey the king's commandment, as all nations have done, and the men of Juda, and they that remain in Jerusalem: and thou, and thy sons, shall be in the number of the king's friends, and enriched with gold, and silver, and many presents."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et respondit Mathathias, et dixit magna voce: Etsi omnes gentes regi Antiocho obediunt, ut discedat unusquisque a servitute legis patrum suorum, et consentiat mandatis ejus:"
      en: "Then Mathathias answered, and said with a loud voice: Although all nations obey king Antiochus, so as to depart every man from the service of the law of his fathers, and consent to his commandments:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ego et filii mei, et fratres mei, obediemus legi patrum nostrorum:"
      en: "I and my sons, and my brethren will obey the law of our fathers."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "propitius sit nobis Deus: non est nobis utile relinquere legem, et justitias Dei:"
      en: "God be merciful unto us: it is not profitable for us to forsake the law, and the justices of God:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "non audiemus verba regis Antiochi, nec sacrificabimus transgredientes legis nostrae mandata, ut eamus altera via."
      en: "We will not hearken to the words of king Antiochus, neither will we sacrifice, and transgress the commandments of our law, to go another way."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et ut cessavit loqui verba haec, accessit quidam Judaeus in omnium oculis sacrificare idolis super aram in civitate Modin, secundum jussum regis:"
      en: "Now as he left off speaking these words, there came a certain Jew in the sight of all to sacrifice to the idols upon the altar in the city of Modin, according to the king's commandment."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et vidit Mathathias, et doluit, et contremuerunt renes ejus, et accensus est furor ejus secundum judicium legis, et insiliens trucidavit eum super aram:"
      en: "And Mathathias saw and was grieved, and his reins trembled, and his wrath was kindled according to the judgment of the law, and running upon him he slew him upon the altar:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "sed et virum, quem rex Antiochus miserat, qui cogebat immolare, occidit in ipso tempore, et aram destruxit:"
      en: "Moreover the man whom king Antiochus had sent, who compelled them to sacrifice, he slew at the same time, and pulled down the altar."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et zelatus est legem, sicut fecit Phinees Zamri filio Salomi."
      en: "And shewed zeal for the law, as Phinees did by Zamri the son of Salomi."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et exclamavit Mathathias voce magna in civitate, dicens: Omnis qui zelum habet legis, statuens testamentum, exeat post me."
      en: "And Mathathias cried out in the city with a loud voice, saying: Every one that hath zeal for the law, and maintaineth the testament, let him follow me."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et fugit ipse, et filii ejus in montes, et reliquerunt quaecumque habebant in civitate."
      en: "So he, and his sons fled into the mountains, and left all that they had in the city."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Tunc descenderunt multi quaerentes judicium, et justitiam, in desertum:"
      en: "Then many that sought after judgment, and justice, went down into the desert:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et sederunt ibi ipsi, et filii eorum, et mulieres eorum, et pecora eorum: quoniam inundaverunt super eos mala."
      en: "And they abode there, they and their children, and their wives, and their cattle: because afflictions increased upon them."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et renuntiatum est viris regis, et exercitui qui erat in Jerusalem civitate David, quoniam discessissent viri quidam, qui dissipaverunt mandatum regis, in loca occulta in deserto, et abiissent post illos multi."
      en: "And it was told to the king's men, and to the army that was in Jerusalem in the city of David, that certain men who had broken the king's commandment, were gone away into the secret places in the wilderness, and that many were gone after them."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et statim perrexerunt ad eos, et constituerunt adversus eos praelium in die sabbatorum,"
      en: "And forthwith they went out towards them, and made war against them on the sabbath day,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et dixerunt ad eos: Resistitis et nunc adhuc? exite, et facite secundum verbum regis Antiochi, et vivetis."
      en: "And they said to them: Do you still resist? come forth, and do according to the edict of king Antiochus, and you shall live."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et dixerunt: Non exibimus, neque faciemus verbum regis, ut polluamus diem sabbatorum."
      en: "And they said: We will not come forth, neither will we obey the king's edict, to profane the sabbath day."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et concitaverunt adversus eos praelium."
      en: "And they made haste to give them battle."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et non responderunt eis, nec lapidem miserunt in eos, nec oppilaverunt loca occulta,"
      en: "But they answered them not, neither did they cast a stone at them, nor stopped up the secret places,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "dicentes: Moriamur omnes in simplicitate nostra: et testes erunt super nos caelum et terra, quod injuste perditis nos."
      en: "Saying: Let us all die in our innocency: and heaven and earth shall be witnesses for us, that you put us to death wrongfully."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et intulerunt illis bellum sabbatis: et mortui sunt ipsi, et uxores eorum, et filii eorum, et pecora eorum usque ad mille animas hominum."
      en: "So they gave them battle on the sabbath: and they were slain with their wives, and their children, and their cattle, to the number of a thousand persons."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et cognovit Mathathias et amici ejus, et luctum habuerunt super eos valde."
      en: "And Mathathias and his friends heard of it, and they mourned for them exceedingly."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et dixit vir proximo suo: Si omnes fecerimus sicut fratres nostri fecerunt, et non pugnaverimus adversus gentes pro animabus nostris et justificationibus nostris, nunc citius disperdent nos a terra."
      en: "And every man said to his neighbour: If we shall all do as our brethren have done, and not fight against the heathens for our lives, and our justifications: they will now quickly root us out of the earth."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et cogitaverunt in die illa, dicentes: Omnis homo, quicumque venerit ad nos in bello die sabbatorum, pugnemus adversus eum: et non moriemur omnes, sicut mortui sunt fratres nostri in occultis."
      en: "And they determined in that day, saying: Whosoever shall come up against us to fight on the sabbath day, we will fight against him: and we will not all die, as our brethren that were slain in the secret places."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Tunc congregata est ad eos synagoga Assidaeorum fortis viribus ex Israel, omnis voluntarius in lege:"
      en: "Then was assembled to them the congregation of the Assideans, the stoutest of Israel, every one that had a good will for the law."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et omnes, qui fugiebant a malis, additi sunt ad eos, et facti sunt illis ad firmamentum."
      en: "And all they that fled from the evils, joined themselves to them, and were a support to them."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Et collegerunt exercitum, et percusserunt peccatores in ira sua, et viros iniquos in indignatione sua: et ceteri fugerunt ad nationes, ut evaderent."
      en: "And they gathered an army, and slew the sinners in their wrath, and the wicked men in their indignation: and the rest fled to the nations for safety."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Et circuivit Mathathias et amici ejus, et destruxerunt aras:"
      en: "And Mathathias and his friends went round about, and they threw down the altars:"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et circumciderunt pueros incircumcisos quotquot invenerunt in finibus Israel: et in fortitudine."
      en: "And they circumcised all the children whom they found in the confines of Israel that were uncircumcised: and they did valiantly."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Et persecuti sunt filios superbiae, et prosperatum est opus in manibus eorum:"
      en: "And they pursued after the children of pride, and the work prospered in their hands:"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et obtinuerunt legem de manibus gentium, et de manibus regum, et non dederant cornu peccatori."
      en: "And they recovered the law out of the hands of the nations, and out of the hands of the kings: and they yielded not the horn to the sinner."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Et appropinquaverunt dies Mathathiae moriendi, et dixit filiis suis: Nunc confortata est superbia, et castigatio, et tempus eversionis, et ira indignationis."
      en: "Now the days drew near that Mathathias should die, and he said to his sons: Now hath pride and chastisement gotten strength, and the time of destruction, and the wrath of indignation:"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Nunc ergo, o filii, aemulatores estote legis, et date animas vestras pro testamento patrum vestrorum,"
      en: "Now therefore, O my sons, be ye zealous for the law, and give your lives for the covenant of your fathers."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "et mementote operum patrum, quae fecerunt in generationibus suis: et accipietis gloriam magnam, et nomen aeternum."
      en: "And call to remembrance the works of the fathers, which they have done in their generations: and you shall receive great glory, and an everlasting name."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Abraham nonne in tentatione inventus est fidelis, et reputatum est ei ad justitiam?"
      en: "Was not Abraham found faithful in temptation, and it was reputed to him unto justice?"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Joseph in tempore angustiae suae custodivit mandatum, et factus est dominus Aegypti."
      en: "Joseph in the time of his distress kept the commandment, and he was made lord of Egypt."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Phinees pater noster, zelando zelum Dei, accepit testamentum sacerdotii aeterni."
      en: "Phinees our father, by being fervent in the zeal of God, received the covenant of an everlasting priesthood."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Jesus dum implevit verbum, factus est dux in Israel."
      en: "Jesus, whilst he fulfilled the word, was made ruler in Israel."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Caleb dum testificatur in ecclesia, accepit haereditatem."
      en: "Caleb, for bearing witness before the congregation, received an inheritance."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "David in sua misericordia consecutus est sedem regni in saecula."
      en: "David by his mercy obtained the throne of an everlasting kingdom."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Elias, dum zelat zelum legis, receptus est in caelum."
      en: "Elias, while he was full of zeal for the law, was taken up into heaven."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Ananias et Azarias et Misael credentes, liberati sunt de flamma."
      en: "Ananias and Azarias and Misael by believing, were delivered out of the flame."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "Daniel in sua simplicitate liberatus est de ore leonum."
      en: "Daniel in his innocency was delivered out of the mouth of the lions."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "Et ita cogitate per generationem et generationem: quia omnes qui sperant in eum, non infirmantur."
      en: "And thus consider through all generations: that none that trust in him fail in strength."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "Et a verbis viri peccatoris ne timueritis, quia gloria ejus stercus et vermis est:"
      en: "And fear not the words of a sinful man, for his glory is dung, and worms:"
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "hodie extollitur, et cras non invenietur: quia conversus est in terram suam, et cogitatio ejus periit."
      en: "Today he is lifted up, and tomorrow he shall not be found, because he is returned into his earth; and his thought is come to nothing."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "Vos ergo filii, confortamini, et viriliter agite in lege: quia in ipsa gloriosi eritis."
      en: "You therefore, my sons, take courage, and behave manfully in the law: for by it you shall be glorious."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "Et ecce Simon frater vester, scio quod vir consilii est: ipsum audite semper, et ipse erit vobis pater."
      en: "And behold, I know that your brother Simon is a man of counsel: give ear to him always, and he shall be a father to you."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "Et Judas Machabaeus, fortis viribus a juventute sua, sit vobis princeps militiae, et ipse aget bellum populi."
      en: "And Judas Machabeus who is valiant and strong from his youth up, let him be the leader of your army, and he shall manage the war of the people."
    status: { la: verified, en: verified }
  - n: 67
    text:
      la: "Et adducetis ad vos omnes factores legis: et vindicate vindictam populi vestri."
      en: "And you shall take to you all that observe the law: and revenge ye the wrong of your people."
    status: { la: verified, en: verified }
  - n: 68
    text:
      la: "Retribuite retributionem gentibus, et intendite in praeceptum legis."
      en: "Render to the Gentiles their reward, and take heed to the precepts of the law."
    status: { la: verified, en: verified }
  - n: 69
    text:
      la: "Et benedixit eos, et appositus est ad patres suos."
      en: "And he blessed them, and was joined to his fathers."
    status: { la: verified, en: verified }
  - n: 70
    text:
      la: "Et defunctus est anno centesimo et quadragesimo sexto: et sepultus est a filiis suis in sepulchris patrum suorum in Modin, et planxerunt eum omnis Israel planctu magno."
      en: "And he died in the hundred and forty-sixth year: and he was buried by his sons in the sepulchres of his fathers in Modin, and all Israel mourned for him with great mourning."
    status: { la: verified, en: verified }
