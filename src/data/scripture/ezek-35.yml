book: ezek
chapter: 35
verses:
  - n: 1
    text:
      la: "et factus est sermo Domini ad me dicens"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fili hominis pone faciem tuam adversum montem Seir et prophetabis de eo et dices illi"
      en: "Son of man, set thy face against mount Seir, and prophesy concerning it, and say to it:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "haec dicit Dominus Deus ecce ego ad te mons Seir et extendam manum meam super te et dabo te desolatum atque desertum"
      en: "Thus saith the Lord God: Behold I come against thee, mount Seir, and I will stretch forth my hand upon thee, and I will make thee desolate and waste."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "urbes tuas demoliar et tu desertus eris et scies quia ego Dominus"
      en: "I will destroy thy cities, and thou shalt be desolate: and thou shalt know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "eo quod fueris inimicus sempiternus et concluseris filios Israhel in manus gladii in tempore adflictionis eorum in tempore iniquitatis extremae"
      en: "Because thou hast been an everlasting enemy, and hast shut up the children of Israel in the hands of the sword in the time of their affliction, in the time of their last iniquity."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "propterea vivo ego dicit Dominus Deus quoniam sanguini tradam te et sanguis te persequetur et cum sanguinem oderis sanguis persequetur te"
      en: "Therefore as I live, saith the Lord God, I will deliver thee up to blood, and blood shall pursue thee: and whereas thou hast hated blood, blood shall pursue thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et dabo montem Seir desolatum et desertum et auferam de eo euntem et redeuntem"
      en: "And I will make mount Seir waste and desolate: and I will take away from it him that goeth and him that returneth."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et implebo montes eius occisorum suorum in collibus tuis et in vallibus tuis atque in torrentibus interfecti gladio cadent"
      en: "And I will fill his mountains with his men that are slain: in thy hills, and in thy valleys, and in thy torrents they shall fall that are slain with the sword."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "in solitudines sempiternas tradam te et civitates tuae non habitabuntur et scietis quoniam ego Dominus"
      en: "I will make thee everlasting desolations, and thy cities shall not be inhabited: and thou shalt know that I am the Lord God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "eo quod dixeris duae gentes et duae terrae meae erunt et hereditate possidebo eas cum Dominus esset ibi"
      en: "Because thou hast said: The two nations, and the two lands shall be mine, and I will possess them by inheritance: whereas the Lord was there."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "propterea vivo ego dicit Dominus Deus quia faciam iuxta iram tuam et secundum zelum tuum quem fecisti odio habens eos et notus efficiar per eos cum te iudicavero"
      en: "Therefore as I live, saith the Lord God, I will do according to thy wrath, and according to thy envy, which thou hast exercised in hatred to them: and I will be made known by them, when I shall have judged thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et scies quia ego Dominus audivi universa obprobria tua quae locutus es de montibus Israhel dicens deserti nobis dati sunt ad devorandum"
      en: "And thou shalt know that I the Lord have heard all thy reproaches, that thou hast spoken against the mountains of Israel, saying: They are desolate, they are given to us to consume."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et insurrexistis super me ore vestro et rogastis adversum me verba vestra ego audivi"
      en: "And you rose up against me with your mouth, and have derogated from me by your words: I have heard them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "haec dicit Dominus Deus laetante universa terra in solitudinem te redigam"
      en: "Thus saith the Lord God: When the whole earth shall rejoice, I will make thee a wilderness."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sicuti gavisus es super hereditatem domus Israhel eo quod fuerit dissipata sic faciam tibi dissipatus eris mons Seir et Idumea omnis et scient quia ego Dominus"
      en: "As thou best rejoiced over the inheritance of the house of Israel, because it was laid waste, so will I do to thee: thou shalt be laid waste, O mount Seir, and all Idumea: and they shall know that I am the Lord."
    status: { la: verified, en: verified }
