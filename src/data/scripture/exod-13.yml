# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 13
verses:
  - n: 1
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Sanctifica mihi omne primogenitum quod aperit vulvam in filiis Israel, tam de hominibus quam de jumentis: mea sunt enim omnia."
      en: "Sanctify unto me every firstborn that openeth the womb among the children of Israel, as well of men as of beasts: for they are all mine."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et ait Moyses ad populum: Mementote diei hujus in qua egressi estis de Aegypto et de domo servitutis, quoniam in manu forti eduxit vos Dominus de loco isto: ut non comedatis fermentatum panem."
      en: "And Moses said to the people: Remember this day in which you came forth out of Egypt, and out of the house of bondage, for with a strong hand hath the Lord brought you forth out of this place: that you eat no leavened bread."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Hodie egredimini mense novarum frugum."
      en: "This day you go forth in the month of new corn."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cumque introduxerit te Dominus in terram Chananaei, et Hethaei, et Amorrhaei, et Hevaei, et Jebusaei, quam juravit patribus tuis ut daret tibi, terram fluentem lacte et melle, celebrabis hunc morem sacrorum mense isto."
      en: "And when the Lord shall have brought thee into the land of the Chanaanite, and the Hethite, and the Amorrhite, and the Hevite, and the Jebusite, which he swore to thy fathers that he would give thee, a land that floweth with milk and honey, thou shalt celebrate this manner of sacred rites in this month."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Septem diebus vesceris azymis: et in die septimo erit solemnitas Domini."
      en: "Seven days shalt thou eat unleavened bread: and on the seventh day shall be the solemnity of the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Azyma comedetis septem diebus: non apparebit apud te aliquid fermentatum, nec in cunctis finibus tuis."
      en: "Unleavened bread shall you eat seven days: there shall not be seen any thing leavened with thee, nor in all thy coasts."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Narrabisque filio tuo in die illo, dicens: Hoc est quod fecit mihi Dominus quando egressus sum de Aegypto."
      en: "And thou shalt tell thy son in that day, saying: This is what the Lord did to me when I came forth out of Egypt."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et erit quasi signum in manu tua, et quasi monimentum ante oculos tuos: et ut lex Domini semper sit in ore tuo, in manu enim forti eduxit te Dominus de Aegypto."
      en: "And it shall be as a sign in thy hand, and as a memorial before thy eyes: and that the law of the Lord be always in thy mouth, for with a strong hand the Lord hath brought thee out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Custodies hujuscemodi cultum statuto tempore a diebus in dies."
      en: "Thou shalt keep this observance at the set time from days to days."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cumque introduxerit te Dominus in terram Chananaei, sicut juravit tibi et patribus tuis, et dederit tibi eam:"
      en: "And when the Lord shall have brought thee into the land of the Chanaanite, as he swore to thee and thy fathers, and shall give it thee:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "separabis omne quod aperit vulvam Domino, et quod primitivum est in pecoribus tuis: quidquid habueris masculini sexus, consecrabis Domino."
      en: "Thou shalt set apart all that openeth the womb for the Lord, and all that is first brought forth of thy cattle: whatsoever thou shalt have of the male sex, thou shalt consecrate to the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Primogenitum asini mutabis ove: quod si non redemeris, interficies. Omne autem primogenitum hominis de filiis tuis, pretio redimes."
      en: "The firstborn of an ass thou shalt change for a sheep: and if thou do not redeem it, thou shalt kill it. And every firstborn of men thou shalt redeem with a price."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cumque interrogaverit te filius tuus cras, dicens: Quid est hoc? respondebis ei: In manu forti eduxit nos Dominus de terra Aegypti, de domo servitutis."
      en: "And when thy son shall ask thee tomorrow, saying: What is this? thou shalt answer him: With a strong hand did the Lord bring us forth out of the land of Egypt, out of the house of bondage."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Nam cum induratus esset Pharao, et nollet nos dimittere, occidit Dominus omne primogenitum in terra Aegypti, a primogenito hominis usque ad primogenitum jumentorum: idcirco immolo Domino omne quod aperit vulvam masculini sexus, et omnia primogenita filiorum meorum redimo."
      en: "For when Pharao was hardened, and would not let us go, the Lord slew every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beasts: therefore I sacrifice to the Lord all that openeth the womb of the male sex, and all the firstborn of my sons I redeem."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Erit igitur quasi signum in manu tua, et quasi appensum quid, ob recordationem, inter oculos tuos: eo quod in manu forti eduxit nos Dominus de Aegypto."
      en: "And it shall be as a sign in thy hand, and as a thing hung between thy eyes, for a remembrance: because the Lord hath brought us forth out of Egypt by a strong hand."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Igitur cum emisisset Pharao populum, non eos duxit Deus per viam terrae Philisthiim quae vicina est: reputans ne forte poeniteret eum, si vidisset adversum se bella consurgere, et reverteretur in Aegyptum."
      en: "And when Pharao had sent out the people, the Lord led them not by the way of the land of the Philistines which is near: thinking lest perhaps they would repent, if they should see wars arise against them, and would return into Egypt."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Sed circumduxit per viam deserti, quae est juxta mare Rubrum: et armati ascenderunt filii Israel de terra Aegypti."
      en: "But he led them about by the way of the desert, which is by the Red Sea: and the children of Israel went up armed out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Tulit quoque Moyses ossa Joseph secum: eo quod adjurasset filios Israel, dicens: Visitabit vos Deus; efferte ossa mea hinc vobiscum."
      en: "And Moses took Joseph's bones with him: because he had adjured the children of Israel, saying: God shall visit you, carry out my bones from hence with you."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Profectique de Socoth castrametati sunt in Etham, in extremis finibus solitudinis."
      en: "And marching from Socoth they encamped in Etham in the utmost coasts of the wilderness."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dominus autem praecedebat eos ad ostendendam viam per diem in columna nubis, et per noctem in columna ignis: ut dux esset itineris utroque tempore."
      en: "And the Lord went before them to shew the way by day in a pillar of a cloud, and by night in a pillar of fire: that he might be the guide of their journey at both times."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Numquam defuit columna nubis per diem, nec columna ignis per noctem, coram populo."
      en: "There never failed the pillar of the cloud by day, nor the pillar of fire by night, before the people."
    status: { la: verified, en: verified }
