# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: tob
chapter: 9
verses:
  - n: 1
    text:
      la: "tunc vocavit ad se Tobias angelum quem quidem hominem aestimabat et dixit ei Azarias frater peto ut auscultes verba mea"
      en: "Then Tobias called the angel to him, whom he took to be a man, and said to him: Brother Azarias, I pray thee hearken to my words:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "si me ipsum tradam tibi servum non ero condignus providentiae tuae"
      en: "If I should give myself to be thy servant I should not make a worthy return for thy care."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "tamen obsecro ut adsumas tibi animalia sive servitia et vadas ad Gabelum in Rages Medorum reddasque ei chirografum suum et recipias ab eo pecuniam et roges eum venire ad nuptias meas"
      en: "However, I beseech thee, to take with thee beasts and servants, and to go to Gabelus to Rages the city of the Medes: and to restore to him his note of hand, and receive of him the money, and desire him to come to my wedding."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "scis enim ipse quoniam numerat dies pater meus et si tardavero una die plus contristatur anima eius"
      en: "For thou knowest that my father numbereth the days: and if I stay one day more, his soul will be afflicted."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et certe vides quomodo Raguhel coniuraverit me cuius adiuramentum spernere non possum"
      en: "And indeed thou seest how Raguel hath adjured me, whose adjuring I cannot despise."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "tunc Rafahel adsumens quattuor ex servis Raguhelis et duos camelos in Rages Medorum perrexit et inveniens Gabelum dedit ei chirografum suum et recepit omnem pecuniam"
      en: "Then Raphael took four of Raguel's servants, and two camels, and went to Rages the city of the Medes: and finding Gabelus, gave him his note of hand, and received of him all the money."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "indicavitque ei de Tobia filio Tobiae omnia quae gesta sunt fecitque eum secum venire ad nuptias"
      en: "And he told him concerning Tobias the son of Tobias, all that had been done: and made him come with him to the wedding."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cumque ingressus esset domum Raguhelis invenit Tobiam discumbentem et exiliens osculati sunt se alterutrum flevit itaque Gabelus et benedixit Deum"
      en: "And when he was come into Raguel's house he found Tobias sitting at the table: and he leaped up, and they kissed each other: and Gabelus wept, and blessed God,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dixit benedicat te Dominus Deus Israhel quia filius es viri optimi et iusti et timentis Deum et elemosynas facientis"
      en: "And said: The God of Israel bless thee, because thou art the son of a very good and just man, and that feareth God, and doth almsdeeds:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et dicatur benedictio super uxorem tuam et super parentes vestros"
      en: "And may a blessing come upon thy wife and upon your parents."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et videatis filios vestros et filios filiorum vestrorum usque in tertiam et quartam generationem et sit semen vestrum benedictum a Deo Israhel qui regnat in saecula saeculorum"
      en: "And may you see your children, and your children's children, unto the third and fourth generation: and may your seed be blessed by the God of Israel, who reigneth for ever and ever."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cumque omnes dixissent amen accesserunt ad convivium sed et cum timore Domini nuptiarum convivium exercebant"
      en: "And when all had said, Amen, they went to the feast: but the marriage feast they celebrated also with the fear of the Lord."
    status: { la: verified, en: verified }
