book: ezek
chapter: 45
verses:
  - n: 1
    text:
      la: "cumque coeperitis terram dividere sortito separate primitias Domino sanctificatum de terra longitudine viginti quinque milia et latitudine decem milia sanctificatum erit in omni termino eius per circuitum"
      en: "And when you shall begin to divide the land by lot, separate ye firstfruits to the Lord, a portion of the land to be holy, in length twenty-five thousand and in breadth ten thousand: it shall be holy in all the borders thereof round about."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et erit ex omni parte sanctificatum quingentos per quingentos quadrifariam per circuitum et quinquaginta cubitis in suburbana eius per gyrum"
      en: "And there shall be for the sanctuary on every side five hundred by five hundred, foursquare round about: and fifty cubits for the suburbs thereof round about."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et a mensura ista mensurabis longitudinem viginti quinque milium et latitudinem decem milium et in ipso erit templum sanctumque sanctorum"
      en: "And with this measure thou shalt measure the length of five and twenty thousand, and the breadth of ten thousand, and in it shall be the temple and the holy of holies."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sanctificatum de terra erit sacerdotibus ministris sanctuarii qui accedunt ad ministerium Domini et erit eis locus in domos et in sanctuarium sanctitatis"
      en: "The holy portion of the land shall be for the priests the ministers of the sanctuary, who come near to the ministry of the Lord: and it shall be a place for their houses, and for the holy place of the sanctuary."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "viginti quinque autem milia longitudinis et decem milia latitudinis erunt Levitis qui ministrant domui ipsi possidebunt viginti gazofilacia"
      en: "And five and twenty thousand of length, and ten thousand of breadth shall be for the Levites, that minister in the house: they shall possess twenty store chambers."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et possessionem civitatis dabitis quinque milia latitudinis et longitudinis viginti quinque milia secundum separationem sanctuarii omni domui Israhel"
      en: "And you shall appoint the possession of the city five thousand broad, and five and twenty thousand long, according to the separation of the sanctuary, for the whole house of Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "principi quoque hinc et inde in separationem sanctuarii et in possessionem civitatis contra faciem separationis sanctuarii et contra faciem possessionis urbis a latere maris usque ad mare et a latere orientis usque ad orientem longitudinem autem iuxta unamquamque partium a termino occidentali usque ad terminum orientalem"
      en: "For the prince also on the one side and on the other side, according to the separation of the sanctuary, and according to the possession of the city, over against the separation of the sanctuary, and over against the possession of the city: from the side of the sea even to the sea, and from the side of the east; even to the east. And the length according to every part from the west border to the east border."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "de terra erit ei possessio in Israhel et non depopulabuntur ultra principes populum meum sed terram dabunt domui Israhel secundum tribus eorum"
      en: "He shall have a portion of the lead in Israel: and the princes shall no more rob my people: but they shall give the land to the house of Israel according to their tribes:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "haec dicit Dominus Deus sufficiat vobis principes Israhel iniquitatem et rapinas intermittite et iudicium et iustitiam facite separate confinia vestra a populo meo ait Dominus Deus"
      en: "Thus saith the Lord God: Let it suffice you, O princes of Israel: cease from iniquity and robberies, and execute judgment and justice, separate your confines from my people, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "statera iusta et oephi iustum et batus iustus erit vobis"
      en: "You shall have just balances, and a just ephi, and a just bate."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "oephi et batus aequalia et unius mensurae erunt ut capiat decimam partem chori batus et decimam partem chori oephi iuxta mensuram chori erit aequa libratio eorum"
      en: "The ephi and the bate shall be equal, and of one measure: that the bate may contain the tenth part of a core, and the ephi the tenth part of a core: their weight shall be equal according to the measure of a core."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "siclus autem viginti obolos habeat porro viginti sicli et viginti quinque sicli et quindecim sicli minam facient"
      en: "And the sicle hath twenty obols. Now twenty sides, and five and twenty sides, and fifteen sides make a mna."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et haec sunt primitiae quas tolletis sextam partem oephi de choro frumenti et sextam partem oephi de choro hordei"
      en: "And these are the firstfruits, which you shall take: the sixth part of an ephi of a core of wheat, and the sixth part of an ephi of a core of barley."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "mensura quoque olei batus olei decima pars chori est et decem bati chorum faciunt quia decem bati implent chorum"
      en: "The measure of oil also, a bate of oil is the tenth part of a core: and ten bates make a core: for ten bates fill a core."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et arietem unum de grege ducentorum de his quae nutriunt Israhel in sacrificium et in holocaustum et in pacifica ad expiandum pro eis ait Dominus Deus"
      en: "And one ram out of a flock of two hundred, of those that Israel feedeth for sacrifice, and for holocausts, and for peace offerings, to make atonement for them, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "omnis populus terrae tenebitur primitiis his principi in Israhel"
      en: "All the people of the land shall be bound to these firstfruits for the prince in Israel."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et super principem erunt holocausta et sacrificium et libamina in sollemnitatibus et in kalendis et in sabbatis in universis sollemnitatibus domus Israhel ipse faciat pro peccato sacrificium et holocaustum et pacifica ad expiandum pro domo Israhel"
      en: "And the prince shall give the holocaust, and the sacrifice, and the libations on the feasts, and on the new moons, and on the sabbaths, and on all the solemnities of the house of Israel: he shall offer the sacrifice for sin, and the holocaust, and the peace offerings to make expiation for the house of Israel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "haec dicit Dominus Deus in primo mense una mensis sumes vitulum de armento inmaculatum et expiabis sanctuarium"
      en: "Thus saith the Lord God: In the first month, the first of the month, thou shalt take a calf of the herd without blemish, and thou shalt expiate the sanctuary."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et tollet sacerdos de sanguine quod erit pro peccato et ponet in postibus domus et in quattuor angulis crepidinis altaris et in postibus portae atrii interioris"
      en: "And the priest shall take of the blood of the sin offering : and he shall put it on the posts of the house, and on the four corners of the brim of the altar, and on the posts of the gate of the inner court."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et sic facies in septima mensis pro unoquoque qui ignoravit et errore deceptus est et expiabitis pro domo"
      en: "And so shalt thou do in the seventh day of the month, for every one that hath been ignorant, and hath been deceived by error, and thou shalt make expiation for the house."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "in primo mense quartadecima die mensis erit vobis paschae sollemnitas septem diebus azyma comedentur"
      en: "In the first month, the fourteenth day of the month, you shall observe the solemnity of the pasch: seven days unleavened bread shall be eaten."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et faciet princeps in die illa pro se et pro universo populo terrae vitulum pro peccato"
      en: "And the prince on that day shall offer for himself, and for all the people of the land, a calf for sin."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et in septem dierum sollemnitate faciet holocaustum Domino septem vitulos et septem arietes inmaculatos cotidie septem diebus et pro peccato hircum caprarum cotidie"
      en: "And in the solemnity of the seven days he shall offer for a holocaust to the Lord, seven calves, and seven rams without blemish daily for seven days: and for sin a he goat daily."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et sacrificium oephi per vitulum et oephi per arietem faciet et olei hin per singula oephi"
      en: "And he shall offer the sacrifice of an ephi for every calf, and an ephi for every ram: and a hin of oil for every ephi."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "septimo mense quintadecima die mensis in sollemnitate faciet sicut supra dicta sunt per septem dies tam pro peccato quam pro holocausto et in sacrificio et in oleo"
      en: "In the seventh month, in the fifteenth day of the month, in the solemn feast, he shall do the like for the seven days: as well in regard to the sin offering, as to the holocaust, and. the sacrifice, and the"
    status: { la: verified, en: verified }
