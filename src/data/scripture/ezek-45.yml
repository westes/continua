# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 45
verses:
  - n: 1
    text:
      la: "Cumque coeperitis terram dividere sortito, separate primitias Domino, sanctificatum de terra, longitudine viginti quinque millia, et latitudine decem millia: sanctificatum erit in omni termino ejus per circuitum."
      en: "And when you shall begin to divide the land by lot, separate ye firstfruits to the Lord, a portion of the land to be holy, in length twenty-five thousand and in breadth ten thousand: it shall be holy in all the borders thereof round about."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et erit ex omni parte sanctificatum quingentos per quingentos, quadrifariam per circuitum, et quinquaginta cubitis in suburbana ejus per gyrum."
      en: "And there shall be for the sanctuary on every side five hundred by five hundred, foursquare round about: and fifty cubits for the suburbs thereof round about."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et a mensura ista mensurabis longitudinem viginti quinque millium, et latitudinem decem millium: et in ipso erit templum Sanctumque sanctorum."
      en: "And with this measure thou shalt measure the length of five and twenty thousand, and the breadth of ten thousand, and in it shall be the temple and the holy of holies."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Sanctificatum de terra erit sacerdotibus ministris sanctuarii, qui accedunt ad ministerium Domini: et erit eis locus in domos, et in sanctuarium sanctitatis."
      en: "The holy portion of the land shall be for the priests the ministers of the sanctuary, who come near to the ministry of the Lord: and it shall be a place for their houses, and for the holy place of the sanctuary."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Viginti quinque autem millia longitudinis, et decem millia latitudinis erunt Levitis qui ministrant domui: ipsi possidebunt viginti gazophylacia."
      en: "And five and twenty thousand of length, and ten thousand of breadth shall be for the Levites, that minister in the house: they shall possess twenty store chambers."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et possessionem civitatis dabitis quinque millia latitudinis, et longitudinis viginti quinque millia, secundum separationem sanctuarii, omni domui Israel."
      en: "And you shall appoint the possession of the city five thousand broad, and five and twenty thousand long, according to the separation of the sanctuary, for the whole house of Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Principi quoque hinc et inde in separationem sanctuarii, et in possessionem civitatis, contra faciem separationis sanctuarii, et contra faciem possessionis urbis, a latere maris usque ad mare, et a latere orientis usque ad orientem: longitudinis autem juxta unamquamque partem, a termino occidentali usque ad terminum orientalem."
      en: "For the prince also on the one side and on the other side, according to the separation of the sanctuary, and according to the possession of the city, over against the separation of the sanctuary, and over against the possession of the city: from the side of the sea even to the sea, and from the side of the east even to the east. And the length according to every part from the west border to the east border."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "De terra erit ei possessio in Israel, et non depopulabuntur ultra principes populum meum: sed terram dabunt domui Israel secundum tribus eorum."
      en: "He shall have a portion of the land in Israel: and the princes shall no more rob my people: but they shall give the land to the house of Israel according to their tribes:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Haec dicit Dominus Deus: Sufficiat vobis, principes Israel: iniquitatem et rapinas intermittite, et judicium et justitiam facite: separate confinia vestra a populo meo, ait Dominus Deus."
      en: "Thus saith the Lord God: Let it suffice you, O princes of Israel: cease from iniquity and robberies, and execute judgment and justice, separate your confines from my people, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Statera justa, et ephi justum, et batus justus erit vobis."
      en: "You shall have just balances, and a just ephi, and a just bate."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ephi et batus aequalia et unius mensurae erunt, ut capiat decimam partem cori batus, et decimam partem cori ephi: juxta mensuram cori erit aequa libratio eorum."
      en: "The ephi and the bate shall be equal, and of one measure: that the bate may contain the tenth part of a core, and the ephi the tenth part of a core: their weight shall be equal according to the measure of a core."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Siclus autem viginti obolos habet: porro viginti sicli, et viginti quinque sicli, et quindecim sicli, mnam faciunt."
      en: "And the sicle hath twenty obols. Now twenty sicles, and five and twenty sicles, and fifteen sicles make a mna."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et haec sunt primitiae quas tolletis: sextam partem ephi de coro frumenti, et sextam partem ephi de coro hordei."
      en: "And these are the firstfruits, which you shall take: the sixth part of an ephi of a core of wheat, and the sixth part of an ephi of a core of barley."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Mensura quoque olei, batus olei, decima pars cori est: et decem bati corum faciunt, quia decem bati implent corum."
      en: "The measure of oil also, a bate of oil is the tenth part of a core: and ten bates make a core: for ten bates fill a core."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et arietem unum de grege ducentorum, de his quae nutriunt Israel, in sacrificium, et in holocaustum, et in pacifica, ad expiandum pro eis, ait Dominus Deus."
      en: "And one ram out of a flock of two hundred, of those that Israel feedeth for sacrifice, and for holocausts, and for peace offerings, to make atonement for them, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Omnis populus terrae tenebitur primitiis his principi in Israel."
      en: "All the people of the land shall be bound to these firstfruits for the prince in Israel."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et super principem erunt holocausta, et sacrificium, et libamina, in solemnitatibus, et in calendis, et in sabbatis, et in universis solemnitatibus domus Israel: ipse faciet pro peccato sacrificium, et holocaustum, et pacifica, ad expiandum pro domo Israel."
      en: "And the prince shall give the holocaust, and the sacrifice, and the libations on the feasts, and on the new moons, and on the sabbaths, and on all the solemnities of the house of Israel: he shall offer the sacrifice for sin, and the holocaust, and the peace offerings to make expiation for the house of Israel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Haec dicit Dominus Deus: In primo mense, una mensis, sumes vitulum de armento immaculatum, et expiabis sanctuarium."
      en: "Thus saith the Lord God: In the first month, the first of the month, thou shalt take a calf of the herd without blemish, and thou shalt expiate the sanctuary."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et tollet sacerdos de sanguine quod erit pro peccato, et ponet in postibus domus, et in quatuor angulis crepidinis altaris, et in postibus portae atrii interioris."
      en: "And the priest shall take of the blood of the sin offering: and he shall put it on the posts of the house, and on the four corners of the brim of the altar, and on the posts of the gate of the inner court."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et sic facies in septima mensis, pro unoquoque qui ignoravit, et errore deceptus est: et expiabis pro domo."
      en: "And so shalt thou do in the seventh day of the month, for every one that hath been ignorant, and hath been deceived by error, and thou shalt make expiation for the house."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "In primo mense, quartadecima die mensis, erit vobis Paschae solemnitas: septem diebus azyma comedentur."
      en: "In the first month, the fourteenth day of the month, you shall observe the solemnity of the pasch: seven days unleavened bread shall be eaten."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et faciet princeps in die illa, pro se et pro universo populo terrae, vitulum pro peccato."
      en: "And the prince on that day shall offer for himself, and for all the people of the land, a calf for sin."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et in septem dierum solemnitate faciet holocaustum Domino septem vitulos, et septem arietes immaculatos, quotidie septem diebus: et pro peccato hircum caprarum quotidie."
      en: "And in the solemnity of the seven days he shall offer for a holocaust to the Lord, seven calves, and seven rams without blemish daily for seven days: and for sin a he goat daily."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et sacrificium ephi per vitulum, et ephi per arietem faciet, et olei hin per singula ephi."
      en: "And he shall offer the sacrifice of an ephi for every calf, and an ephi for every ram: and a hin of oil for every ephi."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Septimo mense, quintadecima die mensis, in solemnitate, faciet sicut supra dicta sunt per septem dies, tam pro peccato quam pro holocausto, et in sacrificio, et in oleo."
      en: "In the seventh month, in the fifteenth day of the month, in the solemn feast, he shall do the like for the seven days: as well in regard to the sin offering, as to the holocaust, and. the sacrifice, and the oil."
    status: { la: verified, en: verified }
