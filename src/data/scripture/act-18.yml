# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: act
chapter: 18
verses:
  - n: 1
    text:
      la: "Post haec egressus ab Athenis, venit Corinthum:"
      en: "After these things, departing from Athens, he came to Corinth."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et inveniens quemdam Judaeum nomine Aquilam, Ponticum genere, qui nuper venerat ab Italia, et Priscillam uxorem ejus ( eo quod praecepisset Claudius discedere omnes Judaeos a Roma), accessit ad eos."
      en: "And finding a certain Jew, named Aquila, born in Pontus, lately come from Italy, with Priscilla his wife, (because that Claudius had commanded all Jews to depart from Rome,) he came to them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et quia ejusdem erat artis, manebat apud eos, et operabatur. ( Erant autem scenofactoriae artis.)"
      en: "And because he was of the same trade, he remained with them, and wrought; (now they were tentmakers by trade.)"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et disputabat in synagoga per omne sabbatum, interponens nomen Domini Jesu, suadebatque Judaeis et Graecis."
      en: "And he reasoned in the synagogue every sabbath, bringing in the name of the Lord Jesus; and he persuaded the Jews and the Greeks."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cum venissent autem de Macedonia Silas et Timotheus, instabat verbo Paulus, testificans Judaeis esse Christum Jesum."
      en: "And when Silas and Timothy were come from Macedonia, Paul was earnest in preaching, testifying to the Jews, that Jesus is the Christ."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Contradicentibus autem eis, et blasphemantibus, excutiens vestimenta sua, dixit ad eos: Sanguis vester super caput vestrum: mundus ego, ex hoc ad gentes vadam."
      en: "But they gainsaying and blaspheming, he shook his garments, and said to them: Your blood be upon your own heads; I am clean: from henceforth I will go unto the Gentiles."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et migrans inde, intravit in domum cujusdam, nomine Titi Justi, colentis Deum, cujus domus erat conjuncta synagogae."
      en: "And departing thence, he entered into the house of a certain man, named Titus Justus, one that worshipped God, whose house was adjoining to the synagogue."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Crispus autem archisynagogus credidit Domino cum omni domo sua: et multi Corinthiorum audientes credebant, et baptizabantur."
      en: "And Crispus, the ruler of the synagogue, believed in the Lord, with all his house; and many of the Corinthians hearing, believed, and were baptized."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dixit autem Dominus nocte per visionem Paulo: Noli timere, sed loquere, et ne taceas:"
      en: "And the Lord said to Paul in the night, by a vision: Do not fear, but speak; and hold not thy peace,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "propter quod ego sum tecum: et nemo apponetur tibi ut noceat te: quoniam populus est mihi multus in hac civitate."
      en: "Because I am with thee: and no man shall set upon thee, to hurt thee; for I have much people in this city."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sedit autem ibi annum et sex menses, docens apud eos verbum Dei."
      en: "And he stayed there a year and six months, teaching among them the word of God."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Gallione autem proconsule Achaiae, insurrexerunt uno animo Judaei in Paulum, et adduxerunt eum ad tribunal,"
      en: "But when Gallio was proconsul of Achaia, the Jews with one accord rose up against Paul, and brought him to the judgment seat,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dicentes: Quia contra legem hic persuadet hominibus colere Deum."
      en: "Saying: This man persuadeth men to worship God contrary to the law."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Incipiente autem Paulo aperire os, dixit Gallio ad Judaeos: Si quidem esset iniquum aliquid, aut facinus pessimum o viri Judaei, recte vos sustinerem."
      en: "And when Paul was beginning to open his mouth, Gallio said to the Jews: If it were some matter of injustice, or an heinous deed, O Jews, I should with reason bear with you."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Si vero quaestiones sunt de verbo, et nominibus, et lege vestra, vos ipsi videritis: judex ego horum nolo esse."
      en: "But if they be questions of word and names, and of your law, look you to it: I will not be judge of such things."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et minavit eos a tribunali."
      en: "And he drove them from the judgment seat."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Apprehendentes autem omnes Sosthenem principem synagogae, percutiebant eum ante tribunal: et nihil eorum Gallioni curae erat."
      en: "And all laying hold on Sosthenes, the ruler of the synagogue, beat him before the judgment seat; and Gallio cared for none of those things."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Paulus vero cum adhuc sustinuisset dies multos fratribus valefaciens, navigavit in Syriam ( et cum eo Priscilla et Aquila), qui sibi totonderat in Cenchris caput: habebat enim votum."
      en: "But Paul, when he had stayed yet many days, taking his leave of the brethren, sailed thence into Syria (and with him Priscilla and Aquila), having shorn his head in Cenchrae: for he had a vow."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Devenitque Ephesum, et illos ibi reliquit. Ipse vero ingressus synagogam, disputabat cum Judaeis."
      en: "And he came to Ephesus, and left them there. But he himself entering into the synagogue, disputed with the Jews."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Rogantibus autem eis ut ampliori tempore maneret, non consensit,"
      en: "And when they desired him, that he would tarry a longer time, he consented not;"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "sed valefaciens, et dicens: Iterum revertar ad vos Deo volente, profectus est ab Epheso."
      en: "But taking his leave, and saying: I will return to you again, God willing, he departed from Ephesus."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et descendens Caesaream, ascendit, et salutavit ecclesiam, et descendit Antiochiam."
      en: "And going down to Caesarea, he went up to Jerusalem, and saluted the church, and so came down to Antioch."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et facto ibi aliquanto tempore profectus est, perambulans ex ordine Galaticam regionem, et Phrygiam, confirmans omnes discipulos."
      en: "And after he had spent some time there, he departed, and went through the country of Galatia and Phrygia, in order, confirming all the disciples."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Judaeus autem quidam, Apollo nomine, Alexandrinus genere, vir eloquens, devenit Ephesum, potens in scripturis."
      en: "Now a certain Jew, named Apollo, born at Alexandria, an eloquent man, came to Ephesus, one mighty in the scriptures."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Hic erat edoctus viam Domini: et fervens spiritu loquebatur, et docebat diligenter ea quae sunt Jesu, sciens tantum baptisma Joannis."
      en: "This man was instructed in the way of the Lord; and being fervent in spirit, spoke, and taught diligently the things that are of Jesus, knowing only the baptism of John."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Hic ergo coepit fiducialiter agere in synagoga. Quem cum audissent Priscilla et Aquila, assumpserunt eum, et diligentius exposuerunt ei viam Domini."
      en: "This man therefore began to speak boldly in the synagogue. Whom when Priscilla and Aquila had heard, they took him to them, and expounded to him the way of the Lord more diligently."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Cum autem vellet ire Achaiam, exhortati fratres, scripserunt discipulis ut susciperent eum. Qui cum venisset, contulit multum his qui crediderant."
      en: "And whereas he was desirous to go to Achaia, the brethren exhorting, wrote to the disciples to receive him. Who, when he was come, helped them much who had believed."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Vehementer enim Judaeos revincebat publice, ostendens per Scripturas, esse Christum Jesum."
      en: "For with much vigour he convinced the Jews openly, shewing by the scriptures, that Jesus is the Christ."
    status: { la: verified, en: verified }
