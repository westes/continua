# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 3reg
chapter: 1
verses:
  - n: 1
    text:
      la: "Et rex David senuerat, habebatque aetatis plurimos dies: cumque operiretur vestibus, non calefiebat."
      en: "Now king David was old, and advanced in years: and when he was covered with clothes, he was not warm."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dixerunt ergo ei servi sui: Quaeramus domino nostro regi adolescentulam virginem, et stet coram rege, et foveat eum, dormiatque in sinu suo, et calefaciat dominum nostrum regem."
      en: "His servants therefore said to him: Let us seek for our lord the king, a young virgin, and let her stand before the king, and cherish him, and sleep in his bosom, and warm our lord the king."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quaesierunt igitur adolescentulam speciosam in omnibus finibus Israel, et invenerunt Abisag Sunamitidem, et adduxerunt eam ad regem."
      en: "So they sought a beautiful young woman in all the coasts of Israel, and they found Abisag a Sunamitess, and brought her to the king."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Erat autem puella pulchra nimis, dormiebatque cum rege, et ministrabat ei: rex vero non cognovit eam."
      en: "And the damsel was exceeding beautiful, and she slept with the king: and served him, but the king did not know her."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Adonias autem filius Haggith elevabatur, dicens: Ego regnabo. Fecitque sibi currus et equites, et quinquaginta viros, qui currerent ante eum."
      en: "And Adonias the son of Haggith exalted himself, saying: I will be king. And he made himself chariots and horsemen, and fifty men to run before him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Nec corripuit eum pater suus aliquando, dicens: Quare hoc fecisti? Erat autem et ipse pulcher valde, secundus natu post Absalom."
      en: "Neither did his father rebuke him at any time, saying: Why hast thou done this? And he also was very beautiful, the next in birth after Absalom."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et sermo ei cum Joab filio Sarviae, et cum Abiathar sacerdote, qui adjuvabant partes Adoniae."
      en: "And he conferred with Joab the son of Sarvia, and with Abiathar the priest, who furthered Adonias's side."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sadoc vero sacerdos, et Banaias filius Jojadae, et Nathan propheta, et Semei et Rei, et robur exercitus David, non erat cum Adonia."
      en: "But Sadoc the priest, and Banaias the son of Joiada, and Nathan the prophet, and Semei, and Rei, and the strength of David's army was not with Adonias."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Immolatis ergo Adonias arietibus et vitulis, et universis pinguibus juxta lapidem Zoheleth, qui erat vicinus fonti Rogel, vocavit universos fratres suos filios regis, et omnes viros Juda servos regis."
      en: "And Adonias having slain rams and calves, and all fat cattle by the stone of Zoheleth, which was near the fountain Rogel, invited all his brethren the king's sons, and all the men of Juda, the king's servants:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nathan autem prophetam, et Banaiam, et robustos quosque, et Salomonem fratrem suum non vocavit."
      en: "But Nathan the prophet, and Banaias, and all the valiant men, and Solomon his brother, he invited not."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Dixit itaque Nathan ad Bethsabee matrem Salomonis: Num audisti quod regnaverit Adonias filius Haggith, et dominus noster David hoc ignorat?"
      en: "And Nathan said to Bethsabee the mother of Solomon: Hast thou not heard that Adonias the son of Haggith reigneth, and our lord David knoweth it not?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Nunc ergo veni, accipe consilium a me, et salva animam tuam, filiique tui Salomonis."
      en: "Now then come, take my counsel and save thy life, and the life of thy son Solomon."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Vade, et ingredere ad regem David, et dic ei: Nonne tu, domine mi rex, jurasti mihi ancillae tuae, dicens: Salomon filius tuus regnabit post me, et ipse sedebit in solio meo? Quare ergo regnat Adonias?"
      en: "Go, and get thee in to king David, and say to him: Didst not thou, my lord O king, swear to me thy handmaid, saying: Solomon thy son shall reign after me, and he shall sit on my throne? why then doth Adonias reign?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et adhuc ibi te loquente cum rege, ego veniam post te, et complebo sermones tuos."
      en: "And while thou art yet speaking there with the king, I will come in after thee, and will fill up thy words."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ingressa est itaque Bethsabee ad regem in cubiculum: rex autem senuerat nimis, et Abisag Sunamitis ministrabat ei."
      en: "So Bethsabee went in to the king into the chamber: now the king was very old, and Abisag the Sunamitess ministered to him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Inclinavit se Bethsabee, et adoravit regem. Ad quam rex: Quid tibi, inquit, vis?"
      en: "Bethsabee bowed herself, and worshipped the king. And the king said to her: What is thy will?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quae respondens, ait: Domine mi, tu jurasti per Dominum Deum tuum ancillae tuae: Salomon filius tuus regnabit post me, et ipse sedebit in solio meo."
      en: "She answered and said: My lord, thou didst swear to thy handmaid by the Lord thy God, saying: Solomon thy son shall reign after me, and he shall sit on my throne."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et ecce nunc Adonias regnat, te, domine mi rex, ignorante."
      en: "And behold now Adonias reigneth, and thou, my lord the king, knowest nothing of it."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Mactavit boves, et pinguia quaeque, et arietes plurimos, et vocavit omnes filios regis, Abiathar quoque sacerdotem, et Joab principem militiae: Salomonem autem servum tuum non vocavit."
      en: "He hath killed oxen, and all fat cattle, and many rams, and invited all the king's sons, and Abiathar the priest, and Joab the general of the army: but Solomon thy servant he invited not."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Verumtamen, domine mi rex, in te oculi respiciunt totius Israel, ut indices eis, quis sedere debeat in solio tuo, domine mi rex, post te."
      en: "And now, my lord O king, the eyes of all Israel are upon thee, that thou shouldst tell them, who shall sit on thy throne, my lord the king, after thee."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Eritque, cum dormierit dominus meus rex cum patribus suis, erimus ego et filius meus Salomon peccatores."
      en: "Otherwise it shall come to pass, when my lord the king sleepeth with his fathers, that I and my son Solomon shall be counted offenders."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Adhuc illa loquente cum rege, Nathan propheta venit."
      en: "As she was yet speaking with the king, Nathan the prophet came."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et nuntiaverunt regi, dicentes: Adest Nathan propheta. Cumque introisset in conspectu regis, et adorasset eum pronus in terram,"
      en: "And they told the king, saying: Nathan the prophet is here. And when he was come in before the king, and had worshipped, bowing down to the ground,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "dixit Nathan: Domine mi rex, tu dixisti: Adonias regnet post me, et ipse sedeat super thronum meum?"
      en: "Nathan said: My lord O king, hast thou said: Let Adonias reign after me, and let him sit upon my throne?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Quia descendit hodie, et immolavit boves, et pinguia, et arietes plurimos, et vocavit universos filios regis et principes exercitus, Abiathar quoque sacerdotem, illisque vescentibus, et bibentibus coram eo, et dicentibus: Vivat rex Adonias:"
      en: "Because he is gone down today, and hath killed oxen, and fatlings, and many rams, and invited all the king's sons, and the captains of the army, and Abiathar the priest: and they are eating and drinking before him, and saying: God save king Adonias:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "me servum tuum, et Sadoc sacerdotem, et Banaiam filium Jojadae, et Salomonem famulum tuum non vocavit."
      en: "But me thy servant, and Sadoc the priest, and Banaias the son of Joiada, and Solomon thy servant he hath not invited."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Numquid a domino meo rege exivit hoc verbum, et mihi non indicasti servo tuo quis sessurus esset super thronum domini mei regis post eum?"
      en: "Is this word come out from my lord the king, and hast thou not told me thy servant who should sit on the throne of my lord the king after him?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et respondit rex David, dicens: Vocate ad me Bethsabee. Quae cum fuisset ingressa coram rege, et stetisset ante eum,"
      en: "And king David answered and said: Call to me Bethsabee. And when she was come in to the king, and stood before him,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "juravit rex, et ait: Vivit Dominus, qui eruit animam meam de omni angustia,"
      en: "The king swore and said: As the Lord liveth, who hath delivered my soul out of all distress,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quia sicut juravi tibi per Dominum Deum Israel, dicens: Salomon filius tuus regnabit post me, et ipse sedebit super solium meum pro me: sic faciam hodie."
      en: "Even as I swore to thee by the Lord the God of Israel, saying: Solomon thy son shall reign after me, and he shall sit upon my throne in my stead, so will I do this day."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Summissoque Bethsabee in terram vultu, adoravit regem, dicens: Vivat dominus meus David in aeternum."
      en: "And Bethsabee bowing with her face to the earth worshipped the king, saying: May my lord David live for ever."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Dixit quoque rex David: Vocate mihi Sadoc sacerdotem, et Nathan prophetam, et Banaiam filium Jojadae. Qui cum ingressi fuissent coram rege,"
      en: "King David also said: Call me Sadoc the priest, and Nathan the prophet, and Banaias the son of Joiada. And when they were come in before the king,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "dixit ad eos: Tollite vobiscum servos domini vestri, et imponite Salomonem filium meum super mulam meam: et ducite eum in Gihon."
      en: "He said to them: Take with you the servants of your lord, and set my son Solomon upon my mule: and bring him to Gihon."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et ungat eum ibi Sadoc sacerdos, et Nathan propheta, in regem super Israel: et canetis buccina, atque dicetis: Vivat rex Salomon."
      en: "And let Sadoc the priest, and Nathan the prophet anoint him there king over Israel: and you shall sound the trumpet, and shall say: God save king Solomon."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et ascendetis post eum, et veniet, et sedebit super solium meum, et ipse regnabit pro me: illique praecipiam ut sit dux super Israel, et super Judam."
      en: "And you shall come up after him, and he shall come, and shall sit upon my throne, and he shall reign in my stead: and I will appoint him to be ruler over Israel, and over Juda."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et respondit Banaias filius Jojadae regi, dicens: Amen: sic loquatur Dominus Deus domini mei regis."
      en: "And Banaias the son of Joiada answered the king, saying: Amen: so say the Lord the God of my lord the king."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Quomodo fuit Dominus cum domino meo rege, sic sit cum Salomone, et sublimius faciat solium ejus a solio domini mei regis David."
      en: "As the Lord hath been with my lord the king, so be he with Solomon, and make his throne higher than the throne of my lord king David."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Descendit ergo Sadoc sacerdos, et Nathan propheta, et Banaias filius Jojadae, et Cerethi, et Phelethi: et imposuerunt Salomonem super mulam regis David, et adduxerunt eum in Gihon."
      en: "So Sadoc the priest, and Nathan the prophet went down, and Banaias the son of Joiada, and the Cerethi, and Phelethi: and they set Solomon upon the mule of king David, and brought him to Gihon."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Sumpsitque Sadoc sacerdos cornu olei de tabernaculo, et unxit Salomonem: et cecinerunt buccina, et dixit omnis populus: Vivat rex Salomon."
      en: "And Sadoc the priest took a horn of oil out of the tabernacle, and anointed Solomon: and they sounded the trumpet, and all the people said: God save king Solomon."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et ascendit universa multitudo post eum, et populus canentium tibiis, et laetantium gaudio magno, et insonuit terra a clamore eorum."
      en: "And all the multitude went up after him, and the people played with pipes, and rejoiced with a great joy, and the earth rang with the noise of their cry."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Audivit autem Adonias, et omnes qui invitati fuerant ab eo, jamque convivium finitum erat: sed et Joab, audita voce tubae, ait: Quid sibi vult clamor civitatis tumultuantis?"
      en: "And Adonias, and all that were invited by him, heard it, and now the feast was at an end: Joab also hearing the sound of the trumpet, said: What meaneth this noise of the city in an uproar?"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Adhuc illo loquente, Jonathas filius Abiathar sacerdotis venit: cui dixit Adonias: Ingredere, quia vir fortis es, et bona nuntians."
      en: "While he yet spoke, Jonathan the son of Abiathar the priest came: and Adonias said to him: Come in, because thou art a valiant man, and bringest good news."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Responditque Jonathas Adoniae: Nequaquam: dominus enim noster rex David regem constituit Salomonem:"
      en: "And Jonathan answered Adonias: Not so: for our lord king David hath appointed Solomon king."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "misitque cum eo Sadoc sacerdotem, et Nathan prophetam, et Banaiam filium Jojadae, et Cerethi, et Phelethi, et imposuerunt eum super mulam regis."
      en: "And hath sent with him Sadoc the priest, and Nathan the prophet, and Banaias the son of Joiada, and the Cerethi, and Phelethi, and they have set him upon the king's mule."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Unxeruntque eum Sadoc sacerdos, et Nathan propheta regem in Gihon: et ascenderunt inde laetantes, et insonuit civitas: haec est vox, quam audistis."
      en: "And Sadoc the priest, and Nathan the prophet have anointed him king in Gihon: and they are gone up from thence rejoicing, so that the city rang again: this is the noise that you have heard."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Sed et Salomon sedet super solium regni."
      en: "Moreover Solomon sitteth upon the throne of the kingdom,"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Et ingressi servi regis benedixerunt domino nostro regi David, dicentes: Amplificet Deus nomen Salomonis super nomen tuum, et magnificet thronus ejus super thronum tuum. Et adoravit rex in lectulo suo:"
      en: "And the king's servants going in have blessed our lord king David, saying: May God make the name of Solomon greater than thy name, and make his throne greater than thy throne. And the king adored in his bed:"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et locutus est: Benedictus Dominus Deus Israel, qui dedit hodie sedentem in solio meo, videntibus oculis meis."
      en: "And he said: Blessed be the Lord the God of Israel, who hath given this day one to sit on my throne, my eyes seeing it."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Territi sunt ergo, et surrexerunt omnes qui invitati fuerant ab Adonia, et ivit unusquisque in viam suam."
      en: "Then all the guests of Adonias were afraid, and they all arose and every man went his way."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Adonias autem timens Salomonem, surrexit, et abiit, tenuitque cornu altaris."
      en: "And Adonias fearing Solomon, arose, and went, and took hold on the horn of the altar."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Et nuntiaverunt Salomoni, dicentes: Ecce Adonias timens regem Salomonem, tenuit cornu altaris, dicens: Juret mihi rex Salomon hodie, quod non interficiat servum suum gladio."
      en: "And they told Solomon, saying: Behold Adonias, fearing king Solomon, hath taken hold of the horn of the altar, saying: Let king Solomon swear to me this day, that he will not kill his servant with the sword."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Dixitque Salomon: Si fuerit vir bonus, non cadet ne unus quidem capillus ejus in terram: sin autem malum inventum fuerit in eo, morietur."
      en: "And Solomon said: If he be a good man, there shall not so much as one hair of his head fall to the ground: but if evil be found in him, he shall die."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Misit ergo rex Salomon, et eduxit eum ab altari: et ingressus adoravit regem Salomonem: dixitque ei Salomon: Vade in domum tuam."
      en: "Then king Solomon sent, and brought him out from the altar: and going in he worshipped king Solomon: and Solomon said to him: Go to thy house."
    status: { la: verified, en: verified }
