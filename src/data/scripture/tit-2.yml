# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: tit
chapter: 2
verses:
  - n: 1
    text:
      la: "Tu autem loquere quae decent sanam doctrinam:"
      en: "But speak thou the things that become sound doctrine:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "senes ut sobrii sint, pudici, prudentes, sani in fide, in dilectione, in patientia:"
      en: "That the aged men be sober, chaste, prudent, sound in faith, in love, in patience."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "anus similiter in habitu sancto, non criminatrices, non multo vino servientes, bene docentes:"
      en: "The aged women, in like manner, in holy attire, not false accusers, not given to much wine, teaching well:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ut prudentiam doceant adolescentulas, ut viros suos ament, filios suos diligant,"
      en: "That they may teach the young women to be wise, to love their husbands, to love their children,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "prudentes, castas, sobrias, domus curam habentes, benignas, subditas viris suis, ut non blasphemetur verbum Dei."
      en: "To be discreet, chaste, sober, having a care of the house, gentle, obedient to their husbands, that the word of God be not blasphemed."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Juvenes similiter hortare ut sobrii sint."
      en: "Young men, in like manner, exhort that they be sober."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "In omnibus teipsum praebe exemplum bonorum operum, in doctrina, in integritate, in gravitate,"
      en: "In all things shew thyself an example of good works, in doctrine, in integrity, in gravity,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "verbum sanum, irreprehensibile: ut is qui ex adverso est, vereatur, nihil habens malum dicere de nobis."
      en: "The sound word that can not be blamed: that he, who is on the contrary part, may be afraid, having no evil to say of us."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Servos dominis suis subditos esse, in omnibus placentes, non contradicentes,"
      en: "Exhort servants to be obedient to their masters, in all things pleasing, not gainsaying:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "non fraudantes, sed in omnibus fidem bonam ostendentes: ut doctrinam Salvatoris nostri Dei ornent in omnibus."
      en: "Not defrauding, but in all things shewing good fidelity, that they may adorn the doctrine of God our Saviour in all things:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Apparuit enim gratia Dei Salvatoris nostri omnibus hominibus,"
      en: "For the grace of God our Saviour hath appeared to all men;"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "erudiens nos, ut abnegantes impietatem, et saecularia desideria, sobrie, et juste, et pie vivamus in hoc saeculo,"
      en: "Instructing us, that, denying ungodliness and worldly desires, we should live soberly, and justly, and godly in this world,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "exspectantes beatam spem, et adventum gloriae magni Dei, et Salvatoris nostri Jesu Christi:"
      en: "Looking for the blessed hope and coming of the glory of the great God and our Saviour Jesus Christ,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui dedit semetipsum pro nobis, ut nos redimeret ab omni iniquitate, et mundaret sibi populum acceptabilem, sectatorem bonorum operum."
      en: "Who gave himself for us, that he might redeem us from all iniquity, and might cleanse to himself a people acceptable, a pursuer of good works."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Haec loquere, et exhortare, et argue cum omni imperio. Nemo te contemnat."
      en: "These things speak, and exhort and rebuke with all authority. Let no man despise thee."
    status: { la: verified, en: verified }
