# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: rom
chapter: 8
verses:
  - n: 1
    text:
      la: "Nihil ergo nunc damnationis est iis qui sunt in Christo Jesu: qui non secundum carnem ambulant."
      en: "There is now therefore no condemnation to them that are in Christ Jesus, who walk not according to the flesh."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Lex enim spiritus vitae in Christo Jesu liberavit me a lege peccati et mortis."
      en: "For the law of the spirit of life, in Christ Jesus, hath delivered me from the law of sin and of death."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Nam quod impossibile erat legi, in quo infirmabatur per carnem: Deus Filium suum mittens in similitudinem carnis peccati et de peccato, damnavit peccatum in carne,"
      en: "For what the law could not do, in that it was weak through the flesh; God sending his own Son, in the likeness of sinful flesh and of sin, hath condemned sin in the flesh;"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et justificatio legis impleretur in nobis, qui non secundum carnem ambulamus, sed secundum spiritum."
      en: "That the justification of the law might be fulfilled in us, who walk not according to the flesh, but according to the spirit."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Qui enim secundum carnem sunt, quae carnis sunt, sapiunt: qui vero secundum spiritum sunt, quae sunt spiritus, sentiunt."
      en: "For they that are according to the flesh, mind the things that are of the flesh; but they that are according to the spirit, mind the things that are of the spirit."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Nam prudentia carnis, mors est: prudentia autem spiritus, vita et pax:"
      en: "For the wisdom of the flesh is death; but the wisdom of the spirit is life and peace."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quoniam sapientia carnis inimica est Deo: legi enim Dei non est subjecta, nec enim potest."
      en: "Because the wisdom of the flesh is an enemy to God; for it is not subject to the law of God, neither can it be."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Qui autem in carne sunt, Deo placere non possunt."
      en: "And they who are in the flesh, cannot please God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Vos autem in carne non estis, sed in spiritu: si tamen Spiritus Dei habitat in vobis. Siquis autem Spiritum Christi non habet, hic non est ejus."
      en: "But you are not in the flesh, but in the spirit, if so be that the Spirit of God dwell in you. Now if any man have not the Spirit of Christ, he is none of his."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Si autem Christus in vobis est, corpus quidem mortuum est propter peccatum, spiritus vero vivit propter justificationem."
      en: "And if Christ be in you, the body indeed is dead, because of sin; but the spirit liveth, because of justification."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quod si Spiritus ejus, qui suscitavit Jesum a mortuis, habitat in vobis: qui suscitavit Jesum Christum a mortuis, vivificabit et mortalia corpora vestra, propter inhabitantem Spiritum ejus in vobis."
      en: "And if the Spirit of him that raised up Jesus from the dead, dwell in you; he that raised up Jesus Christ from the dead, shall quicken also your mortal bodies, because of his Spirit that dwelleth in you."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ergo fratres, debitores sumus non carni, ut secundum carnem vivamus."
      en: "Therefore, brethren, we are debtors, not to the flesh, to live according to the flesh."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Si enim secundum carnem vixeritis, moriemini: si autem spiritu facta carnis mortificaveritis, vivetis."
      en: "For if you live according to the flesh, you shall die: but if by the Spirit you mortify the deeds of the flesh, you shall live."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quicumque enim Spiritu Dei aguntur, hi filii Dei sunt."
      en: "For whosoever are led by the Spirit of God, they are the sons of God."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Non enim accepistis spiritum servitutis iterum in timore, sed accepistis spiritum adoptionis filiorum, in quo clamamus: Abba ( Pater)."
      en: "For you have not received the spirit of bondage again in fear; but you have received the spirit of adoption of sons, whereby we cry: Abba (Father)."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ipse enim Spiritus testimonium reddit spiritui nostro quod sumus filii Dei."
      en: "For the Spirit himself giveth testimony to our spirit, that we are the sons of God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Si autem filii, et haeredes: haeredes, quidem Dei, cohaeredes autem Christi: si tamen compatimur ut et conglorificemur."
      en: "And if sons, heirs also; heirs indeed of God, and joint heirs with Christ: yet so, if we suffer with him, that we may be also glorified with him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Existimo enim quod non sunt condignae passiones hujus temporis ad futuram gloriam, quae revelabitur in nobis."
      en: "For I reckon that the sufferings of this time are not worthy to be compared with the glory to come, that shall be revealed in us."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Nam exspectatio creaturae revelationem filiorum Dei exspectat."
      en: "For the expectation of the creature waiteth for the revelation of the sons of God."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Vanitati enim creatura subjecta est non volens, sed propter eum, qui subjecit eam in spe:"
      en: "For the creature was made subject to vanity, not willingly, but by reason of him that made it subject, in hope:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quia et ipsa creatura liberabitur a servitute corruptionis in libertatem gloriae filiorum Dei."
      en: "Because the creature also itself shall be delivered from the servitude of corruption, into the liberty of the glory of the children of God."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Scimus enim quod omnis creatura ingemiscit, et parturit usque adhuc."
      en: "For we know that every creature groaneth and travaileth in pain, even till now."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Non solum autem illa, sed et nos ipsi primitias spiritus habentes: et ipsi intra nos gemimus adoptionem filiorum Dei exspectantes, redemptionem corporis nostri."
      en: "And not only it, but ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves, waiting for the adoption of the sons of God, the redemption of our body."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Spe enim salvi facti sumus. Spes autem, quae videtur, non est spes: nam quod videt quis, quid sperat?"
      en: "For we are saved by hope. But hope that is seen, is not hope. For what a man seeth, why doth he hope for?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Si autem quod non videmus, speramus: per patientiam exspectamus."
      en: "But if we hope for that which we see not, we wait for it with patience."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Similiter autem et Spiritus adjuvat infirmitatem nostram: nam quid oremus, sicut oportet, nescimus: sed ipse Spiritus postulat pro nobis gemitibus inenarrabilibus."
      en: "Likewise the Spirit also helpeth our infirmity. For we know not what we should pray for as we ought; but the Spirit himself asketh for us with unspeakable groanings."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Qui autem scrutatur corda, scit quid desideret Spiritus: quia secundum Deum postulat pro sanctis."
      en: "And he that searcheth the hearts, knoweth what the Spirit desireth; because he asketh for the saints according to God."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Scimus autem quoniam diligentibus Deum omnia cooperantur in bonum, iis qui secundum propositum vocati sunt sancti."
      en: "And we know that to them that love God, all things work together unto good, to such as, according to his purpose, are called to be saints."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Nam quos praescivit, et praedestinavit conformes fieri imaginis Filii sui, ut sit ipse primogenitus in multis fratribus."
      en: "For whom he foreknew, he also predestinated to be made conformable to the image of his Son; that he might be the firstborn amongst many brethren."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Quos autem praedestinavit, hos et vocavit: et quos vocavit, hos et justificavit: quos autem justificavit, illos et glorificavit."
      en: "And whom he predestinated, them he also called. And whom he called, them he also justified. And whom he justified, them he also glorified."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Quid ergo dicemus ad haec? si Deus pro nobis, qui contra nos?"
      en: "What shall we then say to these things? If God be for us, who is against us?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Qui etiam proprio Filio suo non pepercit, sed pro nobis omnibus tradidit illum: quomodo non etiam cum illo omnia nobis donavit?"
      en: "He that spared not even his own Son, but delivered him up for us all, how hath he not also, with him, given us all things?"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Quis accusabit adversus electos Dei? Deus qui justificat,"
      en: "Who shall accuse against the elect of God? God that justifieth."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "quis est qui condemnet? Christus Jesus, qui mortuus est, immo qui et resurrexit, qui est ad dexteram Dei, qui etiam interpellat pro nobis."
      en: "Who is he that shall condemn? Christ Jesus that died, yea that is risen also again; who is at the right hand of God, who also maketh intercession for us."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Quis ergo nos separabit a caritate Christi? tribulatio? an angustia? an fames? an nuditas? an periculum? an persecutio? an gladius?"
      en: "Who then shall separate us from the love of Christ? Shall tribulation? or distress? or famine? or nakedness? or danger? or persecution? or the sword?"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "( Sicut scriptum est: Quia propter te mortificamur tota die: aestimati sumus sicut oves occisionis.)"
      en: "(As it is written: For thy sake we are put to death all the day long. We are accounted as sheep for the slaughter.)"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Sed in his omnibus superamus propter eum qui dilexit nos."
      en: "But in all these things we overcome, because of him that hath loved us."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Certus sum enim quia neque mors, neque vita, neque angeli, neque principatus, neque virtutes, neque instantia, neque futura, neque fortitudo,"
      en: "For I am sure that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, nor might,"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "neque altitudo, neque profundum, neque creatura alia poterit nos separare a caritate Dei, quae est in Christo Jesu Domino nostro."
      en: "Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord."
    status: { la: verified, en: verified }
