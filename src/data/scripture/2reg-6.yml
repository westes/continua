# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2reg
chapter: 6
verses:
  - n: 1
    text:
      la: "Congregavit autem rursum David omnes electos ex Israel triginta millia."
      en: "And David again gathered together all the chosen men of Israel, thirty thousand."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Surrexitque David, et abiit, et universus populus qui erat cum eo de viris Juda, ut adducerent arcam Dei, super quam invocatum est nomen Domini exercituum, sedentis in cherubim super eam."
      en: "And David arose and went, with all the people that were with him of the men of Juda to fetch the ark of God, upon which the name of the Lord of hosts is invoked, who sitteth over it upon the cherubims."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et imposuerunt arcam Dei super plaustrum novum: tuleruntque eam de domo Abinadab, qui erat in Gabaa: Oza autem et Ahio filii Abinadab, minabant plaustrum novum."
      en: "And they laid the ark of God upon a new cart: and took it out of the house of Abinadab, who was in Gabaa: and Oza, and Ahio, the sons of Abinadab, drove the new cart."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cumque tulissent eam de domo Abinadab, qui erat in Gabaa, custodiens arcam Dei Ahio praecedebat arcam."
      en: "And when they had taken it out of the house of Abinadab, who was in Gabaa, Ahio having care of the ark of God went before the ark."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "David autem et omnis Israel ludebant coram Domino in omnibus lignis fabrefactis, et citharis et lyris et tympanis et sistris et cymbalis."
      en: "But David and all Israel played before the Lord on all manner of instruments made of wood, on harps and lutes and timbrels and cornets and cymbals."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Postquam autem venerunt ad aream Nachon, extendit Oza manum ad arcam Dei, et tenuit eam: quoniam calcitrabant boves, et declinaverunt eam."
      en: "And when they came to the floor of Nachon, Oza put forth his hand to the ark of God, and took hold of it: because the oxen kicked and made it lean aside."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Iratusque est indignatione Dominus contra Ozam, et percussit eum super temeritate: qui mortuus est ibi juxta arcam Dei."
      en: "And the indignation of the Lord was enkindled against Oza, and he struck him for his rashness: and he died there before the ark of God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Contristatus est autem David, eo quod percussisset Dominus Ozam, et vocatum est nomen loci illius: Percussio Ozae, usque in diem hanc."
      en: "And David was grieved because the Lord had struck Oza, and the name of that place was called: The striking of Oza, to this day."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et extimuit David Dominum in die illa, dicens: Quomodo ingredietur ad me arca Domini?"
      en: "And David was afraid of the Lord that day, saying: How shall the ark of the Lord come to me?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et noluit divertere ad se arcam Domini in civitatem David: sed divertit eam in domum Obededom Gethaei."
      en: "And he would not have the ark of the Lord brought in to himself into the city of David: but he caused it to be carried into the house of Obededom the Gethite."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et habitavit arca Domini in domo Obededom Gethaei tribus mensibus: et benedixit Dominus Obededom, et omnem domum ejus."
      en: "And the ark of the Lord abode in the house of Obededom the Gethite three months: and the Lord blessed Obededom, and all his household."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Nuntiatumque est regi David quod benedixisset Dominus Obededom, et omnia ejus, propter arcam Dei. Abiit ergo David, et adduxit arcam Dei de domo Obededom in civitatem David cum gaudio: et erant cum David septem chori, et victima vituli."
      en: "And it was told king David, that the Lord had blessed Obededom, and all that he had, because of the ark of God. So David went, and brought away the ark of God out of the house of Obededom into the city of David with joy. And there were with David seven choirs, and calves for victims."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Cumque transcendissent qui portabant arcam Domini sex passus, immolabat bovem et arietem,"
      en: "And when they that carried the ark of the Lord had gone six paces, he sacrificed an ox and a ram:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et David saltabat totis viribus ante Dominum: porro David erat accinctus ephod lineo."
      en: "And David danced with all his might before the Lord: and David was girded with a linen ephod."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et David et omnis domus Israel ducebant arcam testamenti Domini, in jubilo, et in clangore buccinae."
      en: "And David and all the house of Israel brought the ark of the covenant of the Lord with joyful shouting, and with sound of trumpet."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cumque intrasset arca Domini in civitatem David, Michol filia Saul prospiciens per fenestram, vidit regem David subsilientem, atque saltantem coram Domino: et despexit eum in corde suo."
      en: "And when the ark of the Lord was come into the city of David, Michol the daughter of Saul, looking out through a window, saw king David leaping and dancing before the Lord: and she despised him in her heart."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et introduxerunt arcam Domini, et imposuerunt eam in loco suo in medio tabernaculi, quod tetenderat ei David: et obtulit David holocausta et pacifica coram Domino."
      en: "And they brought the ark of the Lord, and set it in its place in the midst of the tabernacle, which David had pitched for it: and David offered holocausts, and peace offerings before the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Cumque complesset offerens holocausta et pacifica, benedixit populo in nomine Domini exercituum."
      en: "And when he had made an end of offering holocausts and peace offerings, he blessed the people in the name of the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et partitus est universae multitudini Israel tam viro quam mulieri singulis collyridam panis unam, et assaturam bubulae carnis unam, et similam frixam oleo: et abiit omnis populus, unusquisque in domum suam."
      en: "And he distributed to all the multitude of Israel both men and women, to every one, a cake of bread, and a piece of roasted beef, and fine flour fried with oil: and all the people departed every one to his house."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Reversusque est David ut benediceret domui suae: et egressa Michol filia Saul in occursum David, ait: Quam gloriosus fuit hodie rex Israel discooperiens se ante ancillas servorum suorum, et nudatus est, quasi si nudetur unus de scurris."
      en: "And David returned to bless his own house: and Michol the daughter of Saul coming out to meet David, said: How glorious was the king of Israel today, uncovering himself before the handmaids of his servants, and was naked, as if one of the buffoons should be naked."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dixitque David ad Michol: Ante Dominum, qui elegit me potius quam patrem tuum, et quam omnem domum ejus, et praecepit mihi ut essem dux super populum Domini in Israel,"
      en: "And David said to Michol: Before the Lord, who chose me rather than thy father, and than all his house, and commanded me to be ruler over the people of the Lord in Israel,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et ludam, et vilior fiam plus quam factus sum: et ero humilis in oculis meis: et cum ancillis, de quibus locuta es, gloriosior apparebo."
      en: "I will both play and make myself meaner than I have done: and I will be little in my own eyes: and with the handmaid of whom thou speakest, I shall appear more glorious."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Igitur Michol filiae Saul non est natus filius usque in diem mortis suae."
      en: "Therefore Michol the daughter of Saul had no child to the day of her death."
    status: { la: verified, en: verified }
