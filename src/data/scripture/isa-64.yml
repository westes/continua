# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 64
verses:
  - n: 1
    text:
      la: "utinam disrumperes caelos et descenderes a facie tua montes defluerent"
      en: "That thou wouldst rend the heavens, and wouldst come down: the mountains would melt away at thy presence."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sicut exustio ignis tabescerent aquae arderent igni ut notum fieret nomen tuum inimicis tuis a facie tua gentes turbarentur"
      en: "They would melt as at the burning of fire, the waters would burn with fire, that thy name might be made known to thy enemies: that the nations might tremble at thy presence."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cum feceris mirabilia non sustinebimus descendisti et a facie tua montes defluxerunt"
      en: "When thou shalt do wonderful things, we shall not bear them: thou didst come down, and at thy presence the mountains melted away."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "a saeculo non audierunt neque auribus perceperunt oculus non vidit Deus absque te quae praeparasti expectantibus te"
      en: "From the beginning of the world they have not heard, nor perceived with the ears: the eye hath not seen, O God, besides thee, what things thou hast prepared for them that wait for thee."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "occurristi laetanti et facienti iustitiam in viis tuis recordabuntur tui ecce tu iratus es et peccavimus in ipsis fuimus semper et salvabimur"
      en: "Thou hast met him that rejoiceth, and doth justice: in thy ways they shall remember thee: behold thou art angry, and we have sinned: in them we have been always, and we shall be saved."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et facti sumus ut inmundus omnes nos quasi pannus menstruatae universae iustitiae nostrae et cecidimus quasi folium universi et iniquitates nostrae quasi ventus abstulerunt nos"
      en: "And we are all become as one unclean, and all our justices as the rag of a menstruous woman: and we have all fallen as a leaf, and our iniquities, like the wind, have taken us away."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "non est qui invocet nomen tuum qui consurgat et teneat te abscondisti faciem tuam a nobis et adlisisti nos in manu iniquitatis nostrae"
      en: "There is none that calleth upon thy name: that riseth up, and taketh hold of thee: thou hast hid thy face from us, and hast crushed us in the hand of our iniquity."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et nunc Domine pater noster es tu nos vero lutum et fictor noster et opera manuum tuarum omnes nos"
      en: "And now, O Lord, thou art our father, and we are clay: and thou art our maker, and we all are the works of thy hands."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ne irascaris Domine satis et ne ultra memineris iniquitatis ecce respice populus tuus omnes nos"
      en: "Be not very angry, O Lord, and remember no longer our iniquity: behold, see we are all thy people."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "civitas sancti tui facta est deserta Sion deserta facta est Hierusalem desolata"
      en: "The city of thy sanctuary is become a desert, Sion is made a desert, Jerusalem is desolate."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "domus sanctificationis nostrae et gloriae nostrae ubi laudaverunt te patres nostri facta est in exustionem ignis et omnia desiderabilia nostra versa sunt in ruinas"
      en: "The house of our holiness, and of our glory, where our fathers praised thee, is burnt with fire, and all our lovely things are turned into ruins."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "numquid super his continebis te Domine tacebis et adfliges nos vehementer"
      en: "Wilt thou refrain thyself, O Lord, upon these things, wilt thou hold thy peace, and afflict us vehemently?"
    status: { la: verified, en: verified }
