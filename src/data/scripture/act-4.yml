# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: act
chapter: 4
verses:
  - n: 1
    text:
      la: "loquentibus autem illis ad populum supervenerunt sacerdotes et magistratus templi et Sadducaei"
      en: "And as they were speaking to the people, the priests, and the officer of the temple, and the Sadducees, came upon them,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dolentes quod docerent populum et adnuntiarent in Iesu resurrectionem ex mortuis"
      en: "Being grieved that they taught the people, and preached in Jesus the resurrection from the dead:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et iniecerunt in eis manus et posuerunt eos in custodiam in crastinum erat enim iam vespera"
      en: "And they laid hands upon them, and put them in hold till the next day; for it was now evening."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "multi autem eorum qui audierant verbum crediderunt et factus est numerus virorum quinque milia"
      en: "But many of them who had heard the word, believed; and the number of the men was made five thousand."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "factum est autem in crastinum ut congregarentur principes eorum et seniores et scribae in Hierusalem"
      en: "And it came to pass on the morrow, that their princes, and ancients, and scribes, were gathered together in Jerusalem;"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et Annas princeps sacerdotum et Caiphas et Iohannes et Alexander et quotquot erant de genere sacerdotali"
      en: "And Annas the high priest, and Caiphas, and John, and Alexander, and as many as were of the kindred of the high priest."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et statuentes eos in medio interrogabant in qua virtute aut in quo nomine fecistis hoc vos"
      en: "And setting them in the midst, they asked: By what power, or by what name, have you done this?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "tunc Petrus repletus Spiritu Sancto dixit ad eos principes populi et seniores"
      en: "Then Peter, filled with the Holy Ghost, said to them: Ye princes of the people, and ancients, hear:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "si nos hodie diiudicamur in benefacto hominis infirmi in quo iste salvus factus est"
      en: "If we this day are examined concerning the good deed done to the infirm man, by what means he hath been made whole:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "notum sit omnibus vobis et omni plebi Israhel quia in nomine Iesu Christi Nazareni quem vos crucifixistis quem Deus suscitavit a mortuis in hoc iste adstat coram vobis sanus"
      en: "Be it known to you all, and to all the people of Israel, that by the name of our Lord Jesus Christ of Nazareth, whom you crucified, whom God hath raised from the dead, even by him this man standeth here before you whole."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "hic est lapis qui reprobatus est a vobis aedificantibus qui factus est in caput anguli"
      en: "This is the stone which was rejected by you the builders, which is become the head of the corner."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et non est in alio aliquo salus nec enim nomen aliud est sub caelo datum hominibus in quo oportet nos salvos fieri"
      en: "Neither is there salvation in any other. For there is no other name under heaven given to men, whereby we must be saved."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "videntes autem Petri constantiam et Iohannis conperto quod homines essent sine litteris et idiotae admirabantur et cognoscebant eos quoniam cum Iesu fuerant"
      en: "Now seeing the constancy of Peter and of John, understanding that they were illiterate and ignorant men, they wondered; and they knew them that they had been with Jesus."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "hominem quoque videntes stantem cum eis qui curatus fuerat nihil poterant contradicere"
      en: "Seeing the man also who had been healed standing with them, they could say nothing against it."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "iusserunt autem eos foras extra concilium secedere et conferebant ad invicem"
      en: "But they commanded them to go aside out of the council; and they conferred among themselves,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dicentes quid faciemus hominibus istis quoniam quidem notum signum factum est per eos omnibus habitantibus in Hierusalem manifestum et non possumus negare"
      en: "Saying: What shall we do to these men? for indeed a known miracle hath been done by them, to all the inhabitants of Jerusalem: it is manifest, and we cannot deny it."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sed ne amplius divulgetur in populum comminemur eis ne ultra loquantur in nomine hoc ulli hominum"
      en: "But that it may be no farther spread among the people, let us threaten them that they speak no more in this name to any man."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et vocantes eos denuntiaverunt ne omnino loquerentur neque docerent in nomine Iesu"
      en: "And calling them, they charged them not to speak at all, nor teach in the name of Jesus."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Petrus vero et Iohannes respondentes dixerunt ad eos si iustum est in conspectu Dei vos potius audire quam Deum iudicate"
      en: "But Peter and John answering, said to them: If it be just in the sight of God, to hear you rather than God, judge ye."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "non enim possumus quae vidimus et audivimus non loqui"
      en: "For we cannot but speak the things which we have seen and heard."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "at illi comminantes dimiserunt eos non invenientes quomodo punirent eos propter populum quia omnes clarificabant Deum in eo quod acciderat"
      en: "But they threatening, sent them away, not finding how they might punish them, because of the people; for all men glorified what had been done, in that which had come to pass."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "annorum enim erat amplius quadraginta homo in quo factum erat signum istud sanitatis"
      en: "For the man was above forty years old, in whom that miraculous cure had been wrought."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "dimissi autem venerunt ad suos et adnuntiaverunt eis quanta ad eos principes sacerdotum et seniores dixissent"
      en: "And being let go, they came to their own company, and related all that the chief priests and ancients had said to them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "qui cum audissent unianimiter levaverunt vocem ad Deum et dixerunt Domine tu qui fecisti caelum et terram et mare et omnia quae in eis sunt"
      en: "Who having heard it, with one accord lifted up their voice to God, and said: Lord, thou art he that didst make heaven and earth, the sea, and all things that are in them."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "qui Spiritu Sancto per os patris nostri David pueri tui dixisti quare fremuerunt gentes et populi meditati sunt inania"
      en: "Who, by the Holy Ghost, by the mouth of our father David, thy servant, hast said: Why did the Gentiles rage, and the people meditate vain things?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "adstiterunt reges terrae et principes convenerunt in unum adversus Dominum et adversus Christum eius"
      en: "The kings of the earth stood up, and the princes assembled together against the Lord and his Christ."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "convenerunt enim vere in civitate ista adversus sanctum puerum tuum Iesum quem unxisti Herodes et Pontius Pilatus cum gentibus et populis Israhel"
      en: "For of a truth there assembled together in this city against thy holy child Jesus, whom thou hast anointed, Herod, and Pontius Pilate, with the Gentiles and the people of Israel,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "facere quae manus tua et consilium decreverunt fieri"
      en: "To do what thy hand and thy counsel decreed to be done."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et nunc Domine respice in minas eorum et da servis tuis cum omni fiducia loqui verbum tuum"
      en: "And now, Lord, behold their threatenings, and grant unto thy servants, that with all confidence they may speak thy word,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "in eo cum manum tuam extendas sanitates et signa et prodigia fieri per nomen sancti Filii tui Iesu"
      en: "By stretching forth thy hand to cures, and signs, and wonders to be done by the name of thy holy Son Jesus."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et cum orassent motus est locus in quo erant congregati et repleti sunt omnes Spiritu Sancto et loquebantur verbum Dei cum fiducia"
      en: "And when they had prayed, the place was moved wherein they were assembled; and they were all filled with the Holy Ghost, and they spoke the word of God with confidence."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "multitudinis autem credentium erat cor et anima una nec quisquam eorum quae possidebant aliquid suum esse dicebat sed erant illis omnia communia"
      en: "And the multitude of believers had but one heart and one soul: neither did any one say that aught of the things which he possessed, was his own; but all things were common unto them."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et virtute magna reddebant apostoli testimonium resurrectionis Iesu Christi Domini et gratia magna erat in omnibus illis"
      en: "And with great power did the apostles give testimony of the resurrection of Jesus Christ our Lord; and great grace was in them all."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "neque enim quisquam egens erat inter illos quotquot enim possessores agrorum aut domorum erant vendentes adferebant pretia eorum quae vendebant"
      en: "For neither was there any one needy among them. For as many as were owners of lands or houses, sold them, and brought the price of the things they sold,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et ponebant ante pedes apostolorum dividebantur autem singulis prout cuique opus erat"
      en: "And laid it down before the feet of the apostles. And distribution was made to every one, according as he had need."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Ioseph autem qui cognominatus est Barnabas ab apostolis quod est interpretatum Filius consolationis Levites Cyprius genere"
      en: "And Joseph, who, by the apostles, was surnamed Barnabas, (which is, by interpretation, The son of consolation,) a Levite, a Cyprian born,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "cum haberet agrum vendidit illum et adtulit pretium et posuit ante pedes apostolorum"
      en: "Having land, sold it, and brought the price, and laid it at the feet of the apostles."
    status: { la: verified, en: verified }
