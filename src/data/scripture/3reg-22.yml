# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 3reg
chapter: 22
verses:
  - n: 1
    text:
      la: "transierunt igitur tres anni absque bello inter Syriam et Israhel"
      en: "And there passed three years without war between Syria and Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in anno autem tertio descendit Iosaphat rex Iuda ad regem Israhel"
      en: "And in the third year, Josaphat king of Juda came down to the king of Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixitque rex Israhel ad servos suos ignoratis quod nostra sit Ramoth Galaad et neglegimus tollere eam de manu regis Syriae"
      en: "(And the king of Israel said to his servants: Know ye not-that Ramoth Galaad is ours, and we neglect to take it out of the hand of the king of Syria?)"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ait ad Iosaphat veniesne mecum ad proeliandum in Ramoth Galaad"
      en: "And he said to Josaphat: Wilt thou come with me to battle to Ramoth Galaad ?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixitque Iosaphat ad regem Israhel sicut ego sum ita et tu populus meus et populus tuus unum sunt et equites mei et equites tui dixitque Iosaphat ad regem Israhel quaere oro te hodie sermonem Domini"
      en: "And Josaphat said to the king of Israel: As I am, so art thou: my people and thy people are one: and my horsemen, thy horsemen. And Josaphat said to the king of Israel: Inquire, I beseech thee, this day, the word of the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "congregavit ergo rex Israhel prophetas quadringentos circiter viros et ait ad eos ire debeo in Ramoth Galaad ad bellandum an quiescere qui responderunt ascende et dabit Dominus in manu regis"
      en: "Then the king of Israel assembled the prophets, about four hundred men, and he said to them: Shall I go to Ramoth Galaad to fight, or shall I forbear? They answered: Go up, and the Lord will deliver it into the hand of the king."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixit autem Iosaphat non est hic propheta Domini quispiam ut interrogemus per eum"
      en: "And Josaphat said: Is there not here some prophet of the Lord, that we may inquire by him?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et ait rex Israhel ad Iosaphat remansit vir unus per quem possimus interrogare Dominum sed ego odi eum quia non prophetat mihi bonum sed malum Micheas filius Hiemla cui Iosaphat ait ne loquaris ita rex"
      en: "And the king of Israel said to Josaphat: There is one man left, by whom we may inquire of the Lord: Micheas the son of Jemla; but I hate him, for he doth not prophesy good to me, but evil. And Josaphat said: Speak not so, O king."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "vocavit ergo rex Israhel eunuchum quendam et dixit ei festina adducere Micheam filium Hiemla"
      en: "Then the king of Israel called an eunuch, and said to him: Make haste, and bring hither Micheas the son of Jemla."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "rex autem Israhel et Iosaphat rex Iuda sedebat unusquisque in solio suo vestiti cultu regio in area iuxta ostium portae Samariae et universi prophetae prophetabant in conspectu eorum"
      en: "Then the king of Israel, and Josaphat king of Juda, sat each on his throne clothed with royal robes, in a court by the entrance of the gate of Samaria, and all the prophets prophesied before them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "fecit quoque sibi Sedecias filius Chanaan cornua ferrea et ait haec dicit Dominus his ventilabis Syriam donec deleas eam"
      en: "And Sedecias the son of Chanaana made himself horns of iron, and said: Thus saith the Lord: With these shalt thou push Syria, till thou destroy it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "omnesque prophetae similiter prophetabant dicentes ascende in Ramoth Galaad et vade prospere et tradet Dominus in manu regis"
      en: "And all the prophets prophesied in like manner, saying: Go up to Ramoth Galaad, and prosper, for the Lord will deliver it into the king's hands."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "nuntius vero qui ierat ut vocaret Micheam locutus est ad eum dicens ecce sermones prophetarum ore uno bona regi praedicant sit ergo et sermo tuus similis eorum et loquere bona"
      en: "And the messenger, that went to call Micheas, spoke to him, saying: Behold the words of the prophets with one month declare good things to the king: let thy word therefore be like to theirs, and speak that which is good."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "cui Micheas ait vivit Dominus quia quodcumque dixerit mihi Dominus hoc loquar"
      en: "But Micheas said to him: As the Lord liveth, whatsoever the Lord shall say to me, that will I speak."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "venit itaque ad regem et ait illi rex Michea ire debemus in Ramoth Galaad ad proeliandum an cessare cui ille respondit ascende et vade prospere et tradet Dominus in manu regis"
      en: "So he came to the king, and the king said to him: Micheas, shall we go to Ramoth Galaad to battle, or shall we forbear? He answered him: Go up, and prosper, and the Lord shall deliver it into the king's hands."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixit autem rex ad eum iterum atque iterum adiuro te ut non loquaris mihi nisi quod verum est in nomine Domini"
      en: "But the king said to him: I adjure thee again and again, that thou tell me nothing but that which is true in the name of the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ille ait vidi cunctum Israhel dispersum in montibus quasi oves non habentes pastorem et ait Dominus non habent dominum isti revertatur unusquisque in domum suam in pace"
      en: "And he said: I saw all Israel scattered upon the hills, like sheep that have no shepherd: and the Lord said: These have no master: let every man of them return to his house in peace."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dixit ergo rex Israhel ad Iosaphat numquid non dixi tibi quia non prophetat mihi bonum sed semper malum"
      en: "(Then the king of Israel said to Josaphat: Did I not tell thee, that he prophesieth no good to me, but always evil ?)"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ille vero addens ait propterea audi sermonem Domini vidi Dominum sedentem super solium suum et omnem exercitum caeli adsistentem ei a dextris et a sinistris"
      en: "And he added and said: Hear thou therefore the word of the Lord: I saw the Lord sitting on his throne, and all the army of heaven standing by him on the right hand and on the left:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et ait Dominus quis decipiet Ahab regem Israhel ut ascendat et cadat in Ramoth Galaad et dixit unus verba huiuscemodi et alius aliter"
      en: "And the Lord said: Who shall deceive Achab king of Israel, that he may go up, and fall at Ramoth Galaad? And one spoke words of this manner, and another otherwise."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "egressus est autem spiritus et stetit coram Domino et ait ego decipiam illum cui locutus est Dominus in quo"
      en: "And there came forth a spirit, and stood before the Lord, and said: I will deceive him. And the Lord said to him: By what means?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et ille ait egrediar et ero spiritus mendax in ore omnium prophetarum eius et dixit Dominus decipies et praevalebis egredere et fac ita"
      en: "And he said: I will go forth, and be a lying spirit in the mouth of all his prophets. And the Lord said: Thou shalt deceive him, and shalt prevail: a go forth, and do so."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "nunc igitur ecce dedit Dominus spiritum mendacii in ore omnium prophetarum tuorum qui hic sunt et Dominus locutus est contra te malum"
      en: "Now therefore behold the Lord hath given a lying spirit in the mouth of all thy prophets that are here, and the Lord hath spoken evil against thee."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "accessit autem Sedecias filius Chanaan et percussit Micheam in maxillam et dixit mene ergo dimisit spiritus Domini et locutus est tibi"
      en: "And Sedecias the son of Chanaana came, and struck Micheas on the cheek, and said: Hath then the spirit of the Lord left me, and spoken to thee?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et ait Micheas visurus es in die illa quando ingredieris cubiculum intra cubiculum ut abscondaris"
      en: "And Micheas said: Thou shalt see in the day when thou shalt go into a chamber within a chamber to hide thyself."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et ait rex Israhel tollite Micheam et maneat apud Amon principem civitatis et apud Ioas filium Ammelech"
      en: "And the king of Israel said: Take Micheas, and let him abide with Ammon the governor of the city, and with Joas the son of Amalech."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et dicite eis haec dicit rex mittite virum istum in carcerem et sustentate eum pane tribulationis et aqua angustiae donec revertar in pace"
      en: "And tell them: Thus saith the king: Put this man in prison, and feed him with bread of affliction, and water of distress, till I return in peace."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "dixitque Micheas si reversus fueris in pace non est locutus Dominus in me et ait audite populi omnes"
      en: "And Micheas said: If thou return in peace, the Lord hath not spoken by me. And he said: Hear, all ye people."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ascendit itaque rex Israhel et Iosaphat rex Iuda in Ramoth Galaad"
      en: "So the king of Israel, and Josaphat king of Juda went up to Ramoth Galaad."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "dixitque rex Israhel ad Iosaphat sume arma et ingredere proelium et induere vestibus tuis porro rex Israhel mutavit habitum et ingressus est bellum"
      en: "And the king of Israel said to Josaphat: Take armour, and go into the battle, and put on thy own garments. But the king of Israel changed his dress, and went into the battle."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "rex autem Syriae praeceperat principibus curruum triginta duobus dicens non pugnabitis contra minorem et maiorem quempiam nisi contra regem Israhel solum"
      en: "And the king of Syria had commanded the two and thirty captains of the chariots, saying: You shall not fight against any, small or great, but against the king of Israel only."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "cum ergo vidissent principes curruum Iosaphat suspicati sunt quod ipse esset rex Israhel et impetu facto pugnabant contra eum et exclamavit Iosaphat"
      en: "So when the captains of the chariots saw Josaphat, they suspected that he was the king of Israel, and making a violent assault they fought against him: and Josaphat cried out."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "intellexeruntque principes curruum quod non esset rex Israhel et cessaverunt ab eo"
      en: "And the captains of the chariots perceived that he was not the king of and they turned away from him."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "unus autem quidam tetendit arcum in incertum sagittam dirigens et casu percussit regem Israhel inter pulmonem et stomachum at ille dixit aurigae suo verte manum tuam et eice me de exercitu quia graviter vulneratus sum"
      en: "And a certain man bent his bow, shooting at a venture, and chanced to strike the king of Israel between the lungs and the stomach. But he said to the driver of his chariot: Turn thy hand, and carry me out of the army, for I am grievously wounded."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "commissum est ergo proelium in die illa et rex Israhel stabat in curru suo contra Syros et mortuus est vesperi fluebat autem sanguis plagae in sinum currus"
      en: "And the battle was fought that day, and the king of Israel stood in his chariot against the Syrians, and he died in the evening: and the blood ran out of the wound into the midst of the chariot."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et praeco personuit in universo exercitu antequam sol occumberet dicens unusquisque revertatur in civitatem et in terram suam"
      en: "And the herald proclaimed through all the army before the sun set, saying: Let every man return to his own city, and to his own country."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "mortuus est autem rex et perlatus est Samariam sepelieruntque regem in Samaria"
      en: "And the king died, b and was carried into Samaria: and they buried the king in Samaria."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et laverunt currum in piscina Samariae et linxerunt canes sanguinem eius et habenas laverunt iuxta verbum Domini quod locutus fuerat"
      en: "And they washed his chariot in the pool of Samaria, and the dogs licked up his blood, and they washed the reins, according to the word of the Lord which he had spoken."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "reliqua vero sermonum Ahab et universa quae fecit et domus eburneae quam aedificavit cunctarumque urbium quas extruxit nonne scripta sunt haec in libro verborum dierum regum Israhel"
      en: "But the rest of the acts of Achab, and all that he did, and the house of ivory that he made, and all the cities that he built, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "dormivit ergo Ahab cum patribus suis et regnavit Ohozias filius eius pro eo"
      en: "So Achab slept with his fathers, and Ochozias his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Iosaphat filius Asa regnare coeperat super Iudam anno quarto Ahab regis Israhel"
      en: "But Josaphat the son of Asa began to reign over Juda in the fourth year of Achab king of Israel."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "triginta quinque annorum erat cum regnare coepisset et viginti et quinque annos regnavit in Hierusalem nomen matris eius Azuba filia Salai"
      en: "He was five and thirty years old when he began to reign, and he reigned five and twenty years in Jerusalem: the name of his mother was Azuba the daughter of Salai."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et ambulavit in omni via Asa patris sui et non declinavit ex ea fecitque quod rectum est in conspectu Domini"
      en: "And he walked in all the way of Asa his father, and he declined not from it: and he did that which was right in the sight of the Lord."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "verumtamen excelsa non abstulit adhuc enim populus sacrificabat et adolebat incensum in excelsis"
      en: "Nevertheless he took not away the high places: for as Set the people offered sacrifices and burnt incense in the high places."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "pacemque habuit Iosaphat cum rege Israhel"
      en: "And Josaphat had peace with the king of Israel."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "reliqua autem verborum Iosaphat et opera eius quae gessit et proelia nonne haec scripta sunt in libro verborum dierum regum Iuda"
      en: "But the rest of the acts of Josaphat, and his works which he did, and his bat- ties, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "sed et reliquias effeminatorum qui remanserant in diebus Asa patris eius abstulit de terra"
      en: "And the remnant also of the effeminate, who remained in the days of Asa his father, he took out of the land."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "nec erat tunc rex constitutus in Edom"
      en: "And there was then no king appointed in Edom."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "rex vero Iosaphat fecerat classes in mari quae navigarent in Ophir propter aurum et ire non potuerunt quia confractae sunt in Asiongaber"
      en: "But king Josaphat made navies on the sea, to sail into Ophir for gold: but they could not go, for the ships were broken in Asiongaber."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "tunc ait Ohozias filius Ahab ad Iosaphat vadant servi mei cum servis tuis in navibus et noluit Iosaphat"
      en: "Then Ochozias the ton of Achab said to Josaphat: Let my servants go with thy servants in the ships. And Josaphat would not."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "dormivitque cum patribus suis et sepultus est cum eis in civitate David patris sui regnavitque Ioram filius eius pro eo"
      en: "And Josaphat slept with his fathers. and was buried with them in the city of David his father: and Joram his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Ohozias autem filius Ahab regnare coeperat super Israhel in Samaria anno septimodecimo Iosaphat regis Iuda regnavitque super Israhel duobus annis"
      en: "And Ochozias the son of Achab began to reign over Israel in Samaria, in the seventeenth gear of Josaphat king of Juda, and he reigned over Israel two years,"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "et fecit malum in conspectu Domini et ambulavit in via patris sui et matris suae et in via Hieroboam filii Nabath qui peccare fecit Israhel"
      en: "And he did evil in the sight of the Lord, and walked in the way of his father and his mother, and in the way of Jeroboam the son of Nabat, who made Israel to sin."
    status: { la: verified, en: verified }
