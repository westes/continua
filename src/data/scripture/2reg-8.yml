# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2reg
chapter: 8
verses:
  - n: 1
    text:
      la: "factum est autem post haec percussit David Philisthim et humiliavit eos et tulit David frenum tributi de manu Philisthim"
      en: "And it came to pass after this that David defeated the Philistines, and brought them down, and David took the bridle of tribute out of the hand of the Philistines."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et percussit Moab et mensus est eos funiculo coaequans terrae mensus est autem duos funiculos unum ad occidendum et unum ad vivificandum factusque est Moab David serviens sub tributo"
      en: "And he defeated Moab, and measured them with a line, casting them down to the earth: and he measured with two lines, one to put to death, and one to save alive: and Moab was made to serve David under tribute."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et percussit David Adadezer filium Roob regem Soba quando profectus est ut dominaretur super flumen Eufraten"
      en: "David defeated also Adarezer the son of Rohob king of Soba, when he went to extend his dominion over the river Euphrates."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et captis David ex parte eius mille septingentis equitibus et viginti milibus peditum subnervavit omnes iugales curruum dereliquit autem ex eis centum currus"
      en: "And David took from him a thousand and seven hundred horsemen, and twenty thousand footmen, and houghed all the chariot horses: and only reserved of them for one hundred chariots."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "venit quoque Syria Damasci ut praesidium ferret Adadezer regi Soba et percussit David de Syria viginti duo milia virorum"
      en: "And the Syrians of Damascus came to succour Adarezer the king of Soba: and David slew of the Syrians two and twenty thousand men."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et posuit David praesidium in Syria Damasci factaque est Syria David serviens sub tributo servavit Dominus David in omnibus ad quaecumque profectus est"
      en: "And David put garrisons in Syria of Damascus: and Syria served David under tribute: and the Lord preserved David in all his enterprises, whithersoever he went."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et tulit David arma aurea quae habebant servi Adadezer et detulit ea in Hierusalem"
      en: "And David took the arms of gold, which the servants of Adarezer wore, and brought them to Jerusalem."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et de Bete et de Beroth civitatibus Adadezer tulit rex David aes multum nimis"
      en: "And out of Bete, and out of Beroth, cities of Adarezer, king David took an exceeding great quantity of brass."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "audivit autem Thou rex Emath quod percussisset David omne robur Adadezer"
      en: "And Thou the king of Emath heard that David had defeated all the forces of Adarezer."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et misit Thou Ioram filium suum ad regem David ut salutaret eum congratulans et gratias ageret eo quod expugnasset Adadezer et percussisset eum hostis quippe erat Thou Adadezer et in manu eius erant vasa argentea et vasa aurea et vasa aerea"
      en: "And Thou sent Joram his son to king David, to salute him, and to congratulate with him, and to return him thanks: because he had fought against Adarezer, and had defeated him. For Thou was an enemy to Adarezer, and in his hand were vessels of gold, and vessels of silver, and vessels of brass:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quae et ipsa sanctificavit rex David Domino cum argento et auro quae sanctificaverat de universis gentibus quas subegerat"
      en: "And king David dedicated them to the Lord, together with the silver and gold that he had dedicated of all the nations, which he had subdued:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "de Syria et Moab et filiis Ammon et Philisthim et Amalech et de manubiis Adadezer filii Roob regis Soba"
      en: "Of Syria, and of Moab, and of the children of Ammon, and of the Philistines, and of Amalec, and of the spoils of Adarezer the son of Rohob king of Soba."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "fecit quoque sibi David nomen cum reverteretur capta Syria in valle Salinarum caesis duodecim milibus"
      en: "David also made himself a name, when he returned after taking Syria in the valley of the saltpits, killing eighteen thousand:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et posuit in Idumea custodes statuitque praesidium et facta est universa Idumea serviens David et servavit Dominus David in omnibus ad quaecumque profectus est"
      en: "And he put guards in Edom, and placed there a garrison: and all Edom was made to serve David: and the Lord preserved David in all enterprises he went about."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et regnavit David super omnem Israhel faciebat quoque David iudicium et iustitiam omni populo suo"
      en: "And David reigned over all Israel: and David did judgment and justice to all his people."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ioab autem filius Sarviae erat super exercitum porro Iosaphat filius Ahilud erat a commentariis"
      en: "And Joab the son of Sarvia was over the army: and Josaphat the son of Ahilud was recorder:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et Sadoc filius Achitob et Ahimelech filius Abiathar sacerdotes et Saraias scriba"
      en: "And Sadoc the son of Achitob, and Achimelech the son of Abiathar, were the priests: and Saraias was the scribe:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Banaias autem filius Ioiada super Cherethi et Felethi filii autem David sacerdotes erant"
      en: "And Banaias the son of Joiada was over the Cerethi and Phelethi: and the sons of David were the princes."
    status: { la: verified, en: verified }
