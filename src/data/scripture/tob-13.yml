# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: tob
chapter: 13
verses:
  - n: 1
    text:
      la: "Aperiens autem Tobias senior os suum, benedixit Dominum, et dixit: Magnus es, Domine, in aeternum, et in omnia saecula regnum tuum:"
      en: "And Tobias the elder opening his mouth, blessed the Lord, and said: Thou art great, O Lord, for ever, and thy kingdom is unto all ages:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quoniam tu flagellas, et salvas: deducis ad inferos, et reducis: et non est qui effugiat manum tuam."
      en: "For thou scourgest, and thou savest: thou leadest down to hell, and bringest up again: and there is none that can escape thy hand."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Confitemini Domino, filii Israel, et in conspectu gentium laudate eum:"
      en: "Give glory to the Lord, ye children of Israel, and praise him in the sight of the Gentiles:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quoniam ideo dispersit vos inter gentes, quae ignorant eum, ut vos enarretis mirabilia ejus, et faciatis scire eos quia non est alius deus omnipotens praeter eum."
      en: "Because he hath therefore scattered you among the Gentiles, who know not him, that you may declare his wonderful works, and make them know that there is no other almighty God besides him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ipse castigavit nos propter iniquitates nostras, et ipse salvabit nos propter misericordiam suam."
      en: "He hath chastised us for our iniquities: and he will save us for his own mercy."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Aspicite ergo quae fecit nobiscum, et cum timore et tremore confitemini illi: regemque saeculorum exaltate in operibus vestris."
      en: "See then what he hath done with us, and with fear and trembling give ye glory to him: and extol the eternal King of worlds in your works."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ego autem in terra captivitatis meae confitebor illi: quoniam ostendit majestatem suam in gentem peccatricem."
      en: "As for me, I will praise him in the land of my captivity: because he hath shewn his majesty toward a sinful nation."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Convertimini itaque peccatores, et facite justitiam coram Deo, credentes quod faciat vobiscum misericordiam suam."
      en: "Be converted therefore, ye sinners, and do justice before God, believing that he will shew his mercy to you."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ego autem, et anima mea in eo laetabimur."
      en: "And I and my soul will rejoice in him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Benedicite Dominum omnes electi ejus: agite dies laetitiae, et confitemini illi."
      en: "Bless ye the Lord, all his elect, keep days of joy, and give glory to him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Jerusalem civitas Dei, castigavit te Dominus in operibus manuum tuarum."
      en: "Jerusalem, city of God, the Lord hath chastised thee for the works of thy hands."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Confitere Domino in bonis tuis, et benedic Deum saeculorum: ut reaedificet in te tabernaculum suum, et revocet ad te omnes captivos, et gaudeas in omnia saecula saeculorum."
      en: "Give glory to the Lord for thy good things, and bless the God eternal, that he may rebuild his tabernacle in thee, and may call back all the captives to thee, and thou mayst rejoice for ever and ever."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Luce splendida fulgebis: et omnes fines terrae adorabunt te."
      en: "Thou shalt shine with a glorious light: and all the ends of the earth shall worship thee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Nationes ex longinquo ad te venient, et munera deferentes adorabunt in te Dominum, et terram tuam in sanctificationem habebunt:"
      en: "Nations from afar shall come to thee: and shall bring gifts, and shall adore the Lord in thee, and shall esteem thy land as holy."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "nomen enim magnum invocabunt in te."
      en: "For they shall call upon the great name in thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Maledicti erunt qui contempserint te, et condemnati erunt omnes qui blasphemaverint te: benedictique erunt qui aedificaverint te."
      en: "They shall be cursed that shall despise thee: and they shall be condemned that shall blaspheme thee: and blessed shall they be that shall build thee up."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Tu autem laetaberis in filiis tuis, quoniam omnes benedicentur, et congregabuntur ad Dominum."
      en: "But thou shalt rejoice in thy children, because they shall all be blessed, and shall be gathered together to the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Beati omnes qui diligunt te, et qui gaudent super pace tua."
      en: "Blessed are all they that love thee, and that rejoice in thy peace."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Anima mea, benedic Dominum, quoniam liberavit Jerusalem civitatem suam a cunctis tribulationibus ejus Dominus Deus noster."
      en: "My soul, bless thou the Lord, because the Lord our God hath delivered Jerusalem his city from all her troubles."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Beatus ero si fuerint reliquiae seminis mei ad videndam claritatem Jerusalem."
      en: "Happy shall I be if there shall remain of my seed, to see the glory of Jerusalem."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Portae Jerusalem ex sapphiro et smaragdo aedificabuntur, et ex lapide pretioso omnis circuitus murorum ejus."
      en: "The gates of Jerusalem shall be built of sapphire, and of emerald, and all the walls thereof round about of precious stones."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ex lapide candido et mundo omnes plateae ejus sternentur: et per vicos ejus, Alleluia cantabitur."
      en: "All its streets shall be paved with white and clean stones: and Alleluia shall be sung in its streets."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Benedictus Dominus, qui exaltavit eam, et sit regnum ejus in saecula saeculorum super eam. Amen."
      en: "Blessed be the Lord, who hath exalted it, and may he reign over it for ever and ever, Amen."
    status: { la: verified, en: verified }
