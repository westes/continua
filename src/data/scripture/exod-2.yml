# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 2
verses:
  - n: 1
    text:
      la: "Egressus est post haec vir de domo Levi: et accepit uxorem stirpis suae."
      en: "After this there went a man of the house of Levi; and took a wife of his own kindred."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quae concepit, et peperit filium: et videns eum elegantem, abscondit tribus mensibus."
      en: "And she conceived, and bore a son; and seeing him a goodly child hid him three months."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cumque jam celare non posset, sumpsit fiscellam scirpeam, et linivit eam bitumine ac pice: posuitque intus infantulum, et exposuit eum in carecto ripae fluminis,"
      en: "And when she could hide him no longer, she took a basket made of bulrushes, and daubed it with slime and pitch: and put the little babe therein, and laid him in the sedges by the river's brink,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "stante procul sorore ejus, et considerante eventum rei."
      en: "His sister standing afar off, and taking notice what would be done."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ecce autem descendebat filia Pharaonis ut lavaretur in flumine: et puellae ejus gradiebantur per crepidinem alvei. Quae cum vidisset fiscellam in papyrione, misit unam e famulabus suis: et allatam"
      en: "And behold the daughter of Pharao came down to wash herself in the river: and her maids walked by the river's brink. And when she saw the basket in the sedges, she sent one of her maids for it: and when it was brought,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "aperiens, cernensque in ea parvulum vagientem, miserta ejus, ait: De infantibus Hebraeorum est hic."
      en: "She opened it and seeing within it an infant crying, having compassion on it she said: This is one of the babes of the Hebrews."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cui soror pueri: Vis, inquit, ut vadam, et vocem tibi mulierem hebraeam, quae nutrire posset infantulum?"
      en: "And the child's sister said to her Shall I go and call to thee a Hebrew woman, to nurse the babe?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Respondit: Vade. Perrexit puella et vocavit matrem suam."
      en: "She answered: Go. The maid went and called her mother."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ad quam locuta filia Pharaonis: Accipe, ait, puerum istum, et nutri mihi: ego dabo tibi mercedem tuam. Suscepit mulier, et nutrivit puerum: adultumque tradidit filiae Pharaonis."
      en: "And Pharao's daughter said to her. Take this child and nurse him for me: I will give thee thy wages. The woman took, and nursed the child: and when he was grown up, she delivered him to Pharao's daughter."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quem illa adoptavit in locum filii, vocavitque nomen ejus Moyses, dicens: Quia de aqua tuli eum."
      en: "And she adopted him for a son, and called him Moses, saying: Because I took him out of the water."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "In diebus illis postquam creverat Moyses, egressus est ad fratres suos: viditque afflictionem eorum, et virum aegyptium percutientem quemdam de Hebraeis fratribus suis."
      en: "In those days after Moses was grown up, he went out to his brethren: and saw their affliction, and an Egyptian striking one of the Hebrews his brethren."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cumque circumspexisset huc atque illuc, et nullum adesse vidisset, percussum Aegyptium abscondit sabulo."
      en: "And when he had looked about this way and that way, and saw no one there, he slew the Egyptian and hid him in the sand."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et egressus die altero conspexit duos Hebraeos rixantes: dixitque ei qui faciebat injuriam: Quare percutis proximum tuum?"
      en: "And going out the next day, he saw two Hebrews quarrelling: and he said to him that did the wrong: Why strikest thou thy neighbour?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Qui respondit: Quis te constituit principem et judicem super nos? num occidere me tu vis, sicut heri occidisti Aegyptium? Timuit Moyses, et ait: Quomodo palam factum est verbum istud?"
      en: "But he answered: Who hath appointed thee prince and judge over us? Wilt thou kill me, as thou didst yesterday kill the Egyptian? Moses feared, and said: How is this come to be known?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Audivitque Pharao sermonem hunc, et quaerebat occidere Moysen: qui fugiens de conspectu ejus, moratus est in terra Madian, et sedit juxta puteum."
      en: "And Pharao heard of this word and sought to kill Moses: but he fled from his sight, and abode in the land of Madian, and he sat down by a well."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Erant autem sacerdoti Madian septem filiae, quae venerunt ad hauriendam aquam: et impletis canalibus adaquare cupiebant greges patris sui."
      en: "And the priest of Madian had seven daughters, who came to draw water: and when the troughs were filled, desired to water their father's flocks."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Supervenere pastores, et ejecerunt eas: surrexitque Moyses, et defensis puellis, adaquavit oves earum."
      en: "And the shepherds came and drove them away: and Moses arose, and defending the maids, watered their sheep."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quae cum revertissent ad Raguel patrem suum, dixit ad eas: Cur velocius venistis solito?"
      en: "And when they returned to Raguel their father, he said to them: Why are ye come sooner than usual?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Responderunt: Vir aegyptius liberavit nos de manu pastorum: insuper et hausit aquam nobiscum, potumque dedit ovibus."
      en: "They answered: A man of Egypt delivered us from the hands of the shepherds: and he drew water also with us, and gave the sheep to drink."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "At ille: Ubi est? inquit: quare dimisistis hominem? vocate eum ut comedat panem."
      en: "But he said: Where is he? why have you let the man go? call him that he may eat bread."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Juravit ergo Moyses quod habitaret cum eo. Accepitque Sephoram filiam ejus uxorem:"
      en: "And Moses swore that he would dwell with him. And he took Sephora his daughter to wife:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quae peperit ei filium, quem vocavit Gersam, dicens: Advena fui in terra aliena. Alterum vero peperit, quem vocavit Eliezer, dicens: Deus enim patris mei adjutor meus eripuit me de manu Pharaonis."
      en: "And she bore him a son, whom he called Gersam, saying: I have been a stranger in a foreign country. And she bore another, whom he called Eliezer, saying: For the God of my father, my helper hath delivered me out of the hand of Pharao."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Post multum vero tempore mortuus est rex Aegypti: et ingemiscentes filii Israel, propter opera vociferati sunt: ascenditque clamor eorum ad Deum ab operibus."
      en: "Now after a long time the king of Egypt died: and the children of Israel groaning, cried out because of the works: and their cry went up unto God from the works."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et audivit gemitum eorum, ac recordatus est foederis quod pepigit cum Abraham, Isaac et Jacob."
      en: "And he heard their groaning, and remembered the covenant which he made with Abraham, Isaac, and Jacob."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et respexit Dominus filios Israel et cognovit eos."
      en: "And the Lord looked upon the children of Israel, and he knew them."
    status: { la: verified, en: verified }
