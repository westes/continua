# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: prov
chapter: 29
verses:
  - n: 1
    text:
      la: "viro qui corripientem dura cervice contemnit repentinus superveniet interitus et eum sanitas non sequitur"
      en: "The man that with a stiff neck despiseth him that reproveth him, shall suddenly be destroyed: and health shall not follow him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in multiplicatione iustorum laetabitur vulgus cum impii sumpserint principatum gemet populus"
      en: "When just men increase, the people shall rejoice: when the wicked shall bear rule, the people shall mourn."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "vir qui amat sapientiam laetificat patrem suum qui autem nutrit scorta perdet substantiam"
      en: "A man that loveth wisdom, rejoiceth his father: but he that maintaineth bar lots, shall squander away his substance."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "rex iustus erigit terram vir avarus destruet eam"
      en: "A just king setteth up the land: a covetous man shall destroy it."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "homo qui blandis fictisque sermonibus loquitur amico suo rete expandit gressibus eius"
      en: "A man that speaketh to his friend with flattering and dissembling words, spreadeth a net for his feet."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "peccantem virum iniquum involvet laqueus et iustus laudabit atque gaudebit"
      en: "A snare shall entangle the wicked man when he sinneth: and the just shall praise and rejoice."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "novit iustus causam pauperum impius ignorat scientiam"
      en: "The just taketh notice of the cause of the poor: the wicked is void of knowledge."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "homines pestilentes dissipant civitatem sapientes avertunt furorem"
      en: "Corrupt men bring a city to ruin: but wise men turn away wrath."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "vir sapiens si cum stulto contenderit sive irascatur sive rideat non inveniet requiem"
      en: "If a wise man contend with a fool, whether he be angry or laugh, he shall find no rest."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "viri sanguinum oderunt simplicem iusti quaerunt animam eius"
      en: "Bloodthirsty men hate the upright: but just men seek his soul."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "totum spiritum suum profert stultus sapiens differt et reservat in posterum"
      en: "A fool uttereth all his mind: a wise man deferreth, and keepeth it till afterwards."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "princeps qui libenter audit verba mendacii omnes ministros habebit impios"
      en: "A prince that gladly heareth lying words, hath all his servants wicked."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "pauper et creditor obviam fuerunt sibi utriusque inluminator est Dominus"
      en: "The poor man and the creditor have met one another: the Lord is the enlightener of them both."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "rex qui iudicat in veritate pauperes thronus eius in aeternum firmabitur"
      en: "The king that judgeth the poor in truth, his throne shall be established for ever."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "virga atque correptio tribuet sapientiam puer autem qui dimittitur voluntati suae confundet matrem suam"
      en: "The rod and reproof give wisdom: but the child that is left to his own will bringeth his mother to shame."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "in multiplicatione impiorum multiplicabuntur scelera et iusti ruinas eorum videbunt"
      en: "When the wicked are multiplied, crimes shall be multiplied: but the just shall see their downfall."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "erudi filium tuum et refrigerabit te et dabit delicias animae tuae"
      en: "Instruct thy son, and he shall refresh thee, and shall give delight to thy soul."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cum prophetia defecerit dissipabitur populus qui custodit legem beatus est"
      en: "When prophecy shall fail, the people shall be scattered abroad: but he that keepeth the law is blessed."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "servus verbis non potest erudiri quia quod dicis intellegit et respondere contemnit"
      en: "A slave will not be corrected by words: because he understandeth what thou sayest, and will not answer."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "vidisti hominem velocem ad loquendum stulti magis speranda est quam illius correptio"
      en: "Hast thou seen a man hasty to speak? folly is rather to be looked for, than his amendment."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui delicate a pueritia nutrit servum suum postea illum sentiet contumacem"
      en: "He that nourisheth his servant delicately from his childhood, afterwards shall find him stubborn."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "vir iracundus provocat rixas et qui ad indignandum facilis est erit ad peccata proclivior"
      en: "A passionate man provoketh quarrels: and he that is easily stirred up to wrath, shall be more prone to sin."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "superbum sequitur humilitas et humilem spiritu suscipiet gloria"
      en: "Humiliation followeth the proud: and glory shall uphold the humble of spirit."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "qui cum fure partitur odit animam suam adiurantem audit et non indicat"
      en: "He that is partaker with a thief, hateth his own soul: he heareth one putting him to his oath, and discovereth not."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "qui timet hominem cito corruet qui sperat in Domino sublevabitur"
      en: "He that feareth man, shall quickly fall: he that trusteth in the Lord, shall be set on high."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "multi requirunt faciem principis et a Domino iudicium egreditur singulorum"
      en: "Many seek the face of the prince: but the judgment of every one cometh forth from the Lord."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "abominantur iusti virum impium et abominantur impii eos qui in recta sunt via"
      en: "The just abhor the wicked man: and the wicked loathe them that are in the right way. The son that keepeth the word, shall be free from destruction."
    status: { la: verified, en: verified }
