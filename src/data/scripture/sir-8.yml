# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 8
verses:
  - n: 1
    text:
      la: "non litiges cum homine potente ne forte incidas in manus illius"
      en: "Strive not with a powerful man, lest thou fall into his hands."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "non contendas cum viro locuplete ne forte contra consistat litem tibi"
      en: "Contend not with a rich man, lest he bring an action against thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "multos perdidit aurum atque argentum et usque cor regum extendit et convertit"
      en: "For gold and silver hath destroyed many, and hath reached even to the heart of kings, and perverted them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "non litiges cum homine linguato et non strues in igne illius ligna"
      en: "Strive not with a man that is full of tongue, and heap not wood upon his fire."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "non communices homini indocto ne male de progenie tua loquatur"
      en: "Communicate not with an ignorant man, lest he speak ill of thy family."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ne despicias hominem avertentem se a peccato neque inproperes ei memento quoniam omnes sumus in correptionem"
      en: "Despise not a man that turneth away from sin, nor reproach him therewith: remember that we are all worthy of reproof."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ne spernas hominem in sua senecta etenim ex nobis senescunt"
      en: "Despise not a man in his old age; for we also shall become old."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "noli de mortuo gaudere sciens quoniam omnes morimur et in gaudium nolumus venire"
      en: "Rejoice not at the death of thy enemy; knowing that we all die, and are not willing that others should rejoice at our death."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ne despicias narrationem presbyterorum sapientium et in proverbiis illorum conversare"
      en: "Despise not the discourse of them that are ancient and wise, but acquaint thyself with their proverbs."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ab ipsis enim disces doctrinam intellectus et servire magnatis sine querella"
      en: "For of them thou shalt learn wisdom, and instruction of understanding, and to serve great men without blame."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "non te praetereat narratio seniorum et ipsi enim didicerunt a patribus suis"
      en: "Let not the discourse of the ancients escape thee, for they have learned of their fathers:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quoniam ab ipsis disces intellectum et in tempore necessitatis responsum"
      en: "For of them thou shalt learn understanding, and to give an answer in time of need."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "non incendas carbones peccatoris arguens eos ne incendaris flamma ignis peccatorum illorum"
      en: "Kindle not the coals of sinners by rebuking them, lest thou be burnt with the flame of the fire of their sins."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ne contra faciem stes contumeliosi ne sedeat quasi insidiator ori tuo"
      en: "Stand not against the face of an injurious person, lest he sit as a spy to entrap thee in thy words."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "noli fenerare homini fortiori te quod si feneraveris tamquam perditum habe"
      en: "Lend not to a man that is mightier than thyself: and if thou lendest, count it as lost."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "non spondeas super virtutem tuam quod si spoponderis quasi restituens cogita"
      en: "Be not surety above thy power: and if thou be surety, think as if thou wert to pay it."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "non iudices contra iudicem quoniam secundum quod dignum est iudicat"
      en: "Judge not against a judge: for he judgeth according to that which is just."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cum audace non eas in via ne forte gravet mala sua in te ipse enim secundum voluntatem suam vadit et simul cum stultitia illius peries"
      en: "Go not on the way with a bold man, lest he burden thee with his evils: for he goeth according to his own will, and thou shalt perish together with his folly."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "cum iracundo non facias rixam cum audace non eas in desertum quoniam quasi nihil est ante illum sanguis et ubi non est adiutorium elidet te"
      en: "Quarrel not with a passionate man, and go not into the desert with a bold man: for blood is as nothing in his sight, and where there is no help he will overthrow thee."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "cum fatuis ne consilium habeas non enim poterunt diligere nisi quae ipsis placent"
      en: "Advise not with fools, for they cannot love but such things as please them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "coram extraneo ne facias consilium nescis enim quid pariet"
      en: "Before a stranger do no matter of counsel: for thou knowest not what he will bring forth."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "non omni homini cor tuum manifestes ne forte inferat tibi gratiam et convicietur tibi"
      en: "Open not thy heart to every man: lest he repay thee with an evil turn, and speak reproachfully to thee."
    status: { la: verified, en: verified }
