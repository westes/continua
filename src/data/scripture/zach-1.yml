# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: zach
chapter: 1
verses:
  - n: 1
    text:
      la: "in mense octavo in anno secundo Darii factum est verbum Domini ad Zacchariam filium Barachiae filium Addo prophetam dicens"
      en: "In the eighth month, in the second year of king Darius, the word of the Lord came to Zacharias the son of Barachias, the son of Addo, the prophet, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "iratus est Dominus super patres vestros iracundia"
      en: "The Lord hath been exceeding angry with your fathers."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dices ad eos haec dicit Dominus exercituum convertimini ad me ait Dominus exercituum et convertar ad vos dicit Dominus exercituum"
      en: "And thou shalt say to them: Thus saith the Lord of hosts: Turn ye to me, saith the Lord of hosts: and I will turn to you, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ne sitis sicut patres vestri ad quos clamabant prophetae priores dicentes haec dicit Dominus exercituum convertimini de viis vestris malis et cogitationibus vestris pessimis et non audierunt neque adtenderunt ad me dicit Dominus"
      en: "Be not as your fathers, to whom the former prophets have cried, saying: Thus saith the Lord of hosts: Turn ye from your evil ways, and from your wicked thoughts: but they did not give ear, neither did they hearken to me, saith the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "patres vestri ubi sunt et prophetae numquid in sempiternum vivent"
      en: "Your fathers, where are they? and the prophets, shall they live always?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "verumtamen verba mea et legitima mea quae mandavi servis meis prophetis numquid non conprehenderunt patres vestros et conversi sunt et dixerunt sicut cogitavit Dominus exercituum facere nobis secundum vias nostras et secundum adinventiones nostras fecit nobis"
      en: "But yet my words, and my ordinances, which I gave in charge to my servants the prophets, did they not take hold of your fathers, and they returned, and said: As the Lord of hosts thought to do to us according to our ways, and according to our devices, so he hath done to us."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in die vicesima et quarta undecimo mense sabath in anno secundo Darii factum est verbum Domini ad Zacchariam filium Barachiae filium Addo prophetam dicens"
      en: "In the four and twentieth day of the eleventh month which is called Sabath, in the second year of Darius, the word of the Lord came to Zacharias the son of Barachias, the son of Addo, the prophet, saying:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "vidi per noctem et ecce vir ascendens super equum rufum et ipse stabat inter myrteta quae erant in profundo et post eum equi rufi varii et albi"
      en: "I saw by night, and behold a man riding upon a red horse, and he stood among the myrtle trees, that were in the bottom: and behind him were horses, red, speckled, and white."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dixi quid sunt isti domine mi et dixit ad me angelus qui loquebatur in me ego ostendam tibi quid sint haec"
      en: "And I said: What are these, my Lord ? and the angel that spoke in me, said to me: I will shew thee what these are:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et respondit vir qui stabat inter myrteta et dixit isti sunt quos misit Dominus ut perambularent terram"
      en: "And the man that stood among the myrtle trees answered, and said: These are they, whom the Lord hath sent to walk through the earth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et responderunt angelo Domini qui stabat inter myrteta et dixerunt perambulavimus terram et ecce omnis terra habitatur et quiescit"
      en: "And they answered the angel of the Lord, that stood among the myrtle trees, and said: We have walked through the earth, and behold all the earth is inhabited, and is at rest."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et respondit angelus Domini et dixit Domine exercituum usquequo tu non misereberis Hierusalem et urbium Iuda quibus iratus es iste septuagesimus annus est"
      en: "And the angel of the Lord answered, and said: O Lord of hosts, how long wilt thou not have mercy on Jerusalem, and on the cities of Juda, with which thou hast been angry? this is now the seventieth year."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et respondit Dominus angelo qui loquebatur in me verba bona verba consolatoria"
      en: "And the Lord answered the angel, that spoke in me, good words, comfortable words."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et dixit ad me angelus qui loquebatur in me clama dicens haec dicit Dominus exercituum zelatus sum Hierusalem et Sion zelo magno"
      en: "And the angel that spoke in me, said to me: Cry thou, saying: Thus saith the Lord of hosts: I am zealous for Jerusalem, and Sion with a great zeal."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ira magna ego irascor super gentes opulentas quia ego iratus sum parum ipsi vero adiuverunt in malum"
      en: "And I am angry with a great anger with the wealthy nations: for I was angry a little, but they helped forward the evil."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "propterea haec dicit Dominus revertar ad Hierusalem in misericordiis domus mea aedificabitur in ea ait Dominus exercituum et perpendiculum extendetur super Hierusalem"
      en: "Therefore thus saith the Lord: I will return to Jerusalem in mercies: my house shall be built in it, saith the Lord of hosts: and the building line shall be stretched forth upon Jerusalem."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "adhuc clama dicens haec dicit Dominus exercituum adhuc affluent civitates meae bonis et consolabitur Dominus adhuc Sion et eliget adhuc Hierusalem"
      en: "Cry yet, saying: Thus saith the Lord of hosts: My cities shall yet flow with good things : and the Lord will yet comfort Sion, and he will yet choose Jerusalem."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et levavi oculos meos et vidi et ecce quattuor cornua"
      en: "And I lifted up my eyes, and saw: and behold four horns."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et dixi ad angelum qui loquebatur in me quid sunt haec et dixit ad me haec sunt cornua quae ventilaverunt Iudam et Israhel et Hierusalem"
      en: "And I said to the angel that spoke to me: What are these? And he said to me: These are the horns that have scattered Juda, and Israel, and Jerusalem."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et ostendit mihi Dominus quattuor fabros"
      en: "And the Lord shewed me four smiths."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et dixi quid isti veniunt facere qui ait dicens haec sunt cornua quae ventilaverunt Iudam per singulos viros et nemo eorum levavit caput suum et venerunt isti deterrere ea ut deiciant cornua gentium quae levaverunt cornu super terram Iuda ut dispergerent eam"
      en: "And I said: What come these to do? and he spoke, saying: These are the horns which have scattered Juda every man apart, and none of them lifted up his head: and these are come to fray them, to cast down the horns of the nations, that have lifted up the horn upon the land of Juda to scatter it."
    status: { la: verified, en: verified }
