# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: rom
chapter: 1
verses:
  - n: 1
    text:
      la: "Paulus servus Christi Iesu vocatus apostolus segregatus in evangelium Dei"
      en: "Paul, a servant of Jesus Christ, called to be an apostle, separated unto the gospel of God,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quod ante promiserat per prophetas suos in scripturis sanctis"
      en: "Which he had promised before, by his prophets, in the holy scriptures,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "de Filio suo qui factus est ex semine David secundum carnem"
      en: "Concerning his Son, who was made to him of the seed of David, according to the flesh,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui praedestinatus est Filius Dei in virtute secundum Spiritum sanctificationis ex resurrectione mortuorum Iesu Christi Domini nostri"
      en: "Who was predestinated the Son of God in power, according to the spirit of sanctification, by the resurrection of our Lord Jesus Christ from the dead;"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "per quem accepimus gratiam et apostolatum ad oboediendum fidei in omnibus gentibus pro nomine eius"
      en: "By whom we have received grace and apostleship for obedience to the faith, in all nations, for his name;"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in quibus estis et vos vocati Iesu Christi"
      en: "Among whom are you also the called of Jesus Christ:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "omnibus qui sunt Romae dilectis Dei vocatis sanctis gratia vobis et pax a Deo Patre nostro et Domino Iesu Christo"
      en: "To all that are at Rome, the beloved of God, called to be saints. Grace to you, and peace from God our Father, and from the Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "primum quidem gratias ago Deo meo per Iesum Christum pro omnibus vobis quia fides vestra adnuntiatur in universo mundo"
      en: "First I give thanks to my God, through Jesus Christ, for you all, because your faith is spoken of in the whole world."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "testis enim mihi est Deus cui servio in spiritu meo in evangelio Filii eius quod sine intermissione memoriam vestri facio"
      en: "For God is my witness, whom I serve in my spirit in the gospel of his Son, that without ceasing I make a commemoration of you;"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "semper in orationibus meis obsecrans si quo modo tandem aliquando prosperum iter habeam in voluntate Dei veniendi ad vos"
      en: "Always in my prayers making request, if by any means now at length I may have a prosperous journey, by the will of God, to come unto you."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "desidero enim videre vos ut aliquid inpertiar gratiae vobis spiritalis ad confirmandos vos"
      en: "For I long to see you, that I may impart unto you some spiritual grace, to strengthen you:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "id est simul consolari in vobis per eam quae invicem est fidem vestram atque meam"
      en: "That is to say, that I may be comforted together in you, by that which is common to us both, your faith and mine."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "nolo autem vos ignorare fratres quia saepe proposui venire ad vos et prohibitus sum usque adhuc ut aliquem fructum habeam et in vobis sicut et in ceteris gentibus"
      en: "And I would not have you ignorant, brethren, that I have often purposed to come unto you, (and have been hindered hitherto,) that I might have some fruit among you also, even as among other Gentiles."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Graecis ac barbaris sapientibus et insipientibus debitor sum"
      en: "To the Greeks and to the barbarians, to the wise and to the unwise, I am a debtor;"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ita quod in me promptum est et vobis qui Romae estis evangelizare"
      en: "So (as much as is in me) I am ready to preach the gospel to you also that are at Rome."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "non enim erubesco evangelium virtus enim Dei est in salutem omni credenti Iudaeo primum et Graeco"
      en: "For I am not ashamed of the gospel. For it is the power of God unto salvation to every one that believeth, to the Jew first, and to the Greek."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "iustitia enim Dei in eo revelatur ex fide in fidem sicut scriptum est iustus autem ex fide vivit"
      en: "For the justice of God is revealed therein, from faith unto faith, as it is written: The just man liveth by faith."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "revelatur enim ira Dei de caelo super omnem impietatem et iniustitiam hominum eorum qui veritatem in iniustitiam detinent"
      en: "For the wrath of God is revealed from heaven against all ungodliness and injustice of those men that detain the truth of God in injustice:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quia quod notum est Dei manifestum est in illis Deus enim illis manifestavit"
      en: "Because that which is known of God is manifest in them. For God hath manifested it unto them."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "invisibilia enim ipsius a creatura mundi per ea quae facta sunt intellecta conspiciuntur sempiterna quoque eius virtus et divinitas ut sint inexcusabiles"
      en: "For the invisible things of him, from the creation of the world, are clearly seen, being understood by the things that are made; his eternal power also, and divinity: so that they are inexcusable."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quia cum cognovissent Deum non sicut Deum glorificaverunt aut gratias egerunt sed evanuerunt in cogitationibus suis et obscuratum est insipiens cor eorum"
      en: "Because that, when they knew God, they have not glorified him as God, or given thanks; but became vain in their thoughts, and their foolish heart was darkened."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "dicentes enim se esse sapientes stulti facti sunt"
      en: "For professing themselves to be wise, they became fools."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et mutaverunt gloriam incorruptibilis Dei in similitudinem imaginis corruptibilis hominis et volucrum et quadrupedum et serpentium"
      en: "And they changed the glory of the incorruptible God into the likeness of the image of a corruptible man, and of birds, and of fourfooted beasts, and of creeping things."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "propter quod tradidit illos Deus in desideria cordis eorum in inmunditiam ut contumeliis adficiant corpora sua in semet ipsis"
      en: "Wherefore God gave them up to the desires of their heart, unto uncleanness, to dishonour their own bodies among themselves."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "qui commutaverunt veritatem Dei in mendacio et coluerunt et servierunt creaturae potius quam creatori qui est benedictus in saecula amen"
      en: "Who changed the truth of God into a lie; and worshipped and served the creature rather than the Creator, who is blessed for ever. Amen."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "propterea tradidit illos Deus in passiones ignominiae nam feminae eorum inmutaverunt naturalem usum in eum usum qui est contra naturam"
      en: "For this cause God delivered them up to shameful affections. For their women have changed the natural use into that use which is against nature."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "similiter autem et masculi relicto naturali usu feminae exarserunt in desideriis suis in invicem masculi in masculos turpitudinem operantes et mercedem quam oportuit erroris sui in semet ipsis recipientes"
      en: "And, in like manner, the men also, leaving the natural use of the women, have burned in their lusts one towards another, men with men working that which is filthy, and receiving in themselves the recompense which was due to their error."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et sicut non probaverunt Deum habere in notitia tradidit eos Deus in reprobum sensum ut faciant quae non conveniunt"
      en: "And as they liked not to have God in their knowledge, God delivered them up to a reprobate sense, to do those things which are not convenient;"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "repletos omni iniquitate malitia fornicatione avaritia nequitia plenos invidia homicidio contentione dolo malignitate susurrones"
      en: "Being filled with all iniquity, malice, fornication, avarice, wickedness, full of envy, murder, contention, deceit, malignity, whisperers,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "detractores Deo odibiles contumeliosos superbos elatos inventores malorum parentibus non oboedientes"
      en: "Detractors, hateful to God, contumelious, proud, haughty, inventors of evil things, disobedient to parents,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "insipientes inconpositos sine affectione absque foedere sine misericordia"
      en: "Foolish, dissolute, without affection, without fidelity, without mercy."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "qui cum iustitiam Dei cognovissent non intellexerunt quoniam qui talia agunt digni sunt morte non solum ea faciunt sed et consentiunt facientibus"
      en: "Who, having known the justice of God, did not understand that they who do such things, are worthy of death; and not only they that do them, but they also that consent to them that do them."
    status: { la: verified, en: verified }
