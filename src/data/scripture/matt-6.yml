# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 6
verses:
  - n: 1
    text:
      la: "Attendite ne justitiam vestram faciatis coram hominibus, ut videamini ab eis: alioquin mercedem non habebitis apud Patrem vestrum qui in caelis est."
      en: "Take heed that you do not your justice before men, to be seen by them: otherwise you shall not have a reward of your Father who is in heaven."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cum ergo facis eleemosynam, noli tuba canere ante te, sicut hypocritae faciunt in synagogis, et in vicis, ut honorificentur ab hominibus. Amen dico vobis, receperunt mercedem suam."
      en: "Therefore when thou dost an almsdeed, sound not a trumpet before thee, as the hypocrites do in the synagogues and in the streets, that they may be honoured by men. Amen I say to you, they have received their reward."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Te autem faciente eleemosynam, nesciat sinistra tua quid faciat dextera tua:"
      en: "But when thou dost alms, let not thy left hand know what thy right hand doth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ut sit eleemosyna tua in abscondito, et Pater tuus, qui videt in abscondito, reddet tibi."
      en: "That thy alms may be in secret, and thy Father who seeth in secret will repay thee."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et cum oratis, non eritis sicut hypocritae qui amant in synagogis et in angulis platearum stantes orare, ut videantur ab hominibus: amen dico vobis, receperunt mercedem suam."
      en: "And when ye pray, you shall not be as the hypocrites, that love to stand and pray in the synagogues and corners of the streets, that they may be seen by men: Amen I say to you, they have received their reward."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Tu autem cum oraveris, intra in cubiculum tuum, et clauso ostio, ora Patrem tuum in abscondito: et Pater tuus, qui videt in abscondito, reddet tibi."
      en: "But thou when thou shalt pray, enter into thy chamber, and having shut the door, pray to thy Father in secret: and thy Father who seeth in secret will repay thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Orantes autem, nolite multum loqui, sicut ethnici, putant enim quod in multiloquio suo exaudiantur."
      en: "And when you are praying, speak not much, as the heathens. For they think that in their much speaking they may be heard."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Nolite ergo assimilari eis: scit enim Pater vester, quid opus sit vobis, antequam petatis eum."
      en: "Be not you therefore like to them, for your Father knoweth what is needful for you, before you ask him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sic ergo vos orabitis: Pater noster, qui es in caelis, sanctificetur nomen tuum."
      en: "Thus therefore shall you pray: Our Father who art in heaven, hallowed be thy name."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Adveniat regnum tuum; fiat voluntas tua, sicut in caelo et in terra."
      en: "Thy kingdom come. Thy will be done on earth as it is in heaven."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Panem nostrum supersubstantialem da nobis hodie,"
      en: "Give us this day our supersubstantial bread."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et dimitte nobis debita nostra, sicut et nos dimittimus debitoribus nostris."
      en: "And forgive us our debts, as we also forgive our debtors."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et ne nos inducas in tentationem, sed libera nos a malo. Amen."
      en: "And lead us not into temptation. But deliver us from evil. Amen."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Si enim dimiseritis hominibus peccata eorum: dimittet et vobis Pater vester caelestis delicta vestra."
      en: "For if you will forgive men their offences, your heavenly Father will forgive you also your offences."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Si autem non dimiseritis hominibus: nec Pater vester dimittet vobis peccata vestra."
      en: "But if you will not forgive men, neither will your Father forgive you your offences."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cum autem jejunatis, nolite fieri sicut hypocritae, tristes. Exterminant enim facies suas, ut appareant hominibus jejunantes. Amen dico vobis, quia receperunt mercedem suam."
      en: "And when you fast, be not as the hypocrites, sad. For they disfigure their faces, that they may appear unto men to fast. Amen I say to you, they have received their reward."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Tu autem, cum jejunas, unge caput tuum, et faciem tuam lava,"
      en: "But thou, when thou fastest anoint thy head, and wash thy face;"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ne videaris hominibus jejunans, sed Patri tuo, qui est in abscondito: et Pater tuus, qui videt in abscondito, reddet tibi."
      en: "That thou appear not to men to fast, but to thy Father who is in secret: and thy Father who seeth in secret, will repay thee."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Nolite thesaurizare vobis thesauros in terra: ubi aerugo, et tinea demolitur: et ubi fures effodiunt, et furantur."
      en: "Lay not up to yourselves treasures on earth: where the rust, and moth consume, and where thieves break through and steal."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Thesaurizate autem vobis thesauros in caelo, ubi neque aerugo, neque tinea demolitur, et ubi fures non effodiunt, nec furantur."
      en: "But lay up to yourselves treasures in heaven: where neither the rust nor moth doth consume, and where thieves do not break through, nor steal."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Ubi enim est thesaurus tuus, ibi est et cor tuum."
      en: "For where thy treasure is, there is thy heart also."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Lucerna corporis tui est oculus tuus. Si oculus tuus fuerit simplex, totum corpus tuum lucidum erit."
      en: "The light of thy body is thy eye. If thy eye be single, thy whole body shall be lightsome."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Si autem oculus tuus fuerit nequam, totum corpus tuum tenebrosum erit. Si ergo lumen, quod in te est, tenebrae sunt: ipsae tenebrae quantae erunt?"
      en: "But if thy eye be evil thy whole body shall be darksome. If then the light that is in thee, be darkness: the darkness itself how great shall it be!"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Nemo potest duobus dominis servire: aut enim unum odio habebit, et alterum diliget: aut unum sustinebit, et alterum contemnet. Non potestis Deo servire et mammonae."
      en: "No man can serve two masters. For either he will hate the one, and love the other: or he will sustain the one, and despise the other. You cannot serve God and mammon."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Ideo dico vobis, ne solliciti sitis animae vestrae quid manducetis, neque corpori vestro quid induamini. Nonne anima plus est quam esca, et corpus plus quam vestimentum?"
      en: "Therefore I say to you, be not solicitous for your life, what you shall eat, nor for your body, what you shall put on. Is not the life more than the meat: and the body more than the raiment?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Respicite volatilia caeli, quoniam non serunt, neque metunt, neque congregant in horrea: et Pater vester caelestis pascit illa. Nonne vos magis pluris estis illis?"
      en: "Behold the birds of the air, for they neither sow, nor do they reap, nor gather into barns: and your heavenly Father feedeth them. Are not you of much more value than they?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Quis autem vestrum cogitans potest adjicere ad staturam suam cubitum unum?"
      en: "And which of you by taking thought, can add to his stature by one cubit?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et de vestimento quid solliciti estis? Considerate lilia agri quomodo crescunt: non laborant, neque nent."
      en: "And for raiment why are you solicitous? Consider the lilies of the field, how they grow: they labour not, neither do they spin."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Dico autem vobis, quoniam nec Salomon in omni gloria sua coopertus est sicut unum ex istis."
      en: "But I say to you, that not even Solomon in all his glory was arrayed as one of these."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Si autem foenum agri, quod hodie est, et cras in clibanum mittitur, Deus sic vestit, quanto magis vos modicae fidei?"
      en: "And if the grass of the field, which is today, and tomorrow is cast into the oven, God doth so clothe: how much more you, O ye of little faith?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Nolite ergo solliciti esse, dicentes: Quid manducabimus, aut quid bibemus, aut quo operiemur?"
      en: "Be not solicitous therefore, saying, What shall we eat: or what shall we drink, or wherewith shall we be clothed?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "haec enim omnia gentes inquirunt. Scit enim Pater vester, quia his omnibus indigetis."
      en: "For after all these things do the heathens seek. For your Father knoweth that you have need of all these things."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Quaerite ergo primum regnum Dei, et justitiam ejus: et haec omnia adjicientur vobis."
      en: "Seek ye therefore first the kingdom of God, and his justice, and all these things shall be added unto you."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Nolite ergo solliciti esse in crastinum. Crastinus enim dies sollicitus erit sibi ipsi: sufficit diei malitia sua."
      en: "Be not therefore solicitous for tomorrow; for the morrow will be solicitous for itself. Sufficient for the day is the evil thereof."
    status: { la: verified, en: verified }
