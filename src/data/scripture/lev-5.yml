# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: lev
chapter: 5
verses:
  - n: 1
    text:
      la: "si peccaverit anima et audierit vocem iurantis testisque fuerit quod aut ipse vidit aut conscius est nisi indicaverit portabit iniquitatem suam"
      en: "If any one sin, and hear the voice of one swearing, and is a witness either because he himself hath seen, or is privy to it: if he do not utter it, he shall bear his iniquity."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "anima quae tetigerit aliquid inmundum sive quod occisum a bestia est aut per se mortuum vel quodlibet aliud reptile et oblita fuerit inmunditiae suae rea est et deliquit"
      en: "Whosoever toucheth any unclean thing, either that which hath been killed by a beast, or died of itself, or any other creeping thing: and forgetteth his uncleanness, he is guilty, and hath offended:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et si tetigerit quicquam de inmunditia hominis iuxta omnem inpuritatem qua pollui solet oblitaque cognoverit postea subiacebit delicto"
      en: "And if he touch any thing of the uncleanness of man, according to any uncleanness wherewith he is wont to be defiled, and having forgotten it, come afterwards to know it, he shall be guilty of an offence."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "anima quae iuraverit et protulerit labiis suis ut vel male quid faceret vel bene et id ipsum iuramento et sermone firmaverit oblitaque postea intellexerit delictum suum"
      en: "The person that sweareth, and uttereth with his lips, that he would do either evil or good, and bindeth the same with an oath, and his word, and having forgotten it afterwards understandeth his offence,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "agat paenitentiam pro peccato"
      en: "Let him do penance for his sin,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et offerat agnam de gregibus sive capram orabitque pro eo sacerdos et pro peccato eius"
      en: "And offer of the flocks an ewe lamb, or a she goat, and the priest shall pray for him and for his sin:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sin autem non potuerit offerre pecus offerat duos turtures vel duos pullos columbarum Domino unum pro peccato et alterum in holocaustum"
      en: "But if he be not able to offer a beast, let him offer two turtles, or two young pigeons to the Lord, one for sin, and the other for a holocaust,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dabitque eos sacerdoti qui primum offerens pro peccato retorquebit caput eius ad pinnulas ita ut collo hereat et non penitus abrumpatur"
      en: "And he shall give them to the priest: who shall offer the first for sin, and twist back the head of it to the little pinions, so that it stick to the neck, and be not altogether broken off."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et asperget de sanguine eius parietem altaris quicquid autem reliquum fuerit faciet destillare ad fundamentum eius quia pro peccato est"
      en: "And of its blood he shall sprinkle the side of the altar, and whatsoever is left, he shall let it drop at the bottom thereof, because it is for sin."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "alterum vero adolebit holocaustum ut fieri solet rogabitque pro eo sacerdos et pro peccato eius et dimittetur ei"
      en: "And the other he shall burn for a holocaust, as is wont to be done: and the priest shall pray for him, and for his sin, and it shall be forgiven him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quod si non quiverit manus eius offerre duos turtures vel duos pullos columbae offeret pro peccato similam partem oephi decimam non mittet in eam oleum nec turis aliquid inponet quia pro peccato est"
      en: "And if his hand be not able to offer two turtles, or two young pigeons, he shall offer for his sin the tenth part of an ephi of flour. He shall not put oil upon it, nor put any frankincense thereon, because it is for sin:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tradetque eam sacerdoti qui plenum ex toto pugillum hauriens cremabit super altare in monumentum eius qui obtulit"
      en: "And he shall deliver it to the priest: who shall take a handful thereof, and shall burn it upon the altar for a memorial of him that offered it:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "rogans pro illo et expians reliquam vero partem ipse habebit in munere"
      en: "Praying for him and making atonement: but the part that is left, he himself shall have for a gift."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "locutus est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "anima si praevaricans caerimonias per errorem in his quae Domino sunt sanctificata peccaverit offeret pro delicto suo arietem inmaculatum de gregibus qui emi potest duobus siclis iuxta pondus sanctuarii"
      en: "If any one shall sin through mistake, transgressing the ceremonies in those things that are sacrificed to the Lord, he shall offer for his offence a ram without blemish out of the flocks, that may be bought for two sicles, according to the weight of the sanctuary:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ipsumque quod intulit damni restituet et quintam partem ponet supra tradens sacerdoti qui rogabit pro eo offerens arietem et dimittetur ei"
      en: "And he shall make good the damage itself which he hath done, and shall add the fifth part besides, delivering it to the priest, who shall pray for him, offering the ram, and it shall be forgiven him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "anima si peccaverit per ignorantiam feceritque unum ex his quae Domini lege prohibentur et peccati rea intellexerit iniquitatem suam"
      en: "If any one sin through ignorance, and do one of those things which by the law of the Lord are forbidden, and being guilty of sin, understand his iniquity,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "offeret arietem inmaculatum de gregibus sacerdoti iuxta mensuram aestimationemque peccati qui orabit pro eo quod nesciens fecerit et dimittetur ei"
      en: "He shall offer of the hocks a ram without blemish to the priest, according to the measure and estimation of the sin: and the priest shall pray for him, because he did it ignorantly: and it shall be forgiven him,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quia per errorem deliquit in Dominum"
      en: "Because by mistake he trespassed against the Lord."
    status: { la: verified, en: verified }
