# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: rom
chapter: 10
verses:
  - n: 1
    text:
      la: "fratres voluntas quidem cordis mei et obsecratio ad Deum fit pro illis in salutem"
      en: "Brethren, the will of my heart, indeed, and my prayer to God, is for them unto salvation."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "testimonium enim perhibeo illis quod aemulationem Dei habent sed non secundum scientiam"
      en: "For I bear them witness, that they have a zeal of God, but not according to knowledge."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ignorantes enim Dei iustitiam et suam quaerentes statuere iustitiae Dei non sunt subiecti"
      en: "For they, not knowing the justice of God, and seeking to establish their own, have not submitted themselves to the justice of God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "finis enim legis Christus ad iustitiam omni credenti"
      en: "For the end of the law is Christ, unto justice to every one that believeth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Moses enim scripsit quoniam iustitiam quae ex lege est qui fecerit homo vivet in ea"
      en: "For Moses wrote, that the justice which is of the law, the man that shall do it, shall live by it."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quae autem ex fide est iustitia sic dicit ne dixeris in corde tuo quis ascendit in caelum id est Christum deducere"
      en: "But the justice which is of faith, speaketh thus: Say not in thy heart, Who shall ascend into heaven? that is, to bring Christ down;"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "aut quis descendit in abyssum hoc est Christum ex mortuis revocare"
      en: "Or who shall descend into the deep? that is, to bring up Christ again from the dead."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sed quid dicit prope est verbum in ore tuo et in corde tuo hoc est verbum fidei quod praedicamus"
      en: "But what saith the scripture? The word is nigh thee, even in thy mouth, and in thy heart. This is the word of faith, which we preach."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quia si confitearis in ore tuo Dominum Iesum et in corde tuo credideris quod Deus illum excitavit ex mortuis salvus eris"
      en: "For if thou confess with thy mouth the Lord Jesus, and believe in thy heart that God hath raised him up from the dead, thou shalt be saved."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "corde enim creditur ad iustitiam ore autem confessio fit in salutem"
      en: "For, with the heart, we believe unto justice; but, with the mouth, confession is made unto salvation."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dicit enim scriptura omnis qui credit in illum non confundetur"
      en: "For the scripture saith: Whosoever believeth in him, shall not be confounded."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "non enim est distinctio Iudaei et Graeci nam idem Dominus omnium dives in omnes qui invocant illum"
      en: "For there is no distinction of the Jew and the Greek: for the same is Lord over all, rich unto all that call upon him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "omnis enim quicumque invocaverit nomen Domini salvus erit"
      en: "For whosoever shall call upon the name of the Lord, shall be saved."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quomodo ergo invocabunt in quem non crediderunt aut quomodo credent ei quem non audierunt quomodo autem audient sine praedicante"
      en: "How then shall they call on him, in whom they have not believed? Or how shall they believe him, of whom they have not heard? And how shall they hear, without a preacher?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quomodo vero praedicabunt nisi mittantur sicut scriptum est quam speciosi pedes evangelizantium pacem evangelizantium bona"
      en: "And how shall they preach unless they be sent, as it is written: How beautiful are the feet of them that preach the gospel of peace, of them that bring glad tidings of good things!"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sed non omnes oboedierunt evangelio Esaias enim dicit Domine quis credidit auditui nostro"
      en: "But all do not obey the gospel. For Isaias saith: Lord, who hath believed our report?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ergo fides ex auditu auditus autem per verbum Christi"
      en: "Faith then cometh by hearing; and hearing by the word of Christ."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sed dico numquid non audierunt et quidem in omnem terram exiit sonus eorum et in fines orbis terrae verba eorum"
      en: "But I say: Have they not heard? Yes, verily, their sound hath gone forth into all the earth, and their words unto the ends of the whole world."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "sed dico numquid Israhel non cognovit primus Moses dicit ego ad aemulationem vos adducam in non gentem in gentem insipientem in iram vos mittam"
      en: "But I say: Hath not Israel known? First, Moses saith: I will provoke you to jealousy by that which is not a nation; by a foolish nation I will anger you."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Esaias autem audet et dicit inventus sum non quaerentibus me palam apparui his qui me non interrogabant"
      en: "But Isaias is bold, and saith: I was found by them that did not seek me: I appeared openly to them that asked not after me."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ad Israhel autem dicit tota die expandi manus meas ad populum non credentem et contradicentem"
      en: "But to Israel he saith: All the day long have I spread my hands to a people that believeth not, and contradicteth me."
    status: { la: verified, en: verified }
