# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 1
verses:
  - n: 1
    text:
      la: "Haec sunt nomina filiorum Israel qui ingressi sunt in Aegyptum cum Jacob: singuli cum domibus suis introierunt:"
      en: "These are the names of the children of Israel, that went into Egypt with Jacob: they went in, every man with his household:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ruben, Simeon, Levi, Judas,"
      en: "Ruben, Simeon, Levi, Juda,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Issachar, Zabulon et Benjamin,"
      en: "Issachar, Zabulon, and Benjamin,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dan et Nephthali, Gad et Aser."
      en: "Dan, and Nephtali, Gad and Aser."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Erant igitur omnes animae eorum qui egressi sunt de femore Jacob, septuaginta: Joseph autem in Aegypto erat."
      en: "And all the souls that came out of Jacob's thigh, were seventy: but Joseph was in Egypt."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quo mortuo, et universis fratribus ejus, omnique cognatione illa,"
      en: "After he was dead, and all his brethren, and all that generation,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "filii Israel creverunt, et quasi germinantes multiplicati sunt: ac roborati nimis, impleverunt terram."
      en: "The children of Israel increased, and sprung up into multitudes, and growing exceedingly strong they filled the land."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Surrexit interea rex novus super Aegyptum, qui ignorabat Joseph."
      en: "In the mean time there arose a new king over Egypt, that knew not Joseph:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ait ad populum suum: Ecce, populus filiorum Israel multus, et fortior nobis est."
      en: "And he said to his people: Behold the people of the children of Israel are numerous and stronger than we."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Venite, sapienter opprimamus eum, ne forte multiplicetur: et si ingruerit contra nos bellum, addatur inimicis nostris, expugnatisque nobis egrediatur de terra."
      en: "Come, let us wisely oppress them, lest they multiply: and if any war shall rise against us, join with our enemies, and having overcome us, depart out of the land."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Praeposuit itaque eis magistros operum, ut affligerent eos oneribus: aedificaveruntque urbes tabernaculorum Pharaoni, Phithom et Ramesses."
      en: "Therefore he set over them masters of the works, to afflict them with burdens, and they built for Pharao cities of tabernacles, Phithom and Ramesses."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quantoque opprimebant eos, tanto magis multiplicabantur, et crescebant:"
      en: "But the more they oppressed them, the more they were multiplied, and increased:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "oderantque filios Israel Aegyptii, et affligebant illudentes eis,"
      en: "And the Egyptians hated the children of Israel, and afflicted them and mocked them:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "atque ad amaritudinem perducebant vitam eorum operibus duris luti et lateris, omnique famulatu, quo in terrae operibus premebantur."
      en: "And they made their life bitter with hard works in clay, and brick, and with all manner of service, wherewith they were overcharged in the works of the earth."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dixit autem rex Aegypti obstetricibus Hebraeorum, quarum una vocabatur Sephora, altera Phua,"
      en: "And the king of Egypt spoke to the midwives of the Hebrews: of whom one was called Sephora, the other Phua,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "praecipiens eis: Quando obstetricabitis Hebraeas, et partus tempus advenerit: si masculus fuerit, interficite eum: si femina, reservate."
      en: "Commanding them: When you shall do the office of midwives to the Hebrew women, and the time of delivery is come: if it be a man child, kill it: if a woman, keep it alive."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Timuerunt autem obstetrices Deum, et non fecerunt juxta praeceptum regis Aegypti, sed conservabant mares."
      en: "But the midwives feared God, and did not do as the king of Egypt had commanded, but saved the men children."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quibus ad se accersitis, rex ait: Quidnam est hoc quod facere voluistis, ut pueros servaretis?"
      en: "And the king called for them and said: What is that you meant to do, that you would save the men children?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Quae responderunt: Non sunt Hebreae sicut aegyptiae mulieres: ipsae enim obstetricandi habent scientiam, et priusquam veniamus ad eas, pariunt."
      en: "They answered: The Hebrew women are not as the Egyptian women: for they themselves are skillful in the office of a midwife; and they are delivered before we come to them."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Bene ergo fecit Deus obstetricibus: et crevit populus, confortatusque est nimis."
      en: "Therefore God dealt well with the midwives: and the people multiplied and grew exceedingly strong."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et quia timuerunt obstetrices Deum, aedificavit eis domos."
      en: "And because the midwives feared God, he built them houses."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Praecepit ergo Pharao omni populo suo, dicens: Quidquid masculini sexus natum fuerit, in flumen projicite: quidquid feminini, reservate."
      en: "Pharao therefore charged all his people, saying: Whatsoever shall be born of the male sex, ye shall cast into the river: whatsoever of the female, ye shall save alive."
    status: { la: verified, en: verified }
