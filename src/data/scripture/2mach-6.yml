# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2mach
chapter: 6
verses:
  - n: 1
    text:
      la: "Sed non post multum temporis, misit rex senem quemdam Antiochenum, qui compelleret Judaeos ut se transferrent a patriis et Dei legibus:"
      en: "But not long after the king sent a certain old man of Antioch, to compel the Jews to depart from the laws of their fathers and of God:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "contaminare etiam quod in Jerosolymis erat templum, et cognominare Jovis Olympii: et in Garizim, prout erant hi qui locum inhabitabant, Jovis hospitalis."
      en: "And to defile the temple that was in Jerusalem, and to call it the temple of Jupiter Olympius: and that in Gazarim of Jupiter Hospitalis, according as they were that inhabited the place."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Pessima autem et universis gravis erat malorum incursio:"
      en: "And very bad was this invasion of evils and grievous to all."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "nam templum luxuria et comessationibus gentium erat plenum, et scortantium cum meretricibus: sacratisque aedibus mulieres se ultro ingerebant, intro ferentes ea, quae non licebat."
      en: "For the temple was full of the riot and revellings of the Gentiles: and of men lying with lewd women. And women thrust themselves of their accord into the holy places, and brought in things that were not lawful."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Altare etiam plenum erat illicitis, quae legibus prohibebantur."
      en: "The altar also was filled with unlawful things, which were forbidden by the laws."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Neque autem sabbata custodiebantur, neque dies solemnes patrii servabantur, nec simpliciter Judaeum se esse quisquam confitebatur."
      en: "And neither were the sabbaths kept, nor the solemn days of the fathers observed, neither did any man plainly profess himself to be a Jew."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ducebantur autem cum amara necessitate in die natalis regis ad sacrificia: et, cum Liberi sacra celebrarentur, cogebantur hedera coronati Libero circuire."
      en: "But they were led by bitter constraint on the king's birthday to the sacrifices: and when the feast of Bacchus was kept, they were compelled to go about crowned with ivy in honour of Bacchus."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Decretum autem exiit in proximas gentilium civitates, suggerentibus Ptolemaeis, ut pari modo et ipsi adversus Judaeos agerent, ut sacrificarent:"
      en: "And there went out a decree into the neighbouring cities of the Gentiles, by the suggestion of the Ptolemeans, that they also should act in like manner against the Jews, to oblige them to sacrifice:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "eos autem qui nollent transire ad instituta gentium, interficerent: erat ergo videre miseriam."
      en: "And whosoever would not conform themselves to the ways of the Gentiles, should be put to death: then was misery to be seen."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Duae enim mulieres delatae sunt natos suos circumcidisse: quas, infantibus ad ubera suspensis, cum publice per civitatem circumduxissent, per muros praecipitaverunt."
      en: "For two women were accused to have circumcised their children: whom, when they had openly led about through the city with the infants hanging at their breasts, they threw down headlong from the walls."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Alii vero, ad proximas coeuntes speluncas, et latenter sabbati diem celebrantes, cum indicati essent Philippo, flammis succensi sunt, eo quod verebantur propter religionem et observantiam, manu sibimet auxilium ferre."
      en: "And others that had met together in caves that were near, and were keeping the sabbath day privately, being discovered by Philip, were burnt with fire, because they made a conscience to help themselves with their hands, by reason of the religious observance of the day."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Obsecro autem eos, qui hunc librum lecturi sunt, ne abhorrescant propter adversos casus, sed reputent ea quae acciderunt, non ad interitum, sed ad correptionem esse generis nostri."
      en: "Now I beseech those that shall read this book, that they be not shocked at these calamities, but that they consider the things that happened, not as being for the destruction, but for the correction of our nation."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Etenim multo tempore non sinere peccatoribus ex sententia agere, sed statim ultiones adhibere, magni beneficii est indicium."
      en: "For it is a token of great goodness when sinners are not suffered to go on in their ways for a long time, but are presently punished."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Non enim, sicut in aliis nationibus, Dominus patienter exspectat, ut eas, cum judicii dies advenerit, in plenitudine peccatorum puniat:"
      en: "For, not as with other nations (whom the Lord patiently expecteth, that when the day of judgment shall come, he may punish them in the fulness of their sins:)"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ita et in nobis statuit, ut, peccatis nostris in finem devolutis, ita demum in nos vindicet."
      en: "Doth he also deal with us, so as to suffer our sins to come to their height, and then take vengeance on us."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Propter quod numquam quidem a nobis misericordiam suam amovet: corripiens vero in adversis populum suum non dereliquit."
      en: "And therefore he never withdraweth his mercy from us: but though he chastise his people with adversity, he forsaketh them not."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Sed haec nobis ad commonitionem legentium dicta sint paucis. Jam enim veniendum est ad narrationem."
      en: "But let this suffice in a few words for a warning to the readers. And now we must come to the narration."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Igitur Eleazarus, unus de primoribus scribarum, vir aetate provectus, et vultu decorus, aperto ore hians compellebatur carnem porcinam manducare."
      en: "Eleazar one of the chief of the scribes, a man advanced in years, and of a comely countenance, was pressed to open his mouth to eat swine's flesh."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "At ille gloriosissimam mortem magis quam odibilem vitam complectens, voluntarie praeibat ad supplicium."
      en: "But he, choosing rather a most glorious death than a hateful life, went forward voluntarily to the torment."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Intuens autem quemadmodum oporteret accedere, patienter sustinens, destinavit non admittere illicita propter vitae amorem."
      en: "And considering in what manner he was come to it, patiently bearing, he determined not to do any unlawful things for the love of life."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Hi autem qui astabant, iniqua miseratione commoti, propter antiquam viri amicitiam, tollentes eum secreto rogabant afferri carnes quibus vesci ei licebat, ut simularetur manducasse, sicut rex imperaverat de sacrificii carnibus:"
      en: "But they that stood by, being moved with wicked pity, for the old friendship they had with the man, taking him aside, desired that flesh might be brought, which it was lawful for him to eat, that he might make as if he had eaten, as the king had commanded of the flesh of the sacrifice:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ut, hoc facto, a morte liberaretur: et propter veterem viri amicitiam, hanc in eo faciebant humanitatem."
      en: "That by so doing he might be delivered from death: and for the sake of their old friendship with the man they did him this courtesy."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "At ille cogitare coepit aetatis ac senectutis suae eminentiam dignam, et ingenitae nobilitatis canitiem, atque a puero optimae conversationis actus: et secundum sanctae et a Deo conditae legis constituta, respondit cito, dicens praemitti se velle in infernum."
      en: "But he began to consider the dignity of his age, and his ancient years, and the inbred honour of his grey head, and his good life and conversation from a child: and he answered without delay, according to the ordinances of the holy law made by God, saying, that he would rather be sent into the other world."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Non enim aetati nostrae dignum est, inquit, fingere: ut multi adolescentium, arbitrantes Eleazarum nonaginta annorum transisse ad vitam alienigenarum:"
      en: "For it doth not become our age, said he, to dissemble: whereby many young persons might think that Eleazar, at the age of fourscore and ten years, was gone over to the life of the heathens:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et ipsi propter meam simulationem, et propter modicum corruptibilis vitae tempus decipiantur, et per hoc maculam atque execrationem meae senectuti conquiram."
      en: "And so they, through my dissimulation, and for a little time of a corruptible life, should be deceived, and hereby I should bring a stain and a curse upon my old age."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Nam, etsi in praesenti tempore suppliciis hominum eripiar, sed manum Omnipotentis nec vivus, nec defunctus, effugiam."
      en: "For though, for the present time, I should be delivered from the punishments of men, yet should I not escape the hand of the Almighty neither alive nor dead."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Quam ob rem fortiter vita excedendo, senectute quidem dignus apparebo:"
      en: "Wherefore by departing manfully out of this life, I shall shew myself worthy of my old age:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "adolescentibus autem exemplum forte relinquam, si prompto animo, ac fortiter pro gravissimis ac sanctissimis legibus honesta morte perfungar. His dictis, confestim ad supplicium trahebatur."
      en: "And I shall leave an example of fortitude to young men, if with a ready mind and constancy I suffer an honourable death, for the most venerable and most holy laws. And having spoken thus, he was forthwith carried to execution."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Hi autem, qui eum ducebant, et paulo ante fuerant mitiores, in iram conversi sunt propter sermones ab eo dictos, quos illi per arrogantiam prolatos arbitrabantur."
      en: "And they that led him, and had been a little before more mild, were changed to wrath for the words he had spoken, which they thought were uttered out of arrogancy."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Sed cum plagis perimeretur, ingemuit, et dixit: Domine, qui habes sanctam scientiam, manifeste tu scis, quia cum a morte possem liberari, duros corporis sustineo dolores: secundum animam vero propter timorem tuum libenter haec patior."
      en: "But when he was now ready to die with the stripes, he groaned, and said: O Lord, who hast the holy knowledge, thou knowest manifestly that whereas I might be delivered from death, I suffer grevious pains in body: but in soul am well content to suffer these things because I fear thee."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et iste quidem hoc modo vita decessit, non solum juvenibus, sed et universae genti memoriam mortis suae ad exemplum virtutis et fortitudinis derelinquens."
      en: "Thus did this man die, leaving not only to young men, but also to the whole nation, the memory of his death for an example of virtue and fortitude."
    status: { la: verified, en: verified }
