# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2reg
chapter: 1
verses:
  - n: 1
    text:
      la: "factum est autem postquam mortuus est Saul ut David reverteretur a caede Amalech et maneret in Siceleg dies duos"
      en: "Now it came to pass, after Saul was dead, that David returned from the slaughter of the Amalecites, and abode two days in Siceleg."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in die autem tertia apparuit homo veniens de castris Saul veste conscissa et pulvere aspersus caput et ut venit ad David cecidit super faciem suam et adoravit"
      en: "And on the third day, there appeared a man who came out of Saul's camp, with his garments rent, and dust strewed on his head: and when he came to David, he fell upon his face, and adored."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixitque ad eum David unde venis qui ait ad eum de castris Israhel fugi"
      en: "And David said to him: From whence comest thou? And he said to him: I am fled out of the camp of Israel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dixit ad eum David quod est verbum quod factum est indica mihi qui ait fugit populus e proelio et multi corruentes e populo mortui sunt sed et Saul et Ionathan filius eius interierunt"
      en: "And David said unto him: What is the matter that is come to pass? tell me. He said: The people are fled from the battle, and many of the people are fallen and dead: moreover Saul and Jonathan his son are slain."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixitque David ad adulescentem qui nuntiabat unde scis quia mortuus est Saul et Ionathan filius eius"
      en: "And David said to the young man that told him: How knowest thou that Saul and Jonathan his son, are dead?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ait adulescens qui narrabat ei casu veni in montem Gelboe et Saul incumbebat super hastam suam porro currus et equites adpropinquabant ei"
      en: "And the young man that told him, said: I came by chance upon mount Gelboe, and Saul leaned upon his spear: and the chariots and horsemen drew nigh unto him,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et conversus post tergum suum vidensque me vocavit cui cum respondissem adsum"
      en: "And looking behind him, and seeing me, he called me. And I answered, Here am I."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixit mihi quisnam es tu et aio ad eum Amalechites sum"
      en: "And he said to me: Who art thou? And I said to him: I am an Amalecite."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et locutus est mihi sta super me et interfice me quoniam tenent me angustiae et adhuc tota anima in me est"
      en: "And he said to me: Stand over me, and kill me: for anguish is come upon me, and as yet my whole life is in me."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "stansque super eum occidi illum sciebam enim quod vivere non poterat post ruinam et tuli diadema quod erat in capite eius et armillam de brachio illius et adtuli ad te dominum meum huc"
      en: "So standing over him, I killed him: for I knew that he could not live after the fall: and I took the diadem that was on his head, and the bracelet that was on his arm and have brought them hither to thee, my lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "adprehendens autem David vestimenta sua scidit omnesque viri qui erant cum eo"
      en: "Then David took hold of his garments and rent them, and likewise all the men that were with him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et planxerunt et fleverunt et ieiunaverunt usque ad vesperam super Saul et super Ionathan filium eius et super populum Domini et super domum Israhel quod corruissent gladio"
      en: "And they mourned, and wept, and fasted until evening for Saul, and for Jonathan his son, and for the people of the Lord, and for the house of Israel, because they were fallen by the sword."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixitque David ad iuvenem qui nuntiaverat ei unde es qui respondit filius hominis advenae amalechitae ego sum"
      en: "And David said to the young man that told him: Whence art thou? He answered: I am the son of a stranger of Amalee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et ait ad eum David quare non timuisti mittere manum tuam ut occideres christum Domini"
      en: "David said to him: Why didst thou not fear to put out thy hand to kill the Lord's anointed?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "vocansque David unum de pueris ait accedens inrue in eum qui percussit illum et mortuus est"
      en: "And David calling one of his servants, said: Go near and fall upon him. And he struck him so that he died."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et ait ad eum David sanguis tuus super caput tuum os enim tuum locutum est adversum te dicens ego interfeci christum Domini"
      en: "And David said to him: Thy blood be upon thy own head: for thy own mouth hath spoken against thee, saying: I have slain the Lord's anointed."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "planxit autem David planctum huiuscemodi super Saul et super Ionathan filium eius"
      en: "And David made this kind of lamentation over Saul, and over Jonathan his son."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et praecepit ut docerent filios Iuda arcum sicut scriptum est in libro Iustorum"
      en: "(Also he commanded that they should teach the children of Juda the use of the bow, as it is written in the book of the just.) And he said: Consider, O Israel, for them that are dead, wounded on thy high places."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "incliti Israhel super montes tuos interfecti sunt quomodo ceciderunt fortes"
      en: "The illustrious of Israel are slain upon thy mountains: how are the valiant fallen?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "nolite adnuntiare in Geth neque adnuntietis in conpetis Ascalonis ne forte laetentur filiae Philisthim ne exultent filiae incircumcisorum"
      en: "Tell it not in Geth, publish it not in the streets of Ascalon: lest the daughters of the Philistines rejoice, lest the daughters of the uncircumcised triumph,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "montes Gelboe nec ros nec pluviae veniant super vos neque sint agri primitiarum quia ibi abiectus est clypeus fortium clypeus Saul quasi non esset unctus oleo"
      en: "Ye mountains of Gelboe, let neither dew, nor rain come upon you, neither be they fields of firstfruits: for there was cast away the shield of the valiant, the shield of Saul as though he had not been anointed with oil."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "a sanguine interfectorum ab adipe fortium sagitta Ionathan numquam rediit retrorsum et gladius Saul non est reversus inanis"
      en: "From the blood of the slain, from the fat of the valiant, the arrow of Jonathan never turned back, and the sword of Saul did not return empty."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Saul et Ionathan amabiles et decori in vita sua in morte quoque non sunt divisi aquilis velociores leonibus fortiores"
      en: "Saul and Jonathan, lovely, and comely in their life, even in death they were not divided: they were swifter than eagles, stronger than lions."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "filiae Israhel super Saul flete qui vestiebat vos coccino in deliciis qui praebebat ornamenta aurea cultui vestro"
      en: "Ye daughters of Israel, weep over Saul, who clothed you with scarlet in delights, who gave ornaments of gold for your attire."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quomodo ceciderunt fortes in proelio Ionathan in excelsis tuis occisus est"
      en: "How are the valiant fallen in battle? Jonathan slain in the high places?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "doleo super te frater mi Ionathan decore nimis et amabilis super amorem mulierum"
      en: "I grieve for thee, my brother Jonathan: exceeding beautiful, and amiable to me above the love of women. As the mother loveth her only son, so did I love thee."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "quomodo ceciderunt robusti et perierunt arma bellica"
      en: "How are the valiant fallen, and the weapons of war perished?"
    status: { la: verified, en: verified }
