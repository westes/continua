# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: apoc
chapter: 5
verses:
  - n: 1
    text:
      la: "Et vidi in dextera sedentis supra thronum, librum scriptum intus et foris, signatum sigillis septem."
      en: "And I saw in the right hand of him that sat on the throne, a book written within and without, sealed with seven seals."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et vidi angelum fortem, praedicantem voce magna: Quis est dignus aperire librum, et solvere signacula ejus?"
      en: "And I saw a strong angel, proclaiming with a loud voice: Who is worthy to open the book, and to loose the seals thereof?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et nemo poterat neque in caelo, neque in terra, neque subtus terram aperire librum, neque respicere illum."
      en: "And no man was able, neither in heaven, nor on earth, nor under the earth, to open the book, nor to look on it."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et ego flebam multum, quoniam nemo dignus inventus est aperire librum, nec videre eum."
      en: "And I wept much, because no man was found worthy to open the book, nor to see it."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et unus de senioribus dixit mihi: Ne fleveris: ecce vicit leo de tribu Juda, radix David, aperire librum, et solvere septem signacula ejus."
      en: "And one of the ancients said to me: Weep not; behold the lion of the tribe of Juda, the root of David, hath prevailed to open the book, and to loose the seven seals thereof."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et vidi: et ecce in medio throni et quatuor animalium, et in medio seniorum, Agnum stantem tamquam occisum, habentem cornua septem, et oculos septem: qui sunt septem spiritus Dei, missi in omnem terram."
      en: "And I saw: and behold in the midst of the throne and of the four living creatures, and in the midst of the ancients, a Lamb standing as it were slain, having seven horns and seven eyes: which are the seven Spirits of God, sent forth into all the earth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et venit: et accepit de dextera sedentis in throno librum."
      en: "And he came and took the book out of the right hand of him that sat on the throne."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et cum aperuisset librum, quatuor animalia, et viginti quatuor seniores ceciderunt coram Agno, habentes singuli citharas, et phialas aureas plenas odoramentorum, quae sunt orationes sanctorum:"
      en: "And when he had opened the book, the four living creatures, and the four and twenty ancients fell down before the Lamb, having every one of them harps, and golden vials full of odours, which are the prayers of saints:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et cantabant canticum novum, dicentes: Dignus es, Domine, accipere librum, et aperire signacula ejus: quoniam occisus es, et redemisti nos Deo in sanguine tuo ex omni tribu, et lingua, et populo, et natione:"
      en: "And they sung a new canticle, saying: Thou art worthy, O Lord, to take the book, and to open the seals thereof; because thou wast slain, and hast redeemed us to God, in thy blood, out of every tribe, and tongue, and people, and nation."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et fecisti nos Deo nostro regnum, et sacerdotes: et regnabimus super terram."
      en: "And hast made us to our God a kingdom and priests, and we shall reign on the earth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et vidi, et audivi vocem angelorum multorum in circuitu throni, et animalium, et seniorum: et erat numerus eorum millia millium,"
      en: "And I beheld, and I heard the voice of many angels round about the throne, and the living creatures, and the ancients; and the number of them was thousands of thousands,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dicentium voce magna: Dignus est Agnus, qui occisus est, accipere virtutem, et divinitatem, et sapientiam, et fortitudinem, et honorem, et gloriam, et benedictionem."
      en: "Saying with a loud voice: The Lamb that was slain is worthy to receive power, and divinity, and wisdom, and strength, and honour, and glory, and benediction."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et omnem creaturam, quae in caelo est, et super terram, et sub terra, et quae sunt in mari, et quae in eo: omnes audivi dicentes: Sedenti in throno, et Agno, benedictio et honor, et gloria, et potestas in saecula saeculorum."
      en: "And every creature, which is in heaven, and on the earth, and under the earth, and such as are in the sea, and all that are in them: I heard all saying: To him that sitteth on the throne, and to the Lamb, benediction, and honour, and glory, and power, for ever and ever."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et quatuor animalia dicebant: Amen. Et viginti quatuor seniores ceciderunt in facies suas: et adoraverunt viventem in saecula saeculorum."
      en: "And the four living creatures said: Amen. And the four and twenty ancients fell down on their faces, and adored him that liveth for ever and ever."
    status: { la: verified, en: verified }
