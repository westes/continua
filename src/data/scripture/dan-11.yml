# Douay-Rheims + Latin Vulgate, from drbo.org (Douay-Rheims Bible
# Online) -- the "DR + LV" combined page keeps every verse's Latin
# and English paired in the same block, avoiding the verse-
# misalignment this project's first-pass "Unbound Bible" source had
# for dan 11 specifically; see TODO.md's bulk scripture import entry.
book: dan
chapter: 11
verses:
  - n: 1
    text:
      la: "Ego autem ab anno primo Darii Medi stabam ut confortaretur et roboraretur."
      en: "And from the first year of Darius the Mede I stood up that he might be strengthened and confirmed."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et nunc veritatem annuntiabo tibi. Ecce adhuc tres reges stabunt in Perside, et quartus ditabitur opibus nimiis super omnes : et cum invaluerit divitiis suis, concitabit omnes adversum regnum Graeciae."
      en: "And now I will shew thee the truth. Behold there shall stand yet three kings in Persia, and the fourth shall be enriched exceedingly above them all: and when he shall be grown mighty by his riches, he shall stir up all against the kingdom of Greece."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Surget vero rex fortis, et dominabitur potestate multa, et faciet quod placuerit ei."
      en: "But there shall rise up a strong king, and shall rule with great power: and he shall do what he pleaseth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et cum steterit, conteretur regnum ejus, et dividetur in quatuor ventos caeli : sed non in posteros ejus, neque secundum potentiam illius, qua dominatus est : lacerabitur enim regnum ejus etiam in externos, exceptis his."
      en: "And when he shall come to his height, his kingdom shall be broken, and it shall be divided towards the four winds of the heaven: but not to his posterity, nor according to his power with which he ruled. For his kingdom shall be rent in pieces, even for strangers, beside these."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et confortabitur rex austri : et de principibus ejus praevalebit super eum, et dominabitur ditione : multa enim dominatio ejus."
      en: "And the king of the south shall be strengthened, and one of his princes shall prevail over him, and he shall rule with great power: for his dominion shall be great."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et post finem annorum foederabuntur : filiaque regis austri veniet ad regem aquilonis facere amicitiam, et non obtinebit fortitudinem brachii, nec stabit semen ejus : et tradetur ipsa, et qui adduxerunt eam adolescentes ejus, et qui confortabant eam in temporibus."
      en: "And after the end of years they shall be in league together: and the daughter of the king of the south shall come to the king of the north to make friendship, but she shall not obtain the strength of the arm, neither shall her seed stand: and she shall be given up, and her young men that brought her, and they that strengthened her in these times."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et stabit de germine radicum ejus plantatio : et veniet cum exercitu, et ingredietur provinciam regis aquilonis : et abutetur eis, et obtinebit."
      en: "And a plant of the bud of her roots, shall stand up: and he shall come with an army, and shall enter into the province of the king of the north: and he shall abuse them, and shall prevail."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Insuper et deos eorum, et sculptilia, vasa quoque pretiosa argenti et auri, captiva ducet in Aegyptum : ipse praevalebit adversus regem aquilonis."
      en: "And he shall also carry away captive into Egypt their gods, and their graven things, and their precious vessels of gold and silver: he shall prevail against the king of the north."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et intrabit in regnum rex austri, et revertetur ad terram suam."
      en: "And the king of the south shall enter into the kingdom, and shall return to his own land."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Filii autem ejus provocabuntur, et congregabunt multitudinem exercituum plurimorum : et veniet properans, et inundans : et revertetur, et concitabitur, et congredietur cum robore ejus."
      en: "And his sons shall be provoked, and they shall assemble a multitude of great forces: and he shall come with haste like a flood: and he shall return and be stirred up, and he shall join battle with his forces."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et provocatus rex austri egredietur, et pugnabit adversus regem aquilonis, et praeparabit multitudinem nimiam, et dabitur multitudo in manu ejus."
      en: "And the king of the south being provoked shall go forth, and shall fight against the king of the north, and shall prepare an exceeding great multitude, and a multitude shall be given into his hand."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et capiet multitudinem, et exaltabitur cor ejus, et dejiciet multa millia, sed non praevalebit."
      en: "And he shall take a multitude, and his heart shall be lifted up, and he shall cast down many thousands: but he shall not prevail."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Convertetur enim rex aquilonis, et praeparabit multitudinem multo majorem quam prius : et in fine temporum annorumque veniet properans cum exercitu magno, et opibus nimiis."
      en: "For the king of the north shall return and shall prepare a multitude much greater than before: and in the end of times and years, he shall come in haste with a great army, and much riches."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et in temporibus illis multi consurgent adversus regem austri : filii quoque praevaricatorum populi tui extollentur ut impleant visionem, et corruent."
      en: "And in those times many shall rise up against the king of the south, and the children of prevaricators of thy people shall lift up themselves to fulfill the vision, and they shall fall."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et venit rex aquilonis, et comportabit aggerem, et capiet urbes munitissimas : et brachia austri non sustinebunt, et consurgent electi ejus ad resistendum, et non erit fortitudo."
      en: "And the king of the north shall come, and shall cast up a mount, and shall take the best fenced cities: and the arms of the south shall not withstand, and his chosen ones shall rise up to resist, and they shall not have strength."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et faciet veniens super eum juxta placitum suum, et non erit qui stet contra faciem ejus : et stabit in terra inclyta, et consumetur in manu ejus."
      en: "And he shall come upon him and do according to his pleasure, and there shall be none to stand against his face: and he shall stand in the glorious land, and it shall be consumed by his hand."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et ponet faciem suam ut veniat ad tenendum universum regnum ejus, et recta faciet cum eo : et filiam feminarum dabit ei, ut evertat illud : et non stabit, nec illius erit."
      en: "And he shall set his face to come to possess all his kingdom, and he shall make upright conditions with him: and he shall give him a daughter of women, to overthrow it: and she shall not stand, neither shall she be for him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et convertet faciem suam ad insulas, et capiet multas : et cessare faciet principem opprobrii sui, et opprobrium ejus convertetur in eum."
      en: "And he shall turn his face to the islands, and shall take many: and he shall cause the prince of his reproach to cease, and his reproach shall be turned upon him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et convertet faciem suam ad imperium terrae suae, et impinget, et corruet, et non invenietur."
      en: "And he shall turn his face to the empire of his own land, and he shall stumble, and fall, and shall not be found."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et stabit in loco ejus vilissimus, et indignus decore regio : et in paucis diebus conteretur, non in furore, nec in praelio."
      en: "And there shall stand up in his place, one most vile, and unworthy of kingly honour: and in a few days he shall be destroyed, not in rage nor in battle."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et stabit in loco ejus despectus, et non tribuetur ei honor regius : et veniet clam, et obtinebit regnum in fraudulentia."
      en: "And there shall stand up in his place one despised, and the kingly honour shall not be given him: and he shall come privately, and shall obtain the kingdom by fraud."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et brachia pugnantis expugnabuntur a facie ejus, et conterentur : insuper et dux foederis."
      en: "And the arms of the fighter shall be overcome before his face, and shall be broken; yea also the prince of the covenant."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et post amicitias, cum eo faciet dolum : et ascendet, et superabit in modico populo."
      en: "And after friendships, he will deal deceitfully with him: and he shall go up, and shall overcome with a small people."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et abundantes, et uberes urbes ingredietur : et faciet quae non fecerunt patres ejus, et patres patrum ejus : rapinas, et praedam, et divitias eorum dissipabit, et contra firmissimas cogitationes inibit : et hoc usque ad tempus."
      en: "And he shall enter into rich and plentiful cities: and he shall do that which his fathers never did, nor his fathers' fathers: he shall scatter their spoils, and their prey, and their riches, and shall forecast devices against the best fenced places: and this until a time."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et concitabitur fortitudo ejus, et cor ejus adversum regem austri in exercitu magno : et rex austri provocabitur ad bellum multis auxiliis, et fortibus nimis : et non stabunt, quia inibunt adversus eum consilia."
      en: "And his strength and his heart shall be stirred up against the king of the south with a great army: and the king of the south shall be stirred up to battle with many and very strong succours: and they shall not stand, for they shall form designs against him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et comedentes panem cum eo, conterent illum, exercitusque ejus opprimetur : et cadent interfecti plurimi."
      en: "And they that eat bread with him, shall destroy him, and his army shall be overthrown: and many shall fall down slain."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Duorum quoque regum cor erit ut malefaciant, et ad mensam unam mendacium loquentur : et non proficient, quia adhuc finis in aliud tempus."
      en: "And the heart of the two kings shall be to do evil, and they shall speak lies at one table, and they shall not prosper: because as yet the end is unto another time."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et revertetur in terram suam cum opibus multis : et cor ejus adversum testamentum sanctum, et faciet, et revertetur in terram suam."
      en: "And he shall return into his land with much riches: and his heart shall be against the holy covenant, and he shall succeed and shall return into his own land."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Statuto tempore revertetur, et veniet ad austrum : et non erit priori simile novissimum."
      en: "At the time appointed he shall return, and he shall come to the south, but the latter time shall not be like the former."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et venient super eum trieres, et Romani : et percutietur, et revertetur, et indignabitur contra testamentum sanctuarii, et faciet : reverteturque, et cogitabit adversum eos qui dereliquerunt testamentum sanctuarii."
      en: "And the galleys and the Romans shall come upon him, and he shall be struck, and shall return, and shall have indignation against the covenant of the sanctuary, and he shall succeed: and he shall return and shall devise against them that have forsaken the covenant of the sanctuary."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et brachia ex eo stabunt, et polluent sanctuarium fortitudinis, et auferent juge sacrificium : et dabunt abominationem in desolationem."
      en: "And arms shall stand on his part, and they shall defile the sanctuary of strength, and shall take away the continual sacrifice, and they shall place there the abomination unto desolation."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et impii in testamentum simulabunt fraudulenter : populus autem sciens Deum suum, obtinebit, et faciet."
      en: "And such as deal wickedly against the covenant shall deceitfully dissemble: but the people that know their God shall prevail and succeed."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et docti in populo docebunt plurimos : et ruent in gladio, et in flamma, et in captivitate, et in rapina dierum."
      en: "And they that are learned among the people shall teach many: and they shall fall by the sword, and by fire, and by captivity, and by spoil for many days."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Cumque corruerint, sublevabuntur auxilio parvulo : et applicabuntur eis plurimi fraudulenter."
      en: "And when they shall have fallen they shall be relieved with a small help: and many shall be joined to them deceitfully."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et de eruditis ruent, ut conflentur, et eligantur, et dealbentur usque ad tempus praefinitum : quia adhuc aliud tempus erit."
      en: "And some of the learned shall fall, that they may be tried, and may be chosen, and made white even to the appointed time, because yet there shall be another time."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et faciet juxta voluntatem suam rex, et elevabitur, et magnificabitur adversus omnem deum : et adversus Deum deorum loquetur magnifica, et dirigetur, donec compleatur iracundia : perpetrata quippe est definitio."
      en: "And the king shall do according to his will, and he shall be lifted up, and shall magnify himself against every god: and he shall speak great things against the God of gods, and shall prosper, till the wrath be accomplished. For the determination is made."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et Deum patrum suorum non reputabit : et erit in concupiscentiis feminarum, nec quemquam deorum curabit, quia adversum universa consurget."
      en: "And he shall make no account of the God of his fathers: and he shall follow the lust of women, and he shall not regard any gods: for he shall rise up against all things."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Deum autem Maozim in loco suo venerabitur : et deum, quem ignoraverunt patres ejus, colet auro, et argento, et lapide pretioso, rebusque pretiosis."
      en: "But he shall worship the god Maozim in his place: and a god whom his fathers knew not, he shall worship with gold, and silver, and precious stones, and things of great price."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et faciet ut muniat Maozim cum deo alieno, quem cognovit, et multiplicabit gloriam, et dabit eis potestatem in multis, et terram dividet gratuito."
      en: "And he shall do this to fortify Maozim with a strange god, whom he hath acknowledged, and he shall increase glory and shall give them power over many, and shall divide the land gratis."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et in tempore praefinito praeliabitur adversus eum rex austri, et quasi tempestas veniet contra illum rex aquilonis in curribus, et in equitibus, et in classe magna, et ingredietur terras, et conteret, et pertransiet."
      en: "And at the time prefixed the king of the south shall fight against him, and the king of the north shall come against him like a tempest, with chariots, and with horsemen, and with a great navy, and he shall enter into the countries, and shall destroy, and pass through."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et introibit in terram gloriosam, et multae corruent : hae autem solae salvabuntur de manu ejus, Edom, et Moab, et principium filiorum Ammon."
      en: "And he shall enter into the glorious land, and many shall fall: and these only shall be saved out of his hand, Edom, and Moab, and the principality of the children of Ammon."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et mittet manum suam in terras : et terra Aegypti non effugiet."
      en: "And he shall lay his hand upon the lands: and the land of Egypt shall not escape."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Et dominabitur thesaurorum auri, et argenti, et in omnibus pretiosis Aegypti : per Libyam quoque, et Aethiopiam transibit."
      en: "And he shall have power over the treasures of gold, and of silver, and all the precious things of Egypt: and he shall pass through Libya, and Ethiopia."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Et fama turbabit eum ab oriente et ab aquilone : et veniet in multitudine magna ut conterat et interficiat plurimos."
      en: "And tidings out of the east, and out of the north shall trouble him: and he shall come with a great multitude to destroy and slay many."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Et figet tabernaculum suum Apadno inter maria, super montem inclytum et sanctum : et veniet usque ad summitatem ejus, et nemo auxiliabitur ei."
      en: "And he shall fix his tabernacle Apadno between the seas, upon a glorious and holy mountain: and he shall come even to the top thereof, and none shall help him."
    status: { la: verified, en: verified }
