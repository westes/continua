book: ezek
chapter: 32
verses:
  - n: 1
    text:
      la: "et factum est duodecimo anno in mense duodecimo in una mensis factum est verbum Domini ad me dicens"
      en: "And it came to pass in the twelfth year, in the twelfth month, in the first day of the month, that the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fili hominis adsume lamentum super Pharao regem Aegypti et dices ad eum leoni gentium adsimilatus es et draconi qui est in mari et ventilabas cornu in fluminibus tuis et conturbabas aquas pedibus tuis et conculcabas flumina eorum"
      en: "Son of man, take up a lamentation for Pharao the king of Egypt, and say to him: Thou art like the lion of the nations, and the dragon that is in the sea: and thou didst push with the horn in thy rivers, and didst trouble the waters with thy feet, and didst trample upon their streams."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "propterea haec dicit Dominus Deus expandam super te rete meum in multitudine populorum multorum et extrahent te in sagena mea"
      en: "Therefore, thus saith the Lord God: I will spread out my net over thee with the multitude of many people, and I will draw thee up in my net."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et proiciam te in terram super faciem agri abiciam te et habitare faciam super te omnia volatilia caeli et saturabo de te bestias universae terrae"
      en: "And I will throw thee out on the land, I will cast thee away into the open field: and I will cause all the fowls of the air to dwell upon thee, and I will fill the beasts of all the earth with thee."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et dabo carnes tuas super montes et implebo colles tuos sanie tua"
      en: "And I will lay thy flesh upon the mountains, and will fill thy hills with thy corruption,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et inrigabo terram pedore sanguinis tui super montes et valles implebuntur ex te"
      en: "And I will water the earth with thy stinking blood upon the mountains, and the valleys shall be filled with thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et operiam cum extinctus fueris caelos et nigrescere faciam stellas eius solem nube tegam et luna non dabit lumen suum"
      en: "And I will cover the heavens, when thou shalt be put out, and I will make the stars thereof dark: I will cover the sun with a cloud, and the moon shall not give her light."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "omnia luminaria caeli maerere faciam super te et dabo tenebras super terram tuam dicit Dominus Deus"
      en: "I will make all the lights of heaven to mourn over thee: and I will cause darkness upon thy land, saith the Lord God, when thy wounded shall fall in the midst of the land, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et inritabo cor populorum multorum cum induxero contritionem tuam in gentibus super terras quas nescis"
      en: "And I shall provoke to anger the heart of many people, when I shall have brought in thy destruction among the nations upon the lands, which thou knowest not."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et stupescere faciam super te populos multos et reges eorum horrore nimio formidabunt super te cum volare coeperit gladius meus super facies eorum et obstupescent repente singuli pro anima sua in die ruinae suae"
      en: "And I will make many people to be amazed at thee, and their kings shell be horribly afraid for thee, when my sword shall begin to fly upon their faces: and they shall be astonished on a sudden, every one for his own life, in the day of their ruin."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quia haec dicit Dominus Deus gladius regis Babylonis veniet tibi"
      en: "For thus saith the Lord God: The sword of the king of Babylon shall come upon thee,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "in gladiis fortium deiciam multitudinem tuam inexpugnabiles gentes omnes heae et vastabunt superbiam Aegypti et dissipabitur multitudo eius"
      en: "By the swords of the mighty I will overthrow thy multitude: all these nations are invincible: and they shall waste the pride of Egypt, and the multitude thereof shall be destroyed."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et perdam omnia iumenta eius quae erant super aquas plurimas et non conturbabit eas pes hominis ultra neque ungula iumentorum turbabit eas"
      en: "I will destroy also all the beasts thereof that were beside the great waters: and the foot of man shall trouble them no more, neither shall the hoof of beasts trouble them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "tunc purissimas reddam aquas eorum et flumina eorum quasi oleum adducam ait Dominus Deus"
      en: "Then will I make their waters clear, and cause their rivers to run like oil, saith the Lord God:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cum dedero terram Aegypti desolatam deseretur autem terra a plenitudine sua quando percussero omnes habitatores eius et scient quia ego Dominus"
      en: "When I shall have made the land of Egypt desolate: and the land shall be destitute of her fulness, when I shall have struck all the inhabitants thereof: and they shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "planctus est et plangent eum filiae gentium plangent eum super Aegypto et super multitudine eius plangent eum ait Dominus Deus"
      en: "This is the lamentation, and they shall lament therewith: the daughters of the nations shall lament therewith: for Egypt, and for the multitude thereof they shall lament therewith, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et factum est in duodecimo anno in quintadecima mensis factum est verbum Domini ad me dicens"
      en: "And it came to pass in the twelfth year, in the fifteenth day of the month that the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "fili hominis cane lugubre super multitudine Aegypti et detrahe eam ipsam et filias gentium robustarum ad terram ultimam cum his qui descendunt in lacum"
      en: "Son of man, sing a mournful song for the multitude of Egypt: and cast her down, both her, and the daughters of the mighty nations to the lowest part of the earth, with them that go down into the pit."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quo pulchrior es descende et dormi cum incircumcisis"
      en: "Whom dost thou excel in beauty? go down and sleep with the uncircumcised."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "in medio interfectorum gladio cadent gladius datus est adtraxerunt eam et omnes populos eius"
      en: "They shall fall in the midst of them that are slain with the sword : the sword is given, they have drawn her down, and all her people."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "loquentur ei potentissimi robustorum de medio inferni qui cum auxiliatoribus eius descenderunt et dormierunt incircumcisi interfecti gladio"
      en: "The most mighty among the strong ones shall speak to him from the midst of hell, they that went down with his helpers, and slept uncircumcised, slain by the sword."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ibi Assur et omnis multitudo eius in circuitu illius sepulchra eius omnes interfecti et qui ceciderunt gladio"
      en: "Assur is there, and all his multitude: their graves are round about him, all of them slain, and that fell by the sword."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quorum data sunt sepulchra in novissimis laci et facta est multitudo eius per gyrum sepulchri eius universi interfecti cadentesque gladio qui dederant quondam formidinem in terra viventium"
      en: "Whose graves are set in the lowest parts of the pit: and his multitude lay round about his grave: all of them slain, and fallen by the sword, they that heretofore spread terror in the land of the living."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ibi Aelam et omnis multitudo eius per gyrum sepulchri sui omnes hii interfecti ruentesque gladio qui descenderunt incircumcisi ad terram ultimam qui posuerunt terrorem suum in terra viventium et portaverunt ignominiam suam cum his qui descendunt in lacum"
      en: "There is Elam and all his multitude round about his grave, all of them slain, and fallen by the sword; that went down uncircumcised to the lowest parts of the earth: that caused their terror in the land of the living, and they have borne their shame with them that go down into the pit."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "in medio interfectorum posuerunt cubile eius in universis populis eius in circuitu eius sepulchrum illius omnes hii incircumcisi interfectique gladio dederant enim terrorem in terra viventium et portaverunt ignominiam suam cum his qui descendunt in lacum in medio interfectorum positi sunt"
      en: "In the midst of the slain they have set him a bed among all his people: their graves are round about him: all these are uncircumcised, and slain by the sword: for they spread their terror in the land of the living, and have borne their shame with them that descend into the pit: they are laid in the midst of the slain."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ibi Mosoch et Thubal et omnis multitudo eius in circuitu illius sepulchra eius omnes hii incircumcisi interfectique et cadentes gladio quia dederunt formidinem suam in terra viventium"
      en: "There is Mosoch, and Thubal, and all their multitude: their graves are round about him: all of them uncircumcised and slain, and fallen by the sword: though they spread their terror in the land of the living."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et non dormient cum fortibus cadentibusque et incircumcisis qui descenderunt ad infernum cum armis suis et posuerunt gladios suos sub capitibus suis et fuerunt iniquitates eorum in ossibus eorum quia terror fortium facti sunt in terra viventium"
      en: "And they shall not sleep with the brave, and with them that fell uncircumcised, that went down to hell with their weapons, and laid their swords under their heads, and their iniquities were in their bones, because they were the terror of the mighty in the land of the living."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et tu ergo in medio incircumcisorum contereris et dormies cum interfectis gladio"
      en: "So thou also shalt be broken in the midst of the uncircumcised, and shalt sleep with them that are slain by the sword."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ibi Idumea et reges eius omnes duces eius qui dati sunt cum exercitu suo cum interfectis gladio et qui cum incircumcisis dormierunt et cum his qui descenderunt in lacum"
      en: "There is Edom, and her kings, and all her princes, who with their army are joined with them that are slain by the sword: and have slept with the uncircumcised, and with them that go down into the pit."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ibi principes aquilonis omnes et universi venatores qui deducti sunt cum interfectis paventes et in sua fortitudine confusi qui dormierunt incircumcisi cum interfectis gladio et portaverunt confusionem suam cum his qui descendunt in lacum"
      en: "There are all the princes of the north, and all the hunters: who were brought down with the slain, fearing, and con- founded in their strength: who slept uncircumcised with them that are slain by the sword, and have borne their shame with them that go down into the pit."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "vidit eos Pharao et consolatus est super universa multitudine sua quae interfecta est gladio Pharao et omnis exercitus eius ait Dominus Deus"
      en: "Pharao saw them, and he was comforted concerning all his multitude, which was slain by the sword: Pharao, and all his army, saith the Lord God:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quia dedi terrorem meum in terra viventium et dormivit in medio incircumcisorum cum interfectis gladio Pharao et omnis multitudo eius ait Dominus Deus"
      en: "Because I have spread my terror in the land of the living, and he hath slept in the midst of the uncircumcised with them that are slain by the sword: Pharao and all his multitude, saith the Lord God."
    status: { la: verified, en: verified }
