# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2mach
chapter: 9
verses:
  - n: 1
    text:
      la: "eodem tempore Antiochus inhoneste revertebatur de Perside"
      en: "At that time Antiochus returned with dishonour out of Persia."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "intraverat enim ea quae dicitur Persipolis et temptavit expoliare templa et civitatem opprimere sed multitudine ad arma concurrente in fugam versi sunt et ita contigit ut Antiochus post fugam turpiter rediret"
      en: "For he had entered into the city called Persepolis, and attempted to rob the temple, and to oppress the city: but the multitude running together to arms, put them to flight: and so it fell out that Antiochus being put to flight returned with disgrace."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et cum venisset circa Ecbatana recognovit quae erga Nicanorem et Timotheum gesta sunt"
      en: "Now when he was come about Ecbatana, he received the news of what had happened to Nicanor and Timotheus."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "elatus autem ira arbitrabatur se iniuriam illorum qui se fugaverant posse in Iudaeos retorquere ideoque iussit agitari currum sine intermissione agens iter caelesti eum iudicio perurguente quod ita superbe locutus est venturum se Hierosolymam et congeriem sepulchri Iudaeorum eam facturum"
      en: "And swelling with anger he thought to revenge upon the Jews the injury done by them that had put him to flight. And therefore he commanded his chariot to be driven, without stopping in his journey, the judgment of heaven urging him forward, because he had spoken so proudly, that he would come to Jerusalem, and make it a common burying place of the Jews."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "sed qui universa conspicit Dominus Israhel percussit eum insanabili et invisibili plaga ut enim finivit hunc ipsum sermonem adprehendit eum dolor dirus viscerum et amara internorum tormenta"
      en: "But the Lord the God of Israel, that seeth all things, struck him with an in- curable and an invisible plague. For as soon as he had ended these words, a dreadful pain in his bowels came upon him, and bitter torments of the inner parts."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et quidem satis iuste quippe qui multis et novis cruciatibus aliorum torserat viscera licet ille nullo modo a sua malitia cessaret"
      en: "And indeed very justly, seeing he had tormented the bowels of others with many and new torments, albeit he by no means ceased from his malice."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "super haec autem superbia repletus ignem spirans animo in Iudaeos et praecipiens adcelerare negotium contigit illum impetu euntem de curru cadere et gravi corporis conlisione membra vexare"
      en: "Moreover being filled with pride, breathing out fire in his rage against the Jews, and commanding the matter to be hastened, it happened as he was going with violence that he fell from the chariot, so that his limbs were much pained by a grievous bruising of the body."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "isque qui sibi videbatur etiam fluctibus maris imperare supra humanum modum superbia repletus et montium altitudines in statera adpendere nunc humiliatus ad terram in gestatorio portabatur manifestam Dei virtutem in semet ipso contestans"
      en: "Thus he that seemed to himself to command even the waves of the sea, being proud above the condition of man, and to weigh the heights of the mountains in a balance, now being cast down to the ground, was carried in a litter, bearing witness to the manifest power of God in himself:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ita ut de corpore impii vermes scaturrirent ac viventes in doloribus carnes eius effluerent odore etiam illius et fetore exercitus gravaretur"
      en: "So that worms swarmed out of the body of this man, and whilst he lived in sorrow and pain, his flesh fell off, and the filthiness of his smell was noisome to the army."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et qui paulo ante sidera caeli contingere se arbitrabatur eum nemo poterat propter intolerantiam fetoris portare"
      en: "And the man that thought a little to before he could reach the stars of heaven, no man could endure to carry, for the intolerable stench."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "hinc igitur coepit ex gravi superbia deductus ad agnitionem sui venire divina admonitus plaga per momenta singula doloribus suis augmenta capientibus"
      en: "And by this means, being brought from his great pride, he began to come to the knowledge of himself, being admonished by the scourge of God, his pains increasing every moment"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et cum nec ipse iam fetorem suum ferre posset ita ait iustum est subditum esse Deo et mortalem non paria Deo sentire"
      en: "And when he himself could not now abide his own stench, he spoke thus: It is just to be subject to God, and that a mortal man should not equal himself to God."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "orabat autem haec scelestus Dominum a quo non esset misericordiam consecuturus"
      en: "Then this wicked man prayed to the Lord, of whom he was not like to obtain mercy."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et civitatem ad quam festinans veniebat ut eam ad solum deduceret et sepulchrum congestorum faceret nunc optat liberam reddere"
      en: "And the city to which he was going in haste to lay it even with the ground, and to make it a, common buryingplace, he now desireth to make free."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et Iudaeos quos nec sepultura quidem se dignos habituros sed avibus ac feris diripiendos traditurum et cum parvulis exterminaturum dixerat aequales nunc Atheniensibus facturum pollicetur"
      en: "And the Jews whom he said he would not account worthy to be so much as buried, but would give them up to be devoured by the birds and wild beasts, and would utterly destroy them with their children, he now promiseth to make equal with the Athenians."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "templum etiam sanctum quod prius expoliaverat optimis donis ornaturum et sancta vasa multiplicaturum et pertinentes ad sacrificia sumptus de reditibus suis praestaturum"
      en: "The holy temple also which before he had spoiled, he promiseth to adorn with goodly gifts, and to multiply the holy vessels, and to allow out of his revenues the charges pertaining to the sacrifices."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "super haec et Iudaeum futurum et omnem locum terrae perambulaturum et praedicaturum Dei potestatem"
      en: "Yea also, that he would become a Jew himself, and would go through every place of the earth, and declare the power of God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sed non cessantibus doloribus supervenerat enim in eum iustum Dei iudicium desperans scripsit ad Iudaeos in modum deprecationis epistulam haec continentem"
      en: "But his pains not ceasing (for the just judgment of God was come upon him) despairing of life he wrote to the Jews in the manner of a supplication, a letter in these words:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "optimis civibus Iudaeis plurimam salutem et bene valere et esse felices rex et princeps Antiochus"
      en: "To his very good subjects the Jews, Antiochus king and ruler wisheth much health and welfare, and happiness."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "si bene valetis et filii vestri et ex sententia vobis cuncta sunt maximas agimus gratias"
      en: "If you and your children are well, and if all matters go with you to your mind, we give very great thanks."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et ego in infirmitate constitutus vestri autem benigne memor regressus de Persidis locis et infirmitate gravi adprehensus necessarium duxi pro communi utilitate curam habere"
      en: "As for me, being infirm, but yet kindly remembering you, returning out of the places of Persia, and being taken with a grievous disease, I thought it necessary to take care for the common good:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "non desperans memet ipsum sed spem multam habeo effugiendi infirmitatem"
      en: "Not distrusting my life, but having great hope to escape the sickness."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "respiciens autem quod et pater quibus temporibus in locis superioribus ducebat exercitum ostendit qui post se susciperet principatum"
      en: "But considering that my father also, at what time she led an army into the higher countries, appointed who should reign after him:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ut si quid contrarium accideret aut difficile nuntiaretur scientes hii qui in regionibus erant cui esset rerum summa derelicta non turbarentur"
      en: "To the end that if any thing contrary to expectation should fall out, or ally bad tidings should be brought, they that were in the countries, knowing to whom the whole government was left, might not be troubled."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ad haec considerans de proximo potentes quosque et vicinos temporibus insidiantes et eventum expectantes designavi filium meum Antiochum regem quem saepe recurrens in superiora regna multis vestrum commendabam et scripsi ad eum quae subiecta sunt"
      en: "Moreover, considering that neighbouring princes and borderers wait for opportunities, and expect what shall be the event, I have appointed my son Antiochus king, whom I often recommended to many of you, when I went into the higher provinces: and I have written to him what I have joined here below."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "orate itaque vos et peto memores beneficiorum publice et privatim ut unusquisque conservet fidem ad me et ad filium meum"
      en: "I pray you therefore, and request of you, that remembering favours both public and private, you will every man of you continue to be faithful to me and to my son."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "confido enim eum modeste et humane acturum et sequentem propositum meum communem vobis fore"
      en: "For I trust that he will behave with I moderation and humanity, and following my intentions, will be gracious unto you."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "igitur homicida et blasphemus pessime percussus et ut ipse alios tractaverat peregre in montibus miserabili obitu vita functus est"
      en: "Thus the murderer and blasphemer, being grievously struck, as himself had treated others, died a miserable death in a strange country among the mountains."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "transferebat autem corpus Philippus conlactaneus eius qui metuens filium Antiochi ad Ptolomeum Filometora in Aegyptum abiit"
      en: "But Philip that was brought up with him, carried away his body: and out of fear of the son of Antiochus, went into Egypt to Ptolemee Philometor."
    status: { la: verified, en: verified }
