# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1reg
chapter: 20
verses:
  - n: 1
    text:
      la: "fugit autem David de Nahioth quae erat in Rama veniensque locutus est coram Ionathan quid feci quae est iniquitas mea et quod peccatum meum in patrem tuum quia quaerit animam meam"
      en: "But David fled from Najoth, which is in Ramatha, and came and said to Jonathan: What have I done? what is my iniquity, and what is my sin against thy father, that he seeketh my life?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "qui dixit ei absit non morieris neque enim faciet pater meus quicquam grande vel parvum nisi prius indicaverit mihi hunc ergo celavit me pater meus sermonem tantummodo nequaquam erit istud"
      en: "And he said to him: God forbid, thou shalt not die: for my father will do nothing great or little, without first telling me: hath then my father hid this word only from me? no, this shall not be."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et iuravit rursum David et ille ait scit profecto pater tuus quia inveni gratiam in oculis tuis et dicet nesciat hoc Ionathan ne forte tristetur quinimmo vivit Dominus et vivit anima tua quia uno tantum ut ita dicam gradu ego morsque dividimur"
      en: "And he swore again to David. And David said: Thy father certainly knoweth that I have found grace in thy sight, and he will say: Let not Jonathan know this, lest he be grieved. But truly as the Lord liveth, and thy soul liveth, there is but one step (as I may say) between me and death."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ait Ionathan ad David quodcumque dixerit mihi anima tua faciam tibi"
      en: "And Jonathan said to David: Whatsoever thy soul shall say to me, I will do for thee."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixit autem David ad Ionathan ecce kalendae sunt crastino et ego ex more sedere soleo iuxta regem ad vescendum dimitte ergo me ut abscondar in agro usque ad vesperam diei tertiae"
      en: "And David said to Jonathan: Behold to morrow is the new moon, and I according to custom am wont to sit beside the king to eat: let me go then that I may be hid in the field till the evening of the third day."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "si requisierit me pater tuus respondebis ei rogavit me David ut iret celeriter in Bethleem civitatem suam quia victimae sollemnes ibi sunt universis contribulibus eius"
      en: "If thy father look and inquire for me, thou shalt answer him: David asked me that he might run to Bethlehem his own city: because there are solemn sacrifices there for all his tribe."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "si dixerit bene pax erit servo tuo si autem fuerit iratus scito quia conpleta est malitia eius"
      en: "If he shall say, It is well: thy servant shall have peace: but if he be angry, know that his malice is come to its height."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "fac ergo misericordiam in servum tuum quia foedus Domini me famulum tuum tecum inire fecisti si autem est in me aliqua iniquitas tu me interfice et ad patrem tuum ne introducas me"
      en: "Deal mercifully then with thy servant: for thou hast brought me thy servant into a covenant of the Lord with thee. But if there be any iniquity in me, do thou kill me, and bring me not in to thy father."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et ait Ionathan absit hoc a te neque enim fieri potest ut si certo cognovero conpletam patris mei esse malitiam contra te non adnuntiem tibi"
      en: "And Jonathan said: Far be this from thee: for if I should certainly know that evil is determined by my father against thee, I could do no otherwise than tell thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "responditque David ad Ionathan quis nuntiabit mihi si quid forte responderit tibi pater tuus dure"
      en: "And David answered Jonathan: Who shall bring me word, if thy father should answer thee harshly concerning me?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et ait Ionathan ad David veni egrediamur in agrum cumque exissent ambo in agrum"
      en: "And Jonathan said to David: Come and let us go out into the field. And when they were both of them gone out into the field,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ait Ionathan ad David Domine Deus Israhel si investigavero sententiam patris mei crastino vel perendie et aliquid boni fuerit super David et non statim misero ad te et notum tibi fecero"
      en: "Jonathan said to David: O Lord God of Israel, if I shall discover my father's mind, to morrow or the day after, and there be any thing good for David, and I send not immediately to thee, and make it known to thee,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "haec faciat Dominus Ionathan et haec augeat si autem perseveraverit patris mei malitia adversum te revelabo aurem tuam et dimittam te ut vadas in pace et sit Dominus tecum sicut fuit cum patre meo"
      en: "May the Lord do so and so to Jonathan and add still more. But if my father shall continue in malice against thee, I will discover it to thy ear, and will send thee away, that thou mayest go in peace, and the Lord be with thee, as he hath been with my father."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et si vixero facies mihi misericordiam Domini si vero mortuus fuero"
      en: "And if I live, thou shalt shew me the kindness of the Lord: but if I die,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "non auferas misericordiam tuam a domo mea usque in sempiternum quando eradicaverit Dominus inimicos David unumquemque de terra"
      en: "Thou shalt not take away thy kindness from my house for ever, when the Lord shall have rooted out the enemies of David, every one of them from the earth, may he take away Jonathan from his house, and may the Lord require it at the hands of David's enemies."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "pepigit ergo foedus Ionathan cum domo David et requisivit Dominus de manu inimicorum David"
      en: "Jonathan therefore made a covenant with the house of David: and the Lord required it at the hands of David's enemies."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et addidit Ionathan deierare David eo quod diligeret illum sicut animam enim suam ita diligebat eum"
      en: "And Jonathan swore again to David, because he loved him: for he loved him as his own soul."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dixitque ad eum Ionathan cras kalendae sunt et requireris"
      en: "And Jonathan said to him: To morrow is the new moon, and thou wilt be missed:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "requiretur enim sessio tua usque perendie descendes ergo festinus et venies in locum ubi celandus es in die qua operari licet et sedebis iuxta lapidem cui est nomen Ezel"
      en: "For thy seat will be empty till after tomorrow. So thou shalt go down quickly, and come to the place, where thou must be hid on the day when it is lawful to work, and thou shalt remain beside the stone, which is called Ezel."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et ego tres sagittas mittam iuxta eum et iaciam quasi exercens me ad signum"
      en: "And I will shoot three arrows near it, and will shoot as if I were exercising myself at a mark."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "mittam quoque et puerum dicens ei vade et adfer mihi sagittas"
      en: "And I will send a boy, saying to him: Go and fetch me the arrows."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "si dixero puero ecce sagittae intra te sunt tolle eas tu veni ad me quia pax tibi est et nihil est mali vivit Dominus si autem sic locutus fuero puero ecce sagittae ultra te sunt vade quia dimisit te Dominus"
      en: "If I shall say to the boy: Behold the arrows are on this side of thee, take them up: come thou to me, because, there is peace to thee, and there is no evil, as the Lord liveth. But if I shall speak thus to the boy: Behold the arrows are beyond thee: go in peace, for the Lord hath sent thee away."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "de verbo autem quod locuti fuimus ego et tu sit Dominus inter me et te usque in sempiternum"
      en: "And concerning the word which I and thou have spoken, the Lord be between thee and me for ever."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "absconditus est ergo David in agro et venerunt kalendae et sedit rex ad comedendum panem"
      en: "So David was hid in the field, and the new moon came, and the king sat down to eat bread."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "cumque sedisset rex super cathedram suam secundum consuetudinem quae erat iuxta parietem surrexit Ionathan et sedit Abner ex latere Saul vacuusque apparuit locus David"
      en: "And when the king sat down upon his chair (according to custom) which was beside the wall, Jonathan arose, and Abner sat by Saul's side, and David's place appeared empty."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et non est locutus Saul quicquam in die illa cogitabat enim quod forte evenisset ei ut non esset mundus nec purificatus"
      en: "And Saul said nothing that day, for he thought it might have happened to him, that he was not clean, nor purified."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "cumque inluxisset dies secunda post kalendas rursum vacuus apparuit locus David dixitque Saul ad Ionathan filium suum cur non venit filius Isai nec heri nec hodie ad vescendum"
      en: "And when the second day after the new moon was come, David's place appeared empty again. And Saul said to Jonathan his son: Why cometh not the son of Isai to meat neither yesterday nor to day?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et respondit Ionathan Sauli rogavit me obnixe ut iret in Bethleem"
      en: "And Jonathan answered Saul: He asked leave of me earnestly to go to Bethlehem,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et ait dimitte me quoniam sacrificium sollemne est in civitate unus de fratribus meis accersivit me nunc ergo si inveni gratiam in oculis tuis vadam cito et videbo fratres meos ob hanc causam non venit ad mensam regis"
      en: "And he said: Let me go, for there is a solemn sacrifice in the city, one of my brethren hath sent for me: and now if I have found favour in thy eyes, I will go quickly, and see my brethren. For this cause he came not to the king's table."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "iratus autem Saul adversus Ionathan dixit ei fili mulieris virum ultro rapientis numquid ignoro quia diligis filium Isai in confusionem tuam et in confusionem ignominiosae matris tuae"
      en: "Then Saul being angry against Jonathan said to him: Thou son of a woman that is the ravisher of a man, do I not know that thou lovest the son of Isai to thy own confusion and to the confusion of thy shameless mother?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "omnibus enim diebus quibus filius Isai vixerit super terram non stabilieris tu neque regnum tuum itaque iam nunc mitte et adduc eum ad me quia filius mortis est"
      en: "For as long as the son of Isai liveth upon earth, thou shalt not be established, nor thy kingdom. Therefore now presently send, and fetch him to me: for he is the son of death."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "respondens autem Ionathan Sauli patri suo ait quare moritur quid fecit"
      en: "And Jonathan answering Saul his father, said: Why shall he die: what hath he done?"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et arripuit Saul lanceam ut percuteret eum et intellexit Ionathan quod definitum esset patri suo ut interficeret David"
      en: "And Saul caught up a spear to strike him. And Jonathan understood that it was determined by his father to kill David."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "surrexit ergo Ionathan a mensa in ira furoris et non comedit in die kalendarum secunda panem contristatus est enim super David eo quod confudisset eum pater suus"
      en: "So Jonathan rose from the table in great anger, and did not eat bread on the second day after the new moon. For he was grieved for David, because his father had put him to confusion."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "cumque inluxisset mane venit Ionathan in agrum iuxta placitum David et puer parvulus cum eo"
      en: "And when the morning came, Jonathan went into the field, according to the appointment with David, and a little boy with him."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et ait ad puerum suum vade et adfer mihi sagittas quas ego iacio cumque puer cucurrisset iecit aliam sagittam trans puerum"
      en: "And he said to his boy: Go, and fetch me the arrows which I shoot. And when the boy ran, he shot another arrow beyond the boy."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "venit itaque puer ad locum iaculi quod miserat Ionathan et clamavit Ionathan post tergum pueri et ait ecce ibi est sagitta porro ultra te"
      en: "The boy therefore came to the place of the arrow which Jonathan had shot: and Jonathan cried after the boy, and said: Behold the arrow is there further beyond thee."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "clamavitque Ionathan post tergum pueri festina velociter ne steteris collegit autem puer Ionathae sagittas et adtulit ad dominum suum"
      en: "And Jonathan cried again after the boy, saying: Make haste speedily, stand not. And Jonathan's boy gathered up the arrows, and brought them to his master:"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et quid ageretur penitus ignorabat tantummodo enim Ionathan et David rem noverant"
      en: "And he knew not at all what was doing: for only Jonathan and David knew the matter."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "dedit igitur Ionathan arma sua puero et dixit ei vade defer in civitatem"
      en: "Jonathan therefore gave his arms to the boy, and said to him: Go, and carry them into the city."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "cumque abisset puer surrexit David de loco qui vergebat ad austrum et cadens pronus in terram adoravit tertio et osculantes alterutrum fleverunt pariter David autem amplius"
      en: "And when the boy was gone, David rose out of his place, which was towards the south, and falling on his face to the ground, adored thrice: and kissing one another, they wept together, but David more."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "dixit ergo Ionathan ad David vade in pace quaecumque iuravimus ambo in nomine Domini dicentes Dominus sit inter me et te et inter semen meum et semen tuum usque in sempiternum"
      en: "And Jonathan said to David: Go in peace: and let all stand that we have sworn both of us in the name of the Lord, saying: The Lord be between me and thee, and between my seed and thy seed for ever."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et surrexit et abiit sed et Ionathan ingressus est civitatem"
      en: "And David arose, and departed: and Jonathan went into the city."
    status: { la: verified, en: verified }
