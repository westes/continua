# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: deut
chapter: 3
verses:
  - n: 1
    text:
      la: "Itaque conversi ascendimus per iter Basan: egressusque est Og rex Basan in occursum nobis cum populo suo ad bellandum in Edrai."
      en: "Then we turned and went by the way of Basan: and Og the king of Basan came out to meet us with his people to fight in Edrai."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dixitque Dominus ad me: Ne timeas eum: quia in manu tua traditus est cum omni populo ac terra sua: faciesque ei sicut fecisti Sehon regi Amorrhaeorum, qui habitavit in Hesebon."
      en: "And the Lord said to me: Fear him not: because he is delivered into thy hand, with all his people and his land: and thou shalt do to him as thou hast done to Sehon king of the Amorrhites, that dwelt in Hesebon."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tradidit ergo Dominus Deus noster in manibus nostris etiam Og regem Basan, et universum populum ejus: percussimusque eos usque ad internecionem,"
      en: "So the Lord our God delivered into our hands, Og also the king of Basan, and all his people: and we utterly destroyed them,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "vastantes cunctas civitates illius uno tempore. Non fuit oppidum, quod nos effugeret: sexaginta urbes, omnem regionem Argob regni Og in Basan."
      en: "Wasting all his cities at one time, there was not a town that escaped us: sixty cities, all the country of Argob the kingdom of Og in Basan."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cunctae urbes erant munitae muris altissimis, portisque et vectibus, absque oppidis innumeris, quae non habebant muros."
      en: "All the cities were fenced with very high walls, and with gates and bars, besides innumerable towns that had no walls."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et delevimus eos, sicut feceramus Sehon regi Hesebon, disperdentes omnem civitatem, virosque ac mulieres et parvulos:"
      en: "And we utterly destroyed them, as we had done to Sehon the king of Hesebon, destroying every city, men and women and children:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "jumenta autem et spolia urbium diripuimus."
      en: "But the cattle and the spoils of the cities we took for our prey."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Tulimusque illo in tempore terram de manu duorum regum Amorrhaeorum, qui erant trans Jordanem: a torrente Arnon usque ad montem Hernon,"
      en: "And we took at that time the land out of the hand of the two kings of the Amorrhites, that were beyond the Jordan: from the torrent Arnon unto the mount Hermon,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quem Sidonii Sarion vocant, et Amorrhaei Sanir:"
      en: "Which the Sidonians call Sarion, and the Amorrhites Sanir:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "omnes civitates, quae sitae sunt in planitie, et universam terram Galaad et Basan usque ad Selcha, et Edrai civitates regni Og in Basan."
      en: "All the cities that are situate in the plain, and all the land of Galaad and Basan as far as Selcha and Edrai, cities of the kingdom of Og in Basan."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Solus quippe Og rex Basan restiterat de stirpe gigantum. Monstratur lectus ejus ferreus, qui est in Rabbath filiorum Ammon, novem cubitos habens longitudinis, et quatuor latitudinis ad mensuram cubiti virilis manus."
      en: "For only Og king of Basan remained of the race of the giants. His bed of iron is shewn, which is in Rabbath of the children of Ammon, being nine cubits long, and four broad after the measure of the cubit of a man's hand."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Terramque possedimus tempore illo ab Aroer, quae est super ripam torrentis Arnon, usque ad mediam partem montis Galaad: et civitates illius dedi Ruben et Gad."
      en: "And we possessed the land at that time from Aroer, which is upon the bank of the torrent Arnon, unto the half of mount Galaad: and I gave the cities thereof to Ruben and Gad."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Reliquam autem partem Galaad, et omnem Basan regni Og, tradidi mediae tribui Manasse, omnem regionem Argob: cunctaque Basan vocatur Terra gigantum."
      en: "And I delivered the other part of Galaad, and all Basan the kingdom of Og to the half tribe of Manasses, all the country of Argob: and all Basan is called the Land of giants."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Jair filius Manasse possedit omnem regionem Argob usque ad terminos Gessuri et Machati. Vocavitque ex nomine suo Basan, Havoth Jair, id est, Villas Jair, usque in praesentem diem."
      en: "Jair the son of Manasses possessed all the country of Argob unto the borders of Gessuri, and Machati. And he called Basan by his own name, Havoth Jair, that is to say, the towns of Jair, until this present day."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Machir quoque dedi Galaad."
      en: "To Machir also I gave Galaad."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et tribubus Ruben et Gad dedi de terra Galaad usque ad torrentem Arnon medium torrentis, et confinium usque ad torrentem Jeboc, qui est terminus filiorum Ammon:"
      en: "And to the tribes of Ruben and Gad I gave of the land of Galaad as far as the torrent Arnon, half the torrent, and the confines even unto the torrent Jeboc, which is the border of the children of Ammon:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et planitiem solitudinis, atque Jordanem, et terminos Cenereth usque ad mare deserti, quod est salsissimum, ad radices montis Phasga contra orientem."
      en: "And the plain of the wilderness, and the Jordan, and the borders of Cenereth unto the sea of the desert, which is the most salt sea, to the foot of mount Phasga eastward."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Praecepique vobis in tempore illo, dicens: Dominus Deus vester dat vobis terram hanc in haereditatem: expediti praecedite fratres vestros filios Israel omnes viri robusti,"
      en: "And I commanded you at that time, saying: The Lord your God giveth you this land for an inheritance, go ye well appointed before your brethren the children of Israel, all the strong men of you,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "absque uxoribus, et parvulis, atque jumentis. Novi enim quod plura habeatis pecora, et in urbibus remanere debebunt, quas tradidi vobis,"
      en: "Leaving your wives and children and cattle. For I know you have much cattle, and they must remain in the cities, which I have delivered to you."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "donec requiem tribuat Dominus fratribus vestris, sicut vobis tribuit: et possideant ipsi etiam terram, quam daturus est eis trans Jordanem: tunc revertetur unusquisque in possessionem suam, quam dedi vobis."
      en: "Until the Lord give rest to your brethren, as he hath given to you: and they also possess the land, which he will give them beyond the Jordan: then shall every man return to his possession, which I have given you."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Josue quoque in tempore illo praecepi, dicens: Oculi tui viderunt quae fecit Dominus Deus vester duobus his regibus: sic faciet omnibus regnis, ad quae transiturus es."
      en: "I commanded Josue also at that time, saying: Thy eyes have seen what the Lord your God hath done to these two kings: so will he do to all the kingdoms to which thou shalt pass."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ne timeas eos: Dominus enim Deus vester pugnabit pro vobis."
      en: "Fear them not: for the Lord your God will fight for you."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Precatusque sum Dominum in tempore illo, dicens:"
      en: "And I besought the Lord at that time, saying:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Domine Deus, tu coepisti ostendere servo tuo magnitudinem tuam, manumque fortissimam: neque enim est alius deus vel in caelo, vel in terra, qui possit facere opera tua, et comparari fortitudini tuae."
      en: "Lord God, thou hast begun to shew unto thy servant thy greatness, and most mighty hand, for there is no other God either in heaven or earth, that is able to do thy works, or to be compared to thy strength."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Transibo igitur, et videbo terram hanc optimam trans Jordanem, et montem istum egregium, et Libanum."
      en: "I will pass over therefore, and will see this excellent land beyond the Jordan, and this goodly mountain, and Libanus."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Iratusque est Dominus mihi propter vos, nec exaudivit me, sed dixit mihi: Sufficit tibi: nequaquam ultra loquaris de hac re ad me."
      en: "And the Lord was angry with me on your account and heard me not, but said to me: It is enough: speak no more to me of this matter."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ascende cacumen Phasgae, et oculos tuos circumfer ad occidentem, et ad aquilonem, austrumque et orientem, et aspice; nec enim transibis Jordanem istum."
      en: "Go up to the top of Phasga, and cast thy eyes round about to the west, and to the north, and to the south, and to the east, and behold it, for thou shalt not pass this Jordan."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Praecipe Josue, et corrobora eum atque conforta: quia ipse praecedet populum istum, et dividet eis terram quam visurus es."
      en: "Command Josue, and encourage and strengthen him: for he shall go before this people, and shall divide unto them the land which thou shalt see."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Mansimusque in valle contra fanum Phogor."
      en: "And we abode in the valley over against the temple of Phogor."
    status: { la: verified, en: verified }
