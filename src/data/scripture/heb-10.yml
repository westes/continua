# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: heb
chapter: 10
verses:
  - n: 1
    text:
      la: "umbram enim habens lex bonorum futurorum non ipsam imaginem rerum per singulos annos hisdem ipsis hostiis quas offerunt indesinenter numquam potest accedentes perfectos facere"
      en: "For the law having a shadow of the good things to come, not the very image of the things; by the selfsame sacrifices which they offer continually every year, can never make the comers thereunto perfect:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "alioquin non cessassent offerri ideo quod nullam haberent ultra conscientiam peccati cultores semel mundati"
      en: "For then they would have ceased to be offered: because the worshippers once cleansed should have no conscience of sin any longer:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sed in ipsis commemoratio peccatorum per singulos annos fit"
      en: "But in them there is made a commemoration of sins every year."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "inpossibile enim est sanguine taurorum et hircorum auferri peccata"
      en: "For it is impossible that with the blood of oxen and goats sin should be taken away."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ideo ingrediens mundum dicit hostiam et oblationem noluisti corpus autem aptasti mihi"
      en: "Wherefore when he cometh into the world, he saith: Sacrifice and oblation thou wouldest not: but a body thou hast fitted to me:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "holocaustomata et pro peccato non tibi placuit"
      en: "Holocausts for sin did not please thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "tunc dixi ecce venio in capitulo libri scriptum est de me ut faciam Deus voluntatem tuam"
      en: "Then said I: Behold I come: in the head of the book it is written of me: that I should do thy will, O God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "superius dicens quia hostias et oblationes et holocaustomata et pro peccato noluisti nec placita sunt tibi quae secundum legem offeruntur"
      en: "In saying before, Sacrifices, and oblations, and holocausts for sin thou wouldest not, neither are they pleasing to thee, which are offered according to the law."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "tunc dixit ecce venio ut faciam Deus voluntatem tuam aufert primum ut sequens statuat"
      en: "Then said I: Behold, I come to do thy will, O God: he taketh away the first, that he may establish that which followeth."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in qua voluntate sanctificati sumus per oblationem corporis Christi Iesu in semel"
      en: "In the which will, we are sanctified by the oblation of the body of Jesus Christ once."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et omnis quidem sacerdos praesto est cotidie ministrans et easdem saepe offerens hostias quae numquam possunt auferre peccata"
      en: "And every priest indeed standeth daily ministering, and often offering the same sacrifices, which can never take away sins."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "hic autem unam pro peccatis offerens hostiam in sempiternum sedit in dextera Dei"
      en: "But this man offering one sacrifice for sins, for ever sitteth on the right hand of God,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "de cetero expectans donec ponantur inimici eius scabillum pedum eius"
      en: "From henceforth expecting, until his enemies be made his footstool."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "una enim oblatione consummavit in sempiternum sanctificatos"
      en: "For by one oblation he hath perfected for ever them that are sanctified."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "contestatur autem nos et Spiritus Sanctus postquam enim dixit"
      en: "And the Holy Ghost also doth testify this to us. For after that he said:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "hoc autem testamentum quod testabor ad illos post dies illos dicit Dominus dando leges meas in cordibus eorum et in mente eorum superscribam eas"
      en: "And this is the testament which I will make unto them after those days, saith the Lord. I will give my laws in their hearts, and on their minds will I write them:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et peccatorum et iniquitatium eorum iam non recordabor amplius"
      en: "And their sins and iniquities I will remember no more."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ubi autem horum remissio iam non oblatio pro peccato"
      en: "Now where there is a remission of these, there is no more an oblation for sin."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "habentes itaque fratres fiduciam in introitu sanctorum in sanguine Christi"
      en: "Having therefore, brethren, a confidence in the entering into the holies by the blood of Christ;"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quam initiavit nobis viam novam et viventem per velamen id est carnem suam"
      en: "A new and living way which he hath dedicated for us through the veil, that is to say, his flesh,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et sacerdotem magnum super domum Dei"
      en: "And a high priest over the house of God:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "accedamus cum vero corde in plenitudine fidei aspersi corda a conscientia mala et abluti corpus aqua munda"
      en: "Let us draw near with a true heart in fulness of faith, having our hearts sprinkled from an evil conscience, and our bodies washed with clean water."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "teneamus spei nostrae confessionem indeclinabilem fidelis enim est qui repromisit"
      en: "Let us hold fast the confession of our hope without wavering (for he is faithful that hath promised),"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et consideremus invicem in provocationem caritatis et bonorum operum"
      en: "And let us consider one another, to provoke unto charity and to good works:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "non deserentes collectionem nostram sicut est consuetudinis quibusdam sed consolantes et tanto magis quanto videritis adpropinquantem diem"
      en: "Not forsaking our assembly, as some are accustomed; but comforting one another, and so much the more as you see the day approaching."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "voluntarie enim peccantibus nobis post acceptam notitiam veritatis iam non relinquitur pro peccatis hostia"
      en: "For if we sin wilfully after having the knowledge of the truth, there is now left no sacrifice for sins,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "terribilis autem quaedam expectatio iudicii et ignis aemulatio quae consumptura est adversarios"
      en: "But a certain dreadful expectation of judgment, and the rage of a fire which shall consume the adversaries."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "irritam quis faciens legem Mosi sine ulla miseratione duobus vel tribus testibus moritur"
      en: "A man making void the law of Moses, dieth without any mercy under two or three witnesses:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quanto magis putatis deteriora mereri supplicia qui Filium Dei conculcaverit et sanguinem testamenti pollutum duxerit in quo sanctificatus est et Spiritui gratiae contumeliam fecerit"
      en: "How much more, do you think he deserveth worse punishments, who hath trodden under foot the Son of God, and hath esteemed the blood of the testament unclean, by which he was sanctified, and hath offered an affront to the Spirit of grace?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "scimus enim qui dixit mihi vindictam ego reddam et iterum quia iudicabit Dominus populum suum"
      en: "For we know him that hath said: Vengeance belongeth to me, and I will repay. And again: The Lord shall judge his people."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "horrendum est incidere in manus Dei viventis"
      en: "It is a fearful thing to fall into the hands of the living God."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "rememoramini autem pristinos dies in quibus inluminati magnum certamen sustinuistis passionum"
      en: "But call to mind the former days, wherein, being illuminated, you endured a great fight of afflictions."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et in altero quidem obprobriis et tribulationibus spectaculum facti in altero autem socii taliter conversantium effecti"
      en: "And on the one hand indeed, by reproaches and tribulations, were made a gazingstock; and on the other, became companions of them that were used in such sort."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "nam et vinctis conpassi estis et rapinam bonorum vestrorum cum gaudio suscepistis cognoscentes vos habere meliorem et manentem substantiam"
      en: "For you both had compassion on them that were in bands, and took with joy the being stripped of your own goods, knowing that you have a better and a lasting substance."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "nolite itaque amittere confidentiam vestram quae magnam habet remunerationem"
      en: "Do not therefore lose your confidence, which hath a great reward."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "patientia enim vobis necessaria est ut voluntatem Dei facientes reportetis promissionem"
      en: "For patience is necessary for you; that, doing the will of God, you may receive the promise."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "adhuc enim modicum quantulum qui venturus est veniet et non tardabit"
      en: "For yet a little and a very little while, and he that is to come, will come, and will not delay."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "iustus autem meus ex fide vivit quod si subtraxerit se non placebit animae meae"
      en: "But my just man liveth by faith; but if he withdraw himself, he shall not please my soul."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "nos autem non sumus subtractionis in perditionem sed fidei in adquisitionem animae"
      en: "But we are not the children of withdrawing unto perdition, but of faith to the saving of the soul."
    status: { la: verified, en: verified }
