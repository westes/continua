# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 21
verses:
  - n: 1
    text:
      la: "haec sunt iudicia quae propones eis"
      en: "These are the judgments which thou shalt set before them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "si emeris servum hebraeum sex annis serviet tibi in septimo egredietur liber gratis"
      en: "If thou buy a Hebrew servant, six years shall he serve thee: in the seventh he shall go out free for nothing."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cum quali veste intraverit cum tali exeat si habens uxorem et uxor egredietur simul"
      en: "With what raiment he came in, with the like let him go out: if having a wife, his wife also shall go out with him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sin autem dominus dederit illi uxorem et peperit filios et filias mulier et liberi eius erunt domini sui ipse vero exibit cum vestitu suo"
      en: "But if his master gave him a wife, and she hath borne sons and daughters: the woman and her children shall be her master's: but he himself shall go out with his raiment."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quod si dixerit servus diligo dominum meum et uxorem ac liberos non egrediar liber"
      en: "And if the servant shall say: I love my master and my wife and children, I will not go out free:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "offeret eum dominus diis et adplicabitur ad ostium et postes perforabitque aurem eius subula et erit ei servus in saeculum"
      en: "His master shall bring him to the gods, and he shall be set to the door and the posts, and he shall bore his ear through with an awl: and he shall be his servant for ever."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "si quis vendiderit filiam suam in famulam non egredietur sicut ancillae exire consuerunt"
      en: "If any man sell his daughter to be a servant, she shall not go out as bondwomen are wont to go out."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "si displicuerit oculis domini sui cui tradita fuerit dimittet eam populo autem alieno vendendi non habet potestatem si spreverit eam"
      en: "If she displease the eyes of her master to whom she was delivered, he shall let her go: but he shall have no power to sell her to a foreign nation, if he despise her."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sin autem filio suo desponderit eam iuxta morem filiarum faciet illi"
      en: "But if he have betrothed her to his son, he shall deal with her after the manner of daughters."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quod si alteram ei acceperit providebit puellae nuptias et vestimenta et pretium pudicitiae non negabit"
      en: "And if he take another wife for him, he shall provide her a marriage, and raiment, neither shall he refuse the price of her chastity."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "si tria ista non fecerit egredietur gratis absque pecunia"
      en: "If he do not these three things, she shall go out free without money."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "qui percusserit hominem volens occidere morte moriatur"
      en: "He that striketh a man with a will to kill him, shall be put to death."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui autem non est insidiatus sed Deus illum tradidit in manu eius constituam tibi locum quo fugere debeat"
      en: "But he that did not lie in wait for him, but God delivered him into his hands: I will appoint thee a place to which he must flee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "si quis de industria occiderit proximum suum et per insidias ab altari meo evelles eum ut moriatur"
      en: "If a man kill his neighbour on set purpose and by lying in wait for him: thou shalt take him away from my altar, that he may die."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui percusserit patrem suum et matrem morte moriatur"
      en: "He that striketh his father or mother, shall be put to death."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "qui furatus fuerit hominem et vendiderit eum convictus noxae morte moriatur"
      en: "He that shall steal a man, and sell him, being convicted of guilt, shall be put to death."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qui maledixerit patri suo et matri morte moriatur"
      en: "He that curseth his father, or mother, shall die the death."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "si rixati fuerint viri et percusserit alter proximum suum lapide vel pugno et ille mortuus non fuerit sed iacuerit in lectulo"
      en: "If men quarrel, and the one strike his neighbour with a stone or with his fist, and he die not, but keepeth his bed:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "si surrexerit et ambulaverit foris super baculum suum innocens erit qui percussit ita tamen ut operas eius et inpensas in medicos restituat"
      en: "If he rise again and walk abroad upon his staff, he that struck him shall be quit, yet so that he make restitution for his work, and for his expenses upon the physicians."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "qui percusserit servum suum vel ancillam virga et mortui fuerint in manibus eius criminis reus erit"
      en: "He that striketh his bondman or bondwoman with a rod, and they die under his hands, shall be guilty of the crime."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "sin autem uno die supervixerit vel duobus non subiacebit poenae quia pecunia illius est"
      en: "But if the party remain alive a day or two, he shall not be subject to the punishment, because it is his money."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "si rixati fuerint viri et percusserit quis mulierem praegnantem et abortivum quidem fecerit sed ipsa vixerit subiacebit damno quantum expetierit maritus mulieris et arbitri iudicarint"
      en: "If men quarrel, and one strike a woman with child, and she miscarry indeed, but live herself: he shall be answerable for so much damage as the woman's husband shall require, and as arbiters shall award."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sin autem mors eius fuerit subsecuta reddet animam pro anima"
      en: "But if her death ensue thereupon, he shall render life for life."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "oculum pro oculo dentem pro dente manum pro manu pedem pro pede"
      en: "Eye for eye, tooth for tooth, hand for hand, foot for foot,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "adustionem pro adustione vulnus pro vulnere livorem pro livore"
      en: "Burning for burning, wound for wound, stripe for stripe."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "si percusserit quispiam oculum servi sui aut ancillae et luscos eos fecerit dimittet liberos pro oculo quem eruit"
      en: "If any man strike the eye of his manservant or maidservant, and leave them but one eye, he shall let them go free for the eye which he put out."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "dentem quoque si excusserit servo vel ancillae suae similiter dimittet eos liberos"
      en: "Also if he strike out a tooth of his manservant or maidservant, he shall in like manner make them free."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "si bos cornu petierit virum aut mulierem et mortui fuerint lapidibus obruetur et non comedentur carnes eius dominusque bovis innocens erit"
      en: "If an ox gore a man or a woman, and they die, he shall be stoned: and his flesh shall not be eaten, but the owner of the ox shall be quit."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quod si bos cornipeta fuerit ab heri et nudius tertius et contestati sunt dominum eius nec reclusit eum occideritque virum aut mulierem et bos lapidibus obruetur et dominum illius occident"
      en: "But if the ox was wont to push with his horn yesterday and the day before, and they warned his master, and he did not shut him up, and he shall kill a man or a woman: then the ox shall be stoned, an his owner also shall be put to death."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quod si pretium ei fuerit inpositum dabit pro anima sua quicquid fuerit postulatus"
      en: "And if they set a price upon him, he shall give for his life whatsoever is laid upon him."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "filium quoque et filiam si cornu percusserit simili sententiae subiacebit"
      en: "If he have gored a son, or a daughter, he shall fall under the like sentence."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "si servum ancillamque invaserit triginta siclos argenti dabit domino bos vero lapidibus opprimetur"
      en: "If he assault a bondman or a bond woman, he shall give thirty sicles of silver to their master, and the ox shall be stoned."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "si quis aperuerit cisternam et foderit et non operuerit eam cecideritque bos vel asinus in eam"
      en: "If a man open a pit, and dig one, and cover it not, and an ox or an ass fall into it,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "dominus cisternae reddet pretium iumentorum quod autem mortuum est ipsius erit"
      en: "The owner of the pit shall pay the price of the beasts: and that which is dead shall be his own."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "si bos alienus bovem alterius vulnerarit et ille mortuus fuerit vendent bovem vivum et divident pretium cadaver autem mortui inter se dispertient"
      en: "If one man's ox gore another man's ox, and he die: they shall sell the live ox, and shall divide the price, and the carcass of that which died they shall part between them:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "sin autem sciebat quod bos cornipeta esset ab heri et nudius tertius et non custodivit eum dominus suus reddet bovem pro bove et cadaver integrum accipiet"
      en: "But if he knew that his ox was wont to push yesterday and the day before, and his master did not keep him in: he shall pay ox for ox, and shall take the whole carcass."
    status: { la: verified, en: verified }
