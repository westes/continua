# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: zach
chapter: 7
verses:
  - n: 1
    text:
      la: "et factum est in anno quarto Darii regis factum est verbum Domini ad Zacchariam in quarta mensis noni qui est casleu"
      en: "And it came to pass in the fourth year of king Darius, that the word of the Lord came to Zacharias, in the fourth day of the ninth month, which is Casleu."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et miserunt ad domum Dei Sarasar et Rogomelech et viri qui erant cum eo ad deprecandam faciem Domini"
      en: "When Sarasar, and Rogommelech, and the men that were with him, sent to the house of God, to entreat the face of the Lord:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ut dicerent sacerdotibus domus Domini exercituum et prophetis loquentes numquid flendum mihi est in mense quinto vel sanctificare me debeo sicuti feci iam multis annis"
      en: "To speak to the priests of the house of the Lord of hosts, and to the prophets, saying: Must I weep in the fifth month, or must I sanctify myself as I have now done for many years?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et factum est verbum Domini exercituum ad me dicens"
      en: "And the word of the Lord of hosts came to me, saying:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "loquere ad omnem populum terrae et ad sacerdotes dicens cum ieiunaretis et plangeretis in quinto et septimo per hos septuaginta annos numquid ieiunium ieiunastis mihi"
      en: "Speak to all the people of the land, and to the priests, saying: When you fasted, and mourned in the fifth and the seventh month for these seventy years: did you keep a fast unto me?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et cum comedistis et cum bibistis numquid non vobis comedistis et vobismet ipsis bibistis"
      en: "And when you did eat and drink, did you not eat for yourselves, and drink for yourselves?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "numquid non sunt verba quae locutus est Dominus in manu prophetarum priorum cum adhuc Hierusalem habitaretur et esset opulenta ipsa et urbes in circuitu eius et ad austrum et in campestribus habitaretur"
      en: "Are not these the words which the Lord spoke by the hand of the former prophets, when Jerusalem as yet was inhabited, and was wealthy, both itself and the cities round about it, and there were inhabitants towards the south, and in the plain?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et factum est verbum Domini ad Zacchariam dicens"
      en: "And the word of the Lord came to Zacharias, saying:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "haec ait Dominus exercituum dicens iudicium verum iudicate et misericordiam et miserationes facite unusquisque cum fratre suo"
      en: "Thus saith the Lord of hosts, saying: Judge ye true judgment, and shew ye mercy and compassion every man to his brother."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et viduam et pupillum et advenam et pauperem nolite calumniari et malum vir fratri suo non cogitet in corde suo"
      en: "And oppress not the widow, and the fatherless, and the stranger, and the poor: and let not a man devise evil in his heart against his brother."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et noluerunt adtendere et verterunt scapulam recedentem et aures suas adgravaverunt ne audirent"
      en: "But they would not hearken, and they turned away the shoulder to depart: and they stopped their ears, not to hear."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et cor suum posuerunt adamantem ne audirent legem et verba quae misit Dominus exercituum in spiritu suo per manum prophetarum priorum et facta est indignatio magna a Domino exercituum"
      en: "And they made their heart as the adamant stone, lest they should hear the law, and the words which the Lord of hosts sent in his spirit by the hand of the former prophets: so a great indignation came from the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et factum est sicut locutus est et non audierunt sic clamabunt et non exaudiam dicit Dominus exercituum"
      en: "And it came to pass that as he spoke, and they heard not: so shall they cry, and I will not hear, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et dispersi eos per omnia regna quae nesciunt et terra desolata est ab eis eo quod non esset transiens et revertens et posuerunt terram desiderabilem in desertum"
      en: "And I dispersed them throughout all kingdoms, which they know not: and the land was left desolate behind them, so that no man passed through or returned: and they changed the delightful land into a wilderness."
    status: { la: verified, en: verified }
