# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 21
verses:
  - n: 1
    text:
      la: "Fili, peccasti, non adjicias iterum: sed et de pristinis deprecare, ut tibi dimittantur."
      en: "My son, hast thou sinned? do so no more: but for thy former sins also pray that they may be forgiven thee."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quasi a facie colubri fuge peccata: et si accesseris ad illa, suscipient te."
      en: "Flee from sins as from the face of a serpent: for if thou comest near them, they will take hold of thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dentes leonis dentes ejus, interficientes animas hominum."
      en: "The teeth thereof are the teeth of a lion, killing the souls of men."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quasi rhomphaea bis acuta omnis iniquitas: plagae illius non est sanitas."
      en: "All iniquity is like a two-edged sword, there is no remedy for the wound thereof."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Objurgatio et injuriae annullabunt substantiam, et domus quae nimis locuples est annullabitur superbia: sic substantia superbi eradicabitur."
      en: "Injuries and wrongs will waste riches: and the house that is very rich shall be brought to nothing by pride: so the substance of the proud shall be rooted out."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Deprecatio pauperis ex ore usque ad aures ejus perveniet, et judicium festinato adveniet illi."
      en: "The prayer out of the mouth of the poor shall reach the ears of God, and judgment shall come for him speedily."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Qui odit correptionem vestigium est peccatoris, et qui timet Deum convertetur ad cor suum."
      en: "He that hateth to be reproved walketh in the trace of a sinner: and he that feareth God will turn to his own heart."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Notus a longe potens lingua audaci, et sensatus scit labi se ab ipso."
      en: "He that is mighty by a bold tongue is known afar off, but a wise man knoweth to slip by him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Qui aedificat domum suam impendiis alienis, quasi qui colligat lapides suos in hieme."
      en: "He that buildeth his house at other men's charges, is as he that gathereth himself stones to build in the winter."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Stupa collecta synagoga peccantium, et consummatio illorum flamma ignis."
      en: "The congregation of sinners is like tow heaped together, and the end of them is a flame of fire."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Via peccatorum complanata lapidibus: et in fine illorum inferi, et tenebrae, et poenae."
      en: "The way of sinners is made plain with stones, and in their end is hell, and darkness, and pains."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Qui custodit justitiam, continebit sensum ejus."
      en: "He that keepeth justice shall get the understanding thereof."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Consummatio timoris Dei, sapientia et sensus."
      en: "The perfection of the fear of God is wisdom and understanding."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Non erudietur qui non est sapiens in bono."
      en: "He that is not wise in good, will not be taught."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Est autem sapientia quae abundat in malo, et non est sensus ubi est amaritudo."
      en: "But there is a wisdom that aboundeth in evil: and there is no understanding where there is bitterness."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Scientia sapientis tamquam inundatio abundabit, et consilium illius sicut fons vitae permanet."
      en: "The knowledge of a wise man shall abound like a flood, and his counsel continueth like a fountain of life."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cor fatui quasi vas confractum, et omnem sapientiam non tenebit."
      en: "The heart of a fool is like a broken vessel, and no wisdom at all shall it hold."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Verbum sapiens quodcumque audierit scius, laudabit, et ad se adjiciet: audivit luxuriosus, et displicebit illi, et projiciet illud post dorsum suum."
      en: "A man of sense will praise every wise word he shall hear, and will apply it to himself: the luxurious man hath heard it, and it shall displease him, and he will cast it behind his back."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Narratio fatui quasi sarcina in via: nam in labiis sensati invenietur gratia."
      en: "The talking of a fool is like a burden in the way: but in the lips of the wise, grace shall be found."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Os prudentis quaeritur in ecclesia, et verba illius cogitabunt in cordibus suis."
      en: "The mouth of the prudent is sought after in the church, and they will think upon his words in their hearts."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Tamquam domus exterminata, sic fatuo sapientia: et scientia insensati inenarrabilia verba."
      en: "As a house that is destroyed, so is wisdom to a fool: and the knowledge of the unwise is as words without sense."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Compedes in pedibus, stulto doctrina: et quasi vincula manuum super manum dextram."
      en: "Doctrine to a fool is as fetters on the feet, and like manacles on the right hand."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Fatuus in risu exaltat vocem suam: vir autem sapiens vix tacite ridebit."
      en: "A fool lifteth up his voice in laughter: but a wise man will scarce laugh low to himself."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ornamentum aureum prudenti doctrina, et quasi brachiale in brachio dextro."
      en: "Learning to the prudent is as an ornament of gold, and like a bracelet upon his right arm."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Pes fatui facilis in domum proximi: et homo peritus confundetur a persona potentis."
      en: "The foot of a fool is soon in his neighbour's house: but a man of experience will be abashed at the person of the mighty."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Stultus a fenestra respiciet in domum: vir autem eruditus foris stabit."
      en: "A fool will peep through the window into the house: but he that is well taught will stand without."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Stultitia hominis auscultare per ostium: et prudens gravabitur contumelia."
      en: "It is the folly of a man to hearken at the door: and a wise man will be grieved with the disgrace."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Labia imprudentium stulta narrabunt; verba autem prudentium statera ponderabuntur."
      en: "The lips of the unwise will be telling foolish things but the words of the wise shall be weighed in a balance."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "In ore fatuorum cor illorum, et in corde sapientium os illorum."
      en: "The heart of fools is in their mouth: and the mouth of wise men is in their heart."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Dum maledicit impius diabolum, maledicit ipse animam suam."
      en: "While the ungodly curseth the devil, he curseth his own soul."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Susurro coinquinabit animam suam, et in omnibus odietur, et qui cum eo manserit odiosus erit: tacitus et sensatus honorabitur."
      en: "The talebearer shall defile his own soul, and shall be hated by all: and he that shall abide with him shall be hateful: the silent and wise man shall be honoured."
    status: { la: verified, en: verified }
