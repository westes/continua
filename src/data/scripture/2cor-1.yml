# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2cor
chapter: 1
verses:
  - n: 1
    text:
      la: "Paulus, Apostolus Jesu Christi per voluntatem Dei, et Timotheus frater, ecclesiae Dei, quae est Corinthi cum omnibus sanctis, qui sunt in universa Achaia."
      en: "Paul, an apostle of Jesus Christ by the will of God, and Timothy our brother: to the church of God that is at Corinth, with all the saints that are in all Achaia:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Gratia vobis, et pax a Deo Patre nostro, et Domino Jesu Christo."
      en: "Grace unto you and peace from God our Father, and from the Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Benedictus Deus et Pater Domini nostri Jesu Christi, Pater misericordiarum, et Deus totius consolationis,"
      en: "Blessed be the God and Father of our Lord Jesus Christ, the Father of mercies, and the God of all comfort."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui consolatur nos in omni tribulatione nostra: ut possimus et ipsi consolari eos qui in omni pressura sunt, per exhortationem, qua exhortamur et ipsi a Deo."
      en: "Who comforteth us in all our tribulation; that we also may be able to comfort them who are in all distress, by the exhortation wherewith we also are exhorted by God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quoniam sicut abundant passiones Christi in nobis: ita et per Christum abundat consolatio nostra."
      en: "For as the sufferings of Christ abound in us: so also by Christ doth our comfort abound."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Sive autem tribulamur pro vestra exhortatione et salute, sive consolamur pro vestra consolatione, sive exhortamur pro vestra exhortatione et salute, quae operatur tolerantiam earumdem passionum, quas et nos patimur:"
      en: "Now whether we be in tribulation, it is for your exhortation and salvation: or whether we be comforted, it is for your consolation: or whether we be exhorted, it is for your exhortation and salvation, which worketh the enduring of the same sufferings which we also suffer."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ut spes nostra firma sit pro vobis: scientes quod sicut socii passionum estis, sic eritis et consolationis."
      en: "That our hope for you may be steadfast: knowing that as you are partakers of the sufferings, so shall you be also of the consolation."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Non enim volumus ignorare vos, fratres, de tribulatione nostra, quae facta est in Asia, quoniam supra modum gravati sumus supra virtutem, ita ut taederet nos etiam vivere."
      en: "For we would not have you ignorant, brethren, of our tribulation, which came to us in Asia, that we were pressed out of measure above our strength, so that we were weary even of life."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sed ipsi in nobismetipsis responsum mortis habuimus, ut non simus fidentes in mortuos, sed in Deo, qui suscitat mortuos:"
      en: "But we had in ourselves the answer of death, that we should not trust in ourselves, but in God who raiseth the dead."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui de tantis periculis nos eripuit, et eruit: in quem speramus quoniam et adhuc eripiet,"
      en: "Who hath delivered and doth deliver us out of so great dangers: in whom we trust that he will yet also deliver us."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "adjuvantibus et vobis in oratione pro nobis: ut ex multorum personis, ejus quae in nobis est donationis, per multos gratiae agantur pro nobis."
      en: "You helping withal in prayer for us: that for this gift obtained for us, by the means of many persons, thanks may be given by many in our behalf."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Nam gloria nostra haec est: testimonium conscientiae nostrae, quod in simplicitate cordis et sinceritate Dei, et non in sapientia carnali, sed in gratia Dei, conversati sumus in hoc mundo: abundantius autem ad vos."
      en: "For our glory is this, the testimony of our conscience, that in simplicity of heart and sincerity of God, and not in carnal wisdom, but in the grace of God, we have conversed in this world: and more abundantly towards you."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Non enim alia scribimus vobis, quam quae legistis, et cognovistis. Spero autem quod usque in finem cognoscetis,"
      en: "For we write no other things to you than what you have read and known. And I hope that you shall know unto the end:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sicut et cognovistis nos ex parte, quod gloria vestra sumus, sicut et vos nostra, in die Domini nostri Jesu Christi."
      en: "As also you have known us in part, that we are your glory, as you also are ours, in the day of our Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et hac confidentia volui prius venire ad vos, ut secundum gratiam haberetis:"
      en: "And in this confidence I had a mind to come to you before, that you might have a second grace:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et per vos transire in Macedoniam, et iterum a Macedonia venire ad vos, et a vobis deduci in Judaeam."
      en: "And to pass by you into Macedonia, and again from Macedonia to come to you, and by you to be brought on my way towards Judea."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cum ergo hoc voluissem, numquid levitate usus sum? aut quae cogito, secundum carnem cogito, ut sit apud me Est et Non?"
      en: "Whereas then I was thus minded, did I use lightness? Or, the things that I purpose, do I purpose according to the flesh, that there should be with me, It is, and It is not?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Fidelis autem Deus, quia sermo noster, qui fuit apud vos, non est in illo Est et Non."
      en: "But God is faithful, for our preaching which was to you, was not, It is, and It is not."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dei enim Filius Jesus Christus, qui in vobis per nos praedicatus est, per me, et Silvanum, et Timotheum, non fuit Est et Non, sed Est in illo fuit."
      en: "For the Son of God, Jesus Christ who was preached among you by us, by me, and Sylvanus, and Timothy, was not, It is and It is not, but, It is, was in him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quotquot enim promissiones Dei sunt, in illo Est: ideo et per ipsum Amen Deo ad gloriam nostram."
      en: "For all the promises of God are in him, It is; therefore also by him, amen to God, unto our glory."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Qui autem confirmat nos vobiscum in Christo, et qui unxit nos Deus:"
      en: "Now he that confirmeth us with you in Christ, and that hath anointed us, is God:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "qui et signavit nos, et dedit pignus Spiritus in cordibus nostris."
      en: "Who also hath sealed us, and given the pledge of the Spirit in our hearts."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ego autem testem Deum invoco in animam meam, quod parcens vobis, non veni ultra Corinthum: non quia dominamur fidei vestae, sed adjutores sumus gaudii vestri: nam fide statis."
      en: "But I call God to witness upon my soul, that to spare you, I came not any more to Corinth: not because we exercise dominion over your faith: but we are helpers of your joy: for in faith you stand."
    status: { la: verified, en: verified }
