# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: prov
chapter: 9
verses:
  - n: 1
    text:
      la: "sapientia aedificavit sibi domum excidit columnas septem"
      en: "Wisdom hath built herself a house, she hath hewn her out seven pillars."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "immolavit victimas suas miscuit vinum et proposuit mensam suam"
      en: "She hath slain her victims, mingled her wine, and set forth her table."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "misit ancillas suas ut vocarent ad arcem et ad moenia civitatis"
      en: "She hath sent her maids to invite to the tower, and to the walls of the city:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "si quis est parvulus veniat ad me et insipientibus locuta est"
      en: "Whosoever is a little one, let him come to me. And to the unwise she said:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "venite comedite panem meum et bibite vinum quod miscui vobis"
      en: "Come, eat my bread, and drink the wine which I have mingled for you."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "relinquite infantiam et vivite et ambulate per vias prudentiae"
      en: "Forsake childishness, and live, and walk by the ways of prudence."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui erudit derisorem ipse sibi facit iniuriam et qui arguit impium generat maculam sibi"
      en: "He that teacheth a scorner, doth an injury to himself: and he that rebuketh a wicked man, getteth himself a blot."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "noli arguere derisorem ne oderit te argue sapientem et diliget te"
      en: "Rebuke not a scorner lest he hate thee. Rebuke a wise man, and he will love thee."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "da sapienti et addetur ei sapientia doce iustum et festinabit accipere"
      en: "Give an occasion to a wise man, and wisdom shall be added to him. Teach a just man, and he shall make haste to receive it."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "principium sapientiae timor Domini et scientia sanctorum prudentia"
      en: "The fear of the Lord is the beginning of wisdom: and the knowledge of the holy is prudence."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "per me enim multiplicabuntur dies tui et addentur tibi anni vitae"
      en: "For by me shall thy days be multiplied, and years of life shall be added to thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "si sapiens fueris tibimet ipsi eris si inlusor solus portabis malum"
      en: "If thou be wise, thou shalt be so to thyself: and if a scorner, thou alone shalt bear the evil."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "mulier stulta et clamosa plenaque inlecebris et nihil omnino sciens"
      en: "A foolish woman and clamorous, and full of allurements, and knowing nothing at all,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sedit in foribus domus suae super sellam in excelso urbis loco"
      en: "Sat at the door of her house, upon a seat, in a high place of the city,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ut vocaret transeuntes viam et pergentes itinere suo"
      en: "To call them that pass by the way, and go on their journey:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quis est parvulus declinet ad me et vecordi locuta est"
      en: "He that is a little one, let him turn to me. And to the fool she said:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "aquae furtivae dulciores sunt et panis absconditus suavior"
      en: "Stolen waters are sweeter, and hid den bread is more pleasant."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ignoravit quod gigantes ibi sint et in profundis inferni convivae eius"
      en: "And he did not know that giants are there, and that her guests are in the depths of hell.  The Parables of Solomon"
    status: { la: verified, en: verified }
