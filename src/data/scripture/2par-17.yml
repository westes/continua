# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 17
verses:
  - n: 1
    text:
      la: "Regnavit autem Josaphat filius ejus pro eo, et invaluit contra Israel."
      en: "And Josaphat his son reigned in his stead, and grew strong against Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Constituitque militum numeros in cunctis urbibus Juda, quae erant vallatae muris. Praesidiaque disposuit in terra Juda, et in civitatibus Ephraim, quas ceperat Asa pater ejus."
      en: "And he placed numbers of soldiers in all the fortified cities of Juda. And he put garrisons in the land of Juda, and in the cities of Ephraim, which Asa his father had taken."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et fuit Dominus cum Josaphat, quia ambulavit in viis David patris sui primis: et non speravit in Baalim,"
      en: "And the Lord was with Josaphat, because he walked in the first ways of David his father: and trusted not in Baalim,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sed in Deo patris sui: et perrexit in praeceptis illius et non juxta peccata Israel."
      en: "But in the God of his father, and walk in his commandments, and not according to the sins of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Confirmavitque Dominus regnum in manu ejus, et dedit omnis Juda munera Josaphat: factaeque sunt ei infinitae divitiae, et multa gloria."
      en: "And the Lord established the kingdom in his hand, and all Juda brought presents to Josaphat: and he acquired immense riches, and much glory."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Cumque sumpsisset cor ejus audaciam propter vias Domini, etiam excelsa et lucos de Juda abstulit."
      en: "And when his heart had taken courage for the ways of the Lord, he took away also the high places and the groves out of Juda."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Tertio autem anno regni sui misit de principibus suis Benhail, et Obdiam, et Zachariam, et Nathanael, et Michaeam ut docerent in civitatibus Juda:"
      en: "And in the third year of his reign, he sent of his princes Benhail, and Abdias, and Zacharias, and Nathanael, and Micheas, to teach in the cities of Juda:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et cum eis Levitas Semeiam, et Nathaniam, et Zabadiam, Asael quoque, et Semiramoth, et Jonathan, Adoniamque et Thobiam, et Thobadoniam Levitas, et cum eis Elisama, et Joran sacerdotes:"
      en: "And with them the Levites, Semeias, and Nathanias, and Zabadias, and Asael, and Semiramoth, and Jonathan, and Adonias, and Tobias, and Thobadonias Levites, and with them Elisama, and Joram priests."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "docebantque populum in Juda, habentes librum legis Domini, et circuibant cunctas urbes Juda, atque erudiebant populum."
      en: "And they taught the people in Juda, having with them the book of the law of the Lord: and they went about all the cities of Juda, and instructed the people."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Itaque factus est pavor Domini super omnia regna terrarum, quae erant per gyrum Juda, nec audebant bellare contra Josaphat."
      en: "And the fear of the Lord came upon all the kingdoms of the lands that were round about Juda, and they durst not make war against Josaphat."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sed et Philisthaei Josaphat munera deferebant, et vectigal argenti: Arabes quoque adducebant pecora, arietum septem millia septingenta, et hircorum totidem."
      en: "The Philistines also brought presents to Josaphat, and tribute in silver, and the Arabians brought him cattle, seven thousand seven hundred rams, and as many he goats."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Crevit ergo Josaphat, et magnificatus est usque in sublime: atque aedificavit in Juda domos ad instar turrium, urbesque muratas."
      en: "And Josaphat grew, and became exceeding great: and he built in Juda houses like towers, and walled cities."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et multa opera paravit in urbibus Juda: viri quoque bellatores, et robusti erant in Jerusalem,"
      en: "And he prepared many works in the cities of Juda: and he had warriors, and valiant men in Jerusalem."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quorum iste numerus per domos atque familias singulorum: in Juda principes exercitus, Ednas dux, et cum eo robustissimi viri trecenta millia."
      en: "Of whom this is the number of the houses and families of every one: in Juda captains of the army, Ednas the chief, and with him three hundred thousand most valiant men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Post hunc Johanan princeps, et cum eo ducenta octoginta millia."
      en: "After him Johanan the captain, and with him two hundred and eighty thousand."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Post istum quoque Amasias filius Zechri, consecratus Domino, et cum eo ducenta millia virorum fortium."
      en: "And after him was Amasias the son of Zechri, consecrated to the Lord, and with him were two hundred thousand valiant men."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Hunc sequebatur robustus ad praelia Eliada, et cum eo tenentium arcum et clypeum ducenta millia."
      en: "After him was Eliada valiant in battle, and with him two hundred thousand armed with bow and shield."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Post istum etiam Jozabad, et cum eo centum octoginta millia expeditorum militum."
      en: "After him also was Jozabad, and with him a hundred and eighty thousand ready for war."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Hi omnes erant ad manum regis, exceptis aliis, quos posuerat in urbibus muratis, in universo Juda."
      en: "All these were at the hand of the king, beside others, whom he had put in the walled cities, in all Juda."
    status: { la: verified, en: verified }
