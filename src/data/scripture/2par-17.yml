# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 17
verses:
  - n: 1
    text:
      la: "regnavit autem Iosaphat filius eius pro eo et invaluit contra Israhel"
      en: "And Josaphat his son reigned in his stead, and grew strong against Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "constituitque militum numeros in cunctis urbibus Iudae quae erant vallatae muris praesidiaque disposuit in terra Iuda et in civitatibus Ephraim quas ceperat Asa pater eius"
      en: "And he placed numbers of soldiers in all the fortified cities of Juda. And he put garrisons in the land of Juda, and in the cities of Ephraim, which Asa his father had taken."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et fuit Dominus cum Iosaphat quia ambulavit in viis David patris sui primis et non speravit in Baalim"
      en: "And the Lord was with Josaphat, because he walked in the first ways of David his father: and trusted not in Baalim,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sed in Deo patris sui et perrexit in praeceptis illius et non iuxta peccata Israhel"
      en: "But in the God of his father, and walk in his commandments, and not according to the sins of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "confirmavitque Dominus regnum in manu eius et dedit omnis Iuda munera Iosaphat factaeque sunt ei infinitae divitiae et multa gloria"
      en: "And the Lord established the kingdom in his hand, and all Juda brought presents to Josaphat: and he acquired immense riches, and much glory."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "cumque sumpsisset cor eius audaciam propter vias Domini etiam excelsa et lucos de Iuda abstulit"
      en: "And when his heart had taken courage for the ways of the Lord, he took away also the high places and the groves out of Juda."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "tertio autem anno regni sui misit de principibus suis Benail et Obdiam et Zacchariam et Nathanahel et Micheam ut docerent in civitatibus Iuda"
      en: "And in the third year of his reign, he sent of his princes Benhail, and Abdias, and Zacharias, and Nathanael, and Micheas, to teach in the cities of Juda:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et cum eis Levitas Semeiam et Nathaniam et Zabadiam Asahel quoque et Semiramoth et Ionathan Adoniam et Tobiam et Tobadoniam Levitas et cum eis Elisama et Ioram sacerdotes"
      en: "And with them the Levites, Semeias, end Nathanias, and Zabadias, and Asael, and Semiramoth, and Jonathan, and Adonias, and Tobias, and Thobadonias Levites, and with them Elisama, and Joram priests."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "docebantque in Iuda habentes librum legis Domini et circuibant cunctas urbes Iuda atque erudiebant populum"
      en: "And they taught the people in Juda, having with them the book of the law of the Lord: and they went about all the cities of Juda, and instructed the people."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "itaque factus est pavor Domini super omnia regna terrarum quae erant per gyrum Iuda nec audebant bellare contra Iosaphat"
      en: "And the fear of the Lord came upon all the kingdoms of the lands that were round about Juda, and they durst not make war against Josaphat."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sed et Philisthei Iosaphat munera deferebant et vectigal argenti Arabes quoque adducebant pecora arietum septem milia septingentos et hircos totidem"
      en: "The Philistines also brought presents to Josaphat, and tribute in silver, and the Arabians brought him cattle, seven thousand seven hundred rams, and as many he goats."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "crevit ergo Iosaphat et magnificatus est usque in sublime atque aedificavit in Iuda domos ad instar turrium urbesque muratas"
      en: "And Josaphat grew, and became exceeding great: and he built in Juda houses like towers, and walled cities."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et multa opera patravit in urbibus Iuda viri quoque bellatores et robusti erant in Hierusalem"
      en: "And he prepared many works in the cities of Juda: and he had warriors, and valiant men in Jerusalem."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quorum iste numerus per domos atque familias singulorum in Iuda principes exercitus Ednas dux et cum eo robustissimorum trecenta milia"
      en: "Of whom this is the number of the houses and families of every one: in Juda captains of the army, Ednas the chief, and with him three hundred thousand most valiant men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "post hunc Iohanan princeps et cum eo ducenta octoginta milia"
      en: "After him Johanan the captain, and with him two hundred and eighty thousand."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "post istum quoque Amasias filius Zechri consecratus Domino et cum eo ducenta milia virorum fortium"
      en: "And after him was Amasias the son of Zechri, consecrated to the Lord, and with him were two hundred thousand valiant men."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "hunc sequebatur robustus ad proelia Heliada et cum eo tenentium arcum et clypeum ducenta milia"
      en: "After him was Eliada valiant in battle, and with him two hundred thousand armed with bow and shield."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "post istum etiam Iozabath et cum eo centum octoginta milia expeditorum militum"
      en: "After him also was Jozabad, and with him a hundred and eighty thousand ready for war."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "hii omnes erant ad manum regis exceptis aliis quos posuerat in urbibus muratis et in universo Iuda"
      en: "All these were at the hand of the king, beside others, whom he had put in the walled cities, in all Juda."
    status: { la: verified, en: verified }
