# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 39
verses:
  - n: 1
    text:
      la: "Anno nono Sedeciae regis Juda, mense decimo, venit Nabuchodonosor rex Babylonis, et omnis exercitus ejus, ad Jerusalem, et obsidebant eam."
      en: "In the ninth year of Sedecias king of Juda, in the tenth month, came Nabuchodonosor king of Babylon, and all his army to Jerusalem, and they besieged it."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Undecimo autem anno Sedeciae, mense quarto, quinta mensis, aperta est civitas:"
      en: "And in the eleventh year of Sedecias, in the fourth month, the fifth day of the month, the city was opened."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ingressi sunt omnes principes regis Babylonis, et sederunt in porta media: Neregel, Sereser, Semegarnabu, Sarsachim, Rabsares, Neregel, Sereser, Rebmag, et omnes reliqui principes regis Babylonis."
      en: "And all the princes of the king of Babylon came in, and sat in the middle gate: Neregel, Sereser, Semegarnabu, Sarsachim, Rabsares, Neregel, Serezer, Rebmag, and all the rest of the princes of the king of Babylon."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cumque vidisset eos Sedecias rex Juda, et omnes viri bellatores, fugerunt: et egressi sunt nocte de civitate per viam horti regis, et per portam quae erat inter duos muros, et egressi sunt ad viam deserti."
      en: "And when Sedecias the king of Juda and all the men of war saw them, they fled: and they went forth in the night out of the city by the way of the king's garden, and by the gate that was between the two walls, and they went; out to the way of the desert."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Persecutus est autem eos exercitus Chaldaeorum, et comprehenderunt Sedeciam in campo solitudinis Jerichontinae, et captum adduxerunt ad Nabuchodonosor regem Babylonis, in Reblatha, quae est in terra Emath: et locutus est ad eum judicia."
      en: "But the army of the Chaldeans pursued after them: and they took Sedecias in the plain of the desert of Jericho, and when they had taken him, they brought him to Nabuchodonosor king of Babylon to Reblatha, which is in the land of Emath: and he gave judgment upon him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et occidit rex Babylonis filios Sedeciae in Reblatha, in oculis ejus: et omnes nobiles Juda occidit rex Babylonis."
      en: "And the king of Babylon slew the sons of Sedecias, in Reblatha, before his eyes: and the king of Babylon slew all the nobles of Juda."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Oculos quoque Sedeciae eruit, et vinxit eum compedibus ut duceretur in Babylonem."
      en: "He also put out the eyes of Sedecias: and bound him with fetters, to be carried to Babylon."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Domum quoque regis et domum vulgi succenderunt Chaldaei igni, et murum Jerusalem subverterunt."
      en: "And the Chaldeans burnt the king's house, and the houses of the people with fire, and they threw down the wall of Jerusalem."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et reliquias populi qui remanserant in civitate, et perfugas qui transfugerant ad eum, et superfluos vulgi qui remanserant, transtulit Nabuzardan, magister militum, in Babylonem."
      en: "And Nabuzardan the general of the army carried away captive to Babylon the remnant of the people that remained in the city, and the fugitives that had gone over to him, and the rest of the people that remained."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et de plebe pauperum, qui nihil penitus habebant, dimisit Nabuzardan, magister militum, in terra Juda, et dedit eis vineas et cisternas in die illa."
      en: "But Nabuzardan the general left some of the poor people that had nothing at all, in the land of Juda, and he gave them vineyards, and cisterns at that time."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Praeceperat autem Nabuchodonosor rex Babylonis de Jeremia Nabuzardan, magistro militum, dicens:"
      en: "Now Nabuchodonosor king of Babylon had given charge to Nabuzardan the general concerning Jeremias, saying:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tolle illum, et pone super eum oculos tuos, nihilque ei mali facias: sed ut voluerit, sic facias ei."
      en: "Take him, and set thy eyes upon him, and do him no harm: but as he hath a mind, so do with him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Misit ergo Nabuzardan princeps militiae, et Nabusezban, et Rabsares, et Neregel, et Sereser, et Rebmag, et omnes optimates regis Babylonis,"
      en: "Therefore Nabuzardan the general sent, and Nabusezban, and Rabsares, and Neregel, and Sereser, and Rebmag, and all the nobles of the king of Babylon,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "miserunt, et tulerunt Jeremiam de vestibulo carceris, et tradiderunt eum Godoliae filio Ahicam filii Saphan, ut intraret in domum, et habitaret in populo."
      en: "Sent, and took Jeremias out of the court of the prison, and committed him to Codolias the son of Ahicam the son of Saphan, that he might go home, and dwell among the people."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ad Jeremiam autem factus fuerat sermo Domini, cum clausus esset in vestibulo carceris, dicens:"
      en: "But the word of the Lord came to Jeremias, when he was yet shut up in the court of the prison, saying: Go, and tell Abdemelech the Ethiopian, saying:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Vade, et dic Abdemelech Aethiopi, dicens: Haec dicit Dominus exercituum, Deus Israel: Ecce ego inducam sermones meos super civitatem hanc in malum, et non in bonum, et erunt in conspectu tuo in die illa."
      en: "Thus saith the Lord of hosts the God of Israel: Behold I will bring my words upon this city unto evil, and not unto good: and they shall be accomplished in thy sight in that day."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et liberabo te in die illa, ait Dominus, et non traderis in manus virorum quos tu formidas:"
      en: "And I will deliver thee in that day, saith the Lord: and thou shalt not be given into the hands of the men whom thou fearest:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sed eruens liberabo te, et gladio non cades, sed erit tibi anima tua in salutem, quia in me habuisti fiduciam, ait Dominus."
      en: "But delivering, I will deliver thee, and thou shalt not fall by the sword: but thy life shall be saved for thee, because thou hast put thy trust in me, saith the Lord."
    status: { la: verified, en: verified }
