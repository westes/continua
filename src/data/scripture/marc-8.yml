# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: marc
chapter: 8
verses:
  - n: 1
    text:
      la: "In diebus illis iterum cum turba multa esset, nec haberent quod manducarent, convocatis discipulis, ait illis:"
      en: "In those days again, when there was a great multitude, and had nothing to eat; calling his disciples together, he saith to them:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Misereor super turbam: quia ecce jam triduo sustinent me, nec habent quod manducent:"
      en: "I have compassion on the multitude, for behold they have now been with me three days, and have nothing to eat."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et si dimisero eos jejunos in domum suam, deficient in via: quidam enim ex eis de longe venerunt."
      en: "And if I shall send them away fasting to their home, they will faint in the way; for some of them came from afar off."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et responderunt ei discipuli sui: Unde illos quis poterit saturare panibus in solitudine?"
      en: "And his disciples answered him: From whence can any one fill them here with bread in the wilderness?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et interrogavit eos: Quot panes habetis? Qui dixerunt: Septem."
      en: "And he asked them: How many loaves have ye? Who said: Seven."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et praecepit turbae discumbere super terram. Et accipiens septem panes, gratias agens fregit, et dabat discipulis suis ut apponerent, et apposuerunt turbae."
      en: "And taking the seven loaves, giving thanks, he broke, and gave to his disciples for to set before them; and they set them before the people."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et habebant pisciculos paucos: et ipsos benedixit, et jussit apponi."
      en: "And they had a few little fishes; and he blessed them, and commanded them to be set before them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et manducaverunt, et saturati sunt, et sustulerunt quod superaverat de fragmentis, septem sportas."
      en: "And they did eat and were filled; and they took up that which was left of the fragments, seven baskets."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Erant autem qui manducaverunt, quasi quatuor millia: et dimisit eos."
      en: "And they that had eaten were about four thousand; and he sent them away."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et statim ascendens navim cum discipulis suis, venit in partes Dalmanutha."
      en: "And immediately going up into a ship with his disciples, he came into the parts of Dalmanutha."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et exierunt pharisaei, et coeperunt conquirere cum eo, quaerentes ab illo signum de caelo, tentantes eum."
      en: "And the Pharisees came forth, and began to question with him, asking him a sign from heaven, tempting him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et ingemiscens spiritu, ait: Quid generatio ista signum quaerit? Amen dico vobis, si dabitur generationi isti signum."
      en: "And sighing deeply in spirit, he saith: Why doth this generation seek a sign? Amen, I say to you, a sign shall not be given to this generation."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et dimittens eos, ascendit iterum navim et abiit trans fretum."
      en: "And leaving them, he went up again into the ship, and passed to the other side of the water."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et obliti sunt panes sumere: et nisi unum panem non habebant secum in navi."
      en: "And they forgot to take bread; and they had but one loaf with them in the ship."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et praecipiebat eis, dicens: Videte, et cavete a fermento pharisaeorum, et fermento Herodis."
      en: "And he charged them, saying: Take heed and beware of the leaven of the Pharisees, and of the leaven of Herod."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et cogitabant ad alterutrum, dicentes: quia panes non habemus."
      en: "And they reasoned among themselves, saying: Because we have no bread."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quo cognito, ait illis Jesus: Quid cogitatis, quia panes non habetis? nondum cognoscetis nec intelligitis? adhuc caecatum habetis cor vestrum?"
      en: "Which Jesus knowing, saith to them: Why do you reason, because you have no bread? do you not yet know nor understand? have you still your heart blinded?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "oculos habentes non videtis? et aures habentes non auditis? nec recordamini,"
      en: "Having eyes, see you not? and having ears, hear you not? neither do you remember."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quando quinque panes fregi in quinque millia: quot cophinos fragmentorum plenos sustulistis? Dicunt ei: Duodecim."
      en: "When I broke the five loaves among five thousand, how many baskets full of fragments took you up? They say to him, Twelve."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quando et septem panes in quatuor millia: quot sportas fragmentorum tulistis? Et dicunt ei: Septem."
      en: "When also the seven loaves among four thousand, how many baskets of fragments took you up? And they say to him, Seven."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et dicebat eis: Quomodo nondum intelligitis?"
      en: "And he said to them: How do you not yet understand?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et veniunt Bethsaidam, et adducunt ei caecum, et rogabant eum ut illum tangeret."
      en: "And they came to Bethsaida; and they bring to him a blind man, and they besought him that he would touch him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et apprehensa manu caeci, eduxit eum extra vicum: et exspuens in oculos ejus impositis manibus suis, interrogavit eum si quid videret."
      en: "And taking the blind man by the hand, he led him out of the town; and spitting upon his eyes, laying his hands on him, he asked him if he saw any thing."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et aspiciens, ait: Video homines velut arbores ambulantes."
      en: "And looking up, he said: I see men as it were trees, walking."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Deinde iterum imposuit manus super oculos ejus: et coepit videre: et restitutus est ita ut clare videret omnia."
      en: "After that again he laid his hands upon his eyes, and he began to see, and was restored, so that he saw all things clearly."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et misit illum in domum suam, dicens: Vade in domum tuam: et si in vicum introieris, nemini dixeris."
      en: "And he sent him into his house, saying: Go into thy house, and if thou enter into the town, tell nobody."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et egressus est Jesus, et discipuli ejus in castella Caesareae Philippi: et in via interrogabat discipulos suos, dicens eis: Quem me dicunt esse homines?"
      en: "And Jesus went out, and his disciples, into the towns of Caesarea Philippi. And in the way, he asked his disciples, saying to them: Whom do men say that I am?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Qui responderunt illi, dicentes: Joannem Baptistam, alii Eliam, alii vero quasi unum de prophetis."
      en: "Who answered him, saying: John the Baptist; but some Elias, and others as one of the prophets."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Tunc dicit illis: Vos vero quem me esse dicitis? Respondens Petrus, ait ei: Tu es Christus."
      en: "Then he saith to them: But whom do you say that I am? Peter answering said to him: Thou art the Christ."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et comminatus est eis, ne cui dicerent de illo."
      en: "And he strictly charged them that they should not tell any man of him."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et coepit docere eos quoniam oportet Filium hominis pati multa, et reprobari a senioribus, et a summis sacerdotibus et scribis, et occidi: et post tres dies resurgere."
      en: "And he began to teach them, that the Son of man must suffer many things, and be rejected by the ancients and by the high priests, and the scribes, and be killed: and after three days rise again."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et palam verbum loquebatur. Et apprehendens eum Petrus, coepit increpare eum."
      en: "And he spoke the word openly. And Peter taking him, began to rebuke him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Qui conversus, et videns discipulos suos, comminatus est Petro, dicens: Vade retro me Satana, quoniam non sapis quae Dei sunt, sed quae sunt hominum."
      en: "Who turning about and seeing his disciples, threatened Peter, saying: Go behind me, Satan, because thou savorest not the things that are of God, but that are of men."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et convocata turba cum discipulis suis, dixit eis: Si quis vult me sequi, deneget semetipsum: et tollat crucem suam, et sequatur me."
      en: "And calling the multitude together with his disciples, he said to them: If any man will follow me, let him deny himself, and take up his cross, and follow me."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Qui enim voluerit animam suam salvam facere, perdet eam: qui autem perdiderit animam suam propter me, et Evangelium, salvam faciet eam."
      en: "For whosoever will save his life, shall lose it: and whosoever shall lose his life for my sake and the gospel, shall save it."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Quid enim proderit homini, si lucretur mundum totum et detrimentum animae suae faciat?"
      en: "For what shall it profit a man, if he gain the whole world, and suffer the loss of his soul?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Aut quid dabit homo commutationis pro anima sua?"
      en: "Or what shall a man give in exchange for his soul?"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Qui enim me confusus fuerit, et verba mea in generatione ista adultera et peccatrice, et Filius hominis confundetur eum, cum venerit in gloria Patris sui cum angelis sanctis."
      en: "For he that shall be ashamed of me, and of my words, in this adulterous and sinful generation: the Son of man also will be ashamed of him, when he shall come in the glory of his Father with the holy angels."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et dicebat illis: Amen dico vobis, quia sunt quidam de hic stantibus, qui non gustabunt mortem donec videant regnum Dei veniens in virtute."
      en: "And he said to them: Amen I say to you, that there are some of them that stand here, who shall not taste death, till they see the kingdom of God coming in power."
    status: { la: verified, en: verified }
