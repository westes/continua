book: 1par
chapter: 24
verses:
  - n: 1
    text:
      la: "porro filiis Aaron hae partitiones erunt filii Aaron Nadab et Abiu et Eleazar et Ithamar"
      en: "Now these were the divisions of the sons of Aaron: The sons of Aaron: Nadab, and Abiu, and Eleazar, and Ithamar."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "mortui sunt autem Nadab et Abiu ante patrem suum absque liberis sacerdotioque functus est Eleazar et Ithamar"
      en: "But Nadab and Abiu died before their father, and had no children: so Eleazar, and Ithamar did the office of the priesthood."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et divisit eos David id est Sadoc de filiis Eleazar et Ahimelech de filiis Ithamar secundum vices suas et ministerium"
      en: "And David distributed them, that is, Sadoc of the sons of Eleazar, and Ahimelech of the sons of Ithamar, according to their courses and ministry."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "inventique sunt multo plures filii Eleazar in principibus viris quam filii Ithamar divisit autem eis hoc est filiis Eleazar principes per familias sedecim et filiis Ithamar per familias et domos suas octo"
      en: "And there were found many more of the sons of Eleazar among the principal men, than of the sons of Ithamar. And he divided them so, that there were of the sons of Eleazar, sixteen chief men by their families: and of the sons of Ithamar eight by their families and houses."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "porro divisit utrasque inter se familias sortibus erant enim principes sanctuarii et principes Dei tam de filiis Eleazar quam de filiis Ithamar"
      en: "And he divided both the families one with the other by lot: for there were princes of the sanctuary, and princes of God, both of the sons of Eleazar, and of the sons of Ithamar."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "descripsitque eos Semeias filius Nathanahel scriba Levites coram rege et principibus et Sadoc sacerdote et Ahimelech filio Abiathar principibus quoque familiarum sacerdotalium et leviticarum unam domum quae ceteris praeerat Eleazar et alteram domum quae sub se habebat ceteros Ithamar"
      en: "And Semeias the son of Nathanael the scribe a Levite, wrote them down before the king and the princes, and Sadoc the priest, and Ahimelech the son of Abiathar, and the princes also of the priestly and Levitical families: one house, which was over the rest, of Eleazar: and another house, which had the rest under it, of Ithamar."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "exivit autem sors prima Ioiarib secunda Iedeiae"
      en: "Now the first lot came forth to Joiarib, the second to Jedei,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "tertia Arim quarta Seorim"
      en: "The third to Harim, the fourth to Seorim,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quinta Melchia sexta Maiman"
      en: "The fifth to Melchia, the sixth to Maiman,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "septima Accos octava Abia"
      en: "The seventh to Accos, the eighth to Abia,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "nona Hiesu decima Sechenia"
      en: "The ninth to Jesua, the tenth to Sechenia,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "undecima Eliasib duodecima Iacim"
      en: "The eleventh to Eliasib, the twelfth to Jacim,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "tertiadecima Oppa quartadecima Isbaal"
      en: "The thirteenth to Hoppha, the fourteenth to Isbaab,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quintadecima Belga sextadecima Emmer"
      en: "The fifteenth to Belga, the sixteenth to Emmer,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "septimadecima Ezir octavadecima Hapses"
      en: "The seventeenth to Hezir, the eighteenth to Aphses,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "nonadecima Phetheia vicesima Iezecel"
      en: "The nineteenth to Pheteia, the twentieth to Hezechiel,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "vicesima prima Iachin vicesima secunda Gamul"
      en: "The one and twentieth to Jachin, the two and twentieth to Gamul,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "vicesima tertia Dalaiau vicesima quarta Mazziau"
      en: "The three and twentieth to Dalaiau, the four and twentieth to Maaziau."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "hae vices eorum secundum ministeria sua ut ingrediantur domum Domini et iuxta ritum suum sub manu Aaron patris eorum sicut praecepit Dominus Deus Israhel"
      en: "These are their courses according to their ministries, to come into the house of the Lord, and according to their manner under the hand of Aaron their father: as the Lord the God of Israel had commanded."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "porro filiorum Levi qui reliqui fuerant de filiis Amram erat Subahel et filiis Subahel Iedeia"
      en: "Now of the rest of the sons of Levi, there was of the sons of Amram, Subael: and of the sons of Subael, Jehedeia."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "de filiis quoque Roobiae princeps Iesias"
      en: "Also of the sons of Rohobia the chief Jesias."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Isaaris vero Salemoth filiusque Salemoth Iaath"
      en: "And the son of Isaar Salemoth, and the son of Salemoth Jahath:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "filiusque eius Ieriahu Amarias secundus Iazihel tertius Iecmaam quartus"
      en: "And his son Jeriau the first, Amarias the second, Jahaziel the third, Jecmaan the fourth."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "filius Ozihel Micha filius Micha Samir"
      en: "The son of Oziel, Micha: the son of Micha, Samir."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "frater Micha Iesia filiusque Iesiae Zaccharias"
      en: "The brother of Micha, Jesia: and the son of Jesia, Zacharias."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "filii Merari Mooli et Musi filius Ioziau Benno"
      en: "The sons of Merari: Moholi and Musi: the son of Oziau: Benno."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "filius quoque Merari Oziau et Soem et Zacchur et Hebri"
      en: "The son also of Merari: Oziau, and Seam, and Zacchur, and Hebri."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "porro Mooli filius Eleazar qui non habebat liberos"
      en: "And the son of Moholi: Eleazar, who had no sons."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "filius vero Cis Ierahemel"
      en: "And the son of Cis, Jeramael."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "filii Musi Mooli Eder et Ierimoth isti filii Levi secundum domos familiarum suarum"
      en: "The sons of Musi: Moholi, Eder, and Jerimoth. These are the sons of Levi according to the houses of their families."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "miseruntque et ipsi sortes contra fratres suos filios Aaron coram David rege et Sadoc et Ahimelech et principibus familiarum sacerdotalium et leviticarum tam maiores quam minores omnes sors aequaliter dividebat"
      en: "And they also cast lots over against their brethren the sons of Aaron before David the king, and Sadoc, and Ahimelech, and the princes of the priestly and Levitical families, both the elder and the younger. The lot divided all equally."
    status: { la: verified, en: verified }
