# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 14
verses:
  - n: 1
    text:
      la: "Igitur vociferans omnis turba flevit nocte illa,"
      en: "Wherefore the whole multitude crying wept that night."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et murmurati sunt contra Moysen et Aaron cuncti filii Israel, dicentes:"
      en: "And all the children of Israel murmured against Moses and Aaron, saying:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Utinam mortui essemus in Aegypto: et in hac vasta solitudine utinam pereamus, et non inducat nos Dominus in terram istam, ne cadamus gladio, et uxores ac liberi nostri ducantur captivi. Nonne melius est reverti in Aegyptum?"
      en: "Would God that we had died in Egypt and would God we may die in this vast wilderness, and that the Lord may not bring us into this land, lest we fall by the sword, and our wives and children be led away captives. Is it not better to return into Egypt?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dixeruntque alter ad alterum: Constituamus nobis ducem, et revertamur in Aegyptum."
      en: "And they said one to another: Let us appoint a captain, and let us return into Egypt."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quo audito, Moyses et Aaron ceciderunt proni in terram coram omni multitudine filiorum Israel."
      en: "And when Moses and Aaron heard this, they fell down flat upon the ground before the multitude of the children of Israel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "At vero Josue filius Nun et Caleb filius Jephone, qui et ipsi lustraverant terram, sciderunt vestimenta sua,"
      en: "But Josue the son of Nun, and Caleb the son of Jephone, who themselves also had viewed the land, rent their garments,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et ad omnem multitudinem filiorum Israel locuti sunt: Terra, quam circuivimus, valde bona est."
      en: "And said to all the multitude of the children of Israel: The land which we have gone round is very good:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Si propitius fuerit Dominus, inducet nos in eam, et tradet humum lacte et melle manantem."
      en: "If the Lord be favourable, he will bring us into it, and give us a land flowing with milk and honey."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Nolite rebelles esse contra Dominum: neque timeatis populum terrae hujus, quia sicut panem ita eos possumus devorare. Recessit ab eis omne praesidium: Dominus nobiscum est, nolite metuere."
      en: "Be not rebellious against the Lord: and fear ye not the people of this land, for we are able to eat them up as bread. All aid is gone from them: the Lord is with us, fear ye not."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Cumque clamaret omnis multitudo, et lapidibus eos vellet opprimere, apparuit gloria Domini super tectum foederis cunctis filiis Israel."
      en: "And when all the multitude cried out, and would have stoned them, the glory of the Lord appeared over the tabernacle of the covenant to all the children of Israel."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et dixit Dominus ad Moysen: Usquequo detrahet mihi populus iste? quousque non credent mihi, in omnibus signis quae feci coram eis?"
      en: "And the Lord said to Moses: How long will this people detract me? how long will they not believe me for all the signs that I have wrought before them?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Feriam igitur eos pestilentia, atque consumam: te autem faciam principem super gentem magnam, et fortiorem quam haec est."
      en: "I will strike them therefore with pestilence, and will consume them: but thee I will make a ruler over a great nation, and a mightier than this is."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et ait Moyses ad Dominum: Ut audiant Aegyptii, de quorum medio eduxisti populum istum,"
      en: "And Moses said to the Lord: That the Egyptians, from the midst of whom thou hast brought forth this people,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et habitatores terrae hujus, qui audierunt quod tu, Domine, in populo isto sis, et facie videaris ad faciem, et nubes tua protegat illos, et in columna nubis praecedas eos per diem, et in columna ignis per noctem:"
      en: "And the inhabitants of this land, (who have heard that thou, O Lord, art among this people, and art seen face to face, and thy cloud protecteth them, and thou goest before them in a pillar of a cloud by day, and in a pillar of fire by night,)"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quod occideris tantam multitudinem quasi unum hominem, et dicant:"
      en: "May hear that thou hast killed so great a multitude as it were one man and may say:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Non poterat introducere populum in terram pro qua juraverat: idcirco occidit eos in solitudine?"
      en: "He could not bring the people into the land for which he had sworn, therefore did he kill them in the wilderness."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Magnificetur ergo fortitudo Domini sicut jurasti, dicens:"
      en: "Let then the strength of the Lord be magnified, as thou hast sworn, saying:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Dominus patiens et multae misericordiae, auferens iniquitatem et scelera, nullumque innoxium derelinquens, qui visitas peccata patrum in filios in tertiam et quartam generationem."
      en: "The Lord is patient and full of mercy, taking away iniquity and wickedness, and leaving no man clear, who visitest the sins of the fathers upon the children unto the third and fourth generation."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dimitte, obsecro, peccatum populi hujus secundum magnitudinem misericordiae tuae, sicut propitius fuisti egredientibus de Aegypto usque ad locum istum."
      en: "Forgive, I beseech thee, the sins of this people, according to the greatness of thy mercy, as thou hast been merciful to them from their going out of Egypt unto this place."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dixitque Dominus: Dimisi juxta verbum tuum."
      en: "And the Lord said: I have forgiven according to thy word."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Vivo ego: et implebitur gloria Domini universa terra."
      en: "As I live: and the whole earth shall be filled with the glory of the Lord."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Attamen omnes homines qui viderunt majestatem meam, et signa quae feci in Aegypto et in solitudine, et tentaverunt me jam per decem vices, nec obedierunt voci meae,"
      en: "But yet all the men that have seen my majesty, and the signs that I have done in Egypt, and in the wilderness, and have tempted me now ten times, and have not obeyed my voice,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "non videbunt terram pro qua juravi patribus eorum, nec quisquam ex illis qui detraxit mihi, intuebitur eam."
      en: "Shall not see the land for which I swore to their fathers, neither shall any one of them that hath detracted me behold it."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Servum meum Caleb, qui plenus alio spiritu secutus est me, inducam in terram hanc, quam circuivit; et semen ejus possidebit eam."
      en: "My servant Caleb, who being full of another spirit hath followed me, I will bring into this land which he hath gone round: and his seed shall possess it."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Quoniam Amalecites et Chananaeus habitant in vallibus. Cras movete castra, et revertimini in solitudinem per viam maris Rubri."
      en: "For the Amalecite and the Chanaanite dwell in the valleys. Tomorrow remove the camp, and return into the wilderness by the way of the Red Sea."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Locutusque est Dominus ad Moysen et Aaron, dicens:"
      en: "And the Lord spoke to Moses and Aaron, saying:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Usquequo multitudo haec pessima murmurat contra me? querelas filiorum Israel audivi."
      en: "How long doth this wicked multitude murmur against me? I have heard the murmurings of the children of Israel."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Dic ergo eis: Vivo ego, ait Dominus: sicut locuti estis audiente me, sic faciam vobis."
      en: "Say therefore to them: As I live, saith the Lord: According as you have spoken in my hearing, so will I do to you."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "In solitudine hac jacebunt cadavera vestra. Omnes qui numerati estis a viginti annis et supra, et murmurastis contra me,"
      en: "In the wilderness shall your carcasses lie. All you that were numbered from twenty years old and upward, and have murmured against me,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "non intrabitis terram, super quam levavi manum meam ut habitare vos facerem, praeter Caleb filium Jephone, et Josue filium Nun."
      en: "Shall not enter into the land, over which I lifted up my hand to make you dwell therein, except Caleb the son of Jephone, and Josue the son of Nun."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Parvulos autem vestros, de quibus dixistis quod praedae hostibus forent, introducam, ut videant terram, quae vobis displicuit."
      en: "But your children, of whom you said, that they should be a prey to the enemies, will I bring in: that they may see the land which you have despised."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Vestra cadavera jacebunt in solitudine."
      en: "Your carcasses shall lie in the wilderness."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Filii vestri erunt vagi in deserto annis quadraginta, et portabunt fornicationem vestram, donec consumantur cadavera patrum in deserto,"
      en: "Your children shall wander in the desert forty years, and shall bear your fornication, until the carcasses of their fathers be consumed in the desert,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "juxta numerum quadraginta dierum, quibus considerastis terram: annus pro die imputabitur. Et quadraginta annis recipietis iniquitates vestras, et scietis ultionem meam:"
      en: "According to the number of the forty days, wherein you viewed the land: year shall be counted for a day. And forty years you shall receive your iniquities, and shall know my revenge:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "quoniam sicut locutus sum, ita faciam omni multitudini huic pessimae, quae consurrexit adversum me: in solitudine hac deficiet, et morietur."
      en: "For as I have spoken, so will I do to all this wicked multitude, that hath risen up together against me: in this wilderness shall it faint away and die."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Igitur omnes viri, quos miserat Moyses ad contemplandam terram, et qui reversi murmurare fecerant contra eum omnem multitudinem, detrahentes terrae quod esset mala,"
      en: "Therefore all the men, whom Moses had sent to view the land, and who at their return had made the whole multitude to murmur against him, speaking ill of the land that it was naught,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "mortui sunt atque percussi in conspectu Domini."
      en: "Died and were struck in the sight of the Lord."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Josue autem filius Nun, et Caleb filius Jephone, vixerunt ex omnibus qui perrexerant ad considerandam terram."
      en: "But Josue. the son of Nun. and Caleb the son of Jephone lived, of all them that had gone to view the land."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Locutusque est Moyses universa verba haec ad omnes filios Israel, et luxit populus nimis."
      en: "And Moses spoke all these words to all the children of Israel, and the people mourned exceedingly."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et ecce mane primo surgentes ascenderunt verticem montis, atque dixerunt: Parati sumus ascendere ad locum, de quo Dominus locutus est: quia peccavimus."
      en: "And behold rising up very early in the morning, they went up to the top of the mountain, and said: We are ready to go up to the place, of which the Lord hath spoken: for we have sinned."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Quibus Moyses: Cur, inquit, transgredimini verbum Domini, quod vobis non cedet in prosperum?"
      en: "And Moses said to them: Why transgress you the word of the Lord, which shall not succeed prosperously with you?"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "nolite ascendere: non enim est Dominus vobiscum: ne corruatis coram inimicis vestris."
      en: "Go not up, for the Lord is not with you: lest you fall before your enemies."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Amalecites et Chananaeus ante vos sunt, quorum gladio corruetis, eo quod nolueritis acquiescere Domino: nec erit Dominus vobiscum."
      en: "The Amalecite and the Chanaanite are before you, and by their sword you shall fall, because you would not consent to the Lord, neither will the Lord be with you."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "At illi contenebrati ascenderunt in verticem montis. Arca autem testamenti Domini et Moyses non recesserunt de castris."
      en: "But they being blinded went up to the top of the mountain. But the ark of the testament of the Lord and Moses departed not from the camp."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Descenditque Amalecites et Chananaeus, qui habitabat in monte: et percutiens eos atque concidens, persecutus est eos usque Horma."
      en: "And the Amalecite came down, and the Chanaanite that dwelt in the mountain: and smiting and slaying them pursued them as far as Horma."
    status: { la: verified, en: verified }
