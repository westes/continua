# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 27
verses:
  - n: 1
    text:
      la: "In die illa visitabit Dominus in gladio suo duro, et grandi, et forti, super Leviathan, serpentem vectem, et super Leviathan, serpentem tortuosum, et occidet cetum qui in mari est."
      en: "In that day the Lord with his hard, and great, and strong sword shall visit leviathan the bar serpent, and leviathan the crooked serpent, and shall slay the whale that is in the sea."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "In die illa vinea meri cantabit ei."
      en: "In that day there shall be singing to the vineyard of pure wine."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ego Dominus qui servo eam; repente propinabo ei. Ne forte visitetur contra eam, nocte et die servo eam."
      en: "I am the Lord that keep it, I will suddenly give it drink: lest any hurt come to it, I keep it night and day."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Indignatio non est mihi. Quis dabit me spinam et veprem in praelio? gradiar super eam, succendam eam pariter."
      en: "There is no indignation in me: who shall make me a thorn and a brier in battle: shall march against it, shall I set it on fire together?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "An potius tenebit fortitudinem meam? faciet pacem mihi, pacem faciet mihi."
      en: "Or rather shall it take hold of my strength, shall it make peace with me, shall it make peace with me?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Qui ingrediuntur impetu ad Jacob, florebit et germinabit Israel, et implebunt faciem orbis semine."
      en: "When they shall rush in unto Jacob, Israel shall blossom and bud, and they shall fill the face of the world with seed."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Numquid juxta plagam percutientis se percussit eum? aut sicut occidit interfectos ejus, sic occisus est?"
      en: "Hath he struck him according to the stroke of him that struck him? or is he slain, as he killed them that were slain by him?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "In mensura contra mensuram, cum abjecta fuerit, judicabis eam; meditatus est in spiritu suo duro per diem aestus."
      en: "In measure against measure, when it shall be cast off, thou shalt judge it. He hath meditated with his severe spirit in the day of heat."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Idcirco super hoc dimittetur iniquitas domui Jacob; et iste omnis fructus: ut auferatur peccatum ejus, cum posuerit omnes lapides altaris sicut lapides cineris allisos: non stabunt luci et delubra."
      en: "Therefore upon this shall the iniquity of the house of Jacob be forgiven: and this is all the fruit, that the sin thereof should be taken away, when he shall have made all the stones of the altar, as burnt stones broken in pieces, the groves and temples shall not stand."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Civitas enim munita desolata erit; speciosa relinquetur, et dimittetur quasi desertum; ibi pascetur vitulus, et ibi accubabit, et consumet summitates ejus."
      en: "For the strong city shall be desolate, the beautiful city shall be forsaken, and shall be left as a wilderness: there the calf shall feed, and there shall he lie down, and shall consume its branches."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "In siccitate messes illius conterentur. Mulieres venientes, et docentes eam; non est enim populus sapiens: propterea non miserebitur ejus qui fecit eum, et qui formavit eum non parcet ei."
      en: "Its harvest shall be destroyed with drought, women shall come and teach it: for it is not a wise people, therefore he that made it, shall not have mercy on it: and he that formed it, shall not spare it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et erit: in die illa percutiet Dominus ab alveo fluminis usque ad torrentem Aegypti; et vos congregabimini unus et unus, filii Israel."
      en: "And it shall come to pass, that in that day the Lord will strike from the channel of the river even to the torrent of Egypt, and you shall be gathered together one by one, O ye children of Israel."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et erit: in die illa clangetur in tuba magna; et venient qui perditi fuerant de terra Assyriorum, et qui ejecti erant in terra Aegypti, et adorabunt Dominum in monte sancto in Jerusalem."
      en: "And it shall come to pass, that in that day a noise shall be made with a great trumpet, and they that were lost, shall come from the land of the Assyrians, and they that were outcasts in the land of Egypt, and they shall adore the Lord in the holy mount in Jerusalem."
    status: { la: verified, en: verified }
