# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 27
verses:
  - n: 1
    text:
      la: "in die illo visitabit Dominus in gladio suo duro et grandi et forti super Leviathan serpentem vectem et super Leviathan serpentem tortuosum et occidet cetum qui in mari est"
      en: "In that day the Lord with his hard, and great, and strong sword shall visit leviathan the bar serpent, and leviathan the crooked serpent, and shall slay the whale that is in the see."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in die illa vinea meri cantabit ei"
      en: "In that day there shall be singing to the vineyard of pure wine."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ego Dominus qui servo eam repente propinabo ei ne forte visitetur contra eam nocte et die servo eam"
      en: "I am the Lord that keep it, I will suddenly give it drink: lest any hurt come to it, I keep it night and day."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "indignatio non est mihi quis dabit me spinam et veprem in proelio gradiar super eam succendam eam pariter"
      en: "There is no indignation in m: who shall make me a thorn and a brier in battle: shall march against it, shall I set it on fire together?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "an potius tenebit fortitudinem meam faciet pacem mihi pacem faciet mihi"
      en: "Or rather shall it take hold of my strength, shall it make peace with me, shall it make peace with me?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui egrediuntur impetu ad Iacob florebit et germinabit Israhel et implebunt faciem orbis semine"
      en: "When they shall rush in unto Jacob, Israel shall blossom and bud, and they shall fill the face of the world with seed."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "numquid iuxta plagam percutientis se percussit eum aut sicut occidit interfectos eius sic occisus est"
      en: "Hath he struck him according to the stroke of him that struck him? or is he slain, as he killed them that were slain by him?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "in mensura contra mensuram cum abiecta fuerit iudicabis eam meditata est in spiritu suo duro per diem aestus"
      en: "In measure against measure, when it shall be cast off, thou shalt judge it. He hath meditated with his severe spirit in the day of heat."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "idcirco super hoc dimittetur iniquitas domui Iacob et iste omnis fructus ut auferatur peccatum eius cum posuerit omnes lapides altaris sicut lapides cineris adlisos non stabunt luci et delubra"
      en: "Therefore upon this shall the iniquity of the house of Jacob be forgiven: and this is all the fruit, that the sin thereof should be taken away, when he shall have made all the stones of the altar, as burnt stones broken in pieces, the groves and temples shall not stand."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "civitas enim munita desolata erit speciosa relinquetur et dimittetur quasi desertum ibi pascetur vitulus et ibi accubabit et consumet summitates eius"
      en: "For the strong city shall be desolate, the beautiful city shall be forsaken, and shall be left as a wilderness : there the calf shall feed, and there shall he lie down, and shall consume its branches."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in siccitate messis illius conterentur mulieres venientes et docentes eam non est enim populus sapiens propterea non miserebitur eius qui fecit eum et qui formavit eum non parcet ei"
      en: "Its harvest shall be destroyed with drought, women shall come and teach it: for it is not a wise people, therefore he that made it, shall not have mercy on it: and he that formed it, shall not spare it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et erit in die illa percutiet Dominus ab alveo Fluminis usque ad torrentem Aegypti et vos congregabimini unus et unus filii Israhel"
      en: "And it shall come to pass, that in that day the Lord will strike from the channel of the river even to the torrent of Egypt, and you shall be gathered together one by one, O ye children of Israel."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et erit in die illa clangetur in tuba magna et venient qui perditi fuerant de terra Assyriorum et qui eiecti erant in terra Aegypti et adorabunt Dominum in monte sancto in Hierusalem"
      en: "And it shall come to pass, that in that day a noise shall be made with a great trumpet, and they that were lost, shall come from the land of the Assyrians, and they that were outcasts in the land of Egypt, and they shall adore the Lord in the holy mount in Jerusalem."
    status: { la: verified, en: verified }
