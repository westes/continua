# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 43
verses:
  - n: 1
    text:
      la: "interim fames omnem terram vehementer premebat"
      en: "In the mean time the famine was heavy upon all the land."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "consumptisque cibis quos ex Aegypto detulerant dixit Iacob ad filios suos revertimini et emite pauxillum escarum"
      en: "And when they had eaten up all the corn, which they had brought out of Egypt, Jacob said to his sons: Go again and buy us a little food."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "respondit Iudas denuntiavit nobis vir ille sub testificatione iurandi dicens non videbitis faciem meam nisi fratrem vestrum minimum adduxeritis vobiscum"
      en: "Juda answered: The man declared unto us with the atteststion of an oath, saying: You shall not see my face, unless you bring your youngest brother with you."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "si ergo vis mittere eum nobiscum pergemus pariter et ememus tibi necessaria"
      en: "If therefore thou wilt send him with us, we will set out together, and will buy necessaries for thee."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "si autem non vis non ibimus vir enim ut saepe diximus denuntiavit nobis dicens non videbitis faciem meam absque fratre vestro minimo"
      en: "But if thou wilt not, we will not go: for the man, as we have often said, declared unto us, saying: You shall not see my face without your youngest brother."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixit eis Israhel in meam hoc fecistis miseriam ut indicaretis ei et alium habere vos fratrem"
      en: "Israel said to them: You have done this for my misery in that you told him you had also another brother."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "at illi responderunt interrogavit nos homo per ordinem nostram progeniem si pater viveret si haberemus fratrem et nos respondimus ei consequenter iuxta id quod fuerat sciscitatus numquid scire poteramus quod dicturus esset adducite vobiscum fratrem vestrum"
      en: "But they answered: The man asked us in order concerning our kindred: if our father lived: if we had a brother: and we answered him regularly, according to what he demanded: Bring hither your brother with you?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Iudas quoque dixit patri suo mitte puerum mecum ut proficiscamur et possimus vivere ne moriamur nos et parvuli nostri"
      en: "And Juda said to his father: Send the bou with me, that we may set forward, and may live: lest both we and our children perish."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ego suscipio puerum de manu mea require illum nisi reduxero et tradidero eum tibi ero peccati in te reus omni tempore"
      en: "I take the boy upon me, require him at my hand: unless I bring him again, and restore him to thee, I will be guilty of sin against thee for ever."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "si non intercessisset dilatio iam vice altera venissemus"
      en: "If delay had not been made, we had been here again the second time."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "igitur Israhel pater eorum dixit ad eos si sic necesse est facite quod vultis sumite de optimis terrae fructibus in vasis vestris et deferte viro munera modicum resinae et mellis et styracis et stactes et terebinthi et amigdalarum"
      en: "Then Israel said to them: If it must needs be so, do what you will: take of the best fruits of the land in your vessels, and carry down presents to the man, a little balm, and honey, and storax, myrrh, turpentine, and almonds."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "pecuniamque duplicem ferte vobiscum et illam quam invenistis in sacculis reportate ne forte errore factum sit"
      en: "And take with you double money, and carry back what you found in your sacks, lest perhaps it was done by mistake."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sed et fratrem vestrum tollite et ite ad virum"
      en: "And take also your brother, and go to the man."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Deus autem meus omnipotens faciat vobis eum placabilem et remittat vobiscum fratrem vestrum quem tenet et hunc Beniamin ego autem quasi orbatus absque liberis ero"
      en: "And may my almighty Bod make him favourable to you; and send back with you your brother, whom he keepeth, and this Benjamin: and as for me I shall be desolate without children."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "tulerunt ergo viri munera et pecuniam duplicem et Beniamin descenderuntque in Aegyptum et steterunt coram Ioseph"
      en: "So the men took the presents, and double money, and Benjamin: and went down into Egypt, and stood before Joseph."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quos cum ille vidisset et Beniamin simul praecepit dispensatori domus suae dicens introduc viros domum et occide victimas et instrue convivium quoniam mecum sunt comesuri meridie"
      en: "And when he had seen them, and Benjamin with them, he commanded the steward of his house, saying: Bring in the men into the house, and kill victims, and prepare a feast: because they shall eat with me at noon."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "fecit ille sicut fuerat imperatum et introduxit viros domum"
      en: "He did as he was commanded, and brought the men into the house."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ibique exterriti dixerunt mutuo propter pecuniam quam rettulimus prius in saccis nostris introducti sumus ut devolvat in nos calumniam et violenter subiciat servituti et nos et asinos nostros"
      en: "And they being much afraid, said there one to another: Because of the money, which we carried back the first time in our sacks, we are brought in: that he may bring upon us a false accusation, and by violence make slaves of us and our asses."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quam ob rem in ipsis foribus accedentes ad dispensatorem"
      en: "Wherefore going up to the steward of the house, at the door,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "locuti sunt oramus domine ut audias iam ante descendimus ut emeremus escas"
      en: "They said: Sir, we desire thee to hear us: We came down once before to buy food:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quibus emptis cum venissemus ad diversorium aperuimus sacculos nostros et invenimus pecuniam in ore saccorum quam nunc eodem pondere reportamus"
      en: "And when we had bought, and come to the inn, we opened our sacks, and found our money in the mouths of the sacks: which we have now brought again in the same weight."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sed et aliud adtulimus argentum ut emamus quae necessaria sunt non est in nostra conscientia quis eam posuerit in marsuppiis nostris"
      en: "And we have brought other money besides, to buy what we want: we cannot tell who put it in our bags."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "at ille respondit pax vobiscum nolite timere Deus vester et Deus patris vestri dedit vobis thesauros in sacculis vestris nam pecuniam quam dedistis mihi probatam ego habeo eduxitque ad eos Symeon"
      en: "But he answered: Peace be with you, fear not: your God, and the God of your Father hath given you treasure in your sacks. For the money, which you gave me, I have for good. And he brought Simeon out to them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et introductis domum adtulit aquam et laverunt pedes suos deditque pabula asinis eorum"
      en: "And having brought them into the house, he fetched water, and they washed their feet, and he gave provender to their asses."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "illi vero parabant munera donec ingrederetur Ioseph meridie audierant enim quod ibi comesuri essent panem"
      en: "But they made ready the presents, against Joseph came at noon: for they had heard that they should eat bread there."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "igitur ingressus est Ioseph domum suam obtuleruntque ei munera tenentes in manibus et adoraverunt proni in terram"
      en: "Then Joseph came into his house, and they offered him the presents holding them in their hands, and they bowed down with their face to the ground."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "at ille clementer resalutatis eis interrogavit dicens salvusne est pater vester senex de quo dixeratis mihi adhuc vivit"
      en: "But he, courteously saluting them again, asked them, saying: Is the old man your father in health, of whom uou told me? Is he yet living?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "qui responderunt sospes est servus tuus pater noster adhuc vivit et incurvati adoraverunt eum"
      en: "And they answered: Thy servant our father is in health, he is yet living. And bowing themselves they made obeisance to him."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "adtollens autem oculos Ioseph vidit Beniamin fratrem suum uterinum et ait iste est frater vester parvulus de quo dixeratis mihi et rursum Deus inquit misereatur tui fili mi"
      en: "And Joseph lifting up his eyes, saw Benjamin his brother, by the same mother, and said: Is this your young brother, of whom you told me? And he said: God be gracious to thee, my son."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "festinavitque quia commota fuerant viscera eius super fratre suo et erumpebant lacrimae et introiens cubiculum flevit"
      en: "And he made haste becouse his heart was moved upon his brother, and tears gushed out: And going into his chamber he wept."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "rursusque lota facie egressus continuit se et ait ponite panes"
      en: "And when he had washed his face, coming out again, he refrained himself, and said: Set bread on the table."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quibus adpositis seorsum Ioseph et seorsum fratribus Aegyptiis quoque qui vescebantur simul seorsum inlicitum est enim Aegyptiis comedere cum Hebraeis et profanum putant huiuscemodi convivium"
      en: "And when it was set on, for Joseph apart, and for his brethren apart, for the Egyptians also that ate with him, apart, (for it is unlawful for the Egyptians to eat with the Hebrews, and they think such a feast profane:)"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "sederunt coram eo primogenitus iuxta primogenita sua et minimus iuxta aetatem suam et mirabantur nimis"
      en: "They sat before him, the firstborn according to his birthright, and the youngest according to his age. And they wondered very much:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "sumptis partibus quas ab eo acceperant maiorque pars venit Beniamin ita ut quinque partibus excederet biberuntque et inebriati sunt cum eo"
      en: "Taking the messes which they received of him: and the greater mess came to Benjamin, so that it exceeded by five parts. And they drank, and were merry with him."
    status: { la: verified, en: verified }
