# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 43
verses:
  - n: 1
    text:
      la: "Interim fames omnem terram vehementer premebat."
      en: "In the mean time the famine was heavy upon all the land."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Consumptisque cibis quos ex Aegypto detulerant, dixit Jacob ad filios suos: Revertimini, et emite nobis pauxillum escarum."
      en: "And when they had eaten up all the corn, which they had brought out of Egypt, Jacob said to his sons: Go again and buy us a little food."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Respondit Judas: Denuntiavit nobis vir ille sub attestatione jurisjurandi, dicens: Non videbitis faciem meam, nisi fratrem vestrum minimum adduxeritis vobiscum."
      en: "Juda answered: The man declared unto us with the attestation of an oath, saying: You shall not see my face, unless you bring your youngest brother with you."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Si ergo vis eum mittere nobiscum, pergemus pariter, et ememus tibi necessaria:"
      en: "If therefore thou wilt send him with us, we will set out together, and will buy necessaries for thee."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "sin autem non vis, non ibimus: vir enim, ut saepe diximus, denuntiavit nobis, dicens: Non videbitis faciem meam absque fratre vestro minimo."
      en: "But if thou wilt not, we will not go: for the man, as we have often said, declared unto us, saying: You shall not see my face without your youngest brother."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dixit eis Israel: In meam hoc fecistis miseriam, ut indicaretis ei et alium habere vos fratrem."
      en: "Israel said to them: You have done this for my misery in that you told him you had also another brother."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "At illi responderunt: Interrogavit nos homo per ordinem nostram progeniem: si pater viveret: si haberemus fratrem: et nos respondimus ei consequenter juxta id quod fuerat sciscitatus: numquid scire poteramus quod dicturus esset: Adducite fratrem vestrum vobiscum?"
      en: "But they answered: The man asked us in order concerning our kindred: if our father lived: if we had a brother: and we answered him regularly, according to what he demanded: could we know that he would say: Bring hither your brother with you?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Judas quoque dixit patri suo: Mitte puerum mecum, ut proficiscamur, et possimus vivere: ne moriamur nos et parvuli nostri."
      en: "And Juda said to his father: Send the boy with me, that we may set forward, and may live: lest both we and our children perish."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ego suscipio puerum: de manu mea require illum: nisi reduxero, et reddidero eum tibi, ero peccati reus in te omni tempore."
      en: "I take the boy upon me, require him at my hand: unless I bring him again, and restore him to thee, I will be guilty of sin against thee for ever."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Si non intercessisset dilatio, jam vice alter venissemus."
      en: "If delay had not been made, we had been here again the second time."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Igitur Israel pater eorum dixit ad eos: Si sic necesse est, facite quod vultis: sumite de optimis terrae fructibus in vasis vestris, et deferte viro munera, modicum resinae, et mellis, et storacis, stactes, et terebinthi, et amygdalarum."
      en: "Then Israel said to them: If it must needs be so, do what you will: take of the best fruits of the land in your vessels, and carry down presents to the man, a little balm, and honey, and storax, myrrh, turpentine, and almonds."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Pecuniam quoque duplicem ferte vobiscum: et illam, quam invenistis in sacculis, reportate, ne forte errore factum sit:"
      en: "And take with you double money, and carry back what you found in your sacks, lest perhaps it was done by mistake."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sed et fratrem vestrum tollite, et ite ad virum."
      en: "And take also your brother, and go to the man."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Deus autem meus omnipotens faciat vobis eum placabilem: et remittat vobiscum fratrem vestrum quem tenet, et hunc Benjamin: ego autem quasi orbatus absque liberis ero."
      en: "And may my almighty God make him favourable to you; and send back with you your brother, whom he keepeth, and this Benjamin: and as for me I shall be desolate without children."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Tulerunt ergo viri munera, et pecuniam duplicem, et Benjamin: descenderuntque in Aegyptum, et steterunt coram Joseph."
      en: "So the men took the presents, and double money, and Benjamin: and went down into Egypt, and stood before Joseph."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quos cum ille vidisset et Benjamin simul, praecepit dispensatori domus suae, dicens: Introduc viros domum, et occide victimas, et instrue convivium: quoniam mecum sunt comesturi meridie."
      en: "And when he had seen them, and Benjamin with them, he commanded the steward of his house, saying: Bring in the men into the house, and kill victims, and prepare a feast: because they shall eat with me at noon."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Fecit ille quod sibi fuerat imperatum, et introduxit viros domum."
      en: "He did as he was commanded, and brought the men into the house."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ibique exterriti, dixerunt mutuo: Propter pecuniam, quam retulimus prius in saccis nostris, introducti sumus: ut devolvat in nos calumniam, et violenter subjiciat servituti et nos, et asinos nostros."
      en: "And they being much afraid, said there one to another: Because of the money, which we carried back the first time in our sacks, we are brought in: that he may bring upon us a false accusation, and by violence make slaves of us and our asses."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Quam ob rem in ipsis foribus accedentes ad dispensatorem domus,"
      en: "Wherefore going up to the steward of the house, at the door,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "locuti sunt: Oramus, domine, ut audias nos. Jam ante descendimus ut emeremus escas:"
      en: "They said: Sir, we desire thee to hear us: We came down once before to buy food:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quibus emptis, cum venissemus ad diversorium, aperuimus saccos nostros, et invenimus pecuniam in ore saccorum: quam nunc eodem pondere reportavimus."
      en: "And when we had bought, and come to the inn, we opened our sacks, and found our money in the mouths of the sacks: which we have now brought again in the same weight."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Sed et aliud attulimus argentum, ut emamus quae nobis necessaria sunt: non est in nostra conscientia quis posuerit eam in marsupiis nostris."
      en: "And we have brought other money besides, to buy what we want: we cannot tell who put it in our bags."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "At ille respondit: Pax vobiscum, nolite timere: Deus vester, et Deus patris vestri, dedit vobis thesauros in saccis vestris: nam pecuniam, quam dedistis mihi, probatam ego habeo. Eduxitque ad eos Simeon."
      en: "But he answered: Peace be with you, fear not: your God, and the God of your father hath given you treasure in your sacks. For the money, which you gave me, I have for good. And he brought Simeon out to them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et introductis domum, attulit aquam, et laverunt pedes suos, deditque pabulum asinis eorum."
      en: "And having brought them into the house, he fetched water, and they washed their feet, and he gave provender to their asses."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Illi vero parabant munera, donec ingrederetur Joseph meridie: audierant enim quod ibi comesturi essent panem."
      en: "But they made ready the presents, against Joseph came at noon: for they had heard that they should eat bread there."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Igitur ingressus est Joseph domum suam, obtuleruntque ei munera, tenentes in manibus suis: et adoraverunt proni in terram."
      en: "Then Joseph came into his house, and they offered him the presents holding them in their hands, and they bowed down with their face to the ground."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "At ille, clementer resalutatis eis, interrogavit eos, dicens: Salvusne est pater vester senex, de quo dixeratis mihi? adhuc vivit?"
      en: "But he, courteously saluting them again, asked them, saying: Is the old man your father in health, of whom you told me? Is he yet living?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Qui responderunt: Sospes est servus tuus pater noster, adhuc vivit. Et incurvati, adoraverunt eum."
      en: "And they answered: Thy servant our father is in health, he is yet living. And bowing themselves they made obeisance to him."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Attollens autem Joseph oculos, vidit Benjamin fratrem suum uterinum, et ait: Iste est frater vester parvulus, de quo dixeratis mihi? Et rursum: Deus, inquit, misereatur tui, fili mi."
      en: "And Joseph lifting up his eyes, saw Benjamin his brother, by the same mother, and said: Is this your young brother, of whom you told me? And he said: God be gracious to thee, my son."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Festinavitque, quia commota fuerant viscera ejus super fratre suo, et erumpebant lacrimae: et introiens cubiculum flevit."
      en: "And he made haste because his heart was moved upon his brother, and tears gushed out: and going into his chamber he wept."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Rursumque lota facie egressus, continuit se, et ait: Ponite panes."
      en: "And when he had washed his face, coming out again, he refrained himself, and said: Set bread on the table."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Quibus appositis, seorsum Joseph, et seorsum fratribus, Aegyptiis quoque qui vescebantur simul, seorsum ( illicitum est enim Aegyptiis comedere cum Hebraeis, et profanum putant hujuscemodi convivium)"
      en: "And when it was set on, for Joseph apart, and for his brethren apart, for the Egyptians also that ate with him, apart, (for it is unlawful for the Egyptians to eat with the Hebrews, and they think such a feast profane):"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "sederunt coram eo, primogenitus juxta primogenita sua, et minimus juxta aetatem suam. Et mirabantur nimis,"
      en: "They sat before him, the firstborn according to his birthright, and the youngest according to his age. And they wondered very much:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "sumptis partibus quas ab eo acceperant: majorque pars venit Benjamin, ita ut quinque partibus excederet. Biberuntque et inebriati sunt cum eo."
      en: "Taking the messes which they received of him: and the greater mess came to Benjamin, so that it exceeded by five parts. And they drank, and were merry with him."
    status: { la: verified, en: verified }
