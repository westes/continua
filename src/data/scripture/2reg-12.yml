# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2reg
chapter: 12
verses:
  - n: 1
    text:
      la: "Misit ergo Dominus Nathan ad David: qui cum venisset ad eum, dixit ei: Duo viri erant in civitate una, unus dives, et alter pauper."
      en: "And the Lord sent Nathan to David: and when he was come to him, he said to him: There were two men in one city, the one rich, and the other poor."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dives habebat oves, et boves plurimos valde."
      en: "The rich man had exceeding many sheep and oxen."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Pauper autem nihil habebat omnino, praeter ovem unam parvulam, quam emerat et nutrierat, et quae creverat apud eum cum filiis ejus simul, de pane illius comedens, et de calice ejus bibens, et in sinu illius dormiens: eratque illi sicut filia."
      en: "But the poor man had nothing at all but one little ewe lamb, which he had bought and nourished up, and which had grown up in his house together with his children, eating of his bread, and drinking of his cup, and sleeping in his bosom: and it was unto him as a daughter."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cum autem peregrinus quidam venisset ad divitem, parcens ille sumere de ovibus et de bobus suis, ut exhiberet convivium peregrino illi qui venerat ad se, tulit ovem viri pauperis, et praeparavit cibos homini qui venerat ad se."
      en: "And when a certain stranger was come to the rich man, he spared to take of his own sheep and oxen, to make a feast for that stranger, who was come to him, but took the poor man's ewe, and dressed it for the man that was come to him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Iratus autem indignatione David adversus hominem illum nimis, dixit ad Nathan: Vivit Dominus, quoniam filius mortis est vir qui fecit hoc."
      en: "And David's anger being exceedingly kindled against that man, he said to Nathan: As the Lord liveth, the man that hath done this is a child of death."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ovem reddet in quadruplum, eo quod fecerit verbum istud, et non pepercerit."
      en: "He shall restore the ewe fourfold, because he did this thing, and had no pity."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dixit autem Nathan ad David: Tu es ille vir. Haec dicit Dominus Deus Israel: Ego unxi te in regem super Israel, et ego erui te de manu Saul,"
      en: "And Nathan said to David: Thou art the man. Thus saith the Lord the God of Israel: I anointed thee king over Israel, and I delivered thee from the hand of Saul,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et dedi tibi domum domini tui, et uxores domini tui in sinu tuo, dedique tibi domum Israel et Juda: et si parva sunt ista, adjiciam tibi multo majora."
      en: "And gave thee thy master's house and thy master's wives into thy bosom, and gave thee the house of Israel and Juda: and if these things be little, I shall add far greater things unto thee."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quare ergo contempsisti verbum Domini, ut faceres malum in conspectu meo? Uriam Hethaeum percussisti gladio, et uxorem illius accepisti in uxorem tibi, et interfecisti eum gladio filiorum Ammon."
      en: "Why therefore hast thou despised the word of the Lord, to do evil in my sight? Thou hast killed Urias the Hethite with the sword, and hast taken his wife to be thy wife, and hast slain him with the sword of the children of Ammon."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quam ob rem non recedet gladius de domo tua usque in sempiternum, eo quod despexeris me, et tuleris uxorem Uriae Hethaei, ut esset uxor tua."
      en: "Therefore the sword shall never depart from thy house, because thou hast despised me, and hast taken the wife of Urias the Hethite to be thy wife."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Itaque haec dicit Dominus: Ecce ego suscitabo super te malum de domo tua, et tollam uxores tuas in oculis tuis, et dabo proximo tuo, et dormiet cum uxoribus tuis in oculis solis hujus."
      en: "Thus saith the Lord: Behold, I will raise up evil against thee out of thy own house, and I will take thy wives before thy eyes and give them to thy neighhour, and he shall lie with thy wives in the sight of this sun."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tu enim fecisti abscondite: ego autem faciam verbum istud in conspectu omnis Israel, et in conspectu solis."
      en: "For thou didst it secretly: but I will do this thing in the sight of all Israel, and in the sight of the sun."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et dixit David ad Nathan: Peccavi Domino. Dixitque Nathan ad David: Dominus quoque transtulit peccatum tuum: non morieris."
      en: "And David said to Nathan: I have sinned against the Lord. And Nathan said to David: The Lord also hath taken away thy sin: thou shalt not die."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Verumtamen, quoniam blasphemare fecisti inimicos Domini, propter verbum hoc, filius, qui natus est tibi, morte morietur."
      en: "Nevertheless, because thou hast given occasion to the enemies of the Lord to blaspheme, for this thing, the child that is born to thee, shall surely die."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et reversus est Nathan in domum suam. Percussit quoque Dominus parvulum, quem pepererat uxor Uriae David, et desperatus est."
      en: "And Nathan returned to his house. The Lord also struck the child which the wife of Urias had borne to David, and his life was despaired of."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Deprecatusque est David Dominum pro parvulo: et jejunavit David jejunio, et ingressus seorsum, jacuit super terram."
      en: "And David besought the Lord for the child: and David kept a fast, and going in by himself lay upon the ground."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Venerunt autem seniores domus ejus, cogentes eum ut surgeret de terra. Qui noluit, nec comedit cum eis cibum."
      en: "And the ancients of his house came, to make him rise from the ground: but he would not, neither did he eat meat with them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Accidit autem die septima ut moreretur infans: timueruntque servi David nuntiare ei quod mortuus esset parvulus: dixerunt enim: Ecce cum parvulus adhuc viveret, loquebamur ad eum, et non audiebat vocem nostram: quanto magis si dixerimus: Mortuus est puer, se affliget?"
      en: "And it came to pass on the seventh day that the child died: and the servants of David feared to tell him, that the child was dead. For they said: Behold when the child was yet alive, we spoke to him, and he would not hearken to our voice: how much more will he afflict himself if we tell him that the child is dead?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Cum ergo David vidisset servos suos mussitantes, intellexit quod mortuus esset infantulus: dixitque ad servos suos: Num mortuus est puer? Qui responderunt ei: Mortuus est."
      en: "But when David saw his servants whispering, he understood that the child was dead: and he said to his servants: Is the child dead? They answered him: He is dead."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Surrexit ergo David de terra: et lotus unctusque est: cumque mutasset vestem, ingressus est domum Domini: et adoravit, et venit in domum suam, petivitque ut ponerent ei panem, et comedit."
      en: "Then David arose from the ground, and washed and anointed himself: and when he had changed his apparel, he went into the house of the Lord: and worshipped, and then he came into his own house, and he called for bread, and ate."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dixerunt autem ei servi sui: Quis est sermo, quem fecisti? propter infantem, cum adhuc viveret, jejunasti et flebas: mortuo autem puero, surrexisti, et comedisti panem."
      en: "And his servants said to him: What thing is this that thou hast done? thou didst fast and weep for the child, while it was alive, but when the child was dead, thou didst rise up, and eat bread."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Qui ait: Propter infantem, dum adhuc viveret, jejunavi et flevi: dicebam enim: Quis scit si forte donet eum mihi Dominus, et vivat infans?"
      en: "And he said: While the child was yet alive, I fasted and wept for him: for I said: Who knoweth whether the Lord may not give him to me, and the child may live?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Nunc autem quia mortuus est, quare jejunem? Numquid potero revocare eum amplius? Ego vadam magis ad eum: ille vero non revertetur ad me."
      en: "But now that he is dead, why should I fast? Shall I be able to bring him back any more? I shall go to him rather: but he shall not return to me."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et consolatus est David Bethsabee uxorem suam, ingressusque ad eam, dormivit cum ea: quae genuit filium, et vocavit nomen ejus Salomon, et Dominus dilexit eum."
      en: "And David comforted Bethsabee his wife, and went in unto her, and slept with her: and she bore a son, and he called his name Solomon, and the Lord loved him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Misitque in manu Nathan prophetae, et vocavit nomen ejus, Amabilis Domino, eo quod diligeret eum Dominus."
      en: "And he sent by the hand of Nathan the prophet, and called his name, Amiable to the Lord, because the Lord loved him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Igitur pugnabat Joab contra Rabbath filiorum Ammon, et expugnabat urbem regiam."
      en: "And Joab fought against Rabbath of the children of Ammon, and laid close siege to the royal city."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Misitque Joab nuntios ad David, dicens: Dimicavi adversum Rabbath, et capienda est Urbs aquarum."
      en: "And Joab sent messengers to David, saying: I have fought against Rabbath, and the city of waters is about to be taken."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Nunc igitur congrega reliquam partem populi, et obside civitatem, et cape eam: ne, cum a me vastata fuerit urbs, nomini meo ascribatur victoria."
      en: "Now therefore gather thou the rest of the people together, and besiege the city and take it: lest when the city shall be wasted by me, the victory be ascribed to my name."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Congregavit itaque David omnem populum, et profectus est adversum Rabbath: cumque dimicasset, cepit eam."
      en: "Then David gathered all the people together, and went out against Rabbath: and after fighting, he took it."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et tulit diadema regis eorum de capite ejus, pondo auri talentum, habens gemmas pretiosissimas, et impositum est super caput David. Sed et praedam civitatis asportavit multam valde:"
      en: "And he took the crown of their king from his head, the weight of which was a talent of gold, set with most precious stones, and it was put upon David's head, and the spoils of the city which were very great he carried away."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "populum quoque ejus adducens serravit, et circumegit super eos ferrata carpenta: divisitque cultris, et traduxit in typo laterum: sic fecit universis civitatibus filiorum Ammon: et reversus est David, et omnis exercitus in Jerusalem."
      en: "And bringing forth the people thereof he sawed them, and drove over them chariots armed with iron: and divided them with knives, and made them pass through brickkilns: so did he to all the cities of the children of Ammon: and David returned, with all the army to Jerusalem."
    status: { la: verified, en: verified }
