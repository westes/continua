# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: eph
chapter: 6
verses:
  - n: 1
    text:
      la: "filii oboedite parentibus vestris in Domino hoc enim est iustum"
      en: "Children, obey your parents in the Lord, for this is just."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "honora patrem tuum et matrem quod est mandatum primum in promissione"
      en: "Honour thy father and thy mother, which is the first commandment with a promise:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ut bene sit tibi et sis longevus super terram"
      en: "That it may be well with thee, and thou mayest be long lived upon earth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et patres nolite ad iracundiam provocare filios vestros sed educate illos in disciplina et correptione Domini"
      en: "And you, fathers, provoke not your children to anger; but bring them up in the discipline and correction of the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "servi oboedite dominis carnalibus cum timore et tremore in simplicitate cordis vestri sicut Christo"
      en: "Servants, be obedient to them that are your lords according to the flesh, with fear and trembling, in the simplicity of your heart, as to Christ:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "non ad oculum servientes quasi hominibus placentes sed ut servi Christi facientes voluntatem Dei ex animo"
      en: "Not serving to the eye, as it were pleasing men, but, as the servants of Christ doing the will of God from the heart,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "cum bona voluntate servientes sicut Domino et non hominibus"
      en: "With a good will serving, as to the Lord, and not to men."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "scientes quoniam unusquisque quodcumque fecerit bonum hoc percipiet a Domino sive servus sive liber"
      en: "Knowing that whatsoever good thing any man shall do, the same shall he receive from the Lord, whether he be bond, or free."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et domini eadem facite illis remittentes minas scientes quia et illorum et vester Dominus est in caelis et personarum acceptio non est apud eum"
      en: "And you, masters, do the same things to them, forbearing threatenings, knowing that the Lord both of them and you is in heaven; and there is no respect of persons with him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "de cetero fratres confortamini in Domino et in potentia virtutis eius"
      en: "Finally, brethren, be strengthened in the Lord, and in the might of his power."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "induite vos arma Dei ut possitis stare adversus insidias diaboli"
      en: "Put you on the armour of God, that you may be able to stand against the deceits of the devil."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quia non est nobis conluctatio adversus carnem et sanguinem sed adversus principes et potestates adversus mundi rectores tenebrarum harum contra spiritalia nequitiae in caelestibus"
      en: "For our wrestling is not against flesh and blood; but against principalities and power, against the rulers of the world of this darkness, against the spirits of wickedness in the high places."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "propterea accipite armaturam Dei ut possitis resistere in die malo et omnibus perfectis stare"
      en: "Therefore take unto you the armour of God, that you may be able to resist in the evil day, and to stand in all things perfect."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "state ergo succincti lumbos vestros in veritate et induti loricam iustitiae"
      en: "Stand therefore, having your loins girt about with truth, and having on the breastplate of justice,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et calciati pedes in praeparatione evangelii pacis"
      en: "And your feet shod with the preparation of the gospel of peace:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "in omnibus sumentes scutum fidei in quo possitis omnia tela nequissimi ignea extinguere"
      en: "In all things taking the shield of faith, wherewith you may be able to extinguish all the fiery darts of the most wicked one."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et galeam salutis adsumite et gladium Spiritus quod est verbum Dei"
      en: "And take unto you the helmet of salvation, and the sword of the Spirit (which is the word of God)."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "per omnem orationem et obsecrationem orantes omni tempore in Spiritu et in ipso vigilantes in omni instantia et obsecratione pro omnibus sanctis"
      en: "By all prayer and supplication praying at all times in the spirit; and in the same watching with all instance and supplication for all the saints:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et pro me ut detur mihi sermo in apertione oris mei cum fiducia notum facere mysterium evangelii"
      en: "And for me, that speech may be given me, that I may open my mouth with confidence, to make known the mystery of the gospel."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "pro quo legatione fungor in catena ita ut in ipso audeam prout oportet me loqui"
      en: "For which I am an ambassador in a chain, so that therein I may be bold to speak according as I ought."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ut autem et vos sciatis quae circa me sunt quid agam omnia nota vobis faciet Tychicus carissimus frater et fidelis minister in Domino"
      en: "But that you also may know the things that concern me, and what I am doing, Tychicus, my dearest brother and faithful minister in the Lord, will make known to you all things:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quem misi ad vos in hoc ipsum ut cognoscatis quae circa nos sunt et consoletur corda vestra"
      en: "Whom I have sent to you for this same purpose, that you may know the things concerning us, and that he may comfort your hearts."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "pax fratribus et caritas cum fide a Deo Patre et Domino Iesu Christo"
      en: "Peace be to the brethren and charity with faith, from God the Father, and the Lord Jesus Christ."
    status: { la: verified, en: verified }
