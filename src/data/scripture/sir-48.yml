# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 48
verses:
  - n: 1
    text:
      la: "et surrexit Helias propheta quasi ignis et verbum ipsius quasi fax ardebat"
      en: "And Elias the prophet stood up, as a fire, and his word burnt like a torch."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "qui induxit in illos famem et imitantes illum invidia sua pauci facti sunt non poterant enim sustinere praecepta Domini"
      en: "He brought a famine upon them, and they that provoked him in their envy, were reduced to a small number, for they could not endure the commandments of the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "verbo Domini exaltavit caelum et deiecit a se ignem terrae"
      en: "By the word of the Lord he shut up the heaven, and he brought down fire from heaven thrice."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sic amplificatus est Helias in mirabilibus suis et quis potest similiter gloriari tibi"
      en: "Thus was Elias magnified in his wondrous works. And who can glory like to thee?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "qui sustulisti mortuum ab inferis de sorte mortis in verbo Domini Dei"
      en: "Who raisedst up a dead man from below, from the lot of death, by the word of the Lord God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui deiecisti reges ad perniciem et confregisti facile potentiam ipsorum et gloriosos de lecto suo"
      en: "Who broughtest down kings to destruction, and brokest easily their power in pieces, and the glorious from their bed."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui audis in Sina iudicium et in Coreb iudicia defensionis"
      en: "Who heardest judgment in Sina, and in Horeb the judgments of vengeance."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui ungues reges ad paenitentiam et prophetas facis successores post te"
      en: "Who anointedst kings to penance, and madest prophets successors after thee."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "qui receptus es in turbine ignis in curru equorum igneorum"
      en: "Who wast taken up in a whirlwind of fire, in a chariot of fiery horses."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui inscriptus es indiciis temporum et lenis iracundiam Domini conciliare cor patris ad filium et restituere tribus Iacob"
      en: "Who art registered in the judgments of times to appease the wrath of the Lord, to reconcile the heart of the father to the son, and to restore the tribes of Jacob."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "beati sunt qui te viderunt et in amicitia tua decorati sunt"
      en: "Blessed are they that saw thee, and were honoured with thy friendship."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nam nos vita vivimus tantum post mortem autem non erit tale nomen nostrum"
      en: "For we live only in our life, but after death our name shall not be such."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Helias qui in turbine tectus est et in Heliseo conpletus est spiritus eius in diebus suis non pertimuit principem et potentia nemo vicit illum"
      en: "Elias was indeed covered with the whirlwind, and his spirit was filled up in Eliseus: in his days he feared not the prince, and no man was more powerful than he."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "nec superavit illum verbum aliquod et mortuum prophetavit corpus eius"
      en: "No word could overcome him, and after death his body prophesied."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "in vita sua fecit monstra et in morte mirabilia opera ipsius"
      en: "In his life he did great wonders, and is death he wrought miracles."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "in omnibus istis non paenituit populum et non recesserunt a peccatis suis usque dum deiecti sunt de terra sua et dispersi sunt in omnem terram"
      en: "For all this the people repented not, neither did they depart from their sins till they were cast out of their land, and were scattered through all the earth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et relicta est gens perpauca et princeps in domo David"
      en: "And there was left but a small people, and a prince in the house of David."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quidam ipsorum fecerunt quod placeret Deo alii autem multa commiserunt peccata"
      en: "Some of these did that which pleased God: but others committed many sine."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ezechias munivit civitatem suam et induxit in medium ipsius aquam et fodit ferro rupem et aedificavit ad aquam puteum"
      en: "Ezechias fortified his city, and brought in water into the midst thereof, and he digged a rock with iron, and made a well for water."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "in diebus ipsius ascendit Sennacherim et misit Rapsacen et sustulit manum suam contra illos et extulit manum suam in Sion et superbus factus est potentia sua"
      en: "In his days Sennacherib came up, and sent Rabsaces, and lifted up his hand against them, and he stretched out his hand against Sion, and became proud through his power."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "tunc mota sunt corda et manus ipsorum et doluerunt quasi parturientes mulieres"
      en: "Then their hearts and hands trembled, and they were in pain as women in travail."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et invocaverunt Dominum misericordem et patentes manus extulerunt ad caelum et sanctus Dominus Deus audivit cito vocem ipsorum"
      en: "And they called upon the Lord who is merciful, and spreading their hands, they lifted them up to heaven: and the holy Lord God quickly heard their voice."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "non est commemoratus peccatorum illorum neque dedit illos inimicis suis sed purgavit illos in manu Esaiae sancti prophetae"
      en: "He was not mindful of their sins, neither did he deliver them up to their enemies, but he purified them by the hand of Isaias, the holy prophet."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "subiecit castra Assyriorum et conteruit illos angelus Dei"
      en: "He overthrew the army of the Assyrians, and the angel of the Lord destroyed them."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "nam fecit Ezechias quod placuit Deo et fortiter ivit in via David patris sui quam mandavit illi Esaias propheta magnus et fidelis in conspectu Dei"
      en: "For Ezechias did that which pleased God, and walked valiantly in the way of David his father, which Isaias, the great prophet, and faithful in the sight of God, had commanded him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "in diebus ipsius retro rediit sol et addidit regi vitam"
      en: "In his days the sun went backward, and he lengthened the king's life."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "spiritu magno vidit ultima et obsecratus est lugentes in Sion usque in sempiternum"
      en: "With a great spirit he saw the things that are to come to pass at last, and comforted the mourners in Sion."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "ostendit futura et abscondita antequam evenirent"
      en: "He shewed what should come to pass for ever, and secret things before they came."
    status: { la: verified, en: verified }
