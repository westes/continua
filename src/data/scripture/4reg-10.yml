# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 10
verses:
  - n: 1
    text:
      la: "Erant autem Achab septuaginta filii in Samaria: scripsit ergo Jehu litteras, et misit in Samariam, ad optimates civitatis, et ad majores natu, et ad nutritios Achab, dicens:"
      en: "And Achab had seventy sons in Samaria: so Jehu wrote letters, and sent to Samaria, to the chief men of the city, and to the ancients, and to them that brought up Achab's children, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Statim ut acceperitis litteras has, qui habetis filios domini vestri, et currus, et equos, et civitates firmas, et arma,"
      en: "As soon as you receive these letters, ye that have your master's sons, and chariots, and horses, and fenced cities, and armour,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "eligite meliorem, et eum qui vobis placuerit de filiis domini vestri, et eum ponite super solium patris sui, et pugnate pro domo domini vestri."
      en: "Choose the best, and him that shall please you most of your master's sons, and set him on his father's throne, and fight for the house of your master."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Timuerunt illi vehementer, et dixerunt: Ecce duo reges non potuerunt stare coram eo, et quomodo nos valebimus resistere?"
      en: "But they were exceedingly afraid, and said: Behold two kings could not stand before him, and how shall we be able to resist?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Miserunt ergo praepositi domus, et praefecti civitatis, et majores natu, et nutritii ad Jehu, dicentes: Servi tui sumus, quaecumque jusseris faciemus, nec constituemus nobis regem: quaecumque tibi placent, fac."
      en: "Therefore the overseers of the house, and the rulers of the city, and the ancients, and the tutors sent to Jehu, saying: We are thy servants, whatsoever thou shalt command us we will do, neither will we make us a king: do thou all that pleaseth thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Rescripsit autem eis litteras secundo, dicens: Si mei estis, et obeditis mihi, tollite capita filiorum domini vestri, et venite ad me hac eadem hora cras in Jezrahel. Porro filii regis, septuaginta viri apud optimates civitates nutriebantur."
      en: "And he wrote letters the second time to them, saying: If you be mine, and will obey me, take the heads of the sons of your master, and come to me to Jezrahel by tomorrow this time. Now the king's sons, being seventy men, were brought up with the chief men of the city."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cumque venissent litteras ad eos, tulerunt filios regis, et occiderunt septuaginta viros, et posuerunt capita eorum in cophinis, et miserunt ad eum in Jezrahel."
      en: "And when the letters came to them, they took the king's sons, and slew seventy persons, and put their heads in baskets, and sent them to him to Jezrahel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Venit autem nuntius, et indicavit ei, dicens: Attulerunt capita filiorum regis. Qui respondit: Ponite ea ad duos acervos juxta introitum portae usque mane."
      en: "And a messenger came, and told him, saying: They have brought the heads of the king's sons. And he said: Lay ye them in two heaps by the entering in of the gate until the morning."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Cumque diluxisset, egressus est, et stans dixit ad omnem populum: Justi estis: si ego conjuravi contra dominum meum, et interfeci eum, quis percussit omnes hos?"
      en: "And when it was light, he went out, and standing said to all the people: You are just: if I conspired against my master, and slew him, who hath slain all these?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Videte ergo nunc quoniam non cecidit de sermonibus Domini in terram, quos locutus est Dominus super domum Achab, et Dominus fecit quod locutus est in manu servi sui Eliae."
      en: "See therefore now that there hath not fallen to the ground any of the words of the Lord, which the Lord spoke concerning the house of Achab, and the Lord hath done that which he spoke in the hand of his servant Elias."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Percussit igitur Jehu omnes, qui reliqui erant de domo Achab in Jezrahel, et universos optimates ejus, et notos, et sacerdotes, donec non remanerent ex eo reliquiae."
      en: "So Jehu slew all that were left of the house of Achab in Jezrahel, and all his chief men, and his friends, and his priests, till there were no remains left of him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et surrexit, et venit in Samariam: cumque venisset ad Cameram pastorum in via,"
      en: "And he arose, and went to Samaria: and when he was come to the shepherds' cabin in the way,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "invenit fratres Ochoziae regis Juda, dixitque ad eos: Quinam estis vos? Qui responderunt: Fratres Ochoziae sumus, et descendimus ad salutandos filios regis, et filios reginae."
      en: "He met with the brethren of Ochozias king of Juda, and he said to them: Who are you? And they answered: We are the brethren of Ochozias, and are come down to salute the sons of the king, and the sons of the queen."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Qui ait: Comprehendite eos vivos. Quos cum comprehendissent vivos, jugulaverunt eos in cisterna juxta Cameram, quadraginta duos viros, et non reliquit ex eis quemquam."
      en: "And he said: Take them alive. And they took them alive, and killed them at the pit by the cabin, two and forty men, and he left not any of them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cumque abiisset inde, invenit Jonadab filium Rechab in occursum sibi, et benedixit ei. Et ait ad eum: Numquid est cor tuum rectum, sicut cor meum cum corde tuo? Et ait Jonadab: Est. Si est, inquit, da manum tuam. Qui dedit ei manum suam. At ille levavit eum ad se in currum:"
      en: "And when he was departed thence, he found Jonadab the son of Rechab coming to meet him, and he blessed him. And he said to him: Is thy heart right as my heart is with thy heart? And Jonadab said: It is. If it be, said he, give me thy hand. He gave him his hand. And he lifted him up to him into the chariot,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixitque ad eum: Veni mecum, et vide zelum meum pro Domino. Et impositum in curru suo"
      en: "And he said to him: Come with me, and see my zeal for the Lord. So he made him ride in his chariot,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "duxit in Samariam. Et percussit omnes qui reliqui fuerant de Achab in Samaria usque ad unum, juxta verbum Domini, quod locutus est per Eliam."
      en: "And brought him into Samaria. And he slew all that were left of Achab in Samaria, to a man, according to the word of the Lord, which he spoke by Elias."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Congregavit ergo Jehu omnem populum, et dixit ad eos: Achab coluit Baal parum, ego autem colam eum amplius."
      en: "And Jehu gathered together all the people, and said to them: Achab worshipped Baal a little, but I will worship him more."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Nunc igitur omnes prophetas Baal, et universos servos ejus, et cunctos sacerdotes ipsius vocate ad me: nullus sit qui non veniat, sacrificium enim grande est mihi Baal: quicumque defuerit, non vivet. Porro Jehu faciebat hoc insidiose, ut disperderet cultores Baal."
      en: "Now therefore call to me all the prophets of Baal, and all his servants, and all his priests: let none be wanting, for I have a great sacrifice to offer to Baal: whosoever shall be wanting shall not live. Now Jehu did this craftily, that he might destroy the worshippers of Baal."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et dixit: Sanctificate diem solemnem Baal. Vocavitque"
      en: "And he said: Proclaim a festival for Baal. And he called,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et misit in univeros terminos Israel, et venerunt cuncti servi Baal: non fuit residuus ne unus quidem qui non veniret. Et ingressi sunt templum Baal: et repleta est domus Baal, a summo usque ad summum."
      en: "And he sent into all the borders of Israel, and all the servants of Baal came: there was not one left that did not come. And they went into the temple of Baal: and the house of Baal was filled, from one end to the other."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Dixitque his qui erant super vestes: Proferte vestimenta universis servis Baal. Et protulerunt eis vestes."
      en: "And he said to them that were over the wardrobe: Bring forth garments for all the servants of Baal. And they brought them forth garments."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ingressusque Jehu, et Jonadab filius Rechab, templum Baal, ait cultoribus Baal: Perquirite, et videte, ne quis forte vobiscum sit de servis Domini, sed ut sint servi Baal soli."
      en: "And Jehu and Jonadab the son of Rechab went to the temple of Baal, and said to the worshippers of Baal: Search, and see that there be not any with you of the servants of the Lord, but that there be the servants of Baal only."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ingressi sunt igitur ut facerent victimas et holocausta: Jehu autem praeparaverat sibi foris octoginta viros, et dixerat eis: Quicumque fugerit de hominibus his, quos ego adduxero in manus vestras, anima ejus erit pro anima illius."
      en: "And they went in to offer sacrifices and burnt offerings: but Jehu had prepared him fourscore men without, and said to them: If any of the men escape, whom I have brought into your hands, he that letteth him go shall answer life for life."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Factum est autem, cum completum esset holocaustum, praecepit Jehu militibus et ducibus suis: Ingredimini, et percutite eos, nullus evadat. Percusseruntque eos in ore gladii, et projecerunt milites et duces, et ierunt in civitatem templi Baal,"
      en: "And it came to pass, when the burnt offering was ended, that Jehu commanded his soldiers and captains, saying: Go in, and kill them, let none escape. And the soldiers and captains slew them with the edge of the sword, and cast them out: and they went into the city of the temple of Baal,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et protulerunt statuam de fano Baal, et combusserunt,"
      en: "And brought the statue out of Baal's temple, and burnt it,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et comminuerunt eam. Destruxerunt quoque aedem Baal, et fecerunt pro ea latrinas usque in diem hanc."
      en: "And broke it in pieces. They destroyed also the temple of Baal, and made a jakes in its place unto this day."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Delevit itaque Jehu Baal de Israel:"
      en: "So Jehu destroyed Baal out of Israel:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "verumtamen a peccatis Jeroboam filii Nabat, qui peccare fecit Israel, non recessit, nec dereliquit vitulos aureos, qui erant in Bethel, et in Dan."
      en: "But yet he departed not from the sills of Jeroboam the son of Nabat, who made Israel to sin, nor did he forsake the golden calves that were in Bethel and Dan."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Dixit autem Dominus ad Jehu: Quia studiose egisti quod rectum erat, et placebat in oculis meis, et omnia quae erant in corde meo fecisti contra domum Achab: filii tui usque ad quartam generationem sedebunt super thronum Israel."
      en: "And the Lord said to Jehu: Because thou hast diligently executed that which was right and pleasing in my eyes, and hast done to the house of Achab according to all that was in my heart: thy children shall sit upon the throne of Israel to the fourth Generation."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Porro Jehu non custodivit ut ambularet in lege Domini Dei Israel in toto corde suo: non enim recessit a peccatis Jeroboam, qui peccare fecerat Israel."
      en: "But Jehu took no heed to walk in the law of the Lord the God of Israel with all his heart: for he departed not from the sins of Jeroboam, who had made Israel to sin."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "In diebus illis coepit Dominus taedere super Israel: percussitque eos Hazael in universis finibus Israel,"
      en: "In those days the Lord began to be weary of Israel: and Hazael ravaged them in all the coasts of Israel,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "a Jordane contra orientalem plagam, omnem terram Galaad, et Gad, et Ruben, et Manasse, ab Aroer, quae est super torrentem Arnon, et Galaad, et Basan."
      en: "From the Jordan eastward, all the land of Galaad, and Gad, and Ruben, and Manasses, from Aroer, which is upon the torrent Arnon, and Galaad, and Basan."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Reliqua autem verborum Jehu, et universa quae fecit, et fortitudo ejus, nonne haec scripta sunt in libro verborum dierum regum Israel?"
      en: "But the rest of the acts of Jehu, and all that he did, and his strength, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et dormivit Jehu cum patribus suis, sepelieruntque eum in Samaria: et regnavit Joachaz filius ejus pro eo."
      en: "And Jehu slept with his fathers, and they buried him in Samaria: and Joachaz his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Dies autem, quos regnavit Jehu super Israel, viginti et octo anni sunt in Samaria."
      en: "And the time that Jehu reigned over Israel, in Samaria, was eight and twenty years."
    status: { la: verified, en: verified }
