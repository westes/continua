# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 56
verses:
  - n: 1
    text:
      la: "Haec dicit Dominus: Custodite judicium, et facite justitiam, quia juxta est salus mea ut veniat, et justitia mea ut reveletur."
      en: "Thus saith the Lord: Keep ye judgment, and do justice: for my salvation is near to come, and my justice to be revealed."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Beatus vir qui facit hoc, et filius hominis qui apprehendet istud, custodiens sabbatum ne polluat illud, custodiens manus suas ne faciat omne malum."
      en: "Blessed is the man that doth this, and the son of man that shall lay hold on this: that keepeth the sabbath from profaning it, that keepeth his hands from doing any evil."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et non dicat filius advenae, qui adhaeret Domino, dicens: Separatione dividet me Dominus a populo suo; et non dicat eunuchus: Ecce ego lignum aridum."
      en: "And let not the son of the stranger, that adhereth to the Lord, speak, saying: The Lord will divide and separate me from his people. And let not the eunuch say: Behold I am a dry tree."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quia haec dicit Dominus eunuchis: Qui custodierint sabbata mea, et elegerint quae ego volui, et tenuerint foedus meum,"
      en: "For thus saith the Lord to the eunuchs, They that shall keep my sabbaths, and shall choose the things that please me, and shall hold fast my covenant:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dabo eis in domo mea et in muris meis locum, et nomen melius a filiis et filiabus: nomen sempiternum dabo eis, quod non peribit."
      en: "I will give to them in my house, and within my walls, a place, and a name better than sons and daughters: I will give them an everlasting name which shall never perish."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et filios advenae, qui adhaerent Domino, ut colant eum, et diligant nomen ejus, ut sint ei in servos; omnem custodientem sabbatum ne polluat illud, et tenentem foedus meum;"
      en: "And the children of the stranger that adhere to the Lord, to worship him, and to love his name, to be his servants: every one that keepeth the sabbath from profaning it, and that holdeth fast my covenant:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "adducam eos in montem sanctum meum et laetificabo eos in domo orationis meae; holocausta eorum et victimae eorum placebunt mihi super altari meo, quia domus mea domus orationis vocabitur cunctis populis."
      en: "I will bring them into my holy mount, and will make them joyful in my house of prayer: their holocausts, and their victims shall please me upon my altar: for my house shall be called the house of prayer, for all nations."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ait Dominus Deus, qui congregat dispersos Israel: Adhuc congregabo ad eum congregatos ejus."
      en: "The Lord God, who gathereth the scattered of Israel, saith: I will still gather unto him his congregation."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Omnes bestiae agri, venite ad devorandum, universae bestiae saltus."
      en: "All ye beasts of the field come to devour, all ye beasts of the forest."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Speculatores ejus caeci omnes, nescierunt universi: canes muti non valentes latrare, videntes vana, dormientes, et amantes somnia."
      en: "His watchmen are all blind, they are all ignorant: dumb dogs not able to bark, seeing vain things, sleeping and loving dreams."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et canes imprudentissimi, nescierunt saturitatem; ipsi pastores ignoraverunt intelligentiam; omnes in viam suam declinaverunt; unusquisque ad avaritiam suam, a summo usque ad novissimum."
      en: "And meet impudent dogs, they never had enough: the shepherds themselves knew no understanding: all have turned aside into their own way, every one after his own gain, from the first even to the last."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Venite, sumamus vinum, et impleamur ebrietate; et erit sicut hodie, sic et cras, et multo amplius."
      en: "Come, let us take wine, and be filled with drunkenness: and it shall be as today, so also tomorrow, and much more."
    status: { la: verified, en: verified }
