# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 42
verses:
  - n: 1
    text:
      la: "Et accesserunt omnes principes bellatorum, et Johanan filius Caree, et Jezonias filius Osaiae, et reliquum vulgus, a parvo usque ad magnum,"
      en: "Then all the captains of the warriors, and Johanan the son of Caree, and Jezonias the son of Osaias, and the rest of the people from the least to the greatest came near:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixeruntque ad Jeremiam prophetam: Cadat oratio nostra in conspectu tuo, et ora pro nobis ad Dominum Deum tuum, pro universis reliquiis istis, quia derelicti sumus pauci de pluribus, sicut oculi tui non intuentur:"
      en: "And they said to Jeremias the prophet: Let our supplication fall before thee: and pray thou for us to the Lord thy God for all this remnant, for we are left but a few of many, as thy eyes do behold us."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et annuntiet nobis Dominus Deus tuus viam per quam pergamus, et verbum quod faciamus."
      en: "And let the Lord thy God shew us the way by which we may walk, and the thing that we must do."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dixit autem ad eos Jeremias propheta: Audivi. Ecce ego oro ad Dominum Deum vestrum secundum verba vestra: omne verbum quodcumque responderit mihi indicabo vobis, nec celabo vos quidquam."
      en: "And Jeremias the prophet said to them: I have heard you: behold I will pray to the Lord your God according to your words: and whatsoever thing he shall answer me, I will declare it to you: and I will hide nothing from you."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et illi dixerunt ad Jeremiam: Sit Dominus inter nos testis veritatis et fidei, si non, juxta omne verbum in quo miserit te Dominus Deus tuus ad nos, sic faciemus:"
      en: "And they said to Jeremias: The Lord be witness between us of truth and faithfulness, if we do not according to every thing for which the Lord thy God shall send thee to us."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sive bonum est, sive malum, voci Domini Dei nostri, ad quem mittimus te, obediemus, ut bene sit nobis cum audierimus vocem Domini Dei nostri."
      en: "Whether it be good or evil, we will obey the voice of the Lord our God, to whom we send thee: that it may be well with us when we shall hearken to the voice of the Lord our God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cum autem completi essent decem dies, factum est verbum Domini ad Jeremiam,"
      en: "Now after ten days, the word of the Lord came to Jeremias."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "vocavitque Johanan filium Caree, et omnes principes bellatorum qui erant cum eo, et universum populum, a minimo usque ad magnum."
      en: "And he called Johanan the son of Caree, and all the captains of the fighting men that were with him, and all the people from the least to the greatest."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et dixit ad eos: Haec dicit Dominus Deus Israel, ad quem misistis me ut prosternerem preces vestras in conspectu ejus:"
      en: "And he said to them: Thus saith the Lord the God of Israel, to whom you sent me, to present your supplications before him:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Si quiescentes manseritis in terra hac, aedificabo vos, et non destruam: plantabo, et non evellam: jam enim placatus sum super malo quod feci vobis."
      en: "If you will be quiet and remain in this land, I will build you up, and not pull you down: I will plant you, and not pluck you up: for now I am appeased for the evil that I have done to you."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Nolite timere a facie regis Babylonis, quem vos pavidi formidatis: nolite metuere eum, dicit Dominus, quia vobiscum sum ego ut salvos vos faciam, et eruam de manu ejus:"
      en: "Fear not because of the king of Babylon, of whom you are greatly afraid: fear him not, saith the Lord: for I am with you, to save you, and to deliver you from his hand."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et dabo vobis misericordias, et miserebor vestri, et habitare vos faciam in terra vestra."
      en: "And I will shew mercies to you, and will take pity on you, and will cause you to dwell in your own land."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Si autem dixeritis vos: Non habitabimus in terra ista, nec audiemus vocem Domini Dei nostri,"
      en: "But if you say: We will not dwell in this land, neither will we hearken to the voice of the Lord our God,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "dicentes: Nequaquam, sed ad terram Aegypti pergemus, ubi non videbimus bellum, et clangorem tubae non audiemus, et famem non sustinebimus, et ibi habitabimus:"
      en: "Saying: No, but we will go into the land of Egypt: where we shall see no war, nor hear the sound of the trumpet, nor suffer hunger: and there we will dwell."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "propter hoc nunc audite verbum Domini, reliquiae Juda: Haec dicit Dominus exercituum, Deus Israel: Si posueritis faciem vestram ut ingrediamini Aegyptum, et intraveritis ut ibi habitetis,"
      en: "For this now hear the word of the Lord, ye remnant of Juda: Thus saith the Lord of hosts, the God of Israel: If you set your faces to go into Egypt, and enter in to dwell there:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "gladius quem vos formidatis ibi comprehendet vos in terra Aegypti: et fames, pro qua estis solliciti, adhaerebit vobis in Aegypto, et ibi moriemini."
      en: "The sword which you fear, shall overtake you there in the land of Egypt: and the famine, whereof you are afraid, shall cleave to you in Egypt, and there you shall die."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Omnesque viri qui posuerunt faciem suam ut ingrediantur Aegyptum, ut habitent ibi, morientur gladio, et fame, et peste: nullus de eis remanebit, nec effugiet a facie mali quod ego afferam super eos."
      en: "And all the men that set their faces to go into Egypt, to dwell there, shall die by the sword, and by famine, and by pestilence: none of them shall remain, nor escape from the face of the evil that I will bring upon them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quia haec dicit Dominus exercituum, Deus Israel: Sicut conflatus est furor meus et indignatio mea super habitatores Jerusalem, sic conflabitur indignatio mea super vos cum ingressi fueritis Aegyptum: et eritis in jusjurandum, et in stuporem, et in maledictum, et in opprobrium, et nequaquam ultra videbitis locum istum."
      en: "For thus saith the Lord of hosts, the God of Israel: As my anger and my indignation hath been kindled against the inhabitants of Jerusalem: so shall my indignation be kindled against you, when you shall enter into Egypt, and you shall be an execration, and an astonishment, and a curse, and a reproach: and you shall see this place no more."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Verbum Domini super vos, reliquiae Juda: Nolite intrare Aegyptum: scientes scietis, quia obtestatus sum vos hodie,"
      en: "This is the word of the Lord concerning you, O ye remnant of Juda: Go ye not into Egypt: know certainly that I have adjured you this day."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quia decepistis animas vestras. Vos enim misistis me ad Dominum Deum nostrum, dicentes: Ora pro nobis ad Dominum Deum nostrum, et juxta omnia quaecumque dixerit tibi Dominus Deus noster, sic annuntia nobis, et faciemus."
      en: "For you have deceived your own souls: for you sent me to the Lord our God, saying: Pray for us to the Lord our God, and according to all that the Lord our God shall say to thee, so declare unto us, and we will do it."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et annuntiavi vobis hodie, et non audistis vocem Domini Dei vestri super universis pro quibus misit me ad vos."
      en: "And now I have declared it to you this day, and you have not obeyed the voice of the Lord your God, with regard to all the things for which he hath sent me to you."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Nunc ergo scientes scietis quia gladio, et fame, et peste moriemini in loco ad quem voluistis intrare ut habitaretis ibi."
      en: "Now therefore know certainly that you shall die by the sword, and by famine, and by pestilence in the place to which you desire to go to dwell there."
    status: { la: verified, en: verified }
