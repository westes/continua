# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdc
chapter: 5
verses:
  - n: 1
    text:
      la: "cecineruntque Debbora et Barac filius Abinoem in die illo dicentes"
      en: "In that day Debbora and Barac son of Abinoem sung, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "qui sponte obtulistis de Israhel animas vestras ad periculum benedicite Domino"
      en: "O you of Israel, that have willingly offered your lives to danger, bless the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "audite reges percipite auribus principes ego sum ego sum quae Domino canam psallam Domino Deo Israhel"
      en: "Hear, O ye kings, give ear, ye princes: It is I, it is I, that will sing to the Lord, I will sing to the Lord the God of Israel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Domine cum exires de Seir et transires per regiones Edom terra mota est caelique ac nubes stillaverunt aquis"
      en: "O Lord, when thou wentest out of Seir, and passedst by the regions of Edom, the earth trembled, and the heavens dropped water."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "montes fluxerunt a facie Domini et Sinai a facie Domini Dei Israhel"
      en: "The mountains melted before the face of the Lord, and Sinai before the face of the Lord the God of Israel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in diebus Samgar filii Anath in diebus Iahel quieverunt semitae et qui ingrediebantur per eas ambulaverunt per calles devios"
      en: "In the days of Samgar the son of Anath, in the days of Jahel the paths rested: and they that went by them, walked through by-ways."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "cessaverunt fortes in Israhel et quieverunt donec surgeret Debbora surgeret mater in Israhel"
      en: "The valiant men ceased, and rested in Israel: until Debbora arose, a mother arose in Israel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "nova bella elegit Dominus et portas hostium ipse subvertit clypeus et hasta si apparuerint in quadraginta milibus Israhel"
      en: "The Lord chose new wars, and he himself overthrew the gates of the enemies: a shield and spear was not seen among forty thousand of Israel."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cor meum diligit principes Israhel qui propria voluntate obtulistis vos discrimini benedicite Domino"
      en: "My heart loveth the princes of Israel: O you that of your own good will offered yourselves to danger, bless the Lord."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui ascenditis super nitentes asinos et sedetis in iudicio et ambulatis in via loquimini"
      en: "Speak, you that ride upon fair asses, and you that sit in judgment, and walk in the way."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ubi conlisi sunt currus et hostium est suffocatus exercitus ibi narrentur iustitiae Domini et clementia in fortes Israhel tunc descendit populus Domini ad portas et obtinuit principatum"
      en: "Where the chariots were dashed together, and the army of the enemies was choked, there let the justices of the Lord be rehearsed, and his clemency towards the brave men of Israel: then the people of the Lord went down to the gates, and obtained the sovereignty."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "surge surge Debbora surge surge et loquere canticum surge Barac et adprehende captivos tuos fili Abinoem"
      en: "Arise, arise, O Debbora, arise, arise, and utter a canticle. Arise, Barac, and take hold of thy captives, O son of Abinoem."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "salvatae sunt reliquiae populi Dominus in fortibus dimicavit"
      en: "The remnants of the people are saved, the Lord hath fought among the valiant ones."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ex Ephraim delevit eos in Amalech et post eum ex Beniamin in populos tuos o Amalech de Machir principes descenderunt et de Zabulon qui exercitum ducerent ad bellandum"
      en: "Out of Ephraim he destroyed them into Amalec, and after him out of Benjamin into thy people, O Amalec: Out of Machir there came down princes, and out of Zabulon they that led the army to fight."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "duces Isachar fuere cum Debbora et Barac vestigia sunt secuti qui quasi in praeceps ac baratrum se discrimini dedit diviso contra se Ruben magnanimorum repperta contentio est"
      en: "The captains of Issachar were with Debbora, and followed the steps of Barac, who exposed himself to danger, as one going headlong, and into a pit. Ruben being divided against himself, there was found a strife of courageous men."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quare habitas inter duos terminos ut audias sibilos gregum diviso contra se Ruben magnanimorum repperta contentio est"
      en: "Why dwellest thou between two borders, that thou mayest hear the bleatings of the flocks? Ruben being divided against himself, there was found a strife of courageous men."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Galaad trans Iordanem quiescebat et Dan vacabat navibus Aser habitabat in litore maris et in portibus morabatur"
      en: "Galaad rested beyond the Jordan, and Dan applied himself to ships: Aser dwelt on the sea shore, and abode in the havens."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Zabulon vero et Nepthalim obtulerunt animas suas morti in regione Merome"
      en: "But Zabulon and Nephtali offered their lives to death in the region of Merome."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "venerunt reges et pugnaverunt pugnaverunt reges Chanaan in Thanach iuxta aquas Mageddo et tamen nihil tulere praedantes"
      en: "The kings came and fought, the kings of Chanaan fought in Thanach by the waters of Mageddo, and yet they took no spoils."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "de caelo dimicatum est contra eos stellae manentes in ordine et cursu suo adversum Sisaram pugnaverunt"
      en: "War from heaven was made against them, the stars remaining in their order and courses fought against Sisara."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "torrens Cison traxit cadavera eorum torrens Cadumim torrens Cison conculca anima mea robustos"
      en: "The torrent of Cison dragged their carcasses, the torrent of Cadumim, the torrent of Cisoii: tread thou, my soul, upon the strong ones."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ungulae equorum ceciderunt fugientibus impetu et per praeceps ruentibus fortissimis hostium"
      en: "The hoofs of the horses were broken whilst the stoutest of the enemies fled amain, and fell headlong down."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "maledicite terrae Meroz dixit angelus Domini maledicite habitatoribus eius quia non venerunt ad auxilium Domini in adiutorium fortissimorum eius"
      en: "Curse ye the land of Meroz, said the angel of the Lord: curse the inhabitants thereof, because they came not to the help of the Lord, to help his most valiant men."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "benedicta inter mulieres Iahel uxor Aber Cinei benedicatur in tabernaculo suo"
      en: "Blessed among women be Jahel the wife of Haber the Cinite, and blessed be she in her tent."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "aquam petenti lac dedit et in fiala principum obtulit butyrum"
      en: "He asked her water and she gave him milk, and offered him butter in a dish fit for princes."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "sinistram manum misit ad clavum et dexteram ad fabrorum malleos percussitque Sisaram quaerens in capite vulneri locum et tempus valide perforans"
      en: "She put her left hand to the nail, and her right hand to the workman's hammer, and she struck Sisara, seeking in his head a place for the wound, and strongly piercing through his temples."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "inter pedes eius ruit defecit et mortuus est ante pedes illius volvebatur et iacebat exanimis et miserabilis"
      en: "At her feet he fell: he fainted, and he died: he rolled before her feet, and he lay lifeless and wretched."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "per fenestram prospiciens ululabat mater eius et de cenaculo loquebatur cur moratur regredi currus eius quare tardaverunt pedes quadrigarum illius"
      en: "His mother looked out at a window, and howled: and she spoke from the dining room: Why is his chariot so long in coming back? Why are the feet of his horses so slow?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "una sapientior ceteris uxoribus eius haec socrui verba respondit"
      en: "One that was wiser than the rest of his wives, returned this answer to her mother in law:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "forsitan nunc dividit spolia et pulcherrima feminarum eligitur ei vestes diversorum colorum Sisarae traduntur in praedam et supellex varia ad ornanda colla congeritur"
      en: "Perhaps he is now dividing the spoils, and the fairest of the women is chosen out for him: garments of divers colours are given to Sisara for his prey, and furniture of different kinds is heaped together to adorn the necks."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "sic pereant omnes inimici tui Domine qui autem diligunt te sicut sol in ortu suo splendet ita rutilent"
      en: "So let all thy enemies perish, O Lord: but let them that love thee shine, as the sun shineth in his rising."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quievitque terra per quadraginta annos"
      en: "And the land rested for forty years."
    status: { la: verified, en: verified }
