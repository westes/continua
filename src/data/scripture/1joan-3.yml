# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1joan
chapter: 3
verses:
  - n: 1
    text:
      la: "videte qualem caritatem dedit nobis Pater ut filii Dei nominemur et sumus propter hoc mundus non novit nos quia non novit eum"
      en: "Behold what manner of charity the Father hath bestowed upon us, that we should be called, and should be the sons of God. Therefore the world knoweth not us, because it knew not him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "carissimi nunc filii Dei sumus et nondum apparuit quid erimus scimus quoniam cum apparuerit similes ei erimus quoniam videbimus eum sicuti est"
      en: "Dearly beloved, we are now the sons of God; and it hath not yet appeared what we shall be. We know, that, when he shall appear, we shall be like to him: because we shall see him as he is."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et omnis qui habet spem hanc in eo sanctificat se sicut et ille sanctus est"
      en: "And every one that hath this hope in him, sanctifieth himself, as he also is holy."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "omnis qui facit peccatum et iniquitatem facit et peccatum est iniquitas"
      en: "Whosoever committeth sin commmitteth also iniquity; and sin is iniquity."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et scitis quoniam ille apparuit ut peccata tolleret et peccatum in eo non est"
      en: "And you know that he appeared to take away our sins, and in him there is no sin."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "omnis qui in eo manet non peccat omnis qui peccat non vidit eum nec cognovit eum"
      en: "Whosoever abideth in him, sinneth not; and whosoever sinneth, hath not seen him, nor known him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "filioli nemo vos seducat qui facit iustitiam iustus est sicut et ille iustus est"
      en: "Little children, let no man deceive you. He that doth justice is just, even as he is just."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui facit peccatum ex diabolo est quoniam ab initio diabolus peccat in hoc apparuit Filius Dei ut dissolvat opera diaboli"
      en: "He that commmitteth sin is of the devil: for the devil sinneth from the beginning. For this purpose, the Son of God appeared, that he might destroy the works of the devil."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "omnis qui natus est ex Deo peccatum non facit quoniam semen ipsius in eo manet et non potest peccare quoniam ex Deo natus est"
      en: "Whosoever is born of God, commmitteth not sin: for his seed abideth in him, and he can not sin, because he is born of God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in hoc manifesti sunt filii Dei et filii diaboli omnis qui non est iustus non est de Deo et qui non diligit fratrem suum"
      en: "In this the children of God are manifest, and the children of the devil. Whosoever is not just, is not of God, nor he that loveth not his brother."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quoniam haec est adnuntiatio quam audistis ab initio ut diligamus alterutrum"
      en: "For this is the declaration, which you have heard from the beginning, that you should love one another."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "non sicut Cain ex maligno erat et occidit fratrem suum et propter quid occidit eum quoniam opera eius maligna erant fratris autem eius iusta"
      en: "Not as Cain, who was of the wicked one, and killed his brother. And wherefore did he kill him? Because his own works were wicked: and his brother's just."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "nolite mirari fratres si odit vos mundus"
      en: "Wonder not, brethren, if the world hate you."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "nos scimus quoniam translati sumus de morte in vitam quoniam diligimus fratres qui non diligit manet in morte"
      en: "We know that we have passed from death to life, because we love the brethren. He that loveth not, abideth in death."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "omnis qui odit fratrem suum homicida est et scitis quoniam omnis homicida non habet vitam aeternam in se manentem"
      en: "Whosoever hateth his brother is a murderer. And you know that no murderer hath eternal life abiding in himself."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "in hoc cognovimus caritatem quoniam ille pro nobis animam suam posuit et nos debemus pro fratribus animas ponere"
      en: "In this we have known the charity of God, because he hath laid down his life for us: and we ought to lay down our lives for the brethren."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qui habuerit substantiam mundi et viderit fratrem suum necesse habere et clauserit viscera sua ab eo quomodo caritas Dei manet in eo"
      en: "He that hath the substance of this world, and shall see his brother in need, and shall shut up his bowels from him: how doth the charity of God abide in him?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "filioli non diligamus verbo nec lingua sed opere et veritate"
      en: "My little children, let us not love in word, nor in tongue, but in deed, and in truth."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "in hoc cognoscimus quoniam ex veritate sumus et in conspectu eius suadeamus corda nostra"
      en: "In this we know that we are of the truth: and in his sight shall persuade our hearts."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quoniam si reprehenderit nos cor maior est Deus corde nostro et novit omnia"
      en: "For if our heart reprehend us, God is greater than our heart, and knoweth all things."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "carissimi si cor non reprehenderit nos fiduciam habemus ad Deum"
      en: "Dearly beloved, if our heart do not reprehend us, we have confidence towards God:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et quodcumque petierimus accipiemus ab eo quoniam mandata eius custodimus et ea quae sunt placita coram eo facimus"
      en: "And whatsoever we shall ask, we shall receive of him: because we keep his commandments, and do those things which are pleasing in his sight."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et hoc est mandatum eius ut credamus in nomine Filii eius Iesu Christi et diligamus alterutrum sicut dedit mandatum nobis"
      en: "And this is his commandment, that we should believe in the name of his Son Jesus Christ: and love one another, as he hath given commandment unto us."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et qui servat mandata eius in illo manet et ipse in eo et in hoc scimus quoniam manet in nobis de Spiritu quem nobis dedit"
      en: "And he that keepeth his commandments, abideth in him, and he in him. And in this we know that he abideth in us, by the Spirit which he hath given us."
    status: { la: verified, en: verified }
