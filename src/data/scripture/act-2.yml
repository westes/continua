# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: act
chapter: 2
verses:
  - n: 1
    text:
      la: "Et cum complerentur dies Pentecostes, erant omnes pariter in eodem loco:"
      en: "And when the days of the Pentecost were accomplished, they were all together in one place:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et factus est repente de caelo sonus, tamquam advenientis spiritus vehementis, et replevit totam domum ubi erant sedentes."
      en: "And suddenly there came a sound from heaven, as of a mighty wind coming, and it filled the whole house where they were sitting."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et apparuerunt illis dispertitae linguae tamquam ignis, seditque supra singulos eorum:"
      en: "And there appeared to them parted tongues as it were of fire, and it sat upon every one of them:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et repleti sunt omnes Spiritu Sancto, et coeperunt loqui variis linguis, prout Spiritus Sanctus dabat eloqui illis."
      en: "And they were all filled with the Holy Ghost, and they began to speak with divers tongues, according as the Holy Ghost gave them to speak."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Erant autem in Jerusalem habitantes Judaei, viri religiosi ex omni natione, quae sub caelo est."
      en: "Now there were dwelling at Jerusalem, Jews, devout men, out of every nation under heaven."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Facta autem hac voce, convenit multitudo, et mente confusa est, quoniam audiebat unusquisque lingua sua illos loquentes."
      en: "And when this was noised abroad, the multitude came together, and were confounded in mind, because that every man heard them speak in his own tongue."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Stupebant autem omnes, et mirabantur, dicentes: Nonne ecce omnes isti, qui loquuntur, Galilaei sunt,"
      en: "And they were all amazed, and wondered, saying: Behold, are not all these, that speak, Galileans?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et quomodo nos audivimus unusquisque linguam nostram, in qua nati sumus?"
      en: "And how have we heard, every man our own tongue wherein we were born?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Parthi, et Medi, et Aelamitae, et qui habitant Mespotamiam, Judaeam, et Cappadociam, Pontum, et Asiam,"
      en: "Parthians, and Medes, and Elamites, and inhabitants of Mesopotamia, Judea, and Cappadocia, Pontus and Asia,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Phrygiam, et Pamphyliam, Aegyptum, et partes Libyae, quae est circa Cyrenen, et advenae Romani,"
      en: "Phrygia, and Pamphylia, Egypt, and the parts of Libya about Cyrene, and strangers of Rome,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Judaei quoque, et Proselyti, Cretes, et Arabes: audivimus eos loquentes nostris linguis magnalia Dei."
      en: "Jews also, and proselytes, Cretes, and Arabians: we have heard them speak in our own tongues the wonderful works of God."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Stupebant autem omnes, et mirabantur ad invicem, dicentes: Quidnam vult hoc esse?"
      en: "And they were all astonished, and wondered, saying one to another: What meaneth this?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Alii autem irridentes dicebant: Quia musto pleni sunt isti."
      en: "But others mocking, said: These men are full of new wine."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Stans autem Petrus cum undecim, levavit vocem suam, et locutus est eis: Viri Judaei, et qui habitatis Jerusalem universi, hoc vobis notum sit, et auribus percipite verba mea."
      en: "But Peter standing up with the eleven, lifted up his voice, and spoke to them: Ye men of Judea, and all you that dwell in Jerusalem, be this known to you, and with your ears receive my words."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Non enim, sicut vos aestimatis, hi ebrii sunt, cum sit hora diei tertia:"
      en: "For these are not drunk, as you suppose, seeing it is but the third hour of the day:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sed hoc est quod dictum est per prophetam Joel:"
      en: "But this is that which was spoken of by the prophet Joel:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et erit in novissimis diebus, dicit Dominus, effundam de Spiritu meo super omnem carnem: et prophetabunt filii vestri, et filiae vestrae, et juvenes vestri visiones videbunt, et seniores vestri somnia somniabunt."
      en: "And it shall come to pass, in the last days, (saith the Lord,) I will pour out of my Spirit upon all flesh: and your sons and your daughters shall prophesy, and your young men shall see visions, and your old men shall dream dreams."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et quidem super servos meos, et super ancillas meas, in diebus illis effundam de Spiritu meo, et prophetabunt:"
      en: "And upon my servants indeed, and upon my handmaids will I pour out in those days of my spirit, and they shall prophesy."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et dabo prodigia in caelo sursum, et signa in terra deorsum, sanguinem, et ignem, et vaporem fumi:"
      en: "And I will shew wonders in the heaven above, and signs on the earth beneath: blood and fire, and vapour of smoke."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sol convertetur in tenebras, et luna in sanguinem, antequam veniat dies Domini magnus et manifestus."
      en: "The sun shall be turned into darkness, and the moon into blood, before the great and manifest day of the Lord come."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et erit: omnis quicumque invocaverit nomen Domini, salvus erit."
      en: "And it shall come to pass, that whosoever shall call upon the name of the Lord, shall be saved."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Viri Israelitae, audite verba haec: Jesum Nazarenum, virum approbatum a Deo in vobis, virtutibus, et prodigiis, et signis, quae fecit Deus per illum in medio vestri, sicut et vos scitis:"
      en: "Ye men of Israel, hear these words: Jesus of Nazareth, a man approved of God among you, by miracles, and wonders, and signs, which God did by him, in the midst of you, as you also know:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "hunc, definito consilio, et praescientia Dei traditum, per manus iniquorum affligentes interemistis:"
      en: "This same being delivered up, by the determinate counsel and foreknowledge of God, you by the hands of wicked men have crucified and slain."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "quem Deus suscitavit, solutis doloribus inferni, juxta quod impossibile erat teneri illum ab eo."
      en: "Whom God hath raised up, having loosed the sorrows of hell, as it was impossible that he should be holden by it."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "David enim dicit in eum: Providebam Dominum in conspectu meo semper: quoniam a dextris est mihi, ne commovear:"
      en: "For David saith concerning him: I foresaw the Lord before my face: because he is at my right hand, that I may not be moved."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "propter hoc laetatum est cor meum, et exsultavit lingua mea, insuper et caro mea requiescet in spe:"
      en: "For this my heart hath been glad, and my tongue hath rejoiced: moreover my flesh also shall rest in hope."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "quoniam non derelinques animam meam in inferno, nec dabis sanctum tuum videre corruptionem."
      en: "Because thou wilt not leave my soul in hell, nor suffer thy Holy One to see corruption."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Notas mihi fecisti vias vitae: et replebis me jucunditate cum facie tua."
      en: "Thou hast made known to me the ways of life: thou shalt make me full of joy with thy countenance."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Viri fratres, liceat audenter dicere ad vos de patriarcha David, quoniam defunctus est, et sepultus: et sepulchrum ejus est apud nos usque in hodiernum diem."
      en: "Ye men, brethren, let me freely speak to you of the patriarch David; that he died, and was buried; and his sepulchre is with us to this present day."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Propheta igitur cum esset, et sciret quia jurejurando jurasset illi Deus de fructu lumbi ejus sedere super sedem ejus:"
      en: "Whereas therefore he was a prophet, and knew that God hath sworn to him with an oath, that of the fruit of his loins one should sit upon his throne."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "providens locutus est de resurrectione Christi, quia neque derelictus est in inferno, neque caro ejus vidit corruptionem."
      en: "Foreseeing this, he spoke of the resurrection of Christ. For neither was he left in hell, neither did his flesh see corruption."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Hunc Jesum resuscitavit Deus, cujus omnes nos testes sumus."
      en: "This Jesus hath God raised again, whereof all we are witnesses."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Dextera igitur Dei exaltatus, et promissione Spiritus Sancti accepta a Patre, effudit hunc, quem vos videtis, et auditis."
      en: "Being exalted therefore by the right hand of God, and having received of the Father the promise of the Holy Ghost, he hath poured forth this which you see and hear."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Non enim David ascendit in caelum: dixit autem ipse: Dixit Dominus Domino meo: Sede a dextris meis"
      en: "For David ascended not into heaven; but he himself said: The Lord said to my Lord, sit thou on my right hand,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "donec ponam inimicos tuos scabellum pedum tuorum."
      en: "Until I make thy enemies thy footstool."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Certissime sciat ergo omnis domus Israel, quia et Dominum eum, et Christum fecit Deus, hunc Jesum, quem vos crucifixistis."
      en: "Therefore let all the house of Israel know most certainly, that God hath made both Lord and Christ, this same Jesus, whom you have crucified."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "His autem auditis, compuncti sunt corde, et dixerunt ad Petrum, et ad reliquos Apostolos: Quid faciemus, viri fratres?"
      en: "Now when they had heard these things, they had compunction in their heart, and said to Peter, and to the rest of the apostles: What shall we do, men and brethren?"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Petrus vero ad illos: Poenitentiam, inquit, agite, et baptizetur unusquisque vestrum in nomine Jesu Christi in remissionem peccatorum vestrorum: et accipietis donum Spiritus Sancti."
      en: "But Peter said to them: Do penance, and be baptized every one of you in the name of Jesus Christ, for the remission of your sins: and you shall receive the gift of the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Vobis enim est repromissio, et filiis vestris, et omnibus qui longe sunt, quoscumque advocaverit Dominus Deus noster."
      en: "For the promise is to you, and to your children, and to all that are far off, whomsoever the Lord our God shall call."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Aliis etiam verbis plurimis testificatus est, et exhortabatur eos, dicens: Salvamini a generatione ista prava."
      en: "And with very many other words did he testify and exhort them, saying: Save yourselves from this perverse generation."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Qui ergo receperunt sermonem ejus, baptizati sunt: et appositae sunt in die illa animae circiter tria millia."
      en: "They therefore that received his word, were baptized; and there were added in that day about three thousand souls."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Erant autem perseverantes in doctrina Apostolorum, et communicatione fractionis panis, et orationibus."
      en: "And they were persevering in the doctrine of the apostles, and in the communication of the breaking of bread, and in prayers."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Fiebat autem omni animae timor: multa quoque prodigia et signa per Apostolos in Jerusalem fiebant, et metus erat magnus in universis."
      en: "And fear came upon every soul: many wonders also and signs were done by the apostles in Jerusalem, and there was great fear in all."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Omnes etiam qui credebant, erant pariter, et habebant omnia communia."
      en: "And all they that believed, were together, and had all things common."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Possessiones et substantias vendebant, et dividebant illa omnibus, prout cuique opus erat."
      en: "Their possessions and goods they sold, and divided them to all, according as every one had need."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Quotidie quoque perdurantes unanimiter in templo, et frangentes circa domos panem, sumebant cibum cum exsultatione, et simplicitate cordis,"
      en: "And continuing daily with one accord in the temple, and breaking bread from house to house, they took their meat with gladness and simplicity of heart;"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "collaudantes Deum et habentes gratiam ad omnem plebem. Dominus autem augebat qui salvi fierent quotidie in idipsum."
      en: "Praising God, and having favour with all the people. And the Lord increased daily together such as should be saved."
    status: { la: verified, en: verified }
