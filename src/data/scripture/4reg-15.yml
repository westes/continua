# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 4reg
chapter: 15
verses:
  - n: 1
    text:
      la: "anno vicesimo septimo Hieroboam regis Israhel regnavit Azarias filius Amasiae regis Iudae"
      en: "In the seven and twentieth year of Jeroboam king of Israel reigned Azarias son of Amasias, king of Juda."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sedecim annorum erat cum regnare coepisset et quinquaginta duobus annis regnavit in Hierusalem nomen matris eius Iecelia de Hierusalem"
      en: "He was sixteen years old, when he began to reign, and he reigned two and fifty years in Jerusalem: the name of his mother was Jechelia of Jerusalem."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "fecitque quod erat placitum coram Domino iuxta omnia quae fecit Amasias pater eius"
      en: "And he did that which was pleasing before the Lord, according to all that his father Amasias had done."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "verumtamen excelsa non est demolitus adhuc populus sacrificabat et adolebat incensum in excelsis"
      en: "But the high places he did not destroy: for the people sacrificed and burnt incense in the high places."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "percussit autem Dominus regem et fuit leprosus usque in diem mortis suae et habitabat in domo libera seorsum Ioatham vero filius regis gubernabat palatium et iudicabat populum terrae"
      en: "And the Lord struck the king, so that he was a leper unto the day of his death, and he dwelt in a free house apart: but Joatham the king's soil governed the palace, and judged the people of the land."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "reliqua autem sermonum Azariae et universa quae fecit nonne haec scripta sunt in libro verborum dierum regum Iuda"
      en: "And the rest of the acts of Azarias, and all that he did, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et dormivit Azarias cum patribus suis sepelieruntque eum cum maioribus suis in civitate David et regnavit Ioatham filius eius pro eo"
      en: "And Azarias slept with his fathers: and they buried him with his ancestors in the city of David, and Joatham his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "anno tricesimo octavo Azariae regis Iudae regnavit Zaccharias filius Hieroboam super Israhel in Samaria sex mensibus"
      en: "In the eight and thirtieth year of Azarias king of Juda, reigned Zacharias son of Jeroboam over Israel in Samaria six months:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et fecit quod malum est coram Domino sicut fecerant patres eius non recessit a peccatis Hieroboam filii Nabath qui peccare fecit Israhel"
      en: "And he did that which is evil before the Lord, as his fathers had done: he departed not from the sins of Jeroboam the son of Nabat who made Israel to sin."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "coniuravit autem contra eum Sellum filius Iabes percussitque eum palam et interfecit regnavitque pro eo"
      en: "And Sellum the son of Jabes conspired against him: and struck him publicly and killed him, and reigned in his place."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "reliqua autem verborum Zacchariae nonne haec scripta sunt in libro sermonum dierum regum Israhel"
      en: "Now the rest of the acts of Zacharias, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ipse est sermo Domini quem locutus est ad Hieu dicens filii usque ad quartam generationem sedebunt de te super thronum Israhel factumque est ita"
      en: "This was the word of the Lord, which he spoke to Jehu, saying: Thy children to the fourth generation shall sit upon the throne of Israel. And so it came to pass."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sellum filius Iabes regnavit tricesimo nono anno Azariae regis Iudae regnavit autem uno mense in Samaria"
      en: "Sellum the son of Jabes began to reign in the nine and thirtieth year of Azarias king of Juda: and reigned one month in Samaria."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et ascendit Manahem filius Gaddi de Thersa venitque Samariam et percussit Sellum filium Iabes in Samaria et interfecit eum regnavitque pro eo"
      en: "And Manahem the son of Gadi went up from Thersa: and he came into Samaria, and struck Sellum the son of Jabes in Samaria, and slew him, and reigned in his stead."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "reliqua autem verborum Sellum et coniuratio eius per quam tetendit insidias nonne haec scripta sunt in libro sermonum dierum regum Israhel"
      en: "And the rest of the acts of Sellum, and his conspiracy, which he made, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tunc percussit Manahem Thapsam et omnes qui erant in ea et terminos eius de Thersa noluerant enim aperire ei et interfecit omnes praegnantes eius et scidit eas"
      en: "Then Manahem destroyed Thapsa and all that were in it and the borders thereof from Thersa, because they would not open to him: and he slew all the women thereof that were with child, and ripped them up."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "anno tricesimo nono Azariae regis Iuda regnavit Manahem filius Gaddi super Israhel decem annis in Samaria"
      en: "In the nine and thirtieth year of Azarias king of Juda, reigned Manahem son of Gadi over Israel ten years in Samaria."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "fecitque quod erat malum coram Domino non recessit a peccatis Hieroboam filii Nabath qui peccare fecit Israhel cunctis diebus eius"
      en: "And he did that which was evil before the Lord: he departed not from the sins of Jeroboam the son of Nabat, who made Israel to sin all his days."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "veniebat Phul rex Assyriorum in terram et dabat Manahem Phul mille talenta argenti ut esset ei in auxilio et firmaret regnum eius"
      en: "And Phul king of the Assyrians came into the land, and Manahem gave Phul a thousand talents of silver, to aid him and to establish him in the kingdom."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "indixitque Manahem argentum super Israhel cunctis potentibus et divitibus ut daret regi Assyriorum quinquaginta siclos argenti per singulos reversusque est rex Assyriorum et non est moratus in terra"
      en: "And Manahem laid a tax upon Israel, on all that were mighty and rich, to give the king of the Assyrians, each man fifty sides of silver: so the king of the Assyrians turned back, and did not stay in the land."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "reliqua autem sermonum Manahem et universa quae fecit nonne haec scripta sunt in libro sermonum dierum regum Israhel"
      en: "And the rest of the acts of Manahem, and all that he did, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et dormivit Manahem cum patribus suis regnavitque Phaceia filius eius pro eo"
      en: "And Manahem slept with his fathers: and Phaceia his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "anno quinquagesimo Azariae regis Iudae regnavit Phaceia filius Manahem super Israhel in Samaria biennio"
      en: "In the fiftieth year of Azarias king of Juda reigned Phaceia the son of Manahem over Israel in Samaria two years."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et fecit quod erat malum coram Domino non recessit a peccatis Hieroboam filii Nabath qui peccare fecit Israhel"
      en: "And he did that which was evil before the Lord: he departed not from the sins of Jeroboam the son of Nabat, who made Israel to sin."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "coniuravit autem adversum eum Phacee filius Romeliae dux eius et percussit eum in Samaria in turre domus regiae iuxta Argob et iuxta Ari et cum eo quinquaginta viros de filiis Galaaditarum et interfecit eum regnavitque pro eo"
      en: "And Phacee the son of Romelia, his captain conspired against him, and smote him in Samaria, in the tower of the king's house, near Argob, and near Arie, and with him fifty men of the sons of the Galaadites, and he slew him and reigned in his stead."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "reliqua autem sermonum Phaceia et universa quae fecit nonne haec scripta sunt in libro sermonum dierum regum Israhel"
      en: "And the rest of the acts of Phaceia, and all that he did, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "anno quinquagesimo secundo Azariae regis Iudae regnavit Phacee filius Romeliae super Israhel in Samaria viginti annis"
      en: "In the two and fiftieth year of Azarias king of Juda reigned Phacee the son of Romelia over Israel in Samaria twenty years."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et fecit quod malum erat coram Domino non recessit a peccatis Hieroboam filii Nabath qui peccare fecit Israhel"
      en: "And he did that which was evil before the Lord: he departed not from the sins of Jeroboam the son of Nabat, who made Israel to sin."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "in diebus Phacee regis Israhel venit Theglathfalassar rex Assur et cepit Aiom et Abel domum Maacha et Ianoe et Cedes et Asor et Galaad et Galileam universam terram Nepthalim et transtulit eos in Assyrios"
      en: "In the days of Phacee king of Israel came Theglathphalasar king of Assyria, and took Aion, and Abel Domum Maacha and Janoe, and Cedes, and Asor, and Galaad, and Galilee, and all the land of Nephtali: and carried them captives into Assyria."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "coniuravit autem et tetendit insidias Osee filius Hela contra Phacee filium Romeliae et percussit eum et interfecit regnavitque pro eo vicesimo anno Ioatham filii Oziae"
      en: "Now Osee son of Ela conspired, and formed a plot against Phacee, the son of Romelia, and struck him, and slew him: and reigned in his stead in the twentieth year of Joatham the son of Ozias."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "reliqua autem sermonum Phacee et universa quae fecit nonne haec scripta sunt in libro sermonum dierum regum Israhel"
      en: "But the rest of the acts of Phaces, and all that he did, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "anno secundo Phacee filii Romeliae regis Israhel regnavit Ioatham filius Oziae regis Iuda"
      en: "In the second year of Phacee the son of Romelia king of Israel reigned Joatham son of Ozias king of Juda."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "viginti quinque annorum erat cum regnare coepisset et sedecim annis regnavit in Hierusalem nomen matris eius Hierusa filia Sadoc"
      en: "He was five and twenty years old when he began to reign, and he reigned sixteen years in Jerusalem: the name of his mother was Jerusa, the daughter of Sadoc."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "fecitque quod erat placitum coram Domino iuxta omnia quae fecerat Ozias pater suus operatus est"
      en: "And he did that which was right before the Lord: according to all that his father Ozias had done, so did he."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "verumtamen excelsa non abstulit adhuc populus immolabat et adolebat incensum in excelsis ipse aedificavit portam domus Domini sublimissimam"
      en: "But the high places he took not away: the people still sacrificed and burnt incense in the high places: he built the highest gate of the house of the Lord."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "reliqua autem sermonum Ioatham et universa quae fecit nonne haec scripta sunt in libro verborum dierum regum Iuda"
      en: "But the rest of the acts of Joatham, end all that he did, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "in diebus illis coepit Dominus mittere in Iudam Rasin regem Syriae et Phacee filium Romeliae"
      en: "In those days the Lord began to send into Juda Basin king of Syria, and Phacee the son of Romelia."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et dormivit Ioatham cum patribus suis sepultusque est cum eis in civitate David patris sui et regnavit Ahaz filius eius pro eo"
      en: "And Joatham slept with his fathers, and was buried with them in the city of David his father, and Achaz his son reigned in his stead."
    status: { la: verified, en: verified }
