# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 15
verses:
  - n: 1
    text:
      la: "Anno vigesimo septimo Jeroboam regis Israel, regnavit Azarias filius Amasiae regis Juda."
      en: "In the seven and twentieth year of Jeroboam king of Israel reigned Azarias son of Amasias, king of Juda."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Sedecim annorum erat cum regnare coepisset, et quinquaginta duobus annis regnavit in Jerusalem: nomen matris ejus Jechelia de Jerusalem."
      en: "He was sixteen years old, when he began to reign, and he reigned two and fifty years in Jerusalem: the name of his mother was Jechelia of Jerusalem."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Fecitque quod erat placitum coram Domino, juxta omnia quae fecit Amasias pater ejus."
      en: "And he did that which was pleasing before the Lord, according to all that his father Amasias had done."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Verumtamen excelsa non est demolitus: adhuc populus sacrificabat, et adolebat incensum in excelsis."
      en: "But the high places he did not destroy: for the people sacrificed and burnt incense in the high places."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Percussit autem Dominus regem, et fuit leprosus usque in diem mortis suae, et habitabat in domo libera seorsum: Joatham vero filius regis gubernabat palatium, et judicabit populum terrae."
      en: "And the Lord struck the king, so that he was a leper unto the day of his death, and he dwelt in a free house apart: but Joatham the king's soil governed the palace, and judged the people of the land."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Reliqua autem sermonum Azariae, et universa quae fecit, nonne haec scripta sunt in libro verborum dierum regum Juda?"
      en: "And the rest of the acts of Azarias, and all that he did, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et dormivit Azarias cum patribus suis: sepelieruntque eum cum majoribus suis in civitate David, et regnavit Joatham filius ejus pro eo."
      en: "And Azarias slept with his fathers: and they buried him with his ancestors in the city of David, and Joatham his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Anno trigesimo octavo Azariae regis Juda, regnavit Zacharias filius Jeroboam super Israel in Samaria sex mensibus:"
      en: "In the eight and thirtieth year of Azarias king of Juda, reigned Zacharias son of Jeroboam over Israel in Samaria six months:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et fecit quod malum est coram Domino, sicut fecerant patres ejus: non recessit a peccatis Jeroboam filii Nabat, qui peccare fecit Israel."
      en: "And he did that which is evil before the Lord, as his fathers had done: he departed not from the sins of Jeroboam the son of Nabat who made Israel to sin."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Conjuravit autem contra eum Sellum filius Jabes: percussitque eum palam, et interfecit, regnavitque pro eo."
      en: "And Sellum the son of Jabes conspired against him: and struck him publicly and killed him, and reigned in his place."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Reliqua autem verborum Zachariae, nonne haec scripta sunt in libro sermonum dierum regum Israel?"
      en: "Now the rest of the acts of Zacharias, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Iste est sermo Domini, quem locutus est ad Jehu, dicens: Filii tui usque ad quartam generationem sedebunt super thronum Israel. Factumque est ita."
      en: "This was the word of the Lord, which he spoke to Jehu, saying: Thy children to the fourth generation shall sit upon the throne of Israel. And so it came to pass."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sellum filius Jabes regnavit trigesimo novo anno Azariae regis Juda: regnavit autem uno mense in Samaria."
      en: "Sellum the son of Jabes began to reign in the nine and thirtieth year of Azarias king of Juda: and reigned one month in Samaria."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et ascendit Manahem filius Gadi de Thersa, venitque in Samariam, et percussit Sellum filium Jabes in Samaria, et interfecit eum, regnavitque pro eo."
      en: "And Manahem the son of Gadi went up from Thersa: and he came into Samaria, and struck Sellum the son of Jabes in Samaria, and slew him, and reigned in his stead."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Reliqua autem verborum Sellum, et conjuratio ejus, per quam tetendit insidias, nonne haec scripta sunt in libro sermonum dierum regum Israel?"
      en: "And the rest of the acts of Sellum, and his conspiracy, which he made, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Tunc percussit Manahem Thapsam, et omnes qui erant in ea, et terminos ejus de Thersa: noluerant enim aperire ei: et interfecit omnes praegnantes ejus, et scidit eas."
      en: "Then Manahem destroyed Thapsa and all that were in it and the borders thereof from Thersa, because they would not open to him: and he slew all the women thereof that were with child, and ripped them up."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Anno trigesimo nono Azariae regis Juda, regnavit Manahem filius Gadi super Israel decem annis in Samaria."
      en: "In the nine and thirtieth year of Azarias king of Juda, reigned Manahem son of Gadi over Israel ten years in Samaria."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Fecitque quod erat malum coram Domino: non recessit a peccatis Jeroboam filii Nabat, qui peccare fecit Israel cunctis diebus ejus."
      en: "And he did that which was evil before the Lord: he departed not from the sins of Jeroboam the son of Nabat, who made Israel to sin all his days."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Veniebat Phul rex Assyriorum in terram, et dabat Manahem Phul mille talenta argenti, ut esset ei in auxilium, et firmaret regnum ejus."
      en: "And Phul king of the Assyrians came into the land, and Manahem gave Phul a thousand talents of silver, to aid him and to establish him in the kingdom."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Indixitque Manahem argentum super Israel cunctis potentibus et divitibus, ut daret regi Assyriorum quinquaginta siclos argenti per singulos: reversusque est rex Assyriorum, et non est moratus in terra."
      en: "And Manahem laid a tax upon Israel, on all that were mighty and rich, to give the king of the Assyrians, each man fifty sicles of silver: so the king of the Assyrians turned back, and did not stay in the land."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Reliqua autem sermonum Manahem, et universa quae fecit, nonne haec scripta sunt in libro sermonum dierum regum Israel?"
      en: "And the rest of the acts of Manahem, and all that he did, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et dormivit Manahem cum patribus suis: regnavitque Phaceia filius ejus pro eo."
      en: "And Manahem slept with his fathers: and Phaceia his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Anno quinquagesimo Azariae regis Juda, regnavit Phaceia filius Manahem super Israel in Samaria biennio:"
      en: "In the fiftieth year of Azarias king of Juda reigned Phaceia the son of Manahem over Israel in Samaria two years."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et fecit quod erat malum coram Domino: non recessit a peccatis Jeroboam filii Nabat, qui peccare fecit Israel."
      en: "And he did that which was evil before the Lord: he departed not from the sins of Jeroboam the son of Nabat, who made Israel to sin."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Conjuravit autem adversus eum Phacee filius Romeliae, dux ejus, et percussit eum in Samaria in turre domus regiae juxta Argob, et juxta Arie, et cum eo quinquaginta viros de filiis Galaaditarum, et interfecit eum, regnavitque pro eo."
      en: "And Phacee the son of Romelia, his captain conspired against him, and smote him in Samaria, in the tower of the king's house, near Argob, and near Arie, and with him fifty men of the sons of the Galaadites, and he slew him and reigned in his stead."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Reliqua autem sermonum Phaceia, et universa quae fecit, nonne haec scripta sunt in libro sermonum dierum regum Israel?"
      en: "And the rest of the acts of Phaceia, and all that he did, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Anno quinquagesimo secundo Azariae regis Juda, regnavit Phacee filius Romeliae super Israel in Samaria viginti annis."
      en: "In the two and fiftieth year of Azarias king of Juda reigned Phacee the son of Romelia over Israel in Samaria twenty years."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et fecit quod erat malum coram Domino: non recessit a peccatis Jeroboam filii Nabat, qui peccare fecit Israel."
      en: "And he did that which was evil before the Lord: he departed not from the sins of Jeroboam the son of Nabat, who made Israel to sin."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "In diebus Phacee regis Israel venit Theglathphalasar rex Assur, et cepit Ajon, et Abel-Domum, Maacha et Janoe, et Cedes, et Asor, et Galaad, et Galilaeam, et universam terram Nephthali: et transtulit eos in Assyrios."
      en: "In the days of Phacee king of Israel came Theglathphalasar king of Assyria, and took Aion, and Abel Domum Maacha and Janoe, and Cedes, and Asor, and Galaad, and Galilee, and all the land of Nephtali: and carried them captives into Assyria."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Conjuravit autem, et tetendit insidias Osee filius Ela contra Phacee filium Romeliae, et percussit eum, et interfecit: regnavitque pro eo vigesimo anno Joatham filii Oziae."
      en: "Now Osee son of Ela conspired, and formed a plot against Phacee, the son of Romelia, and struck him, and slew him: and reigned in his stead in the twentieth year of Joatham the son of Ozias."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Reliqua autem sermonum Phacee, et universa quae fecit, nonne haec scripta sunt in libro sermonum dierum regum Israel?"
      en: "But the rest of the acts of Phaces, and all that he did, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Anno secundo Phacee, filii Romeliae regis Israel, regnavit Joatham filius Oziae regis Juda."
      en: "In the second year of Phacee the son of Romelia king of Israel reigned Joatham son of Ozias king of Juda."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Viginti quinque annorum erat cum regnare coepisset, et sedecim annis regnavit in Jerusalem: nomen matris ejus Jerusa, filia Sadoc."
      en: "He was five and twenty years old when he began to reign, and he reigned sixteen years in Jerusalem: the name of his mother was Jerusa, the daughter of Sadoc."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Fecitque quod erat placitum coram Domino: juxta omnia quae fecerat Ozias pater suus operatus est."
      en: "And he did that which was right before the Lord: according to all that his father Ozias had done, so did he."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Verumtamen excelsa non abstulit: adhuc populus immolabat, et adolebat incensum in excelsis: ipse aedificavit portam domus Domini sublimissimam."
      en: "But the high places he took not away: the people still sacrificed and burnt incense in the high places: he built the highest gate of the house of the Lord."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Reliqua autem sermonum Joatham, et universa quae fecit, nonne haec scripta sunt in libro verborum dierum regum Juda?"
      en: "But the rest of the acts of Joatham, and all that he did, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "In diebus illis coepit Dominus mittere in Judam Rasin regem Syriae, et Phacee filium Romeliae."
      en: "In those days the Lord began to send into Juda Rasin king of Syria, and Phacee the son of Romelia."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et dormivit Joatham cum patribus suis, sepultusque est cum eis in civitate David patris sui, et regnavit Achaz filius ejus pro eo."
      en: "And Joatham slept with his fathers, and was buried with them in the city of David his father, and Achaz his son reigned in his stead."
    status: { la: verified, en: verified }
