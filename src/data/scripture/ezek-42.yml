book: ezek
chapter: 42
verses:
  - n: 1
    text:
      la: "et eduxit me in atrium exterius per viam ducentem ad aquilonem et eduxit me in gazofilacium quod erat contra separatum aedificium et contra aedem vergentem ad aquilonem"
      en: "And he brought me forth into the outward court by the way that leadeth to the north, and he brought me into the chamber that was over against the separate building, and over against the house toward the north."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in facie longitudinis centum cubitos ostii aquilonis et latitudinis quinquaginta cubitos"
      en: "In the face of the north door was the length of a hundred cubits, and the breadth of fifty cubits."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "contra viginti cubitos atrii interioris et contra pavimentum stratum lapide atrii exterioris ubi erat porticus iuncta porticui triplici"
      en: "Over against the twenty cubits of the inner court, and over against the pavement of the outward court that was paved with stone, where there was a gallery joined to a triple gallery."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ante gazofilacia deambulatio decem cubitorum latitudinis ad interiora respiciens viae cubiti unius et ostia earum ad aquilonem"
      en: "And before the chambers was a walk ten cubits broad, looking to the inner parts of a way of one cubit. And their doors were toward the north."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ubi erant gazofilacia in superioribus humiliora quia subportabant porticus quae ex illis eminebant de inferioribus et de mediis aedificii"
      en: "Where were the store chambers lower above: because they bore up the galleries, which appeared above out of them from the lower parts, and from the midst of the building."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "tristega enim erant et non habebant columnas sicut erant columnae atriorum propterea eminebant de inferioribus et de mediis a terra"
      en: "For they were of three stories, and had not pillars, as the pillars of the courts: therefore did they appear above out of the lower places, and out of the middle places, fifty cubits from the ground."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et peribolus exterior secundum gazofilacia quae erant in via atrii exterioris ante gazofilacia longitudo eius quinquaginta cubitorum"
      en: "And the outward wall that went about by the chambers, which were towards the outward court on the forepart of the chambers, was fifty cubits long."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quia longitudo erat gazofilaciorum atrii exterioris quinquaginta cubitorum et longitudo ante faciem templi centum cubitorum"
      en: "For the length of the chambers of the outward court was fifty cubits: and the length before the face of the temple, a hundred cubits."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et erat subter gazofilacia haec introitus ab oriente ingredientium in ea de atrio exteriori"
      en: "And there was under these chambers, an entrance from the east, for them that went into them out of the outward court."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in latitudine periboli atrii quod erat contra viam orientalem in facie aedificii separati et erant ante aedificium gazofilacia"
      en: "In the breadth of the outward wall of the court that was toward the east, over against the separate building, and there were chambers before the building."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et via ante faciem eorum iuxta similitudinem gazofilaciorum quae erant in via aquilonis secundum longitudinem eorum sic et latitudo eorum et omnis introitus eorum et similitudines et ostia eorum"
      en: "And the way before them was like the chambers which were toward the north: they wore as long as they, and as broad as they: and all the going is to them, and their fashions, and their doors were alike."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "secundum ostia gazofilaciorum quae erant in via respiciente ad notum ostium in capite viae quae via erat ante vestibulum separatum per viam orientalem ingredientibus"
      en: "According to the doors of the chambers that were towards the south : there was a door in the head of the way, which way was before the porch, separated towards the east as one entereth in."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et dixit ad me gazofilacia aquilonis et gazofilacia austri quae sunt ante aedificium separatum haec sunt gazofilacia sancta in quibus vescuntur sacerdotes qui adpropinquant ad Dominum in sancta sanctorum ibi ponent sancta sanctorum et oblationem pro peccato et pro delicto locus enim sanctus est"
      en: "And he said to me: The chambers of the north, and the chambers of the south, which are before the separate building: they are holy chambers, in which the priests shall eat, that approach to the Lord into the holy of holies: there they shall lay the most holy things, and the offering for sin, and for trespass: for it is a holy place."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "cum autem ingressi fuerint sacerdotes non egredientur de sanctis in atrium exterius et ibi reponent vestimenta sua in quibus ministrant quia sancta sunt vestienturque vestimentis aliis et sic procedent ad populum"
      en: "And when the priests shall have entered in, they shall not go out of the holy places into the outward court: but there they shall lay their vestments, wherein they minister, for they are holy: and they shall put on other garments, and so they shall go forth to the people."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cumque conplesset mensuras domus interioris eduxit me per viam portae quae respiciebat ad viam orientalem et mensus est eam undique per circuitum"
      en: "Now when he had made an end of measuring the inner house, he brought me out by the way of the gate that looked toward the east: and he measured it on every side round about."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "mensus autem est contra ventum orientalem calamo mensurae quingentos calamos in calamo mensurae per circuitum"
      en: "And he measured toward the east with the measuring reed, five hundred reeds with the measuring reed round about."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et mensus est contra ventum aquilonem quingentos calamos in calamo mensurae per gyrum"
      en: "And he measured toward the north five hundred reeds with the measuring reed round about."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ad ventum australem mensus est quingentos calamos in calamo mensurae per circuitum"
      en: "And towards the south he measured five hundred reeds with the measuring reed round about."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et ad ventum occidentalem mensus est quingentos calamos in calamo mensurae"
      en: "And toward the west he measured five hundred reeds, with the measuring reed."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "per quattuor ventos mensus est illud murum eius undique per circuitum longitudine quingentorum cubitorum et latitudine quingentorum cubitorum dividentem inter sanctuarium et vulgi locum"
      en: "By the four winds he measured the wall thereof on every side round about, five hundred cubits long and five hundred cubits broad, making a separation between the sanctuary and the place of the people."
    status: { la: verified, en: verified }
