# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 1
verses:
  - n: 1
    text:
      la: "visio Isaiae filii Amos quam vidit super Iudam et Hierusalem in diebus Oziae Ioatham Ahaz Ezechiae regum Iuda"
      en: "The vision of Isaias the son of Amos I which he saw concerning Juda and Jerusalem in the days of Ozias, Joathan, Achaz, and Ezechias, kings of Juda"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "audite caeli et auribus percipe terra quoniam Dominus locutus est filios enutrivi et exaltavi ipsi autem spreverunt me"
      en: "Hear, O ye heavens, and give ear, O earth, for the Lord hath spoken. I have brought up children, and exalted them: but they have despised me."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cognovit bos possessorem suum et asinus praesepe domini sui Israhel non cognovit populus meus non intellexit"
      en: "The ox knoweth his owner, and the ass his master's crib: but Israel hath not known me, and my people hath not understood."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "vae genti peccatrici populo gravi iniquitate semini nequam filiis sceleratis dereliquerunt Dominum blasphemaverunt Sanctum Israhel abalienati sunt retrorsum"
      en: "Woe to the sinful nation, a people laden with iniquity, a wicked seed, ungracious children: they have forsaken the Lord, they have blasphemed the Holy One of Israel, they are gone away backwards."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "super quo percutiam vos ultra addentes praevaricationem omne caput languidum et omne cor maerens"
      en: "For what shall I strike you any more, you that increase transgression? the whole head is sick, and the whole heart is sad."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "a planta pedis usque ad verticem non est in eo sanitas vulnus et livor et plaga tumens non est circumligata nec curata medicamine neque fota oleo"
      en: "From the sole of the foot unto the top of the head, there is no soundness therein: wounds and bruises and swelling sores: they are not bound up, nor dressed, nor fomented with oil."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "terra vestra deserta civitates vestrae succensae igni regionem vestram coram vobis alieni devorant et desolabitur sicut in vastitate hostili"
      en: "Your land is desolate, your cities are burnt with fire: your country strangers devour before your face, and it shall be desolate as when wasted by enemies."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et derelinquetur filia Sion ut umbraculum in vinea et sicut tugurium in cucumerario sicut civitas quae vastatur"
      en: "And the daughter of Sion shall be left as a covert in a vineyard, and as a lodge in a garden of cucumbers, and as a city that is laid waste."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "nisi Dominus exercituum reliquisset nobis semen quasi Sodoma fuissemus et quasi Gomorra similes essemus"
      en: "Except the Lord of hosts had left us seed, we had been as Sodom, and we should have been like to Gomorrha."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "audite verbum Domini principes Sodomorum percipite auribus legem Dei nostri populus Gomorrae"
      en: "Hear the word of the Lord, ye rulers of Sodom, give ear to the law of our God, ye people of Gomorrha."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quo mihi multitudinem victimarum vestrarum dicit Dominus plenus sum holocausta arietum et adipem pinguium et sanguinem vitulorum et agnorum et hircorum nolui"
      en: "To what purpose do you offer me the multitude of your victims, saith the Lord? I am full, I desire not holocausts of rams, and fat of fatlings, and blood of calves, and lambs, and buck goats."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cum veneritis ante conspectum meum quis quaesivit haec de manibus vestris ut ambularetis in atriis meis"
      en: "When you came to appear before me, who required these things at your hands, that you should walk in my courts?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ne adferatis ultra sacrificium frustra incensum abominatio est mihi neomeniam et sabbatum et festivitates alias non feram iniqui sunt coetus vestri"
      en: "Offer sacrifice no more in vain: incense is an abomination tome. The new moons, and the sabbaths, and other festivals I will not abide, your assemblies are wicked."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "kalendas vestras et sollemnitates vestras odivit anima mea facta sunt mihi molesta laboravi sustinens"
      en: "My soul hateth your new moons, and your solemnities: they are become troublesome to me, I am weary of bearing them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et cum extenderitis manus vestras avertam oculos meos a vobis et cum multiplicaveritis orationem non audiam manus vestrae sanguine plenae sunt"
      en: "And when you stretch forth your hands, I will turn away my eyes from you: and when you multiply prayer, I will not hear: for your hands are full of blood."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "lavamini mundi estote auferte malum cogitationum vestrarum ab oculis meis quiescite agere perverse"
      en: "Wash yourselves, be clean, take away the evil of your devices from my eyes: cease to do perversely,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "discite benefacere quaerite iudicium subvenite oppresso iudicate pupillo defendite viduam"
      en: "Learn to do well: seek judgment, relieve the oppressed, judge for the fatherless, defend the widow."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et venite et arguite me dicit Dominus si fuerint peccata vestra ut coccinum quasi nix dealbabuntur et si fuerint rubra quasi vermiculus velut lana erunt"
      en: "And then come, and accuse me, saith the Lord: if your sins be as scarlet, they shall be made as white as snow: and if they be red as crimson, they shall be white as wool."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "si volueritis et audieritis bona terrae comedetis"
      en: "if you be willing, and will hearken to me, you shall eat the good things of the land."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quod si nolueritis et me provocaveritis ad iracundiam gladius devorabit vos quia os Domini locutum est"
      en: "But if you will not, and will provoke me to wrath: the sword shall devour you because the mouth of the Lord hath spoken it."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quomodo facta est meretrix civitas fidelis plena iudicii iustitia habitavit in ea nunc autem homicidae"
      en: "How is the faithful city, that was full of judgment, become a harlot? justice dwelt in it, but now murderers."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "argentum tuum versum est in scoriam vinum tuum mixtum est aqua"
      en: "Thy silver is turned into dress: thy wine is mingled with water."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "principes tui infideles socii furum omnes diligunt munera sequuntur retributiones pupillo non iudicant et causa viduae non ingreditur ad eos"
      en: "Thy princes are faithless, companions of thieves: they all love bribes, the run after rewards. They judge not for the fatherless: and the widow's cometh not in to them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "propter hoc ait Dominus exercituum Fortis Israhel heu consolabor super hostibus meis et vindicabor de inimicis meis"
      en: "Therefore saith the Lord the God of hosts, the mighty one of Israel: Ah! I will comfort myself over my adversaries: and I will be revenged of my enemies."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et convertam manum meam ad te et excoquam ad purum scoriam tuam et auferam omne stagnum tuum"
      en: "And I will turn my hand to thee, and I will clean purge away thy dress, and I will take away all thy tin."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et restituam iudices tuos ut fuerunt prius et consiliarios tuos sicut antiquitus post haec vocaberis civitas iusti urbs fidelis"
      en: "And I will restore thy judges se they were before, and thy counsellors as of old. After this thou shalt be called the city of the just, a faithful city."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Sion in iudicio redimetur et reducent eam in iustitia"
      en: "Sion shall be redeemed in judgment, and they shall bring her back in justice."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et conteret scelestos et peccatores simul et qui dereliquerunt Dominum consumentur"
      en: "And he shall destroy the wicked, and the sinners together: and they that have forsaken the Lord, shall be consumed."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "confundentur enim ab idolis quibus sacrificaverunt et erubescetis super hortis quos elegeratis"
      en: "For they shall be confounded for the idols, to which they have sacrificed: and you shall be ashamed of the gardens which you have chosen."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "cum fueritis velut quercus defluentibus foliis et velut hortus absque aqua"
      en: "When you shall be as an oak with the leaves falling off, and as a garden without water."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et erit fortitudo vestra ut favilla stuppae et opus vestrum quasi scintilla et succendetur utrumque simul et non erit qui extinguat"
      en: "And your strength shall be as the ashes of tow, and your work as a spark: and both shall burn together, and there shall be none to quench it."
    status: { la: verified, en: verified }
