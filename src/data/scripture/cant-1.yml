# Song of Songs (Vulgate "Canticum Canticorum," cited "Cant"), chapter 1.
# Verses 1-10 only -- transcribed from what was already pulled for the
# Nativity of the BVM's octave day 8 Matins reading (Divinum Officium,
# Monastic Tridentinum 1617, live prayMatutinum query 2025-09-15), not the
# whole chapter.
book: cant
chapter: 1
verses:
  - n: 1
    text:
      la: "Osculétur me ósculo oris sui, quia melióra sunt úbera tua vino,"
      en: "Let him kiss me with the kiss of his mouth: for thy breasts are better than wine,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fragrántia unguéntis óptimis. Oleum effúsum nomen tuum; ídeo adolescéntulæ dilexérunt te."
      en: "Smelling sweet of the best ointments. thy name is as oil poured out: therefore young maidens have loved thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Trahe me: post te currémus in odórem unguentórum tuórum. Introdúxit me rex in cellária sua; exsultábimus et lætábimur in te mémores úberum tuórum super vinum. Recti díligunt te."
      en: "Draw me: we will run after thee to the odour of thy ointments. The king hath brought me into his storerooms: we will be glad and rejoice in thee, remembering thy breasts more than wine: the righteous love thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nigra sum, sed formósa, fíliæ Jerúsalem, sicut tabernácula Cedar, sicut pelles Salomónis."
      en: "I am black but beautiful, O ye daughters of Jerusalem, as the tents of Cedar, as the curtains of Solomon."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Nolíte me consideráre quod fusca sim, quia decolorávit me sol. Fílii matris meæ pugnavérunt contra me, posuérunt me custódem in víneis, víneam meam non custodívi."
      en: "Do not consider me that I am brown, because the sun hath altered my colour: the sons of my mother have fought against me, they have made me the keeper in the vineyards: my vineyard I have not kept."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Indica mihi, quem díligit ánima mea, ubi pascas, ubi cubes in merídie, ne vagári incípiam post greges sodálium tuórum."
      en: "Show me, O thou whom my soul loveth, where thou feedest, where thou liest in the midday, lest I begin to wander after the flocks of thy companions."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Si ignóras te, o pulchérrima inter mulíeres, egrédere et abi post vestígia gregum, et pasce hædos tuos juxta tabernácula pastórum."
      en: "If thou know not thyself, O fairest among women, go forth, and follow after the steps of the flocks, and feed thy kids beside the tents of the shepherds."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Equitátui meo in cúrribus pharaónis assimilávi te, amíca mea."
      en: "To my company of horsemen, in Pharao's chariots, have I likened thee, O my love."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Pulchræ sunt genæ tuæ sicut túrturis, collum tuum sicut monília."
      en: "Thy cheeks are beautiful as the turtledove's, thy neck as jewels."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Murénulas áureas faciémus tibi vermiculátas argénto."
      en: "We will make thee chains of gold, inlaid with silver."
    status: { la: verified, en: verified }
