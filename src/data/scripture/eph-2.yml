# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: eph
chapter: 2
verses:
  - n: 1
    text:
      la: "Et vos, cum essetis mortui delictis et peccatis vestris,"
      en: "And you, when you were dead in your offences, and sins,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in quibus aliquando ambulastis secundum saeculum mundi hujus, secundum principem potestatis aeris hujus, spiritus, qui nunc operatur in filios diffidentiae,"
      en: "Wherein in time past you walked according to the course of this world, according to the prince of the power of this air, of the spirit that now worketh on the children of unbelief:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "in quibus et nos omnes aliquando conversati sumus in desideriis carnis nostrae, facientes voluntatem carnis et cogitationum, et eramus natura filii irae, sicut et ceteri:"
      en: "In which also we all conversed in time past, in the desires of our flesh, fulfilling the will of the flesh and of our thoughts, and were by nature children of wrath, even as the rest:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Deus autem, qui dives est in misericordia, propter nimiam caritatem suam, qua dilexit nos,"
      en: "But God, (who is rich in mercy,) for his exceeding charity wherewith he loved us,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et cum essemus mortui peccatis, convivificavit nos in Christo ( cujus gratia estis salvati),"
      en: "Even when we were dead in sins, hath quickened us together in Christ, (by whose grace you are saved,)"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et conresuscitavit, et consedere fecit in caelestibus in Christo Jesu:"
      en: "And hath raised us up together, and hath made us sit together in the heavenly places, through Christ Jesus."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ut ostenderet in saeculis supervenientibus abundantes divitias gratiae suae, in bonitate super nos in Christo Jesu."
      en: "That he might shew in the ages to come the abundant riches of his grace, in his bounty towards us in Christ Jesus."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Gratia enim estis salvati per fidem, et hoc non ex vobis: Dei enim donum est:"
      en: "For by grace you are saved through faith, and that not of yourselves, for it is the gift of God;"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "non ex operibus, ut ne quis glorietur."
      en: "Not of works, that no man may glory."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ipsius enim sumus factura, creati in Christo Jesu in operibus bonis, quae praeparavit Deus ut in illis ambulemus."
      en: "For we are his workmanship, created in Christ Jesus in good works, which God hath prepared that we should walk in them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Propter quod memores estote quod aliquando vos gentes in carne, qui dicimini praeputium ab ea quae dicitur circumcisio in carne, manu facta:"
      en: "For which cause be mindful that you, being heretofore Gentiles in the flesh, who are called uncircumcision by that which is called circumcision in the flesh, made by hands;"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quia eratis illo in tempore sine Christo, alienati a conversatione Israel, et hospites testamentorum, promissionis spem non habentes, et sine Deo in hoc mundo."
      en: "That you were at that time without Christ, being aliens from the conversation of Israel, and strangers to the testament, having no hope of the promise, and without God in this world."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nunc autem in Christo Jesu, vos, qui aliquando eratis longe, facti estis prope in sanguine Christi."
      en: "But now in Christ Jesus, you, who some time were afar off, are made nigh by the blood of Christ."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ipse enim est pax nostra, qui fecit utraque unum, et medium parietem maceriae solvens, inimicitias in carne sua,"
      en: "For he is our peace, who hath made both one, and breaking down the middle wall of partition, the enmities in his flesh:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "legem mandatorum decretis evacuans, ut duos condat in semetipso in unum novum hominem, faciens pacem:"
      en: "Making void the law of commandments contained in decrees; that he might make the two in himself into one new man, making peace;"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et reconciliet ambos in uno corpore, Deo per crucem, interficiens inimicitias in semetipso."
      en: "And might reconcile both to God in one body by the cross, killing the enmities in himself."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et veniens evangelizavit pacem vobis, qui longe fuistis, et pacem iis, qui prope."
      en: "And coming, he preached peace to you that were afar off, and peace to them that were nigh."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quoniam per ipsum habemus accessum ambo in uno Spiritu ad Patrem."
      en: "For by him we have access both in one Spirit to the Father."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ergo jam non estis hospites, et advenae: sed estis cives sanctorum, et domestici Dei,"
      en: "Now therefore you are no more strangers and foreigners; but you are fellow citizens with the saints, and the domestics of God,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "superaedificati super fundamentum apostolorum, et prophetarum, ipso summo angulari lapide Christo Jesu:"
      en: "Built upon the foundation of the apostles and prophets, Jesus Christ himself being the chief corner stone:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "in quo omnis aedificatio constructa crescit in templum sanctum in Domino,"
      en: "In whom all the building, being framed together, groweth up into an holy temple in the Lord."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "in quo et vos coaedificamini in habitaculum Dei in Spiritu."
      en: "In whom you also are built together into an habitation of God in the Spirit."
    status: { la: verified, en: verified }
