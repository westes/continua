# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 6
verses:
  - n: 1
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Loquere ad filios Israel, et dices ad eos: Vir, sive mulier, cum fecerint votum ut sanctificentur, et se voluerint Domino consecrare:"
      en: "Speak to the children of Israel, and thou shalt say to them: When a man, or woman, shall make a vow to be sanctified, and will consecrate themselves to the Lord:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "a vino, et omni quod inebriare potest, abstinebunt. Acetum ex vino, et ex qualibet alia potione, et quidquid de uva exprimitur, non bibent: uvas recentes siccasque non comedent"
      en: "They shall abstain from wine, and from every thing that may make a man drunk. They shall not drink vinegar of wine, or of any other drink, nor any thing that is pressed out of the grape: nor shall they eat grapes either fresh or dried."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cunctis diebus quibus ex voto Domino consecrantur: quidquid ex vinea esse potest, ab uva passa usque ad acinum non comedent."
      en: "All the days that they are consecrated to the Lord by vow: they shall eat nothing that cometh of the vineyard, from the raisin even to the kernel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Omni tempore separationis suae novacula non transibit per caput ejus usque ad completum diem, quo Domino consecratur. Sanctus erit, crescente caesarie capitis ejus."
      en: "All the time of his separation no razor shall pass over his head, until the day be fulfilled of his consecration to the Lord. He shall be holy, and shall let the hair of his head grow."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Omni tempore consecrationis suae, super mortuum non ingredietur,"
      en: "All the time of his consecration he shall not go in to any dead,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nec super patris quidem et matris et fratris sororisque funere contaminabitur, quia consecratio Dei sui super caput ejus est."
      en: "Neither shall he make himself unclean, even for his father, or for his mother, or for his brother, or for his sister, when they die, because the consecration of his God is upon his head."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Omnibus diebus separationis suae sanctus erit Domino."
      en: "All the days of his separation he shall be holy to the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sin autem mortuus fuerit subito quispiam coram eo, polluetur caput consecrationis ejus: quod radet illico in eadem die purgationis suae, et rursum septima."
      en: "But if any man die suddenly before him: the head of his consecration shall be defiled: and he shall shave it forthwith on the same day of his purification, and again on the seventh day."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "In octava autem die offeret duos turtures, vel duos pullos columbae sacerdoti in introitu foederis testimonii."
      en: "And on the eighth day he shall bring two turtles, or two young pigeons to the priest in the entry of the covenant of the testimony."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Faciet sacerdos unum pro peccato, et alterum in holocaustum, et deprecabitur pro eo, quia peccavit super mortuo: sanctificabitque caput ejus in die illo:"
      en: "And the priest shall offer one for sin, and the other for a holocaust, and shall pray for him, for that he hath sinned by the dead: and he shall sanctify his head that day:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et consecrabit Domino dies separationis illius, offerens agnum anniculum pro peccato: ita tamen ut dies priores irriti fiant, quoniam polluta est sanctificatio ejus."
      en: "And shall consecrate to the Lord the days of his separation, offering a lamb of one year for sin: yet so that the former days be made void, because his sanctification was profaned."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ista est lex consecrationis. Cum dies, quos ex voto decreverat, complebuntur, adducet eum ad ostium tabernaculi foederis,"
      en: "This is the law of consecration. When the days which he had determined by vow shall be expired, he shall bring him to the door of the tabernacle of the covenant,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et offeret oblationes ejus Domino, agnum anniculum immaculatum in holocaustum, et ovem anniculam immaculatam pro peccato, et arietem immaculatum, hostiam pacificam,"
      en: "And shall offer his oblation to the Lord: one he lamb of a year old without blemish for a holocaust, and one ewe lamb of a year old without blemish for a sin offering, and one ram without blemish for a victim of peace offering,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "canistrum quoque panum azymorum qui conspersi sint oleo, et lagana absque fermento uncta oleo, ac libamina singulorum:"
      en: "A basket also of unleavened bread, tempered with oil, and wafers without leaven anointed with oil, and the libations of each:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quae offeret sacerdos coram Domino, et faciet tam pro peccato, quam in holocaustum."
      en: "And the priest shall present them before the Lord, and shall offer both the sin offering and the holocaust."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Arietem vero immolabit hostiam pacificam Domino, offerens simul canistrum azymorum, et libamenta quae ex more debentur."
      en: "But the ram he shall immolate for a sacrifice of peace offering to the Lord, offering at the same time the basket of unleavened bread, and the libations that are due by custom."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Tunc radetur nazaraeus ante ostium tabernaculi foederis caesarie consecrationis suae: tolletque capillos ejus, et ponet super ignem, qui est suppositus sacrificio pacificorum:"
      en: "Then shall the hair of the consecration of the Nazarite, be shaved off before the door of the tabernacle of the covenant: and he shall take his hair, and lay it upon the fire, which is under the sacrifice of the peace offerings."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et armum coctum arietis, tortamque absque fermento unam de canistro, et laganum azymum unum, et tradet in manus nazaraei, postquam rasum fuerit caput ejus."
      en: "And shall take the boiled shoulder of the ram, and one unleavened cake out of the basket, and one unleavened wafer, and he shall deliver them into the hands of the Nazarite, after his head is shaven."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Susceptaque rursum ab eo, elevabit in conspectu Domini: et sanctificata sacerdotis erunt, sicut pectusculum, quod separari jussum est, et femur. Post haec, potest bibere nazaraeus vinum."
      en: "And receiving them again from him, he shall elevate them in the sight of the Lord: and they being sanctified shall belong to the priest, as the breast, which was commanded to be separated, and the shoulder. After this the Nazarite may drink wine."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Ista est lex nazaraei, cum voverit oblationem suam Domino tempore consecrationis suae, exceptis his, quae invenerit manus ejus: juxta quod mente devoverat, ita faciet ad perfectionem sanctificationis suae."
      en: "This is the law of the Nazarite, when he hath vowed his oblation to the Lord in the time of his consecration, besides those things which his hand shall find, according to that which he had vowed in his mind, so shall he do for the fulfilling of his sanctification."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Loquere Aaron et filiis ejus: Sic benedicetis filiis Israel, et dicetis eis:"
      en: "Say to Aaron and his sons: Thus shall you bless the children of Israel, and you shall say to them:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Benedicat tibi Dominus, et custodiat te."
      en: "The Lord bless thee, and keep thee."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Ostendat Dominus faciem suam tibi, et misereatur tui."
      en: "The Lord shew his face to thee, and have mercy on thee."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Convertat Dominus vultum suum ad te, et det tibi pacem."
      en: "The Lord turn his countenance to thee, and give thee peace."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Invocabuntque nomen meum super filios Israel, et ego benedicam eis."
      en: "And they shall invoke my name upon the children of Israel, and I will bless them."
    status: { la: verified, en: verified }
