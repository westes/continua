# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: mal
chapter: 1
verses:
  - n: 1
    text:
      la: "onus verbi Domini ad Israhel in manu Malachi"
      en: "The burden of the word of the Lord to Israel by the hand of Malachias."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dilexi vos dicit Dominus et dixistis in quo dilexisti nos nonne frater erat Esau Iacob dicit Dominus et dilexi Iacob"
      en: "I have loved you, saith the Lord: and you have said: Wherein hast thou loved us? Was not Esau brother to Jacob, saith the Lord, and I have loved Jacob,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Esau autem odio habui et posui montes eius in solitudinem et hereditatem eius in dracones deserti"
      en: "But have hated Esau? and I have made his mountains a wilderness, and given his inheritance to the dragons of the desert."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quod si dixerit Idumea destructi sumus sed revertentes aedificabimus quae deserta sunt haec dicit Dominus exercituum isti aedificabunt et ego destruam et vocabuntur Termini impietatis et Populus cui iratus est Dominus usque in aeternum"
      en: "But if Edom shall say: We are destroyed, but we will return and build up what hath been destroyed: thus saith the Lord of hosts: They shall build up, and I will throw down: and they shall be called the borders of wickedness, and the people with whom the Lord is angry for ever."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et oculi vestri videbunt et vos dicetis magnificetur Dominus super terminum Israhel"
      en: "And your eyes shall see, and you shall say: The Lord be magnified upon the border of Israel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "filius honorat patrem et servus dominum suum si ergo pater ego sum ubi est honor meus et si dominus ego sum ubi est timor meus dicit Dominus exercituum ad vos o sacerdotes qui despicitis nomen meum et dixistis in quo despeximus nomen tuum"
      en: "The son honoureth the father, and the servant his master: if then I be a father, where is my honour? and if I be a master, where is my fear? saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "offertis super altare meum panem pollutum et dicitis in quo polluimus te in eo quod dicitis mensa Domini despecta est"
      en: "To you, O priests, that despise my name, and have said: Wherein have we despised thy name? You offer polluted bread upon my altar, and you say: Wherein have we polluted thee? In that you say: The table of the Lord is contemptible."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "si offeratis caecum ad immolandum nonne malum est et si offeratis claudum et languidum nonne malum est offer illud duci tuo si placuerit ei aut si susceperit faciem tuam dicit Dominus exercituum"
      en: "If you offer the blind for sacrifice, is it not evil? and if you offer the lame and the sick, is it not evil? offer it to thy prince, if he will be pleased with it, or if he will regard thy face, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et nunc deprecamini vultum Dei ut misereatur vestri de manu enim vestra factum est hoc si quo modo suscipiat facies vestras dicit Dominus exercituum"
      en: "And now beseech ye the face of God, that he may have mercy on you, (for by your hand hath this been done,) if by any means he will receive your faces, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quis est in vobis qui claudat ostia et incendat altare meum gratuito non est mihi voluntas in vobis dicit Dominus exercituum et munus non suscipiam de manu vestra"
      en: "Who is there among you, that will shut the doors, and will kindle the fire on my altar gratis? I have no pleasure in you, saith the Lord of hosts: and I will not receive a gift of your hand."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ab ortu enim solis usque ad occasum magnum est nomen meum in gentibus et in omni loco sacrificatur et offertur nomini meo oblatio munda quia magnum nomen meum in gentibus dicit Dominus exercituum"
      en: "For from the rising of the sun even to the going down, my name is great among the Gentiles, and in every place there is sacrifice, and there is offered to my name a clean oblation: for my name is great among the Gentiles, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et vos polluistis illud in eo quod dicitis mensa Domini contaminata est et quod superponitur contemptibile est cum igni qui illud devorat"
      en: "And you have profaned it in that you say: The table of the Lord is defiled: and that which is laid thereupon is contemptible with the fire that devoureth it."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et dixistis ecce de labore et exsuflastis illud dicit Dominus exercituum et intulistis de rapinis claudum et languidum et intulistis munus numquid suscipiam illud de manu vestra dicit Dominus"
      en: "And you have said: Behold of our labour, and you puffed it away, saith the Lord of hosts, and you brought in of rapine the lame, and the sick, and brought in an offering: shall I accept it at your hands, saith the Lord?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "maledictus dolosus qui habet in grege suo masculum et votum faciens immolat debile Domino quia rex magnus ego dicit Dominus exercituum et nomen meum horribile in gentibus"
      en: "Cursed is the deceitful man that hath in his flock a male, and making a vow offereth in sacrifice that which is feeble to the Lord: for I am a great King, saith the Lord of hosts, and my name is dreadful among the Gentiles."
    status: { la: verified, en: verified }
