# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: deut
chapter: 1
verses:
  - n: 1
    text:
      la: "Haec sunt verba quae locutus est Moyses ad omnem Israel trans Jordanem in solitudine campestri, contra mare Rubrum, inter Pharan et Tophel et Laban et Haseroth, ubi auri est plurimum:"
      en: "These are the words, which Moses spoke to all Israel beyond the Jordan, in the plain wilderness, over against the Red Sea, between Pharan and Thophel and Laban and Haseroth, where there is very much gold:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "undecim diebus de Horeb per viam montis Seir usque ad Cadesbarne."
      en: "Eleven days' journey from Horeb by the way of Mount Seir to Cadesbarne."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quadragesimo anno, undecimo mense, prima die mensis, locutus est Moyses ad filios Israel omnia quae praeceperat illi Dominus, ut diceret eis,"
      en: "In the fortieth year, the eleventh month, the first day of the month, Moses spoke to the children of Israel all that the Lord had commanded him to say to them:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "postquam percussit Sehon regem Amorrhaeorum, qui habitabat in Hesebon, et Og regem Basan, qui mansit in Astaroth, et in Edrai,"
      en: "After that he had slain Sehon king of the Amorrhites, who dwelt in Hesebon: and Og king of Basan who abode in Astaroth, and in Edrai,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "trans Jordanem in terra Moab. Coepitque Moyses explanare legem, et dicere:"
      en: "Beyond the Jordan in the land of Moab. And Moses began to expound the law, and to say:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dominus Deus noster locutus est ad nos in Horeb, dicens: Sufficit vobis quod in hoc monte mansistis:"
      en: "The Lord our God spoke to us in Horeb, saying: You have stayed long enough in this mountain:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "revertimini, et venite ad montem Amorrhaeorum, et ad cetera quae ei proxima sunt campestria atque montana et humiliora loca contra meridiem, et juxta littus maris, terram Chananaeorum, et Libani usque ad flumen magnum Euphraten."
      en: "Turn you, and come to the mountain of the Amorrhites, and to the other places that are next to it, the plains and the hills and the vales towards the south, and by the sea shore, the land of the Chanaanites, and of Libanus, as far as the great river Euphrates."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "En, inquit, tradidi vobis: ingredimini et possidete eam, super qua juravit Dominus patribus vestris Abraham, Isaac, et Jacob, ut daret illam eis, et semini eorum post eos."
      en: "Behold, said he, I have delivered it to you: go in and possess it, concerning which the Lord swore to your fathers Abraham, Isaac, and Jacob, that he would give it to them, and to their seed after them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dixique vobis illo in tempore:"
      en: "And I said to you at that time:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Non possum solus sustinere vos: quia Dominus Deus vester multiplicavit vos, et estis hodie sicut stellae caeli, plurimi."
      en: "I alone am not able to bear you: for the Lord your God hath multiplied you, and you are this day as the stars of heaven, for multitude."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "( Dominus Deus patrum vestrorum addat ad hunc numerum multa millia, et benedicat vobis sicut locutus est.)"
      en: "(The Lord God of your fathers add to this number many thousands, and bless you as he hath spoken.)"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Non valeo solus negotia vestra sustinere, et pondus ac jurgia."
      en: "I alone am not able to bear your business, and the charge of you and your differences."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Date ex vobis viros sapientes et gnaros, et quorum conversatio sit probata in tribubus vestris, ut ponam eos vobis principes."
      en: "Let me have from among you wise and understanding men, and such whose conversation is approved among your tribes, that I may appoint them your rulers."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tunc respondistis mihi: Bona res est, quam vis facere."
      en: "Then you answered me: The thing is good which thou meanest to do."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Tulique de tribubus vestris viros sapientes et nobiles, et constitui eos principes, tribunos, et centuriones, et quinquagenarios ac decanos, qui docerent vos singula."
      en: "And I took out of your tribes men wise and honourable, and appointed them rulers, tribunes, and centurions, and officers over fifties, and over tens, who might teach you all things."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Praecepique eis, dicens: Audite illos, et quod justum est judicate: sive civis sit ille, sive peregrinus."
      en: "And I commanded them, saying: Hear them, and judge that which is just: whether he be one of your country, or a stranger."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Nulla erit distantia personarum: ita parvum audietis ut magnum, nec accipietis cujusquam personam, quia Dei judicium est. Quod si difficile vobis visum aliquid fuerit, referte ad me, et ego audiam."
      en: "There shall be no difference of persons, you shall hear the little as well as the great: neither shall you respect any man's person, because it is the judgment of God. And if any thing seem hard to you, refer it to me, and I will hear it."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Praecepique omnia quae facere deberetis."
      en: "And I commanded you all things that you were to do."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Profecti autem de Horeb, transivimus per eremum terribilem et maximam, quam vidistis, per viam montis Amorrhaei, sicut praeceperat Dominus Deus noster nobis. Cumque venissemus in Cadesbarne,"
      en: "And departing from Horeb, we passed through the terrible and vast wilderness, which you saw, by the way of the mountain of the Amorrhite, as the Lord our God had commanded us. And when we were come into Cadesbarne,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dixi vobis: Venistis ad montem Amorrhaei, quem Dominus Deus noster daturus est nobis:"
      en: "I said to you: You are come to the mountain of the Amorrhite, which the Lord our God will give to us."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "vide terram, quam Dominus Deus tuus dat tibi: ascende et posside eam, sicut locutus est Dominus Deus noster patribus tuis: noli timere, nec quidquam paveas."
      en: "See the land which the Lord thy God giveth thee: go up and possess it, as the Lord our God hath spoken to thy fathers: fear not, nor be any way discouraged."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et accessistis ad me omnes, atque dixistis: Mittamus viros qui considerent terram: et renuntient per quod iter debeamus ascendere, et ad quas pergere civitates."
      en: "And you came all to me, and said: Let us send men who may view the land, and bring us word what way we shall go up, and to what cities we shall go."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cumque mihi sermo placuisset, misi ex vobis duodecim viros, singulos de tribubus suis."
      en: "And because the saying pleased me, I sent of you twelve men, one of every tribe:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Qui cum perrexissent, et ascendissent in montana, venerunt usque ad Vallem botri: et considerata terra,"
      en: "Who, when they had set forward and had gone up to the mountains, came as far as the valley of the cluster: and having viewed the land,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "sumentes de fructibus ejus, ut ostenderent ubertatem, attulerunt ad nos, atque dixerunt: Bona est terra, quam Dominus Deus noster daturus est nobis."
      en: "Taking of the fruits thereof, to shew its fertility, they brought them to us, and said: The land is good, which the Lord our God will give us."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et noluistis ascendere, sed increduli ad sermonem Domini Dei nostri,"
      en: "And you would not go up, but being incredulous to the word of the Lord our God,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "murmurastis in tabernaculis vestris, atque dixisitis: Odit nos Dominus, et idcirco eduxit nos de terra Aegypti, ut traderet nos in manu Amorrhaei, atque deleret."
      en: "You murmured in your tents, and said: The Lord hateth us, and therefore he hath brought us out of the land of Egypt, that he might deliver us into the hand of the Amorrhite, and destroy us."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Quo ascendemus? nuntii terruerunt cor nostrum, dicentes: Maxima multitudo est, et nobis statura procerior; urbes magnae, et ad caelum usque munitae: filios Enacim vidimus ibi."
      en: "Whither shall we go up? the messengers have terrified our hearts, saying: The multitude is very great, and taller than we: the cities are great, and walled up to the sky, we have seen the sons of the Enacims there."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et dixi vobis: Nolite metuere, nec timeatis eos:"
      en: "And I said to you: Fear not, neither be ye afraid of them:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Dominus Deus, qui ductor est vester, pro vobis ipse pugnabit, sicut fecit in Aegypto cunctis videntibus."
      en: "The Lord God, who is your leader, himself will fight for you, as he did in Egypt in the sight of all."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et in solitudine ( ipse vidisti) portavit te Dominus Deus tuus, ut solet homo gestare parvulum filium suum, in omni via per quam ambulastis, donec veniretis ad locum istum."
      en: "And in the wilderness (as thou hast seen) the Lord thy God hath carried thee, as a man is wont to carry his little son, all the way that you have come, until you came to this place."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et nec sic quidem credidistis Domino Deo vestro,"
      en: "And yet for all this you did not believe the Lord your God,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "qui praecessit vos in via, et metatus est locum in quo tentoria figere deberetis, nocte ostendens vobis iter per ignem, et die per columnam nubis."
      en: "Who went before you in the way, and marked out the place, wherein you should pitch your tents, in the night shewing you the way by fire, and in the day by the pillar of a cloud."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Cumque audisset Dominus vocem sermonum vestrorum, iratus juravit, et ait:"
      en: "And when the Lord had heard the voice of your words, he was angry and swore, and said:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Non videbit quispiam de hominibus generationis hujus pessimae terram bonam, quam sub juramento pollicitus sum patribus vestris,"
      en: "Not one of the men of this wicked generation shall see the good land, which I promised with an oath to your fathers:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "praeter Caleb filium Jephone: ipse enim videbit eam, et ipsi dabo terram, quam calcavit, et filiis ejus, quia secutus est Dominum."
      en: "Except Caleb the son of Jephone: for he shall see it, and to him I will give the land that he hath trodden upon, and to his children, because he hath followed the Lord."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Nec miranda indignatio in populum, cum mihi quoque iratus Dominus propter vos dixerit: Nec tu ingredieris illuc:"
      en: "Neither is his indignation against the people to be wondered at, since the Lord was angry with me also on your account, and said: Neither shalt thou go in thither."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "sed Josue filius Nun minister tuus, ipse intrabit pro te. Hunc exhortare et robora, et ipse sorte terram dividet Israeli."
      en: "But Josue the son of Nun, thy minister, he shall go in for thee: exhort and encourage him, and he shall divide the land by lot to Israel."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Parvuli vestri, de quibus dixistis quod captivi ducerentur, et filii qui hodie boni ac mali ignorant distantiam, ipsi ingredientur: et ipsis dabo terram, et possidebunt eam."
      en: "Your children, of whom you said that they should be led away captives, and your sons who know not this day the difference of good and evil, they shall go in: and to them I will give the land, and they shall possess it."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Vos autem revertimini, et abite in solitudinem per viam maris Rubri."
      en: "But return you and go into the wilderness by the way of the Red Sea."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et respondistis mihi: Peccavimus Domino: ascendemus et pugnabimus, sicut praecepit Dominus Deus noster. Cumque instructi armis pergeretis in montem,"
      en: "And you answered me: We have sinned against the Lord: we will go up and fight, as the Lord our God hath commanded. And when you went ready armed unto the mountain,"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "ait mihi Dominus: Dic ad eos: Nolite ascendere, neque pugnetis: non enim sum vobiscum: ne cadatis coram inimicis vestris."
      en: "The Lord said to me: Say to them: Go not up, and fight not, for I am not with you: lest you fall before your enemies."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Locutus sum, et non audistis: sed adversantes imperio Domini, et tumentes superbia, ascendistis in montem."
      en: "I spoke, and you hearkened not: but resisting the commandment of the Lord, and swelling with pride, you went up into the mountain."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Itaque egressus Amorrhaeus, qui habitabat in montibus, et obviam veniens, persecutus est vos, sicut solent apes persequi: et cecidit de Seir usque Horma."
      en: "And the Amorrhite that dwelt in the mountains coming out, and meeting you, chased you, as bees do: and made slaughter of you from Seir as far as Horma."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Cumque reversi ploraretis coram Domino, non audivit vos, nec voci vestrae voluit acquiescere."
      en: "And when you returned and wept before the Lord, he heard you not, neither would he yield to; your voice."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Sedistis ergo in Cadesbarne multo tempore."
      en: "So you abode in Cadesbarne a long time."
    status: { la: verified, en: verified }
