# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: esth
chapter: 3
verses:
  - n: 1
    text:
      la: "post haec rex Asuerus exaltavit Aman filium Amadathi qui erat de stirpe Agag et posuit solium eius super omnes principes quos habebat"
      en: "After these things, king Assuerus advanced Aman, the son of Amadathi, who was of the race of Agag: and he set his throne above all the princes that were with him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "cunctique servi regis qui in foribus palatii versabantur flectebant genu et adorabant Aman sic enim eis praeceperat imperator solus Mardocheus non flectebat genu neque adorabat eum"
      en: "And all the king's servants, that were at the doors of the palace, bent their knees, and worshipped Aman: for so the emperor had commanded them, only Mardochai did not bend his knee, nor worship him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cui dixerunt regis pueri qui ad fores palatii praesidebant cur praeter ceteros non observas mandata regis"
      en: "And the king's servants that were chief at the doors of the palace, said to him: Why dost thou alone not observe the king's commandment?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cumque hoc crebrius dicerent et ille nollet audire nuntiaverunt Aman scire cupientes utrum perseveraret in sententia dixerat enim eis se esse Iudaeum"
      en: "And when they were saying this often, and he would not hearken to them; they told Aman, desirous to know whether he would continue in his resolution: for he had told them that he was a Jew."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quod cum audisset Aman et experimento probasset quod Mardocheus non sibi flecteret genu nec se adoraret iratus est valde"
      en: "Now when Aman had heard this, and had proved by experience that Mardochai did not bend his knee to him, nor worship him, he was exceeding angry."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et pro nihilo duxit in unum Mardocheum mittere manus suas audierat enim quod esset gentis iudaeae magisque voluit omnem Iudaeorum qui erant in regno Asueri perdere nationem"
      en: "And he counted it nothing to lay his hands upon Mardochai alone: for he had heard that he was of the nation of the Jews, and he chose rather to destroy all the nation of the Jews that were in the kingdom of Assuerus."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "mense primo cuius vocabulum est nisan anno duodecimo regni Asueri missa est sors in urnam quae hebraice dicitur phur coram Aman quo die et quo mense gens Iudaeorum deberet interfici et exivit mensis duodecimus qui vocatur adar"
      en: "In the first month (which is called Nisan) in the twelfth year a of the reign of Assuerus, the lot was cast into an urn, which in Hebrew is called Phur, before Aman, on what day and what month the nation of the Jews should be destroyed: and there came out the twelfth month, which is called Adar."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixitque Aman regi Asuero est populus per omnes provincias regni tui dispersus et a se mutuo separatus novis utens legibus et caerimoniis insuper et regis scita contemnens et optime nosti quod non expediat regno tuo ut insolescat per licentiam"
      en: "And Aman said to king Assuerus: There is a people scattered through all the provinces of thy kingdom, and separated one from another, that use new laws and ceremonies, and moreover despise the king's ordinances: and thou knowest very well that it is not expedient for thy kingdom that they should grow insolent by impunity."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "si tibi placet decerne ut pereat et decem milia talentorum adpendam arcariis gazae tuae"
      en: "If it please thee, decree that they may he destroyed, and I will pay ten thousand talents to thy treasurers."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "tulit ergo rex anulum quo utebatur de manu sua et dedit eum Aman filio Amadathi de progenie Agag hosti Iudaeorum"
      en: "And the king took the ring that he used, from his own hand, and gave it to Aman, the son of Amadathi of the race of Agag, the enemy of the Jews,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dixitque ad eum argentum quod polliceris tuum sit de populo age quod tibi placet"
      en: "And he said to him: As to the money which thou promisest, keep it for thyself: and as to the people, do with them as seemeth good to thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "vocatique sunt scribae regis mense primo nisan tertiadecima die eius et scriptum est ut iusserat Aman ad omnes satrapas regis et iudices provinciarum diversarumque gentium ut quaeque gens legere poterat et audire pro varietate linguarum ex nomine regis Asueri et litterae ipsius signatae anulo"
      en: "And the king's scribes were called in the first month Nisan, on the thirteenth day of the same month: and they wrote, as Aman had commanded, to all the king's lieutenants, and to the judges of the provinces, and of divers nations, as every nation could read, and hear according to their different languages, in the name of king Assuerus: and the letters, sealed with his ring,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "missae sunt per cursores regis ad universas provincias ut occiderent atque delerent omnes Iudaeos a puero usque ad senem parvulos et mulieres uno die hoc est tertiodecimo mensis duodecimi qui vocatur adar et bona eorum diriperent"
      en: "Were sent by the king's messengers to all provinces, to kill and destroy all the Jews, both young and old, little children, and women, in one day, that is, on the thirteenth of the twelfth month, which is called Adar, and to make a spoil of their goods."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "summa autem epistularum haec fuit ut omnes provinciae scirent et pararent se ad praedictam diem"
      en: "And the contents of the letters were to this effect, that all provinces might know and be ready against that day."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "festinabant cursores qui missi erant explere regis imperium statimque in Susis pependit edictum rege et Aman celebrante convivium et cunctis qui in urbe erant flentibus"
      en: "The couriers that were sent made haste to fulfil the king's commandment. And immediately the edict was hung up in Susan, the king and Aman feasting together, and all the Jews that were in the city weeping."
    status: { la: verified, en: verified }
