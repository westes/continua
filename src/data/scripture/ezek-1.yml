# Ezekiel (Vulgate "Ezechiel," cited "Ezech"), chapter 1.
# Verses transcribed from all-saints-octave-day-2.yml (already pulled
# from Divinum Officium, Monastic Tridentinum 1617) as part of the
# migration to a dedicated scripture store (2026-08 decision).
book: ezek
chapter: 1
verses:
  - n: 1
    text:
      la: "Et factum est in trigésimo anno, in quarto, in quinta mensis, cum essem in médio captivórum juxta flúvium Chobar, apérti sunt cæli, et vidi visiónes Dei."
      en: "Now it came to pass in the thirtieth year, in the fourth month, on the fifth day of the month, when I was in the midst of the captives by the river Chobar, the heavens were opened, and I saw the visions of God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "In quinta mensis, ipse est annus quintus transmigratiónis regis Jóachim,"
      en: "On the fifth day of the month, the same was the fifth year of the captivity of king Joachin,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Factum est verbum Dómini ad Ezechiélem fílium Buzi sacerdótem, in terra Chaldæórum, secus flumen Chobar: et facta est super eum ibi manus Dómini."
      en: "The word of the Lord came to Ezechiel the priest the son of Buzi in the land of the Chaldeans, by the river Chobar: and the hand of the Lord was there upon him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et vidi, et ecce ventus túrbinis veniébat ab Aquilóne, et nubes magna, et ignis invólvens, et splendor in circúitu ejus: et de médio ejus, quasi spécies eléctri, id est, de médio ignis:"
      en: "And I saw, and behold a whirlwind came out of the north: and a great cloud, and a fire infolding it, and brightness was about it: and out of the midst thereof, that is, out of the midst of the fire, as it were the resemblance of amber."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et in médio ejus similitúdo quátuor animálium, et hic aspéctus eórum, similitúdo hóminis in eis."
      en: "And in the midst thereof the likeness of four living creatures: and this was their appearance: there was the likeness of a man in them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quátuor fácies uni, et quátuor pennæ uni."
      en: "Every one had four faces, and every one four wings."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Pedes eórum, pedes recti, et planta pedis eórum quasi planta pedis vítuli: et scintíllæ quasi aspéctus æris candéntis."
      en: "Their feet were straight feet, and the sole of their foot was like the sole of a calf's foot, and they sparkled like the appearance of glowing brass."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et manus hóminis sub pennis eórum, in quátuor pártibus: et fácies et pennas per quátuor partes habébant,"
      en: "And they had the hands of a man under their wings on their four sides: and they had faces, and wings on the four sides,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Junctǽque erant pennæ eórum altérius ad álterum. Non revertebántur cum incéderent, sed unumquódque ante fáciem suam gradiebátur."
      en: "And the wings of one were joined to the wings of another. They turned not when they went: but every one went straight forward."
    status: { la: verified, en: verified }
