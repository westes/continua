# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: joel
chapter: 1
verses:
  - n: 1
    text:
      la: "Verbum Domini, quod factum est ad Joel, filium Phatuel."
      en: "The word of the Lord that came to Joel the son of Phatuel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Audite hoc, senes, et auribus percipite, omnes habitatores terrae: si factum est istud in diebus vestris, aut in diebus patrum vestrorum?"
      en: "Hear this, ye old men, and give ear, all ye inhabitants of the land: did this ever happen in your days, or in the days of your fathers?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Super hoc filiis vestris narrate, et filii vestri filiis suis, et filii eorum generationi alterae."
      en: "Tell ye of this to your children, and let your children tell their children, and their children to another generation."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Residuum erucae comedit locusta, et residuum locustae comedit bruchus, et residuum bruchi comedit rubigo."
      en: "That which the palmerworm hath left, the locust hath eaten: and that which the locust hath left, the bruchus hath eaten: and that which the bruchus hath left, the mildew hath destroyed."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Expergiscimini, ebrii, et flete et ululate, omnes qui bibitis vinum in dulcedine, quoniam periit ab ore vestro."
      en: "Awake, ye that are drunk, and weep, and mourn all ye that take delight in drinking sweet wine: for it is cut off from your mouth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Gens enim ascendit super terram meam, fortis et innumerabilis: dentes ejus ut dentes leonis, et molares ejus ut catuli leonis."
      en: "For a nation is come up upon my land, strong and without number: his teeth are like the teeth of a lion: and his cheek teeth as of a lion's whelp."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Posuit vineam meam in desertum, et ficum meam decorticavit; nudans spoliavit eam, et projecit: albi facti sunt rami ejus."
      en: "He hath laid my vineyard waste, and hath pilled off the bark of my fig tree: he hath stripped it bare, and cast it away; the branches thereof are made white."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Plange quasi virgo accincta sacco super virum pubertatis suae."
      en: "Lament like a virgin girded with sackcloth for the husband of her youth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Periit sacrificium et libatio de domo Domini; luxerunt sacerdotes, ministri Domini."
      en: "Sacrifice and libation is cut off from the house of the Lord: the priests, the Lord's ministers, have mourned:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Depopulata est regio, luxit humus, quoniam devastatum est triticum, confusum est vinum, elanguit oleum."
      en: "The country is destroyed, the ground hath mourned: for the corn is wasted, the wine is confounded, the oil hath languished."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Confusi sunt agricolae, ululaverunt vinitores super frumento et hordeo, quia periit messis agri."
      en: "The husbandmen are ashamed, the vinedressers have howled for the wheat, and for the barley, because the harvest of the field is perished."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Vinea confusa est, et ficus elanguit; malogranatum, et palma, et malum, et omnia ligna agri aruerunt, quia confusum est gaudium a filiis hominum."
      en: "The vineyard is confounded, and the fig tree hath languished: the pomegranate tree, and the palm tree, and the apple tree, and all the trees of the field are withered: because joy is withdrawn from the children of men."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Accingite vos, et plangite, sacerdotes: ululate, ministri altaris; ingredimini, cubate in sacco, ministri Dei mei, quoniam interiit de domo Dei vestri sacrificium et libatio."
      en: "Gird yourselves, and lament, O ye priests, howl, ye ministers of the altars: go in, lie in sackcloth, ye ministers of my God: because sacrifice and libation is cut off from the house of your God."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sanctificate jejunium, vocate coetum, congregate senes, omnes habitatores terrae in domum Dei vestri, et clamate ad Dominum:"
      en: "Sanctify ye a fast, call an assembly; gather together the ancients, all the inhabitants of the land into the house of your God: and cry ye to the Lord:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "A, a, a, diei! quia prope est dies Domini, et quasi vastitas a potente veniet."
      en: "Ah, ah, ah, for the day: because the day of the Lord is at hand, and it shall come like destruction from the mighty."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Numquid non coram oculis vestris alimenta perierunt de domo Dei nostri, laetitia et exsultatio?"
      en: "Is not your food cut off before your eyes, joy and gladness from the house of our God?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Computruerunt jumenta in stercore suo, demolita sunt horrea, dissipatae sunt apothecae, quoniam confusum est triticum."
      en: "The beasts have rotted in their dung, the barns are destroyed, the storehouses are broken down: because the corn is confounded."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quid ingemuit animal, mugierunt greges armenti? quia non est pascua eis; sed et greges pecorum disperierunt."
      en: "Why did the beast groan, why did the herds of cattle low? because there is no pasture for them: yea, and the flocks of sheep are perished."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ad te, Domine, clamabo, quia ignis comedit speciosa deserti, et flamma succendit omnia ligna regionis."
      en: "To thee, O Lord, will I cry: because fire hath devoured the beautiful places of the wilderness, and the flame hath burnt all the trees of the country."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Sed et bestiae agri, quasi area sitiens imbrem, suspexerunt ad te, quoniam exsiccati sunt fontes aquarum, et ignis devoravit speciosa deserti."
      en: "Yea and the beasts of the field have looked up to thee, as a garden bed that thirsteth after rain, for the springs of waters are dried up, and fire hath devoured the beautiful places of the wilderness."
    status: { la: verified, en: verified }
