# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: lam
chapter: 4
verses:
  - n: 1
    text:
      la: "ALEPH. Quomodo obscuratum est aurum, mutatus est color optimus! dispersi sunt lapides sanctuarii in capite omnium platearum!"
      en: "Aleph. How is the gold become dim, the finest colour is changed, the stones of the sanctuary are scattered in the top of every street?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "BETH. Filii Sion inclyti, et amicti auro primo: quomodo reputati sunt in vasa testea, opus manuum figuli!"
      en: "Beth. The noble sons of Sion, and they that were clothed with the best gold: how are they esteemed as earthen vessels, the work of the potter's hands?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "GHIMEL. Sed et lamiae nudaverunt mammam, lactaverunt catulos suos: filia populi mei crudelis quasi struthio in deserto."
      en: "Ghimel. Even the sea monsters have drawn out the breast, they have given suck to their young: the daughter of my people is cruel, like the ostrich in the desert."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "DALETH. Adhaesit lingua lactentis ad palatum ejus in siti; parvuli petierunt panem, et non erat qui frangeret eis."
      en: "Daleth. The tongue of the sucking child hath stuck to the roof of his mouth for thirst: the little ones have asked for bread, and there was none to break it unto them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "HE. Qui vescebantur voluptuose, interierunt in viis; qui nutriebantur in croceis, amplexati sunt stercora."
      en: "He. They that were fed delicately have died in the streets; they that were brought up in scarlet have embraced the dung."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "VAU. Et major effecta est iniquitas filiae populi mei peccato Sodomorum, quae subversa est in momento, et non ceperunt in ea manus."
      en: "Vau. And the iniquity of the daughter of my people is made greater than the sin of Sodom, which was overthrown in a moment, and hands took nothing in her."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ZAIN. Candidiores Nazaraei ejus nive, nitidiores lacte, rubicundiores ebore antiquo, sapphiro pulchriores."
      en: "Zain. Her Nazarites were whiter than snow, purer than milk, more ruddy than the old ivory, fairer than the sapphire."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "HETH. Denigrata est super carbones facies eorum et non sunt cogniti in plateis; adhaesit cutis eorum ossibus: aruit, et facta est quasi lignum."
      en: "Heth. Their face is now made blacker than coals, and they are not known in the streets: their skin hath stuck to their bones, it is withered, and is become like wood."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "TETH. Melius fuit occisis gladio quam interfectis fame, quoniam isti extabuerunt consumpti a sterilitate terrae."
      en: "Teth. It was better with them that were slain by the sword, than with them that died with hunger: for these pined away being consumed for want of the fruits of the earth."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "JOD. Manus mulierum misericordium coxerunt filios suos; facti sunt cibus earum in contritione filiae populi mei."
      en: "Jod. The hands of the pitiful women have sodden their own children: they were their meat in the destruction of the daughter of my people."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "CAPH. Complevit Dominus furorem suum, effudit iram indignationis suae: et succendit ignem in Sion, et devoravit fundamenta ejus."
      en: "Caph. The Lord hath accomplished his wrath, he hath poured out his fierce anger: and he hath kindled a fire in Sion, and it hath devoured the foundations thereof."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "LAMED. Non crediderunt reges terrae, et universi habitatores orbis, quoniam ingrederetur hostis et inimicus per portas Jerusalem."
      en: "Lamed. The kings of the earth, and all the inhabitants of the world would not have believed, that the adversary and the enemy should enter in by the gates of Jerusalem."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "MEM. Propter peccata prophetarum ejus, et iniquitates sacerdotum ejus, qui effuderunt in medio ejus sanguinem justorum."
      en: "Mem. For the sins of her prophets, and the iniquities of her priests, that have shed the blood of the just in the midst of her."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "NUN. Erraverunt caeci in plateis, polluti sunt in sanguine; cumque non possent, tenuerunt lacinias suas."
      en: "Nun. They have wandered as blind men in the streets, they were defiled with blood: and when they could not help walking in it, they held up their skirts."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "SAMECH. Recedite polluti, clamaverunt eis; recedite, abite, nolite tangere: jurgati quippe sunt, et commoti dixerunt inter gentes: Non addet ultra ut habitet in eis."
      en: "Samech. Depart you that are defiled, they cried out to them: Depart, get ye hence, touch not: for they quarrelled, and being removed, they said among the Gentiles: He will no more dwell among them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "PHE. Facies Domini divisit eos, non addet ut respiciat eos; facies sacerdotum non erubuerunt, neque senum miserti sunt."
      en: "Phe. The face of the Lord hath divided them, he will no more regard them: they respected not the persons of the priests, neither had they pity on the ancient."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "AIN. Cum adhuc subsisteremus, defecerunt oculi nostri ad auxilium nostrum vanum; cum respiceremus attenti ad gentem quae salvare non poterat."
      en: "Ain. While we were yet standing, our eyes failed, expecting help for us in vain, when we looked attentively towards a nation that was not able to save."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "SADE. Lubricaverunt vestigia nostra in itinere platearum nostrarum; appropinquavit finis noster, completi sunt dies nostri, quia venit finis noster."
      en: "Sade. Our steps have slipped in the way of our streets, our end draweth near: our days are fulfilled, for our end is come."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "COPH. Velociores fuerunt persecutores nostri aquilis caeli; super montes persecuti sunt nos, in deserto insidiati sunt nobis."
      en: "Coph. Our persecutors were swifter than the eagles of the air: they pursued us upon the mountains, they lay in wait for us in the wilderness."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "RES. Spiritus oris nostri, Christus Dominus, captus est in peccatis nostris, cui diximus: In umbra tua vivemus in gentibus."
      en: "Res. The breath of our mouth, Christ the Lord, is taken in our sins: to whom we said: Under thy shadow we shall live among the Gentiles."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "SIN. Gaude et laetare, filia Edom, quae habitas in terra Hus! ad te quoque perveniet calix: inebriaberis, atque nudaberis."
      en: "Sin. Rejoice, and be glad, O daughter of Edom, that dwellest in the land of Hus: to thee also shall the cup come, thou shalt be made drunk, and naked."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "THAU. Completa est iniquitas tua, filia Sion: non addet ultra ut transmigret te. Visitavit iniquitatem tuam, filia Edom; discooperuit peccata tua."
      en: "Thau. Thy iniquity is accomplished, O daughter of Sion, he will no more carry thee away into captivity: he visited thy iniquity, O daughter of Edom, he hath discovered thy sins."
    status: { la: verified, en: verified }
