# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 19
verses:
  - n: 1
    text:
      la: "mense tertio egressionis Israhel de terra Aegypti in die hac venerunt in solitudinem Sinai"
      en: "In the third month of the departure of Israel out of the land of Egypt, on this day they came into the wilderness of Sinai:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "nam profecti de Raphidim et pervenientes usque in desertum Sinai castrametati sunt in eodem loco ibique Israhel fixit tentoria e regione montis"
      en: "For departing out of Raphidim, and coming to the desert of Sinai, they camped in the same place, and there Israel pitched their tents over against the mountain."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Moses autem ascendit ad Deum vocavitque eum Dominus de monte et ait haec dices domui Iacob et adnuntiabis filiis Israhel"
      en: "And Moses went up to God: and the Lord called unto him from the mountain, and said: Thus shalt thou say to the house of Jacob, and tell the children of Israel:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "vos ipsi vidistis quae fecerim Aegyptiis quomodo portaverim vos super alas aquilarum et adsumpserim mihi"
      en: "You have seen what I have done to the Egyptians, how I have carried you upon the wings of eagles, and have taken you to myself."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "si ergo audieritis vocem meam et custodieritis pactum meum eritis mihi in peculium de cunctis populis mea est enim omnis terra"
      en: "If therefore you will hear my voice, and keep my covenant, you shall be my peculiar possession above all people: for all the earth is mine."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et vos eritis mihi regnum sacerdotale et gens sancta haec sunt verba quae loqueris ad filios Israhel"
      en: "And you shall be to me a priestly kingdom, and a holy nation. Those are the words thou shalt speak to the children of Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "venit Moses et convocatis maioribus natu populi exposuit omnes sermones quos mandaverat Dominus"
      en: "Moses came, and calling together the elders of the people, he declared all the words which the Lord had commanded."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "responditque universus populus simul cuncta quae locutus est Dominus faciemus cumque rettulisset Moses verba populi ad Dominum"
      en: "And all the people answered together: All that the Lord hath spoken, we will do. And when Moses had related the people's words to the Lord,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ait ei Dominus iam nunc veniam ad te in caligine nubis ut audiat me populus loquentem ad te et credat tibi in perpetuum nuntiavit ergo Moses verba populi ad Dominum"
      en: "The Lord said to him: Lo, now will I come to thee in the darkness of a cloud, that the people may hear me speaking to thee, and may believe thee for ever. And Moses told the words of the people to the Lord."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui dixit ei vade ad populum et sanctifica illos hodie et cras laventque vestimenta sua"
      en: "And he said to him: Go to the people, and sanctify them to day, and to morrow, and let them wash their garments."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et sint parati in diem tertium die enim tertio descendet Dominus coram omni plebe super montem Sinai"
      en: "And let them be ready against the third day: for on the third day the Lord will come down in the sight of all the people upon mount Sinai."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "constituesque terminos populo per circuitum et dices cavete ne ascendatis in montem nec tangatis fines illius omnis qui tetigerit montem morte morietur"
      en: "And thou shalt appoint certain limits to the people round about, and thou shalt say to them: Take heed you go not up into the mount, and that ye touch not the borders thereof: every one that toucheth the mount dying he shall die."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "manus non tanget eum sed lapidibus opprimetur aut confodietur iaculis sive iumentum fuerit sive homo non vivet cum coeperit clangere bucina tunc ascendant in montem"
      en: "No hands shall touch him, but he shall be stoned to death, or shall be shot through with arrows: whether it be beast, or man, he shall not live. When the trumpet shall begin to sound, then let them go up into the mount."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "descenditque Moses de monte ad populum et sanctificavit eum cumque lavissent vestimenta sua"
      en: "And Moses came down from the mount to the people, and sanctified them. And when they had washed their garments,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ait ad eos estote parati in diem tertium ne adpropinquetis uxoribus vestris"
      en: "He said to them: Be ready against the third day, and come not near your wives."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "iam advenerat tertius dies et mane inclaruerat et ecce coeperunt audiri tonitrua ac micare fulgura et nubes densissima operire montem clangorque bucinae vehementius perstrepebat timuit populus qui erat in castris"
      en: "And now the third day was come, and the morning appeared: and behold thunders began to be heard, and lightning to flash, and a very thick cloud to cover the mount, and the noise of the trumpet sounded exceeding loud, and the people that was in the camp, feared."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "cumque eduxisset eos Moses in occursum Dei de loco castrorum steterunt ad radices montis"
      en: "And when Moses had brought them forth to meet God from the place of the camp, they stood at the bottom of the mount."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "totus autem mons Sinai fumabat eo quod descendisset Dominus super eum in igne et ascenderet fumus ex eo quasi de fornace eratque mons omnis terribilis"
      en: "And all mount Sinai was on a smoke: because the Lord was come down upon it in fire, and the smoke arose from it as out of a furnace: and all the mount was terrible."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et sonitus bucinae paulatim crescebat in maius et prolixius tendebatur Moses loquebatur et Dominus respondebat ei"
      en: "And the sound of the trumpet grew by degrees louder and louder, and was drawn out to a greater length: Moses spoke, and God answered him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "descenditque Dominus super montem Sinai in ipso montis vertice et vocavit Mosen in cacumen eius quo cum ascendisset"
      en: "And the Lord came down upon mount Sinai, in the very top of the mount, and he called Moses unto the top thereof. And when he was gone up thither,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "dixit ad eum descende et contestare populum ne forte velint transcendere terminos ad videndum Dominum et pereat ex eis plurima multitudo"
      en: "He said unto him: Go down, and charge the people: lest they should have a mind to pass the limits to see the Lord, and a very great multitude of them should perish."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sacerdotes quoque qui accedunt ad Dominum sanctificentur ne percutiat eos"
      en: "The priests also that come to the Lord, let them be sanctified, lest he strike them."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "dixitque Moses ad Dominum non poterit vulgus ascendere in montem Sinai tu enim testificatus es et iussisti dicens pone terminos circa montem et sanctifica illum"
      en: "And Moses said to the Lord: The people cannot come up to mount Sinai: for thou did charge, and command, saying: Set limits about the mount, and sanctify it."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "cui ait Dominus vade descende ascendesque tu et Aaron tecum sacerdotes autem et populus ne transeant terminos nec ascendant ad Dominum ne forte interficiat illos"
      en: "And the Lord said to him: Go, get thee down: and thou shalt come up, thou and Aaron with thee: but let not the priests and the people pass the limits, nor come up to the Lord, lest he kill them."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "descendit Moses ad populum et omnia narravit eis"
      en: "And Moses went down to the people and told them all."
    status: { la: verified, en: verified }
