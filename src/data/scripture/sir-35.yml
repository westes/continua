# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 35
verses:
  - n: 1
    text:
      la: "qui conservat legem multiplicat orationem"
      en: "He that keepeth the law, multiplieth offerings."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sacrificium salutare adtendere mandatis et discedere ab omni iniquitate"
      en: "It is a wholesome sacrifice to take heed to the commandments, and to depart from all iniquity. _J"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et deprecatio recedere ab iniustitia"
      en: "And to depart from injustice, is to offer a propitiatory sacrifice for injustices, and a begging of pardon for sins."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "[]"
      en: "He shall return thanks, that offereth fine flour: and he that doth mercy, offereth sacrifice."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "[]"
      en: "To depart from iniquity is that which pleaseth the Lord, and to depart from injustice, is an entreaty for sins."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "non apparebis ante conspectum Dei vacuus"
      en: "Thou shalt not appear empty in the sight of the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "haec enim omnia propter mandatum Domini fiunt"
      en: "For all these things are to be done because of the commandment of God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "oblatio iusti inpinguat altare et odor suavitatis est in conspectu Altissimi"
      en: "The oblation of the just maketh the altar fat, and is an odour of sweetness in the sight of the most High."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sacrificium iusti acceptum est et memoriam eius non obliviscetur Dominus"
      en: "The sacrifice of the just is acceptable, and the Lord will not forget the memorial thereof."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "bono animo gloriam redde Deo et non minuas primitias manuum tuarum"
      en: "Give glory to God with a good heart: and diminish not the firstfruits of thy hands."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in omni dato hilarem fac vultum tuum et in exultatione sanctifica decimas tuas"
      en: "In every gift shew a cheerful countenance, and sanctify thy tithes with joy."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "da Altissimo secundum datum eius et in bono oculo ad inventionem fac manuum tuarum"
      en: "Give to the most High according to what he hath given to thee, and with a good eye do according to the ability of thy hands:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quoniam Dominus retribuens est et septies tantum reddet tibi"
      en: "For the Lord maketh recompense, and will give thee seven times as much."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "noli offerre munera prava non enim suscipiet illa"
      en: "Do not offer wicked gifts, for such he will not receive."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et noli inspicere sacrificium iniustum quoniam Dominus iudex est et non est apud illum gloria personae"
      en: "And look not upon an unjust sacrifice, for the Lord is judge, and there is not with him respect of person."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "non accipiet Dominus personam in pauperem et precationem laesi exaudiet"
      en: "The Lord will not accept any person against a poor man, and he will hear the prayer of him that is wronged."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "non despiciet preces pupilli nec viduam si effundat loquellam gemitus"
      en: "He will not despise the prayers of the fatherless; nor the widow, when she poureth out her complaint."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "nonne lacrima ad maxillam descendit et exclamatio"
      en: "Do not the widow's tears run down the cheek, and her cry against him that causeth them to fall?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "a maxilla ascendit et Dominus exauditor delectans in illis"
      en: "For from the cheek they go up even to heaven, and the Lord that heareth will not be delighted with them."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "qui adorat Deum in oblectatione suscipietur et precatio illius usque ad nubes propinquabit"
      en: "He that adoreth God with joy, shall be accepted, and his prayer shall approach even to the clouds."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "oratio humiliantis se nubes penetrabit et donec propinquet non conrogabitur et non discedet donec aspiciat Altissimus"
      en: "The prayer of him that humbleth himself, shall pierce the clouds: and till it come nigh he will not be comforted: and he will not depart till the most High behold."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et Dominus non longinquabit sed iudicabit iustos et faciet iudicium et Fortissimus non habebit in illis patientiam ut contribulet dorsum ipsorum"
      en: "And the Lord will not be slack, but will judge for the just, and will do judgment: and the Almighty will not have patience with them, that he may crush their back:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et gentibus reddet vindictam donec tollat plenitudinem superborum et sceptra iniquorum contribulet"
      en: "And he will repay vengeance to the Gentiles, till he have taken away the multitude of the proud, and broken the sceptres of the unjust,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "donec reddat hominibus secundum actus suos et secundum opera Adae et secundum praesumptionem illius"
      en: "Till he have rendered to men according to their deeds: and according to the works of Adam, and according to his presumption,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "donec iudicet iudicium plebis suae et oblectabit iustos misericordia sua"
      en: "Till he have judged the cause of his people, and he shall delight the just with his mercy."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "speciosa misericordia Dei in tempore tribulationis quasi nubes pluviae in tempore siccitatis"
      en: "The mercy of God is beautiful in the time of affliction, as a cloud of rain in the time of drought."
    status: { la: verified, en: verified }
