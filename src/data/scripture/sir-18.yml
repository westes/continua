# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 18
verses:
  - n: 1
    text:
      la: "qui vivit in aeternum creavit omnia simul Deus solus iustificabitur et manet invictus rex in aeternum"
      en: "He that liveth for ever created all things together. God only shall be justified, and he remaineth an invincible king for ever."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quis sufficit enarrare opera illius"
      en: "Who is able to declare his works?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quis enim investigabit magnalia eius"
      en: "For who shall search out his glorious acts?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "virtutem autem magnitudinis eius quis enuntiabit et quis adiciet enarrare misericordiam eius"
      en: "And who shall shew forth the power of his majesty? or who shall be able to declare his mercy?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "non est minuere neque adicere nec est invenire magnalia Dei"
      en: "Nothing may be taken away, nor added, neither is it possible to find out the glorious works of God:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "cum consummaverit homo tunc incipit et cum quieverit operabitur"
      en: "When a man hath done, then shall he begin: and when he leaveth off, he shall be at a loss."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quid homo et quae gratia illius et quid bonum aut quid nequam illius"
      en: "What is man, and what is his grace? and what is his good, or what is his evil?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "numerus dierum hominum multum centum anni quasi guttae aquae a mare et sicut calculus harenae sic exigui anni in die aevi"
      en: "The number of the days of men at the most are a hundred years: as a drop of water of the sea are they esteemed: and as a pebble of the sand, so are a few years compared to eternity."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "propter hoc patiens est Deus in illis et effudit super eos misericordiam suam"
      en: "Therefore God is patient in them, and poureth forth his mercy upon them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "vidit praesumptionem cordis illorum quoniam mala est et cognovit subversionem illorum quoniam nequa est"
      en: "He hath seen the presumption of their heart that it is wicked, and hath known their end that it is evil."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ideo adimplevit propitiationem suam in illis et ostendit illis viam aequitatis"
      en: "Therefore bath he filled up his mercy in their favour, and hath shewn them the way of justice."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "miseratio hominis circa proximum suum misericordia autem Dei super omnem carnem"
      en: "The compassion of man is toward his neighbour: but the mercy of God is upon all flesh."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui misericordiam habet et docet erudit quasi pastor gregem suum"
      en: "He hath mercy, and teacheth, and correcteth, as a shepherd doth his hock."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "misereatur excipiens doctrinam miserationis et qui festinant in iudiciis eius"
      en: "He hath mercy on him that receiveth the discipline of mercy, and that maketh haste in his judgments."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "fili in bonis non des querellam et omni dato non des tristitiam verbi mali"
      en: "My son, in thy good deeds, make no complaint, and when thou givest any thing, add not grief by an evil word."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "nonne ardorem refrigerabit ros sic et verbum melius quam datus"
      en: "Shall not the dew assuage the heat? so also the good word is better than the gift."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "nonne ecce verbum super datum bonum et utraque cum homine iustificato"
      en: "Lo, is not a word better than a gift? but both are with a justified man."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "stultus achariter inproperabit et datus indisciplinati tabescere facit oculos"
      en: "A fool will upbraid bitterly: and a gift of one ill taught consumeth the eyes."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ante iudicium para iustitiam tibi et antequam loquaris disce"
      en: "Before judgment prepare thee justice, and learn before thou speak."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ante languorem adhibe medicinam et ante iudicium interroga te ipsum et in conspectu Dei invenies propitiationem"
      en: "Before sickness take a medicine, and before judgment examine thyself, and thou shalt find mercy in the sight of God."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ante languorem humilia te et in tempore infirmitatum ostende conversationem tuam"
      en: "Humble thyself before thou art sick, and in the time of sickness shew thy conversation."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "non inpediaris operari semper et non veteris usque ad mortem iustificari quoniam merces Dei manet in aeternum"
      en: "Let nothing hinder thee from praying always, and be not afraid to be justified even to death: for the reward of God continueth for ever."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ante orationem praepara animam tuam et noli esse quasi homo qui temptat Deum"
      en: "Before prayer prepare thy soul: and be not as a man that tempteth God."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "memento irae in die consummationis et tempus retributionis in conversatione facies"
      en: "Remember the wrath that shall be at the last day, and the time of repaying when he shall turn away his face."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "memento paupertatis in tempore abundantiae et necessitatem paupertatis in die divitiarum"
      en: "Remember poverty is the time of abundance, and the necessities of poverty in the day of riches."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "a mane usque ad vesperam mutatur tempus et haec omnia citata in oculis Dei"
      en: "From the morning until the evening the time shall be changed, and all these are swift in the eyes of God."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "homo sapiens in omnibus metuet et in diebus delictorum adtendet ab inertia"
      en: "A wise man will fear in every thing, and in the days of sine will beware of sloth."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "omnis astutus agnovit sapientiam et invenienti eam dabit confessionem"
      en: "Every man of understanding knoweth wisdom, and will give praise to him that findeth her."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "sensati in verbis et ipsi sapienter egerunt et intellexerunt veritatem et iustitiam et inploraverunt proverbia et iudicia"
      en: "They that were of good understanding in words, have also done wisely themselves: and have understood truth and justice, and have poured forth pro- verbs and judgments."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "de continentia animae post concupiscentias tuas non eas et a voluntate tua avertere"
      en: "Go not after thy lusts, but turn away from thy own will."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "si praestes animae tuae concupiscentiam eius faciet te in gaudium inimicis"
      en: "If thou give to thy soul her desires, she will make thee a joy to thy enemies."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "ne oblecteris in turbis nec in modicis ad duas est enim commissio illorum"
      en: "Take no pleasure in riotous assemblies, be they ever so small: for their concertation is continual."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "ne fueris mediocris in contentione ex fenore et non est tibi nihil in sacculo eris enim invidus tuae vitae"
      en: "Make not thyself poor by borrowing to contribute to feasts when thou hast nothing in thy purse : for thou shalt be an enemy to thy own life."
    status: { la: verified, en: verified }
