# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 18
verses:
  - n: 1
    text:
      la: "Qui vivet in aeternum creavit omnia simul. Deus solus justificabitur, et manet invictus rex in aeternum."
      en: "He that liveth for ever created all things together. God only shall be justified, and he remaineth an invincible king for ever."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quis sufficit enarrare opera illius?"
      en: "Who is able to declare his works?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quis enim investigabit magnalia ejus?"
      en: "For who shall search out his glorious acts?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "virtutem autem magnitudinis ejus quis enuntiabit? aut quis adjiciet enarrare misericordiam ejus?"
      en: "And who shall shew forth the power of his majesty? or who shall be able to declare his mercy?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Non est minuere neque adjicere, nec est invenire magnalia Dei."
      en: "Nothing may be taken away, nor added, neither is it possible to find out the glorious works of God:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Cum consummaverit homo, tunc incipiet: et cum quieverit, aporiabitur."
      en: "When a man hath done, then shall he begin: and when he leaveth off, he shall be at a loss."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quid est homo? et quae est gratia illius? et quid bonum aut quid nequam illius?"
      en: "What is man, and what is his grace? and what is his good, or what is his evil?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Numerus dierum hominum, ut multum centum anni, quasi gutta aquae maris deputati sunt: et sicut calculus arenae, sic exigui anni in die aevi."
      en: "The number of the days of men at the most are a hundred years: as a drop of water of the sea are they esteemed: and as a pebble of the sand, so are a few years compared to eternity."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Propter hoc patiens est Deus in illis, et effundit super eos misericordiam suam."
      en: "Therefore God is patient in them, and poureth forth his mercy upon them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Vidit praesumptionem cordis eorum, quoniam mala est: et cognovit subversionem illorum, quoniam nequam est."
      en: "He hath seen the presumption of their heart that it is wicked, and hath known their end that it is evil."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ideo adimplevit propitiationem suam in illis, et ostendit eis viam aequitatis."
      en: "Therefore hath he filled up his mercy in their favour, and hath shewn them the way of justice."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Miseratio hominis circa proximum suum: misericordia autem Dei super omnem carnem."
      en: "The compassion of man is toward his neighbour: but the mercy of God is upon all flesh."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Qui misericordiam habet, docet et erudit quasi pastor gregem suum."
      en: "He hath mercy, and teacheth, and correcteth, as a shepherd doth his flock."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Miseretur excipientis doctrinam miserationis, et qui festinat in judiciis ejus."
      en: "He hath mercy on him that receiveth the discipline of mercy, and that maketh haste in his judgments."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Fili, in bonis non des querelam, et in omni dato non des tristitiam verbi mali."
      en: "My son, in thy good deeds, make no complaint, and when thou givest any thing, add not grief by an evil word."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nonne ardorem refrigerabit ros? sic et verbum melius quam datum."
      en: "Shall not the dew assuage the heat? so also the good word is better than the gift."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Nonne ecce verbum super datum bonum? sed utraque cum homine justificato."
      en: "Lo, is not a word better than a gift? but both are with a justified man."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Stultus acriter improperabit: et datus indisciplinati tabescere facit oculos."
      en: "A fool will upbraid bitterly: and a gift of one ill taught consumeth the eyes."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ante judicium para justitiam tibi, et antequam loquaris, disce."
      en: "Before judgment prepare thee justice, and learn before thou speak."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Ante languorem adhibe medicinam: et ante judicium interroga teipsum, et in conspectu Dei invenies propitiationem."
      en: "Before sickness take a medicine, and before judgment examine thyself, and thou shalt find mercy in the sight of God."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Ante languorem humilia te, et in tempore infirmitatis ostende conversationem tuam."
      en: "Humble thyself before thou art sick, and in the time of sickness shew thy conversation."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Non impediaris orare semper, et ne verearis usque ad mortem justificari, quoniam merces Dei manet in aeternum."
      en: "Let nothing hinder thee from praying always, and be not afraid to be justified even to death: for the reward of God continueth for ever."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ante orationem praepara animam tuam, et noli esse quasi homo qui tentat Deum."
      en: "Before prayer prepare thy soul: and be not as a man that tempteth God."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Memento irae in die consummationis, et tempus retributionis in conversatione faciei."
      en: "Remember the wrath that shall be at the last day, and the time of repaying when he shall turn away his face."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Memento paupertatis in tempore abundantiae, et necessitatum paupertatis in die divitiarum."
      en: "Remember poverty in the time of abundance, and the necessities of poverty in the day of riches."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "A mane usque ad vesperam immutabitur tempus, et haec omnia citata in oculis Dei."
      en: "From the morning until the evening the time shall be changed, and all these are swift in the eyes of God."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Homo sapiens in omnibus metuet, et in diebus delictorum attendet ab inertia."
      en: "A wise man will fear in every thing, and in the days of sins will beware of sloth."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Omnis astutus agnoscit sapientiam, et invenienti eam dabit confessionem."
      en: "Every man of understanding knoweth wisdom, and will give praise to him that findeth her."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Sensati in verbis et ipsi sapienter egerunt, et intellexerunt veritatem et justitiam, et impleverunt proverbia et judicia."
      en: "They that were of good understanding in words, have also done wisely themselves: and have understood truth and justice, and have poured forth proverbs and judgments."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Post concupiscentias tuas non eas, et a voluntate tua avertere."
      en: "Go not after thy lusts, but turn away from thy own will."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Si praestes animae tuae concupiscentias ejus, faciat te in gaudium inimicis tuis."
      en: "If thou give to thy soul her desires, she will make thee a joy to thy enemies."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Ne oblecteris in turbis nec in modicis: assidua enim est commissio illorum."
      en: "Take no pleasure in riotous assemblies, be they ever so small: for their concertation is continual."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Ne fueris mediocris in contentione ex foenore, et est tibi nihil in sacculo: eris enim invidus vitae tuae."
      en: "Make not thyself poor by borrowing to contribute to feasts when thou hast nothing in thy purse: for thou shalt be an enemy to thy own life."
    status: { la: verified, en: verified }
