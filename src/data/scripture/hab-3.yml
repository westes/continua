# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: hab
chapter: 3
verses:
  - n: 1
    text:
      la: "oratio Abacuc prophetae pro ignorationibus"
      en: "A PRAYER OF HABACUC THE PROPHET FOR IGNORANCES."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Domine audivi auditionem tuam et timui Domine opus tuum in medio annorum vivifica illud in medio annorum notum facies cum iratus fueris misericordiae recordaberis"
      en: "O Lord, I have heard thy hearing, and was afraid. O Lord, thy work, in the midst of the years bring it to life: In the midst of the years thou shalt make it known: when thou art angry, thou wilt remember mercy."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Deus ab austro veniet et Sanctus de monte Pharan semper operuit caelos gloria eius et laudis eius plena est terra"
      en: "God will come from the south, and the holy one from mount Pharan: His glory covered the heavens, and the earth is full of his praise."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "splendor eius ut lux erit cornua in manibus eius ibi abscondita est fortitudo eius"
      en: "His brightness shall be as the light; horns are in his hands: There is his strength hid:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ante faciem eius ibit mors et egredietur diabolus ante pedes eius"
      en: "Death shall go before his face. And the devil shall go forth before his feet."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "stetit et mensus est terram aspexit et dissolvit gentes et contriti sunt montes saeculi incurvati sunt colles mundi ab itineribus aeternitatis eius"
      en: "He stood and measured the earth. He beheld, and melted the nations: and the ancient mountains were crushed to pieces. The hills of the world were bowed down by the journeys of his eternity."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "pro iniquitate vidi tentoria Aethiopiae turbabuntur pelles terrae Madian"
      en: "I saw the tents of Ethiopia for their iniquity, the curtains of the land of Madian shall be troubled."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "numquid in fluminibus iratus es Domine aut in fluminibus furor tuus vel in mari indignatio tua quia ascendes super equos tuos et quadrigae tuae salvatio"
      en: "Wast thou angry, O Lord, with the rivers? or was thy wrath upon the rivers? or thy indignation in the sea? Who will ride upon thy horses: and thy chariots are salvation."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "suscitans suscitabis arcum tuum iuramenta tribubus quae locutus es semper fluvios scindes terrae"
      en: "Thou wilt surely take up thy bow: according to the oaths which thou hast spoken to the tribes. Thou wilt divide the rivers of the earth."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "viderunt te et doluerunt montes gurges aquarum transiit dedit abyssus vocem suam altitudo manus suas levavit"
      en: "The mountains saw thee, and were grieved: the great body of waters passed away. The deep put forth its voice: the deep lifted up its hands."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sol et luna steterunt in habitaculo suo in luce sagittarum tuarum ibunt in splendore fulgurantis hastae tuae"
      en: "The sun and the moon stood still in their habitation, in the light of thy arrows, they shall go in the brightness of thy glittering spear."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "in fremitu conculcabis terram in furore obstupefacies gentes"
      en: "In thy anger thou wilt tread the earth under foot: in thy wrath thou wilt astonish the nations."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "egressus es in salutem populi tui in salutem cum christo tuo percussisti caput de domo impii denudasti fundamentum usque ad collum semper"
      en: "Thou wentest forth for the salvation of thy people: for salvation with thy Christ. Thou struckest the head of the house of the wicked: thou hast laid bare his foundation even to the neck."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "maledixisti sceptris eius capiti bellatorum eius venientibus ut turbo ad dispergendum me exultatio eorum sicut eius qui devorat pauperem in abscondito"
      en: "Thou hast cursed his sceptres, the head of his warriors, them that came out as a whirlwind to scatter me. Their joy was like that of him that devoureth the poor man in secret."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "viam fecisti in mari equis tuis in luto aquarum multarum"
      en: "Thou madest a way in the sea for thy horses, in the mud of many waters."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "audivi et conturbatus est venter meus ad vocem contremuerunt labia mea ingrediatur putredo in ossibus meis et subter me scateat ut requiescam in die tribulationis ut ascendam ad populum accinctum nostrum"
      en: "I have heard and my bowels were troubled: my lips trembled at the voice. Let rottenness enter into my bones, and swarm under me. That I may rest in the day of tribulation: that I may go up to our people that are girded."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ficus enim non florebit et non erit germen in vineis mentietur opus olivae et arva non adferent cibum abscidetur de ovili pecus et non erit armentum in praesepibus"
      en: "For the fig tree shall not blossom: and there shall be no spring in the vines. The labour of the olive tree shall fail: and the fields shall yield no food: the flock shall be cut off from the fold, and there shall be no herd in the stalls."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ego autem in Domino gaudebo exultabo in Deo Iesu meo"
      en: "But I will rejoice in the Lord: and I will joy in God my Jesus."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Deus Dominus fortitudo mea et ponet pedes meos quasi cervorum et super excelsa mea deducet me victor in psalmis canentem"
      en: "The Lord God is my strength: and he will make my feet like the feet of harts: and he, the conqueror, will lead me upon my high places, singing psalms."
    status: { la: verified, en: verified }
