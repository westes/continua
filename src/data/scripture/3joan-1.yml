# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 3joan
chapter: 1
verses:
  - n: 1
    text:
      la: "senior Gaio carissimo quem ego diligo in veritate"
      en: "The ancient to the dearly beloved Gaius, whom I love in truth."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "carissime de omnibus orationem facio prospere te ingredi et valere sicut prospere agit anima tua"
      en: "Dearly beloved, concerning all things I make it my prayer that thou mayest proceed prosperously, and fare well as thy soul doth prosperously."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "gavisus sum valde venientibus fratribus et testimonium perhibentibus veritati tuae sicut tu in veritate ambulas"
      en: "I was exceedingly glad when the brethren came and gave testimony to the truth in thee, even as thou walkest in the truth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "maiorem horum non habeo gratiam quam ut audiam filios meos in veritate ambulantes"
      en: "I have no greater grace than this, to hear that my children walk in truth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "carissime fideliter facis quicquid operaris in fratres et hoc in peregrinos"
      en: "Dearly beloved, thou dost faithfully whatever thou dost for the brethren, and that for strangers,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui testimonium reddiderunt caritati tuae in conspectu ecclesiae quos bene facies deducens digne Deo"
      en: "Who have given testimony to thy charity in the sight of the church: whom thou shalt do well to bring forward on their way in a manner worthy of God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "pro nomine enim profecti sunt nihil accipientes a gentibus"
      en: "Because, for his name they went out, taking nothing of the Gentiles."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "nos ergo debemus suscipere huiusmodi ut cooperatores simus veritatis"
      en: "We therefore ought to receive such, that we may be fellow helpers of the truth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "scripsissem forsitan ecclesiae sed is qui amat primatum gerere in eis Diotrepes non recipit nos"
      en: "I had written perhaps to the church: but Diotrephes, who loveth to have the pre-eminence among them, doth not receive us."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "propter hoc si venero commoneam eius opera quae facit verbis malignis garriens in nos et quasi non ei ista sufficiant nec ipse suscipit fratres et eos qui cupiunt prohibet et de ecclesia eicit"
      en: "For this cause, if I come, I will advertise his works which he doth, with malicious words prating against us. And as if these things were not enough for him, neither doth he himself receive the brethren, and them that do receive them he forbiddeth, and casteth out of the church."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "carissime noli imitari malum sed quod bonum est qui benefacit ex Deo est qui malefacit non vidit Deum"
      en: "Dearly beloved, follow not that which is evil, but that which is good. He that doth good, is of God: he that doth evil, hath not seen God."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Demetrio testimonium redditur ab omnibus et ab ipsa veritate et nos autem testimonium perhibemus et nosti quoniam testimonium nostrum verum est"
      en: "To Demetrius testimony is given by all, and by the truth itself, yea and we also give testimony: and thou knowest that our testimony is true."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "multa habui scribere tibi sed nolui per atramentum et calamum scribere tibi"
      en: "I had many things to write unto thee: but I would not by ink and pen write to thee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "spero autem protinus te videre et os ad os loquemur"
      en: "But I hope speedily to see thee, and we will speak mouth to mouth. Peace be to thee. Our friends salute thee. Salute the friends by name."
    status: { la: verified, en: verified }
