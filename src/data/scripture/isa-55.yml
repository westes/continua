# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 55
verses:
  - n: 1
    text:
      la: "o omnes sitientes venite ad aquas et qui non habetis argentum properate emite et comedite venite emite absque argento et absque ulla commutatione vinum et lac"
      en: "All you that thirst, come to the waters: and you that have no money make haste, buy, and eat: come ye, buy wine and milk without money, and without any price."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quare adpenditis argentum non in panibus et laborem vestrum non in saturitate audite audientes me et comedite bonum et delectabitur in crassitudine anima vestra"
      en: "Why do you spend money for that which is not breed, and your labour for that which doth not satisfy you? Hearken diligently to me, and eat that which is good, and your soul shall be delighted in fatness."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "inclinate aurem vestram et venite ad me audite et vivet anima vestra et feriam vobis pactum sempiternum misericordias David fideles"
      en: "Incline your ear and come to me: hear and your soul shall lire, and I will make an everlasting covenant with you, the faithful mercies of David."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ecce testem populis dedi eum ducem ac praeceptorem gentibus"
      en: "Behold I have given him for a witness to the people, for a leader and a master to the Gentiles."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ecce gentem quam nesciebas vocabis et gentes quae non cognoverunt te ad te current propter Dominum Deum tuum et Sanctum Israhel quia glorificavit te"
      en: "Behold thou shalt call a nation, which thou knewest not: and the nations that knew not thee shall run to thee, because of the Lord thy God, and for the Holy One of Israel, for he hath glorified thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quaerite Dominum dum inveniri potest invocate eum dum prope est"
      en: "Seek ye the Lord, while he may be found: call upon him, while he is near."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "derelinquat impius viam suam et vir iniquus cogitationes suas et revertatur ad Dominum et miserebitur eius et ad Deum nostrum quoniam multus est ad ignoscendum"
      en: "Let the wicked forsake his way, and the unjust man his thoughts, and let him return to the Lord, and he will have mercy on him, and to our God: for he is bountiful to forgive."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "non enim cogitationes meae cogitationes vestrae neque viae vestrae viae meae dicit Dominus"
      en: "For my thoughts are not your thoughts: nor your ways my ways, saith the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quia sicut exaltantur caeli a terra sic exaltatae sunt viae meae a viis vestris et cogitationes meae a cogitationibus vestris"
      en: "For as the heavens are exalted above the earth, so are my ways exalted above your ways, and my thoughts above your thoughts."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et quomodo descendit imber et nix de caelo et illuc ultra non revertitur sed inebriat terram et infundit eam et germinare eam facit et dat semen serenti et panem comedenti"
      en: "And as the rain and the snow come down from heaven, and return no more thither, but soak the earth, and water it, and make it to spring, and give seed to the sower, and bread to the eater:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sic erit verbum meum quod egredietur de ore meo non revertetur ad me vacuum sed faciet quaecumque volui et prosperabitur in his ad quae misi illud"
      en: "So shall my word be, which shall go forth from my mouth: it shall not return to me void, but it shall do whatsoever I please, and shall prosper in the things for which I sent it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quia in laetitia egrediemini et in pace deducemini montes et colles cantabunt coram vobis laudem et omnia ligna regionis plaudent manu"
      en: "For you shall go out with joy, and be led forth with peace: the mountains and the hills shall sing praise before yen, and all the trees of the country shah clap their hands."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "pro saliunca ascendet abies et pro urtica crescet myrtus et erit Dominus nominatus in signum aeternum quod non auferetur"
      en: "Instead of the shrub, shall come up the fir tree, and instead of the nettle, shall come up the myrtle tree: and the Lord shall be named for an everlasting sign, that shall not be taken away."
    status: { la: verified, en: verified }
