# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2esdr
chapter: 6
verses:
  - n: 1
    text:
      la: "Factum est autem, cum audisset Sanaballat, et Tobias, et Gossem Arabs, et ceteri inimici nostri, quod aedificassem ego murum, et non esset in ipso residua interruptio ( usque ad tempus autem illud valvas non posueram in portis),"
      en: "And it came to pass, when Sanaballat, and Tobias, and Gossem the Arabian, and the rest of our enemies, heard that I had built the wall, and that there was no breach left in it, (though at that time I had not set up the doors in the gates,)"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "miserunt Sanaballat et Gossem ad me, dicentes: Veni, et percutiamus foedus pariter in viculis in campo Ono. Ipsi autem cogitabant ut facerent mihi malum."
      en: "Sanaballat and Gossem sent to me, saying: Come, and let us make a league together in the villages, in the plain of Ono. But they thought to do me mischief."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Misi ergo ad eos nuntios, dicens: Opus grande ego facio, et non possum descendere: ne forte negligatur cum venero, et descendero ad vos."
      en: "And I sent messengers to them, saying: I am doing a great work, and I cannot come down, lest it be neglected whilst I come, and go down to you."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Miserunt autem ad me secundum verbum hoc per quatuor vices: et respondi eis juxta sermonem priorem."
      en: "And they sent to me according to this word, four times: and I answered them after the same manner."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et misit ad me Sanaballat juxta verbum prius quinta vice puerum suum, et epistolam habebat in manu sua scriptam hoc modo:"
      en: "And Sanaballat sent his servant to me the fifth time according to the former word, and he had a letter in his hand written in this manner:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "In gentibus auditum est, et Gossem dixit, quod tu et Judaei cogitetis rebellare, et propterea aedifices murum, et levare te velis super eos regem: propter quam causam"
      en: "It is reported amongst the Gentiles, and Gossem hath said it, that thou and the Jews think to rebel, and therefore thou buildest the wall, and hast a mind to set thyself king over them: for which end"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et prophetas posueris, qui praedicent de te in Jerusalem, dicentes: Rex in Judaea est. Auditurus est rex verba haec: idcirco nunc veni, ut ineamus consilium pariter."
      en: "Thou hast also set up prophets, to preach of thee at Jerusalem, saying: There is a king in Judea. The king will hear of these things: therefore come now, that we may take counsel together."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et misi ad eos, dicens: Non est factum secundum verba haec, quae tu loqueris: de corde enim tuo tu componis haec."
      en: "And I sent to them, saying: There is no such thing done as thou sayest: but thou feignest these things out of thy own heart."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Omnes enim hi terrebant nos, cogitantes quod cessarent manus nostrae ab opere, et quiesceremus: quam ob causam magis confortavi manus meas."
      en: "For all these men thought to frighten us, thinking that our hands would cease from the work, and that we would leave off. Wherefore I strengthened my hands the more:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et ingressus sum domum Semaiae filii Dalaiae filii Metabeel secreto. Qui ait: Tractemus nobiscum in domo Dei in medio templi, et claudamus portas aedis: quia venturi sunt ut interficiant te, et nocte venturi sunt ad occidendum te."
      en: "And I went into the house of Samaia the son of Delaia, the son of Metabeel privately. And he said: Let us consult together in the house of God in the midst of the temple: and let us shut the doors of the temple, for they will come to kill thee, and in the night they will come to slay thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et dixi: Num quisquam similis mei fugit? et quis ut ego ingredietur templum, et vivet? Non ingrediar."
      en: "And I said: Should such a man as I flee? and who is there that being as I am, would go into the temple, to save his life? I will not go in."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et intellexi quod Deus non misisset eum, sed quasi vaticinans locutus esset ad me, et Tobias et Sanaballat conduxissent eum."
      en: "And I understood that God had not sent him, but that he had spoken to me as if he had been prophesying, and Tobias, and Sanaballat had hired him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Acceperat enim pretium, ut territus facerem, et peccarem, et haberent malum, quod exprobrarent mihi."
      en: "For he had taken money, that I being afraid should do this thing, and sin, and they might have some evil to upbraid me withal."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Memento mei, Domine, pro Tobia et Sanaballat, juxta opera eorum talia: sed et Noadiae prophetae, et ceterorum prophetarum, qui terrebant me."
      en: "Remember me, O Lord, for Tobias and Sanaballat, according to their works of this kind: and Noadias the prophet, and the rest of the prophets that would have put me in fear."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Completus est autem murus vigesimo quinto die mensis Elul, quinquaginta duobus diebus."
      en: "But the wall was finished the five and twentieth day of the month of Elul, in two and fifty days."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Factum est ergo cum audissent omnes inimici nostri, ut timerent universae gentes, quae erant in circuitu nostro, et conciderent intra semetipsos, et scirent quod a Deo factum esset opus hoc."
      en: "And it came to pass when all our enemies heard of it, that all nations which were round about us, were afraid, and were cast down within themselves, for they perceived that this work was the work of God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Sed et in diebus illis multae optimatum Judaeorum epistolae mittebantur ad Tobiam, et a Tobia veniebant ad eos."
      en: "Moreover in those days many letters were sent by the principal men of the Jews to Tobias, and from Tobias there came letters to them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Multi enim erant in Judaea habentes juramentum ejus, quia gener erat Secheniae filii Area, et Johanan filius ejus acceperat filiam Mosollam filii Barachiae:"
      en: "For there were many in Judea sworn to him, because he was the son in law of Sechenias the son of Area, and Johanan his son had taken to wife the daughter of Mosollam the son of Barachias."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "sed et laudabant eum coram me, et verba mea nuntiabant ei: et Tobias mittebat epistolas ut terreret me."
      en: "And they praised him also before me, and they related my words to him: And Tobias sent letters to put me in fear."
    status: { la: verified, en: verified }
