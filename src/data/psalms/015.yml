# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 15
verses:
  - n: 1
    text:
      la: "Consérva me, Dómine, quóniam sperávi in te. ‡ Dixi Dómino: Deus meus es tu, * quóniam bonórum meórum non eges."
      en: "Preserve me, O Lord, for I have put my trust in thee. ‡ I have said to the Lord, thou art my God, * for thou hast no need of my goods."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Sanctis, qui sunt in terra ejus, * mirificávit omnes voluntátes meas in eis."
      en: "To the saints, who are in his land, * he hath made wonderful all my desires in them."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Multiplicátæ sunt infirmitátes eórum: * póstea acceleravérunt."
      en: "Their infirmities were multiplied: * afterwards they made haste."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Non congregábo conventícula eórum de sanguínibus, * nec memor ero nóminum eórum per lábia mea."
      en: "I will not gather together their meetings for blood offerings: * nor will I be mindful of their names by my lips."
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Dóminus pars hereditátis meæ, et cálicis mei: * tu es, qui restítues hereditátem meam mihi."
      en: "The Lord is the portion of my inheritance and of my cup: * it is thou that wilt restore my inheritance to me."
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Funes cecidérunt mihi in præcláris: * étenim heréditas mea præclára est mihi."
      en: "The lines are fallen unto me in goodly places: * for my inheritance is goodly to me."
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Benedícam Dóminum, qui tríbuit mihi intelléctum: * ínsuper et usque ad noctem increpuérunt me renes mei."
      en: "I will bless the Lord, who hath given me understanding: * moreover my reins also have corrected me even till night."
    status:
      la: verified
      en: verified
  - n: 8
    text:
      la: "Providébam Dóminum in conspéctu meo semper: * quóniam a dextris est mihi, ne commóvear."
      en: "I set the Lord always in my sight: * for he is at my right hand, that I be not moved."
    status:
      la: verified
      en: verified
  - n: 9
    text:
      la: "Propter hoc lætátum est cor meum, et exsultávit lingua mea: * ínsuper et caro mea requiéscet in spe."
      en: "Therefore my heart hath been glad, and my tongue hath rejoiced: * moreover my flesh also shall rest in hope."
    status:
      la: verified
      en: verified
  - n: 10
    text:
      la: "Quóniam non derelínques ánimam meam in inférno: * nec dabis sanctum tuum vidére corruptiónem."
      en: "Because thou wilt not leave my soul in hell; * nor wilt thou give thy holy one to see corruption."
    status:
      la: verified
      en: verified
  - n: 11
    text:
      la: "Notas mihi fecísti vias vitæ, † adimplébis me lætítia cum vultu tuo: * delectatiónes in déxtera tua usque in finem."
      en: "Thou hast made known to me the ways of life, † thou shalt fill me with joy with thy countenance: * at thy right hand are delights even to the end."
    status:
      la: verified
      en: verified
