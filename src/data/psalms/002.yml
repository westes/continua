# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 2
verses:
  - n: 1
    text:
      la: "Quare fremuérunt gentes: * et pópuli meditáti sunt inánia?"
      en: "Why have the Gentiles raged, * and the people devised vain things?"
    status:
      la: verified
      en: verified
  - n: 2
    text:
      la: "Astitérunt reges terræ, et príncipes convenérunt in unum * advérsus Dóminum, et advérsus Christum ejus."
      en: "The kings of the earth stood up, and the princes met together, * against the Lord and against his Christ."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Dirumpámus víncula eórum: * et proiciámus a nobis jugum ipsórum."
      en: "Let us break their bonds asunder: * and let us cast away their yoke from us."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Qui hábitat in cælis, irridébit eos: * et Dóminus subsannábit eos."
      en: "He that dwelleth in heaven shall laugh at them: * and the Lord shall deride them."
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Tunc loquétur ad eos in ira sua, * et in furóre suo conturbábit eos."
      en: "Then shall he speak to them in his anger, * and trouble them in his rage."
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Ego autem constitútus sum Rex ab eo super Sion montem sanctum ejus, * prǽdicans præcéptum ejus."
      en: "But I am appointed king by him over Sion his holy mountain, * preaching his commandment."
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Dóminus dixit ad me: * Fílius meus es tu, ego hódie génui te."
      en: "The Lord hath said to me: * Thou art my son, this day have I begotten thee."
    status:
      la: verified
      en: verified
  - n: 8
    text:
      la: "Póstula a me, et dabo tibi gentes hereditátem tuam, * et possessiónem tuam términos terræ."
      en: "Ask of me, and I will give thee the Gentiles for thy inheritance, * and the utmost parts of the earth for thy possession."
    status:
      la: verified
      en: verified
  - n: 9
    text:
      la: "Reges eos in virga férrea, * et tamquam vas fíguli confrínges eos."
      en: "Thou shalt rule them with a rod of iron, * and shalt break them in pieces like a potter’s vessel."
    status:
      la: verified
      en: verified
  - n: 10
    text:
      la: "Et nunc, reges, intellégite: * erudímini, qui judicátis terram."
      en: "And now, O ye kings, understand: * receive instruction, you that judge the earth."
    status:
      la: verified
      en: verified
  - n: 11
    text:
      la: "Servíte Dómino in timóre: * et exsultáte ei cum tremóre."
      en: "Serve ye the Lord with fear: * and rejoice unto him with trembling."
    status:
      la: verified
      en: verified
  - n: 12
    text:
      la: "Apprehéndite disciplínam, nequándo irascátur Dóminus, * et pereátis de via justa."
      en: "Embrace discipline, lest at any time the Lord be angry, * and you perish from the just way."
    status:
      la: verified
      en: verified
  - n: 13
    text:
      la: "Cum exárserit in brevi ira ejus: * beáti omnes qui confídunt in eo."
      en: "When his wrath shall be kindled in a short time, * blessed are all they that trust in him."
    status:
      la: verified
      en: verified
