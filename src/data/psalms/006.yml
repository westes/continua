# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 6
verses:
  - n: 2
    text:
      la: "Dómine, ne in furóre tuo árguas me, * neque in ira tua corrípias me."
      en: "Lord, rebuke me not in thy indignation, * nor chastise me in thy wrath."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Miserére mei, Dómine, quóniam infírmus sum: * sana me, Dómine, quóniam conturbáta sunt ossa mea."
      en: "Have mercy on me, O Lord, for I am weak: * heal me, O Lord, for my bones are troubled."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Et ánima mea turbáta est valde: * sed tu, Dómine, úsquequo?"
      en: "And my soul is troubled exceedingly: * but thou, O Lord, how long?"
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Convértere, Dómine, et éripe ánimam meam: * salvum me fac propter misericórdiam tuam."
      en: "Turn to me, O Lord, and deliver my soul: * O save me for thy mercy’s sake."
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Quóniam non est in morte qui memor sit tui: * in inférno autem quis confitébitur tibi?"
      en: "For there is no one in death, that is mindful of thee: * and who shall confess to thee in hell?"
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Laborávi in gémitu meo, † lavábo per síngulas noctes lectum meum: * lácrimis meis stratum meum rigábo."
      en: "I have laboured in my groanings, † every night I will wash my bed: * I will water my couch with my tears."
    status:
      la: verified
      en: verified
  - n: 8
    text:
      la: "Turbátus est a furóre óculus meus: * inveterávi inter omnes inimícos meos."
      en: "My eye is troubled through indignation: * I have grown old amongst all my enemies."
    status:
      la: verified
      en: verified
  - n: 9
    text:
      la: "Discédite a me, omnes, qui operámini iniquitátem: * quóniam exaudívit Dóminus vocem fletus mei."
      en: "Depart from me, all ye workers of iniquity: * for the Lord hath heard the voice of my weeping."
    status:
      la: verified
      en: verified
  - n: 10
    text:
      la: "Exaudívit Dóminus deprecatiónem meam, * Dóminus oratiónem meam suscépit."
      en: "The Lord hath heard my supplication: * the Lord hath received my prayer."
    status:
      la: verified
      en: verified
  - n: 11
    text:
      la: "Erubéscant, et conturbéntur veheménter omnes inimíci mei: * convertántur et erubéscant valde velóciter."
      en: "Let all my enemies be ashamed, and be very much troubled: * let them be turned back, and be ashamed very speedily."
    status:
      la: verified
      en: verified
