# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 10
verses:
  - n: 2
    text:
      la: "In Dómino confído: † quómodo dícitis ánimæ meæ: * Tránsmigra in montem sicut passer?"
      en: "In the Lord I put my trust: † how then do you say to my soul: * Get thee away from hence to the mountain, like a sparrow?"
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Quóniam ecce peccatóres intendérunt arcum, † paravérunt sagíttas suas in pháretra, * ut sagíttent in obscúro rectos corde."
      en: "For, lo, the wicked have bent their bow: † they have prepared their arrows in the quiver, * to shoot in the dark the upright of heart."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Quóniam quæ perfecísti, destruxérunt: * justus autem quid fecit?"
      en: "For they have destroyed the things which thou hast made: * but what has the just man done?"
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Dóminus in templo sancto suo, * Dóminus in cælo sedes ejus."
      en: "The Lord is in his holy temple, * the Lord’s throne is in heaven."
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Óculi ejus in páuperem respíciunt: * pálpebræ ejus intérrogant fílios hóminum."
      en: "His eyes look on the poor man: * his eyelids examine the sons of men."
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Dóminus intérrogat justum et ímpium: * qui autem díligit iniquitátem, odit ánimam suam."
      en: "The Lord trieth the just and the wicked: * but he that loveth iniquity, hateth his own soul."
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Pluet super peccatóres láqueos: * ignis, et sulphur, et spíritus procellárum pars cálicis eórum."
      en: "He shall rain snares upon sinners: * fire and brimstone, and storms of winds, shall be the portion of their cup."
    status:
      la: verified
      en: verified
  - n: 8
    text:
      la: "Quóniam justus Dóminus, et justítias diléxit: * æquitátem vidit vultus ejus."
      en: "For the Lord is just, and hath loved justice: * his countenance hath beheld righteousness."
    status:
      la: verified
      en: verified
