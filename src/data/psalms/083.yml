      en: verified
  - n: 4
    text:
      la: "Étenim passer invénit sibi domum: * et turtur nidum sibi, ubi ponat pullos suos."
      en: "For the sparrow hath found herself a house, * and the turtledove a nest for herself where she may lay her young ones:"
