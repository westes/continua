# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 12
verses:
  - n: 1
    text:
      la: "Úsquequo, Dómine, obliviscéris me in finem? * Úsquequo avértis fáciem tuam a me?"
      en: "How long, O Lord, wilt thou forget me unto the end? * how long dost thou turn away thy face from me?"
    status:
      la: verified
      en: verified
  - n: 2
    text:
      la: "Quámdiu ponam consília in ánima mea, * dolórem in corde meo per diem?"
      en: "How long shall I take counsels in my soul, * sorrow in my heart all the day?"
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Úsquequo exaltábitur inimícus meus super me? * réspice, et exáudi me, Dómine, Deus meus."
      en: "How long shall my enemy be exalted over me? * Consider, and hear me, O Lord my God."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Illúmina óculos meos ne umquam obdórmiam in morte: * nequándo dicat inimícus meus: Præválui advérsus eum."
      en: "Enlighten my eyes that I never sleep in death: * lest at any time my enemy say: I have prevailed against him."
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Qui tríbulant me, exsultábunt si motus fúero: * ego autem in misericórdia tua sperávi."
      en: "They that trouble me will rejoice when I am moved: * but I have trusted in thy mercy."
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Exsultábit cor meum in salutári tuo: † cantábo Dómino qui bona tríbuit mihi: * et psallam nómini Dómini altíssimi."
      en: "My heart shall rejoice in thy salvation: † I will sing to the Lord, who giveth me good things: * yea, I will sing to the name of the Lord the most High."
    status:
      la: verified
      en: verified
