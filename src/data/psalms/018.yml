# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 18
verses:
  - n: 2
    text:
      la: "Cæli enárrant glóriam Dei: * et ópera mánuum ejus annúntiat firmaméntum."
      en: "The heavens shew forth the glory of God, * and the firmament declareth the work of his hands."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Dies diéi erúctat verbum, * et nox nocti índicat sciéntiam."
      en: "Day to day uttereth speech, * and night to night sheweth knowledge."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Non sunt loquélæ, neque sermónes, * quorum non audiántur voces eórum."
      en: "There are no speeches nor languages, * where their voices are not heard."
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "In omnem terram exívit sonus eórum: * et in fines orbis terræ verba eórum."
      en: "Their sound hath gone forth into all the earth: * and their words unto the ends of the world."
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "In sole pósuit tabernáculum suum: * et ipse tamquam sponsus procédens de thálamo suo:"
      en: "He hath set his tabernacle in the sun: * and he, as a bridegroom coming out of his bride chamber,"
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Exsultávit ut gigas ad curréndam viam, * a summo cælo egréssio ejus:"
      en: "Hath rejoiced as a giant to run the way: * his going out is from the end of heaven,"
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Et occúrsus ejus usque ad summum ejus: * nec est qui se abscóndat a calóre ejus."
      en: "And his circuit even to the end thereof: * and there is no one that can hide himself from his heat."
    status:
      la: verified
      en: verified
  - n: 8
    text:
      la: "Lex Dómini immaculáta, convértens ánimas: * testimónium Dómini fidéle, sapiéntiam præstans párvulis."
      en: "The law of the Lord is unspotted, converting souls: * the testimony of the Lord is faithful, giving wisdom to little ones."
    status:
      la: verified
      en: verified
  - n: 9
    text:
      la: "Justítiæ Dómini rectæ, lætificántes corda: * præcéptum Dómini lúcidum, illúminans óculos."
      en: "The justices of the Lord are right, rejoicing hearts: * the commandment of the Lord is lightsome, enlightening the eyes."
    status:
      la: verified
      en: verified
  - n: 10
    text:
      la: "Timor Dómini sanctus, pérmanens in sǽculum sǽculi: * judícia Dómini vera, justificáta in semetípsa."
      en: "The fear of the Lord is holy, enduring for ever and ever: * the judgments of the Lord are true, justified in themselves."
    status:
      la: verified
      en: verified
  - n: 11
    text:
      la: "Desiderabília super aurum et lápidem pretiósum multum: * et dulcióra super mel et favum."
      en: "More to be desired than gold and many precious stones: * and sweeter than honey and the honeycomb."
    status:
      la: verified
      en: verified
  - n: 12
    text:
      la: "Étenim servus tuus custódit ea, * in custodiéndis illis retribútio multa."
      en: "For thy servant keepeth them, * and in keeping them there is a great reward."
    status:
      la: verified
      en: verified
  - n: 13
    text:
      la: "Delícta quis intéllegit? † ab occúltis meis munda me: * et ab aliénis parce servo tuo."
      en: "Who can understand sins? † from my secret ones cleanse me, O Lord: * and from those of others spare thy servant."
    status:
      la: verified
      en: verified
  - n: 14
    text:
      la: "Si mei non fúerint domináti, tunc immaculátus ero: * et emundábor a delícto máximo."
      en: "If they shall have no dominion over me, then shall I be without spot: * and I shall be cleansed from the greatest sin."
    status:
      la: verified
      en: verified
  - n: 15
    text:
      la: "Et erunt ut compláceant elóquia oris mei: * et meditátio cordis mei in conspéctu tuo semper."
      en: "And the words of my mouth shall be such as may please: * and the meditation of my heart always in thy sight."
    status:
      la: verified
      en: verified
  - n: 15
    text:
      la: "Dómine, adjútor meus, * et redémptor meus."
      en: "O Lord, my helper, * and my redeemer."
    status:
      la: verified
      en: verified
