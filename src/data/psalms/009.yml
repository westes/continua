# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 9
verses:
  - n: 2
    text:
      la: "Confitébor tibi, Dómine, in toto corde meo: * narrábo ómnia mirabília tua."
      en: "I will give praise to thee, O Lord, with my whole heart: * I will relate all thy wonders."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Lætábor et exsultábo in te: * psallam nómini tuo, Altíssime."
      en: "I will be glad and rejoice in thee: * I will sing to thy name, O thou most high."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "In converténdo inimícum meum retrórsum: * infirmabúntur, et períbunt a fácie tua."
      en: "When my enemy shall be turned back: * they shall be weakened and perish before thy face."
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Quóniam fecísti judícium meum et causam meam: * sedísti super thronum, qui júdicas justítiam."
      en: "For thou hast maintained my judgment and my cause: * thou hast sat on the throne, who judgest justice."
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Increpásti gentes, et périit ímpius: * nomen eórum delésti in ætérnum, et in sǽculum sǽculi."
      en: "Thou hast rebuked the Gentiles, and the wicked one hath perished: * thou hast blotted out their name for ever and ever."
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Inimíci defecérunt frámeæ in finem: * et civitátes eórum destruxísti."
      en: "The swords of the enemy have failed unto the end: * and their cities thou hast destroyed."
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Périit memória eórum cum sónitu: * et Dóminus in ætérnum pérmanet."
      en: "Their memory hath perished with a noise. * But the Lord remaineth for ever."
    status:
      la: verified
      en: verified
  - n: 8
    text:
      la: "Parávit in judício thronum suum: * et ipse judicábit orbem terræ in æquitáte, judicábit pópulos in justítia."
      en: "He hath prepared his throne in judgment: * And he shall judge the world in equity, he shall judge the people in justice."
    status:
      la: verified
      en: verified
  - n: 10
    text:
      la: "Et factus est Dóminus refúgium páuperi: * adjútor in opportunitátibus, in tribulatióne."
      en: "And the Lord is become a refuge for the poor: * a helper in due time in tribulation."
    status:
      la: verified
      en: verified
  - n: 11
    text:
      la: "Et sperent in te qui novérunt nomen tuum: * quóniam non dereliquísti quæréntes te, Dómine."
      en: "And let them trust in thee who know thy name: * for thou hast not forsaken them that seek thee, O Lord."
    status:
      la: verified
      en: verified
  - n: 12
    text:
      la: "Psállite Dómino, qui hábitat in Sion: * annuntiáte inter gentes stúdia ejus:"
      en: "Sing ye to the Lord, who dwelleth in Sion: * declare his ways among the Gentiles."
    status:
      la: verified
      en: verified
  - n: 13
    text:
      la: "Quóniam requírens sánguinem eórum recordátus est: * non est oblítus clamórem páuperum."
      en: "For requiring their blood he hath remembered them: * he hath not forgotten the cry of the poor."
    status:
      la: verified
      en: verified
  - n: 14
    text:
      la: "Miserére mei, Dómine: * vide humilitátem meam de inimícis meis."
      en: "Have mercy on me, O Lord: * see my humiliation which I suffer from my enemies."
    status:
      la: verified
      en: verified
  - n: 15
    text:
      la: "Qui exáltas me de portis mortis, * ut annúntiem omnes laudatiónes tuas in portis fíliæ Sion."
      en: "Thou that liftest me up from the gates of death, * that I may declare all thy praises in the gates of the daughter of Sion."
    status:
      la: verified
      en: verified
  - n: 16
    text:
      la: "Exsultábo in salutári tuo: * infíxæ sunt gentes in intéritu, quem fecérunt."
      en: "I will rejoice in thy salvation: * the Gentiles have stuck fast in the destruction which they have prepared."
    status:
      la: verified
      en: verified
  - n: 16
    text:
      la: "In láqueo isto, quem abscondérunt, * comprehénsus est pes eórum."
      en: "Their foot hath been taken * in the very snare which they hid."
    status:
      la: verified
      en: verified
  - n: 17
    text:
      la: "Cognoscétur Dóminus judícia fáciens: * in opéribus mánuum suárum comprehénsus est peccátor."
      en: "The Lord shall be known when he executeth judgments: * the sinner hath been caught in the works of his own hands."
    status:
      la: verified
      en: verified
  - n: 18
    text:
      la: "Convertántur peccatóres in inférnum, * omnes gentes quæ obliviscúntur Deum."
      en: "The wicked shall be turned into hell, * all the nations that forget God."
    status:
      la: verified
      en: verified
  - n: 19
    text:
      la: "Quóniam non in finem oblívio erit páuperis: * patiéntia páuperum non períbit in finem."
      en: "For the poor man shall not be forgotten to the end: * the patience of the poor shall not perish for ever."
    status:
      la: verified
      en: verified
  - n: 20
    text:
      la: "Exsúrge, Dómine, non confortétur homo: * judicéntur gentes in conspéctu tuo."
      en: "Arise, O Lord, let not man be strengthened: * let the Gentiles be judged in thy sight."
    status:
      la: verified
      en: verified
  - n: 21
    text:
      la: "Constítue, Dómine, legislatórem super eos: * ut sciant gentes quóniam hómines sunt."
      en: "Appoint, O Lord, a lawgiver over them: * that the Gentiles may know themselves to be but men."
    status:
      la: verified
      en: verified
  - n: 22
    text:
      la: "Ut quid, Dómine, recessísti longe, * déspicis in opportunitátibus, in tribulatióne?"
      en: "Why, O Lord, hast thou retired afar off? * why dost thou slight us in our wants, in the time of trouble?"
    status:
      la: verified
      en: verified
  - n: 23
    text:
      la: "Dum supérbit ímpius, incénditur pauper: * comprehendúntur in consíliis quibus cógitant."
      en: "Whilst the wicked man is proud, the poor is set on fire: * they are caught in the counsels which they devise."
    status:
      la: verified
      en: verified
  - n: 24
    text:
      la: "Quóniam laudátur peccátor in desidériis ánimæ suæ: * et iníquus benedícitur."
      en: "For the sinner is praised in the desires of his soul: * and the unjust man is blessed."
    status:
      la: verified
      en: verified
  - n: 25
    text:
      la: "Exacerbávit Dóminum peccátor, * secúndum multitúdinem iræ suæ non quæret."
      en: "The sinner hath provoked the Lord, * according to the multitude of his wrath he will not seek him."
    status:
      la: verified
      en: verified
  - n: 26
    text:
      la: "Non est Deus in conspéctu ejus: * inquinátæ sunt viæ illíus in omni témpore."
      en: "God is not before his eyes: * his ways are filthy at all times."
    status:
      la: verified
      en: verified
  - n: 26
    text:
      la: "Auferúntur judícia tua a fácie ejus: * ómnium inimicórum suórum dominábitur."
      en: "Thy judgments are removed from his sight: * he shall rule over all his enemies."
    status:
      la: verified
      en: verified
  - n: 27
    text:
      la: "Dixit enim in corde suo: * Non movébor a generatióne in generatiónem sine malo."
      en: "For he hath said in his heart: * I shall not be moved from generation to generation, and shall be without evil."
    status:
      la: verified
      en: verified
  - n: 28
    text:
      la: "Cujus maledictióne os plenum est, et amaritúdine, et dolo: * sub lingua ejus labor et dolor."
      en: "His mouth is full of cursing, and of bitterness, and of deceit: * under his tongue are labour and sorrow."
    status:
      la: verified
      en: verified
  - n: 29
    text:
      la: "Sedet in insídiis cum divítibus in occúltis: * ut interfíciat innocéntem."
      en: "He sitteth in ambush with the rich, in private places, * that he may kill the innocent."
    status:
      la: verified
      en: verified
  - n: 30
    text:
      la: "Óculi ejus in páuperem respíciunt: * insidiátur in abscóndito, quasi leo in spelúnca sua."
      en: "His eyes are upon the poor man: * he lieth in wait, in secret, like a lion in his den."
    status:
      la: verified
      en: verified
  - n: 30
    text:
      la: "Insidiátur ut rápiat páuperem: * rápere páuperem, dum áttrahit eum."
      en: "He lieth in ambush, that he may catch the poor man: * so catch the poor, whilst he draweth him to him."
    status:
      la: verified
      en: verified
  - n: 31
    text:
      la: "In láqueo suo humiliábit eum: * inclinábit se, et cadet, cum dominátus fúerit páuperum."
      en: "In his net he will bring him down, * he will crouch and fall, when he shall have power over the poor."
    status:
      la: verified
      en: verified
  - n: 32
    text:
      la: "Dixit enim in corde suo: Oblítus est Deus, * avértit fáciem suam ne vídeat in finem."
      en: "For he hath said in his heart: God hath forgotten, * he hath turned away his face, not to see to the end."
    status:
      la: verified
      en: verified
  - n: 33
    text:
      la: "Exsúrge, Dómine Deus, exaltétur manus tua: * ne obliviscáris páuperum."
      en: "Arise, O Lord God, let thy hand be exalted: * forget not the poor."
    status:
      la: verified
      en: verified
  - n: 34
    text:
      la: "Propter quid irritávit ímpius Deum? * dixit enim in corde suo: Non requíret."
      en: "Wherefore hath the wicked provoked God? * for he hath said in his heart: He will not require it."
    status:
      la: verified
      en: verified
  - n: 35
    text:
      la: "Vides quóniam tu labórem et dolórem consíderas: * ut tradas eos in manus tuas."
      en: "Thou seest it, for thou considerest labour and sorrow: * that thou mayst deliver them into thy hands."
    status:
      la: verified
      en: verified
  - n: 35
    text:
      la: "Tibi derelíctus est pauper: * órphano tu eris adjútor."
      en: "To thee is the poor man left: * thou wilt be a helper to the orphan."
    status:
      la: verified
      en: verified
  - n: 36
    text:
      la: "Cóntere brácchium peccatóris et malígni: * quærétur peccátum illíus, et non inveniétur."
      en: "Break thou the arm of the sinner and of the malignant: * his sin shall be sought, and shall not be found."
    status:
      la: verified
      en: verified
  - n: 37
    text:
      la: "Dóminus regnábit in ætérnum, et in sǽculum sǽculi: * períbitis, gentes, de terra illíus."
      en: "The Lord shall reign to eternity, yea, for ever and ever: * ye Gentiles shall perish from his land."
    status:
      la: verified
      en: verified
  - n: 38
    text:
      la: "Desidérium páuperum exaudívit Dóminus: * præparatiónem cordis eórum audívit auris tua."
      en: "The Lord hath heard the desire of the poor: * thy ear hath heard the preparation of their heart."
    status:
      la: verified
      en: verified
  - n: 39
    text:
      la: "Judicáre pupíllo et húmili, * ut non appónat ultra magnificáre se homo super terram."
      en: "To judge for the fatherless and for the humble, * that man may no more presume to magnify himself upon earth."
    status:
      la: verified
      en: verified
