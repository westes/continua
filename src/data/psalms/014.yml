# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 14
verses:
  - n: 1
    text:
      la: "Dómine, quis habitábit in tabernáculo tuo? * aut quis requiéscet in monte sancto tuo?"
      en: "Lord, who shall dwell in thy tabernacle? * or who shall rest in thy holy hill?"
    status:
      la: verified
      en: verified
  - n: 2
    text:
      la: "Qui ingréditur sine mácula, * et operátur justítiam:"
      en: "He that walketh without blemish, * and worketh justice:"
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Qui lóquitur veritátem in corde suo, * qui non egit dolum in lingua sua:"
      en: "He that speaketh truth in his heart, * who hath not used deceit in his tongue:"
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Nec fecit próximo suo malum, * et oppróbrium non accépit advérsus próximos suos."
      en: "Nor hath done evil to his neighbour: * nor taken up a reproach against his neighbours."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Ad níhilum dedúctus est in conspéctu ejus malígnus: * timéntes autem Dóminum gloríficat:"
      en: "In his sight the malignant is brought to nothing: * but he glorifieth them that fear the Lord:"
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Qui jurat próximo suo, et non décipit, * qui pecúniam suam non dedit ad usúram, et múnera super innocéntem non accépit."
      en: "He that sweareth to his neighbour, and deceiveth not; * He that hath not put out his money to usury, nor taken bribes against the innocent:"
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Qui facit hæc: * non movébitur in ætérnum."
      en: "He that doth these things, * shall not be moved for ever."
    status:
      la: verified
      en: verified
