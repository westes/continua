# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 19
verses:
  - n: 2
    text:
      la: "Exáudiat te Dóminus in die tribulatiónis: * prótegat te nomen Dei Jacob."
      en: "May the Lord hear thee in the day of tribulation: * may the name of the God of Jacob protect thee."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Mittat tibi auxílium de sancto: * et de Sion tueátur te."
      en: "May he send thee help from the sanctuary: * and defend thee out of Sion."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Memor sit omnis sacrifícii tui: * et holocáustum tuum pingue fiat."
      en: "May he be mindful of all thy sacrifices: * and may thy whole burnt offering be made fat."
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Tríbuat tibi secúndum cor tuum: * et omne consílium tuum confírmet."
      en: "May he give thee according to thy own heart; * and confirm all thy counsels."
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Lætábimur in salutári tuo: * et in nómine Dei nostri magnificábimur."
      en: "We will rejoice in thy salvation; * and in the name of our God we shall be exalted."
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Ímpleat Dóminus omnes petitiónes tuas: * nunc cognóvi quóniam salvum fecit Dóminus Christum suum."
      en: "The Lord fulfil all thy petitions: * now have I known that the Lord hath saved his anointed."
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Exáudiet illum de cælo sancto suo: * in potentátibus salus déxteræ ejus."
      en: "He will hear him from his holy heaven: * the salvation of his right hand is in powers."
    status:
      la: verified
      en: verified
  - n: 8
    text:
      la: "Hi in cúrribus, et hi in equis: * nos autem in nómine Dómini, Dei nostri invocábimus."
      en: "Some trust in chariots, and some in horses: * but we will call upon the name of the Lord, our God."
    status:
      la: verified
      en: verified
  - n: 9
    text:
      la: "Ipsi obligáti sunt, et cecidérunt: * nos autem surréximus et erécti sumus."
      en: "They are bound, and have fallen: * but we are risen, and are set upright."
    status:
      la: verified
      en: verified
  - n: 10
    text:
      la: "Dómine, salvum fac regem: * et exáudi nos in die, qua invocavérimus te."
      en: "O Lord, save the king: * and hear us in the day that we shall call upon thee."
    status:
      la: verified
      en: verified
