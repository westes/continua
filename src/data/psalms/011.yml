# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 11
verses:
  - n: 2
    text:
      la: "Salvum me fac, Dómine, quóniam defécit sanctus: * quóniam diminútæ sunt veritátes a fíliis hóminum."
      en: "Save me, O Lord, for there is now no saint: * truths are decayed from among the children of men."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Vana locúti sunt unusquísque ad próximum suum: * lábia dolósa, in corde et corde locúti sunt."
      en: "They have spoken vain things every one to his neighbour: * with deceitful lips, and with a double heart have they spoken."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Dispérdat Dóminus univérsa lábia dolósa, * et linguam magníloquam."
      en: "May the Lord destroy all deceitful lips, * and the tongue that speaketh proud things."
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Qui dixérunt: Linguam nostram magnificábimus, † lábia nostra a nobis sunt, * quis noster Dóminus est?"
      en: "Who have said: We will magnify our tongue; † our lips are our own; * who is Lord over us?"
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Propter misériam ínopum, et gémitum páuperum, * nunc exsúrgam, dicit Dóminus."
      en: "By reason of the misery of the needy, and the groans of the poor, * now will I arise, saith the Lord."
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Ponam in salutári: * fiduciáliter agam in eo."
      en: "I will set him in safety; * I will deal confidently in his regard."
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Elóquia Dómini, elóquia casta: * argéntum igne examinátum, probátum terræ purgátum séptuplum."
      en: "The words of the Lord are pure words: * as silver tried by the fire, purged from the earth, refined seven times."
    status:
      la: verified
      en: verified
  - n: 8
    text:
      la: "Tu, Dómine, servábis nos: et custódies nos * a generatióne hac in ætérnum."
      en: "Thou, O Lord, wilt preserve us: and keep us * from this generation for ever."
    status:
      la: verified
      en: verified
  - n: 9
    text:
      la: "In circúitu ímpii ámbulant: * secúndum altitúdinem tuam multiplicásti fílios hóminum."
      en: "The wicked walk round about: * according to thy highness, thou hast multiplied the children of men."
    status:
      la: verified
      en: verified
