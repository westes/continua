# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 7
verses:
  - n: 2
    text:
      la: "Dómine, Deus meus, in te sperávi: * salvum me fac ex ómnibus persequéntibus me, et líbera me."
      en: "O Lord my God, in thee have I put my trust: * save me from all them that persecute me, and deliver me."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Nequándo rápiat ut leo ánimam meam, * dum non est qui rédimat, neque qui salvum fáciat."
      en: "Lest at any time he seize upon my soul like a lion, * while there is no one to redeem me, nor to save."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Dómine, Deus meus, si feci istud, * si est iníquitas in mánibus meis:"
      en: "O Lord my God, if I have done this thing, * if there be iniquity in my hands:"
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Si réddidi retribuéntibus mihi mala, * décidam mérito ab inimícis meis inánis."
      en: "If I have rendered to them that repaid me evils, * let me deservedly fall empty before my enemies."
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Persequátur inimícus ánimam meam, † et comprehéndat, et concúlcet in terra vitam meam, * et glóriam meam in púlverem dedúcat."
      en: "Let the enemy pursue my soul, † and take it, and tread down my life on the earth, * and bring down my glory to the dust."
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Exsúrge, Dómine, in ira tua: * et exaltáre in fínibus inimicórum meórum."
      en: "Rise up, O Lord, in thy anger: * and be thou exalted in the borders of my enemies."
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Et exsúrge, Dómine, Deus meus, in præcépto quod mandásti: * et synagóga populórum circúmdabit te."
      en: "And arise, O Lord my God, in the precept which thou hast commanded: * and a congregation of people shall surround thee."
    status:
      la: verified
      en: verified
  - n: 8
    text:
      la: "Et propter hanc in altum regrédere: * Dóminus júdicat pópulos."
      en: "And for their sakes return thou on high. * The Lord judgeth the people."
    status:
      la: verified
      en: verified
  - n: 9
    text:
      la: "Júdica me, Dómine, secúndum justítiam meam, * et secúndum innocéntiam meam super me."
      en: "Judge me, O Lord, according to my justice, * and according to my innocence in me."
    status:
      la: verified
      en: verified
  - n: 10
    text:
      la: "Consumétur nequítia peccatórum, et díriges justum, * scrutans corda et renes, Deus."
      en: "The wickedness of sinners shall be brought to nought: and thou shalt direct the just: * the searcher of hearts and reins is God."
    status:
      la: verified
      en: verified
  - n: 11
    text:
      la: "Justum adjutórium meum a Dómino, * qui salvos facit rectos corde."
      en: "Just is my help from the Lord: * who saveth the upright of heart."
    status:
      la: verified
      en: verified
  - n: 12
    text:
      la: "Deus judex justus, fortis, et pátiens: * numquid iráscitur per síngulos dies?"
      en: "God is a just judge, strong and patient: * is he angry every day?"
    status:
      la: verified
      en: verified
  - n: 13
    text:
      la: "Nisi convérsi fuéritis, gládium suum vibrábit: * arcum suum teténdit, et parávit illum."
      en: "Except you will be converted, he will brandish his sword: * he hath bent his bow, and made it ready."
    status:
      la: verified
      en: verified
  - n: 14
    text:
      la: "Et in eo parávit vasa mortis: * sagíttas suas ardéntibus effécit."
      en: "And in it he hath prepared the instruments of death, * he hath made ready his arrows for them that burn."
    status:
      la: verified
      en: verified
  - n: 15
    text:
      la: "Ecce, partúriit injustítiam: * concépit dolórem, et péperit iniquitátem."
      en: "Behold he hath been in labour with injustice; * he hath conceived sorrow, and brought forth iniquity."
    status:
      la: verified
      en: verified
  - n: 16
    text:
      la: "Lacum apéruit, et effódit eum: * et íncidit in fóveam quam fecit."
      en: "He hath opened a pit and dug it: * and he is fallen into the hole he made."
    status:
      la: verified
      en: verified
  - n: 17
    text:
      la: "Convertétur dolor ejus in caput ejus: * et in vérticem ipsíus iníquitas ejus descéndet."
      en: "His sorrow shall be turned on his own head: * and his iniquity shall come down upon his crown."
    status:
      la: verified
      en: verified
  - n: 18
    text:
      la: "Confitébor Dómino secúndum justítiam ejus: * et psallam nómini Dómini altíssimi."
      en: "I will give glory to the Lord according to his justice: * and will sing to the name of the Lord the most High."
    status:
      la: verified
      en: verified
