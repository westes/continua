# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 8
verses:
  - n: 2
    text:
      la: "Dómine, Dóminus noster, * quam admirábile est nomen tuum in univérsa terra!"
      en: "O Lord our Lord, * how admirable is thy name in the whole earth!"
    status:
      la: verified
      en: verified
  - n: 2
    text:
      la: "Quóniam eleváta est magnificéntia tua, * super cælos."
      en: "For thy magnificence is elevated * above the heavens."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Ex ore infántium et lacténtium perfecísti laudem propter inimícos tuos, * ut déstruas inimícum et ultórem."
      en: "Out of the mouth of infants and of sucklings thou hast perfected praise, because of thy enemies, * that thou mayst destroy the enemy and the avenger."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Quóniam vidébo cælos tuos, ópera digitórum tuórum: * lunam et stellas, quæ tu fundásti."
      en: "For I will behold thy heavens, the works of thy fingers: * the moon and the stars which thou hast founded."
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Quid est homo quod memor es ejus? * aut fílius hóminis, quóniam vísitas eum?"
      en: "What is man that thou art mindful of him? * or the son of man that thou visitest him?"
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Minuísti eum paulo minus ab Ángelis, † glória et honóre coronásti eum: * et constituísti eum super ópera mánuum tuárum."
      en: "Thou hast made him a little less than the angels, † thou hast crowned him with glory and honour: * and hast set him over the works of thy hands."
    status:
      la: verified
      en: verified
  - n: 8
    text:
      la: "Ómnia subjecísti sub pédibus ejus, * oves et boves univérsas: ínsuper et pécora campi."
      en: "Thou hast subjected all things under his feet, * all sheep and oxen: moreover the beasts also of the fields."
    status:
      la: verified
      en: verified
  - n: 9
    text:
      la: "Vólucres cæli, et pisces maris, * qui perámbulant sémitas maris."
      en: "The birds of the air, and the fishes of the sea, * that pass through the paths of the sea."
    status:
      la: verified
      en: verified
  - n: 10
    text:
      la: "Dómine, Dóminus noster, * quam admirábile est nomen tuum in univérsa terra!"
      en: "O Lord our Lord, * how admirable is thy name in all the earth!"
    status:
      la: verified
      en: verified
