# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 17
verses:
  - n: 2
    text:
      la: "Díligam te, Dómine, fortitúdo mea: * Dóminus firmaméntum meum, et refúgium meum, et liberátor meus."
      en: "I will love thee, O Lord, my strength: * The Lord is my firmament, my refuge, and my deliverer."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Deus meus adjútor meus, * et sperábo in eum."
      en: "My God is my helper, * and in him will I put my trust."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Protéctor meus, et cornu salútis meæ, * et suscéptor meus."
      en: "My protector, and the horn of my salvation, * and my support."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Laudans invocábo Dóminum: * et ab inimícis meis salvus ero."
      en: "Praising, I will call upon the Lord: * and I shall be saved from my enemies."
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Circumdedérunt me dolóres mortis: * et torréntes iniquitátis conturbavérunt me."
      en: "The sorrows of death surrounded me: * and the torrents of iniquity troubled me."
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Dolóres inférni circumdedérunt me: * præoccupavérunt me láquei mortis."
      en: "The sorrows of hell encompassed me: * and the snares of death prevented me."
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "In tribulatióne mea invocávi Dóminum, * et ad Deum meum clamávi."
      en: "In my affliction I called upon the Lord, * and I cried to my God:"
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Et exaudívit de templo sancto suo vocem meam: * et clamor meus in conspéctu ejus, introívit in aures ejus."
      en: "And he heard my voice from his holy temple: * and my cry before him came into his ears."
    status:
      la: verified
      en: verified
  - n: 8
    text:
      la: "Commóta est, et contrémuit terra: * fundaménta móntium conturbáta sunt, et commóta sunt, quóniam irátus est eis."
      en: "The earth shook and trembled: * the foundations of the mountains were troubled and were moved, because he was angry with them."
    status:
      la: verified
      en: verified
  - n: 9
    text:
      la: "Ascéndit fumus in ira ejus: † et ignis a fácie ejus exársit: * carbónes succénsi sunt ab eo."
      en: "There went up a smoke in his wrath: † and a fire flamed from his face: * coals were kindled by it."
    status:
      la: verified
      en: verified
  - n: 10
    text:
      la: "Inclinávit cælos, et descéndit: * et calígo sub pédibus ejus."
      en: "He bowed the heavens, and came down, * and darkness was under his feet."
    status:
      la: verified
      en: verified
  - n: 11
    text:
      la: "Et ascéndit super Chérubim, et volávit: * volávit super pennas ventórum."
      en: "And he ascended upon the cherubim, and he flew; * he flew upon the wings of the winds."
    status:
      la: verified
      en: verified
  - n: 12
    text:
      la: "Et pósuit ténebras latíbulum suum, † in circúitu ejus tabernáculum ejus: * tenebrósa aqua in núbibus áëris."
      en: "And he made darkness his covert, † his pavilion round about him: * dark waters in the clouds of the air."
    status:
      la: verified
      en: verified
  - n: 13
    text:
      la: "Præ fulgóre in conspéctu ejus nubes transiérunt, * grando et carbónes ignis."
      en: "At the brightness that was before him the clouds passed, * hail and coals of fire."
    status:
      la: verified
      en: verified
  - n: 14
    text:
      la: "Et intónuit de cælo Dóminus, † et Altíssimus dedit vocem suam: * grando et carbónes ignis."
      en: "And the Lord thundered from heaven, † and the Highest gave his voice: * hail and coals of fire."
    status:
      la: verified
      en: verified
  - n: 15
    text:
      la: "Et misit sagíttas suas, et dissipávit eos: * fúlgura multiplicávit, et conturbávit eos."
      en: "And he sent forth his arrows, and he scattered them: * he multiplied lightnings, and troubled them."
    status:
      la: verified
      en: verified
  - n: 16
    text:
      la: "Et apparuérunt fontes aquárum, * et reveláta sunt fundaménta orbis terrárum:"
      en: "Then the fountains of waters appeared, * and the foundations of the world were discovered:"
    status:
      la: verified
      en: verified
  - n: 16
    text:
      la: "Ab increpatióne tua, Dómine, * ab inspiratióne spíritus iræ tuæ."
      en: "At thy rebuke, O Lord, * at the blast of the spirit of thy wrath."
    status:
      la: verified
      en: verified
  - n: 17
    text:
      la: "Misit de summo, et accépit me: * et assúmpsit me de aquis multis."
      en: "He sent from on high, and took me: * and received me out of many waters."
    status:
      la: verified
      en: verified
  - n: 18
    text:
      la: "Erípuit me de inimícis meis fortíssimis, † et ab his qui odérunt me: * quóniam confortáti sunt super me."
      en: "He delivered me from my strongest enemies, † and from them that hated me: * for they were too strong for me."
    status:
      la: verified
      en: verified
  - n: 19
    text:
      la: "Prævenérunt me in die afflictiónis meæ: * et factus est Dóminus protéctor meus."
      en: "They prevented me in the day of my affliction: * and the Lord became my protector."
    status:
      la: verified
      en: verified
  - n: 20
    text:
      la: "Et edúxit me in latitúdinem: * salvum me fecit, quóniam vóluit me."
      en: "And he brought me forth into a large place: * he saved me, because he was well pleased with me."
    status:
      la: verified
      en: verified
  - n: 21
    text:
      la: "Et retríbuet mihi Dóminus secúndum justítiam meam: * et secúndum puritátem mánuum meárum retríbuet mihi:"
      en: "And the Lord will reward me according to my justice; * and will repay me according to the cleanness of my hands:"
    status:
      la: verified
      en: verified
  - n: 22
    text:
      la: "Quia custodívi vias Dómini, * nec ímpie gessi a Deo meo."
      en: "Because I have kept the ways of the Lord; * and have not done wickedly against my God."
    status:
      la: verified
      en: verified
  - n: 23
    text:
      la: "Quóniam ómnia judícia ejus in conspéctu meo: * et justítias ejus non répuli a me."
      en: "For all his judgments are in my sight: * and his justices I have not put away from me."
    status:
      la: verified
      en: verified
  - n: 24
    text:
      la: "Et ero immaculátus cum eo: * et observábo me ab iniquitáte mea."
      en: "And I shall be spotless with him: * and shall keep myself from my iniquity."
    status:
      la: verified
      en: verified
  - n: 25
    text:
      la: "Et retríbuet mihi Dóminus secúndum justítiam meam: * et secúndum puritátem mánuum meárum in conspéctu oculórum ejus."
      en: "And the Lord will reward me according to my justice: * and according to the cleanness of my hands before his eyes."
    status:
      la: verified
      en: verified
  - n: 26
    text:
      la: "Cum sancto sanctus eris, * et cum viro innocénte ínnocens eris:"
      en: "With the holy thou wilt be holy; * and with the innocent man thou wilt be innocent:"
    status:
      la: verified
      en: verified
  - n: 27
    text:
      la: "Et cum elécto eléctus eris: * et cum pervérso pervertéris."
      en: "And with the elect thou wilt be elect: * and with the perverse thou wilt be perverted."
    status:
      la: verified
      en: verified
  - n: 28
    text:
      la: "Quóniam tu pópulum húmilem salvum fácies: * et óculos superbórum humiliábis."
      en: "For thou wilt save the humble people; * but wilt bring down the eyes of the proud."
    status:
      la: verified
      en: verified
  - n: 29
    text:
      la: "Quóniam tu illúminas lucérnam meam, Dómine: * Deus meus, illúmina ténebras meas."
      en: "For thou lightest my lamp, O Lord: * O my God, enlighten my darkness."
    status:
      la: verified
      en: verified
  - n: 30
    text:
      la: "Quóniam in te erípiar a tentatióne, * et in Deo meo transgrédiar murum."
      en: "For by thee I shall be delivered from temptation; * and through my God I shall go over a wall."
    status:
      la: verified
      en: verified
  - n: 31
    text:
      la: "Deus meus, impollúta via ejus: † elóquia Dómini igne examináta: * protéctor est ómnium sperántium in se."
      en: "As for my God, his way is undefiled: † the words of the Lord are fire-tried: * he is the protector of all that trust in him."
    status:
      la: verified
      en: verified
  - n: 32
    text:
      la: "Quóniam quis Deus præter Dóminum? * aut quis Deus præter Deum nostrum?"
      en: "For who is God but the Lord? * or who is God but our God?"
    status:
      la: verified
      en: verified
  - n: 33
    text:
      la: "Deus, qui præcínxit me virtúte: * et pósuit immaculátam viam meam."
      en: "God, who hath girt me with strength; * and made my way blameless."
    status:
      la: verified
      en: verified
  - n: 34
    text:
      la: "Qui perfécit pedes meos tamquam cervórum, * et super excélsa státuens me."
      en: "Who hath made my feet like the feet of harts: * and who setteth me upon high places."
    status:
      la: verified
      en: verified
  - n: 35
    text:
      la: "Qui docet manus meas ad prǽlium: * et posuísti, ut arcum ǽreum, brácchia mea."
      en: "Who teacheth my hands to war: * and thou hast made my arms like a brazen bow."
    status:
      la: verified
      en: verified
  - n: 36
    text:
      la: "Et dedísti mihi protectiónem salútis tuæ: * et déxtera tua suscépit me:"
      en: "Thou hast given me the protection of thy salvation: * and thy right hand hath held me up:"
    status:
      la: verified
      en: verified
  - n: 36
    text:
      la: "Et disciplína tua corréxit me in finem: * et disciplína tua ipsa me docébit."
      en: "And thy discipline hath corrected me unto the end: * and thy discipline, the same shall teach me."
    status:
      la: verified
      en: verified
  - n: 37
    text:
      la: "Dilatásti gressus meos subtus me: * et non sunt infirmáta vestígia mea:"
      en: "Thou hast enlarged my steps under me; * and my feet are not weakened."
    status:
      la: verified
      en: verified
  - n: 38
    text:
      la: "Pérsequar inimícos meos et comprehéndam illos: * et non convértar, donec defíciant."
      en: "I will pursue after my enemies, and overtake them: * and I will not turn again till they are consumed."
    status:
      la: verified
      en: verified
  - n: 39
    text:
      la: "Confríngam illos, nec póterunt stare: * cadent subtus pedes meos."
      en: "I will break them, and they shall not be able to stand: * they shall fall under my feet."
    status:
      la: verified
      en: verified
  - n: 40
    text:
      la: "Et præcinxísti me virtúte ad bellum: * et supplantásti insurgéntes in me subtus me."
      en: "And thou hast girded me with strength unto battle; * and hast subdued under me them that rose up against me."
    status:
      la: verified
      en: verified
  - n: 41
    text:
      la: "Et inimícos meos dedísti mihi dorsum, * et odiéntes me disperdidísti."
      en: "And thou hast made my enemies turn their back upon me, * and hast destroyed them that hated me."
    status:
      la: verified
      en: verified
  - n: 42
    text:
      la: "Clamavérunt, nec erat qui salvos fáceret ad Dóminum: * nec exaudívit eos."
      en: "They cried, but there was none to save them, to the Lord: * but he heard them not."
    status:
      la: verified
      en: verified
  - n: 43
    text:
      la: "Et commínuam eos, ut púlverem ante fáciem venti: * ut lutum plateárum delébo eos."
      en: "And I shall beat them as small as the dust before the wind; * I shall bring them to nought, like the dirt in the streets."
    status:
      la: verified
      en: verified
  - n: 44
    text:
      la: "Erípies me de contradictiónibus pópuli: * constítues me in caput géntium."
      en: "Thou wilt deliver me from the contradictions of the people; * thou wilt make me head of the Gentiles."
    status:
      la: verified
      en: verified
  - n: 45
    text:
      la: "Pópulus quem non cognóvi servívit mihi: * in audítu auris obedívit mihi."
      en: "A people which I knew not, hath served me: * at the hearing of the ear they have obeyed me."
    status:
      la: verified
      en: verified
  - n: 46
    text:
      la: "Fílii aliéni mentíti sunt mihi, * fílii aliéni inveteráti sunt, et claudicavérunt a sémitis suis."
      en: "The children that are strangers have lied to me, * strange children have faded away, and have halted from their paths."
    status:
      la: verified
      en: verified
  - n: 47
    text:
      la: "Vivit Dóminus, et benedíctus Deus meus: * et exaltétur Deus salútis meæ."
      en: "The Lord liveth, and blessed be my God, * and let the God of my salvation be exalted."
    status:
      la: verified
      en: verified
  - n: 48
    text:
      la: "Deus, qui das vindíctas mihi, et subdis pópulos sub me: * liberátor meus de inimícis meis iracúndis."
      en: "O God, who avengest me, and subduest the people under me, * my deliverer from my enraged enemies."
    status:
      la: verified
      en: verified
  - n: 49
    text:
      la: "Et ab insurgéntibus in me exaltábis me: * a viro iníquo erípies me."
      en: "And thou wilt lift me up above them that rise up against me: * from the unjust man thou wilt deliver me."
    status:
      la: verified
      en: verified
  - n: 50
    text:
      la: "Proptérea confitébor tibi in natiónibus, Dómine: * et nómini tuo psalmum dicam."
      en: "Therefore will I give glory to thee, O Lord, among the nations, * and I will sing a psalm to thy name."
    status:
      la: verified
      en: verified
  - n: 51
    text:
      la: "Magníficans salútes Regis ejus, † et fáciens misericórdiam Christo suo David: * et sémini ejus usque in sǽculum."
      en: "Giving great deliverance to his king, † and shewing mercy to David, his anointed: * and to his seed for ever."
    status:
      la: verified
      en: verified
