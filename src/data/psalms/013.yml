# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 13
verses:
  - n: 1
    text:
      la: "Dixit insípiens in corde suo: * non est Deus."
      en: "The fool hath said in his heart: * there is no God."
    status:
      la: verified
      en: verified
  - n: 1
    text:
      la: "Corrúpti sunt, et abominábiles facti sunt in stúdiis suis: * non est qui fáciat bonum, non est usque ad unum."
      en: "They are corrupt, and are become abominable in their ways: * there is none that doth good, no not one."
    status:
      la: verified
      en: verified
  - n: 2
    text:
      la: "Dóminus de cælo prospéxit super fílios hóminum, * ut vídeat si est intéllegens, aut requírens Deum."
      en: "The Lord hath looked down from heaven upon the children of men, * to see if there be any that understand and seek God."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Omnes declinavérunt, simul inútiles facti sunt: * non est qui fáciat bonum, non est usque ad unum."
      en: "They are all gone aside, they are become unprofitable together: * there is none that doth good: no not one."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Sepúlcrum patens est guttur eórum: † linguis suis dolóse agébant * venénum áspidum sub lábiis eórum."
      en: "Their throat is an open sepulchre; † with their tongues they acted deceitfully: * the poison of asps is under their lips."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Quorum os maledictióne et amaritúdine plenum est: * velóces pedes eórum ad effundéndum sánguinem."
      en: "Their mouth is full of cursing and bitterness; * their feet are swift to shed blood."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Contrítio et infelícitas in viis eórum, † et viam pacis non cognovérunt: * non est timor Dei ante óculos eórum."
      en: "Destruction and unhappiness in their ways; † and the way of peace they have not known: * there is no fear of God before their eyes."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Nonne cognóscent omnes qui operántur iniquitátem, * qui dévorant plebem meam sicut escam panis?"
      en: "Shall not all they know that work iniquity, * who devour my people as they eat bread?"
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Dóminum non invocavérunt, * illic trepidavérunt timóre, ubi non erat timor."
      en: "They have not called upon the Lord: * there have they trembled for fear, where there was no fear."
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Quóniam Dóminus in generatióne justa est, † consílium ínopis confudístis: * quóniam Dóminus spes ejus est."
      en: "For the Lord is in the just generation: † you have confounded the counsel of the poor man; * but the Lord is his hope."
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Quis dabit ex Sion salutáre Israël? * cum avérterit Dóminus captivitátem plebis suæ, exsultábit Jacob, et lætábitur Israël."
      en: "Who shall give out of Sion the salvation of Israel? * when the Lord shall have turned away the captivity of his people, Jacob shall rejoice, and Israel shall be glad."
    status:
      la: verified
      en: verified
