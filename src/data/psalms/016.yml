# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 16
verses:
  - n: 1
    text:
      la: "Exáudi, Dómine, justítiam meam: * inténde deprecatiónem meam."
      en: "Hear, O Lord, my justice: * attend to my supplication."
    status:
      la: verified
      en: verified
  - n: 1
    text:
      la: "Áuribus pércipe oratiónem meam, * non in lábiis dolósis."
      en: "Give ear unto my prayer, * which proceedeth not from deceitful lips."
    status:
      la: verified
      en: verified
  - n: 2
    text:
      la: "De vultu tuo judícium meum pródeat: * óculi tui vídeant æquitátes."
      en: "Let my judgment come forth from thy countenance: * let thy eyes behold the things that are equitable."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Probásti cor meum, et visitásti nocte: * igne me examinásti, et non est invénta in me iníquitas."
      en: "Thou hast proved my heart, and visited it by night, * thou hast tried me by fire: and iniquity hath not been found in me."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Ut non loquátur os meum ópera hóminum: * propter verba labiórum tuórum ego custodívi vias duras."
      en: "That my mouth may not speak the works of men: * for the sake of the words of thy lips, I have kept hard ways."
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Pérfice gressus meos in sémitis tuis: * ut non moveántur vestígia mea."
      en: "Perfect thou my goings in thy paths: * that my footsteps be not moved."
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Ego clamávi, quóniam exaudísti me, Deus: * inclína aurem tuam mihi, et exáudi verba mea."
      en: "I have cried to thee, for thou, O God, hast heard me: * O incline thy ear unto me, and hear my words."
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Mirífica misericórdias tuas, * qui salvos facis sperántes in te."
      en: "Shew forth thy wonderful mercies; * thou who savest them that trust in thee."
    status:
      la: verified
      en: verified
  - n: 8
    text:
      la: "A resisténtibus déxteræ tuæ custódi me, * ut pupíllam óculi."
      en: "From them that resist thy right hand keep me, * as the apple of thy eye."
    status:
      la: verified
      en: verified
  - n: 8
    text:
      la: "Sub umbra alárum tuárum prótege me: * a fácie impiórum qui me afflixérunt."
      en: "Protect me under the shadow of thy wings: * from the face of the wicked who have afflicted me."
    status:
      la: verified
      en: verified
  - n: 9
    text:
      la: "Inimíci mei ánimam meam circumdedérunt, † ádipem suum conclusérunt: * os eórum locútum est supérbiam."
      en: "My enemies have surrounded my soul: † They have shut up their fat: * their mouth hath spoken proudly."
    status:
      la: verified
      en: verified
  - n: 11
    text:
      la: "Proiciéntes me nunc circumdedérunt me: * óculos suos statuérunt declináre in terram."
      en: "They have cast me forth, and now they have surrounded me: * they have set their eyes bowing down to the earth."
    status:
      la: verified
      en: verified
  - n: 12
    text:
      la: "Suscepérunt me sicut leo parátus ad prædam: * et sicut cátulus leónis hábitans in ábditis."
      en: "They have taken me, as a lion prepared for the prey; * and as a young lion dwelling in secret places."
    status:
      la: verified
      en: verified
  - n: 13
    text:
      la: "Exsúrge, Dómine, prǽveni eum, et supplánta eum: * éripe ánimam meam ab ímpio, frámeam tuam ab inimícis manus tuæ."
      en: "Arise, O Lord, disappoint him and supplant him; * deliver my soul from the wicked one; thy sword from the enemies of thy hand."
    status:
      la: verified
      en: verified
  - n: 14
    text:
      la: "Dómine, a paucis de terra dívide eos in vita eórum: * de abscónditis tuis adimplétus est venter eórum."
      en: "O Lord, divide them from the few of the earth in their life: * their belly is filled from thy hidden stores."
    status:
      la: verified
      en: verified
  - n: 14
    text:
      la: "Saturáti sunt fíliis: * et dimisérunt relíquias suas párvulis suis."
      en: "They are full of children: * and they have left to their little ones the rest of their substance."
    status:
      la: verified
      en: verified
  - n: 15
    text:
      la: "Ego autem in justítia apparébo conspéctui tuo: * satiábor cum apparúerit glória tua."
      en: "But as for me, I will appear before thy sight in justice: * I shall be satisfied when thy glory shall appear."
    status:
      la: verified
      en: verified
