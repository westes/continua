# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 129
verses:
  - n: 1
    text:
      la: "De profúndis clamávi ad te, Dómine: * Dómine, exáudi vocem meam:"
      en: "Out of the depths I have cried to thee, O Lord: * Lord, hear my voice."
    status:
      la: verified
      en: verified
  - n: 2
    text:
      la: "Fiant aures tuæ intendéntes, * in vocem deprecatiónis meæ."
      en: "Let thy ears be attentive * to the voice of my supplication."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Si iniquitátes observáveris, Dómine: * Dómine, quis sustinébit?"
      en: "If thou, O Lord, wilt mark iniquities: * Lord, who shall stand it."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Quia apud te propitiátio est: * et propter legem tuam sustínui te, Dómine."
      en: "For with thee there is merciful forgiveness: * and by reason of thy law, I have waited for thee, O Lord."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Sustínuit ánima mea in verbo ejus: * sperávit ánima mea in Dómino."
      en: "My soul hath relied on his word: * my soul hath hoped in the Lord."
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "A custódia matutína usque ad noctem: * speret Israël in Dómino."
      en: "From the morning watch even until night, * let Israel hope in the Lord."
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Quia apud Dóminum misericórdia: * et copiósa apud eum redémptio."
      en: "Because with the Lord there is mercy: * and with him plentiful redemption."
    status:
      la: verified
      en: verified
  - n: 8
    text:
      la: "Et ipse rédimet Israël, * ex ómnibus iniquitátibus ejus."
      en: "And he shall redeem Israel * from all his iniquities."
    status:
      la: verified
      en: verified
