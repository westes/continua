# Verified against Divinum Officium (Latin Psalmorum, English translation).
# Vulgate/Gallican numbering.
number: 118
verses:
  - n: 1
    text:
      la: "(Aleph) Beáti immaculáti in via: * qui ámbulant in lege Dómini."
      en: "(Aleph) Blessed are the undefiled in the way, * who walk in the law of the Lord."
    status:
      la: verified
      en: verified
  - n: 2
    text:
      la: "Beáti, qui scrutántur testimónia ejus: * in toto corde exquírunt eum."
      en: "Blessed are they that search his testimonies: * that seek him with their whole heart."
    status:
      la: verified
      en: verified
  - n: 3
    text:
      la: "Non enim qui operántur iniquitátem, * in viis ejus ambulavérunt."
      en: "For they that work iniquity, * have not walked in his ways."
    status:
      la: verified
      en: verified
  - n: 4
    text:
      la: "Tu mandásti * mandáta tua custodíri nimis."
      en: "Thou hast commanded * thy commandments to be kept most diligently."
    status:
      la: verified
      en: verified
  - n: 5
    text:
      la: "Útinam dirigántur viæ meæ, * ad custodiéndas justificatiónes tuas!"
      en: "O! that my ways may be directed * to keep thy justifications."
    status:
      la: verified
      en: verified
  - n: 6
    text:
      la: "Tunc non confúndar, * cum perspéxero in ómnibus mandátis tuis."
      en: "Then shall I not be confounded, * when I shall look into all thy commandments."
    status:
      la: verified
      en: verified
  - n: 7
    text:
      la: "Confitébor tibi in directióne cordis: * in eo quod dídici judícia justítiæ tuæ."
      en: "I will praise thee with uprightness of heart, * when I shall have learned the judgments of thy justice."
    status:
      la: verified
      en: verified
  - n: 8
    text:
      la: "Justificatiónes tuas custódiam: * non me derelínquas usquequáque."
      en: "I will keep thy justifications: * O! do not thou utterly forsake me."
    status:
      la: verified
      en: verified
  - n: 9
    text:
      la: "(Beth) In quo córrigit adolescéntior viam suam? * In custodiéndo sermónes tuos."
      en: "(Béth) By what doth a young man correct his way? * By observing thy words."
    status:
      la: verified
      en: verified
  - n: 10
    text:
      la: "In toto corde meo exquisívi te: * ne repéllas me a mandátis tuis."
      en: "With my whole heart have I sought after thee: * let me not stray from thy commandments."
    status:
      la: verified
      en: verified
  - n: 11
    text:
      la: "In corde meo abscóndi elóquia tua: * ut non peccem tibi."
      en: "Thy words have I hidden in my heart, * that I may not sin against thee."
    status:
      la: verified
      en: verified
  - n: 12
    text:
      la: "Benedíctus es, Dómine: * doce me justificatiónes tuas."
      en: "Blessed art thou, O Lord: * teach me thy justifications."
    status:
      la: verified
      en: verified
  - n: 13
    text:
      la: "In lábiis meis, * pronuntiávi ómnia judícia oris tui."
      en: "With my lips * I have pronounced all the judgments of thy mouth."
    status:
      la: verified
      en: verified
  - n: 14
    text:
      la: "In via testimoniórum tuórum delectátus sum, * sicut in ómnibus divítiis."
      en: "I have been delighted in the way of thy testimonies, * as in all riches."
    status:
      la: verified
      en: verified
  - n: 15
    text:
      la: "In mandátis tuis exercébor: * et considerábo vias tuas."
      en: "I will meditate on thy commandments: * and I will consider thy ways."
    status:
      la: verified
      en: verified
  - n: 16
    text:
      la: "In justificatiónibus tuis meditábor: * non oblivíscar sermónes tuos."
      en: "I will think of thy justifications: * I will not forget thy words."
    status:
      la: verified
      en: verified
  - n: 17
    text:
      la: "(Ghimel) Retríbue servo tuo, vivífica me: * et custódiam sermónes tuos:"
      en: "(Ghimel) Give bountifully to thy servant, enliven me * and I shall keep thy words."
    status:
      la: verified
      en: verified
  - n: 18
    text:
      la: "Revéla óculos meos: * et considerábo mirabília de lege tua."
      en: "Open thou my eyes: * and I will consider the wondrous things of thy law."
    status:
      la: verified
      en: verified
  - n: 19
    text:
      la: "Íncola ego sum in terra: * non abscóndas a me mandáta tua."
      en: "I am a sojourner on the earth: * hide not thy commandments from me."
    status:
      la: verified
      en: verified
  - n: 20
    text:
      la: "Concupívit ánima mea desideráre justificatiónes tuas, * in omni témpore."
      en: "My soul hath coveted to long for thy justifications, * at all times."
    status:
      la: verified
      en: verified
  - n: 21
    text:
      la: "Increpásti supérbos: * maledícti qui declínant a mandátis tuis."
      en: "Thou hast rebuked the proud: * they are cursed who decline from thy commandments."
    status:
      la: verified
      en: verified
  - n: 22
    text:
      la: "Aufer a me oppróbrium, et contémptum: * quia testimónia tua exquisívi."
      en: "Remove from me reproach and contempt: * because I have sought after thy testimonies."
    status:
      la: verified
      en: verified
  - n: 23
    text:
      la: "Étenim sedérunt príncipes, et advérsum me loquebántur: * servus autem tuus exercebátur in justificatiónibus tuis."
      en: "For princes sat, and spoke against me: * but thy servant was employed in thy justifications."
    status:
      la: verified
      en: verified
  - n: 24
    text:
      la: "Nam et testimónia tua meditátio mea est: * et consílium meum justificatiónes tuæ."
      en: "For thy testimonies are my meditation: * and thy justifications my counsel."
    status:
      la: verified
      en: verified
  - n: 25
    text:
      la: "(Daleth) Adhǽsit paviménto ánima mea: * vivífica me secúndum verbum tuum."
      en: "(Daleth) My soul hath cleaved to the pavement: * quicken thou me according to thy word."
    status:
      la: verified
      en: verified
  - n: 26
    text:
      la: "Vias meas enuntiávi, et exaudísti me: * doce me justificatiónes tuas."
      en: "I have declared my ways, and thou hast heard me: * teach me thy justifications."
    status:
      la: verified
      en: verified
  - n: 27
    text:
      la: "Viam justificatiónum tuárum ínstrue me: * et exercébor in mirabílibus tuis."
      en: "Make me to understand the way of thy justifications: * and I shall be exercised in thy wondrous works."
    status:
      la: verified
      en: verified
  - n: 28
    text:
      la: "Dormitávit ánima mea præ tǽdio: * confírma me in verbis tuis."
      en: "My soul hath slumbered through heaviness: * strengthen thou me in thy words."
    status:
      la: verified
      en: verified
  - n: 29
    text:
      la: "Viam iniquitátis ámove a me: * et de lege tua miserére mei."
      en: "Remove from me the way of iniquity: * and out of thy law have mercy on me."
    status:
      la: verified
      en: verified
  - n: 30
    text:
      la: "Viam veritátis elégi: * judícia tua non sum oblítus."
      en: "I have chosen the way of truth: * thy judgments I have not forgotten."
    status:
      la: verified
      en: verified
  - n: 31
    text:
      la: "Adhǽsi testimóniis tuis, Dómine: * noli me confúndere."
      en: "I have stuck to thy testimonies, O Lord: * put me not to shame."
    status:
      la: verified
      en: verified
  - n: 32
    text:
      la: "Viam mandatórum tuórum cucúrri, * cum dilatásti cor meum."
      en: "I have run the way of thy commandments, * when thou didst enlarge my heart."
    status:
      la: verified
      en: verified
  - n: 33
    text:
      la: "(He) Legem pone mihi, Dómine, viam justificatiónum tuárum: * et exquíram eam semper."
      en: "(He) Set before me for a law the way of thy justifications, O Lord: * and I will always seek after it."
    status:
      la: verified
      en: verified
  - n: 34
    text:
      la: "Da mihi intelléctum, et scrutábor legem tuam: * et custódiam illam in toto corde meo."
      en: "Give me understanding, and I will search thy law; * and I will keep it with my whole heart."
    status:
      la: verified
      en: verified
  - n: 35
    text:
      la: "Deduc me in sémitam mandatórum tuórum: * quia ipsam vólui."
      en: "Lead me into the path of thy commandments; * for this same I have desired."
    status:
      la: verified
      en: verified
  - n: 36
    text:
      la: "Inclína cor meum in testimónia tua: * et non in avarítiam."
      en: "Incline my heart into thy testimonies * and not to covetousness."
    status:
      la: verified
      en: verified
  - n: 37
    text:
      la: "Avérte óculos meos ne vídeant vanitátem: * in via tua vivífica me."
      en: "Turn away my eyes that they may not behold vanity: * quicken me in thy way."
    status:
      la: verified
      en: verified
  - n: 38
    text:
      la: "Státue servo tuo elóquium tuum, * in timóre tuo."
      en: "Establish thy word to thy servant, * in thy fear."
    status:
      la: verified
      en: verified
  - n: 39
    text:
      la: "Ámputa oppróbrium meum quod suspicátus sum: * quia judícia tua jucúnda."
      en: "Turn away my reproach, which I have apprehended: * for thy judgments are delightful."
    status:
      la: verified
      en: verified
  - n: 40
    text:
      la: "Ecce, concupívi mandáta tua: * in æquitáte tua vivífica me."
      en: "Behold I have longed after thy precepts: * quicken me in thy justice."
    status:
      la: verified
      en: verified
  - n: 41
    text:
      la: "(Vav) Et véniat super me misericórdia tua, Dómine: * salutáre tuum secúndum elóquium tuum."
      en: "(Vau) Let thy mercy also come upon me, O Lord: * thy salvation according to thy word."
    status:
      la: verified
      en: verified
  - n: 42
    text:
      la: "Et respondébo exprobrántibus mihi verbum: * quia sperávi in sermónibus tuis."
      en: "So shall I answer them that reproach me in any thing; * that I have trusted in thy words."
    status:
      la: verified
      en: verified
  - n: 43
    text:
      la: "Et ne áuferas de ore meo verbum veritátis usquequáque: * quia in judíciis tuis supersperávi."
      en: "And take not thou the word of truth utterly out of my mouth: * for in thy words, I have hoped exceedingly."
    status:
      la: verified
      en: verified
  - n: 44
    text:
      la: "Et custódiam legem tuam semper: * in sǽculum et in sǽculum sǽculi."
      en: "So shall I always keep thy law, * for ever and ever."
    status:
      la: verified
      en: verified
  - n: 45
    text:
      la: "Et ambulábam in latitúdine: * quia mandáta tua exquisívi."
      en: "And I walked at large: * because I have sought after thy commandments."
    status:
      la: verified
      en: verified
  - n: 46
    text:
      la: "Et loquébar in testimóniis tuis in conspéctu regum: * et non confundébar."
      en: "And I spoke of thy testimonies before kings: * and I was not ashamed."
    status:
      la: verified
      en: verified
  - n: 47
    text:
      la: "Et meditábar in mandátis tuis, * quæ diléxi."
      en: "I meditated also on thy commandments, * which I loved."
    status:
      la: verified
      en: verified
  - n: 48
    text:
      la: "Et levávi manus meas ad mandáta tua, quæ diléxi: * et exercébar in justificatiónibus tuis."
      en: "And I lifted up my hands to thy commandments, which I loved: * and I was exercised in thy justifications."
    status:
      la: verified
      en: verified
  - n: 49
    text:
      la: "(Zai) Memor esto verbi tui servo tuo, * in quo mihi spem dedísti."
      en: "(Zai) Be thou mindful of thy word to thy servant, * in which thou hast given me hope."
    status:
      la: verified
      en: verified
  - n: 50
    text:
      la: "Hæc me consoláta est in humilitáte mea: * quia elóquium tuum vivificávit me."
      en: "This hath comforted me in my humiliation: * because thy word hath enlivened me."
    status:
      la: verified
      en: verified
  - n: 51
    text:
      la: "Supérbi iníque agébant usquequáque: * a lege autem tua non declinávi."
      en: "The proud did iniquitously altogether: * but I declined not from thy law."
    status:
      la: verified
      en: verified
  - n: 52
    text:
      la: "Memor fui judiciórum tuórum a sǽculo, Dómine: * et consolátus sum."
      en: "I remembered, O Lord, thy judgments of old: * and I was comforted."
    status:
      la: verified
      en: verified
  - n: 53
    text:
      la: "Deféctio ténuit me, * pro peccatóribus derelinquéntibus legem tuam."
      en: "A fainting hath taken hold of me, * because of the wicked that forsake thy law."
    status:
      la: verified
      en: verified
  - n: 54
    text:
      la: "Cantábiles mihi erant justificatiónes tuæ, * in loco peregrinatiónis meæ."
      en: "Thy justifications were the subject of my song, * in the place of my pilgrimage."
    status:
      la: verified
      en: verified
  - n: 55
    text:
      la: "Memor fui nocte nóminis tui, Dómine: * et custodívi legem tuam."
      en: "In the night I have remembered thy name, O Lord: * and have kept thy law."
    status:
      la: verified
      en: verified
  - n: 56
    text:
      la: "Hæc facta est mihi: * quia justificatiónes tuas exquisívi."
      en: "This happened to me: * because I sought after thy justifications."
    status:
      la: verified
      en: verified
  - n: 57
    text:
      la: "(Heth) Pórtio mea, Dómine, * dixi custodíre legem tuam."
      en: "(Heth) O Lord, my portion, * I have said, I would keep thy law."
    status:
      la: verified
      en: verified
  - n: 58
    text:
      la: "Deprecátus sum fáciem tuam in toto corde meo: * miserére mei secúndum elóquium tuum."
      en: "I entreated thy face with all my heart: * have mercy on me according to thy word."
    status:
      la: verified
      en: verified
  - n: 59
    text:
      la: "Cogitávi vias meas: * et convérti pedes meos in testimónia tua."
      en: "I have thought on my ways: * and turned my feet unto thy testimonies."
    status:
      la: verified
      en: verified
  - n: 60
    text:
      la: "Parátus sum, et non sum turbátus: * ut custódiam mandáta tua."
      en: "I am ready, and am not troubled: * that I may keep thy commandments."
    status:
      la: verified
      en: verified
  - n: 61
    text:
      la: "Funes peccatórum circumpléxi sunt me: * et legem tuam non sum oblítus."
      en: "The cords of the wicked have encompassed me: * but I have not forgotten thy law."
    status:
      la: verified
      en: verified
  - n: 62
    text:
      la: "Média nocte surgébam ad confiténdum tibi, * super judícia justificatiónis tuæ."
      en: "I rose at midnight to give praise to thee; * for the judgments of thy justification."
    status:
      la: verified
      en: verified
  - n: 63
    text:
      la: "Párticeps ego sum ómnium timéntium te: * et custodiéntium mandáta tua."
      en: "I am a partaker with all them that fear thee, * and that keep thy commandments."
    status:
      la: verified
      en: verified
  - n: 64
    text:
      la: "Misericórdia tua, Dómine, plena est terra: * justificatiónes tuas doce me."
      en: "The earth, O Lord, is full of thy mercy: * teach me thy justifications."
    status:
      la: verified
      en: verified
  - n: 65
    text:
      la: "(Teth) Bonitátem fecísti cum servo tuo, Dómine, * secúndum verbum tuum."
      en: "(Teth) Thou hast done well with thy servant, O Lord, * according to thy word."
    status:
      la: verified
      en: verified
  - n: 66
    text:
      la: "Bonitátem, et disciplínam, et sciéntiam doce me: * quia mandátis tuis crédidi."
      en: "Teach me goodness and discipline and knowledge; * for I have believed thy commandments."
    status:
      la: verified
      en: verified
  - n: 67
    text:
      la: "Priúsquam humiliárer ego delíqui: * proptérea elóquium tuum custodívi."
      en: "Before I was humbled I offended; * therefore have I kept thy word."
    status:
      la: verified
      en: verified
  - n: 68
    text:
      la: "Bonus es tu: * et in bonitáte tua doce me justificatiónes tuas."
      en: "Thou art good; * and in thy goodness teach me thy justifications."
    status:
      la: verified
      en: verified
  - n: 69
    text:
      la: "Multiplicáta est super me iníquitas superbórum: * ego autem in toto corde meo scrutábor mandáta tua."
      en: "The iniquity of the proud hath been multiplied over me: * but I will seek thy commandments with my whole heart."
    status:
      la: verified
      en: verified
  - n: 70
    text:
      la: "Coagulátum est sicut lac cor eórum: * ego vero legem tuam meditátus sum."
      en: "Their heart is curdled like milk: * but I have meditated on thy law."
    status:
      la: verified
      en: verified
  - n: 71
    text:
      la: "Bonum mihi quia humiliásti me: * ut discam justificatiónes tuas."
      en: "It is good for me that thou hast humbled me, * that I may learn thy justifications."
    status:
      la: verified
      en: verified
  - n: 72
    text:
      la: "Bonum mihi lex oris tui, * super míllia auri et argénti."
      en: "The law of thy mouth is good to me, * above thousands of gold and silver."
    status:
      la: verified
      en: verified
  - n: 73
    text:
      la: "(Joth) Manus tuæ fecérunt me, et plasmavérunt me: * da mihi intelléctum, et discam mandáta tua."
      en: "(Jod) Thy hands have made me and formed me: * give me understanding, and I will learn thy commandments."
    status:
      la: verified
      en: verified
  - n: 74
    text:
      la: "Qui timent te vidébunt me, et lætabúntur: * quia in verba tua supersperávi."
      en: "They that fear thee shall see me, and shall be glad: * because I have greatly hoped in thy words."
    status:
      la: verified
      en: verified
  - n: 75
    text:
      la: "Cognóvi, Dómine, quia ǽquitas judícia tua: * et in veritáte tua humiliásti me."
      en: "I know, O Lord, that thy judgments are equity: * and in thy truth thou hast humbled me."
    status:
      la: verified
      en: verified
  - n: 76
    text:
      la: "Fiat misericórdia tua ut consolétur me, * secúndum elóquium tuum servo tuo."
      en: "O! let thy mercy be for my comfort, * according to thy word unto thy servant."
    status:
      la: verified
      en: verified
  - n: 77
    text:
      la: "Véniant mihi miseratiónes tuæ, et vivam: * quia lex tua meditátio mea est."
      en: "Let thy tender mercies come unto me, and I shall live: * for thy law is my meditation."
    status:
      la: verified
      en: verified
  - n: 78
    text:
      la: "Confundántur supérbi, quia injúste iniquitátem fecérunt in me: * ego autem exercébor in mandátis tuis."
      en: "Let the proud be ashamed, because they have done unjustly towards me: * but I will be employed in thy commandments."
    status:
      la: verified
      en: verified
  - n: 79
    text:
      la: "Convertántur mihi timéntes te: * et qui novérunt testimónia tua."
      en: "Let them that fear thee turn to me: * and they that know thy testimonies."
    status:
      la: verified
      en: verified
  - n: 80
    text:
      la: "Fiat cor meum immaculátum in justificatiónibus tuis, * ut non confúndar."
      en: "Let my heart be undefiled in thy justifications, * that I may not be confounded."
    status:
      la: verified
      en: verified
  - n: 81
    text:
      la: "(Caph) Defécit in salutáre tuum ánima mea: * et in verbum tuum supersperávi."
      en: "(Caph) My soul hath fainted after thy salvation: * and in thy word I have very much hoped."
    status:
      la: verified
      en: verified
  - n: 82
    text:
      la: "Defecérunt óculi mei in elóquium tuum, * dicéntes: Quando consoláberis me?"
      en: "My eyes have failed for thy word, * saying: When wilt thou comfort me?"
    status:
      la: verified
      en: verified
  - n: 83
    text:
      la: "Quia factus sum sicut uter in pruína: * justificatiónes tuas non sum oblítus."
      en: "For I am become like a bottle in the frost: * I have not forgotten thy justifications."
    status:
      la: verified
      en: verified
  - n: 84
    text:
      la: "Quot sunt dies servi tui? * quando fácies de persequéntibus me judícium?"
      en: "How many are the days of thy servant: * when wilt thou execute judgment on them that persecute me?"
    status:
      la: verified
      en: verified
  - n: 85
    text:
      la: "Narravérunt mihi iníqui fabulatiónes: * sed non ut lex tua."
      en: "The wicked have told me fables: * but not as thy law."
    status:
      la: verified
      en: verified
  - n: 86
    text:
      la: "Ómnia mandáta tua véritas: * iníque persecúti sunt me, ádjuva me."
      en: "All thy statutes are truth: * they have persecuted me unjustly, do thou help me."
    status:
      la: verified
      en: verified
  - n: 87
    text:
      la: "Paulo minus consummavérunt me in terra: * ego autem non derelíqui mandáta tua."
      en: "They had almost made an end of me upon earth: * but I have not forsaken thy commandments."
    status:
      la: verified
      en: verified
  - n: 88
    text:
      la: "Secúndum misericórdiam tuam vivífica me: * et custódiam testimónia oris tui."
      en: "Quicken thou me according to thy mercy: * and I shall keep the testimonies of thy mouth."
    status:
      la: verified
      en: verified
  - n: 89
    text:
      la: "(Lamed) In ætérnum, Dómine, * verbum tuum pérmanet in cælo."
      en: "(Lamed) For ever, O Lord, * thy word standeth firm in heaven."
    status:
      la: verified
      en: verified
  - n: 90
    text:
      la: "In generatiónem et generatiónem véritas tua: * fundásti terram, et pérmanet."
      en: "Thy truth unto all generations: * thou hast founded the earth, and it continueth."
    status:
      la: verified
      en: verified
  - n: 91
    text:
      la: "Ordinatióne tua persevérat dies: * quóniam ómnia sérviunt tibi."
      en: "By thy ordinance the day goeth on: * for all things serve thee."
    status:
      la: verified
      en: verified
  - n: 92
    text:
      la: "Nisi quod lex tua meditátio mea est: * tunc forte periíssem in humilitáte mea."
      en: "Unless thy law had been my meditation, * I had then perhaps perished in my abjection."
    status:
      la: verified
      en: verified
  - n: 93
    text:
      la: "In ætérnum non oblivíscar justificatiónes tuas: * quia in ipsis vivificásti me."
      en: "Thy justifications I will never forget: * for by them thou hast given me life."
    status:
      la: verified
      en: verified
  - n: 94
    text:
      la: "Tuus sum ego, salvum me fac: * quóniam justificatiónes tuas exquisívi."
      en: "I am thine, save thou me: * for I have sought thy justifications."
    status:
      la: verified
      en: verified
  - n: 95
    text:
      la: "Me exspectavérunt peccatóres ut pérderent me: * testimónia tua intelléxi."
      en: "The wicked have waited for me to destroy me: * but I have understood thy testimonies."
    status:
      la: verified
      en: verified
  - n: 96
    text:
      la: "Omnis consummatiónis vidi finem: * latum mandátum tuum nimis."
      en: "I have seen an end of all perfection: * thy commandment is exceeding broad."
    status:
      la: verified
      en: verified
  - n: 97
    text:
      la: "(Mem) Quómodo diléxi legem tuam, Dómine? * tota die meditátio mea est."
      en: "(Mem) How have I loved thy law, O Lord! * it is my meditation all the day."
    status:
      la: verified
      en: verified
  - n: 98
    text:
      la: "Super inimícos meos prudéntem me fecísti mandáto tuo: * quia in ætérnum mihi est."
      en: "Through thy commandment, thou hast made me wiser than my enemies: * for it is ever with me."
    status:
      la: verified
      en: verified
  - n: 99
    text:
      la: "Super omnes docéntes me intelléxi: * quia testimónia tua meditátio mea est."
      en: "I have understood more than all my teachers: * because thy testimonies are my meditation."
    status:
      la: verified
      en: verified
  - n: 100
    text:
      la: "Super senes intelléxi: * quia mandáta tua quæsívi."
      en: "I have had understanding above ancients: * because I have sought thy commandments."
    status:
      la: verified
      en: verified
  - n: 101
    text:
      la: "Ab omni via mala prohíbui pedes meos: * ut custódiam verba tua."
      en: "I have restrained my feet from every evil way: * that I may keep thy words."
    status:
      la: verified
      en: verified
  - n: 102
    text:
      la: "A judíciis tuis non declinávi: * quia tu legem posuísti mihi."
      en: "I have not declined from thy judgments, * because thou hast set me a law."
    status:
      la: verified
      en: verified
  - n: 103
    text:
      la: "Quam dúlcia fáucibus meis elóquia tua, * super mel ori meo!"
      en: "How sweet are thy words to my palate! * more than honey to my mouth."
    status:
      la: verified
      en: verified
  - n: 104
    text:
      la: "A mandátis tuis intelléxi: * proptérea odívi omnem viam iniquitátis."
      en: "By thy commandments I have had understanding: * therefore have I hated every way of iniquity."
    status:
      la: verified
      en: verified
  - n: 105
    text:
      la: "(Nun) Lucérna pédibus meis verbum tuum, * et lumen sémitis meis."
      en: "(Nun) Thy word is a lamp to my feet, * and a light to my paths."
    status:
      la: verified
      en: verified
  - n: 106
    text:
      la: "Jurávi, et státui * custodíre judícia justítiæ tuæ."
      en: "I have sworn and am determined * to keep the judgments of thy justice."
    status:
      la: verified
      en: verified
  - n: 107
    text:
      la: "Humiliátus sum usquequáque, Dómine: * vivífica me secúndum verbum tuum."
      en: "I have been humbled, O Lord, exceedingly: * quicken thou me according to thy word."
    status:
      la: verified
      en: verified
  - n: 108
    text:
      la: "Voluntária oris mei beneplácita fac, Dómine: * et judícia tua doce me."
      en: "The free offerings of my mouth make acceptable, O Lord: * and teach me thy judgments."
    status:
      la: verified
      en: verified
  - n: 109
    text:
      la: "Ánima mea in mánibus meis semper: * et legem tuam non sum oblítus."
      en: "My soul is continually in my hands: * and I have not forgotten thy law."
    status:
      la: verified
      en: verified
  - n: 110
    text:
      la: "Posuérunt peccatóres láqueum mihi: * et de mandátis tuis non errávi."
      en: "Sinners have laid a snare for me: * but I have not erred from thy precepts."
    status:
      la: verified
      en: verified
  - n: 111
    text:
      la: "Hereditáte acquisívi testimónia tua in ætérnum: * quia exsultátio cordis mei sunt."
      en: "I have purchased thy testimonies for an inheritance for ever: * because they are the joy of my heart."
    status:
      la: verified
      en: verified
  - n: 112
    text:
      la: "Inclinávi cor meum ad faciéndas justificatiónes tuas in ætérnum, * propter retributiónem."
      en: "I have inclined my heart to do thy justifications for ever, * for the reward."
    status:
      la: verified
      en: verified
  - n: 113
    text:
      la: "(Samech) Iníquos ódio hábui: * et legem tuam diléxi."
      en: "(Samech) I have hated the unjust: * and I have loved thy law."
    status:
      la: verified
      en: verified
  - n: 114
    text:
      la: "Adjútor et suscéptor meus es tu: * et in verbum tuum supersperávi."
      en: "Thou art my helper and my protector: * and in thy word I have greatly hoped."
    status:
      la: verified
      en: verified
  - n: 115
    text:
      la: "Declináte a me, malígni: * et scrutábor mandáta Dei mei."
      en: "Depart from me, ye malignant: * and I will search the commandments of my God."
    status:
      la: verified
      en: verified
  - n: 116
    text:
      la: "Súscipe me secúndum elóquium tuum, et vivam: * et non confúndas me ab exspectatióne mea."
      en: "Uphold me according to thy word, and I shall live: * and let me not be confounded in my expectation."
    status:
      la: verified
      en: verified
  - n: 117
    text:
      la: "Ádjuva me, et salvus ero: * et meditábor in justificatiónibus tuis semper."
      en: "Help me, and I shall be saved: * and I will meditate always on thy justifications."
    status:
      la: verified
      en: verified
  - n: 118
    text:
      la: "Sprevísti omnes discedéntes a judíciis tuis: * quia injústa cogitátio eórum."
      en: "Thou hast despised all them that fall off from thy judgments; * for their thought is unjust."
    status:
      la: verified
      en: verified
  - n: 119
    text:
      la: "Prævaricántes reputávi omnes peccatóres terræ: * ídeo diléxi testimónia tua."
      en: "I have accounted all the sinners of the earth prevaricators: * therefore have I loved thy testimonies."
    status:
      la: verified
      en: verified
  - n: 120
    text:
      la: "Confíge timóre tuo carnes meas: * a judíciis enim tuis tímui."
      en: "Pierce thou my flesh with thy fear: * for I am afraid of thy judgments."
    status:
      la: verified
      en: verified
  - n: 121
    text:
      la: "(Ain) Feci judícium et justítiam: * non tradas me calumniántibus me."
      en: "(Ain) I have done judgment and justice: * give me not up to them that slander me."
    status:
      la: verified
      en: verified
  - n: 122
    text:
      la: "Súscipe servum tuum in bonum: * non calumniéntur me supérbi."
      en: "Uphold thy servant unto good: * let not the proud calumniate me."
    status:
      la: verified
      en: verified
  - n: 123
    text:
      la: "Óculi mei defecérunt in salutáre tuum: * et in elóquium justítiæ tuæ."
      en: "My eyes have fainted after thy salvation: * and for the word of thy justice."
    status:
      la: verified
      en: verified
  - n: 124
    text:
      la: "Fac cum servo tuo secúndum misericórdiam tuam: * et justificatiónes tuas doce me."
      en: "Deal with thy servant according to thy mercy: * and teach me thy justifications."
    status:
      la: verified
      en: verified
  - n: 125
    text:
      la: "Servus tuus sum ego: * da mihi intelléctum, ut sciam testimónia tua."
      en: "I am thy servant: * give me understanding that I may know thy testimonies."
    status:
      la: verified
      en: verified
  - n: 126
    text:
      la: "Tempus faciéndi, Dómine: * dissipavérunt legem tuam."
      en: "It is time, O Lord, to do: * they have dissipated thy law."
    status:
      la: verified
      en: verified
  - n: 127
    text:
      la: "Ídeo diléxi mandáta tua, * super aurum et topázion."
      en: "Therefore have I loved thy commandments * above gold and the topaz."
    status:
      la: verified
      en: verified
  - n: 128
    text:
      la: "Proptérea ad ómnia mandáta tua dirigébar: * omnem viam iníquam ódio hábui."
      en: "Therefore was I directed to all thy commandments: * I have hated all wicked ways."
    status:
      la: verified
      en: verified
  - n: 129
    text:
      la: "(Phe) Mirabília testimónia tua: * ídeo scrutáta est ea ánima mea."
      en: "(Phe) Thy testimonies are wonderful: * therefore my soul hath sought them."
    status:
      la: verified
      en: verified
  - n: 130
    text:
      la: "Declarátio sermónum tuórum illúminat: * et intelléctum dat párvulis."
      en: "The declaration of thy words giveth light: * and giveth understanding to little ones."
    status:
      la: verified
      en: verified
  - n: 131
    text:
      la: "Os meum apérui, et attráxi spíritum: * quia mandáta tua desiderábam."
      en: "I opened my mouth, and panted: * because I longed for thy commandments."
    status:
      la: verified
      en: verified
  - n: 132
    text:
      la: "Áspice in me, et miserére mei, * secúndum judícium diligéntium nomen tuum."
      en: "Look thou upon me, and have mercy on me, * according to the judgment of them that love thy name."
    status:
      la: verified
      en: verified
  - n: 133
    text:
      la: "Gressus meos dírige secúndum elóquium tuum: * et non dominétur mei omnis injustítia."
      en: "Direct my steps according to thy word: * and let no iniquity have dominion over me."
    status:
      la: verified
      en: verified
  - n: 134
    text:
      la: "Rédime me a calúmniis hóminum: * ut custódiam mandáta tua."
      en: "Redeem me from the calumnies of men: * that I may keep thy commandments."
    status:
      la: verified
      en: verified
  - n: 135
    text:
      la: "Fáciem tuam illúmina super servum tuum: * et doce me justificatiónes tuas."
      en: "Make thy face to shine upon thy servant: * and teach me thy justifications."
    status:
      la: verified
      en: verified
  - n: 136
    text:
      la: "Éxitus aquárum deduxérunt óculi mei: * quia non custodiérunt legem tuam."
      en: "My eyes have sent forth springs of water: * because they have not kept thy law."
    status:
      la: verified
      en: verified
  - n: 137
    text:
      la: "(Sade) Justus es, Dómine: * et rectum judícium tuum."
      en: "(Sade) Thou art just, O Lord: * and thy judgment is right."
    status:
      la: verified
      en: verified
  - n: 138
    text:
      la: "Mandásti justítiam testimónia tua: * et veritátem tuam nimis."
      en: "Thou hast commanded justice thy testimonies: * and thy truth exceedingly."
    status:
      la: verified
      en: verified
  - n: 139
    text:
      la: "Tabéscere me fecit zelus meus: * quia oblíti sunt verba tua inimíci mei."
      en: "My zeal hath made me pine away: * because my enemies forgot thy words."
    status:
      la: verified
      en: verified
  - n: 140
    text:
      la: "Ignítum elóquium tuum veheménter: * et servus tuus diléxit illud."
      en: "Thy word is exceedingly refined: * and thy servant hath loved it."
    status:
      la: verified
      en: verified
  - n: 141
    text:
      la: "Adolescéntulus sum ego et contémptus: * justificatiónes tuas non sum oblítus."
      en: "I am very young and despised; but * I forget not thy justifications."
    status:
      la: verified
      en: verified
  - n: 142
    text:
      la: "Justítia tua, justítia in ætérnum: * et lex tua véritas."
      en: "Thy justice is justice for ever: * and thy law is the truth."
    status:
      la: verified
      en: verified
  - n: 143
    text:
      la: "Tribulátio, et angústia invenérunt me: * mandáta tua meditátio mea est."
      en: "Trouble and anguish have found me: * thy commandments are my meditation."
    status:
      la: verified
      en: verified
  - n: 144
    text:
      la: "Ǽquitas testimónia tua in ætérnum: * intelléctum da mihi, et vivam."
      en: "Thy testimonies are justice for ever: * give me understanding, and I shall live."
    status:
      la: verified
      en: verified
  - n: 145
    text:
      la: "(Coph) Clamávi in toto corde meo, exáudi me, Dómine: * justificatiónes tuas requíram."
      en: "(Coph) I cried with my whole heart, hear me, O Lord: * I will seek thy justifications."
    status:
      la: verified
      en: verified
  - n: 146
    text:
      la: "Clamávi ad te, salvum me fac: * ut custódiam mandáta tua."
      en: "I cried unto thee, save me: * that I may keep thy commandments."
    status:
      la: verified
      en: verified
  - n: 147
    text:
      la: "Prævéni in maturitáte, et clamávi: * quia in verba tua supersperávi."
      en: "I prevented the dawning of the day, and cried: * because in thy words I very much hoped."
    status:
      la: verified
      en: verified
  - n: 148
    text:
      la: "Prævenérunt óculi mei ad te dilúculo: * ut meditárer elóquia tua."
      en: "My eyes to thee have prevented the morning: * that I might meditate on thy words."
    status:
      la: verified
      en: verified
  - n: 149
    text:
      la: "Vocem meam audi secúndum misericórdiam tuam, Dómine: * et secúndum judícium tuum vivífica me."
      en: "Hear thou my voice, O Lord, according to thy mercy: * and quicken me according to thy judgment."
    status:
      la: verified
      en: verified
  - n: 150
    text:
      la: "Appropinquavérunt persequéntes me iniquitáti: * a lege autem tua longe facti sunt."
      en: "They that persecute me have drawn nigh to iniquity; * but they are gone far off from thy law."
    status:
      la: verified
      en: verified
  - n: 151
    text:
      la: "Prope es tu, Dómine: * et omnes viæ tuæ véritas."
      en: "Thou art near, O Lord: * and all thy ways are truth."
    status:
      la: verified
      en: verified
  - n: 152
    text:
      la: "Inítio cognóvi de testimóniis tuis: * quia in ætérnum fundásti ea."
      en: "I have known from the beginning concerning thy testimonies: * that thou hast founded them for ever."
    status:
      la: verified
      en: verified
  - n: 153
    text:
      la: "(Res) Vide humilitátem meam, et éripe me: * quia legem tuam non sum oblítus."
      en: "(Res) See my humiliation and deliver me: * for I have not forgotten thy law."
    status:
      la: verified
      en: verified
  - n: 154
    text:
      la: "Júdica judícium meum, et rédime me: * propter elóquium tuum vivífica me."
      en: "Judge my judgment and redeem me: * quicken thou me for thy word’s sake."
    status:
      la: verified
      en: verified
  - n: 155
    text:
      la: "Longe a peccatóribus salus: * quia justificatiónes tuas non exquisiérunt."
      en: "Salvation is far from sinners; * because they have not sought thy justifications."
    status:
      la: verified
      en: verified
  - n: 156
    text:
      la: "Misericórdiæ tuæ multæ, Dómine: * secúndum judícium tuum vivífica me."
      en: "Many, O Lord, are thy mercies: * quicken me according to thy judgment."
    status:
      la: verified
      en: verified
  - n: 157
    text:
      la: "Multi qui persequúntur me, et tríbulant me: * a testimóniis tuis non declinávi."
      en: "Many are they that persecute me, and afflict me; * but I have not declined from thy testimonies."
    status:
      la: verified
      en: verified
  - n: 158
    text:
      la: "Vidi prævaricántes, et tabescébam: * quia elóquia tua non custodiérunt."
      en: "I beheld the transgressors, and I pined away; * because they kept not thy word."
    status:
      la: verified
      en: verified
  - n: 159
    text:
      la: "Vide quóniam mandáta tua diléxi, Dómine: * in misericórdia tua vivífica me."
      en: "Behold I have loved thy commandments, O Lord; * quicken me thou in thy mercy."
    status:
      la: verified
      en: verified
  - n: 160
    text:
      la: "Princípium verbórum tuórum, véritas: * in ætérnum ómnia judícia justítiæ tuæ."
      en: "The beginning of thy words is truth: * all the judgments of thy justice are for ever."
    status:
      la: verified
      en: verified
  - n: 161
    text:
      la: "(Sin) Príncipes persecúti sunt me gratis: * et a verbis tuis formidávit cor meum."
      en: "(Sin) Princes have persecuted me without cause: * and my heart hath been in awe of thy words."
    status:
      la: verified
      en: verified
  - n: 162
    text:
      la: "Lætábor ego super elóquia tua: * sicut qui invénit spólia multa."
      en: "I will rejoice at thy words, * as one that hath found great spoil."
    status:
      la: verified
      en: verified
  - n: 163
    text:
      la: "Iniquitátem ódio hábui, et abominátus sum: * legem autem tuam diléxi."
      en: "I have hated and abhorred iniquity; * but I have loved thy law."
    status:
      la: verified
      en: verified
  - n: 164
    text:
      la: "Sépties in die laudem dixi tibi, * super judícia justítiæ tuæ."
      en: "Seven times a day I have given praise to thee, * for the judgments of thy justice."
    status:
      la: verified
      en: verified
  - n: 165
    text:
      la: "Pax multa diligéntibus legem tuam: * et non est illis scándalum."
      en: "Much peace have they that love thy law, * and to them there is no stumbling-block."
    status:
      la: verified
      en: verified
  - n: 166
    text:
      la: "Exspectábam salutáre tuum, Dómine: * et mandáta tua diléxi."
      en: "I looked for thy salvation, O Lord: * and I loved thy commandments."
    status:
      la: verified
      en: verified
  - n: 167
    text:
      la: "Custodívit ánima mea testimónia tua: * et diléxit ea veheménter."
      en: "My soul hath kept thy testimonies: * and hath loved them exceedingly."
    status:
      la: verified
      en: verified
  - n: 168
    text:
      la: "Servávi mandáta tua, et testimónia tua: * quia omnes viæ meæ in conspéctu tuo."
      en: "I have kept thy commandments and thy testimonies: * because all my ways are in thy sight."
    status:
      la: verified
      en: verified
  - n: 169
    text:
      la: "(Thau) Appropínquet deprecátio mea in conspéctu tuo, Dómine: * juxta elóquium tuum da mihi intelléctum."
      en: "(Tau) Let my supplication, O Lord, come near in thy sight: * give me understanding according to thy word."
    status:
      la: verified
      en: verified
  - n: 170
    text:
      la: "Intret postulátio mea in conspéctu tuo: * secúndum elóquium tuum éripe me."
      en: "Let my request come in before thee; * deliver thou me according to thy word."
    status:
      la: verified
      en: verified
  - n: 171
    text:
      la: "Eructábunt lábia mea hymnum, * cum docúeris me justificatiónes tuas."
      en: "My lips shall utter a hymn, * when thou shalt teach me thy justifications."
    status:
      la: verified
      en: verified
  - n: 172
    text:
      la: "Pronuntiábit lingua mea elóquium tuum: * quia ómnia mandáta tua ǽquitas."
      en: "My tongue shall pronounce thy word: * because all thy commandments are justice."
    status:
      la: verified
      en: verified
  - n: 173
    text:
      la: "Fiat manus tua ut salvet me: * quóniam mandáta tua elégi."
      en: "Let thy hand be with me to save me; * for I have chosen thy precepts."
    status:
      la: verified
      en: verified
  - n: 174
    text:
      la: "Concupívi salutáre tuum, Dómine: * et lex tua meditátio mea est."
      en: "I have longed for thy salvation, O Lord; * and thy law is my meditation."
    status:
      la: verified
      en: verified
  - n: 175
    text:
      la: "Vivet ánima mea, et laudábit te: * et judícia tua adjuvábunt me."
      en: "My soul shall live and shall praise thee: * and thy judgments shall help me."
    status:
      la: verified
      en: verified
  - n: 176
    text:
      la: "Errávi, sicut ovis, quæ périit: * quære servum tuum, quia mandáta tua non sum oblítus."
      en: "I have gone astray like a sheep that is lost: * seek thy servant, because I have not forgotten thy commandments."
    status:
      la: verified
      en: verified
