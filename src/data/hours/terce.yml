# Ordo verified against Divinum Officium (Monastic Tridentinum 1617), clean
# per-annum runs with no sanctoral override (2026-08-09 Sun, 2026-08-31 Mon,
# 2026-10-13 Tue) — see src/hours/terce.ts for how each part resolves.
#
# Deliberately deviates from that verified source in one place, matching
# Prime's own precedent: the opening Pater/Ave (said silently before "Deus
# in adjutórium") is dropped, to keep the hour shorter.
#
# Real structure, confirmed directly against the engine: opening versicle,
# hymn (self-contained, no seasonal doxology swap — see terce-hymn.yml),
# one antiphon framing all three psalms (incipit before, full repeat after), capitulum with its own embedded
# short versicle/response (*not* a separate elaborate responsory the way
# Prime's chapter-responsory.ts adds one — Monastic Terce doesn't have
# one), the day's own collect, and a closing that's identical across all
# three Little Hours (see little-hour-conclusio.yml). No Creed — real
# Monastic Terce/Sext/None doesn't have one.
#
# Preces (Kyrie/Pater Noster + a short V/R litany) were added after the
# chapter/collect, by deliberate choice, even though real Monastic
# Terce/Sext/None has none — see minor-hour-preces-feriales.yml's header
# for the reference-engine source, mirroring the same deviation already
# made for Prime. Split 2026-09-01, by explicit choice: the Kyrie/Pater
# Noster piece (minor-hour-kyrie-pater) always shows regardless of rank,
# while the further Preces versicles proper (minor-hour-preces-feriales,
# now trimmed to just those) are ferial-only (`ferialOnly: true`) —
# see hours/resolve-common.ts's isFerialOrVigil, the same predicate
# Lauds'/Vespers' own ferial Preces use.
id: terce
parts:
  - kind: opening-versicle
  - kind: hymn
    textRef: { source: common, id: terce-hymn }
  - kind: variable
    resolve: by-weekday
  - kind: closing-antiphon
  - kind: chapter
    textRef: { source: common, id: terce-capitulum-per-annum }
  - kind: preces
    textRef: { source: common, id: minor-hour-kyrie-pater }
  - kind: preces
    textRef: { source: common, id: minor-hour-preces-feriales }
    label: Preces
    ferialOnly: true
  - kind: day-collect
  - kind: preces
    textRef: { source: common, id: little-hour-conclusio }
    label: Conclusion
