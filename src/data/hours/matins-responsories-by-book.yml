      en: "Lord our Ruler, how excellent is thy Name in all the earth!"

# `soph` sourced from Latin/Tempora/111-3.txt, English/Tempora/111-3.txt
# (November week 1's own Thursday — 115-3.txt, Sophonias/Zephaniah's own
# week file, `@`-references this exact tag). Only 1 entry: that file's own
# English has no Responsory2/3.
soph:
  - r:
      la: "Indicábo tibi, homo, quid sit bonum aut quid Dóminus requírat a te: * Fácere judícium et justítiam et sollícitum ambuláre cum Deo tuo."
      en: "I will show thee, O man, what is good, and what doth the Lord require of thee, but to * Do justice and judgment, and to walk humbly with thy God."
    v:
      la: "Spera in Dómino, et fac bonitátem, et inhábita terram."
      en: "Trust in the Lord, and do good, and dwell in the land."

