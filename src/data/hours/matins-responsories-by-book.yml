      en: "Deliver me from all mine iniquities, O Lord."

# `eph` reuses Latin/Tempora/Epi2-3.txt, English/Tempora/Epi2-3.txt
# (Ephesians' own Epi3-3.txt `@`-references this tag).
eph:
  - r:
      la: "Ne perdíderis me cum iniquitátibus meis: * Neque in finem irátus resérves mala mea."
      en: "Cut me not off in the midst of my sins. * Nor keep thy wrath against me for my latter end."
    v:
      la: "Non intres in judícium cum servo tuo, Dómine."
      en: "Enter not into judgment with thy servant, O Lord."
  - r:
      la: "Parátum cor meum, Deus, parátum cor meum: * Cantábo et psalmum dicam Dómino."
      en: "My heart is ready, O God, my heart is ready. * I will sing and give praise to the Lord."
    v:
      la: "Exsúrge, glória mea, exsúrge, psaltérium et cíthara, exsúrgam dilúculo."
      en: "Awake up, my glory, awake, psaltery and harp! I will awake early."
  - r:
      la: "Adjútor meus, tibi psallam, quia, Deus, suscéptor meus es: * Deus meus, misericórdia mea."
      en: "Unto thee, O my Strength, will I sing, for God is my defence, * The God of my mercy."
    v:
      la: "Lætábor, et exsultábo in te, psallam nómini tuo, Altíssime."
      en: "I will be glad and rejoice in thee, I will sing praise to thy Name, O Thou Most High."

# `1thess`/`tit` reuse Latin/Tempora/Epi2-4.txt, English/Tempora/Epi2-4.txt
# (1 Thessalonians' own Epi4-4.txt and Titus' own Epi5-4.txt both
# `@`-reference this tag).
1thess:
  - r:
      la: "Deus, in te sperávi, Dómine, non confúndar in ætérnum: in justítia tua líbera me, * Et éripe me."
      en: "In thee, O God, do I put my trust; let me never be put to confusion, O Lord deliver me in thy righteousness, * And cause me to escape."
    v:
      la: "Inclína ad me aurem tuam, et salva me."
      en: "Incline thine ear unto me, deliver me speedily."
  - r:
      la: "Repleátur os meum laude tua, ut hymnum dicam glóriæ tuæ, tota die magnitúdinem tuam: noli me proícere in témpore senectútis: * Dum defécerit in me virtus mea, ne derelínquas me."
      en: "Let my mouth be filled with thy praise, that I may sing of thy glory, all the day long of thy greatness. Cast me not off in the time of old age; * Forsake me not when my strength faileth."
    v:
      la: "Gaudébunt lábia mea cum cantávero tibi."
      en: "My lips shall be fain when I sing unto thee."
  - r:
      la: "Gaudébunt lábia mea cum cantávero tibi: * Et ánima mea, quam redemísti, Dómine."
      en: "My lips shall be fain when I sing unto thee; * And my soul, which Thou, O Lord, hast redeemed."
    v:
      la: "Sed et lingua mea meditábitur justítiam tuam, tota die laudem tuam."
      en: "My tongue shall also talk of thy righteousness, all the day long of thy praise."
