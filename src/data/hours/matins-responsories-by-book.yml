# `act` sourced from Latin/Tempora/Pasc5-4.txt, English/Tempora/Pasc5-4.txt
# (Ascension Day's own Matins) — the reading (Acts 1, the Ascension
# narrative) and its responsories are the feast's own genuinely proper
# content, not an unrelated override (unlike the Sacred Heart/Jeremiah
# case elsewhere in this file) — Ascension Day's Nocturn 1 IS Acts 1.
act:
  - r:
      la: "Post passiónem suam per dies quadragínta appárens eis, et loquens de regno Dei, allelúja: * Et, vidéntibus illis, elevátus est, allelúja: et nubes suscépit eum ab óculis eórum, allelúja."
      en: "Being seen of them forty days after that He had suffered, and speaking of the kingdom of God. Alleluia. * And while they beheld, He was taken up, and a cloud received Him out of their sight. Alleluia."
    v:
      la: "Et convéscens, præcépit eis, ab Jerosólymis ne discéderent, sed exspectárent promissiónem Patris."
      en: "And, eating together with them, He commanded them that they should not depart from Jerusalem, but wait for the Promise of the Father."
  - r:
      la: "Omnis pulchritúdo Dómini exaltáta est super sídera: * Spécies ejus in núbibus cæli, et nomen ejus in ætérnum pérmanet, allelúja."
      en: "The Lord hath set His beauty above the stars; * His loveliness is in the clouds of heaven, and His Name endureth for ever. Alleluia."
    v:
      la: "A summo cælo egréssio ejus, et occúrsus ejus usque ad summum ejus."
      en: "His going forth is from the end of the heaven, and His circuit unto the ends of it."
  - r:
      la: "Exaltáre, Dómine, allelúja, * In virtúte tua, allelúja."
      en: "Be Thou exalted, O Lord. Alleluia. * In thine Own strength. Alleluia."
    v:
      la: "Eleváta est, magnificéntia tua super cælos, Deus."
      en: "O God, Thou hast set thy glory above the heavens."

# `apoc` sourced from Latin/Tempora/Pasc3-0.txt, English/Tempora/Pasc3-0.txt
# (Easter III Sunday — its own ordinary Paschaltide-Sunday rank, the
# week Apocalypse's own reading begins).
apoc:
  - r:
      la: "Dignus es, Dómine, accípere librum, et aperíre signácula ejus, allelúja: quóniam occísus es, et redemísti nos Deo * In sánguine tuo, allelúja."
      en: "Thou art worthy, O Lord, to take the book, and to open the seals thereof; alleluia: because thou wast slain, and hast redeemed us to God, * In thy blood, alleluia."
    v:
      la: "Fecísti enim nos Deo nostro regnum et sacerdótium."
      en: "And hast made us to our God a kingdom and priests."
  - r:
      la: "Ego sicut vitis fructificávi suavitátem odóris, allelúja: * Transíte ad me, omnes qui concupíscitis me, et a generatiónibus meis adimplémini, allelúja, allelúja."
      en: "As the vine I have brought forth a pleasant odour, alleluia. * Come over to me, all ye that desire me, and be filled with my fruits, alleluia, alleluia."
    v:
      la: "In me omnis grátia viæ et veritátis: in me omnes spes vitæ et virtútis."
      en: "in me is all hope of life and of virtue."
  - r:
      la: "Audívi vocem de cælo, tamquam vocem tonítrui magni, allelúja: Regnábit Deus noster in ætérnum, allelúja: * Quia facta est salus, et virtus, et potéstas Christi ejus, allelúja, allelúja."
      en: "And I heard a voice from heaven, the voice of great thunder, alleluia: the Lord our God shall reign for ever, alleluia: * Now is come salvation, and strength, and the power of his Christ, alleluia, alleluia."
    v:
      la: "Et vox de throno exívit, dicens: Laudem dícite Deo nostro, omnes Sancti ejus, et qui timétis Deum, pusílli et magni."
      en: "And a voice came out from the throne, saying: Give praise to our God, all saints of Him that fear him, little and great."

# `jac` sourced from Latin/Tempora/Pasc4-0.txt, English/Tempora/Pasc4-0.txt
# (Easter IV Sunday, James' own reading week) — the ordinary Paschaltide
# Sunday psalm-based responsory set (Ps 136/76/21), not James-specific
# thematically, same "loose match" convention used throughout this file.
jac:
  - r:
      la: "Si oblítus fúero tui, allelúja, obliviscátur mei déxtera mea: * Adhǽreat lingua mea fáucibus meis, si non memínero tui, allelúja, allelúja."
      en: "If I forget thee, Alleluia, let my right hand forget me. * If I do not remember thee, let my tongue cleave to the roof of my mouth, alleluia, alleluia."
    v:
      la: "Super flúmina Babylónis illic sédimus et flévimus, dum recordarémur tui, Sion."
      en: "By the rivers of Babylon there we sat down and wept, when we remembered thee, O Zion."
  - r:
      la: "Vidérunt te aquæ, Deus, vidérunt te aquæ, et timuérunt: * Multitúdo sónitus aquárum vocem dedérunt nubes, allelúja, allelúja, allelúja."
      en: "The waters saw thee, O God, the waters saw thee and they were afraid. * There was a noise as of many waters the clouds sent out a sound, alleluia, alleluia, alleluia."
    v:
      la: "Illuxérunt coruscatiónes tuæ orbi terræ: vidit et commóta est terra."
      en: "thy lightnings lightened the world the earth saw it and shook."
  - r:
      la: "Narrábo nomen tuum frátribus meis, allelúja: * In médio Ecclésiæ laudábo te, allelúja, allelúja."
      en: "I will declare thy Name unto my brethren, alleluia. * In the midst of the congregation will I praise thee, alleluia, alleluia."
    v:
      la: "Confitébor tibi in pópulis, Dómine, et psalmum dicam tibi in géntibus."
      en: "I will praise thee, O Lord, among the people, and sing unto thee among the nations."

# `heb` sourced from Latin/Tempora/Quad6-5.txt, English/Tempora/Quad6-5.txt
# (Good Friday's own Tenebrae Matins) — same reasoning as `lam`'s own
# header: Good Friday's high rank is intrinsically Holy Week's own, not
# an unrelated override. Passion-narrative responsories ("Omnes amici
# mei," "Velum templi scissum est," "Vinea mea electa").
heb:
  - r:
      la: "Omnes amíci mei dereliquérunt me, et prævaluérunt insidiántes mihi: trádidit me quem diligébam: * Et terribílibus óculis plaga crudéli percutiéntes, acéto potábant me."
      en: "All my friends have forsaken me, and mine enemies have prevailed against me; he whom I loved hath betrayed me. * Mine enemy sharpeneth his eyes upon me; he breaketh me with breach upon breach: and in my thirst they gave me vinegar to drink."
    v:
      la: "Inter iníquos projecérunt me, et non pepercérunt ánimæ meæ."
      en: "I am numbered with the transgressors; and my life is not spared."
  - r:
      la: "Velum templi scissum est, * Et omnis terra trémuit: latro de cruce clamábat, dicens: Meménto mei, Dómine, dum véneris in regnum tuum."
      en: "The veil of the Temple was rent in twain, from the top to the bottom, * And all the earth did quake: the thief on the cross cried, saying: Lord, remember me when Thou comest into thy kingdom!"
    v:
      la: "Petræ scissæ sunt, et monuménta apérta sunt, et multa córpora sanctórum, qui dormíerant, surrexérunt."
      en: "The rocks rent, and the graves were opened, and many bodies of the saints, which slept, arose."
  - r:
      la: "Vínea mea elécta, ego te plantávi: * Quómodo convérsa es in amaritúdinem, ut me crucifígeres et Barábbam dimítteres?"
      en: "I had planted thee a noble vineyard; * How then art thou turned into a degenerate plant, which willest that Barabbas should be released unto thee, and that I should be crucified."
    v:
      la: "Sepívi te, et lápides elégi ex te, et ædificávi turrim."
      en: "I fenced thee, and gathered out the stones from thee, and built a tower in the midst of the land."

# `luc` sourced from Latin/Tempora/Adv1-0.txt, English/Tempora/Adv1-0.txt
# (Advent I Sunday, Luke's own reading week) — a generic Advent-themed
# responsory ("Ecce virgo concipiet"), not Luke-21-specific, same loose
# match already used for the other Gospels below. Only 1 entry.
luc:
  - r:
      la: "Ecce virgo concípiet, et páriet fílium, dicit Dóminus: * Et vocábitur nomen ejus Admirábilis, Deus, Fortis."
      en: "Behold, the Virgin shall conceive, and bear a son, saith the Lord; * And His name shall be called Wonderful, the Mighty God."
    v:
      la: "Super sólium David, et super regnum ejus sedébit in ætérnum."
      en: "He shall sit upon the throne of David, and upon his kingdom for ever."

# `matt` sourced from Latin/Tempora/Adv2-0.txt, English/Tempora/Adv2-0.txt
# (Advent II Sunday, Matthew's own reading week). Only 1 entry.
matt:
  - r:
      la: "Egrediétur Dóminus de Samaría ad portam, quæ réspicit ad Oriéntem: et véniet in Béthlehem ámbulans super aquas redemptiónis Judæ: * Tunc salvus erit omnis homo: quia ecce véniet."
      en: "The Lord shall go forth out of Samaria unto the gate that looketh toward the East; and He shall come into Bethlehem, walking upon the waters of the redemption of Judah. * Then shall every one be saved for, behold, He cometh."
    v:
      la: "Et præparábitur in misericórdia sólium ejus, et sedébit super illud in veritáte."
      en: "And in mercy shall His throne be established, and He shall sit upon it in truth."

# `joan` (John's Gospel) sourced from Latin/Tempora/Adv3-0.txt,
# English/Tempora/Adv3-0.txt (Advent III Sunday, John's own reading
# week). Only 1 entry.
joan:
  - r:
      la: "Veni, Dómine, et noli tardáre: reláxa facínora plebi tuæ, * Et révoca dispérsos in terram suam."
      en: "O Lord, come and make no tarrying; loosen the bonds of thy people. * And gather again into their own land them that are scattered abroad."
    v:
      la: "Excita, Dómine, poténtiam tuam, et veni, ut salvos fácias nos."
      en: "O Lord, stir up thy strength, and come and save us."

# `marc` sourced from Latin/Tempora/Pasc0-0.txt, English/Tempora/Pasc0-0.txt
# (Easter Sunday's own Matins) — Mark 16's own Resurrection narrative and
# its genuinely proper responsories ("Angelus Domini descendit,"
# "Cum transisset sabbatum"), same reasoning as `act`/`heb` above:
# Easter's high rank isn't an unrelated override here.
marc:
  - r:
      la: "Angelus Dómini descéndit de cælo, et accédens revólvit lápidem, et super eum sedit, et dixit muliéribus: * Nolíte timére: scio enim quia crucifíxum quǽritis: jam surréxit: veníte, et vidéte locum, ubi pósitus erat Dóminus, allelúja."
      en: "The Angel of the Lord descended from heaven, and came and rolled back the stone, and sat upon it, and said unto the women: * Fear not ye; for I know that ye seek Him That was crucified: He is risen already. Come, see the place where the Lord was laid, alleluia."
    v:
      la: "Et intrántes in monuméntum vidérunt júvenem sedéntem in dextris, coopértum stola cándida, et obstupuérunt: qui dicit illis."
      en: "And entering into the sepulchre, they saw a young man sitting on the right side, clothed in a long white garment, and they were affrighted; and he saith unto them:"
  - r:
      la: "Cum transísset sábbatum, María Magdaléne, et María Jacóbi, et Salóme emérunt arómata, * Ut veniéntes úngerent Jesum, allelúja, allelúja."
      en: "When the Sabbath was passed, Mary Magdalene, and Mary the mother of James, and Salome, had bought sweet spices, * That they might come and anoint Jesus, alleluia, alleluia."
    v:
      la: "Et valde mane una sabbatórum, véniunt ad monuméntum, orto jam sole."
      en: "And very early in the morning, the first day of the week, they came unto the sepulchre, at the rising of the sun."

# `1cor` sourced from Latin/Tempora/Quad6-4.txt, English/Tempora/Quad6-4.txt,
# Responsory7-9 (Maundy Thursday's own Nocturn 3 — 1 Cor 11's Institution
# narrative, distinct from that same file's Responsory1-3 already used
# for `lam` above, its own Nocturn 1 Lamentations content). Genuinely
# proper content for the feast, not an override.
1cor:
  - r:
      la: "Eram quasi agnus ínnocens: ductus sum ad immolándum, et nesciébam: consílium fecérunt inimíci mei advérsum me, dicéntes: * Veníte, mittámus lignum in panem ejus, et eradámus eum de terra vivéntium."
      en: "I was like a gentle lamb that is brought to the slaughter, and I knew not that mine enemies had devised devices against me, saying: * Come, let us put (poison of a deadly) tree into his bread, and let us cut him off from the land of the living."
    v:
      la: "Omnes inimíci mei advérsum me cogitábant mala mihi: verbum iníquum mandavérunt advérsum me, dicéntes."
      en: "All they that hate me devised my hurt against me: they plotted together to do me evil, saying:"
  - r:
      la: "Una hora non potuístis vigiláre mecum, qui exhortabámini mori pro me? * Vel Judam non vidétis, quómodo non dormit, sed festínat trádere me Judǽis."
      en: "Could ye not watch with Me one hour, ye that called one on the other to die for Me? * Or see ye not Judas, how that he sleepeth not, but maketh haste to betray Me to the Jews?"
    v:
      la: "Quid dormítis? súrgite, et oráte, ne intrétis in tentatiónem."
      en: "Why sleep ye? Rise, and pray, lest ye enter into temptation."
  - r:
      la: "Senióres pópuli consílium fecérunt, * Ut Jesum dolo tenérent, et occíderent: cum gládiis et fústibus exiérunt tamquam ad latrónem."
      en: "The elders of the people consulted * That they might take Jesus by subtilty, and kill Him they came out, as against a thief, with swords and staves."
    v:
      la: "Collegérunt pontífices et pharisǽi concílium."
      en: "The chief Priests and the Pharisees gathered a council."

# `2cor` sourced from Latin/Tempora/Epi2-0.txt, English/Tempora/Epi2-0.txt
# (Epiphany II Sunday, its own ordinary rank, 2 Corinthians' own reading
# week).
2cor:
  - r:
      la: "Dómine, ne in ira tua árguas me, neque in furóre tuo corrípias me: * Miserére mei, Dómine, quóniam infírmus sum."
      en: "O Lord, rebuke me not in thine anger, neither chasten me in thine hot displeasure. * Have mercy upon me, O Lord, for I am weak."
    v:
      la: "Timor et tremor venérunt super me, et contexérunt me ténebræ."
      en: "Fearfulness and trembling are come upon me, and darkness hath overwhelmed me."
  - r:
      la: "Deus, qui sedes super thronum, et júdicas æquitátem, esto refúgium páuperum in tribulatióne: * Quia tu solus labórem et dolórem consíderas."
      en: "O God, Which satest in the throne judging right, be Thou a refuge for the poor, a refuge in times of trouble. * For Thou alone beholdest mischief and spite."
    v:
      la: "Tibi enim derelíctus est pauper, pupíllo tu eris adjútor."
      en: "The poor leaveth himself unto thee; Thou wilt be the helper of the fatherless."
  - r:
      la: "A dextris est mihi Dóminus, ne commóvear: * Propter hoc dilatátum est cor meum, et exsultávit lingua mea."
      en: "The Lord is at my right hand, I shall never be moved. * Therefore my heart is glad, and my tongue rejoiceth."
    v:
      la: "Dóminus pars hereditátis meæ, et cálicis mei."
      en: "The Lord is the portion of mine inheritance, and of my cup."

# `1pet` sourced from Latin/Tempora/Pasc4-0.txt, English/Tempora/Pasc4-0.txt,
# Responsory4-6 (1 Peter's own reading week, Pasc5-2.txt, `@`-references
# these three — the same ordinary Paschaltide Sunday psalm-set already
# used for `jas` above, R1-3 there, R4-6 here).
1pet:
  - r:
      la: "In ecclésiis benedícite Deo, allelúja: * Dómino de fóntibus Israël, allelúja, allelúja."
      en: "Bless ye God in the congregations, alleluia. * Even the Lord, ye that are of the fountains of Israel, alleluia, alleluia."
    v:
      la: "Psalmum dícite nómini ejus, date glóriam laudi ejus."
      en: "Sing forth the honour of His Name, make His praise glorious."
  - r:
      la: "In toto corde meo, allelúja, exquisívi te, allelúja: * Ne repéllas me a mandátis tuis, allelúja, allelúja."
      en: "With my whole heart, alleluia, have I sought thee, alleluia. * O let me not wander from thy commandments, alleluia, alleluia."
    v:
      la: "Benedíctus es tu, Dómine, doce me justificatiónes tuas."
      en: "Blessed art Thou, O Lord; teach me thy statutes."
  - r:
      la: "Hymnum cantáte nobis, allelúja: * Quómodo cantábimus cánticum Dómini in terra aliéna? allelúja, allelúja."
      en: "Sing us a song, alleluia. * How shall we sing the Lord's song in a strange land, alleluia, alleluia."
    v:
      la: "Illic interrogavérunt nos, qui captívos duxérunt nos, verba cantiónum."
      en: "There they that carried us away captive required of us a song."

# `1joan` sourced from Latin/Tempora/Pasc6-0.txt, English/Tempora/Pasc6-0.txt,
# Responsory8 (Sunday within the Octave of the Ascension, 1 John's own
# reading week — Paraclete/Holy Spirit theme, fitting for the approach to
# Pentecost). Only 1 entry.
1joan:
  - r:
      la: "Si enim non abíero, Paráclitus non véniet ad vos: si autem abíero, mittam eum ad vos. * Cum autem vénerit ille, docébit vos omnem veritátem, allelúja."
      en: "For if I go not away, the Comforter will not come unto you; but if I depart, I will send Him unto you; * And when He is come, He will guide you into all truth. Alleluia."
    v:
      la: "Non enim loquétur a semetípso: sed quæcúmque áudiet, loquétur: et quæ ventúra sunt, annuntiábit vobis."
      en: "For He shall not speak of Himself; but whatsoever He shall hear, that shall He speak and He will show you things to come."

