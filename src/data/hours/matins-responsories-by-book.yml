# A per-book pool of Matins responsories, matched loosely (by scriptural
# book, not exact citation) rather than tied to a specific chapter/verse —
# per the user's own description (2026-08): responsories aren't attuned to
# chapter/verse historically, so a book-level match is the right
# granularity, not a gap to fill in later with exact citations.
#
# Seeded, not a full pool — 66 of the 72 books actually used in the user's
# own bible-plan (data/hours/bible-plan/*.yml), the rest deferred bulk
# content (see TODO.md). Cycled in order
# per-day when a Nocturn-1 reading's book has more than one candidate
# responsory available; the day's own responsory count doesn't have to
# match the pool's size.
#
# `isa` sourced from a live query (Monastic Tridentinum 1617, 2026-12-15,
# a plain ferial Tuesday of Advent III — real, un-summer-contracted
# Lectio 1-3 on Isa 30:18-28) — this is genuine historical Advent-season
# Isaiah content, reused here as a loose match for the user's own
# continuous Isaiah reading even though the exact chapters differ (Isa
# 36-37 vs. the source's own Isa 30), consistent with "not attuned to
# chapter/verse."
isa:
  - r:
      la: "Ægýpte, noli flere, quia Dominátor tuus véniet tibi, ante cujus conspéctum movebúntur abýssi, * Liberáre pópulum suum de manu poténtiæ."
      en: "Weep not, O Egypt, for the Ruler cometh unto thee, and the depths shall be moved at His presence. * To deliver His people out of the hand of the mighty."
    v:
      la: "Ecce véniet Dóminus exercítuum, Deus tuus cum potestáte magna."
      en: "Behold, the Lord of hosts, thy God, cometh with great power."
  - r:
      la: "Prope est ut véniat tempus ejus, et dies ejus non elongabúntur: * Miserébitur Dóminus Jacob, et Israël salvábitur."
      en: "Her time is near to come, and her days shall not be prolonged. * The Lord shall have mercy on Jacob, and Israel shall be saved."
    v:
      la: "Revértere, virgo Israël, revértere ad civitátes tuas."
      en: "Turn again, O Virgin of Israel, turn again to thy cities."
  - r:
      la: "Descéndet Dóminus sicut plúvia in vellus: * Oriétur in diébus ejus justítia, et abundántia pacis."
      en: "The Lord shall come down like rain upon a fleece. * In His days shall righteousness flourish, and abundance of peace."
    v:
      la: "Et adorábunt eum omnes reges, omnes gentes sérvient ei."
      en: "All the kings of the earth shall fall down before Him, all nations shall serve Him."

# `gen` sourced from Latin/Tempora/Quadp1-1.txt, English/Tempora/Quadp1-1.txt
# (Monday of the week of Septuagesima — the historical start of the
# Genesis "Historia" reading cycle, a plain ferial with no overriding
# feast). Only 2 entries: the source's own English translation has no
# Responsory3 for this day (a real gap in the reference engine itself, not
# a transcription omission here).
gen:
  - r:
      la: "Dum deambuláret Dóminus in paradíso ad auram post merídiem, clamávit, et dixit: Adam, ubi es? Audívi, Dómine, vocem tuam, * Et abscóndi me."
      en: "When the Lord walked in the garden in the cool of the day, He called, and said Adam, where art thou? Lord, I heard thy voice. * And I hid myself."
    v:
      la: "Vocem tuam audívi in paradiso, et tímui, eo quod nudus essem."
      en: "I heard thy voice in the garden, and I was afraid, because I was naked."
  - r:
      la: "In sudóre vultus tui vescéris pane tuo, dixit Dóminus ad Adam: cum operátus fúeris terram, non dabit fructus suos: * Sed spinas et tríbulos germinábit tibi."
      en: "The Lord said unto Adam: In the sweat of thy face shalt thou eat bread; when thou tillest the ground, it shall not henceforth yield unto thee her fruits. * Thorns also and thistles shall it bring forth to thee."
    v:
      la: "Quia audísti vocem uxóris tuæ, et comedísti de ligno, ex quo præcéperam tibi ne coméderes, maledícta terra in opere tuo."
      en: "Because thou hast hearkened unto the voice of thy wife, and hast eaten of the tree which I commanded thee, saying: Thou shalt not eat of it, cursed is the ground whereon thou shalt labour."

# `jer` sourced from Latin/Tempora/Quad6-2.txt, English/Tempora/Quad6-2.txt
# (Tuesday of Holy Week, "Feria privilegiata" — no overriding feast; the
# Passiontide ferias' own Matins readings continue the Jeremiah/
# Lamentations cycle). Avoided Pent02-5.txt's own Jer-cited Lectio1-3 —
# that day's Rank is Sacred Heart (Duplex I classis), so its Responsory1-3
# are the feast's own proper text, not genuine ferial-Jeremiah content,
# despite borrowing Jeremiah's Lectio verses.
jer:
  - r:
      la: "Contumélias et terróres passus sum ab eis, qui erant pacífici mei, et custodiéntes latus meum, dicéntes: Decipiámus eum, et prævaleámus illi: sed tu, Dómine, mecum es tamquam bellátor fortis. * Cadant in oppróbrium sempitérnum, ut vídeam vindíctam in eis, quia tibi revelávi causam meam."
      en: "I have suffered defaming and fear from them that were my familiars they watched for my halting, saying Let us entice him, and prevail against him. But Thou, O Lord, art with me, as a Mighty Terrible One. * Let them stumble into everlasting confusion, that I may see thy vengeance upon them, for unto thee have I opened my cause."
    v:
      la: "Júdica, Dómine, causam ánimæ meæ, defénsor vitæ meæ."
      en: "O Lord, plead Thou the cause of my soul, Thou That art the Redeemer of my life."
  - r:
      la: "Deus Israël, propter te sustínui impropérium, opéruit reveréntia fáciem meam, extráneus factus sum frátribus meis, et hospes fíliis matris meæ: * Quóniam zelus domus tuæ comédit me."
      en: "For thy sake, O God of Israel, I have borne reproach; shame hath covered my face; I am become a stranger unto my brethren, and an alien unto my mother's children. * For the zeal of thine house hath eaten me up."
    v:
      la: "Inténde ánimæ meæ, et líbera eam, propter inimícos meos éripe me."
      en: "Draw nigh unto my soul, and redeem it; deliver me, because of mine enemies."
  - r:
      la: "Synagóga populórum circumdedérunt me: et non réddidi retribuéntibus mihi mala. * Consumétur, Dómine, nequítia peccatórum, et díriges justum."
      en: "The congregation of the people hath compassed me about, but I rewarded no evil unto him that rewarded evil unto me. * O Lord, let the wickedness of the wicked come to an end, but establish the just."
    v:
      la: "Júdica me, Dómine, secúndum justítiam meam, et secúndum innocéntiam meam super me."
      en: "Judge me, O Lord, according to my righteousness, and according to mine integrity that is in me."

# `exod` sourced from Latin/Tempora/Quad4-0.txt, English/Tempora/Quad4-0.txt
# (Sunday IV in Lent — its own ordinary Lenten-Sunday rank, not a borrowed
# override; genuine Exodus content, the burning bush through the Song of
# the Sea).
exod:
  - r:
      la: "Locútus est Dóminus ad Móysen, dicens: Descénde in Ægýptum, et dic Pharaóni: * Ut dimíttat pópulum meum: indurátum est cor Pharaónis: non vult dimíttere pópulum meum, nisi in manu forti."
      en: "The Lord spake unto Moses, saying: Go down now into Egypt, and say unto Pharaoh: * Let My people go. And the heart of Pharaoh shall be hardened, that he will not let My people go but by a mighty hand."
    v:
      la: "Clamor filiórum Israël venit ad me, vidíque afflictiónem eórum: sed veni, mittam te ad Pharaónem."
      en: "The cry of the children of Israel is come unto Me, and I have seen their affliction: come now, therefore, and I will send thee unto Pharaoh, and thou shalt say unto him:"
  - r:
      la: "Stetit Móyses coram Pharaóne, et dixit: Hæc dicit Dóminus: * Dimítte pópulum meum, ut sacríficet mihi in desérto."
      en: "Moses stood before Pharaoh, and said: Thus saith the Lord: * Let My people go, that they may hold a feast unto Me in the wilderness."
    v:
      la: "Dóminus Deus Hebræórum misit me ad te, dicens."
      en: "The Lord God of the Hebrews hath sent me unto thee, saying:"
  - r:
      la: "Cantémus Dómino: glorióse enim honorificátus est, equum et ascensórem projécit in mare: * Adjútor et protéctor factus est mihi Dóminus in salútem."
      en: "Let us sing unto the Lord, for He hath triumphed gloriously; the horse and his rider hath He thrown into the sea. * The Lord is my strength and song, and He is become my salvation."
    v:
      la: "Dóminus quasi vir pugnátor, Omnípotens nomen ejus."
      en: "The Lord is a man of war; Almighty is His Name."

# `prov` sourced from Latin/Tempora/081-1.txt, English/Tempora/081-1.txt (the
# reference engine's own August-week-1 "History of Solomon" ferial cycle,
# no overriding rank). Also reused verbatim for `sir` and `sap` below — the
# reference engine's own August weeks (081 Prov, 083 Sap, 084-085 Sir) all
# `@`-reference this same week's responsory set regardless of which Wisdom
# book that particular week's Lectio actually reads, confirming this
# app's own "loose, book-level match" convention is the authentic
# historical one, not an invention.
prov:
  - r:
      la: "Ne derelínquas me, Dómine, pater et dominátor vitæ meæ, ut non córruam in conspéctu adversariórum meórum: * Ne gáudeat de me inimícus meus."
      en: "O Lord, Father and Governor of my life, leave me not, lest I fall before mine adversaries, * and mine enemy rejoice over me."
    v:
      la: "Apprehénde arma et scutum et exsúrge in adjutórium mihi."
      en: "Take hold of shield and buckler, and stand up for mine help."
  - r:
      la: "Magna enim sunt judícia tua, Dómine, et inenarrabília verba tua: * Magnificásti pópulum tuum et honorásti."
      en: "Great are thy judgments, O Lord, and thy words cannot be expressed. * Thou didst make thy people mighty and honourable."
    v:
      la: "Transtulísti illos per Mare Rubrum et transvexísti eos per aquam nímiam."
      en: "Thou broughtest them through the Red Sea, and leddest them through much water."
  - r:
      la: "Quæ sunt in corde hóminum, óculi tui vident, Dómine, et in libro tuo ómnia scribéntur: * Homo videt in fácie, Deus autem in corde."
      en: "Lord, thine eyes behold all that is in the heart of man, and in thy book are they all written. * Man looketh on the outward appearance, but God looketh on the heart."
    v:
      la: "Omnia enim corda scrutátur, et univérsas méntium cogitatiónes intéllegit."
      en: "For He searcheth all hearts, and understandeth all the imaginations of the thoughts."

