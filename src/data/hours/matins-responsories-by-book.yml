  - r:
      la: "Quam magna multitúdo dulcédinis tuæ, Dómine, * Quam abscondísti timéntibus te!"
      en: "O how great is thy goodness, O Lord * Which Thou hast laid up for them that fear thee!"
    v:
      la: "Et perfecísti eis qui sperant in te, Dómine, in conspéctu filiórum hóminum."
      en: "Which Thou, O Lord, hast wrought for them that trust in thee before the sons of men!"
  - r:
      la: "Adjútor meus esto, Deus: * Ne derelínquas me."
      en: "O God, be Thou my helper. * Neither leave me."
    v:
      la: "Neque despícias me, Deus, salutáris meus."
      en: "Nor forsake me O God of my salvation."
  - r:
      la: "Benedícam Dóminum in omni témpore: * Semper laus ejus in ore meo."
      en: "I will bless the Lord at all times. * His praise shall continually be in my mouth."
    v:
      la: "In Dómino laudábitur ánima mea, áudiant mansuéti, et læténtur."
      en: "My soul shall make her boast in the Lord; the humble shall hear thereof and be glad."

# `col`/`2tim` reuse Latin/Tempora/Epi2-2.txt, English/Tempora/Epi2-2.txt
# (Colossians' own Epi4-2.txt and 2 Timothy's own Epi5-2.txt both
# `@`-reference this tag).
col:
  - r:
      la: "Auribus pércipe, Deus, lácrimas meas: ne síleas a me, remítte mihi: * Quóniam íncola ego sum apud te, et peregrínus."
      en: "O God, give ear unto my tears; hold not thy peace, but, O, spare me! * For I am a stranger with thee, and a sojourner."
    v:
      la: "Compláceat tibi, ut erípias me: Dómine, ad adjuvándum me festína."
      en: "Be pleased, O Lord, to deliver me; O Lord, look upon me to help me."
  - r:
      la: "Státuit Dóminus supra petram pedes meos, et diréxit gressus meos Deus: * Et misit in os meum cánticum novum."
      en: "The Lord hath set my feet upon a rock, and ordered my goings. * And He hath put a new song in my mouth."
    v:
      la: "Exaudívit preces meas: et edúxit me de lacu misériæ."
      en: "He heard my cry He brought me up also out of an horrible pit."
  - r:
      la: "Ego dixi, Dómine, miserére mei: * Sana ánimam meam, quia peccávi tibi."
      en: "I said: Lord, be merciful unto me. * Heal my soul, for I have sinned against thee."
    v:
      la: "Ab ómnibus iniquitátibus meis éripe me, Dómine."
      en: "Deliver me from all mine iniquities, O Lord."
2tim:
