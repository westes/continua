# `jud` (Jude) reuses `act`'s own Responsory7, Latin/Tempora/Pasc5-4.txt
# (Jude's own reading week, Pasc6-6.txt, `@`-references
# Tempora/Pasc5-4:Responsory7 — a different entry than the R1 the other
# three books above reuse).
jud:
  - r:
      la: "Ego rogábo Patrem, et álium Paráclitum dabit vobis, * Ut máneat vobíscum in ætérnum, Spíritum veritátis, allelúja."
      en: "I will pray the Father, and He shall give you another Comforter, * That He may abide with you for ever, even the Spirit of truth. Alleluia."
    v:
      la: "Si enim non abíero, Paráclitus non véniet ad vos: si autem abíero, mittam eum ad vos."
      en: "For if I go not away, the Comforter will not come unto you; but if I depart, I will send Him unto you."

# `gal`/`phil`/`1tim` all reuse the same pool, Latin/Tempora/Epi2-1.txt,
# English/Tempora/Epi2-1.txt (2 Corinthians' own week, Monday) — Galatians'
# own week file (Epi3-1.txt), Philippians' (Epi4-1.txt), and 1 Timothy's
# (Epi5-1.txt) all `@`-reference this exact tag. This whole post-Epiphany
# reading season (weeks 3-5) turns out to cycle through week 2's
# (2 Corinthians') own weekday responsories rather than having distinct
# content of its own — confirmed by reading every week-3/4/5 feria file's
# own `@`-line, not guessed; closes what looked like a real "no English"
# gap without any translation needed.
gal:
  - r:
      la: "Quam magna multitúdo dulcédinis tuæ, Dómine, * Quam abscondísti timéntibus te!"
      en: "O how great is thy goodness, O Lord * Which Thou hast laid up for them that fear thee!"
    v:
      la: "Et perfecísti eis qui sperant in te, Dómine, in conspéctu filiórum hóminum."
      en: "Which Thou, O Lord, hast wrought for them that trust in thee before the sons of men!"
  - r:
      la: "Adjútor meus esto, Deus: * Ne derelínquas me."
      en: "O God, be Thou my helper. * Neither leave me."
    v:
      la: "Neque despícias me, Deus, salutáris meus."
      en: "Nor forsake me O God of my salvation."
  - r:
      la: "Benedícam Dóminum in omni témpore: * Semper laus ejus in ore meo."
      en: "I will bless the Lord at all times. * His praise shall continually be in my mouth."
    v:
      la: "In Dómino laudábitur ánima mea, áudiant mansuéti, et læténtur."
      en: "My soul shall make her boast in the Lord; the humble shall hear thereof and be glad."
