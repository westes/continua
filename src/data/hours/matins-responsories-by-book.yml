# `lam` sourced from Latin/Tempora/Quad6-4.txt, English/Tempora/Quad6-4.txt
# (Maundy Thursday's own Tenebrae Matins) — the classic Holy Week
# responsories ("In monte Oliveti," "Tristis est anima mea," "Ecce
# vidimus eum"). Unlike the Sacred Heart/Jeremiah case elsewhere in this
# file, Maundy Thursday's high rank isn't an unrelated feast displacing
# ordinary content — Tenebrae's Lamentations reading is intrinsically
# Holy Week's own, so no override caution applies here.
lam:
  - r:
      la: "In monte Olivéti orávit ad Patrem: Pater, si fíeri potest, tránseat a me calix iste: * Spíritus quidem promptus est, caro autem infírma."
      en: "At the Mount of Olives He prayed unto the Father: O My Father, if it be possible, let this cup pass from Me! * The spirit indeed is willing, but the flesh is weak."
    v:
      la: "Vigiláte, et oráte, ut non intrétis in tentatiónem."
      en: "Watch and pray, that ye enter not into temptation."
  - r:
      la: "Tristis est ánima mea usque ad mortem: sustinéte hic, et vigiláte mecum: nunc vidébitis turbam, quæ circúmdabit me: * Vos fugam capiétis, et ego vadam immolári pro vobis."
      en: "My Soul is exceeding sorrowful, even unto death: tarry ye here and watch with Me * Yet a little while, and ye shall see the multitude close Me in. Ye shall flee; and I will go to be offered a sacrifice for you."
    v:
      la: "Ecce appropínquat hora, et Fílius hóminis tradétur in manus peccatórum."
      en: "Behold, the hour is at hand, and the Son of man is betrayed into the hands of sinners."
  - r:
      la: "Ecce vídimus eum non habéntem spéciem, neque decórem: aspéctus ejus in eo non est: hic peccáta nostra portávit, et pro nobis dolet: ipse autem vulnerátus est propter iniquitátes nostras: * Cujus livóre sanáti sumus."
      en: "Behold, when we shall see Him, He hath no form nor comeliness: there is no beauty in Him: this is He Which hath borne our griefs and carried our sorrows; but He was wounded for our transgressions * And with His stripes we are healed."
    v:
      la: "Vere languóres nostros ipse tulit, et dolóres nostros ipse portávit."
      en: "Surely He hath borne our griefs and carried our sorrows."

# `nah` reuses `ezek`/`dan`/`osee`'s own first entry (Nahum's own week file
