# `jon`/`mal` both share the same single entry, Tempora/111-0:Responsory7
# (Jonas' own week file 114-6.txt and Malachias' own 115-6.txt both
# `@`-reference this exact tag — a different entry than `zach`'s own
# R4-6 from this same source Sunday).
jon:
  - r:
      la: "Laudábilis pópulus, * Quem Dóminus exercítuum benedíxit dicens: Opus mánuum meárum tu es, heréditas mea Israël."
      en: "Blessed is the people * Whom the Lord of hosts hath blessed, saying O Israel thou art the work of Mine own hands, thou art Mine own inheritance."
    v:
      la: "Beáta gens, cujus est Dóminus Deus, pópulus eléctus in hereditátem."
      en: "Blessed is the nation whose God is the Lord, and the people whom He hath chosen for His own inheritance."
mal:
  - r:
      la: "Laudábilis pópulus, * Quem Dóminus exercítuum benedíxit dicens: Opus mánuum meárum tu es, heréditas mea Israël."
      en: "Blessed is the people * Whom the Lord of hosts hath blessed, saying O Israel thou art the work of Mine own hands, thou art Mine own inheritance."
    v:
      la: "Beáta gens, cujus est Dóminus Deus, pópulus eléctus in hereditátem."
      en: "Blessed is the nation whose God is the Lord, and the people whom He hath chosen for His own inheritance."

# `osee` reuses `ezek`/`dan`'s own first entry (Osee's own week file
# 114-1.txt `@`-references Tempora/111-1:Responsory1, the same Ezekiel
# week already sourced above).
osee:
  - r:
      la: "Redémit pópulum suum et liberávit eum, et vénient et exsultábunt in monte Sion et gaudébunt de bonis Dómini super fruménto, vino et óleo, * Et ultra non esúrient."
      en: "He hath redeemed His people, and ransomed them therefore they shall come and sing in the height of Zion, and shall rejoice in the goodness of the Lord, for wheat, and for wine, and for oil * And they shall hunger no more."
    v:
      la: "Erítque ánima eórum quasi hortus irríguus."
      en: "And their soul shall be as a watered garden."

# `mich` reuses `amos`/`agg`'s own first entry (Micheas' own week file
