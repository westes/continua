# `jdth` sourced from Latin/Tempora/094-0.txt, English/Tempora/094-0.txt
# (September week 4's own Sunday — Responsory1/4/7, the pattern every
# feria that week's own file `@`-references in rotation, confirmed by
# reading each). User-caught gap (2026-09-04): flagged as unseeded in an
# earlier pass without actually checking — real, clean, bilingual content
# was sitting right there.
jdth:
  - r:
      la: "Adonái, Dómine, Deus magne et mirábilis, qui dedísti salútem in manu féminæ, * Exáudi preces servórum tuórum."
      en: "O Adonai, O Lord God, Thou art great and glorious. Who hast given salvation into the hand of a woman: * Graciously hear the prayers of thy servants."
    v:
      la: "Benedíctus es, Dómine, qui non derelínquis præsuméntes de te, et de sua virtúte gloriántes humílias."
      en: "Blessed art Thou, O Lord, Who failest none that put their trust in thee, and humblest such as boast themselves in their own strength."
  - r:
      la: "Nos álium Deum nescímus præter Dóminum, in quo sperámus: * Qui non déspicit nos, nec ámovet salútem suam a génere nostro."
      en: "We know no strange God before the Lord. In Him we trust. * He despiseth us not, neither putteth He away His salvation from our nation."
    v:
      la: "Indulgéntiam ipsíus fusis lácrimis postulémus, et humiliémus illi ánimas nostras."
      en: "His mercy let us seek with tears, and humble our souls before Him."
  - r:
      la: "Confórta me, Rex, Sanctórum principátum tenens: * Et da sermónem rectum et bene sonántem in os meum."
      en: "Strengthen me, O King, Who reignest over the holy ones. * Put Thou in my mouth clear and well-sounding words."
    v:
      la: "Dómine, Rex univérsæ potestátis, convérte consílium eórum super eos."
      en: "O Lord, King of all forces, turn back their device upon themselves."

# `esth` sourced from Latin/Tempora/095-0.txt, English/Tempora/095-0.txt
# (September week 5's own Sunday — Responsory1/3/4, same rotation
# pattern as `jdth` above). Responsory4's own text ("Meménto mei, Dómine
# Deus, in bonum") reads like Nehemiah's own prayer-style rather than
# Esther's, but it's the reference engine's own genuine text for this
# week regardless — consistent with "loose match," not a mis-citation.
esth:
  - r:
      la: "Dómine, mi Rex omnípotens, in dicióne tua cuncta sunt pósita, et non est qui possit resístere voluntáti tuæ: * Líbera nos propter nomen tuum."
      en: "O my Lord, the King Almighty All things are in thy power, and there is no man that can gainsay thy will; * Deliver us for thy Name's sake."
    v:
      la: "Exáudi oratiónem nostram, et convérte luctum nostrum in gáudium."
      en: "Hear our prayer, and turn our sorrow into joy."
  - r:
      la: "Spem in álium nunquam hábui, prætérquam in te, Deus Israël: * Qui irásceris, et propítius eris, et ómnia peccáta hóminum in tribulatióne dimíttis."
      en: "I have had no hope in any other but in thee, O God of Israel, Who art angry, and wilt again show mercy, * Thou that forgivest all the sins of men when they are in affliction."
    v:
      la: "Dómine Deus, Creátor cæli et terræ, réspice ad humilitátem nostram."
      en: "O Lord God, Maker of heaven and earth, look upon our low estate;"
  - r:
      la: "Meménto mei, Dómine Deus, in bonum: * Et ne déleas miseratiónes meas, quas feci in domo Dei mei et in cæremóniis ejus."
      en: "Remember me for good, O Lord God, * And put not away my works of mercy, which I have wrought in the house of my God, and in the times of His solemn rites."
    v:
      la: "Recordáre mei, Dómine, Deus meus."
      en: "Remember me, O Lord my God"

# `job` sourced from Latin/Tempora/091-1.txt, English/Tempora/091-1.txt
# (September week 1's own Monday, plain ferial). The classic "Job
# Responsories" (also used in the Requiem). Only 2 entries: that week's
# own English translation has no Responsory3. Extracted early in the
# 2026-09-04 sourcing pass but not actually committed to this file until
# a later re-check caught the omission (see memory
# vu-feedback-verify-extraction-gaps) — a real miss, not a source gap.
job:
  - r:
      la: "Versa est in luctum cíthara mea, et órganum meum in vocem fléntium: * Parce mihi, Dómine, nihil enim sunt dies mei."
      en: "My harp is turned to mourning, and my organ into the voice of them that weep. * Let me alone, O Lord, for my days are vanity."
    v:
      la: "Cutis mea denigráta est super me, et ossa mea aruérunt."
      en: "My skin is black upon me, and my bones are burned with heat."
  - r:
      la: "Utinam appenderéntur peccáta mea, quibus iram mérui, * Et calámitas, quam pátior, in statéra."
      en: "O that my sins, whereby I have deserved wrath; * And the calamity whereunder I suffer, were laid in the balances together."
    v:
      la: "Quasi aréna maris hæc grávior apparéret, unde et verba mea dolóre sunt plena."
      en: "For now it would appear heavier than the sand of the sea, therefore also my words are full of sorrow."

# `eccl` sourced from Latin/Tempora/081-2.txt, English/Tempora/081-2.txt
# (August week 1's own Tuesday, `@`-referencing Tempora/081-2:Responsory1
# — a different entry than `prov`'s own 081-1, but the same August
# "Wisdom literature" week cluster). Only 1 entry: that file's own English
# has no Responsory2/3.
eccl:
  - r:
      la: "Præbe, fili, cor mihi, et óculi tui vias meas custódiant: * Ut addátur grátia cápiti tuo."
      en: "My son, give me thine heart, and let thine eyes observe my ways. * For they shall be an ornament of grace unto thine head."
    v:
      la: "Atténde, fili mi, sapiéntiam meam et ad elóquium meum inclína aurem tuam."
      en: "My son, attend unto my wisdom, and incline thine ear unto my sayings."

# `hab`/`joel` both share the same single entry, Latin/Tempora/111-2.txt,
# English/Tempora/111-2.txt:Responsory1 (November week 1's own Wednesday
# — both books' own week files, 115-2 Habacuc and 114-2 Joel,
# `@`-reference this exact tag, confirmed by reading each directly).
hab:
  - r:
      la: "A fácie furóris tui, Deus, conturbáta est omnis terra: * Sed miserére, Dómine, et ne fácias consummatiónem."
      en: "Before the face of thine anger, O God, the whole earth is troubled; * But Thou, O Lord, have mercy, and make not an end utterly."
    v:
      la: "Dómine, Dóminus noster, quam admirábile est nomen tuum!"
      en: "Lord our Ruler, how excellent is thy Name in all the earth!"
joel:
  - r:
      la: "A fácie furóris tui, Deus, conturbáta est omnis terra: * Sed miserére, Dómine, et ne fácias consummatiónem."
      en: "Before the face of thine anger, O God, the whole earth is troubled; * But Thou, O Lord, have mercy, and make not an end utterly."
    v:
