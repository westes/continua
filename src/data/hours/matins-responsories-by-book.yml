# `cant` (Canticles/Song of Songs) sourced from Latin/Sancti/07-02.txt,
# English/Sancti/07-02.txt (the Visitation of the BVM, July 2 — genuinely
# Canticles-sourced Lectio1-3, "De Cánticis canticórum") — user-prompted
# re-check (2026-09-05: "check the commons for passages from Canticles")
# found this after the Commune files themselves turned out to have no
# genuine Nocturn-lesson Canticles content (the Little Office of the BVM,
# C12, cites Cant 6:8 only as a Lauds Capitulum, not a Matins lesson with
# its own responsory — and its actual Lectio1-3 are Sirach 24, not
# Canticles). The Assumption Octave (Sancti/08-15t through 08-22t) also
# has real Canticles Lectio content but no English translation anywhere;
# the Visitation's own file is the one exception with both languages.
# Genuine match, not a borrowed-unrelated-feast mismatch: the Visitation's
# own responsories directly blend Canticles verses with the Visitation
# narrative itself ("Surge, própera, amíca mea... Intrávit María in domum
# Zacharíæ").
cant:
  - r:
      la: "Surge, própera, amíca mea, formósa mea, et veni: jam enim hiems tránsiit, imber ábiit et recéssit: * Vox túrturis audíta est in terra nostra."
      en: "Rise up, make haste, my love my fair one and come away; For, lo, the winter is past, the rain is over and gone. * The voice of the turtle-dove is heard in our land."
    v:
      la: "Intrávit María in domum Zacharíæ et salutávit Elísabeth."
      en: "Mary entered into the house of Zacharias and saluted Elizabeth."
  - r:
      la: "Repléta est Spíritu Sancto Elísabeth et exclamávit: Benedícta tu inter mulíeres, et benedíctus fructus ventris tui: * Et unde hoc mihi, ut véniat mater Dómini mei ad me?"
      en: "Elizabeth was filled with the Holy Ghost and she spake out with a loud voice, and said: Blessed art thou among women, and blessed is the Fruit of thy womb; * And whence is this to me, that the mother of my Lord should come to me?"
    v:
      la: "Ecce enim, ut facta est vox salutatiónis tuæ in áuribus meis, exsultávit in gáudio infans in útero meo."
      en: "For, lo, as soon as the voice of thy salutation sounded in mine ears, the babe leaped in my womb for joy."
  - r:
      la: "Ecce iste venit sáliens in móntibus, transíliens colles: * Símilis est diléctus meus cápreæ hinnulóque cervórum."
      en: "Behold, he cometh leaping upon the mountains, skipping upon the hills; * My beloved is like a gazelle or a young roe-buck!"
    v:
      la: "Exsultávit ut gigas ad curréndam viam, a summo cælo egréssio ejus."
      en: "He rejoiceth as a giant to run his course, his going-forth is from the end of the heavens."

# `lev` (Leviticus) sourced from Latin/Sancti/02-02.txt, English/Sancti/
# 02-02.txt (the Purification of the BVM, Feb 2 — genuinely Leviticus-
# sourced, the purification law that is the feast's own reason for being).
# Same user-prompted "check Sancti too" pattern that found `cant`.
lev:
  - r:
      la: "Adórna thálamum tuum, Sion, et súscipe Regem Christum: * Quem virgo concépit, virgo péperit, virgo post partum, quem génuit, adorávit."
      en: "Make ready thy chamber, O Zion, to receive Christ thy King * Even that Child Whom a Virgin bore, and remained a Virgin as before the fruit of her womb and the God of her soul."
    v:
      la: "Accípiens Símeon púerum in mánibus, grátias agens benedíxit Dóminum."
      en: "Simeon took the Child up in his arms, and blessed God."
  - r:
      la: "Postquam impléti sunt dies purgatiónis Maríæ secúndum legem Móysi, tulérunt Jesum in Jerúsalem, ut sísterent eum Dómino, * Sicut scriptum est in lege Dómini: Quia omne masculínum adapériens vulvam, sanctum Dómino vocábitur."
      en: "When the days of Mary's purification according to the law of Moses were accomplished, they brought Jesus to Jerusalem to present Him to the Lord; * As it is written in the law of the Lord: Every male that openeth the womb shall be called holy unto the Lord."
    v:
      la: "Obtulérunt pro eo Dómino par túrturum aut duos pullos columbárum."
      en: "They offered for Him unto the Lord a pair of turtle-doves or two young pigeons."
  - r:
      la: "Obtulérunt pro eo Dómino par túrturum aut duos pullos columbárum. * Sicut scriptum est in lege Dómini."
      en: "They offered for Him unto the Lord a pair of turtle-doves, or two young pigeons * As it is written in the law of the Lord."
    v:
      la: "Postquam autem impléti sunt dies purgatiónis Maríæ secúndum legem Móysi, tulérunt illum in Jerúsalem, ut sísterent eum Dómino."
      en: "And when the days of Mary's purification according to the law of Moses were accomplished, they brought Him to Jerusalem, to present Him to the Lord."

# `num` (Numbers) sourced from Latin/Sancti/09-14.txt, English/Sancti/
# 09-14.txt (the Exaltation of the Holy Cross, Sep 14) — the traditional
# bronze-serpent/Cross typology (Num 21:6-9), only 1 entry (the only
# Responsory this file has in both languages).
num:
  - r:
      la: "Hæc est arbor digníssima, in paradísi médio situáta, * In qua salútis auctor própria morte mortem ómnium superávit."
      en: "This is that noble tree, planted in the midst of the garden * Whereon the Author of our salvation did by His Own death openly triumph over the death of all men."
    v:
      la: "Crux præcellénti decóre fúlgida, quam Heraclíus imperátor concupiscénti ánimo recuperávit."
      en: "Even the Cross, whereof the glory is so excellent, and which the Emperor Heraclius did so eagerly rescue."

# `deut` (Deuteronomy) — unlike every other entry in this file, this is
# vu's own original composition, not a transcribed historical Matins
# responsory: Deuteronomy genuinely has no Matins responsory anywhere in
# the reference source (confirmed absent from both Tempora and Sancti,
# see TODO.md's 2026-09-04/05 entries). User-prompted (2026-09-05): a
# patristic homily (English/Sancti/01-02.txt, on Matt 23:37 "O Jerusalem,
# Jerusalem") quotes the eagle image of Deut 32:11 in passing ("as also
# it is written... an eagle stirreth up her nest... spreadeth abroad her
# wings"), and its own citation number, verified against
# data/scripture/deut-32.yml's real n:11, is genuinely Deut 32:11 (not
# the breviary's own internal chant-verse-numbering for the same text,
# which splits it as 32:15-16 in Latin/Psalterium/Psalmorum/Psalm226.txt,
# the Canticle of Moses sung at Lauds). Both R./V. lines are built from
# that real liturgical text verbatim (Psalm226.txt's own accented Latin,
# its English counterpart's own translation) — genuine source text, real
# accentuation, not invented — but the responsory *pairing* itself is
# original, so marked `draft` rather than `verified` on that basis alone.
deut:
  - r:
      la: "Sicut áquila próvocans ad volándum pullos suos, et super eos vólitans, expándit alas suas: * Et assúmpsit eum, atque portávit in húmeris suis."
      en: "As the eagle enticing her young to fly, and hovering over them, he spread his wings: * And hath taken him, and carried him on his shoulders."
    v:
      la: "Invénit eum in terra desérta, in loco horróris et vastæ solitúdinis: et custodívit eum quasi pupíllam óculi sui."
      en: "He found him in a desert land, in a place of horror, and of vast wilderness: and he kept him as the apple of his eye."

# `rom` (Romans) — like `deut` above, vu's own original composition, not a
# transcribed historical Matins responsory: every genuine Romans citation
# in the reference source (the whole Christmas-Octave `Nat0X` reading
# week) borrows an unrelated feast's own proper responsory (see TODO.md's
# 2026-09-04 entry), so there's no historical Matins responsory for this
# book to transcribe. Built instead from Rom 13:11-12 — "the night is
# past, the day is at hand" — real, already-liturgical Douay-Rheims/
# Vulgate text used year-round as the standing ferial Lauds Capitulum
# (Latin/Psalterium/Special/Major Special.txt's own "Feria Laudes") and
# again at Advent I's own Capitulum (Tempora/Adv1-0.txt) — genuine
# accented liturgical Latin, just never combined into its own Matins
# responsory historically. User-confirmed 2026-09-05.
rom:
  - r:
      la: "Nox præcéssit, dies autem appropinquávit: * Abjiciámus ergo ópera tenebrárum, et induámur arma lucis."
      en: "The night is past, and the day is at hand: * Let us therefore cast off the works of darkness, and put on the armour of light."
    v:
      la: "Hora est jam nos de somno súrgere: nunc enim própior est nostra salus, quam cum credídimus."
      en: "It is now the hour for us to rise from sleep, for now our salvation is nearer than when we believed."

# `bar` (Baruch) — composed, not transcribed, same approach as `deut`/`rom`
# above: Baruch has no Matins responsory anywhere in the Office (Tempora
# or Sancti), but genuine liturgical Latin exists in a different part of
# the Office altogether — the Easter Vigil *Mass*'s own fourth prophecy
# (missa/Latin/Tempora/Quad6-6.txt's `[Proph_Baruch3]`, Bar 3:9-38, "Audi,
# Israël, mandáta vitæ") — user-found (2026-09-05: "it's in the misa
# section, not the horas section"). Built from that prophecy's own
# climactic close ("Hic est Deus noster... Post hæc in terris visus est,
# et cum homínibus conversátus est" — read at the Vigil precisely because
# early exegetes saw "seen upon earth, and conversed with men" as a
# prophecy of the Incarnation), genuine accented text, not invented.
bar:
  - r:
      la: "Hic est Deus noster: * Et non æstimábitur álius advérsus eum."
      en: "This is our God: * And there shall no other be accounted of in comparison of him."
    v:
      la: "Post hæc in terris visus est, et cum homínibus conversátus est."
      en: "Afterwards he was seen upon earth, and conversed with men."

# `ruth` — composed, not transcribed, like `deut`/`rom`/`bar` above, but a
# step further: unlike those three, Ruth 1:16-17 has no liturgical
# precedent anywhere in the reference source at all (no Nuptial Mass file
# even exists there to check) — this is a fresh selection on the verse's
# own merit (Ruth's declaration of loyalty to Naomi, "thy people shall be
# my people, and thy God my God"), not a recombination of text already
# used liturgically elsewhere. User-directed 2026-09-05, aware of and
# accepting that distinction. Accented Latin built by hand (this project's
# usual bulk-imported src/data/scripture/ruth-1.yml has no accents),
# cross-checked word-by-word against already-accented occurrences of the
# same words elsewhere in the reference corpus (quocúmque, pópulus tuus,
# páriter, ábeam, relínquam, moráta, morábor, móriar, moriéntem,
# suscéperit, sepultúræ) rather than guessed freehand.
ruth:
  - r:
      la: "Ne advérseris mihi, ut relínquam te et ábeam: quocúmque enim perréxeris, pergam: et ubi moráta fúeris, et ego páriter morábor: * Pópulus tuus, pópulus meus: et Deus tuus, Deus meus."
      en: "Be not against me, to desire that I should leave thee and depart: for whithersoever thou shalt go, I will go: and where thou shalt dwell, I also will dwell: * Thy people shall be my people, and thy God my God."
    v:
      la: "Quæ te moriéntem terra suscéperit, in ea móriar: ibíque locum accípiam sepultúræ."
      en: "The land that shall receive thee dying, in the same will I die: and there will I be buried."
