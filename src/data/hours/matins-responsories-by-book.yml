# `2thess`/`phlm` reuse Latin/Tempora/Epi2-6.txt, English/Tempora/Epi2-6.txt
# (2 Thessalonians' own Epi4-6.txt and Philemon's own Epi5-6.txt both
# `@`-reference this tag).
2thess:
  - r:
      la: "Misericórdiam et judícium cantábo tibi, Dómine: * Psallam et intéllegam in via immaculáta, quando vénies ad me."
      en: "Mercy and judgment I will sing to thee, O Lord: * I will sing, and I will understand in the unspotted way, when thou shalt come to me."
    v:
      la: "Perambulábam in innocéntia cordis mei, in médio domus meæ."
      en: "I walked in the innocence of my heart, in the midst of my house."
  - r:
      la: "Dómine, exáudi oratiónem meam, et clamor meus ad te pervéniat: * Quia non spernis, Deus, preces páuperum."
      en: "Hear my prayer, O Lord, and let my crying come unto thee. * For thou wilt not despise, O God, the prayer of the destitute"
    v:
      la: "Fiant aures tuæ intendéntes in oratiónem servi tui."
      en: "O let thine ears consider well the voice of my complaint"
  - r:
      la: "Velóciter exáudi me, Deus, * Quia defecérunt sicut fumus dies mei:"
      en: "Haste thee to hear me, O Lord. * For my days are consumed away like smoke:"
    v:
      la: "Dies mei sicut umbra declinavérunt, et ego sicut fœnum árui."
      en: "My days have declined like a shadow, and I am withered like grass."
phlm:
  - r:
      la: "Misericórdiam et judícium cantábo tibi, Dómine: * Psallam et intéllegam in via immaculáta, quando vénies ad me."
