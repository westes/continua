# `tob` sourced from Latin/Tempora/093-0.txt, English/Tempora/093-0.txt
# (September week 3's own Sunday — no overriding rank).
tob:
  - r:
      la: "Peto, Dómine, ut de vínculo impropérii hujus absólvas me, aut certe désuper terram erípias me: * Ne reminiscáris delícta mea vel paréntum meórum, neque vindíctam sumas de peccátis meis: quia éruis sustinéntes te, Dómine."
      en: "I entreat thee, O Lord, that thou wouldest loose me from this reproach, or that thou wouldest take me away from the earth: * Remember not mine offences nor the offences of my forefathers, neither take thou vengeance of my sins; for thou, O Lord, art a Redeemer unto all that hope in thee."
    v:
      la: "Omnia enim judícia tua justa sunt, et omnes viæ tuæ misericórdia et véritas: et nunc, Dómine, meménto mei."
      en: "For all thy judgements are just, and all thy ways are mercy and truth; and now, O Lord, remember me."
  - r:
      la: "Omni témpore bénedic Deum, et pete ab eo ut vias tuas dírigat, * Et in omni témpore consília tua in ipso permáneant."
      en: "In all seasons bless God, and ask of Him to order thy goings; * And in all seasons let thy counsels be steadfastly in Him."
    v:
      la: "Inquíre ut fácias quæ plácita sunt illi in veritáte, et in tota virtúte tua."
      en: "Seek faithfully and with all thy strength to do such things as please Him."
  - r:
      la: "Memor esto, fili, quóniam páuperem vitam gérimus: * Habébis multa bona, si timúeris Deum."
      en: "My son, remember that we have but a frail life. * If thou fear God thou shalt have great goods."
    v:
      la: "In mente habéto eum, et cave nequándo prætermíttas præcépta ejus."
      en: "Be mindful of Him, and beware lest ever thou transgress His commandments."

# `ezek` sourced from Latin/Tempora/111-1.txt, English/Tempora/111-1.txt
# (November week 1's own ferial, no overriding rank). Also reused verbatim
# for `dan` below — the reference engine's own 113 (Daniel) week file
# `@`-references this same week's responsory set, same "loose match"
# convention as the Wisdom-literature August weeks above.
ezek:
  - r:
      la: "Redémit pópulum suum et liberávit eum, et vénient et exsultábunt in monte Sion et gaudébunt de bonis Dómini super fruménto, vino et óleo, * Et ultra non esúrient."
      en: "He hath redeemed His people, and ransomed them therefore they shall come and sing in the height of Zion, and shall rejoice in the goodness of the Lord, for wheat, and for wine, and for oil * And they shall hunger no more."
    v:
      la: "Erítque ánima eórum quasi hortus irríguus."
      en: "And their soul shall be as a watered garden."
  - r:
      la: "Angústiæ mihi sunt úndique, et quid éligam ignóro; * Mélius est mihi incídere in manus hóminum, quam derelínquere legem Dei mei."
      en: "I am straitened on every side, and know not what to choose. * It is better for me to fall into the hands of men, than to sin against the law of my God."
    v:
      la: "Si enim hoc égero, mors mihi est; si autem non égero, non effúgiam manus vestras."
      en: "For if I do this thing, it is death unto me and if I do it not, I cannot escape your hands."
  - r:
      la: "Misit Dóminus Angelum suum et conclúsit ora leónum, * Et non contaminavérunt, quia coram eo injustítia invénta non est in me."
      en: "The Lord hath sent His angel, and hath shut the lions' mouths, that * They have not hurt me forasmuch as before Him innocency was found in me."
    v:
      la: "Misit Deus misericórdiam suam et veritátem suam: ánimam meam erípuit de médio catulórum leónum."
      en: "God hath sent forth His mercy and His truth, (and delivered) my soul from among the lions' whelps."

