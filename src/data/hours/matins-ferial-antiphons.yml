# Antiphons for the plain ferial weekday Matins nocturn (below Semiduplex,
# see hours/matins.ts's threeNocturns threshold) — previously rendered
# with bare psalms and no antiphon at all (a genuine oversight, not a
# documented design choice like `ferialPsalmodyThreeNocturns`'s
# antiphon-less fallback).
#
# `psalter-distribution.yml`'s own `matins:` table is NOT the historical
# per-weekday psalm set — its own header documents a deliberate "editorial
# redistribution": the 54 non-Sunday psalms were reclassified must-stay/
# could-move by length, then resliced into 6 fresh groups of 9 in
# continuous psalm order, breaking several original antiphon-sharing pairs
# across weekday boundaries in the process (e.g. Ps 43/44 — originally
# Monday's own closing pair under "Eructávit" — now open Tuesday instead).
#
# **One antiphon per psalm (2026-09-01)**: the source's own Daym1_-Daym6_
# tables frame several pairs of *different* psalms under one shared
# antiphon — normal Monastic practice, but it read strangely once vu's own
# reslice left some psalms paired and others solitary within the same
# nocturn. Every one of those cross-psalm pairs is now split so each psalm
# gets its own antiphon. Whichever psalm the shared antiphon's own words
# actually quote (nearly always identifiable — e.g. "Rectos decet
# collaudátio" is Ps 32's own opening, not Ps 33's) keeps that antiphon
# unchanged; its former partner gets a new one. Per direct instruction, the
# new antiphon is a real one borrowed from elsewhere in the reference
# corpus when one exists for that exact psalm (the Roman secular ferial
# Matins table also in this same file, `[Day0]`-`[Day6]`, individually
# antiphons every psalm rather than pairing them; or a Tempora ferial
# proper — Lenten or post-Pentecost weekday — that happens to quote the
# psalm), and otherwise composed fresh from that psalm's own opening verse,
# the same convention every other antiphon in this corpus already follows.
# See each split psalm's own inline note below for exactly which.
#
# So this file's own groups do NOT mirror the source's per-weekday
# grouping 1:1 — they're regrouped to fit vu's already-fixed 9-psalm list:
# every psalm here keeps its own original antiphon text (sourced from
# Divinum Officium's Monastic-labeled block, `Latin/Psalterium/Psalmi/
# Psalmi matutinum.txt`'s `[Daym1_]`-`[Daym6_]` sections, English parallel
# at `[Daym1]`-`[Daym6]` in the `English/` tree — the Latin file only
# carries the full per-weekday text under the `_`-suffixed key, redirecting
# its own unsuffixed `[Daym1]` etc. to it via `@:` references; the English
# file has no such indirection); any cross-psalm pair is now split per the
# "One antiphon per psalm" note above, and so is every same-psalm split
# across a chapter boundary (2026-11-13, below).
#
# **One antiphon per half of a split psalm (2026-11-13)**: Ps 36, 67, 68,
# 77, 88, 103, 104, 105 and 106 are each cut in two verse ranges. The
# halves used to share one antiphon; each half now has its own. The half
# the old antiphon's words quote keeps it (Ps 88's "Benedíctus Dóminus"
# is v.53, so it stays on the second half). The other half takes the
# reference's Roman secular ferial antiphon for that range where there is
# one (Ps 36:27-40, 67:2-19, 68:2-16, 77:36-72, 104:23-45, 105:32-48,
# 106:25-43) or is composed from its own verse (Ps 88:2-19 from v.2,
# Ps 103:25-35 from v.31).
#
# No mid-nocturn versicle (fixed 2026-09-02): the source `Psalmi
# matutinum.txt` files (`[Daym1_]`-`[Daym6_]`) embed a V./R. line partway
# through each weekday's psalm list, and an earlier version of this file
# ported it as a real `versicle` field on the group where it happened to
# fall, rendered mid-nocturn as if marking a nocturn boundary. Live-verified
# against the reference engine (`Pofficium.pl`, `command=prayMatutinum`,
# `version=Monastic Tridentinum 1617`) for both Wednesday and Thursday: the
# real single-nocturn ferial office runs straight from the last psalm to
# the Capitulum, with no versicle anywhere in the psalmody — that embedded
# line is inert in the source and was never actually emitted by the engine.
# Removed; do not reintroduce it without a live query proving otherwise.
#
# Not live-verified against a running query (Monastic ferial ordinary time
# isn't independently re-derivable that way once psalter-distribution.yml's
# own redistribution has been applied) — sourced directly from the two
# parallel psalter files instead, cross-checked psalm-by-psalm against
# every entry in psalter-distribution.yml's own `matins:` table above.

monday:
  # All 9 psalms are Daym1_'s own (Monastic Matins Feria II) — no reslicing
  # across weekday boundaries here, so the antiphon grouping sits exactly
  # where Daym1_ itself has it.
  groups:
    - psalms: [{ number: 32 }]
      antiphon:
        la: "Rectos decet * collaudátio."
        en: "Praise is comely * for the upright."
    - psalms: [{ number: 33 }]
      # New (2026-09-01): no real antiphon found elsewhere in the corpus
      # for Ps 33 alone; composed from its own opening verse (33:2).
      antiphon:
        la: "Benedícam Dóminum * in omni témpore."
        en: "I will bless the Lord * at all times."
    - psalms: [{ number: 34 }]
      antiphon:
        la: "Expúgna * impugnántes me."
        en: "Fight against them * that fight against me."
    - psalms: [{ number: 36, verses: "1-26" }]
      antiphon:
        la: "Revéla * Dómino viam meam."
        en: "Commit my way * to the Lord."
    - psalms: [{ number: 36, verses: "27-40" }]
      antiphon:
        la: "Custódi innocéntiam * et vide æquitátem."
        en: "Keep innocence * and behold justice."
    - psalms: [{ number: 37 }]
      antiphon:
        la: "Ne in ira tua * árguas me Dómine."
        en: "Do not chastise me * in thy wrath."
    - psalms: [{ number: 38 }]
      antiphon:
        la: "Ut non delínquam * in lingua mea."
        en: "That I sin not * with my tongue."
    - psalms: [{ number: 39 }]
      # New (2026-09-01): real antiphon borrowed from Tempora/Quad6-5
      # (Holy Week Wednesday ferial) — quotes Ps 39's own words (39:15).
      antiphon:
        la: "Confundántur * et revereántur, qui quærunt ánimam meam, ut áuferant eam."
        en: "Let them be confounded and ashamed together, * that seek after my soul to take it away."
    - psalms: [{ number: 40 }]
      antiphon:
        la: "Sana Dómine * ánimam meam, quia peccávi tibi."
        en: "Lord, heal my soul; * for I have sinned against thee."

tuesday:
  # 43-44 are Monday's own tail (Daym1_); 47-58 are Daym2_'s own opening (6
  # of 9 psalms — the majority); 59 is Wednesday's own opening (Daym3_).
  groups:
    - psalms: [{ number: 43 }]
      # New (2026-09-01): the source's shared antiphon for this pair
      # ("Eructávit") is actually Ps 44's own opening line, not Ps 43's —
      # composed fresh from Ps 43's own opening verse (43:2) instead.
      antiphon:
        la: "Deus áuribus nostris * audívimus."
        en: "We have heard, O God, * with our ears."
    - psalms: [{ number: 44 }]
      antiphon:
        la: "Eructávit * cor meum verbum bonum."
        en: "Mine heart * is overflowing with a good matter."
    - psalms: [{ number: 47 }]
      antiphon:
        la: "Magnus Dóminus * et laudábilis nimis."
        en: "Great is the Lord, * and greatly to be praised."
    - psalms: [{ number: 48 }]
      # New (2026-09-01): real antiphon borrowed from the Roman secular
      # ferial Matins table (`[Day3]` below), Ps 48's own words (48:4).
      antiphon:
        la: "Os meum loquétur * sapiéntiam: et meditátio cordis mei prudéntiam."
        en: "My mouth shall speak wisdom: * and the meditation of my heart understanding."
    - psalms: [{ number: 49 }]
      antiphon:
        la: "Deus deórum * Dóminus locútus est."
        en: "The God of gods * the Lord hath spoken."
    - psalms: [{ number: 54 }]
      antiphon:
        la: "Inténde in me * et exáudi me."
        en: "Be attentive to me * and hear me."
    - psalms: [{ number: 55 }]
      # New (2026-09-01): real antiphon borrowed from Tempora/Quad5-5
      # (Lenten Friday ferial) — Ps 55's own words (55:9).
      antiphon:
        la: "Deus, vitam meam * annuntiávi tibi: posuísti lácrimas meas in conspéctu tuo."
        en: "O God, I have declared to thee my life: * thou hast set my tears in thy sight."
    - psalms: [{ number: 58 }]
      antiphon:
        la: "Justa judicáte * fílii hóminum."
        en: "Judge right things, * ye sons of men."
    - psalms: [{ number: 59 }]
      antiphon:
        la: "Da nobis Dómine * auxílium de tribulatióne."
        en: "Give us * help from trouble, O Lord."

wednesday:
  # 65-72 are Daym3_'s own (7 of 9 — the majority); 73 is Thursday's own
  # opening (Daym4).
  groups:
    - psalms: [{ number: 65 }]
      antiphon:
        la: "Benedícite, * gentes, Deum nostrum."
        en: "O bless our God * ye people."
    - psalms: [{ number: 67, verses: "2-19" }]
      antiphon:
        la: "Exsúrgat Deus, * et dissipéntur inimíci ejus."
        en: "Let God arise, * and let his enemies be scattered."
    - psalms: [{ number: 67, verses: "20-36" }]
      antiphon:
        la: "In ecclésiis, * benedícite Dóminum."
        en: "In the churches * bless ye the Lord."
    - psalms: [{ number: 68, verses: "2-16" }]
      antiphon:
        la: "Salvum me fac, * Deus, quóniam intravérunt aquæ usque ad ánimam meam."
        en: "Save me, O God, * for the waters are come in even unto my soul."
    - psalms: [{ number: 68, verses: "17-37" }]
      antiphon:
        la: "Quǽrite Dóminum * et vivet ánima vestra."
        en: "Seek ye the Lord * and your soul shall live."
    - psalms: [{ number: 70 }]
      antiphon:
        la: "Dómine * Deus in adjutórium meum inténde."
        en: "Make haste * O Lord God, to deliver me."
    - psalms: [{ number: 71 }]
      # New (2026-09-01): the source's shared antiphon for this pair
      # ("Quam bonus Israël Deus") is actually Ps 72's own opening line,
      # not Ps 71's — real antiphon borrowed instead from Tempora/Quad6-4
      # (Holy Week Tuesday ferial), Ps 71's own words (71:12).
      antiphon:
        la: "Liberávit Dóminus * páuperem a poténte, et ínopem, cui non erat adjútor."
        en: "The Lord hath delivered * the poor from the mighty, and the needy that had no helper."
    - psalms: [{ number: 72 }]
      antiphon:
        la: "Quam bonus * Israël Deus."
        en: "How good is God * to Israel."
    - psalms: [{ number: 73 }]
      antiphon:
        la: "Liberásti virgam * hereditátis tuæ."
        en: "Thou hast redeemed the rod * of Thine inheritance."

thursday:
  # All 9 psalms are Daym4's own — no reslicing across weekday boundaries
  # here either, so the grouping is unchanged from the source.
  groups:
    - psalms: [{ number: 76 }]
      antiphon:
        la: "Tu es Deus * qui facis mirabília."
        en: "Thou art the God * That doest wonders."
    - psalms: [{ number: 77, verses: "1-35" }]
      antiphon:
        la: "Inclináte * aurem vestram in verba oris mei."
        en: "Incline your ears * to the words of My mouth."
    - psalms: [{ number: 77, verses: "36-72" }]
      antiphon:
        la: "Redémit eos * Dóminus de manu tribulántis."
        en: "The Lord redeemed them * from the hand of him that afflicted them."
    - psalms: [{ number: 78 }]
      antiphon:
        la: "Propítius esto * peccátis nostris, Dómine."
        en: "Forgive us our sins * O Lord."
    - psalms: [{ number: 79 }]
      # New (2026-09-01): no real antiphon found elsewhere in the corpus
      # for Ps 79 alone; composed from its own opening verse (79:2).
      antiphon:
        la: "Qui regis Israël, inténde: * qui dedúcis velut ovem Joseph."
        en: "Give ear, O thou that rulest Israel: * thou that leadest Joseph like a sheep."
    - psalms: [{ number: 80 }]
      antiphon:
        la: "Exsultáte Deo * adjutóri nostro."
        en: "Sing aloud * unto God our strength."
    - psalms: [{ number: 82 }]
      antiphon:
        la: "Tu solus * altíssimus super omnem terram."
        en: "Thou alone * art the Most High over all the earth."
    - psalms: [{ number: 83 }]
      # New (2026-09-01): no real antiphon found elsewhere in the corpus
      # for Ps 83 alone; composed from its own opening verse (83:2).
      antiphon:
        la: "Quam dilécta * tabernácula tua, Dómine virtútum!"
        en: "How lovely are thy tabernacles, * O Lord of hosts!"
    - psalms: [{ number: 84 }]
      antiphon:
        la: "Benedixísti * Dómine terram tuam."
        en: "Thou hast blessed * thy land, O Lord."

friday:
  # 85-95 are Daym5_'s own (5 of 9 — the majority: 85, 88ab, 93, 95 — note
  # 93's original antiphon covered a 92/93 pair, 92 itself having moved
  # elsewhere, so it's kept here on 93 alone; likewise 95's antiphon
  # originally also covered 96, which the redistribution's own documented
  # hand-adjustment moved to Saturday to keep both halves of Ps 103
  # together there); 101-103 are Daym6_'s own opening (4 of 9).
  groups:
    - psalms: [{ number: 85 }]
      antiphon:
        la: "Inclína Dómine, * aurem tuam, et exáudi me."
        en: "Incline thy ear, O Lord, * and hear me."
    - psalms: [{ number: 88, verses: "2-19" }]
      antiphon:
        la: "Misericórdias Dómini * in ætérnum cantábo."
        en: "The mercies of the Lord * I will sing for ever."
    - psalms: [{ number: 88, verses: "20-53" }]
      antiphon:
        la: "Benedíctus * Dóminus in ætérnum."
        en: "Blessed be the Lord * for evermore."
    - psalms: [{ number: 93 }]
      antiphon:
        la: "Exaltáre, * qui júdicas terram."
        en: "Lift up thyself, * thou that judgest the earth."
    - psalms: [{ number: 95 }]
      antiphon:
        la: "Cantáte Dómino, * et benedícite nómini ejus."
        en: "Sing ye to the Lord * and bless his name."
    - psalms: [{ number: 101 }]
      antiphon:
        la: "Clamor meus * ad te véniat, Deus."
        en: "O God * let my cry come unto Thee."
    - psalms: [{ number: 102 }]
      # New (2026-09-01): real antiphon borrowed from Tempora/Pent01-4
      # (post-Pentecost Thursday ferial) — Ps 102's own words (102:8, 5).
      antiphon:
        la: "Miserátor * et miséricors Dóminus replet in bonis desidérium tuum."
        en: "The Lord is compassionate and merciful, * who satisfieth thy desire with good things."
    - psalms: [{ number: 103, verses: "1-24" }]
      antiphon:
        la: "Bénedic, * ánima mea Dómino."
        en: "Bless the Lord, * O my soul."
    - psalms: [{ number: 103, verses: "25-35" }]
      antiphon:
        la: "Sit glória Dómini * in sǽculum: lætábitur Dóminus in opéribus suis."
        en: "May the glory of the Lord * endure for ever: the Lord shall rejoice in his works."

saturday:
  # Ps 96 is Daym5_'s own tail (moved here by the redistribution's own
  # documented hand-adjustment, swapped out of Friday to let both halves
  # of Ps 103 land there instead); 104-108 are Daym6_'s own tail (8 of 9 —
  # the majority).
  groups:
    - psalms: [{ number: 96 }]
      antiphon:
        la: "Cantáte Dómino, * et benedícite nómini ejus."
        en: "Sing ye to the Lord * and bless his name."
    - psalms: [{ number: 104, verses: "1-22" }]
      antiphon:
        la: "Lætétur cor * quæréntium Dóminum."
        en: "Let the heart of them rejoice, * that seek the Lord."
    - psalms: [{ number: 104, verses: "23-45" }]
      antiphon:
        la: "Edúxit Deus * pópulum suum in exsultatióne, et eléctos suos in lætítia."
        en: "The Lord brought forth * his people with joy, and his chosen with gladness."
    - psalms: [{ number: 105, verses: "1-31" }]
      antiphon:
        la: "Vísita nos, * Dómine, in salutári tuo."
        en: "Visit us * with Thy salvation, O Lord."
    - psalms: [{ number: 105, verses: "32-48" }]
      antiphon:
        la: "Cum tribularéntur * vidit Dóminus: et audívit oratiónem eórum."
        en: "He saw when they were in tribulation, * and he heard their prayer."
    - psalms: [{ number: 106, verses: "1-24" }]
      antiphon:
        la: "De necessitátibus meis * éripe me, Dómine."
        en: "From my necessities, deliver me, O Lord."
    - psalms: [{ number: 106, verses: "25-43" }]
      antiphon:
        la: "Vidébunt recti * et lætabúntur, et intéllegent misericórdias Dómini."
        en: "The just see and rejoice, * and understand the mercy of the Lord."
    - psalms: [{ number: 107 }]
      # New (2026-09-01): the source's shared antiphon for this pair
      # ("Confitébor Dómino nimis in ore meo") is actually Ps 108's own
      # words, not Ps 107's — real antiphon borrowed instead from
      # Tempora/Pent02-5 (post-Pentecost Friday ferial), Ps 107's own
      # words (107:4-5).
      antiphon:
        la: "Psallam tibi * in natiónibus, quia magna est super cælos misericórdia tua."
        en: "I will sing unto thee * among the nations: for thy mercy is great above the heavens."
    - psalms: [{ number: 108 }]
      antiphon:
        la: "Confitébor * Dómino nimis in ore meo."
        en: "I will greatly praise * the Lord with my mouth."
