# Sancti/08-06.txt [Ant Laudes] (both languages), the five Lauds antiphons by position: three psalm groups, the canticle, Laudate. Psalmody is the 'Psalmi Dominica' scheme these feasts' [Rule] names (Ps 92 / 99 / 62, the Three Young Men, Ps 148-150), the same shape as apparition-of-st-michael.yml. Before this file the psalm antiphons fell to the ferial ones.
id: transfiguration
groups:
  - psalms: [92]
    antiphon:
      la: "Assúmpsit Jesus * Petrum, et Jacóbum, et Joánnem fratrem ejus, et duxit eos in montem excélsum seórsum, et transfigurátus est ante eos."
      en: "Jesus took Peter, * and James, and John his brother, and brought them up into an high mountain apart and was transfigured before them."
  - psalms: [99]
    antiphon:
      la: "Resplénduit * fácies ejus sicut sol, vestiménta autem ejus facta sunt alba sicut nix, allelúja."
      en: "His Face did shine as the sun, * and His raiment exceeding white as snow, alleluia."
  - psalms: [62]
    antiphon:
      la: "Et ecce * apparuérunt eis Móyses et Elías loquéntes cum Jesu."
      en: "And, behold, there appeared unto them Moses and Elias, * talking with Jesus."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Respóndens autem Petrus, * dixit ad Jesum: Dómine, bonum est nos hic esse."
    en: "Then answered Peter, * and said unto Jesus: Lord, it is good for us to be here."
laudate:
  antiphon:
    la: "Adhuc eo loquénte, * ecce nubes lúcida obumbrávit eos."
    en: "While he yet spake, * behold, a bright cloud overshadowed them."
