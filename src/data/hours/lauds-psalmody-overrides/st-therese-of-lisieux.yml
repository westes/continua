# Sourced from web/www/horas/Latin/SanctiM/10-03b.txt's own [Ant Laudes]
# (5 antiphons: the three psalm slots, the canticle, the Laudate group).
# Below duplex-majus, so hours/lauds.ts's
# mergeFerialNumbersWithProperAntiphons only takes this file's antiphon text,
# not its psalm numbers -- the numbers below are the standard 92/99/62
# scheme, not independently confirmed for this feast (no functional effect
# at this rank). The reference source has no English for this feast's
# SanctiM-only office, so each English line is a direct translation of the
# Latin. (Draft status is not representable on a Lauds override group; the
# standalone files for the same feast mark it, e.g. st-therese-of-
# lisieux-antiphon.yml.)
id: st-therese-of-lisieux
groups:
  - psalms: [92]
    antiphon:
      la: "Benedícta tu * a Deo tuo, quóniam in omni gente, quæ audíerit nomen tuum, magnificábitur super te Deus Israël."
      en: "Blessed art thou by thy God, * for in every nation that shall hear thy name, the God of Israel shall be magnified over thee."
  - psalms: [99]
    antiphon:
      la: "Dominus elégit te, * ut sis ei, et fáciat te in laudem, et nomen, et glóriam suam."
      en: "The Lord hath chosen thee * that thou mayest be unto Him, and that He may make thee a praise, and a name, and a glory to Himself."
  - psalms: [62]
    antiphon:
      la: "Eris coróna glóriæ * in manu Dómini, et diadéma regni in manu Dei tui, quia complácuit Dómino in te."
      en: "Thou shalt be a crown of glory * in the hand of the Lord, and a royal diadem in the hand of thy God, for the Lord hath been well pleased in thee."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Dominus fáciet et tecum * misericórdiam et veritátem, quia ostendísti grátiam et fidem."
    en: "The Lord also will deal with thee * in mercy and truth, because thou hast shown grace and faith."
laudate:
  antiphon:
    la: "Erúmpet quasi mane * lumen tuum, et anteíbit fáciem tuam justítia tua, et glória Dómini cólliget te."
    en: "Thy light shall break forth * as the morning, and thy justice shall go before thy face, and the glory of the Lord shall gather thee up."
