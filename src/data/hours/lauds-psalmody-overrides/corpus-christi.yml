# Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2027-05-27); Latin and English both taken from the page. Antiphons only; the psalm numbers are the Monastic Sunday scheme (92/99/62, canticle, Laudate).
id: corpus-christi
groups:
  - psalms: [92]
    antiphon:
      la: "Sapiéntia * ædificávit sibi domum, míscuit vinum et pósuit mensam, allelúia."
      en: "Wisdom hath builded her house, * she hath mingled her wine, she hath also furnished her table, alleluia."
  - psalms: [99]
    antiphon:
      la: "Angelórum esca * nutrivísti pópulum tuum, et panem de cælo præstitísti eis, allelúia."
      en: "Thou feddest thine Own people * with Angels' food, and didst send them bread from heaven, alleluia."
  - psalms: [62]
    antiphon:
      la: "Pinguis est panis * Christi, et præbébit delícias régibus, allelúia."
      en: "Out of Christ His bread shall be fat, * and He shall yield royal dainties, alleluia."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Sacerdótes sancti * incénsum et panes ófferunt Deo, allelúia."
    en: "The Priests shall be holy; * for the offerings of the Lord made by fire, and the bread of their God, they do offer, [therefore they shall be holy], alleluia."
laudate:
  antiphon:
    la: "Vincénti dabo * manna abscónditum, et nomen novum, allelúia."
    en: "To him that overcometh will I give of the hidden manna, * and will give him a new name, alleluia."
