# Engine (Monastic Tridentinum 1617, command=prayLaudes, 2027-02-07); source Tempora/Quadp3-0.txt's [Ant Laudes] entries 1,2,3,4,5 in Latin and English. Antiphons for the Sunday's own psalm slots (Ps 66 first, no antiphon). Applies via the numbers-override path for this temporal Sunday (resolve-common.ts getPsalmodyNumbersOverrideId).
id: quinquagesima
groups:
  - psalms: [50]
    antiphon:
      la: "Secúndum multitúdinem * miseratiónum tuárum, Dómine, dele iniquitátem meam."
      en: "O Lord, according to the multitude of thy tender mercies, * blot out my transgressions."
  - psalms: [117]
    antiphon:
      la: "Deus meus es tu, * et confitébor tibi: Deus meus es tu, et exaltábo te."
      en: "Thou art my God, * and I will praise thee; Thou art my God, and I will exalt thee."
  - psalms: [62]
    antiphon:
      la: "Ad te de luce * vígilo, Deus, ut vídeam virtútem tuam."
      en: "O God, early will I seek thee, * to see thy power."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Hymnum dícite, * et superexaltáte eum in sǽcula."
    en: "Sing praises, * and exalt Him above all for ever."
laudate:
  antiphon:
    la: "Omnes Angeli * ejus laudáte Dóminum de cælis."
    en: "Praise ye the Lord * from the heavens, all His angels."
