# Engine (Monastic Tridentinum 1617, command=prayLaudes, 2027-03-21); source Tempora/Quad6-0.txt's [Ant Laudes] entries 1,2,3,4,5 in Latin and English. Antiphons for the Sunday's own psalm slots (Ps 66 first, no antiphon). Applies via the numbers-override path for this temporal Sunday (resolve-common.ts getPsalmodyNumbersOverrideId).
id: palm-sunday
groups:
  - psalms: [50]
    antiphon:
      la: "Dóminus Deus * auxiliátor meus: et ídeo non sum confúsus."
      en: "The Lord God will help me * and therefore I am not confounded."
  - psalms: [117]
    antiphon:
      la: "Circumdántes * circumdedérunt me: et in nómine Dómini vindicábor in eis."
      en: "They compassed me about, * yea, they compassed me about but in the Name of the Lord! I will destroy them."
  - psalms: [62]
    antiphon:
      la: "Júdica causam meam: * defénde, quia potens es, Dómine."
      en: "Judge Thou my cause, * and redeem me, O Lord, for Thou art mighty to save."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Cum Angelis * et púeris fidéles inveniámur, triumphatóri mortis clamántes: Hosánna in excélsis."
    en: "Fare we with Angels and men in faith to meet the Redeemer, * hailing the Slayer of death with joyful shouts of “Hosanna in the highest!”"
laudate:
  antiphon:
    la: "Confundántur * qui me persequúntur, et non confúndar ego, Dómine, Deus meus."
    en: "Let them be confounded that persecute me; * but let not me be confounded, O Lord my God."
