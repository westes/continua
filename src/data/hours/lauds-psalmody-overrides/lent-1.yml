# Engine (Monastic Tridentinum 1617, command=prayLaudes, 2027-02-14); source Tempora/Quad1-0.txt's [Ant Laudes] entries 1,2,3,4,5 in Latin and English. Antiphons for the Sunday's own psalm slots (Ps 66 first, no antiphon). Applies via the numbers-override path for this temporal Sunday (resolve-common.ts getPsalmodyNumbersOverrideId).
id: lent-1
groups:
  - psalms: [50]
    antiphon:
      la: "Cor mundum * crea in me Deus, et spíritum rectum ínnova in viscéribus meis."
      en: "Create in me a clean heart, * O God, and renew a right spirit within me."
  - psalms: [117]
    antiphon:
      la: "O Dómine, * salvum me fac; o Dómine, bene prosperáre."
      en: "Save me now, O Lord; * O Lord, send Thou prosperity."
  - psalms: [62]
    antiphon:
      la: "Sic benedícam * te in vita mea, Dómine: et in nómine tuo levábo manus meas."
      en: "Thus will I bless thee, * O Lord, while I live; and will lift up my hands in thy Name."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "In spíritu humilitátis, * et in ánimo contríto suscipiámur, Dómine, a te: et sic fiat sacrifícium nostrum, ut a te suscipiátur hódie, et pláceat tibi, Dómine Deus."
    en: "In an humble spirit * and a contrite heart may we be accepted by thee, O Lord; and so let our sacrifice be this day, that it may be acceptable and pleasant in thy sight, O Lord our God!"
laudate:
  antiphon:
    la: "Laudáte Deum * cæli cælórum, et aquæ omnes."
    en: "Praise God, * ye heavens of heavens, and all ye waters."
