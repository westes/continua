# Sourced from web/www/horas/Latin/SanctiM/03-12.txt's own [Ant Laudes]
# block (5 antiphons run together, one per line, older un-numbered format
# -- same as st-benedict.yml's own file). No English rendering exists in
# the reference engine's data for these at all; translated here directly.
# Below duplex-majus (semiduplex), so hours/lauds.ts's
# mergeFerialNumbersWithProperAntiphons only takes this file's antiphon
# text, not its psalm numbers -- the numbers below are placeholders
# (the standard 92/99/62 scheme most Confessor-shaped feasts use), not
# independently confirmed for this feast, since they have no functional
# effect at this rank.
id: st-gregory-the-great
groups:
  - psalms: [92]
    antiphon:
      la: "Beátus Gregórius * in cáthedra Petri sublimátus, Vigilántis nomen factis implévit."
      en: "Blessed Gregory, * exalted to the Chair of Peter, fulfilled in his deeds the name of the Watchman."
  - psalms: [99]
    antiphon:
      la: "Pastor exímius * pastorális vitæ spécimen trádidit et régulam."
      en: "An excellent shepherd, * he handed down a pattern and a rule of pastoral life."
  - psalms: [62]
    antiphon:
      la: "Dum páginæ sacræ * mystéria pánderet, colúmba nive candídior appáruit."
      en: "While he was expounding * the mysteries of the sacred page, a dove whiter than snow appeared to him."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Servi Dómini * benedícite Dóminum: servus vester Gregórius cælos ascéndit."
    en: "Ye servants of the Lord, * bless ye the Lord: your servant Gregory hath ascended into heaven."
laudate:
  antiphon:
    la: "Gregórius, * monachórum spéculum, pater Urbis, orbis delíciæ."
    en: "Gregory, * the mirror of monks, father of the City, the delight of the world."
