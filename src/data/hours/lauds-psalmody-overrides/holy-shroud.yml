# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). Lauds psalmody: Sunday psalms (92, 99, 62, canticle, Laudate) under this feast's own five antiphons. English is this project's own translation, marked draft.
id: holy-shroud
groups:
  - psalms: [92]
    antiphon:
      la: "Joseph nóbilis decurio, * vir bonus et justus, et ipse dives, erat exspéctans regnum Dei."
      en: "Joseph, a noble counsellor, * a good and just man, and himself rich, was waiting for the kingdom of God."
  - psalms: [99]
    antiphon:
      la: "Hic audacter * introívit ad Pilátum, et pétiit corpus Jesu."
      en: "He boldly * went in to Pilate, and begged the body of Jesus."
  - psalms: [62]
    antiphon:
      la: "Cum cognovísset * Pilatus a centurione, quod jam mórtuus esset, donávit corpus Jesu."
      en: "When Pilate had learned * from the centurion that he was already dead, he gave the body of Jesus."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Joseph autem * mercatus sindonem, et deponens eum, involvit sindone."
    en: "And Joseph, * having bought fine linen, and taking him down, wrapped him up in the linen."
laudate:
  antiphon:
    la: "Pósuit eum * in monuménto, in quo nondum quisquam pósitus fúerat."
    en: "He laid him * in a sepulchre, wherein never yet any man had been laid."
