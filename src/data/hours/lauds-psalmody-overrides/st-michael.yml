# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2026-09-29 (own day, outside Paschaltide). The source's own
# [Rule] for Sancti/09-29.txt is literally "ex Sancti/05-08" -- this
# office reuses Apparition of St. Michael's (May 8) content wholesale --
# but the *rendered* text differs from apparition-of-st-michael.yml
# because that file was authored on 2026-05-08, which fell inside
# Paschaltide that year: antiphons 1 and the canticle antiphon there carry
# a Paschaltide-only "allelúia" that isn't part of their fixed proper
# text (confirmed live for 09-29: antiphon 1 and the canticle antiphon
# render with no "allelúia" at all); antiphons 2 and 5 do carry "allelúia"
# unconditionally, baked into the proper text itself, on both dates.
id: st-michael
groups:
  - psalms: [92]
    antiphon:
      la: "Stetit Angelus * juxta aram templi, habens thuríbulum áureum in manu sua."
      en: "An Angel stood at the Altar * of the Temple, having a golden censer in his hand."
  - psalms: [99]
    antiphon:
      la: "Dum præliarétur * Míchaël Archángelus cum dracóne, audíta est vox dicéntium: Salus Deo nostro, allelúia."
      en: "While as the Archangel Michael fought against the dragon, * I heard voices saying: Salvation unto our God. Alleluia."
  - psalms: [62]
    antiphon:
      la: "Archángele Míchaël, * constítui te príncipem super omnes ánimas suscipiéndas."
      en: "Michael Mine Archangel, * I have appointed thee for a prince over the ingathering of souls."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Angeli Dómini, * Dóminum benedícite in ætérnum."
    en: "O ye Angels of the Lord, bless ye the Lord always."
laudate:
  antiphon:
    la: "Angeli, Archángeli, * Throni et Dominatiónes, Principátus et Potestátes, Virtútes cælórum, laudáte Dóminum de cælis, allelúia."
    en: "O ye Angels and Archangels, * O ye Thrones and Dominions, O ye Principalities and Powers, O ye mighty Ones of heaven, praise ye the Lord from the heavens. Alleluia."
