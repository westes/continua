# Engine (Monastic Tridentinum 1617, command=prayLaudes, 2026-12-20); source Tempora/Adv4-0.txt's [Ant Laudes] entries 1,2,3,4,5 in Latin and English. Antiphons for the Sunday's own psalm slots (Ps 66 first, no antiphon). Applies via the numbers-override path for this temporal Sunday (resolve-common.ts getPsalmodyNumbersOverrideId).
id: advent-4
groups:
  - psalms: [50]
    antiphon:
      la: "Cánite tuba * in Sion, quia prope est dies Dómini: ecce véniet ad salvándum nos, allelúja, allelúja."
      en: "Blow ye the trumpet * in Zion, for the day of the Lord is nigh at hand: behold, He cometh to save us! Alleluia, Alleluia."
  - psalms: [117]
    antiphon:
      la: "Ecce véniet * desiderátus cunctis géntibus: et replébitur glória domus Dómini, allelúja."
      en: "Behold, the desire * of all nations shall come; and the house of the Lord shall be filled with glory. Alleluia."
  - psalms: [62]
    antiphon:
      la: "Erunt prava * in dirécta, et áspera in vias planas: veni, Dómine, et noli tardáre, allelúja."
      en: "The crooked * shall be made straight, and the rough places plain; O Lord, come, and make no tarrying. Alleluia."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Dóminus véniet, * occúrrite illi, dicéntes: Magnum princípium, et regni ejus non erit finis: Deus, Fortis, Dominátor, Princeps pacis, allelúja, allelúja."
    en: "The Lord cometh! * Go ye out to meet Him, and say: How great is His dominion, and of His kingdom there shall be no end! He is the mighty God, the Ruler, the Prince of Peace. Alleluia, Alleluia."
laudate:
  antiphon:
    la: "Omnípotens Sermo tuus, * Dómine, a regálibus sédibus véniet, allelúja."
    en: "Thine Almighty Word, * O Lord, shall leap down out of thy royal throne. Alleluia."
