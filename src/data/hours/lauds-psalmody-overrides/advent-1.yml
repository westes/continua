# Engine (Monastic Tridentinum 1617, command=prayLaudes, 2026-11-29); source Tempora/Adv1-0.txt's [Ant Laudes] entries 1,2,3,4,5 in Latin and English. Antiphons for the Sunday's own psalm slots (Ps 66 first, no antiphon). Applies via the numbers-override path for this temporal Sunday (resolve-common.ts getPsalmodyNumbersOverrideId).
id: advent-1
groups:
  - psalms: [50]
    antiphon:
      la: "In illa die * stillábunt montes dulcédinem, et colles fluent lac et mel, allelúja."
      en: "In that day * the mountains shall drop down sweet wine, and the hills shall flow with milk and honey. Alleluia."
  - psalms: [117]
    antiphon:
      la: "Jucundáre, * fília Sion, et exsúlta satis, fília Jerúsalem, allelúja."
      en: "Sing, O daughter of Zion, * and rejoice with all the heart, O daughter of Jerusalem. Alleluia."
  - psalms: [62]
    antiphon:
      la: "Ecce Dóminus véniet, * et omnes Sancti ejus cum eo: et erit in die illa lux magna, allelúja."
      en: "Behold, the Lord shall come, * and all His saints with Him; and it shall come to pass in that day that the light shall be great. Alleluia."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Omnes sitiéntes, * veníte ad aquas: quǽrite Dóminum, dum inveníri potest, allelúja."
    en: "Lo, every one that thirsteth * come ye to the waters: seek ye the Lord while He may be found. Alleluia."
laudate:
  antiphon:
    la: "Ecce véniet * Prophéta magnus, et ipse renovábit Jerúsalem, allelúja."
    en: "Behold, a great Prophet * shall arise, and He shall build up a new Jerusalem. Alleluia."
