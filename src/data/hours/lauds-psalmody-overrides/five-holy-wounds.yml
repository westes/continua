# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad3-5-QuinqueVulneraDNJC.txt (Duplex majus, Friday of the third week of Lent). Lauds psalmody: Sunday psalms (92, 99, 62, canticle, Laudate) under this feast's own five antiphons. English is this project's own translation, marked draft.
id: five-holy-wounds
groups:
  - psalms: [92]
    antiphon:
      la: "Vere languóres * nostros ipse tulit, et dolóres nostros ipse portávit."
      en: "Surely he hath borne * our infirmities, and carried our sorrows."
  - psalms: [99]
    antiphon:
      la: "Ipse autem * vulnerátus est propter iniquitátes nostras, attrítus est propter scélera nostra."
      en: "But he was wounded * for our iniquities, he was bruised for our sins."
  - psalms: [62]
    antiphon:
      la: "Alligávit Dóminus * plagam pópuli sui, et percussúram ejus sanávit."
      en: "The Lord shall bind up * the wound of his people, and shall heal the stroke of their wound."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Omnis qui transibit, * stupebit super omnes plagas ejus."
    en: "Every one that shall pass by shall be astonished * at all his wounds."
laudate:
  antiphon:
    la: "O vos omnes * qui transitis per viam, atténdite, et vidéte si est dolor sicut dolor meus."
    en: "O all ye that pass by the way, * attend and see if there be any sorrow like to my sorrow."
