# Sancti/10-07.txt's own [Ant Laudes] (5 antiphons) and English/Sancti/
# 10-07.txt, in the same 3 psalms + canticle + laudate slotting the
# Nativity of the BVM's own override uses (SanctiM/10-07.txt has no
# [Ant Laudes] of its own, so the Sancti block is the Monastic one too).
# Psalm numbers are the BVM Common's own Lauds psalmody; only the
# antiphon text is proper here.
id: our-lady-of-the-rosary
groups:
  - psalms: [92]
    antiphon:
      la: "Lætáre, * Virgo Mater; surréxit Christus de sepúlcro."
      en: "Rejoice, O Virgin Mother, * Christ is risen from the grave."
  - psalms: [99]
    antiphon:
      la: "Ascéndit Deus * in jubilatióne, et Dóminus in voce tubæ."
      en: "God is gone up with a shout, * and the Lord with the sound of a trumpet."
  - psalms: [62]
    antiphon:
      la: "Spíritus Dómini * replévit orbem terrárum."
      en: "The spirit of the Lord * hath filled the world."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Assúmpta est * María in cælum: gaudent Angeli, laudántes benedícunt Dóminum, allelúja."
    en: "Mary hath been taken to heaven. * The angels rejoice; they praise and bless the Lord. Alleluia."
laudate:
  antiphon:
    la: "Exaltáta est * Virgo María super choros Angelórum, et in cápite ejus coróna stellárum duódecim."
    en: "The Virgin Mary * hath been exalted over choirs of angels, and upon her head there is a crown of twelve stars."
