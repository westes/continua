# Engine (Monastic Tridentinum 1617, command=prayLaudes, 2026-12-13); source Tempora/Adv3-0.txt's [Ant Laudes] entries 1,2,3,4,5 in Latin and English. Antiphons for the Sunday's own psalm slots (Ps 66 first, no antiphon). Applies via the numbers-override path for this temporal Sunday (resolve-common.ts getPsalmodyNumbersOverrideId).
id: advent-3
groups:
  - psalms: [50]
    antiphon:
      la: "Véniet Dóminus, * et non tardábit, et illuminábit abscóndita tenebrárum, et manifestábit se ad omnes gentes, allelúia."
      en: "The Lord will come, * and will not tarry; He both will bring to light the hidden things of darkness, and will make Himself manifest to all people. Alleluia."
  - psalms: [117]
    antiphon:
      la: "Jerúsalem, gaude * gáudio magno, quia véniet tibi Salvátor, allelúia."
      en: "Rejoice greatly, O Jerusalem, * for thy Saviour cometh unto thee. Alleluia."
  - psalms: [62]
    antiphon:
      la: "Dabo in Sion * salútem, et in Jerúsalem glóriam meam, allelúia."
      en: "I will place salvation in Zion, * and My glory in Jerusalem. Alleluia."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Montes et omnes colles * humiliabúntur: et erunt prava in dirécta, et áspera in vias planas: veni, Dómine, et noli tardáre, allelúia."
    en: "Every mountain and hill * shall be made low, and the crooked shall be made straight, and the rough places plain; O Lord, come and make no tarrying. Alleluia."
laudate:
  antiphon:
    la: "Juste et pie * vivámus, exspectántes beátam spem, et advéntum Dómini."
    en: "We should live * righteously and godly, looking for that blessed hope and the coming of the Lord."
