# Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2026-12-25); Latin and English both taken from the page. Antiphons only; the psalm numbers are the Monastic Sunday scheme (92/99/62, canticle, Laudate).
id: christmas-day
groups:
  - psalms: [92]
    antiphon:
      la: "Quem vidístis, * pastóres? dícite, annuntiáte nobis, in terris quis appáruit? Natum vídimus, et choros Angelórum collaudántes Dóminum, allelúia, allelúia."
      en: "O ye shepherds, speak, * and tell us what ye have seen; who is appeared in the earth? We saw the newborn Child, and angels singing praise to the Lord, alleluia, alleluia."
  - psalms: [99]
    antiphon:
      la: "Génuit puérpera * Regem, cui nomen ætérnum, et gáudia matris habens cum virginitátis honóre: nec primam símilem visa est, nec habére sequéntem, allelúia."
      en: "The Mother brought forth the King, * Whose name is called The Eternal; the joy of a Mother was hers, remaining a Virgin unsullied; neither before nor henceforth hath there been or shall be such another, alleluia."
  - psalms: [62]
    antiphon:
      la: "Angelus ad pastóres * ait: Annúntio vobis gáudium magnum: quia natus est vobis hódie Salvátor mundi, allelúia."
      en: "The Angel said unto the shepherds * I bring you good tidings of great joy; for unto you is born this day a Saviour of the world, alleluia."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Facta est cum Angelo * multitúdo cæléstis exércitus laudántium Deum, et dicéntium: Glória in excélsis Deo, et in terra pax homínibus bonæ voluntátis, allelúia."
    en: "There was with the Angel a multitude of the heavenly host, * praising God, and saying Glory to God in the highest, and on earth peace, to men of good will, alleluia."
laudate:
  antiphon:
    la: "Párvulus fílius * hódie natus est nobis: et vocábitur Deus, Fortis, allelúia, allelúia."
    en: "Unto us this day a little Child is born, * and His name shall be called the Mighty God, alleluia, alleluia."
