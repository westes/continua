# Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2027-05-16); Latin and English both taken from the page. Antiphons only; the psalm numbers are the Monastic Sunday scheme (92/99/62, canticle, Laudate).
id: pentecost-sunday
groups:
  - psalms: [92]
    antiphon:
      la: "Cum compleréntur * dies Pentecóstes, erant omnes páriter in eódem loco, allelúia."
      en: "When the day of Pentecost was fully come * they were all with one accord in one place, alleluia."
  - psalms: [99]
    antiphon:
      la: "Spíritus Dómini * replévit orbem terrárum, allelúia."
      en: "The Spirit of the Lord * filleth the world, alleluia."
  - psalms: [62]
    antiphon:
      la: "Repléti sunt omnes * Spíritu Sancto, et cœpérunt loqui, allelúia, allelúia."
      en: "They were all filled * with the Holy Ghost, and began to speak, alleluia, alleluia."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Fontes, et ómnia * quæ movéntur in aquis, hymnum dícite Deo, allelúia."
    en: "See ye fountains, * and all that move in the waters, ascribe ye praise to God, alleluia."
laudate:
  antiphon:
    la: "Loquebántur * váriis linguis Apóstoli magnália Dei, allelúia, allelúia, allelúia."
    en: "The Apostles spoke in diverse tongues * the wonderful works of God, alleluia, alleluia, alleluia."
