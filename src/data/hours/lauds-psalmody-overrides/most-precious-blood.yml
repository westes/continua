# Sancti/07-01.txt [Ant Laudes] (both languages), the five Lauds antiphons by position: three psalm groups, the canticle, Laudate. Psalmody is the 'Psalmi Dominica' scheme these feasts' [Rule] names (Ps 92 / 99 / 62, the Three Young Men, Ps 148-150), the same shape as apparition-of-st-michael.yml. Before this file the psalm antiphons fell to the ferial ones.
id: most-precious-blood
groups:
  - psalms: [92]
    antiphon:
      la: "Hi qui amícti sunt * stolis albis, qui sunt, et unde venérunt?"
      en: "What are these * which are arrayed in white robes? And whence came they?"
  - psalms: [99]
    antiphon:
      la: "Hi sunt * qui venérunt de tribulatióne magna et lavérunt stolas suas in sánguine Agni."
      en: "These are they which came out of great tribulation, * and have washed their robes and made them white in the Blood of the Lamb."
  - psalms: [62]
    antiphon:
      la: "Ideo sunt * ante thronum Dei et sérviunt ei die ac nocte."
      en: "Therefore are they before the throne of God, * and serve Him day and night."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Et ipsi vicérunt * dracónem propter sánguinem Agni et propter testaméntum Verbi sui."
    en: "And they overcame the dragon * by the Blood of the Lamb, and by the word of their testimony."
laudate:
  antiphon:
    la: "Beáti * qui lavant stolas suas in sánguine Agni."
    en: "Blessed are they * that wash their robes in the Blood of the Lamb."
