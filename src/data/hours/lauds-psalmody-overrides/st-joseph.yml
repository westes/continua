# Sourced from web/www/horas/Latin/Sancti/03-19.txt's own [Ant Laudes]
# and English/Sancti/03-19.txt's own translation (the Finding in the
# Temple narrative, Luke 2). Below duplex-majus (duplex), so hours/
# lauds.ts's mergeFerialNumbersWithProperAntiphons only takes this file's
# antiphon text, not its psalm numbers -- the numbers below are
# placeholders (the standard 92/99/62 scheme), not independently
# confirmed for this feast, since they have no functional effect at this
# rank.
id: st-joseph
groups:
  - psalms: [92]
    antiphon:
      la: "Ibant paréntes Jesu * per omnes annos in Jerúsalem, in die solémni Paschæ."
      en: "The parents of Jesus * went to Jerusalem every year, at the feast of the Passover."
  - psalms: [99]
    antiphon:
      la: "Cum redírent, * remánsit puer Jesus in Jerúsalem, et non cognovérunt paréntes ejus."
      en: "When they returned, * the Child Jesus tarried behind in Jerusalem, and His parents knew not of it."
  - psalms: [62]
    antiphon:
      la: "Non inveniéntes * Jesum, regréssi sunt in Jerúsalem requiréntes eum; et post tríduum invenérunt illum in templo sedéntem in médio doctórum, audiéntem et interrogántem eos."
      en: "When they found not Jesus, * they turned back again to Jerusalem, seeking Him; and after three days they found Him in the Temple, sitting in the midst of the Doctors, both hearing them and asking them questions."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Dixit Mater ejus * ad illum: Fili, quid fecísti nobis sic? Ecce pater tuus, et ego doléntes quærebámus te."
    en: "His mother said unto Him: * Son, why hast Thou thus dealt with us? Behold, thy father and I have sought thee sorrowing."
laudate:
  antiphon:
    la: "Descéndit Jesus * cum eis, et venit Názareth, et erat súbditus illis."
    en: "Jesus went down with them, * and came to Nazareth, and was subject unto them."
