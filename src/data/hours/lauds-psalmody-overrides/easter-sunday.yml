# Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2027-03-28); Latin and English both taken from the page. Antiphons only; the psalm numbers are the Monastic Sunday scheme (92/99/62, canticle, Laudate).
id: easter-sunday
groups:
  - psalms: [92]
    antiphon:
      la: "Angelus autem Dómini * descéndit de cælo, et accédens revólvit lápidem, et sedébat super eum, allelúja, allelúja."
      en: "For an angel of the Lord * descended from heaven and coming rolled back the stone and sat upon it, alleluia, alleluia."
  - psalms: [99]
    antiphon:
      la: "Et ecce terræmótus * factus est magnus: Angelus enim Dómini descéndit de cælo, allelúja."
      en: "There was a great earthquake; * For an angel of the Lord descended from heaven, alleluia."
  - psalms: [62]
    antiphon:
      la: "Erat autem * aspéctus ejus sicut fulgur, vestiménta autem ejus sicut nix, allelúja, allelúja."
      en: "And his countenance * was as lightning and his raiment as snow, alleluia, alleluia."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Præ timóre autem ejus * extérriti sunt custódes, et facti sunt velut mórtui, allelúja."
    en: "And for fear of him * the guards were struck with terror and became as dead men, alleluia."
laudate:
  antiphon:
    la: "Respóndens autem Angelus, * dixit muliéribus: Nolíte timére: scio enim quod Jesum quǽritis, allelúja."
    en: "And the angel answering * said to the women: Fear not you: for I know that you seek Jesus, alleluia."
