# Engine render (Divino Afflatu - 1954, command=prayLaudes, 2026-08-22); Latin and English both taken from the page. Antiphons only; the psalm numbers are the Monastic Sunday scheme (92/99/62, canticle, Laudate).
id: immaculate-heart-of-mary
groups:
  - psalms: [92]
    antiphon:
      la: "Dum esset Rex * in accúbitu suo, nardus mea dedit odórem suavitátis."
      en: "While the King sitteth at his table, * my spikenard sendeth forth the smell thereof."
  - psalms: [99]
    antiphon:
      la: "Læva ejus * sub cápite meo, et déxtera illíus amplexábitur me."
      en: "His left hand is under my head, * and his right hand doth embrace me."
  - psalms: [62]
    antiphon:
      la: "Nigra sum, * sed formósa, fíliæ Jerúsalem; ídeo diléxit me Rex, et introdúxit me in cubículum suum."
      en: "I am black but comely, * O ye daughters of Jerusalem; therefore hath the King loved me, and brought me into his chamber."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Jam hiems tránsiit, * imber ábiit et recéssit: surge, amíca mea, et veni."
    en: "Lo the winter is past, * the rain is over and gone. Rise up, my love, and come away."
laudate:
  antiphon:
    la: "Speciósa * facta es et suávis in delíciis tuis, sancta Dei Génitrix."
    en: "O Holy Mother of God, thou art become beautiful * and gentle in thy gladness."
