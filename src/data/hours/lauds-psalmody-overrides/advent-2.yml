# Engine (Monastic Tridentinum 1617, command=prayLaudes, 2026-12-06); source Tempora/Adv2-0.txt's [Ant Laudes] entries 1,2,3,4,5 in Latin and English. Antiphons for the Sunday's own psalm slots (Ps 66 first, no antiphon). Applies via the numbers-override path for this temporal Sunday (resolve-common.ts getPsalmodyNumbersOverrideId).
id: advent-2
groups:
  - psalms: [50]
    antiphon:
      la: "Ecce in núbibus cæli * Dóminus véniet cum potestáte magna, allelúja."
      en: "Behold, the Lord * cometh in the clouds of heaven with great power. Alleluia."
  - psalms: [117]
    antiphon:
      la: "Urbs fortitúdinis * nostræ Sion, Salvátor ponétur in ea murus et antemurále: aperíte portas, quia nobíscum Deus, allelúja."
      en: "Our Zion is a strong city, * the Saviour will God appoint in her for walls and bulwarks; open ye the gates, for God is with us. Alleluia."
  - psalms: [62]
    antiphon:
      la: "Ecce apparébit * Dóminus, et non mentiétur: si moram fécerit, exspécta eum, quia véniet, et non tardábit, allelúja."
      en: "Behold, the Lord * shall appear and not lie though He tarry, wait for Him, because He will come and will not tarry. Alleluia."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Montes et colles * cantábunt coram Deo laudem, et ómnia ligna silvárum plaudent mánibus: quóniam véniet Dominátor Dóminus in regnum ætérnum, allelúja, allelúja."
    en: "The mountains and the hills * shall break forth before God into singing, and all the trees of the wood shall clap their hands for the Lord the Ruler cometh, and He shall reign for ever and ever. Alleluia, Alleluia."
laudate:
  antiphon:
    la: "Ecce Dóminus * noster cum virtúte véniet, et illuminábit óculos servórum suórum, allelúja."
    en: "Behold, our Lord * cometh with power, and He shall lighten the eyes of His servants. Alleluia."
