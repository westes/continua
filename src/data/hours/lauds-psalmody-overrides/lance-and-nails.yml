# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt (Duplex majus, Friday of the first week of Lent). Lauds psalmody: Sunday psalms (92, 99, 62, canticle, Laudate) under this feast's own five antiphons. English is this project's own translation, marked draft.
id: lance-and-nails
groups:
  - psalms: [92]
    antiphon:
      la: "Unus mílitum * láncea latus ejus apéruit, et contínuo exívit sánguis et aqua."
      en: "One of the soldiers * opened his side with a lance, and immediately there came out blood and water."
  - psalms: [99]
    antiphon:
      la: "Fodérunt * manus meas et pedes meos; dinumeravérunt ómnia ossa mea."
      en: "They have dug my hands and feet; * they have numbered all my bones."
  - psalms: [62]
    antiphon:
      la: "Tres sunt * qui testimónium dant in terra, spíritus, aqua, et sanguis: et hi tres unum sunt."
      en: "There are three * that give testimony on earth: the spirit, and the water, and the blood; and these three are one."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Quid turbáti estis, * et cogitatiónes ascéndunt in corda vestra? Vidéte manus meas et pedes meos, quia ego ipse sum."
    en: "Why are you troubled, * and why do thoughts arise in your hearts? See my hands and feet, that it is I myself."
laudate:
  antiphon:
    la: "Infer dígitum * tuum huc, et vide manus meas et affer manum, tuam, et mitte in latus meum."
    en: "Put in thy finger * hither, and see my hands; and bring hither thy hand, and put it into my side."
