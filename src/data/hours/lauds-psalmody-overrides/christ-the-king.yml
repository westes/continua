# Verified against Divinum Officium ("Monastic Divino 1930" -- see
# data/calendar/temporal-feasts/christ-the-king.yml on why not Monastic
# Tridentinum 1617), Lauds live query, the last Sunday of October
# (2026-10-25).
id: christ-the-king
groups:
  - psalms: [92]
    antiphon:
      la: "Suscitábit * Deus cæli regnum quod commínuet et consúmet univérsa regna, et ipsum stabit in ætérnum."
      en: "The God of heaven * will set up a kingdom that shall break in pieces and shall consume all these kingdoms, and itself shall stand for ever."
  - psalms: [99]
    antiphon:
      la: "Dedit ei Dóminus * potestátem et honórem et regnum; et omnes pópuli, tribus et linguæ ipsi sérvient."
      en: "The Lord gave him * power, and glory, and a kingdom: and all peoples, tribes, and tongues shall serve him."
  - psalms: [62]
    antiphon:
      la: "Exíbunt aquæ vivæ * de Jerúsalem; et erit Dóminus Rex super omnem terram."
      en: "Living waters shall go out * from Jerusalem; and the Lord shall be king over all the earth."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Magnificábitur * usque ad términos terræ, et erit iste pax."
    en: "He shall be magnified * even to the ends of the earth, and he shall be our peace."
laudate:
  antiphon:
    la: "Gens et regnum * quod non servíerit tibi, períbit: et gentes solitúdine vastabúntur."
    en: "The nation and the kingdom * that will not serve thee, shall perish: and the Gentiles shall be wasted with desolation."
