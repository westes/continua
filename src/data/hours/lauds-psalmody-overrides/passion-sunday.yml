# Engine (Monastic Tridentinum 1617, command=prayLaudes, 2027-03-14); source Tempora/Quad5-0.txt's [Ant Laudes] entries 1,2,3,4,5 in Latin and English. Antiphons for the Sunday's own psalm slots (Ps 66 first, no antiphon). Applies via the numbers-override path for this temporal Sunday (resolve-common.ts getPsalmodyNumbersOverrideId).
id: passion-sunday
groups:
  - psalms: [50]
    antiphon:
      la: "Vide, Dómine, * afflictiónem meam, quóniam eréctus est inimícus meus."
      en: "O Lord, behold my affliction; * for the enemy hath magnified himself."
  - psalms: [117]
    antiphon:
      la: "In tribulatióne * invocávi Dóminum, et exaudívit me in latitúdine."
      en: "I called upon the Lord * in my distress; and He answered me, and set me at large."
  - psalms: [62]
    antiphon:
      la: "Judicásti, Dómine, * causam ánimæ meæ, defénsor vitæ meæ, Dómine Deus meus."
      en: "O Lord, Thou hast pleaded the cause of my soul; * Thou hast redeemed my life, O Lord my God."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Pópule meus, * quid feci tibi, aut quid moléstus fui? Respónde mihi."
    en: "O My people, what have I done unto thee? * or wherein have I wearied thee? testify against Me."
laudate:
  antiphon:
    la: "Numquid rédditur * pro bono malum, quia fodérunt fóveam ánimæ meæ."
    en: "Shall evil be recompensed for good? * for they have digged a pit for My soul."
