# Engine render (Divino Afflatu 1954 (the feast postdates 1617; no Monastic render exists), command=prayLaudes, 2026-04-22); Latin and English both taken from the page. Antiphons only; the psalm numbers are the Monastic Sunday scheme (92/99/62, canticle, Laudate).
id: patronage-of-st-joseph
groups:
  - psalms: [92]
    antiphon:
      la: "Jacob autem * génuit Joseph, virum Maríæ, de qua natus est Jesus, qui vocátur Christus, allelúia."
      en: "And Jacob begat Joseph, * the husband of Mary, of whom was born Jesus, Who is called Christ. Alleluia."
  - psalms: [99]
    antiphon:
      la: "Missus est * Ángelus Gábriel a Deo in civitátem Galilǽæ, cui nomen Názareth, ad Vírginem desponsátam viro, cui nomen erat Joseph, allelúia."
      en: "The Angel Gabriel * was sent from God, unto a city of Galilee, named Nazareth, to a Virgin espoused to a man whose name was Joseph. Alleluia."
  - psalms: [62]
    antiphon:
      la: "Ascéndit autem * Joseph a Galilǽa de civitáte Názareth in Judǽam, in civitátem David, quæ vocátur Béthlehem, allelúia."
      en: "And Joseph also went up * from Galilee, out of the city of Nazareth, unto Judea, unto the city of David, which is called Bethlehem. Alleluia."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Et venérunt festinántes, * et invenérunt Maríam, et Joseph, et Infántem pósitum in præsépio, allelúia."
    en: "And they came with haste, * and found Mary and Joseph, and the Babe lying in a manger. Alleluia."
laudate:
  antiphon:
    la: "Et ipse Jesus * erat incípiens quasi annórum trigínta, ut putabátur, fílius Joseph, allelúia."
    en: "And Jesus Himself began to be about thirty years of age, being (as was supposed) the Son of Joseph. Alleluia."
