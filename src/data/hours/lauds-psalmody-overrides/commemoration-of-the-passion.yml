# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp2-2-PassionisDNJC.txt (Duplex majus, Tuesday after Sexagesima; its own Oratio and Lectio4-9, the rest "ex Commune/Votiva/V6", the votive office of the Passion). Lauds psalmody: Sunday psalms (92, 99, 62, canticle, Laudate) under this feast's own five antiphons. English is this project's own translation, marked draft.
id: commemoration-of-the-passion
groups:
  - psalms: [92]
    antiphon:
      la: "Fui flagellátus * tota die, et castigátio mea in matutínis."
      en: "I have been scourged * all the day, and my chastisement hath been in the mornings."
  - psalms: [99]
    antiphon:
      la: "Veni ad montem myrrhæ * et ad collem thuris; tamquam agnus ad occisionem ductus, obmútui, et non apérui os meum."
      en: "I have come to the mountain of myrrh * and to the hill of frankincense; like a lamb led to the slaughter I was dumb, and opened not my mouth."
  - psalms: [62]
    antiphon:
      la: "Fodérunt manus meas * et pedes meos: dinumeravérunt ómnia ossa mea."
      en: "They have dug my hands * and feet: they have numbered all my bones."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Consolantem me * quæsívi, et non invéni: dedérunt in escam meam fel, et in siti mea potavérunt me acéto."
    en: "I sought one that would comfort me, * and I found none: they gave me gall for my food, and in my thirst they gave me vinegar to drink."
laudate:
  antiphon:
    la: "Cum accepísset Jesus * acetum, dixit: Consummatum est; et inclináto cápite, emísit spíritum."
    en: "When Jesus had taken * the vinegar, he said: It is consummated; and bowing his head, he gave up the ghost."
