# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/10-23-Redemptor.txt ("Ss. Redemptoris", Duplex majus, nine lessons; no Common: every part is its own or named by an `@` include, read from the file it names). Lauds psalmody: the Common's own psalms (92, 99, 62, canticle, Laudate) under this feast's own five antiphons. English is this project's own translation, marked draft.
id: most-holy-redeemer
groups:
  - psalms: [92]
    antiphon:
      la: "Cantáte Dómino, * quóniam magnífice fecit: annuntiáte hoc in univérsa terra."
      en: "Sing ye to the Lord, * for he hath done gloriously: declare this in all the earth."
  - psalms: [99]
    antiphon:
      la: "Ecce Deus * Salvátor meus, fiduciáliter agam: quia factus est mihi in salútem, allelúja."
      en: "Behold, God is my Saviour, * I will deal confidently, and will not fear: because he is become my salvation, alleluia."
  - psalms: [62]
    antiphon:
      la: "Hauriétis aquas * in gáudio de fóntibus Salvatóris, et dicétis: Confitémini Dómino, et invocáte nomen ejus."
      en: "You shall draw waters * with joy out of the Saviour's fountains, and you shall say: Give glory to the Lord, and call upon his name."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Facta est salus, * et virtus, et regnum Dei nostri, et potéstas Christi ejus."
    en: "Now is come salvation, * and strength, and the kingdom of our God, and the power of his Christ."
laudate:
  antiphon:
    la: "Exsúlta et lauda * habitátio Sion, quia magnus in médio tui sanctus Israël."
    en: "Rejoice and praise, * O thou habitation of Sion: for great is he that is in the midst of thee, the Holy One of Israel."
