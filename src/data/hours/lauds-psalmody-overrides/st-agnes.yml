# Sourced from web/www/horas/Latin/Sancti/01-21.txt's own [Ant Laudes]
# and English/Sancti/01-21.txt's own translation. Below duplex-majus, so
# hours/lauds.ts's mergeFerialNumbersWithProperAntiphons only takes this
# file's antiphon text, not its psalm numbers -- the numbers below are
# placeholders (the standard 92/99/62 scheme most Virgin-Martyr-shaped
# feasts use), not independently confirmed for this feast, since they
# have no functional effect at this rank.
id: st-agnes
groups:
  - psalms: [92]
    antiphon:
      la: "Ingréssa Agnes * turpitúdinis locum, Angelum Dómini præparátum invénit."
      en: "Agnes entered * the place of shame, and found the Angel of the Lord ready."
  - psalms: [99]
    antiphon:
      la: "Mecum enim hábeo * custódem córporis mei, Angelum Dómini."
      en: "For I have with me * an Angel of the Lord to keep my body."
  - psalms: [62]
    antiphon:
      la: "Anulo suo * subarrhávit me Dóminus meus Jesus Christus, et tamquam sponsam decorávit me coróna."
      en: "My Lord Jesus Christ hath espoused me with His ring, * and hath set on my head a crown as the crown of a bride."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Benedíco te, * Pater Dómini mei Jesu Christi, quia per Fílium tuum ignis exstínctus est a látere meo."
    en: "I bless thee, O Father of my Lord Jesus Christ, * because through thy Son the fire is quenched around me."
laudate:
  antiphon:
    la: "Congaudéte mecum * et congratulámini, quia cum his ómnibus lúcidas sedes accépi."
    en: "Rejoice with me * and make merry, because I also have received a throne in light among all these."
