# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp1-2-OratioDNJC.txt (Duplex majus, Tuesday after Septuagesima). Lauds psalmody: Sunday psalms (92, 99, 62, canticle, Laudate) under this feast's own five antiphons. English is this project's own translation, marked draft.
id: prayer-on-the-mount-of-olives
groups:
  - psalms: [92]
    antiphon:
      la: "Venit Jesus * cum discipulis suis in villam, quæ dicitur Gethsemani, et dixit illis: Sedete hic, donec vadam illuc, et orem."
      en: "Jesus came * with his disciples into a country place which is called Gethsemani, and he said to them: Sit you here, till I go yonder and pray."
  - psalms: [99]
    antiphon:
      la: "Et assúmpto Petro, * et duobus filiis Zebedæi, cœpit contristari et mœstus esse."
      en: "And taking with him Peter * and the two sons of Zebedee, he began to grow sorrowful and to be sad."
  - psalms: [62]
    antiphon:
      la: "Tunc ait illis: * Tristis est anima mea usque ad mortem: sustinete hic, et vigilate mecum."
      en: "Then he saith to them: * My soul is sorrowful even unto death: stay you here, and watch with me."
canticle:
  id: canticum-trium-puerorum
  antiphon:
    la: "Et progressus pusillum, * procidit in fáciem suam, orans, et dicens: Pater mi, si possibile est, transeat a me calix iste."
    en: "And going a little further, * he fell upon his face, praying, and saying: My Father, if it be possible, let this chalice pass from me."
laudate:
  antiphon:
    la: "Pater mi, * si non potest hic calix transire, nisi bibam illum, fiat volúntas tua."
    en: "My Father, * if this chalice may not pass away, but I must drink it, thy will be done."
