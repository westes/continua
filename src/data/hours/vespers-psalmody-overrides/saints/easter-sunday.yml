# Engine render (Monastic Tridentinum 1617, command=prayVespera, 2027-03-28); Latin and English both taken from the page. Second Vespers psalm antiphons.
id: easter-sunday
groups:
  - psalms: [109]
    antiphon:
      la: "Angelus autem Dómini * descéndit de cælo, et accédens revólvit lápidem, et sedébat super eum, allelúia, allelúia."
      en: "For an angel of the Lord * descended from heaven and coming rolled back the stone and sat upon it, alleluia, alleluia."
  - psalms: [110]
    antiphon:
      la: "Et ecce terræmótus * factus est magnus: Angelus enim Dómini descéndit de cælo, allelúia."
      en: "There was a great earthquake; * For an angel of the Lord descended from heaven, alleluia."
  - psalms: [111]
    antiphon:
      la: "Erat autem * aspéctus ejus sicut fulgur, vestiménta autem ejus sicut nix, allelúia, allelúia."
      en: "And his countenance * was as lightning and his raiment as snow, alleluia, alleluia."
  - psalms: [112]
    antiphon:
      la: "Respóndens autem Angelus, * dixit muliéribus: Nolíte timére: scio enim quod Jesum quǽritis, allelúia."
      en: "And the angel answering * said to the women: Fear not you: for I know that you seek Jesus, alleluia."
