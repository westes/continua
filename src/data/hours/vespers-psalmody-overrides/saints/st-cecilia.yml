# Sourced from web/www/horas/Latin/Sancti/11-22.txt's own [Ant Vespera]
# (default rubric block) and English/Sancti/11-22.txt's own translation
# -- same text as lauds-psalmody-overrides/st-cecilia.yml (her Lauds is
# just this Vespers set reused, per the source's own reference). Below
# duplex-majus, so hours/vespers.ts's mergeFerialNumbersWithProperAntiphons
# only takes this file's antiphon text, not its psalm numbers.
id: st-cecilia
groups:
  - psalms: [109]
    antiphon:
      la: "Cantántibus órganis, * Cæcília Dómino decantábat, dicens: Fiat cor meum immaculátum, ut non confúndar."
      en: "The musicians played, and Cecilia sang unto the Lord, * saying: Let my heart be undefiled, that I be not ashamed."
  - psalms: [112]
    antiphon:
      la: "Valeriánus * in cubículo Cæcíliam cum Angelo orántem invénit."
      en: "Valerian found Cecilia praying in her chamber, * and with her the Angel."
  - psalms: [121]
    antiphon:
      la: "Cæcília * fámula tua, Dómine, quasi apis tibi argumentósa desérvit."
      en: "Busy like a bee, * O Lord, did thine handmaiden Cecilia serve thee."
  - psalms: [126]
    antiphon:
      la: "Benedíco te, * Pater Dómini mei Jesu Christi, quia per Fílium tuum ignis exstínctus est a látere meo."
      en: "I bless thee, O Father of my Lord Jesus Christ, * that through thy Son the fire is gone out round about me."
