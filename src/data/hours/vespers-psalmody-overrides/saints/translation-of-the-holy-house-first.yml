# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/12-10-Domus.txt (Duplex majus, nine lessons, `ex C11`; the parts it marks `@Commune/C8` are read from Commune/C8.txt, the Common of a Dedication). Vespers psalmody: the source's five antiphons reduced to the Monastic four: antiphons 1, 2, 3 under their own psalms, antiphon 5 under the fourth antiphon's psalm (126), as the engine's Monastic Vespers does. English is this project's own translation, marked draft.
id: translation-of-the-holy-house-first
groups:
  - psalms: [109]
    antiphon:
      la: "Domum tuam, Dómine, * decet sanctitúdo in longitúdinem diérum."
      en: "Holiness becometh thine house, * O Lord, for ever."
  - psalms: [112]
    antiphon:
      la: "Domus mea, * domus oratiónis vocábitur: in ea omnis qui petit, áccipit, et qui quærit ínvenit: et pulsánti aperiétur."
      en: "My house * shall be called the house of prayer: therein, he that asketh, receiveth; he that seeketh, findeth; and to him that knocketh, it shall be opened."
  - psalms: [121]
    antiphon:
      la: "Propter domum * Dómini Dei nostri quæsívi bona tibi."
      en: "For the sake of the house * of the Lord our God I have sought good things for thee."
  - psalms: [126]
    antiphon:
      la: "Domum majestátis meæ, * et locum pedum meórum glorificábo."
      en: "The house of my majesty, * and the place of my feet, I will glorify."
