# Engine (Monastic Tridentinum 1617, command=prayVespera, 2027-12-19). The Sunday's own Second Vespers psalm antiphons; First Vespers (Saturday evening) keeps the ferial Saturday psalmody (hours/vespers.ts).
id: advent-4
groups:
  - psalms: [109]
    antiphon:
      la: "Cánite tuba * in Sion, quia prope est dies Dómini: ecce véniet ad salvándum nos, allelúia, allelúia."
      en: "Blow ye the trumpet * in Zion, for the day of the Lord is nigh at hand: behold, He cometh to save us! Alleluia, Alleluia."
  - psalms: [110]
    antiphon:
      la: "Ecce véniet * desiderátus cunctis géntibus: et replébitur glória domus Dómini, allelúia."
      en: "Behold, the desire * of all nations shall come; and the house of the Lord shall be filled with glory. Alleluia."
  - psalms: [111]
    antiphon:
      la: "Erunt prava * in dirécta, et áspera in vias planas: veni, Dómine, et noli tardáre, allelúia."
      en: "The crooked * shall be made straight, and the rough places plain; O Lord, come, and make no tarrying. Alleluia."
  - psalms: [112]
    antiphon:
      la: "Omnípotens Sermo tuus, * Dómine, a regálibus sédibus véniet, allelúia."
      en: "Thine Almighty Word, * O Lord, shall leap down out of thy royal throne. Alleluia."
