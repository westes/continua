# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/01-23-Desponsatio.txt (Duplex majus, nine lessons, `ex C11`; "Proprium viz. 1888"). Vespers psalmody: the source's five antiphons reduced to the Monastic four: antiphons 1, 2, 3 under their own psalms, antiphon 5 under the fourth antiphon's psalm (126), as the engine's Monastic Vespers does. English is this project's own translation, marked draft.
id: betrothal-of-the-bvm-first
groups:
  - psalms: [109]
    antiphon:
      la: "Desponsátio * gloriósæ Vírginis Maríæ, ex sémine Abrahæ, ortæ de tribu Juda, clara ex stirpe David."
      en: "The betrothal * of the glorious Virgin Mary, sprung of the seed of Abraham, of the tribe of Juda, bright from the stock of David."
  - psalms: [112]
    antiphon:
      la: "Desponsátio est hódie * sanctæ Maríæ Vírginis, cujus vita ínclyta cunctas illústrat ecclésias."
      en: "This day is the betrothal * of the holy Virgin Mary, whose illustrious life lights up all the churches."
  - psalms: [121]
    antiphon:
      la: "Regáli ex progénie * María exórta refúlget: cujus précibus nos adjuvári mente et spíritu devotíssime póscimus."
      en: "From a royal lineage * Mary sprung forth shines: by whose prayers we most devoutly beg to be helped in mind and spirit."
  - psalms: [126]
    antiphon:
      la: "Cum jucunditáte * Desponsatiónem beátæ Maríæ celebrémus, ut ipsa pro nobis intercédat ad Dóminum Jesum Christum."
      en: "With joy * let us celebrate the betrothal of blessed Mary, that she may intercede for us to our Lord Jesus Christ."
