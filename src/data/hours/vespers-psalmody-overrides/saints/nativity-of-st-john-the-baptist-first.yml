# Content read from the reference engine's live render (Monastic Tridentinum 1617, command=prayVespera): 06-24
# nativity-of-st-john-the-baptist. First Vespers psalm antiphons; the other evening's set is
# nativity-of-st-john-the-baptist.yml. See vespers-psalmody-overrides.ts's getVespersSaintOverride.
id: nativity-of-st-john-the-baptist-first
groups:
  - psalms: [109]
    antiphon:
      la: "Ipse præíbit * ante illum in spíritu et virtúte Elíæ paráre Dómino plebem perféctam."
      en: "He shall go before Him * in the spirit and power of Elias, to make ready a people prepared for the Lord."
  - psalms: [110]
    antiphon:
      la: "Joánnes * est nomen ejus: vinum et síceram non bibet, et multi in nativitáte ejus gaudébunt."
      en: "His name is John. * He shall drink neither wine nor strong drink, and many shall rejoice at his birth."
  - psalms: [111]
    antiphon:
      la: "Ex útero senectútis * et stérili Joánnes natus est, præcúrsor Dómini."
      en: "Elizabeth was barren and well stricken in years, * but from her womb was born John the Fore-runner of the Lord."
  - psalms: [112]
    antiphon:
      la: "Iste puer * magnus coram Dómino: nam et manus ejus cum ipso est."
      en: "The child shall be great * in the sight of the Lord, for His hand is with him."
