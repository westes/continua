# Content read from the reference engine's live render (Monastic Tridentinum 1617, command=prayVespera):
# 2026-04-03 good-friday second. Named temporal feast: the app had no Vespers psalm antiphons for it and fell
# back to the ferial/Sunday set. Paschaltide Alleluia is left to hours/paschal-alleluia.ts.
id: good-friday
groups:
  - psalms: [115]
    antiphon:
      la: "Cálicem * salutáris accípiam et nomen Dómini invocábo."
      en: "I will take the cup of salvation; * and call upon the Name of the Lord."
  - psalms: [119]
    antiphon:
      la: "Cum his, * qui odérunt pacem eram pacíficus: dum loquébar illis, impugnábant me gratis."
      en: "With them * that hate peace I was peaceable; when I spoke unto them they fought against me without a cause."
  - psalms: [139]
    antiphon:
      la: "Ab homínibus * iníquis líbera me, Dómine."
      en: "O Lord, preserve me * from the wicked man."
  - psalms: [140]
    antiphon:
      la: "Custódi me * a láqueo, quem statuérunt mihi, et a scándalis operántium iniquitátem."
      en: "Keep me * from the snare which they have laid for me, and the gins of the workers of iniquity."
  - psalms: [141]
    antiphon:
      la: "Considerábam * ad déxteram, et vidébam, et non erat qui cognósceret me."
      en: "I looked * on my right hand and beheld: but there was no man that would know me."
