# Live-verified against Divinum Officium (Monastic Tridentinum 1617,
# command=prayVespera, 2026-07-02, own day). `common: proper-to-the-
# visitation-of-the-bvm` has no Vespers Common category (fully proper), so
# without this file the feast fell to the plain ferial default. Psalms
# 109/112/121/126.
id: visitation-of-the-bvm
groups:
  - psalms: [109]
    antiphon:
      la: "Visitatio gloriósæ * Vírginis Maríæ ex sémine Abrahæ, ortæ de tribu Juda, clara ex stirpe David."
      en: "This day was the visitation of the glorious Virgin Mary, * a child of the seed of Abraham, a daughter of the tribe of Judah, a Princess of the lineage of David."
  - psalms: [112]
    antiphon:
      la: "Visitatio est hódie * sanctæ Maríæ Vírginis, cujus vita ínclita cunctas illústrat ecclésias."
      en: "This day is the Visitation of the holy Virgin Mary, * whose famous life still sheddeth lustre upon all the Churches."
  - psalms: [121]
    antiphon:
      la: "Regáli ex progénie * María exórta refúlget; cujus précibus nos adjuvári, mente et spíritu devotíssime póscimus."
      en: "Mary was a maiden of illustrious birth, * the daughter of a Kingly race. We earnestly entreat her to help our minds and souls by her prayers."
  - psalms: [126]
    antiphon:
      la: "Cum jucunditáte * visitatiónem beátæ Maríæ celebrémus, ut ipsa pro nobis intercédat ad Dóminum Jesum Christum."
      en: "Let us keep with rejoicing the Visitation of the Blessed Virgin Mary, * that she may pray for us to our Lord Jesus Christ."
