# Content read from the reference engine's live render (Monastic Tridentinum 1617, command=prayVespera):
# 2026-06-03 corpus-christi first. Named temporal feast: the app had no Vespers psalm antiphons for it and fell
# back to the ferial/Sunday set. Paschaltide Alleluia is left to hours/paschal-alleluia.ts.
id: corpus-christi-first
groups:
  - psalms: [109]
    antiphon:
      la: "Sacérdos in ætérnum * Christus Dóminus secúndum órdinem Melchísedech, panem et vinum óbtulit."
      en: "Christ the Lord, being made an High Priest for ever * after the order of Melchisedec, hath offered bread and wine."
  - psalms: [110]
    antiphon:
      la: "Miserátor Dóminus * escam dedit timéntibus se in memóriam suórum mirabílium."
      en: "He hath made His wonderful works to be remembered; * the Lord is gracious and full of compassion. He hath given meat unto them that fear Him."
  - psalms: [115]
    antiphon:
      la: "Cálicem salutáris * accípiam: et sacrificábo hóstiam laudis."
      en: "I will take the cup of salvation, * and offer the sacrifice of thanksgiving."
  - psalms: [127]
    antiphon:
      la: "Sicut novéllæ olivárum, * Ecclésiæ fílii sint in circúitu mensæ Dómini."
      en: "Let the children of the Church be like olive-plants * round about the table of the Lord."
