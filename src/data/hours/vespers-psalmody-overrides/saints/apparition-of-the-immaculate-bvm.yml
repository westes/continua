# Sourced from web/www/horas/Latin/Sancti/02-11.txt's own [Ant Vespera]
# block (a live "Hodie" query for 2026-02-11 renders a plain Sexagesima
# feria under Monastic Tridentinum 1617 -- this 1858 apparition feast
# doesn't exist in that calendar at all, same pattern as several other
# late-19th/20th-century feasts found in this sweep). Psalms
# 109/112/121/126 (only the first 4 of the raw file's 5 listed
# antiphons used, per the established Monastic-4-slots convention).
id: apparition-of-the-immaculate-bvm
groups:
  - psalms: [109]
    antiphon:
      la: "Candor est * lucis ætérnæ, et spéculum sine mácula."
      en: "She is the brightness * of eternal light, and the unspotted mirror."
  - psalms: [112]
    antiphon:
      la: "Múlier * amícta sole, et luna sub pédibus ejus, et in cápite ejus coróna stellárum duódecim."
      en: "A woman * clothed with the sun, and the moon under her feet, and on her head a crown of twelve stars."
  - psalms: [121]
    antiphon:
      la: "Tu glória Jerúsalem, * tu lætítia Israël, tu honorificéntia pópuli nostri."
      en: "Thou art the glory of Jerusalem, * thou art the joy of Israel, thou art the honour of our people."
  - psalms: [126]
    antiphon:
      la: "Benedícta es tu, * Virgo María, a Dómino Deo excélso præ ómnibus muliéribus super terram."
      en: "Blessed art thou, * O Virgin Mary, by the Lord, the most high God, above all women upon the earth."
