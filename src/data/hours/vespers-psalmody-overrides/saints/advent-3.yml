# Engine (Monastic Tridentinum 1617, command=prayVespera, 2028-12-17). The Sunday's own Second Vespers psalm antiphons; First Vespers (Saturday evening) keeps the ferial Saturday psalmody (hours/vespers.ts).
id: advent-3
groups:
  - psalms: [109]
    antiphon:
      la: "Véniet Dóminus, * et non tardábit, et illuminábit abscóndita tenebrárum, et manifestábit se ad omnes gentes, allelúia."
      en: "The Lord will come, * and will not tarry; He both will bring to light the hidden things of darkness, and will make Himself manifest to all people. Alleluia."
  - psalms: [110]
    antiphon:
      la: "Jerúsalem, gaude * gáudio magno, quia véniet tibi Salvátor, allelúia."
      en: "Rejoice greatly, O Jerusalem, * for thy Saviour cometh unto thee. Alleluia."
  - psalms: [111]
    antiphon:
      la: "Dabo in Sion * salútem, et in Jerúsalem glóriam meam, allelúia."
      en: "I will place salvation in Zion, * and My glory in Jerusalem. Alleluia."
  - psalms: [112]
    antiphon:
      la: "Juste et pie * vivámus, exspectántes beátam spem, et advéntum Dómini."
      en: "We should live * righteously and godly, looking for that blessed hope and the coming of the Lord."
