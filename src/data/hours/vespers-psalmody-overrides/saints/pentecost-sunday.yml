# Engine render (Monastic Tridentinum 1617, command=prayVespera, 2027-05-16); Latin and English both taken from the page. Second Vespers psalm antiphons.
id: pentecost-sunday
groups:
  - psalms: [109]
    antiphon:
      la: "Cum compleréntur * dies Pentecóstes, erant omnes páriter in eódem loco, allelúja."
      en: "When the day of Pentecost was fully come * they were all with one accord in one place, alleluia."
  - psalms: [110]
    antiphon:
      la: "Spíritus Dómini * replévit orbem terrárum, allelúja."
      en: "The Spirit of the Lord * filleth the world, alleluia."
  - psalms: [111]
    antiphon:
      la: "Repléti sunt omnes * Spíritu Sancto, et cœpérunt loqui, allelúja, allelúja."
      en: "They were all filled * with the Holy Ghost, and began to speak, alleluia, alleluia."
  - psalms: [112]
    antiphon:
      la: "Loquebántur * váriis linguis Apóstoli magnália Dei, allelúja, allelúja, allelúja."
      en: "The Apostles spoke in diverse tongues * the wonderful works of God, alleluia, alleluia, alleluia."
