# Content read from the reference engine's live render (Monastic Tridentinum 1617, command=prayVespera):
# 2026-12-25 christmas-octave-sunday second. Named temporal feast: the app had no Vespers psalm antiphons for it
# and fell back to the ferial/Sunday set. Paschaltide Alleluia is left to hours/paschal-alleluia.ts.
id: christmas-octave-sunday
groups:
  - psalms: [109]
    antiphon:
      la: "Tecum princípium * in die virtútis tuæ, in splendóribus sanctórum, ex útero ante lucíferum génui te."
      en: "Thine shall be the dominion * in the day of thy power, amid the brightness of the saints, from the womb, before the day-star, have I begotten thee."
  - psalms: [110]
    antiphon:
      la: "Redemptiónem * misit Dóminus pópulo suo: mandávit in ætérnum testaméntum suum."
      en: "The Lord sent redemption * unto His people, He hath commanded His covenant for ever."
  - psalms: [111]
    antiphon:
      la: "Exórtum est * in ténebris lumen rectis corde: miséricors, et miserátor, et justus Dóminus."
      en: "Unto the upright there ariseth * light in the darkness; the Lord is gracious, and full of compassion, and righteous."
  - psalms: [129]
    antiphon:
      la: "Apud Dóminum * misericórdia, et copiósa apud eum redémptio."
      en: "With the Lord * there is mercy, and with Him is plenteous redemption."
