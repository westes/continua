# Content read from the reference engine's live render (Monastic Tridentinum 1617, command=prayVespera):
# 2026-05-13 ascension first. Named temporal feast: the app had no Vespers psalm antiphons for it and fell back
# to the ferial/Sunday set. Paschaltide Alleluia is left to hours/paschal-alleluia.ts.
id: ascension-first
groups:
  - psalms: [109]
    antiphon:
      la: "Viri Galilǽi, * quid aspícitis in cælum? Hic Jesus qui assúmptus est a vobis in cælum, sic véniet."
      en: "Ye men of Galilee, * why stand ye gazing up into heaven? This same Jesus, Which is taken up from you into heaven, shall so come in like manner."
  - psalms: [110]
    antiphon:
      la: "Cumque intueréntur * in cælum eúntem illum, dixérunt."
      en: "And while they looked * steadfastly towards heaven, as He went up, they said."
  - psalms: [111]
    antiphon:
      la: "Elevátis mánibus, * benedíxit eis, et ferebátur in cælum."
      en: "He lifted up His Hands, * and blessed them, and was carried up into heaven."
  - psalms: [112]
    antiphon:
      la: "Vidéntibus illis, * elevátus est, et nubes suscépit eum in cælo."
      en: "While they beheld, * He was taken up, and a cloud received Him in heaven."
