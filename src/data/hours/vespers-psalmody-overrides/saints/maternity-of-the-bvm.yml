# Sourced from web/www/horas/Latin/Sancti/10-11.txt's own [Ant Vespera]
# block. Maternity of the BVM (instituted 1931) doesn't exist in the
# Monastic Tridentinum 1617 calendar at all -- a live "Hodie" query for
# 2026-10-11 under that version just renders the plain 20th Sunday after
# Pentecost, confirming there's no live-render path to verify this feast
# against under that version; using the static secular file directly
# instead, same as Nativity BVM's own Common-of-the-BVM invitatory
# sourcing. Only the first 4 of the raw file's 5 listed antiphons are
# used (Monastic Vespers has 4 psalm slots, not 5).
id: maternity-of-the-bvm
groups:
  - psalms: [109]
    antiphon:
      la: "Beáta es, * Virgo María, quæ ómnium portásti Creatórem."
      en: "Blessed art thou, * O Virgin Mary, who didst bear the Creator of all things."
  - psalms: [112]
    antiphon:
      la: "Genuísti, * qui te fecit, et in ætérnum pérmanes Virgo."
      en: "Thou didst bring him forth * who made thee, and remainest a Virgin for ever."
  - psalms: [121]
    antiphon:
      la: "Cum essem párvula, * plácui Altíssimo et de meis viscéribus génui Deum et hóminem."
      en: "When I was a little one, * I pleased the Most High, and from my womb I have brought forth God and man."
  - psalms: [126]
    antiphon:
      la: "Benedícta fília * tu a Dómino, quia per te fructum vitæ communicávimus."
      en: "Daughter, thou art blessed * of the Lord: for by thee we have partaken of the fruit of life."
