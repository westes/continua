# Live-verified against Divinum Officium (Monastic Tridentinum 1617,
# command=prayVespera, 2026-02-02, own day). Same four psalm numbers as
# her Common (common-of-the-bvm.yml: 109/112/121/126), but her own proper
# (Simeon-focused) antiphons throughout, not the Common's generic ones.
id: purification
groups:
  - psalms: [109]
    antiphon:
      la: "Símeon justus * et timorátus exspectábat redemptiónem Israël, et Spíritus Sanctus erat in eo."
      en: "Simeon was just * and devout, waiting for the consolation of Israel, and the Holy Ghost was upon him."
  - psalms: [112]
    antiphon:
      la: "Respónsum accépit Símeon * a Spíritu Sancto, non visúrum se mortem, nisi vidéret Dóminum."
      en: "It was revealed unto Simeon * by the Holy Ghost that he should not see death before he had seen the Lord."
  - psalms: [121]
    antiphon:
      la: "Accípiens Símeon * Púerum in mánibus, grátias agens benedíxit Dóminum."
      en: "Simeon took * the Child up in his arms, and gave thanks, and blessed the Lord."
  - psalms: [126]
    antiphon:
      la: "Obtulérunt * pro eo Dómino par túrturum aut duos pullos columbárum."
      en: "They offered for Him * unto the Lord, a pair of turtle doves, or two young pigeons."
