# Content read from the reference engine's live render (Monastic Tridentinum 1617, command=prayVespera):
# 2026-12-24 christmas-octave-sunday first. Named temporal feast: the app had no Vespers psalm antiphons for it
# and fell back to the ferial/Sunday set. Paschaltide Alleluia is left to hours/paschal-alleluia.ts.
id: christmas-octave-sunday-first
groups:
  - psalms: [109]
    antiphon:
      la: "Rex pacíficus * magnificátus est, cujus vultum desíderat univérsa terra."
      en: "The King of Peace * is magnified, whose face the whole earth desireth."
  - psalms: [110]
    antiphon:
      la: "Magnificátus est * Rex pacíficus super omnes reges univérsæ terræ."
      en: "The Peaceful King * exceeded all the kings of the whole earth."
  - psalms: [111]
    antiphon:
      la: "Compléti sunt * dies Maríæ, ut páreret Fílium suum primogénitum."
      en: "The days of Mary * were accomplished that she should bring forth her first-born Son."
  - psalms: [112]
    antiphon:
      la: "Leváte cápita vestra: * ecce appropínquat redémptio vestra."
      en: "Lift up your heads; * behold, your redemption draweth nigh."
