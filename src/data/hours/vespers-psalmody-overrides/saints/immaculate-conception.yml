# Live-verified against Divinum Officium (Monastic Tridentinum 1617,
# command=prayVespera, 2026-12-08, own day). Same four psalm numbers as
# her Common (common-of-the-bvm.yml: 109/112/121/126), her own proper
# antiphons throughout -- byte-identical to her already-authored Prime/
# Terce/Sext/None antiphons (Prime=Ps109 slot, Terce=Ps112, Sext=Ps121,
# None=Ps126), so their already-restored accentuation is reused directly
# (the live render itself drops diacritics throughout; see prime-antiphon-
# immaculate-conception.yml's own note on restoring it against the
# word-for-word-parallel Nativity BVM antiphon).
id: immaculate-conception
groups:
  - psalms: [109]
    antiphon:
      la: "Concéptio gloriósæ * Vírginis Maríæ ex sémine Abrahæ, ortæ de tribu Juda, clara ex stirpe David."
      en: "This day was conceived the glorious Virgin Mary, * a child of the seed of Abraham, a daughter of the tribe of Judah, a Princess of the lineage of David."
  - psalms: [112]
    antiphon:
      la: "Concéptio est hódie * sanctæ Maríæ Vírginis, cujus vita ínclita cunctas illústrat ecclésias."
      en: "This day is the Conception of the holy Virgin Mary, * whose famous life still sheddeth lustre upon all the Churches."
  - psalms: [121]
    antiphon:
      la: "Regáli ex progénie * María exórta refúlget: cujus précibus nos adjuvári mente et spíritu devotíssime póscimus."
      en: "Mary was a maiden of illustrious birth, * the daughter of a Kingly race. We earnestly entreat her to help our minds and souls by her prayers."
  - psalms: [126]
    antiphon:
      la: "Cum jucunditáte * Conceptiónem beátæ Maríæ celebrémus, ut ipsa pro nobis intercédat ad Dóminum Jesum Christum."
      en: "Let us keep with rejoicing * the Conception of the Blessed Virgin Mary, that she may pray for us to our Lord Jesus Christ."
