# `common: proper-to-the-finding-of-the-holy-cross` has no Vespers Common
# category (it's fully proper), so without this file the feast fell to
# the plain ferial default. Psalms 109/110/111/112, antiphon text shared
# with `exaltation-of-the-holy-cross.yml` (same Cross antiphons, both
# feasts). Originally live-queried on 2026-05-03, but that date falls
# inside Paschaltide (as it does most years, since Easter's range is
# Mar 22-Apr 25) and the render added a seasonal "allelúia" to antiphons
# 1/2/4 that isn't part of their fixed text -- confirmed by cross-querying
# `exaltation-of-the-holy-cross` (Sept 14, never in Paschaltide): only
# antiphon 3 carries "allelúia" unconditionally, baked into its own proper
# text. Corrected here to match.
id: finding-of-the-holy-cross
groups:
  - psalms: [109]
    antiphon:
      la: "O magnum pietátis opus: * mors mórtua tunc est, in ligno quando mórtua Vita fuit."
      en: "O what a work of love was that * when Life and death died together upon the Tree."
  - psalms: [110]
    antiphon:
      la: "Salva nos, * Christe Salvátor, per virtútem Crucis: qui salvásti Petrum in mari, miserére nobis."
      en: "Save us, * O Christ the Saviour, save us through the might of thy Cross Thou Who didst save Peter when he was ready to sink in the sea, have mercy upon us."
  - psalms: [111]
    antiphon:
      la: "Ecce Crucem Dómini, * fúgite, partes advérsæ, vicit leo de tribu Juda, radix David, allelúia."
      en: "Behold, the Cross of the Lord! * Fly, ye ranks of the adversary! The Lion of the tribe of Judah, the Root of David, hath prevailed. Alleluia."
  - psalms: [112]
    antiphon:
      la: "Per signum Crucis * de inimícis nostris líbera nos, Deus noster."
      en: "By thy Cross' holy sign, * Jesus, guard this soul of mine from my ghostly enemy."
