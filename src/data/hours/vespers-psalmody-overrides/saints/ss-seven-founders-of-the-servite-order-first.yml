# Post-1617 feast: no Monastic render exists, so this is the Divino Afflatu 1954 engine render (2026-02-12
# ss-seven-founders-of-the-servite-order first (Divino Afflatu 1954 engine render; Monastic reduction 1,2,3,5)),
# Sunday-style psalm numbers. Paschaltide Alleluia is left to hours/paschal-alleluia.ts.
id: ss-seven-founders-of-the-servite-order-first
groups:
  - psalms: [109]
    antiphon:
      la: "Ecce quam bonum * et quam jucúndum habitáre fratres in unum. ‡"
      en: "Behold how good * and how pleasant it is for brethren to dwell together in unity. ‡"
  - psalms: [110]
    antiphon:
      la: "Confitémini Dómino * quóniam in ætérnum misericórdia ejus."
      en: "Give ye glory to the Lord * for his mercy endureth for ever."
  - psalms: [111]
    antiphon:
      la: "Confitémini Dómino * quia in humilitáte nostra memor fuit nostri."
      en: "Give ye glory to the Lord * for he was mindful of us in our affliction."
  - psalms: [112]
    antiphon:
      la: "Confitébor * nómini tuo, Dómine, super misericórdia et veritáte tua."
      en: "I will give glory * to thy name, for thy mercy, and for thy truth."
