# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/10-23-Redemptor.txt ("Ss. Redemptoris", Duplex majus, nine lessons; no Common: every part is its own or named by an `@` include, read from the file it names). Vespers psalmody: the source's five antiphons reduced to the Monastic four: antiphons 1, 2, 3 under their own psalms, antiphon 5 under the fourth antiphon's psalm (129), as the engine's Monastic Vespers does. English is this project's own translation, marked draft.
id: most-holy-redeemer-first
groups:
  - psalms: [109]
    antiphon:
      la: "Virgam virtutis suae emittet Dominus ex Sion, et regnabit in saeculum saeculi."
      en: "The Lord shall send forth the sceptre of his power out of Sion, and he shall reign for ever and ever."
  - psalms: [110]
    antiphon:
      la: "Redemptiónem misit Dóminus populo suo: mandavit in æternum testamentum suum."
      en: "The Lord hath sent redemption to his people: he hath commanded his covenant for ever."
  - psalms: [115]
    antiphon:
      la: "Misericordia mea, et refúgium meum Dominus: susceptor meus, et liberator meus."
      en: "The Lord is my mercy, and my refuge: my protector, and my deliverer."
  - psalms: [129]
    antiphon:
      la: "In quacúmque die invocavero te, exaudies me: multiplicabis in anima mea virtutem."
      en: "In what day soever I shall call upon thee, thou wilt hear me: thou shalt multiply strength in my soul."
