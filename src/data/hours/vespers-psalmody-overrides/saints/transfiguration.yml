# Live-verified against Divinum Officium (Monastic Tridentinum 1617,
# command=prayVespera, 2026-08-06, own day). `common: proper-to-the-
# transfiguration` has no Vespers Common category (fully proper), so
# without this file the feast fell to the plain ferial default. Psalms
# 109/110/111/112.
id: transfiguration
groups:
  - psalms: [109]
    antiphon:
      la: "Assúmpsit Jesus * Petrum, et Jacóbum, et Joánnem fratrem ejus, et duxit eos in montem excélsum seórsum, et transfigurátus est ante eos."
      en: "Jesus took Peter, * and James, and John his brother, and brought them up into an high mountain apart, and was transfigured before them."
  - psalms: [110]
    antiphon:
      la: "Resplénduit * fácies ejus sicut sol, vestiménta autem ejus facta sunt alba sicut nix, allelúja."
      en: "His face did shine as the sun, * and his raiment was white as the light. Alleluia."
  - psalms: [111]
    antiphon:
      la: "Et ecce * apparuérunt eis Móyses et Elías loquéntes cum Jesu."
      en: "And, behold, there appeared unto them * Moses and Elias, talking with Jesus."
  - psalms: [112]
    antiphon:
      la: "Adhuc eo loquénte, * ecce nubes lúcida obumbrávit eos."
      en: "While he yet spake, * behold, a bright cloud overshadowed them."
