# Second Vespers antiphons of Ss. John and Paul, from the [Ant Vespera 3] that
# SanctiM/06-26.txt inherits from Sancti/06-26.txt (English from
# English/Sancti/06-26.txt). Its Lauds antiphon 4 ("Sancti spiritus", the
# canticle-only one, psalm 112) is not a Vespers antiphon. First Vespers has
# no proper [Ant Vespera], so it keeps the Common's. Confirmed against the
# local reference engine (2024-06-26: "Paulus et Joannes dixerunt Juliano"
# on the psalms; 2024-06-25: the Common of confessors).
id: ss-john-and-paul-second
groups:
  - psalms: [109]
    antiphon:
      la: "Paulus et Joánnes * dixérunt Juliáno: Nos unum Deum cólimus, qui fecit cælum et terram."
      en: "Paul and John * said unto Julian: We worship One God, Who hath made heaven and earth."
  - psalms: [110]
    antiphon:
      la: "Paulus et Joánnes * dixérunt Terentiáno: Si tuus dóminus est Juliánus, habéto pacem cum illo: nobis álius non est, nisi Dóminus Jesus Christus."
      en: "Paul and John * said unto Terentian: If thy Lord be Julian, keep thou at peace with him, but as for us, we have no other Lord but the Lord Jesus Christ."
  - psalms: [111]
    antiphon:
      la: "Joánnes et Paulus, * agnoscéntes tyránnidem Juliáni, facultátes suas paupéribus erogáre cœpérunt."
      en: "John and Paul, * when they had heard the tyrannous command of Julian, began to disperse abroad their goods among the poor."
  - psalms: [116]
    antiphon:
      la: "Joánnes et Paulus * dixérunt ad Gallicánum: Fac votum Deo cæli, et eris victor mélius quam fuísti."
      en: "John and Paul * said unto Gallican: Make thy vow unto the God of heaven, and thou shalt be yet a greater conqueror than ever thou hast been heretofore."
