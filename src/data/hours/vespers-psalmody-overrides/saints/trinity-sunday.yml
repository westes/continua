# Content read from the reference engine's live render (Monastic Tridentinum 1617, command=prayVespera):
# 2027-05-23 trinity-sunday second. Named temporal feast: the app had no Vespers psalm antiphons for it and fell
# back to the ferial/Sunday set. Paschaltide Alleluia is left to hours/paschal-alleluia.ts.
id: trinity-sunday
groups:
  - psalms: [109]
    antiphon:
      la: "Glória tibi, Trínitas * æquális, una Déitas, et ante ómnia sǽcula, et nunc et in perpétuum."
      en: "Glory be to thee, O equal Trinity * one Deity, from before all ages, so now and for evermore."
  - psalms: [110]
    antiphon:
      la: "Laus et perénnis glória * Deo Patri, et Fílio, Sancto simul Paráclito, in sæculórum sǽcula."
      en: "Praise and endless glory be * to God the Father, the Son, and the Holy Paraclete, for ever and ever."
  - psalms: [111]
    antiphon:
      la: "Glória laudis * résonet in ore ómnium, Patri, genitǽque Proli, Spirítui Sancto páriter resúltet laude perénni."
      en: "Let the glory of praise * be heard from the mouth of all to the Father, and to the begotten Son; let it equally resound with perpetual praise to the Holy Spirit."
  - psalms: [112]
    antiphon:
      la: "Ex quo ómnia, * per quem ómnia, in quo ómnia: ipsi glória in sǽcula."
      en: "From whom are all things, * through whom are all things, and in whom are all things: to him be glory for evermore."
