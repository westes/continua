# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp3-5-SpinisDNJC.txt (Duplex majus, Friday after Ash Wednesday). Vespers psalmody: the source's five antiphons reduced to the Monastic four (1, 2, 3, 5), as for the other post-1617 feasts here. English is this project's own translation, marked draft.
id: crown-of-thorns
groups:
  - psalms: [109]
    antiphon:
      la: "Diléctus meus cándidus * et rubicúndus: comæ cápitis ejus sicut púrpura regis vincta canálibus."
      en: "My beloved is white * and ruddy: the locks of his head are as the purple of a king bound in the channels."
  - psalms: [110]
    antiphon:
      la: "Requiévit super eum * spíritus timóris Dómini: coróna sapiéntiæ et exsultatiónis decorávit illum."
      en: "The spirit of the fear of the Lord * hath rested upon him: a crown of wisdom and of rejoicing hath adorned him."
  - psalms: [111]
    antiphon:
      la: "Induit eum * Dóminus vestiméntis salútis, et induménto justítiæ, quasi sponsum decorátum coróna."
      en: "The Lord hath clothed him * with the garments of salvation, and with the robe of justice, as a bridegroom decked with a crown."
  - psalms: [112]
    antiphon:
      la: "Rex ætérnæ glóriæ * pro nobis coronátus, benedícet corónæ anni benignitátis suæ."
      en: "The King of eternal glory, * crowned for us, shall bless the crown of the year of his goodness."
