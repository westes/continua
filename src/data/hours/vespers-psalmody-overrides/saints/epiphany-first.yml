# Engine render (Monastic Tridentinum 1617, command=prayVespera, 2027-01-05); Latin and English both taken from the page. First Vespers psalm antiphons.
id: epiphany-first
groups:
  - psalms: [109]
    antiphon:
      la: "Ante lucíferum génitus, * et ante sǽcula, Dóminus Salvátor noster hódie mundo appáruit."
      en: "The Lord our Saviour, * begotten before the day-star, and before the ages, is this day made manifest in the world."
  - psalms: [110]
    antiphon:
      la: "Venit lumen tuum * Jerúsalem, et glória Dómini super te orta est, et ambulábunt gentes in lúmine tuo, allelúia."
      en: "O Jerusalem, * thy light is come, and the glory of the Lord is risen upon thee, and the Gentiles shall walk in thy light. Alleluia."
  - psalms: [111]
    antiphon:
      la: "Apértis thesáuris suis * obtulérunt Magi Dómino aurum, thus, et myrrham, allelúia."
      en: "When the wise men * had opened their treasures, they presented unto the Lord gold, frankincense, and myrrh. Alleluia."
  - psalms: [112]
    antiphon:
      la: "Stella ista * sicut flamma corúscat, et Regem regum Deum demónstrat: Magi eam vidérunt, et magno Regi múnera obtulérunt."
      en: "This star shineth * as a flame of fire, and pointeth out God, the King of kings: the Wise Men beheld it, and offered gifts unto the great King."
