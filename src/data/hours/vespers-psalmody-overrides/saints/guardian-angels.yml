# Sourced from web/www/horas/Latin/Sancti/10-02.txt's own [Ant Vespera]
# block ("vide C4", "Psalmi Dominica" -- Sunday psalm numbers). This 1670/
# 1908 feast doesn't exist in the Monastic 1617 calendar at all (a live
# "Hodie" query for 2026-10-02 renders Marian Saturday instead). Her own
# distinct proper antiphons -- not St. Michael's (categories/common-of-
# an-angel.yml's own header claims Guardian Angels "reuses Michael's own
# antiphons byte-for-byte," but that doesn't hold at Vespers; the raw
# source file here is unambiguous, so this file wins over that stale
# claim, per this app's own reference-source-first sourcing principle).
id: guardian-angels
groups:
  - psalms: [109]
    antiphon:
      la: "Angelis suis * Deus mandávit de te, ut custódiant te in ómnibus viis tuis."
      en: "God hath given His Angels charge over thee, * to keep thee in all thy ways."
  - psalms: [112]
    antiphon:
      la: "Laudémus Dóminum, * quem laudant Angeli, quem Chérubim et Séraphim, sanctus, sanctus, sanctus proclámant."
      en: "Let us praise the Lord, * Whom the Angels do praise, unto Whom Cherubim and Seraphim do cry, Holy, Holy, Holy."
  - psalms: [121]
    antiphon:
      la: "Angeli eórum * semper vident fáciem Patris mei, qui est in cælis."
      en: "In heaven their Angels do always behold the face of My Father, * Which is in heaven."
  - psalms: [126]
    antiphon:
      la: "Benedíctus Deus, * qui misit Angelum suum, et éruit servos suos qui credidérunt in eum."
      en: "Blessed be God, * Who sent His Angel, and delivered His servants that trusted in Him."
