# Post-1617 feast: no Monastic render exists, so this is the Divino Afflatu 1954 engine render (2026-06-12
# sacred-heart second (Divino Afflatu 1954 engine render; Monastic reduction 1,2,3,5)), Sunday-style psalm
# numbers. Paschaltide Alleluia is left to hours/paschal-alleluia.ts.
id: sacred-heart
groups:
  - psalms: [109]
    antiphon:
      la: "Unus mílitum * láncea latus ejus apéruit et contínuo exívit sanguis et aqua."
      en: "One of the soldiers * with a spear pierced his side, and forthwith came there out Blood and Water."
  - psalms: [110]
    antiphon:
      la: "Stans Jesus * clamábat dicens: Si quis sitit, véniat ad me et bibat."
      en: "Jesus stood * and cried, saying, If any man thirst, let him come unto me and drink."
  - psalms: [111]
    antiphon:
      la: "In caritáte perpétua * diléxit nos Deus, ídeo, exaltátus a terra, attráxit nos ad Cor suum, míserans."
      en: "With an everlasting love * hath God loved us, and from the day that he was lifted up over the earth, he hath drawn us with loving-kindness unto his Heart."
  - psalms: [112]
    antiphon:
      la: "Fili, * præbe mihi cor tuum, et óculi tui custódiant vias meas."
      en: "My son, * give me thine heart, and let thine eyes observe my ways."
