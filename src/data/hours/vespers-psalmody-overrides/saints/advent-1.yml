# Engine (Monastic Tridentinum 1617, command=prayVespera, 2027-11-28). The Sunday's own Second Vespers psalm antiphons; First Vespers (Saturday evening) keeps the ferial Saturday psalmody (hours/vespers.ts).
id: advent-1
groups:
  - psalms: [109]
    antiphon:
      la: "In illa die * stillábunt montes dulcédinem, et colles fluent lac et mel, allelúia."
      en: "In that day * the mountains shall drop down sweet wine, and the hills shall flow with milk and honey. Alleluia."
  - psalms: [110]
    antiphon:
      la: "Jucundáre, * fília Sion, et exsúlta satis, fília Jerúsalem, allelúia."
      en: "Sing, O daughter of Zion, * and rejoice with all the heart, O daughter of Jerusalem. Alleluia."
  - psalms: [111]
    antiphon:
      la: "Ecce Dóminus véniet, * et omnes Sancti ejus cum eo: et erit in die illa lux magna, allelúia."
      en: "Behold, the Lord shall come, * and all His saints with Him; and it shall come to pass in that day that the light shall be great. Alleluia."
  - psalms: [112]
    antiphon:
      la: "Ecce véniet * Prophéta magnus, et ipse renovábit Jerúsalem, allelúia."
      en: "Behold, a great Prophet * shall arise, and He shall build up a new Jerusalem. Alleluia."
