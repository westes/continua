# Sourced from web/www/horas/Latin/Sancti/10-24.txt's own [Ant Vespera]
# block ("ex Sancti/05-08", "Psalmi Dominica" -- Sunday psalm numbers,
# same shape as st-michael.yml's own finding). This 1921 feast doesn't
# exist in the Monastic 1617 calendar at all (a live "Hodie" query for
# 2026-10-24 renders a plain 22nd Sunday after Pentecost instead). His
# own distinct proper (Tobias-narrative) antiphons.
id: st-raphael-archangel
groups:
  - psalms: [109]
    antiphon:
      la: "Missus est * Angelus Ráphaël ad Tobíam et Saram, ut curáret eos."
      en: "The Angel Raphael was sent * unto Tobias and Sara to heal them."
  - psalms: [110]
    antiphon:
      la: "Ingréssus Angelus * ad Tobíam, salutávit eum, et dixit: Gáudium sit tibi semper."
      en: "The Angel went in * unto Tobias, and said: Joy be ever with thee."
  - psalms: [111]
    antiphon:
      la: "Forti ánimo * esto, Tobía: in próximo enim est ut a Deo curéris."
      en: "Be of good courage, Tobias, * for it is nigh at hand that God shall heal thee."
  - psalms: [112]
    antiphon:
      la: "Benedícite Deum cæli, * et coram ómnibus vivéntibus confitémini illi, quia fecit vobíscum misericórdiam suam."
      en: "Bless ye the God of Heaven, * and confess Him before all living, for He hath had mercy upon you."
