# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-31-BMVMediatrix.txt (Duplex majus, nine lessons, `ex C11`). Vespers psalmody: the source's five antiphons reduced to the Monastic four: antiphons 1, 2, 3 under their own psalms, antiphon 5 under the fourth antiphon's psalm (126), as the engine's Monastic Vespers does. English is this project's own translation, marked draft.
id: mediatrix-of-all-graces-first
groups:
  - psalms: [109]
    antiphon:
      la: "Benedictionem * ómnium géntium dedit illi Dóminus, et testaméntum suum confirmávit super caput ejus."
      en: "The Lord gave her the blessing of all nations, * and confirmed his covenant upon her head."
  - psalms: [112]
    antiphon:
      la: "In ætérnum * misericórdia ejus, et usque in generatiónem et generatiónem."
      en: "Her mercy * is for ever, and unto generation and generation."
  - psalms: [121]
    antiphon:
      la: "Benedícam te * in vita mea, et in nómine tuo levábo manus meas."
      en: "I will bless thee * as long as I live, and in thy name I will lift up my hands."
  - psalms: [126]
    antiphon:
      la: "Recordáre, * Virgo Mater Dei, dum stéteris in conspéctu Dómini, ut loquáris pro nobis bona."
      en: "Remember, * O Virgin Mother of God, when thou shalt stand in the sight of the Lord, to speak good things for us."
