# Content read from the reference engine's live render (Monastic Tridentinum 1617, command=prayVespera,
# 2026-01-21, "Vespera de præcedenti"): St. Agnes Second Vespers psalm antiphons -- the source's explicit
# SanctiM/01-21.txt [Ant Vespera 3] set (lines 1, 2, 3 and 5 of her Lauds antiphons at Ps 109/111/112/126). The
# other evening's set is st-agnes.yml (the default; her First Vespers psalm antiphons cannot be read from the
# engine, whose Jan 20 evening is "a capitulo de sequenti" -- Ss. Fabian and Sebastian's psalms). See
# vespers-psalmody-overrides.ts's getVespersSaintOverride.
id: st-agnes-second
groups:
  - psalms: [109]
    antiphon:
      la: "Ingréssa Agnes * turpitúdinis locum, Angelum Dómini præparátum invénit."
      en: "Agnes entered * the place of shame, and found the Angel of the Lord ready."
  - psalms: [111]
    antiphon:
      la: "Mecum enim hábeo * custódem córporis mei, Angelum Dómini."
      en: "For I have with me * an Angel of the Lord to keep my body."
  - psalms: [112]
    antiphon:
      la: "Anulo suo * subarrhávit me Dóminus meus Jesus Christus, et tamquam sponsam decorávit me coróna."
      en: "My Lord Jesus Christ hath espoused me with His ring, * and hath set on my head a crown as the crown of a bride."
  - psalms: [126]
    antiphon:
      la: "Congaudéte mecum * et congratulámini, quia cum his ómnibus lúcidas sedes accépi."
      en: "Rejoice with me * and make merry, because I also have received a throne in light among all these."
