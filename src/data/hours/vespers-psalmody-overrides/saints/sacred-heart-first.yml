# Post-1617 feast: no Monastic render exists, so this is the Divino Afflatu 1954 engine render (2026-06-11
# sacred-heart first (Divino Afflatu 1954 engine render; Monastic reduction 1,2,3,5)), Sunday-style psalm
# numbers. Paschaltide Alleluia is left to hours/paschal-alleluia.ts.
id: sacred-heart-first
groups:
  - psalms: [109]
    antiphon:
      la: "Suávi jugo tuo * domináre, Dómine, in médio inimicórum tuórum."
      en: "Put thy easy yoke * upon all mankind, O Lord, and be thou ruler, even in the midst of thine enemies."
  - psalms: [110]
    antiphon:
      la: "Miséricors * et miserátor Dóminus: escam dedit timéntibus se."
      en: "This merciful * and gracious Lord hath given Meat unto them that fear him.."
  - psalms: [111]
    antiphon:
      la: "Exórtum est * in ténebris lumen rectis; miséricors et miserátor Dóminus."
      en: "Unto the godly * there ariseth up light in the darkness, even the Lord merciful and gracious."
  - psalms: [112]
    antiphon:
      la: "Apud Dóminum * propitiátio est et copiósa apud eum redémptio."
      en: "With the Lord * there is mercy, and with him is plenteous redemption."
