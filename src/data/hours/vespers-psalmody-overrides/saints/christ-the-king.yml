# Post-1617 feast: no Monastic render exists, so this is the Divino Afflatu 1954 engine render (2026-10-25
# christ-the-king second (Divino Afflatu 1954 engine render; Monastic reduction 1,2,3,5)), Sunday-style psalm
# numbers. Paschaltide Alleluia is left to hours/paschal-alleluia.ts.
id: christ-the-king
groups:
  - psalms: [109]
    antiphon:
      la: "Pacíficus * vocábitur, et thronus ejus erit firmíssimus in perpétuum."
      en: "He shall be called * Peaceable, and his throne shall be most firm for ever."
  - psalms: [110]
    antiphon:
      la: "Regnum ejus * regnum sempitérnum est, et omnes reges sérvient ei et obédient."
      en: "His kingdom * is an everlasting kingdom, and all kings shall serve him, and shall obey him."
  - psalms: [111]
    antiphon:
      la: "Ecce Vir Oriens * nomen ejus: sedébit et dominábitur, et loquétur pacem géntibus."
      en: "Behold a man, the Orient * is his name: he shall sit and rule, and shall speak peace to the Gentiles."
  - psalms: [112]
    antiphon:
      la: "Ecce dedi te * in lucem géntium, ut sis salus mea usque ad extrémum terræ."
      en: "Behold, I have given thee * to be the light of the Gentiles, that thou mayst be my salvation even to the farthest part of the earth."
