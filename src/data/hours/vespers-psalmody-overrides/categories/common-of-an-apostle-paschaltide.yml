# Common-of-an-Apostle(s)'s own Paschaltide-variant Vespers psalmody --
# wholesale different text (doubled/tripled allelúia, not just a single
# mechanical suffix), live-verified against Divinum Officium (Monastic
# Tridentinum 1617, command=prayVespera) via St. Mark's own day
# (2026-04-25, which falls inside Paschaltide), since he has no proper
# Vespers antiphons of his own and so renders this Common's text
# directly. Registers the same aliases as common-of-an-apostle.yml itself
# (common-of-apostles, common-of-an-evangelist) -- one scheme, not three.
# Same psalm numbers as the non-Paschaltide default (109/112/115/138).
id: common-of-an-apostle-paschaltide
aliases: [common-of-apostles-paschaltide, common-of-an-evangelist-paschaltide]
groups:
  - psalms: [109]
    antiphon:
      la: "Sancti tui, * Dómine, florébunt sicut lílium, allelúia: et sicut odor bálsami erunt ante te, allelúia."
      en: "Your saints, O Lord, * flourish like lilies, alleluia: and like the smell of balsam are before you, alleluia."
  - psalms: [112]
    antiphon:
      la: "In cæléstibus regnis * Sanctórum habitátio est, allelúia: et in ætérnum réquies eórum, allelúia."
      en: "In the heavenly kingdom is the habitation of the saints, * alleluia: and they rest in eternity, alleluia."
  - psalms: [115]
    antiphon:
      la: "In velaménto * clamábant Sancti tui, Dómine, allelúia, allelúia, allelúia."
      en: "Protected by a veil * your saints cried unto thee, O Lord, alleluia, alleluia, alleluia."
  - psalms: [138]
    antiphon:
      la: "Fulgébunt justi * sicut sol in conspéctu Dei, allelúia."
      en: "The just shall shine * like the sun in the sight of God, alleluia."
