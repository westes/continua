# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-31-BMVMediatrix.txt (Duplex majus, nine lessons, `ex C11`). Matins psalmody: nine antiphons with the psalms the source assigns, three nocturns of three. English is this project's own translation, marked draft.
id: mediatrix-of-all-graces
nocturn1:
  groups:
    - psalms: [8]
      antiphon:
        la: "Fons hortórum, * púteus aquárum vivéntium, quæ fluunt ímpetu de Líbano."
        en: "The fountain of gardens, * the well of living waters, which run with a strong stream from Libanus."
    - psalms: [18]
      antiphon:
        la: "Manus meæ * stillavérunt myrrham, et dígiti mei pleni myrrha probatíssima."
        en: "My hands * have dropped with myrrh, and my fingers are full of the choicest myrrh."
    - psalms: [23]
      antiphon:
        la: "Vadam ad montem * myrrhæ, et ad collem thuris."
        en: "I will go * to the mountain of myrrh, and to the hill of frankincense."
  versicle:
    v:
      la: "Sub tuum præsídium omnes confúgimus."
      en: "Under thy protection we all take refuge."
    r:
      la: "Sancta Dei Génetrix."
      en: "O holy Mother of God."
nocturn2:
  groups:
    - psalms: [44]
      antiphon:
        la: "Hábuit grátiam * et misericórdiam coram Rege super omnes mulíeres."
        en: "She found grace * and mercy before the king above all women."
    - psalms: [45]
      antiphon:
        la: "Pete, Mater mea; * neque enim fas est ut avértam fáciem tuam."
        en: "Ask, my mother; * for it is not right that I should turn away thy face."
    - psalms: [86]
      antiphon:
        la: "Tu invoca Dóminum, * et lóquere Regi pro nobis, libera nos de morte."
        en: "Do thou call upon the Lord, * and speak to the King for us, and deliver us from death."
  versicle:
    v:
      la: "Nostras deprecatiónes ne despícias."
      en: "Despise not our petitions."
    r:
      la: "In necessitátibus nostris."
      en: "In our necessities."
nocturn3:
  groups:
    - psalms: [95]
      antiphon:
        la: "Si invéni grátiam * in óculis tuis, o Rex, dona mihi pópulum meum, pro quo óbsecro."
        en: "If I have found favour * in thy eyes, O king, give me my people, for whom I beseech thee."
    - psalms: [96]
      antiphon:
        la: "Benedícta es tu * præ ómnibus muliéribus super terram, quia subvenísti ruínæ ante conspéctum Dei nostri."
        en: "Blessed art thou * above all women upon the earth, because thou hast succoured our ruin before the sight of our God."
    - psalms: [97]
      antiphon:
        la: "Domináre nostri * tu, et Fílius tuus: quia liberásti nos de manu inimicórum nostrórum."
        en: "Rule thou over us, * thou and thy Son: for thou hast delivered us from the hand of our enemies."
  versicle:
    v:
      la: "A perículis cunctis líbera nos semper."
      en: "From all dangers deliver us ever."
    r:
      la: "Virgo gloriósa et benedícta."
      en: "O glorious and blessed Virgin."
