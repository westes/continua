# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp2-2-PassionisDNJC.txt (Duplex majus, Tuesday after Sexagesima; its own Oratio and Lectio4-9, the rest "ex Commune/Votiva/V6", the votive office of the Passion). Matins psalmody: nine antiphons with the psalms the source assigns. English is this project's own translation, marked draft.
id: commemoration-of-the-passion
nocturn1:
  groups:
    - psalms: [2]
      antiphon:
        la: "Astitérunt reges terræ, * et príncipes convenérunt in unum, advérsus Dóminum, et advérsus Christum ejus."
        en: "The kings of the earth set themselves, * and the rulers take counsel together, against the Lord, and against his Anointed."
    - psalms: [3]
      antiphon:
        la: "Multiplicáti sunt qui tríbulant me; multi insúrgunt advérsum me."
        en: "They are multiplied that trouble me; many rise up against me."
    - psalms: [26]
      antiphon:
        la: "Insurrexérunt in me * testes iníqui, et mentíta est iníquitas sibi."
        en: "False witnesses are risen up against me, * and iniquity hath belied itself."
  versicle:
    v:
      la: "Oblátus est quia ipse vóluit."
      en: "He was offered because it was his own will."
    r:
      la: "Et livóre ejus sanáti sumus."
      en: "And by his bruises we are healed."
nocturn2:
  groups:
    - psalms: [40]
      antiphon:
        la: "Inimíci mei dixérunt mala mihi: Quando moriétur, et períbit nomen ejus?"
        en: "Mine enemies have spoken evil of me: When shall he die, and his name perish?"
    - psalms: [39]
      antiphon:
        la: "Confundántur * et revereántur, qui quærunt ánimam meam, ut áuferant eam."
        en: "Let them be ashamed and confounded * together that seek after my soul, to destroy it."
    - psalms: [55]
      antiphon:
        la: "Conculcavérunt me inimíci mei tota die; advérsum me omnes cogitatiónes eórum in malum."
        en: "Mine enemies have trodden me down all the day; all their thoughts are against me for evil."
  versicle:
    v:
      la: "Próprio Fílio suo non pepércit Deus."
      en: "God spared not his own Son."
    r:
      la: "Sed pro nobis ómnibus trádidit illum."
      en: "But delivered him up for us all."
nocturn3:
  groups:
    - psalms: [56]
      antiphon:
        la: "Fílii hóminum dentes eórum arma et sagíttæ, et lingua eórum gládius acútus."
        en: "The sons of men, whose teeth are weapons and arrows, and their tongue a sharp sword."
    - psalms: [63]
      antiphon:
        la: "Intendérunt arcum rem amáram, ut sagíttent in occúltis immaculátum."
        en: "They have bent their bow, a bitter thing, to shoot in secret the unspotted."
    - psalms: [87]
      antiphon:
        la: "Factus sum * sicut homo sine adjutório, inter mórtuos liber."
        en: "I am as a man that hath no strength, * lying nerveless among the dead."
  versicle:
    v:
      la: "Factus est obédiens usque ad mortem."
      en: "He became obedient unto death."
    r:
      la: "Mortem autem crucis."
      en: "Even to the death of the cross."
