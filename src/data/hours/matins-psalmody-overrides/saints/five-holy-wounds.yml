# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad3-5-QuinqueVulneraDNJC.txt (Duplex majus, Friday of the third week of Lent). Matins psalmody: nine antiphons with the psalms the source assigns. English is this project's own translation, marked draft.
id: five-holy-wounds
nocturn1:
  groups:
    - psalms: [10]
      antiphon:
        la: "Quis est * qui venit de Edom, tinctis véstibus de Bosra?"
        en: "Who is this * that cometh from Edom, with dyed garments from Bosra?"
    - psalms: [14]
      antiphon:
        la: "Quare ergo * rubrum est induméntum tuum, et vestiménta tua sicut calcántium in torculári?"
        en: "Why then * is thy apparel red, and thy garments like theirs that tread in the winepress?"
    - psalms: [23]
      antiphon:
        la: "Tórcular * calcávi solus, et de géntibus non est vir mecum"
        en: "I have trodden * the winepress alone, and of the Gentiles there is not a man with me."
  versicle:
    v:
      la: "Fodérunt manus meas et pedes meos."
      en: "They have dug my hands and feet."
    r:
      la: "Dinumeravérunt omnia ossa mea."
      en: "They have numbered all my bones."
nocturn2:
  groups:
    - psalms: [21]
      antiphon:
        la: "Fodérunt * manus meas et pedes meos; dinumeravérunt ómnia ossa mea."
        en: "They have dug * my hands and feet; they have numbered all my bones."
    - psalms: [65]
      antiphon:
        la: "A planta pedis * usque ad vérticem non est in eo sánitas."
        en: "From the sole of the foot * unto the top of the head there is no soundness therein."
    - psalms: [75]
      antiphon:
        la: "Vulnus, * et livor, et plaga tumens non est circumligáta, nec curáta medicámine, neque fota óleo."
        en: "Wound, * and bruise, and swelling sore, is not bound up, nor dressed with medicine, nor fomented with oil."
  versicle:
    v:
      la: "Vere languóres nostros ipse tulit."
      en: "Surely he hath borne our infirmities."
    r:
      la: "Et dolóres nostros ipse portávit."
      en: "And carried our sorrows."
nocturn3:
  groups:
    - psalms: [95]
      antiphon:
        la: "Quid sunt plagæ istæ in médio mánuum tuárum?"
        en: "What are these wounds in the midst of thy hands?"
    - psalms: [96]
      antiphon:
        la: "His plagátus sum in domo eórum qui diligébant me."
        en: "With these I was wounded in the house of them that loved me."
    - psalms: [97]
      antiphon:
        la: "In amaritúdine sermo meus est, et manus plagæ meæ aggraváta est super gémitum meum."
        en: "My speech is in bitterness, and the hand of my scourge is heavier than my groaning."
  versicle:
    v:
      la: "Ipse vulnerátus est propter iniquitátes nostras."
      en: "He was wounded for our iniquities."
    r:
      la: "Attrítus est propter scélera nostra."
      en: "He was bruised for our sins."
