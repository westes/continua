# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp1-2-OratioDNJC.txt (Duplex majus, Tuesday after Septuagesima). Matins psalmody: nine antiphons with the psalms the source assigns. English is this project's own translation, marked draft.
id: prayer-on-the-mount-of-olives
nocturn1:
  groups:
    - psalms: [16]
      antiphon:
        la: "Ante oratiónem præpara ánimam tuam, et noli esse quasi homo qui tentat Deum."
        en: "Before prayer prepare thy soul, and be not as a man that tempteth God."
    - psalms: [27]
      antiphon:
        la: "Non impediaris oráre semper, et ne verearis usque ad mortem justificari."
        en: "Be not hindered from praying always, and be not afraid to be justified even to death."
    - psalms: [141]
      antiphon:
        la: "Ómnia quæcúmque petieritis in oratióne credéntes, accipietis."
        en: "All things whatsoever you shall ask in prayer, believing, you shall receive."
  versicle:
    v:
      la: "Tristis est ánima mea."
      en: "My soul is sorrowful."
    r:
      la: "Usque ad mortem."
      en: "Even unto death."
nocturn2:
  groups:
    - psalms: [42]
      antiphon:
        la: "Cum oratis, non éritis sicut hypocritæ, qui amant in synagogis et in angulis plateárum stantes oráre, ut videántur ab homínibus."
        en: "When you pray, you shall not be as the hypocrites, that love to stand and pray in the synagogues and corners of the streets, that they may be seen by men."
    - psalms: [63]
      antiphon:
        la: "Tu autem cum oraveris, intra in cubiculum tuum, et clauso ostio, ora Patrem tuum in abscóndito."
        en: "But thou, when thou shalt pray, enter into thy chamber, and having shut the door, pray to thy Father in secret."
    - psalms: [120]
      antiphon:
        la: "Factum est autem in illis diébus, exiit Jesus in montem oráre, et erat pernoctans in oratióne Dei."
        en: "And it came to pass in those days, that he went out into a mountain to pray, and he passed the whole night in the prayer of God."
  versicle:
    v:
      la: "Pater mi, si possíbile est."
      en: "My Father, if it be possible."
    r:
      la: "Tránseat a me calix iste."
      en: "Let this chalice pass from me."
nocturn3:
  groups:
    - psalms: [3]
      antiphon:
        la: "Tribulátio et angústia invenérunt me, mandáta tua meditátio mea est."
        en: "Trouble and anguish have found me; thy commandments are my meditation."
    - psalms: [12]
      antiphon:
        la: "Sustínui qui simul contristarétur, et non fuit: et qui consolarétur, et non invéni."
        en: "I looked for one that would grieve together with me, and there was none; and for one that would comfort me, and I found none."
    - psalms: [87]
      antiphon:
        la: "Adhǽsit paviménto ánima mea, vivífica me secúndum verbum tuum."
        en: "My soul hath cleaved to the pavement: quicken thou me according to thy word."
  versicle:
    v:
      la: "Vigiláte et oráte."
      en: "Watch and pray."
    r:
      la: "Ut non intrétis in tentatiónem."
      en: "That ye enter not into temptation."
