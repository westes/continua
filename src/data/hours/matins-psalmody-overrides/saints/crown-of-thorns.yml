# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp3-5-SpinisDNJC.txt (Duplex majus, Friday after Ash Wednesday). Matins psalmody: nine antiphons with the psalms the source assigns. English is this project's own translation, marked draft.
id: crown-of-thorns
nocturn1:
  groups:
    - psalms: [1]
      antiphon:
        la: "Erit tamquam lignum, quod plantátum est secus decúrsus aquárum, et fructum suum dabit in témpore suo."
        en: "He shall be like a tree which is planted near the running waters, which shall bring forth its fruit in due season."
    - psalms: [2]
      antiphon:
        la: "Convenérunt in unum advérsus Dóminum, et advérsus Christum ejus."
        en: "They met together against the Lord, and against his Christ."
    - psalms: [4]
      antiphon:
        la: "In tribulatióne dilatásti mihi."
        en: "In tribulation thou hast enlarged me."
  versicle:
    v:
      la: "Glória et honóre coronásti eum Dómine."
      en: "Thou hast crowned him, O Lord, with glory and honour."
    r:
      la: "Et constituísti eum super ópera mánuum tuárum."
      en: "And hast set him over the works of thy hands."
nocturn2:
  groups:
    - psalms: [5]
      antiphon:
        la: "Dómine, ut scuto bonæ voluntátis tuæ coronásti eum."
        en: "O Lord, thou hast crowned him as with a shield of thy good will."
    - psalms: [8]
      antiphon:
        la: "Minuísti eum paulo minus ab Ángelis, glória et honóre coronásti eum."
        en: "Thou hast made him a little less than the angels, thou hast crowned him with glory and honour."
    - psalms: [10]
      antiphon:
        la: "Peccatóres intendérunt arcum: paravérunt sagíttas suas in pháretra, ut sagíttent justum."
        en: "The sinners have bent their bow, they have prepared their arrows in the quiver, to shoot the just."
  versicle:
    v:
      la: "Posuísti Dómine super caput ejus."
      en: "Thou hast set, O Lord, upon his head."
    r:
      la: "Corónam de lápide pretióso."
      en: "A crown of precious stone."
nocturn3:
  groups:
    - psalms: [14]
      antiphon:
        la: "Ingréssus sine mácula, et operátus justítiam, coronátus est in monte sancto tuo."
        en: "He that walketh without blemish, and worketh justice, hath been crowned on thy holy mountain."
    - psalms: [20]
      antiphon:
        la: "Super caput ejus corónam de lápide pretióso posuísti Dómine."
        en: "Thou hast set on his head, O Lord, a crown of precious stones."
    - psalms: [22]
      antiphon:
        la: "Advérsus eos, qui tríbulant me, impinguásti in óleo caput meum."
        en: "Against them that trouble me, thou hast made my head fat with oil."
  versicle:
    v:
      la: "Coróna áurea super caput ejus."
      en: "A crown of gold upon his head."
    r:
      la: "Expréssa signo sanctitátis."
      en: "Expressed with the sign of holiness."
