# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/12-10-Domus.txt (Duplex majus, nine lessons, `ex C11`; the parts it marks `@Commune/C8` are read from Commune/C8.txt, the Common of a Dedication). Matins psalmody: nine antiphons with the psalms the source assigns, three nocturns of three. English is this project's own translation, marked draft.
id: translation-of-the-holy-house
nocturn1:
  groups:
    - psalms: [8]
      antiphon:
        la: "Eleváta est magnificéntia tua super cœlos."
        en: "Thy magnificence is elevated above the heavens."
    - psalms: [18]
      antiphon:
        la: "In sole pósuit tabernáculum suum, et ipse tamquam sponsus procédens de thálamo suo."
        en: "He hath set his tabernacle in the sun, and he, as a bridegroom coming out of his bride-chamber."
    - psalms: [23]
      antiphon:
        la: "Quis ascendat in montem Dómini? aut quis stabit in loco sancto ejus? Ínnocens mánibus, et mundo corde."
        en: "Who shall ascend into the mountain of the Lord? or who shall stand in his holy place? The innocent in hands and clean of heart."
  versicle:
    v:
      la: "Hic domus Dei est, et porta cœli."
      en: "This is the house of God, and the gate of heaven."
    r:
      la: "Et vocábitur aula Dei."
      en: "And it shall be called the court of God."
nocturn2:
  groups:
    - psalms: [44]
      antiphon:
        la: "Diffúsa est grátia in lábiis tuis, proptérea benedíxit te Deus in ætérnum, et in sǽculum sǽculi."
        en: "Grace is poured abroad in thy lips; therefore hath God blessed thee for ever, and for ever and ever."
    - psalms: [45]
      antiphon:
        la: "Sanctificávit tabernáculum suum Altíssimus."
        en: "The Most High hath sanctified his tabernacle."
    - psalms: [86]
      antiphon:
        la: "Homo natus est in ea, et ipse fundávit eam Altíssimus."
        en: "A man is born in her, and the Most High himself hath founded her."
  versicle:
    v:
      la: "Dómine, diléxi decórem domus tuæ,"
      en: "Lord, I have loved the beauty of thy house."
    r:
      la: "Et locum habitatiónis glóriæ tuæ."
      en: "And the place where thy glory dwelleth."
nocturn3:
  groups:
    - psalms: [95]
      antiphon:
        la: "Tóllite hóstias, et introíte in átria ejus: * adoráte Dóminum in átrio sancto ejus."
        en: "Bring up sacrifices, and come into his courts: * adore ye the Lord in his holy court."
    - psalms: [96]
      antiphon:
        la: "Vidérunt omnes pópuli glóriam ejus."
        en: "All people have seen his glory."
    - psalms: [97]
      antiphon:
        la: "Cantáte Dómino cánticum novum, quia mirabília fecit Dóminus, allelúja."
        en: "Sing ye to the Lord a new canticle, for the Lord hath done wonderful things, alleluia."
  versicle:
    v:
      la: "Domum tuam, Dómine, decet sanctitúdo."
      en: "Holiness becometh thy house, O Lord."
    r:
      la: "In longitúdinem diérum."
      en: "For length of days."
