# Transcribed from the reference engine's own source files (Latin:
# web/www/horas/Latin/Sancti/10-02.txt + SanctiM/10-02.txt, English:
# web/www/horas/English/Sancti/10-02.txt), Monastic Tridentinum 1617
# rubric. Companion file to ../apparition-of-st-michael.yml — see that
# file's own header for the "Common-of-an-Angel doesn't exist" context.
#
# The secular [Ant Matutinum] supplies 9 distinct proper antiphons.
# Versum blocks fall back to Apparition of St. Michael (Sancti/05-08)
# without Paschaltide alleluias, since Oct 2 is never in Paschaltide.
#
# Monastic structure (SanctiM/10-02.txt): 12 lectiones → 6+6+3
# (N1 = Ps 8,10,14,18,23,33; N2 = Ps 89,95,96,97,98,102; N3 = canticles
# Isa 33:2-10, Isa 33:13-18, Sir 36:14-19). N2 is composed from secular
# line 7 (s/95/89/) + [AntMatutinumM]:1 (Ps 95) + line 8 + [AntMatutinumM]:2-3
# (Ps 97, 98) + line 9 — same N2 psalm pool as st-michael.yml.
id: guardian-angels
nocturn1:
  groups:
    - psalms: [8]
      antiphon:
        la: "Dóminus, Deus * cæli et terræ, ipse mittet Angelum suum coram te."
        en: "The Lord God of heaven and earth shall send His Angel before thee."
    - psalms: [10]
      antiphon:
        la: "Deus meus * misit Angelum suum et conclúsit ora leónum, et non nocuérunt mihi."
        en: "My God hath sent His Angel, and hath shut the lions' mouths, that they have not hurt me."
    - psalms: [14]
      antiphon:
        la: "Bene ambulétis, * et Dóminus sit in itínere vestro, et Angelus ejus comitétur vobíscum."
        en: "Go prosperously, and the Lord be with you in your journey, and His Angel keep you company."
    - psalms: [18]
      antiphon:
        la: "Cum essem vobíscum, * per voluntátem Dei eram: ipsum benedícite et cantáte ei."
        en: "When I came unto you, by the will of God I came; bless Him, and give Him thanks."
    - psalms: [23]
      antiphon:
        la: "Tollens se Angelus Dómini, * qui præcedébat castra Israël, ábiit post eos."
        en: "The Angel of the Lord, which went before the camp of Israel, removed, and went behind them."
    - psalms: [33]
      antiphon:
        la: "Immíttet Angelus Dómini * in circúitu timéntium eum, et erípiet eos."
        en: "The Angel of the Lord encampeth round about them that fear Him, and delivereth them."
  versicle:
    v:
      la: "Stetit Angelus juxta aram templi."
      en: "An Angel stood at the Altar of the Temple."
    r:
      la: "Habens thuríbulum áureum in manu sua."
      en: "Having a golden censer in his hand."
nocturn2:
  groups:
    - psalms: [89]
      antiphon:
        la: "Misit Dóminus * Angelum suum, qui percússit omnem virum robústum et bellatórem, et príncipem exércitus regis Assyriórum."
        en: "The Lord sent His Angel, which cut off all the mighty of valour, and the leaders and captains in the camp of the King of Assyria."
    - psalms: [95]
      antiphon:
        la: "Stetit Angelus * juxta aram templi, habens thuríbulum áureum in manu sua."
        en: "An Angel stood at the Altar of the Temple, having a golden censer in his hand."
    - psalms: [96]
      antiphon:
        la: "Adoráte Dóminum * omnes Angeli ejus: audívit, et lætáta est Sion."
        en: "Worship the Lord, all ye His Angels! Zion heard, and was glad."
    - psalms: [97]
      antiphon:
        la: "Mitte, Dómine, * Angelum bonum ante nos in timóre bráchii tui, ut métuant qui odérunt nos."
        en: "Send, O Lord, thy good Angel before us, in the fear of thine arm, that they who hate us may fear."
    - psalms: [98]
      antiphon:
        la: "Angelus meus * vobíscum est, dicit Dóminus: ipse autem exquíret ánimas vestras."
        en: "My Angel is with you, saith the Lord; but he shall also require your souls."
    - psalms: [102]
      antiphon:
        la: "Benedícite Dómino, * omnes Angeli ejus, poténtes virtúte, faciéntes verbum illíus, ad audiéndam vocem sermónum ejus."
        en: "Bless the Lord, all ye His Angels, that excel in strength, that do His commandments, to hearken unto the voice of His word."
  versicle:
    v:
      la: "Ascéndit fumus arómatum in conspéctu Dómini."
      en: "The smoke of the incense ascended up before the Lord."
    r:
      la: "De manu Angeli."
      en: "Out of the Angel's hand."
nocturn3:
  antiphon:
    la: "Ecce ego * mitto Angelum meum, qui præparábit viam meam ante fáciem tuam."
    en: "Behold, I send my Angel before thee, who shall prepare my way before thy face."
  canticles:
    - refs:
        - { book: isa, chapter: 33, verses: "2-10" }
    - refs:
        - { book: isa, chapter: 33, verses: "13-18" }
    - refs:
        - { book: sir, chapter: 36, verses: "14-19" }
  versicle:
    v:
      la: "In conspéctu Angelórum psallam tibi, Deus meus."
      en: "Before the Angels will I sing praise unto thee, O my God."
    r:
      la: "Adorábo ad templum sanctum tuum, et confitébor nómini tuo."
      en: "I will worship toward thy holy Temple, and praise thy Name."
