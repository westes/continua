# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/10-23-Redemptor.txt ("Ss. Redemptoris", Duplex majus, nine lessons; no Common: every part is its own or named by an `@` include, read from the file it names). Matins psalmody: nine antiphons with the psalms the source assigns, three nocturns of three. English is this project's own translation, marked draft.
id: most-holy-redeemer
nocturn1:
  groups:
    - psalms: [3]
      antiphon:
        la: "Voce mea ad Dóminum clamávi, et exaudívit me de monte sancto suo."
        en: "With my voice I have cried to the Lord, and he hath heard me from his holy hill."
    - psalms: [8]
      antiphon:
        la: "Dómine Dóminus noster, quam admirábile  est nomen tuum in univérsa terra!"
        en: "O Lord our Lord, how admirable is thy name in the whole earth!"
    - psalms: [10]
      antiphon:
        la: "Dóminus in templo sancto suo: Dóminus in cœlo sedes ejus."
        en: "The Lord is in his holy temple: the Lord's throne is in heaven."
  versicle:
    v:
      la: "Rédime me Dómine et miserére mei."
      en: "Redeem me, O Lord, and have mercy on me."
    r:
      la: "In ecclésiis benedícam te Dómine."
      en: "In the churches I will bless thee, O Lord."
nocturn2:
  groups:
    - psalms: [19]
      antiphon:
        la: "Suscépimus Deus misericórdiam tuam in médio templi tui."
        en: "We have received thy mercy, O God, in the midst of thy temple."
    - psalms: [23]
      antiphon:
        la: "Tu es ipse Rex meus, qui mandas salútes in Jacob."
        en: "Thou thyself art my king, who commandest the saving of Jacob."
    - psalms: [45]
      antiphon:
        la: "Ímmola Deo sacrifícium laudis, et redde Altíssimo vota tua."
        en: "Offer to God the sacrifice of praise, and pay thy vows to the Most High."
  versicle:
    v:
      la: "Meménto nostri Dómine in beneplácito pópuli tui."
      en: "Remember us, O Lord, in the favour of thy people."
    r:
      la: "Vísita nos in salutári tuo."
      en: "Visit us with thy salvation."
nocturn3:
  groups:
    - psalms: [60]
      antiphon:
        la: "Ego autem ad Deum clamávi, et Dóminus salvávit me."
        en: "But I have cried to God, and the Lord will save me."
    - psalms: [74]
      antiphon:
        la: "Deus meus, Salvátor meus, salutáre meum, et spes mea in ætérnum."
        en: "God is my God, my Saviour, my salvation, and my hope for ever."
    - psalms: [83]
      antiphon:
        la: "Protéctor noster áspice Deus, et réspice in fáciem Christi tui."
        en: "Behold, O God our protector, and look on the face of thy Christ."
  versicle:
    v:
      la: "Notam fecísti in Géntibus virtútem tuam."
      en: "Thou hast made known thy power among the nations."
    r:
      la: "Redemísti in bráchio tuo pópulum tuum."
      en: "Thou hast redeemed thy people with thine arm."
