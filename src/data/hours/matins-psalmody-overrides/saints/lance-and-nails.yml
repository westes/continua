# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt (Duplex majus, Friday of the first week of Lent). Matins psalmody: nine antiphons with the psalms the source assigns. English is this project's own translation, marked draft.
id: lance-and-nails
nocturn1:
  groups:
    - psalms: [1]
      antiphon:
        la: "Ad Jesum autem cum veníssent, non fregérunt ejus crura, sed unus mílitum láncea latus ejus apéruit."
        en: "But when they came to Jesus, they did not break his legs, but one of the soldiers opened his side with a lance."
    - psalms: [2]
      antiphon:
        la: "Exívit sanguis et aqua; et qui vidit, testimónium perhíbuit, et verum est testimónium ejus."
        en: "Blood and water came out; and he that saw it hath given testimony, and his testimony is true."
    - psalms: [3]
      antiphon:
        la: "Ália Scriptúra dicit: Vidébunt in quem transfixérunt."
        en: "Another scripture saith: They shall look on him whom they pierced."
  versicle:
    v:
      la: "Quem tu percussísti, persecúti sunt."
      en: "Whom thou hast smitten, they have persecuted."
    r:
      la: "Et super dolórem vúlnerum meórum addidérunt."
      en: "And they have added to the grief of my wounds."
nocturn2:
  groups:
    - psalms: [4]
      antiphon:
        la: "Aspicient ad me, quem confixérunt; et plangent eum planctu quasi super unigenitum."
        en: "They shall look upon me whom they have pierced; and they shall mourn for him as one mourneth for an only son."
    - psalms: [5]
      antiphon:
        la: "Quid sunt plagæ istæ in médio mánuum tuárum?"
        en: "What are these wounds in the midst of thy hands?"
    - psalms: [8]
      antiphon:
        la: "His plagatus sum in domo eórum qui diligebant me."
        en: "With these I was wounded in the house of them that loved me."
  versicle:
    v:
      la: "Ipse vulnerátus est propter iniquitátes nostras."
      en: "He was wounded for our iniquities."
    r:
      la: "Attrítus est propter scélera nostra."
      en: "He was bruised for our sins."
nocturn3:
  groups:
    - psalms: [95]
      antiphon:
        la: "Fodérunt manus meas et pedes meos: dinumeravérunt ómnia ossa mea."
        en: "They have dug my hands and feet; they have numbered all my bones."
    - psalms: [96]
      antiphon:
        la: "Nisi videro in mánibus ejus fixúram clavorum, et mittam dígitum meum in locum clavorum, et mittam manum meam in latus ejus, non credam"
        en: "Except I shall see in his hands the print of the nails, and put my finger into the place of the nails, and put my hand into his side, I will not believe."
    - psalms: [97]
      antiphon:
        la: "Infer dígitum tuum huc, et vide manus meas, et affer manum tuam, et mitte in latus meum."
        en: "Put in thy finger hither, and see my hands; and bring hither thy hand, and put it into my side."
  versicle:
    v:
      la: "Disciplína pacis nostræ super eum."
      en: "The chastisement of our peace was upon him."
    r:
      la: "Et livóre ejus sanáti sumus."
      en: "And by his bruises we are healed."
