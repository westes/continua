# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). Matins psalmody: nine antiphons with the psalms the source assigns. English is this project's own translation, marked draft.
id: holy-shroud
nocturn1:
  groups:
    - psalms: [4]
      antiphon:
        la: "Rubrum est indumentum tuum, et vestiménta tua sicut calcantium in torculari."
        en: "Thy apparel is red, and thy garments like theirs that tread in the winepress."
    - psalms: [15]
      antiphon:
        la: "Aspérsus est sanguis super vestiménta mea, ómnia indumenta mea inquinavi."
        en: "Blood hath been sprinkled upon my garments, and I have stained all my apparel."
    - psalms: [14]
      antiphon:
        la: "Divisérunt sibi vestiménta mea, et super vestem meam misérunt sortem."
        en: "They have parted my garments among them, and upon my vesture they have cast lots."
  versicle:
    v:
      la: "Tuam sindonem veneramur Dómine."
      en: "We venerate thy Shroud, O Lord."
    r:
      la: "Tuam recólimus passiónem."
      en: "We recall thy Passion."
nocturn2:
  groups:
    - psalms: [23]
      antiphon:
        la: "Quasi abscónditus vultus ejus, et despectus; unde nec reputavimus eum."
        en: "His look was as it were hidden and despised; whereupon we esteemed him not."
    - psalms: [26]
      antiphon:
        la: "Omnes vidéntes me derisérunt me, locúti sunt lábiis, et movérunt caput."
        en: "All they that saw me laughed me to scorn; they have spoken with the lips, and wagged the head."
    - psalms: [29]
      antiphon:
        la: "Trádidit in mortem ánimam suam, et ipse peccáta multórum tulit."
        en: "He hath delivered his soul unto death, and he hath borne the sins of many."
  versicle:
    v:
      la: "Adoramus te Christe, et benedícimus tibi."
      en: "We adore thee, O Christ, and we bless thee."
    r:
      la: "Quia per crucem tuam redemísti mundum."
      en: "Because by thy Cross thou hast redeemed the world."
nocturn3:
  groups:
    - psalms: [52]
      antiphon:
        la: "Caro mea requiéscet in spe, quia non dabis Sanctum tuum vidére corruptiónem."
        en: "My flesh shall rest in hope, for thou wilt not give thy Holy One to see corruption."
    - psalms: [75]
      antiphon:
        la: "Convertísti planctum meum in gáudium mihi; conscidísti saccum meum, et circumdedísti me lætítia."
        en: "Thou hast turned my mourning into joy for me; thou hast cut my sackcloth, and hast compassed me with gladness."
    - psalms: [87]
      antiphon:
        la: "Factus sum sicut homo sine adiutorio, inter mórtuos liber."
        en: "I am become as a man without help, free among the dead."
  versicle:
    v:
      la: "Omnis terra adóret te, et psallat tibi."
      en: "Let all the earth adore thee, and sing to thee."
    r:
      la: "Psalmum dicat nómini tuo Dómine."
      en: "Let it sing a psalm to thy name, O Lord."
