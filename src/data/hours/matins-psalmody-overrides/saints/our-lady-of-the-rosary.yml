# Monastic 6+6+3 per SanctiM/10-07.txt over Sancti/10-07.txt. The secular
# file's [Ant Matutinum] is 9 antiphons (psalms 8/18/23, 44/45/86, 95/96/97
# -- the Joyful, Presentation/Finding, Sorrowful mysteries in order);
# SanctiM interleaves 3 [AntMatutinumM] antiphons ("Conservábat María"
# ;;47, "Crucis impérium... livóre ejus sanáti sumus" ;;96, "Dícite in
# géntibus" ;;97) and renumbers the secular 6-9 (86->84, 95->86, 96->95),
# yielding 12 antiphons: Nocturn 1 = the first six (Ps 8/18/23/44/45/47),
# Nocturn 2 = the last six. The source's own psalm tags on Nocturn 2 do
# not map one-to-one (they run 84/86/95/97/96/97, repeating 97), so the
# six antiphons are assigned in the source's listed order to the BVM
# Common's own six Nocturn 2 psalms (84/86/95/96/97/98, see
# categories/common-of-the-bvm.yml) rather than by raw tag number.
# Nocturn 3's antiphon is `[Ant Matutinum 3N]`, which the source builds
# from Sancti/12-08's Responsory3 verse ("Veni de Líbano, sponsa mea...")
# with an asterisk inserted; canticles are the BVM Common's own (the
# source's `;;249;250;251` are the same Sir 39 / Isa 61-62 canticles).
# Versicles from [Nocturn 1/2/3 Versum]. English for everything not in a
# SanctiM English file (the three AntMatutinumM antiphons and the
# Nocturn 3 versicle, whose source English is out of step with its Latin)
# is a direct translation of the Latin, marked `status: { en: draft }`;
# the rest is English/Sancti/10-07.txt verbatim.
id: our-lady-of-the-rosary
nocturn1:
  groups:
    - psalms: [8]
      antiphon:
        la: "Angelus Gábriel * nuntiávit Maríæ: et concépit de Spíritu Sancto."
        en: "The Angel Gabriel * announced unto Mary, and she conceived by the Holy Ghost."
    - psalms: [18]
      antiphon:
        la: "Intrávit María * in domum Zacharíæ, et salutávit Elísabeth."
        en: "Mary entered * into the house of Zacharias, and saluted Elizabeth."
    - psalms: [23]
      antiphon:
        la: "Péperit Fílium suum * primogénitum, et reclinávit eum in præsépio."
        en: "She brought forth her first-born Son, * and laid Him in a manger."
    - psalms: [44]
      antiphon:
        la: "Cum indúcerent * Jesum paréntes ejus, ut sísterent eum Dómino, Símeon accépit eum in ulnas suas, et benedíxit Deum."
        en: "When His parents brought in (the child) Jesus * to present Him to the Lord, Simeon took Him up in his arms and blessed God."
    - psalms: [45]
      antiphon:
        la: "Requiréntes Jesum * paréntes ejus, invenérunt illum post tríduum in médio doctórum."
        en: "His parents seeking Jesus * found Him after three days in the midst of the doctors."
    - psalms: [47]
      antiphon:
        la: "Conservábat María * ómnia verba hæc, conferens in corde suo."
        en: "Mary kept * all these words, pondering them in her heart."
      status: { la: verified, en: draft }
  versicle:
    v:
      la: "Sancta Dei Génetrix, semper Virgo María."
      en: "Holy Mother of God, Mary, always a Virgin,"
    r:
      la: "Intercéde pro nobis ad Dóminum, Deum nostrum."
      en: "Pray for us, unto the Lord our God."
nocturn2:
  groups:
    - psalms: [84]
      antiphon:
        la: "Cœpit contristári, * et factus est sudor ejus in horto sicut guttæ sánguinis."
        en: "He began to be very sorrowful, * and in the garden the sweat became as it were drops of blood."
    - psalms: [86]
      antiphon:
        la: "Apprehéndit * Pilátus Jesum, et flagellávit."
        en: "Pilate took Jesus * and scourged Him."
    - psalms: [95]
      antiphon:
        la: "Mílites plecténtes corónam * de spinis, imposuérunt super caput ejus."
        en: "The soldiers plaited a crown * of thorns, and put it on His Head."
    - psalms: [96]
      antiphon:
        la: "Crucis impérium * super húmerum ejus: regnávit a ligno Deus."
        en: "The government was upon His shoulder, * even the cross; from the tree hath God reigned."
    - psalms: [97]
      antiphon:
        la: "Crucis impérium * super húmerum ejus: livóre ejus sanáti sumus."
        en: "The government was upon His shoulder, * even the cross: by His stripes we are healed."
      status: { la: verified, en: draft }
    - psalms: [98]
      antiphon:
        la: "Dícite * in géntibus: quia Dóminus regnávit a ligno."
        en: "Say among the nations: * the Lord hath reigned from the tree."
      status: { la: verified, en: draft }
  versicle:
    v:
      la: "Post partum, Virgo, invioláta permansísti."
      en: "After childbirth thou still remainest a virgin."
    r:
      la: "Dei Génetrix, intercéde pro nobis."
      en: "Mother of God, pray for us."
nocturn3:
  antiphon:
    la: "Veni de Líbano, * sponsa mea, veni, coronáberis coróna gratiárum."
    en: "Come from Lebanon, * My Spouse, thou shalt be crowned with a crown of grace."
  canticles:
    - refs:
        - { book: sir, chapter: 39, verses: "17-21" }
    - refs:
        - { book: isa, chapter: 61, verses: "10-11" }
        - { book: isa, chapter: 62, verses: "1-3" }
    - refs:
        - { book: isa, chapter: 62, verses: "4-7" }
  versicle:
    v:
      la: "Speciósa facta es et suávis."
      en: "Thou art become beautiful and gentle."
    r:
      la: "In delíciis tuis, sancta Dei Génetrix."
      en: "In thy gladness, O holy Mother of God."
    status: { la: verified, en: draft }
