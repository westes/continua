# CORRECTED 2026-09-14 (user: "exaltation is not the same feast as
# finding" -- see exaltation-of-the-holy-cross.yml's own header for the
# full story). The previous version of this file (commit 7757ade)
# duplicated finding-of-the-holy-cross.yml's own antiphons verbatim,
# sourced from `SanctiM/05-03.txt` -- wrong file for this feast. The
# reference engine's own Monastic file for Sept 14,
# `../divinum-officium-reference/web/www/horas/Latin/SanctiM/09-14.txt`,
# carries its own distinct `[AntMatutinumM]` block (3 real proper
# antiphons) plus a separately-tagged `[Ant Matutinum 3N]` -- the source
# itself marks that one as the Nocturn 3 antiphon, so no guesswork on
# placement there. Nocturn 1/2 antiphons assigned in the source file's
# own listed order (AntMatutinumM:1 then :2); both fall within the psalm
# ranges continua already uses for those nocturns (tag 8 -> psalm 8,
# within nocturn1's [1,2,4,5,8,14]; tag 22 -> psalm 22, nocturn2's own
# first psalm in [22,26,75,95,96,97]), consistent with the existing
# one-shared-antiphon-per-nocturn structure. English from the parallel
# `English/SanctiM/09-14.txt`.
#
# The overall *structure* (one antiphon shared across all six psalms of
# each of Nocturn 1 and Nocturn 2, Nocturn 3 replaced by three Old
# Testament canticles) is unchanged from the previous version and is
# still correctly Monastic-sourced -- only the antiphon/versicle *text*
# was wrong. Versicles are untouched: the Monastic file's own [Versum 1]/
# [Versum 2]/[Nocturn 3 Versum] genuinely are `@Sancti/05-03` (shared with
# Finding by the source's own rule, not a duplication error).
id: exaltation-of-the-holy-cross
nocturn1:
  groups:
    - psalms: [1, 2, 4, 5, 8, 14]
      antiphon:
        la: "Dulce lignum, dulces clavos, dulce pondus sustínuit, quæ sola digna fuit portáre prétium hujus sǽculi."
        en: "O sweet wood, O sweet nails, that bore his sweet burden, which alone were worthy to support his body."
  versicle:
    v:
      la: "Hoc signum Crucis erit in cælo."
      en: "This sign of the Cross shall be in heaven."
    r:
      la: "Cum Dóminus ad judicándum vénerit."
      en: "When the Lord cometh to judgment."
nocturn2:
  groups:
    - psalms: [22, 26, 75, 95, 96, 97]
      antiphon:
        la: "Virga tua, et báculus tuus: ipsa me consoláta sunt, Dómine, Deus meus."
        en: "Your rod and your staff, they have comforted me, O Lord, my God."
  versicle:
    v:
      la: "Adorámus te, Christe, et benedícimus tibi."
      en: "We adore thee, O Christ, and we bless thee."
    r:
      la: "Quia per Crucem tuam redemísti mundum."
      en: "Because through thy Cross thou hast redeemed the world."
nocturn3:
  antiphon:
    la: "Mihi autem absit gloriári, nisi in cruce Dómini nostri Jesu Christi: per quem mihi mundus crucifíxus est, et ego mundo."
    en: "But God forbid that I should glory, save in the cross of our Lord Jesus Christ; by whom the world is crucified to me, and I to the world."
  canticles:
    - refs:
        - { book: hab, chapter: 3, verses: "1-6" }
    - refs:
        - { book: hab, chapter: 3, verses: "7-12" }
    - refs:
        - { book: hab, chapter: 3, verses: "13-19" }
  versicle:
    v:
      la: "Omnis terra adóret te, et psallat tibi."
      en: "Let all the earth adore thee, and sing to thee."
    r:
      la: "Psalmum dicat nómini tuo, Dómine."
      en: "Let it sing a psalm to thy name, O Lord."
