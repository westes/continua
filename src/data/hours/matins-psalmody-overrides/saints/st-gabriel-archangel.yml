# Transcribed directly from the reference engine's own source files
# (Latin: web/www/horas/Latin/Sancti/03-24.txt, English:
# web/www/horas/English/Sancti/03-24.txt), Monastic Tridentinum 1617
# rubric. Companion file to ../apparition-of-st-michael.yml — see that
# file's own header for the "Common-of-an-Angel doesn't exist" context.
# `03-24.txt`'s own [Rank]/[Rule] read "ex Sancti/05-08" as a whole-file
# default, but its own [Ant Matutinum] block overrides with 9 fully
# distinct proper antiphons narrating the Gabriel episodes (Daniel,
# Zachary, the Annunciation) -- genuinely proper, matching this saint's
# own calendar-file comment ("Real, unique collect/antiphon/Nocturn 2-3
# content"). Nocturn 1/2/3 Versum are NOT overridden, so they fall back
# to Apparition of St. Michael's own (see apparition-of-st-michael.yml),
# without her Paschaltide alleluias -- March 24 falls within Paschaltide
# only in the vanishingly rare years Easter itself lands on March 22-23
# (its earliest possible date), so treated as permanently non-Paschal
# here, matching the plain (non-alleluia) Versum 1/Nocturn-2-Versum text.
#
# Sourced directly from these files rather than a live CGI query, since
# an existing sibling file (`data/propers/common/lauds-capitulum-st-
# gabriel-archangel.yml`) turns out to already carry Apparition's own
# capitulum text ("Significávit Deus...") under Gabriel's id by mistake
# -- his own real capitulum is "Ecce vir Gábriel, quem víderam in
# visióne..." (Dan 9:21-22, see [Capitulum Laudes] in 03-24.txt above).
# Flagged here as a pre-existing data bug found in passing, not fixed in
# this pass (out of scope -- this pass only covers Matins psalmody).
#
# The English source file's parenthetical "(Alleluia.)" tags scattered
# inconsistently across a few of these antiphons (e.g. psalms 8, 14, 18,
# 33, 95) have no Latin counterpart anywhere in the Latin source and
# don't correlate with any liturgical season -- treated as a translation-
# file artifact and dropped here, keeping the English antiphons in step
# with the (alleluia-free) Latin.
id: st-gabriel-archangel
nocturn1:
  groups:
    - psalms: [8]
      antiphon:
        la: "Dixit Angelus Gábriel * ad Daniélem: Intéllige, fílii hóminis, quóniam in témpore finis implébitur vísio."
        en: "The Angel Gabriel said unto Daniel: Understand, O son of man; for at the time of the end shall the vision be fulfilled."
    - psalms: [10]
      antiphon:
        la: "Ecce vir Gábriel * quem víderam in visióne cito volans tétigit me in témpore sacrifícii vespertíni et dócuit me."
        en: "Behold the man Gabriel, whom I had seen in the vision, being caused to fly swiftly, touched me about the time of the evening oblation; and he informed me."
    - psalms: [14]
      antiphon:
        la: "Cumque Gábriel * loquerétur ad me collápsus sum pronus in terram et tétigit me, et státuit me in gradu meo."
        en: "When Gabriel was about speaking unto me, I fell upon my face toward the ground; but he touched me, and set me upright."
    - psalms: [18]
      antiphon:
        la: "Gábriel Angelus * appáruit Zacharíæ, dicens: Uxor tua Elísabeth páriet tibi fílium, et vocábitur nomen ejus Joánnem."
        en: "The Angel Gabriel appeared unto Zacharias, and said unto him: Thy wife Elizabeth shall bear thee a son, and thou shalt call his name John."
    - psalms: [23]
      antiphon:
        la: "Et dixit Zacharías * ad Angelum: Unde hoc sciam? ego enim sum senex, et uxor mea procéssit in diébus suis."
        en: "And Zacharias said unto the Angel: Whereby shall know this? for I am an old man, and my wife well stricken in years."
    - psalms: [33]
      antiphon:
        la: "Respóndens autem Angelus * dixit ei: Ego sum Gábriel, qui asto ante Deum: et missus sum loqui ad te, et hæc tibi evangelizáre."
        en: "And the Angel, answering, said unto him: I am Gabriel, that stand in the presence of God, and am sent to speak unto thee, and to show thee these glad tidings."
  versicle:
    v:
      la: "Stetit Angelus juxta aram templi."
      en: "An Angel stood at the Altar of the Temple."
    r:
      la: "Habens thuríbulum áureum in manu sua."
      en: "Having a golden censer in his hand."
nocturn2:
  groups:
    - psalms: [95]
      antiphon:
        la: "Missus est * Gábriel Angelus ad Maríam Vírginem desponsátam Joseph."
        en: "The Angel Gabriel was sent to a virgin espoused to a man whose name was Joseph, and the virgin's name was Mary."
    - psalms: [96]
      antiphon:
        la: "Gábriel Angelus * Maríæ dixit: Ecce Elísabeth cognáta tua, et ipsa concépit fílium in senectúte sua."
        en: "The Angel Gabriel said unto Mary: Behold, thy cousin Elizabeth, she hath also conceived a son in her old age."
    - psalms: [102]
      antiphon:
        la: "Súscipe Verbum * Virgo María, quod tibi a Dómino per Angelum Gabriélem transmíssum est."
        en: "O Virgin Mary, receive the word of the Lord which is sent thee by His Angel Gabriel."
  versicle:
    v:
      la: "Ascéndit fumus arómatum in conspéctu Dómini."
      en: "The smoke of the incense ascended up before the Lord."
    r:
      la: "De manu Angeli."
      en: "Out of the Angel's hand."
nocturn3:
  versicle:
    v:
      la: "In conspéctu Angelórum psallam tibi, Deus meus."
      en: "Before the Angels will I sing praise unto thee, O my God."
    r:
      la: "Adorábo ad templum sanctum tuum, et confitébor nómini tuo."
      en: "I will worship toward thy holy Temple, and praise thy Name."
