# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2026-08-18, checked against his own day outright,
# 2026-11-30 -- "S. Andreæ Apostoli", not transferred that year). Second
# live-verified proof for the Matins-psalmody-override mechanism, after
# St. Lawrence (see matins-psalmody-overrides/saints/st-lawrence.yml) --
# this one proves the Common-of-an-Apostle category (see
# matins-psalmody-overrides/categories/common-of-an-apostle.yml), whose
# generic scheme this file's own psalm numbers match exactly in every
# slot across all three nocturns; only the antiphon text is proper to
# Andrew (narrating his own call by the Sea of Galilee and his own
# martyrdom on the cross), matching the same category-shares-psalm-
# numbers/saint-carries-antiphons pattern already established for
# Common-of-a-Martyr.
#
# New scripture chapters authored for the canticles:
# data/scripture/{isa-61,sap-3,sap-10}.yml (sparse, only the cited
# verses, same convention as sir-14.yml etc.).
id: st-andrew
category: common-of-an-apostle
nocturn1:
  groups:
    - psalms: [18]
      antiphon:
        la: "Vidit Dóminus * Petrum et Andréam, et vocávit eos."
        en: "The Lord saw Peter and Andrew, * and He called them."
    - psalms: [33]
      antiphon:
        la: "Veníte post me, * dicit Dóminus, fáciam vos fíeri piscatóres hóminum."
        en: "Follow Me, and I will make you fishers of men, * saith the Lord."
    - psalms: [44]
      antiphon:
        la: "Relíctis rétibus suis, * secúti sunt Dóminum Redemptórem."
        en: "And they left their nets, * and followed the Lord their Saviour."
    - psalms: [46]
      antiphon:
        la: "Christus me misit, * ad istam provínciam, in qua non parvum pópulum aquisívi."
        en: "Christ sent me * to this province, in which I have acquired not a small number of people."
    - psalms: [60]
      antiphon:
        la: "Ego si crucis * patíbulum expavéscerem, † crucis glóriam non prædicárem."
        en: "If I become terrified * at the gibbet of the Cross, I will not show forth the glory of the Cross."
    - psalms: [63]
      antiphon:
        la: "Dignum sibi Dóminus * computávit Mártyrem, quem vocávit Apóstolum, dum esset in mari, allelúja."
        en: "Whom the Lord called to be His Apostle, * when he was by the sea, him also He counted worthy to be His martyr. Alleluia."
  versicle:
    v:
      la: "In omnem terram exívit sonus eórum."
      en: "Their sound hath gone forth into all the earth:"
    r:
      la: "Et in fines orbis terræ verba eórum."
      en: "And their words unto the ends of the world."
nocturn2:
  groups:
    - psalms: [74]
      antiphon:
        la: "Videns Andréas * crucem, cum gáudio dicébat: † Quia amátor tui semper fui, et desiderávi te amplécti, o bona crux."
        en: "Seeing the cross, * Andrew said with joy, I have always been your lover, and desired to embrace you, O good cross."
    - psalms: [95]
      antiphon:
        la: "Diléxit Andréam * Dóminus in odórem suavitátis."
        en: "Andrew was to the Lord as a sweet savour, * which He loved exceedingly."
    - psalms: [96]
      antiphon:
        la: "Bíduo vivens * pendébat in cruce beátus Andréas pro Christi nómine, et docébat pópulum."
        en: "The blessed Andrew hung alive upon the cross for two days * for Christ's Name's sake, and, all the while, he taught the people."
    - psalms: [97]
      antiphon:
        la: "Non me permíttas, Dómine, * fámulum tuum a te separári: tempus est ut commendétur terræ corpus meum, et me ad te veníre jubéas."
        en: "Suffer not thy servant, O Lord, to be parted from thee * the hour is come to lay my body in the earth, and for thee to bid me come unto thyself."
    - psalms: [98]
      antiphon:
        la: "Andréas vero rogábat pópulum, * ut non impedíret passiónem ipsíus."
        en: "But Andrew besought the people * not to hinder his passion."
    - psalms: [100]
      antiphon:
        la: "Accipe me ab homínibus * et redde me magístro meo: ut per te me recípiat, qui per te me redémit, allelúja."
        en: "Welcome me from among men and join me again to my Master; * that, as by thee He redeemed me, so by thee also He may take me unto Himself. Alleluia."
  versicle:
    v:
      la: "Constítues eos príncipes super omnem terram."
      en: "Thou shalt make them princes over all the earth."
    r:
      la: "Mémores erunt nóminis tui, Dómine."
      en: "They shall remember thy name, O Lord."
nocturn3:
  antiphon:
    la: "Unus ex duóbus, * qui secúti sunt Dóminum, erat Andréas, frater Simónis Petri, allelúja."
    en: "One of the two * who followed the Lord was Andrew, the brother of Simon Peter, Alleluia."
  canticles:
    - refs:
        - { book: isa, chapter: 61, verses: "6-9" }
    - refs:
        - { book: sap, chapter: 3, verses: "7-9" }
    - refs:
        - { book: sap, chapter: 10, verses: "17-21" }
  versicle:
    v:
      la: "Nimis honoráti sunt amíci tui, Deus."
      en: "Thy friends, O Lord, are made exceedingly honourable."
    r:
      la: "Nimis confortátus est principátus eórum."
      en: "Their principality is exceedingly strengthened."
