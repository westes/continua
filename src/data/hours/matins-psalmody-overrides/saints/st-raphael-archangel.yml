# Transcribed directly from the reference engine's own source files
# (Latin: web/www/horas/Latin/Sancti/10-24.txt, English:
# web/www/horas/English/Sancti/10-24.txt), Monastic Tridentinum 1617
# rubric. Companion file to ../apparition-of-st-michael.yml — see that
# file's own header for the "Common-of-an-Angel doesn't exist" context.
# `10-24.txt`'s own [Rank]/[Rule] read "ex Sancti/05-08" as a whole-file
# default, but its own [Ant Matutinum] block overrides with 9 fully
# distinct proper antiphons narrating the Book of Tobias episodes —
# genuinely proper, matching this saint's own calendar-file comment
# ("Real, unique collect/antiphon/Nocturn 2-3 content"). Psalm 14's own
# antiphon carries a fixed, non-seasonal "allelúia" in its own text (not
# a Paschaltide addition — Oct 24 is never in Paschaltide).
#
# Versicles are a genuine mix, unlike the other angel feasts: Nocturn 1
# and Nocturn 3 both have their OWN proper versicle in this file (not
# inherited); only Nocturn 2's `[Nocturn 2 Versum]` explicitly redirects
# (`@Sancti/05-08:Nocturn 2 Versum_`) to Apparition of St. Michael's own
# ("Ascéndit fumus arómatum..." — see apparition-of-st-michael.yml),
# without her Paschaltide alleluia.
id: st-raphael-archangel
nocturn1:
  groups:
    - psalms: [8]
      antiphon:
        la: "Egréssus Tobías * invénit júvenem præcínctum, et quasi parátum ad ambulándum, et, ignórans quod Angelus esset, salutávit eum."
        en: "When Tobias went in, * he found a young man with his loins girded, and as it were ready to set forth, and knowing not that it was an Angel, he saluted him."
    - psalms: [10]
      antiphon:
        la: "Angelus Ráphaël * seípsum occúltans, ait: Ego sum Azarías, magni Ananíæ fílius."
        en: "The Angel Raphael * hid himself, and said: I am Azarias, the son of Ananias the Great."
    - psalms: [14]
      antiphon:
        la: "Sanum ducam * fílium tuum in regiónem Medórum, et sanum tibi redúcam, allelúia."
        en: "I will bring thy son safely * into the land of the Medes, and bring him back safely unto thee again, alleluia."
    - psalms: [18]
      antiphon:
        la: "Dixit autem Angelus: * Apprehénde bránchiam piscis, et trahe eum extra aquas."
        en: "And the Angel said: * Take the fish by the gill, and draw him out of the water."
    - psalms: [23]
      antiphon:
        la: "Obsecro te, * Azaría frater, ut dicas mihi, quod remédium habébunt ista, quæ de pisce serváre jussísti."
        en: "Tell me, I pray thee, * brother Azarias, to what use is that which thou hast bidden me keep of the fish."
    - psalms: [33]
      antiphon:
        la: "Lúmina fel sanat, * sed virtus cordis et jécoris diáboli expéllit potestátem."
        en: "The gall is a healing to the eyes, * but the virtue of the heart and the liver putteth the power of the devil to flight."
  versicle:
    v:
      la: "Data sunt Angelo incénsa multa."
      en: "There was given unto the Angel much incense."
    r:
      la: "Ut adoléret ea ante altáre áureum, quod est ante óculos Dómini."
      en: "That he should offer it upon the golden altar, which is before the presence of the Lord."
nocturn2:
  groups:
    - psalms: [95]
      antiphon:
        la: "Est hic Sara * Raguélis fília; quæ tibi conjúgio dábitur, et omnis substántia ejus."
        en: "Here is Sara * the daughter of Raguel, who shall be given unto thee to wife, and all her substance with her."
    - psalms: [96]
      antiphon:
        la: "Septem viros hábuit, * quos dæmónium oppréssit; tímeo ne mihi símile contíngat."
        en: "She hath had seven husbands, * who were all strangled by an evil spirit; I am afraid lest the like should befall me."
    - psalms: [102]
      antiphon:
        la: "Per tres dies * oratióni cum uxóre tua vacábis, ut in sémine Abrahæ benedictiónem in fíliis consequáris."
        en: "Spend three days * in prayer with thy wife, that thou mayest obtain the blessing of sons, in the seed of Abraham."
  versicle:
    v:
      la: "Ascéndit fumus arómatum in conspéctu Dómini."
      en: "The smoke of the incense ascended up before the Lord."
    r:
      la: "De manu Angeli."
      en: "Out of the Angel's hand."
nocturn3:
  versicle:
    v:
      la: "Apprehéndit Angelus Ráphaël dæmónium."
      en: "The Angel Raphael took hold on the evil spirit."
    r:
      la: "Et religávit illud in desérto superióris Ægýpti."
      en: "And drove him away into the desert of Upper Egypt."
