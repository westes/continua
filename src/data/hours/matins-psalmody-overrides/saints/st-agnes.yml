# Monastic 6+6+3 per SanctiM/01-21.txt over Sancti/01-21.txt. Sancti's own
# [Ant Matutinum] is 9 proper antiphons (psalms 1/2/3/4/5/8/14/44/45).
# SanctiM interleaves 3 [AntMatutinumM] antiphons ("Christi Virgo" ;;10,
# "Jam corpus ejus" ;;45, "Stans a dextris ejus" ;;84) and re-tags the
# secular ones with the substitutions in its own [Ant Matutinum] block:
#   lines 1-5, s/5/8/ s/4/5/ s/3/4/  -> Discéde 1, Déxteram 2, Pósuit 4,
#                                       Induit 5, Mel et lac 8
#   AntMatutinumM:1                  -> Christi Virgo 10
#   lines 8-9, s/44/14/ s/45/44/     -> Christus circúmdedit 14,
#                                       Ipsi sum desponsáta 44
#   AntMatutinumM:2                  -> Jam corpus ejus 45
#   line 7, s/14/47/                 -> Cujus pulchritúdinem 47
#   AntMatutinumM:3                  -> Stans a dextris ejus 84
#   line 6, s/8/86/                  -> Ipsi soli servo fidem 86
# giving Nocturn 1 = Ps 1/2/4/5/8/10 and Nocturn 2 = Ps 14/44/45/47/84/86
# (these psalm tags are the source's own, not the generic Common-of-a-
# Virgin set). Nocturn 3 is [Ant Matutinum 3N] ("Misit Dóminus") with the
# source's `;;249;250;251` canticles, the same three Sir 39 / Isa 61-62
# canticles common-of-a-virgin-martyr.yml uses. The source has no
# [Nocturn N Versum] of its own, so the three nocturn-closing versicles
# are that Common's, unchanged. English from English/Sancti/01-21.txt and
# English/SanctiM/01-21.txt; the source's English antiphons carry no
# asterisk, so none is inserted.
id: st-agnes
category: common-of-a-virgin
nocturn1:
  groups:
    - psalms: [1]
      antiphon:
        la: "Discéde a me, * pábulum mortis, quia jam ab álio amatóre prævénta sum."
        en: "Depart from me, prey of death, for I am prevented by another Lover."
    - psalms: [2]
      antiphon:
        la: "Déxteram meam * et collum meum cinxit lapídibus pretiósis, trádidit áuribus meis inæstimábiles margarítas."
        en: "My right hand and my neck hath He clasped with precious stones, and put pearls beyond price in mine ears."
    - psalms: [4]
      antiphon:
        la: "Pósuit signum * in fáciem meam, ut nullum præter eum amatórem admíttam."
        en: "He hath sealed me in my forehead that I may let in no other lover but Him."
    - psalms: [5]
      antiphon:
        la: "Induit me Dóminus * cýclade auro texta, et imménsis monílibus ornávit me."
        en: "The Lord hath clothed me with a vesture of wrought gold, and adorned me with a necklace of great price."
    - psalms: [8]
      antiphon:
        la: "Mel et lac * ex ejus ore suscépi, et sanguis ejus ornávit genas meas."
        en: "I have sucked honey and milk out of His Mouth, and His Blood is red on my cheeks."
    - psalms: [10]
      antiphon:
        la: "Christi Virgo * nec terróre concútitur, nec blandiméntis sedúcitur."
        en: "The Virgin of Christ * is not shaken by terror nor seduced by favours."
  versicle:
    v:
      la: "Spécie tua et pulchritúdine tua."
      en: "In thy comeliness and thy beauty."
    r:
      la: "Inténde, próspere procéde, et regna."
      en: "Go forward, fare prosperously, and reign."
nocturn2:
  groups:
    - psalms: [14]
      antiphon:
        la: "Christus circúmdedit me * vernántibus atque coruscántibus gemmis pretiósis."
        en: "Christ hath crowned me with the bright and priceless blossoms of the eternal spring-time."
    - psalms: [44]
      antiphon:
        la: "Ipsi sum desponsáta, * cui Angeli sérviunt, cujus pulchritúdinem sol et luna mirántur."
        en: "I am wedded to the Lord of Angels, at Whose beauty the sun and the moon do wonder."
    - psalms: [45]
      antiphon:
        la: "Jam corpus ejus * córpori meo sociátum est, et sanguis ejus ornávit genas meas."
        en: "His Holy body * is already united to me, and his blood is red upon my cheeks."
    - psalms: [47]
      antiphon:
        la: "Cujus pulchritúdinem * sol et luna mirántur, ipsi soli servo fidem."
        en: "I keep my troth to Him Alone, at Whose beauty the sun and the moon do wonder."
    - psalms: [84]
      antiphon:
        la: "Stans a dextris ejus * Agnus nive candídior, Christus sibi sponsam et Mártyrem consecrávit."
        en: "A lamb whiter than snow stood at her right hand, Christ consecrating her his bride and martyr."
    - psalms: [86]
      antiphon:
        la: "Ipsi soli servo fidem, * ipsi me tota devotióne commítto."
        en: "I keep my troth to Him alone, and commit me altogether to Him."
  versicle:
    v:
      la: "Adjuvábit eam Deus vultu suo."
      en: "God shall help her with His countenance."
    r:
      la: "Deus in médio ejus, non commovébitur."
      en: "God is in the midst of her, she shall not be moved."
nocturn3:
  antiphon:
    la: "Misit Dóminus * Angelum suum, et liberávit me de médio ignis, et non sum æstuáta."
    en: "The Lord hath sent his angel, * and hath delivered me out of the fire I was not burnt."
  canticles:
    - refs:
        - { book: sir, chapter: 39, verses: "17-21" }
    - refs:
        - { book: isa, chapter: 61, verses: "10-11" }
        - { book: isa, chapter: 62, verses: "1-3" }
    - refs:
        - { book: isa, chapter: 62, verses: "4-7" }
  versicle:
    v:
      la: "Elégit eam Deus, et præelégit eam."
      en: "God hath chosen her, and fore-chosen her."
    r:
      la: "In tabernáculo suo habitáre facit eam."
      en: "He hath made her to dwell in His tabernacle."
