# Which common proper (see data/propers/common/prime-chapter-responsory-*)
# supplies the short responsory's variable verse, by season.
#
# Live and firing (confirmed 2026-09-15 -- an earlier "milestone 4 hasn't
# landed, this table is a placeholder" comment here was stale:
# calendar/temporal.ts's resolveSeason is a complete, real, data-driven
# implementation, not a stub, and has been for a while). Septuagesima/
# Lent/Passiontide/Trinitytide have no entries here on purpose, not
# because they're unbuilt -- the reference source
# (Psalterium/Special/Prima Special.txt) has no `[Responsory Quad]`/
# `[Responsory Trin]`-style tag at all, only the 8 seasons listed below;
# "per-annum" genuinely is those seasons' own real answer.
perAnnum: prime-chapter-responsory-per-annum
bySeason:
  advent: prime-chapter-responsory-adv
  christmastide: prime-chapter-responsory-nat
  epiphanytide: prime-chapter-responsory-epi
  eastertide: prime-chapter-responsory-pasch
  ascensiontide: prime-chapter-responsory-asc
  pentecost: prime-chapter-responsory-pent
  corpus-christi: prime-chapter-responsory-corp
  sacred-heart: prime-chapter-responsory-heart
