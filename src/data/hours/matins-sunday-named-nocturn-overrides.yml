# Sunday Matins Nocturns I-III, per-named-Sunday override — keyed by
# `temporalId`, for a specific privileged Sunday whose own proper is
# wholesale different from the fixed 12-psalm/3-canticle scheme (not just
# a seasonal antiphon overlay on the same psalms, the way
# matins-sunday-advent-nocturn-overrides.yml / matins-sunday-paschaltide-
# nocturn-overrides.yml are) — different psalm numbers entirely.
#
# hours/matins.ts's lookup checks this map first (most specific), ahead of
# the season-wide overrides, when `temporalId` matches a key here.
#
# `easter-sunday` (below) is also reused for Easter Monday and Tuesday
# (`hours/matins.ts`'s threeNocturns/Sunday-branch dispatch route any
# temporal winner with a matching entry here through the same rendering as
# a real Sunday, not just `day.weekday === 'sunday'` literally) — the
# reference engine's own content is byte-identical across all three days
# (live-verified 2026-09-02, 2026-04-05/06/07), so one entry covers all
# three rather than three separate near-duplicate ones.

# Sunday within the Octave of Ascension (`sunday-after-ascension`) —
# live-verified against the local reference-engine CGI instance
# (`prayMatutinum`, Monastic Tridentinum 1617, 2026-09-01, proof date
# 2026-05-17), titled there "Dominica infra Octavam Ascensionis ~
# Semiduplex Dominica minor". Added alongside a calendar precedence fix
# (data/calendar/temporal-categories.yml: ascensiontide's Sunday is
# `privileged-sunday`, not `ordinary-sunday`) — this Sunday genuinely
# outranks even a Duplex sanctoral candidate (e.g. St. Paschal Baylon,
# real May 17), which transfers rather than winning or being commemorated.
#
# Each nocturn here uses 6 individually-antiphoned psalms (one antiphon
# per single psalm, not one per pair the way the base/Advent scheme
# groups them) — confirmed by the live query, which showed a separate
# "Ant." before and after every single psalm. Nocturn III reuses the same
# 3 canticles as the ordinary-Paschaltide override (Isa 63:1-5, Osee
# 6:1-6, Sophonias 3:8-13 — already authored, no new scripture files
# needed here) under its own different antiphon/versicle.
#
# Nocturn III's antiphon has no English translation in the reference
# engine's own English tree (confirmed: the paragraph is genuinely empty
# there, not a fetch/parsing gap) — `en` here is this app's own
# translation of the underlying Mark 16:20 text (a well-known, unambiguous
# formula, not a guess), consistent with how every other antiphon in this
# file is sourced.
# Easter Sunday itself (and Monday/Tuesday of the Octave, which share this
# entry — see the file header above). Live-verified against the local
# reference-engine CGI instance (`prayMatutinum`, Monastic Tridentinum
# 1617, 2026-09-02, proof dates 2026-04-05/06/07). Unlike every other
# Sunday scheme in this file, each nocturn here uses ONE shared antiphon
# over ALL 6 of its psalms (not one antiphon per psalm, nor per pair) —
# confirmed by the live query: a single "Ant." before the first psalm and
# the same antiphon repeated in full after the last, nothing in between.
# Nocturn III reuses the same 3 canticles as the ordinary-Paschaltide
# override (Isa 63:1-5, Osee 6:1-6, Sophonias 3:8-13 — already authored,
# no new scripture files needed) under its own different antiphon; all 3
# nocturn-closing versicles are also byte-identical to the ones already
# authored in matins-sunday-paschaltide-nocturn-overrides.yml, confirming
# those are shared season-wide, not coincidentally reused.
#
# The reference engine's own [Rule] for this day actually reads "1
# nocturn" (the whole night office collapses to a single nocturn of 3
# lessons on this most privileged of feasts) — not modeled that way here;
# this app's own threeNocturns rule renders every Sunday with 3 nocturns
# unconditionally regardless of the historical single-nocturn rubric for
# this particular feast (same convention already noted in
# nocturn-readings/easter-sunday.yml's own header for the reading side).
#
# Explicitly NOT covered by this entry: Wednesday-Saturday of the Octave
# have their own real Paschal-alleluia antiphons layered over (in the
# reference engine) a differently-sized psalm set — live-verified present
# (2026-04-08, Wednesday) but not authored here. A separate, smaller gap
# (4 more days of antiphon-only content, analogous to the existing Advent/
# Paschaltide seasonal-overlay shape) — see TODO.md.
easter-sunday:
  # winner.id 'easter-sunday' spans the whole Octave (all 6 weekdays), but
  # only these 3 calendar days are live-verified to share this content —
  # restricting the entry so Wednesday-Saturday keep falling through to
  # their own (not yet authored) path instead of wrongly reusing this one.
  weekdays: [sunday, monday, tuesday]
  nocturn1:
    groups:
      - psalms: [1, 2, 8, 15, 23, 27]
        antiphon:
          la: "Ego sum qui sum, * et consílium meum non est cum ímpiis, sed in lege Dómini volúntas mea est, allelúja."
          en: "I am who I am, * and my counsel is not with the ungodly, my will is in the law of God, alleluia."
    versicle:
      v: { la: "Surréxit Dóminus de sepúlcro, allelúja.", en: "The Lord is risen from the sepulchre, alleluia." }
      r: { la: "Qui pro nobis pepéndit in ligno, allelúja.", en: "Who for us was hanged on the tree, alleluia." }
  nocturn2:
    groups:
      - psalms: [29, 63, 65, 75, 87, 107]
        antiphon:
          la: "Terra * trémuit et quiévit, † dum exsúrgeret in judício Deus, allelúja."
          en: "The earth * trembled and was still, when God arose to judgment, alleluia."
    versicle:
      v: { la: "Surréxit Dóminus vere, allelúja.", en: "The Lord is risen indeed, alleluia." }
      r: { la: "Et appáruit Simóni, allelúja.", en: "And hath appeared to Simon, alleluia." }
  nocturn3:
    canticles:
      - refs: [{ book: isa, chapter: 63, verses: "1-5" }]
      - refs: [{ book: osee, chapter: 6, verses: "1-6" }]
      - refs: [{ book: soph, chapter: 3, verses: "8-13" }]
    antiphon:
      la: "Nolíte expavéscere: * Jesum quǽritis Nazarénum, crucifíxum: surréxit, non est hic, allelúja."
      en: "Be not affrighted; * you seek Jesus of Nazareth, who was crucified: he is risen, he is not here, alleluia."
    versicle:
      v: { la: "Gavísi sunt discípuli, allelúja.", en: "The disciples were glad, alleluia." }
      r: { la: "Viso Dómino, allelúja.", en: "When they saw the Lord, alleluia." }

sunday-after-ascension:
  nocturn1:
    groups:
      - psalms: [8]
        antiphon:
          la: "Eleváta est magnificéntia tua super cælos, Deus, allelúja."
          en: "Thy magnificence is elevated above the heavens, O God, alleluia."
      - psalms: [10]
        antiphon:
          la: "Dóminus in templo sancto suo, Dóminus in cælo, allelúja."
          en: "The Lord is in His holy Temple, the Lord's throne is in heaven, alleluia."
      - psalms: [18]
        antiphon:
          la: "A summo cælo egréssio ejus, et occúrsus ejus usque ad summum ejus, allelúja."
          en: "His going out is from the end of heaven, and his circuit even to the end thereof, alleluia."
      - psalms: [20]
        antiphon:
          la: "Exaltáre, Dómine, in virtúte tua: cantábimus et psallémus, allelúja."
          en: "Be thou exalted, O Lord, in thy own strength: we will sing and praise, alleluia."
      - psalms: [23]
        antiphon:
          la: "Elevámini, elevámini, portæ æternáles: † et introíbit rex glóriæ, allelúja."
          en: "Be lifted up, O eternal gates: and the King of Glory shall enter in, alleluia."
      - psalms: [29]
        antiphon:
          la: "Exaltábo te, Dómine, quóniam suscepísti me, allelúja."
          en: "I will extol thee, O Lord, for thou hast upheld me, alleluia."
    versicle:
      v: { la: "Ascéndit Deus in jubilatióne, allelúja.", en: "God is ascended with jubilee, alleluia." }
      r: { la: "Et Dóminus in voce tubæ, allelúja.", en: "And the Lord with the sound of trumpet, alleluia." }
  nocturn2:
    groups:
      - psalms: [45]
        antiphon:
          la: "Exaltábor in géntibus, et exaltábor in terra, allelúja."
          en: "I will be exalted among the nations, and I will be exalted in the earth, alleluia."
      - psalms: [46]
        antiphon:
          la: "Ascéndit Deus in jubilatióne, et Dóminus in voce tubæ, allelúja."
          en: "God is ascended with jubilee, and the Lord with the sound of trumpet, alleluia."
      - psalms: [95]
        antiphon:
          la: "Læténtur cæli, et exsúltet terra, † quia venit Dóminus, allelúja."
          en: "Let the heavens rejoice, and let the earth be glad, for the Lord is coming, alleluia."
      - psalms: [96]
        antiphon:
          la: "Nimis exaltátus est, allelúja: super omnes deos, allelúja."
          en: "He is exalted exceedingly, alleluia: above all gods, alleluia."
      - psalms: [98]
        antiphon:
          la: "Dóminus in Sion, allelúja: magnus et excélsus, allelúja."
          en: "The Lord in Sion, alleluia: is great and high, alleluia."
      - psalms: [102]
        antiphon:
          la: "Dóminus in cælo, allelúja: parávit sedem suam, allelúja."
          en: "The Lord in heaven, alleluia: hath prepared his throne, alleluia."
    versicle:
      v: { la: "Ascéndens Christus in altum, allelúja.", en: "When Christ ascended up on high, alleluia." }
      r: { la: "Captívam duxit captivitátem, allelúja.", en: "He led captivity captive, alleluia." }
  nocturn3:
    canticles:
      - refs: [{ book: isa, chapter: 63, verses: "1-5" }]
      - refs: [{ book: osee, chapter: 6, verses: "1-6" }]
      - refs: [{ book: soph, chapter: 3, verses: "8-13" }]
    antiphon:
      la: "Illi autem profécti prædicavérunt ubíque, Dómino cooperánte, et sermónem confirmánte sequéntibus signis, † allelúja, allelúja."
      en: "But they, going forth, preached everywhere: the Lord working with them, and confirming the word with signs that followed, alleluia, alleluia."
    versicle:
      v: { la: "Ascéndo ad Patrem meum, et Patrem vestrum, allelúja.", en: "I ascend to my Father and to your Father, alleluia." }
      r: { la: "Deum meum, et Deum vestrum, allelúja.", en: "To my God and your God, alleluia." }

# Christmas Day (Dec 25): engine render (Monastic Tridentinum 1617, prayMatutinum,
# 2026-12-25): six individually-antiphoned psalms in each of Nocturns I and II
# (Ps 2/18/23/44/47/71 and 84/88/95/96/97/98), three Isaiah canticles in III.
christmas-day:
  nocturn1:
    groups:
      - psalms: [2]
        antiphon:
          la: "Dóminus dixit * ad me: Fílius meus es tu, ego hódie génui te."
          en: "The Lord hath said unto Me: * Thou art My Son, this day have I begotten thee."
      - psalms: [18]
        antiphon:
          la: "Tamquam sponsus * Dóminus procédens de thálamo suo."
          en: "The Lord is as a bridegroom * coming out of his chamber."
      - psalms: [23]
        antiphon:
          la: "Elevámini, * portæ æternáles, † et introíbit Rex glóriæ."
          en: "Be ye lifted up, * O eternal gates: and the King of Glory shall enter in."
      - psalms: [44]
        antiphon:
          la: "Diffúsa est * grátia in lábiis tuis, proptérea benedíxit te Deus in ætérnum."
          en: "Grace is poured into thy lips, * therefore God hath blessed thee for ever."
      - psalms: [47]
        antiphon:
          la: "Suscépimus, * Deus, misericórdiam tuam in médio templi tui."
          en: "We have drunk in thy loving-kindness, * O God, in the midst of thy temple."
      - psalms: [71]
        antiphon:
          la: "Oriétur * in diébus Dómini abundántia pacis, et dominábitur."
          en: "In the Lord's days * shall abundance of peace arise and flourish."
    versicle:
      v: { la: "Tamquam sponsus.", en: "The Lord is as a bridegroom." }
      r: { la: "Dóminus procédens de thálamo suo.", en: "Coming out of his chamber." }
  nocturn2:
    groups:
      - psalms: [84]
        antiphon:
          la: "Véritas de terra * orta est, et justítia de cælo prospéxit."
          en: "Truth is sprung out of the earth, * and righteousness hath looked down from heaven."
      - psalms: [88]
        antiphon:
          la: "Ipse invocábit * me, allelúja: Pater meus es tu, allelúja."
          en: "He shall cry unto Me, alleluia, * Thou art My Father, alleluia."
      - psalms: [95]
        antiphon:
          la: "Læténtur cæli, * et exsúltet terra ante fáciem Dómini, quóniam venit."
          en: "Let the heavens rejoice, * and let the earth be glad before the Lord, for He cometh."
      - psalms: [96]
        antiphon:
          la: "In princípio * et ante sǽcula Deus erat Verbum: † ipse natus est nobis Salvátor mundi."
          en: "In the beginning, * and before the worlds, the Word was God, and this day is He born the Saviour of the world."
      - psalms: [97]
        antiphon:
          la: "Notum fecit * Dóminus, allelúja, salutáre suum, allelúja."
          en: "The Lord hath made known, alleluia, * His salvation, alleluia."
      - psalms: [98]
        antiphon:
          la: "Nato * Dómino Angelórum chorus canébat, dicens: Salus Deo nostro, allelúja."
          en: "When the Lord was born * the Angels sang together, saying Salvation to our God, Which sitteth upon the throne, and unto the Lamb. Alleluia."
    versicle:
      v: { la: "Speciósus forma præ fíliis hóminum.", en: "Thou art fairer than the children of men." }
      r: { la: "Diffúsa est grátia in lábiis tuis.", en: "Grace is poured into thy lips." }
  nocturn3:
    canticles:
      - refs: [{ book: isa, chapter: 9, verses: "2-7" }]
      - refs: [{ book: isa, chapter: 26, verses: "1-12" }]
      - refs: [{ book: isa, chapter: 66, verses: "10-16" }]
    antiphon:
      la: "Párvulus * fílius hódie natus est nobis: † et vocábitur Deus, Fortis, allelúja, allelúja."
      en: "Unto us this day * a little Child is born, and His name shall be called the Mighty God. Alleluia, alleluia."
    versicle:
      v: { la: "Ipse invocábit me, allelúja.", en: "He shall cry unto Me, alleluia." }
      r: { la: "Pater meus es tu, allelúja.", en: "Thou art My Father, alleluia." }

# The Epiphany (Jan 6): engine render (Monastic Tridentinum 1617, prayMatutinum, 2027-01-06).
epiphany:
  nocturn1:
    groups:
      - psalms: [28]
        antiphon:
          la: "Afférte Dómino * fílii Dei, adoráte Dóminum in aula sancta ejus."
          en: "Give unto the Lord, O ye sons of God, * worship the Lord in His holy courts."
      - psalms: [45]
        antiphon:
          la: "Flúminis ímpetus * lætíficat, allelúja, civitátem Dei, allelúja."
          en: "It is a river, the streams whereof make glad, * alleluia, the city of God, alleluia."
      - psalms: [46]
        antiphon:
          la: "Psállite Deo nostro, * psállite: psállite Regi nostro, psállite sapiénter."
          en: "Sing praises to our God, sing praises * sing praises unto our King, sing ye praises with understanding."
      - psalms: [47]
        antiphon:
          la: "Suscépimus, * Deus, misericórdiam tuam, † in médio templi tui."
          en: "We have received thy loving-kindness, * O God, in the midst of thy temple."
      - psalms: [65]
        antiphon:
          la: "Omnis terra adóret te, * et psallat tibi: psalmum dicat nómini tuo, Dómine."
          en: "Let all the earth worship thee, and sing unto thee * let them sing praises to thy name, O Lord."
      - psalms: [71]
        antiphon:
          la: "Reges Tharsis * et ínsulæ múnera ófferent Regi Dómino."
          en: "The kings of Tarshish and the isles shall bring presents * unto the Lord the King."
    versicle:
      v: { la: "Omnis terra adóret te, et psallat tibi.", en: "Let all the earth worship thee, and sing unto thee." }
      r: { la: "Psalmum dicat nómini tuo, Dómine.", en: "Let them sing praises to thy Name, O Lord." }
  nocturn2:
    groups:
      - psalms: [85]
        antiphon:
          la: "Omnes gentes * quascúmque fecísti, vénient, et adorábunt coram te, Dómine."
          en: "All nations whom Thou hast made shall come * and worship before thee, O Lord."
      - psalms: [86]
        antiphon:
          la: "Homo natus est * in ea, et ipse fundávit eam Altíssimus."
          en: "This man was born in her, * and the Highest Himself hath established her."
      - psalms: [95]
        antiphon:
          la: "Adoráte Dóminum, * allelúja: in aula sancta ejus, allelúja."
          en: "O worship the Lord, * alleluia, in His holy temple, alleluia."
      - psalms: [96]
        antiphon:
          la: "Adoráte Deum, * allelúja: omnes Angeli ejus, allelúja."
          en: "Worship God, * alleluia, all ye His Angels, alleluia."
      - psalms: [97]
        antiphon:
          la: "Notum * fecit Dóminus allelúja; † salutáre suum, allelúja."
          en: "The Lord hath made known alleluia; his salvation, alleluia."
      - psalms: [98]
        antiphon:
          la: "Tria sunt * múnera quæ obtulérunt Magi Dómino, aurum, thus et myrrham: † Fílio Dei, Regi magno, allelúja."
          en: "There are three precious gifts which the wise men offered unto the Lord, Gold, frankincense, and myrrh: to the great King, the Son of God alleluia."
    versicle:
      v: { la: "Reges Tharsis et ínsulæ múnera ófferent.", en: "The kings of Tarshish and of the isles shall bring presents." }
      r: { la: "Reges Arabum et Saba dona addúcent.", en: "The kings of Arabia and Saba shall offer gifts." }
  nocturn3:
    canticles:
      - refs: [{ book: isa, chapter: 9, verses: "2-7" }]
      - refs: [{ book: isa, chapter: 26, verses: "1-12" }]
      - refs: [{ book: isa, chapter: 66, verses: "10-16" }]
    antiphon:
      la: "Vénient * ad te qui detrahébant tibi, † et adorábunt vestígia pedum tuórum."
      en: "They that despised thee * shall come unto thee, and shall bow themselves down at the Soles of thy Feet."
    versicle:
      v: { la: "Adoráte Dóminum, allelúja.", en: "O worship the Lord, alleluia." }
      r: { la: "In aula sancta ejus, allelúja.", en: "In His holy temple, alleluia." }
