    - { number: 17, verses: "2-25" }
  saturday:
    - { number: 17, verses: "26-51" }
    - { number: 18 }
    - { number: 19 }

# Editorial redistribution, worked out day-by-day in conversation before
# Matins/Terce/Sext/None existed as hours — recorded here so the decision
# survives until milestone 3/5 actually consumes it, not because any code
# reads `matins`/`terce`/`sext`/`none` yet.
#
# The problem: Monastic ferial Matins has 12 psalms/day, which felt like
# too many; ferial Terce/Sext/None always repeats the same 9 short psalms
# (119-127) regardless of weekday, which felt monotonous. The fix: cut
# non-Sunday Matins to 9/day, and give the freed-up capacity to Friday and
# Saturday's Terce/Sext/None instead of just discarding it.
#
# Method (do not re-derive without this context, the reasoning isn't
# obvious from the numbers alone):
#   1. Classify every non-Sunday Matins psalm as "must-stay" (>~15 verses,
#      or blocked because it's half of a split psalm whose other half is
#      too long — a split psalm always moves as a pair or not at all) or
#      "could-move" (short and free to relocate). 43 must-stay, 29
#      could-move, verified against a real Monastic 1617 Tue-Sat run
#      (Mon/Sat cross-checked directly; the verse-count table this was
#      built from is in the conversation, not repeated here).
#   2. Non-Sunday Matins needs 9*6=54 psalms total; only 43 were
#      naturally must-stay, so the 11 *longest* could-move psalms were
#      promoted back to must-stay (bringing the total to exactly 54) —
#      pragmatic, not a liturgical principle: given a forced choice
#      between two "short enough" psalms, keep the longer one in Matins
#      and let the truly shortest ones be the ones that actually move.
#   3. The resulting 54 were resliced into six fresh groups of 9, in
#      continuous psalm order, *not* respecting original day boundaries —
#      this is why e.g. Tuesday's Matins below includes psalms that were
#      originally Monday's. One adjustment was needed by hand: the raw
#      reslice split Psalm 103 across Friday and Saturday, so Ps 96 (the
#      shortest non-103 psalm on Friday) was swapped out to Saturday to
#      let both halves of 103 land together on Friday.
#   4. The remaining 18 could-move psalms are exactly 2 days' worth of
#      Terce+Sext+None (3+3+3=9 per day) — enough to replace Friday's and
#      Saturday's, in the same continuous psalm order, filling Terce then
#      Sext then None. Not enough to also replace Wednesday's or
#      Thursday's, which keep the traditional 119-127 unchanged.
#
# Sunday, Monday, and Tuesday's Terce/Sext/None are untouched by any of
# this (still whatever Divinum Officium gives natively — Ps 118 sections
# for Sunday/Monday, 119-127 for Tuesday) — now recorded below, verified
# against clean per-annum runs with no sanctoral override (2026-08-09 Sun,
# 2026-08-31 Mon, 2026-10-13 Tue).
