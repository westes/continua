# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "06-23"
text:
  la: |
    Vigília Nativitátis sancti Joánnis Baptístæ.

    Romæ sancti Joánnis Presbýteri, qui, sub Juliáno Apóstata, via Salária véteri, ante simulácrum Solis decollátus est, et corpus ejus a beáto Concórdio Presbýtero juxta Mártyrum Concília sepúltum.

    Item Romæ sanctæ Agrippínæ, Vírginis et Mártyris, quæ sub Valeriáno Imperatóre martýrium consummávit. Ipsíus autem corpus, in Sicíliam translátum ac Menis cónditum, multis miráculis corúscat.

    Sútrii, in Túscia, sancti Felícis Presbýteri, cujus os támdiu jussit Túrcius Præféctus lápide contúndi, donec ipse Felix emítteret spíritum.

    Nicomedíæ commemorátio plurimórum sanctórum Mártyrum, qui, témpore Diocletiáni, in móntibus et spelúncis laténtes, pro Christi nómine martýrium læto ánimo subiérunt.

    Philadelphíæ, in Arábia, sanctórum Mártyrum Zenónis, ejúsque servi Zenæ. Hic dómini sui vincti caténas exósculans, eúmque rogans ut se in torméntis partícipem dignarétur habére, a milítibus tentus est, et cum ipso dómino parem martýrii corónam accépit.

    Augústæ Taurinórum sancti Joséphi Cafásso, Sacerdótis, qui levítis pietáte et sciéntia augéndis atque damnátis cápite Deo conciliándis fuit illústris, et a Pio Papa Duodécimo inter sanctos Cǽlites adscríptus est.

    In monastério Elyénsi, in Británnia, sanctæ Ediltrúdis, Regínæ et Vírginis, quæ sanctitáte et miráculis clara migrávit ad Dóminum. Ipsíus autem corpus, úndecim post annis, invéntum est incorrúptum.
  en: |
    In England, the holy Queen and Virgin Etheldreda, who passed away to be with the Lord, illustrious for holiness and miracles whose body was found incorrupt eleven years after her death.

    At Rome, the holy Priest John, who was beheaded, under the Emperor Julian the Apostate, in front of the image of the sun upon the old Salarian Way. His body was buried by the blessed Priest Concordius, hard by the martyrs' burial-place.

    Likewise at Rome, under the Emperor Valerian, the holy Virgin and martyr Agrippina, whose body was taken to Sicily and is distinguished for many miracles.

    At Sutri, in Tuscany, the holy Priest Felix, whose mouth the Prefect Turcius ordered to be pounded with a stone until he died.

    At Nicomedia are commemorated very many holy martyrs who, in the time of Diocletian, wandered in deserts and in mountains, and in dens and caves of the earth, and for Christ's Name's sake, underwent martyrdom with joy.

    At Philadelphia, in Arabia, the holy martyr Zeno and Zenas his slave. When Zeno was bound Zenas kissed his chains, and besought him to be pleased to have him for a sharer in his torments, whereupon the soldiers took him, and he and his master received the same crown of martyrdom together.

    At Turin, holy Joseph Cafasso, Priest, who was renowned for increasing the piety and knowledge of the clergy and for reconciling to God those condemned to death, and who was enrolled among the Saints of heaven by Pope Pius XII.
