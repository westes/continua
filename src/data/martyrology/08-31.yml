# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-31"
text:
  la: |
    Sancti Raymúndi Nonnáti, ex Ordine beátæ Maríæ de Mercéde redemptiónis captivórum, Cardinális et Confessóris; cujus dies natális séptimo Kaléndas Septémbris recólitur.

    Apud montem Senárium, in Etrúria, natális sancti Bonajúnctæ Confessóris, e septem Fundatóribus Ordinis Servórum beátæ Maríæ Vírginis; qui, de Passióne Domínica ad fratres verba fáciens, in manus Dómini trádidit spíritum. Ipsíus autem ac Sociórum festum prídie Idus Februárii celebrátur.

    Tréviris item natális sancti Paulíni Epíscopi, qui, témpore Ariánæ infestatiónis, ab Ariáno Imperatóre Constántio ob cathólicam fidem relegátus exsílio, et extra Christiánum nomen usque ad mortem mutándo exsília fatigátus, tandem, apud Phrýgiam defúnctus, beátæ passiónis corónam percépit a Dómino.

    Tránsaquis, ad lacum Fúcinum, in Marsis, natális quoque sanctórum Mártyrum Cæsídii Presbýteri, et Sociórum; qui martýrio coronáti sunt in persecutióne Maximíni.

    Item sanctórum Mártyrum Robustiáni et Marci.

    Cæsaréæ, in Cappadócia, sanctórum Theódoti, Rufínæ et Ammiæ; quorum duo primi paréntes fuérunt sancti Mamántis Mártyris, quem Rufína in cárcere péperit, et Ammia educávit.

    Antisiodóri sancti Optáti, Epíscopi et Confessóris.

    In Anglia sancti Aidáni, Epíscopi Lindisfarnénsis; cujus ánimam, cum sanctus Cuthbértus, cujus memória tertiodécimo Kaléndas Aprílis cólitur, tunc óvium pastor, in cælum ferri vidísset, relíctis óvibus, factus est Mónachus.

    Apud Nuscum sancti Amáti Epíscopi.

    Athénis sancti Aristídis, fide et sapiéntia claríssimi, qui Hadriáno Príncipi egrégium de religióne Christiána volúmen óbtulit, nostri dogmátis cóntinens ratiónem; et quod Christus Jesus solus esset Deus, præsénte ipso Imperatóre, luculentíssime perorávit.
  en: |
    In England, holy Aidan, Bishop of Lindisfarne. Holy Cuthbert, who was then a shepherd lad, saw the soul of Aidan carried up into heaven, and he thereupon left his sheep and became a monk.

    At Cardona, in Spain, the holy Confessor Cardinal Raymond, surnamed the Unborn, of the Order of Blessed Mary of Ransom for the Redemption of Prisoners, a man famous for the holiness of his life, and for his wondrous works, whose feast we keep upon the first day of September.

    At Trier, holy Paulinus, Bishop. In the time of the persecution under the Arians he was exiled by Constantius the Arian Emperor on account of his Catholic belief, and when he had been wearied out by changing the places of his exile, even beyond the bounds of Christendom, he at length died in Phrygia, and received a crown from the Lord in reward of his blessed sufferings.

    Likewise the holy martyrs Robustian and Mark.

    At Trasacco, on the Lake of Celano, the holy martyrs Caesidius the Priest and his Companions, who were crowned with martyrdom in the persecution under the Emperor Maximin.

    At Cassarea, in Cappadocia, holy Theodotus, Rufina, and Ammia. Theodotus and Rufina were the father and mother of the holy martyr Mamas. Rufina gave him birth in prison, and Ammia was his nurse.

    At Athens, the holy Aristides, a man illustrious for his faith and wisdom, who offered to the Emperor Hadrian a book upon the Christian religion, containing an exposition of our doctrine, and delivered a most able discourse in the presence of the said Emperor, to prove that Christ Jesus is the only God.

    At Auxerre, the holy Confessor Optatus, Bishop.

    At Nusco, holy Amatus, Bishop.

    At Monte Senario, hard by Florence, the blessed Confessor Bonajuncta [Manetti,] one of the Seven Founders of the Order of Servants of the Blessed Virgin Mary, who gave up the ghost into the Lord's hands as he was discoursing to his brethren concerning the same Lord's Passion.
status:
  la: verified
  en: verified
