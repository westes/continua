# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "05-07"
text:
  la: |
    Sancti Stanislái, Epíscopi Cracoviénsis et Mártyris, qui sequénti die corónam martýrii consecútus est.

    Tarracínæ, in Campánia, natális beátæ Fláviæ Domitíllæ, Vírginis et Mártyris; quæ, cum esset fília sanctæ Plautíllæ, soróris sancti Mártyris Flávii Cleméntis Cónsulis, et sacro velámine fuísset a sancto Cleménte Pontífice consecráta, primum, in persecutióne Domitiáni, ob testimónium Christi, in ínsulam Póntiam, cum áliis plúrimis, exsílio deportáta, longum illic martýrium duxit. Novíssime vero, Tarracínam dedúcta, ibi, cum plúrimos doctrína et miráculis ad Christi fidem convertísset, Júdicis jussu incénso cubículo, in quo simul cum suis virgínibus Euphrósyna et Theodóra morabátur, cursum gloriósi martýrii consummávit. Ipsa vero Domitílla, una cum sanctis Martýribus Néreo et Achílleo atque Pancrátio, féstiva celebritáte quarto Idus mensis hujus recólitur.

    Eódem die sancti Juvenális Mártyris.

    Nicomedíæ sanctórum Mártyrum fratrum Flávii, Augústi et Augustíni.

    Ibídem sancti Quadráti Mártyris, qui, in persecutióne Décii Imperatóris, sǽpius ad torménta repetítus, demum, cápite truncátus, martýrium complévit.

    Eboráci, in Anglia, sancti Joánnis Epíscopi, vita et miráculis clari.

    Pápiæ sancti Petri Epíscopi.

    Romæ Translátio córporis sancti Stéphani Protomártyris, quod, Pelágio Primo Summo Pontífice, e Constantinópoli ad Urbem allátum atque in sepúlcro sancti Lauréntii Mártyris in agro Veráno pósitum, ibídem magna piórum religióne cólitur.
  en: |
    At Krakow, in Poland, the holy Bishop and martyr Stanislaw, slain by the wicked king Boleslaw II.

    At Tarracina, in Campania, the blessed Virgin and martyr Flavia Domitilla. She was sister's daughter to the Consul Flavius Clemens, and had been consecrated with the sacred veil by holy Clement. In the persecution under Domitian she and very many others were banished into the island of Ponza for bearing witness to Christ, and there she endured a long martyrdom. Last of all she was brought to Tarracina, where by her teaching and miracles she turned many to believe in Christ, and then finished the glorious course of her testimony by being burnt in her bed-chamber, wherein she dwelt along with her maidens Euphrosyne and Theodora. Her memory is kept upon the 12th day of May, along with that of the holy martyrs Nereus and Achilles.

    [At Benevento,] the holy martyr Juvenal.

    At Nicomedia, the holy brethren Flavius Augustus and Augustine, martyrs.

    There also, in the persecution under the Emperor Decius, the holy martyr Quadratus, who was oftentimes put to the torture, and at last beheaded.

    At York, in England, the holy John Bishop, famous for his life and miracles, whose feast we keep upon the 25th day of October.

    At Pavia, the holy Peter, Bishop.

    At Rome is commemorated the translation of the body of the holy proto-martyr Stephen, which the Supreme Pontiff Pelagius brought to Rome from Constantinople, and laid in the sepulchre of the holy martyr Laurence, outside the walls, where it is held in great reverence by the godly.
