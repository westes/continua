# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-20"
text:
  la: |
    Sancti Joánnis Cántii, Presbýteri et Confessóris, qui nono Kaléndas Januárii obdormívit in Dómino.

    In Aviénsi civitáte, prope Aquilam, in Vestínis, natális beáti Máximi, Levítæ et Mártyris; qui, patiéndi desidério, inquiréntibus se persecutóribus palam osténdit, et, post responsiónis constántiam, equúleo suspénsus ac tortus, deínde fústibus cæsus, ad últimum, e sublími loco præcipitátus, occúbuit.

    Agénni, in Gállia, sancti Caprásii Mártyris, qui, cum rábiem persecutiónis declínans latéret in spelúnca, tandem, áudiens quáliter beáta Fides Virgo pro Christo agonizáret, índeque animátus ad tolerántiam passiónum, orávit ad Dóminum, ut, si eum glória martýrii dignum judicáret, ex lápide spelúncæ limpidíssima aqua manáret; quod cum Dóminum præstitísset, secúrus ad áream certáminis properávit, et palmam martýrii, sub Maximiáno Imperatóre, fórtiter dimicándo proméruit.

    Antiochíæ sancti Artémii, Ducis Augustális, qui, sub Constantíno Magno præcláris milítiæ honóribus functus, a Juliáno Apóstata, quem sævítiæ in Christiános argúerat, fústibus cædi, aliísque torméntis afflígi, ac demum cápite truncári jubétur.

    Constantinópoli sancti Andréæ Creténsis Mónachi, qui ob cultum sacrárum Imáginum, sub Constantíno Coprónymo, sǽpius verberátus, tandem, amputáto áltero pede, réddidit spíritum.

    Colóniæ Agrippínæ pássio sanctárum Vírginum Marthæ et Saulæ, cum áliis plúribus.

    Apud Nabántiam, in Lusitánia, sanctæ Irénes, Vírginis et Mártyris; cujus corpus honorífice sepúltum fuit in óppido Scálabi, quod ipsíus Sanctæ nómine insignítum inde permánsit.

    Alsóntiæ, in território Rheménsi, sancti Sindúlphi, Presbýteri et Confessóris.

    Apud Mindam, in Germánia, Translátio sancti Feliciáni, Epíscopi Fulginátis et Mártyris; cujus ibi depósita fuit sacrárum pars reliquiárum, quæ in Germániam advéctæ sunt ex Umbriæ civitáte Fulgíneo, ubi ipse nono Kaléndas Februárii passus quondam fúerat.

    Lutétiæ Parisiórum item Translátio sanctórum Mártyrum Geórgii Diáconi, et Aurélii, ex urbe Hispániæ Córduba, in qua olim, una cum áliis tribus Sóciis, ambo martýrium compléverant sexto Kaléndas Augústi.
  en: |
    Upon the same 20th day of October, were born into the better life:

    At Avia, near Aquila, in the Abruzzi, the blessed martyr Maximus the Levite. From his desire to suffer he showed himself when the persecutors sought for him, when he was interrogated he answered with steadfastness, was tortured upon the rack, then cudgelled, and at last thrown down from an high place, and so slain.

    At Agen, in Gaul, the holy martyr Caprasius. He had escaped from the fury of the persecution, and was lying hid in a cave, when he heard how the blessed Virgin Faith was suffering for Christ's sake. Then he was stirred up to bear suffering likewise, and he prayed the Lord that if He judged him also to be worthy of the glory of martyrdom He would cause a spring of clear water to break forth from the rock of the cave, which thing when the Lord granted, Caprasius went back confidently to the field of battle, and gained the crown of martyrdom by a noble contention.

    At Antioch, the holy Augustal Prefect Artemius, who had been distinguished for the highest military service under the Emperor Constantine the Great, but when he rebuked the Emperor Julian the Apostate for his cruelty toward the Christians, Julian commanded him to be cudgelled, tortured, and beheaded.

    At Constantinople, holy Andrew of Crete, Monk, who, for the veneration of holy Images, was under Constantine Copronymus oftentimes scourged, and at last, one of his feet being cut off, gave up his spirit.

    At Cologne, the holy Virgins Martha and Saula, and others, all martyrs.

    At Minden, the holy martyr Bishop Felician.

    At Paris the holy martyrs George the Deacon and Aurelius, of whom mention is made upon the 27th day of July.

    In Portugal, suffered, the holy Virgin and martyr Irene.

    At Reims, deceased, the holy Confessor Sindulph.
status:
  la: verified
  en: verified
