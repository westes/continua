# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-08"
text:
  la: |
    Sanctórum Mártyrum Cyríaci Diáconi, Largi et Smarágdi, qui, cum áliis vigínti Sóciis, passi sunt décimo séptimo Kaléndas Aprílis. Eórum córpora, via Salária a Joánne Presbýtero sepúlta, sanctus Marcéllus Papa in prǽdium Lucínæ, via Ostiénsi, hoc die tránstulit; quæ póstea, in Urbem deláta, in Diaconía sanctæ Maríæ in via Lata fuérunt recóndita.

    Anazárbi, in Cilícia, sancti Maríni senis, qui, sub Diocletiáno Imperatóre et Lýsia Prǽside, cæsus flagris, in ligno suspénsus ac laniátus, feris tandem objéctus intériit.

    Item sanctórum Mártyrum Eleuthérii et Leónidæ, qui per ignem martýrium consummárunt.

    In Pérside sancti Hormísdæ Mártyris, sub Sápore Rege.

    Cýzici, in Hellespónto, sancti Æmiliáni Epíscopi, qui, pro sacrárum Imáginum cultu a Leóne Imperatóre multa passus, demum in exsílio vitam finívit.

    In Creta sancti Myrónis Epíscopi, miráculis clari.

    Viénnæ, in Gállia, sancti Sevéri, Presbýteri et Confessóris; qui ex India, Evangélii prædicándi causa, laboriósam peregrinatiónem suscépit, et, cum ad præfátam urbem devenísset, ingéntem Paganórum multitúdinem verbo et miráculis ad Christi fidem convértit.
  en: |
    Of the holy martyrs Cyriacus the Deacon, Largus and Smaragdus, who with twenty other Companions suffered on the 16th day of March. Their bodies, buried on the Salarian Way by John the Priest, holy Pope Marcellus translated on this day to the estate of Lucina, on the Ostian Way; and afterwards, brought into the City, they were laid in the Diaconate of St. Mary in Via Lata.

    At Anazarbus, in Cilicia, holy Marinus the Elder. Under the Emperor Diocletian and the President Lysias he was flogged, tied to a beam, and mangled, and at last thrown to wild beasts.

    Likewise, the holy martyrs Eleutherius and Leonides, who finished their martyrdom, by fire.

    In Persia, under King Sapor, the holy martyr Hormisdas.

    At Cyzicus, upon the Hellespont, holy Aemilianus, Bishop, who suffered much at the hands of the Emperor Leo on account of the worship of the holy images, and at last died in exile.

    In Crete, holy Myron, Bishop, famous for miracles.

    At Vienne, in Gaul, the holy Confessor Severus, a Priest, who undertook a wearisome pilgrimage from India in order to preach the Gospel, and when he came to the aforesaid city, by his word and miracles brought a vast multitude of heathen to believe in Christ.
