# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "07-11"
text:
  la: |
    Romæ sancti Pii Primi, Papæ et Mártyris; qui martýrio coronátus est in persecutióne Marci Aurélii Antoníni.

    Bergómi sancti Joánnis Epíscopi, qui, ob tuéndam cathólicam fidem, ab Ariánis occísus est.

    Sidæ, in Pamphýlia, sancti Cindéi Presbýteri, qui, sub Diocletiáno Imperatóre et Stratoníco Prǽside, post multa torménta, injéctus in ignem et nil læsus, demum in oratióne réddidit spíritum.

    Córdubæ, in Hispánia, sancti Abúndii Presbýteri, qui, in persecutióne Arábica, cum in Mahumétis sectam inveherétur, martýrio coronátus est.

    Nicópoli, in Arménia, natális sanctórum Mártyrum Januárii et Pelágiæ, qui, equúleo, úngulis et testárum fragméntis per dies quátuor cruciáti, martýrium implevérunt.

    In território Senonénsi sancti Sidronii Mártyris.

    Icónii, in Lycaónia, sancti Marciáni Mártyris, qui, sub Perénnio Prǽside, per multa torménta pervénit ad palmam.

    Bríxiæ sanctórum Mártyrum Savíni et Cypriáni.

    In território Pictaviénsi sancti Sabíni Confessóris.
  en: |
    At Rome, the blessed martyr Pope Pius I., who was crowned with martyrdom in the persecution under the Emperor Marcus Aurelius Antoninus.

    At Nicopolis, in Armenia, the holy martyrs Januarius and Pelagia, who finished their testimony after having been tormented for four days with the rack, with hooks, and with potsherds.

    In the country of Sens, the holy martyr Sidronius.

    At Iconium, the holy martyr Marcian, who under the President Perennius through many torments attained the palm.

    At Side, in Pamphylia, the holy Priest Cindeus. In the persecution under the Emperor Diocletian, the President Stratonicus caused him to be many ways tormented, and afterwards cast into the fire there he remained unhurt, but afterwards, while he was praying, gave up the ghost.

    At Brescia, the holy martyrs Savinus and Cyprian.

    At Bergamo, holy John, Bishop, who was slain by the Arians for guarding the Catholic faith.

    At Cordova, the holy Priest Abundius, who was crowned with martyrdom, for inveighing against Mohammedanism.

    In the country of Poitiers, the holy Confessor Sabinus.
