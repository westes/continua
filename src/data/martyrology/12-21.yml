# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-21"
text:
  la: |
    Calamínæ natális beáti Thomæ Apóstoli, qui Parthis, Medis, Persis et Hyrcánis Evangélium prædicávit; ac demum in Indiam pervénit, ibíque, cum eos pópulos in Christiána religióne instituísset, Regis jussu lánceis transfíxus occúbuit. Ipsíus relíquiæ primo ad urbem Edéssam, in Mesopotámia, deínde Ortónam, apud Frentános, translátæ sunt.

    Fribúrgi Helvetiórum item natális sancti Petri Canísii, Sacerdótis e Societáte Jesu et Confessóris, doctrína et sanctitáte præclári; qui, difficíllimis Germániæ tempóribus, fidem cathólicam strénue deféndit ac propagávit. Eum vero Pius Undécimus, Póntifex Máximus, Sanctórum catálogo adscrípsit, simúlque Doctórem universális Ecclésiæ declarávit, et ipsíus festum quinto Kaléndas Maji agéndum esse decrévit.

    Antiochíæ sancti Anastásii, Epíscopi et Mártyris; qui, Phocæ Imperatóris témpore, a Judǽis, in seditióne ab ipsis contra Christiános facta, sævíssime necátus est.

    Nicomedíæ sancti Glycérii Presbýteri, qui, in persecutióne Diocletiáni, multis torméntis vexátus, demum, in ignem conjéctus, martýrium consummávit.

    In Túscia sanctórum Mártyrum Joánnis et Festi.

    In Lýcia sancti Themístoclis Mártyris, qui, sub Décio Imperatóre, pro sancto Dióscoro, qui quærebátur ad necem, se óbtulit, et, equúleo tortus, raptátus ac fústibus cæsus, martýrii corónam adéptus est.

    Tréviris sancti Severíni, Epíscopi et Confessóris.
  en: |
    Upon the Coromandel coast of India, not far from Madras, the blessed Apostle Thomas. He preached the Gospel to the Parthians, Medes, Persians, and Hyrcanians, and at length came into India, and was teaching the Christian religion to those people when the king commanded him to be run through with lances, and so he died. His relics were taken first to the city of Edessa and afterwards to Ortona.

    At Fribourg, in Switzerland, likewise the birthday of holy Peter Canisius, Priest of the Society of Jesus and Confessor, renowned for learning and holiness; who, in the hard times of Germany, stoutly defended and spread the Catholic faith. Pope Pius XI enrolled him in the roll of the Saints, and at the same time declared him Doctor of the universal Church, and decreed that his feast should be kept upon the 27th day of April.

    In Tuscany, the holy martyrs John and Festus.

    In Lycia, the holy martyr Themistocles. Under the Emperor Decius he gave himself up for holy Dioscorus, when they were seeking after him to slay him, and was first racked, taken down and dragged about, and beaten with cudgels, gained the crown of martyrdom.

    At Nicomedia, the holy Priest Glycerius, who suffered many torments in the persecution under the Emperor Diocletian, and was at length cast in the fire, and so finished his testimony.

    At Antioch, the holy martyr Anastasius, Bishop, who was  cruelly murdered by the Jews in the  time of the Emperor Phocas.

    At Trier, the holy Confessor Severinus, Bishop.
