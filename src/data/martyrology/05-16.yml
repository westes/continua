# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "05-16"
text:
  la: |
    Burdigálæ, in Aquitánia, sancti Símonis, cognoménto Stock, eo quod aliquándo in trunco cavæ quércus habitásset, Confessóris, Ordinis Carmelitárum; qui, singulári erga Vírginem Deíparam devotióne, ab ea sacrum scapuláre sui Ordinis obtinére méruit, et, post multos in ejúsdem Ordinis regímine labóres exantlátos, miráculis clarus ad ætérnam mercédem accipiéndam migrávit.

    Eugúbii sancti Ubáldi, Epíscopi et Confessóris, miráculis clari.

    Antisiodóri pássio sancti Peregríni, qui fuit primus ejúsdem civitátis Epíscopus. Hic, a beáto Xysto Papa Secúndo in Gállias, una cum áliis Cléricis, missus, ibi, Evangélicæ prædicatiónis múnere expléto, capitáli senténtia damnátus corónam méruit sempitérnam.

    In Pérside sanctórum Mártyrum Audæ Epíscopi, septem Presbyterórum, novem Diaconórum, et septem Vírginum; qui sub Isdegérde Rege, váriis tormentórum genéribus cruciáti, gloriósum martýrium complevérunt.

    Pragæ, in Bohémia, sancti Joánnis Nepomucéni, Metropolitánæ Ecclésiæ Canónici; qui, frustra tentátus ut sigílli sacramentális fidem próderet, martýrii palmam, in flumen Moldávam dejéctus, eméruit.

    In Isáuria natális sanctórum Mártyrum Aquilíni et Victoriáni.

    Uzali, in Africa, sanctórum Mártyrum Felícis et Gennádii.

    In Palæstína pássio sanctórum Monachórum, a Saracénis in laura sancti Sabbæ interfectórum.

    Janóviæ, apud Pinsk, in Polésia, sancti Andréæ Bobóla, Sacerdótis e Societáte Jesu, qui, a schismáticis innumerabília tormentórum génera perpéssus, illústri martýrio coronátus est.

    Ambiáni, in Gállia, sancti Honoráti Epíscopi.

    Apud Cenómanos, in Gállia, sancti Dómnoli Epíscopi.

    Mirándulæ, in Æmília, sancti Possídii, Calaménsis in Numídia Epíscopi, qui fuit sancti Augustíni discípulus, ejúsque præcláram vitam scripsit.

    In monastério Enachduinénsi, in Hibérnia, tránsitus sancti Brendáni, Presbýteri et Clonferténsis Abbátis.

    Trecis, in Gállia, sancti Fídoli Confessóris.

    Apud Forum Júlii, in Gállia, sanctæ Máximæ Vírginis, quæ, multis clara virtútibus, in pace quiévit.
  en: |
    At Bordeaux, in Aquitaine, the holy Confessor Simon, surnamed Stock, for that he lived at one time in the stock of an hollow oak, of the Order of Carmelites, who by his singular devotion toward the Virgin Mother of God won to obtain of her the sacred scapular of his Order, and, after many labours borne in the governing of the same her Order, passed away famous for miracles, to receive his everlasting reward.

    At Gubbio, holy Ubald, Bishop who was famous for miracles, and whose feast we keep upon the 22nd day of this present month of May.

    At Auxerre, suffered the holy martyr Peregrin, first Bishop of that city, who was sent into Gaul with other clerks by blessed Pope Sixtus II, and, when he had finished the work preaching the Gospel, was condemned to be beheaded, and so earned a crown of life that fadeth not away.

    In Persia, the holy martyrs Bishop Audas, seven Priests, nine Deacons, and seven Virgins, who suffered diverse tortures under King Isdegerd, and so finished a glorious testimony.

    At Prague, in Bohemia, holy John of Nepomuc, Canon of the Metropolitical Cathedral Church in that city, who, when he had been vainly tried to make him violate the seal of sacramental confession, was cast into the river Moldau, and so earned the palm of martyrdom. We keep feast in his honour upon the 30th day of this present month of May.

    In Isauria, the holy martyrs Aquilinus and Victorian.

    At Usal, in Africa, the holy martyrs Felix and Gennadius.

    In Palestine, the passion of the holy monks who were massacred by the Saracens in the Monastery of St Saba.

    At Janow, near Pinsk, in Polesia, holy Andrew Bobola, Priest of the Society of Jesus, who, after enduring at the hands of schismatics countless kinds of torments, was crowned with a glorious martyrdom.

    At Amiens, in Gaul, the holy Confessor Honore, Bishop.

    At Mans, the holy Confessor Domnolus, Bishop.

    At Mirandola, in Emilia, the holy Possidius, Bishop of Calama, in Numidia, a disciple of holy Augustine, and writer of his famous life.

    In Ireland, the holy Brendan, Abbot.

    At Troyes, the holy Confessor Fidolus.

    At Frejus, the holy Virgin Maxima, who fell asleep in peace, famous for many excellences.
