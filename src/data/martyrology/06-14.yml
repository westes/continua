# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "06-14"
text:
  la: |
    Sancti Basilíi, cognoménto Magni, Confessóris et Ecclésiæ Doctóris, qui Kaléndis Januárii obdormívit in Dómino, sed hac die potíssimum cólitur, qua Cæsariénsis in Cappadócia Epíscopus ordinátus est.

    Samaríæ, in Palæstína, sancti Eliséi Prophétæ, cujus sepúlcrum, ubi et Prophéta quiéscit Abdías, a dæmónibus perhorrésci sanctus Hierónymus scribit.

    Syracúsis, in Sicília, sancti Marciáni Epíscopi, qui, a beáto Petro Apóstolo ordinátus Epíscopus, ibídem, post Evangélii prædicatiónem a Judǽis occísus est.

    Córdubæ, in Hispánia, sanctórum Mártyrum Anastásii Presbýteri, Felícis Mónachi, et Dignæ Vírginis.

    Apud Suessiónes, in Gálliis, sanctórum Mártyrum Valérii et Rufíni, qui, in persecutióne Diocletiáni, a Prǽside Rictiováro, post multa torménta, jussi sunt decollári.

    Constantinópoli sancti Methódii Epíscopi.

    Viénnæ, in Gállia, sancti Æthérii Epíscopi.

    Apud Rhuténos, in Gállia, sancti Quinctiáni Epíscopi.
  en: |
    On the morrow we keep the feast of holy Basil, styled "the Great," Archbishop of Caesarea, in Pontus, Confessor and Doctor of the Church, of whom mention is made upon the 1st day of January, and on the 14th day of June, of his ordination to his see of Caesarea. In the time of the Emperor Valens he shone as a marvellous light, illustrious for teaching and wisdom, and shining with all graces, and defended the Church with wonderful firmness against the Arians and Macedonians.

    At Samaria, in Palestine, the holy Prophet Elisha. Holy Jerome writeth that the devils shrink from his grave, where also resteth the Prophet Obadiah.

    At Syracuse, the holy Marcian, Bishop, who was ordained Bishop by the blessed Apostle Peter. After he had preached the Gospel he was slain by the Jews.

    At Soissons, the holy martyrs Valerius and Rufinus, who after suffering diverse torments were beheaded by order of the President Rictiovarus in the persecution under Diocletian.

    At Cordova, the holy martyrs Anastasius a Priest, Felix a monk, and Digna a Virgin.

    At Constantinople, holy Methodius, Archbishop.

    At Vienne, holy Aetherius, Bishop.

    At Rodez, holy Quinctian, Bishop [first of that see and afterward of Clermont.]
