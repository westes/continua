# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-22"
text:
  la: |
    Octáva Assumptiónis beátæ Maríæ Vírginis.

    Festum Immaculáti Cordis ejúsdem beátæ Vírginis Maríæ.

    Romæ, via Ostiénsi, natális sancti Timóthei Mártyris, qui, a Præfécto Urbis Tarquínio tentus, et longa cárceris custódia macerátus, et, cum sacrificáre idólis noluísset, tértio cæsus et gravíssimis supplíciis attrectátus, ad últimum decollátus est.

    In Portu Románo sancti Hippólyti Epíscopi, eruditióne claríssimi, qui, sub Alexándro Imperatóre, ob præcláram fídei confessiónem, mánibus pedibúsque ligátis in altam fóveam, aquis plenam, præcipitátus, martýrii palmam accépit; cujus corpus apud eúndem locum a Christiánis sepúltum fuit.

    Augustodúni sancti Symphoriáni Mártyris, qui, témpore Aureliáni Imperatóris, cum sacrificáre nollet idólis, primo verbéribus afflíctus est, deínde cárceri mancipátus; atque ad últimum, cæso cápite, martýrium consummávit.

    Tudérti, in Umbria, natális sancti Philíppi Benítii, Confessóris, Florentíni, qui Ordinis Servórum beátæ Maríæ Vírginis éxstitit propagátor et exímiæ humilitátis vir; atque a Cleménte Décimo, Pontífice Máximo, Sanctórum número adscríptus est. Ipsíus autem festívitas sequénti die celebrátur.

    Romæ sancti Antoníni Mártyris, qui, cum se Christiánum líbera voce faterétur, senténtia capitáli a Júdice Vitéllio damnátus est, et a Rufino Presbýtero via Aurélia sepúltus.

    Tarsi, in Cilícia, commemorátio sanctórum Athanásii, Epíscopi et Mártyris, Anthúsæ, nóbilis féminæ, quam ipse baptizáverat, ac simul Charísii et Neóphyti Mártyrum, ejúsdem Anthúsæ servórum, qui sub Valeriáno Imperatóre passi sunt.

    In Portu Románo sanctórum Mártyrum Martiális, Saturníni, Epictéti, Maprílis et Felícis, cum Sóciis eórum.

    Nicomedíæ pássio sanctórum Agathoníci, Zótici et Sociórum Mártyrum, sub Maximiáno Imperatóre et Eutólmio Prǽside.

    Rhemis, in Gállia, sanctórum Mártyrum Mauri et Sociórum.

    In Hispánia sanctórum Mártyrum Fabriciáni et Philibérti.

    Papíæ sancti Gunifórti Mártyris.
  en: |
    The feast of the Immaculate Heart of the same blessed Virgin Mary.

    At Rome, upon the Ostian Way, the holy martyr Timothy. He was tried by Tarquinius, Prefect of the city, and suffered a long imprisonment, and forasmuch as he would not sacrifice to idols, he was then hided, put to horrid tortures, and at length beheaded.

    At Porto, holy Hippolytus, Bishop, a man of eminent learning, who received the palm of martyrdom under the Emperor Alexander, on account of his illustrious confession of the faith, for the which he had his hands and feet tied and was cast into a deep pit full of water his body was buried by the Christians at the same place.

    At Autun, the holy martyr Symphorian, who finished his testimony in the time of the Emperor Aurelian, because he would not sacrifice unto idols, being first beaten, then imprisoned, and in the end beheaded.

    At Todi, in Umbria, the birthday of holy Philip Benizi, Confessor, of Florence, who was a spreader of the Order of Servants of the blessed Virgin Mary and a man of eminent lowliness; and was enrolled among the Saints by Pope Clement X. His feast is kept upon the next day.

    At Rome, the holy martyr Antoninus. He openly professed himself a Christian, and therefore was sentenced to death by Vitellius the judge, and was buried upon the Aurelian Way.

    Likewise at Porto, the holy martyrs Martial, Saturninus, Epictetus, Maprilis, and Felix, and their Companions.

    At Nicomedia, under the Emperor Maximian and the President Eutholomius, the holy martyrs Agathonicus, Zoticus, and their Companions.

    At Tarsus, under the Emperor Valerian, the holy martyrs Athanasius, Bishop, the noble lady Anthusa, whom he had baptized, and two of her slaves, [called Charisius and Neophytus.]

    At Reims, the holy martyrs Maurus and his [forty-nine] Companions.

    In Spain, the holy martyrs Fabrician and Philibert.

    At Pavia, the holy martyr Gunifort.
status:
  la: verified
  en: verified
