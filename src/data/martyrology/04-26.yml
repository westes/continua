# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-26"
text:
  la: |
    Romæ natális beáti Cleti, Papæ et Mártyris; qui, secúndus post Apóstolum Petrum, rexit Ecclésiam, et martýrio in persecutióne Domitiáni coronátus est.

    Sancti Marcellíni, Papæ et Mártyris, cujus dies natális octávo Kaléndas Novémbris recensétur.

    Amaséæ, in Ponto, sancti Basiléi, Epíscopi et Mártyris, qui, sub Licínio Imperatóre, illústre martýrium consummávit. Ipsíus autem corpus, in mare projéctum, et ab Elpidíphoro, Angeli mónitu repértum, honorífice tumulátum fuit.

    Brácari, in Lusitánia, sancti Petri Mártyris, qui fuit primus ejúsdem civitátis Epíscopus.

    Viénnæ, in Gállia, sancti Claréntii, Epíscopi et Confessóris.

    Verónæ sancti Lucídii Epíscopi.

    In monastério Céntula, in Gállia, sancti Richárii, Presbýteri et Confessóris.

    Trecis, in Gállia, sanctæ Exsuperántiæ Vírginis.
  en: |
    At Rome, the blessed Pope Cletus. He was the second who ruled the Church after the Apostle Peter, and was crowned with martyrdom in the persecution under the Emperor Domitian.

    There also the holy martyr Pope Marcellinus, who was beheaded for Christ's faith's sake, in the persecution under the Emperor Maximian, along with Claudius, Cyrinus, and Antonine, at the time when the persecution was so great that seventeen thousand Christians were crowned with martyrdom within the space of one month.

    At Amasea, in Pontus, the holy martyr Basil, Bishop of that see, who gained an illustrious martyrdom under the Emperor Licinius. His body was cast into the sea, but was found by Elpidiphorus on the warning of an angel and was honourably buried.

    At Braga, in Portugal, the holy martyr Peter, first Bishop of that city.

    At Vienne, the holy Confessor Clarence, Bishop of that see.

    At Verona, holy Lucidius, Bishop of that see.

    In the monastery of Centule, the holy Confessor, the Priest Requier.

    At Troyes, the holy virgin Exuperantia.
status:
  la: verified
  en: verified
