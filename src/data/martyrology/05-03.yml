# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "05-03"
text:
  la: |
    Hierosólymis Invéntio sacrosánctæ Crucis Domínicæ, sub Constantíno Imperatóre.

    Romæ, via Nomentána, pássio sanctórum Mártyrum Alexándri Papæ Primi, Evéntii et Theodúli Presbyterórum. Ex his Alexánder, sub Hadriáno Príncipe et Aureliáno Júdice, post víncula, cárceres, equúleum, úngulas et ignes, punctis crebérrimis per tota membra confóssus ac perémptus est; Evéntius vero et Theodúlus, post longos cárceres, ígnibus examináti, ad últimum decolláti sunt.

    Narniæ sancti Juvenális, Epíscopi et Confessóris.

    Apud montem Senárium, in Etrúria, natális sanctórum Sostenǽi et Ugucciónis Confessórum, e septem Fundatóribus Ordinis Servórum beátæ Maríæ Vírginis; qui, cǽlitus admóniti, eádem die et hora, salutatiónem Angélicam recitántes, e vita migrárunt. Ipsórum autem ac Sociórum festum prídie Idus Februárii celebrátur.

    Constantinópoli sanctórum Mártyrum Alexándri mílitis, et Antonínæ Vírginis. Hæc, in persecutióne Maximiáni, sub Prǽside Festo, ad lupánar damnáta, et ab Alexándro, qui pro ipsa ibi remánserat, mutátis véstibus clam edúcta, cum eo póstmodum jussa est torquéri; et ambo simul in ignem, præcísis mánibus, pro Christo sunt injécti, atque ita, egrégio perácto certámine, coronántur.

    In Thebáide sanctórum Mártyrum Timóthei et Mauræ cónjugis, quos Ariánus Præféctus, post multa torménta, cruci jussit affígi; in qua, per novem dies cum vivi pependíssent ac se ipsos in fide roborássent, martýrium consummárunt.

    Aphrodísiæ, in Cária, sanctórum Mártyrum Diodóri et Rhodopiáni, qui, in persecutióne Diocletiáni Imperatóris, a cívibus suis lapidáti sunt.
  en: |
    It is commemorated the finding at Jerusalem in the time of the Emperor Constantine of the Most Holy Cross of the Lord.

    Upon the same day, were born into the better life: At Rome, upon the Nomentan Way, the holy martyrs Pope Alexander I., and the priests Eventius and Theodulos. Under the Emperor Hadrian and the judge Aurelian, Alexander suffered chains and imprisonment, racking, tearing with hooks, and fire, and was at length put to death by small stabs over his whole body. Eventius and Theodulos were long imprisoned, then examined under torture by fire, and at last beheaded.

    At Narni, the holy Confessor Juvenal, Bishop of that see.

    At Constantinople, the holy martyrs Alexander the Soldier, and Antonina the Virgin. In the persecution under the Emperor Maximian the President Festus condemned her to a brothel Alexander awaited her there, changed clothes with her, and so enabled her to escape. For this reason they were put to the torture together, and when both had had their hands cut off, they were together cast into the fire for Christ's sake, and having so finished together their noble contending, were crowned together.

    In the Thebaid, the holy martyrs Timothy and Myra his wife. The Prefect Arian, after putting them to diverse torments, ordered them to be crucified together. They hung upon the cross alive for nine days, the one strengthening the other in the faith, and so together at last finished their testimony.

    At Aphrodisia, in Karia, the holy martyrs Diodorus and Rodopian, who were stoned to death by their fellow-citizens during the persecution under the Emperor Diocletian.

    Upon Mount Senario, near Florence, the blessed Confessors Sosthenes and Uguccio, two of the seven founders of the Order of Servants of the Blessed Virgin Mary, who departed this life upon the same day and at the same hour, as they were repeating the angelic salutation, even as had been foretold to them from heaven.
status:
  la: verified
  en: verified
