# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "05-23"
text:
  la: |
    Apud Língonas, in Gállia, pássio sancti Desidérii Epíscopi, qui, cum plebem suam ab exércitu Wandalórum vexári cérneret, ad Regem eórum pro ea supplicatúrus accéssit; a quo statim jugulári jussus, pro óvibus sibi créditis cervícem libénter exténdit, et, percússus gládio, migrávit ad Christum. Passi sunt autem cum ipso et álii plures de número gregis sui, qui apud eándem urbem cónditi sunt.

    In Hispánia sanctórum Mártyrum Epitácii Epíscopi, et Basiléi.

    In território Lugdunénsi sancti Desidérii, Epíscopi Viennénsis; qui, Theodoríci Regis jussu lapídibus óbrutus, martýrio coronátur.

    In Africa sanctórum Mártyrum Quinctiáni, Lúcii et Juliáni, qui, in persecutióne Wandálica passi, ætérnas corónas meruérunt.

    In Cappadócia commemorátio sanctórum Mártyrum, qui, in persecutióne Maximiáni Galérii, confráctis crúribus, necáti sunt; item eórum, qui eódem témpore, in Mesopotámia, appénsi pédibus in sublíme, cápite verso deórsum, suffocáti fumo et lento igne consúmpti, martýrium complevérunt.

    Sýnnadæ, in Phrýgia, sancti Michaélis Epíscopi.

    Ipso die sancti Mercuriális Epíscopi.

    Neápoli, in Campánia, sancti Euphébii Epíscopi.

    Romæ sancti Joánnis Baptístæ de Rossi, Presbýteri et Confessóris, patiéntia et caritáte in evangelizándis paupéribus insígnis.

    Apud Núrsiam sanctórum Eutýchii et Floréntii Monachórum, quorum méminit beátus Gregórius Papa.
  en: |
    At Langres, in Gaul, the holy Desiderius, Bishop. When he saw how the army of the Vandals were harrying his flock he went to plead for them with the Vandal king, who forthwith commanded his throat to be cut upon the spot and he cheerfully stretched out his neck for the sake of his sheep, and with the stroke of the sword passed away to be with Christ. There suffered along with him many others of his people, who are all buried in the same city.

    In Spain, the holy martyrs Epitacius the Bishop, and Basil.

    In the country of Lyon, the holy Desiderius, Bishop of Vienne, who was stoned to death by order of King Theodoric, and so obtained the crown of martyrdom.

    In Africa, the holy martyrs Quintian, Lucius, and Julian, who suffered in the persecution under the Vandals, and so obtained crowns that fade not away.

    In Cappadocia are commemorated those holy martyrs who, in the persecution under Maximian Galerius, were slain by having their thighs broken also they who, in Mesopotamia, were hung head downwards, and so finished their testimony by being choked with smoke and consumed by slow fire.

    At Synnada, the holy Michael, Bishop.

    On the same day the holy Mercurial, Bishop.

    At Naples, in Campania, the holy Euphebius, Bishop.

    At Rome, the holy Confessor John de' Rossi, famous for his patience and charity in preaching the Gospel to the poor.

    At Nursia, the holy monks Eutychius and Florence, of whom mention is made by blessed Pope Gregory the Great.
