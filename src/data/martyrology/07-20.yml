# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "07-20"
text:
  la: |
    Antiochíæ pássio sanctæ Margarítæ, Vírginis et Mártyris.

    In monte Carmélo sancti Elíæ Prophétæ.

    In Judǽa natális beáti Joseph, qui cognominátus est Justus, quem Apóstoli cum beáto Matthía statuérunt ut locum apostolátus Judæ proditóris impléret; sed, cum sors cecidísset super Matthíam, ipse, nihilóminus prædicatiónis et sanctitátis offício insérviens, multámque pro fide Christi a Judǽis persecutiónem sústinens, victorióso fine quiévit. De quo étiam refértur quod venénum bíberit, et nihil ex hoc triste propter Dómini fidem pertúlerit.

    Córdubæ, in Hispánia, sancti Pauli, Diáconi et Mártyris; qui, cum infidéles príncipes argúeret Mahuméticæ impietátis ac sævítiæ, et Christum constantíssime prædicáret, idcírco, eórum jussu necátus, ad prǽmia evolávit in cælum.

    Damásci sanctórum Mártyrum Sabíni, Juliáni, Máximi, Macróbii, Cássiæ et Paulæ, cum áliis decem.

    In Lusitánia sanctæ Wilgefórtis, Vírginis et Mártyris; quæ, pro Christiána fide ac pudicítia decértans, in cruce méruit gloriósum obtinére triúmphum.

    Eódem die natális sanctórum Flaviáni Secúndi, Epíscopi Antiochéni, et Elíæ, Epíscopi Hierosolymitáni; qui, pro Sýnodo Chalcedonénsi ab Anastásio Imperatóre ambo in exsílium acti, victóres migrárunt ad Dóminum.

    In pago Bononiénsi, in Gállia, sancti Vulmári Abbátis, admirándæ sanctitátis viri.

    Tréviris sanctæ Sevéræ Vírginis.
  en: |
    At Antioch, the holy Virgin and martyr Margaret.

    On Mount Carmel is commemorated the holy Prophet Elijah.

    The blessed Joseph called Barsabas, who was surnamed Justus, whom the Apostles appointed along with blessed Matthias that he might take part of the ministry and apostleship, from which Judas by transgression fell. The lot fell upon Matthias, but Joseph nevertheless served in the office of preaching and sanctification, and bore much persecution of the Jews for Christ's faith's sake. He fell asleep in Judea, in a triumphant end. It is told of him that he drank poison, and was unharmed thereby because of his faith in the Lord.

    At Cordova, the holy Deacon Paul. He rebuked the unbelieving princes for their Mohammedan ungodliness and cruelty and constantly preached Christ, wherefore the said princes commanded him to be slain, and he passed away, to receive a martyr's reward in heaven.

    At Damascus, the holy martyrs Sabinus, Julian, Maximus, Macrobius, Cassia, and Paula, and ten others.

    In Portugal, the holy Virgin and martyr Wilgefortes, who contended for Christian faith and chastity, and obtained a glorious triumph upon the Cross.

    Upon the same day, the birthday of the holy Flavian II, Bishop of Antioch, and Elias, Bishop of Jerusalem, who, for the Council of Chalcedon, were both driven into exile by the Emperor Anastasius, and departed victorious to the Lord.

    In the country of Boulogne, in Gaul, the holy Abbot Vulmar, a man of wonderful holiness.

    At Trier, the holy Virgin Severa.
