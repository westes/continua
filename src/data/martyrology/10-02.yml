# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-02"
text:
  la: |
    Festum sanctórum Angelórum Custódum.

    Romæ pássio sancti Modésti Sardi, Levítæ et Mártyris; qui, sub Diocletiáno Imperatóre, equúleo tortus atque igne adústus est. Ipsíus vero corpus, Benevéntum póstea translátum, in Ecclésia suo insigníta nómine collocátum fuit.

    In território Atrebaténsi item pássio beáti Leodegárii, Augustodunénsis Epíscopi; quem, váriis injúriis et divérsis supplíciis pro veritáte afflíctum, Ebroínus, Major domus régiæ Theodoríci, intérfici jussit.

    Nicomedíæ sancti Eleuthérii, mílitis et Mártyris, cum áliis innúmeris; qui, cum Diocletiáni régia incéndio conflagrásset et falso hujus críminis essent accusáti, omnes, jubénte eódem sævíssimo Imperatóre, acervátim necáti sunt. Horum porro álii gládiis obtruncabántur, álii cremabántur ígnibus, álii in mare præcipitabántur; sed inter eos primus Eleuthérius, cum per síngula torménta, diu cruciátus, valídior redderétur, martýrium victóriæ suæ, ígnibus velut aurum examinátus, complévit.

    Antiochíæ sanctórum Mártyrum Primi, Cyrílli et Secundárii.

    Eódem die sancti Geríni Mártyris, qui frater éxstitit beáti Leodegárii, Augustodunénsis Epíscopi, et, jubénte ipso Ebroíno, lapídibus óbrutus est.

    Constantinópoli sancti Theóphili Mónachi, qui, pro defensióne sanctárum Imáginum a Leóne Isáurico sævíssime cæsus et in exsílium pulsus, migrávit ad Dóminum.
  en: |
    At Rome, the passion of holy Modestus the Sardinian, Levite and martyr; who, under the Emperor Diocletian, was tortured on the rack and burned with fire. His body, afterward translated to Benevento, was laid in a church that bears his name.

    At Nicomedia, the holy soldier Eleutherius, and an unnumbered multitude of others, all martyrs.

    When the palace of the Emperor Diocletian was burnt, they were falsely accused of the crime of setting it on fire and by the command of that most cruel Emperor they were slaughtered in crowds some were slain with the sword, some were burnt in the fire, and some were cast into the sea. But the first of them was Eleutherius, who was long tortured, but at every new torment seemed to grow more steadfast, like gold tried in the fire, and crowned his testimony with victory.

    In the country of Arras, the blessed Leodegar, Bishop of Autun, who was murdered by Ebroin, mayor of the palace to King Theodoric, after he had laid upon him diverse insults and sufferings for the truth's sake.

    Likewise the holy martyr Gerin, brother of the said blessed Leodegar, who was stoned to death at the same place.

    At Antioch, the holy martyrs Primus, Cyril, and Secondarius.

    At Constantinople, the holy Monk Theophilus, who was cruelly scourged and sent into exile, under the Emperor Leo the Isaurian, for defending holy images, and passed away to be ever with the Lord.
status:
  la: verified
  en: verified
