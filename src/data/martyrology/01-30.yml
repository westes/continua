# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "01-30"
text:
  la: |
    Edéssæ, in Sýria, sancti Barsimǽi Epíscopi, qui, cum Gentíles plúrimos convertísset ad fidem et præmisísset ad corónam, eos secútus est, sub Trajáno, cum palma martýrii.

    Antiochíæ pássio beáti Hippólyti Presbýteri, qui, decéptus aliquándiu schísmate Nováti, sed, operánte grátia Christi, corréctus, ad unitátem Ecclésiæ rédiit, pro qua et in qua póstea illústre martýrium consummávit. Hic, rogátus a suis quænam secta vérior esset, exsecrátus est dogma Nováti, et, eam fidem dicens esse servándam quam Petri Cáthedra custodíret, júgulum prǽbuit.

    In Africa pássio sanctórum Mártyrum Feliciáni, Philippiáni et aliórum centum vigínti quátuor.

    Item beáti Alexándrí, qui, in persecutióne Décii, comprehénsus est, ac, longǽvæ ætátis veneránda canítie et confessióne iteráta respléndens, inter carníficum torménta réddidit spíritum.

    Edéssæ, in Sýria, sancti Barsis Epíscopi, dono curatiónum illústris; qui, a Valénte, Imperatóre Ariáno, in díssitas regiónes ob fidem cathólicam relegátus, ac tríplici mutatióne fatigátus exsílii, vitam finívit.

    Hierosólymis natális sancti Matthíæ Epíscopi, de quo mira et plena fídei gesta narrántur; qui, sub Hadriáno, multa pro Christo perpéssus est, ac demum in pace quiévit.

    Pápiæ sancti Armentárii, Epíscopi et Confessóris.

    In Malbódio, Hannóniæ monastério, sanctæ Aldegúndis Vírginis, témpore Dagobérti Regis.

    Vitérbii sanctæ Hyacínthæ de Mariscóttis Vírginis, ex tértio sancti Francísci Ordine Sanctimoniális, pæniténtia et caritáte insígnis; quam Pius Papa Séptimus Sanctis adscrípsit.

    Medioláni sanctæ Savínæ, féminæ religiosíssimæ, quæ, ad sepúlcra sanctórum Nabóris et Felícis Mártyrum orans, obdormívit in Dómino.

    In território Parisiénsi sanctæ Bathíldis Regínæ, sanctitáte et miraculórum glória præcláræ.
  en: |
    At Edessa, in Syria, the holy martyr Barsimceus, Bishop of that city, who converted many Gentiles to the faith, and sent them before him to the crown, but himself followed them with the palm of martyrdom under the Emperor Trajan.

    At Antioch, the blessed martyr Hippolytus. He was a Priest who had been led astray into the Novatian schism, but by the operation of the grace of Christ had corrected himself, and had returned into the unity of the Church, for which and within which he afterwards achieved a noble martyrdom. When he was asked by his people which were the true Body, he denied the doctrine of Novatus, and declared that the faith which men ought to keep is the faith which the See of Peter keepeth, and so offered his neck to the executioner.

    In Africa, the holy martyrs Felician, Philappian, and 124 others.

    Likewise the blessed Alexander. He was arrested in the persecution under the Emperor Decius, and died under the torture, venerable for his grey hairs and illustrious for his repeated confession.

    Likewise, at Edessa, holy Barsen, Bishop of that See, who was famous for the grace of healing, but who on account of his Catholic belief was banished to the uttermost parts of that country by the Arian Emperor Valens, and there finished his earthly life.

    At Jerusalem, holy Matthias, Patriarch of that place, of whom are narrated wondrous acts of faith. He suffered much for Christ's sake under the Emperor Hadrian, but at length fell asleep in peace.

    At Pavia, the holy Confessor Armentarius, Bishop of that See.

    In the monastery of Maubeuge, in Hainaut, in the time of King Dagobert, the holy Virgin Aldegundis.

    At Viterbo, the holy Virgin Hyacinth de' Mariscotti, a nun of the Third Order of St. Francis, eminent for penitence and for love, whose name Pope Pius VII enrolled with those of the saints.

    At Milan, holy Savina, a devout woman, who fell asleep in the Lord, while she was praying at the graves of the holy martyrs Nabor and Felix.

    In the country of Paris, holy Bathildes, Queen, illustrious for her holiness and the glory of her miracles.
status:
  la: verified
  en: verified
