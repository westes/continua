# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-06"
text:
  la: |
    In monastério Turris, diœcésis Squillacénsis, in Calábria, sancti Brunónis Confessóris, qui Ordinis Carthusianórum fuit Institútor.

    Laodicéæ, in Phrýgia, beáti Ságaris, Epíscopi et Mártyris; qui éxstitit unus de antíquis Pauli Apóstoli discípulis.

    Antisiodóri sancti Románi, ejúsdem sedis Epíscopi et Mártyris, qui Eleuthério successit et tres annos Epíscopus fuit.

    Cápuæ natális sanctórum Mártyrum Marcélli, Casti, Æmílii et Saturníni.

    Tréviris commemorátio innumerabílium fere Mártyrum, qui, in persecutióne Diocletiáni, sub Rictiováro Prǽside, ob Christi fidem, vario mortis génere necáti sunt.

    Agénni, in Gállia, natális sanctæ Fídei, Vírginis et Mártyris; cujus exémplo beátus Caprásius, ad martýrium animátus, agónem suum tertiodécimo Kaléndas Novémbris felíciter consummávit.

    Item sanctæ Erótidis Mártyris, quæ, Christi amóre succénsa, ignis superávit incéndium.

    Opitérgii, in Venetórum fínibus, sancti Magni Epíscopi, cujus corpus Venétiis requiéscit.

    Neápoli, in Campánia, deposítio sanctæ Maríæ-Francíscæ a Quinque Vulnéribus Dómini nostri Jesu Christi, Vírginis, ex tértio Ordine sancti Francísci, quæ, virtútibus et miráculis clara, a Pio Papa Nono sanctis Virgínibus adscrípta fuit.
  en: |
    In Calabria, the holy Confessor Bruno, Founder of the Order of Monks of the Charterhouse.

    At Laodicea, the blessed martyr Sagaris, Bishop, who was one of the disciples of the Apostle Paul.

    At Auxerre, the holy martyr Romanus, Bishop of that see, who succeeded Eleutherius and was Bishop three years.

    At Capua, the holy martyrs Marcellus, Castus, Emilius, and Saturninus.

    At Trier is kept the memorial of a great multitude of martyrs, which man can scarcely number, who for Christ's faith's sake were put to death in diverse ways by the President Rictiovarus in the persecution under the Emperor Diocletian.

    At Agen, in Gaul, the holy Virgin and martyr Faith, by whose example blessed Caprasius was so stirred up to suffer martyrdom, that he finished his contending with joy.

    Likewise the holy martyr Erotis, in whom the love of Christ was so kindled that she triumphed over the flames of fire.

    At Oderzo, holy Magnus, Bishop, whose body lieth at Venice.

    At Naples, holy Mary Frances, of the Five Wounds of our Lord Jesus Christ, of the Third Order of Bare-footed Friars Minor of St. Peter of Alcantara, she was famous for graces and miracles, and Pope Pius IX. enrolled her name among those of the holy virgins.
status:
