# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "06-20"
text:
  la: |
    In ínsula Póntia natális sancti Silvérii, Papæ et Mártyris, qui, cum Anthimum, Epíscopum hæréticum, a suo prædecessóre Agapíto depósitum, restitúere noluísset, a Belisário, agénte ímpia Theodóra Augústa, in exsílium pulsus est, et ibídem, pro fide cathólica multis ærúmnis conféctus, defécit.

    Romæ deposítio sancti Nováti, qui fuit fílius beáti Pudéntis Senatóris, et frater sancti Timóthei Presbýteri et sanctárum Christi Vírginum Pudentiánæ et Praxédis, qui ab Apóstolis erudíti sunt in fide. Ipsórum vero domus, in Ecclésiam commutáta, Pastóris Títulus appellátur.

    Tomis, in Ponto, sanctórum Mártyrum Pauli et Cyríaci.

    Petræ, in Palæstína, sancti Macárii Epíscopi, qui, ab Ariánis passus multa et in Africam relegátus, Conféssor quiévit in Dómino.

    Híspali, in Hispánia, sanctæ Florentínæ Vírginis, soróris sanctórum Leándri et Isidóri Episcopórum.
  en: |
    The holy martyr Pope Silverius. He refused to restore the [Eutychian] heretic Anthimus, who had been deposed [from the Patriarchate of Constantinople] by his predecessor, Pope Agapitus, and in consequence of this, through a plot of the wicked Empress Theodora, was exiled by Bellisarius to the island of Ponza, where he died for the Catholic faith, broken down by sufferings and hardships.

    At Rome, the holy Novatus, son of the blessed Senator Pudens and brother of the holy Priest Timothy, and of Christ's holy Virgins Pudentiana and Praxedes, who were taught in the faith by the Apostles. Their house was turned into a church, and called that of St. Pastor.

    At Tomi, in Pontus, the holy martyrs Paul and Cyriacus.

    At Petra, in Palestine, the holy Macarius, Bishop, who suffered many things of the Arians, and was exiled to Africa, where he fell asleep in the Lord.

    At Seville, in Spain, the holy Virgin Florentina, sister of the holy Leander, Bishop, and holy Isidore, Bishop [of Seville.]
status:
  la: verified
  en: verified
