# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-14"
text:
  la: |
    Romæ natális beáti Eusébii, Presbýteri et Confessóris, qui, ab Ariáno Imperatóre Constántio, ob cathólicæ fídei defensiónem, in quodam domus suæ cubiculo inclúsus, ibi, cum menses septem in oratióne constánter perseverásset, dormitiónem accépit. Ipsíus autem corpus collegérunt Gregórius et Orósius Presbýteri, et in cœmetério Callísti, via Appia, sepeliérunt.

    Apaméæ, in Sýria, sancti Marcélli, Epíscopi et Mártyris; qui, cum Jovis delúbrum diruísset, a furéntibus Gentílibus occísus est.

    Tudérti, in Umbria, sancti Callísti, Epíscopi et Mártyris.

    In Illýrico sancti Ursícii Mártyris, qui, sub Maximiáno Imperatóre et Aristíde Prǽside, post multa et divérsa torménta, pro Christi nómine, gládio cæsus est.

    In Africa sancti Demétrii Mártyris.

    In Ægína ínsula sanctæ Athanásiæ Víduæ, monástica observántia et miraculórum dono illústris.
  en: |
    At Rome, the holy Priest Eusebius. On account of his defence of the Catholic faith the Arian Emperor Constantius caused him to be imprisoned in a bedchamber in his own house, where he lived for seven months, continuing instant in prayer, and then fell asleep. His body was taken by the Priests Gregory and Orosius and buried in the cemetery of Callistus, upon the Appian Way.

    At Apamea, in Syria, the holy martyr Marcellus, Bishop, who was destroying a shrine of Jupiter when he was slain by the infuriated Gentiles.

    At Todi, the holy martyr Callistus, Bishop.

    In Illyricum, under the Emperor Maximian and the President Aristides, the holy martyr Ursicius, who was beheaded for Christ's name's sake after many and diverse torments.

    In Africa, the holy martyr Demetrius.

    In the island of Jegima, in the Grecian Archipelago, the holy widow Athanasia, famous for her monastic observance and her power of working miracles.
status:
  la: verified
  en: verified
