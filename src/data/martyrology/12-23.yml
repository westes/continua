# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-23"
text:
  la: |
    Romæ sanctæ Victóriæ Tiburtínæ, Vírginis et Mártyris, quæ, in persecutióne Décii Imperatóris, cum esset desponsáta Eugénio pagáno et nec núbere vellet neque sacrificáre, ídeo, post multa facta mirácula, quibus plúrimas Deo Vírgines aggregáverat, a carnífice percússa est gládio in corde, rogátu sui sponsi.

    Nicomedíæ pássio sanctórum Migdónii et Mardónii, quorum alter, in Diocletiáni persecutióne, igne cremátus, alter in fossam projéctus occúbuit. Tunc étiam Diáconus sancti Anthimi, Epíscopi Nicomediénsis, passus est; qui, cum lítteras perférret ad Mártyres, a Gentílibus tentus est, atque, lapídibus óbrutus, migrávit ad Dóminum.

    Ibídem natális sanctórum vigínti Mártyrum, quos ípsamet Diocletiána persecútio, gravíssimis torméntis cruciátos, Mártyres Christi fecit.

    In Creta sanctórum Mártyrum Theodúli, Saturníni, Eupori, Gelásii, Euniciáni, Zetici, Leóminis, Agathópodis, Basílidis et Evarísti; qui, in Décii persecutióne, crudélia passi sunt et cápite cæsi.

    Romæ beáti Sérvuli, qui (ut sanctus Gregórius Papa scribit), a primǽva sui ætáte usque ad finem vitæ, paralýticus jácuit in pórticu prope Ecclésiam sancti Cleméntis, et demum, Angelórum cántibus invitátus, ad paradísi glóriam transívit; ad cujus túmulum Deus mirácula crebérrime osténdit.
  en: |
    At Rome, the holy Virgin and martyr Victoria de Tivoli. She was espoused to one Eugenius, a heathen, and during the persecution under the Emperor Decius she would neither marry Eugenius nor offer sacrifice unto idols, but worked many miracles, whereby she gathered many virgins unto God, and the executioner stabbed her to the heart with his sword at the request of her espoused husband.

    There likewise, in the same persecution, the holy martyrs Migdonius and Mardonius, of whom the one was burnt and the other cast into a ditch, and so died. Then also suffered the Deacon of holy Anthimus, Bishop of Nicomedia, who was bringing a letter to the martyrs when he was taken by the Gentiles and stoned to death, and so passed hence to be ever with the Lord.

    At Nicomedia, twenty holy martyrs during the persecution under the Emperor Diocletian, after they had been most grievously tormented.

    In Crete, the holy martyrs Theodulus, Saturninus, Euporus, Gelasius, Eunician, Zeticus, Cleomenes, Agathopus, Basilides, and Evaristus, who suffered great cruelties in the persecution under the Emperor Decius, and were beheaded.

    At Rome, blessed Servulus, concerning whom holy Gregory writeth that from his childhood even unto the end of his life he lay paralysed in a porch hard by the church of St. Clement, and at the end he was called by songs of angels, and passed away into the glory of Paradise. God doth very often show miracles at his grave.
status:
  la: verified
  en: verified
