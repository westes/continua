# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "07-16"
text:
  la: |
    Festum beátæ Maríæ Vírginis de monte Carmélo.

    Sebáste, in Arménia, sanctórum Mártyrum Athenógenis Epíscopi, et decem discipulórum ejus, sub Diocletiáno Imperatóre.

    Tréviris sancti Valentíni, Epíscopi et Mártyris.

    Córdubæ, in Hispánia, sancti Sisenándi, Levítæ et Mártyris; qui a Saracénis, pro Christi fide, jugulátus est.

    Eódem die natális sancti Fausti Mártyris, qui, sub Décio Imperatóre, cruci affíxus, quinque diébus in ea vixit, ac demum, sagíttis confóssus, migrávit in cælum.

    Santis, in Gállia, sanctórum Mártyrum Rainéldis Vírginis, et Sociórum ejus, qui a bárbaris, pro Christi fide, cæsi sunt.

    Bérgomi sancti Domniónis Mártyris.

    Antiochíæ natális beáti Eustáchii, Epíscopi et Confessóris, doctrína et sanctitáte célebris; qui, sub Ariáno Imperatóre Constántio, ob cathólicæ fídei defensiónem, exsílio Trajanópolim Thráciæ pulsus, ibídem in Dómino requiévit.

    Cápuæ sancti Vitaliáni, Epíscopi et Confessóris.

    Apud Abbátiam Sanctíssimi Salvatóris, diœcésis Constantiénsis, in Gállia, sanctæ Maríæ-Magdalénæ Postel, Fundatrícis Institúti Sorórum Scholárum Christianárum a Misericórdia, a Pio Papa Undécimo in sanctárum Vírginum album relátæ.

    Apud Ostia Tiberína, Translátio córporis sancti Hilaríni Mónachi, qui, una cum sancto Donáto, in persecutióne Juliáni Apóstatæ, comprehénsus est, et, cum nollet sacrificáre, demum, fústibus cæsus, Arétii, in Túscia, martýrium sumpsit séptimo Idus Augústi.
  en: |
    At Greece, the holy martyr Faustus, who was crucified under the Emperor Decius. He remained alive upon the cross five days, and at last was pierced with arrows, and so passed away to Heaven.

    At Sebaste, in Armenia, under the Emperor Diocletian, the holy martyrs Bishop Athenogenes, and ten of his disciples.

    At Antioch, in Syria, the blessed Confessor Eustace, [Patriarch of Antioch,] famous for his teaching and holiness. Under the Arian Emperor Constantius he was banished, for defending the Catholic faith, to Trajanopolis, in Thrace, where he fell asleep in the Lord.

    On the same day the holy Monk Hilarinus, who was arrested in the persecution under the Emperor Julian the Apostate, along with holy Donatus, and for as much as he would not offer sacrifice, he was beaten to death with clubs, and so received martyrdom, at Arezzo, in Tuscany, but his body hath been brought to Ostia.

    At Trier, the holy martyr Valentine, Bishop.

    At Cordova, in Spain, the holy levite Sisenand, a martyr.

    While he was still young he entered the community of the Clerks of Saint Aciocle of Cordova,] who was slain by the Saracens, for Christ's faith's sake.

    In Saintes, in Gaul, the holy Virgin Rainaldis and her Companions, martyrs, who were slain by the barbarians, for Christ's faith's sake.

    At Bergamo, the holy martyr Domnion, [under Maximianus Herculeus.]

    At Capua, the holy Confessor Vitalian, Bishop.

    At the Abbey of the most holy Saviour, in the diocese of Coutances, in Gaul, holy Mary Magdalen Postel, Foundress of the Institute of the Sisters of the Christian Schools of Mercy, whom Pope Pius XI enrolled in the roll of the holy Virgins.
