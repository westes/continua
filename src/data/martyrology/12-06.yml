# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-06"
text:
  la: |
    Myræ, quæ est metrópolis Lýciæ, natális sancti Nicolái, Epíscopi et Confessóris, de quo, inter plura miraculórum insígnia, illud memorábile fertur, quod Imperatórem Constantínum ab intéritu quorúmdam se invocántium, longe constitútus, ad misericórdiam per visum mónitis defléxit et minis.

    Eódem die sancti Polychrónii Presbýteri, qui, témpore Constántii Imperatóris, cum ad altáre Missas ágeret, invásus est ab Ariánis et jugulátus.

    In Africa sancti Majórici, fílii sanctæ Dionýsiæ, qui, cum esset adolescéntulus ac torménta pavésceret, matris obtútibus verbísque corroborátus est, et, céteris fórtior factus, in torméntis ánimam réddidit; quem amplexáta mater domi sepelívit, et ad ejus sepúlcrum assídue orare consuévit.

    Ibídem sanctárum mulíerum Dionýsiæ, quæ sancti Majórici Mártyris éxstitit mater, Datívæ ac Leóntiæ; itémque religiósi viri, nómine Tértii, Æmiliáni médici, et Bonifátii, cum áliis tribus. Hi omnes, in persecutióne Wandálica, sub Ariáno Rege Hunneríco, gravíssimis et innúmeris supplíciis pro cathólicæ fídei defensióne cruciáti, sanctórum Christi Confessórum número sociári meruérunt.

    Romæ sanctæ Aséllæ Vírginis, quæ (ut beátus Hierónymus scribit), ex útero matris benedícta, vitam in jejúniis et oratiónibus usque ad senéctam prodúxit.

    Granátæ, in Hispánia, pássio beáti Petri Paschásii, Epíscopi Giennénsis et Mártyris, ex Ordine beátæ Maríæ de Mercéde redemptiónis captivórum.
  en: |
    At Myra, which is the chief city of Lycia, the holy Confessor Nicolas, Bishop, of whom among many other signs and wonders it is recorded that when the Emperor Constantine had condemned certain persons to death and these called upon Nicolas, who was alive, and afar off, he appeared unto the Emperor, and bent him to mercy by exhortation and threats.

    On the same day, the holy priest Polychronius, who was saying Mass in the time of the Emperor Constantius, when the Arians attacked him and slew him.

    At the same time and place, the holy martyr Majoricus, the son of holy Dionysia. He was but a little lad and was in fear of the torments, but by the looks and words of his mother, he was so strengthened that he became mightier than them all, and died under the torture his mother took his body to her heart, and buried it in their home, and was used to pray instantly at his grave.

    In Africa, the holy women Dionysia, Dativa, and Leontia, and the monk Tertius, the physician Aemilian, Boniface, and three others, who in the Vandal persecution under the Arian King Hunneric were tormented in most grievous and manifold ways for their defence of the Catholic faith, and so earned a place among Confessors of Christ.

    At Rome, the holy Virgin Asella, who, as writeth blessed Jerome, was blessed from her mother's womb, and passed her life in fastings and prayers unto a good old age.

    At Granada, in Spain, the blessed martyr Peter Paschasius, Bishop of Jaen, of the order of blessed Mary of Ransom for the redemption of captives.
