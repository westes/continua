# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-29"
text:
  la: |
    Sancti Petri, ex Ordine Prædicatórum, Mártyris, qui octávo Idus Aprílis pro fide cathólica martýrium súbiit.

    Romæ natális sanctæ Catharínæ Senénsis Vírginis, ex tértio Ordine sancti Domínici, vita et miráculis claræ, quam Pius Secúndus, Póntifex Máximus, sanctárum Vírginum número adscrípsit. Ipsíus tamen festum sequénti die celebrátur.

    Apud Paphum, in Cypro, sancti Týchici, qui fuit discípulus beáti Pauli Apóstoli, et ab ipso Apóstolo in suis Epístolis caríssimus frater, miníster fidélis suúsque in Dómino consérvus appellátur. Natióne ex província Asia fuit.

    Pisis, in Túscia, sancti Torpétis Mártyris, qui magnus in offício Nerónis primum fuit, unúsque ex his, de quibus idem Paulus Apóstolus ab urbe Roma ad Philippénses scribit: « Salútant vos omnes sancti, máxime autem qui de Cǽsaris domo sunt». Sed póstea, pro fide Christi, jubénte Satéllico, álapis cǽditur, verbéribus duríssime affícitur, ac béstiis devorándus tráditur, sed mínime lǽditur; tandem martýrium suum decollatióne complévit.

    Cirthæ, in Numídia, natális sanctórum Mártyrum Agápii et Secundíni Episcopórum, qui, post longum apud præfátam urbem exsílium, in persecutióne Valeriáni, in qua tunc máxime Gentílium rábies ad tentándam justórum fidem inhiábat, ex illústri sacerdótio effécti sunt Mártyres gloriósi. Passi sunt in eórum collégio Æmiliánus miles, Tertúlla et Antónia, quæ erant sacræ Vírgines, et quædam múlier cum suis géminis.

    In ínsula Corcýra sanctórum septem Latrónum, qui, a sancto Jásone ad Christum convérsi, martýrio vitam adépti sunt sempitérnam. Latrónes Corcyréi appellántur. Nómina eórum sunt Saturnínus, Jusischolus, Faustiánus, Januárius, Marsálius, Euphrásius et Mammius.

    Neápoli, in Campánia, sancti Sevéri Epíscopi, qui, inter ália admiránda, mórtuum de sepúlcro excitávit ad tempus, ut mendácem víduæ et pupillórum creditórem argúeret falsitátis.

    Bríxiæ sancti Paulíni, Epíscopi et Confessóris.

    In cœnóbio Cluniacénsi, in Gállia, sancti Hugónis Abbátis.

    In monastério Molisménsi, in Gállia, sancti Robérti, qui fuit primus Abbas Cistércii. Mónachus fuit monastérii Cellénsis, Abbas sancti Michaélis de Tonnerre, Prior sancti Agerúlfi, et Fundátor monastériorum Molisménsis et Cistércii.
  en: |
    At Milan, the holy martyr Peter, of the Order of Friars Preachers, who was murdered by heretics for the Catholic faith's sake.

    At Rome, the birthday of holy Catherine of Siena, Virgin, of the Third Order of St. Dominic, renowned for her life and miracles, whom Pope Pius II enrolled among the holy Virgins. Her feast, however, is kept upon the next day.

    At Paphos, in Cyprus, holy Tychicus, the disciple of the blessed Apostle Paul, whom that Apostle doth in his Epistles call "a beloved brother and a faithful minister and fellow-servant in the Lord." He was a native of the province of Asia.

    At Pisa, in Tuscany, holy Torpes, martyr, who was great in the service of Nero, and one of those of whom the Apostle Paul writes from the city of Rome to the Philippians: "All the saints salute you, chiefly they that are of Caesar's household." But afterward, for the faith of Christ, by order of Satellicus he was buffeted, most grievously scourged, and delivered to be devoured by beasts, yet was in no wise hurt; and at last he fulfilled his martyrdom by beheading.

    At Cirtha, in Numidia, the holy martyrs Agapius, Bishop, and Secundinus, Bishop, who had long been banished to that city in the persecution under the Emperor Valerian, wherein the fury of the Gentiles did most seek to try the faith of the just. From having been eminent Priests they became glorious martyrs and there suffered along with them the soldier Emilian, the holy Virgins Tartulla and Antonia, and a certain woman with her twin children.

    On the same day, the seven Saints who had been robbers but were converted to Christ by holy Jason, and by martyrdom gained life everlasting. They are called the robbers of Corfu. Their names are Saturninus, Jusischolus, Faustian, Januarius, Marsalius, Euphrasius, and Mammius.

    At Naples, in Campania, holy Severus, Bishop, who, among other wonders, raised a dead man from the tomb for a season, that he might convict of falsehood the lying creditor of a widow and orphans.

    At Brescia, the holy Confessor Paulinus, Bishop of that see.

    In the monastery of Cluny, holy Hew, Abbpt of Cluny.

    In the monastery of Molesme, holy Robert, first Abbot of Citeaux. He was a monk of Moitier-la-Celle, Abbot of Saint-Michel de Tonnerre, Prior of Saint-Ayoul, and founder of Molesme and Citeaux.
