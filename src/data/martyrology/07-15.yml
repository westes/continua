# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "07-15"
text:
  la: |
    Sancti Henríci Primi, Imperatóris Romanórum et Confessóris, cujus dies natális tértio Idus mensis hujus recensétur.

    Lugdúni, in Gállia, deposítio sancti Bonaventúræ, Cardinális et Epíscopi Albanénsis, Confessóris et Ecclésiæ Doctóris, ex Ordine Minórum, doctrína et vitæ sanctitáte celebérrimi. Ipsíus tamen festívitas prídie hujus diéi recólitur.

    Pápiæ sancti Felícis, Epíscopi et Mártyris.

    In Portu Románo natális sanctórum Mártyrum Eutrópii, atque Zósimæ et Bonósæ sorórum.

    Carthágine beáti Catulíni Diáconi, de cujus láudibus sanctus Augustínus sermónem ad pópulum hábuit, et sanctórum Januárii, Floréntii, Júliæ et Justæ Mártyrum; qui pósiti sunt in Basílica Fausti.

    Alexandríæ sanctórum Mártyrum Philíppi, Zenónis, Narséi et decem infántum.

    In ínsula Ténedo sancti Abudémii Mártyris, qui sub Diocletiáno passus est.

    Sebáste, in Arménia, sancti Antíochi médici, qui, sub Hadriáno Prǽside, cápite obtruncátus est; cumque ex eo lac pro sánguine manáret, Cyriácus cárnifex, convérsus ad Christum, et ipse martýrium súbiit.

    Nísibi, in Mesopotámia, natális sancti Jacóbi, ejúsdem urbis Epíscopi, magnæ sanctitátis viri. Hic, miráculis et eruditióne clarus, unus fuit, sub persecutióne Galérii Maximiáni, ex número Confessórum, qui in Nicǽna deínde Sýnodo perversitátem Aríi, Homoúsii oppositióne, damnárunt; cujus et sancti Alexándri Epíscopi oratióne ipse Aríus condígnam suæ iniquitátis mercedem, effúsis viscéribus, Constantinópoli recépit.

    Neápoli, in Campánia, sancti Athanásii, ejúsdem civitátis Epíscopi, qui, ab ímpio nepóte Sérgio multa passus ac sede pulsus, tandem Vérulis, in Hérnicis, conféctus ærúmnis, migrávit in cælum, témpore Cároli Calvi.

    Campi Salentinórum, in Apúlia, sancti Pompílii Maríæ Pirrótti, Confessóris, ex Ordine Clericórum Páuperum Matris Dei Scholárum Piárum, vita apostólica præclári, a Pio Undécimo, Pontífice Máximo, inter Sanctos reláti.

    Panórmi Invéntio córporis sanctæ Rosáliæ, Vírginis Panormitánæ; quod, Urbáno Octávo Pontífice Máximo, repértum divínitus, Jubilǽi anno Sicíliam a peste liberávit.
  en: |
    At Bamberg, the holy Emperor Henry II. He and his wife Cunegunda preserved perpetual virginity. He brought holy Stephen, king of Hungary, and nearly all his realm, to believe in Christ. We keep feast in his honour upon the 21st day of this present month of July.

    At Lyon, in Gaul, the burial of holy Bonaventure, Cardinal and Bishop of Albano, Confessor and Doctor of the Church, of the Order of Friars Minor, most famous for learning and holiness of life. His feast, however, is kept upon the day before this.

    At Porto, in Italy, the holy martyrs Eutropius and the sisters Zosima and Bonosa.

    At Carthage, the blessed Deacon Catulinus, in praise of whom holy Augustine preached a sermon to the people, and the holy martyrs Januarius, Florence, Julia, and Justa, who were buried in the Basilica of Faustus.

    At Alexandria, the holy martyrs Philip, Zeno, Narseus, and ten little children.

    In the island of Tenedos, the holy martyr Abudemius, who suffered under Diocletian.

    At Sebaste, the holy physician Antiochus, who was beheaded under the President Hadrian. Milk ran out of his body instead of blood, whereby Cyriacus the headsman was turned to Christ, and himself suffered martyrdom.

    At Pavia, the holy martyr Felix, Bishop.

    At Nisibis, holy James, Bishop of that city, a man of great holiness, and famous for his wonders and his learning. He was one of the Confessors in the persecution under the Emperor Galerius Maximian. At the Council of Nicea, he condemned the perversity of Arius in opposing the definition that our Lord Christ is homousius that is, of one Being with the Father, and it was at the prayers of this James, and of Alexander Archbishop of Constantinople, that the same Arius received the due reward of his iniquity at Constantinople, when his bowels gushed out.

    At Naples, in Campania, holy Athanasius, Bishop of that city, who suffered much from his ungodly nephew Sergius, and was thrust out of his see.

    In the time of King Charles the Bald, he passed away from earth to heaven, worn out with sorrow, at Veroli.

    At Campi Salentina, in Apulia, holy Pompilius Mary Pirrotti, Confessor, of the Order of the Poor Clerics of the Mother of God of the Pious Schools, renowned for his apostolic life, whom Pope Pius XI enrolled among the Saints.

    At Palermo is commemorated the finding of the body of the holy Virgin Rosalie of that city. It was found by revelation from God, in the year of the jubilee, under the Supreme Pontiff Urban VIII, and Sicily was freed from the plague.
