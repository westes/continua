# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "09-06"
leadEntries: 1
text:
  la: |
    In Palæstína sancti Zacharíæ Prophétæ, qui, de Chaldǽa senex in patriam revérsus, ibíque defúnctus, juxta Aggǽum Prophétam cónditus jacet.

    In Hellespónto sancti Onesíphori, Apostolórum discípuli, cujus méminit sanctus Paulus ad Timótheum scribens. Ipse autem Onesíphorus ibídem, una cum sancto Porphýrio, jussu Hadriáni Procónsulis ácriter verberátus et a ferócibus raptátus equis, spíritum Deo réddidit.

    In Africa sanctórum Episcopórum Donatiáni, Præsídii, Mansuéti, Germáni et Fúsculi; qui, in persecutióne Wandálica, jussu Ariáni Regis Hunneríci, pro assertióne cathólicæ veritátis, fústibus diríssime cæsi et exsílio elimináti sunt. Inter eos étiam erat Epíscopus, nómine Lætus, strénuus atque doctíssimus vir, qui, post diutúrnos cárceris squalóres, incéndio concremátus est.

    Alexandríæ pássio sanctórum Mártyrum Fausti Presbýteri, Macárii et Sociórum decem; qui, sub Décio Imperatóre et Valério Prǽside, pro Christi nómine, abscíssis cervícibus, martýrium complevérunt.

    In Cappadócia sanctórum Mártyrum Cóttidi Diáconi, Eugénii et Sociórum.

    Verónæ sancti Petrónii, Epíscopi et Confessóris.

    Romæ sancti Eleuthérii Abbátis, qui Dei servus fuit, atque (ut sanctus Gregórius Papa scribit) oratióne et lácrimis mórtuum suscitávit.
  en: |
    The Prophet Zachariah, who returned home from Chaldea as an old man, and is buried beside the prophet Haggai.

    At the Dardanelles, holy Onesiphorus, a disciple of the Apostles, of whom holy Paul maketh mention in writing unto Timothy. By command of the Proconsul Hadrian, holy Onesiphorus and Porphyry were heavily beaten, and drawn by wild horses, and so gave up their souls to God.

    In Africa, the holy Bishops Donatian, Prassidius, Mansuetus, German, and Fusculus, who in the persecution under the Vandals were, by command of the Arian King Hunneric, because of their assertion of the Catholic truth, heavily beaten with cudgels, and banished. Among them was also a Bishop named Laetus, a man of great activity and learning, who, after suffering a long and foul imprisonment, was burnt.

    At Alexandria, the holy martyrs the Priest Faustus, Macarius, and ten Companions, who finished their testimony for Christ's name's sake, under the Emperor Decius and the President Valerius, by being beheaded.

    In Cappadocia, the holy martyrs the Deacon Cottidus, Eugenius, and their Companions.

    At Verona, the holy Confessor Petronius, Bishop.

    At Rome, the holy Abbot Eleutherius, the servant of God, of whom holy Pope Gregory writeth, that by his prayer and tears he raised a man from the dead.
status:
  la: verified
