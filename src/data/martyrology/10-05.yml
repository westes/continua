# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-05"
text:
  la: |
    Messánæ, in Sicília, natális sanctórum Mártyrum Plácidi Mónachi, e beáti Benedícti Abbátis discípulis, et ejus fratrum Eutýchii et Victoríni, ac soróris eórum Fláviæ Vírginis, itémque Donáti, Firmáti Diáconi, Fausti et aliórum trigínta Monachórum, qui omnes a Manúcha piráta, pro Christi fide, necáti sunt.

    Apud Smyrnam item natális beáti Thraséæ, Epíscopi Euméniæ, martýrio consummáti.

    Antisiodóri deposítio sanctórum germanórum Firmáti Diáconi, et Flaviánæ Vírginis.

    Tréviris sanctórum Mártyrum Palmátii et Sociórum; qui, in persecutióne Diocletiáni, sub Rictiováro Prǽside, martýrium subiérunt.

    Eódem die pássio sanctæ Charitínæ Vírginis, quæ, sub Diocletiáno Imperatóre et Domítio Consulári, ígnibus est cruciáta et in mare projécta, et, cum inde incólumis evasísset, tandem, mánibus et pédibus abscíssis dentibúsque convúlsis, in oratióne spíritum emísit.

    Ravénnæ sancti Marcellíni, ejúsdem sedis Epíscopi et Confessóris.

    Valéntiæ, in Gállia, sancti Apollináris Epíscopi, cujus vita virtútibus fuit illústris, et mors signis ac prodígiis decoráta.

    Eódem die sancti Attiláni, Epíscopi Zamorénsis, quem beátus Urbánus Papa Secúndus in Sanctórum númerum rétulit.

    Romæ sanctæ Gallæ Víduæ, fíliæ Sýmmachi Cónsulis, quæ, viro suo defúncto, apud Ecclésiam beáti Petri multis annis oratióni, eleemósynis, jejúniis aliísque sanctis opéribus inténta permánsit; cujus felicíssimum tránsitum sanctus Gregórius Papa descrípsit.
  en: |
    At Messina, in Sicily, the holy monk Placidus, a disciple of the blessed Abbot Benedict, his brothers Eutychius and Victorinus, and the Virgin Flavia, their sister, along with Donatus, the Deacon Firmatus, Faustus, and thirty other monks, all martyrs, who were massacred for Christ's faith's sake, by the pirate Manucha.

    Upon the same day, blessed Thraseas, Bishop of Eumenia, who achieved his martyrdom at Smyrna.

    At Trier, the holy martyrs Palmatius and his Companions, who underwent martyrdom under the President Rictiovarus, in the persecution under the Emperor Diocletian.

    On the same day, the holy Virgin Charitina, under the Emperor Diocletian and the Consular Domitius. She was tormented with fire, and cast into the sea, whence she came forth unharmed, then her hands and feet were cut off, and her teeth shaken, and she gave up her soul in prayer to God.

    At Auxerre, the holy Deacon Firmatus, and the Virgin Flaviana his sister.

    At Ravenna, the holy Confessor Marcellinus, Bishop of that see.

    At Valence, in Gaul, holy Apollinaris, Bishop his life was famous for his graces, and his death was marked by signs and wonders.

    Upon the same day holy Attilan, Bishop of Zamora, whose name Urban II. numbered with those of the Saints.

    At Rome, the holy widow Galla, daughter of the Consul Symmachus after the death of her husband she passed many years at the church of blessed Peter, intent upon prayer, alms, fastings, and other holy works. Holy Pope Gregory hath written of her right blessed passage hence.
