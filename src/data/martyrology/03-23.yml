# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "03-23"
text:
  la: |
    In Africa sanctórum Mártyrum Victoriáni, Procónsulis Carthaginis, et duórum germanórum, Aquisregénsium; item Fruméntii et altérius Fruméntii, mercatórum. Hi omnes, in persecutióne Wandálica (ut scribit Victor, Africánus Epíscopus), sub Ariáno Rege Hunneríco, pro constántia cathólicæ confessiónis, immaníssimis supplíciis cruciáti, egrégie coronáti sunt.

    Item in Africa sancti Fidélis Mártyris. Ibídem sancti Felícis et aliórum vigínti Mártyrum.

    Cæsaréæ, in Palæstína, sanctórum Mártyrum Nicónis Neapolitáni et aliórum nonagínta novem.

    Item corónæ sanctórum Mártyrum Domítii Phrýgis, Pelágiæ, Aquilæ, Epárchii et Theodósiæ, sub Juliáno Apostáta.

    Limæ, in Perúvia, sancti Turíbii Epíscopi, cujus virtúte fides et disciplína ecclesiástica per Amerícam diffúsæ sunt.

    Antiochíæ sancti Theodúli Presbýteri.

    Barcinóne, in Hispánia, sancti Joséphi Oriol Presbýteri, Ecclésiæ sanctæ Maríæ Regum Beneficiárii, omnígena virtúte ac præsértim córporis afflictatióne, paupertátis cultu atque in egénos et infírmos caritáte célebris; quem, in vita et post mortem miráculis gloriósum, Pius Papa Décimus in Sanctórum número recénsuit.

    Cæsaréæ sancti Juliáni Confessóris.

    In Campánia sancti Benedícti Mónachi, qui, a Gothis in ardénti clíbano inclúsus, sequénti die invéntus est illǽsus.
  en: |
    In Africa, the holy martyrs Victorian, Pro-consul of Carthage, and two brethren from Aquae Regiae, also two merchants, both named Frumentius, all in the persecution by the Vandals, were, on account of the steadfastness of their Catholic confession, put to the most grievous torments under the Arian king Hunneric, and gloriously crowned.

    Likewise in Africa, the holy martyr Faithful there also holy Felix and twenty others.

    At Caesarea, in Palestine, the holy martyrs Nicon, a Neapolitan, and ninety-nine others.

    Also the holy martyrs Domitius, a native of Phrygia, Pelagia, Aquila, Eparchius, and Theodosia, under Julian the Apostate.

    At Lima, in the kingdom of Peru, holy Turibius, Archbishop of that see, by whose work the faith and discipline of the church were spread abroad in America.

    At Antioch, the holy Priest Theodulus.

    At Barcelona, in Spain, holy Joseph Oriol, Priest, Beneficiary of the church of St. Mary of the Kings, renowned for every kind of virtue, but above all for the afflicting of his body, his love of poverty, and his charity toward the needy and the sick; whom, glorious for miracles in his life and after his death, Pope Pius X numbered among the Saints.

    At Caesarea, the holy Confessor Julian.

    In Campania, the holy monk Benedict, who was shut up by the Goths in a glowing furnace, but upon the morrow was found unhurt.
status:
  la: verified
  en: verified
