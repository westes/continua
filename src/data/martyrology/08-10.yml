# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-10"
text:
  la: |
    Romæ, via Tiburtína, natális beáti Lauréntii Archidiáconi, qui, in persecutióne Valeriáni, post plúrima torménta cárceris, vérberum diversórum, fústium, ac plumbatárum et laminárum ardéntium, ad últimum, in cratícula férrea assátus, martýrium complévit; ejúsque corpus a beáto Hippólyto et Justíno Presbýtero sepúltum fuit in cœmetério Cyríacæ, in agro Veráno.

    In Hispánia Apparítio beátæ Maríæ Vírginis de Mercéde nuncupátæ, quæ Ordinis redemptiónis captivórum sub ejus nómine Institútrix fuit. Ipsíus autem festívitas octávo Kaléndas Octóbris recólitur.

    Romæ pássio sanctórum centum sexagínta quinque mílitum Mártyrum, sub Aureliáno Imperatóre.

    Alexandríæ commemorátio sanctórum Mártyrum, qui, in persecutióne Valeriáni, sub Prǽside Æmiliáno, divérsis exquisitísque torméntis diútius cruciáti, vario mortis génere corónam martýrii sunt adépti.

    Bérgomi sanctæ Astériæ, Vírginis et Mártyris, in persecutióne Diocletiáni et Maximiáni Imperatórum.

    Carthágine sanctárum Vírginum et Mártyrum Bassæ, Paulæ et Agathonícæ.

    Romæ sancti Deúsdedit Confessóris, qui quod in hebdómada mánibus suis operándo lucrabátur, die sábbati paupéribus erogábat.
  en: |
    At Rome, upon the Tiburtine Way, the blessed Archdeacon Lawrence. In the persecution under the Emperor Valerian he suffered many torments, diverse stripes, armed scourges, cudgels, and whips loaded with lead, and plates of heated metal, and at the last he was laid upon a bed of iron bars over a slow fire, and so finished his testimony. His body was buried in the cemetery of St. Cyriaca in the Veran field by blessed Hippolytus and Justin the Priest.

    Likewise at Rome, one hundred and sixty-five holy soldiers, who suffered martyrdom under the Emperor Aurelian.

    At Bergamo, in the persecution under the Emperors Diocletian and Maximian, the holy Virgin and martyr Asteria.

    At Alexandria are commemorated the holy martyrs, who under the President Aemilian, in the persecution under the Emperor Valerian, were long tortured with diverse and terrible torments, and gained the crown of martyrdom by diverse kinds of death.

    At Carthage, the holy Virgins Bassa, Paula, and Agathonica, all martyrs.

    At Rome, the holy Confessor Deus Dedit, who gave to the poor every Saturday whatever he had gained by working with his hands throughout the week.

    In Spain, the apparition of the Blessed Virgin Mary, styled of Ransom, Foundress of the Order for the Redemption of Captives, established in her name.
status:
  la: verified
  en: verified
