# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-07"
text:
  la: |
    Rotómagi natális sancti Joánnis Baptístæ de La Salle, Presbýteri et Confessóris, qui, in erudiénda adolescéntia præsértim páupere excéllens, et de religióne civilíque societáte præcláre méritus, Fratrum Scholárum Christianárum Sodalitátem instítuit. Eum Pius Duodécimus, Póntifex Máximus, ómnium Magistrórum púeris adolescentibúsque instituéndis præcípuum apud Deum cæléstem Patrónum constítuit. Ipsíus tamen festum Idibus Maji celebrátur.

    In Africa item natális sanctórum Mártyrum Epiphánii Epíscopi, Donáti, Rufíni et aliórum trédecim.

    Alexandríæ sancti Peléusii, Presbýteri et Mártyris.

    Synópe, in Ponto, sanctórum ducentórum Mártyrum.

    Sóti, in Cilícia, sancti Calliópii Mártyris, qui, sub Maximiáno Præfécto, post ália torménta, cápite in terram verso cruci affíxus, nóbili coróna martýrii decorátus est.

    Nicomedíæ sancti Cyríaci et aliórum decem Mártyrum.

    Verónæ sancti Saturníni, Epíscopi et Confessóris.

    Romæ sancti Hegesíppi, qui, vicínus Apostolórum tempóribus, Romam venit ad Anicétum Pontíficem, ibíque mansit usque ad Eleuthérium, et Ecclesiasticórum Actuum a passióne Dómini usque ad suam ætátem sermóne símplici texuit históriam; ut, quorum vitam sectabátur, dicéndi quoque exprímeret charactére.

    In Sýria sancti Aphraátis Anachorétæ, qui, Valéntis témpore, cathólicam fidem virtúte miraculórum advérsus Ariános deféndit.
  en: |
    At Rouen, the holy Confessor John Baptist de la Salle. He was foremost in the teaching of the young, the poor especially, and deserved well of both religion and civil society. He founded the Congregation of the Brothers of the Christian Schools.

    In Africa, the holy martyrs Epiphanius, the Bishop, also Donatus, Rufinus, and thirteen others.

    At Synope, in Pontus, two hundred holy martyrs.

    At Soti, in Cilicia, the holy martyr Calliopius, who after diverse torments under the prefect Maximian was crucified head downwards, and so gained a noble crown of martyrdom.

    At Nicomedia, the holy martyrs Cyriacus and ten others.

    At Alexandria, the holy martyr Peleusius the Priest.

    At Rome, holy Hegesippus, who came to Pope Anicetus, at Rome, very soon after the time of the Apostles, and abode there until the time of Pope Eleutherius, He wrote in plain words a Church history from the Passion of the Lord until his own time, to set forth the lives of those in whose footsteps he followed.

    At Verona, the holy Confessor Saturninus, Bishop of that see.

    In Syria, the holy Hermit Aphraates, who defended the Catholic faith by the power of his miracles against the Arians, in the time of the Emperor Valens.
status:
  la: verified
  en: verified
