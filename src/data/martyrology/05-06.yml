# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "05-06"
text:
  la: |
    Romæ sancti Joánnis, Apóstoli et Evangelístæ, ante Portam Latínam; qui, ab Epheso, jussu Domitiáni, vinctus Romam est perdúctus, et, judicánte Senátu, ante eándem portam in ólei fervéntis dólium missus, exívit inde purior et vegétior quam intrávit.

    Damásci natális beáti Joánnis Damascéni, Presbýteri, Confessóris et Ecclésiæ Doctóris, doctrína et sanctitáte célebris. Hic, pro cultu sanctárum Imáginum, verbo et scriptis advérsus Leónem Isáuricum strénue decertávit; cujus Imperatóris ob calúmnias cum ipsi Joánni déxtera manus a Saracenórum Príncipe amputáta esset, idem, beátæ Maríæ Vírgini, cujus Imágines defénderat, se comméndans, prótinus déxteram íntegram sanámque recépit. Ejus autem festívitas sexto Kaléndas Aprílis celebrátur.

    Cyréne, in Líbya, sancti Lúcii Epíscopi, quem in Actibus Apostolórum sanctus Lucas commémorat.

    Antiochíæ sancti Evódii, qui (ut beátus Ignátius ad Antiochénses scribit), primus ibídem a sancto Petro Apóstolo ordinátus Epíscopus, glorióso martýrio vitam finívit.

    In Africa sanctórum Mártyrum Heliodóri et Venústi, cum áliis septuagínta quinque.

    In Cypro sancti Theódoti, Epíscopi Cyríniæ, qui, sub Licínio Imperatóre, gravíssima passus est, ac tandem, in Ecclésiæ pace, spíritum Deo réddidit.

    Carrhis, in Mesopotámia, sancti Protógenis, Epíscopi et Confessóris.

    In Anglia sancti Eadbérti, Epíscopi Lindisfarnénsis, doctrína et pietáte insígnis.

    Romæ sanctæ Benedíctæ Vírginis.

    Salérni Translátio sancti Matthǽi, Apóstoli et Evangelístæ; cujus sacrum corpus, olim ex Æthiópia ad divérsas regiónes et demum ad eam urbem delátum, ibídem, in dedicáta ejus nómine Ecclésia, summo honóre cónditum fuit.
  en: |
    At Antioch, the holy Evodius, who, as the blessed Ignatius writeth unto the Antiochenes, was ordained the first Bishop there, by the holy Apostle Peter, and who finished his life by a glorious testimony.

    At Cyrene, the holy Bishop Lucius, of whom the holy [Evangelist] Luke maketh mention in the Acts of the Apostles, [and the holy Apostle Paul in his Epistle to the Romans.]

    In Africa, the holy martyrs Heliodorus and Venustus, and seventy-five others.

    In Cyprus, the holy Theodotus, Bishop of Cyrinia, who suffered most grievous persecution under the Emperor Licinius, but saw the peace of the Church before he gave up his spirit to God.

    At Damascus, blessed John of Damascus, famous for holiness and teaching. He strove manfully for the honouring of the holy images, both by word and writing, against the Emperor Leo the Isaurian, wherefore the Emperor commanded that his right hand should be smitten off, whereupon he commended himself to the image of the Blessed Virgin Mary which he had defended, and forthwith he received back his hand whole and sound, of whom we keep feast upon the 27th day of March.

    At Charran, in Mesopotamia, the Bishop Protogenes.

    In England, the holy Eadberth, Bishop of Lindisfarne, famous for teaching and godliness, [who held the see of Lindisfarne for eleven years next after holy Cuthbert.]

    At Rome, the holy Virgin Benedicta, [sister of the holy widow Galla.]

    At Salerno, feast is kept for the translation of the holy Apostle Matthew, whose sacred body was brought of old time out of Ethiopia into diverse countries, and at last to that city, where it was buried with all honour under the church dedicated in his name.
status:
  la: verified
  en: verified
