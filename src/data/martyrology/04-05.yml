# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-05"
text:
  la: |
    Venétiæ, in Británnia minóre, sancti Vincéntii, cognoménto Ferrérii, ex Ordine Prædicatórum, Confessóris, qui, potens ópere et sermóne, multa míllia infidélium convértit ad Christum.

    In Africa pássio sanctórum Mártyrum, qui, in persecutióne Regis Ariáni Genseríci, in die Paschæ, in Ecclésia cæsi sunt; quorum Lector, dum in púlpito «All​elúja» cantáret, sagítta in gútture transfíxus est.

    Eódem die sancti Zenónis Mártyris, qui, pice íllitus et in ignem conjéctus, et hasta in médio rogo vulnerátus, martýrio coronátus est.

    In Lesbo ínsula pássio sanctárum quinque Vírginum, quæ gládio martýrium consummárunt.

    Thessalonícæ sanctæ Irénes Vírginis, quæ, cum sacros Libros contra Diocletiáni edíctum occultásset, ídeo, post tolerántiam cárceris, sagítta percússa est et igne cremáta, jussu Dulcétii Prǽsidis; sub quo et soróres ejus simul Agape et Chiónia passæ ántea fúerant.

    Palmæ, in ínsula Majórica, sanctæ Catharínæ Thomas, Vírginis, Canoníssæ Reguláris ex Ordine sancti Augustíni, quam Pius Papa Undécimus in sanctárum Vírginum númerum rétulit.
  en: |
    At Vannes, in Brittany, the holy Confessor Vincent, surnamed Ferrer, of the Order of Friars Preachers, who was mighty in work and in word, and brought to Christ many thousands of unbelievers.

    In Africa, suffered the holy martyrs who were massacred in church upon Easter day, in the persecution under the Arian king Genseric. Among them was the Reader, who was shot with an arrow through the neck, as he was in the pulpit singing the Alle​luja.

    On the same day the holy martyr Zeno, who was flayed, daubed over with pitch, and cast into the fire.

    In the island of Lesbos, suffered five holy martyrs.

    At Thessalonica, the holy Virgin Irene. She hid the holy books contrary to the edict of the Emperor Diocletian, and therefore suffered imprisonment, was smitten with an arrow, and burnt with fire by order of the President Dulcetius, the same judge under whom her sisters Agape and Chionia had suffered already.

    At Palma, in the island of Majorca, holy Catherine Thomas, Virgin, Canoness Regular of the Order of St. Augustine, whom Pope Pius XI enrolled among the holy Virgins.
