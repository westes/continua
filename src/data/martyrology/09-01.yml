# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "09-01"
text:
  la: |
    In província Narbonénsi sancti Ægídii, Abbátis et Confessóris, cujus nómine est appellátum óppidum, quod póstea crevit in loco, ubi ipse monastérium eréxerat et mortális vitæ cursum absólverat.

    Sentiáni, in fínibus Apúliæ, pássio sanctórum Donáti et altérius Felícis; qui, sanctórum Bonifátii et Theclæ fílii, a Valeriáno Júdice, sub Maximiáno Imperatóre, jussi sunt, post vária torménta, cápite præcídi hodiérna die, in qua et festívitas aliórum ex duódecim frátribus, quorum natális respectívis diébus ágitur, institúta est celebrári. Ipsórum vero duódecim fratrum córpora Benevéntum póstea transláta sunt, ibíque honorífice asserváta.

    In Palæstína sanctórum Jósue et Gedeónis.

    Hierosólymis beátæ Annæ Prophetíssæ, cujus sanctitátem sermo Evangélicus prodit.

    Cápuæ, via Aquária, sancti Prisci Mártyris, qui fuit unus de antíquis Christi discípulis.

    Tudérti, in Umbria, sancti Terentiáni, Epíscopi et Mártyris; qui, sub Hadriáno Imperatóre, Lætiáni Procónsulis jussu, equúleo et scorpiónibus cruciátus est, ac demum, abscíssa lingua, cápitis damnátus martýrium complévit.

    Heracléæ, in Thrácia, sancti Ammónis Diáconi, et sanctárum quadragínta Vírginum, quas ille erudívit in fide, et, sub Licínio tyránno, ad martýrii glóriam secum perdúxit.

    In Hispánia sanctórum Mártyrum Vincéntii et Læti.

    Populónii, in Túscia, sancti Réguli Mártyris, qui ex Africa illuc venit, ibíque, sub Tótila, martýrium consummávit.

    Cápuæ sancti Prisci Epíscopi, qui unus fuit ex illis Sacerdótibus, qui, in persecutióne Wandalórum, ob fidem cathólicam várie afflícti et vetústæ navi impósiti, ex Africa ad Campániæ líttora pervenérunt, et Christiánam religiónem, in iis locis dispérsi diversísque Ecclésiis præfécti, mirífice propagárunt. Ipsíus autem fuérunt sócii Castrénsis, cujus dies natális tértio Idus Februárii recólitur, Támmarus, Rósius, Heráclius, Secundínus, Adjútor, Marcus, Augústus, Elpídius, Cánion et Vindónius.

    Apud Sénonas beáti Lupi, Epíscopi et Confessóris; de quo refértur quod quadam die, præsénte Clero, dum sacris altáribus adstáret, lapsa est cǽlitus gemma in ejus cálicem sanctum.

    Rhemis, in Gállia, sancti Xysti, qui fuit primus ejúsdem civitátis Epíscopus.

    Apud Cenómanos, in Gállia, sancti Victórii Epíscopi.

    Apud Aquínum sancti Constántii Epíscopi, prophetíæ dono multísque virtútibus clari.

    Ad Aquas Duras, in Constantiénsi Germániæ território, sanctæ Verénæ Vírginis.
  en: |
    In the province of Narbonne, the holy Abbot and Confessor Giles.

    At Benevento, the Twelve Holy Brethren Martyrs.

    In Palestine, holy Joshua and holy Gideon.

    At Jerusalem, the blessed Prophetess Anna, whose holiness is set forth in the words of the Gospel.

    At Capua, upon the Aquarian Way, the holy martyr Priscus, who was one of the original disciples of Christ.

    At Reims, in Gaul, holy Xystus, a disciple of the blessed Apostle Peter, who was by him consecrated as the first Bishop of that city, and received the crown of martyrdom in the persecution under Nero.

    At Todi, in Umbria, the holy martyr Terentian, Bishop, who was racked and tormented with armed whips by command of the Pro-Consul Laetian, under the Emperor Hadrian, whereafter his tongue was cut out and he was condemned to be beheaded, and so finished his testimony.

    At Heraclea, the holy Deacon Ammon, and the forty holy Virgins to whom he taught the faith, and whom he led with him, under the tyrant Licinius, to the glory of martyrdom.

    In Spain, the holy martyrs Vincent and Laetus.

    At Piombino, in Tuscany, the holy martyr Regulus, who was martyred there under Totila, on his landing from Africa.

    At Sens, the blessed Confessor Lupus, Bishop, concerning whom it is said that one day when he was standing at the holy Altar in the presence of the clergy a precious stone fell from heaven into his chalice.

    At Capua, holy Priscus, Bishop. He was one of those Priests who, in the persecution under the Vandals, were diversely afflicted for the Catholic faith's sake, and were put on board an old ship wherein they came from Africa to the shores of Campania, and being scattered about those parts, and set over diverse churches, they wonderfully spread abroad the Christian religion. His Companions were Castrensis, Tammatrus, Rosius, Heraclius, Secundinus, Adjutor, Mark, Augustus, Elpidius, Canion, and Vindonius.

    At Aquino, holy Constantius, Bishop, famous for the gift of prophecy, and for many other graces.

    At Le Mans, holy Victorius, Bishop.

    At Baden, in the country of Constance, the holy Virgin Verena.
