# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "02-07"
text:
  la: |
    Sancti Romuáldi Abbátis, Monachórum Camaldulénsium Patris, cujus dies natális tertiodécimo Kaléndas Júlii recensétur, sed festívitas hac die, ob Translatiónem córporis ejus, potíssimum celebrátur.

    Augústæ, cui nunc Londíni nomen, in Británnia, natális beáti Auguli Epíscopi, qui, ætátis cursu per martýrium expléto, ætérna prǽmia suscípere méruit.

    In Phrýgia sancti Adáuci Mártyris, qui, ex Itálico génere clarus, et omni fere dignitátum gradu ab Imperatóribus insignítus, tandem, cum adhuc Quæstóris offício fungerétur, martýrii coróna pro fídei defensióne dignátus est.

    Ibídem plurimórum sanctórum Mártyrum, urbis uníus cívium, in quibus Præféctus Ærárii, Præféctus Mílitum et Senátus, quorum dux erat idem Adáucus; qui, cum omnes Christiáni essent, et constánter in fídei confessióne persísterent, a Galério Maximiáno Imperatóre sunt igne consúmpti.

    Heracléæ, in Ponto, sancti Theodóri, ductoris mílitum, qui, Licínio imperánte, post multa torménta, truncátus cápite, victor migrávit in cælum.

    In Ægýpto sancti Móysis, Epíscopi venerábilis, qui primum in erémo vitam solitáriam duxit; deínde, peténte Regína Saracenórum Máuvia, Epíscopus factus, gentem illam ferocíssimam magna ex parte ad fidem convértit, et gloriósus méritis quiévit in pace.

    Lucæ, in Túscia, deposítio sancti Richárdi, Regis Anglórum, qui pater éxstitit sancti Willebáldi, Eystetténsis Epíscopi, ac sanctæ Walbúrgæ Vírginis.

    Bonóniæ sanctæ Juliánæ Víduæ.
  en: |
    In London, the blessed Augulus, Bishop of that city, who ended his life by martyrdom, and so secured the everlasting prize.

    In Phrygia, the holy martyr Adaucus. He was an Italian of noble birth, and had been honoured by the emperors with dignities of almost every rank, and was still quaestor when he gained the crown of martyrdom in defence of the faith. Likewise many other holy martyrs, citizens of the same city, including the Prefect of the Treasury, the Military Prefect, and the Senate, who followed with Adaucus. They were all Christians and remained steadfast in the confession of the faith, and the Emperor Galerius Maximian caused them all to be burned with fire.

    At Heraclea, the holy martyr Theodore. He was a trainer of the soldiery, and in the reign of the Emperor Licinius was beheaded after suffering many torments, and so passed away a conqueror to heaven.

    In Egypt, holy Moses, the venerable Bishop of He first lived as a hermit in the desert, but afterwards was made Bishop at the desire of Mauvia, Queen of the Saracens, converted many of that fierce people to the faith, and at length fell asleep in peace, glorious for worthy works.

    At Lucca, in Tuscany, holy Richard, Prince of the West Saxons in England, and father of holy Winibald, Willibald, and Walburg.

    At Bologna, the holy widow Juliana.
