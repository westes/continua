# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "07-06"
text:
  la: |
    Octáva sanctórum Apostolórum Petri et Pauli.

    Hierosólymis sancti Isaíæ Prophétæ, qui, sub Manásse Rege, in duas sectus partes occúbuit, sepultúsque est sub quercu Rogel, juxta tránsitum aquárum.

    Fǽsulis, in Túscia, sancti Rómuli, Epíscopi et Mártyris, qui fuit beáti Petri Apóstoli discípulus. Hic, ab eódem Apóstolo missus ad prædicándum Evangélium, in multis Itáliæ locis Christum annuntiávit; ac tandem, Fǽsulas regréssus, ibi, sub Domitiáno Príncipe, martýrio coronátus est cum áliis Sóciis.

    Romæ natális sancti Tranquillíni Mártyris, patris sanctórum Marci et Marcelliáni, qui, ad prædicatiónem sancti Sebastiáni Mártyris convérsus ad Christum, a beáto Polycárpo Presbýtero baptizátus est, et a sancto Cajo Papa Présbyter ordinátus. Ipse, die Octavárum Apostolórum, cum ad confessiónem beáti Pauli oráret, ibídem, sub Diocletiáno Imperatóre, a Pagánis tentus est, et, ab eis lapidátus, martýrium consummávit.

    Londíni, in Anglia, sancti Thomæ More, regni Cancellárii, qui, pro fide cathólica ac beáti Petri primátu, jubénte Henríco Octávo Rege, decollátus est.

    In Campánia sanctæ Domínicæ, Vírginis et Mártyris, quæ, sub Diocletiáno Imperatóre, cum fregísset idóla, hinc ad béstias damnáta, sed ab illis nil læsa, demum, cápite obtruncáta, migrávit ad Dóminum. Ipsíus vero corpus Tropéæ, in Calábria, summa veneratióne asservátur.

    Eódem die sanctæ Lúciæ Mártyris, quæ, natióne Campána, a Ríxio Varo Vicário tenta et ácriter cruciáta, eúndem convértit ad Christum; quibus adjúncti sunt Antonínus, Sevérinus, Diodórus, Dion, et álii decem et septem, qui in passióne collégæ et in coróna fuére consórtes.

    Neptúni, in Látio, sanctæ Maríæ Gorétti, piíssimæ adolescéntis, in defendénda virginitáte crudelíssime necátæ, quam Pius Papa Duodécimus sanctárum Mártyrum catálogo solémniter accénsuit.

    In pago Trevirénsi sancti Goaris, Presbýteri et Confessóris.
  en: |
    _

    In Judea, the holy Prophet Isaiah, who was sawn asunder under King Manasseh, and was buried under the oak at En Rogel beside the flowing of the waters, [the first of the four Greater Prophets.]

    At Rome, the holy martyr Tranquillinus, father of the holy martyrs Mark and Marcellian. He had been converted to Christ by the preaching of the holy martyr Sebastian, baptized by the blessed Priest, Polycarp, and himself ordained a Priest by the holy Pope Caius. He was praying at the grave of blessed Paul, upon the Octave Day of the Apostles, when the pagans under the Emperor Diocletian tried and stoned him. And so he finished his testimony.

    At London, in England, holy Thomas More, Chancellor of the realm, who, for the Catholic faith and the primacy of blessed Peter, was beheaded by command of King Henry VIII.

    At Fiesole, in Tuscany, the holy martyr Romulus, Bishop, a disciple of Peter. He was sent forth by the Apostle to preach the gospel, and when he had proclaimed Christ in many places of Italy, he came back to Fiesole, where he and many Companions were crowned with martyrdom under the Emperor Domitian.

    In Campania, the holy Virgin and martyr Dominica. Under the Emperor Diocletian she was condemned to the beasts for breaking idols, but the beasts did not hurt her. She was then beheaded, and so passed away to be ever with the Lord. Her body is kept with great reverence at Tropea, in Calabria.

    On the same day, the holy martyr Lucy, a Campanian by race, who, being tried and sharply tormented under the Vicar Rixius Varus, turned him to Christ, with whom were joined Antoninus, Severinus, Diodorus, Dion, and seventeen others, who all suffered and were crowned together.

    At Nettuno, in Latium, holy Mary Goretti, a most pious maiden, most cruelly slain in defending her virginity, whom Pope Pius XII solemnly enrolled in the list of holy Martyrs.

    In the country of Trier, the holy Priest and Confessor Goer.
status:
  la: verified
  en: verified
