# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "01-26"
text:
  la: |
    Sancti Polycárpi, Epíscopi Smyrnénsis et Mártyris, qui martýrii corónam séptimo Kaléndas Mártii consecútus est.

    Hippóne Régio, in Africa, sanctórum Theógenis Epíscopi, et aliórum trigínta sex, qui, in persecutióne Valeriáni, contemnéntes temporálem mortem, corónam ætérnæ vitæ adépti sunt.

    Apud Béthlehem Judæ dormítio sanctæ Paulæ Víduæ, quæ, cum esset e nobilíssimo Senatórum génere, cum beata Vírgine Christi Eustóchio, fília sua, renúntians sǽculo, facultátes suas paupéribus distríbuit, et ad Præsépe Dómini se recépit; ibíque, multis virtútibus prǽdita et longo coronáta martýrio, ad cæléstia regna transívit. Ipsíus autem vitam, virtútibus admirándam, sanctus Hierónymus scripsit.
  en: |
    At Smyrna, holy Polycarp, a disciple of the blessed Apostle John, and by him ordained Bishop of that city, having the charge of all Asia. In the reign of Mark Antony, and Lucius Aurelius Commodus, as the Pro-consul was sitting in the amphitheatre all the people cried out against Polycarp, and to please them he was cast into the fire, but forasmuch as it burned him not he was pierced with the sword, and so received the crown of martyrdom. With him there suffered also twelve others that were come from Philadelphia unto the city aforesaid.

    At Hippo, in Africa, the holy martyrs Theogenes, Bishop of that city, and thirty-six others, who in the persecution under the Emperor Valerian reckoned cheaply death here in time, and received the crown of life eternal.

    At Bethlehem of Judah, the holy widow Paula, mother of Eustochium, the virgin of Christ. She was of a very noble senatorial family, that gave up the world and distributed all her goods to feed the poor and betook herself to the manger of the Lord, and thence passed away into the kingdom of heaven endowed with many graces and crowned with a long martyrdom. Jerome hath written of her life, full of graces.
