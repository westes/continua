# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-30"
text:
  la: |
    Sanctæ Catharínæ Senénsis Vírginis, ex tértio Ordine sancti Domínici, quæ ad cæléstem Sponsum transívit prídie hujus diéi.

    Apud Sántonas, in Gállia, beáti Eutrópii, Epíscopi et Mártyris, qui, a sancto Cleménte Papa, ordinis pontificális grátia consecrátus, in Gálliam diréctus est, ibíque, perácta diu prædicatióne, tandem, ob Christi testimónium, collíso cápite, victor occúbuit.

    Córdubæ, in Hispánia, sanctórum Mártyrum Amatóris Presbýteri, Petri Mónachi, et Ludovíci.

    Nováriæ sancti Lauréntii Presbýteri, et puerórum Mártyrum, quos ille suscéperat educándos.

    Alexandríæ sanctórum Mártyrum Aphrodísii Presbýteri, et aliórum trigínta.

    Lambésæ, in Numídia, natális sanctórum Mártyrum Mariáni Lectóris, et Jacóbi Diáconi. Horum prior, cum infestatiónes jamprídem Deciánæ persecutiónis in confessióne Christi vicísset, íterum cum claríssimo colléga tentus est; et ambo, post dira et exquisíta supplícia, mirabíliter divínis revelatiónibus secúndo confortáti, novíssime, cum multis áliis, gládio consummáti sunt.

    Ephesi sancti Máximi Mártyris, qui in persecutióne Décii coronátus est.

    Firmi, in Picéno, sanctæ Sophíæ, Vírginis et Mártyris.

    Evóreæ, in Epíro, sancti Donáti Epíscopi, qui, témpore Theodósii Imperatóris, exímia sanctitáte refúlsit.

    Neápoli, in Campánia, sancti Pompónii Epíscopi.

    Londíni, in Anglia, sancti Erconváldi, ejúsdem sedis Epíscopi. Abbas Certesiénsis fuit, et cum illud monastérium tum aliud mulíerum apud Barking condídit, cui soror ejus sancta Edilburga præfuit. Multis miráculis cláruit, ejúsque festum recólimus décimo octávo Kaléndas Decémbris.

    Chérii, apud Augústam Taurinórum, sancti Joséphi Benedícti Cottoléngo, Confessóris, Parvæ Domus a Divína Providéntia Fundatóris, summa in Deum confidéntia et caritáte in páuperes insígnis, quem Pius Papa Undécimus Sanctórum fastis adscrípsit.
  en: |
    At Rome, the holy Virgin Catherine of Siena, of the order of St Dominic, famous for her life and miracles, whose name Pius II enrolled among those of the holy virgins, and whose feast we keep upon the 5th day of May.

    At Lambesa, in Numidia, the holy martyrs the Reader Marian, and the Deacon James. Marian had already triumphed over persecution by confessing Christ, under the Emperor Decius, but was arrested again along with his illustrious companion. After dire torments both were wondrously strengthened by revelations from God, and were at last beheaded, along with many others.

    At Saintes, the blessed martyr Eutropius, Bishop of that see, who was consecrated a Bishop by holy Clement and sent into Gaul, where he long preached, and then died a conqueror, having his head broken in for confessing Christ.

    At Cordova, the holy martyrs the Priest Amator, the Monk Peter, and Lewis.

    At Novara, the holy martyrs the Priest Lawrence, and the boys whom he had taken as pupils.

    At Alexandria, the holy martyrs the Priest Aphrodisius, and thirty others.

    At Ephesus, the holy martyr Maximus, who was crowned in the persecution under the Emperor Decius.

    At Fermo, in Picenum, the holy Virgin and martyr Sophia.

    At Naples, in Campania, holy Severus, Bishop of that see, who, amid other wondrous works, did on an occasion raise a dead man from the grave to convict of untruthfulness the false creditor of a widow and orphans.

    At Evorea, in Epirus, holy Donatus, Bishop of that see, who was distinguished for his eminent holiness in the time of the Emperor Theodosius.

    At Naples, in Campania, holy Pomponius, Bishop.

    At London, in England, holy Erconwald, Bishop of that see. He was Abbot of Chertsey, and founded both that monastery and one for women at Barking, which was governed by his sister St. Edilburga. He was famous for many miracles, and his feast we keep upon the 14th day of November.

    At Chieri, near Turin, holy Joseph Benedict Cottolengo, Confessor, Founder of the Little House of Divine Providence, remarkable for his great trust in God and his charity toward the poor, whom Pope Pius XI enrolled among the Saints.
