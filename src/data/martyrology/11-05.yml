# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "11-05"
text:
  la: |
    Sancti Zacharíæ, Sacerdótis et Prophétæ, qui pater éxstitit beáti Joánnis Baptístæ, Præcursóris Dómini.

    Item sanctæ Elísabeth, ejúsdem sanctíssimi Præcursóris matris.

    Tarracínæ, in Campánia, natális sanctórum Mártyrum Felícis Presbýteri, et Eusébii Mónachi. Ex his Eusébius, cum sepelísset sanctos Mártyres Juliánum et Cæsárium, et multos convérteret ad fidem Christi, quos sanctus Felix Présbyter baptizábat, una cum ipso Felíce tentus est; et, ad Júdicis forum ducti nec superáti, inde in cárcerem inclúsi, ambo, nocte eádem, cum sacrificáre noluíssent, decolláti sunt.

    Eméssæ, in Phœnícia, sanctórum Mártyrum Galatiónis et Epistémis cónjugis, qui in Décii persecutióne, flagris cæsi, mánibus pedibúsque et lingua ínsuper mutiláti, dénique, truncáto cápite, martýrium consummárunt.

    Item sanctórum Mártyrum Domníni, Theótimi, Philóthei, Silváni et Sociórum, sub Maximíno Imperatóre.

    Medioláni sancti Magni, Epíscopi et Confessóris.

    Bríxiæ sancti Dominatóris Epíscopi.

    Tréviris sancti Fibítii, qui ex Abbáte factus est ejúsdem civitátis Epíscopus.

    Aureliánis, in Gállia, sancti Læti, Presbýteri et Confessóris.
  en: |
    _

    At Terracina, in Campania, the holy martyrs Felix, a Priest, and Eusebius, a Monk. This Eusebius buried the holy martyrs Julian and Caesarius, and turned many to believe in Christ who were baptized by the holy Priest Felix. He and Felix were therefore tried together and both led before the seat of the judge, where neither was overcome, but were committed to prison together, and the same night, since they refused to sacrifice, they were beheaded.

    At Emesa, in Phoenicia, the holy martyrs Galation, and Epistemis, his wife. In the persecution under Decius they were heavily flogged, and their hands, feet, and tongues mutilated, whereafter they were beheaded, and so finished their testimony.

    Also under the Emperor Maximin, the holy martyrs Domninus, Theotimus, Philotheus, Silvanus, and their Companions.

    At Milan, the holy Confessor Magnus, Bishop.

    At Brescia, holy Dominator, Bishop.

    At Trier, holy Fibitius, who from being Abbot was made Bishop of that city.

    At Orleans, in Gaul, the holy Confessor Laetus, a Priest.
