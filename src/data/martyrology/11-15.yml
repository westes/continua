# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "11-15"
text:
  la: |
    Colóniæ Agrippínæ sancti Albérti Epíscopi et Confessóris, ex Ordine Prædicatórum, cognoménto Magni, sanctitáte et doctrína célebris, quem Pius Papa Undécimus Doctórem universális Ecclésiæ declarávit, et Pius Duodécimus cultórum scientiárum naturálium cæléstem apud Deum Patrónum constítuit.

    Eódem die natális sancti Eugénii, Epíscopi Toletáni et Mártyris; qui fuit beáti Dionýsii Areopagítæ discípulus, et in território Parisiénsi, consummáto martýrii cursu, beátæ passiónis corónam percépit a Dómino. Ipsíus autem corpus Tolétum, in Hispánia, póstea fuit translátum.

    Nolæ, in Campánia, beáti Felícis, Epíscopi et Mártyris; qui, a quintodécimo ætátis suæ anno, miráculis cláruit, et, sub Marciáno Prǽside, cum áliis trigínta Sóciis, agónem martýrii complévit.

    Edéssæ, in Mesopotámia, pássio sancti Abibi Diáconi, qui sub Licínio Imperatóre et Lysánia Prǽside, únguibus lacerátus, in ignem conjéctus est.

    Ibídem sanctórum Mártyrum Guríæ et Samónæ, sub Diocletiáno Imperatóre et Antoníno Prǽside.

    In Africa sanctórum Mártyrum Secúndi, Fidentiáni et Várici.

    Apud Arcum, in território Santonénsi, natális sancti Machúti, Aleténsis in Gállia Epíscopi; qui, in Anglia natus, a primǽvo ætátis suæ tirocínio miráculis emícuit.

    Verónæ sancti Lupérii, Epíscopi et Confessóris.

    Kahlembérgæ, prope Vindobónam, in Austria, sancti Leopóldi, ejúsdem provínciæ Austriæ Marchiónis, quem Innocéntius Papa Octávus in Sanctórum númerum adscrípsit.
  en: |
    _

    At Cologne, holy Albert, Bishop and Confessor, of the Order of Preachers, surnamed the Great, renowned for holiness and learning, whom Pope Pius XI declared Doctor of the universal Church, and Pius XII appointed heavenly Patron with God of the students of the natural sciences.

    The holy martyr Eugene, Archbishop of Toledo, a disciple of blessed Denys, the Areopagite. He finished his testimony in the country of Paris, and received from the Lord a blessed crown of suffering. His body was afterwards brought to Toledo.

    At Nola, in Campania, the holy martyr Felix, Bishop, who was famous for miracles from the fifteenth year of his age upward and gained the battle of martyrdom under the President Marcian, along with thirty others.

    At Edessa, in Syria, under the Emperor Diocletian and Antonine the President, the holy martyrs Gurias and Samonas.

    There likewise, under the Emperor Licinius and the President Lysanias, the holy Deacon Abibus, who was torn with hooks and cast into the fire.

    In Africa, the holy martyrs Secundus, Fidentian, and Varicus.

    In Brittany, holy Machutus, (St. Maclou or St. Malo, first) Bishop (of the ancient See of Aleth, in Brittany,) who was marked by miracles even from his youth upward.

    At Verona, the holy Confessor Luperius, Bishop.

    In Austria, holy Leopold, (Margrave of Austria,) Marquess of that country, whose name Innocent VIII enrolled with those of the Saints.
