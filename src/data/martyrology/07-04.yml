# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "07-04"
text:
  la: |
    Stremótii, in Lusitánia, natális sanctæ Elísabeth Víduæ, Lusitanórum Regínæ, quam, virtútibus et miráculis claram, Urbánus Octávus, Póntifex Máximus, in Sanctórum númerum rétulit. Ejus tamen celébritas octávo Idus mensis hujus recólitur, ex dispositióne Innocéntii Papæ Duodécimi.

    Sanctórum Osée et Aggǽi Prophetárum.

    In território Bituricénsi sancti Lauriáni, Epíscopi Hispalénsis et Mártyris, cujus caput Híspalim, in Hispánia, delátum est.

    In Africa natális sancti Jucundiáni Mártyris, pro Christo in mare demérsi.

    Sírmii sanctórum Mártyrum Innocéntii et Sebástiæ, cum áliis trigínta.

    Madáuri, in Africa, sancti Namphaniónis Mártyris et Sociórum, quos ille roborávit ad pugnam, et ad corónam provéxit.

    Cyréne, in Líbya, sancti Theodóri Epíscopi, qui, in persecutióne Diocletiáni, sub Digniáno Prǽside, plumbátis cæsus et lingua abscíssus est; atque in pace tandem Conféssor occúbuit.

    Augústæ, in Rhǽtia, sancti Uldaríci Epíscopi, miræ abstinéntiæ, largitátis et vigilántiæ virtúte, ac miraculórum dono illústris.

    Turónis, in Gállia, Translátio sancti Martíni, Epíscopi et Confessóris; et Dedicátio Basílicæ suæ hoc ipso die, quo étiam is ante áliquot annos in Epíscopum fúerat ordinátus.
  en: |
    The Prophets Hosea and Haggai.

    In Africa, the holy martyr Jucundian, who was drowned in the sea for Christ's sake.

    In the county of Bourges, in Gaul, the holy martyr Laurian, Bishop of Seville, in Spain, whose head has been taken thither.

    At Sirmich, the holy martyrs Innocentius, Sebastia, and thirty others.

    At Madaurus, in Africa, the holy martyrs Namphanion and his Companions, whom he nerved to the fight and carried on to the crown.

    At Cyrene, in Libya, the holy Confessor Theodorus, Bishop, who in the persecution under Diocletian was hided with scourges loaded with lead, under the President Dignian, and had his tongue cut out, but in the end died in peace.

    At Augsburg, holy Ulderic, Bishop, famous for the grace of wonderful self-restraint, beneficence, watchfulness, and miracles.

    At Lisbon, the holy widow Isabel, Queen of Portugal, whose feast is kept upon the 8th day of this present month of July by order of Pope Innocent XII.

    At Tours, are commemorated upon this same day both the translation of the body of the holy Confessor Martin, Bishop of that city, and the dedication of his church there, being also the same day whereon he had been ordained Bishop not many years before.
