# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-03"
text:
  la: |
    Hierosólymis Invéntio beatíssimi Stéphani Protomártyris, et sanctórum Gamaliélis, Nicodémi et Abibónis, sicut Luciáno Presbýtero divínitus revelátum est, Honórii Príncipis témpore.

    Philíppis, in Macedónia, sanctæ Lýdiæ purpuráriæ, quæ, prædicánte ibídem sancto Paulo Apóstolo, ut beátus Lucas in Actibus Apostólicis refert, ómnium prima crédidit Evangélio.

    Neápoli, in Campánia, sancti Aspréni Epíscopi, qui a sancto Petro Apóstolo, curátus ab infirmitáte ac deínde baptizátus, ejúsdem civitátis Epíscopus ordinátus fuit.

    Constantinópoli natális sancti Hermélli Mártyris.

    Apud Indos, Persis finítimos, pássio sanctórum Monachórum, et aliórum fidélium, quos Abénner Rex, pérsequens Ecclésiam Dei, divérsis afflíctos supplíciis, cædi jussit.

    Augustodúni deposítio sancti Euphrónii, Epíscopi et Confessóris.

    Anágniæ sancti Petri Epíscopi, qui, monástica primum observántia, deínde pastoráli vigilántia clarus, quiévit in Dómino.

    Beróeæ, in Sýria, sanctárum mulíerum Maránæ et Cyræ.
  en: |
    Upon the same day, were born into the better life:

    At Constantinople, the holy martyr Hermellus.

    In India, upon the coasts of Persia, the holy Monks and others whom King Abenner, when he was persecuting the Church of God, caused to be tormented and slain in diverse ways.

    At Naples, in Campania, holy Aspren, Bishop of Naples, who was healed of sickness by the holy Apostle Peter, and thereupon procuring himself to be baptized was ordained Bishop of that city.

    At Autun, the holy Confessor Euphronius, Bishop.

    At Anagni, holy Peter, Bishop, who fell asleep in the Lord, famous for his observance as a Monk first, and afterwards for his carefulness as a shepherd.

    At Philippi, in Macedonia, holy Lydia, a seller of purple, who was the first of all to believe the Gospel there at the preaching of the holy Apostle Paul. [Acts xvi, 14]

    At Bercea, in Syria, the holy women Marana and Cyra, [Virgins of Bercea.]
