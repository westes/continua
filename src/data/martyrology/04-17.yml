# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-17"
text:
  la: |
    Romæ sancti Anicéti, Papæ et Mártyris; qui martýrii palmam in persecutióne Marci Aurélii Antoníni et Lúcii Veri accépit.

    Córdubæ, in Hispánia, sanctórum Mártyrum Eliæ Presbýteri, Pauli et Isidóri Monachórum, qui, in persecutióne Arábica, ob Christiánæ fídei professiónem, interémpti sunt.

    Antiochíæ sanctórum Mártyrum Petri Diáconi, et Hermógenis, qui ejúsdem Petri erat miníster.

    In Africa natális beáti Mappálici Mártyris, qui (ut scribit sanctus Cypriánus in epístola ad Mártyres et Confessóres), cum áliis plúribus, martýrio coronátus est.

    Ibídem sanctórum Mártyrum Fortunáti et Marciáni.

    Viénnæ, in Gállia, sancti Pantágathi Epíscopi.

    Dertónæ sancti Innocéntii, Epíscopi et Confessóris.

    Cistércii, in Gállia, sancti Stéphani Abbátis, qui primus erémum Cisterciénsem incóluit, et sanctum Bernárdum, cum sóciis ad se veniéntem, lætus excépit.

    In monastério Casæ Dei, Claromontánæ diœcésis, in Gállia, sancti Robérti Confessóris, qui ejúsdem monastérii cónditor et primus Abbas éxstitit.
  en: |
    At Rome, the holy martyr Pope Anicetus, who received the palm of martyrdom in the persecution under Marcus Aurelius Antoninus and Lucius Verus.

    In Africa, the blessed martyr Mappalicus, who, was crowned, along with diverse other martyrs, as it is written by holy Cyprian in his epistle to the Martyrs and Confessors.

    Likewise in Africa, the holy martyrs Fortunatus and Marcian.

    At Antioch, the holy martyrs Peter the Deacon and Hermogenes his servant.

    At Cordova, the holy martyrs Elias the Priest, and the monks Paul and Isidore.

    At Vienne, holy Pantagathus, Bishop [of that see. He sat for five years and is reckoned the twentieth Bishop of the see. He was present at the Third Council of Orleans. He had been consul.]

    At Tortona, the holy Confessor Innocent, Bishop.

    At Citeaux, in Gaul, holy Stephen, Abbot, who first dwelt in the wilderness of Citeaux, and gladly received holy Bernard when he came to him with his companions.

    In the monastery of Chaise-Dieu, in the Diocese of Clermont, the holy Confessor Robert, the founder and first Abbot of that monastery.
