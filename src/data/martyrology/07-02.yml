# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "07-02"
text:
  la: |
    Romæ, via Aurélia, natális sanctórum Mártyrum Procéssi et Martiniáni, qui, a beáto Petro Apóstolo in Mamertíni custódia baptizáti, et, sub Neróne, oris contusiónem, equúleum, nervos, fustes, flammas scorpionésque perpéssi, novíssime, gládio percússi, martýrio coronáti sunt.

    Item Romæ pássio sanctórum trium mílitum, qui, ad Christum convérsi in martýrio beáti Pauli Apóstoli, cum eo partícipes fieri cæléstis glóriæ meruérunt.

    Eódem die sanctórum Mártyrum Aristónis, Crescentiáni, Eutychiáni, Urbáni, Vitális, Justi, Felicíssimi, Felícis, Márciæ et Symphorósæ; qui omnes apud Campániam, cum Diocletiáni Imperatóris persecútio desævíret, martýrio coronáti sunt.

    Wintóniæ, in Anglia, sancti Swithúni Epíscopi, cujus sánctitas miráculis effúlsit.

    Bambérgæ sancti Othónis, ejúsdem sedis Epíscopi, qui Pomeránis Evangélium prædicávit, et eos ad fidem convértit.

    Lýciis, in Apúlia, sancti Bernardíni Realíno, Confessóris, qui magistrátus múnere egrégie functus, Societátem Jesu ingréssus et sacerdótio auctus, caritáte ac miráculis incláruit.

    Turónis, in Gállia, deposítio sanctæ Monegúndis, religiósæ féminæ.
  en: |
    At Rome, upon the Aurelian Way, the holy martyrs Processus and Martinian, who were baptized by the blessed Apostle Peter in the Mamertine Prison, and crowned with martyrdom under Nero by being slain with the sword, after suffering the beating of their mouths, the rack, thongs, cudgels, fire, and loaded whips.

    At Rome also, the three holy soldiers who turned to Christ at the martyrdom of the blessed Apostle Paul, and thus earned a share with him in the glory of heaven.

    On the same day, the holy martyrs Ariston, Crescentian, Eutychian, Urban, Vitalis, Justus, Felicissimus, Felix, Marcia, and Symphorosa, who were all crowned with martyrdom in the Campania while the persecution was raging under the Emperor Diocletian.

    At Winchester, in England, the holy Swithin, Bishop of that city, whose holiness shone forth in the grace of working miracles, and whose feast day we keep upon the 15th day of this present month of July.

    At Bamberg, holy Otto, Bishop of that see, who preached the Gospel to the Pomeranians, and turned them to the faith.

    At Lecce, in Apulia, holy Bernardine Realino, Confessor, who, when he had worthily discharged the office of a magistrate, entered the Society of Jesus, was raised to the priesthood, and shone with charity and miracles.

    At Tours, the holy woman Monegund.
