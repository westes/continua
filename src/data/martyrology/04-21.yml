# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-21"
text:
  la: |
    Cantuáriæ, in Anglia, sancti Ansélmi Epíscopi, Confessóris et Ecclésiæ Doctóris, sanctitáte et doctrína conspícui.

    In Pérside natális sancti Simeónis, Epíscopi Seleucíæ et Ctesiphóntis, qui, jubénte Rege Persárum Sápore, comprehénsus ferróque onústus, iníquis tribunálibus exhíbitus, et, cum Solem ipsum adoráre nollet et de Jesu Christo voce líbera et constantíssima testarétur, primum carceráli ergástulo, cum áliis centum (ex quibus álii Epíscopi, álii erant Presbýteri, álii diversórum órdinum Clérici), longo témpore macerátus est. Deínde, cum Usthazánes, Regis nutrítius, qui ante jam lapsus a fide, sed per eum ad pæniténtiam fúerat revocátus, martýrium constánter subiísset, postrídie, qui erat ánnuus Domínicæ passiónis dies, ómnibus ante Simeónis óculos, qui unumquémque eórum strénue exhortabátur, gládio jugulátis, novíssime et ipse decollátus est. Passi sunt étiam cum ipso claríssimi viri Abdéchalas et Ananías, qui ejus erant Presbýteri. Pusícius quoque, Præféctus artíficum Regis, eo quod Ananíam titubántem corroborásset, ídeo, collo circa téndinem perforáto et lingua exínde extrácta, crudéli morte occúbuit; post quem et fília ejus, quæ erat sacra Virgo, plúribus et diris afflícta cruciátibus ac demum ense decolláta est.

    Alexandríæ sanctórum Mártyrum Aratóris Presbýteri, Fortunáti, Felícis, Sílvii et Vitális, qui in cárcere quievérunt.

    Nicomedíæ sanctórum Mártyrum Apóllinis, Isácii et Codráti; e quibus, sub Diocletiáno Imperatóre, últimus cápite plexus, et, paucis post illum diébus, duo primi in vínculis fame confécti, martýrii corónam meruérunt.

    Antiochíæ sancti Anastásii Sinaítæ Epíscopi.

    Œttingæ Véteris, in Bavária, sancti Conrádi a Parzham, Confessóris, Ordinis Minórum Capuccinórum, caritáte et oratióne insígnis, quem, miráculis clarum, Pius Papa Undécimus Sanctórum número adscrípsit.
  en: |
    At Canterbury, in England, holy Anselm, Archbishop of that see, illustrious for his holiness and teaching.

    In Persia, the holy martyr Simeon, Bishop of Seleucia and Ctesiphon. He was arrested by order of Sapor, King of the Persians, loaded with chains, and brought before the iniquitous judgment-seat. He refused to worship the sun, and with a free and unfaltering voice bore witness for Christ Jesus. He suffered a long while in prison along with a hundred others, whereof some were bishops, some priests, and others clergy of diverse orders. He recalled to repentance Usthazanes, the king's tutor, who had fallen away from the faith, but who now bravely underwent martyrdom. On the day after, which was the anniversary of the Lord's Sufferings, all the others were slain with the sword before the eyes of Simeon, who earnestly exhorted every one of them,  and at the last was himself also beheaded. There suffered, moreover, along with him his eminent Priests Abdechalas and Ananias also Pusicius, the foreman of the king's workmen, who encouraged Ananias when he was wavering, and who was put to a very cruel death by having his tongue cut out through a hole in his neck; and after him was put to death his daughter, who was an hallowed virgin.

    At Alexandria, the holy martyrs, the Priest Arator, Fortunatus, Felix, Silvius, and Vitalis, who fell asleep in prison.

    Also, the holy martyrs Apollo, Isacius, and Crotates, who suffered under the Emperor Diocletian.

    At Antioch, the holy Bishop of that city, Anastasius of Sinai.

    At Altotting, in Bavaria, holy Conrad of Parzham, Confessor, of the Order of Friars Minor Capuchins, remarkable for charity and prayer, whom, famous for miracles, Pope Pius XI numbered among the Saints.
status:
  la: verified
  en: verified
