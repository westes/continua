# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "06-30"
text:
  la: |
    Commemorátio sancti Pauli Apóstoli.

    Romæ sanctæ Lucínæ, Apostolórum discípulæ, quæ, de facultátibus suis commúnicans Sanctórum necessitátibus, Christiános in cárcere detentos visitábat, ac sepultúræ Mártyrum inserviébat; juxta quos et ipsa, in crypta a se constrúcta, sepúlta est.

    Item Romæ sanctæ Æmiliánæ Mártyris.

    Ipso die sanctórum Mártyrum Caji Presbýteri, et Leónis Subdiáconi.

    Alexandríæ pássio sancti Basílidis, qui, sub Sévero Imperatóre, cum sanctam Potamiœ́nam Virginem, quam ad supplícium ducébat, ab impudicórum hóminum petulántia tutátus esset, religiósi offícii mercédem ab ea recépit; nam ipsa, post tríduum illi appárens et ejus cápiti corónam impónens, non tantum convértit eum ad Christum, sed étiam, brevi agóne certántem, suis précibus Mártyrem gloriósum effécit.

    Lemóvicis, in Aquitánia, sancti Martiális Epíscopi, cum duóbus Presbýteris Alpiniáno et Austricliniáno; quorum vita signis miraculórum ádmodum effúlsit.

    In território Vivariénsi, in Gálliis, sancti Ostiáni, Presbýteri et Confessóris.

    Saánicæ, in território Vicéntino, sancti Theobáldi, Presbýteri et Eremítæ, ex Campániæ Gállicæ Comítibus; quem Alexánder Papa Tértius, ob sanctitátis et miraculórum famam, Sanctórum cánoni adjúnxit.
  en: |
    At Limoges, in Gaul, holy Martial, first Bishop, and the two Priests Alpinian and Austriclinian, whose lives shone brightly with the fame of miracles.

    On the same day, the holy martyrs, the Priest Caius and the Sub-Deacon Leo.

    At Alexandria, under the Emperor Severus, the holy martyr Basilides. He led the holy Virgin Potamicena to execution, and while doing so, protected her from the insults of some lewd man, and he received a reward from her for this reverential service. Three days afterwards she appeared to him and put a crown upon his head, by the which vision she not only turned him to Christ, but also by her prayers, while he fought his short fight, she made him a glorious martyr.

    At Rome, holy Lucina, a disciple of the Apostles, who contributed of her goods to the necessities of the Saints, visited the Christians who were kept bound in prison, and ministered to the burial of the martyrs, beside whom she was buried in a vault which she made for herself.

    Also at Rome, the holy Virgin Aemiliana.

    At Viviers, the holy Priest and Confessor Ostian.

    At Sanica, in the territory of Vicenza, holy Theobald, Priest and Hermit, of the Counts of Champagne in France, whom Pope Alexander III, because of the fame of his holiness and miracles, added to the canon of the Saints.
