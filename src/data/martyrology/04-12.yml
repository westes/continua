# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-12"
text:
  la: |
    Verónæ pássio sancti Zenónis Epíscopi, qui inter persecutiónis procéllas eam Ecclésiam mira constántia gubernávit, et, Galliéni témpore, martýrio coronátus est.

    In Cappadócia sancti Sabæ Gothi, qui, sub Valénte Imperatóre, cum Rex Gothórum Athanarícus Christiános insequerétur, in flumen, post dira torménta, projéctus est; quo étiam témpore (ut sanctus Augustínus scribit) quamplúrimi ex Gothis orthodóxis coróna martýrii sunt insigníti.

    Brácari, in Lusitánia, sancti Victóris Mártyris, qui, adhuc catechúmenus, cum noluísset idólum adoráre, et Christum Jesum magna constántia conféssus fuísset, ídeo, post multa torménta, cápite abscísso, méruit próprio sánguine baptizári.

    Firmi, in Picéno, sanctæ Víssiæ, Vírginis et Mártyris.

    Romæ, via Aurélia, natális sancti Júlii Papæ Primi, qui advérsus Ariános pro fide cathólica plúrimum laborávit, ac, multis præcláre gestis, sanctitáte célebris quiévit in pace.

    Apud Vapíngum óppidum, in Gállia, sancti Constantíni, Epíscopi et Confessóris.

    Papíæ sancti Damiáni Epíscopi.
  en: |
    At Verona, the holy martyr Zeno, Bishop, which he governed with admirable faithfulness amid the storms of persecution. He was crowned with martyrdom in the time of the Emperor Gallienus.

    In Cappadocia, the holy martyr Saba the Goth, who was put to grievous torments and then drowned in the river, when Athanaric, king of the Goths, was persecuting the Christians under the Emperor Valens. At the which time, according to holy Augustine, very many orthodox Goths won the crown of martyrdom.

    At Braga, in Portugal, the holy martyr Victor. He was only as yet preparing for baptism, when he refused to worship an idol, and with great faithfulness confessed Christ Jesus, for the which cause he was put to many torments and beheaded, and so obtained baptism in his own blood.

    At Fermo, in Picenum, the holy Virgin and martyr Vissia.

    At Rome, upon the Aurelian Way, holy Pope Julius I., who contended stoutly for the Catholic Faith against the Arians, and after many eminent acts fell asleep in peace, famous for holiness.

    At the town of Gap, the holy Confessor Constantine, Bishop.

    At Pavia, holy Damian, Bishop of that see.
