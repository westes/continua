# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-20"
text:
  la: |
    Vigília sancti Thomæ Apóstoli.

    Romæ natális sancti Zephyríni, Papæ et Mártyris. Ipsíus tamen festum recólitur séptimo Kaléndas Septémbris.

    Ibídem pássio sancti Ignátii, Epíscopi et Mártyris; qui, tértius post beátum Petrum Apóstolum, Antiochénam rexit Ecclésiam. Hic, in persecutióne Trajáni, damnátus ad béstias, Romam vinctus míttitur; ibíque, circumsedénte Senátu, immaníssimis pœnárum supplíciis primo est afféctus, dehinc objícitur leónibus, quorum déntibus præfocátus, hóstia Christi effícitur. Ejus vero festívitas Kaléndis Februárii celebrátur.

    Item Romæ sanctórum Mártyrum Liberáti et Bájuli.

    In Arábia sanctórum Mártyrum Eugénii et Macárii Presbyterórum, qui a Juliáno Apóstata, cum ipsíus impietátem arguíssent, sævíssimis plagis affécti sunt, atque in vastíssimam erémum relegáti, et gládio cæsi.

    Alexandríæ sanctórum mílitum et Mártyrum Ammónis, Zenónis, Ptolemǽi, Ingenis et Theóphili; qui, tribunálibus astántes, cum quidam Christiánus, in supplíciis pósitus, trepidáret et jam prope ad negándum declináret, vultu, óculis ac nútibus illum conabántur erígere. Cumque hac de causa clamor totíus pópuli in eos prosilíret, prorumpéntes in médium se Christiános esse testáti sunt; per quorum victóriam Christus, qui suis eam animi constántiam déderat, gloriosíssime triumphávit.

    Géldubæ, in Germánia, sancti Júlii Mártyris.

    Antiochíæ natális sancti Philogónii Epíscopi, qui, Dei nutu ex causídico ad eam Ecclésiam regéndam accersítus, advérsus Aríum, una cum sancto Alexándro Epíscopo et Sóciis, primum pro fide cathólica certámen íniit, clarúsque méritis quiévit in Dómino; cujus ánnuam festivitátem sanctus Joánnes Chrysóstomus præcláro encómio celebrávit.

    Bríxiæ sancti Domínici, Epíscopi et Confessóris.

    In Hispánia deposítio sancti Domínici de Sylos Abbátis, e sancti Benedícti Ordine, miráculis in captivórum liberatióne celebérrimi.
  en: |
    _

    In the same city, the passion of holy Ignatius, Bishop and martyr; who, third after blessed Peter the Apostle, ruled the church of Antioch. He, in the persecution under Trajan, was condemned to the beasts and sent in chains to Rome; and there, the Senate sitting round, was first afflicted with most cruel torments, and afterward cast to lions, by whose teeth he was crushed and became the sacrifice of Christ. His feast is kept upon the 1st day of February.

    At Rome, the birthday of holy Zephyrinus, Pope and martyr. His feast, however, is kept upon the 26th day of August.

    At Rome, the holy martyrs Liberatus, Bajulus, Ammon, Zeno, Ptolemy, Ingenes, and Theophilus, all martyrs. They were on guard beside the judgment-seat when a certain Christian who was under the torture began to waver and was almost giving way, and they tried by signs to encourage him to hold out; for this cause all the people cried out against them, and they came forward and confessed themselves to be Christians and Christ, who Himself had given such steadfastness unto His own, did Himself most gloriously triumph in their victory.

    At Geldube, the holy martyr Julius.

    In Arabia, the holy martyrs Eugenius and Macarius, two Priests who blamed the ungodliness of the Emperor Julian the Apostate, and for that cause were most cruelly flogged and sent out into the great desert, where they were slain with the sword.

    At Antioch, holy Philogonius, Patriarch of the see. He was an advocate when he was called by the will of God to govern that church, and first took up the contending for the Catholic faith along with holy Bishop Alexander, and his Companions, against Arius. He fell asleep in the Lord, illustrious for good works. Holy John Chrysostom preached an eloquent sermon on his feast-day.

    At Brescia, the holy Confessor Dominic, Bishop.

    On this day is commemorated the burial in Spain of holy Dominic, Abbot of Silos, (in the diocese of Burgos, in Castile, which abbey he founded,) of the Order of St. Benedict, very famous  for his miracles wrought for the liberation of captives. (He died in his  monastery at Silos, on December 14, 1073.)
