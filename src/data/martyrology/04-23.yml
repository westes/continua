# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-23"
text:
  la: |
    Natális sancti Geórgii Mártyris, cujus illústre martýrium inter Mártyrum corónas Ecclésia Dei venerátur.

    In vico Tenkítten, ad sinum Venédicum, in Borússia, item natális sancti Adalbérti, Epíscopi Pragénsis et Mártyris, qui Polónis et Húngaris Evangélium prædicávit.

    Valéntiæ, in Gállia, pássio sanctórum Mártyrum Felícis Presbýteri, Fortunáti et Achilléi Diaconórum. Hi, cum fuíssent a beáto Irenǽo, Lugdunénsi Epíscopo, missi ad prædicándum verbum Dei, et máximam illíus civitátis partem ad Christi fidem convertíssent, a Duce Cornélio sunt in cárcerem trusi; deínde, diutíssime verberáti, cruribúsque confráctis, circa rotárum vertíginem stricti, fumum quoque in equúlei suspensióne perpéssi; ad extrémum gládio consummáti sunt.

    Medioláni sancti Mároli, Epíscopi et Confessóris.

    Tulli, in Gállia, sancti Gerárdi, ejúsdem civitátis Epíscopi.
  en: |
    The holy martyr George, whose illustrious martyrdom, the church of God honours among the crowns of her martyrs.

    At Valence, in Gaul, the holy martyrs the Priest Felix and the Deacons Fortunatus and Achilleus. They had been sent forth to preach the Word of God by blessed Irenaeus, Bishop of Lyon, and had brought a great part of the city of Valence to believe in Christ, when they were cast into prison by Cornelius the general. They were long beaten, their legs were broken, they were tied to the outside of turning wheels, hung in smoke upon the rack, and at length slain with the sword.

    In Prussia, the holy martyr Adalbert, Bishop of Prague, who preached the Gospel to the Poles and Hungarians.

    At Milan, the holy Confessor Marolus, Bishop.

    At Toul, in Gaul, holy Gerard, Bishop of that city.
status:
  la: verified
