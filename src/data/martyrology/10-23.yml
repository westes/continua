# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-23"
text:
  la: |
    Apud Villáckum, in Pannónia, natális sancti Joánnis de Capistráno, Sacerdótis ex Ordine Minórum et Confessóris, vitæ sanctitáte ac fídei cathólicæ propagándæ zelo illústris; qui Taurunénsem arcem, validíssimo Turcárum exércitu profligáto, suis précibus et miráculis ab obsidióne liberávit. Ejus tamen festívitas quinto Kaléndas Aprílis recólitur.

    Antiochíæ item natális sancti Theodóri Presbýteri, qui, in persecutióne ímpii Juliáni comprehénsus, et, post equúlei pœnam et multos ac duríssimos cruciátus, lampádibus étiam circa látera appósitis adústus, tandem, cum in confessióne Christi persísteret, gládii occisióne martýrium consummávit.

    Ad fundum Ursoniánum, prope Gades, in Hispánia, sanctórum Mártyrum Servándi et Germáni, qui, in persecutióne Diocletiáni, sub Viatóre Vicário, post vérbera, squalórum cárceris, famis ac sitis injúriam, et longíssimi itíneris labórem, quem pertulérunt ferro onústi, novíssime martýrii sui cursum, cæsis cervícibus, implevérunt; ex quibus Germánus Eméritæ, Servándus autem Híspali cónditus est.

    Constantinópoli sancti Ignátii Epíscopi, qui, cum Bardam Cǽsarem ob repudiátam uxórem arguísset, ab eo multis injúriis afféctus est, et in exsílium pulsus; sed, a sancto Nicoláo, Románo Pontífice, restitútus, tandem in pace quiévit.

    Burdígalæ sancti Severíni, Epíscopi Coloniénsis et Confessóris.

    Rotómagi sancti Románi Epíscopi.

    Apud Salérnum sancti Veri Epíscopi.

    In território Ambianénsi sancti Domítii Presbýteri.

    In pago Pictaviénsi sancti Benedícti Confessóris.

    Mántuæ Beáti Joánnis Boni, ex Eremitárum sancti Augustíni Ordine, Confessóris; cujus præcláram vitam sanctus Antonínus conscrípsit.
  en: |
    At Mantua, blessed John Boni, of the Order of Hermits of Saint Augustine, whose illustrious life hath been written by holy Antonine.

    At Osuna, near Cadiz, in Spain, the holy martyrs Servandus and Germanus. Under the Imperial Vicar Viator, in the persecution under the Emperor Diocletian, they suffered stripes, a foul imprisonment, hunger and thirst, and a long and toilsome journey, which they were forced to make loaded with irons, and in the end finished the course of their martyrdom by being beheaded. Germanus is buried at Merida and Servandus at Seville.

    At Antioch, in Syria, the holy Priest Theodore. In the persecution under the Emperor Julian, the impious apostate, he was arrested and racked, and after many and terrible sufferings, wherein he was partly burnt by the putting of lamps to his sides, he was beheaded, and so finished his martyrdom, still steadfast in the confession of Christ.

    At Constantinople, the holy Archbishop Ignatius, who suffered much at the hands of the Caesar Bardas, because he rebuked him for having put away his wife, and was sent into exile, but was restored by Nicholas I., Pope of Rome, and in the end fell asleep in peace.

    At Bordeaux, the holy Confessor Severinus, Bishop of Cologne, (and afterward of Bordeaux.)

    At Rouen, holy Romanus, Bishop.

    At Salerno, holy Verus, Bishop.

    In the country of Amiens, the holy Priest Domitius.

    At Poitiers, the holy Confessor Benedict.

    At Willach, in Pannonia, the holy Confessor John of Capistrano, of the Order of Friars Minor, illustrious for the holiness of his life and for his zeal for the propagation of the Catholic faith, who by his prayers and miracles procured the defeat of a vast army of Turks, and delivered the fortress of Belgrade from beleaguerment. We keep his feast upon the 28th day of March.
status:
  la: verified
  en: verified
