# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-17"
text:
  la: |
    Parédii, in diœscési Augustodunénsi, sanctæ Margarítæ Maríæ Alacóque, quæ, Ordinem Visitatiónis beátæ Maríæ Vírginis proféssa, exímiis in devotióne erga sacratíssimum Cor Jesu propagánda et público ejúsdem cultu provehéndo méritis excélluit; atque in sanctárum Vírginum album a Benedícto Papa Décimo quinto reláta fuit.

    Antiochíæ natális sancti Herónis, qui fuit discípulus beáti Ignátii; atque, post eum factus Epíscopus, viam magístri pius imitátor est secútus, et pro commendáto sibi grege amátor Christi occúbuit.

    Eódem die pássio sanctórum Victóris, Alexándri et Mariáni.

    In Pérside sanctæ Maméltæ Mártyris, quæ, a cultu idolórum ad fidem Angélico mónitu convérsa, a Gentílibus lapidáta est et in profúndum lacum demérsa.

    Aráusicæ, in Gálliis, sancti Floréntii Epíscopi, qui, multis clarus virtútibus, quiévit in pace.
  en: |
    At Paray, in the diocese of Autun, holy Margaret Mary Alacoque, who, professed of the Order of the Visitation of the blessed Virgin Mary, excelled in singular merits in spreading devotion to the most sacred Heart of Jesus and in advancing its public worship; and was enrolled in the roll of the holy Virgins by Pope Benedict XV.

    At Antioch, the holy martyr Heron, a disciple of blessed Ignatius, after whom he was made Bishop of that city. He followed in all godliness in the steps of his master, and for the love of Christ laid down his life for the sheep committed to his care.

    Upon the same day, the holy martyrs Victor, Alexander, and Marian.

    In Persia, the holy martyr Mamelta. She was turned to the faith from the worshipping of idols by a warning from an angel, was stoned by the Gentiles, and drowned in the depths of a lake.

    At Orange, in Gaul, holy Florentine, Bishop, who was famous for many graces, and fell asleep in the Lord.
status:
  la: verified
  en: verified
