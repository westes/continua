# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "01-08"
text:
  la: |
    Venétiis deposítio sancti Lauréntii Justiniáni, primi Patriárchæ urbis ejúsdem et Confessóris; quem, doctrína et supérnis divínæ sapiéntiæ charismátibus copiosíssime replétum, Alexánder Octávus, Póntifex Máximus, in Sanctórum númerum rétulit. Ipsíus autem festívitas Nonis Septémbris, quo die Cáthedram pontificálem ascéndit, potíssimum celebrátur.

    Bellováci, in Gálliis, sanctórum Mártyrum Luciáni Presbýteri, primi ejúsdem sedis Epíscopi, Maximiáni et Juliáni. Horum duo últimi a persecutóribus gládio perémpti sunt; beátus autem Luciánus, qui, una cum sancto Dionýsio, in Gálliam vénerat, et ipse, post nímiam cædem, cum Christi nomen viva voce confitéri non timuísset, priórum senténtiam excépit.

    In Líbya sanctórum Mártyrum Theóphili Diáconi, et Helládii, qui, primo laniáti ac téstulis peracútis compúncti, demum, in ignem conjécti, ánimas Deo reddidérunt.

    Augustodúni sancti Eugeniáni Mártyris.

    Hierápoli, in Asia, sancti Apollináris Epíscopi, qui, sub Marco Antoníno Vero, sanctitáte atque doctrína flóruit.

    Neápoli, in Campánia, natális sancti Severíni Epíscopi, qui fuit frater beáti Victoríni Mártyris; et, post multárum virtútum perpetratiónem, plenus sanctitáte quiévit.

    Metis, in Gállia, sancti Patiéntis Epíscopi.

    Pápiæ sancti Máximi, ejúsdem sedis Epíscopi et Confessóris, successóris sancti Epiphánii. Is Conciliis Romanis, quarto et sexto, a Symmacho Papa advérsus Lauréntium Antipápam ineúnte sexto sǽculo habítis, interfuit.

    Ratisbónæ, in Bavária, sancti Erhárdi Epíscopi.

    Apud Nóricos sancti Severíni Abbátis, qui apud eam gentem Evangélium propagávit, et Austriacórum et Noricórum dictus est Apóstolus. Ejus corpus ad Lucullánum prope Neápolim, in Campánia, divínitus delátum, inde póstea ad monastérium sancti Severíni translátum est.
  en: |
    At Beauvais, in Gaul, the holy martyrs Lucian the Priest, first Bishop of that see, Maximian, and Julian. Maximian and Julian were slain by the persecutors with the sword, but the blessed Lucian, who had come into Gaul with holy Denis, did not receive the like treatment until after great suffering, the which notwithstanding, he feared not to confess aloud the name of Christ.

    Likewise the holy martyr Eugenian.

    In Libya, the holy martyrs Theophilus the Deacon, and Helladius, who were first torn and mangled with sharp potsherds, and then cast into the fire, and so gave up their souls to God.

    At Venice, the blessed Confessor Lawrence de' Giustiniani, the first Patriarch of that city he was filled very abundantly with learning and gifts of divine wisdom from on high, and Alexander VIII. enrolled his name among those of the saints. We keep his festival upon the fifth day of September.

    At Hierapolis, in Asia, holy Apollinaris, Bishop, who was eminent for holiness and learning, in the time of the Emperor Marcus Antoninus Verus.

    At Naples, in Campania, holy Severinus, Bishop, brother of the blessed martyr Victorinus he wrought many good works, and fell asleep full of holiness.

    At Pavia, the holy Confessor Maximus, Bishop of that see, successor to St Epiphanius. He took part in the 4th and 6th Councils of Rome, held by Pope Symmachus against the Antipope Lawrence at the beginning of the sixth century.

    At Regensburg in Bavaria, holy Bishop Erhard.

    At Metz, holy Patient, Bishop.

    On the same day, in Bavaria, the holy Abbot Severinus, who spread the Gospel among that people, and is called the Apostle of the Austrians and Bavarians. His body was, by the will of God, brought to Montefeltro, near Naples, and thence it hath been since taken to the monastery of St. Severino.
status:
  la: verified
  en: verified
