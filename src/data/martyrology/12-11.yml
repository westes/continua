# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-11"
text:
  la: |
    Romæ sancti Dámasi Primi, Papæ et Confessóris; qui Apollinárem hæresiárcham damnávit, et Petrum, Epíscopum Alexandrínum, fugátum restítuit; multa étiam sanctórum Mártyrum córpora invénit, eorúmque memórias vérsibus exornávit.

    Item Romæ pássio sancti Trasónis, qui, cum Christiános laborántes in thermis, aliísque opéribus públicis fatigátos, et in cárcere pósitos, de suis facultátibus áleret, jussu Maximiáni tentus est, et cum áliis duóbus, id est Pontiáno et Prætextáto, martýrio coronátus.

    Ambiáni, in Gállia, sanctórum Mártyrum Victórici et Fusciáni, sub eódem Imperatóre, in quorum náribus et áuribus jussit Rictiovárus Præses immítti tarínchas, et clavis ardéntibus témpora transfígi, deínde óculos evélli, ac póstmodum eórum córpora jaculári; sicque, una cum sancto Gentiáno, eórum hóspite, capítibus amputátis, migravérunt ad Dóminum.

    Astrahárae, prope Persépolim, in Pérside, sancti Bársabæ Mártyris.

    In Hispánia sancti Eutýchii Mártyris.

    Placéntiæ sancti Sabíni Epíscopi, miráculis clari.

    Constantinópoli sancti Daniélis Stylítæ.
  en: |
    At Rome, the holy Confessor Pope Damasus, who condemned the arch-heretic Apollinaris, and restored to his papacy Peter, Pope of Alexandria, who had been driven into exile moreover, he found the bodies of many holy martyrs, and caused to be engraved upon their tombstones verses composed by himself. Likewise at Rome, the holy martyr Thrason, who fed at his own expense Christians who were in prison or sent to work in the baths, or at other public works. He was arrested by order of the Emperor Maximian, and crowned with martyrdom along with two others named Pontian and Pretextatus.

    At Amiens, under the same Emperor Maximian, the holy martyrs Victoricus and Fuscian. Rictiovarus the President had iron spikes driven into their nostrils and ears, and redhot nails hammered into their temples after which their eyes were torn out, their bodies pierced with darts, and their heads cut off, and so they and holy Gentian, their host, passed away to be for ever with the Lord.

    At Astrahara, near Persepolis, in Persia, the holy martyr Barsabas.

    In Spain, the holy martyr Eutychius.

    At Piacenza, holy Sabinus, Bishop of that see, famous for miracles.

    At Constantinople, holy Daniel the Stylite.
