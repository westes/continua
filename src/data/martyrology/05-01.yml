# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "05-01"
text:
  la: |
    Natális beatórum Philíppi et Jacóbi Apostolórum. Ex his Philíppus, cum omnem fere Scýthiam ad Christi fidem convertísset, tandem apud Hierápolim, Asiæ civitátem, cruci affíxus et lapídibus óbrutus, glorióso fine quiévit; Jacóbus vero, qui et frater Dómini légitur et primus Hierosolymórum Epíscopus, e pinna Templi præcipitátus, confráctis inde crúribus, ac fullónis fuste in cérebro percússus, intériit, ibíque, non longe a Templo, sepúltus est.

    Romæ item natális sancti Pii Quinti, ex Ordine Prædicatórum, Papæ et Confessóris; qui, ecclesiásticæ disciplínæ restituéndæ, hærésibus exstirpándis et Christiáni nóminis hóstibus conteréndis strénue ac felíciter incúmbens, vitæ ac legum sanctitáte cathólicam Ecclésiam gubernávit. Ipsíus autem festívitas tértio Nonas mensis hujus celebrátur.

    In Ægýpto sancti Jeremíæ Prophétæ, qui, a pópulo lapídibus óbrutus, apud Taphnas occúbuit, ibíque sepúltus est; ad cujus sepúlcrum fidéles (ut refert sanctus Epiphánius) supplicáre consuevérunt, índeque sumpto púlvere, áspidum mórsibus medéntur.

    In território Vivariénsi, in Gálliis, beáti Andéoli Subdiáconi, qui, una cum áliis, a beáto Polycárpo, Smyrnénsi Epíscopo, ex Oriénte in Gálliam ad prædicándum verbum Dei missus est. Hic, sub Sevéro Imperatóre, spinósis fústibus cæsus, demum, per ensem lígneum cápite in quátuor partes in modum crucis conscísso, martýrium consummávit.

    Oscæ, in Hispánia, sanctórum Mártyrum Oréntii et Patiéntiæ.

    Apud Colúmnam vicum, in Aurelianénsi Gálliæ território, pássio sancti Sigismúndi, Regis Burgundiónum, qui in púteum demérsus occúbuit, ac póstea miráculis cláruit. Sacrum vero ipsíus corpus, e púteo tandem extráctum, ad Ecclésiam Agaunénsis monastérii, intra Sedunénsis diœcésis términos siti, delátum est ibíque honorífice collocátum.

    Antisiodóri sancti Amatóris, Epíscopi et Confessóris.

    Auscii, in Gállia, sancti Oriéntii Epíscopi.

    Elviæ, in Anglia, sancti Asaphi Epíscopi, cujus nómine ipsa cívitas Episcopális póstmodum est insigníta.

    Foro Lívii sancti Peregríni, ex Ordine Servórum beátæ Maríæ Vírginis.

    Bérgomi sanctæ Gratæ Víduæ.
  en: |
    The blessed Apostles Philip and James. Philip brought nearly all Scythia to believe in Christ, but in the end, at the city of Hierapolis, in Asia, was fastened to a cross and stoned, and so fell asleep gloriously. James, who is written of as the brother of the Lord, and was the first Bishop of Jerusalem, was cast down from a pinnacle of the temple, whereby his legs were broken, and he was slain by a blow upon the head from a fuller's pole, and buried there not far from the temple.

    Likewise at Rome, the birthday of holy Pius V, of the Order of Preachers, Pope and Confessor, who, labouring strenuously and happily to restore ecclesiastical discipline, to root out heresies, and to crush the enemies of the Christian name, governed the Catholic Church in holiness of life and of laws. His feast is kept upon the 5th day of this month.

    In Egypt, the holy prophet Jeremiah, who was stoned by the people at Taphnis, and so there died, and was buried. Holy Epiphanius saith that the faithful have been in use to pray at his grave and to take dust therefrom, whereby the bites of serpents are healed.

    In the territory of Viviers, in Gaul, the blessed subdeacon Andeolus, whom holy Polycarp sent from the East along with others into Gaul to preach the Word of God. Under the Emperor Severus he was beaten with thorny clubs, and at length his head was broken into four parts with a wooden sword, and so he attained to martyrdom.

    At Huesca, in Spain, the holy martyrs Orentius and Patience.

    At Sedune, in Gaul, holy Sigismund, King of the Burgundians, who was drowned in a well, and so died, and was afterwards famous for miracles.

    At Auxerre, the holy Confessor Amator, Bishop of that see.

    At Auch, holy Orientius, Bishop of that see.

    In England, holy Asaph, Bishop of the see which is called by his name, and the holy Virgin Walburga, whose feast we keep upon the 14th day of May.

    At Forli, holy Peregrinus, of the Order of Servants of the Blessed Virgin Mary.

    At Bergamo, the holy widow Grata.
