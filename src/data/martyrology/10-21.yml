# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-21"
text:
  la: |
    In Cypro natális sancti Hilariónis Abbátis, cujus vitam, virtútibus atque miráculis plenam, sanctus Hierónymus scripsit.

    Apud Colóniam Agrippínam item natális sanctárum Ursulæ et Sociárum ejus; quæ, pro Christiána religióne et virginitátis constántia ab Hunnis interféctæ, martýrio vitam consummárunt, earúmque plúrima córpora fuérunt Colóniæ cóndita.

    Apud Ostia Tiberína sancti Astérii, Presbýteri et Mártyris; qui (ut in passióne beáti Callísti Papæ légitur) sub Alexándro Imperatóre passus est.

    Nicomedíæ natális sanctórum Dásii, Zótici, Caji et aliórum duódecim mílitum; qui, post divérsa torménta, in mare demérsi sunt.

    Lugdúni, in Gállia, sancti Viatóris, qui éxstitit miníster beáti Justi, Lugdunénsis Epíscopi.

    Maróniæ, prope Antiochíam, in Sýria, sancti Malchi Mónachi.

    In castro Laudunénsi sanctæ Cilíniæ, matris beáti Remígii, Epíscopi Rheménsis.
  en: |
    In Cyprus, the holy Abbot Hilarion, of whom holy Jerome hath written the life, full of graces and wonders.

    At Cologne, the holy Ursula and her Companions, who, for their steadfastness in Christianity and chastity, were massacred by the Huns, and so closed their earthly life by martyrdom. Very many of their bodies are buried at Cologne.

    At Ostia, the holy martyr Asterius, a Priest who suffered under the Emperor Alexander, as is written in the acts of the passion of the blessed Pope Kallistus.

    At Nicomedia, the holy martyrs Dasius, Zoticus, Caius, and twelve others, soldiers, who were diversely tormented, and then drowned in the sea.

    At Lyon, holy Viator, the servant of the blessed Justus, Bishop of Lyon.

    At Maronia, in Syria, near Antioch, the holy monk Malchus.

    At Laon, holy Cilinia, mother of the blessed Remy, Bishop of Reims.
status:
  la: verified
  en: verified
