# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-18"
text:
  la: |
    In Bithýnia natális beáti Lucæ Evangelístæ, qui, multa passus pro Christi nómine, óbiit Spíritu Sancto plenus. Ipsíus autem ossa póstea Constantinópolim transláta sunt, et inde Patávium deláta.

    Romæ item natális sancti Pauli a Cruce, Presbýteri et Confessóris; qui Congregatiónis a Cruce et Passióne Dómini nostri Jesu Christi nuncupátæ Institútor fuit. Ipsum vero, mira innocéntia ac pæniténtia conspícuum et singulári in Christum crucifíxum caritáte incénsum, Pius Papa Nonus fastis Sanctórum adjúnxit, et ejúsdem festivitátem quarto Kaléndas Maji recoléndam indíxit.

    Arénis, in Hispánia, natális páriter sancti Petri de Alcántara, Sacerdótis ex Ordine Minórum et Confessóris; quem, propter admirábilem pæniténtiam múltaque mirácula, Clemens Nonus, Póntifex Máximus, Sanctórum número adscrípsit. Ejus autem festum sequénti die celebrátur.

    Antiochíæ sancti Asclepíadis Epíscopi, qui fuit unus ex præcláro illórum Mártyrum número, qui glorióse sub Macríno passi sunt.

    Neocæsaréæ, in Ponto, sancti Athenodóri Epíscopi, qui fuit frater sancti Gregórii Thaumatúrgi; et, doctrína clarus, in persecutióne Aureliáni, martýrium consummávit.

    Sinomovíci, in território Bellovacénsi, sancti Justi Mártyris, qui adhuc puer, in persecutióne Diocletiáni Imperatóris, sub Rictiováro Prǽside, cápite amputátus est.

    Romæ sanctæ Tryphóniæ, quæ Décii Cǽsaris quondam uxor ac sanctæ Vírginis et Mártyris Cyríllæ mater éxstitit; cujus corpus in crypta, juxta sanctum Hippólytum, sepúltum est.

    Apud Auriesville, in statu Neo-Eboracénsi, sanctórum Mártyrum e Societáte Jesu, Isaáci Jogues, Sacerdótis, et Joánnis de La Lande, Coadjutóris temporális, qui hac et sequénti die ab Iroquénsibus dire necáti sunt, eódem loco ubi, paucis ante annis, Renátus Goupil, et ipse Coadjútor temporális, martýrii palmam consecútus fúerat.

    In fínibus Edessénæ regiónis, in Mesopotámia, commemorátio sancti Juliáni Eremítæ, cognoménto Sabæ, de quo ágitur étiam sextodécimo Kaléndas Februárii.
  en: |
    The blessed Evangelist Luke, who suffered many things for Christ's Name's sake, and died in Bithynia, full of the Holy Ghost. His bones were first brought to Constantinople, and thence to Padua.

    At Rome, the holy Confessor Paul of the Cross, founder of the Congregation styled the Congregation of the Cross and Passion of our Lord Jesus Christ. He was famous for his marvelous innocency and devotion to penance, and kindled with an exceeding love toward Christ crucified. Pope Pius IX enrolled his name among those of the Saints, and appointed for his festival the 28th day of April.

    At Arenas, in Spain, likewise the birthday of holy Peter of Alcantara, Priest of the Order of Friars Minor, and Confessor; whom, for his wonderful penance and many miracles, Pope Clement IX enrolled among the Saints. His feast is kept upon the next day.

    At Antioch, holy Asclepiades, Patriarch, who was one of the noble multitude of martyrs who suffered gloriously under Macrinus.

    At Neo-Caesarea, in Pontus, the holy martyr Athenodorus, Bishop. He was brother of holy Gregory the Wonder-worker, was famous for his teaching, and was crowned with martyrdom in the persecution under the Emperor Aurelian.

    In the country of Beauvais, the holy martyr Justus, who, while he was yet a lad, was slain under the President Rictiovarus in the persecution under the Emperor Diocletian.

    At Rome also, holy Tryphonia, widow of Decius Caesar. She is buried in the Catacombs beside holy Hippolytus.

    At Auriesville, in the State of New York, the holy martyrs of the Society of Jesus, Isaac Jogues, Priest, and John de la Lande, lay Coadjutor, who upon this day and the next were cruelly slain by the Iroquois, in the same place where, a few years before, Rene Goupil, himself a lay Coadjutor, had won the palm of martyrdom.

    On the bank of the Euphrates, in Mesopotamia, the holy hermit Julian.
status:
  la: verified
  en: verified
