# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-01"
text:
  la: |
    Sancti Nahum Prophétæ, in Bégabar quiescéntis.

    Romæ sanctórum Mártyrum Diodóri Presbýteri, et Mariáni Diáconi, cum áliis plúribus, qui, sub Numeriáno Príncipe, cum in Arenário natalítia Mártyrum ágerent, illic, obstrúcta a persecutóribus jánua cryptæ ac díruta désuper mole, martýrii glóriam meruérunt.

    Item Romæ pássio sanctórum Lúcii, Rogáti, Cassiáni et Cándidæ.

    Nárniæ sancti Próculi, Epíscopi et Mártyris; qui, post multa egrégia ópera, a Rege Gothórum Tótila jussus est decollári.

    In civitáte Casalénsi sancti Evásii, Epíscopi et Mártyris.

    Eódem die sancti Ansáni Mártyris, qui, sub Diocletiáno Imperatóre, Romæ conféssus Christum et in cárcerem trusus, deínde Senas, in Túscia, perdúctus, ibídem cápitis obtruncatióne cursum martýrii perfécit.

    Amériæ, in Umbria, sancti Olympíadis, viri Consuláris, qui a beáta Firmína ad fidem est convérsus, et sub Diocletiáno, in equúleo tortus, martýrium consummávit.

    Arbéle, in Pérside, sancti Ananíæ Mártyris.

    Medioláni sancti Castritiáni Epíscopi, qui, in máxima Ecclésiæ perturbatióne, virtútum méritis ac rerum pie religioséque gestárum laude enítuit.

    Bríxiæ sancti Ursicíni Epíscopi.

    Noviómi, in Bélgio, sancti Elígii Epíscopi, cujus vitam admirándam múltiplex signórum númerus comméndat.

    Apud Virodúnum, in Gállia, sancti Ageríci Epíscopi.

    Eódem die sanctæ Natáliæ, uxóris beáti Hadriáni Mártyris, quæ, sub Diocletiáno Imperatóre, sanctis Martýribus, Nicomedíæ in cárcere deténtis, multo témpore ministrávit; impletóque eórum certámine, Constantinópolim est profécta, et ibídem in pace quiévit.
  en: |
    _

    The Prophet Nahum, who sleepeth in Begabar.

    At Rome, the holy martyrs the Priest Diodorus, and the Deacon Marianus with many others, who gained the glory of martyrdom by command of the Emperor Numerian.

    There likewise the holy martyrs Lucius, Rogatus, Cassian, and Candida.

    On the same day, the holy martyr Ansanus, who confessed Christ at Rome, under the Emperor Diocletian, and was cast into prison then was brought to Sienna, in Tuscany, where he was beheaded, and so finished the course of his testimony.

    At Ameria, in Umbria, under the same Diocletian, the holy martyr Olympias. He was a man of consular rank, who had been converted by blessed Firmina, and died upon the rack.

    At Arbela, in Persia, the holy martyr Ananias.

    At Narni, the holy martyr Proculus, Bishop, who, after many good works, was beheaded by order of Totila, King of the Goths.

    At the city of Casala, the holy martyr Evasius, Bishop.

    At Milan, holy Castritian, Bishop, who gained great praise for his worthy acts and his godly and pious conduct of affairs during the most troublous times of the Church.

    At Brescia, holy Ursicinus, Bishop.

    At Noyon, holy Eloy, Bishop, whose marvelous life is commended by the number of signs wrought through him.

    At Verdun, holy Ageric, Bishop.

    On the same day, holy Natalia, the wife of the blessed martyr Hadrian. She ministered for a long time to the holy martyrs who were kept in prison at Nicomedia under the Emperor Diocletian, and after their battle was over went to Constantinople, where she fell asleep in peace.
status:
  la: verified
  en: verified
