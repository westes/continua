# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-13"
text:
  la: |
    Syracúsis, in Sicília, natális sanctæ Lúciæ, Vírginis et Mártyris, in persecutióne Diocletiáni. Hæc nóbilis Virgo, cum eam lenónes, quibus, jubénte Paschásio Consulári, trádita erat ut a pópulo castitáti ejus illuderétur, dúcere vellent, nullátenus per illos movéri pótuit, nec fúnibus ádditis, nec boum jugis plúrimis; deínde vero, picem, resínam ac fervens óleum nil læsa súperans, tandem, gládio in gútture percússa, martýrium consummávit.

    Molíni, in Gállia, item natális sanctæ Joánnæ-Francíscæ Frémiot de Chantal Víduæ, quæ Ordinis Sanctimoniálium Visitatiónis sanctæ Maríæ fuit Institútrix; ac, nobilitáte géneris, vitæ sanctimónia, quam in quadrúplici statu constánter duxit, et miraculórum dono illústris, a Cleménte Décimo tértio, Pontífice Máximo, in Sanctárum númerum reláta est. Sacrum ejus corpus Annésium, in Sabáudia, translátum fuit, et solémni pompa in prima sui Ordinis Ecclésia tumulátum. Ipsíus autem festum duodécimo Kaléndas Septémbris ab univérsa Ecclésia Clemens Papa Décimus quartus celebrári mandávit.

    In Arménia pássio sanctórum Mártyrum Eustrátii, Auxéntii, Eugénii, Mardárii et Oréstis, in persecutióne Diocletiáni. Ex ipsis Eustrátius, primum sub Lýsia, deínde Sebáste, sub Agricoláo Prǽside, una cum Oréste exquisítis torméntis cruciátus, in fornácem missus réddidit spíritum; Oréstes autem, in stratum férreum ignítum pósitus, migrávit ad Dóminum; céteri apud Arábracos, sævíssimis agitáti supplíciis, sub Lýsia Prǽside, diversímode martýrium consummárunt. Eórum córpora, póstea Romam transláta, in Ecclésia sancti Apollináris honorífice collocáta sunt.

    In Sulcitána ínsula, apud Sardíniam, pássio sancti Antíochi, sub Hadriáno Imperatóre.

    Cameráci, in Gállia, sancti Authbérti, Epíscopi et Confessóris.

    In pago Pontívo, in Gállia, sancti Judóci, Presbýteri et Confessóris.

    In território Argentoraténsi sanctæ Othíliæ Vírginis.
  en: |
    At Syracuse, in Sicily, in the persecution under the Emperor Diocletian, the holy Virgin and martyr Lucy. By command of Paschasius the Consular she was handed over to panders to make a public mock of her chastity, but when they would have led her away they could not move her even with ropes, and not even when these were drawn by many yoke of oxen then they poured upon her boiling pitch, rosin, and oil but these did not hurt her, and at length she was smitten in the neck with a sword, and so finished her testimony.

    In Armenia, in the same persecution under the Emperor Diocletian, the holy martyrs Eustratius, Auxentius, Eugenius, Mardarius, and Orestes.  Eustratius was first put to dreadful torments under Lysias, and afterwards to the like at Sebaste, along with Orestes, under the President Agricolaus, and was then cast into a furnace, wherein he gave up the ghost. Orestes was laid upon an iron bed heated with fire, and so passed away to be ever with the Lord. The others finished their testimony in diverse ways in the country of the Arabraci, after enduring most cruel sufferings under the President Lysias. Their bodies were afterwards brought to Rome and honourably buried in the church of St. Apollinaris.

    In the island of Sulcis, off the coast of Sardinia, under the Emperor Hadrian, the holy martyr Antiochus.

    At Cambrai, in Gaul, the holy Confessor Aubert, Bishop (of that see, and of Arras. He was consecrated on March 21, 633, and died in the year 669.)

    At Ponthieu, the holy Confessor Josse, (King of Brittany and hermit at Ponthieu.)

    In the country of Strasbourg, the holy Virgin Othilia. (First Abbess of Hohenburg, of the order of St Benedict, she was daughter of a Duke of Alsace.)

    At Moulins, in Gaul, the holy widow Jeane Frances Fremiot de Chantal, foundress of the Congregation of Nuns of the Visitation of St. Mary. She was eminent by her noble birth, by the holiness of her life, which she sanctified unceasingly in the four different states of maiden, wife, widow, and nun, and by the grace of working miracles, and Clement XIII enrolled her name among those of the Saints. Her sacred body was translated to Annecy, in Savoy, and there entombed with solemn pomp in the first church of their order. Clement XIV ordered her feast to be kept by the Universal Church upon the 21st day of August.
status:
  la: verified
  en: verified
