# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-05"
text:
  la: |
    Romæ, in Exquíliis, Dedicátio Basílicæ sanctæ Maríæ ad Nives.

    Cataláuni, in Gállia, sancti Mémmii, civis Románi, qui, a sancto Petro Apóstolo consecrátus illíus civitátis Epíscopus, pópulum sibi commíssum ad Evangélii veritátem perdúxit.

    Romæ pássio sanctórum Mártyrum vigínti trium, qui, in persecutióne Diocletiáni, via Salária véteri, cápite obtruncáti sunt, et, ad clivum Cucúmeris, ibídem sepúlti.

    Asculi, in Picéno, sancti Emýgdii, Epíscopi et Mártyris; qui, a sancto Marcéllo Papa Epíscopus ordinátus et illuc ad prædicándum Evangélium missus, ibídem, in confessióne Christi, sub Diocletiáno Imperatóre, martýrii corónam accépit.

    Antiochíæ sancti Eusígnii mílitis, qui annum agens centésimum décimum, cum Constantíni Magni fidem, sub quo militáverat, Juliáno Apóstatæ exprobráret, eúmque ut pátriæ pietátis desertórem redargúeret, ab eódem jussus est cápite cædi.

    Item sanctórum Mártyrum Ægyptiórum Cantídii, Cantidiáni et Sobélis.

    Augústæ Vindelicórum natális sanctæ Afræ Mártyris, quæ, cum esset pagána, per doctrínam sancti Narcíssi Epíscopi ad Christum est convérsa, et, cum ómnibus domus suæ membris, ab eódem Epíscopo baptizáta; póstmodum vero, ob Christi confessiónem igni trádita, martýrium suum, septem diébus ántequam beáta Hilária mater ac tres ancíllæ eódem cruciátus génere coronaréntur, felíciter explévit.

    Augustodúni beáti Cassiáni Epíscopi.

    Apud Theánum, in Campánia, sancti Páridis Epíscopi.

    In Anglia sancti Oswáldi Regis, cujus gesta sanctus Beda Venerábilis commémorat.

    Eódem die sanctæ Nonnæ, quæ fuit mater beatórum Gregórii Nazianzéni, Cæsárii et Gorgóniæ.
  en: |
    Upon the 5th day of August is kept the dedication of the Church of St. Mary in the Snow upon the Esquiline Hill at Rome.

    At Chalons-sur-Marne, in Gaul, holy Memmius, a Roman citizen, whom the holy apostle Peter consecrated first Bishop of that city, and who led unto Gospel truth the people committed unto him.

    At Rome, twenty three holy martyrs, who, in the persecution under Diocletian, were beheaded on the old Salarian Way, and buried there at Cucumber Hill.

    At Ascoli, in Picenum, the holy Bishop and martyr Emygdius, who was ordained Bishop by holy Pope Marcellus and sent thither to preach the Gospel, and he received a crown of martyrdom for confessing Christ, under the Emperor Diocletian.

    At Antioch, the holy soldier Eusignius. He was in the hundred and tenth year of his age when he cast in the teeth of the Emperor Julian the Apostate the faith of Constantine the Great, under whom he had served, and rebuked Julian himself for a renegade from the religion of his Fathers, whereupon Julian commanded him to be beheaded.

    Also, in Egypt, the holy martyrs Cantidius, Cantidian, and Sobel.

    At Augsburg, the holy martyr Afra. She was turned from paganism to Christ by the teaching of the holy Bishop Narcissus, and baptized with all her house, and for confessing Christ she was burnt.

    At Autun, blessed Cassian, Bishop.

    At Teano, holy Paris, Bishop.

    In England, the holy Oswald, King of the Northumbrians, whose acts are written by the venerable Priest Bede.

    Upon the same day, holy Nonna, the mother of blessed Gregory of Nazianzus.
status:
  la: verified
  en: verified
