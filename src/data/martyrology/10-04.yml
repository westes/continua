# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-04"
text:
  la: |
    Assísii, in Umbria, natális sancti Francísci, Levítæ et Confessóris; qui trium Ordinum, scílicet Fratrum Minórum, Páuperum Dominárum, ac Fratrum et Sorórum de Pæniténtia, Fundátor éxstitit. Ipsíus autem vitam, sanctitáte ac miráculis plenam, sanctus Bonaventúra conscrípsit.

    Corínthi item natális sanctórum Crispi et Caji, quorum méminit sanctus Paulus Apóstolus ad Corínthios scribens.

    Athénis sancti Hieróthei, qui fuit discípulus ipsíus beáti Pauli Apóstoli.

    Damásci sancti Petri, Epíscopi et Mártyris; qui, accusátus apud Agarenórum Príncipem quod fidem Christi docéret, ídeo, lingua et mánibus pedibúsque amputátis, cruci affíxus martýrium consummávit.

    Alexandríæ sanctórum Presbyterórum, et Diaconórum Caji, Fausti, Eusébii, Chærémonis, Lúcii et Sociórum; ex quibus álii, in persecutióne Valeriáni, Mártyres facti sunt, álii, Martýribus serviéntes, mercédem Mártyrum recepérunt.

    In Ægýpto sanctórum Mártyrum Marci et Marciáni fratrum, et aliórum ferme innumerabílium utriúsque sexus atque omnis ætátis; quorum álii post vérbera, álii post divérsa géneris horríbiles cruciátus flammis tráditi, álii in mare præcipitáti, nonnúlli cápite cæsi, plúrimi inédia consúmpti, álii patíbulis affíxi, quidam étiam, cápite deórsum verso et pédibus in sublíme sublátis, appénsi, beatíssimam martýrii corónam meruérunt.

    Bonóniæ sancti Petrónii, Epíscopi et Confessóris; qui doctrína, miráculis et sanctitáte cláruit.

    Lutétiæ Parisiórum sanctæ Aureæ Vírginis et Abbatíssæ.
  en: |
    At Assisi, in Umbria, the holy Confessor Francis, Founder of the Order of Friars Minor, whose life, full of holiness and miracles, hath been written by St. Bonaventure.

    At Corinth, holy Crispus and Caius, of whom the holy Apostle Paul maketh mention in writing unto the Corinthians.

    In Egypt, the holy brethren Mark and Marcian, and a multitude of other holy martyrs which is almost countless, both of men and of women, of old and of young some after stripes and some after horrid torments of diverse kinds were burnt, some cast into the sea, a few beheaded, many starved to death, others crucified, some of these with their head downward, and so earned a most blessed crown of martyrdom.

    At Damascus, the holy Bishop and martyr Peter, he was accused of teaching the faith of Christ, before the Prince of the Hagarenes. His tongue, hands, and feet were cut off, and he was fastened to a cross, and there finished his testimony.

    At Alexandria, the holy Priests and Deacons Caius, Faustus, Eusebius, Chaeremon, Lucius, and their Companions, of whom some suffered martyrdom in the persecution under the Emperor Valerian, and others by serving the martyrs gained the martyr's reward.

    At Athens, holy Hierotheus, a disciple of the blessed Apostle Paul.

    At Bologna, the holy Confessor Petronius, Bishop, who was famous for his teaching, his miracles, and his holiness.

    At Paris, the holy Virgin Aurea, Abbess at Paris.
