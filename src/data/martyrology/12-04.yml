# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-04"
text:
  la: |
    Sancti Petri Chrysólogi, Epíscopi Ravennátis, Confessóris et Ecclésiæ Doctóris, cujus memória quarto Nonas hujus mensis recensétur.

    Nicomedíæ pássio sanctæ Bárbaræ, Vírginis et Mártyris; quæ, in persecutióne Maximíni, post diram cárceris maceratiónem, lampadárum adustiónem, mamillárum præcisiónem atque ália torménta, gládio martýrium consummávit.

    Constantinópoli sanctórum Theóphanis et Sociórum.

    In Ponto beáti Melétii, Epíscopi et Confessóris; qui, cum esset ob eruditiónis prærogatívam præcípuus, ob virtútem tamen animi et vitæ sinceritátem longe magnificéntior éxstitit.

    Bonóniæ sancti Felícis Epíscopi, qui ántea Mediolanénsis Ecclésiæ, sub sancto Ambrósio, Diáconus fúerat.

    In Anglia sancti Osmúndi, Epíscopi et Confessóris.

    Colóniæ Agrippínæ sancti Annónis Epíscopi.

    In Mesopotámia sancti Marúthæ Epíscopi, qui Dei Ecclésias, ob persecutiónem Isdegérdis Regis collápsas, in Pérside reparávit, multísque miráculis clarus, apud hostes étiam méruit honorári.

    Parmæ sancti Bernárdi, Cardinális et ejúsdem civitátis Epíscopi, ex Ordine Vallis Umbrósæ.
  en: |
    At Nicomedia, in the persecution under the Emperor Maximin, the holy Virgin and martyr Barbara. After a cruel and wasting imprisonment she endured burning with torches, the cutting off of her breasts, and other torments, and finished her testimony by the sword. At Constantinople, the holy martyr Theophanes and his Companions.

    In Pontus, the blessed Confessor Meletius, Bishop. He was a man of extraordinary learning, but this gift was outshone in him by the mightiness of his soul and the straightforwardness of his life.

    At Bologna, holy Felix, Bishop, who had erstwhile been a Deacon of the church of Milan under holy Ambrose.

    In England, holy Osmund, Bishop, whose feast we keep upon the 17th day of July, which is the day of the translation of his sacred body. (He was Count of Seez in Normandy, and, following William the Conqueror, was made Count of Dorset and Lord High Chancellor of England. He died in 1099, and was canonised by Pope Calixtus III, in the year 1458.)

    At Cologne, holy Annon, Bishop.

    In Mesopotamia, holy Maruthas, Bishop of Tagrit, who raised up again the churches of God in Persia which had been cast down in the persecution under King Isdegerd he was famous for many miracles, and achieved honour even among his enemies. (Several of his works are extant. Tagrit is now Miafarakin.)

    At Parma, holy Bernard, Cardinal-bishop of that city, of the Congregation of the Order of St Benedict, called that of Vallombrosa.
