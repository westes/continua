# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-09"
text:
  la: |
    Carthágine sancti Restitúti, Epíscopi et Mártyris, in cujus solemnitáte sanctus Augustínus de ipso ad pópulum sermónem hábuit.

    Item in Africa sanctórum Mártyrum Petri, Succéssi, Bassiáni, Primitívi et aliórum vigínti.

    Toléti, in Hispánia, natális sanctæ Leocádiæ, Vírginis et Mártyris; quæ, in persecutióne Diocletiáni Imperatóris, a Præfécto Hispaniárum Daciáno inclúsa cárcere ac dire maceráta, in eo tandem, cum gravíssimos beátæ Euláliæ et reliquórum Mártyrum cruciátus audísset, impollútum spíritum, génibus in oratióne pósitis, Christo réddidit.

    Lemóvicis, in Aquitánia, sanctæ Valériæ, Vírginis et Mártyris.

    Verónæ sancti Próculi Epíscopi, qui, in persecutióne Diocletiáni, cólaphis ac fústibus cæsus, e civitáte pulsus est, ac tandem, in Ecclésiam suam restitútus, quiévit in pace.

    Pápiæ sancti Syri, qui fuit primus ejúsdem civitátis Epíscopus, atque apostólicis signis et virtútibus cláruit.

    Apaméæ, in Sýria, beáti Juliáni Epíscopi, qui, témpore Sevéri, sanctitáte refúlsit.

    Graji, in Burgúndia, sancti Petri Fourier, qui Canónicus Reguláris fuit Salvatóris Nostri, et Canonissárum Regulárium Dóminæ Nostræ edocéndis puéllis Institútor; atque, virtútibus ac miráculis clarus, a Leóne Décimo tértio, Pontífice Máximo, Sanctórum catálogo adjúnctus est.

    Petragóricis, in Gállia, sancti Cypriáni Abbátis, magnæ sanctitátis viri.

    Naziánzi, in Cappadócia, sanctæ Gorgóniæ, quæ fuit beátæ Nonnæ fília, atque beatórum Gregórii Theológi et Cæsárii soror, cujus ipse Gregórius virtútes et mirácula conscrípsit.
  en: |
    At Toledo, in Spain, the holy Virgin and martyr Leocadia. In the persecution under the Emperor Diocletian she suffered a terrible imprisonment under Dacian, Prefect of Spain, and when she heard of the grievous torments of blessed Eulalia and the other martyrs, she knelt down in prayer and gave up her unstained spirit to Christ.

    At Carthage, the holy martyr Restitutus, Bishop, concerning whom on whose solemn feastday holy Augustine preached a discourse to the people.

    Likewise in Africa, the holy martyrs Peter, Successus, Bassian, Primitivus, and twenty others.

    At Limoges, in France, the holy Virgin and martyr Valeria.

    At Verona, holy Proculus, Bishop. In the persecution under the Emperor Diocletian he was buffeted and cudgelled and thrust out of the city, but was at length restored to his own church and fell asleep in peace.

    At Pavia, holy Syrus, the first Bishop of that city, who was eminent for the signs and powers of an apostle.

    At Apamea, in Syria, blessed Julian, Bishop, who shone with holiness in the time of the Emperor Severus.

    At Perigueux, in France, the holy Abbot Cyprian, a man of great holiness. (He lived as a hermit in the latter part of his life near Dordogne, at a place now called after him.)

    At Nazianzus, holy Gorgonia, sister of blessed Gregory the theologian, who hath written of her graces and miracles.

    At Grai, in Burgundy, holy Peter Fourier, Canon Regular of Our Saviour, founder of the Canonesses Regular of Our Lady for the education of girls whom, illustrious for his virtues and miracles, Leo XIII added him to the roll of the Saints.
