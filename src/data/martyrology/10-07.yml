# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-07"
text:
  la: |
    Festum sacratíssimi Rosárii beátæ Maríæ Vírginis; itémque sanctæ Maríæ de Victória commemorátio, quam sanctus Pius Quintus, Póntifex Máximus, ob insígnem victóriam a Christiánis bello naváli, ejúsdem sanctíssimæ Dei Genitrícis auxílio, hac ipsa die de Turcis reportátam, quotánnis fíeri instítuit.

    Romæ, via Ardeatína, deposítio sancti Marci, Papæ et Confessóris, qui sancto Sylvéstro Primo successit, et octo mensibus ac vigínti diébus sedit.

    In Província quæ nuncupátur Augústa Euphratésia, sanctórum Mártyrum Sérgii et Bacchi, nobílium Romanórum, sub Maximiáno Imperatóre. Ex his Bacchus támdiu nervis crudis cæsus est, quoadúsque, toto córpore discíssus, in Christi confessióne emítteret spíritum; Sérgius vero clavátis cothúrnis pedes indútus, et, cum in fide fixus manéret, data senténtia, jussus est decollári. Beáti autem Sérgii nómine locus ubi quiéscit, Sergiópolis appellátus est, et, ob præclára mirácula, frequénti Christianórum concúrsu honorátur.

    Romæ sanctórum Mártyrum Marcélli et Apuléji, qui prius quidem Simóni mago adhæsérunt; sed, vidéntes mirabília quæ per Apóstolum Petrum Dóminus operabátur, ambo, relícto Simóne, se doctrínæ Apostólicæ tradidérunt, ac, post passiónem Apostolórum, sub Aureliáno Consulári, corónam martýrii reportárunt, sepultíque sunt non longe ab Urbe.

    Item apud Augústam Euphratésiam sanctæ Júliæ Vírginis, quæ, sub Marciáno Prǽside, martýrium consummávit.

    Patávii sanctæ Justínæ, Vírginis et Mártyris; quæ, a beáto Prosdócimo, sancti Petri discípulo, baptizáta, et, cum in fide Christi constánter persísteret, Máximi Prǽsidis jussu, transverberáta gládio, migrávit ad Dóminum.

    Apud Bitúricas, in Aquitánia, sancti Augústi Presbýteri et Confessóris.

    In pago Rheménsi sancti Heláni Presbýteri.

    In Suécia Translátio córporis sanctæ Birgíttæ Víduæ.
  en: |
    At Rome, upon the Ardeatine Way, the holy Confessor, Pope Mark, who succeeded Sylvester I, and reigned 8 months and 20 days.

    In the district called Rasaphe, in Syria, the holy martyrs Sergius and Bacchus, noble Roman officers under the Emperor Maximian. Bacchus was lashed with strips of raw hide till his whole body was cut into ribbons, and so, still confessing Christ, gave up the ghost. Sergius had his legs tortured in the boots, but remaining firm in the faith, sentence was given on him that he should be beheaded. The place where he sleepeth was called after him Sergiopolis instead of Rasaphe, and thither Christians do greatly resort on account of famous miracles.

    At Rome, the holy martyrs Marcellus and Apuleius, who were first disciples of Simon Magus, but afterward, seeing the wonders which the Lord wrought by the Apostle Peter, became disciples of the Apostle, and, after he had suffered, won the crown of martyrdom under the Consular Aurelian. They are buried not far from the city.

    At Rasaphe also, the holy Virgin Julia, who gained martyrdom under the President Marcian.

    At Padua, the holy Virgin and martyr Justina, who was baptized by blessed Prosdocimus, a disciple of the holy Apostle Peter. Forasmuch as she stood firm in the faith of Christ, the President Maximus caused her to be run through with the sword, and she passed away hence to be ever with the Lord.

    At Bourges, the holy Priest and Confessor Augustus.

    At Reims, the holy Priest Helanus.

    In Sweden, the translation of the body of holy Bridget, Widow.

    Upon the same day is made the memorial of St. Mary, styled of Victory, the yearly observance of which memorial the Supreme Pontiff blessed Pius V. ordained on account of the famous victory gained by the Christians over the Turks upon this day in the sea-fight of Lepanto, by the help of the aforesaid Mother of God, and Gregory XIII instituted the yearly solemn feast of the same most Blessed Virgin to be kept upon the first Lord's Day in this present month of October.
status:
  la: verified
