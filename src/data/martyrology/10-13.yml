# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-13"
text:
  la: |
    Sancti Eduárdi, Regis Anglórum et Confessóris, qui Nonis Januárii obdormívit in Dómino, sed hac die, ob Translatiónem córporis ejus, potíssimum cólitur.

    Apud Tróadem, Asiæ minóris urbem, natális sancti Carpi, qui fuit discípulus beáti Pauli Apóstoli.

    Córdubæ, in Hispánia, item natális sanctórum Mártyrum Fausti, Januárii et Martiális; qui, primo equúlei pœna cruciáti, deínde, supercíliis rasis, déntibus evúlsis, áuribus quoque et náribus præcísis, ignis passióne martýrium consummárunt.

    Thessalonícæ sancti Floréntii Mártyris, qui, post vária torménta, igne combústus est.

    Apud Stokeráviam, in Austria, sancti Colmánni Mártyris.

    Antiochíæ sancti Theóphili Epíscopi, qui, sextus post beátum Petrum Apóstolum, ejúsdem Ecclésiæ Pontificátum ténuit.

    Turónis, in Gállia, sancti Venántii, Abbátis et Confessóris.

    Apud Sublácum, in Látio, sanctæ Chelidóniæ Vírginis.
  en: |
    At Troas, in Asia Minor, holy Carpus, the disciple of the blessed Apostle Paul.

    At Cordova, in Spain, the holy martyrs Faustus, Januarius, and Martial, who were first racked, then had their eyebrows, ears, and noses cut off, and their teeth drawn, and at last completed their suffering martyrdom by fire.

    At Thessalonica, the holy martyr Florence, who was put to diverse tortures and then burnt.

    In Austria, the holy martyr Colman.

    At Antioch, the holy Patriarch Theophilus, the sixth after the blessed Apostle Peter, who held the bishopric of that church.

    At Tours, the holy Confessor Venantius, Abbot.

    At Subiaco, in Latium, the holy Virgin Chelidonia.
status:
  la: verified
  en: verified
