# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-15"
text:
  la: |
    Octáva Conceptiónis Immaculátæ beátæ Maríæ Vírginis.

    Romæ sanctórum Mártyrum Irenǽi, Antónii, Theodóri, Saturníni, Victóris, et aliórum decem et septem, qui, in persecutióne Valeriáni, pro Christo passi sunt.

    In Africa pássio sanctórum Faustíni, Lúcii, Cándidi, Cæliáni, Marci, Januárii et Fortunáti.

    Ibídem sancti Valeriáni Epíscopi, qui, cum esset annórum plus octogínta, in persecutióne Wandálica, sub Rege Ariáno Genseríco, convéntus ab eo ut tráderet Ecclésiæ utensília, idque constánter renuísset, extra civitátem singuláris jussus est pelli; cumque præcéptum esset ut nullus eum neque in domo neque in agro dimítteret habitáre, multo témpore in strata pública nudo sub áere jácuit, et, in confessióne et defensióne cathólicæ veritátis, cursum beátæ vitæ complévit.

    In território Aurelianénsi sancti Maximíni Confessóris.

    Apud Ibéros, trans Pontum Euxínum, sanctæ Christiánæ ancíllæ, Apóstolæ Ibérorum Cáucasi, quæ miraculórum virtúte gentem illam, témpore Constantíni, ad Christi fidem perdúxit.

    Vercéllis Ordinátio sancti Eusébii, Epíscopi et Mártyris, qui Lector Ecclésiæ Romanæ fuit.
  en: |
    Commemorated the ordination, of holy Eusebius, Bishop of Vercelli, he was a Reader of the Church of Rome, who was born into the better life: upon the 1st day of August, but whose feast is kept upon the 16th day of this present month of December by command of Pope Benedict XIII.

    At Rome, the holy martyrs Irenaeus, Antony, Theodore, Saturninus, Victor, and seventeen others who suffered for Christ's sake in the persecution under the Emperor Valerian.

    In Africa, the holy martyrs Faustinus, Lucius, Candidus, Caelian, Mark, Januarius, and Fortunatus.

    Likewise in Africa, holy Valerian, Bishop. When he was more than eighty years of age the Arian king Genseric, during the Vandal persecution, sought to make him consent to give up the vessels of the church, and because he steadfastly refused so to do, he caused him to be thrust out of the city alone, and since it was forbidden to any man to allow him to come into his house or to dwell in his field, he lay a long time in the open air on the public highway, and finished the course of his blessed life, in the profession and defense of Catholic truth.

    In the country of Orleans, the holy Confessor Maximin.

    In the country of the Iberians, beyond the Black Sea, the holy handmaiden Christiana, the Apostle of the Iberians of the Caucasus, who in the time of the Emperor Constantine, by the power of her miracles, brought that people to believe in Christ.
