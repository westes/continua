# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-11"
text:
  la: |
    Sancti Leónis Papæ Primi, cognoménto Magni, Confessóris et Ecclésiæ Doctóris, cujus dies natális recólitur quarto Idus Novémbris.

    Pérgami, in Asia, sancti Antípæ, testis fidélis, cujus méminit sanctus Joánnes in Apocalýpsi. Ipse autem Antípas, sub Domitiáno Imperatóre, in bovem ǽneum candéntem conjéctus, martýrium consummávit.

    Salónæ, in Dalmátia, sanctórum Mártyrum Domniónis Epíscopi, cum milítibus octo.

    Gortýnæ, in Creta, sancti Philíppi Epíscopi, vita et doctrína claríssimi, qui, tempóribus Marci Antoníni Veri et Lúcii Aurélii Cómmodi, Ecclésiam sibi créditam regens, a furóre Gentílium et ab hæreticórum insídiis eándem tutátus est.

    Nicomedíæ sancti Eustórgii Presbýteri.

    Spoléti sancti Isaac, Mónachi et Confessóris, cujus virtútes sanctus Gregórius Papa commémorat.

    Apud Gazam, in Palæstína, sancti Barsanúphii Anachorétæ, sub Justiniáno Imperatóre.

    Lucæ, in Etrúria, sanctæ Gemmæ Galgáni, Vírginis, contemplatióne Domínicæ Passiónis et vitæ sanctitáte mirábilis, quam Pius Papa Duodécimus in Sanctárum númerum rétulit.
  en: |
    At Rome, the holy Confessor, Pope Leo I, who on account of his eminent worthiness is called the Great. In his times was held the holy Council of Chalcedon, wherein, through his legates, he condemned Eutyches, and whereof by his authority he confirmed the decrees. He ordained many things, wrote excellently, deserved well of the holy Church of God, as a good shepherd over all the Lord's flock, and fell asleep in peace.

    At Pergamos, in Asia, holy Antipas, "the faithful witness," of whom holy John doth make mention in his Revelation. Under the Emperor Domitian he was thrust into the inside of a brazen bull heated red hot, and so finished his testimony.

    At Salona, in Dalmatia, the holy martyrs Domnion, Bishop [of that city, who was converted by St Peter and sent thither,] and eight soldiers.

    At Gortyna, in Crete, holy Philip, Bishop of that see, very famous for his life and teaching. He governed the church committed unto him in the times of the Emperors Marcus Antoninus Verus and Lucius Aurelius Commodus, and shielded it from the rage of the Gentiles and the wiles of the heretics.

    At Nicomedia, [under Diocletian,] the holy Priest Eustorgius.

    At Spoleto, the holy Confessor Isaac the monk, whose graces have been recorded by holy Pope Gregory.

    At Gaza, in Palestine, under the Emperor Justinian, the holy Hermit Barsanuph.

    At Lucca, in Tuscany, holy Gemma Galgani, Virgin, wonderful for her contemplation of the Lord's Passion and the holiness of her life, whom Pope Pius XII enrolled among the Saints.
status:
  la: verified
  en: verified
