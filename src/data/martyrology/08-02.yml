# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-02"
text:
  la: |
    Sancti Alfónsi-Maríæ de Ligório, Fundatóris Congregatiónis a sanctíssimo Redemptóre nuncupátæ, Epíscopi sanctæ Agathæ Gothórum, Confessóris et Ecclésiæ Doctóris, qui requiévit in Dómino prídie hujus diéi.

    Romæ, in cœmetério Callísti, natális sancti Stéphani Primi, Papæ et Mártyris; qui, in persecutióne Valeriáni, dum Missæ Sacrum perágeret, et, superveniéntibus milítibus, ante altáre intrépidus et immóbilis cœpta mystéria perfíceret, in sede sua decollátus est.

    Nicǽæ, in Bithýnia, pássio sanctæ Theodótæ, cum tribus fíliis suis. Ex his primogénitum, nómine Evódium, cum Christum fiduciáliter confiterétur, fecit primo Nicétius, Consuláris Bithýniæ, fústibus cædi; deínde matrem, cum ómnibus fíliis, igne consúmi.

    In Africa sancti Rutílii Mártyris, qui cum sǽpius, de loco in locum fúgiens, persecutiónem declinásset, et perículum intérdum étiam pecúnia redemísset, ex inopináto aliquándo comprehénsus est, et, Prǽsidi oblátus, torméntis cruciátur plúrimis; demum, ígnibus tráditus, egrégio martýrio coronátur.

    Patávii sancti Máximi, ejúsdem civitátis Epíscopi, qui, miráculis clarus, beáto fine quiévit.
  en: |
    At Nocera-dei-Pagani, holy Alphonsus Mary de Liguori, Bishop of Santa-Agata-de'-Goti, and Founder of the Congregation of the Most Holy Redeemer. Illustrious for the zeal for the salvation of souls shown both by his writings, his words, and his ensample. Pope Gregory XVI. enrolled his name with those of the Saints, and the Supreme Pontiff Pius IX. gave him the title of Doctor of the Church.

    At Rome, in the cemetery of Callistus, the holy Pope and martyr Stephen. He was celebrating Mass during the persecution under the Emperor Valerian, when the soldiers broke in. He finished his office before the altar without fear or trembling, and then was beheaded as he sat upon his throne.

    At Nice, in Bithynia, the holy Theodota and her three sons, who were all burned [alive] in the fire together by the order of Neretius, Consular of Bithynia, after he had first caused the eldest son, whose name was Evodius, to be beaten with clubs for his faithful confession of Christ.

    In Africa, the holy martyr Rutilius. He had fled from one place to another in order to escape the persecution, and had sometimes bought himself out of danger, when he was unexpectedly arrested and brought before the President. He was long put to the torture, then given over to the fire, and so crowned with a noble testimony.

    At Padua, the holy Maximus, Bishop of that city, who died a blessed death, famous for miracles.
status:
  la: verified
  en: verified
