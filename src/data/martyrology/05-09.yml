# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "05-09"
text:
  la: |
    Naziánzi, in Cappadócia, natális beáti Gregórii Epíscopi, Confessóris et Ecclésiæ Doctóris, ob singulárem divinárum rerum doctrínam cognoménto Theólogi; qui collápsam Constantinópoli cathólicam fidem, ipsíus urbis Episcopátum gerens, restítuit, hæresésque insurgéntes compréssit.

    Romæ sancti Hermæ, cujus Apóstolus Paulus in Epístola ad Romános méminit. Ipse autem Hermas, digne semetípsum sacríficans acceptabilísque Deo hóstia factus, virtútibus clarus cæléstia regna petívit.

    Cállii, via Flamínia, pássio sancti Geróntii, Epíscopi Ficoclénsis.

    In Pérside sanctórum Mártyrum trecentórum et decem.

    In Ægýpto sancti Pachómii Abbátis, qui plúrima erexit in ea regióne monastéria, et régulam Monachórum scripsit, quam ab Angelo dictánte didícerat.

    In castro Vindecíno, in Gállia, deposítio sancti Beáti Confessóris.

    Bonóniæ beáti Nicolái Albergáti, Mónachi Carthusiáni, ejúsdem civitátis Epíscopi et sanctæ Románæ Ecclésiæ Cardinális, sanctitáte et Apostólicis Legatiónibus clari; cujus corpus Floréntiæ, apud Carthusiános, cónditum est.

    Constantinópoli Translátio sanctórum Andréæ Apóstoli, et Lucæ Evangelístæ de Acháia; et Timóthei, uníus ex discípulis beáti Pauli Apóstoli, ab Epheso. Corpus autem sancti Andréæ, longo post témpore Amálphim devéctum, ibi pio fidélium concúrsu honorátur; ex cujus sepúlcro liquor ad languóres curándos júgiter manat.

    Romæ item Translátio sancti Hierónymi Presbýteri, Confessóris et Ecclésiæ Doctóris, ex Béthlehem Judæ ad Basílicam sanctæ Maríæ ad Præsépe.

    Bárii quoque, in Apúlia, Translátio sancti Nicolái, Epíscopi et Confessóris, e Myra, civitáte Lýciæ.
  en: |
    At Nazianzus, in Cappadocia, the blessed Gregory, Archbishop of Constantinople, who on account of his wonderful teaching of the things of God is surnamed the Theologian, who set up again the Catholic faith at Constantinople when it had fallen, and stilled the swelling waves of heresy.

    At Rome, the holy Hermes, of whom the Apostle Paul maketh mention in his Epistle to the Romans. He made a worthy offering of himself, and being made acceptable as a sacrifice to God, he departed hence to the kingdom of heaven, famous for good works.

    In Persia, 310 holy martyrs.

    In Egypt, holy Pachomius, Abbot, who built very many monasteries in that region, and wrote the rule of the Monks, which he had learned from an Angel dictating it.

    At Bologna, the blessed Nicholas Albergati, Bishop of that city, a Charterhouse monk, and Cardinal of the holy Roman Church, famous for his holiness and for his work as Legate of the Apostolic See. His body is buried in the Charterhouse at Florence.

    At Cagli, on the Flaminian Way, suffered the holy Gerontius, Bishop of Cervia.

    At Vendôme, deceased, the holy Confessor Beatus. At Constantinople is commemorated the translation of the bodies of the holy Apostle Andrew, and of the holy Evangelist Luke, out of the Peloponnesos, and of that of Timothy, the disciple of the blessed Apostle Paul, out of Ephesos. The body of the holy Andrew was carried to Amalfi a long while after, and godly multitudes of the faithful there gather to do it reverence. At the grave thereof is secreted a liquid for the healing of diseases.

    There is also commemorated at Rome the translation of the body of the holy Priest Jerome, Doctor of the Church, from Bethlehem of Juda into the cathedral church of St. Mary-by-the-Manger, [commonly called St. Mary the Greater.]

    Also there is commemorated at Bari, in Apulia, the translation thither of the body of the holy Bishop Nicholas, from [his see at] Myra, a city of Lycia.
