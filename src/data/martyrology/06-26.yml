# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "06-26"
text:
  la: |
    Romæ, in monte Cǽlio, sanctórum Mártyrum Joánnis et Pauli fratrum, quorum primus erat præpósitus domus, secúndus primicérius Constántiæ Vírginis, fíliæ Constantíni Imperatóris, et ambo póstea, sub Juliáno Apóstata, martýrii palmam, cædénte gládio, percepérunt.

    Apud Tridéntum sancti Vigílii Epíscopi, qui, cum relíquias idololatríæ pénitus exstirpáre conarétur, ídeo, pro Christi nómine, a feris et bárbaris homínibus percússus lápidum imbre, martýrium implévit.

    Apud Valencénas, in Gállia, pássio sanctórum Mártyrum Sálvii, qui éxstitit Engolisménsis Epíscopus, et Supérii.

    Córdubæ, in Hispánia, natális sancti Pelágii adolescéntuli, qui, ob confessiónem fídei, Regis Saracenórum Abdaraméni jussu forcípibus férreis membrátim præcísus, martýrium suum glorióse consummávit.

    Bellícii, in Gállia, sancti Anthélmi, qui ex majóris Carthúsiæ Prióre, factus est ejúsdem civitátis Epíscopus.

    In pago Pictaviénsi sancti Maxéntii, Presbýteri et Confessóris; qui miráculis cláruit.

    Thessalonícæ sancti David Eremítæ.

    Eódem die sanctæ Perseverándæ Vírginis.
  en: |
    At Rome, upon the Celian Mount, the holy brethren John and Paul, both martyrs. John was provost of the household, and Paul chief steward of the Virgin Constantia, daughter of the Emperor Constantine. Under the Emperor Julian the Apostate they both received the palm of martyrdom by the sword.

    At Trent, the holy Vigilius, Bishop, who, because he was striving to stamp out utterly the last remains of idolatry, was stoned by savage men, and so compassed martyrdom for Christ's Name's sake.

    At Valenciennes, the holy martyrs Salvius, Bishop of Angoulême, and Superius.

    At Cordova, in Spain, the holy child Pelagius, who crowned his confession of the faith with a glorious martyrdom, by being torn to pieces with iron pincers, by order of Abdu'l-Rahman, King of the Saracens.

    Also the commemoration of the holy Anthelm, Bishop of Bellay.

    At Poitou, the holy Priest and Confessor Maxentius, who was famous for miracles.

    At Thessalonica, the holy Hermit David.

    On the same day, the holy Virgin Perseveranda.
status:
  la: verified
  en: verified
