# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "09-16"
text:
  la: |
    Chalcedóne natális sanctæ Euphémiæ, Vírginis et Mártyris; quæ, sub Diocletiáno Imperatóre et Prisco Procónsule, torménta, cárceres, vérbera, arguménta rotárum, ignes, póndera lápidum, béstias, plagas virgárum, serras acútas, sartágines ignítas pro Christo superávit. Sed, rursus in theátrum ad béstias ducta, ibi, cum orásset ad Dóminum ut jam spíritum suum suscíperet, una ex iis morsum sancto córpori infigénte, céteris pedes ejus lambéntibus, immaculátum spíritum Deo réddidit.

    Romæ sanctórum Mártyrum Lúciæ, nóbilis matrónæ, et Geminiáni; quos ambos Diocletiánus Imperátor, pœnis gravíssimis afflíctos diúque tortos, tandem, post laudábilem martýrii victóriam, gládio animadvérti præcépit.

    Natális sancti Martíni Primi, Papæ et Mártyris, qui, cum Sérgium ac Paulum et Pyrrhum hæréticos, Romæ coácta Sýnodo, condemnásset, ídeo, jussu Constántis, Imperatóris hærétici, per fraudem captus et Constantinópolim perdúctus, in Chersonésum relegátus est, ibíque, ob cathólicam fidem ærúmnis conféctus, vitam finívit, multísque miráculis cláruit. Ejus corpus, póstea Romam translátum, in Ecclésia sanctórum Silvéstri et Martíni cónditum fuit. Ipsíus tamen festívitas prídie Idus Novémbris celebrátur.

    Romæ item natális sanctæ Cæcíliæ, Vírginis et Mártyris, quæ sponsum suum Valeriánum et fratrem ejus Tibúrtium ad credéndum in Christum perdúxit, et ad martýrium incitávit. Hanc Almáchius, Urbis Præféctus, post eórum martýrium tenéri, atque illústri passióne, post ignem superátum, fecit gládio consummári, témpore Marci Aurélii Sevéri Alexándri Imperatóris. Ejus vero festum recólitur décimo Kaléndas Decémbris.

    Heracléæ, in Thrácia, sanctæ Sebastiánæ Mártyris, quæ a beáto Paulo Apóstolo ad Christi fidem est perdúcta; atque, sub Domitiáno Imperatóre et Sérgio Prǽside, váriis modis tentáta, gládio tandem cæsa est.

    Romæ, via Flamínia, sanctórum Mártyrum Abúndii Presbýteri, et Abundántii Diáconi, quos Diocletiánus Imperátor, una cum illústri viro Marciáno et ejus fílio Joánne, quem illi a mórtuis suscitáverant, gládio feríri jussit, décimo ab Urbe lápide.

    Córdubæ, in Hispánia, sanctórum Mártyrum Rogélli et Servidéi, qui, mánibus pedibúsque abscíssis, ad últimum decolláti sunt.

    Apud Cándidam Casam, in Scótia, sancti Niniáni, Epíscopi et Confessóris.

    In Anglia sanctæ Edíthæ Vírginis, Regis Anglórum Edgári fíliæ, quæ, in monastério Ordinis sancti Benedícti, apud Wiltóniam, a tenéris annis Deo dicáta, sǽculum hoc ignorávit pótius quam relíquit.

    In monte Cassíno Beáti Victóris Papæ Tértii, qui, sancti Gregórii Séptimi succéssor, Apostólicam Sedem novo splendóre illustrávit, insígnem de Saracénis triúmphum divína ope consecútus. Cultum, ab immemorábili témpore eídem exhíbitum, Leo Décimus tértius, Póntifex Máximus, ratum hábuit et confirmávit.
  en: |
    At Chalcedon, the holy Virgin and martyr Euphemia. Under the Emperor Diocletian and the Proconsul Priscus, she overcame for Christ's sake torture, imprisonment, stripes, wheels, fire, stones, beasts, rods, sharp saws, and hot metal. When she was again cast to the beasts in the theatre, she prayed the Lord to take her spirit to Himself, and then one of them bit her sacred body, while the rest licked her feet, and she resigned her soul without spot to God.

    At Rome, the holy martyrs Lucy, a noble matron, and Geminian, whom the Emperor Diocletian, after they had suffered grievously and long been tormented, and had thus gained a noble victory by martyrdom, commanded to be slain with the sword.

    The birthday of holy Pope Martin I, martyr, who, having condemned Sergius, Paul, and Pyrrhus the heretics in a Synod gathered at Rome, was therefore, by command of Constans, the heretic Emperor, taken by fraud and carried to Constantinople, banished to the Chersonese, and there, worn out with hardships for the Catholic faith, ended his life, and was famous for many miracles. His body, afterward translated to Rome, was laid in the church of Saints Sylvester and Martin. His feast, however, is kept upon the 12th day of November.

    At Rome, likewise the birthday of holy Cecilia, Virgin and martyr, who led her husband Valerian and his brother Tiburtius to believe in Christ, and stirred them up to martyrdom. After their martyrdom Almachius, Prefect of the City, caused her to be seized, and her glorious passion, after she had overcome the fire, to be fulfilled by the sword, in the time of the Emperor Marcus Aurelius Severus Alexander. Her feast is kept upon the 22nd day of November.

    At Heraclea, in Thrace, the holy martyr Sebastiana, who was led to believe in Christ by the blessed Apostle Paul. Under the Emperor Domitian and the President Sergius she was diversely tried and at last slain with the sword.

    Likewise at Rome, upon the Flaminian Way, the holy martyrs Abundius the Priest and Abundantius the Deacon, whom the Emperor Diocletian commanded to be beheaded at the tenth milestone from the city, along with the eminent Marcian, and John, the son of Marcian, whom they had raised from the dead.

    At Cordova, the holy martyrs Rogellus and ServusDei, who had their hands and feet cut off and were at last beheaded.

    In Scotland, the holy Confessor Ninian, Bishop.

    In England, the holy Virgin Edith, daughter of Edgar, King of the English, who was dedicated to God from a child in the Monastery of the Order of St. Benedict, at Wilton, and knew not the world, rather then forsook it.

    At Monte Cassino, blessed Pope Victor III, who, the successor of holy Gregory VII, made the Apostolic See illustrious with new splendour, having by the help of God won a notable triumph over the Saracens. The veneration paid to him from time immemorial Pope Leo XIII ratified and confirmed.
status:
  la: verified
  en: verified
