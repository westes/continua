# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-04"
text:
  la: |
    Sancti Domínici Confessóris, qui Ordinis Fratrum Prædicatórum Fundátor fuit, atque octávo Idus mensis hujus in pace quiévit.

    In vico Ars, diœcésis Bellicénsis, in Gállia, natális sancti Joánnis Baptístæ-Maríæ Vianney, Presbýteri et Confessóris, in parochiáli múnere obeúndo insígnis, quem Pius Papa Undécimus in Sanctórum númerum rétulit, ipsíus festum quinto Idus mensis hujus agéndum indíxit, eúmque ómnium parochórum cæléstem Patrónum constítuit.

    Thessalonícæ item natális beáti Aristárchi, qui discípulus et comes indivíduus fuit sancti Pauli Apóstoli, de quo ipse Paulus ad Colossénses scribit: « Salútat vos Aristárchus, concaptívus meus ». Is, ab eódem Apóstolo Epíscopus Thessalonicénsium ordinátus, tandem, post longos agónes, sub Neróne, coronátus a Christo, quiévit.

    Romæ sanctæ Perpétuæ, quæ, a beáto Petro Apóstolo baptizáta, Nazárium fílium et Africánum virum ad Christi fidem perdúxit, et multa sanctórum Mártyrum córpora sepelívit; ac tandem, bonórum óperum méritis cumuláta, migrávit ad Dóminum.

    Item Romæ, via Latína, pássio beáti Tertullíni, Presbýteri et Mártyris; qui, sub Valeriáno Imperatóre, post ímpiam fústium mactatiónem, ígnium circa látera exustiónem, oris quassatiónem, atque in equúleo extensiónem nervorúmque cæsiónem, data senténtia, cápitis amputatióne martýrium consummávit.

    Constantinópoli sancti Eleuthérii Mártyris, ex órdine Senatório viri, qui pro Christo, in persecutióne Maximiáni, gládio cæsus est.

    In Pérside sanctárum Mártyrum Iæ et Sociárum; quæ, cum novem míllibus Christiánis captívis, sub Sápore Rege, divérsis pœnis afflíctæ, martýrium subiérunt.

    Verónæ sancti Agábii, Epíscopi et Confessóris.

    Turónis, in Gállia, sancti Euphrónii, Archiepíscopi ejúsdem sedis.

    Colóniæ Agrippínæ commemorátio sancti Protásii Mártyris; qui Medioláni, una cum Gervásio fratre, passus est tertiodécimo Kaléndas Júlii.
  en: |
    At Ars, in the diocese of Belley, in Gaul, the birthday of holy John Baptist Mary Vianney, Priest and Confessor, renowned in the discharge of the office of a parish priest, whom Pope Pius XI enrolled among the Saints, appointed his feast to be kept upon the 9th day of this month, and made him heavenly Patron of all parish priests.

    At Thessalonica, the blessed Aristarchus, the disciple and close companion of the holy Apostle Paul, concerning whom the same Apostle writeth unto the Colossians, "Aristarchus, my fellow-prisoner, saluteth you." He was by the same Apostle ordained Bishop of the Thessalonians, and after long contendings under Nero he was crowned by Christ, and fell asleep.

    At Rome, upon the Latin Way, the blessed martyr Tertullinus. He was a Priest who, under the Emperor Valerian, was horridly beaten with clubs, had his sides burnt and his mouth crushed, was stretched upon a rack and had his muscles cut, and then sentence was given to behead him, and so he finished his testimony.

    At Constantinople, the holy martyr Eleutherius, of the Senatorial Order, who was slain with the sword for Christ's sake, in the persecution under Maximian.

    In Persia, the holy martyrs Ia and her Companions, who were diversely afflicted and underwent martyrdom along with nine thousand Christian prisoners under King Sapor.

    At Cologne, the holy martyr Protasius.

    At Verona, the holy Confessor Agabius, Bishop of that see.

    At Tours, holy Euphronius, Archbishop of that see.

    At Rome, holy Perpetua, who was baptized by the blessed Apostle Peter. She turned her son Naserius and her husband Africanus to believe in Christ, and buried a great number of bodies of the holy martyrs, and passed away to be with the Lord, full of good works.
status:
  la: verified
  en: verified
