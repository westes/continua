# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-30"
text:
  la: |
    In Sardínia natális sancti Pontiáni, Papæ et Mártyris, qui, ab Alexándro Imperatóre, una cum Hippólyto Presbýtero, in eam ínsulam deportátus, ibídem, mactátus fústibus, martýrium consummávit. Ejus corpus a beáto Fabiáno Papa Romam delátum est, atque in cœmetério Callísti sepúltum. Ipsíus tamen festum recólitur tertiodécimo Kaléndas Decémbris.

    Ægéæ, in Cilícia, pássio sanctórum Zenóbii Epíscopi, et Zenóbiæ soróris, sub Diocletiáno Imperatóre et Lýsia Prǽside.

    Altíni, in Venetórum fínibus, sancti Theonésti, Epíscopi et Mártyris, qui ab Ariánis occísus est.

    In Africa natális sanctórum Mártyrum ducentórum vigínti.

    Tingi, in Mauritánia, pássio sancti Marcélli Centuriónis, qui, sanctórum Cláudii ac Lupérci et Victórii Mártyrum pater, cápitis abscissióne martýrium complévit sub Agricoláo, agente vices Præfécti prætório.

    Alexandríæ sanctórum trédecim Mártyrum, qui, cum sanctis Juliáno, Euno et Macário, passi sunt sub Décio Imperatóre.

    Cárali, in Sardínia, sancti Saturníni Mártyris, qui, in persecutióne Diocletiáni, sub Bárbaro Prǽside, cápite truncátus est.

    Apaméæ, in Phrýgia, sancti Máximi Mártyris, sub eódem Diocletiáno.

    Legióne, in Hispánia, sanctórum Mártyrum Cláudii, Lupérci et Victórii, filiórum sancti Marcélli Centuriónis; qui, in persecutióne Diocletiáni et Maximiáni, sub Diogeniáno Prǽside, jussi sunt decollári.

    Lutétiæ Parisiórum sancti Lucáni Mártyris.

    Alexandríæ sanctæ Eutrópiæ Mártyris, quæ, Mártyres vísitans, apprehénsa est, et, cum illis sævíssime cruciáta, réddidit spíritum.

    Antiochíæ sancti Serapiónis Epíscopi, eruditióne claríssimi.

    Cápuæ sancti Germáni, Epíscopi et Confessóris, magnæ sanctitátis viri; cujus ánimam, in hora óbitus ejus, ab Angelis in cælum deférri sanctus Benedíctus aspéxit.

    Poténtiæ, in Lucánia, sancti Gerárdi Epíscopi.
  en: |
    In Sardinia, the birthday of holy Pontian, Pope and martyr, who, being carried by the Emperor Alexander into that island, together with Hippolytus the Priest, there, beaten with cudgels, fulfilled his martyrdom. His body was carried to Rome by blessed Pope Fabian, and buried in the cemetery of Callistus. His feast, however, is kept upon the 19th day of November.

    In Africa, two hundred and twenty holy martyrs.

    At Tangiers, in Morocco, the holy centurion Marcellus, who accomplished martyrdom by being beheaded under Agricolaus, Vicar to the Prefect of the Pretorium.

    At Alexandria, thirteen holy martyrs, who suffered under the Emperor Decius, along with Julian, Eunus, and Macarius.

    At Alexandria also, the holy martyr Eutropia, who visited the martyrs, and, being most cruelly tormented along with them, gave up the ghost.

    At Cagliari, in Sardinia, the holy martyr Saturninus, who was beheaded under the President Barbarus, in the persecution under the Emperor Diocletian.

    At Apamea, in Phrygia, under the same Emperor Diocletian, the holy martyr Maximus.

    At Leon, in Spain, the holy martyrs Claudius, Lupercus, and Victorius, sons of the holy centurion Marcellus, who were beheaded under the President Diogenian, in the persecution under the Emperors Diocletian and Maximian.

    At Algaea, in Cilicia, under the President Lysias and the Emperor Diocletian, the holy martyrs Zenobius, Bishop, and Zenobia his sister.

    At Altino, the holy martyr Theonestus, Bishop, who was slain by the Arians.

    At Paris, the holy martyr Lucan.

    At Antioch, holy Serapion, Patriarch, eminent for his learning.

    At Capua, the holy Confessor Germanus, Bishop, a man of great holiness, whose soul, at the hour of his death, holy Benedict saw carried heavenward by Angels.

    At Potenza, in Lucania, holy Gerard, Bishop.
status:
  la: verified
  en: verified
