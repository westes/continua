# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-22"
text:
  la: |
    Romæ, via Appia, natális sancti Sotéris, Papæ et Mártyris.

    Item Romæ sancti Caji, Papæ et Mártyris; qui martýrio coronátus est sub Diocletiáno Príncipe.

    Smyrnæ sanctórum Apéllis et Lúcii, ex primis Christi discípulis.

    Eódem die sanctórum plurimórum Mártyrum, qui, sequénti anno post óbitum Simeónis, ánnuo item die quo passiónis Domínicæ memória celebrabátur, per totam Pérsidis regiónem, pro Christi nómine, sub Rege Sápore, gládio cædi jussi sunt. In quo fídei certámine passus est Azades eunúchus, Regi caríssimus; Milles Epíscopus, sanctitáte et miraculórum virtúte insígnis; Acépsimas Epíscopus, cum Presbýtero suo Jacóbo, item Aíthala Diácono Bathnucadrénsi et Josépho Presbýtero Bethcatubénsi, Azadáne et Abdiéso Diáconis, et complúribus áliis Cléricis; Maréas quoque et Bicor Epíscopi, cum áliis vigínti Epíscopis, et Cléricis fere ducéntis quinquagínta, Mónachis étiam et sacris Virgínibus plúrimis. Has inter Vírgines fuit étiam sancti Simeónis Epíscopi soror, nómine Tárbula, cum pedíssequa sua; quæ, stipítibus alligátæ serráque scissæ, crudelíssime necátæ sunt.

    Item in Pérside sanctórum Parménii, Heliménæ et Chrysotéli Presbyterórum, Lucæ et Múcii Diaconórum, quorum triúmphus martýrii in passióne sanctórum Abdon et Sennen habétur.

    Alexandríæ natális sancti Leónidæ Mártyris, qui sub Sevéro passus est.

    Lugdúni, in Gállia, sancti Epipódii, qui, in persecutióne Antoníni Veri, cum Alexándro colléga tentus, ibídem, post dira torménta, martýrium abscissióne cápitis complévit.

    Constantinópoli sancti Agapíti Papæ Primi, cujus sánctitas a beáto Gregório Magno commendátur. Ipsíus autem corpus, póstea Romam relátum, in Vaticáno cónditum est.

    Apud Sénonas sancti Leónis, Epíscopi et Confessóris.

    Anastasiópoli, in Galátia, sancti Theodóri Epíscopi, miráculis clari.
  en: |
    At Rome, upon the Appian Way, the holy martyr Soter, Pope.

    At Rome likewise, the holy martyr Caius, Pope, who was crowned with martyrdom under the Emperor Diocletian.

    At Smyrna, holy Apelles and Lucius, who were among the earliest disciples of Christ.

    Upon the same day very many holy martyrs, who were slain with the sword for Christ's name's sake by order of King Sapor in diverse places throughout the whole kingdom of Persia, in the year following the death of Simeon, and like him upon the day upon which is made the memorial of the Passion of the Lord. In this contending for the faith, there suffered the eunuch Azades, who was a favourite of the king; Milles, Bishop who was illustrious for his holiness and for the glory of his miracles; Acepsimas, Bishop, along with James his Priest the Priests; Aithalas, Deacon of Bathnukadra, and Joseph, Priest of Bethcatuba, the Deacons Azadanes and Abd-Jesus, and very many others of the clergy; likewise also the Bishops Mareas and Bicor, along with twenty other bishops, and nearly two hundred and fifty of the clergy; likewise also very many monks, and hallowed virgins, among whom was Tarbula, the sister of holy Simeon, along with her waiting-woman, who were most cruelly slain by being bound to beams and cut through with a saw.

    Also in Persia, the holy martyrs, the Priests Parmenius, Helimenas, and Chrysotelus, and the Deacons Luke and Mucius, whose triumph is recorded in the history of the sufferings of the holy martyrs Abdon and Sennen.

    At Alexandria, the holy martyr Leonides, who suffered under the Emperor Severus.

    At Lyons, holy martyr Epipodius, who was arrested along with his colleague Alexander, in the persecution under the Emperor Antoninus Verus, and after suffering most grievous torments was beheaded.

    At Constantinople, holy Pope Agapetus I, whose holiness is commended by blessed Gregory the Great. His body, afterward carried back to Rome, was laid in the Vatican.

    At Sens, the holy Confessor Leo, Bishop of that see.

    At Anastasiopolis, holy Theodore, Bishop, famous for miracles.
status:
  la: verified
  en: verified
