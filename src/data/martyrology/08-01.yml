# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-01"
leadEntries: 1
text:
  la: |
    Romæ, in Exquíliis, Dedicátio sancti Petri Apóstoli ad Víncula.

    Antiochíæ pássio sanctórum septem fratrum Machabæórum Mártyrum, qui, cum matre sua, passi sunt sub Antíocho Epipháne Rege. Eórum relíquiæ, Romam translátæ, in eádem Ecclésia sancti Petri ad Víncula cónditæ fuérunt.

    Vercéllis natális sancti Eusébii, Epíscopi et Mártyris, qui, ob confessiónem fídei cathólicæ, a Constántio Príncipe Scythópolim, in Palæstína, et inde in Cappadóciam relegátus, póstmodum ad Ecclésiam suam revérsus, vivum martýrium, persequéntibus Ariánis, passus est. Ipsíus autem memória étiam décimo octávo Kaléndas Januárii solémniter habétur, quo die fuit Epíscopus ordinátus; ejúsque festum recólitur décimo séptimo Kaléndas Januárii.

    Nucériæ Paganórum, in Campánia, item natális sancti Alfónsi-Maríæ de Ligório, Fundatóris Congregatiónis a sanctíssimo Redemptóre nuncupátæ, Epíscopi sanctæ Agathæ Gothórum et Confessóris, zelo animárum, scriptis, verbo et exémplo insígnis; quem Summus Póntifex Gregórius Décimus sextus albo Sanctórum adscrípsit, et Pius Nonus Doctórem universális Ecclésiæ declarávit, et Pius Duodécimus ómnium Confessariórum ac Moralistárum cæléstem apud Deum Patrónum constítuit. Ipsíus vero festívitas sequénti die celebrátur.

    Romæ, via Latína, sanctórum Mártyrum Boni Presbýteri, Fausti et Mauri, cum áliis novem; qui in Actis sancti Stéphani Papæ describúntur.

    Item Romæ pássio sanctárum Vírginum Fídei, Spei et Caritátis, e sancta Sophía matre, quæ prídie Kaléndas Octóbris memorátur, progenitárum, quæ, sub Hadriáno Príncipe, martýrii corónam adéptæ sunt.

    Philadelphíæ, in Arábia, sanctórum Mártyrum Cyrílli, Aquilæ, Petri, Domitiáni, Rufi et Menándri, una die coronatórum.

    Perge, in Pamphýlia, sanctórum Mártyrum Leóntii, Attii, Alexándri, et aliórum sex agricolárum; qui, in persecutióne Diocletiáni, sub Flaviáno Prǽside, decolláti sunt.

    Gerúndæ, in Hispánia, natális sancti Felícis Mártyris, qui, post divérsa tormentórum génera, a Daciáno támdiu jussus est laniári, donec invíctum Christo spíritum rédderet.

    In território Parisiénsi sancti Justíni Mártyris.

    Viénnæ, in Gállia, sancti Veri, quinti Epíscopi.

    Wintóniæ, in Anglia, sancti Ethelwóldi Epíscopi.

    In pago Lisuíno, in departaménto Calvadoénsi, in Gállia, sancti Nemésii Confessóris.
  en: |
    Commemorated the dedication of the Church of St. Peter-in-Chains, upon the Esquiline Mount at Rome.

    At Antioch, the seven holy Maccabee brethren and their mother, who suffered under King Antiochus Epiphanes. Their relics have been brought to Rome and buried in the aforesaid Church of St. Peter-in-Chains.

    At Vercelli, the holy martyr Eusebius, Bishop of that city, who was banished by the Emperor Constantius, first to Bethshan and then into Cappadocia, on account of his confession of the Catholic faith, but at length returned unto his own Church. He suffered a living martyrdom under the persecution of the Arians. His memory is chiefly kept upon the 15th day of December, which is that of his ordination as Bishop.

    At Nocera dei Pagani, in Campania, likewise the birthday of holy Alphonsus Mary de Liguori, Founder of the Congregation of the most holy Redeemer, Bishop of Sant' Agata dei Goti and Confessor, renowned for zeal for souls, for his writings, his word, and his example; whom Pope Gregory XVI enrolled in the roll of the Saints, and Pius IX declared Doctor of the universal Church, and Pius XII appointed heavenly Patron with God of all Confessors and Moralists. His feast is kept upon the next day.

    Likewise at Rome, upon the Latin Way, the holy martyrs Bonus the Priest, Faustus, and Maurus, and nine others, of whom it is written in the Acts of holy Pope Stephen.

    At Rome, the holy Virgins, Faith, Hope, and Charity, daughters of St. Sophia, who is named under September 30, who gained the crown of martyrdom under the Emperor Hadrian.

    At Philadelphia, in Arabia, the holy martyrs Cyril, Aquila, Peter, Domitian, Rufus, and Menander, who were all crowned upon one and the same day.

    At Perge, in Pamphylia, the holy martyrs Leontius, Attius, Alexander, and six other husbandmen, who were beheaded under the President Flavian in the persecution under the Emperor Diocletian.

    At Gerona, in Spain, the holy martyr Felix, who after torments of diverse kinds was ordered by the Emperor Dacian to be mangled until he gave up his unconquered spirit to Christ.

    At Paris, the holy martyr Justinus.

    At Vienne, holy Verus, fifth Bishop.

    At Winchester, in England, holy Ethelwold, Bishop.

    In the district of Lisieux, in the department of Calvados, France, the holy Confessor Nemesius.
