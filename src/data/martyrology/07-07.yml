# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "07-07"
text:
  la: |
    Sanctórum Episcopórum et Confessórum Cyrílli et Methódii fratrum, quorum natális respectíve ágitur sextodécimo Kaléndas Mártii et octávo Idus Aprílis.

    Romæ sanctórum Mártyrum Cláudii Commentariénsis, Nicostráti primiscrínii, qui fuit vir beátæ Mártyris Zoæ, Castórii, Victoríni et Symphoriáni; quos omnes sanctus Sebastiánus ad fidem Christi perdúxit, et beátus Polycárpus Présbyter baptizávit. Eósdem, in perquiréndis sanctórum Mártyrum corpóribus occupátos, Fabiánus Judex comprehéndi jussit, et, cum eos, per decem dies minis et blandítiis exágitans, in nullo pénitus posset commovére, jussit tértio torquéri, ac póstea in mare præcípites dari.

    Dyrráchii, in Macedónia, sanctórum Mártyrum Peregríni, Luciáni, Pompéji, Hesýchii, Pápii, Saturníni et Germáni; qui, natióne Itáli, in persecutióne Trajáni, cum ad eam urbem confugíssent, et ibi sanctum Astíum Epíscopum, pro fide Christi, in cruce pendéntem vidérent, ac se páriter Christiános esse palam confiteréntur, ídeo, Prǽsidis jussu, tenti sunt atque in mare demérsi.

    Bríxiæ sancti Apollónii, Epíscopi et Confessóris.

    Eystádii, in Germánia, sancti Willebáldi, ejúsdem urbis primi Epíscopi, qui fílius éxstitit sancti Richárdi, Anglórum Regis, et frater sanctæ Walbúrgæ Vírginis; atque, una cum sancto Bonifátio, labórans in Evangélio, multas gentes convértit ad Christum.

    Arvérnis, in Gállia, sancti Illídii Epíscopi.

    Urgéllæ, in Hispánia Tarraconénsi, sancti Odónis Epíscopi.

    In Anglia sancti Heddæ, Epíscopi Sáxonum occidentálium.

    Alexandríæ natális sancti Pantǽni, viri Apostólici et omni sapiéntia adornáti, cui tantum stúdii et amóris erga verbum Dei fuit, ut étiam ad prædicándum Christi Evangélium géntibus quæ in Oriéntis últimis secéssibus recondúntur, fídei et devotiónis calóre succénsus, proféctus sit; ac demum, Alexandríam revérsus, ibi, sub Antoníno Caracálla, in pace quiévit.

    Eboriáci, in território Meldénsi, sanctæ Edilbúrgæ, Abbatíssæ et Vírginis, Anglórum Regis fíliæ.

    Perúsiæ Beáti Benedícti Papæ Undécimi, Tarvisíni, ex Ordine Prædicatórum, Confessóris; qui, brevi Pontificátus sui spátio, Ecclésiæ pacem, disciplínæ restauratiónem, religiónis increméntum mirífice promóvit.
  en: |
    The holy brethren Cyril and Methodius, Bishops and Confessors, whose birthdays are recorded severally upon the 14th day of February and upon the 6th day of April.

    At Rome, the holy martyrs Claudius the book-keeper, Nicostratus the chief clerk, Castorius, Victorinus, and Symphorianus, whom holy Sebastian brought to believe in Christ and the blessed Priest Polycarp baptized. Fabian the judge ordered them to be arrested while they were seeking the bodies of holy martyrs, and troubled them for ten days with threats and cajolery. When he found that he was in nowise able to move them, he ordered them to be tortured and afterwards to be cast into the sea.

    At Durazzo, in Macedonia, the holy martyrs Peregrin, Lucian, Pompey, Hesychius, Papius, Saturninus, and German. These were Italians by nation, and fled to Durazzo during the persecution under Trajan. When they came thither they saw holy Bishop Astius hanging upon the cross for Christ's faith's sake, whereupon they openly confessed themselves to be Christians, and by command of the President they were first tried and then drowned in the sea.

    At Perugia, the blessed Pope Benedict XI, surnamed Tarvisini, a Friar of the Order of Preachers, who in the short while of his Papacy did wondrous much for the peace of the Church, the restoration of discipline, and the increase of religion. [He died at Perugia in 1304, after reigning eight months and some days.]

    At Alexandria, the holy Pantaenus. He was a man apostolic and adorned with all wisdom. Such was his use and love toward the Word of God that he went glowing with faith and earnestness to preach the gospel of Christ to the nations that are in the uttermost parts of the East. Thence he returned to Alexandria, and there at length he fell asleep, under the Emperor Antoninus Caracalla.

    At Brescia, the holy Confessor Apollonius, Bishop.

    In Saxony, holy Willibald, first Bishop of Eichstatt, who laboured in the Gospel along with holy Boniface and turned many peoples to Christ, whose feast we keep upon the 9th day of this present month of July.

    [At Clermont,] in Auvergne, holy Illidius, Bishop [of that same See,].

    At Urgel, in Spain, holy Odo, Bishop.

    In England, holy Hedda, [a monk of the monastery of St. Hilda,] Bishop of the West Saxons. [In the year 676 he lived first at Dorchester, but afterwards removed his see to Winchester. He governed his church with great holiness for about thirty years, and departed to the Lord in the year 705.]

    In England, the holy Virgin Eadelburg, daughter of [Anna,] King of the East Angles. [She became a nun, and finally Abbess, in the monastery of Ferremontier, in the forest of Brie, in France, about the year 695.]
