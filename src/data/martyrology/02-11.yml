# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "02-11"
text:
  la: |
    Lapúrdi, in Gállia, Apparítio beátæ Maríæ Vírginis Immaculátæ.

    Hadrianópoli, in Thrácia, sanctórum Mártyrum Lúcii Epíscopi, et Sociórum ejus, sub Constántio. Ipse Lúcius, ab Ariánis multa perpéssus, in vínculis martýrium consummávit; céteri vero nobilióres cívium, cum Ariános, in Sardicénsi Concílio tunc damnátos, recípere noluíssent, a Philágrio Cómite capitálem senténtiam excepérunt.

    In Africa natális sanctórum Mártyrum Saturníni Presbýteri, Datívi, Felícis, Ampélii et Sociórum, qui, in persecutióne Diocletiáni, cum ad Domínicum ex more celebrándum conveníssent, idcírco, a milítibus comprehénsi, sub Anolíno Procónsule passi sunt.

    In Numídia commemorátio plurimórum sanctórum Mártyrum, qui in eádem persecutióne comprehénsi sunt, et, cum juxta Imperatóris edíctum divínas Scriptúras trádere noluíssent, gravíssimis excruciáti sunt supplíciis, ac tandem occísi.

    Romæ sancti Gregórii Papæ Secúndi, qui Leónis Isaúrici impietáti acérrime réstitit, et sanctum Bonifátium ad prædicándum Evangélium in Germániam misit.

    Item Romæ sancti Paschális Papæ Primi, qui plúrima sanctórum Mártyrum córpora levávit e cryptis, eáque in divérsis Urbis Ecclésiis honorífice collocávit.

    Ravénnæ sancti Calóceri, Epíscopi et Confessóris.

    Medioláni sancti Lázari Epíscopi.

    Cápuæ sancti Castrénsis Epíscopi.

    In Castro Nantoniénsi, in Gállia, sancti Severíni, qui fuit Abbas monastérii Agaunénsis, suísque précibus cultórem Dei, Regem Clodovéum, a diútina infirmitáte liberávit.

    In Ægýpto sancti Jonæ Mónachi, virtútibus clari.

    Viénnæ, in Gállia, Translátio córporis sancti Desidérii, Epíscopi et Mártyris, ex território Lugdunénsi, in quo ipse olim passus fúerat décimo Kaléndas Júnii.
  en: |
    At Lourdes, in Gaul, the Apparition of the blessed Virgin Mary Immaculate.

    At Adrianople, the holy martyrs Lucius, Bishop, and his Companions. He suffered much from the Arians under the Emperor Constantius, and finished his testimony in chains. The others were some of the nobler of the citizens who were condemned to death by Count Philagrius because they refused to receive the Arians who had been then condemned in the Council of Sardica.

    In Africa, the holy martyrs the Priest Saturninus, Dativus, Felix, Ampelius, and their Companions, who were taken by the soldiers in the persecution under the Emperor Diocletian when they came together in one, as the use is, to hold the Lord's Supper, and suffered under the proconsul Anolinus.

    In Numidia are commemorated many holy martyrs who were arrested, in the persecution aforesaid, and for as much as they would not obey the edict of the Emperor to give up the Scriptures of God, they were put to grievous torments and slain.

    At Rome, holy Pope Gregory II, who sharply withstood the ungodliness of Leo the Isaurian, and sent holy Boniface into Germany to preach the Gospel.

    Likewise at Rome, holy Pope Paschal I, who took up the bodies of very many holy martyrs from the crypts, and honourably laid them in divers churches of the City.

    At Ravenna, the holy Confessor Calocerus, Bishop of that see.

    At Milan, the holy Lazarus, Bishop of that see.

    At Capua, holy Castrensis, Bishop of that see.

    At the village of Landon, holy Severinus, Abbot of the monastery of St Maurice, at whose prayers the servant of God, King Clovis, was healed of a long malady.

    In Egypt, the holy monk Jonah, renowned for his graces.

    At Lyon, the holy martyr Desiderius, Bishop of Vienne.
status:
  la: verified
  en: verified
