# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "06-02"
text:
  la: |
    Romæ natális sanctórum Mártyrum Marcellíni Presbýteri, et Petri Exorcístæ, qui, sub Diocletiáno, cum multos in cárcere ad fidem erudírent, ídeo, post dira víncula et plúrima torménta, a Seréno Júdice decolláti sunt in loco qui dicebátur Silva Nigra; quæ deínde, in honórem Sanctórum, commutáto nómine, Silva Cándida appelláta est. Horum córpora in crypta, juxta sanctum Tibúrtium, sepúlta sunt; eorúmque sepúlcrum sanctus Dámasus Papa vérsibus póstea exornávit.

    In Campánia sancti Erásmi, Epíscopi et Mártyris. Hic, sub Diocletiáno Augústo, primum plumbátis cæsus, deínde fústibus gráviter mactátus, post resína, súlphure, plumbo, pice, cera oleóque perfúsus, illǽsus appáruit; deínde Fórmiis, sub Maximiáno, divérsis atque immaníssimis supplíciis íterum tortus, sed ad confirmándum céteros a Deo servátus; tandem, vocánte Dómino, martýrio clarus, sancto fine quiévit. Ipsíus autem corpus Cajétam póstea translátum est.

    Lugdúni, in Gállia, sanctórum Mártyrum Pothíni Epíscopi, Sancti Diáconi, Vétii, Epagáthi, Maturi, Póntici, Bíblidis, Attali, Alexándri et Blandínæ, cum áliis multis; quorum fórtia et iteráta certámina, témpore Marci Aurélii Antoníni et Lúcii Veri, Ecclésiæ Lugdunénsis epístola, ad Ecclésias Asiæ et Phrýgiæ scripta, recénset. In his sancta Blandína, sexu infírmior, córpore imbecíllior, conditióne dejéctior, diuturnióra et acerbióra certámina súbiens, et fortis adhuc pérmanens, gládio juguláta, céteros secúta est, quos hortabátur ad palmam.

    In ínsula Proconnéso, in Propóntide, sancti Nicéphori, Epíscopi Constantinopolitáni, qui, paternárum traditiónum propugnátor acérrimus, pro cultu sanctárum Imáginum se Leóni Arméno, Imperatóri Iconoclástæ, constánter oppósuit; a quo mulctátus exsílio, ibídem, cum per quatuórdecim annos longum duxísset martýrium, migrávit ad Dóminum.

    Romæ sancti Eugénii Primi, Papæ et Confessóris.

    Trani, in Apúlia, sancti Nicolái Peregríni Confessóris, cujus mirácula in Concílio Románo, cui beátus Urbánus Papa Secúndus prǽfuit, recitáta sunt.
  en: |
    At Rome, the holy martyrs Marcellinus the priest, and Peter the Exorcist. They were teaching the faith to many in prison in the time of Diocletian, when Serenus the judge, after putting them to terrible bonds and many torments, caused them to be beheaded at the place which was then called the Black Wood, but the name of which was afterwards changed in honor of the Saints, and called the White Wood. Their bodies were buried in the crypt, hard by the body of holy Tibertius, and holy Pope Damasus in after-days decorated their grave with a set of verses.

    In Campania, the holy martyr Elmo, Patriarch. Under the Emperor Diocletian he was first hided with scourges laden with lead, then heavily beaten with cudgels, after which resin, sulphur, lead, pitch, wax, and oil were poured over him, but he still appeared unharmed. Thereafter at Formi, under Maximian, he was tortured again with diverse and most cruel sufferings but God preserved him to strengthen others, until at length, famous for his testimony, he fell asleep in a holy death at the call of the Lord. His body was afterwards taken to Gaeta.

    At Lyon, the holy martyrs Photinus the Bishop, Sanctus the Deacon, Vetius, Epagathus, Maturus, Ponticus, Biblides, Attalus, Alexander, and Blandina, with many others, whose mighty and constant contendings, in the time of Marcus Aurelius Antoninus and Lucius Verus, are written in the Epistle of the Church of Lyon to the Churches of Asia and Phrygia; among these the holy Blandina, weaker by sex, frailer in body, lower in social position, underwent contendings more long and more sharp, and remaining still inflexible, was slain by the sword, and so followed the others whom she had exhorted to victory.

    In the island of Proconnesus, in the Propontis, holy Nicephorus, Bishop of Constantinople, who, a most earnest champion of the traditions of the fathers, steadfastly withstood Leo the Armenian, the Iconoclast Emperor, in defence of the veneration of holy Images; by whom, being punished with exile, and having there drawn out a long martyrdom of fourteen years, he departed to the Lord.

    At Rome, the holy Confessor Pope Eugenius I.

    At Trani, in Apulia, the holy Confessor Nicholas Peregrini, whose wonderful works were published in a Council at Rome under Pope Urban II.
