# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "02-23"
text:
  la: |
    /:In anno Bissextili omittitur: Vigília sancti Matthíæ Apóstoli; quia transfertur in sequentem diem, quæ est 24.:/

    Sancti Petri Damiáni, ex Ordine Camaldulénsi, Cardinális et Epíscopi Ostiénsis, Confessóris et Ecclésiæ Doctóris, qui evolávit in cælum prídie hujus diéi.

    Smyrnæ natális sancti Polycárpi, qui, beáti Joánnis Apóstoli discípulus, et ab eo ejúsdem civitátis Epíscopus ordinátus, totíus Asiæ Princeps fuit. Póstea, sub Marco Antoníno et Lúcio Aurélio Cómmodo, sedénte Procónsule et univérso pópulo in theátro advérsus eum personánte, igni tráditus est; et, cum ab igne mínime læderétur, martýrii corónam, gládio confóssus, accépit. Cum illo étiam álii duódecim, qui ex Philadélphia vénerant, in eádem Smyrnénsi urbe, martýrio consummáti sunt. Ipsíus tamen Polycárpi festum séptimo Kaléndas Februárii celebrátur.

    Apud Sírmium beáti Siréni, Mónachi et Mártyris, qui, jubénte Maximiáno Imperatóre, reténtus est, et, cum se Christiánum esse confiterétur, cápite obtruncátus.

    Ibídem natális sanctórum septuagínta duórum Mártyrum, qui, martýrii certámen in præfáta urbe consummántes, mansúra percepérunt regna.

    In civitáte Asturicénsi, in Hispánia, sanctæ Marthæ, Vírginis et Mártyris, quæ, sub Décio Imperatóre et Patérno Procónsule, dire ob Christi fidem est cruciáta et gládio tandem occísa.

    Constantinópoli sancti Lázari Mónachi, qui, cum sacras Imágines píngeret, idcírco, Imperatóris Iconoclástæ Theóphili jussu, diris supplíciis excruciátur, et ei manus candénti ferro combúritur; sed, Dei virtúte sanátus, abrásas Imágines sanctas pingéndo restítuit, ac demum in pace quiévit.

    Bríxiæ sancti Felícis Epíscopi.

    Romæ sancti Polycárpi Presbýteri, qui, cum beáto Sebastiáno, plúrimos ad Christi fidem convértit, atque ad martýrii glóriam exhortándo perdúxit.

    Híspali, in Hispánia, sancti Floréntii Confessóris.

    Tudérti, in Umbria, sanctæ Románæ Vírginis, quæ, a sancto Silvéstro Papa baptizáta, in antris et spelúncis cæléstem vitam duxit, et miraculórum glória cláruit.

    In Anglia sanctæ Milbúrgis Vírginis, fíliæ Regis Merciórum, soróris sanctæ Mildrédæ, et Abbatíssæ Wenlocénsis in Salopia.

    /:In anno Bissextili bis pronuntiatur Sexto Kaléndas Mártii, et eadem Luna, scilicet die 24 et 25.:/

    /:Prima die, id est 24, hoc modo: Sexto Kaléndas Mártii. Luna..., quota fuerit. Deinde: Vigília sancti Matthíæ Apóstoli. Item commemorátio plurimórum sanctórum Mártyrum et Confessórum, atque sanctárum Vírginum. :/

    /:Secunda die, id est 25: Sexto Kaléndas Mártii. Luna... In Judǽa..., et cetera, ut in sequenti Lectione.:/
  en: |
    /:In a leap year the Vigil of the holy Apostle Matthias is omitted, because it is transferred to the following day, which is the 24th.:/

    At Faenza, the holy Peter Damian, Cardinal Bishop of Ostia, famous for his teaching and holiness, whom Pope Leo XII declared to be a Doctor of the Universal Church.

    At Smyrna, the birthday of holy Polycarp, who, a disciple of blessed John the Apostle, and by him ordained Bishop of that city, was the chief of all Asia. Afterward, under Marcus Antoninus and Lucius Aurelius Commodus, the Proconsul sitting, and the whole people crying out against him in the theatre, he was delivered to the fire; and, when he was in no wise hurt by the fire, he received the crown of martyrdom, being pierced with the sword. With him also twelve others, who had come from Philadelphia, were consummated in martyrdom in the same city of Smyrna. The feast of Polycarp himself, however, is kept upon the 26th day of January.

    At Sirmium, the blessed martyr Sirenus a monk who was apprehended by order of the Emperor Maximian, and when he confessed himself to be a Christian was beheaded.

    There likewise, seventy-two holy martyrs, who finished the combat of martyrdom in that city, and received kingdoms which fade not away, eternal in the heavens.

    In the city of Astorga, the holy Virgin Martha, martyred under the Emperor Decius and the Proconsul Paternus.

    At Constantinople, the holy monk Lazarus. Because he painted holy images, the Emperor Theophilus, the Iconoclast, put him to grievous tortures, and burnt his hands with a white-hot iron but he was healed by the power of God, restored the painting upon the holy images that had been defaced, and at length fell asleep in peace.

    At Brescia, holy Felix, Bishop of that see.

    At Rome, the holy Priest Polycarp, who, along with the blessed Sebastian, brought many to believe in Christ, and by his exhortations led them to the glory of martyrdom.

    At Seville, in Spain, the holy Confessor Florence.

    At Todi, the holy Virgin Romana, who was baptized by holy Pope Sylvester, led a heavenly life in dens and caves of the earth, and shone with the glory of miracles.

    In England, the holy Virgin Milburga, daughter of the king of the Mercians, sister of St. Mildred, and Abbess of Wenlock, Shropshire.

    /:In a leap year the sixth day before the Kalends of March is announced twice, with the same moon, that is, on the 24th and the 25th.:/

    /:On the first day, that is the 24th, in this manner: The sixth day before the Kalends of March. Moon..., as it may be. Then: The Vigil of the holy Apostle Matthias. Also the commemoration of very many holy Martyrs and Confessors, and of holy Virgins.:/

    /:On the second day, that is the 25th: The sixth day before the Kalends of March. Moon... In Judea..., and so on, as in the following lesson.:/
