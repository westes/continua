# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-01"
text:
  la: |
    Sancti Remígii, Epíscopi Rheménsis et Confessóris, qui Idibus Januárii obdormívit in Dómino, sed hac die, ob Translatiónem córporis ejus, potíssimum cólitur.

    Romæ beáti Arétæ Mártyris et aliórum quingentórum quátuor.

    Tomis in Ponto sanctórum Mártyrum Prisci, Crescéntis, et Evágrii.

    Ulyssipóne in Lusitánia sanctórum Mártyrum Veríssimi, Máximæ et Júliæ sorórum ejus, qui in persecutióne Diocletiáni passi sunt.

    Tornáci sancti Piatónis Presbýteri et Mártyris, qui cum beáto Quinctíno ejúsque Sóciis ab urbe Roma in Gálliam prædicatiónis causa perréxit, ac póstea in persecutióne Maximiáni consummáto martýrio migrávit ad Dóminum.

    Thessalonícæ sancti Domníni Mártyris, sub eódem Maximiáno.

    Urbe Véteri sancti Sevéri Presbýteri et Confessóris.

    In Portu Gandæ sancti Bavónis Confessóris.
  en: |
    The holy Confessor Remy, Archbishop of Reims, in Gaul, who converted the French nation to Christ, baptized their king Chlodwig, and administered to him the Sacraments of the faith. Remy passed many years in his labors as Bishop, and was famous for his holiness and for the power of working miracles. He died upon the 13th day of January, but his feast is kept upon the 1st day of October, which is that of the translation of his sacred body.

    At Rome, the blessed martyrs Aretas, and five hundred and four others.

    At Tomi, in Pontus, the holy martyrs Priscus, Crescens, and Evagrius.

    At Lisbon, in Portugal, the holy martyrs Verissimus and his sisters Maxima and Julia, who suffered in the persecution under the Emperor Diocletian.

    At Tournai, in Hainaut, the holy martyr Piaton, a Priest, who came from Rome to Gaul to preach along with the blessed Quinctinus and his Companions, and afterwards finished his testimony by martyrdom, in the persecution under the Emperor Maximian, and so passed away to be ever with the Lord.

    At Thessalonica, under the same Emperor Maximian, the holy martyr Domninus.

    At Gent, the holy Confessor Bavo.

    At Orvieto, the holy Priest and Confessor Severus.
