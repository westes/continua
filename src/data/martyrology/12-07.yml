# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-07"
text:
  la: |
    Vigília Conceptiónis Immaculátæ beátæ Maríæ Vírginis.

    Sancti Ambrósii Epíscopi, Confessóris et Ecclésiæ Doctóris, qui prídie Nonas Aprílis obdormívit in Dómino, sed hac die potíssimum cólitur, qua Mediolanénsem Ecclésiam gubernándam suscépit.

    Romæ beáti Eutychiáni Papæ, qui per divérsa loca trecéntos quadragínta duos Mártyres manu sua sepelívit; quibus et ipse deínde sociátus, sub Numeriáno Imperatóre, martýrio coronátus est, et in cœmetério Callísti sepúltus.

    Alexandríæ natális beáti Agathónis militáris, qui, in persecutióne Décii, cum prohíberet quosdam voléntes illúdere cadavéribus Mártyrum, clamor repénte totíus vulgi advérsus eum extóllitur; oblátus autem Júdici, et in Christi confessióne persístens, cápite pro pietáte damnátus est.

    Antiochíæ sanctórum Mártyrum Polycárpi et Theodóri.

    Tubúrbi, in Africa, sancti Servi Mártyris, qui, in persecutióne Wandálica, sub Ariáno Rege Hunneríco, fústibus diutíssime cæsus, tróchleis frequénter in sublíme elevátus atque ictu céleri super sílices póndere córporis dimíssus, et lapídibus acutíssimis perfricátus, martýrii palmam adéptus est.

    Theáni, in Campánia, sancti Urbáni, Epíscopi et Confessóris.

    Apud Sántonas, in Gállia, sancti Martíni Abbátis, ad cujus túmulum crebérrima divínitus fiunt mirácula.

    Eboriáci, in território Meldénsi, commemorátio sanctæ Faræ, étiam Burgundofáræ nómine appellátæ, Abbatíssæ et Vírginis, cujus dies natális tértio Nonas Aprílis recensétur.
  en: |
    At Rome, blessed Pope Eutychian, who in divers places buried with his own hand three hundred and forty-two martyrs; with whom he himself was afterward associated, being crowned with martyrdom under the Emperor Numerian, and was buried in the cemetery of Callistus.

    At Alexandria, the blessed soldier Agatho. During the persecution under the Emperor Decius, there were some that would make mock of the bodies of the martyrs, and Agatho forbade them, whereupon straightway a cry of the whole mob was got up against him, he was brought before the judge, and as he stood firm in the confession of Christ he was beheaded.

    At Antioch, the holy martyrs Polycarp and Theodore.

    At Tebourba, in Africa, the holy martyr Servus, who in the Vandal persecution under the Arian king Hunneric, was long cudgelled, repeatedly jerked up with pulleys and dropped upon flints, and scraped with sharp stones, and by this torment gained the palm of martyrdom.

    At Chieti, in the kingdom of Naples, the holy Confessor Urban, Bishop of (that see.)

    At Saintes, in Gaul, the holy Abbot Martin, at whose grave by the power of God famous miracles are oftentimes wrought. (He was the founder and first Abbot of the Monastery of Sanjon.)

    At Meaux, the holy Virgin Fara (de Champigny, Abbess of Faremoutier, in the diocese of Meaux.)
