# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-25"
text:
  la: |
    Apud Cartháginem sancti Ludovíci Noni, Regis Francórum et Confessóris, vitæ sanctitáte ac miraculórum glória præclári, cujus ossa póstmodum Lutétiam Parisiórum sunt reláta.

    Romæ natális sancti Joséphi Calasánctii, Presbýteri et Confessóris, vitæ innocéntia et miráculis illústris; qui, ad erudiéndam pietáte ac lítteris juventútem, Ordinem Clericórum Regulárium Páuperum Matris Dei Scholárum Piárum fundávit. Eum Pius Duodécimus, Póntifex Máximus, ómnium Scholárum populárium christianárum ubíque exsisténtium cæléstem apud Deum Patrónum constítuit. Ipsíus tamen festívitas sexto Kaléndas Septémbris recólitur.

    Item Romæ sanctórum Mártyrum Eusébii, Pontiáni, Vincéntii et Peregríni; qui, sub Cómmodo Imperatóre, primum in equúleo leváti, nervis quoque disténti, ac deínde fústibus cæsi sunt, flammis circa eórum látera appósitis; et, cum in laude Christi fidelíssime permanérent, plumbátis usque ad emissiónem spíritus sunt mactáti.

    Romæ prætérea natális beáti Nemésii Diáconi, et fíliæ Lucíllæ Vírginis; qui, cum de fide Christi flecti nequáquam possent, decolláti sunt, jubénte Valeriáno Imperatóre. Ipsórum córpora, a beáto Stéphano Papa sepúlta, deínde a beáto Xysto Secúndo via Appia, prídie Kaléndas Novémbris, honéstius tumuláta, Gregórius Quintus in Diaconíam sanctæ Maríæ Novæ tránstulit, una cum sanctis Symphrónio, Olýmpio Tribúno, hujúsque uxóre Exsupéria et Theodúlo fílio; qui omnes, Symphrónii ópera convérsi et ab eódem sancto Stéphano baptizáti, martýrio coronáti fúerant. Eadem Sanctórum córpora, Gregório Décimo tértio Summo Pontífice, ibídem invénta, sub altári ejúsdem Ecclésiæ honorificéntius collocáta sunt sexto Idus Decémbris.

    Item Romæ sancti Genésii Mártyris, qui, primum sub Gentilitáte mimus, cum in theátro, spectánte Diocletiáno Imperatóre, Mystériis Christianórum illudéret, repénte, inspirátus a Deo, convérsus est ad fidem et baptizátus. Mox, Imperatóris jussu, fústibus crudelíssime cæsus, deínde suspénsus in equúleo, et ungulárum diutíssima laceratióne vexátus, lampádibus étiam adústus est; ac tandem, cum in fide Christi persísteret, dicens: « Non est Rex præter Christum, pro quo si míllies occídar, ipsum mihi de ore, ipsum mihi de corde auférre non potéritis », martýrii palmam obtruncatióne cápitis proméruit.

    Areláte, in Gállia, beáti item Genésii, qui, cum ímpia edícta, quibus Christiáni puniri jubebántur, exceptóris offício fungens, nollet excípere, et, projéctis in públicum tábulis, se Christiánum esse testarétur, comprehénsus et decollátus est, atque ita martýrii glóriam, próprio cruóre baptizátus, accépit.

    In Sýria sancti Juliáni Mártyris.

    Tarracóne, in Hispánia, sancti Magíni Mártyris.

    Itálicæ, in Hispánia, sancti Gerúntii Epíscopi, qui, Apostolórum témpore, Evangélium in ea província prædicávit, et, post multos labóres, in cárcere quiévit.

    Constantinópoli sancti Mennæ Epíscopi.

    Trajécti sancti Gregórii Epíscopi.

    Apud Montem Falíscum, in Etrúria, sancti Thomæ Confessóris, qui Herfordiénsis Ecclésiæ, in Anglia, Epíscopus éxstitit.

    Neápoli, in Campánia, sanctæ Patríciæ Vírginis.
  en: |
    At Paris, the holy Confessor Louis, King of France, famous for the holiness of his life and for the glory of his miracles.

    At Rome, the birthday of holy Joseph Calasanctius, Priest and Confessor, renowned for innocency of life and miracles; who, to instruct youth in godliness and letters, founded the Order of the Poor Clerks Regular of the Mother of God of the Pious Schools. Pope Pius XII appointed him heavenly Patron with God of all popular Christian schools everywhere. His feast, however, is kept upon the 27th day of August.

    At Rome, the holy martyrs Eusebius, Pontian, Vincent, and Peregrin. Under the Emperor Commodus they were first racked, then stretched with thongs, and afterwards cudgelled, their sides were burnt, and as they remained faithful in the praise of Christ they were hided to death with scourges loaded with lead.

    At Rome, moreover, the birthday of blessed Nemesius, Deacon, and of Lucilla, his daughter, Virgin; who, when they could in no wise be turned from the faith of Christ, were beheaded by command of the Emperor Valerian. Their bodies, buried by blessed Pope Stephen, and afterward more honourably laid by blessed Sixtus II upon the Appian Way, upon the 31st day of October, Gregory V translated to the Deaconry of St. Mary the New, together with the holy Symphronius, Olympius the Tribune and Exuperia his wife, and Theodulus their son; who all, converted by the work of Symphronius and baptized by the same holy Stephen, had been crowned with martyrdom. The same bodies of the Saints, being found there in the time of Pope Gregory XIII, were more honourably laid under the altar of the same Church upon the 8th day of December.

    Likewise at Rome, the holy martyr Genesius while he was a Gentile he was a player. One while in the theatre, in the presence of the Emperor Diocletian, he was making a mock at the mysteries of the Christians, when the spirit of God came upon him, and he was suddenly turned to the faith, and baptized. The Emperor caused him to be very cruelly beaten with cudgels, then racked, and tormented for a long time by being torn with hooks, and burned with lamps. He stood firm in Christ's faith, saying: there is no King but Christ, and if I should be slain for Him a thousand times, ye cannot take Him either out of my mouth or out of my heart. In the end he was beheaded, and so gained the palm of martyrdom.

    At Old Seville, in Spain, holy Gerontius, Bishop, who preached the Gospel in that province in the time of the Apostles, and after many toils fell asleep in prison.

    At Arles, in Gaul, blessed Genesius. He was a registrar who refused to register the wicked edicts which commanded the punishment of Christians, but publicly cast away his tables and professed himself a Christian; for this cause he was taken and beheaded, and being so baptized in his own blood, gained the glory of martyrdom.

    In Syria, the holy martyr Julian.

    At Taragona, the holy martyr Maginus.

    At Constantinople, holy Mennas, [Arch-]Bishop.

    At Utrecht, holy Gregory, Bishop.

    At Montefiascone, in Tuscany, holy Thomas, Confessor, who was Bishop of the church of Hereford, in England.

    At Naples, the holy Virgin Patricia, [daughter of the Emperor Constans I.]
