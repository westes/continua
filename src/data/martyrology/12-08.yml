# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-08"
text:
  la: |
    Tréviris sancti Euchárii, qui fuit discípulus beáti Petri Apóstoli et primus ejúsdem civitátis Epíscopus.

    Alexandríæ sancti Macárii Mártyris, qui, témpore Décii, cum a Júdice multis verbis ad negándum Christum suaderétur, et eo majóri constántia suam profiterétur fidem, vivus ad últimum exúri jubétur.

    In Cypro sancti Sophrónii Epíscopi, qui pupillórum, orphanórum ac viduárum defénsor miríficus, et páuperum atque oppressórum ómnium adjútor fuit.

    In monastério Luxoviénsi, in Gállia, sancti Romárici Abbátis, qui, cum in aula Theodobérti Regis primus esset, renuntiávit sǽculo, et monásticæ étiam observántiæ laude céteris antecélluit. Mónachus fuit Luxoviénsis. Abbatíam Romaricénsem condídit, cujus secúndus Abbas factus est.

    Constantinópoli sancti Patápii Solitárii, virtútibus et miráculis clari.

    Romæ Invéntio sanctórum Mártyrum Nemésii Diáconi, ejúsque fíliæ Lucíllæ Vírginis, Symphrónii, Olýmpii Tribúni, hujúsque uxóris Exsupériæ et Theodúli fílii; quorum memória octávo Kaléndas Septémbris recensétur.

    Verónæ Ordinátio sancti Zenónis Epíscopi.
  en: |
    At Trier, holy Eucharius, a disciple of the blessed Apostle Peter, and the first Bishop of that city.

    At Alexandria, the holy martyr Macarius. Under the Emperor Decius the judge dealt with him in many words to persuade him to deny Christ, but as he only professed his faith the more constantly he was burnt alive.

    In Cyprus, the holy Bishop Sophronius, who was a wonderful protector of little children, orphans, and widows, and an helper of all the poor and depressed.

    In the monastery of Lisieux, the holy Abbot Romaric, who was the first man in the court of King Theodobert, but gave up the world, and became the first in monastic observance. He was a monk of Luxeuil. He founded the Abbey of Remiremont, of which he became second Abbot.

    At Constantinople, the holy Hermit Patapius, famous for his graces and miracles.

    At Rome, the Finding of the holy martyrs Nemesius, Deacon, and Lucilla his daughter, Virgin, Symphronius, Olympius the Tribune, and Exuperia his wife, and Theodulus their son; whose memory is recorded upon the 25th day of August.

    At Verona, is commemorated the ordination of holy Zeno, Bishop.
