# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "06-27"
text:
  la: |
    In Galátia sancti Crescéntis, qui fuit beáti Pauli Apóstoli discípulus. Hic, in Gállias tránsitum fáciens, verbo prædicatiónis multos ad fidem Christi convértit; regréssus vero ad gentem cui speciáliter datus erat Epíscopus, demum, sub Trajáno, cum Gálatas ipsos usque ad finem vitæ suæ in ópere Dómini confirmásset, martýrium consummávit.

    Córdubæ, in Hispánia, sanctórum Mártyrum Zóili, et aliórum decem et novem.

    Cæsaréæ, in Palæstína, sancti Anécti Mártyris, qui, in persecutióne Diocletiáni, sub Urbáno Prǽside, cum álios ad martýrium hortátus esset et idóla oratióne sua prostrásset, a decem milítibus verberári jussus est; ac tandem, mánibus pedibúsque præcísis, truncátus cápite, martýrii corónam accépit.

    Constantinópoli sancti Sampsónis Presbýteri, páuperum exceptóris.

    In castro Cainóne, in Gállia, sancti Joánnis, Presbýteri et Confessóris.

    Varadíni, in Hungária, sancti Ladislái Regis, qui claríssimis miráculis usque ad diem hodiérnum corúscat.
  en: |
    In Galatia, holy Crescens, the disciple of the blessed Apostle Paul. He made a journey into Gaul, where by the word of his preaching he brought many to believe in Christ. Then he returned home, where he was specially appointed Bishop till the end of his life. He strengthened the Galatians in the work of the Lord, and at last finished his testimony under Trajan.

    At Cordova, the holy martyrs Zoilus and nineteen others.

    At Caesarea, in Palestine, the holy martyr Anectus. In the persecution under Diocletian he exhorted others to martyrdom, and by his prayers caused the idols to fall down wherefore the President Urban caused him to be beaten by ten soldiers, and his hands and feet, and lastly his head, cut off, and so he received the crown of martyrdom.

    At Constantinople, the holy Priest Samson, the harbourer of the poor.

    In the country of Tours, the holy Priest and Confessor John.

    At Varadin, in Hungary, holy King Ladislaw, who is famous for eminent miracles even unto the present day.
