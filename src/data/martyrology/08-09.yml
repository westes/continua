# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-09"
text:
  la: |
    Sancti Joánnis Baptístæ-Maríæ Vianney, Presbýteri et Confessóris, cæléstis ómnium parochórum Patróni; cujus dies natális prídie Nonas mensis hujus recensétur.

    Romæ sancti Románi, mílitis et Mártyris; qui, confessióne beáti Lauréntii compúnctus, pétiit ab eo baptizári, et, mox exhíbitus ac fústibus cæsus, ad últimum decollátus est.

    In Túscia natális sanctórum Mártyrum Secundiáni, Marcelliáni et Veriáni; qui, témpore Décii, a Promóto Consulári primum cæsi sunt, deínde in equúleo suspénsi, et abrási úngulis, atque igne latéribus appósito assáti, ac tandem triumphálem martýrii palmam, cápite cæsi, meruérunt.

    Verónæ sanctórum Mártyrum Firmi et Rústici, qui, témpore Maximiáni Imperatóris, sub Anolíno Júdice, cum sacrificáre idólis renúerent et constánter in Christi fide persísterent, ambo jussi sunt, post ália superáta supplícia, fústibus cædi et cápite amputári.

    In Africa commemorátio plurimórum sanctórum Mártyrum, qui, in persecutióne Valeriáni, hortánte eos ad constántiam sancto Numídico, in ignem conjécti, martýrii palmam adépti sunt. Ipse autem Numídicus, licet cum áliis in rogum injéctus et lapídibus óbrutus fuísset, a fília tamen, effóssus et semivívus repértus, curátus est; ac póstea, ob ejus virtútem, in Ecclésiæ Carthaginénsis Presbýterum a beáto Cypriáno méruit cooptári.

    Constantinópoli sanctórum Mártyrum Juliáni, Marciáni et aliórum octo; qui, ob Salvatóris imáginem, quam in porta ǽnea constitúerant, omnes, ímpii Leónis Imperatóris jussu, post multa torménta, gládio necáti sunt.

    Cataláuni, in Gállia, sancti Domitiáni, tértii Epíscopi et Confessóris.
  en: |
    Holy John Baptist Mary Vianney, Priest and Confessor, heavenly Patron of all parish priests, whose birthday is recorded upon the 4th day of this month.

    At Rome, the holy soldier Romanus, who was so wrought upon by the confession of the blessed Lawrence that he sought baptism at his hands, and was presently arraigned, beaten with clubs, and then beheaded.

    In Tuscany, the holy martyrs Secundian, Marcellian, and Verian. In the time of the Emperor Decius the Consular Promotus caused them first to be hided, then hung upon the rack, scarified with hooks, and burnt in the sides, thereafter they were beheaded, and so gained the palm of victory through martyrdom.

    At Verona, the holy martyrs Firmus and Rusticus, in the time of the Emperor Maximian.

    In Africa, many holy martyrs, who at the exhortation of holy Numidicus gained the palm of martyrdom in the persecution under the Emperor Valerian by being cast into the fire. Numidicus himself was thrown upon the burning fire along with the others, and then covered with stones but when his daughter dug him out there was still some life left in him, he was healed, and afterwards by his worthy life obtained from blessed Cyprian admission as a Priest to the Church at Carthage.

    At Constantinople, the holy martyrs Julian, Marcian, and eight others, who were long tortured, and then slain with the sword by command of the wicked Emperor Leo, on account of the image of the Saviour which they had set up in the Brazen Gate.

    At Châlons-sur-Marne, in Gaul, the holy Confessor Domitian, third Bishop.
