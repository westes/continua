# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-06"
text:
  la: |
    In monte Thabor Transfigurátio Dómini nostri Jesu Christi.

    Romæ, via Appia, in cœmetério Callísti, natális beáti Xysti Secúndi, Papæ et Mártyris, qui, in persecutióne Valeriáni, gládio animadvérsus, martýrii corónam accépit.

    Item Romæ sanctórum Mártyrum Felicíssimi et Agapíti, ipsíus beáti Xysti Diaconórum; Januárii, Magni, Vincéntii et Stéphani, Subdiaconórum. Hi omnes, una cum eódem Pontífice páriter decolláti sunt, atque in Prætextáti cœmetério sepúlti. Passus est étiam cum eis beátus Quartus, ut scribit sanctus Cypriánus.

    Bonóniæ natális sancti Domínici Confessóris, qui Ordinis Fratrum Prædicatórum Fundátor éxstitit. Hic vir, sanctitáte et doctrína claríssimus, virginitátem perpétuo illibátam custodívit, et, ob singulárem meritórum grátiam, tres mórtuos suscitávit; cumque prædicatióne sua compressísset hǽreses, ac plúrimos ad religiósam et piam vitam instituísset, in pace quiévit. Ejus autem festívitas prídie Nonas mensis hujus celebrátur, ex constitutióne Pauli Papæ Quarti.

    In monastério sancti Petri de Cardégna, Ordinis sancti Benedícti, apud Burgos, in Hispánia, pássio ducentórum Monachórum cum Stéphano Abbáte, qui a Saracénis pro Jesu Christi fide interfécti sunt, atque ibídem in claustro a Christiánis sepúlti.

    Complúti, in Hispánia, sanctórum Mártyrum Justi et Pastóris fratrum, qui, cum adhuc púeri lítteris imbueréntur, sponte ad martýrium, projéctis in schola tábulis, cucurrérunt; et mox, a Daciáno Prǽside tenéri jussi et fústibus cædi, ambo, cum se mútuis exhortatiónibus constantíssime corroborárent, extra civitátem perdúcti sunt, et ibi a carnífice juguláti.

    Romæ sancti Hormísdæ, Papæ et Confessóris.

    Amidæ, in Mesopotámia, sancti Jacóbi Eremítæ, miráculis clari.
  en: |
    _

    At Rome, upon the Appian Way, in the cemetery of Callistus, the birthday of blessed Sixtus II, Pope and martyr, who, in the persecution under Valerian, was put to the sword and received the crown of martyrdom.

    At Rome, in the cemetery of Callistus, upon the Appian Way, the blessed Pope and martyr Sixtus II, who received the crown of martyrdom by the sword in the persecution under Valerian. Likewise the holy martyrs Felicissimus and Agapitus, deacons of the aforesaid blessed Xystus, and his subdeacons Januarius, Magnus, Vincent, and Stephen, who were all beheaded along with him, and were buried in the cemetery of Pretextatus. Along with them suffered also the blessed Quartus, as is written by holy Cyprian.

    At Bologna, the birthday of St. Dominic, confessor and founder of the Order of Friars Preachers. He was a man of great renown for holiness and learning. Until death he preserved without stain his virginity, and by the singular grace of his merits raised three dead men to life. By his preaching he curbed heresies, and established many persons in a religious and godly manner of life. He died on this day, but his festival, by an ordinance of Pope Paul IV, is celebrated on August 4.

    At Burgos, in Spain, in the Monastery of St. Peter de Cardena, of the Order of St. Benedict, the Abbot Stephen and two hundred monks, who were massacred by the Saracens for their faith in Jesus Christ, and by the Christians then buried inside their cloister.

    At Alcala, in Spain, the holy brethren Justus and Pastor, both martyrs. They were boys learning at school when they threw away their slates, and ran of their own wish to be martyred. The President Dacian ordered them to be taken and cudgelled, and when they continued to call on each other to stand firm he had them led outside the city, where the executioner cut their throats.

    At Rome, the holy Confessor Pope Hormisdas.

    At Diarbekr, the holy hermit James, famous for miracles.
