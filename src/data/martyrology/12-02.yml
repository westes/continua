# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-02"
text:
  la: |
    Romæ pássio sanctæ Bibiánæ, Vírginis et Mártyris, quæ, sub Juliáno Imperatóre sacrílego, ob Christum támdiu plumbátis cæsa est, donec rédderet spíritum.

    Apud Forum Cornélii, in Æmília, natális sancti Petri, Epíscopi Ravennátis, Confessóris et Ecclésiæ Doctóris, cognoménto Chrysólogi, seu Aurei verbi, doctrína et sanctitáte célebris. Ipsíus tamen festum prídie Nonas hujus mensis recólitur.

    In Sanciáno, Sinárum ínsula, item natális sancti Francísci Xavérii, Sacerdótis e Societáte Jesu et Confessóris, Indiárum Apóstoli, géntium conversióne, donis et miráculis clari; qui plenus méritis et labóribus obdormívit in Dómino. Ipsum beátum virum Pius Décimus, Póntifex Máximus, cæléstem sodalitáti et óperi Propagándæ Fídei Protectórem elégit atque constítuit; Pius vero Papa Undécimus peculiárem ómnibus Missiónibus Patrónum dedit et confirmávit. Ejus autem festívitas, jussu Alexándri Papæ Séptimi, sequénti die celebrátur.

    Romæ sanctórum Mártyrum Eusébii Presbýteri, Marcélli Diáconi, Hippólyti, Máximi, Adriæ, Paulínæ, Neónis, Maríæ, Martánæ et Auréliæ; qui omnes in persecutióne Valeriáni, sub Secundiáno Júdice, martýrium complevérunt.

    Item Romæ sancti Pontiáni Mártyris, cum áliis quátuor.

    In Africa natális sanctórum Mártyrum Sevéri, Secúri, Januárii et Victoríni; qui ibídem martýrio coronáti sunt.

    Aquiléjæ sancti Chromátii, Epíscopi et Confessóris.

    Verónæ sancti Lupi, Epíscopi et Confessóris.

    Edéssæ, in Sýria, sancti Nonni, primi ejúsdem sedis Epíscopi et póstea Heliopolis in Sýria, cujus précibus Pelágia pǽnitens ad Christum convérsa est.

    Tróade, in Phrýgia, sancti Silváni Epíscopi, miráculis clari.

    Bríxiæ sancti Evásii Epíscopi.
  en: |
    At Rome, the holy Virgin and martyr Bibiana, who under, the profane Emperor Julian was for Christ's sake flogged to death with scourges loaded with lead.

    There likewise, the holy martyrs the Priest Eusebius, the Deacon Marcellus, Hippolytus, Maximus, Adria, Paulina, Neo, Mary, Martana, and Aurelia, who suffered martyrdom under the judge Secundian, in the persecution under the Emperor Valerian.

    Likewise at Rome, the holy martyr Pontian and four others.

    In Africa, the holy martyrs Severus, Securus, Januarius, and Victorinus, who were there crowned with martyrdom. At Aquileia, the holy Confessor Chromatius, Bishop.

    At Imola, holy Peter, Bishop of Ravenna, styled Chrysologus, or him of the golden words, famous for his teaching and holiness, whose feast we keep upon the 4th day of this present month.

    In Sancian, an island of the Chinese, likewise the birthday of holy Francis Xavier, Priest of the Society of Jesus and Confessor, Apostle of the Indies, renowned for the conversion of nations, for gifts and miracles; who, full of merits and labours, fell asleep in the Lord. Pope Pius X chose and appointed this blessed man heavenly Protector of the Society and Work of the Propagation of the Faith; and Pope Pius XI gave and confirmed him as special Patron of all the Missions. His feast, by order of Pope Alexander VII, is kept upon the next day.

    At Verona, the holy Confessor Lupus, Bishop.

    At Edessa, holy Nonnus, Bishop, first of that see, and afterwards of Heliopolis in Syria, through whose prayers Pelagia the penitent was converted to Christ.

    At Troas, in Phrygia, holy Bishop Silvanus, famous for miracles.

    At Brescia, holy Bishop Evasius.
status:
  la: verified
  en: verified
