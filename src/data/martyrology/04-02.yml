# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-02"
text:
  la: |
    Turónis, in Gállia, sancti Francísci de Paula Confessóris, qui Ordinis Minimórum Institútor éxstitit; atque, virtútibus et miráculis clarus, a Leóne Papa Décimo in Sanctórum númerum est adscríptus.

    Cæsaréæ, in Palæstína, natális sancti Apphiáni Mártyris, qui, ante sanctum Ædésium Mártyrem, fratrem suum, in persecutióne Galérii Maximiáni, cum Prǽsidem Urbánum idólis immolántem arguísset, sæve dilaniátus est, et, pédibus lino in oleum intíncto eóque incénso obvolútis, acerbíssime cruciátus, ac demum in mare demérsus; atque ita, tránsiens per ignem et aquam, edúctus est in refrigérium.

    Ibídem pássio sanctæ Theodósiæ, Vírginis Týriæ, quæ, in eádem persecutióne, cum sanctos Confessóres ante tribúnal stantes públice salutásset, atque rogásset eos, ut, cum ad Dóminum perveníssent, sui recordaréntur, a milítibus tenta et ad Urbánum Prǽsidem ducta est; eoque jubénte, latéribus et mammis ad interióra usque dilaniátis, in mare tandem projícitur.

    Apud Língonas, in Gállia, sancti Urbáni Epíscopi.

    Apud Comum sancti Abúndii, Epíscopi et Confessóris.

    Cápuæ sancti Victóris Epíscopi, eruditióne et sanctitáte conspícui.

    Lugdúni, in Gállia, sancti Nicétii, ejúsdem urbis Epíscopi, vita et miráculis clari.

    In Palæstína deposítio sanctæ Maríæ Ægyptíacæ, quæ Peccátrix appellátur.
  en: |
    The holy Confessor Francis of Paola, founder of the Order of Friars Minim. He was famous for his graces and miracles, and Leo X enrolled his name among those of the Saints.

    At Caesarea, in Palestine, the holy martyr Amphian. During the persecution under the Emperor Galerius Maximian he rebuked the President Urban as he was sacrificing unto idols, and for this cause he was savagely mangled, and most cruelly tormented. His feet being wrapped in flax steeped in oil, and set on fire, and at length he was drowned in the sea, and thus did he go through fire and through water, and was brought out into a place of refreshment.

    There also suffered the holy martyr Theodosia, a Virgin of Tyre, during the same persecution. When she saw the holy Confessors standing before the judgment seat, she publicly saluted them, and besought them that when they should be come unto the Lord they would remember her. For this cause the soldiers took her, and led her before Urban the President, and by his command her sides and her breasts were deeply mangled, and she was cast into the sea.

    At Langres, holy Urban, Bishop of that see.

    At Como, the holy Confessor Abundius, Bishop of that see.

    At Capua, holy Victor, Bishop, notable for learning and holiness.

    At Lyon, holy Nicetius, Bishop of that city, famous for his life and miracles.

    In Palestine, holy Mary of Egypt, commonly called the sinner.
status:
  la: verified
  en: verified
