# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "07-13"
text:
  la: |
    Romæ sancti Anacléti, Papæ et Mártyris, qui, post sanctum Cleméntem Ecclésiam Dei regens, eam glorióso martýrio decorávit.

    Bambérgæ natális sancti Henríci Primi, Imperatóris Romanórum et Confessóris, qui cum sancta Cunegúnde, uxóre sua, perpétuam virginitátem servávit, et sanctum Stéphanum, Hungarórum Regem, cum univérso fere ipsíus regno, ad fidem Christi suscipiéndam perdúxit. Ejus autem festívitas Idibus mensis hujus celebrátur.

    In Palæstína sanctórum Joélis et Esdræ Prophetárum.

    In Macedónia beáti Silæ, qui, cum esset unus de primis frátribus et ab Apóstolis ad Ecclésias Géntium, una cum Paulo et Bárnaba, destinátus, prædicatiónis offícium, grátia Dei plenus, instánter consummávit, atque, in passiónibus suis Christum claríficans, póstmodum requiévit.

    Item sancti Serapiónis Mártyris, qui, sub Sevéro Imperatóre et Aquila Prǽside, per ignem pervénit ad corónam martýrii.

    In ínsula Chio sanctæ Myrópis Mártyris, quæ sub Décio Imperatóre et Numeriáno Prǽside, véctibus contúsa, migrávit ad Dóminum.

    In Africa sanctórum Confessórum Eugénii, Carthaginénsis Epíscopi, fide ac virtútibus gloriósi, et univérsi cleri ejúsdem Ecclésiæ, qui fere quingénti, vel eo ámplius, in persecutióne Wandálica, sub Ariáno Rege Hunneríco, cæde inediáque maceráti (inter quos plúrimi erant Lectóres infántuli), gaudéntes in Dómino, exsílio crudéli procul extrúsi sunt. Erant étiam nobilíssimi in eis Archidiáconus, nómine Salutáris, et Murítta, secúndus in offício ministrórum; qui, tértio Confessóres effécti, ambo glorióse in Christo, perseverántiæ título, illustráti sunt.

    In Británnia minóre sancti Turiávi, antíquæ sedis Dolénsis Epíscopi et Confessóris, miræ simplicitátis et innocéntiæ viri.
  en: |
    At Rome, the holy martyr Pope Anaclete, who governed the Church of God after holy Clement, and adorned the same with a glorious testimony.

    At Bamberg, the birthday of holy Henry I, Emperor of the Romans and Confessor, who, with holy Cunegunda his wife, kept perpetual virginity, and led holy Stephen, King of the Hungarians, together with well-nigh his whole kingdom, to receive the faith of Christ. His feast is kept upon the 15th day of this month.

    On the same day, the holy Prophets Joel and Ezra.

    In Macedonia, blessed Silas, who was one of the first of the Brethren, and was sent by the Apostles to the churches of the Gentiles along with Paul and Barnabas. He was full of the grace of God, earnestly discharged his duty of preaching, and when he had glorified Christ in his sufferings, afterwards fell asleep.

    Also the holy martyr Serapion, who under the Emperor Severus and the President Aquila attained through fire unto the crown of martyrdom.

    In the island of Chios, the holy martyr Myropis, who under the Emperor Decius and the President Numerian was broken with bars, and so passed away to be with the Lord.

    In Africa, the holy Confessors Eugenius, Bishop of Carthage, glorious for faith and good works, and all the Clergy of that church, to the number of five hundred or more, in the persecution of the Vandals, under the Arian King Hunneric, suffered stripes and hunger among whom were very many Readers that were little children and were driven into cruel exile but rejoicing in the Lord. Among the noblest of them were the Archdeacon named Salutaris, and Murrita the second in the ministry, who became Confessors for the third time, and are illustrious for their glorious steadfastness unto Christ.

    In Brittany, the holy Confessor Turiaf, Bishop of the ancient see of Dol, a man of marvellous simplicity and innocency.
status:
  la: verified
  en: verified
