# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-10"
text:
  la: |
    Sancti Francísci Bórgiæ, Sacerdótis e Societáte Jesu et Confessóris, cujus dies natális prídie Kaléndas Octóbris recensétur.

    Apud Septam, in Mauritánia Tingitána, pássio sanctórum septem Mártyrum, ex Ordine Minórum, scílicet Daniélis, Samuélis, Angeli, Leónis, Nicolái, Hugolíni et Domni; qui, cum essent omnes præter Domnum Sacerdótes, ibídem, ob Evangélii prædicatiónem et Mahuméticæ confutatiónem sectæ, a Saracénis contumélias, víncula et flagélla perpéssi, demum, capítibus abscíssis, martýrii palmam adépti sunt.

    Colóniæ Agrippínæ sancti Gereónis Mártyris, cum áliis trecéntis decem et octo; qui pro vera pietáte, in persecutióne Maximiáni, gládiis patiéntes colla subdidérunt.

    In território ejúsdem urbis sanctórum Victóris et Sociórum Mártyrum.

    Bonnæ, in Germánia, sanctórum Mártyrum Cássii et Floréntii, cum áliis plúrimis.

    Nicomedíæ sanctórum Mártyrum Eulámpii, et soróris Eulámpiæ Vírginis. Hæc porro, cum audísset pro Christo fratrem torquéri, in médiam turbam exsíluit, et, fratrem amplexáta, huic sóciam se adjúnxit; atque ambo, conjécti in ollam fervéntis ólei, sed nulla ex parte læsi, tandem, una cum áliis ducéntis, qui eo miráculo permóti credíderant in Christum, cápitis obtruncatióne martýrium complevérunt.

    In Creta ínsula beáti Pinýti, inter Epíscopos nobilíssimi. Hic, Gnósiæ urbis Epíscopus, sub Marco Antoníno Vero et Lúcio Aurélio Cómmodo flóruit, et in scriptis suis, velut in quodam spéculo, vivéntem sui relíquit imáginem.

    Eboráci, in Anglia, sancti Paulíni Epíscopi, qui fuit beáti Gregórii Papæ discípulus; et, una cum áliis, ad prædicándum Evangélium illuc ab eo missus, Edwínum Regem ejúsque pópulum ad Christi fidem convértit.

    Populónii, in Túscia, sancti Cerbónii, Epíscopi et Confessóris, qui (ut sanctus Gregórius Papa refert) in vita et morte miráculis cláruit.

    Verónæ sancti Cerbónii Epíscopi.

    Cápuæ sancti Paulíni Epíscopi.
  en: |
    _

    At Ceuta, in Morocco, seven holy martyrs belonging to the Order of Friars Minor namely, Daniel, Samuel, Angelo, Domnus, Leo, Nicolas, and Hugolin for their preaching of the Gospel and their confutation of the Mohammedan religion, the Saracens inflicted upon them insults, chains, and stripes, and then beheaded them and so they gained the palm of martyrdom.

    At York, in England, holy Paulinus, Archbishop of that see. A disciple of the blessed Pope Gregory. Gregory sent him into England along with others to preach the Gospel, and he brought King Edwin and all his people to believe in Christ.

    In the island of Crete, blessed Pinytus, noble among Bishops. He flourished as Bishop of Gnossus, under the Emperors Marcus Antoninus Verus and Lucius Aurelius Commodus, and hath left us in his writings a living image of himself as in a looking-glass.

    At Cologne, the holy martyr Gereon, with three hundred and eighteen others, who patiently suffered beheading for true godliness' sake in the persecution under the Emperor Maximian.

    In the same country, the holy martyrs Victor and his Companions.

    At Bonn, in Germany, the holy martyrs Cassius and Florence, and many others.

    At Nicomedia, the holy martyrs Eulampius, and the Virgin Eulampia his sister. When Eulampia heard her brother being tortured for Christ's sake she sprang into the midst of the crowd, and embraced him, and joined herself to him. Then they both were put together into a vessel of boiling oil, but were nowise hurt thereby, by the which wonder two hundred others were brought to believe in Christ, and these two hundred, along with the brother and sister, were all beheaded together, and so finished their testimony.

    At Piombino, in Tuscany, the holy Confessor Cerbonius, Bishop, who was famous for miracles, both in life and in death, as witness holy Gregory.

    At Verona also, holy Cerbonius, Bishop of Verona.

    At Capua, holy Paulinus, Bishop.
status:
  la: verified
  en: verified
