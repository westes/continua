# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "11-08"
text:
  la: |
    Romæ, via Lavicána, tértio ab Urbe milliário, pássio sanctórum Mártyrum Cláudii, Nicostráti, Symphoriáni, Castórii et Simplícii, qui, primo in cárcerem missi, deínde scorpiónibus gravíssime cæsi, tandem, cum ex fide Christi dimovéri non possent, a Diocletiáno jussi sunt in flúvium præcípites dari.

    Ibídem, via Lavicána, natális sanctórum Quátuor Coronatórum fratrum, id est Sevéri, Severiáni, Carpóphori et Victoríni; qui, sub eódem Imperatóre, íctibus plumbatárum usque ad mortem cæsi sunt. Horum autem nómina, quæ póstea, interjéctis annis, Dómino revelánte, osténsa sunt, cum mínime reperíri tunc potuíssent, statútum fuit ut anniversária dies ipsórum, una cum illis quinque, sub nómine sanctórum Quátuor Coronatórum recolerétur; qui mos, étiam postquam reveláta sunt, in Ecclésia perseverávit.

    Item Romæ sancti Deúsdedit Papæ Primi, qui tanti meriti fuit, ut leprósum ósculo a lepra sanáverit.

    In vico Blexen, ad Visúrgim flúvium, in Germánia, sancti Willehádi, qui primus éxstitit Breménsis civitátis Epíscopus; atque, una cum sancto Bonifátio, cujus discípulus fuit, in Frísia et Saxónia Evangélium propagávit.

    Suessíone, in Gálliis, sancti Godefrídi, Ambianénsis Epíscopi, magnæ sanctitátis viri.

    Apud Virodúnum, in Gállia, sancti Mauri, Epíscopi et Confessóris.

    Turónis, in Gállia, sancti Clari Presbýteri, cujus sanctus Paulínus epitáphium scripsit.
  en: |
    At Rome, upon the Lavican Way, upon the third milestone from the city, the holy martyrs Claudius, Nicostratus, Symphorian, Castorius, and Simplicius, they were first cast into prison, then heavily lashed with loaded scourges, and as their faith in Christ could not be shaken the Emperor Diocletian commanded that they should be cast into the river.

    Likewise at Rome, upon the Lavican Way, the holy martyrs called the "Crowned" brethren, Severus, Severian, Carpophorus, and Victorinus, who under the aforesaid Emperor Diocletian were flogged to death with scourges loaded with lead. Their names were afterwards revealed by the Lord after diverse years, but as they were unknown at the time it was ordained that on the anniversary of their deaths they should be commemorated, along with the five above mentioned, under the title of the Four that were Crowned, and the said custom hath still gone on in the Church ever since their names have been known.

    At Rome, the holy Pope Deusdedit, whose grace was such that by his kiss he made a leper clean.

    At Bremen, holy Willehad, first Bishop of that see. He spread the Gospel in Friesland and Saxony along with holy Boniface, whose disciple he was.

    At Soissons, in Gaul, holy Godfrey, Bishop of Amiens, a man of great holiness.

    At Verdun, the holy Confessor Maurus, Bishop.

    At Tours, the holy priest Clarus, whose epitaph was written by holy Paulinus.
status:
  la: verified
  en: verified
