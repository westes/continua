# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-26"
text:
  la: |
    Sancti Zephyríni, Papæ et Mártyris, cujus dies natális tertiodécimo Kaléndas Januárii recensétur.

    Cardónæ, in Hispánia, tránsitus sancti Raymúndi Nonnáti, Cardinális et Confessóris, ex Ordine beátæ Maríæ de Mercéde redemptiónis captivórum, vitæ sanctitáte et miráculis clari. Ipsíus tamen festum recólitur prídie Kaléndas Septémbris.

    Romæ sanctórum Mártyrum Irenǽi et Abúndii, qui, in persecutióne Valeriáni, eo quod corpus beátæ Concórdiæ, in cloácam projéctum, leváverant, in eándem cloácam demérsi fuérunt; quorum córpora, a Justíno Presbýtero inde extrácta, in crypta, juxta beátum Lauréntium, sepúlta sunt.

    Apud Albintimélium, Ligúriæ civitátem, sancti Secúndi Mártyris, viri spectábilis et Ducis ex legióne Thebæórum.

    Bérgomi sancti Alexándri Mártyris, qui, et ipse unus ex eádem legióne, cum nomen Dómini Jesu Christi constantíssime faterétur, cápitis abscissióne martýrium complévit.

    Apud Marsos sanctórum Simplícii, et ejus filiórum Constántii et Victoriáni, qui, sub Antoníno Imperatóre, várie primum excruciáti, tum demum, secúris ictu percússi, martýrii corónam adépti sunt.

    Nicomedíæ pássio sancti Hadriáni, e Probo Cǽsare progéniti, qui, Licínio persecutiónem in Christiános commótam éxprobrans, ab eódem jussus est occídi. Ipsíus corpus Domítius, Byzántii Epíscopus, ejus pátruus, in ipsíus civitátis subúrbio cui nomen Argyrópolis, sepelívit.

    In Hispánia sancti Victóris Mártyris, qui pro Christi fide, a Mauris occísus, martýrii coróna donátus est.

    Cápuæ sancti Rufíni, Epíscopi et Confessóris.

    Pistórii, in Túscia, sancti Felícis, Presbýteri et Confessóris.

    Pódii, in diœcési Pictaviénsi, sanctæ Joánnæ-Elísabeth Bichier des Ages, Vírginis, Congregatiónis Filiárum a Cruce una cum sancto Andréa Hubérto Fournet Fundatrícis, jugi mortificatióne et vitæ innocéntia claræ, quam Pius Papa Duodécimus sanctárum Vírginum fastis accénsuit.
  en: |
    At Rome, the holy Pope and martyr Zephyrinus.

    At Cardona, in Spain, the passing of holy Raymond Nonnatus, Cardinal and Confessor, of the Order of blessed Mary of Ransom for the redemption of captives, renowned for holiness of life and miracles. His feast, however, is kept upon the 31st day of August.

    Likewise at Rome, the holy martyrs Irenaeus and Abundius. In the persecution under the Emperor Valerian they took the body of blessed Concordia out of the sewer into which it had been thrown, and for so doing were themselves drowned in the same sewer. Justin the Priest drew their bodies thence, and buried them under the ground near blessed Lawrence.

    At Vintimiglia, the holy martyr Secundus. He was a man of good social position, and a captain in the Theban Legion.

    At Bergamo, the holy martyr Alexander, who was also a soldier of the same legion. As he constantly confessed the name of the Lord Jesus Christ he was beheaded, and so finished his testimony.

    Among the tribe of the Marsi, holy Simplicius and his sons, Constantius and Victorian, who were first put to diverse torments, under the Emperor Antoninus, and then beheaded, and so gained the crown of martyrdom.

    At Nicomedia, holy Hadrian, the son of the Emperor Probus. He blamed the persecution stirred up by Licinius against the Christians, and was therefore by him ordered to be slain his body was buried at Argyropolis by his uncle Domitius, Bishop of Byzantium.

    In Spain, the holy martyr Victor, who was slain by the Moors for Christ's faith's sake, and so received the crown of martyrdom.

    At Capua, the holy Confessor Rufinus, Bishop.

    At Pistoia, the holy Priest and Confessor Felix.

    At Poitiers, holy Joan Elizabeth Bichier des Ages, Virgin, Foundress, together with holy Andrew Hubert Fournet, of the Congregation of the Daughters of the Cross, renowned for continual mortification and innocency of life, whom Pope Pius XII enrolled in the roll of the holy Virgins.
status:
  la: verified
  en: verified
