# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "09-22"
text:
  la: |
    Sancti Thomæ a Villa Nova, ex Eremitárum sancti Augustíni Ordine, Epíscopi Valentíni et Confessóris; cujus dies natális recólitur sexto Idus Septémbris.

    Sedúni, in Gállia, in loco Agáuno, natális sanctórum Mártyrum Thebæórum Maurítii, Exsupérii, Cándidi, Victóris, Innocéntii et Vitális, cum Sóciis ejúsdem legiónis; qui, sub Maximiáno, pro Christo necáti, gloriósa passióne mundum illustrárunt.

    Romæ pássio sanctárum Vírginum et Mártyrum Dignæ et Eméritæ, sub Valeriáno et Galliéno; quarum relíquiæ in Ecclésia sancti Marcélli asservántur.

    Ratisbónæ, in Bavária, sancti Emmerámi, Epíscopi et Mártyris; qui, ut álios liberáret, mortem sævíssimam, Christi causa, patiénter súbiit.

    Apud pagum Castrénsium sancti Jonæ, Presbýteri et Mártyris; qui, cum sancto Dionýsio proféctus in Gálliam, ibídem, Juliáni Præfécti jussu verbéribus cæsus, gládio martýrium consummávit.

    Antinoópoli, in Ægýpto, sanctæ Iráidis, Vírginis Alexandrínæ, et Sociórum Mártyrum. Ipsa Virgo, cum esset ad hauriéndam e próximo fonte aquam egréssa, et navim vidísset Confessóribus Christi onústam, prótinus, relícta hýdria, se illis adjúnxit, ac, simul cum iis in urbem ducta, prima ómnium, post multa supplícia, cápite cæsa est; deínde Presbýteri, Diáconi, et Vírgines, aliíque omnes eódem mortis génere consúmpti sunt.

    Romæ sancti Felícis Papæ Quarti, qui pro fide cathólica plúrimum laborávit.

    Apud civitátem Meldénsem beáti Sanctíni Epíscopi, qui fuit discípulus sancti Dionýsii Areopagítæ; et, ejúsdem civitátis Epíscopus ab eo consecrátus, primus illic Evangélium prædicávit.

    In território Constantiénsi, in Gállia, sancti Lautónis Epíscopi.

    In monte Glonna, ad Lígerim flumen, in Gállia, sancti Floréntii Presbýteri.

    In óppido cui Leprósii nomen, in território Bituricénsi, sancti Silváni Confessóris.

    Laudúni, in Gállia, sanctæ Salabérgæ Abbatíssæ.
  en: |
    Of holy Thomas of Villanova, of the Order of the Hermits of St. Augustine, Bishop of Valencia and Confessor, whose birthday is kept on the 8th day of September.

    At Sion, in Switzerland, the holy martyrs of the Theban Legion Maurice, Exuperius, Candidus, Victor, Innocent, Vitalis, and their Comrades, who were massacred for Christ's sake under the Emperor Maximian, and have enlightened the whole world by the glory of their passion.

    At Rome, under the Emperors Valerian and Gallienus, the holy Virgins Digna and Emerita, both martyrs. Their relics are kept in the Church of St. Marcellus.

    At Regensburg, in Bavaria, the holy martyr Emmeram, the Bishop who, in order that he might deliver others, patiently submitted to a most cruel death for Christ's sake.

    At Chartres, the holy martyr Jonah, a Priest, who came into Gaul along with holy Denis, and was, by command of the Prefect Julian, flogged and beheaded.

    At Antinoopolis, in Egypt, the holy martyrs Irais, a Virgin of Alexandria, and her Companions. She was gone out to draw water from a well near by when she saw a ship full of confessors of Christ, and thereupon she forthwith left her water-pot and joined them, and was brought along with them into the city, where she first of all, after many torments, was beheaded, and then all the rest, of whom some were Priests, Deacons, or Virgins, were put to the same death.

    At Rome, holy Pope Felix IV, who laboured much for the Catholic faith.

    At Meaux, blessed Sanctinus, a disciple of holy Denys the Areopagite, who consecrated him Bishop of that city, where he was the first to preach the Gospel.

    In the country of Coutances, the holy Confessor Lauto, Bishop.

    In Poitou, the holy Priest Florence.

    In the country of Bourges, the holy Confessor Silvan.

    At Laon, the holy widow Salaberga, Abbess.
