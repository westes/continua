# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "07-12"
text:
  la: |
    In monastério Passiniáno, prope Floréntiam, sancti Joánnis Gualbérti Abbátis, qui fuit Institútor Ordinis Vallis Umbrósæ.

    Laudæ, in Insúbria, sanctórum Mártyrum Nabóris et Felícis, qui, in persecutióne Maximiáni, post vária torménta, cápitis decollatióne martýrium complevérunt; eorúmque córpora a beáta Savína Mediolánum advécta sunt, ibíque honorífice sepúlta.

    In Cypro beáti Jásonis, qui fuit unus ex antíquis Christi discípulis.

    Lucæ, in Túscia, beáti Paulíni, qui a sancto Petro Apóstolo primus ejúsdem civitátis Epíscopus est ordinátus; et, sub Neróne, ad radíces montis Pisáni, post multos agónes, martýrium suum cum áliis Sóciis consummávit.

    Aquiléjæ natális sancti Hermágoræ, qui éxstitit discípulus beáti Marci Evangelístæ, et primus ejúsdem civitátis Epíscopus. Hic, inter mirácula sanitátum, et prædicatiónis instántiam, ac populórum conversiónem, plúrima pœnárum génera expértus, tandem, una cum Diácono suo Fortunáto, capitáli supplício perpétuum méruit obtinére triúmphum, sub Neróne.

    Eódem die pássio sanctórum Procli et Hilariónis, qui, sub Trajáno Imperatóre et Máximo Prǽside, per acerbíssima torménta ad palmam martýrii pervenérunt.

    Toléti, in Hispánia, sanctæ Marciánæ, Vírginis et Mártyris; quæ pro fide Christi, objécta béstiis atque a tauro discérpta, martýrio coronátur.

    Apud Leontínos, in Sicília, sanctæ Epíphanæ, quæ sub Diocletiáno Imperatóre et Tertýllo Prǽside, ubéribus præcísis, réddidit spíritum.

    Lugdúni, in Gállia, sancti Viventióli Epíscopi.

    Bonóniæ sancti Paterniáni Epíscopi.
  en: |
    At the monastery of Passignano, near Florence, the holy Abbot John Gualberto, founder of the Order of Vallombrosa.

    At Milan, the holy martyrs Nabor and Felix, who suffered in the persecution under the Emperor Maximian.

    In Cyprus, the blessed Jason, an old disciple of Christ.

    At Aquileia, the holy martyr Hermagoras, a disciple of the blessed Evangelist Mark, and the first Bishop of the said city. He was performing miracles of healing, preaching without ceasing, and converting the people, when he was many ways punished and at last beheaded, along with his Deacon Fortunatus, and so won an everlasting crown, under Nero.

    At Lucca, in Tuscany, the blessed martyr Paulinus, who was ordained by the holy apostle Peter the first Bishop of that city. Under the emperor Nero, after many contendings, he finished his testimony along with others his Companions at the foot of Monte Pisano.

    On the same day, the holy martyrs Proclus and Hilarion, who gained the palm of martyrdom through most dire torments under the Emperor Trajan and President Maximus.

    At Lentini, in Sicily, the holy Epiphana, who had her breasts cut off, and so gave up the ghost, under the Emperor Diocletian and the President Tertyllus.

    At Toledo, the holy Virgin and martyr Marciana, who for Christ's faith's sake was thrown to wild beasts and gored by a bull, and so crowned with martyrdom.

    At Lyon, holy Viventiolus, Bishop.

    At Bologna, holy Paternian, Bishop.
