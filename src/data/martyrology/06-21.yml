# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "06-21"
text:
  la: |
    Romæ sancti Aloísii Gonzágæ, Clérici e Societáte Jesu et Confessóris, principátus contémptu et innocéntia vitæ claríssimi, quem, a Summo Pontífice Benedícto Décimo tértio adscríptum Sanctórum fastis et Protectórem juvénibus præsértim studiósis datum, Pius Papa Undécimus cæléstem Christiánæ juventútis univérsæ Patrónum confirmávit solémniter atque íterum declarávit.

    Item Romæ sanctæ Demétriæ Vírginis, quæ, sanctórum Mártyrum Flaviáni et Dafrósæ fília ac sanctæ Vírginis et Mártyris Bibiánæ soror, ipsa quoque, sub Juliáno Apóstata, martýrio coronáta est.

    Eódem die sancti Eusébii, Samosaténi Epíscopi; qui, témpore Constántii, Imperatóris Ariáni, sub hábitu militári incognítus Ecclésias Dei visitábat, ut in fide cathólica illas confirmáret. Deínde, sub Valénte, in Thráciam relegátur; sed, réddita pace Ecclésiæ, témpore Theodósii, ab exsílio revocátus, tandem, cum íterum Ecclésias visitáret, ei caput, tégula per mulíerem Ariánam désuper immíssa, confráctum est, sicque Martyr occúbuit.

    Icónii, in Lycaónia, sancti Teréntii, Epíscopi et Mártyris.

    Syracúsis, in Sicília, natális sanctórum Mártyrum Rufíni et Martiæ.

    In Africa sanctórum Mártyrum Cyríaci et Apollináris.

    Mogúntiæ sancti Albáni Mártyris, qui ob Christi fidem, post longos labóres et dura certámina, factus est dignus coróna vitæ.

    Pápiæ sancti Urciscéni, Epíscopi et Confessóris.

    Apud Tungrénses sancti Martíni Epíscopi.

    In pago Ebroicénsi sancti Leutfrídi Abbátis.
  en: |
    At Rome, holy Aloysius Gonzaga, of the Society of Jesus, illustrious for his contempt of earthly rank, and for the innocency of his life.

    Also at Rome, the holy Virgin Demetria, who was crowned with martyrdom under the Emperor Julian the Apostate.

    On the same day, holy Eusebius of Samosata. In the time of the Arian Emperor Constantius he used to visit the Churches of God, disguised as a soldier, to confirm them in the Catholic faith. Under Valens he was banished into Thrace. After peace was restored to the Church in the time of Theodosius he was called back from exile, and was visiting the churches again when an Arian woman dropped a tile upon him from a height which cracked his skull, and so he died a martyr at last.

    At Iconium, in Lycaonia, the holy martyr Terence, Bishop.

    At Syracuse, in Sicily, the holy martyrs Rufinus and Marcia.

    In Africa, the holy martyrs Cyriacus and Apollinaris.

    At Mainz, the holy martyr Alban, who after long toil and stern contending for Christ's faith was made worthy of the crown of life.

    At Pavia, the holy Confessor Urciscenus, Bishop.

    At Tongres, holy Martin, Bishop.

    At Évreux, the holy Abbot Leufroi.
status:
  la: verified
  en: verified
