# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "07-19"
text:
  la: |
    Sancti Vincéntii a Paulo, Presbýteri et Confessóris, Congregatiónis Presbyterórum Missiónis et Puellárum Caritátis Fundatóris, cæléstis ómnium caritátis Societátum Patróni; qui in Dómino obdormívit quinto Kaléndas Octóbris.

    Colóssis, in Phrýgia, natális sancti Epaphræ, quem sanctus Paulus Apóstolus concaptívum appéllat. Hic, ab eódem Apóstolo Colóssis Epíscopus ordinátus, ibídem, clarus virtútibus, martýrii palmam, pro óvibus sibi commendátis, viríli agóne percépit; cujus corpus Romæ, in Basílica sanctæ Maríæ Majóris, cónditum est.

    Tréviris sancti Martíni, Epíscopi et Mártyris.

    Híspali, in Hispánia, pássio sanctárum Vírginum Justæ et Rufínæ, quæ, a Prǽside Diogeniáno comprehénsæ, primo equúlei extensióne et ungulárum laniatióne vexátæ, póstea cárcere, inédia et váriis torsiónibus sunt afflíctæ; tandem Justa in cárcere spíritum exhalávit, Rufínæ vero cervix, in confessióne Dómini, confrácta est.

    Córdubæ, in Hispánia, sanctæ Aureæ Vírginis, beatórum Adúlphi et Joánnis Mártyrum soróris; quæ aliquándo in apostasíæ crimen a Mahumetáno Júdice indúcta est, sed mox, facti pǽnitens, iteráto certámine, hostem effúso sánguine superávit.

    Romæ sancti Sýmmachi Papæ, qui, a schismaticórum factióne diútius fatigátus, demum, sanctitáte conspícuus, migrávit ad Dóminum.

    Verónæ sancti Felícis Epíscopi.

    Apud Scetim, Ægýpti montem, sancti Arsénii, Románæ Ecclésiæ Diáconi; qui, Theodósii témpore, in solitúdinem secéssit, ibíque, virtútibus ómnibus consummátus et jugi lacrimárum imbre perfúsus, spíritum Deo réddidit.

    In Cappadócia sanctæ Macrínæ Vírginis, fíliæ sanctórum Basilíi et Emméliæ, atque soróris item sanctórum Episcopórum Basilíi Magni, Gregórii Nysséni et Petri Sebasténsis.
  en: |
    _

    The holy Epaphras, whom the holy Apostle Paul doth call his own fellow prisoner. He was ordained by the same Apostle Bishop of Colossi, where, illustrious for graces, he gained the palm of martyrdom in manly contending on behalf of the sheep committed to his care. His body is buried at Rome, in the Church of St Mary the greater.

    At Seville, in Spain, the holy Virgins Justa and Rufina. They were arrested under the President Diogenian. They were first racked and tormented by being torn with hooks, and afterwards afflicted with imprisonment, starvation, and diverse tortures. In the end Justa gave up the ghost in prison, and Rufina had her neck broken for confessing the Lord.

    At Cordova, the holy Virgin Aurea, who for a time fell away, but repented of what she had done, and in a renewed combat prevailed against the enemy by the shedding of her blood.

    At Trier, the holy martyr Martin, Bishop.

    At Rome, the holy Pope Symmachus, who long suffered through the deeds of the schismatics, and at length passed away, famous for holiness, to be ever with the Lord.

    At Verona, holy Felix, the Bishop.

    At Mount Skete, in Egypt, holy Arsenius, a Deacon of the Church of Rome, who in the time of Theodosius betook himself to the desert, where he gave up his soul to God, finished in all graces and plentifully wet with tears.

    In Cappadocia, the holy Virgin Macrina, sister to holy Basil the Great and Gregory of Nyssa.
status:
  la: verified
  en: verified
