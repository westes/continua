# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "06-16"
text:
  la: |
    Mogúntiæ pássio sanctórum Aurǽi Epíscopi, et Justínæ soróris, ac ceterórum Mártyrum; qui, synáxim in Ecclésia agéntes, ab Hunnis, Germániam diripiéntibus, trucidáti sunt.

    Vesontióne, in Gálliis, sanctórum Mártyrum Ferreóli Presbýteri, et Ferrutiónis Diáconi, qui, a beáto Irenǽo Epíscopo missi ad prædicándum verbum Dei, póstea, sub Cláudio Júdice, divérsis pœnis excruciáti, gládio feriúntur.

    Tarsi, in Cilícia, sanctórum Mártyrum Quírici et Julíttæ matris, sub Diocletiáno Imperatóre. Ex eis Quíricus, triénnis puéllus, cum matrem, quæ ante Alexándrum Prǽsidem nervis diríssime cædebátur, implacábili luctu lugéret, ad gradus tribunális illísus intériit; Julítta vero, post dira vérbera et grávia torménta, martýrii sui cursum obtruncatióne cápitis implévit.

    Amathúnte, in Cypro, sancti Tychónis Epíscopi, témpore Theodósii Junióris.

    Lugdúni, in Gállia, deposítio beáti Aureliáni, Epíscopi Arelaténsis.

    Nannéte, in Británnia minóre, sancti Similiáni, Epíscopi et Confessóris.

    Misnæ, in Germánia, sancti Bennónis Epíscopi.

    In monastério Aquiriénsi, in Brabántia, sanctæ Lutgárdis Vírginis.
  en: |
    At Besançon, in Gaul, the holy martyrs Ferreolus a Priest and Ferrutio a Deacon, who were sent forth by the blessed Irenaeus, Bishop, to preach the Word of God, whereafter they were diverse ways tormented and then beheaded under Claudius the judge.

    At Tarsus, in Cilicia, under the Emperor Diocletian, the holy martyrs Quiricus and his mother Julitta.

    Quiricus was a little boy of three years old when his mother was horribly scourged before the President Alexander, he vehemently wept and lamented her, whereupon he was killed by being dashed against the steps of the judgment-seat. Julitta, after horrid stripes and grievous torments, was beheaded, and so finished her testimony.

    At Mainz, the holy martyrs Aureus and his sister Justina, and the others who were at Communion in the Church when they were massacred by the Huns, who were wasting Germany.

    At Limasol, in Cyprus, holy Tycho, Bishop, in the time of the Emperor Theodosius the younger.

    At Lyon, the blessed Aurelian, Bishop of Arles.

    At Nantes, in Brittany, the holy Confessor Similian, Bishop.

    At Meissen, in Germany, holy Benno, Bishop.

    In Brabant, the holy Virgin Lutgard.
status:
  la: verified
  en: verified
