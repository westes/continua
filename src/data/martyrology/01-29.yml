# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "01-29"
text:
  la: |
    Sancti Francísci Salésii, Epíscopi Gebennénsis, Confessóris et Ecclésiæ Doctóris, ómnium Scriptórum catholicórum, diáriis aliísve scriptis in vulgus edéndis sapiéntiam Christiánam illustrántium ac provehéntium et tutántium, peculiáris apud Deum Patróni; qui migrávit in cælum quinto Kaléndas Januárii, sed hac die, ob Translatiónem córporis ejus, potíssimum cólitur.

    Tréviris deposítio beáti Valérii Epíscopi, qui fuit discípulus sancti Petri Apóstoli.

    Romæ, via Nomentána, natális sanctórum Mártyrum Pápiæ et Mauri mílitum, témpore Diocletiáni Imperatóris; quorum ora jussit Laodícius, Urbis Præféctus, ad primam Christi confessiónem lapídibus contúndi, et sic eos in cárcerem trahi, ac póstea fústibus cædi, atque ad últimum plumbátis pércuti, donec exspirárent.

    Perúsiæ sancti Constántii, Epíscopi et Mártyris; qui, una cum Sóciis, sub Marco Aurélio Imperatóre, ob fídei defensiónem, martýrii corónam accépit.

    Medioláni sancti Aquilíni Presbýteri, qui, ab Ariánis gládio in gutture transfíxus, martýrio coronátur.

    Edéssæ, in Sýria, sanctórum Mártyrum Sarbélii et Bárbeæ soróris, qui, a beáto Barsimǽo Epíscopo baptizáti, ambo, in persecutióne Trajáni, sub Lýsia Prǽside, martýrio coronáti sunt.

    In território Tricassíno sancti Sabiniáni Mártyris, qui, jubénte Aureliáno Imperatóre, pro fide Christi decollátus est.

    Apud Bitúricas, in Aquitánia, sancti Sulpícii Sevéri Epíscopi, virtútibus et eruditióne conspícui.
  en: |
    Of holy Francis de Sales, Bishop of Geneva, Confessor and Doctor of the Church, the heavenly patron before God of all Catholic writers who, by journals and other published writings, illustrate, advance and defend Christian wisdom; who departed to heaven on the 28th day of December, but is chiefly honoured on this day because of the Translation of his body.

    At Trier, holy Valerius, Bishop of that see, a disciple of the holy Apostle Peter.

    At Rome, upon the Nomentan Way, the holy soldiers Papias and Maurus, martyrs in the time of the Emperor Diocletian. At their first confession of Christ, Laodicius, the Prefect of the city, ordered their mouths to be bruised with stones and committed them to prison where they were afterwards cudgelled and then lashed to death with scourges loaded with lead.

    At Perugia, the holy martyrs Constantius, Bishop of that see, and his companions, who were crowned for defending the faith in the persecution under the Emperor Marcus Aurelius.

    At Milan, the holy Priest Aquilinus, who was crowned with martyrdom, by being run through the neck with a sword by the Arians.

    At Edessa, in Syria, the holy martyrs Sarbelius and his sister, Barbea, who were baptized by blessed Barsimceus, Bishop of that city, and were crowned with martyrdom under the President Lysias, in the persecution under the Emperor Trajan.

    In the country of Trois, the holy martyr Sabinian, who was beheaded for Christ's faith's sake, by order of the Emperor Aurelian.

    At Bourges, holy Sulpicius Severus, Bishop of that see, famous for his graces and learning.
