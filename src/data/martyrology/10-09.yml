# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-09"
leadEntries: 3
text:
  la: |
    Romæ sancti Joánnis Leonárdi Confessóris, Fundatóris Congregatiónis Clericórum Regulárium a Matre Dei, labóribus et miráculis clari, cujus ópera Missiónes a Propagánda Fide institútæ sunt.

    Lutétiæ Parisiórum natális sanctórum Mártyrum Dionýsii Areopagítæ Epíscopi, Rústici Presbýteri, et Eleuthérii Diáconi. Ex his Dionýsius, ab Apóstolo Paulo baptizátus, primus Atheniénsium Epíscopus ordinátus est; deínde Romam venit, atque inde a beáto Cleménte, Románo Pontífice, in Gállias prædicándi grátia diréctus est, et ad præfátam urbem devénit; ibíque, cum per áliquot annos commíssum sibi opus fidéliter prosecútus esset, tandem, a Præfécto Fescenníno, post gravíssima tormentórum génera, una cum Sóciis, gládio animadvérsus, martýrium complévit.

    Eódem die memória sancti Abrahæ, Patriárchæ et ómnium credéntium Patris.

    Apud Cassínum sancti Deúsdedit Abbátis, qui, a Sicárdo tyránno in cárcerem trusus, illic, fame et ærúmnis conféctus, réddidit spíritum.

    Apud Júliam, in território Parménsi, via Cláudia, sancti Domníni Mártyris; qui, sub Maximiáno Imperatóre, cum vellet persecutiónis rábiem declináre, a persequéntibus est comprehénsus, et, gládio transverberátus, glorióse occúbuit.

    In Hannónia sancti Gisléni, Epíscopi et Confessóris; qui, relícto Episcopátu, Mónachi vitam in monastério a se constrúcto exércuit, et multis virtútibus cláruit.

    Valéntiæ, in Hispánia Tarraconénsi, sancti Ludovíci Bertrándi, ex Ordine Prædicatórum, Confessóris; qui, apostólico spíritu clarus, Evangélium quod Americánis prædicáverat, vitæ innocéntia multísque éditis miráculis confirmávit.

    Hierosólymis sanctórum Androníci et Athanásiæ cónjugis.

    Antiochíæ sanctæ Públiæ Abbatíssæ, quæ, transeúnte Juliáno Apóstata, Davídicum illud cum suis Virgínibus canens: «Simulácra Géntium argéntum et aurum», et; «Símiles illis fiant qui fáciunt ea»; Imperatóris jussu, álapis cæsa est, et gráviter objurgáta.
  en: |
    At Rome, holy John Leonardi, Confessor, Founder of the Congregation of the Clerks Regular of the Mother of God, renowned for labours and miracles, by whose work the Missions were established by the Propaganda of the Faith.

    At Paris, the holy martyrs Denys the Areopagite, Bishop Rusticus the Priest, and Eleutherius the Deacon. Denys was baptized by the Apostle Paul, and ordained the first Bishop of Athens. He afterward came to Rome, whence he was sent by the Roman Pontiff, the blessed Clement, to preach in Gaul. He came to Paris, where for some years he faithfully executed the task laid upon him then the Prefect Pescenninus, when he had put him to diverse kinds of grievous torments, caused him to be beheaded, along with his two Companions, and so the three together finished their testimony.

    Upon the same day is made memorial of the holy Patriarch Abraham, the father of all them that believe.

    At Julia, in the country of Parma, upon the Claudian Way, under the Emperor Maximian, the holy martyr Domninus. He was seeking to escape from the fury of the persecutors, but they that came in pursuit of him ran him through with the sword, and he fell gloriously.

    At Monte Casino, the holy Abbot Deusdedit, who was cast into prison by the tyrant Sicard, and there died of hunger and wretchednesss.

    In Hainaut, the holy Confessor Ghislain, Bishop, who resigned his see and lived as a monk in a monastery founded by himself, and was famous for many graces.

    At Valencia, in Spain, holy Louis Bertrand, of the Order of Friars Preachers, who was filled with the spirit of the Apostolate, and confirmed by innocency of life and many signs the Gospel which he preached to the Americans.

    At Jerusalem, holy Andronicus and Athanasia his wife.

    At Antioch, the holy Abbess Publia. As the Emperor Julian the Apostate was passing by, she and her Virgins sang those words of David: "The idols of the heathen are silver and gold," and "Let them that make them become like unto them," wherefore the Emperor commanded her to be buffeted and sharply rebuked.
status:
  la: verified
  en: verified
