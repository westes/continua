# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "05-30"
text:
  la: |
    Sancti Felícis Primi, Papæ et Mártyris, cujus dies natális tértio Kaléndas Januárii recensétur.

    Túrribus, in Sardínia, sanctórum Mártyrum Gabíni et Críspuli.

    Antiochíæ sanctórum Syci et Palatíni, qui, pro Christi nómine, multa torménta passi sunt.

    Ravénnæ sancti Exsuperántii, Epíscopi et Confessóris.

    Pápiæ sancti Anastásii Epíscopi.

    Cæsaréæ, in Cappadócia, sanctórum Basilíi et Emméliæ uxóris, qui fuérunt paréntes beatórum Basilíi Magni et Gregórii Nysséni ac Petri Sebasténsis Episcopórum, atque Macrínæ Vírginis. Hi vero sancti cónjuges, témpore Galérii Maximiáni, extórres facti, Pónticas solitúdines incoluére; et post persecutiónem, fíliis suárum relíctis virtútum herédibus, in pace quievérunt.

    Híspali, in Hispánia, sancti Ferdinándi Tértii, Castéllæ et Legiónis Regis, ob virtútum præstántiam cognoménto Sancti; qui, fídei propagándæ zelo clarus, tandem, devíctis Mauris, ad cæléste regnum, terréno relícto, felíciter evolávit.

    Rotómagi, sanctæ Joánnæ Arcénsis Vírginis, Puéllæ Aurelianénsis appellátæ, quæ cum fórtiter pro pátria dimicásset, tandem, in hóstium potestátem trádita, iniquo judício condemnáta est et igne combústa; atque a Benedícto Décimo quinto, Pontífice Máximo, Sanctórum fastis adscrípta.
  en: |
    _

    At Rome, upon the Aurelian Way, the holy martyr Pope Felix, who was crowned with martyrdom under the Emperor Aurelian.

    At Torre, in Sardinia, the holy martyrs Gabinus and Crispulus.

    At Antioch, holy Sycus and Palatinus, who suffered many torments for Christ's Name's sake.

    At Ravenna, the holy Confessor Exuperantius, Bishop.

    At Pavia, the holy Anastasius, Bishop.

    At Caesarea, in Cappadocia, the holy Basil and Emmelia his wife, father and mother of holy Basil the Great. In the time of the Emperor Galerius Maximian they were banished, and dwelt in the wilderness in Pontus; but they fell asleep in peace after the persecution was over, leaving their children inheritors of their goodness.

    At Seville, in Spain, holy Ferdinand III, King of Castille and Leon, who on account of his excelling graces was surnamed the Saint. Illustrious for his zeal in the propagation of the faith, after conquering the Moors, he left an earthly kingdom to inherit in blessedness a kingdom eternal in heaven.

    At Rouen, holy Joan of Arc, Virgin, called the Maid of Orleans, who, when she had fought bravely for her country, was at length delivered into the power of her enemies, condemned by an unjust judgment and burned with fire; and was enrolled among the Saints by Pope Benedict XV.
status:
  la: verified
  en: verified
