# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "06-07"
text:
  la: |
    Constantinópoli natális sancti Pauli, ejúsdem civitátis Epíscopi, qui sæpe ab Ariánis ob fidem cathólicam pulsus, et a sancto Júlio Primo, Románo Pontífice, restitútus est; ac demum, ab Ariáno Imperatóre Constántio relegátus ad Cucúsum, Cappadóciæ oppídulum, ibídem, Arianórum insídiis crudéliter strangulátus, ad cæléstia regna migrávit. Ipsíus autem corpus, Theodósio Imperatóre, Constantinópolim summo honóre translátum fuit.

    Córdubæ, in Hispánia, sanctórum Monachórum et Mártyrum Petri Presbýteri, Wallabónsi Diáconi, Sabiniáni, Wistremúndi, Habéntii et Jeremíæ, qui pro Christo, in persecutióne Arábica, sunt juguláti.

    Hermópoli, in Ægýpto, sancti Lycariónis Mártyris, qui laniátus, virgis férreis ignítis cæsus, alíaque sævíssima passus est, ac demum, gládio percússus, martýrium consummávit.

    Placéntiæ sancti Antónii Maríæ Gianélli, Bobiénsis Epíscopi, Fundatóris Congregatiónis Filiárum Maríæ sanctíssimæ ab Horto nuncupatárum, quem Pius Papa Duodécimus inter sanctos Cǽlites adnumerávit.

    In Anglia sancti Robérti Abbátis, ex Ordine Cisterciénsi.
  en: |
    At Constantinople, the holy Paul, Archbishop of that city. He was oftentimes thrust out by the Arians because of the Catholic faith, and brought back again by the holy Roman Pontiff, Julius I. At length he was banished by the Arian Emperor Constantius to Cucusus, a little town in Cappadocia, where he was cruelly strangled by Arian plotters, and so passed into the kingdom of heaven. His body was brought to Constantinople with great reverence, in the time of the Emperor Theodosius.

    At Cordova, the holy Monks Peter, Wallabond, Sabinian, Wistremund, Habentius, and Jeremiah, of whom Peter was a Priest and Wallabond a Deacon, martyrs under the Muslims.

    In Egypt, the holy martyr Licarion, who was mangled, beaten with red-hot iron rods, and suffered other dreadful torments before he was smitten with the sword, and so finished his testimony.

    At Piacenza, holy Anthony Mary Gianelli, Bishop of Bobbio, Founder of the Congregation of the Daughters of Mary most holy of the Garden, whom Pope Pius XII numbered among the Saints of heaven.

    In England, the holy Abbot Robert, of the Cistercian Order. His grave did raise three dead men to life, and who was written in the list of the Saints by Pope Honorius.
