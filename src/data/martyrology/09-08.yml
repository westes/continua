# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "09-08"
text:
  la: |
    Sancti Hadriáni Mártyris; cujus dies natális quarto Nonas Mártii recensétur, sed festívitas hac die, qua sacrum ejus corpus Romam translátum fuit, potíssime celebrátur.

    Valéntiæ, in Hispánia Tarraconénsi, natális sancti Thomæ a Villa Nova, ex Eremitárum sancti Augustíni Ordine, Epíscopi et Confessóris, insígnis propter flagrántem in páuperes caritátem; qui ab Alexándro Papa Séptimo in Sanctórum númerum adscríptus est. Ipsíus autem festum décimo Kaléndas Octóbris celebrátur.

    Alexandríæ sanctórum Mártyrum Ammónis, Theóphili, Neotérii et aliórum vigínti duórum.

    Antiochíæ sanctórum Timóthei et Fausti Mártyrum.

    Gazæ, in Palæstína, sanctórum Mártyrum fratrum Eusébii, Néstabi et Zenónis; qui, témpore Juliáni Apóstatæ, irruénte in eos turba Gentílium, discérpti atque necáti sunt.

    Ibídem sancti Néstoris Mártyris, qui sub eódem Juliáno, ab iísdem Gentílibus furéntibus sævíssime cruciátus, emísit spíritum.

    Romæ sancti Sérgii Primi, Papæ et Confessóris.

    Frisíngæ sancti Corbiniáni, qui fuit primus ejúsdem civitátis Epíscopus. Hic, a sancto Gregório Secúndo Pontífice ordinátus et ad prædicándum Evangélium missus, úberes fructus in Gállia et Germánia rétulit, ac demum, virtútibus et miráculis clarus, in pace quiévit.

    Carthágine nova, in América meridionáli, sancti Petri Claver, Sacerdótis e Societáte Jesu et Confessóris; qui mira sui abnegatióne et exímia caritáte Nigrítis in servitútem abdúctis, annos ámplius quadragínta, óperam impéndens, tercénta fere eórum míllia Christo sua ipse manu regenerávit; et a Leóne Décimo tértio, Pontífice Máximo, in Sanctórum númerum relátus est, ac dein étiam cæléstis Patrónus peculiáris sacrárum ad Nigrítas Missiónum constitútus et declarátus.
  en: |
    Upon the same day are commemorated the holy martyr Adrian, and twenty-three others, who finished their testimony at Nicomedia after many sufferings, under the Emperors Diocletian and Maximian, by having their legs broken, upon the 4th day of March. Their relics were carried by the Christians to Byzantium, where they were buried with reverence and honour, and thence the body of holy Adrian was afterwards brought to Rome, upon the 8th of this month, upon which day the chief feast is kept in his honour.

    At Valencia, in Spain, holy Thomas of Villanueva, Archbishop, famous for his exceeding charity toward the poor. His name was enrolled among those of the Saints by Pope Alexander VII, and we keep his feast upon the 22nd day of this present month of September.

    At Alexandria, the holy martyrs Ammon, Theophilus, Neoterius, and twenty-two others.

    At Antioch, the holy martyrs Timothy and Faustus.

    At Gaza, in Palestine, the holy brethren Eusebius, Nestabus, and Zeno, all martyrs, in the time of the Emperor Julian the Apostate. A multitude of the Gentiles fell upon them, rent them, and slew them.

    There also the holy martyr Nestor, who was most cruelly tormented by the same raging Gentiles, under the same Emperor Julian, and gave up the ghost.

    At Rome, holy Sergius I, Pope and Confessor.

    At Frisingen, holy Corbinian, first Bishop of that city. He was ordained and sent forth to preach the Gospel by Pope Gregory II. He bore much fruit in Gaul and in Germany, and at length fell asleep in peace, famous for graces and wonders.

    At Cartagena, in South America, holy Peter Claver, Priest of the Society of Jesus and Confessor; who, with wonderful self-denial and eminent charity, spent more than forty years in labouring for the Negroes carried away into slavery, and with his own hand regenerated in Christ well-nigh three hundred thousand of them; and was enrolled among the Saints by Pope Leo XIII, and afterward also appointed and declared the special heavenly Patron of the Catholic missions among the Negroes.
