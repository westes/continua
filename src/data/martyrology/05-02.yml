# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "05-02"
text:
  la: |
    Alexandríæ natális sancti Athanásii, ejúsdem urbis Epíscopi, Confessóris et Ecclésiæ Doctóris, sanctitáte et doctrína claríssimi; in cujus persecutiónem univérsus fere Orbis conjuráverat. Ipse tamen cathólicam fidem, a témpore Constantíni usque ad Valéntem, advérsus Imperatóres ac Prǽsides et innúmeros Epíscopos Ariános strénue propugnávit; a quibus plúrimas perpéssus insídias, prófugus toto Orbe actus est, nec ullus ei tutus ad laténdum supérerat locus. Tandem, ad suam Ecclésiam revérsus, illic, post multos agónes multásque patiéntiæ corónas, quadragésimo sexto sui sacerdótii anno migrávit ad Dóminum, témpore Valentiniáni et Valéntis Imperatórum.

    Floréntiæ item natális sancti Antoníni, ex Ordine Prædicatórum, Epíscopi et Confessóris, doctrína et sanctitáte célebris. Ipsíus autem festívitas sexto Idus mensis hujus recólitur.

    Romæ sanctórum Mártyrum Saturníni, Neópoli, Germáni et Cælestíni, qui, multa passi, in cárcerem demum conjécti, ibi in Dómino quievérunt.

    Eódem die sancti Vindemiális, Epíscopi et Mártyris, qui, una cum sanctis Epíscopis Eugénio et Longíno doctrína et miráculis advérsus Ariános decértans, a Rege Wandalórum Hunneríco jubétur váriis torméntis afflígi ac tandem cápite obtruncári.

    Híspali, in Hispánia, sancti Felícis, Diáconi et Mártyris.

    Attalíæ, in Pamphýlia, sanctórum Mártyrum Exsupérii, et Zoës uxóris, atque Cyríaci et Theodúli filiórum; qui, sub Hadriáno Imperatóre, cum servi essent cujúsdam viri Pagáni, omnes, ipso hero jubénte, ob líberam Christiánæ fídei professiónem, primum verberáti sunt ac veheménter torti, deínde, in accénsum clíbanum injécti, ánimas suas Deo tradidérunt.
  en: |
    At Alexandria, in the year 373, holy Athanasius, Pope of that city, most illustrious for his holiness and teaching. Nearly the whole world leagued itself together to persecute him for the Catholic Faith. He fought right stoutly against Emperors, Presidents, and Arian Bishops without number, from the time of the Emperor Constantine until that of the Emperor Valens. To escape their plots he became an outcast upon the face of the wide world, and there was nowhere left where he could hide himself in safety. He returned at last to his own church, and after many contendings and many crowns of long-suffering he passed away to be ever with the Lord, in the 46th year of his priesthood, in the time of the Emperors Valentinian and Valens.

    At Florence, likewise the birthday of holy Antoninus, of the Order of Preachers, Bishop and Confessor, renowned for learning and holiness. His feast is kept upon the 10th day of this month.

    At Rome, the holy martyrs Saturninus, Neopolus, German, and Celestine, who suffered many things, and were at last cast into prison, where they slept in the Lord.

    Likewise the holy martyrs Exuperius and Zoe his wife, their children Cyriacus and Theodulus, who suffered under the Emperor Hadrian.

    At Seville, the holy martyr the Deacon Felix.

    Upon the same day, the holy martyr Vindemial.
