# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "06-29"
text:
  la: |
    Romæ natális sanctórum Apostolórum Petri et Pauli, qui eódem anno eodémque die passi sunt, sub Neróne Imperatóre. Horum prior, in eádem Urbe, cápite ad terram verso cruci affíxus, et in Vaticáno juxta viam Triumphálem sepúltus, totíus Orbis veneratióne celebrátur; postérior autem, gládio animadvérsus, et via Ostiénsi sepúltus, pari honóre habétur.

    In Cypro sanctæ Maríæ, matris Joánnis qui cognominátus est Marcus.

    In castro Argentómacho, in Gállia, sancti Marcélli Mártyris, qui, pro fide Christi, una cum Anastásio, viro militári, cápite plexus est.

    Génuæ natális sancti Syri Epíscopi.

    Nárniæ sancti Cássii, ejúsdem civitátis Epíscopi, de quo sanctus Gregórius Papa refert quod nullus ferme dies vitæ ejus abscedébat, quo placatiónis hóstias omnipoténti Deo non offérret; cui et concordábat vita, quia, cuncta quæ habébat, in eleemósynis tríbuens, in hora sacrifícii totus in lácrimis diffluébat. Demum, natalítio Apostolórum die, quo síngulis annis Romam veníre consuéverat, in eádem Narniénsi urbe, cum Missárum solémnia celebrásset, et corpus Domínicum pacémque ómnibus dedísset, migrávit ad Dóminum.

    In território Senonénsi sanctæ Benedíctæ Vírginis.
  en: |
    At Rome, the holy Apostles Peter and Paul. They suffered under the Emperor Nero upon the same day of the same year. Peter was crucified in the city with his head downwards, and is buried at the Vatican beside the Triumphal Way, surrounded by the veneration of the whole world. Paul was beheaded with the sword, and buried beside the Ostian Way, surrounded by the same honour.

    At Argenten, in Gaul, the holy martyr Marcellus, who was beheaded for Christ's faith's sake, along with a soldier named Anastasius.

    At Genoa, holy Syrus, Bishop.

    At Narni, holy Cassius, Bishop of that city of him holy Gregory hath on record that hardly any day of his life passed wherein he did not offer up unto God Almighty the offerings of atonement and therewith his life accorded well, for he gave away in charity all that he possessed, and at the hour of the sacrifice he wept abundantly. It was his use to come to Rome every year for the birthday of the Apostles, and upon that day, when he had celebrated solemn Mass, and had given unto all the Body of the Lord and the Peace, he passed away to be ever with the Lord.

    In Cyprus, holy Mary, the mother of John whose surname was Mark.

    In the country of Sens, the holy Virgin Benedicta.
status:
  la: verified
  en: verified
