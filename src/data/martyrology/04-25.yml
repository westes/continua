# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-25"
text:
  la: |
    Romæ Litaníæ majóres ad sanctum Petrum.

    Alexandríæ natális beáti Marci Evangelístæ. Hic, discípulus et intérpres Apóstoli Petri, rogátus Romæ a frátribus scripsit Evangélium, quo assúmpto, perréxit in Ægýptum, primúsque Alexandríæ Christum annúntians, constítuit Ecclésiam; ac póstea, pro fide Christi tentus, fúnibus vinctus et per saxa raptátus, gráviter afflíctus est; deínde, reclúsus in cárcere, primo angélica visitatióne confortátus est, et demum, ipso Dómino sibi apparénte, ad cæléstia regna vocátus, octávo Nerónis anno.

    Item Alexandríæ sancti Aniáni Epíscopi, qui, beáti Marci discípulus ejúsque in Episcopátu succéssor, clarus virtútibus quiévit in Dómino.

    Antiochíæ sancti Stéphani, Epíscopi et Mártyris, qui ab hæréticis Synódum Chalcedonénsem impugnántibus, multa passus, in Oróntem flúvium præcipitátus est, témpore Zenónis Imperatóris.

    Syracúsis, in Sicília, sanctórum Mártyrum fratrum Evódii, Hermógenis et Callístæ.

    Láubiis, in Bélgio, natális sancti Ermíni, Epíscopi et Confessóris.

    Antiochíæ sanctórum Philónis et Agathopódis Diaconórum, de quibus beátus Ignátius, Epíscopus et Martyr, laudábilem in suis epístolis mentiónem facit.
  en: |
    At Rome, the Greater Litanies, take place at St Peter's Church.

    At Alexandria, the blessed Evangelist Mark. He was the disciple and interpreter of the Apostle Peter. He wrote his Gospel at the prayer of the brethren at Rome. He took it with him and went to Egypt, where he was the first man who proclaimed Christ at Alexandria, and where he founded that Church. He was afterward arrested as a believer in Christ, bound with cords, and dragged over stones to his grievous suffering. Then he was remanded to prison, where he was comforted first by a visitation of angels and then by the Lord Himself appearing unto him, and was called unto the kingdom of heaven in the 8th year of Nero.

    At Alexandria, holy Anian, Pope of that see. He was the disciple of blessed Mark, and held that Papacy.

    At Antioch, the holy martyr Stephen, Patriarch of that see, who suffered many things at the hands of the heretics who assailed the Council of Chalcedon, and was cast into the river Orontes, in the time of the Emperor Zeno.

    At Syracuse, the holy martyrs Evodius, Hermogenes, and Kallistas.

    At Lobbes, in Belgium, the birthday of holy Ermin, Bishop and Confessor.

    There likewise, the holy Deacons Philo and Agathopodes.
