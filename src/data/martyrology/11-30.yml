# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "11-30"
text:
  la: |
    Apud Patras, in Achája, natális sancti Andréæ Apóstoli, qui in Thrácia et Scýthia sacrum Christi Evangélium prædicávit. Is, ab Ægéa Procónsule comprehénsus, primum in cárcere clausus est, deínde gravíssime cæsus, ad últimum suspénsus in cruce, in ea pópulum docens bíduo supervíxit; et, rogáto Dómino ne eum síneret de cruce depóni, circúmdatus est magno splendóre de cælo, et, abscedénte póstmodum lúmine, emísit spíritum.

    Romæ pássio sanctórum Cástuli et Euprépitis.

    Constantinópoli sanctæ Mauræ, Vírginis et Mártyris.

    Item sanctæ Justínæ, Vírginis et Mártyris.

    Romæ sancti Constántii Confessóris, qui, fórtiter Pelagiánis resistens, ab eórum factióne pértulit multa, quæ illum sanctis Confessóribus sociárunt.

    Apud Sántonas, in Gállia, sancti Trojáni Epíscopi, magnæ sanctitátis viri, qui, sepúltus in terris, se in cælis vívere multis virtútibus maniféstat.

    In Palæstína beáti Zósimi Confessóris, qui, sub Justíno Imperatóre, sanctitáte et miráculis fuit insígnis.
  en: |
    At Patrae, in the Peloponnesus, the holy Apostle Andrew. He preached the Gospel of Christ in Thrace and Scythia. He was arrested by the Proconsul Aegeas, and first imprisoned, then heavily flogged, and, lastly, crucified. He remained alive upon the cross through the second day, and taught the people. He besought the Lord not to suffer him to be taken down from the cross, and then a great light from heaven shone round about him, and when it faded away he gave up the ghost.

    At Rome, the holy martyrs Castulus and Euprepis.

    At Constantinople, the holy Virgin and martyr Maura.

    Likewise, the holy Virgin and martyr Justina.

    At Saintes, holy Trojan, Bishop, a man of great holiness, who, albeit he be buried in the earth, yet showeth by many works of power that he is alive in heaven.

    At Rome, the holy Confessor Constantius, who manfully withstood the Pelagians, and bore much at their hands, the which contendings have gained him a place among the holy Confessors.

    In Palestine, the holy Confessor Zosimus, who was eminent for holiness and miracles in the time of the Emperor Justin.
