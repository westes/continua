# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-10"
text:
  la: |
    Sancti Melchíadis, Papæ et Mártyris, cujus dies natális recensétur tértio Idus Januárii.

    Romæ, via Ostiénsi, Dedicátio Basílicæ sancti Pauli Apóstoli; quæ, simul cum Dedicatióne Basílicæ sancti Petri, Apostolórum Príncipis, annua celebritate recólitur quartodécimo Kaléndas Decémbris.

    Eódem die sanctórum Mártyrum Carpóphori Presbýteri, et Abúndii Diáconi; qui, in Diocletiáni persecutióne, primo fústibus crudelíssime cæsi, deínde in cárcerem, negáto cibo et potu, retrúsi, et rursum in equúleo torti, et post hæc diu in cárcere maceráti, novíssime gládio percússi sunt.

    Alexandríæ sanctórum Mártyrum Mennæ, Hermógenis et Eugraphi; qui sub Galério Maximiáno passi sunt.

    Apud Leontínos, in Sicília, sanctórum Mártyrum Mercúrii et Sociórum mílitum; qui, sub Tertýllo Prǽside, témpore Licínii Imperatóris, gládio cæsi sunt.

    Ancýræ, in Galátia, sancti Gemélli Mártyris, qui, post dira torménta, sub Juliáno Apóstata, crucis supplício martýrium consummávit.

    Eméritæ, in Hispánia, pássio sanctæ Euláliæ Vírginis, quæ, sub Maximiáno Imperatóre, cum esset annórum duódecim, ibi, jussu Daciáni Prǽsidis, pro confessióne Christi, plúrima torménta est perpéssa; novíssime, in equúleo suspénsa et exunguláta, fáculis ardéntibus ex utróque látere appósitis, hausto igne, spíritum réddidit.

    Item ibídem sanctæ Júliæ, Vírginis et Mártyris; quæ beátæ Euláliæ sócia fuit, et illi ad passiónem properánti indivídua comes adhǽsit.

    Romæ beáti Gregórii Papæ Tértii, qui sanctitáte meritísque præclárus migrávit in cælum.

    Viénnæ, in Gállia, sancti Sindúlphi, Epíscopi et Confessóris.

    Bríxiæ sancti Deúsdedit Epíscopi.

    Lauréti, in Picéno, Translátio sacræ Domus Genitrícis Dei Maríæ, qua in domo Verbum caro factum est. Ipsam vero beatíssimam Vírginem, Lauretánæ título nuncupátam, Benedíctus Papa Décimus quintus ómnibus aëreonáutis præcípuam apud Deum Patrónam attríbuit.
  en: |
    At Rome, the holy Pope Melchiades, (who reigned three years, 7 months, and 62 days, from the year 310 till January 10, 314,) who suffered much in the persecution under the Emperor Maximian, but fell asleep in the Lord after peace had been restored to the church.

    At Rome, upon the Ostian Way, the Dedication of the Basilica of St. Paul the Apostle; which, together with the Dedication of the Basilica of St. Peter, Prince of the Apostles, is kept by yearly celebration upon the 18th day of November.

    Upon the same day the holy martyrs Carpophorus the Priest, and Abundius the Deacon. In the persecution under the Emperor Diocletian they were first most cruelly cudgelled and recommitted to prison, where they were denied food and drink, then they were racked, and suffered long imprisonment, and lastly were beheaded.

    At Merida, in Spain, under the Emperor Maximian, the holy Virgin and martyr Eulalia, at the age of twelve years. The President Dacian commanded her to be put to many tortures for confessing Christ at last she was hung upon the rack, and lacerated with hooks and, burning torches being put to her sides, some of the flame and smoke went down her throat and she gave up the ghost.

    Likewise at Merida, the holy Virgin and martyr Julia, who was a Companion of the blessed Eulalia, and the only one who clave unto her as she went to suffer.

    At Rome, the blessed Pope Gregory III., who passed to heaven famous for his holiness and worthy deeds.

    At Alexandria, under the Emperor Gallerius Maximian, the holy martyrs Mennas, Hermogenes, and Eugraphus.

    At Lentini, in Sicily, the holy soldiers, Mercury and his Companions, all martyrs, who were slain with the sword in the time of the Emperor Licinius, under the President Tertyllus.

    At Ancyra, in Galatia, the holy martyr Gemellus, who, after most grievous torments under the Emperor Julian the Apostate, achieved martyrdom by the death of the cross.

    At Vienne, the holy Confessor Sindulph, Bishop.

    At Brescia, holy Deusdedit, Bishop.

    At Loreto, in Picenum, is commemorated the translation, of the holy house of Mary the Mother of God, wherein the Word was made flesh.
status:
  la: verified
  en: verified
