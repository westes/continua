# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-12"
text:
  la: |
    Alexandríæ sanctórum Mártyrum Epímachi et Alexándri, qui, sub Décio Imperatóre, cum fuíssent multo témpore in vínculis, atque, divérsis supplíciis affécti, perdurássent in fide, ígnibus tandem consúmpti sunt. Sanctus vero Epímachus, simul cum sancto Gordiáno Mártyre, festíva celebritáte cólitur sexto Idus Maji.

    Romæ sancti Synésii Mártyris, qui, beáti Xysti Papæ Secúndi témpore ordinátus Lector, et, cum multos convertísset ad Christum, apud Aureliánum Imperatórem accusátus, martýrii corónam gládio percússus accépit.

    Eódem die sanctórum Mártyrum Hermógenis, Donáti et aliórum vigínti duórum.

    Tréviris sanctórum Mártyrum Maxéntii, Constántii, Crescéntii, Justíni et Sociórum; qui in persecutióne Diocletiáni, sub Rictiováro Prǽside, passi sunt.

    Alexandríæ sanctárum Ammonáriæ Vírginis, Mercúriæ, Dionýsiæ et altérius Ammonáriæ. Harum prima, in persecutióne Décii, inaudítis tormentórum genéribus superátis, beátum vitæ finem, ferro cædénte, percépit; tres vero áliæ, cum Judex a féminis superári erubésceret, ac dubitáret, ne, eádem in illas exércens cruciaménta, viríli eárum étiam constántia vincerétur, statim jussæ sunt decollári.
  en: |
    At Alexandria, under the Emperor Decius, the holy martyrs Epimachus and Alexander; they were long kept in chains and put to diverse torments, but they persevered in the faith, and at the last were burnt.

    At Rome, the holy martyr Synesius, who was ordained a Reader in the time of the blessed Pope Xystus, and converted many to Christ he was accused before the Emperor Aurelian, and received the crown of martyrdom by being beheaded.

    On the same day, the holy martyrs Hermogenes, Donatus, and twenty-two others.

    At Trier, under the President Rictiovarus, in the persecution under the Emperor Diocletian, suffered the holy martyrs Maxentius, Constantius, Crescentius, Justinus, and their Companions.

    Likewise at Alexandria, the holy women Ammonaria the Virgin, Mercuria, Dionysia, and another called also Ammonaria. In the aforesaid persecution under the Emperor Decius, the first of these died a blessed death by the sword, after overcoming torments unheard of. The judge was ashamed to be conquered by women, and shrank from causing the application to them of the same tortures as to the first, and so conquered by their steadfastness, ordered them to be beheaded.
