# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-20"
text:
  la: |
    In território Lingoniénsi deposítio sancti Bernárdi, primi Clarævallénsis Abbátis, vita, doctrína et miráculis gloriósi, quem Pius Octávus Póntifex Máximus universális Ecclésiæ Doctórem declarávit, et confirmávit.

    Romæ deposítio sancti Pii décimi, Papæ et Confessóris, fídei integritáte et ecclesiásticæ libertátis propugnatóris invícti, religionísque zelo insígnis, cujus festum tértio Nonas Septémbris recólitur.

    Apud montem Senárium, in Etrúria, natális sancti Manétii Confessóris, e septem Fundatóribus Ordinis Servórum beátæ Maríæ Vírginis; qui, eídem hymnos dicens, expiravit. Ipsíus autem ac Sociórum festum prídie Idus Februárii celebrátur.

    In Judǽa sancti Samuélis Prophetæ, cujus sancta ossa (ut beátus Hierónymus scribit) Arcádius Augústus Constantinópolim tránstulit, et prope Séptimum collocávit.

    In Cypro sancti Lúcii Senatóris, qui, perspécta constántia Theodóri, Cyrenénsis Epíscopi, in martýrio pósiti, ad Christi fidem est convérsus, et ad eam étiam Digniánum Prǽsidem pertráxit; cum eóque Cyprum proféctus, ibi, cum álios Christiános pro confessióne Dómini coronári vidéret, ultro se ipsum óbtulit, et cápitis obtruncatióne eándem martýrii corónam proméruit.

    In Thrácia sanctórum trigínta septem Mártyrum, qui sub Prǽside Apelliáno pro Christi fide, mánibus pedibúsque præcísis, in camínum ardéntem injécti sunt.

    Ibídem sanctórum Mártyrum Sevéri, et Mémnonis Centuriónis; qui, eódem mortis génere consummáti, victóres abiérunt in cælum.

    Córdubæ, in Hispánia, sanctórum Mártyrum Leovigíldi et Christóphori Monachórum, qui, in Arabum persecutióne pro Christiánæ fídei defensióne in cárcerem conjécti, ac mox, cervícibus abscíssis, igni tráditi, martýrii palmam adépti sunt.

    In Hério ínsula sancti Philibérti Abbátis.

    Romæ beáti Porphýrii, qui fuit homo Dei, qui sanctum Mártyrem Agapítum erudívit in fide et doctrína Christi.

    In castro Cainóne, in Gállia, sancti Máximi Confessóris, qui éxstitit discípulus beáti Martíni Epíscopi.
  en: |
    In the country of Langres, holy Bernard, the first Abbot of Clairvaux, glorious for his life, his teaching, and his miracles, whom the Supreme Pontiff Pius VIII declared and confirmed a Doctor of the Universal Church.

    At Rome, the burial of holy Pius X, Pope and Confessor, the unconquered champion of the integrity of the faith and of the liberty of the Church, remarkable for zeal for religion, whose feast is kept upon the 3rd day of September.

    At Monte Senario, in the Diocese of Florence, the blessed Confessor Manetto one of the Seven Founders of the Order of Servants of the Blessed Virgin Mary, who died as he was reciting hymns to her.

    In Judea, the holy Prophet Samuel, whose sacred bones, as writeth blessed Jerome, were carried to Constantinople by the Emperor Arcadius, and laid near the Hebdomon.

    On the same day, the holy Senator Lucius. He was turned to the faith of Christ by seeing the constancy with which Theodore, Bishop of Cyrene, underwent martyrdom, and drew the President Dignian to the same belief; they went together to Cyprus, and when he saw other Christians there being crowned for confessing the Lord, he thrust himself forward and gained the same crown of martyrdom by being beheaded.

    In Thrace, thirty-seven holy martyrs, who under the President Apellian, for Christ's faith's sake, had their hands and feet cut off, and were cast into a furnace of fire.

    Likewise the holy martyrs Severus and Memnon the centurion, who finished their testimony by the same kind of death, and departed to heaven as conquerors.

    At Cordova, the holy martyrs Leovigild and Christopher. They were monks who were cast into prison for their defence of the Christian faith in the persecution under the Arabs, and were presently beheaded, and so gained the palm of martyrdom, whereafter their bodies were burnt.

    In the island of Noirmoutier, the holy Philibert, first Abbot.

    At Rome, blessed Porphyry, a man of God, from whom the holy martyr Agapitus learnt the faith and teaching of Christ.

    In the castle of Chinon, the holy Confessor Maximus, a disciple of blessed Martin, Bishop.
status:
  la: verified
  en: verified
