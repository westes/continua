# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "06-06"
text:
  la: |
    Magdebúrgi sancti Norbérti, ejúsdem civitátis Epíscopi et Confessóris, qui Fundátor éxstitit Ordinis Præmonstraténsis.

    Cæsaréæ, in Palæstína, natális beáti Philíppi, qui fuit unus de septem primis Diáconis. Hic, signis et prodígiis clarus, Samaríam ad Christi fidem convértit, et Regínæ Æthíopum Candácis Eunúchum baptizávit, ac demum apud Cæsaréam requiévit. Juxta ipsum tres Vírgines, ejus fíliæ ac Prophetíssæ, tumulátæ jacent; nam quarta fília ejus, plena Spíritu sancto, Ephesi occúbuit.

    Romæ sancti Artémii, cum uxóre sua Cándida, et fília Paulína. Ex his Artémius, ad prædicatiónem et mirácula sancti Petri Exorcístæ, ad Christum convérsus, et, cum omni domo sua, a sancto Marcéllino Presbýtero baptizátus, Seréni Júdicis jussu plumbátis cæsus et gládio percússus est; uxor vero ejus et fília, in cryptam impúlsæ, lapídibus ruderibúsque sunt óbrutæ.

    In agro Bononiénsi sancti Alexándri, Epíscopi Fæsuláni et Mártyris; qui, rédiens ex urbe Pápia, ubi Ecclésiæ suæ bona apud Longobardórum Regem ab usurpatóribus vindicáverat, ab his in Rhenum flúvium est dejéctus et aquis præfocátus.

    Tarsi, in Cilícia, sanctórum Mártyrum vigínti, qui, tempóribus Diocletiáni et Maximiáni, sub Simplício Júdice, per divérsa torménta glorificavérunt Deum in corpóribus suis.

    Noviodúni, in Gálliis, sanctórum Mártyrum Amántii, Alexándri et Sociórum.

    Medioláni deposítio sancti Eustórgii Secúndi, Epíscopi et Confessóris.

    Verónæ sancti Joánnis Epíscopi.

    Vesontióne, in Gálliis, sancti Cláudii Epíscopi.
  en: |
    Holy Norbert, Archbishop of Magdeburg, founder of the Order of the Premonstratensian Canons Regular.

    At Caesarea, in Palestine, the blessed Philip, who was one of the first seven Deacons. He was illustrious for signs and wonders. He turned Samaria to believe in Christ, and baptized the eunuch of Candace, Queen of the Ethiopians. He fell asleep at last at Caesarea. Three of his virgin daughters, who were prophetesses, lie buried beside him. His fourth daughter died at Ephesus, full of the Holy Ghost.

    At Rome, the holy martyrs Artemius, with Candida his wife and Paulina his daughter. This Artemius was brought to believe in Christ by the preaching and miracles of the holy Exorcist Peter, and was baptized with all his house by the holy Priest Marcellinus. He was first hided with scourges loaded with lead by order of Serenus the Judge, and afterwards beheaded. His wife and daughters were thrown into a vault, and buried in stones and rubbish.

    At Fiesole, in Tuscany, the holy martyr Alexander, Bishop of that see, drowned in a torrent by his enemies.

    At Tarsus, in Cilicia, twenty holy martyrs, who in the time of Diocletian and Maximian, under Simplicius the Judge, by diverse torments glorified God in their bodies.

    At Noyon, in Gaul, the holy martyrs Amantius, Alexander, and their companions.

    At Milan, deceased, the holy Confessor Eustorgius, second of that name, Bishop.

    At Verona, holy John, Bishop.

    At Besançon, in Gaul, holy Claud, Archbishop.
