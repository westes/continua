# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-13"
text:
  la: |
    Híspali, in Hispánia, sancti Hermenegíldi Mártyris, qui fuit fílius Leovigíldi, Regis Visigothórum Ariáni; atque ob cathólicæ fídei confessiónem conjéctus in cárcerem, et, cum in solemnitáte Pascháli Communiónem ab Epíscopo Ariáno accípere noluísset, pérfidi patris jussu secúri percússus est, ac regnum cæléste pro terréno Rex et Martyr intrávit.

    Romæ, in persecutióne Marci Antoníni Veri et Lúcii Aurélii Cómmodi, pássio sancti Justíni, Philósophi et Mártyris; qui, cum secúndum librum pro religiónis nostræ defensióne præfátis Imperatóribus porrexísset, eámque ibídem disputándo strénue propugnásset, Crescéntis Cýnici, cujus vitam et mores nefários redargúerat, insídiis accusátus quod Christiánus esset, remuneratiónem linguæ fidélis, martýrii munus accépit. Ipsíus tamen festum sequénti die recólitur.

    Pérgami, in Asia, in eádem persecutióne, natális sanctórum Mártyrum Carpi, Thyatirénsis Epíscopi; Pápyli Diáconi, et Agathonícæ, ejúsdem Pápyli soróris et óptimæ féminæ, atque Agathodóri, eórum fámuli, aliorúmque multórum. Hi omnes, post vários cruciátus, pro beátis confessiónibus martýrio coronáti sunt.

    Doróstori, in Mýsia inferióre, pássio sanctórum Máximi, Quinctiliáni et Dadæ, in persecutióne Diocletiáni.

    Ravénnæ sancti Ursi, Epíscopi et Confessóris.
  en: |
    At Seville, in Spain, the holy martyr Hermenegild, son of Leovigild, the Arian king of the Visigoths. His misbelieving father had cast him into prison on account of his confession of the Catholic Faith, and when upon the solemn night of Easter he refused to receive Easter Communion from the Arian Bishop he caused him to be smitten with the axe, and so did this king as a martyr exchange a kingdom on earth for the kingdom of heaven.

    At Pergamos, in Asia, the holy martyrs Carpus, Bishop of Thyatira, the Deacon Papylus, the excellent lady Agathonica his sister, their servant Agathodorus, and many others, who were diversely tormented, and crowned with martyrdom after blessed confessions, in the persecution under the Emperors Marcus Antoninus Verus and Lucius Aurelius Commodus.

    In the same persecution there suffered at Rome the holy martyr Justin, the admirable philosopher.  He had presented to the emperors aforenamed his second book in defence of our religion, and was then earnestly spreading the same by his disputations when he was accused of Christianity through the devices of Crescens the Cynic, whose infamous life and manners he had rebuked, and for a reward of his faithful speaking he received the crown of martyrdom. We keep his feast upon the 14th day of this present month.

    Upon the same day, in the persecution under the Emperor Diocletian, the holy martyrs Maximus, Quintilian, and Dadas.

    At Ravenna, the holy Confessor Ursus, Bishop of that see.
