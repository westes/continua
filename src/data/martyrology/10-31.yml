# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-31"
text:
  la: |
    Romæ sanctórum Ampliáti, Urbáni et Narcíssi, quorum méminit sanctus Paulus ad Romános scribens, qui, ob Evangélium Christi, a Judǽis et Gentílibus cæsi sunt.

    Constantinópoli sancti Stachis Epíscopi, qui a beáto Andréa Apóstolo primus ejúsdem civitátis Epíscopus ordinátus est.

    Apud Augústam Veromanduórum, in Gállia, sancti Quinctíni, civis Románi et ex órdine Senatório viri, qui sub Maximiáno Imperatóre martýrium passus est; cujus corpus post annos quinquagínta quinque, revelánte Angelo, invéntum est incorrúptum.

    Medioláni sancti Antoníni, Epíscopi et Confessóris.

    Ratisbónæ, in Bavária, sancti Wolfgángi Epíscopi.

    Palmæ, in Majórca ínsula, sancti Alfónsi Rodríguez, Coadjutóris temporális formáti e Societáte Jesu et Confessóris, humilitáte ac jugi mortificatiónis stúdio insígnis; quem Leo Décimus tértius, Póntifex Máximus, Sanctórum fastis adscrípsit.

    Romæ Translátio beáti Nemésii Diáconi, et fíliæ Lucíllæ Vírginis, qui octávo Kaléndas Septémbris decolláti sunt.
  en: |
    The holy martyrs Ampliatus, Urban, and Narcissus, of whom mention is made by holy Paul, writing unto the Romans, and who were slain by the Jews and Gentiles for Christ's Gospel's sake.

    At Constantinople, the holy Archbishop Stachys, who was ordained by the blessed Apostle Andrew as the first Bishop of that city.

    At Saint-Quentin, in Gaul, holy Quentin, a Roman citizen of senatorial rank, who suffered martyrdom under the Emperor Maximian. His body was shown by the revelation of an Angel after fifty-five years, and was found incorrupt.

    At Milan, the holy Confessor Antoninus, Bishop.

    At Ratisbon, holy Wolfgang, Bishop.

    At Palma, in the island of Majorca, holy Alphonsus Rodriguez, lay Coadjutor of the Society of Jesus, and Confessor, remarkable for lowliness and continual zeal for mortification; whom Pope Leo XIII enrolled in the roll of the Saints.

    At Rome, the blessed Deacon Nemesius, and the Virgin Lucilla his daughter for as much as it was impossible to make them swerve from their faith in Christ, they were beheaded by order of the Emperor Valerian upon the 25th day of August. Their bodies were buried by blessed Pope Stephen; then, upon the 31st day of October, were laid in a more honourable place upon the Appian Way by blessed Xystus. Gregory V moved them to the Deaconry of St. Mary the New, along with those of the holy martyrs Symphronius, the Tribune Olympius, Exuperia his wife, and Theodulus his son, who had all been converted by the said Symphronius, and baptized by the said holy Stephen, and crowned with martyrdom. The bodies of these Saints were found in the church aforesaid in the time of the Supreme Pontiff Gregory XIII, and honourably reburied under the altar there upon the 8th day of December.
status:
  la: verified
  en: verified
