# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-16"
text:
  la: |
    Sanctórum Trium Puerórum, id est Ananíæ, Azaríæ et Misaélis; quorum córpora apud Babylóniam, sub quodam specu, sunt pósita.

    Ravénnæ sanctórum Mártyrum Valentíni, magístri mílitum, ejúsque fílii Concórdii, atque Navális et Agrícolæ; qui, in persecutióne Maximiáni, pro Christo passi sunt.

    Fórmiis, in Campánia, sanctæ Albínæ, Vírginis et Mártyris, sub Décio Imperatóre.

    In Africa pássio plurimárum sanctárum Vírginum, quæ, in persecutióne Wandálica, sub Ariáno Rege Hunneríco, suspéndia, póndera laminásque ignítas perpéssæ, martýrii agónem felíciter consummárunt.

    Viénnæ, in Gállia, beáti Adónis, Mónachi ex Ordine sancti Benedícti, Epíscopi et Confessóris.

    In Hibérnia sancti Beáni, primi, ut dícitur, Epíscopi.

    Gazæ, in Palæstína, sancti Ireniónis Epíscopi.
  en: |
    The three children Ananias, Azarias, and Misael, whose bodies are laid in a certain cave at Babylon.

    At Ravenna, the holy martyrs Valentine, a military instructor, Concordius his son, Navalis, and Agricola, who suffered for Christ's sake, in the persecution under the Emperor Maximian.

    At Nola, in Campania, in the persecution under the Emperor Decius, the holy Virgin and martyr Albina.

    In Africa, many holy Virgins and martyrs, who in the Vandal persecution under the Arian king Hunneric suffered hanging, pressing, and redhot plates, and happily brought to a close the conflict of martyrdom.

    At Vienne, the blessed Confessor Ado, monk of the Order of St Benedict, Bishop.

    In Ireland, holy Bean, called first Bishop.

    At Gaza, in Palestine, holy Bishop Irenion.
