# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-07"
text:
  la: |
    Neápoli, in Campánia, sancti Cajetáni Thienǽi Confessóris, Clericórum Regulárium Fundatóris, qui, singulári in Deum fidúcia, prístinam Apostólicam vivéndi formam suis coléndam trádidit, et, miráculis clarus, a Cleménte Papa Décimo inter Sanctos relátus est.

    Arétii, in Túscia, natális sancti Donáti, Epíscopi et Mártyris; qui, inter cétera virtútis ópera (ut scribit beátus Gregórius Papa), cálicem sanctum, a Pagánis fractum, orándo instaurávit. Is, in persecutióne Juliáni Apóstatæ, a Quadratiáno Augustáli comprehénsus, et, cum sacrificáre idólis renuísset, gládio percússus, martýrium consummávit. Passus est étiam cum eo beátus Hilarínus Mónachus; cujus memória décimo séptimo Kaléndas Augústi recólitur, quo die sacrum ipsíus corpus ad Ostia Tiberína translátum fuit.

    Romæ sanctórum Mártyrum Petri et Juliáni, cum áliis decem et octo.

    Medioláni sancti Fausti mílitis, qui, sub Aurélio Cómmodo, post multa certámina, martýrii palmam adéptus est.

    Novocómi, in agro Mediolanénsi, pássio sanctórum Mártyrum Carpóphori, Exánthi, Cássii, Severíni, Secúndi et Licínii; qui, in confessióne Christi, cápite truncáti sunt.

    Nísibi, in Mesopotámia, sancti Dométii, Mónachi Persæ, qui cum duóbus discípulis, sub Juliáno Apóstata, lapidátus est.

    Rotómagi sancti Victrícii Epíscopi, qui adhuc miles, sub eódem Juliáno, abjíciens pro Christo cíngulum, a Tribúno multis torméntis affícitur, et cápitis damnátur; sed, carnífice, qui ad eum cædéndum missus fúerat, cæcitáte percússo, ipse, vínculis solútis, liber evásit. Póstea, Epíscopus factus, indómitas Morinórum et Nerviórum gentes divíni prædicatióne verbi ad Christi fidem perdúxit, et demum Conféssor in pace quiévit.

    Cataláuni, in Gállia, sancti Donatiáni Epíscopi.

    Messánæ, in Sicília, sancti Albérti Confessóris, ex Ordine Carmelitárum, miráculis clari.
  en: |
    At Naples, in Campania, the holy Confessor Gaetan of Tiene, Founder of the Clerks Regular, who with wonderful confidence in God enjoined upon them the first way of living of the Apostles. He was famous for miracles, and Clement X. enrolled his name among those of the Saints.

    At Arezzo, in Tuscany, the holy martyr Donatus, Bishop, who among other miraculous deeds, by his prayers, as is related by blessed Pope Gregory, made whole again a sacred chalice which had been broken by pagans. He was arrested by the imperial officer Quadratian in the persecution under the Emperor Julian the Apostate, and for as much as he refused to sacrifice to idols he was beheaded, and so finished his testimony. There suffered also along with him the blessed monk Hilarinus, whose feast is kept upon the 16th day of July, being the day whereon his body was brought to Ostia.

    At Rome, the holy martyrs Peter and Julian, and eighteen others.

    At Milan, the holy soldier Faustus, who under the Emperor Aurelius Commodus, after many contendings, gained the crown of martyrdom.

    At Como, in the district of Milan, the holy martyrs Carpophorus, Exanthus, Cassius, Severinus, Secundus, and Licinius, who were beheaded, for confessing Christ.

    At Nisibis, in Mesopotamia, holy Dometius, a Persian monk, who was stoned to death with two of his disciples, under the Emperor Julian the Apostate.

    At Rouen, holy Vitricius, Bishop. He was a soldier who threw away his belt for Christ's sake under the same Emperor Julian. He was put to many torments by his Tribune, and condemned to death, but the executioner who had been sent to behead him was struck blind, and he got his bonds loosed, and escaped. He afterwards became a Bishop, and by his preaching of the word brought the unconquered tribes of the Morini and Nervii to believe in Christ, and at the last fell asleep in peace.

    At Châlons-sur-Marne, in Gaul, holy Donatian, Bishop.

    At Messina, in Sicily, the holy Confessor Albert, of the Order of Carmelites, famous for miracles.
status:
  la: verified
  en: verified
