# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "02-06"
text:
  la: |
    Cæsaréæ, in Cappadócia, natális sanctæ Dorótheæ, Vírginis et Mártyris; quæ, sub Saprício, illíus Provínciæ Prǽside, primum per equúlei extensiónem vexáta, dehinc palmis diutíssime cæsa, capitáli senténtia ad últimum puníta est. In ejus confessióne Theóphilus quidam scholásticus ad Christi fidem convérsus, et mox equúleo acérrime tortus, novíssime gládio cæsus est.

    Eméssæ, in Phœnícia, sancti Silváni Epíscopi, qui, cum eídem Ecclésiæ annis quadragínta præfuísset, tandem, sub Maximiáno Imperatóre, una cum duóbus áliis, objéctus feris membratímque discérptus, martýrii palmam accépit.

    Eódem die sanctórum Mártyrum Saturníni, Theóphili et Revocátæ.

    Arvérnis, in Gállia, sancti Antholiáni Mártyris.

    Atrébati, in Gálliis, sancti Vedásti, ejúsdem civitátis Epíscopi, cujus vita et mors plúrimis miráculis éxstitit gloriósa. Elnóne, in Gállia, sancti Amándi, Epíscopi Trajecténsis, qui miráculis, cum vivus tum mórtuus, glorióse refúlsit; cujus nómine póstmodum insignítum est óppidum, in quo ille monastérium exstrúxerat et mortálem vitam absólverat.

    Bonóniæ sancti Guaríni, Cardinális et Epíscopi Prænestíni, vitæ sanctitáte conspícui.
  en: |
    At Caesarea, in Cappadocia, the holy Virgin and martyr Dorothy, who under Sapricius, President of that province, was first racked, then long scourged with palm-branches, and at length put to death. At the sight of her sufferings a certain student, named Theophilus, was converted to Christ, and forthwith grievously racked, and at length beheaded.

    At Emessa, in Phoenicia, the holy Bishop Silvan, who, when he had been forty years in rule over that church, was cast to wild beasts along with two others, under the Emperor Maximian, and, torn to pieces, received the palm of martyrdom.

    On the same day the holy martyrs Saturninus, Theophilus, and Revocata.

    At Auvergne, in Gaul, the holy martyr Antholian.

    On the same day, holy Bishop Vedastus, and, holy Bishop Amandus, the first of whom ruled over the Church of Arras, the second the Church of Maastricht, whose lives and deaths were rendered glorious by diverse miracles.

    At Bologna, holy Guarinus, Cardinal Bishop of Palestrina, eminent for the holiness of his life.
status:
  la: verified
  en: verified
