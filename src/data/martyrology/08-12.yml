# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-12"
text:
  la: |
    Sanctæ Claræ Vírginis, primæ plantæ Páuperum Dominárum Ordinis Minórum, quæ Páuperes Clarissæ dicúntur; quæ ad ætérnas Agni núptias evocáta est prídie hujus diéi.

    Eódem die sanctórum Mártyrum Porcárii, Abbátis monastérii Lirinénsis, et Sociórum ejus quingentórum Monachórum; qui pro fide cathólica, a bárbaris cæsi, martýrio coronáti sunt.

    Cátanæ, in Sicília, natális sancti Eúpli Diáconi, sub Diocletiáno et Maximiáno Augústis; qui, cum diutíssime pro confessióne Dómini tortus esset, tandem martýrii palmam, gládio cædénte, percépit.

    Augústæ Vindelicórum sanctæ Hiláriæ, quæ, cum esset beátæ Afræ Mártyris mater et ad sepúlcrum illíus excubáret, ibídem, pro fide Christi, a persecutóribus igni trádita est cum Digna, Euprépia et Eunómia, ancíllis suis. Passi sunt étiam eódem die, in præfáta urbe, Quiríacus, Lárgio, Crescentiánus, Nímmia et Juliána, cum áliis vigínti.

    In Sýria sanctórum Mártyrum Macárii et Juliáni.

    Nicomedíæ sanctórum Mártyrum Anicéti Cómitis, et Photíni fratris, cum áliis plúribus, sub Diocletiáno Imperatóre.

    Falériæ, in Túscia, sub Galério Maximiáno, pássio sanctórum Graciliáni, et Felicíssimæ Vírginis, quorum pro fídei confessióne ora lapídibus primo contúsa sunt; dehinc ambo, gládio percússi, optátam martýrii palmam suscepérunt.

    Medioláni deposítio sancti Eusébii, Epíscopi et Confessóris.

    Bríxiæ sancti Herculáni Epíscopi.
  en: |
    At Assisi, in Umbria, the holy Virgin Clare, the first of the women of the Order of Friars Minors, who are called Poor Clares. Her life and miracles were famous, and Pope Alexander IV enrolled her name among those of the holy virgins.

    At Catania, in Sicily, in the persecution under the Emperors Diocletian and Maximian, the holy Deacon Euplius. He was long put to the torture for confessing the Lord, and at length beheaded, and so received the crown of martyrdom.

    At Augsburg, the holy Hilaria, the mother of the blessed martyr Afra. She was watching at her grave when she was taken by persecutors, and for Christ's faith's sake committed to the fire, along with her handmaidens Digna, Euprepia, and Eunomia.

    In the same city, upon the same day, there suffered also Quiriacus, Largis, Crescentian, Nimmia, Juliana, and twenty others.

    In Syria, the holy martyrs Macarius and Julian.

    At Nicomedia, under the Emperor Diocletian, the holy martyrs Count Anicete, his brother Photinus, and many others.

    At Civita Castellana, in Tuscany, under Galerius Maximianus, the holy martyr Gracilian and the Virgin Felicissima. Because they confessed the faith, their mouths were first bruised with stones, and then they were smitten with the sword, and so received that palm of martyrdom which they had desired.

    On the same day, the holy martyrs Porcarius, Abbot of the monastery of Lerins, and five hundred monks, crowned with martyrdom, slain by the barbarians for the Catholic faith's sake.

    At Milan, the holy Confessor Eusebius, Bishop.

    At Brescia, holy Herculanus, Bishop.
