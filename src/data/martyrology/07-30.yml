# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "07-30"
text:
  la: |
    Romæ sanctórum Mártyrum Abdon et Sennen Persárum, qui, sub Décio, caténis alligáti et Romam addúcti, pro Christi fide prius plumbátis cæsi sunt, deínde gládio interfécti.

    Assísii, in Umbria, sancti Rufíni Mártyris.

    Tubúrbi Lucernáriæ, in Africa, pássio sanctárum Vírginum Máximæ, Donatíllæ et Secúndæ; quarum duæ primæ, in persecutióne Valeriáni et Galliéni, acéto et felle potátæ, deínde plagis acérrimis cæsæ et equúlei extensióne cruciátæ, cratículis étiam exústæ et calce perfricátæ, póstmodum cum Secúnda, Vírgine duódecim annórum, ad béstias simul projéctæ, sed ab his intáctæ, novíssime gládio jugulátæ sunt.

    Cæsaréæ, in Cappadócia, sanctæ Julíttæ Mártyris, quæ, cum bona sua, a quodam poténte sibi usurpáta, in judício repéteret, atque ille exceptiónem daret quod ut Christiána non debéret audíri, mox a Júdice jussa est thus idólis offérre, ut posset audíri. Quod illa constánter recúsans, in ignem conjécta est, sicque spíritum Deo réddidit; corpus autem a flamma remánsit illǽsum. Ejus præcláras laudes sanctus Basilíus Magnus egrégio encómio celebrávit.

    Antisiodóri sancti Ursi, Epíscopi et Confessóris.
  en: |
    At Rome, the holy martyrs Abdon and Sennen. These were Persians who were brought to Rome in bonds under Decius. They were first hided with scourges loaded with lead, and then slain with the sword.

    At Assisi, in Umbria, the holy martyr Rufinus.

    At Tuburbe, in Africa, the holy Virgin martyrs Maxima, Donatilla, and Secunda. In the persecution under Valerian and Gallienus, Maxima and Donatilla were given vinegar and gall to drink, then severely hided and racked, burnt over gratings, and rubbed with lime. Afterward, they were thrown to the beasts along with Secunda, a virgin of twelve years of age, but as the beasts would not touch them they were all slain with the sword.

    At Caesarea, in Cappadocia, the holy martyr Julitta. She raised a law plea against a certain great man who had spoiled her goods, and he pleaded against her that being a Christian she could not be heard, whereupon the judge commanded her to offer some incense to the idols in order that she might be able to plead. She firmly refused, and was cast into the fire, where she resigned her soul to God, but the fire did not hurt her body. Her famous praises have been set forth by holy Basil the Great in a noble discourse.

    At Auxerre, the holy Confessor Ursus, Bishop.
