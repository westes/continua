# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "12-27"
text:
  la: |
    Apud Ephesum natális sancti Joánnis, Apóstoli et Evangelístæ, qui, post Evangélii scriptiónem, post exsílii relegatiónem et Apocalýpsim divínam, usque ad Trajáni Príncipis témpora persevérans, totíus Asiæ fundávit rexítque Ecclésias, ac tandem, conféctus sénio, sexagésimo octávo post passiónem Dómini anno mórtuus est, et juxta eándem urbem sepúltus.

    Constantinópoli sanctórum Confessórum Theodóri et Theóphanis fratrum, qui, a puerítia in Palæstinénsi sancti Sabbæ monastério nutríti, cum póstea pro sanctárum Imáginum cultu advérsus Leónem Arménum strénue decertárent, ejus jussu verbéribus affécti sunt et exsílio relegáti. Sed, eódem Leóne mórtuo, rursus Theóphilo Imperatóri, qui eádem impietáte detinebátur, constánter resisténtes, verbéribus íterum cæsi et in exsílium pulsi sunt, ubi Theodórus in cárcere exspirávit. Theóphanes vero, pace demum Ecclésiæ réddita, factus est Nicǽnæ civitátis Epíscopus, et confessiónis glória præclárus quiévit in Dómino.

    Alexandríæ sancti Máximi Epíscopi, qui satis clarus et insígnis título confessiónis efféctus est.

    Constantinópoli sanctæ Nicáretes Vírginis, quæ, sub Arcádio Imperatóre, cláruit sanctitáte.
  en: |
    At Ephesus, the holy Apostle and Evangelist John. After the writing of his Gospel after his return from exile, and after the Revelation which God gave unto him, he lived on until the time of the Emperor Trajan, and founded and governed the churches of all Asia. He died of old age in the sixty-eighth year after the death of Christ, and was buried hard by the city of Ephesus.

    At Constantinople the holy brethren Theodore and Theophanes. They were bred up from their childhood in the monastery of St. Saba, and afterwards stoutly contended for the honouring of holy images against the Emperor Leo the Armenian, for the which he caused them to be beaten and sent into exile, and after his death they still stoutly withstood the Emperor Theophilus, who was held captive by the same ungodliness, for the which he also caused them to be again beaten and driven into exile. Theodore died in prison, but Theophanes, after that peace was given back to the Church, was made Bishop of Nice, and fell asleep in peace in the Lord.

    At Alexandria, holy Maximus, Pope of that See, who was eminently worthy to be called a confessor.

    Likewise, at Constantinople, the holy virgin Niceras, who was eminent for her holiness, in the time of the Emperor Arcadius.
status:
  la: verified
  en: verified
