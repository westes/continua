# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "11-04"
text:
  la: |
    Sancti Cároli Borromǽi Cardinális, Epíscopi Mediolanénsis et Confessóris, qui migrávit in cælum prídie hujus diéi.

    Bonóniæ sanctórum Mártyrum Vitális et Agrícolæ; quorum prior posterióris servus ántea fuit, póstea consors et colléga martýrii. In ipsum porro Vitálem persecutóres ómnia tormentórum génera ita exercuérunt, ut non esset in córpore ejus sine vúlnere locus, quæ ipse constánter pérferens, in oratióne spíritum Deo réddidit; Agrícolam vero, plúrimis clavis cruci affigéntes, interemérunt. Eórum translatióni sanctus Ambrósius cum interésset, Mártyris clavos, sánguinem triumphálem et crucis lignum se collegísse refert, ac sub sacris altáribus condidísse.

    In cœnóbio Cervi Frígidi, territórii Meldénsis, natális sancti Felícis Valésii, Presbýteri et Confessóris; qui Fundátor fuit Ordinis sanctíssimæ Trinitátis redemptiónis captivórum. Ipsíus autem festum, ex dispositióne Innocéntii Papæ Undécimi, celebrátur duodécimo Kaléndas Decémbris.

    Eódem die natális quoque sanctórum Philólogi et Pátrobæ, sancti Pauli Apóstoli discipulórum.

    Augustodúni sancti Próculi, Epíscopi et Mártyris.

    Myræ, in Lýcia, sanctórum Mártyrum Nicándri Epíscopi, et Hermæ Presbýteri, sub Libánio Prǽside.

    In pago Vilcassíno, in Gállia, sancti Clari, Presbýteri et Mártyris.

    Ephesi sancti Porphýrii Mártyris, sub Aureliáno Imperatóre.

    Apud Ruthénos, in Gállia, beáti Amántii Epíscopi, cujus vita éxstitit sanctitáte et miráculis gloriósa.

    Romæ natális sancti Piérii, Presbýteri Alexandríni, qui, in divínis Scriptúris nobíliter erudítus, vita puríssimus, et ad Christiánam philosophíam nudus pénitus et expedítus, sub Caro et Diocletiáno Princípibus, regénte Alexandrínam Ecclésiam Theóna, florentíssime dócuit pópulum, et divérsos tractátus édidit; post persecutiónem vero, omne vitæ suæ tempus Romæ versátus, in pace quiévit.

    In Bithýnia sancti Joannícii Abbátis.

    Apud Albam Regálem, in Pannónia, deposítio beáti Emeríci Confessóris, qui fuit fílius sancti Stéphani, Hungarórum Regis.

    Tréviris sanctæ Modéstæ Vírginis.
  en: |
    At Milan, holy Charles Borromeo, Cardinal Archbishop of that city, eminent for holiness and famous for miracles, whose name Paul V enrolled among those of the Saints.

    At Bologna, the holy martyrs Vitalis and Agricola. Vitalis was a slave belonging to Agricola, to whom, in suffering martyrdom, he became an equal and a companion.  Upon Vitalis the persecutors exercised every kind of torment, until there was no place in his body without some wound. He bore all steadfastly, and gave up his soul in prayer to God. While they were nailing Agricola with many nails to a cross they thereby killed him. Holy Ambrose was present at the translation of their bodies, and saith that he gathered together the nails of this martyr, his victorious blood, and the wood of his cross, and buried them under the holy altar.

    On the same day, the holy martyrs Philologus and Patrobas, disciples of the holy Apostle Paul. (According to the Greek tradition Patrobas was Bishop of Pozzuoli and then of Naples, and Philologus of Sinope, in Paphlagonia.) At Autun, the holy martyr Proculus.

    In the Vexin, the holy martyr Clarus, a Priest.

    At Ephesus, under the Emperor Aurelian, the holy martyr Porphyry.

    At Myra, in Lycia, under the President Libanius, the holy martyrs Nicander, Bishop, and Hermas, a Priest.

    Upon the same day, the holy Pierius, a Priest of Alexandria, profoundly learned in the Scriptures of God, unblemished in life, and for Christian philosophy's sake stripped nearly of all things, and unattached. He taught the people of Alexandria admirably while Theonas ruled that Church in the time of the Princes Carus and Diocletian, and published diverse treatises. After the persecution was over he spent the rest of his life at Rome, and there fell asleep in peace.

    At Rodez, in Gaul, the blessed Amantius, Bishop, whose life remains glorious on account of his holiness and miracles.

    In Bithynia, the holy Abbot Joannicius.

    At Albe-Royale, in Hungary, the blessed Confessor Emeric, son of holy Stephen, King of Hungary.

    In the monastery of Cerfroi, in the country of Meaux, holy Felix de Valois, Founder of the Order of the Most Holy Trinity for the Redemption of Captives, whose feast is kept by decree of Innocent XI upon the 20th day of this same month of November, but by us upon the 26th day of the same.

    At Trier, the holy Virgin Modesta.
