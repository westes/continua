# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "09-17"
text:
  la: |
    In monte Alvérniæ, in Etrúria, commemorátio Impressiónis sacrórum Stígmatum, quibus sanctus Francíscus, Ordinis Minórum Institútor, in suis mánibus, pédibus et látere, mirábili Dei grátia, impréssus fuit.

    Romæ natális sancti Robérti Bellarmíno, Confessóris, e Societáte Jesu, atque Cardinális et Capuáni olim Epíscopi, sanctitáte, doctrína, et plúrimis ad cathólicæ fídei et Apostólicæ Sedis defensiónem suscéptis labóribus claríssimi; quem Pius Undécimus, Póntifex Máximus, Sanctórum honóribus auxit et universális Ecclésiæ Doctórem declarávit, ejúsque festum tértio Idus Maji recoléndum indíxit.

    Romæ, via Tiburtína, natális sancti Justíni, Presbýteri et Mártyris; qui, in persecutióne Valeriáni et Galliéni, ob confessiónis glóriam fuit insígnis. Hic beáti Pontíficis Xysti Secúndi, Lauréntii, Hippólyti aliorúmque plurimórum Sanctórum córpora sepelívit, ac demum, sub Cláudio, martýrium consummávit.

    Item Romæ sanctórum Mártyrum Narcíssi et Crescentiónis.

    Apud Leódium, in Bélgio, beáti Lambérti, Epíscopi Trajecténsis, qui, cum régiam domum zelo religiónis increpásset, a nocéntibus ínnocens occísus est, sicque aulam regni cæléstis perpétuo victúrus intrávit.

    Cæsaraugústæ, in Hispánia, sancti Petri de Arbues, primi in Aragóniæ regno Quæsitóris fídei; quem, a relápsis Judǽis ob eándem, quam pro múnere suo strénue tuebátur, cathólicam fidem, immániter trucidátum, sanctórum Mártyrum catálogo Pius Papa Nonus adjúnxit.

    In Británia sanctórum Mártyrum Sócratis et Stéphani.

    Noviodúni, in Gálliis, sanctórum Mártyrum Valeriáni, Macríni et Gordiáni.

    Augustodúni sancti Flocélli púeri, qui, sub Antoníno Imperatóre et Valeriáno Prǽside, multa passus, demum, a feris discérptus, martýrii corónam adéptus est.

    Córdubæ, in Hispánia, sanctæ Colúmbæ, Vírginis et Mártyris.

    In Phrýgia sanctæ Ariádnæ Mártyris, sub Hadriáno Imperatóre.

    Eódem die sanctæ Agathoclíæ, quæ, cum esset ancílla cujúsdam mulíeris infidélis, a dómina sua longo témpore verbéribus aliísque ærúmnis est vexáta ut Christum negáret; demum, obláta Júdici ac sǽvius laniáta, et nihilóminus in confessióne fídei persístens, ídeo, post excisiónem linguæ, in ignem projécta est.

    Medioláni deposítio sancti Sátyri Confessóris, cujus insígnia mérita sanctus Ambrósius, ejus frater, commémorat.

    Apud Bíngiam, in diœcési Moguntinénsi, sanctæ Hildegárdis Vírginis.

    Romæ sanctæ Theodóræ matrónæ, quæ, in persecutióne Diocletiáni, sanctis Martýribus sédulo ministrábat.
  en: |
    The making of the sacred marks which God was pleased by a wonderful grace to make upon the hands, feet, and side of holy Francis, Founder of the Order of Friars Minor, upon Mount Alvernia in Tuscany.

    Upon the same 17th day of September, were born into the better life:

    At Rome, the birthday of holy Robert Bellarmine, Confessor, of the Society of Jesus, Cardinal, and sometime Bishop of Capua, most renowned for holiness, learning, and the many labours he undertook for the defence of the Catholic faith and of the Apostolic See; whom Pope Pius XI advanced to the honours of the Saints and declared Doctor of the universal Church, and appointed his feast to be kept upon the 13th day of May.

    At Rome, upon the Tiburtine Way, the holy martyr Justin, a Priest who was famous for his glorious confession of Christ in the persecution under the Emperors Valerian and Gallienus. He buried the bodies of the blessed Pope Xystus, of Lawrence, of Hippolytus, and of many other saints, and at length himself achieved martyrdom under Claudius.

    Likewise at Rome, the holy martyrs Narcissus and Crescentio.

    In Phrygia, holy Ariadne, martyred under the Emperor Hadrian.

    In Britain, the holy martyrs Socrates and Stephen.

    At Nyon, the holy martyrs Valerian, Macrinus, and Gordian.

    At Autun, the holy lad Flocellus, who suffered many things under the Emperor Antonine and the President Valerian, and at last was torn by wild beasts, and so received the crown of martyrdom.

    At Liege, blessed Lambert, Bishop of Maastricht. In his godly zeal he rebuked the Royal House, whereupon the saint was slain by the sinners, and he went hence to live for ever in a mansion in the kingdom of heaven.

    At Zaragoza, in Spain, holy Peter of Arbues, the first Inquisitor of the Faith in the kingdom of Aragon, who was cruelly murdered by some relapsed Jews for the sake of that Catholic faith which in his office he was zealously protecting. Pope Pius IX enrolled his name among those of the holy martyrs.

    Upon the same day, the holy Agathoclia, the handmaid of a certain unbelieving woman, who afflicted her of a long time with stripes and other sufferings, to make her deny Christ, and at length brought her before the judge, by whose orders she was very cruelly mangled and forasmuch as she still remained firm in the confession of the faith, her tongue was cut out, and she was cast into the fire.

    At Cordova, the holy Virgin and martyr Columba.

    At Milan, the holy Confessor Satyrus, whose excellences are recorded by his holy brother Ambrose.

    At Rome, the holy Matron Theodora, who ministered constantly to the holy martyrs in the persecution under Diocletian.

    At Bingen, in the diocese of Mainz, the holy Virgin Hildegard.
