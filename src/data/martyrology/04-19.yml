# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-19"
text:
  la: |
    Corínthi natális sancti Timónis, qui fuit unus de septem primis Diáconis. Hic primo apud Beroéam Doctor resédit, ac deínde, verbum Dómini disséminans, venit Corínthum; ibíque, a Judǽis et Græcis (ut tráditur) injéctus flammis, sed nihil læsus, demum, cruci affíxus, martýrium suum implévit.

    Cantuáriæ, in Anglia, sancti Elphegi, Epíscopi et Mártyris.

    Melitínæ, in Arménia, sanctórum Mártyrum Hermógenis, Caji, Expedíti, Aristoníci, Rufi et Gálatæ, qui omnes una die sunt coronáti.

    Caucolíberi, in Hispánia Tarraconénsi, pássio sancti Vincéntii Mártyris.

    Eódem die sanctórum Mártyrum Sócratis et Dionýsii, qui lánceis confóssi sunt.

    Hierosólymis sancti Paphnútii Mártyris.

    Romæ sancti Leónis Papæ Noni, virtútum et miraculórum laude insígnis.

    Antiochíæ Pisídiæ sancti Geórgii Epíscopi, qui, ob sanctárum Imáginum cultum, exsul occúbuit.

    In cœnóbio Laubiénsi, in Bélgio, sancti Ursmári Epíscopi.

    Floréntiæ sancti Crescéntii Confessóris, qui fuit discípulus beáti Zenóbii Epíscopi.
  en: |
    At Canterbury, in England, the holy martyr Elphege, Bishop of that see.

    At Corinth, the holy martyr Timon, one of the seven first Deacons. He first dwelt as a teacher at Berea, and thence came, spreading the word of God as far as Corinth there he is said to have been cast into the fire by the Jews and Greeks, but remained unharmed, and was crucified. [He was successively Bishop of Tyre and of Bostra. He preached in Berea, Corinth, the island of Cyprus where he prepared the way for St. Barnabas, Phoenicia, and Arabia.]

    At Malathia, in Armenia, the holy martyrs Hermogenes, Caius, Expeditus, Aristonicus, Rufus, and Galata, who were all crowned upon one and the same day.

    At Cancavella, in Catalonia, the holy martyr Vincent.

    On the same day, the holy martyrs Socrates and Denis, who were run through with lances.

    At Jerusalem, the holy martyr Paphnutius.

    At Antioch, in Pisidia, holy George, Bishop of that see, who died in exile for the honouring of holy images.

    At Rome, the holy Pope, Leo IX, illustrious for his grace and the fame of his miracles. [He is the same as St. Bruno, 40th Bishop of Toul.]

    In the monastery of Lobbes, holy Bishop Ursmar.

    At Florence, the holy Confessor Crescentius, disciple of the blessed Zenobius, Bishop [of that see. Among the early Bishops of the church of Florence, St. Zenobius, the 5th of that see, is celebrated. He was elected about the year 376 and ministered till the year 407. He buried his sub-deacon St. Crescent with his own hands. St. Crescent is mentioned by St Ambrose.]
