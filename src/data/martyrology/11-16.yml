# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "11-16"
text:
  la: |
    Sanctæ Gertrúdis Vírginis, cujus natális sequénti die recensétur.

    Edimbúrgi, in Scótia, natális sanctæ Margarítæ Víduæ, Scotórum Regínæ, amóre in páuperes et voluntária paupertáte célebris. Ipsíus tamen festívitas quarto Idus Júnii celebrátur.

    In Africa sanctórum Mártyrum Rufíni, Marci, Valérii et Sociórum.

    Eódem die sanctórum Mártyrum Elpídii, Marcélli, Eustóchii et Sociórum; ex quibus Elpídius, cum esset órdinis Senatórii et coram Juliáno Apóstata Christiánam fidem constantíssime profiterétur, ídeo, primum equis indómitis, una cum Sóciis, alligátus atque pertráctus, deínde, in ignem conjéctus, gloriósum martýrium consummávit.

    Lugdúni, in Gállia, natális sancti Euchérii, Epíscopi et Confessóris, viri admirándæ fídei et doctrínæ. Hic, ex nobilíssimo Senatórum órdine ad religiósam vitam habitúmque convérsus, diu, intra septa spelúncæ sponte conclúsus, in oratiónibus et jejúniis Christo servívit; deínde apud præfátam urbem in pontificáli Cáthedra, revelánte Angelo, solémniter collocátus est.

    Patávii sancti Fidéntii Epíscopi.

    Cantuáriæ, in Anglia, sancti Edmúndi, Epíscopi et Confessóris; qui, pro Ecclésiæ suæ júribus tuéndis in exsílium actus, apud Provínum, Sénonum óppidum, sanctíssime óbiit; et Sanctórum cánoni ab Innocéntio Papa Quarto adscríptus est.

    Eódem die deposítio sancti Othmári Abbátis.
  en: |
    At Edinburgh, in Scotland, the birthday of holy Margaret, Widow, Queen of the Scots, renowned for her love of the poor and voluntary poverty. Her feast, however, is kept upon the 10th day of June.

    Holy Gertrude, Virgin, whose birthday is recorded upon the next day.

    At Canterbury, in England, the holy Confessor Edmund Rich, Archbishop of that see, who was driven into exile for his defense of the rights of his Church, and died a holy death near Provins, and whose name Innocent IV enrolled among those of the Saints.

    In Africa, the holy martyrs Rufinus, Mark, Valerius, and their Companions.

    On the same day, the holy martyrs Elpidius, Marcellus, Eustochius, and their Companions. Elpidius was of the Senatorial Order, and steadfastly confessed the Christian faith in the presence of the Emperor Julian the Apostate. He and his Companions were first tied to unbroken horses, and so dragged about, but afterwards cast into the fire, and so achieved a glorious martyrdom.

    At Lyon, the holy Confessor Eucherius, Bishop of that see, a man of wonderful faith and teaching. He was of the noblest of the Senatorial Order, and adopted the life and dress of a monk. For a long while he shut himself up in a cave, where he served Christ in fastings and prayers. He was called through the revelation of an angel to occupy the See of Lyons, and was therein solemnly placed.

    At Padua, holy Fidentius, Bishop.

    On the same day, the holy Othmar, Abbot (of St. Gall, in Switzerland.)
