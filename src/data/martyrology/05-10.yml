# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "05-10"
text:
  la: |
    Romæ, via Latína, natális sanctórum Mártyrum Gordiáni et Epímachi, quorum prior, pro confessióne nóminis Christi, témpore Juliáni Apóstatæ, diu plumbátis cæsus et ad últimum cápite truncátus, noctu a Christiánis sepúltus eádem via fuit in crypta, in quam beáti Epímachi Mártyris relíquiæ paulo ante translátæ fúerant ab Alexándria, ubi ipse, pro Christi fide, martýrium compléverat prídie Idus Decémbris.

    In terra Hus sancti Job Prophétæ, admirándæ patiéntiæ viri.

    Romæ beáti Calepódii, Presbýteri et Mártyris; quem Alexánder Severus Imperátor gládio fecit occídi, et corpus ejus per civitátem trahi, atque in Tíberim jactári, quod invéntum Callístus Papa sepelívit. Decollátus est étiam Palmátius Consul cum uxóre et fíliis et áliis promíscui sexus quadragínta duóbus de domo sua, Simplícius quoque Senátor cum uxóre et sexagínta octo de família sua, item et Felix cum uxóre sua Blanda; quorum cápita suspénsa sunt per divérsas portas Urbis, ad exémplum Christianórum.

    Item Romæ, via Latína, ad Centum Aulas, natális sanctórum Mártyrum Quarti et Quincti, quorum córpora Cápuam transláta sunt.

    Apud Leontínos, in Sicília, sanctórum Mártyrum Alphíi, Philadélphi et Cyríni.

    Smyrnæ sancti Dioscóridis Mártyris.

    Apud Taréntum sancti Catáldi Epíscopi, miráculis clari.

    Matríti sancti Isidóri Agrícolæ, quem, miráculis clarum, Gregórius Papa Décimus quintus, una cum sanctis Ignátio, Francísco Xavério, Terésia et Philíppo Nério, in Sanctórum númerum rétulit.

    Medioláni Invéntio sanctórum Mártyrum Nazárii et Celsi, in qua beátus Ambrósius Epíscopus corpus sancti Nazárii recenti adhuc sánguine conspérsum réperit, atque ad Basílicam Apostolórum tránstulit, una cum córpore beáti Celsi púeri, quem idem ipse Nazárius nutríerat, et Anolínus, in Nerónis persecutióne, simul cum eo feríri gládio jússerat quinto Kaléndas Augústi; quo die festívitas gloriósi eórum martýrii celebrátur.
  en: |
    At Rome, on the Latin Way, the birthday of the holy martyrs Gordian and Epimachus. Gordian was long beaten with whips loaded with lead, and at last beheaded, in the time of the Emperor Julian the Apostate, because of his confession of Christ's Name. The Christians buried his body at night upon the aforesaid Latin Way, in the same underground place whither had a little while before been brought from Alexandria the remains of the blessed martyr Epimachus, who had there suffered martyrdom for believing in Christ.

    In the land of Uz is commemorated the holy prophet Job, a man of wondrous patience.

    At Rome, the blessed priest and martyr Calepodius, whom the Emperor Alexander Severus caused to be slain with the sword, and his body to be dragged through the city and cast into the Tiber; when it had been found it was buried by Pope Callistus. Moreover, at Rome also, there were beheaded the Consul Palmatius, along with his wife and children and forty-two others of both sexes of his house; also the Senator Simplicius, with his wife and sixty-eight of his household; also Felix, with his wife Blanda. Their heads were hung up at the different gates of the city to be a terror to Christians.

    Also at Rome, at the Hundred Halls, upon the Latin Way, are commemorated the holy martyrs Quartus and Quintus, whose bodies were taken to Capua.

    At Lentini, in Sicily, the holy martyrs Alphius, Philadelphus, and Cyrinus.

    At Smyrna, the holy martyr Dioscoredes.

    At Taranto, the holy Catald, Bishop famous for wonders.

    At Madrid, the holy Isidore the husbandman, famous for wonders, whom Pope Gregory XV enrolled in the list of the Saints along with holy Ignatius of Loyola, Francis Xavier, Teresa, and Philip Neri.

    At Milan is commemorated the finding of the bodies of the holy martyrs Nazarius and Celsus. The blessed Bishop Ambrose found the body of holy Nazarius still marked with fresh blood, and took it to the Cathedral Church of the Apostles along with the body of the blessed child Celsus, to whom Nazarius had been foster-father. In the persecution under Nero, Anolinus commanded them both together to be slain with the sword upon the 29th day of July, upon the which day is kept the feast of their martyrdom.
status:
  la: verified
  en: verified
