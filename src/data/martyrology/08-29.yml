# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "08-29"
text:
  la: |
    Romæ, in monte Aventíno, natális sanctæ Sabínæ Mártyris, quæ sub Hadriáno Imperatóre, gládio percússa, martýrii palmam adépta est.

    Veliniáni, in confínibus Apúliæ, pássio sanctórum Vitális, Satóris et Repósiti; qui, sanctórum Bonifátii et Theclæ fílii, a Valeriáno Júdice, sub Maximiáno Imperatóre, capitálem senténtiam pertulérunt. Eórum tamen ac ceterórum ex duódecim frátribus memória Kaléndis Septémbris recólitur.

    Romæ sanctæ Cándidæ, Vírginis et Mártyris; cujus corpus beátus Paschális Primus Papa in Ecclésiam sanctæ Praxédis tránstulit.

    Constantinópoli sanctórum Mártyrum Hypátii, Asiáni Epíscopi, et Andréæ Presbýteri; qui ambo, ob cultum sanctárum Imáginum, sub Leóne Isáurico, barba pice íllita atque incénsa, et cute cápitis extrácta, juguláti sunt.

    Antiochíæ natális sanctórum Mártyrum Nicǽæ et Pauli.

    Metis, in Gállia, sancti Adélphi, sexti Epíscopi et Confessóris.

    Lutétiæ Parisiórum deposítio sancti Mederíci Presbýteri.

    Perúsiæ sancti Euthýmii Románi, qui, cum uxóre et Crescéntio fílio persecutiónem Diocletiáni fúgiens, ad eam urbem secéssit, et ibi póstmodum quiévit in Dómino.

    In Anglia sancti Sebbi Regis.

    Apud Sírmium natális sanctæ Basíllæ Vírginis.

    In pago Tricassíno sanctæ Sabínæ Vírginis, virtútibus et miráculis gloriósæ.
  en: |
    At Rome, upon the Aventine Mount, the holy martyr Sabina, who under the Emperor Hadrian was smitten with the sword, and so gained the palm of martyrdom.

    At Velinano, on the borders of Apulia, the passion of the holy martyrs Vitalis, Satorus, and Repositus; who, being sons of the holy Boniface and Thecla, suffered sentence of death at the hands of Valerian the Judge, under the Emperor Maximian. Their memory, however, and that of the rest of the twelve brethren, is kept upon the 1st day of September.

    Likewise at Rome, the holy Virgin and martyr Candida, whose body Pope Paschal I. brought to the Church of St. Praxedes.

    At Constantinople, the holy martyrs Hypatius, a Bishop of Asia, and Andrew, a Priest, who were killed, under the Emperor Leo the Isaurian, for the reverence due to the holy images, after their beards had been filled with pitch and set on fire, and their heads flayed.

    At Antioch, in Syria, the holy martyrs Nicasas and Paul.

    At Metz, the holy Confessor Adelphus, sixth Bishop.

    At Paris, the holy Priest Mederic.

    At Perugia, holy Euthymius, a Roman, who fled thither along with his wife and Crescentius his son, to escape the persecution under the Emperor Diocletian, and there fell asleep in the Lord.

    In England, holy Seb, King.

    At Smyrna, holy Basilla.

    In the country of Troyes, the holy Virgin Sabina, glorious for her graces and miracles.
