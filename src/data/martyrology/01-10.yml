# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "01-10"
text:
  la: |
    In Thebáide natális beáti Pauli, primi Eremítæ, Confessóris, qui, a sextodécimo ætátis suæ anno usque ad centésimum décimum tértium, solus in erémo permánsit; cujus ánimam, inter Apostolórum et Prophetárum choros, ad cælum ferri ab Angelis sanctus Antónius vidit. Ejus autem festívitas décimo octávo Kaléndas Februárii celebrátur.

    In Cypro beáti Nicánoris, qui fuit unus de septem primis Diáconis; atque, grátia fídei et virtúte admirándus, gloriosíssime coronátus est.

    Romæ sancti Agathónis Papæ, qui, sanctitáte et doctrína conspícuus, quiévit in pace.

    Bitúricis, in Aquitánia, sancti Willhélmi, Epíscopi et Confessóris, signis et virtútibus clari; quem Honórius Papa Tértius in Sanctórum cánonem adscrípsit.

    Medioláni sancti Joánnis Boni, Epíscopi et Confessóris.

    Constantinópoli sancti Marciáni Presbýteri.

    In monastério Cuxanénsi, in Gállia, natális sancti Petri Urséoli Confessóris, qui, ántea Venetiárum Dux et deínde Monáchus ex Ordine sancti Benedícti, pietáte et virtútibus cláruit.

    Arétii, in Túscia, Beáti Gregórii Décimi, civis Placentíni, qui, ex Archidiácono Leodiénsi Summus Póntifex renuntiátus, Concílium Lugdunénse secúndum celebrávit, Græcísque ad unitátem fídei recéptis, compósitis Christianórum dissídiis, Terræ Sanctæ recuperatióne institúta, de universáli Ecclésia, quam sanctíssime gubernávit, óptime méritus est.
  en: |
    In Cyprus, the blessed Nicanor, one of the seven first Deacons, who was wondrous for the grace of faith and power, and received a most glorious crown.

    At Rome, the holy Pope Agatho, who was eminent for holiness and learning, and fell asleep in peace.

    At Bourges, in Aquitaine, the holy Confessor William, Archbishop, famous for signs and works of power, whose name Honorius III enrolled with those of the saints.

    At Milan, the holy Confessor John, surnamed the Good, Archbishop of that city.

    In the Thebaid, blessed Paul, the first Hermit, who from the sixteenth even unto the hundred and thirteenth year of his age dwelt alone in the desert, holy Anthony saw his soul borne heavenward by angels between the choirs of the Apostles and of the Prophets. We keep his feast upon the 15th day of this present month of January.

    At Constantinople, the holy Priest Marcian.

    In the monastery of Cusan, (in the diocese of Perpignan,) the holy Confessor Peter Urseoli, who was sometime Doge of Venice, and then became a monk of the Order of St. Benedict, and was famous for godliness and works of power.

    At Arezzo, in Tuscany, blessed Gregory X, a citizen of Piacenza, who, being Archdeacon of Liege, was proclaimed Supreme Pontiff. He held the Second Council of Lyon, received the Greeks into the unity of the faith, composed the quarrels of Christians, and set on foot the recovery of the Holy Land; and he deserved right well of the whole Church, which he governed most holily.
