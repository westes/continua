# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "05-15"
text:
  la: |
    Sancti Joánnis Baptístæ de La Salle, Presbýteri et Confessóris, qui Sodalitátis Fratrum Scholárum Christianárum fuit Institútor, ac séptimo Idus Aprílis obdormívit in Dómino.

    In Hispánia sanctórum Torquáti, Ctesiphóntis, Secúndi, Indalétii, Cæcílii, Hesýchii et Euphrásii; qui Romæ a sanctis Apóstolis Epíscopi ordináti, et ad prædicándum verbum Dei in Hispánias dirécti sunt. Cum autem hi váriis úrbibus evangelizássent, et innúmeras multitúdines ad Christi fidem perduxíssent, divérsis in ea província locis quievérunt; scílicet Torquátus Acci, Ctésiphon Vérgii, Secúndus Abulæ, Indalétius Urci, Cæcílius Illíberi, Hesýchius Cartéjæ et Euphrásius Illitúrgi.

    Fausínæ, in Sardínia, sancti Simplícii, Epíscopi et Mártyris, qui, Diocletiáni témpore, sub Bárbaro Prǽside, perfóssus láncea martýrium consummávit.

    Eboræ, in Lusitánia, sancti Máncii Mártyris.

    In ínsula Chio natális beáti Isidóri Mártyris, in cujus Basílica exstat púteus, in quem fertur fuísse injéctus, de cujus aqua infírmi potáti sǽpius sanántur.

    Lámpsaci, in Hellespónto, pássio sanctórum Petri, Andréæ, Pauli et Dionýsiæ.

    Arvérnis, in Gállia, sanctórum Mártyrum Cássii, Victoríni, Máximi et Sociórum.

    Ghelæ, in Brabántia, sanctæ Dympnæ, Vírginis et Mártyris, fíliæ Regis Hibernórum; quæ, cum in fide Christi et virginitáte servánda permanéret immóbilis, a patre jussa est decollári.
  en: |
    Holy John Baptist de la Salle, Priest and Confessor, who was the Founder of the Brotherhood of the Christian Schools, and fell asleep in the Lord upon the 7th day of April.

    In Spain are commemorated the holy Bishops Torquatus, Ctesiphon, Secundus, Indaletius, Caecilius, Hesychius, and Euphratius. They were ordained at Rome by the holy Apostles, and sent to preach the Word of God in Spain. They evangelised diverse cities, and brought countless multitudes into the obedience of the faith of Christ, and fell asleep each in a different place in that land. Torquatus at Cadiz, Ctesiphon at Vierco, Secundus at Avila, Indaletius at Portilla, Caecilius at Elvira, Hesychius at Gibraltar, and Euphratius at Andujar.

    At Evora, in Portugal, the holy martyr Mancius.

    In the island of Chios, was born into the better life: the blessed martyr Isidore, whose church there is a well into the which he is said to have been cast, of the water whereof the sick oftentimes drink and are healed.

    At Lampsacus, on the Hellespont, suffered the holy martyrs Peter, Andrew, Paul, and Dionysia.

    At Faustina, in Sardinia, the holy martyr Simplicius, Bishop, who was thrust through with a lance, under the President Barbaros, in the time of the Emperor Diocletian, and so finished his testimony.

    At Clermont, in Auvergne, the holy martyrs Cassius, Victorinus, Maximus, and their Companions.

    In Brabant, the holy Virgin and martyr Dymphna, daughter of a King of Ireland, who was beheaded by order of her own father on account of her belief in Christ, and her holding to her virginity.
