# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "10-03"
text:
  la: |
    Sanctæ Terésiæ a Jesu Infánte, ex Ordine Carmelitárum Excalceatórum, Vírginis, peculiáris ómnium Missiónum Patrónæ; cujus dies natális prídie Kaléndas Octóbris recensétur.

    Romæ, ad Ursum pileátum, sancti Cándidi Mártyris.

    Apud antíquos Sáxones sanctórum Mártyrum duórum Ewaldórum, qui, cum essent Presbýteri et Christum ibi prædicáre cœpíssent, comprehénsi sunt a Pagánis et occísi; ad quorum córpora noctu lux multa, diu appárens, et ubi essent et cujus essent mériti, declarávit.

    Eódem die sanctórum Mártyrum Dionýsii, Fausti, Caji, Petri, Pauli et aliórum quátuor, qui primum, sub Décio, multa passi sunt, ac demum, sub Valeriáno, ab Æmiliáno Prǽside diu torméntis vexáti, martýrii palmam meruérunt.

    In Africa sancti Maximiáni, Epíscopi Bagajénsis, qui, a Donatístis íterum atque íterum sævíssima perpéssus, ex alta dénique turri præcipitátus est, et pro mórtuo derelíctus; sed, póstmodum a transeúntibus colléctus et pia curatióne sanátus, cathólicam fidem propugnáre non déstitit, donec, glória confessiónis clarus, quiévit in Dómino.

    Legióne, in Hispánia, sancti Froiláni, ejúsdem civitátis Epíscopi, monásticæ vitæ propagándæ stúdio, beneficéntia in páuperes, ceterísque virtútibus et miráculis clari.

    In diœcési Namurcénsi, apud Belgas, sancti Gerárdi Abbátis.

    In Palæstína sancti Hesýchii Confessóris, qui fuit sancti Hilariónis discípulus et in peregrinatióne sócius.

    Savónæ, in Ligúria, sanctæ Maríæ Joséphæ Rosséllo, Institúti Filiárum Nostræ Dóminæ a Misericórdia Fundatrícis, quam, caritátis opéribus præcláram, Pius Papa Duodécimus sanctis Virgínibus adnumerávit.
  en: |
    Holy Teresa of the Child Jesus, of the Order of Discalced Carmelites, Virgin, special Patroness of all the Missions; whose birthday is recorded upon the 30th day of September.

    At Rome, at the Bear-and-Cap, the holy martyr Candidus. Upon the same day, the holy martyrs Denis, Faustus, Caius, Peter, Paul, and four others. They originally suffered much under the Emperor Decius, and then, under the Emperor Valerian, were put to a long course of torments by the President Emilian.

    Among the ancient Saxons, the two holy (English) brethren, both named Ewald, (one surnamed the white, and the other the black.) They were priests, and had gone to preach Christ in that country, where they suffered martyrdom, being murdered by the heathen. A bright light was seen around their bodies by night to show where they were, and of what worthiness.

    In Africa, holy Maximian, Bishop of Bagaia, who again and again suffered great cruelties at the hands of the Donatists, and was at last thrown off the top of a lofty tower, and left for dead, but afterwards fell asleep in the Lord, famous for his glorious confession.

    At Leon, in Spain, holy Froilan, Bishop of that city, renowned for his zeal in spreading the monastic life, his goodness toward the poor, and for other virtues and miracles.

    In Palestine, the holy Confessor Hesychius, a disciple of holy Hilarion, and his companion in his journeyings.

    At Savona, in Liguria, holy Mary Josepha Rossello, Virgin, Foundress of the Institute of the Daughters of Our Lady of Mercy, whom, renowned for works of charity, Pope Pius XII numbered among the holy Virgins.

    At Brogne, in the diocese of Namur, in Belgium, holy Gerard, (Founder and) Abbot, (of the monastery at that place, who introduced a new and most exact  discipline into many monasteries of Flanders, Champagne, Lorraine, and Picardy. He reformed some abbeys in Flanders.)
