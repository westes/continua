# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "05-25"
text:
  la: |
    Salérni deposítio beáti Gregórii Séptimi, Papæ et Confessóris, ecclesiásticæ libertátis propugnatóris ac defensóris acerrimi.

    Romæ, via Nomentána, natális beáti Urbáni Primi, Papæ et Mártyris, cujus exhortatióne et doctrína complúres (in quibus fuére Tibúrtius et Valeriánus) Christi suscepérunt fidem, et pro ea martýrium subiérunt. Ipse quoque, in persecutióne Alexándri Sevéri, multa passus pro Ecclésia Dei, tandem, cervícibus abscíssis, martýrio coronátus est.

    Girvi, in Anglia, tránsitus sancti Bedæ Venerábilis, Presbýteri, Confessóris et Ecclésiæ Doctóris, sanctitáte et eruditióne celebérrimi. Ipsíus autem festum recólitur sexto Kaléndas Júnii.

    Floréntiæ natális sanctæ Maríæ-Magdalénæ de Pazzis Vírginis, ex Ordine Carmelitárum, vita et sanctitáte illústris. Ejus vero festívitas quarto Kaléndas Júnii celebrátur.

    Doróstori, in Mýsia inferióre, item natális sanctórum Mártyrum Pasícratis, Valentiónis et aliórum duórum, simul coronatórum.

    Medioláni sancti Dionýsii Epíscopi, qui, ab Ariáno Imperatóre Constántio in Cappadóciam pro fide cathólica relegátus, ibídem, propióre Martýribus título, spíritum Deo réddidit. Ejus sacrum corpus ab Aurélio Epíscopo transmíssum est Mediolánum ad beátum Ambrósium Epíscopum; cui piæ actióni offícium quoque sancti Basilíi Magni accessísse tráditur.

    Floréntiæ natális sancti Zenóbii, ejúsdem civitátis Epíscopi, vitæ sanctitáte ac miraculórum glória conspícui.

    In Británnia sancti Aldélmi, Epíscopi Schireburgénsis.

    In território Tricassíno sancti Leónis Confessóris.

    Lutétiæ Parisiórum sanctæ Magdalénæ-Sophíæ Barat, Fundatrícis Institúti Sorórum a Sacro Corde Jesu; quæ pro Christiána puellárum informatióne valde adlaborávit, et a Pio Papa Undécimo in sanctárum Vírginum catalógum fuit reláta.

    Vérulis, in Hérnicis, Translátio sanctæ Maríæ, matris Jacóbi; cujus sacrum corpus plúrimis miráculis illustrátur.

    Assísii, in Umbria, item Translátio sancti Francísci Confessóris, témpore Gregórii Papæ Noni.
  en: |
    At Salerno, the blessed Pope Gregory VII, a right stout champion and defender of the freedom of the Church, whose feast we keep upon the 28th day of this same month of May.

    At Rome, upon the Nomentan Way, the blessed martyr, Pope Urban I, who by his exhortation and teaching turned to the faith of Christ many who suffered martyrdom therefore, among whom were Tiburtius and Valerian. He himself also suffered many things for the Church of God in the persecution under the Emperor Alexander Severus, and at length, being beheaded, was crowned with martyrdom.

    At Jarrow, in England, the passing of holy Bede the Venerable, Priest, Confessor and Doctor of the Church, most renowned for holiness and learning. His feast is kept upon the 27th day of May.

    At Florence, the holy Virgin, Mary Magdalene de' Pazzi, of the Order of Carmelites, famous for her holy life, whose feast we keep upon the 3rd day of June.

    At Dorostorum, in Bulgaria, the holy martyrs Pasicrates, Valention, and two others, who were all crowned together.

    At Milan, holy Bishop Denis. He was banished into Cappadocia by the Arian Emperor Constantius for the Catholic faith's sake, and so there gave up his spirit to God with a near approach to martyrdom. His sacred body was sent to Milan to blessed Bishop Ambrose by Bishop Aurelius, prompted to that godly act, as is said, by holy Basil the Great.

    At Florence, holy Zenobius, Bishop of that city, distinguished for the holiness of his life and the fame of his wondrous works.

    In Britain, holy Aldhelm, Bishop of Sherborne.

    In the country of Troyes, the holy Confessor Leo.

    At Paris, holy Magdalen Sophia Barat, Foundress of the Institute of the Sisters of the Sacred Heart of Jesus; who laboured greatly for the Christian training of girls, and was enrolled in the list of the holy Virgins by Pope Pius XI.

    Also at Veroli, in Latium, the translation of holy Mary, mother of James, whose sacred body is honoured by many works of power.

    At Assisi, in Umbria, is commemorated the translation of the holy Confessor Francis, in the time of Pope Gregory IX.
status:
  la: verified
  en: draft
