# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "05-31"
text:
  la: |
    Festum beátæ Maríæ Vírginis Regínæ.

    Romæ sanctæ Petroníllæ Vírginis, fíliæ beáti Petri Apóstoli, quæ, conjúgium nóbilis viri Flacci spernens, et, accéptis triduánis ad deliberándum indúciis, ínterim jejúniis et oratiónibus vacans, tértia die, mox ut Christi Sacraméntum accépit, emísit spíritum.

    Aquiléjæ sanctórum Mártyrum fratrum Cántii, Cantiáni et Cantianíllæ, qui, cum essent ex illústri Aniciórum progénie, sub Diocletiáno et Maximiáno Imperatóribus, ob Christiánæ fídei constántiam, una cum pædagógo suo Proto, cápite plexi sunt.

    Túrribus, in Sardínia, sancti Crescentiáni Mártyris.

    Apud Comános, in Ponto, sancti Hérmiæ mílitis, qui, sub Antoníno Imperatóre, de innúmeris et sævíssimis torméntis divína ope liberátus, carníficem convértit ad Christum, et ejúsdem martýrii corónæ partícipem fecit; quam tamen ipse primus, gládio obtruncátus, accépit.

    Verónæ sancti Lupicíni Epíscopi.

    Romæ sancti Paschásii, Diáconi et Confessóris, cujus méminit beátus Gregórius Papa.
  en: |
    The feast of the blessed Virgin Mary, Queen.

    At Rome, the holy Virgin Petronilla, daughter of the blessed Apostle Peter. She looked down upon an offer of marriage from the noble Flaccus, and took three days to consider the matter, the which time she spent in fasting and prayer, and upon the third day, immediately after receiving the Sacrament of Christ, she gave up the ghost.

    At Aquileia, the holy brothers Cantius and Cantian, and their sister Cantianilla, all martyrs of the noble family of the Anicii, who, along with their schoolmaster Protus, were beheaded under the Emperors reigned A.D. 269-274. Diocletian and Maximian on account of their firmness in the Christian faith.

    At Torre, in Sardinia, the holy martyr Crescentian.

    At Comana, in Pontus, the holy soldier Hermias. He was delivered by God's help from countless and savage tortures, under the Emperor Antoninus. He converted his executioner to Christ, and made him a sharer in the crown of his own martyrdom, but he himself was the first to grasp it, by being beheaded.

    At Verona, the holy Lupicinus, Bishop.

    At Rome, the holy Deacon Paschasius, a Confessor of whom doth make mention the blessed Pope Gregory.
