# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "09-12"
text:
  la: |
    Festum sanctíssimi Nóminis beátæ Maríæ, quod Innocéntius Undécimus, Póntifex Máximus, ob insígnem victóriam de Turcis, ipsíus Vírginis præsídio, Vindobónæ in Austria reportátam, celebrári jussit.

    In Bithýnia sancti Autónomi, Epíscopi et Mártyris; qui ex Itália, Diocletiáni Imperatóris persecutiónem declínans, illuc proféctus, ibi, cum plúrimos convertísset ad fidem, a furéntibus Gentílibus, dum sacra Mystéria perágeret, ad altáre mactátus est, et hóstia Christi efféctus.

    Icónii, in Lycaónia, sancti Curónoti Epíscopi, qui sub Perénnio Prǽside, cápite truncátus, martýrii palmam accépit.

    Alexandríæ natális sanctórum Mártyrum Hierónidis, Leóntii, Serapiónis, Selésii, Valeriáni et Stratónis, qui, sub Maximíno Imperatóre, ob confessiónem nóminis Christi, in mare sunt demérsi.

    Meri, in Phrýgia, pássio sanctórum Mártyrum Macedónii, Theodúli et Tatiáni, qui, sub Juliáno Apóstata, ab Almáchio Prǽside, post ália torménta, super crates férreas ignítas pósiti, exsultántes martýrium complevérunt.

    Apud Papíam sancti Juvéntii Epíscopi, de quo ágitur sexto Idus Februárii. Ipse, a beáto Hermágora, discípulo sancti Marci Evangelístæ, ad eam urbem, una cum sancto Syro, cujus memória recólitur quinto Idus Decémbris, diréctus est; et ambo, prædicántes illic Christi Evangélium et magnis virtútibus ac miráculis coruscántes, étiam vicínas urbes divínis opéribus illustrárunt, sicque in pontificáli honóre, glorióso fine, quievérunt in pace.

    Lugdúni, in Gállia, deposítio sancti Sacerdótis Epíscopi.

    Verónæ sancti Silvíni Epíscopi.

    Anderláci, prope Bruxéllas, in Brabántia, sancti Guidónis Confessóris.
  en: |
    At Alexandria, the holy martyrs Hieronides, Leontius, Serapion, Selesius, Valerian, and Straton, who, under the Emperor Maximin, were drowned in the sea for confessing Christ's Name.

    In Bithynia, the holy martyr Bishop Autonomus. He fled thither from Italy to escape the persecution under the Emperor Diocletian, and when he had turned very many to the faith the raging Gentiles slew him at the Altar while he was celebrating the Holy Mysteries, whereby he himself became a sacrifice of Christ.

    At Merus, in Phrygia, the holy martyrs Macedonius, Theodulus, and Tatian. The President Almachius, under the Emperor Julian the Apostate, after putting them to other torments, caused them to be stretched upon red-hot iron gratings, and thus with gladness they finished their testimony.

    At Iconium, in Lycaonia, the holy martyr Curonotus, Bishop, who was beheaded under the President Perennius, and so received the palm of martyrdom.

    At Pavia, holy Juventius, Bishop, of whom mention is made upon the 8th day of February. He was sent thither along with holy Syrus by the blessed Hermagoras, a disciple of the holy Evangelist Mark, and they both there preached the gospel of Christ, and shone forth with great graces and wonders, so that by the works of God they lighted up even the cities hard by, and fell asleep at last in the honour of their Bishophood, in glory and in peace.

    At Lyon, deceased the holy Sacerdos, Bishop.

    At Verona, holy Silvinus, Bishop.

    At Anderlecht, adjacent to the city of Brussels, in the Brabant, the holy Confessor Guy.
status:
  la: verified
  en: verified
