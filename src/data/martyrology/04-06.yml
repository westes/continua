# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-06"
text:
  la: |
    Medioláni pássio sancti Petri, ex Ordine Prædicatórum, Mártyris, qui ab hæréticis, ob fidem cathólicam, interémptus est. Ipsíus tamen festívitas recólitur tértio Kaléndas Maji.

    Velehrádii, in Morávia, natális sancti Methódii, Epíscopi et Confessóris, qui, una cum sancto Cyríllo, item Epíscopo et fratre suo, cujus natális sextodécimo Kaléndas Mártii recensétur, multas Slávicas gentes earúmque Reges ad fidem Christi perdúxit. Horum autem Sanctórum festum Nonis Júlii celebrátur.

    In Macedónia sanctórum Mártyrum Timóthei et Diógenis.

    In Pérside sanctórum centum vigínti Mártyrum.

    Ascalóne, in Palæstína, pássio sanctórum Platónidis et aliórum duórum Mártyrum.

    Carthágine sancti Marcellíni Mártyris, qui, ob cathólicæ fídei defensiónem, ab hæréticis occísus est.

    In Dánia sancti Guliélmi Abbátis, vita et miráculis clari, ex Ordine Canonicórum Regulárium sancti Victóris, Hugónis nepótis, quadragésimi secúndi Abbátis sancti Germáni a Pratis.
  en: |
    At Velehrad, in Moravia, the birthday of holy Methodius, Bishop and Confessor, who, together with holy Cyril, likewise a Bishop and his brother, whose birthday is recorded upon the 14th day of February, brought many Slavonic peoples and their Kings to the faith of Christ. The feast of these Saints is kept upon the 7th day of July.

    At Milan, the passion of holy Peter, martyr, of the Order of Preachers, who was slain by heretics for the Catholic faith. His feast, however, is kept upon the 29th day of April.

    In Macedonia, the holy martyrs Timothy and Diogenes.

    In Persia, an hundred and twenty holy martyrs.

    At Ascalon, the holy martyrs Platonides and two others.

    At Carthage, the holy martyr Marcellinus, who was slain by heretics, because he defended the Catholic faith.

    In Denmark, holy William, Abbot, famous for his life and miracles, Of the order of Canons Regular of St Victor, Nephew of Hew, 42nd Abbot of St. Germain des Pres.
