# Verified against Divinum Officium (Latin Martyrologium, English translation).
monthDay: "04-28"
text:
  la: |
    Sancti Pauli a Cruce, Presbýteri et Confessóris; qui Congregatiónis a Cruce et Passióne Dómini nostri Jesu Christi nuncupátæ Institútor fuit, atque in Dómino obdormívit quintodécimo Kaléndas Novémbris.

    Ravénnæ natális sancti Vitális Mártyris, viri sanctæ Valériæ ac patris sanctórum Gervásii et Protásii; qui, cum beáti Ursicíni corpus sublátum débita honestáte sepelísset, tentus est a Paulíno Consulári, et, post equúlei torménta, jussus depóni in profúndam fóveam, et terra ac lapídibus óbrui; talíque martýrio migrávit ad Christum.

    Atínæ, in Campánia, sancti Marci, qui, a beáto Petro Apóstolo Epíscopus ordinátus, Æquícolis, Campániæ Románæ incolis, primus Evangélium prædicávit, et in persecutióne Domitiáni, sub Máximo Prǽside, martýrii corónam accépit.

    Prusæ, in Bithýnia, sanctórum Mártyrum Patrícii Epíscopi, Acátii, Menándri et Polyǽni.

    Eódem die sanctórum Mártyrum Aphrodísii, primi Epíscopi Biterrénsis, Caralíppi, Agápii et Eusébii.

    In Pannónia sancti Polliónis Mártyris, sub Diocletiáno Imperatóre. Lector fuit in ecclésia Cibalénsi, in território Valentiniáni. Cibalæ inter flúvios Savum et Dravum fuérunt, et nunc in ruínis jácent. Sanctus Pollio eódem die quo Epíscopus suus Eusébius, licet post aliquot annos, passus est.

    Medioláni sanctæ Valériæ Mártyris, uxóris sancti Vitális ac matris sanctórum Gervásii et Protásii.

    Alexandríæ pássio sanctæ Theodóræ, Vírginis et Mártyris. Hæc, idólis sacrificáre contémnens, in lupánar est trádita, sed repénte quidam ex frátribus, nómine Dídymus, miro Dei favóre, commutátis véstibus, illam erípuit; qui póstea, in persecutióne Diocletiáni, sub Eustrátio Prǽside, simul cum eádem Vírgine percússus, simul coronátus est.

    Turiasóne, in Hispánia Tarraconénsi, sancti Prudéntii, Epíscopi et Confessóris.

    Corfínii, in Pelígnis, sancti Pámphili, Valvénsis Epíscopi, caritáte in páuperes et virtúte miraculórum illústris; cujus corpus Sulmóne cónditum est.

    In pago sancti Lauréntii ad Séparim, diœcésis Lucionénsis, sancti Ludovíci Maríæ Grignion a Montfort, Confessóris, Fundatóris Missionariórum Societátis Maríæ et Filiárum a Sapiéntia, apostólicæ vitæ forma, prædicatióne et devotióne mariáli insígnis, quem Pius Papa Duodécimus Sanctórum catálogo adscrípsit.
  en: |
    We keep the feast of the holy Confessor Paul of the Cross, founder of the congregation called that of the Cross and Passion of our Lord Jesus Christ, and of whom mention is made upon the 18th day of October, upon the which day, he fell asleep in the Lord.

    At Ravenna, the holy martyr Vitalis, father of holy Gervase and Protase. He had removed the body of blessed Ursicinus and buried it with due respect for the which cause he was arrested by Paulinus the consular, and when they had racked him, they cast him into a deep pit and buried him alive under earth and stones, and with that testimony he passed away to be with Christ.

    At Atino, holy Mark, who was ordained Bishop of that see by the blessed Apostle Peter, and was the first that preached the Gospel to the Equicoli, inhabitants of the Campania round Rome. He received the crown of martyrdom under the President Maximus, in the persecution under the Emperor Domitian.

    At Brusa, in Bithynia, the holy martyr Patrick, Bishop of Acatius, Menander, and Polyaenus.

    Upon the same day, the holy martyrs Aphrodisius, first Bishop of Beziers, Caralippus, Agapius, and Eusebius.

    In Hungary, under the Emperor Diocletian, the holy martyr Pollio. He was a Reader in the church of Cibales, in the country of Valentinian. Cibales was between the rivers Save and Drave, and is now in ruins. St Pollio suffered on the same day, though at a distance of some years, as his Bishop Eusebius.

    At Milan, the holy martyr Valeria, wife of holy Vitalis.

    At Alexandria, the holy Virgin Theodora. She would not sacrifice to idols and was sent to a brothel; but one of the brethren, named Didymus, by the favour of God changed clothes with her, and so delivered her thence. Later on, in the persecution under the Emperor Diocletian, they were beheaded together under Eustratius the President, and so were crowned together.

    At Tarazona, in Spain, the holy Confessor Prudentius, Bishop.

    At Pentina, in the Abruzzi, holy Pamphilus, Bishop of Valva, famous for his charity to the poor and gift of miracles. He is buried at Sulmona.

    In the village of St. Laurent-sur-Sevre, in the diocese of Lucon, holy Louis Mary Grignion de Montfort, Confessor, Founder of the Missionaries of the Company of Mary and of the Daughters of Wisdom, remarkable as a pattern of the apostolic life, for his preaching and his devotion to Mary, whom Pope Pius XII enrolled in the list of the Saints.
