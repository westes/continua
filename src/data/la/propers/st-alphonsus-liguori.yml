# Read directly from web/www/horas/Latin/Sancti/08-02.txt's own [Oratio]
# and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui per beátum Alfónsum Maríam Confessórem tuum atque Pontíficem, animárum zelo
    succénsum, Ecclésiam tuam nova prole fecundásti: quǽsumus; ut, ejus salutáribus mónitis
    edócti et exémplis roboráti, ad te perveníre felíciter valeámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-confessor-bishop
# (`[Ant 2]`+`[Versum 2]` from the reference engine's Commune files, same
# pattern st-francis-de-sales-commemoration.yml uses). st-alphonsus-liguori
# has no proper antiphon of his own in the source (a plain "vide C4a"
# reference), so this reuses the Common's own text, marked `draft` per
# this app's "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-alphonsus-liguori-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui per beátum Alfónsum Maríam Confessórem tuum atque Pontíficem, animárum zelo
    succénsum, Ecclésiam tuam nova prole fecundásti: quǽsumus; ut, ejus salutáribus mónitis
    edócti et exémplis roboráti, ad te perveníre felíciter valeámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. Alphonsus Liguori, Bishop, Confessor,
# Doctor of the Church (Aug 2). Sourced directly from
# web/www/horas/Latin/Sancti/08-02.txt, English/Sancti/08-02.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break -- same convention st-francis-de-sales.yml uses. Nocturn
# 3's own Lectio7-9 in the source is a cross-reference to a Common homily
# (@Commune/C1a), not proper text, so falls to the existing Common of a
# Confessor Bishop Nocturn 3 pool automatically, same as every other
# saint of this category with nothing proper here.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Alfonsus Maria de Ligorio, Neapoli nobílibus paréntibus natus, ab ineunte ætate non obscura præbuit sanctitátis indicia. Eum adhuc infántem cum paréntes obtulissent sancto Francisco de Hieronymo e societáte Jesu, is bene precátus edíxit eumdem ad nonagesimum usque annum perventurum, ad episcopalem dignitátem evectum iri, maximóque Ecclésiæ bono futurum. Jam tum a puerítia, a ludis abhorrens, nóbiles ephébos ad christianam modestiam verbo et exemplo componebat. Adoléscens, dato piis sodalitátibus nómine, in publicis nosocomíis ægrotis inservire, jugi in templis oratióni vacare, ac sacra mysteria frequenter obire in deliciis habebat. Pietátem litterárum stúdiis adeo conjunxit, ut séxdecim vix annos natus utriusque juris lauream in pátria universitáte fúerit assecutus. Patri obtemperans, causárum patrocinia suscépit; in quo munere obeundo, etsi magnam sibi laudem comparasset, fori tamen pericula expertus, ejusmodi vitæ institutum ultro dimísit. Spreto ígitur præcláro conjugio sibi a patre propósito, avíta primogenitúra abdicata, et ad aram Vírginis de Mercede ense suspenso, divinis ministériis se mancipávit. Sacerdos factus, tanto zelo irruit in vitia, ut apostolico munere fungens, huc illuc pérvolans, ingéntes perditórum hóminum conversiónes perágeret. Páuperum præsertim et ruricolárum miseratus, congregatiónem Presbyterórum instituit sanctíssimi Redemptoris, qui, ipsum Redemptórem secuti, per agros, pagos, et castella paupéribus evangelizarent.

        Ne autem a propósito umquam diverteret, perpetuo se voto obstrinxit nullam témporis jacturam faciéndi. Hinc animárum zelo succénsus, tum divini verbi prædicatióne, tum scriptis sacra eruditióne et pietáte refertis, ánimas Christo lucrifácere et ad perfectiórem vitam adducere studuit. Mirum sane quot odia exstinxerit, quot devios ad rectum salútis iter revocaverit. Dei Genitrícis cultor exímius, de illíus laudibus librum edidit, ac de iis dum ferventius concionando disserit, a Vírginis imagine, in eum immisso miro splendore, totus fácie coruscare et in éxtasim rapi coram universo pópulo non semel visus est. Dominicæ passiónis et sacræ Eucharistiæ contemplator assiduus, ejus cultum mirifice propagávit. Dum vero ad ejus aram oraret vel Sacrum fáceret, quod numquam omisit, præ amoris veheméntia, vel seraphicis liquescebat ardóribus, vel insólitis quatiebátur mótibus, vel abstrahebátur a sensibus. Miram vitæ innocéntiam, quam nulla umquam lethali labe fœdávit, pari cum pœniténtia socians, corpus suum inedia, férreis caténulis, ciliciis cruentáque flagellatióne castigábat. Inter hæc prophetíæ, scrutatiónis cordium, bilocatiónis et miraculórum donis incláruit.

        Ab ecclesiásticis dignitátibus sibi oblátis constantíssime abhorruit; at, Clementis décimi tertii Pontificis auctoritate coactus, sanctæ Agathæ Gothórum ecclésiam gubernándum suscépit. Epíscopus, externum dumtaxat habitum, non autem sevéram vivéndi ratiónem immutávit. Eadem frugalitas, summus christianæ disciplinæ zelus, impensum in vitiis coërcéndis arcendisque erróribus, et in réliquis pastorálibus munéribus obeundis studium. Liberalis in páuperes, omnes ecclésiæ proventus iisdem distribuebat, ac, urgénte annonæ caritate, ipsam domesticam supellectilem in aléndis famélicis erogávit. Omnibus ómnia factus, sanctimoniáles ad perfectiórem vivéndi formam redégit, suæque congregatiónis moniálium monastérium constituéndum curávit. Episcopatu ob graves habitualésque morbos dimísso, ad alumnos suos, a quibus pauper discesserat, revértitur pauper. Demum, quamvis senio laboribúsque, diuturna arthrítide aliisque gravíssimis morbis fractus corpore, spíritu tamen alacrior, de cæléstibus rebus disseréndi aut scribéndi finem numquam adhibuit, donec nonagenarius, Kaléndis Augusti, anno millesimo septingentésimo octogesimo séptimo, Nucériæ Paganórum, inter suórum alumnórum lácrimas, placidíssime exspirávit. Eum, inde virtútibus et miraculis clarum, Pius septimus Pontifex maximus anno millesimo octingentésimo décimo sexto Beatórum fastis; novisque fulgentem signis, Gregórius décimus sextus in festo sanctíssimæ Trinitátis, anno millesimo octingentésimo trigesimo nono, solemni ritu, Sanctórum catálogo accensuit. Tandem Pius nonus Pontifex maximus, ex sacrórum Rituum Congregatiónis consulto, universalis Ecclésiæ Doctórem declarávit.
      status: verified
