# Matins Nocturn 2 reading for Ss. Tiburtius, Valerian, and Maximus,
# Martyrs (Apr 14, sharing the date with St. Justin in the general
# Tridentine calendar). No SanctiM/04-14t*.txt at all (the only
# SanctiM file for this date, plain SanctiM/04-14.txt, bases
# `@Sancti/04-14` i.e. Justin, not these martyrs) — same "the shared
# plain file isn't necessarily yours" wrinkle as the pre-1955 pass
# (memory vu-matins-pre1955-saints); another missed pre-1955-pool
# candidate rather than a genuine SanctiM case (see memory
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/04-14t.txt, English/Sancti/04-14t.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Valerianus Romanus nobili genere ortus, Alexandro Sevéro imperatóre, hortatu beátæ Cæcíliæ Vírginis, quam sibi pari nobilitate uxórem desponderat, una cum Tiburtio fratre a sancto Urbano Papa baptizátur. Quos ubi præfectus Urbis Almachius Christiános esse cognóvit, et patrimonio paupéribus distributo, Christianórum córpora sepelire; accersítos gráviter reprehéndit: atque ubi Christum Deum constanter confiténtes, deos autem dæmoniórum inánia simulácra prædicántes videt, virgis cædi jubet. Sed cum verbéribus cogi non possent, ut Jovis simulacrum veneraréntur, immo fortes in fídei veritáte permanérent, ad quartum ab Urbe lápidem secúri feriúntur. Quorum virtútem admirátus Maximus præfecti cubicularius, qui eos ad supplícium perduxerat, Christiánum se esse proféssus est, cum multis præterea præfecti minístris: qui paulo post plumbátis contusi, omnes ex diaboli minístris, Christi Dómini Mártyres evasérunt.'
      status: verified
