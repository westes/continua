# Read directly from web/www/horas/Latin/Sancti/09-12.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Concéde, quǽsumus, omnípotens Deus: ut fidéles tui, qui sub sanctíssimæ
    Vírginis Maríæ Nómine et protectióne lætántur; ejus pia intercessióne,
    a cunctis malis liberéntur in terris, et ad gáudia ætérna perveníre
    mereántur in cælis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (holy-name-of-mary-antiphon.yml), paired with the standard BVM commemoration versicle already verified elsewhere in this app (propers/common/lauds-suffrage-bvm.yml -- 'V. Ora pro nobis sancta Dei Genitrix'). Collect is the saint's own real proper (holy-name-of-mary-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Sancta María, * succúrre míseris, juva pusillánimes, réfove flébiles, ora pro pópulo, intérveni pro clero, intercéde pro devóto femineo sexu: séntiant omnes tuum juvámen, quicúmque célebrant tui sancti nóminis commemoratiónem.
    V. Ora pro nobis sancta Dei Génitrix.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Concéde, quǽsumus, omnípotens Deus: ut fidéles tui, qui sub sanctíssimæ
