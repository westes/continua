# Matins Nocturn 2 reading for St. Agapitus I, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/09-20-AgapitusI.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Joánne hujus nóminis secúndo, e vivis subláto, Agapitus, Románus génere, patre Gordiano, sanctæ Románæ Ecclésiæ archidiaconus, propter singulárem eruditiónem, qua probe et appríme instrúctus erat, et compositos castigatissimæ vitæ mores, quibus præ céteris eminebat, communibus totíus cleri suffrágiis, et ómnium bonórum gratulatione, ad sanctam Petri sedem promótus est; et sublimem illam provínciam perinde administrávit, ac si non ab homínibus, sed ab ipso Deo eléctus fuísset.

        Egregiis laudum titulis ab antíquis Pátribus decorátus est, dictusque ab iis præco justítiæ, Evangélii tuba, vas cathólicum, vir pietáte et miráculis celeberrimus, quibus heroicas illíus virtútes et apostólicæ vitæ sanctimóniam Deus illustrávit. Áliquot hujus sanctíssimi Præsulis decretales exstant, in quibus cathólicæ fídei dógmata sarta tectaque servantur, ecclesiásticæ disciplínæ forma et régula tráditur, sacrórum cánonum et antiquárum traditionum indemnitati consulitur, ac demum omnes et singulæ pastorális sollicitudinis partes implentur.

        Constantinópolim proféctus est, álio prorsus quam ad quem hómines illum destinarant consílio, divíno scílicet instínctu et nutu: ut Anthimum hæréticum patriarcham Constantinopolitánum Theodoræ imperatricis malis ártibus intrusum exauctoraret atque damnaret, et in ejus locum Mennam substitueret; patriarchales item sedes Alexandrínam et Antiochenam, extrusis hæréticis, cathólicis pastoribus restitueret. Sed tandem biénnio pontificátus nondum expléto, vir sanctíssimus, in quo nihil, nisi longiorem vitam cathólici desiderassent, Constantinópoli pie óbiit, anno Christi quingentésimo trigésimo sexto. Ejus corpus Romam translatum, in Vaticáno cónditum est.
      status: verified
