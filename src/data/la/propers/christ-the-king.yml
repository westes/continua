# Matins nocturn content for Christ the King (temporalId christ-the-king,
# Duplex I classis, a 1925 addition -- Pius XI's "Quas Primas"). Sourced
# from Sancti/10-DU.txt (Latin) / English/Sancti/10-DU.txt (this feast's
# own real, dedicated reference-engine file, found and confirmed present
# despite being a later addition), and the Gospel pericope's full text
# from missa/Latin+English/Sancti/10-DU.txt's own [Evangelium] (the
# Matins file itself only gives the incipit + "Et réliqua" for Lectio7,
# per this project's Gospel/homily-split convention).
#
# The audit found this id registered in ALWAYS_OVERRIDE_TEMPORAL_IDS,
# with a real collect/antiphons already authored, but no Matins reading.
# Real source content for this feast's Matins was in fact found in the
# reference tree (contrary to the audit's own expectation that it might
# not exist in a pre-1955-focused reference tree) -- no draft/invented
# content was needed. Nocturn 1-2 (Lectio1-6: Col 1:3-23, then Pius XI's
# encyclical "Quas Primas" itself) left unauthored here per this
# project's convention of leaving Nocturn 1 scripture to the bible-plan
# store; Nocturn 2's own content (the encyclical excerpt) is left for a
# later pass rather than folded in here, to keep this file's Gospel+
# homily structure consistent with the other temporal solemnities closed
# in this same sweep.
#
# Nocturn 3: the Gospel pericope (John 18:33-37) authored in full
# (isGospel: true), followed by Lectio7's homily portion (incipit
# dropped) combined with Lectio8 as one continuous excerpt of St.
# Augustine's own Tractates 51 and 115 on John.
nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Joann 18:33-37
      text: 'In illo témpore: Dixit Pilátus ad Jesum: Tu es Rex Judæórum? Respóndit Jesus: A temetípso hoc dicis, an álii dixérunt tibi de me? Respóndit Pilátus: Numquid ego Judǽus sum? Gens tua et pontífices tradidérunt te mihi: quid fecísti? Respóndit Jesus: Regnum meum non est de hoc mundo. Si ex hoc mundo esset regnum meum, minístri mei útique decertárent, ut non tráderer Judǽis: nunc autem regnum meum non est hinc. Dixit ítaque ei Pilátus: Ergo Rex es tu? Respóndit Jesus: Tu dicis, quia Rex sum ego. Ego in hoc natus sum et ad hoc veni in mundum, ut testimónium perhíbeam veritáti: omnis, qui est ex veritáte, audit vocem meam.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tractates 51 and 115 on John
      text: |-
        Quid magnum fuit Regi sæculórum Regem fíeri hóminum? Non enim Rex Israël Christus ad exigéndum tribútum vel exércitum ferro armándum hostésque visibíliter debellándos; sed Rex Israël, quod mentes regat, quod in ætérnum cónsulat, quod in regnum cælórum credéntes, sperántes amantésque perdúcat. Dei ergo Fílius æquális Patri, Verbum per quod facta sunt ómnia, quod Rex esse vóluit Israël, dignátio est, non promótio; miseratiónis indícium est, non potestátis augméntum. Qui enim appellátus est in terra Rex Judæórum, in cælis est Dóminus Angelórum. Sed Judæórum tantum Rex est Christus, an et géntium? Immo et géntium. Cum enim dixísset in prophetía: Ego autem sum constitútus Rex ab eo super Sion montem sanctum ejus, prǽdicans præcéptum Dómini: ne propter montem Sion solis Judǽis eum regem quisquam díceret constitútum, contínuo subjécit: Dóminus dixit ad me: Fílius meus es tu, ego hódie génui te; póstula a me et dabo tibi gentes hereditátem tuam et possessiónem tuam términos terræ.

        Respóndit Jesus: Regnum meum non est de hoc mundo. Si ex hoc mundo esset regnum meum, minístri mei útique decertárent, ut non tráderer Judǽis; nunc autem regnum meum non est hinc. Hoc est quod bonus Magíster scire nos vóluit; sed prius nobis demonstránda fúerat vana hóminum de regno ejus opínio, sive géntium, sive Judæórum a quibus id Pilátus audíerat: quasi proptérea morte fuísset plecténdus, quod illícitum affectáverit regnum, vel quóniam solent regnatúris invidére regnántes, et vidélicet cavéndum erat ne ejus regnum sive Románis, sive Judǽis esset advérsum. Póterat autem Dóminus quod ait, Regnum meum non est de hoc mundo, ad primam interrogatiónem prǽsidis respondére, ubi ei dixit, Tu es rex Judæórum? sed eum vicíssim intérrogans, utrum hoc a semetípso díceret, an audísset ab áliis, illo respondénte osténdere vóluit hoc sibi apud illum fuísse a Judǽis velut crimen objéctum: patefáciens nobis cogitatiónes hóminum, quas ipse nóverat, quóniam vanæ sunt; eísque post responsiónem Piláti, jam Judǽis et géntibus opportúnius aptiúsque respóndens, Regnum meum non est de hoc mundo.
      responsory: |-
        R. Factum est regnum hujus mundi Dómini nostri et Christi ejus: * Et regnábit in sǽcula sæculórum.
        V. Adorábunt in conspéctu ejus univérsæ famíliæ géntium; quóniam Dómini est regnum.
        R. Et regnábit in sǽcula sæculórum.
      status: verified
