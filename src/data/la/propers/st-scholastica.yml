# Matins Nocturn 2 reading for St. Scholastica, Virgin (Feb 10) —
# SanctiM/02-10.txt inherits the whole day (`@Sancti/02-10`) with no
# Nocturn 2/3 override, so this saint's own vita is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/02-10.txt, English/Sancti/02-10.txt.
# Lectio4-6 (St. Gregory the Great's account, from the Dialogues, of
# her final visit with St. Benedict) combined into one reading, one
# continuous excerpt. No responsory given in the source.
#
# Checked 2026-09-05 for a missing Gospel pairing: the plain Tridentine
# Sancti/02-10.txt has no Lectio7-9 at all (only Lectio4-6) -- Nocturn
# 3 isn't proper to this day and falls through to the Common of
# Virgins (C6a) undifferentiated, same as the day's own [Evangelium]
# tag (`@Commune/C6`) confirms. This reading is Nocturn 2 (the
# biographical excerpt from Gregory's Dialogues), which was never
# Gospel-paired in the first place -- that's Nocturn 3's role. No
# Gospel entry is added; there is no saint-specific one to pair.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope St. Gregory the Great, Dialogues, Bk. 2, ch. 33
      text: |-
        Scholástica, venerábilis patris Benedícti soror, omnipoténti Dómino ab ipso infántiæ témpore dedicáta, ad eum semel per annum veníre consuéverat; ad quam vir Dei non longe extra jánuam in possessióne monastérii descendébat. Quadam vero die venit ex more, atque ad eam, cum discípulis venerábilis ejus descéndit frater; qui totum diem in Dei láudibus sacrísque collóquiis ducéntes, incumbéntibus jam noctis ténebris, simul accepérunt cibum. Cumque adhuc ad mensam sedérent, et inter sacra collóquia tárdior se hora protráheret, éadem sanctimoniális fémina soror ejus eum rogávit, dicens: Quæso te, ut ista nocte me non déseras, ut usque mane de cæléstis vitæ gáudiis loquámur. Cui ille respóndit: Quid est quod lóqueris, soror? manére extra cellam nullátenus possum. Tanta vero erat cæli serénitas, ut nulla in áëre nubes appareret. Sanctimoniális autem fémina, cum verba fratris negántis pósuit, et caput in mánibus omnipoténtem Dóminum rogatúra declinávit. Cumque leváret de mensa caput, tanta coruscatiónis et tonítrui virtus, tántaque inundátio plúviæ erúpit, ut neque venerábilis Benedíctus, neque fratres, qui cum eo áderant, extra loci limen, quo conséderant, pedem movére potúerint.

        Sanctimoniális quippe fémina caput in mánibus declínans, lacrimárum flúvium in mensam fúderat, per quas serenitátem áëris ad plúviam traxit. Nec paulo tárdius post oratiónem inundátio illa secúta est; sed tanta fuit conveniéntia oratiónis et inundatiónis, ut de mensa caput jam cum tonítruo leváret; quátenus unum idémque esset moméntum, et leváre caput, et plúviam depónere. Tunc vir Dei inter corúscos et tonítruos atque ingéntis plúviæ inundatiónem, videns se ad monastérium non posse remeáre, cœpit cónqueri contristátus, dicens: Parcat tibi omnípotens Deus, soror: quid est quod fecísti? Cui illa respóndit: Ecce rogávi te et audíre me noluísti; rogávi Deum meum, et audívit me: modo ergo, si potes, egrédere et, me dimíssa, ad monastérium recéde. Ipse autem exíre extra tectum non valens, qui remanére sponte nóluit in loco, mansit invítus. Sicque factum est, ut totam noctem pervígilem dúcerent, atque per sacra spiritális vitæ collóquia, sese vicária relatióne satiárent.

        Cumque die áltero éadem venerábilis fémina ad cellam própriam recessísset, vir Dei ad monastérium rédiit. Cum ecce post tríduum, in cella consístens, elevátis in áëra óculis vidit ejúsdem soróris suæ ánimam de córpore egréssam in colúmbæ spécie cæli secréta penetráre. Qui, tantæ ejus glóriæ congáudens, omnipoténti Deo in hymnis et láudibus grátias réddidit, ejúsque óbitum frátribus denuntiávit. Quos étiam prótinus misit, ut ejus corpus ad monastérium deférrent, atque in sepúlcro, quod sibi ipsi paráverat, pónerent. Quo facto cóntigit, ut, quorum mens una semper in Deo fúerat, eórum quoque córpora nec sepultúra separáret.
