# Matins Nocturn 2-3 readings for St. Robert Bellarmine, Bishop,
# Confessor and Doctor of the Church (May 13). Sourced directly from
# web/www/horas/Latin/Sancti/05-13.txt, English/Sancti/05-13.txt.
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3: Lectio7's Gospel citation (Matt 5:13-19) is a bare
# "Et réliqua" incipit in the horas file, and this day's own Mass
# proper (missa/Latin/Sancti/05-13.txt) has no [Evangelium] of its own
# either -- it's inherited from the Common of Doctors (C4a), which
# isn't present in this reference engine's static missa/Commune store.
# The full pericope (Matt 5:13-19) is added 2026-09-05 (isGospel:
# true) immediately before the homily (Lectio7-9, Bellarmine's own
# words on the Doctors of the Church), with Latin taken verbatim from
# web/www/horas/Help/vulgate.txt (the reference engine's own Vulgate
# text database) and English composed as the standard Douay-Rheims
# rendering of the same verses (not itself reference-engine text, so
# marked draft per this project's "prefer text over missing" policy).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Robertus, Politianus, e patrícia Bellarminórum gente, matrem pientíssimam hábuit Cynthiam Cervini, Marcelli Papæ secúndi sorórem. Eximia pietáte et castíssimis móribus quamprimum enituit, id unum exoptans, ut Deo soli placeret et ánimas Christo lucrifáceret. Patrium Societátis Jesu collegium summa cum ingenii et modestiæ laude frequentávit; ac duodeviginti annos natus, Romæ eamdem Societátem ingréssus, religiosárum virtútum ómnibus exemplo fuit. Emenso in Romano Collegio philosophíæ curriculo, missus est primum Floréntiam, tum Montem Regalem; deínde Patavium ad sacram theologíam addiscéndam, ac póstea Lovanium, ubi concionatoris munere, nondum sacerdos, mirifice functus est. Lovanii præterea, sacerdotio auctus, theologíam ita docuit, ut plurimos hæreticos ad Ecclésiæ unitátem reduxerit, ac theologus per Europam claríssimus haberétur, eumque Sanctus Cárolus Mediolanénsis epíscopus aliique veheménter sibi expéterent.

        Romam ex desidério Gregórii Papæ décimi tertii revocatus, theologicam controversiárum disciplínam trádidit in Collegio Romano: ibique vitæ spiritualis magister constitútus, angelicum juvenem Aloísium per sanctitátis sémitas moderátus est. Ipse Collegium Romanum ac deínde Neapolitanam Societátis Jesu Provinciam ad Sancti Ignatii mentem gubernávit. In Urbem íterum accersítus, a Cleménte octavo ad summa Ecclésiæ negotia, máximo cum christianæ rei emolumento, est adhibitus: tum invitus et frustra reluctans, in Cardinalium númerum cooptátus quia, ut palam asseruit ipse Pontifex, tunc non habebat parem Ecclésia Dei quod ad doctrinam. Ab eodem Pontifice consecrátus Epíscopus, Capuanam Archidiœcésim triennium sanctíssime administrávit: quo munere deposito, Romæ ad mortem usque degit, integerrimus ac fidelíssimus Summi Pontificis consiliarius. Multa præcláre scripsit, illud meritum adeptus in primis quod, sanctum Thomam ducem et magistrum secutus, de suórum necessitate témporum próvide cónscius, invicto doctrinæ róbore et amplíssima testimoniórum copia e Sacris Litteris et e Sanctórum Patrum ditíssimo fonte apte deprompta novos erróres debellávit, traditiónis catholicæ et Romani Pontificátus jurium strenuus præprimis adsertor. Complúribus étiam ad pietátem fovéndam libellis exstat insígnis ac præsertim aureo catechismo, quem licet aliis gravíssimis negotiis distentus, tum Capuæ tum Romæ púeros ac rudes docére non prætermittebat. Robertum æquævus Cardinalis a Deo missum judicávit, qui catholicos erudíret, pios cóleret, hæreticos profligaret; Sanctus Franciscus Salesius doctrinæ fontem hábuit; Summus Pontifex Benedíctus décimus quartus hæreticórum malleum dixit, ac Benedíctus décimus quintus catholicam religiónem propagántibus et tuéntibus exemplar indicávit.

        Vitæ religiosæ studiosíssimus, eam, inter purpuratos Patres adlectus, in exemplum servávit. Opes ultra necessarias nóluit; módico famulatu, ténui cultu habituque contentus: suórum non studuit opuléntiæ, ac vix adduci pótuit ut inópiam idéntidem levaret. De se humillime sensit, et mira fuit animi simplicitate. Deíparam diléxit unice: plures horas quotídie oratióni tribuebat. Parcíssime víctitans, ter in hebdomada jejunábat: in se constanter austérus, caritate in próximum flagrávit, vocátus sæpenúmero Pater páuperum. E baptismate innocéntiam ne vel levi quidem culpa macularet strenue contendit. Prope octogenarius, ad Sancti Andréæ in Colle Quirinali, extrémum in morbum íncidit, quem sólito virtútum fulgóre illustrávit. Moribundo Gregórius Papa décimus quintus et plures Cardinales adstitérunt, tantum Ecclésiæ cólumen éripi complorantes. Die sacrórum Stígmatum sancti Francisci, quorum memóriæ ubíque celebrandæ auctor fuerat, obdormívit in Dómino, anno millesimo sexcentésimo vigesimo primo. Mortuo tota cívitas parentávit, Sanctum uno ore conclámans. Eum vero Pius undecimus, Pontifex maximus, Beatórum primum ac deínde Sanctórum número adscripsit, et paulo post, ex Sacrórum Rituum Congregatiónis consulto, universalis Ecclésiæ Doctórem declarávit. Ejus corpus Romæ in templo Sancti Ignatii, apud sepúlcrum Sancti Aloísii, ut ipse optarat, pia veneratióne cólitur.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 5:13-19
      text: 'In illo témpore: Dixit Jesus discípulis suis: Vos estis sal terræ. Quod si sal evanúerit, in quo saliétur? ad níhilum valet ultra, nisi ut mittátur foras, et conculcétur ab homínibus. Vos estis lux mundi. Non potest cívitas abscóndi supra montem pósita, neque accéndunt lucérnam, et ponunt eam sub módio, sed super candelábrum, ut lúceat ómnibus qui in domo sunt. Sic lúceat lux vestra coram homínibus: ut vídeant ópera vestra bona, et gloríficent Patrem vestrum, qui in cælis est. Nolíte putáre quóniam veni sólvere legem aut prophétas: non veni sólvere, sed adimplére. Amen quippe dico vobis, donec tránseat cælum et terra, iota unum aut unus apex non præteríbit a lege, donec ómnia fiant. Qui ergo sólverit unum de mandátis istis mínimis, et docúerit sic hómines, mínimus vocábitur in regno cælórum: qui autem fécerit et docúerit, hic magnus vocábitur in regno cælórum.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Robert Bellarmine, Address 9, On the Integrity of the Doctors of the Church (from the beginning)
      text: |-
        Quemádmodum in Deo, quem unum in Trinitáte et Trinum in unitate veneramur, tria quædam singuláriter eminent, poténtia, sapiéntia, bonitas; ita quoque, auditores, singulares amicos et fílios suos, Patres ac Doctores nostros, Deus, ut sibi quam simillimos et géntibus ómnibus suspiciéndos atque admirábiles redderet, potentíssimos, sapientíssimos, optimos sanctissimósque esse vóluit. Primum ea poténtia eos armávit, qua multa præter sólitum cursum ordinemque natúræ in elementis, in arbóribus, in brutis animántibus, in ipsis homínibus plane admirabília et singularia fácerent. Deínde sapiéntia ita mentes eórum instruxit, ut non solum præséntia et prætérita cernerent, sed étiam futura multo ante prævidérent atque prædícerent. Postremo dilatávit corda eórum summa atque ardentíssima caritate, tum ut ipsi magno animo opus aggrederéntur, tum ut ii qui converténdi per eos erant, non solum verbis et miraculis, sed étiam exemplis et vitæ probitate moverentur.

        Prædicatores ígitur nostræ legis, tam ii qui primi ad nos fidem detulérunt et Evangélium, quam ii quos deínde singulis sæculis Deus excitávit ad fidem eamdem confírmandam vel propagandam, quales fúerint, quam pii, quam justi, quam religiosi totus mundus novit. Aspicite primum Apóstolos. Quid sublimius atque excellentius móribus Apostolicis? Aspicite deínde sanctos illos hómines, quos Patres et Doctores vocamus, lúmina illa claríssima, quæ Deus in firmaménto Ecclésiæ lucére vóluit, ut iis omnes hæreticórum ténebræ, dissiparéntur, ut Irenæum, Cyprianum, Hilárium, Athanasium, Basilíum, duos Gregórios, Ambrósium, Hierónymum, Augustínum, Chrysóstomum, Cyríllum. Vita et mores eórum nonne in iis monuméntis, quæ nobis reliquérunt, quasi in speculis quibusdam elucent? Nam ex abundántia cordis os lóquitur.

        Quanta, óbsecro, apparet in libris Sanctórum Patrum cum summa eruditióne conjuncta humilitas? Quanta sobrietas? Nihil ibi obscenum, nihil turpe, nihil súbdolum, nihil arrogans, nihil inflátum. Quam multis modis Spíritus Sanctus, qui eórum péctora inhabitabat, in páginis eórum se prodit? Quis legere potest atténte Cyprianum, qui non statim ardeat amóre martyrii? Quis in Augustino diligenter versátus est, qui non profundíssimam didicerit humilitátem? Quis Hieronymum sæpe evolvit, qui non virginitátem et jejunium adamare incipiat? Spirant scripta Sanctórum religiónem, castitátem, integritátem, caritátem. Isti sunt ígitur epíscopi et pastores (ut verbis utar divi Augustíni) docti, graves, sancti, veritátis acerrimi defensores, qui catholicam fidem in lacte suxérunt, in cibo sumpsérunt: cujus lac et cibum parvis magnisque ministravérunt. Tálibus post Apóstolos sancta Ecclésia plantatóribus, rigatóribus, ædificatóribus, pastóribus, nutritóribus crevit.
      status: verified
