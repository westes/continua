# Matins Nocturn 2 reading for St. Pius I, Pope, Martyr (Jul 11). No
# genuine SanctiM match: the only SanctiM files for this date,
# `SanctiM/07-11M.txt`/`07-11b.txt`, both belong to the Octave of St.
# Benedict (Jul 11-18 is the Monastic calendar's own octave of its
# patron's Mar 21 feast) — a missed pre-1955-pool candidate rather
# than a genuine SanctiM case (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-11.txt, English/Sancti/07-11.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Pius, hujus nóminis primus, Aquilejénsis, Ruffini fílius, ex presbytero sanctæ Romanæ Ecclésiæ Summus Pontifex creátus est, Antonino Pio et Marco Aurelio imperatóribus augustis. Quinque ordinatiónibus, mense Decembri, episcopos duódecim, octódecim presbyteros creávit. Exstant nonnulla ab eo præcláre instituta, præsertim ut Resurréctio Dómini nónnisi die Dominico celebrarétur. Pudentis domum in ecclésiam mutávit, eamque ob præstantiam supra ceteros titulos, útpote Romani Pontificis mansiónem, título Pastoris dicávit; et in qua sæpe rem sacram fecit, et multos ad fidem conversos baptizávit ac in fidelium númerum adscripsit. Dum vero boni pastoris munus obiret, fuso pro suis ovibus et summo pastore Christo sánguine, martyrio coronátus est quinto Idus Julii, ac sepúltus in Vaticano.
      status: verified
