# Nocturn 2-3, Second Sunday of Advent (temporalId advent-2). Sourced from
# Tempora/Adv2-0.txt (Latin) / English/Tempora/Adv2-0.txt. See
# advent-1.yml for the general sweep method.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from St. Jerome's
# Commentary on Isaiah, Book 4, on Isaiah 11 - combined into one reading.
# Responsory: Lectio4's own (Responsory4, "Ecce veniet Dominus").
#
# Nocturn 3 (Lectio7-9): Lectio7 carries real homily prose after its bare
# Gospel incipit (Matt 11:2-10, "Et réliqua") - Pope St. Gregory the
# Great's Homily 6 on the Gospels begins within Lectio7 itself, same
# pattern as advent-1. Combined Lectio7's homily portion (incipit dropped)
# with Lectio8-9, using Responsory7 ("Egrediétur Dóminus de Samaría").
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Jerome, Commentary on Isaiah, Book 4
      text: |-
        Et egrediétur virga de radíce Jesse. Usque ad principium visiónis, vel pónderis Babylónis, quod vidit Isaías, fílius Amos, omnis hæc prophetía de Christo est: quam per partes vólumus explanare, ne simul propósita atque disserta lectóris confundat memóriam. Virgam et florem de radíce Jesse ipsum Dóminum Judæi interpretántur: quod scilicet in virga regnántis poténtia, in flore pulchritúdo monstrétur.

        Nos autem virgam de radíce Jesse sanctam Mariam Vírginem intelligámus, quæ nullum hábuit sibi frúticem cohæréntem, de qua et supra légimus: Ecce virgo concípiet et pariet fílium. Et florem, Dóminum Salvatórem, qui dicit in Cántico canticórum: Ego flos campi, et lílium convallium.

        Super hunc ígitur florem, qui de trunco et radíce Jesse per Mariam Vírginem repénte consúrget, requiéscet Spíritus Dómini: quia in ipso complácuit omnem plenitúdinem divinitátis habitáre corporáliter: nequáquam per partes, ut in ceteris Sanctis: sed juxta Evangélium eórum, quod Hebræo sermóne conscríptum legunt Nazaræi: Descéndet super eum omnis fons Spíritus Sancti. Dóminus autem Spíritus est: et ubi Spíritus Dómini, ibi libertas.
      responsory: |-
        R. Ecce véniet Dóminus, protéctor noster, Sanctus Israël, * Corónam regni habens in cápite suo.
        V. Et dominábitur a mari usque ad mare, et a flúmine usque ad términos orbis terrárum.
        R. Corónam regni habens in cápite suo.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 11:2-10
      text: 'In illo témpore: Cum audísset Joánnes in vínculis ópera Christi, mittens duos de discípulis suis, ait illi: Tu es, qui ventúrus es, an alium exspectámus? Et respóndens Jesus, ait illis: Eúntes renuntiáte Joánni, quæ audístis et vidístis. Cæci vident, claudi ámbulant, leprósi mundántur, surdi áudiunt, mórtui resúrgunt, páuperes evangelizántur: et beátus est, qui non fúerit scandalizátus in me. Illis autem abeúntibus, cœpit Jesus dícere ad turbas de Joánne: Quid exístis in desértum vidére? arúndinem vento agitátam? Sed quid exístis vidére? hóminem móllibus vestitum? Ecce, qui móllibus vestiúntur, in dómibus regum sunt. Sed quid exístis vidére? Prophétam? Etiam dico vobis, et plus quam Prophétam. Hic est enim, de quo scriptum est: Ecce, ego mitto Angelum meum ante fáciem tuam, qui præparábit viam tuam ante te.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 6 on the Gospels
      text: |-
        Visis tot signis tantísque virtútibus, non scandalizári quisque pótuit, sed admirári. Sed infidélium mens grave in illo scándalum pértulit, cum eum post tot mirácula moriéntem vidit. Unde et Paulus dicit: Nos autem prædicámus Christum crucifíxum, Judǽis quidem scándalum, géntibus autem stultítiam. Stultum quippe homínibus visum est, ut pro homínibus Auctor vitæ morerétur: et inde contra eum homo scándalum sumpsit, unde ei ámplius débitor fíeri débuit. Nam tanto Deus ab homínibus dígnius honorándus est, quanto pro homínibus et indígna suscépit.

        Quid est ergo dicere: Beátus qui non fúerit scandalizátus in me; nisi apérta voce abjectiónem mortis suæ humilitátemque signare? Ac si patenter dicat: Mira quidem facio, sed abjecta pérpeti non dedignor. Quia ergo moriéndo te súbsequor, cavéndum valde est homínibus, ne in me mortem despíciant, qui signa venerántur.

        Sed dimissis Joánnis discípulis, quid de eodem Joánne turbis dicat, audiámus: Quid exístis in desértum vidére? Arúndinem vento agitatam? Quod videlicet non asseréndo, sed negando intulit. Arúndinem quippe mox ut aura contígerit, in partem álteram inflectit. Et quid per arúndinem, nisi carnalis animus designátur? Qui mox ut favore vel detractióne tangitur, statim in partem quámlibet inclinátur?
      responsory: |-
        R. Egrediétur Dóminus de Samaría ad portam, quæ réspicit ad Oriéntem: et véniet in Béthlehem ámbulans super aquas redemptiónis Judæ: * Tunc salvus erit omnis homo: quia ecce véniet.
        V. Et præparábitur in misericórdia sólium ejus, et sedébit super illud in veritáte.
        R. Tunc salvus erit omnis homo: quia ecce véniet.
      status: verified
