# Read directly from web/www/horas/Latin/Sancti/10-11.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui de beátæ Maríæ Vírginis útero Verbum tuum, Angelo nuntiánte,
    carnem suscípere voluísti: præsta supplícibus tuis: ut qui vere eam
    Genetrícem Dei crédimus, ejus apud te intercessiónibus adjuvémur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat
    in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (maternity-of-the-bvm-antiphon.yml), paired with the standard BVM commemoration versicle already verified elsewhere in this app (propers/common/lauds-suffrage-bvm.yml -- 'V. Ora pro nobis sancta Dei Genitrix'). Collect is the saint's own real proper (maternity-of-the-bvm-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Cum jucunditáte * Maternitátem beátæ Maríæ semper Vírginis celebrémus.
    V. Ora pro nobis sancta Dei Génitrix.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Deus, qui de beátæ Maríæ Vírginis útero Verbum tuum, Angelo nuntiánte,
    carnem suscípere voluísti: præsta supplícibus tuis: ut qui vere eam
    Genetrícem Dei crédimus, ejus apud te intercessiónibus adjuvémur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat
    in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# the Maternity of the BVM: proper Matins hymn, Latin/Sancti/10-11.txt's [Hymnus Matutinum]. English from English/Sancti/10-11.txt.
# Before this file the saint fell to the Common's hymn.
matins-hymn:
  text: |
    Cælo Redémptor prǽtulit
    Felícis alvum Vírginis,
    Ubi futúra víctima
    Mortále corpus índuit.

    Hæc Virgo nobis édidit
    Nostræ salútis áuspicem,
    Qui nos redémit sánguine,
    Pœnas crucémque pértulit.

    Spes læta nostro e péctore
    Pellat timóres ánxios:
    Hæc quippe nostras lácrimas
    Precésque defert Fílio.

    Voces Paréntis éxcipit,
    Votísque Natus ánnuit:
    Hanc quisque semper díligat,
    Rebúsque in arctis ínvocet.

    Sit Trinitáti glória,
    Quæ Matris intáctum sinum
    Ditávit almo gérmine,
    Laus sit per omne sǽculum.
    Amen.
  status: verified

# Read from web/www/horas/Latin/Sancti/10-11.txt's own [Invit] (no
# Monastic override exists) and its English counterpart.
matins-invitatory:
  text: 'Maternitátem beátæ Maríæ Vírginis celebrémus: * Christum ejus Fílium adorémus Dóminum.'
  status: verified

# Sourced from web/www/horas/Latin/Sancti/10-11.txt's own [Capitulum
# Laudes] and English/Sancti/10-11.txt's own translation. Authoring this
# was necessary for the feast's own hymn (lauds-hymn-maternity-of-the-
# bvm.yml) to actually be reached at all: hours/resolve-common.ts's
# resolveOfficeBundle is all-or-nothing per id -- her own `common:
# common-of-the-bvm` field means without a chapter of her own, the whole
# bundle (hymn included) fell through to that Common's generic text.
lauds-capitulum:
  text: 'Qui creávit me, requiévit in tabernáculo meo, et dixit mihi: in Jacob inhábita, et in eléctis meis mitte radíces.'
  citation: Sir 24:12-13
  status: verified

# Sourced from web/www/horas/Latin/Sancti/10-11.txt's own [Hymnus Laudes]
# (first 3 stanzas) and English/Sancti/10-11.txt's own translation; the
# closing doxology stanza is the standard "Nat" doxology (per this feast's
# own `Doxology=Nat` rule), reused verbatim from hymn-doxology-nat.yml's
# Latin, with the reference engine's own (differently-worded but
# equivalent) English translation for this specific hymn kept instead of
# that file's own English. No Vespers hymn exists in the source for this
# feast at all (both the Latin and English files' own [Hymnus Vespera]
# blocks are empty) -- correctly falls to common-of-the-bvm's Vespers
# hymn, not a gap.
lauds-hymn:
  text: |-
    Te, Mater alma Núminis,
    Orámus omnes súpplices,
    A fraude nos ut dǽmonis
    Tua sub umbra prótegas.

    Ob pérditum nostrum genus
    Primi paréntis crimine,
    Ad ínclitum Matris decus
    Te rex suprémus éxtulit.

    Cleménter ergo próspice
    Lapsis Adámi pósteris:
    A te rogátus Fílius
    Depónat iram víndicem.

    Glória tibi, Dómine,
    Qui natus es de Vírgine,
    Cum Patre, et Sancto Spíritu,
    In sempitérna sǽcula. Amen.
  status: verified

# No distinct Lauds versicle found for this feast in the reference source
# beyond her own Matins nocturn versicle (a different slot); reusing
# common-of-the-bvm's own Lauds versicle, same pattern as her chapter/
# hymn tiers not needing anything beyond the Common where nothing proper
# was found. Authored to make the feast's own bundle (needed for her own
# hymn, see lauds-capitulum-maternity-of-the-bvm.yml) render a real versicle instead of
# an unconditionally-rendered empty one.
lauds-versicle:
  text: |
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
  status: verified

# No distinct Vespers hymn found for this feast in the reference source
# (both Latin/English [Hymnus Vespera] blocks are empty); reusing
# common-of-the-bvm's own Vespers hymn ("Ave maris stella") verbatim.
# Authored to make the feast's own bundle (needed for her own Lauds
# hymn, see lauds-capitulum-maternity-of-the-bvm.yml -- Vespers falls back to the same
# Lauds capitulum via lookupPart (Vespers chapter, Lauds sibling)) render a real hymn
# instead of an unconditionally-rendered empty one.
vespers-hymn:
  text: |-
    Ave maris stella,
    Dei Mater alma,
    Atque semper Virgo,
    Felix cæli porta.

    Sumens illud Ave
    Gabriélis ore,
    Funda nos in pace,
    Mutans Hevæ nomen.

    Solve vincla reis,
    Profer lumen cæcis,
    Mala nostra pelle,
    Bona cuncta posce.

    Monstra te esse matrem,
    Sumat per te preces,
    Qui pro nobis natus,
    Tulit esse tuus.

    Virgo singuláris,
    Inter omnes mitis,
    Nos culpis solútos
    Mites fac et castos.

    Vitam præsta puram,
    Iter para tutum,
    Ut vidéntes Jesum,
    Semper collætémur.

    Sit laus Deo Patri,
    Summo Christo decus,
    Spirítui Sancto,
    Tribus honor unus. Amen.
  status: verified

