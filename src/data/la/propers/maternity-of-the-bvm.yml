# Sourced from web/www/horas/Latin/Sancti/10-11.txt's own [Ant Vespera]
# block. Maternity of the BVM (instituted 1931) doesn't exist in the
# Monastic Tridentinum 1617 calendar at all -- a live "Hodie" query for
# 2026-10-11 under that version just renders the plain 20th Sunday after
# Pentecost, confirming there's no live-render path to verify this feast
# against under that version; using the static secular file directly
# instead, same as Nativity BVM's own Common-of-the-BVM invitatory
# sourcing. Only the first 4 of the raw file's 5 listed antiphons are
# used (Monastic Vespers has 4 psalm slots, not 5).
vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: Beáta es, * Virgo María, quæ ómnium portásti Creatórem.
    - psalms:
        - 112
      antiphon: Genuísti, * qui te fecit, et in ætérnum pérmanes Virgo.
    - psalms:
        - 121
      antiphon: Cum essem párvula, * plácui Altíssimo et de meis viscéribus génui Deum et hóminem.
    - psalms:
        - 126
      antiphon: Benedícta fília * tu a Dómino, quia per te fructum vitæ communicávimus.

# Matins Nocturn 2-3 readings for the Maternity of the Blessed Virgin
# Mary (Oct 11). Sourced directly from
# web/www/horas/Latin/Sancti/10-11.txt, English/Sancti/10-11.txt.
# Nocturn 2: Lectio4-5 (two excerpts from Pope St. Leo the Great's own
# Nativity sermons) plus Lectio6 (Pius XI's own history of this feast's
# institution, 1931, for the 1500th anniversary of the Council of
# Ephesus), combined into one reading, not Gospel-tied. Nocturn 3:
# Lectio7-9, St. Bernard of Clairvaux's Homily 1 in Praise of the
# Virgin Mother (on Luke 2:43-51, the Finding in the Temple -- "Fili,
# quid fecísti nobis sic?" is this homily's own opening line, quoting
# that pericope directly, not the "Missus est"/Annunciation Bernard
# series reused elsewhere in this store).
#
# Update (2026-09-05): the Gospel pericope itself (Luke 2:43-51) is now
# authored too (isGospel: true, immediately before the homily) --
# sourced from missa/Latin/Sancti/10-11.txt's own [Evangelium] (this
# same feast's own Mass Gospel) and its English parallel, not guessed
# at, and not the Annunciation pericope (Luke 1:26-38) initially
# suspected -- this feast's own Nocturn 3 Gospel is genuinely the
# Finding in the Temple, confirmed via horas/Latin/Sancti/10-11.txt's
# own Lectio7.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope St. Leo the Great, Sermons 1-2 on the Nativity of the Lord; Acts of Pope Pius XI
      text: |-
        Virgo régia Davídicæ stirpis elígitur, quæ sacro gravidánda fetu, divínam humanámque prolem prius concíperet mente quam córpore: et ne supérni ignára consílii ad inusitátos pavéret affátus, quod in ea operándum erat a Spíritu Sancto, collóquio dídicit angélico, nec damnum crédidit pudóris Dei Génetrix mox futúra. Cur enim de conceptiónis novitáte despéret, cui efficiéntia de Altíssimi virtúte promíttitur? Confirmátur credéntis fides étiam præeúntis attestatióne miráculi. Donátur Elísabeth inopináta fecúnditas, ut qui concéptum déderat stérili, datúrus non dubitarétur et Vírgini. Verbum ígitur Dei Fílius, qui in princípio erat apud Deum, per quem facta sunt ómnia, et sine quo factum est nihil, propter liberándum hóminem ab ætérna morte, factus est homo.

        Ingréditur hæc ínfima Jesus Christus Dóminus noster de cæli sede descéndens, et a patérna glória non recédens, novo órdine, nova nativitáte generátus. Novo órdine, quia invisíbilis in suis, visíbilis factus est in nostris: incomprehensíbilis vóluit comprehéndi: ante témpora manens, esse cœpit in témpore. Nova autem nativitáte génitus est: concéptus a Vírgine, natus ex Vírgine, sine patérnæ carnis concupiscéntia, sine matérnæ integritátis injúria: quia futúrum hóminum Salvatórem talis ortus decébat, qui et in se habéret humánæ substántiæ natúram, et humánæ carnis inquinaménta nescíret. Orígo dissímilis, sed natúra consímilis; humáno usu et consuetúdine, quod crédimus, caret: sed divína potestáte subníxum est, quod Virgo concéperit, Virgo pepérerit, Virgo permánserit.

        Cum anno millésimo nongentésimo trigésimo primo, univérso orbe cathólico plaudénte, solémnia celebraréntur expléti sǽculi décimi quinti, postquam in Ephesína sýnodo beáta María Virgo, de qua natus est Jesus, contra Nestórii hǽresim Mater Dei a Pátribus, Cælestíno Papa præeúnte, conclamáta est, Summus Póntifex Pius undécimus faustíssimi evéntus memóriam, perénni suæ pietátis testimónio perpetuándam vóluit. Itaque quod jam in Urbe exstábat nóbile Ephesínæ proclamatiónis monuméntum, triumphálem arcum in Basílica sanctæ Maríæ Majóris in Exquíliis, a decessóre suo Xysto tértio mirábili ópere musívo ornátum, témporis injúria fatiscéntem felíciter restituéndum una cum ala transvérsa Basílicæ munificéntia sua curávit. Lítteris vero encýclicis, Œcuménici Concílii Ephesíni genuínis lineaméntis descríptis, ineffábile divínæ Maternitátis beátæ Maríæ Vírginis privilégium, pie copioséque illustrávit, ut tam excélsi mystérii doctrína áltius fidélium ánimis insidéret. Demum, ut neque litúrgicum deésset monuméntum jussit ut festum divínæ Maternitátis beátæ Maríæ Vírginis cum Missa et Offício própriis die undécima octóbris sub ritu dúplici secúndæ classis quotánnis ab univérsa Ecclésia celebrarétur.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 2:43-51
      text: 'In illo témpore: Cum redírent, remánsit puer Jesus in Jerúsalem, et non cognovérunt paréntes ejus. Existimántes autem illum esse in comitátu, venérunt iter diei, et requirébant eum inter cognátos, et notos. Et non inveniéntes, regréssi sunt in Jerúsalem, requiréntes eum. Et factum est, post tríduum invenérunt illum in templo sedéntem in médio doctórum, audiéntem illos, et interrogántem eos. Stupébant autem omnes, qui eum audiébant, super prudéntia et respónsis ejus. Et vidéntes admiráti sunt. Et dixit mater ejus ad illum: Fili, quid fecísti nobis sic? ecce pater tuus, et ego doléntes quærebámus te. Et ait ad illos: Quid est quod me quærebátis? nesciebátis quia in his, quæ Patris mei sunt, opórtet me esse? Et ipsi non intellexérunt verbum, quod locútus est ad eos. Et descéndit cum eis, et venit Názareth: et erat súbditus illis.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernard of Clairvaux, Homily 1 in Praise of the Virgin Mother
      text: |-
        Deum et Dóminum Angelórum María suum fílium appéllat, dicens: Fili, quid fecísti nobis sic? Quis hoc áudeat Angelórum? Súfficit eis, et pro magno habent, quod cum sint spíritus ex conditióne, ex grátia facti sint et vocáti Angeli, testánte David: Qui facit Angelos suos spíritus. María vero matrem se agnóscens, majestátem illam, cui illi cum reveréntia sérviunt, cum fidúcia suum núncupat Fílium: nec dedignátur nuncupári Deus, quod esse dignátus est. Nam paulo post subdit Evangelísta: Et erat súbditus illis. Quis? Quibus? Deus homínibus? Deus, inquam, cui Angeli súbditi sunt, cui Principátus et Potestátes obédiunt, súbditus erat Maríæ.

        Miráre utrúmlibet, et élige quod ámplius miréris, sive Fílii benigníssimam dignatiónem, sive Matris excellentíssimam dignitátem. Utrímque stupor, utrímque miráculum. Et quod Deus féminæ obtémperet, humílitas absque exémplo: et quod Deo fémina principétur, sublímitas sine sócio. In láudibus Vírginum singuláriter cánitur quod sequúntur Agnum quocúmque íerit. Quibus ergo láudibus júdicas dignam, quæ étiam præit? Disce, homo, obedíre: disce, terra, subdi; disce, pulvis, obtemperáre. De Auctóre tuo loquens Evangelísta: Et erat, inquit, súbditus illis. Erubésce, supérbe cinis! Deus se humíliat, et tu te exáltas? Deus se homínibus subdit, et tu, dominári géstiens homínibus, tuo te præpónis Auctóri?

        Felix María, cui nec humílitas défuit, nec virgínitas! Et quidem singuláris virgínitas, quam non temerávit, sed honorávit fecúnditas. Et nihilóminus speciális humílitas, quam non ábstulit, sed éxtulit fecúnda virgínitas: et incomparábilis prorsus fecúnditas, quam virgínitas simul comitátur et humílitas. Quid horum non mirábile? quid non incomparábile? quid non singuláre? Venerámini ergo, cónjuges, in carne corruptíbili carnis integritátem: vos sacræ vírgines in Vírgine fecunditátem. Imitámini, omnes hómines, Dei Matris humilitátem.
      status: verified
