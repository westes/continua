# Matins Nocturn 2 reading for St. Eusebius, Pope and Martyr (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/09-26-Eusebius.txt, [Lectio4]-[Lectio5], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Eusébius natióne Græcus, patre médico, post sanctum Marcellum Románæ Ecclésiæ est constitútus epíscopus. Is hæréticos invénit in Urbe, quos resipiscentes sola mánuum impositióne Ecclésiæ reconciliavit. Cui et e Sardinia accédens nóbilis fémina Restitúta, fílium suum erudiendum trádidit, quem egrégie fide christiána imbútum baptizávit, sudque ndmine insignívit, atque Eusebium nominavit. Dignum plane tanti Pontíficis germen, quo Vercellensi póstea epíscopo fides cathólica in Oriénte propémodum exstincta, lætiore propagine revivisceret.
      status: verified
