# Read from the reference engine: web/www/horas/Latin/Sancti/08-09.txt [Oratio];
# English from English/Sancti/08-09.txt.
collect:
  text: |
    Orémus.
    Omnípotens et miséricors Deus, qui sanctum Joánnem Maríam pastoráli stúdio et jugi oratiónis ac pœniténtiæ ardóre mirábilem effecísti: da, quǽsumus; ut, ejus exémplo et intercessióne, ánimas fratrum lucrári Christo, et cum eis ætérnam glóriam cónsequi valeámus.
    Per eúmdem Dóminum nostrum Jesum Christum Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-a-confessor; collect is the saint's own (collect-st-john-vianney.yml). Not
# independently live-verified for this category, so marked draft.
commemoration:
  text: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, intra in gáudium Dómini tui.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
