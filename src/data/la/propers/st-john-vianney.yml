# Matins Nocturn 2 reading for St. John Mary Vianney, Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/08-09.txt, English/Sancti/08-09.txt.
# Lectio4-6 combined into one reading, one continuous vita.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Joánnes Maria Vianney, in pago Dardilly, Diœcesis Lugdunénsis piis ruriculis ortus, ab infántia plura dedit sanctitátis indicia. Cum octennis oves custodiret, modo puerulos, ad imáginem Deíparæ genuflexos, Rosárium verbo et exemplo edocére, modo sorori vel alteri commisso grege, secretiórem locum pétere solebat, quo expeditior ante simulacrum Vírginis, oratióni vacaret. Páuperum amantíssimus, eos turmatim in patris domum dedúcere et omnímodo adjuvare in deliciis habebat. Litteris imbuendus, párocho Vici Ecully tráditus est; sed ut erat tardioris ingenii, in stúdiis fere insuperábiles expertus est difficultates. Jejunio et oratióne divinam opem implorávit, et facilitátem discéndi rogatúrus, tumulum sancti Francisci Regis, stipem quæritans, adívit, Theologíæ curriculo operose confecto, satis idoneus invéntus est, qui sacris initiarétur.

        In pago Ecully, præeunte párocho, cujus vicarius renunciátus fuerat, potiores pastoralis perfectiónis gradus totis viribus attingere contendit. Elapso triennio, in viculum Ars qui non ita multo post diœcesi Bellicénsi adscriptus est, quasi Angelus de cælo fuit missus et omnino squalentis ac desertæ suæ parœciæ fáciem florentíssime renovávit. In consciéntiis judicándis ac moderandis ad plurimas horas quotídie assiduus, frequentem Eucharistiæ usum invéxit, pias sodalitates instaurávit: mirum autem in modum téneram in Immaculátam Vírginem ánimis pietátem índidit. Ratus vero pastoris esse, flagítia concréditæ plebis expiare, nec oratiónibus, nec vigiliis, maceratiónibus et continuis jejuniis parcebat. Tantam viri Dei virtútem cum Satan ferre non posset, eum vexatiónibus primum, dein aperto certamine adortus est; sed atrocíssimas afflictiónes patienter tolerábat Joánnes Maria.

        Invitabátur sæpius a curiónibus vicínis ut, Missionariórum more, animárum saluti, qua concionando, qua confessiónes excipiéndo consúleret et singulis præsto semper erat. Studio glóriæ Dei incénsus, effécit, ut pia Missiónum exercítia in ámplius centum parœciis, constituto perpetuo censu, institueréntur. Inter hæc, Deo servum suum miraculis et charismátibus illustrante, orta est celebris illa peregrinátio, qua, per vicennium centum fere míllia hóminum cujusque ordinis et ætátis, quotannis Ars conflúxerint non solum e Galliæ et Europæ, sed étiam Américæ díssitis provinciis. Labóribus potius quam senio consumptus, prænuntiáto suæ mortis die, in osculo Dómini quiévit, die quarta Augusti, anno millesimo octingentésimo quinquagesimo nono, annos natus tres ac septuagínta. Quem multis clarum miraculis, Pius décimus inter Beatos, Pius vero undecimus inter Sanctos Cælites anno sacro adscripsit, ejusque festum ad universam Ecclésiam extendit, anno vero quinquagesimo sacerdotii sui ómnium parochórum cælestem patronum constítuit.
      status: verified
