# Nocturn 2-3, First Sunday of Advent (temporalId advent-1). Sourced from
# the reference engine's Tempora/Adv1-0.txt (Latin) / English/Tempora/
# Adv1-0.txt. Part of the temporal-cycle nocturn-readings sweep extending
# the post-Pentecost season's method (see post-pentecost-01.yml/-02.yml
# and TODO.md's "Temporal-cycle nocturn-readings sweep") to the rest of
# the liturgical year.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from St. Leo the Great's
# 8th Sermon on the December Fast and almsgiving - no source break,
# combined into one reading. Responsory: Lectio4's own (Responsory4, "Ave
# Maria").
#
# Nocturn 3 (Lectio7-9): Lectio7 itself already carries real homily prose
# after its bare Gospel incipit (Luke 21:25-33, "Et réliqua") - Pope St.
# Gregory the Great's own Homily 1 on the Gospels begins within Lectio7,
# not just at Lectio8 (distinct from the post-pentecost-02-style pattern
# where the homily proper only starts at the lesson after the incipit).
# Combined Lectio7's homily portion (incipit dropped) with Lectio8-9 into
# one continuous reading, using Responsory7 ("Ecce virgo concipiet") - the
# first responsory of the group the combined reading actually spans.
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Leo the Great, Sermon 8 on the December Fast and Almsgiving
      text: |-
        Cum de advéntu regni Dei, et de mundi fine ac témporum, discípulos suos Salvátor instrúeret, totámque Ecclésiam suam in Apóstolis erudíret: Cavéte, inquit, ne forte gravéntur corda vestra in crápula, et ebrietáte, et cogitatiónibus sæculáribus. Quod útique præcéptum, dilectíssimi, ad nos speciálius pertinére cognóscimus, quibus denuntiátus dies, etiámsi est occúltus, non dubitátur esse vicínus.

        Ad cujus advéntum omnem hóminem cónvenit præparári: ne quem aut ventri déditum, aut curis sæculáribus invéniat implicátum. Quotidiáno enim, dilectíssimi, experiménto probátur, potus satietáte áciem mentis obtúndi, et cibórum nimietáte vigórem cordis hebetári; ita ut delectátio edéndi étiam córporum contrária sit salúti, nisi rátio temperántiæ obsístat illécebræ, et quod futúrum est óneri, súbtrahat voluptáti.

        Quamvis enim sine ánima nihil caro desíderet, et inde accípiat sensus, unde sumit et motus: ejúsdem tamen est ánimæ, quædam sibi súbditæ negáre substántiæ, et interióri judício ab inconveniéntibus exterióra frenáre: ut a corpóreis cupiditátibus sǽpius líbera, in aula mentis possit divínæ vacáre sapiéntiæ: ubi omni strépitu terrenárum silénte curárum, in meditatiónibus sanctis, et in delíciis lætétur ætérnis.
      responsory: |-
        R. Ave, María, grátia plena, Dóminus tecum: * Spíritus Sanctus supervéniet in te, et virtus Altíssimi obumbrábit tibi: quod enim ex te nascétur Sanctum, vocábitur Fílius Dei.
        V. Quómodo fiet istud, quóniam virum non cognósco? Et respóndens Angelus, dixit ei.
        R. Spíritus Sanctus supervéniet in te, et virtus Altíssimi obumbrábit tibi: quod enim ex te nascétur Sanctum, vocábitur Fílius Dei.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 21:25-33
      text: 'In illo témpore: Dixit Jesus discípulis suis: Erunt signa in sole et luna et stellis, et in terris pressúra géntium præ confusióne sónitus maris et flúctuum: arescéntibus homínibus præ timóre et exspectatióne, quæ supervénient univérso orbi: nam virtútes cœlórum movebúntur. Et tunc vidébunt Fílium hóminis veniéntem in nube cum potestáte magna et majestáte. His autem fíeri incipiéntibus, respícite et leváte cápita vestra: quóniam appropínquat redémptio vestra. Et dixit illis similitúdinem: Vidéte ficúlneam et omnes árbores: cum prodúcunt jam ex se fructum, scitis, quóniam prope est æstas. Ita et vos, cum vidéritis hæc fíeri, scitóte, quóniam prope est regnum Dei. Amen, dico vobis, quia non præteríbit generátio hæc, donec ómnia fiant. Cœlum et terra transíbunt: verba autem mea non transíbunt.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 1 on the Gospels
      text: |-
        Dóminus ac Redémptor noster parátos nos inveníre desíderans, senescéntem mundum quæ mala sequántur denúntiat, ut nos ab ejus amóre compéscat. Appropinquántem ejus términum quantæ percussiónes prævéniant, innotéscit: ut, si Deum metúere in tranquillitáte nólumus, saltem vicínum ejus judícium vel percussiónibus attríti timeámus.

        Huic étenim lectióni sancti Evangélii, quam modo vestra fratérnitas audívit, paulo supérius Dóminus præmísit, dicens: Exsúrget gens contra gentem, et regnum advérsus regnum: et erunt terræmótus magni per loca, et pestiléntiæ, et fames. Et quibúsdam interpósitis, hoc, quod modo audístis, adjúnxit: Erunt signa in sole, et luna, et stellis, et in terris pressúra géntium præ confusióne sónitus maris, et flúctuum. Ex quibus profécto ómnibus ália jam facta cérnimus, ália in próximo ventúra formidámus.

        Nam gentem contra gentem exsúrgere, earúmque pressúram terris insístere, plus jam in nostris tempóribus cérnimus, quam in codícibus légimus. Quod terræmótus urbes innúmeras óbruat, ex áliis mundi pártibus scitis quam frequénter audívimus. Pestiléntias sine cessatióne pátimur. Signa vero in sole, et luna, et stellis, adhuc apérte mínime vídimus: sed quia et hæc non longe sint, ex ipsa jam áëris immutatióne collígimus.
      responsory: |-
        R. Ecce virgo concípiet, et páriet fílium, dicit Dóminus: * Et vocábitur nomen ejus Admirábilis, Deus, Fortis.
        V. Super sólium David, et super regnum ejus sedébit in ætérnum.
        R. Et vocábitur nomen ejus Admirábilis, Deus, Fortis.
      status: verified
