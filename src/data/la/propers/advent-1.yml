# Verified against Divinum Officium (Monastic Tridentinum 1617) -- read
# directly from the reference engine's own real-date output (not
# reconstructed from memory). Keyed Pentecost/offset-based
# ("post-pentecost-N") rather than Trinity-counted deliberately: this is
# content storage, kept scheme-agnostic, independent of whatever counting
# convention calendar/day-label.ts shows on screen for the same Sunday.
collect:
  text: |
    Orémus.
    Excita, quǽsumus, Dómine, poténtiam tuam, et veni: ut ab imminéntibus peccatórum nostrórum perículis, te mereámur protegénte éripi, te liberánte salvári:
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2027-11-28); Latin and English both taken from the page.
lauds-capitulum:
  text: 'Fratres: Hora est jam nos de somno súrgere: nunc enim própior est nostra salus, quam cum credídimus.'
  citation: Rom 13:11
  status: verified

# Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2027-11-28); Latin and English both taken from the page.
lauds-hymn:
  text: |
    Vox clara ecce íntonat,
    Obscúra quæque íncrepat:
    Pellántur éminus sómnia;
    Ab æthre Christus prómicat.

    Mens jam resúrgat tórpida
    Quæ sorde exstat sáucia;
    Sidus refúlget jam novum,
    Ut tollat omne nóxium.

    E sursum Agnus míttitur
    Laxáre gratis débitum:
    Omnes pro indulgéntia
    Vocem demus cum lácrimis,

    Secúndo ut cum fúlserit,
    Mundúmque horror cínxerit,
    Non pro reátu púniat,
    Sed nos pius tunc prótegat.

    Laus, honor, virtus, glória,
    Deo Patri, et Fílio,
    Sancto simul Paráclito,
    In sæculórum sǽcula.
    Amen.
  status: verified

