# Read from the reference engine: web/www/horas/Latin/Sancti/11-09cc.txt [Oratio];
# English from English/Sancti/11-09cc.txt.
collect:
  text: |
    Orémus.
    Deus, qui nos beáti Theodóri Mártyris tui confessióne gloriósa circúmdas et prótegis: præsta nobis ex ejus imitatióne profícere, et oratióne fulcíri.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# No proper antiphon of his own -- standard de-Communi text and versicle for
