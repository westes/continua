# Matins Nocturn 2 reading for St. Theodore, Martyr. Sourced directly from
# web/www/horas/Latin/Sancti/11-09cc.txt, English/Sancti/11-09cc.txt.
# single lesson (Lectio93), one continuous account.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Theodórus, miles christiánus, Maximiáno imperatóre, quod idolórum fanum incendísset, comprehénsus, cum a præfécto legiónis pœna ei remitterétur, si pœ́nitens facti christiánam fidem exsecrarétur, constánter in fídei confessióne persevérans, missus est in cárcerem. Ubi, úngulis excarnificátus, dum costæ nudaréntur, lætus canébat: Benedícam Dóminum in omni témpore. Quare, in ardéntem rogum injéctus, in oratióne et divínis láudibus ánimam Christo réddidit, quinto Idus Novémbris. Cujus corpus Eusébia matróna, síndone involútum, sepelívit in suo prǽdio.'
      status: verified
