# Corrected 2026-09-10: this file previously contained "Tibi Christe
# splendor Patris" -- St. Michael's Apparition hymn (May 8), copy-pasted
# from the wrong feast. Guardian Angels' Matins hymn is, per the reference
# source (Sancti/10-02.txt), `[Hymnus Matutinum]` `@:Hymnus Vespera` -- a
# straight cross-reference reusing the Vespers hymn verbatim ("Custódes
# hóminum psállimus Angelos"), same text as vespers-hymn-guardian-
# angels.yml. No separate Monastic recension exists. Final stanza is
# fixed -- no `*` marker anywhere in the source.
matins-hymn:
  text: |-
    Custódes hóminum psállimus Angelos,
    Natúræ frágili quos Pater áddidit
    Cæléstis cómites, insidiántibus
    Ne succúmberet hóstibus.

    Nam, quod corrúerit próditor ángelus,
    Concéssis mérito pulsus honóribus,
    Ardens invídia péllere nítitur
    Quos cælo Deus ádvocat.

    Huc, custos, ígitur pérvigil ádvola,
    Avértens pátria de tibi crédita
    Tam morbos ánimi quam requiéscere
    Quidquid non sinit íncolas.

    Sanctæ sit Tríadi laus pia júgiter,
    Cujus perpétuo númine máchina
    Triplex hæc régitur, cujus in ómnia
    Regnat glória sǽcula. Amen.
  status: verified

