# Transcribed from the reference engine's own source files (Latin:
# web/www/horas/Latin/Sancti/10-02.txt + SanctiM/10-02.txt, English:
# web/www/horas/English/Sancti/10-02.txt), Monastic Tridentinum 1617
# rubric. Companion file to ../apparition-of-st-michael.yml — see that
# file's own header for the "Common-of-an-Angel doesn't exist" context.
#
# The secular [Ant Matutinum] supplies 9 distinct proper antiphons.
# Versum blocks fall back to Apparition of St. Michael (Sancti/05-08)
# without Paschaltide alleluias, since Oct 2 is never in Paschaltide.
#
# Monastic structure (SanctiM/10-02.txt): 12 lectiones → 6+6+3
# (N1 = Ps 8,10,14,18,23,33; N2 = Ps 89,95,96,97,98,102; N3 = canticles
# Isa 33:2-10, Isa 33:13-18, Sir 36:14-19). N2 is composed from secular
# line 7 (s/95/89/) + [AntMatutinumM]:1 (Ps 95) + line 8 + [AntMatutinumM]:2-3
# (Ps 97, 98) + line 9 — same N2 psalm pool as st-michael.yml.
matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 8
        antiphon: Dóminus, Deus * cæli et terræ, ipse mittet Angelum suum coram te.
      - psalms:
          - 10
        antiphon: Deus meus * misit Angelum suum et conclúsit ora leónum, et non nocuérunt mihi.
      - psalms:
          - 14
        antiphon: Bene ambulétis, * et Dóminus sit in itínere vestro, et Angelus ejus comitétur vobíscum.
      - psalms:
          - 18
        antiphon: 'Cum essem vobíscum, * per voluntátem Dei eram: ipsum benedícite et cantáte ei.'
      - psalms:
          - 23
        antiphon: Tollens se Angelus Dómini, * qui præcedébat castra Israël, ábiit post eos.
      - psalms:
          - 33
        antiphon: Immíttet Angelus Dómini * in circúitu timéntium eum, et erípiet eos.
    versicle:
      v: Stetit Angelus juxta aram templi.
      r: Habens thuríbulum áureum in manu sua.
  nocturn2:
    groups:
      - psalms:
          - 89
        antiphon: Misit Dóminus * Angelum suum, qui percússit omnem virum robústum et bellatórem, et príncipem exércitus regis Assyriórum.
      - psalms:
          - 95
        antiphon: Stetit Angelus * juxta aram templi, habens thuríbulum áureum in manu sua.
      - psalms:
          - 96
        antiphon: 'Adoráte Dóminum * omnes Angeli ejus: audívit, et lætáta est Sion.'
      - psalms:
          - 97
        antiphon: Mitte, Dómine, * Angelum bonum ante nos in timóre bráchii tui, ut métuant qui odérunt nos.
      - psalms:
          - 98
        antiphon: 'Angelus meus * vobíscum est, dicit Dóminus: ipse autem exquíret ánimas vestras.'
      - psalms:
          - 102
        antiphon: Benedícite Dómino, * omnes Angeli ejus, poténtes virtúte, faciéntes verbum illíus, ad audiéndam vocem sermónum ejus.
    versicle:
      v: Ascéndit fumus arómatum in conspéctu Dómini.
      r: De manu Angeli.
  nocturn3:
    antiphon: Ecce ego * mitto Angelum meum, qui præparábit viam meam ante fáciem tuam.
    canticles:
      - refs:
          - book: isa
            chapter: 33
            verses: 2-10
      - refs:
          - book: isa
            chapter: 33
            verses: 13-18
      - refs:
          - book: sir
            chapter: 36
            verses: 14-19
    versicle:
      v: In conspéctu Angelórum psallam tibi, Deus meus.
      r: Adorábo ad templum sanctum tuum, et confitébor nómini tuo.

