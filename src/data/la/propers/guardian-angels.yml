# Matins Nocturn 2-3 readings for the Guardian Angels (Oct 2). Sourced
# directly from web/www/horas/Latin/Sancti/10-02.txt,
# English/Sancti/10-02.txt. Nocturn 2: Lectio4-6, St. Bernard of
# Clairvaux's own homily on Psalm 90 ("Qui habitat"), combined into one
# reading -- not Gospel-tied (Bernard's own Nocturn 2 patristic reading,
# separate from Nocturn 3's Gospel below). Nocturn 3: Lectio7-9, St.
# Hilary of Poitiers' Commentary on Matthew ch. 18.
#
# Update (2026-09-05): the Gospel pericope itself (Matt 18:1-10) is now
# authored too (isGospel: true, immediately before the Hilary homily) --
# sourced from missa/Latin/Sancti/05-08.txt (St. Michael's Apparition,
# May 8, whose own Mass Gospel is this identical pericope, per a
# `grep -rl "Matt 18:1-10" missa/Latin/` search of the reference tree)
# and its English parallel, not guessed at.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Bernard of Clairvaux, On Psalm 90 (Qui habitat)
      text: |-
        Angelis suis mandávit de te. Mira dignátio, et vere magna diléctio caritátis. Quis enim? quibus? de quo? quid mandávit? Studióse considerémus, fratres, diligénter commendémus memóriæ hoc tam grande mandátum. Quis enim mandávit? cujus sunt Angeli? cujus mandátis obtémperant? cujus obédiunt voluntáti? Nempe Angelis suis mandávit de te, ut custódiant te in ómnibus viis tuis. Nec cunctántur quin étiam in mánibus tollant te. Summa ergo Majéstas mandávit Angelis, et Angelis suis mandávit. Illis útique sublímibus, tam beátis quam próximis sibi cohæréntibus et vere domésticis mandávit de te. Tu quis es? Quid est homo, quod memor es ejus? aut fílius hóminis, quóniam réputas eum? Quasi vero non sit homo putrédo, et fílius hóminis vermis! Sed quid putas mandávit de te? Ut custódiant te.

        Quantam tibi debet hoc verbum inférre reveréntiam, afférre devotiónem, conférre fidúciam! Reveréntiam pro præséntia, devotiónem pro benevoléntia, fidúciam pro custódia. Caute ámbula, ut vidélicet cui adsunt Angeli, sicut eis mandátum est, in ómnibus viis tuis. In quovis diversório, in quovis ángulo, Angelo tuo reveréntiam habe. Tu ne áudeas illo præsénte, quod vidénte me non audéres. An præséntem esse dúbitas, quem non vides? Quid si audíres? quid si tángeres? quid si olfáceres? Vide, quia non solo visu, rerum præséntia comprobétur.

        In ipso ítaque, fratres, affectuóse diligámus Angelos ejus, tamquam futúros aliquándo coherédes nostros, ínterim vero actóres et tutóres, a Patre pósitos et præpósitos nobis. Quid sub tantis custódibus timeámus? Nec superári nec sedúci, minus autem sedúcere possunt, qui custódiunt nos in ómnibus viis nostris. Fidéles sunt, prudéntes sunt, poténtes sunt: quid trepidámus? Tantum sequámur eos, adhæreámus eis, et in protectióne Dei cæli commorémur. Quóties ergo gravíssima cérnitur urgére tentátio et tribulátio véhemens imminére, ínvoca custódem tuum, ductórem tuum, adjutórem tuum in opportunitátibus, in tribulatióne; incláma eum et dic: Dómine, salva nos, perímus.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 18:1-10
      text: 'In illo témpore: Accessérunt discípuli ad Jesum, dicéntes: Quis, putas, major est in regno cælórum? Et advocáns Jesus párvulum, státuit eum in médio eórum et dixit: Amen, dico vobis, nisi convérsi fuéritis et efficiámini sicut párvuli, non intrábitis in regnum cælórum. Quicúmque ergo humiliáverit se sicut párvulus iste, hic est major in regno cælórum. Et qui suscéperit unum párvulum talem in nómine meo, me súscipit. Qui autem scandalizáverit unum de pusíllis istis, qui in me credunt, expédit ei, ut suspendátur mola asinária in collo ejus, et demergátur in profúndum maris. Væ mundo a scándalis! Necésse est enim, ut véniant scándala: verúmtamen væ hómini illi, per quem scándalum venit! Si autem manus tua vel pes tuus scandalízat te, abscíde eum et projíce abs te: bonum tibi est ad vitam ingrédi débilem vel claudum, quam duas manus vel duos pedes habéntem mitti in ignem ætérnum. Et si óculus tuus scandalízat te, érue eum et projíce abs te: bonum tibi est cum uno óculo in vitam intráre, quam duos óculos habéntem mitti in gehénnam ignis. Vidéte, ne contemnátis unum ex his pusíllis: dico enim vobis, quia Angeli eórum in cælis semper vident fáciem Patris mei, qui in cælis est.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Hilary of Poitiers, Commentary on Matthew, ch. 18
      text: |-
        Nónnisi revérsos in natúram puerórum introíre regnum cælórum Dóminus docet: id est, per simplicitátem puerílem vítia córporum nostrórum animǽque revocánda. Púeros autem, credéntes omnes per audiéntiæ fidem nuncupávit. Hi enim patrem sequúntur, matrem amant, próximo velle malum nesciunt, curam opum négligunt; non insoléscunt, non odérunt, non mentiúntur, dictis credunt, et quod áudiunt, verum habent. Reverténdum ígitur est ad simplicitátem infántium; quia, in ea collocáti, spéciem humilitátis Domínicæ circumferémus.

        Væ huic mundo ab scándalis. Humílitas passiónis scándalum mundo est. In hoc enim máxime ignorántia detinétur humána, quod sub deformitáte crucis, ætérnæ glóriæ Dóminum nóluit accípere. Et quid mundo tam periculósum, quam non recepísse Christum? Ideo vere necésse esse ait veníre scándala; quia, ad sacraméntum reddéndæ nobis æternitátis, omnis in eo passiónis humílitas esset explénda.

        Vidéte ne contemnátis unum de pusíllis istis, qui credunt in me. Aptíssimus vínculum mútui amóris impósuit, ad eos præcípue qui vere in Dómino credidíssent. Pusillórum enim Angeli quotídie Deum vident: quia Fílius hóminis venit salváre quæ pérdita sunt. Ergo et Fílius hóminis salvat, et Deum Angeli vident, et Angeli pusillórum præsunt fidélium oratiónibus. Præésse Angelos absolúta auctóritas est. Salvatórum ígitur per Christum oratiónes Angeli quotídie Deo ófferunt. Ergo periculóse ille contémnitur, cujus desidéria ac postulatiónes ad ætérnum et invisíbilem Deum, ambitióso Angelórum famulátu ac ministério, pervehúntur.
      status: verified

# Lauds psalmody: the usual Duplex-majus set (92, 99, 62, Canticum Trium
# Puerorum, Laudate) with antiphons from the reference's Sancti/10-02.txt [Ant Laudes] (which is its [Ant Vespera]).
lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: Angelis suis * Deus mandávit de te, ut custódiant te in ómnibus viis tuis.
    - psalms:
        - 99
      antiphon: Laudémus Dóminum, * quem laudant Angeli, quem Chérubim et Séraphim, sanctus, sanctus, sanctus proclámant.
    - psalms:
        - 62
      antiphon: Angeli eórum * semper vident fáciem Patris mei, qui est in cælis.
  canticle:
    id: canticum-trium-puerorum
    antiphon: Benedíctus Deus, * qui misit Angelum suum, et éruit servos suos qui credidérunt in eum.
  laudate:
    antiphon: 'Laudáte Deum, * omnes Angeli ejus: laudáte eum, omnes Virtútes ejus.'
