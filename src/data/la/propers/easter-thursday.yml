# Transcribed directly from the reference engine's own Office file
# (web/www/horas/Latin/Tempora/Pasc0-4.txt's [Oratio], English parallel in
# web/www/horas/English/Tempora/Pasc0-4.txt). See easter-monday-collect.yml's
# own header for sourcing/status convention.
collect:
  text: |
    Orémus.
    Deus, qui diversitátem géntium in confessióne tui nóminis adunásti: da, ut renátis fonte baptísmatis una sit fides méntium et píetas actiónum.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft
  temporal: true

