# Authored for this project from Matthew 2:19-23 (Clementine Vulgate / Douay-Rheims, as in the scripture store); the reference engine has no office for this day, only a Martyrology line. Marked draft.
nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Matt 2:19-23
      text: 'Defuncto autem Herode, ecce angelus Domini apparuit in somnis Joseph in Aegypto, dicens: Surge, et accipe puerum, et matrem ejus, et vade in terram Israel: defuncti sunt enim qui quaerebant animam pueri. Qui consurgens, accepit puerum, et matrem ejus, et venit in terram Israel. Audiens autem quod Archelaus regnaret in Judaea pro Herode patre suo, timuit illo ire: et admonitus in somnis, secessit in partes Galilaeae. Et veniens habitavit in civitate quae vocatur Nazareth: ut adimpleretur quod dictum est per prophetas: Quoniam Nazaraeus vocabitur.'
      status: verified
