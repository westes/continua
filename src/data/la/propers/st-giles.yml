# Matins Nocturn 2 reading for St. Giles, Abbot (Sep 1) —
# pre-1955-but-post-1617 (no SanctiM/09-01*.txt at all).
# web/www/horas/Latin/Sancti/09-01.txt, English/Sancti/09-01.txt. Single
# lesson (simplex-feast Lectio93), no responsory in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Ægidius Atheniénsis, regiæ stirpis, a prima ætate divinis litteris et caritátis officiis ita déditus fuit, ut nihil præterea curare viderétur. Itaque, paréntibus mórtuis, totum patrimónium in páuperes erogávit; quin étiam túnicam exuit, ut ægrotum egentem tégeret, qua ille indútus, statim conváluit. Sed multis deinceps clarior miraculis, timens sui nóminis celebritátem, Arelátem ad beátum Cæsárium contendit. A quo post biennium discédens, secessit in eremum; ubi diutius herbárum radicibus et cervæ lacte, quæ statis ad eum horis veniebat, admirábili sanctitáte vixit. Quæ cerva, insequéntibus quodam die cánibus regiis, cum in antrum Ægidii refugísset, Galliæ regem ímpulit, ut ab eo summis precibus péteret, ut in loco speluncæ monastérium éxstrui paterétur. Cujus administratiónem, flagitante rege, invitus suscépit; eoque munere aliquot annis prudenter piéque gesto, migrávit in cælum.
      status: verified
