  citation: 1 Pet 4:13
  status: verified

# Sourced from web/www/horas/Latin/Sancti/02-12.txt's own [Hymnus
# Laudes] and English/Sancti/02-12.txt's own translation.
lauds-hymn:
  text: |-
    Sic patres vitam péragunt in umbra,
    Lília ut septem nívei decóris,
    Vírgini excélsæ bene grata, Petro
    Visa nitére.

    Jamque divína rapiénte flamma,
    Cúrsitant urbes, loca quæque obérrant,
    Si queant cunctis ánimis dolóres,
    Fígere Matris.

    Hinc valent iras domuísse cæcas,
    Néscia et pacis fera corda jungunt,
    Erigunt mæstos, révocant nocéntes
    Dicta piórum.

    At suos Virgo comitáta Servos
    Evehit tandem súperas ad oras;
    Gémmeis sertis décorat per ævum
    Omne beátos.

    Eja nunc cœtus gémitum precántis
    Audiant, duros vídeant labóres:
    Semper et nostris fáveant benígno
    Lúmine votis.

    Sit decus Patri, genitǽque Proli,
    Et tibi, compar utriúsque virtus
    Spíritus semper, Deus unus omni
    Témporis ævo. Amen.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/02-12.txt's own [Versum 2]
# (positioned directly after [Hymnus Laudes]) and English/Sancti/02-12
# .txt's own translation.
lauds-versicle:
  text: |
    V. Sit memória illórum in benedictióne.
    R. Et ossa eórum púllulent de loco suo.
  status: verified

# No distinct plain [Hymnus Vespera] exists in the reference source for
# this feast (only a [Hymnus Vespera 3], a different slot); reusing
# common-of-several-confessors' own Vespers hymn. Authored to make their
# own bundle (needed for their genuinely proper Lauds hymn, see lauds-
# hymn-ss-seven-founders-of-the-servite-order.yml -- Vespers falls back
# to the same Lauds capitulum via lookupPart (Vespers chapter, Lauds sibling)) render a
# real hymn instead of an unconditionally-rendered empty one.
vespers-hymn:
  text: |-
    Iste Conféssor Dómini sacrátus,
    Festa plebs cujus celébrat per orbem,
    Hódie lætus méruit secréta
    Scándere cæli.

    Qui pius, prudens, húmilis, pudícus,
    Sóbrius, castus fuit et quiétus,
    Vita dum præsens vegetávit ejus
    Córporis artus.

    Ob sacrum cujus túmulum frequénter
    Membra languéntum modo sanitáti,
    Quólibet morbo fúerint graváta,
    Restituúntur.

    Unde nunc noster chorus in honórem
    Ipsius, hymnum canit hunc libénter:
    Ut piis ejus méritis juvémur
    Omne per ævum.

    Sit salus illi, decus atque virtus,
    Qui supra cæli résidens cacúmen,
    Tótius mundi máchinam gubérnat
    Trinus et unus. Amen.
  status: verified

# Second Vespers hymn: web/www/horas/Latin/Sancti/02-12.txt's own [Hymnus
# Vespera 3] ("Matris sub almæ númine") and English/Sancti/02-12.txt's
# translation, whose last stanza is a fixed Trinitarian ending (no
# swappable doxology). First Vespers has no own hymn in the source, so
# vespers-hymn-ss-seven-founders-of-the-servite-order.yml (common-of-
# several-confessors') stays the default; see hours/resolve-common.ts's
# withVespersVariant.
vespers-hymn/~-second:
  text: |
    Matris sub almæ númine
    Septéna proles náscitur:
    Ipsa vocánte, ad árduum
    Tendit Senári vérticem.

    Quos terra fructus próferet
    Dum sacra proles gérminat,
    Uvis repénte túrgidis
    Onústa vitis prǽmonet.

    Virtúte claros nóbili
    Mors sancta cælo cónsecrat:
    Tenent olýmpi límina
    Servi fidéles Vírginis.

    Cohors beáta, Núminis
    Regno potíta, réspice
    Quos hinc recédens fráudibus
    Cinctos relínquis hóstium.

    Ergo, per almæ vúlnera
    Matris rogámus súpplices,
    Mentis ténebras dísice,
    Cordis procéllas cómprime.

    Tu nos, beáta Trínitas,
    Perfúnde sancto róbore,
    Póssimus ut felíciter
    Exémpla patrum súbsequi.
    Amen.
  status: verified

