# Matins Nocturn 2-3 readings for Ss. Seven Founders of the Servite
# Order (Feb 12). Sourced from web/www/horas/Latin/Sancti/02-12.txt
# (Nocturn 2) and Commune/C1.txt ("Commune Apostolorum" — Nocturn 3,
# per that file's own `@Commune/C1:LectioN` cross-reference).
#
# Nocturn 2: Lectio4-6 combined into one reading, the founding
# narrative — one continuous piece.
# Nocturn 3: Lectio7's Gospel citation (Matt 19:27-29) is a bare
# incipit ("Et réliqua"), so only the homily was originally authored
# (not marked isGospel), St. Jerome's homily (Lectio7's homily +
# Lectio8-9 combined) — the Common of Apostles' "we have forsaken all
# and followed thee" text, fitting for a group of founders even though
# not these saints' own proper text.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before Jerome's homily) — the day's own
# Missale [Evangelium] in web/www/missa/Latin/Sancti/02-12.txt redirects
# to `@Commune/C5b` (Common of a Confessor Not a Bishop), whose own
# [Evangelium] gives the full Matt 19:27-29 pericope (same text quoted
# in the Nocturn 3 homily above), sourced from there.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Sǽculo tértio décimo cum Frideríci secúndi diro schísmate cruentísque factiónibus cultióres Itáliæ pópuli scinderéntur, próvidens Dei misericórdia, præter álios sanctitáte illústres, septem e Florentína nobilitáte viros suscitávit, qui in caritáte conjúncti, præclárum fratérnæ dilectiónis præbérent exémplum. Hi, nimírum Bonfílius Monáldius, Bonajúncta Manéttus, Manéttus Antellénsis, Amidéus de Amidéis, Ugúccio Ugucciónum, Sostenéus de Sostenéis et Aléxius Falconérius, cum, anno trigésimo tértio ejus sǽculi, die sacra Vírgini cælo recéptæ, in quodam piórum hóminum convéntu, Laudántium nuncupáto, fervéntius orárent; ab eádem Deípara síngulis apparénte sunt admóniti, ut sánctius perfectiúsque vitæ genus amplecteréntur. Re ítaque prius cum Florentíno prǽsule colláta, hi septem viri, géneris nobilitáte divitiísque posthábitis, sub vilíssimis detritísque véstibus cilício indúti, octáva die Septémbris in rurálem quamdam ædículam secessére, ut ea die primórdia vitæ sanctióris auspicaréntur, qua ipsa Dei Génetrix mortálibus orta sanctíssimam vitam incéperat.

        Hoc vitæ institútum quam sibi foret accéptum Deus miráculo osténdit. Nam cum paulo deínceps hi septem viri per Florentínam urbem ostiátim eleemósynam emendicárent, áccidit, ut repénte infántium voce, quos inter fuit sanctus Philíppus Benítius quintum ætátis mensem vix ingréssus, beátæ Maríæ Servi acclamaréntur: quo deínde nómine semper appelláti sunt. Quare, vitándi pópuli occúrsus ac solitúdinis amóre ducti, in Senárii montis recéssu omnes convenére, ibíque cæléste quoddam vitæ genus aggréssi sunt. Victitábant enim in spelúncis, sola aqua herbísque conténti; vigíliis aliísque asperitátibus corpus atterébant, Christi passiónem ac mæstíssimæ ejúsdem Genitrícis dolóres assídue meditántes. Quod cum olim sacra Parascéves die impénsius exsequeréntur, ipsa beáta Virgo illis iteráto appárens, lúgubrem vestem, quam indúerent, osténdit; sibíque acceptíssimum fore significávit, ut novum in Ecclésia regulárem órdinem excitárent, qui jugem recóleret ac promovéret memóriam dolórum, quos ipsa pértulit sub cruce Dómini. Hæc sanctus Petrus, ínclytus órdinis Prædicatórum Martyr, ex familiári cum sanctis illis viris consuetúdine ac peculiári étiam Deíparæ visióne cum didicísset; iis auctor fuit, ut órdinem regulárem sub appellatióne Servórum beátæ Vírginis institúerent: qui póstea ab Innocéntio quarto Pontífice máximo approbátus fuit.

        Porro sancti illi viri, cum plures sibi sócios adjunxíssent, Itáliæ civitátes atque óppida, præsértim Etrúriæ excúrrere cœpérunt, prædicántes ubíque Christum crucifíxum, civíles discórdias compescéntes et innúmeros fere dévios ad virtútis sémitam revocántes. Neque Itáliam modo, sed et Gálliam, Germániam ac Polóniam suis evangélicis labóribus excoluérunt. Dénique cum bonum Christi odórem longe latéque diffudíssent, portentórum quoque glória illústres, migrárunt ad Dóminum. Sed quos unus veræ fraternitátis ac religiónis amor in vita sociáverat, unum páriter demórtuos contéxit sepúlcrum, únaque pópuli venerátio prosecúta est. Quaprópter Clemens undécimus et Benedíctus décimus tértius Pontífices máximi delátum iísdem a plúribus sǽculis indivíduum cultum confírmarunt; ac Leo décimus tértius, approbátis ántea miráculis, post indúltam veneratiónem ad collectívam eorúmdem invocatiónem a Deo patrátis, eósdem anno quinquagésimo sacerdótii sui Sanctórum honóribus cumulávit, eorúmque memóriam Offício et Missa in univérsa Ecclésia quotánnis recoléndam instítuit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 19:27-29
      text: 'In illo témpore: Dixit Petrus ad Jesum: Ecce, nos relíquimus ómnia, et secúti sumus te: quid ergo erit nobis? Jesus autem dixit illis: Amen, dico vobis, quod vos, qui secúti estis me, in regeneratióne, cum séderit Fílius hóminis in sede majestátis suæ, sedébitis et vos super sedes duódecim, judicántes duódecim tribus Israël. Et omnis, qui relíquerit domum, vel fratres, aut soróres, aut patrem, aut matrem, aut uxórem, aut fílios, aut agros, propter nomen meum, céntuplum accípiet, et vitam ætérnam possidébit.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Commentary on Matthew, Book III (on Matt 19:27-29)
      text: |-
        Grandis fidúcia! Petrus piscátor erat, dives non fúerat, cibos manu et arte quærébat: et tamen lóquitur confidénter: Relíquimus ómnia. Et quia non súfficit tantum relínquere, jungit quod perféctum est: Et secúti sumus te. Fécimus quod jussísti: quid ígitur nobis dabis prǽmii? Jesus autem dixit illis: Amen dico vobis, quod vos qui secúti estis me, in regeneratióne, cum séderit Fílius hóminis in sede majestátis suæ, sedébitis et vos super sedes duódecim, judicántes duódecim tribus Ísraël. Non dixit: Qui reliquístis ómnia; hoc enim et Crates fecit philósophus, et multi álii divítias contempsérunt: sed, Qui secúti estis me: quod próprie Apostolórum est, atque credéntium.

        In regeneratióne, cum séderit Fílius hóminis in sede majestátis suæ (quando et mórtui de corruptióne resúrgent incorrúpti) sedébitis et vos in sóliis judicántium, condemnántes duódecim tribus Ísraël: quia vobis credéntibus, illi crédere noluérunt. Et omnis qui relíquerit domum, vel fratres, aut soróres, aut patrem, aut matrem, aut uxórem, aut fílios, aut agros propter nomen meum, céntuplum accípiet, et vitam ætérnam possidébit. Locus iste cum illa senténtia cóngruit, in qua Salvátor lóquitur: Non veni pacem míttere, sed gládium. Veni enim separáre hóminem a patre suo, et matrem a fília, et nurum a socru: et inimíci hóminis doméstici ejus. Qui ergo propter fidem Christi, et prædicatiónem Evangélii, omnes afféctus contémpserint, atque divítias et sǽculi voluptátes: isti céntuplum recípient, et vitam ætérnam possidébunt.

        Ex occasióne hujus senténtiæ quidam introdúcunt mille annos post resurrectiónem, dicéntes, tunc nobis céntuplum ómnium rerum quas dimísimus, et vitam ætérnam esse reddéndam: non intelligéntes, quod, si in céteris digna sit repromíssio, in uxóribus appáreat turpitúdo: ut qui unam pro Dómino dimíserit centum recípiat in futúro. Sensus ergo iste est: Qui carnália pro Salvatóre dimíserit, spirituália recípiet: quæ comparatióne et mérito sui ita erunt, quasi si parvo número centenárius númerus comparétur.
      status: verified
