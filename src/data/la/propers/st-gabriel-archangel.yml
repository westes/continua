# Read directly from web/www/horas/Latin/Sancti/03-24.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui inter céteros Angelos, ad annuntiándum Incarnatiónis tuæ mystérium, Gabriélem
    Archángelum elegísti: concéde propítius; ut qui festum ejus celebrámus in terris,
    ipsíus patrocínium sentiámus in cælis.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (st-gabriel-archangel-antiphon.yml), paired with the standard de-Communi commemoration versicle for common-of-an-angel (inferred from the C4 "structural category" citation in the saint's own file) (not yet independently live-verified for this specific category, marked draft). Collect is the saint's own real proper (st-gabriel-archangel-collect.yml), unchanged.
