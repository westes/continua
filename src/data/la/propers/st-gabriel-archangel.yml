# Corrected 2026-09-10: this file previously contained "Tibi Christe
# splendor Patris" -- St. Michael's own Apparition hymn (May 8), which is
# indeed the correct source for Gabriel's Lauds/Vespers hymn (Sancti/
# 03-24.txt has no own `[HymnusM ...]` override there, so it falls back to
# 05-08's), BUT Gabriel's own file DOES carry its own distinct `[Hymnus
# Matutinum]` -- `@:Hymnus Vespera`, i.e. reusing *this file's own*
# Vespers hymn ("Christe, sanctórum decus Angelórum"), not 05-08's. That
# hymn has a customizable middle stanza naming the specific archangel
# ("Angelus fortis Gábriel..."), confirming it's genuinely Gabriel's own
# text, not a shared template. No separate Monastic recension exists.
# Final stanza is fixed -- no `*` marker anywhere in the source.
matins-hymn:
  text: |-
    Christe, sanctórum decus Angelórum,
    Gentis humánæ Sator et Redémptor,
    Cǽlitum nobis tríbuas beátas
    Scándere sedes.

    Angelus fortis Gábriel, ut hostes
    Pellat antíquos, et amíca cælo,
    Quæ triumphátor státuit per orbem,
    Templa revísat.

    Virgo dux pacis, Genitríxque lucis,
    Et sacer nobis chorus Angelórum
    Semper assístat, simul et micántis
    Régia cæli.

    Præstet hoc nobis Déitas beáta
    Patris, ac Nati, paritérque Sancti
    Spíritus, cujus résonat per omnem
    Glória mundum. Amen.
  status: verified

