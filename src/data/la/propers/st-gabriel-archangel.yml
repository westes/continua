# Matins Nocturn 2-3 readings for St. Gabriel the Archangel (Mar 24).
# Sourced directly from web/www/horas/Latin/Sancti/03-24.txt,
# English/Sancti/03-24.txt. (Lectio1-3, Dan 9:20-27, left to the
# bible-plan store as usual.)
#
# Nocturn 2: Lectio4-6 combined into one reading, the Venerable Bede's
# exposition on Gabriel's appearance to Zachary (Luke 1:11-20).
# Nocturn 3: Lectio7's Gospel citation (Luke 1:26-38, "Et réliqua" in the
# horas file) is authored in full from web/www/missa/Latin+English/
# Sancti/03-24.txt's own [Evangelium] (the Annunciation Gospel, reused
# verbatim for this feast); St. Bernard of Clairvaux's homily (Lectio7's
# homily + Lectio8-9 combined).
#
# Update (2026-09-05): both Gospel pericopes now authored in full
# (isGospel: true, immediately before each homily) — these are two
# distinct, adjacent pericopes within the same Zachary/Annunciation
# narrative, not a single bare incipit to skip. Luke 1:26-38 (nocturn 3)
# comes straight from that Missale Evangelium above. Luke 1:11-20
# (nocturn 2, Zachary's vision) has no continuous Missale/horas
# transcription anywhere in the reference engine; its text is assembled
# from genuine reference-engine fragments that are themselves verbatim
# Vulgate/Douay-Rheims-register wording: vv. 11-17 from
# missa/Latin+English/Sancti/06-23.txt's own Vigil-of-St.-John-Baptist
# Evangelium (Luke 1:5-17, trimmed to its 11-17 tail), and vv. 18-20 from
# this same file's own Ant Matutinum + Responsory5/Responsory6 (Latin
# and English), which quote those verses directly.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: true
      citation: Luc 1:11-20
      text: 'In illo témpore: Appáruit autem illi Angelus Dómini, stans a dextris altáris incénsi. Et Zacharías turbátus est, videns, et timor írruit super eum. Ait autem ad illum Angelus: Ne tímeas, Zacharía, quóniam exaudíta est deprecátio tua: et uxor tua Elísabeth páriet tibi fílium, et vocábis nomen ejus Joánnem: et erit gáudium tibi et exsultátio, et multi in nativitáte ejus gaudébunt: erit enim magnus coram Dómino: et vinum, et síceram non bibet, et Spíritu Sancto replébitur adhuc ex útero matris suæ: et multos filiórum Israël convértet ad Dóminum, Deum ipsórum: et ipse præcédet ante illum in spíritu et virtúte Elíæ: ut convértat corda patrum in fílios, et incrédulos ad prudéntiam justórum, paráre Dómino plebem perféctam. Et dixit Zacharías ad Angelum: Unde hoc sciam? ego enim sum senex, et uxor mea procéssit in diébus suis. Et respóndens Angelus, dixit ei: Ego sum Gábriel, qui asto ante Deum: et missus sum loqui ad te, et hæc tibi evangelizáre. Et ecce eris tacens, et non póteris loqui usque in diem quo hæc fiant, pro eo quod non credidísti verbis meis, quæ implebúntur in témpore suo.'
      status: verified
    - nocturn: 2
      isGospel: false
      source: The Venerable Bede, Exposition on Luke 1:11-20
      text: |-
        Appáruit Zacharíæ Angelus, stans a dextris altáris incénsi. Bene Angelus et in templo, et juxta altáre, et dextris appáret; quia vidélicet et veri sacerdótis advéntum, et mystérium sacrifícii universális, et cæléstis doni gáudium prǽdicat. Nam, sicut per sinístram præséntia, sic per déxteram sæpe bona prænuntiántur ætérna. Juxta quod in sapiéntiæ laude cánitur: Longitúdo diérum in déxtera ejus; in sinístra illíus divítiæ et glória. Treméntem Zacharíam confórtet Angelus, quia, sicut humánæ fragilitátis est spiritális creatúræ visióne turbári, ita et angélicas benignitátis est pavéntes de aspéctu suo mortáles mox blandiéndo solári. At contra dæmónicæ est ferocitátis, quos sui præséntia térritos sénserit, amplióri semper horróre concútere, qua nulla mélius ratióne quam fide superátur intrépida.

        Angelus, deprecatiónem dicens exaudítam, partum contínuo promíttit uxóris. Non quod ille, qui pro pópulo oblatúrus intráverat, relíctis públicis votis, pro accipiéndis fíliis oráre potúerit, præsértim quia nemo orat quod se acceptúrum despérat. Adeo autem ille, jam suæ ætátis et infœcúndæ cónjugis memor, nasci sibi fílios desperábat, ut nec Angelo hoc promitténti créderet. Sed quod dicit: Exaudíta est deprecátio tua, pro pópuli redemptióne signíficat; Et uxor tua páriet tibi fílium, ejúsdem redemptiónis órdinem pandit, quod vidélicet natus Zacharíæ fílius Redemptóri illíus pópuli præconándo sit iter factúrus. Quia enim Zacharíam, pro plebe supplicántem, díxerat exaudítum, docet quo órdine plebs eádem salvári et pérfici débeat, ad prædicatiónem vidélicet Joánnis pæniténdo et credéndo in Christum.

        Zacharías ob altitúdinem promissórum hǽsitans, signum quo crédere váleat, inquírit cui sola Angeli vísio vel allocútio pro signo suffícere debúerat. Unde méritam diffidéntiæ tacéndo pœnam luit, cui tacitúrnitas eádem et signum fídei quod quæsívit, et infidelitátis esset pœna quem méruit. Vult intélligi quod si homo tália promítteret, impúne signum flagitáre licéret, at cum ángelus promíttat, jam dubitári non déceat. Datque signum quod rogátur, ut qui discredéndo locútus est, jam tacéndo crédere discat. Ubi notándo quod Angelus se et ante Deum adstáre, et ad evangelizándum Zacharíæ missum esse testátur; quia et cum ad nos véniunt Angeli, sic extérius implent ministérium, ut tamen nunquam desint intérius per contemplatiónem. Et mittúntur ígitur et assístunt, quia, et si circumscríptus est angélicus spíritus, summus tamen spíritus ipse qui Deus est, circumscríptus non est. Angeli ítaque et missi ante ipsum sunt, quia, quólibet missi véniunt, intra ipsum currunt.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 1:26-38
      text: 'In illo témpore: Missus est Angelus Gábriel a Deo in civitátem Galilææ, cui nomen Názareth, ad Vírginem desponsátam viro, cui nomen erat Joseph, de domo David, et nomen Vírginis María. Et ingréssus Angelus ad eam, dixit: Ave, grátia plena; Dóminus tecum: benedícta tu in muliéribus. Quæ cum audísset, turbáta est in sermóne ejus: et cogitábat, qualis esset ista salutátio. Et ait Angelus ei: Ne tímeas, María, invenísti enim grátiam apud Deum: ecce, concípies in útero et páries fílium, et vocábis nomen ejus Jesum. Hic erit magnus, et Fílius Altíssimi vocábitur, et dabit illi Dóminus Deus sedem David, patris ejus: et regnábit in domo Jacob in ætérnum, et regni ejus non erit finis. Dixit autem María ad Angelum: Quómodo fiet istud, quóniam virum non cognósco? Et respóndens Angelus, dixit ei: Spíritus Sanctus supervéniet in te, et virtus Altíssimi obumbrábit tibi. Ideóque et quod nascétur ex te Sanctum, vocábitur Fílius Dei. Et ecce, Elísabeth, cognáta tua, et ipsa concépit fílium in senectúte sua: et hic mensis sextus est illi, quæ vocátur stérilis: quia non erit impossíbile apud Deum omne verbum. Dixit autem María: Ecce ancílla Dómini, fiat mihi secúndum verbum tuum.'
