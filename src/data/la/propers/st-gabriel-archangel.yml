# Transcribed directly from the reference engine's own source files
# (Latin: web/www/horas/Latin/Sancti/03-24.txt, English:
# web/www/horas/English/Sancti/03-24.txt), Monastic Tridentinum 1617
# rubric. Companion file to ../apparition-of-st-michael.yml — see that
# file's own header for the "Common-of-an-Angel doesn't exist" context.
# `03-24.txt`'s own [Rank]/[Rule] read "ex Sancti/05-08" as a whole-file
# default, but its own [Ant Matutinum] block overrides with 9 fully
# distinct proper antiphons narrating the Gabriel episodes (Daniel,
# Zachary, the Annunciation) -- genuinely proper, matching this saint's
# own calendar-file comment ("Real, unique collect/antiphon/Nocturn 2-3
# content"). Nocturn 1/2/3 Versum are NOT overridden, so they fall back
# to Apparition of St. Michael's own (see apparition-of-st-michael.yml),
# without her Paschaltide alleluias -- March 24 falls within Paschaltide
# only in the vanishingly rare years Easter itself lands on March 22-23
# (its earliest possible date), so treated as permanently non-Paschal
# here, matching the plain (non-alleluia) Versum 1/Nocturn-2-Versum text.
#
# Sourced directly from these files rather than a live CGI query, since
# an existing sibling file (`data/propers/common/lauds-capitulum-st-
# gabriel-archangel.yml`) turns out to already carry Apparition's own
# capitulum text ("Significávit Deus...") under Gabriel's id by mistake
# -- his own real capitulum is "Ecce vir Gábriel, quem víderam in
# visióne..." (Dan 9:21-22, see [Capitulum Laudes] in 03-24.txt above).
# Flagged here as a pre-existing data bug found in passing, not fixed in
# this pass (out of scope -- this pass only covers Matins psalmody).
#
# The English source file's parenthetical "(Alleluia.)" tags scattered
# inconsistently across a few of these antiphons (e.g. psalms 8, 14, 18,
# 33, 95) have no Latin counterpart anywhere in the Latin source and
# don't correlate with any liturgical season -- treated as a translation-
# file artifact and dropped here, keeping the English antiphons in step
# with the (alleluia-free) Latin.
matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 8
        antiphon: 'Dixit Angelus Gábriel * ad Daniélem: Intéllige, fílii hóminis, quóniam in témpore finis implébitur vísio.'
      - psalms:
          - 10
        antiphon: Ecce vir Gábriel * quem víderam in visióne cito volans tétigit me in témpore sacrifícii vespertíni et dócuit me.
      - psalms:
          - 14
        antiphon: Cumque Gábriel * loquerétur ad me collápsus sum pronus in terram et tétigit me, et státuit me in gradu meo.
      - psalms:
          - 18
        antiphon: 'Gábriel Angelus * appáruit Zacharíæ, dicens: Uxor tua Elísabeth páriet tibi fílium, et vocábitur nomen ejus Joánnem.'
      - psalms:
          - 23
        antiphon: 'Et dixit Zacharías * ad Angelum: Unde hoc sciam? ego enim sum senex, et uxor mea procéssit in diébus suis.'
      - psalms:
          - 33
        antiphon: 'Respóndens autem Angelus * dixit ei: Ego sum Gábriel, qui asto ante Deum: et missus sum loqui ad te, et hæc tibi evangelizáre.'
    versicle:
      v: Stetit Angelus juxta aram templi.
      r: Habens thuríbulum áureum in manu sua.
  nocturn2:
    groups:
      - psalms:
          - 95
        antiphon: Missus est * Gábriel Angelus ad Maríam Vírginem desponsátam Joseph.
      - psalms:
          - 96
        antiphon: 'Gábriel Angelus * Maríæ dixit: Ecce Elísabeth cognáta tua, et ipsa concépit fílium in senectúte sua.'
      - psalms:
          - 102
        antiphon: Súscipe Verbum * Virgo María, quod tibi a Dómino per Angelum Gabriélem transmíssum est.
    versicle:
      v: Ascéndit fumus arómatum in conspéctu Dómini.
      r: De manu Angeli.
  nocturn3:
    versicle:
      v: In conspéctu Angelórum psallam tibi, Deus meus.
      r: Adorábo ad templum sanctum tuum, et confitébor nómini tuo.

