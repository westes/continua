# own octave -- the one day in this app's own modeled range (Dec 26-31) with
# no other saint winning outright, confirmed via its own distinctive Christmas
# Invitatory ("Christus natus est nobis"). Collapsed into one continuous
# reading per project convention. St. Stephen, St. John, and the Holy
# Innocents' own octaves (also active here, stacking, see calendar/octaves.ts)
# have no separate Matins reading content of their own anywhere in this Dec
# 26-31 range -- every other day is dominated either by another named saint's
# own feast or, on this one day, by Christmas's own content directly; their
# octaves work as commemorations only in this stretch, same as several octaves
# checked this pull (Immaculate Conception, most of Ss.
