octave-readings/~-octave-day-6:
  source: Léctio sancti Evangélii secúndum Lucam
  text: |
    In illo témpore: Erat Joseph, et María mater Jesu, mirántes super his, quæ dicebántur de illo. Et réliqua.

    Homilía sancti Ambrósii Epíscopi. Lib. 2 in cap. 2 Lucæ, prope finem. Vides úberem in omnes grátiam, Dómini generatióne diffúsam, et prophetíam incrédulis negátam esse, non justis. Ecce et Símeon prophétat, in ruínam et resurrectiónem plurimórum venísse Dóminum Jesum Christum, ut justórum, iniquorúmque mérita discérnat; et pro nostrórum qualitáte factórum, judex verus et justus aut supplícia decérnat, aut prǽmia.

    Et tuam ipsíus ánimam pertransíbit gládius. Nec littera, nec historia docet, ex hac vita Mariam corporalis necis passióne migrasse. Non enim anima, sed corpus materiali gládio transverberátur. Et ideo prudéntiam Maríæ haud ignaram mysterii cæléstis osténdit. Vivum enim verbum Dei, et válidum, et acutius omni gládio acutíssimo, pénetrans usque ad divisiónem ánimæ et spíritus, artuum quoque et medullárum, cogitatiónes cordis et secreta scrutátur animórum, quia nuda et apérta sunt ómnia Dei Fílio, quem consciéntiæ secreta non fallunt.

    Prophetávit ítaque Simeon, prophetáverat virgo, prophetáverat copuláta conjugio; prophétare debuit étiam vidua, ne qua aut proféssio deésset, aut sexus. Et ideo Anna et stipendiis viduitátis, et móribus talis inducitur, ut digna plane fuísse credátur, quæ Redemptórem ómnium venisse nuntiáret. Cujus mérita cum álibi descripsérimus, cum víduas hortarémur, hoc loco, quóniam ad ália properámus, non putámus iteránda.
  responsory: |
    R. In princípio erat Verbum, et Verbum erat apud Deum, † et Deus erat Verbum. * Hoc erat in princípio apud Deum. V. Omnia per ipsum facta sunt, et sine ipso factum est nihil. R. Hoc erat in princípio apud Deum.
  status: verified
