# Matins Nocturn 2-3 readings for the Holy Innocents (Dec 28) —
# SanctiM/12-28.txt inherits the whole day (`@Sancti/12-28`) with no
# Nocturn 2/3 override, so this feast's own proper content is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/12-28.txt, English/Sancti/12-28.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, St. Augustine's
# sermon — one continuous piece, no genuine source break.
# Nocturn 3: Lectio7's Gospel citation (Matt 2:13-18) is a bare
# incipit ("Et réliqua") with no full pericope text given, so only the
# homily portion was originally authored (not marked isGospel), St.
# Jerome's commentary (Lectio7's homily + Lectio8-9 combined, one
# continuous piece).
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily) — this feast's own
# [Evangelium] carries the full pericope directly (not a redirect),
# sourced from missa/Latin/Sancti/12-28.txt, English/Sancti/12-28.txt,
# not guessed at.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine of Hippo, Sermon 10 on the Saints
      text: |-
        Hódie, fratres caríssimi, natálem illórum infántium cólimus, quos ab Heróde crudelíssimo rege interféctos esse, Evangélii textus elóquitur. Et ídeo cum summa exsultatióne gáudeat terra, cæléstium mílitum et tantárum parens fecúnda virtútum. Ecce profánus hostis nunquam beátis párvulis tantum prodésse potuísset obséquio, quantum prófuit ódio. Nam, sicut sacratíssimum præséntis diéi festum maniféstat, quantum in beátos párvulos iníquitas abundávit, tantum in eis grátia benedictiónis refúdit.

        Beáta es, o Béthlehem terra Juda, quæ Heródis regis immanitátem in puerórum exstinctióne perpéssa es: quæ sub uno témpore candidátam plebem imbéllis infántiæ Deo offérre meruísti. Digne tamen natálem illórum cólimus, quos beátius ætérnæ vitæ mundus édidit, quam quos maternórum víscerum partus effúdit. Síquidem ante vitæ perpétuæ adépti sunt dignitátem, quam usúram præséntis accéperint.

        Aliórum quidem pretiósa mors Mártyrum laudem in confessióne proméruit, horum in consummatióne complácuit; quia incipiéntis vitæ primórdiis, ipse eis occásus inítium glóriæ dedit, qui præséntis términum impósuit. Quos Heródis impíetas lactántes matrum ubéribus abstráxit; qui jure dicúntur Mártyrum flores, quos in médio frígore infidelitátis exórtos, velut primas erumpéntes Ecclésiæ gemmas, quædam persecutiónis pruína decóxit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 2:13-18
      text: 'In illo témpore: Angelus Dómini appáruit in somnis Joseph, dicens: Surge, et áccipe Púerum et Matrem ejus, et fuge in Ægýptum, et esto ibi, usque dum dicam tibi. Futúrum est enim, ut Heródes quærat Púerum ad perdéndum eum. Qui consúrgens accépit Púerum et Matrem ejus nocte, et secéssit in Ægýptum: et erat ibi usque ad óbitum Heródis: ut adimplerétur quod dictum est a Dómino per Prophétam dicéntem: Ex Ægýpto vocávi Fílium meum. Tunc Heródes videns, quóniam illúsus esset a Magis, irátus est valde, et mittens occídit omnes púeros, qui erant in Béthlehem et in ómnibus fínibus ejus, a bimátu et infra, secúndum tempus, quod exquisíerat a Magis. Tunc adimplétum est, quod dictum est per Jeremíam Prophétam dicéntem: Vox in Rama audíta est, plorátus et ululátus multus: Rachel plorans fílios suos, et nóluit consolári, quia non sunt.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Commentary on Matthew, Book I, on Matt 2:13-18
      text: |-
        Quando tulit Púerum et Matrem ejus, ut in Ægýptum tránseat, nocte tulit, et in ténebris: quia noctem ignorántiæ his, a quibus ipse recéssit, relíquit incrédulis. Quando vero revértitur in Judǽam, nec nox, nec ténebræ ponúntur in Evangélio: quia in fine mundi Judǽi fidem, tamquam Christum ab Ægýpto reverténtem suscipiéntes, illuminabúntur.

        Ut adimplerétur quod dictum est a Dómino per prophétam dicéntem: Ex Ægýpto vocávi Fílium meum. Respóndeant, qui Hebræórum volúminum dénegant veritátem, ubi hoc in Septuagínta legátur interprétibus. Quod cum non invénerint, nos eis dicémus, in Osée prophéta scriptum, sicut et exemplária probáre possunt, quæ nuper edídimus.

        Tunc adimplétum est, quod dictum est per Jeremíam prophétam dicéntem: Vox in Rama audíta est, plorátus et ululátus multus, Rachel plorans fílios suos. De Rachel natus est Bénjamin, in cujus tribu non est Béthlehem. Quǽritur ergo, quómodo Rachel fílios Judæ, id est Béthlehem, quasi suos ploret. Respondébimus bréviter, quia sepúlta sit juxta Béthlehem in Ephrata; et ex matérno corpúsculi hospítio matris nomen accéperit; sive quóniam Juda et Bénjamin duæ tribus junctæ erant, et Heródes præcéperat non solum in Béthlehem intérfici púeros, sed et in ómnibus fínibus ejus.
      status: verified

# Sourced directly from the raw reference files (web/www/horas/Latin+English/
# Sancti/01-04.txt) -- day 8, "In Octava," the Holy Innocents' own octave
# closing day, same shape/rationale as
# st-stephen-protomartyr-octave-day-8.yml (this octave's own intervening
# days likewise carry no Lectio override in the source, correctly
# unauthored). Joins St. Augustine's own first sermon for Childermas
# (Lectio4-6) with St. John Chrysostom's homily on Matt 2:13-18
# (Lectio7-9, bare incipit dropped). Lectio4's own closing sentence in the
# source's English ("Pígnora sunt, non crédita, sed creáta; non depósita,
# sed expósita" -- a legal-term wordplay on "pledges") is garbled into an
# incoherent fragment in the reference engine's own translation --
# reconstructed here to match the Latin rather than transcribed as-is; `en`
# marked `draft` accordingly (the same class of repair as
# ascension-octave-day-8.yml, not just an isolated typo).
# Responsory missing from this file -- authoring gap, not a design choice
# (same class as nativity-bvm-octave-day-3.yml's own fix). Reuses the Holy
# Innocents' own Responsory1 (Sancti/12-28.txt), the octave's one well-known
# opening responsory, matching the convention already established for the
# Nativity-BVM octave (every combined-lesson octave-day file there reuses
# that feast's own Responsory1 regardless of which specific historical
# Lectio number the combined text corresponds to).
octave-readings/~-octave-day-8:
  source: Sermo sancti Augustíni Epíscopi; Homilía sancti Joánnis Chrysóstomi
  text: |
    Nascénte Dómino, luctus cœpit, non cælo, sed mundo: indícitur mátribus lamentátio, Angelis exsultátio, infántibus transmigrátio. Deus est, qui natus est: Innocéntes illi debéntur víctima, qui venit damnáre mundi malítiam. Agnélli debent immolári, quia Agnus futúrus est crucifígi, qui tollit peccáta mundi. Sed oves úlulant matres, quia agnos perdunt sine voce balántes. Grande martýrium, crudéle spectáculum! Exímitur machæra, et nulla intérvenit causa: sola stridet invídia, cum qui natus est, nulli fáciat violéntiam. Sed oves cérnimus matres: quæ super agnos lugent: Vox in Rama audíta est, plorátus et ululátus magnus. Pígnora sunt, non crédita, sed creáta; non depósita, sed expósita.

    Testis est ipsa natura, quæ pugnábat in Mártyres, cum tyránnus jactáret infántes. Mater crines cápitis dissipábat, quæ ornaméntum cápitis amittébat. Quantis modis infántem volébat abscóndere, et ipse se infántulus publicábat! Nesciébat tacére, quia necdum didícerat formidáre. Pugnábat mater, et cárnifex: ille trahébat, illa tenébat. Ad carníficem mater clamábat: Quid séparas a me, quem génui ex me? Uterus génuit, non mansit ille, cum vixit, úbera mea frustra lacte contórquens. Caute portávi, quem a te vídeo manu crudéli jactári. Modo eum effudérunt víscera mea, et tu elídis ad terram.

    Alia acclamábat mater, cum exáctor latro non compélleret simul occídi cum párvulo matrem: Ut quid me dimíttis inánem? Si culpa est, mea est: si non est crimen, junge mortem, et líbera matrem. Alia dicébat: Quid quǽritis? Unum quǽritis, et multos occíditis, et ad unum, qui unus est, attíngere non potéstis. Alia contra clamábat: Veni jam, veni Salvátor mundi, quámdiu quæréris? Nullum times: vídeat te miles, et nostros non occídat infántes. Miscebátur lamentátio matrum, et ad cælum transíbat oblátio parvulórum.

    Quæ cum audísset Joseph, nequáquam passus est scándalum, neque dixit: Incérta ista res est, ac prorsus ambígua. Tu paulo ante dicébas, quia salvábit populum suum, et nunc seípsum quidem non potest de perículis liberáre: sed fuga nobis est necessária, et peregrinátio, ac transmigrátio longínqua. Contrária omníno sunt facta promíssis. Sed horum nihil prorsus oppónit: vir enim erat fidélis: neque reversiónis tempus curióse inquírit, quod útique ab Angelo non signáte fúerat expréssum: sed: Esto ibi, inquit, úsquequo dicam tibi.

    Verum ille nec per ista quidem factus est ségnior, sed obedívit libénter, et crédidit, omnes prorsus tribulatiónes cum gáudio sustinéndo. Enim vero miséricors Deus mœstis rebus quædam étiam jucúnda permíscuit. Quod certe in sanctis ómnibus facit, quos neque tribulatiónes, neque jucunditátes sinit habére contínuas: sed tum de advérsis, tum ex prósperis justórum vitam quasi admirábili varietáte contéxit. Quod hic quoque eum fecísse consídera.

    Vidéndo quippe sanctus Joseph grávidam Vírginem, in conturbatiónem íncidit máximam: sed ádfuit repénte Angelus, timórem prorsus exstínguens. Deínde videns púerum natum, máxima exsultatióne replétus est: sed rursus huic étiam gáudio perículum grande succéssit, cum tota útique cívitas turbarétur, ipse rex fúreret, et ad necem púerum quǽreret. Sed et hunc mœrórem alia rursus lætítia subsecúta est, apparítio vidélicet stellæ, et adorátio Magórum. Post hanc quoque jucunditátem íterum perículum, iterúmque formído. Quærit, inquit, Heródes ánimam púeri, et fúgere necésse est, et in longínqua transíre.
