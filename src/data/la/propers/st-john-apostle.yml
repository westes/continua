# Matins Nocturn 2-3 readings for St. John, Apostle and Evangelist
# (Dec 27) — SanctiM/12-27.txt inherits the whole day (`@Sancti/12-27`)
# with no Nocturn 2/3 override, so this feast's own proper content is
# sourced from the Tridentine track exactly as for a pre-1955 saint
# (see memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/12-27.txt, English/Sancti/12-27.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading — St. Jerome's account
# from De Scriptoribus Ecclesiasticis (Lectio4-5) followed by his
# Commentary on Galatians anecdote of "Little children, love one
# another" (Lectio6) — genuinely continuous biographical material, no
# source break worth preserving as a split.
# Nocturn 3: Lectio7's Gospel citation (John 21:19-24) was previously a
# bare incipit ("Et réliqua") with only the homily authored, St.
# Augustine's homily on the two lives (Lectio7's homily + Lectio8-9
# combined, one continuous piece).
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily) — sourced from this
# feast's own Missale Evangelium, given in full (missa/Latin+English/
# Sancti/12-27.txt), not guessed at.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Jerome, On Illustrious Men, ch. 9; Commentary on Galatians, Book 3, ch. 6
      text: |-
        Joánnes Apóstolus, quem Jesus amávit plúrimum, fílius Zebedǽi, frater Jacóbi Apóstoli, quem Heródes post passiónem Dómini decollávit, novíssimus ómnium scripsit Evangélium, rogátus ab Asiæ epíscopis, advérsus Cerínthum, aliósque hæréticos, et máxime tunc Ebionitárum dogma consúrgens, qui ásserunt Christum ante Maríam non fuísse: unde et compúlsus est divínam ejus nativitátem edícere.

        Quarto décimo ígitur anno, secúndam post Nerónem persecutiónem movénte Domitiáno, in Patmos ínsulam relegátus, scripsit Apocalýpsim, quam interpretátur Justínus Martyr et Irenǽus. Interfécto autem Domitiáno, et actis ejus ob nímiam crudelitátem a senátu rescíssis, sub Nerva príncipe rédiit Ephesum: ibíque usque ad Trajánum príncipem persevérans, totas Asiæ fundávit rexítque ecclésias: et conféctus sénio, sexagésimo octávo post passiónem Dómini anno mórtuus, juxta eándem urbem sepúltus est.

        Beátus Joánnes Evangelísta, cum Ephesi morarétur usque ad últimam senectútem, et vix inter discipulórum manus ad ecclésiam deferrétur, nec posset in plura vocem verba contéxere; nihil áliud per síngulas solébat proférre colléctas, nisi hoc: Filíoli, dilígite altérutrum. Tandem discípuli et fratres, qui áderant, tǽdio affécti quod éadem semper audírent, dixérunt: Magíster, quare semper hoc lóqueris? Qui respóndit dignam Joánne senténtiam: Quia præcéptum Dómini est; et, si solum fiat, súfficit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joann 21:19-24
      text: 'In illo témpore: Dixit Jesus Petro: Séquere me. Convérsus Petrus vidit illum discípulum, quem diligébat Jesus, sequéntem, qui et recúbuit in cena super pectus ejus, et dixit: Dómine, quis est qui tradet te? Hunc ergo cum vidísset Petrus, dixit Jesu: Dómine, hic autem quid? Dicit ei Jesus: Sic eum volo manére, donec véniam, quid ad te? tu me séquere. Exiit ergo sermo iste inter fratres, quia discípulus ille non móritur. Et non dixit ei Jesus: Non móritur; sed: Sic eum volo manére, donec véniam: quid ad te? Hic est discípulus ille, qui testimónium pérhibet de his, et scripsit hæc: et scimus, quia verum est testimónium ejus.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine of Hippo, Tractate 124 on John (on John 21:19-24)
      text: |-
        Duas vitas sibi divínitus prædicátas, et commendátas novit Ecclésia: quarum est una in fide, áltera in spécie; una in témpore peregrinatiónis, áltera in æternitáte mansiónis; una in labóre, áltera in réquie; una in via, áltera in pátria; una in ópere actiónis, áltera in mercéde contemplatiónis. Una declínat a malo, et facit bonum: áltera nullum habet, a quo declínet, malum; et magnum habet, quo fruátur, bonum. Una cum hoste pugnat; áltera sine hoste regnat.

        Una súbvenit indigénti; áltera ibi est, ubi nullum ínvenit indigéntem. Una aliéna peccáta, ut sua sibi ignoscántur, ignóscit; áltera nec pátitur quod ignóscat, nec facit quod sibi poscat ignósci. Una flagellátur malis, ne extollátur in bonis; áltera tanta plenitúdine grátiæ caret omni malo, ut sine ulla tentatióne supérbiæ cohǽreat summo bono.

        Ergo una bona est, sed adhuc mísera; áltera mélior, et beáta. Ista significáta est per Apóstolum Petrum, illa per Joánnem. Tota hic ágitur ista usque in hujus sǽculi finem, et illic ínvenit finem; différtur illa complénda post hujus sǽculi finem, sed in futúro sǽculo non habet finem. Ideo dícitur huic: Séquere me. De illo autem: Sic eum volo manére, donec véniam: quid ad te? tu me séquere. Quid enim est hoc? Quantum sápio, quantum cápio, quid est hoc? nisi tu me séquere per imitatiónem perferéndi temporália mala: ille máneat, donec sempitérna vénio redditúrus bona.
      status: verified

# Sourced directly from the raw reference files (web/www/horas/Latin+English/
# Sancti/01-03.txt) -- day 8, "In Octava," St. John the Apostle's own octave
# closing day, same shape/rationale as
# st-stephen-protomartyr-octave-day-8.yml (this octave's own intervening
# days likewise carry no Lectio override in the source, correctly
# unauthored). Joins St. Augustine's Tractate 36 on John, the "eagle"
# imagery (Lectio4-6), with St. John Chrysostom's homily on John 21:20-24
# (Lectio7-9, bare incipit dropped).
# Responsory missing from this file -- authoring gap, not a design choice
# (same class as nativity-bvm-octave-day-3.yml's own fix). Reuses St. John
# the Apostle's own Responsory1 (Sancti/12-27.txt), the octave's one well-
# known opening responsory, matching the convention already established for
# the Nativity-BVM octave (every combined-lesson octave-day file there
# reuses that feast's own Responsory1 regardless of which specific
# historical Lectio number the combined text corresponds to).
octave-readings/~-octave-day-8:
  source: Tractátus sancti Augustíni Epíscopi in Joánnem; Homilía sancti Joánnis Chrysóstomi
  text: |
    In quátuor Evangéliis, vel pótius quátuor libris uníus Evangélii, sanctus Joánnes Apóstolus non immérito secúndum intelligéntiam spiritálem áquilæ comparátus, áltius multóque sublímius áliis tribus eréxit prædicatiónem suam: et in ejus erectióne étiam corda nostra érigi vóluit. Nam céteri tres Evangelístæ tamquam cum hómine Dómino in terra ámbulant, et de divinitáte ejus pauca dixérunt: istum autem quasi pigúerit in terra ambuláre, sicut ipso exórdio sui sermónis intónuit, eréxit se non solum super terram, et super omnem ámbitum áëris et cæli, sed super omnem étiam exércitum Angelórum, omnémque constitutiónem invisibílium Potestátum: et pervénit ad eum, per quem facta sunt ómnia, dicéndo: In princípio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum.

    Huic tantæ sublimitáti princípii étiam cétera cóngrua prædicávit, et de Dómini divinitáte, quómodo nullus álius, est locútus: hoc ructábat, quod bíberat. Non enim sine causa de illo in isto ipso Evangélio narrátur, quia et in convívio super pectus Dómini discumbébat. De illo ergo péctore in secréto bibébat, sed quod in secréto bibit, in manifésto eructávit: ut pervéniat ad omnes gentes non solum incarnátio Fílii Dei, pássio, et resurréctio, sed étiam quod erat ante incarnatiónem únicus Patri, Verbum Patris, coætérnus generánti, æquális ei a quo missus est.

    Aquila ipse est Joánnes, sublímium prædicátor, et lucis intérnæ atque ætérnæ fixis óculis contemplátor. Dicúntur enim et pulli aquilárum a paréntibus sic probári, patris scílicet ungue suspéndi, et rádiis solis oppóni. Qui firme contemplátus fúerit, fílius agnóscitur: si ácie palpitáverit, tamquam adulterínus ab ungue dimíttitur. Jam ergo vidéte, quam sublímia loqui débuit, qui est áquilæ comparátus: et tamen étiam nos humi repéntes, infírmi, et vix ullíus moménti inter hómines, audémus tractáre ista, et ista expónere: et putámus nos aut cápere posse cum cogitámus, aut capi dum dícimus.

    Cum magna Christus Petro communicásset, orbis terrárum curam demandásset, martýrium prædixísset et majórem erga eum dilectiónem testátus esset: cum vellet Petrus Joánnem sócium et collégam, inquit: Hic autem quid? Numquid eámdem viam aggrediétur? Et quemádmodum in cena interrogáre non ausus, Joánnem suffécit; ita nunc vicem reddit, arbitrátus eum velle, sed non audére de se sciscitári. Tum Christus: Si eum volo manére donec véniam, quid ad te?

    Nam cum nímia id caritáte díceret Petrus, nec ab eo dívidi vellet, osténdens Christus, quod quantávis eum dilectióne prosequerétur, suam ássequi non posset, inquit: Si eum volo manére, quid ad te? His verbis nos erúdiens, neque doléndum, neque curiósius præter divínam voluntátem investigándum. Nam cum Petrus semper in hujúsmodi interrogatiónes fervéntius prosilíret, íterum ejus fervórem retúndens, quod non sit ultérius inquiréndum, in hunc modum respóndit.

    Exiit ergo sermo iste inter fratres, quod discípulus ille non móritur: et non dixit ei Jesus, quia non móritur; sed, Si eum volo manére donec véniam quid ad te? Noli arbitrári, inquit, eódem modo me de vobis disposuísse. Hoc autem dixit, ut intempestívum afféctum, et consuetúdinis desidérium tólleret. Cum enim essent orbis terrárum curam susceptúri, simul ámplius esse non oportébat: magnum enim fuísset mundo detriméntum. Idcírco inquit: Opus suscepísti, id consídera: pérfice, labóra, et te certamínibus expóne. Quid ad te, si volo eum manére hic? tu offícium tuum cura, et exséquere.
