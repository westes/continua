# Read directly from web/www/horas/Latin/Sancti/08-13.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Da, quǽsumus, omnípotens Deus: ut beatórum Mártyrum tuórum Hippólyti et
    Cassiáni veneránda solémnitas, et devotiónem nobis áugeat, et salútem.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-several-martyrs (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). ss-hippolytus-and-cassian has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is the saint's own
# real proper (ss-hippolytus-and-cassian-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Vestri capílli cápitis * omnes numeráti sunt: nolíte timére: multis passéribus melióres estis vos.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    Da, quǽsumus, omnípotens Deus: ut beatórum Mártyrum tuórum Hippólyti et
    Cassiáni veneránda solémnitas, et devotiónem nobis áugeat, et salútem.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Matins reading for Ss. Hippolytus and Cassian, Martyrs (Aug 13).
# Sourced directly from web/www/horas/Latin/Sancti/08-13.txt,
# English/Sancti/08-13.txt. Single simplex-feast lesson (Lectio93),
# one continuous account covering both martyrs, pooled into the
# nocturn: 2 slot per the established vigil/simplex convention (see
# vigil-of-st-lawrence.yml's own note).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Hippolytus, a sancto Lauréntio baptizatus, domi suæ, dum Eucharistiam sumeret, comprehénsus, et ad Valerianum imperatórem adductus, ab eo de suæ religiónis professióne interrogátus, líbere se Christianum proféssus est. Quam ob rem fustibus cæditur; quibus in verbéribus cum ejus fides constantior invenirétur, munéribus et honórum promissis tentátur. Quæ cum ómnia frustra diceréntur, præfecto occidendus traditur. Qui, domum Hippolyti veniens, ut ejus facultates publicaret, totam familiam christianam esse cognoscit; atque, iis a christiana fide frustra deterritis, primum plumbátis cæsa Concordia, Hippolyti nutríce, quæ ceteros confirmábat, réliquos extra portam Tiburtinam occídi jubet. Hippolytus, indómitis equis raptátus per loca tríbulis et cárduis cónsita, lacerato corpore, spíritum Deo réddidit, unáque cum réliquis a Justino presbytero ad agrum Veranum sepúltus est. Eadem die, ad Forum Syllæ, crudelíssimo supplicio afféctus est Cassianus Martyr; qui, vinctis post terga mánibus, puerórum, quos erudiebat, férreis stylis configendus excarnificandúsque traditur. Quorum quanto erat infirmior vis, tanto ejus pœna martyrii gravior ac diuturnior, pálmaque illustrior.
      status: verified
