# Matins Nocturn 2 reading for Ss. Eustace and Companions, Martyrs
# (Sep 20). Sourced from web/www/horas/Latin/Sancti/09-20.txt,
# English/Sancti/09-20.txt. Lectio4-6 combined into one reading, one
# continuous vita, no genuine source break. Nocturn 3 (Lectio7-8) is a
# direct `@Commune/C3:LectioN in 2 loco` cross-reference, not this
# saint's own content -- not transcribed, per the bare-cross-reference
# convention (see e.g. st-peter-of-alcantara.yml).
#
# NOT currently reachable in the app -- ss-eustace-and-companions.yml is
# deliberately not wired into sanctoral-calendar.yml (see that file's own
# header for why). Authored anyway per this app's "import available
# content even if it may not survive the final calendar" convention.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Eustáchius, qui et Plácidus, génere, opibus et militári glória inter Romános insígnis, sub Trajáno imperatóre magístri mílitum títulum méruit. Cum vero sese aliquándo in venatióne exercéret ac fugiéntem miræ magnitúdinis cervum insequerétur, vidit repénte inter consisténtis feræ córnua excélsam atque fulgéntem Christi Dómini e cruce pendéntis imáginem. Cujus voce ad immortális vitæ prǽdam invitátus, una cum uxóre Theopista ac duóbus párvulis fíliis Agapíto et Theopísto, christiánæ milítiæ nomen dedit.

        Mox ad visiónis prístinæ locum, sicut ei Dóminus præcéperat, regréssus, illum prænuntiántem audívit quanta sibi deínceps, pro ejus glória, perferénda essent. Quocírca incredíbiles calamitátes mira patiéntia perpéssus, brevi in summam egestátem redáctus est. Cumque clam se subdúcere cogerétur, in itínere cónjugem primum, deínde étiam líberos sibi miserabíliter ereptos ingémuit. Tantis obvolútus ærúmnis, in regióne longínqua villícum agens longo témpore delítuit, donec, cæléstis voce recreátus ac nova occasióne a Trajáno conquisítus, íterum bello præfícitur.

        Illa in expeditióne, líberis simul cum uxóre insperáto recéptis, victor Urbem ingénti ómnium gratulatióne ingréditur. Sed paulo post inánibus diis pro parta victória sacrificáre jussus, constantíssime rénuit. Cumque váriisártibus ad Christi fidem ejuráre frustra tentarétur, una cum uxóre et líberis, leónibus objícitur. Horum mansuetúdine concitátus imperátor, ǽneum in taurum subjéctis flammis candéntem eos immítti jubet, ubi divínis in láudibus consummáto martýrio, duodécimo Kaléndas Octóbris ad sempitérnam felicitátem convolárunt. Quorum illǽsa córpora, religióse a fidélibus sepúlta, póstmodum ad ecclésiam eórum nómine eréctam honorífice translata sunt.
      status: verified
