# directly from the reference engine's own real-date output (2035-06-22).
# Same convention as data/propers/temporal/*-collect.yml.
collect:
  text: |
    Orémus.
    Da, quǽsumus, omnípotens Deus: ut beáti Paulíni Confessóris tui atque Pontíficis veneránda solémnitas, et devotiónem nobis áugeat et salútem.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
