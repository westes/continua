# Read from web/www/horas/Latin/Sancti/01-01.txt's own [Ant Vespera] (5
# antiphons) via its own [Ant Laudes] rule ("@:Ant Vespera:s/;;.*//g" —
# the reference engine's own instruction to reuse the Vespers antiphon
# *text* wholesale at Lauds, stripped of the psalm-number tags that only
# mattered for Vespers' own Ps 109/112/121/126/147 psalmody). Slotted onto
# Lauds' own standard 5-antiphon scheme (Ps 92/99/62, the Canticle, and
# Laudate), matching every other feast's lauds-psalmody-overrides shape —
# see christ-the-king.yml's own file for the same structure.
lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: 'O admirábile commércium: * Creátor géneris humáni, animátum corpus sumens, de Vírgine nasci dignátus est; et procédens homo sine sémine, largítus est nobis suam Deitátem.'
    - psalms:
        - 99
      antiphon: 'Quando natus es * ineffabíliter ex Vírgine, tunc implétæ sunt Scriptúræ: sicut plúvia in vellus descendísti, ut salvum fáceres genus humánum: te laudámus, Deus noster.'
    - psalms:
        - 62
      antiphon: 'Rubum, quem víderat Móyses * incombústum, conservátam agnóvimus tuam laudábilem virginitátem: Dei Génetrix, intercéde pro nobis.'
  canticle:
    id: canticum-trium-puerorum
    antiphon: 'Germinávit radix Jesse, * orta est stella ex Jacob: Virgo péperit Salvatórem; te laudámus, Deus noster.'
  laudate:
    antiphon: 'Ecce María génuit * nobis Salvatórem, quem Joánnes videns, exclamávit, dicens: Ecce Agnus Dei, ecce qui tollit peccáta mundi, allelúia.'

