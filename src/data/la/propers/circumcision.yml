# Read from web/www/horas/Latin/Sancti/01-01.txt's own [Ant 2] (the
# antiphon slotted right after Lauds' [Capitulum Laudes]/[Versum 2], i.e.
# Lauds' own Benedictus antiphon) and its English counterpart. The source
# also carries a distinct [Ant 3] ("Magnum hereditátis mystérium...") for
# Second Vespers' own Magnificat antiphon — not modeled here since this
# project's magnificat-antiphon lookup doesn't distinguish First/Second
# Vespers (see hours/resolve-common.ts's getMagnificatAntiphon).
benedictus-antiphon:
  text: 'Mirábile mystérium * declarátur hódie: innovántur natúræ, Deus homo factus est: id quod fuit permánsit, et quod non erat assúmpsit; non commixtiónem passus, neque divisiónem.'
  status: verified
  temporal: true

# Content read from the reference engine's live render (Monastic Tridentinum 1617, command=prayVespera):
# 2026-01-01 circumcision second. Paschaltide Alleluia is left to hours/resolve-common.ts's
# withPaschaltideAlleluia.
magnificat-antiphon:
  text: 'Magnum * hereditátis mystérium: templum Dei factus est úterus nesciéntis virum: non est pollútus ex ea carnem assúmens; omnes gentes vénient dicéntes: Glória tibi, Dómine.'
  status: verified
