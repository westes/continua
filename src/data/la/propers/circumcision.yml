# Read from the reference engine: web/www/horas/Latin/Sancti/01-01.txt and
# web/www/horas/English/Sancti/01-01.txt's own [Oratio] — the day's proper
# collect (addressed to the Virgin's fruitful motherhood, not the
# Circumcision itself directly, per the feast's own traditional Marian
# framing in this slot).
collect:
  text: |
    Orémus.
    Deus, qui salútis ætérnæ, beátæ Maríæ virginitáte fecúnda, humáno géneri prǽmia præstitísti: tríbue, quǽsumus; ut ipsam pro nobis intercédere sentiámus, per quam merúimus auctórem vitæ suscípere, Dóminum nostrum Jesum Christum Fílium tuum:
    Qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Same hymn as Vespers (the source's own "[HymnusM Matutinum]
# @:HymnusM Vespera" cross-reference in Sancti/12-25.txt) -- see
# vespers-hymn-circumcision.yml's header for the full sourcing note.
matins-hymn:
  text: |
    Christe Redémptor ómnium,
    Ex Patre Patris únice,
    Solus ante princípium
    Natus ineffabíliter.

    Tu lumen, tu splendor Patris,
    Tu spes perénnis ómnium:
    Inténde quas fundunt preces
    Tui per orbem fámuli.

    Meménto salútis Auctor,
    Quod nostri quondam córporis,
    Ex illibáta Vírgine
    Nascéndo, formam súmpseris.

    Sic præsens testátur dies,
    Currens per anni círculum,
    Quod solus a sede Patris
    Mundi salus advéneris.

    Hunc cælum, terra, hunc mare,
    Hunc omne quod in eis est,
    Auctórem advéntus tui,
    Laudans exsúltat cántico.

    Nos quoque, qui sancto tuo
    Redémpti sánguine sumus,
    Ob diem natális tui,
    Hymnum novum concínimus.

    Glória tibi Dómine,
    Qui natus es de Vírgine,
    Cum Patre et Sancto Spíritu,
    In sempitérna sǽcula.
    Amen.
  status: verified

# Read from web/www/horas/Latin/Sancti/01-01.txt's own [Capitulum Laudes]
# and its English counterpart. Also serves Vespers (see
# hours/vespers.ts's lookupPart (Vespers chapter, Lauds sibling): no distinct
# `vespers-capitulum-circumcision` file exists in the source either — the
# reference engine reuses this same chapter at both hours, same pattern
# already established for every other feast this project has authored).
lauds-capitulum:
  text: 'Fratres: Appáruit grátia Dei Salvatóris nostri ómnibus homínibus, erúdiens nos, ut abnegántes impietátem, et sæculária desidéria, sóbrie, et juste, et pie vivámus in hoc sǽculo.'
  citation: Tit 2:11-12
  status: verified

# Circumcision's own rubric ("[Rank]" block, Sancti/01-01.txt) reads "ex
# Sancti/12-25" -- it borrows Christmas Day's own propers wholesale except
# where it has its own (collect, Benedictus/Magnificat antiphons). Christmas
# Day itself has no authored hymn files of its own yet (a separate, larger
# gap -- Dec 25 doesn't resolve as its own winner id at all, see TODO.md),
# so this is a direct copy of the identical, already-verified text from
# lauds-hymn-christmas-octave-sunday.yml ("A solis ortus cardine", Divino
# Afflatu 1954 Lauds live query) rather than a new translation -- Christmas
# Day's own [Hymnus Laudes] in Sancti/12-25.txt is byte-identical to the
# Octave Sunday's.
#
# Reviewed 2026-09-11 against the Monastic ([HymnusM Laudes]) word
# substitutions: most are a wash (auctor/Auctor capitalization,
# Enítitur/Eníxa est tense, ventre Matris/matris alvo word order,
# Baptísta clausum/Clausus Joánnes title-vs-name, Et lacte módico/Parvóque
# lacte -- all synonymous, not adopted). Two of the Monastic swaps
# (Jesu tibi sit glória -> Glória tibi Dómine, almo -> Sancto Spíritu)
# actually flatten this text's own more specific wording (the direct
# address to the Holy Name, "almo" as a distinctive life-giving epithet
# vs. the generic "Sancto" every other hymn's doxology already uses) --
# kept as-is. Only "Concépit alvo" -> "Verbo concépit" adopted: a real
# improvement, not just a meter tweak -- it ties the Incarnation directly
# to the Johannine "Verbum caro factum est" (the Word made flesh), which
# the plain "conceived in the womb" phrasing doesn't carry.
lauds-hymn:
  text: |
    A solis ortus cárdine
    Ad usque terræ límitem,
    Christum canámus Príncipem,
    Natum María Vírgine.

    Beátus auctor sǽculi
    Servíle corpus índuit:
    Ut carne carnem líberans,
    Ne pérderet quos cóndidit.

    Castæ Paréntis víscera
    Cæléstis intrat grátia:
    Venter Puéllæ báiulat
    Secréta, quæ non nóverat.

    Domus pudíci péctoris
    Templum repénte fit Dei:
    Intácta nésciens virum,
    Verbo concépit Fílium.

    Enítitur puérpera,
    Quem Gábriel prædíxerat,
    Quem ventre Matris géstiens,
    Baptísta clausum sénserat.

    Fœno iacére pértulit:
    Præsépe non abhórruit:
    Et lacte módico pastus est,
    Per quem nec ales ésurit.

    Gaudet chorus cæléstium,
    Et Angeli canunt Deo;
    Palámque fit pastóribus
    Pastor, Creátor ómnium.

    Iesu, tibi sit glória,
    Qui natus es de Vírgine,
    Cum Patre, et almo Spíritu,
    In sempitérna sǽcula.
    Amen.
  status: verified

# See vespers-versicle-circumcision.yml's own note — the source's own
