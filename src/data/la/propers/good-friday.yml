# Read from the reference engine: web/www/horas/Latin/Tempora/Quad6-5.txt.
# Like Maundy Thursday (see maundy-thursday-collect.yml's note), this day
# has no ordinary spoken collect -- its [Oratio] is
# `@Tempora/Quad6-4::s/usque ad mortem/usque ad mortem, mortem autem
# crucis/`, i.e. Thursday's own Tenebrae-form Oratio with the "Christus
# factus est" versicle lengthened one clause further, continuing Phil
# 2:8's own text ("...unto death, even the death of the Cross"). This is
# the well-known gradual "Christus factus est" that grows a clause longer
# each day of the Triduum, cadencing at its fullest on Holy Saturday (see
# holy-saturday-collect.yml). Historically Good Friday has no Mass and no
# ordinary blessing in the usual form at all (the Missa Præsanctificatorum
# is a distinct liturgical action, not modeled here as an "hour"); this
# lengthened Tenebrae Oratio is the real proper text the Office itself
# gives this day in place of an ordinary collect. Not live-cross-checked
# (same reason as Thursday's) -- transcribed directly from the raw file.
collect:
  text: |
    V. Christus factus est pro nobis obédiens usque ad mortem, mortem autem crucis.
    Pater noster (secreto).
    Psalmus 50 (Miserere).
    Réspice, quǽsumus, Dómine, super hanc famíliam tuam, pro qua Dóminus noster Jesus Christus non dubitávit mánibus tradi nocéntium, et crucis subíre torméntum:
    Qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    (Et sub silentio concluditur.)
  status: draft
  temporal: true

