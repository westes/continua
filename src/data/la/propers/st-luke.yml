# Matins Nocturn 2 reading for St. Luke, Evangelist (Oct 18) —
# SanctiM/10-18.txt inherits the whole day (`@Sancti/10-18`) with no
# Nocturn 2/3 override, so this saint's own content is sourced from
# the Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/10-18.txt, English/Sancti/10-18.txt.
# Lectio4-6 combined into one reading, one continuous excerpt of St.
# Jerome. No responsory given in the source.
#
# Verified 2026-09-05 (Gospel-pairing sweep): horas/Latin/Sancti/10-18.txt
# ends at Lectio6 (Jerome's biographical/literary catalogue entry on
# Luke as Gospel-author) -- there is no proper Lectio7-9 at all, so
# Nocturn 3 falls through entirely to Common of an Evangelist (C1a)'s
# own generic content, already handled by this store's
# per-Common-category pool. No proper Gospel of Luke's own to pair here
# (this file's own content IS the Nocturn 3-adjacent biographical
# reading with nothing to pair it to).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Jerome, Priest, On Illustrious Men, ch. 7
      text: |-
        Lucas médicus Antiochénsis ut ejus scripta índicant, Græci sermónis non ignárus, fuit sectátor Apóstoli Pauli, et omnis peregrinatiónis ejus comes. Scripsit Evangélium, de quo idem Paulus: Mísimus, inquit, cum illo fratrem, cujus laus est in Evangélio per omnes ecclésias. Et ad Colossénses: Salútat vos Lucas, médicus caríssimus. Et ad Timótheum: Lucas est mecum solus. Aliud quoque édidit volúmen egrégium, quod título, Acta Apostolórum, prænotátur: cujus história usque ad biénnium Romæ commorántis Pauli pervénit, id est, usque ad quartum Nerónis annum. Ex quo intellégimus in eádem urbe librum esse compósitum.

        Igitur períodos Pauli et Theclæ, et totam baptizáti Leónis fábulam, inter apócryphas scriptúras computámus. Quale enim est, ut indivíduus comes Apóstoli, inter céteras ejus res, hoc solum ignoráverit? Sed et Tertulliánus, vicínus eórum témporum, refert presbýterum quemdam in Asia, amatórem Apóstoli Pauli, convíctum a Joánne quod auctor esset libri, et conféssum se hoc Pauli amóre fecísse, et ob id loco excidísse. Quidam suspicántur, quotiescúmque in epístolis suis Paulus dicit, Juxta Evangélium meum, de Lucæ significáre volúmine.

        Lucam autem, non solum ab Apóstolo Paulo didicísse Evangélium, qui cum Dómino in carne non fúerat, sed et a céteris Apóstolis; quod ipse quoque in princípio sui volúminis declárat, dicens: Sicut tradidérunt nobis, qui a princípio ipsi vidérunt et minístri fuérunt sermónis. Igitur Evangélium, sicut audíerat, scripsit; Acta vero Apostolórum, sicut víderat ipse, compósuit. Vixit octogínta et quátuor annos, uxórem non habens. Sepultus est Constantinópoli, ad quam urbem, vigésimo Constantíni anno, ossa ejus cum relíquiis Andréæ Apóstoli transláta sunt de Achája.
      status: verified
