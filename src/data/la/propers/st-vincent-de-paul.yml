# Read directly from web/www/horas/Latin/Sancti/07-19.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui, ad evangelizándum paupéribus et ecclesiástici órdinis decórem
    promovéndum, beátum Vincéntium apostólica virtúte roborásti: præsta,
    quǽsumus; ut, cujus pia mérita venerámur, virtútum quoque instruámur
    exémplis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-confessor (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). st-vincent-de-paul has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-vincent-de-paul-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui, ad evangelizándum paupéribus et ecclesiástici órdinis decórem
    promovéndum, beátum Vincéntium apostólica virtúte roborásti: præsta,
    quǽsumus; ut, cujus pia mérita venerámur, virtútum quoque instruámur
    exémplis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. Vincent de Paul, Confessor (July 19).
# Sourced directly from web/www/horas/Latin/Sancti/07-19.txt,
# English/Sancti/07-19.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in his own file (a direct
# `@Commune/C1a:LectioN` cross-reference) -- not transcribed, per the
# bare-cross-reference convention.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Vincentius a Paulo, natióne Gallus, Podii non procul ab Aquis Tarbellis in Aquitánia natus, jam tum a púero exímiam in páuperes caritátem præ se tulit. A custódia paterni gregis ad litteras evocatus, humanas Aquis, divinas cum Tolosæ, tum Cæsaraugustæ didicit. Sacerdotio initiátus ac theologíæ laurea insignítus, in Turcas íncidit, qui captivum in Africam abduxérunt. Sed in captivitáte positus herum ipsum Christo rursus lucrifecit. Cum eo ígitur ex bárbaris oris, opitulante Deípara, sese prorípiens, ad apostolica limina iter instituit. Unde in Gálliam reversus, Clippíaci primum, mox Castelliónis parœcias sanctíssime rexit. Renuntiátus a rege primarius Sacrórum miníster in Galliæ trirémibus, mirum quo zelo et ducum et rémigum salúti operam posúerit. Moniálibus Visitatiónis a sancto Francisco Salesio præpositus, tanta prudéntia per annos circiter quadragínta eam curam sustinuit, ut maxime comprobaverit judícium sanctíssimi præsulis, qui sacerdotem Vincentio digniórem nullum se nosse fatebátur.

        Evangelizandis paupéribus, præsertim rurícolis, ad decrépitam usque ætátem indeféssus incúbuit, eique apostolico operi tum se, tum alumnos congregatiónis, quam sub nómine Presbyterórum sæculárium Missiónis instituit, perpetuo voto a sancta Sede confírmato, speciatim obstrinxit. Quantum autem augendæ cleri disciplinæ allaboraverit, testántur erecta majórum clericórum seminaria, collatiónum de divinis inter sacerdótes frequéntia, et sacræ ordinatióni præmittenda exercítia. Insuper, ad amplificandam fidem et pietátem, evangelicos misit operarios, non in solas Galliæ provincias, sed et in Italiam, Polóniam, Scotiam, Hiberniam, atque ad Bárbaros et Indos. Ipse vero, vita functo Ludovíco décimo tertio, cui moriénti hortator ástitit, a regína Anna Austríaca, matre Ludovíci décimi quarti, in sanctius concílium accítus, studiosíssime egit, ut nónnisi digniores ecclésiis ac monastériis præficeréntur; civiles discordiæ, singularia certamina, serpéntes erróres, quos simul sensit et exhorruit, amputaréntur; debítaque judíciis apostolicis obediéntia præstarétur ab ómnibus.

        Nullum fuit calamitátis genus, cui paterne non occúrrerit. Fideles sub Turcárum jugo geméntes, infántes expósitos, júvenes díscolos, vírgines periclitántes, moniáles dispérsas, mulieres lapsas, ad trirémes damnatos, peregrinos infirmos, artífices inválidos, ipsosque mente captos, ac innúmeros mendícos subsidiis et hospitiis etiamnum superstítibus excepit ac pie fovit. Lotharingiam, Campaniam, Picardiam, aliasque regiónes peste, fame, belloque vastatas, prolixe refécit. Plurima ad perquirendos et sublevándos míseros sodalítia fundávit, inter quæ celebris matronárum cœtus, et late diffúsa sub nómine Caritátis puellárum socíetas. Corporis demum afflictatióne, labóribus, senioque attritus, die vigesima septima Septembris, anno salútis supra millesimum sexcentésimo sexagesimo, ætátis suæ octogesimo quinto, Parísiis, in domo sancti Lázari, quæ caput est congregatiónis Missiónis, plácide obdormívit; quem, virtútibus, meritis ac miraculis clarum, Clemens duodecimus inter Sanctos rétulit.
      status: verified
