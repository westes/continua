# Verified against Divinum Officium (Monastic Tridentinum 1617) — read
# directly from the reference engine's own real-date output. Originally
# checked against 2029-01-23 (a transfer-year artifact, see
# st-hilary-of-poitiers.yml's own corrected note); re-confirmed identical
# on 2026-01-14, his real fixed date, so the collect text itself was
# never wrong, only the date this app filed it under.
collect:
  text: |
    Orémus.
    Da, quǽsumus, omnípotens Deus: ut beáti Hilárii Confessóris tui atque Pontíficis veneránda solémnitas, et devotiónem nobis áugeat et salútem.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

