# Matins Nocturn 2 reading for St. Hilary of Poitiers, Bishop, Confessor,
# Doctor (Jan 14) — SanctiM/01-14.txt inherits the whole day (`@Sancti/01-14`)
# with no Nocturn 2/3 override, so this saint's own vita is sourced from
# the Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints/vu-reference-engine-file-layout).
# web/www/horas/Latin/Sancti/01-14.txt, English/Sancti/01-14.txt.
# Lectio4-5 combined with Lectio6 (itself internally split into
# `Lectio6beginning`/`Lectio6recentaddition` by the source, purely to
# splice in a later Vatican-added closing paragraph about his 1851
# Doctor-of-the-Church declaration) — all one continuous vita, no
# genuine source change. Lectio7-9 fall back to Common of a Doctor
# (`Commune/C4a`), not proper text, so not authored here. No responsory
# given in the source for these lessons.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Hilárius, in Aquitánia nóbili génere natus, doctrína et eloquéntia excélluit. Qui primum in matrimónio quasi mónachi vitam egit: deínde propter singuláres virtútes Pictavórum epíscopus creátur: quod munus episcopále sic gessit, ut a fidélibus summam laudem consequerétur. Quo témpore, cum terróribus, bonórum spoliatióne, exsílio, et omni crudelitáte Constántius imperátor Cathólicos vexáret, nisi ad Ariánas partes transírent; Hilárius tamquam firmíssimum murum se Ariánis oppónens, illórum furórem in se concitávit. Itaque multis petítus insídiis, tandem dolo Saturníni Arelaténsis epíscopi, de sýnodo Biterrénsi in Phrýgiam relegátus est: ubi et mórtuum suscitávit, et libros duódecim scripsit de Trinitáte contra Ariános.

        Quadriénnio post coácto concílio ad Seléuciam, Isáuriæ urbem, Hilárius adésse compúlsus est: ac deínde Constantinópolim proféctus, ubi extrémum fídei perículum animadvértit, tribus libéllis públice datis, audiéntiam imperatóris popóscit, ut de fide cum adversáriis coram disputáret. Verum cum Ursácius et Valens Ariáni epíscopi, quos Hilárius scriptis confutárat, præséntis eruditiónem pertiméscerent, Constántio persuasérunt, ut spécie honóris eum in suum episcopátum restitúeret. Tunc Hilárium e prǽlio hæreticórum reverténtem, ut inquit sanctus Hierónymus, Galliárum ecclésia cómplexa est: quem ad episcopátum secútus est Martínus, qui póstea Turonénsi prǽfuit ecclésiæ; tantúmque illo doctóre profécit, quantum ejus póstea sánctitas declarávit.

        Magna deínceps tranquillitáte Pictavórum ecclésiam administrávit: Galliámque univérsam addúxit, ut Arianórum impietátem condemnáret. Multos libros scripsit mira eruditióne; quos omnes sanctus Hierónymus ad Lætam, sine ulla erróris suspicióne legi posse testátur illis verbis: Hilárii libros inoffénso decúrrat pede. Migrávit in cælum Idibus Januárii, Valentiniáno et Valénte imperatóribus, anno post Christum natum trecentésimo sexagésimo nono. Eum a multis Pátribus et concíliis insígnem Ecclésiæ Doctórem nuncupátum, atque uti talem in áliquot diœcésibus cultum, tandem instánte sýnodo Burdigalénsi Pius nonus Póntifex máximus, ex sacrórum Rítuum Congregatiónis consúlto, universális Ecclésiæ Doctórem declarávit et confirmávit, ac ipsíus festo die Missam et Offícium de Doctóribus ab ómnibus recitári jussit.
      status: verified
