# Read directly from web/www/horas/Latin/Tempora/Pasc7-3.txt's own
# [Oratio] and its English counterpart. Standard "Qui tecum..." closing
# spelled out in full (the source abbreviates it as "$Qui tecum eiusdem"),
# matching every other collect in this store.
collect:
  text: |
    Orémus.
    Mentes nostras, quǽsumus, Dómine, Paráclitus, qui a te procédit, illúminet: et indúcat in omnem, sicut tuus promísit Fílius, veritátem.
    Qui tecum vivit et regnat in unitáte ejúsdem Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Read directly from web/www/horas/Latin/Tempora/Pasc7-3.txt's own
# [Ant 2] and its English counterpart, echoing Lectio1's Gospel line
# (John 6:51). The source's own default (non-Cistercian/Dominican-rubric)
# text is used, not the alternate "(sed rubrica cisterciensis aut rubrica
# praedicatorum)" variant given alongside it.
benedictus-antiphon:
  text: Ego sum panis vivus, * dicit Dóminus, qui de cælo descéndi, allelúia, allelúia.
  status: verified
  temporal: true

# Read directly from web/www/horas/Latin/Tempora/Pasc7-3.txt's own
# [Ant 3] and its English counterpart. The source's own default
# (non-Cistercian/Dominican-rubric) text is used, not the alternate
# "Amen, amen dico vobis..." variant given alongside it.
magnificat-antiphon:
  text: 'Ego sum panis vivus, * dicit Dóminus, qui de cælo descéndi: si quis manducáverit ex hoc pane, vivet in ætérnum: et panis, quem ego dabo, caro mea est pro mundi vita, allelúia.'
  status: verified
  temporal: true

# Matins Nocturn content for Pentecost Ember Wednesday (Feria Quarta
# Quattuor Temporum Pentecostes) — Gospel pericope (John 6:44-52) sourced
# from web/www/missa/Latin/Tempora/Pasc7-3.txt and missa/English/Tempora/
# Pasc7-3.txt (horas/Tempora/Pasc7-3.txt only gives the incipit + "Et
# réliqua"); homily sourced from horas/Latin/Tempora/Pasc7-3.txt and
# horas/English/Tempora/Pasc7-3.txt. Latin/TemporaM/Pasc7-3.txt inherits
# Lectio1-3/Responsory1-2 unchanged from the secular file and only adds
# its own extra Responsory3 (for a 3rd Monastic lesson this app doesn't
# model, same "1 nocturn, recombined" shape as every other Ember day) —
# no divergence in the content actually used here.
#
# Recombined into one reading, same convention as September's Ember days
# (see ember-september-friday.yml's own doc comment for the fuller
# rationale): St. Augustine's homily is one continuous text on being
# "drawn" to Christ, split only to fill the fixed 3-lesson slot count.
# Responsory is Lectio1's own (Responsory1) per the "first one, when
# several collapse" convention — genuinely proper to this day and this
# quarter (not a generic cross-reference to the governing Sunday, unlike
# Lent's own Ember days).
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Joann 6:44-52
      text: 'In illo témpore: Dixit Jesus turbis Judæórum: Nemo potest veníre ad me, nisi Pater, qui misit me, tráxerit eum: et ego resuscitábo eum in novíssimo die. Est scriptum in Prophétis: Et erunt omnes docíbiles Dei. Omnis, qui audívit a Patre et dídicit, venit ad me. Non quia Patrem vidit quisquam, nisi is, qui est a Deo, hic vidit Patrem. Amen, amen, dico vobis: qui credit in me, habet vitam ætérnam. Ego sum panis vitæ. Patres vestri manducavérunt manna in desérto, et mórtui sunt. Hic est panis de cœlo descéndens: ut, si quis ex ipso manducáverit, non moriátur. Ego sum panis vivus, qui de cœlo descéndi. Si quis manducáverit ex hoc pane, vivet in ætérnum: et panis, quem ego dabo, caro mea est pro mundi vita.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tract 26 on John (on being drawn to Christ)
      text: |-
        Noli cogitáre te invítum trahi: tráhitur ánimus et amóre. Nec timére debémus, ne ab homínibus, qui verba perpéndunt, et a rebus máxime divínis intellegéndis longe remóti sunt, in hoc Scripturárum sanctárum evangélico verbo fórsitan reprehendámur, et dicátur nobis: Quómodo voluntáte credo, si trahor? Ego dico: Parum est voluntáte: étiam voluptáte tráheris. Quid est, trahi voluptáte? Delectáre in Dómino: et dabit tibi petitiónes cordis tui. Est quædam volúptas cordis, cui panis dulcis est ille cæléstis. Porro si poétæ dícere lícuit: Trahit sua quemque volúptas: non necéssitas, sed volúptas; non obligátio, sed delectátio: quanto fórtius nos dícere debémus, trahi hóminem ad Christum, qui delectátur veritáte, delectátur beatitúdine, delectátur justítia, delectátur sempitérna vita, quod totum Christus est? An vero habent córporis sensus voluptátes suas, et ánimus deséritur a voluptátibus suis? Si ánimus non habet voluptátes suas, unde dícitur: Fílii autem hóminum sub tégmine alárum tuárum sperábunt: inebriabúntur ab ubertáte domus tuæ, et torrénte voluptátis tuæ potábis eos. Quóniam apud te est fons vitæ: et in lúmine tuo vidébimus lumen.

        Da amántem, et sentit quod dico: da desiderántem, da esuriéntem, da in ista solitúdine peregrinántem, atque sitiéntem, et fontem ætérnæ pátriæ suspirántem: da talem, et scit quid dicam. Si autem frígido loquor, nescit, quid loquor. Tales erant isti, qui ínvicem murmurábant. Pater, inquit, quem tráxerit, venit ad me. Quid est autem, Pater quem tráxerit, cum ipse Christus trahat? Quare vóluit dícere, Pater quem tráxerit? Si trahéndi sumus, ab illo trahámur, cui dicit quædam, quæ díligit: Post odórem unguentórum tuórum currémus. Sed quid intéllegi vóluit, advertámus fratres, et, quantum póssumus, capiámus. Trahit Pater ad Fílium eos, qui proptérea credunt in Fílium, quia eum cógitant Patrem habére Deum. Deus enim Pater æquálem sibi génuit Fílium; et qui cógitat, atque in fide sua sentit et rúminat, æquálem esse Patri eum, in quem credit, ipsum trahit Pater ad Fílium.

        Aríus crédidit creatúram, non eum traxit Pater; quia non consíderat Patrem, qui Fílium non credit æquálem. Quid dicis, o Ari? quid dicis, hærétice? quid loquéris? Quid est Christus? Non, inquit, Deus verus, sed quem fecit Deus verus. Non te traxit Pater; non enim intellexísti Patrem, cujus Fílium negas. Aliud cógitas, non est ipse Fílius: nec a Patre tráheris, nec ad Fílium tráheris. Aliud est enim Fílius, áliud quod tu dicis. Photínus dicit: Homo solum est Christus, non est et Deus. Qui sic credit, non Pater eum traxit. Quem traxit Pater? Illum qui dicit: Tu es Christus Fílius Dei vivi. Ramum víridem osténdis ovi, et trahis illam. Nuces púero demonstrántur, et tráhitur: et quod currit, tráhitur, amándo tráhitur, sine læsióne córporis tráhitur, cordis vínculo tráhitur. Si ergo ista, quæ inter delícias et voluptátes terrénas revelántur amántibus, trahunt, quóniam verum est, Trahit sua quemque volúptas; non trahit revelátus Christus a Patre? Quid enim fórtius desíderat ánima, quam veritátem?
      responsory: |-
        R. Disciplínam et sapiéntiam dócuit eos Dóminus, allelúia: firmávit in illis grátiam Spíritus sui, * Et intelléctu implévit corda eórum, allelúia.
        V. Repentíno namque sónitu Spíritus Sanctus super eos venit.
        R. Et intelléctu implévit corda eórum, allelúia.
      status: verified
