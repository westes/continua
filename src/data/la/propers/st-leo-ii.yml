# Matins Nocturn 2 reading for St. Leo II, Pope and Confessor (July 3).
# Sourced directly from web/www/horas/Latin/Sancti/07-03.txt,
# English/Sancti/07-03.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in his own file (his `[Rule]` is `vide
# C4b`) -- defers to the Common's own Nocturn 3, not transcribed here.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Leo secúndus, Póntifex máximus, Sículus, humánis et divínis lítteris Græce et Latíne doctus, músicis étiam erudítus fuit; ipse enim sacros Hymnos et Psalmos in Ecclésia ad concéntum meliórem redúxit. Probávit acta sextæ Synodi, quæ Constantinópoli celebráta est, præsidéntibus legátis apostólicæ Sedis, præsénte quoque Constantíno imperatóre, et duobus patriárchis, Constantinopolitáno et Antiochéno, ac centum septuagínta epíscopis; quam et in Latínum tránstulit.

        In eo concílio Cyrus, Sergius et Pyrrhus condemnáti sunt, unam tantúmmodo voluntátem et operatiónem in Christo prædicántes. Hic fregit supérbiam antístitum Ravennátum, qui, exarchórum freti poténtia, Sedi apostólicæ non obtemperábant. Quam ob rem decrévit ut eléctio cleri Ravennátis írrita esset, nisi Románi Pontíficis auctoritáte comprobarétur.

        Vere pater páuperum fuit; non enim pecúnia solum, sed opera, labóre et consíliis, egéntium viduárum et pupillórum inópiam ac solitúdinem sublevábat. Qui, dum síngulos non magis prædicatióne quam vita ad pie sanctéque vivéndum adhortarétur, obdormívit in Dómino mense sui pontificátus undécimo, quinto Nonas Julii, anno sexcentésimo octogésimo tertio, sepultúsque est in basilica sancti Petri. Ordinatióne una, mense Junio, creávit presbýteros novem, diáconos tres, epíscopos divérsis in locis vigínti tres.
      status: verified
