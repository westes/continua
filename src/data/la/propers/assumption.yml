# Matins Nocturn 2-3 readings for the Assumption of the B.V.M. (Aug
# 15, Duplex I class with Common Octave) — SanctiM/08-15.txt bases
# `@SanctiM/08-15t`, which in turn bases `@Sancti/08-15t` (the whole
# day, no Nocturn 2/3 override), so this feast's own proper content is
# sourced from the Tridentine track exactly as for a pre-1955 saint
# (see memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# Nocturn 1 (Lectio1-3, the Song of Songs) not authored here, per this
# project's convention of leaving Nocturn 1 scripture to the bible-plan
# store rather than this file.
# web/www/horas/Latin/Sancti/08-15t.txt, English/Sancti/08-15t.txt.
#
# Nocturn 2: Lectio4_-6_ (St. John of Damascus's sermon on the
# Dormition) combined into one reading, one continuous excerpt.
# Nocturn 3: Lectio7's Gospel citation (Luke 10:38-42 — the same
# Martha-and-Mary pericope as `st-martha.yml`'s own Nocturn 3, read
# here for its traditional allegorical link to Mary's "better part")
# is a bare incipit ("Et réliqua") with no full pericope text given,
# so only the homily portion was originally authored (not marked
# isGospel), combined with Lectio8-9 as one continuous excerpt of St.
# Augustine's own (different) sermon on the same passage. No
# responsory given for either reading.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily) — sourced from
# Sancti/07-29.txt's own [Evangelium] (St. Martha's own Mass Gospel,
# this feast's own `@Sancti/08-15t` -> `@SanctiM/08-15t` chain resolving
# back to `@Sancti/08-15t`, which itself in turn shares this same
# Nocturn 3 Gospel — cross-checked against `st-martha.yml`'s own
# citation), not guessed at.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. John of Damascus, Sermon 2 on the Falling-Asleep of the B.V.M.
      text: |-
        Hódie sacra et animáta arca Dei vivéntis, quæ suum in útero concépit Creatórem, requiéscit in templo Dómini, quod nullis est exstrúctum mánibus. Et David exsúltat ejus parens, et cum eo choros ducunt Angeli, célebrant Archángeli, Virtútes gloríficant, Principátus exsúltant, Potestátes collætántur, gaudent Dominatiónes, Throni festum diem agunt, laudant Chérubim, glóriam ejus prǽdicant Séraphim. Hódie Eden novi Adam paradísum súscipit animátum, in quo solúta est condemnátio, in quo plantátum est lignum vitæ, in quo opérta fuit nostra núditas.

        Hódie Virgo immaculáta, quæ nullis terrénis inquináta est afféctibus, sed cæléstibus educáta cogitatiónibus, non in terram revérsa est; sed, cum esset animátum cælum, in cæléstibus tabernáculis collocátur. Ex qua enim ómnibus vera vita manávit, quómodo illa mortem gustáret? Sed cedit legi latæ ab eo quem génuit; et, ut fília véteris Adam, véterem senténtiam súbiit (nam et ejus Fílius, qui est vita ipsa, eam non recusávit); ut autem Dei vivéntis Mater, ad illum ipsum digne assúmitur.

        Heva, quæ serpéntis suggestióni assénsum præbuit, partus dolóre, et mortis senténtia damnátur, et in inferórum collocátur penetrálibus. Hanc autem vere beátam, quæ Dei verbo aures præstitit, et Spíritus sancti operatióne repléta est, atque ad Archángeli spiritáli salutatióni, sine voluptáte et virili consórtio, Dei Fílium concépit, et sine dolóre áliquo péperit, ac totam se Deo consecrávit, quónam modo mors devoráret? quómodo inferi suscíperent? quómodo corrúptio invaderet corpus illud, in quo vita suscépta est? Huic recta, plana, et facilis ad cælum paráta est via. Si enim, Ubi ego sum, illic et miníster meus erit, inquit vita et véritas Christus; quómodo non pótius mater cum ipso erit?
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 10:38-42
      text: 'In illo témpore: Intrávit Jesus in quoddam castéllum: et múlier quædam, Martha nómine, excépit illum in domum suam et huic erat soror nómine María quæ étiam sedens secus pedes Dómini audiébat verbum illíus. Martha autem satagébat circa frequens ministérium quæ stetit, et ait: Dómine non est tibi curæ quod soror mea relíquit me solam ministráre dic ergo illi ut me adjúvet et respóndens dixit illi Dóminus: Martha, Martha, sollícita es, et turbáris erga plúrima: porro unum est necessárium. María óptimam partem elégit, quæ non auferétur ab ea.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 27 on the Words of the Lord (on Luke 10:38-42)
      text: |-
        Sanctum Evangelium cum legeretur, audivimus a femina religiosa susceptum esse Dominum hospitio, eaque Martha vocabatur. Et cum esset ipsa occupata in cura ministrandi, soror ejus Maria sedebat ad pedes Domini, et audiebat verbum ejus. Laborabat illa, vacabat ista. Illa erogabat, hæc implebatur. Verumtamen Martha laborans multum in illa occupatione et negotio ministrandi, interpellavit Dominum: et de sorore sua conquesta est, quod eam laborantem non adjuvaret.

        Dominus autem pro Maria respondit Marthæ: et ipse ejus factus est advocatus, qui judex fuerat interpellatus. Martha, inquit, circa multa es occupata, quando unum est necessarium. Maria meliorem partem elegit, quæ non auferetur ab ea. Audivimus enim et interpellationem interpellantis, et sententiam judicis. Quæ sententia interpellanti respondit, susceptam defendit. Erat enim Maria intenta dulcedini verbi Domini. Intenta erat Martha quomodo pasceret Dominum: intenta Maria quomodo pasceretur a Domino. A Martha convivium Domino parabatur, in cujus convivio Maria jam jucundabatur.

        Cum ergo María suaviter audíret verbum dulcissimum, et corde intentissimo pasceretur, interpellato Domino a soróre sua, quomodo putamus eam timuisse, ne diceret ei Dominus: Surge, et adjuva sororem tuam? Mira enim suavitate tenebatur: quæ profecto major est mentis quam ventris. Excusata est, sedit securior. Quomodo autem excusata? Attendamus, inspiciamus, perscrutemur quod possumus, ut pascamur et nos.
      status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), live
