  source: Sermo sancti Bernardi Abbátis
  text: |
    n. 1 Virgo, hódie gloriósa cælos ascendens, gaudiæ civium copiósis sine dúbio cumulávit augméntis. Hæc est enim, cujus salutatiónis vox et ipsos exsultáre facit in gáudio, quos matérna adhuc víscera claudunt. Quod, si párvuli necdum nati anima liquefácta est, ut María locúta est; quid putámus, quænam illa fúerit cæléstium exsultátio, cum et vocem audíre, et vidére fáciem, et beáta ejus frui præséntia meruérunt?

    n. 4 Sed et illud quis cogitáre sufficiát, quam gloriósa mundi Regína procésserit, et quanto devotiónis afféctu tota in ejus occursum cæléstium legiónum prodíerit multitúdo; quibus ad thronum glóriæ cánticis sit dedúcta; quam plácido vultu, quam seréna fácie, quam divínis ampléxibus suscépta a Fílio, et super omnem exaltáta creatúram, cum eo honóre, quo tanta Mater digna fuit, cum ea glória, quæ tantum décuit Fílium?

    Felicía prorsus óscula lábiis impressa lactentis, cui virgíneo Mater applaudébat in grémio. Verum numquid non felicióra censébimus, quæ ab ore sedéntis in déxtera Patris hódie in beáta salutatióne suscépit, cum ascénderet ad thronum glóriæ, epithalámium canens, et dicens: Osculétur me ósculo oris sui?  Christi generatiónem et Maríæ assumptiónem quis enarrábit? Quantum enim grátiæ in terris adépta est præ céteris, tantum et in cælis óbtinet glóriæ singuláris.
