octave-readings/~-octave-day-2:
  source: Sermo sancti Joannis Damasceni
  text: |
    Jubilemus in arca Domini Dei toto animo, et muri cadent Hiericontini, contrariarum, inquam potestatum infestæ munitiones. Cum David exsultemus spiritu. Arca enim Domini hodie requievit. Clamemus cum Gabriele, qui primum locum obtinet inter angelos: Ave gratia plena: dominus tecum. Ave gaudii pelagus inexhaustum. Ave unicum molestiarum levamen. Aue omnium cordis dolorum medicamentum. Ave sancta virgo per quam mors quidem fuit expulsa, vita autem introducta.

    Tu vero o sacrorum sepulcrorum sacratissimum, post domini quidem sepulcrum, quod uitæ dedit principium, quod fuit fons resurrectionis, (tecum enim loquar tamquam cum animato) ubinam est aurum illud purum, quod manus apostolorum in te condiderunt! Ubi divitiæ, quæ consumi nequeunt! Ubi novum uolumen, in quo ineffabiliter deus uerbum sine manu inscriptum fuit! Ubi abyssus gratiæ? Ubi pelagus curationum? Ubi est desiderabile illud deiparæ uirginis corpus?

    Quid quæritis in sepulcro eam, quæ ad cælestia translata est tabernacula? cur a me custodiæ rationem exposcitis? Non possum ego divinis jussis resistere. Sacrosanctum corpus mihi quoque sanctitatem impertivit quod me pretiosissimi unguenti fragrantia replevit, et divinum templum effecit relictis sindonibus, abiit raptum sublime, comitantibus angelis, archangelis, et omnibus cælestibus potentiis. Nunc me circumdant angeli; nunc divina in me habitat gratia. Ergo evasi officina medicinæ ægrotantibus. Ego sum fons perennis curationum: Ego remedium aduersus dæmones: Ego civitas refugii omnibus ad me confugientibus.
  responsory: |
    R. Vidi speciósam sicut colúmbam, ascendéntem désuper rivos aquárum, cujus inæstimábilis odor erat nimis in vestiméntis ejus; * Et sicut dies verni circúmdabant eam flores rosárum et lília convállium. V. Quæ est ista quæ ascéndit per desértum sicut vírgula fumi ex aromátibus myrrhæ et thuris? R. Et sicut dies verni circúmdabant eam flores rosárum et lília convállium.
  status: verified

