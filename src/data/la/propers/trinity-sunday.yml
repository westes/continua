# Matins nocturn content for Trinity Sunday (temporalId trinity-sunday,
# Duplex II classis). Sourced from Tempora/Pent01-0.txt (Latin) /
# English/Tempora/Pent01-0.txt, and the Gospel pericope's full text from
# missa/Latin+English/Tempora/Pent01-0.txt's own [Evangelium] (the
# Matins file itself only gives the incipit + "Et réliqua" for Lectio7,
# per this project's Gospel/homily-split convention).
#
# The audit found this id registered in ALWAYS_OVERRIDE_TEMPORAL_IDS,
# with a real collect/antiphons already authored, but no Matins reading.
# Nocturn 1-2 (Lectio1-6, Romans 11) left unauthored here per this
# project's convention of leaving Nocturn 1/2 scripture to the bible-plan
# store when the source itself draws Nocturn 2 from ordinary Scripture
# rather than a patristic sermon (Trinity Sunday's own [Lectio4-6] are a
# continuation of Romans, not a proper sermon on the feast).
#
# Nocturn 3: the Gospel pericope (Matt 28:18-20) authored in full
# (isGospel: true), followed by Lectio7's homily portion (incipit
# dropped) combined with Lectio8/8a as one continuous excerpt of St.
# Gregory of Nazianzus's own Treatise on the Faith. The source's own
# [Lectio9] is a distinct "Commemoratio Dominicæ" (a Gospel+homily pair
# for whichever ordinary Sunday after Pentecost Trinity Sunday displaces,
# not Trinity's own proper content) and is deliberately not carried over
# here — see ferial-commemoration-temporal-leak memory for the general
# principle this follows.
nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Matt 28:18-20
      text: 'In illo témpore: Dixit Jesus discípulis suis: Data est mihi omnis potéstas in cælo et in terra. Eúntes ergo docéte omnes gentes, baptizántes eos in nómine Patris, et Fílii, et Spíritus Sancti: docéntes eos serváre ómnia, quæcúmque mandávi vobis. Et ecce, ego vobíscum sum ómnibus diébus usque ad consummatiónem sǽculi.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Gregory of Nazianzus, Bishop, Treatise on the Faith
      text: |-
        Quis catholicórum ignórat Patrem vere esse Patrem, Fílium vere esse Fílium, et Spíritum Sanctum vere esse Spíritum Sanctum? sicut ipse Dóminus ad Apóstolos suos dicit: Eúntes baptizáte omnes gentes in nómine Patris, et Fílii, et Spíritus Sancti. Hæc est perfécta Trínitas in unitáte consístens, quam scílicet uníus substántiæ profitémur. Non enim nos secúndum córporum conditiónem, divisiónem in Deo fácimus; sed secúndum divínæ natúræ poténtiam, quæ in matéria non est, et nóminum persónas vere constáre crédimus, et unitátem divinitátis esse testámur.

        Nec extensiónem partis alicújus ex parte, ut quidam putavérunt, Dei Fílium dícimus: nec verbum sine re, velut sonum vocis, accípimus: sed tria nómina et tres persónas uníus esse esséntiæ, uníus majestátis atque poténtiæ crédimus. Et ídeo unum Deum confitémur: quia únitas majestátis, plúrium vocábulo deos próhibet appellári. Dénique Patrem et Fílium cathólice nominámus; duos autem Deos dícere, nec póssumus, nec debémus. Non quod Fílius Dei Deus non sit, immo verus Deus de Deo vero; sed quia non aliúnde, quam de ipso uno Patre, Dei Fílium nóvimus, perínde unum Deum dícimus. Hoc enim Prophétæ, hoc Apóstoli tradidérunt: hoc ipse Dóminus dócuit, cum dicit: Ego et Pater unum sumus. Unum ad unitátem divinitátis, ut dixi, refert; Sumus autem, persónis assígnat.
      responsory: |-
        R. Benedicámus Patrem et Fílium cum Sancto Spíritu: * Laudémus et superexaltémus eum in sǽcula.
        V. Benedíctus es, Dómine, in firmaménto cæli: et laudábilis et gloriósus in sǽcula.
        R. Laudémus et superexaltémus eum in sǽcula.
      status: verified
