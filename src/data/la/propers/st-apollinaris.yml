# Matins Nocturn 2-3 readings for St. Apollinaris, Bishop, Martyr (Jul
# 23) — SanctiM/07-23.txt inherits the whole day (`@Sancti/07-23`) with
# no Nocturn 2/3 override, so this saint's own vita is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-23.txt, English/Sancti/07-23.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita,
# no genuine source break.
# Nocturn 3: Lectio7's Gospel citation (Luke 22:24-30) is a bare
# incipit ("Et réliqua") with no full pericope text given, so — per
# the pre-1955 pass's convention of not transcribing bare incipits —
# only the homily portion was originally authored (not marked
# isGospel), combined with Lectio8-9 as one continuous excerpt of St.
# Ambrose's commentary. No responsory given for either reading.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before Ambrose's homily) — sourced from
# the day's own Missale [Evangelium] in
# web/www/missa/Latin/Sancti/07-23.txt (full text given there, not a
# redirect).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Apollináris cum Príncipe Apostolórum Antiochía Romam venit; a quo, ordinátus epíscopus, Ravennam ad Christi Dómini Evangélium prædicándum mittitur; ubi, cum ad Christi fidem plurimos convérteret, captus ab idolórum sacerdótibus gráviter cæsus est. Cumque ipso orante Bonifatius nobilis vir, qui diu mutus fuerat, loquerétur, ejusque fília immundo spíritu liberáta esset; íterum est in illum commóta seditio. Itaque virgis cæsus, ardéntes carbónes nudis pédibus prémere cogitur; quem cum subjéctus ignis nihil læderet, ejícitur extra urbem.

        Is vero latens aliquámdiu cum quibusdam Christiánis, inde profectus est in Æmiliam, ubi Rufini patricii filiam mortuam ad vitam revocávit; ut proptérea tota Rufini família in Jesum Christum crederet. Quare veheméntius incénsus præfectus accersit Apollinarem, et cum eo gravius agit, ut finem fáciat disseminándi in urbe Christi fidem. Cujus cum Apollináris jussa neglígeret, equuleo cruciátur; in cujus plagas aqua fervens infúnditur, saxoque os túnditur: mox férreis vinculis constrictus includitur in carcere. Quarto die impositus in navem, mittitur in exsílium; ac facto naufragio venit in Mysiam, inde ad ripam Danubii, póstea in Thraciam.

        Cum autem in Serápidis templo dæmon se responsa datúrum negaret, dum ibidem Petri Apóstoli discipulus morarétur; diu conquisítus, invéntus est Apollináris: qui íterum jubétur navigare. Ita reversus Ravennam, ab iisdem illis idolórum sacerdótibus accusatus, centurióni custodiendus tráditur; qui, cum occulte Christum cóleret, noctu Apollinarem dimísit. Re cógnita, satéllites eum persequúntur, et plagis in itinere confectum, quod mortuum crederent, relinquunt. Quem cum inde Christiáni sustulissent, septimo die exhortans illos ad fidei constantiam, martyrii glória clarus migrávit e vita. Cujus corpus prope murum urbis sepúltum est.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 22:24-30
      text: 'In illo témpore: Facta est conténtio inter discípulos, quis eórum viderétur esse major. Dixit autem eis Jesus: Reges géntium dominántur eórum; et qui potestátem habent super eos, benéfici vocántur. Vos autem non sic: sed qui major est in vobis, fiat sicut minor: et qui præcéssor est, sicut ministrátor. Nam quis major est, qui recúmbit, an qui mínistrat? nonne qui recúmbit? Ego autem in médio vestrum sum, sicut qui mínistrat. Vos autem estis, qui permansístis mecum in tentatiónibus meis: et ego dispóno vobis, sicut dispósuit mihi Pater meus regnum, ut edátis et bibátis super mensam meam in regno meo: et sedeátis super thronos, judicántes duódecim tribus Israël.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Commentary on Luke, Bk. 10 (on Luke 22:24-30)
      text: |-
        Regnum Dei non est de hoc mundo. Non ergo æqualitátis hómini ad Deum, sed similitúdinis æmulátio est. Solus enim Christus est plena imago Dei, propter expressam in se Paternæ claritúdinis unitátem. Justus autem homo ad imáginem Dei est, si propter imitandam divinæ conversatiónis similitúdinem mundum hunc Dei cognitióne contemnat, voluptatesque terrenas verbi perceptióne despíciat, quo álimur in vitam: unde et corpus Christi édimus, ut vitæ ætérnæ possímus esse participes.

        Non enim victus et potus nobis præmii loco spondétur et honoris, sed communicátio gratiæ cæléstis et vitæ. Neque duodecim throni tamquam áliqua corporalis sunt receptácula sessiónis. Sed, quia sicut secúndum divinam similitúdinem júdicat Christus cognitióne cordium, non interrogatióne factórum, virtútem remúnerans, impietatémque condemnans; ita et Apóstoli in judícium spiritale formántur remuneratióne fidei et exsecratióne perfidiæ, virtúte errórem redarguéntes, sacrílegos ódio persequéntes.

        Convertámur ígitur, et caveámus, ne in perditiónem aliqua inter nos de prælatióne possit esse contentio. Si enim contendébant Apóstoli, non excusatióni obténditur, sed cautióni propónitur. Si Petrus aliquándo convértitur, qui ad primam Dómini secutus est vocem; quis potest dicere, cito se esse conversum? Cave ergo jactantiam, cave sæculum. Ille enim confírmare jubétur fratres suos, qui dixit: Omnia dimísimus, et secúti sumus te.
      status: verified
