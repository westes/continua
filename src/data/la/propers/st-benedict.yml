# Verified against Divinum Officium (Monastic Tridentinum 1617), 2026-08.
# Pulled from the reference engine's own era-specific calendar table
# (web/www/Tabulae/Kalendaria/1570.txt + M1617.txt, own title
# "S. Benedicti Abbatis") and its own source file, not the merged per-date
# files those tables' fileref points at directly -- see TODO.md.
collect:
  text: |
    Orémus.
    Omnípotens sempitérne Deus, qui hodiérna die carnis edúctum ergástulo sanctíssimum Confessórem tuum Benedíctum sublevásti ad cælum: † concéde, quǽsumus, hæc festa tuis fámulis celebrántibus cunctórum véniam delictórum; * ut, qui exsultántibus ánimis ejus claritáti congáudent, ipso apud te interveniénte, consociéntur et méritis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (st-benedict-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-an-abbot (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-benedict-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Sanctíssime Conféssor Dómini, Monachórum pater et dux, Benedícte, intercéde pro nostra omniúmque salúte.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Omnípotens sempitérne Deus, qui hodiérna die carnis edúctum ergástulo sanctíssimum Confessórem tuum Benedíctum sublevásti ad cælum: † concéde, quǽsumus, hæc festa tuis fámulis celebrántibus cunctórum véniam delictórum; * ut, qui exsultántibus ánimis ejus claritáti congáudent, ipso apud te interveniénte, consociéntur et méritis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# St. Benedict (Transitus): proper Matins hymn, "Quidquid antiqui cecinere vates" (SanctiM/03-21.txt [Hymnus Matutinum]).
# Latin and English as rendered by the local reference engine (Monastic
# Tridentinum 1617, command=prayMatutinum, 03-21-2033); before this file the saint
# fell to the Common's Matins hymn. Four misprints in the source were corrected
# (Monàrchæ, péetas, genitáeque, Témpore).
matins-hymn:
  text: |
    Quidquid antíqui cecinére vates,
    Quidquid ætérne moniménta legis,
    Cóntinet nobis celebránda summi
    Vita Monárchæ.

    Extulit Móysen píetas benígnum,
    Inclitum proles Abraham decórat,
    Isaac sponsæ decus et sevéri
    Jussa paréntis.

    Ipse virtútum cúmulis onústus,
    Célsior nostri Patriárcha cœtus,
    Isaac, Móysen, Abraham sub uno,
    Péctore clausit.

    Ipse, quos mundi rápuit procéllis,
    Hic pius flatu státuat secúndo:
    Pax ubi nullo, requiésque gliscit
    Mixta pavóre.

    Glória Patri, genitǽque Proli,
    Et tibi, compar utriúsque semper
    Spíritus alme, Deus unus,
    omni témpore sæcli.
    Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2033-03-21 (clean year, per st-benedict.yml's own comment)
# -- also cross-checked directly against the source's own Monastic-
# specific file (SanctiM/03-21.txt), which carries a full proper office
# for his Transitus despite the plain secular Sancti file having none.
# Own real proper chapter and own hymns at both hours; Lauds responsory
# and both hours' versicle turn out byte-identical to Common-of-a-
# Confessor-Bishop's own (reused, not duplicated separately here since
# Vespers has its own distinct responsory -- see vespers-responsory-st-
# benedict.yml). No English rendering exists in the reference engine for
# this chapter or either hymn -- own translations, marked draft.
lauds-capitulum:
  text: Ecce Conféssor magnus, quasi stella matutína in médio nébulæ, et quasi luna plena, in diébus suis lucet. Et quasi sol refúlgens, sic ille effúlsit in templo Dei.
  citation: Eccli 50:6-7
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2033-03-21 -- "Inter ætérnas súperum corónas," own proper
# Sapphic hymn. No English rendering exists in the reference engine --
# own original translation, marked draft. See lauds-capitulum-st-
# benedict.yml's header.
lauds-hymn:
  text: |-
    Inter ætérnas súperum corónas,
    Quas sacro partas rétinent agóne,
    Emicas celsis méritis corúscus,
    O Benedícte!

    Sancta te compsit púerum senéctus,
    Nil sibi de te rápuit volúptas,
    Aruit mundi tibi flos, ad alta
    Mente leváto.

    Hinc fuga lapsus, pátriam, paréntes
    Déseris, fervens némorum colónus;
    Edomas carnem, subigísque Christo
    Tortor acérbus.

    Ne diu tutus látebras fovéres,
    Digna te produnt óperum piórum;
    Spárgitur felix céleri per orbem
    Fama volátu.

    Glória Patri genitǽque Proli,
    Et tibi compar utriúsque semper,
    Spíritus alme, Deus unus, omni
    Témpore sæcli. Amen.
  status: verified

