# Matins Nocturn 2 reading for St. Evaristus, Pope and Martyr (Oct 26) —
# pre-1955-but-post-1617 (no SanctiM/10-26*.txt at all).
# web/www/horas/Latin/Sancti/10-26.txt, English/Sancti/10-26.txt. Single
# lesson (simplex-feast Lectio93), no responsory in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Evarístus, Græcus, ex Judæo patre, Trajano imperatóre, pontificátum gessit. Qui ecclesiárum titulos urbis Romæ presbyteris divísit, et ordinávit ut septem diáconi episcopum custodírent dum evangelicæ prædicatiónis officio fungerétur. Idem constítuit, ex traditióne apostolica, ut matrimónium publice celebrétur et sacerdotis benedíctio adhibeátur. Præfuit Ecclésiæ annos novem, menses tres, presbyteris decem et septem, diáconis duobus, epíscopis quindecim, quater mense Decembri, ordinatis. Martyrio coronátus, prope sepúlcrum Principis Apostolórum in Vaticano sepúltus est septimo Kalendas Novembris.
      status: verified
