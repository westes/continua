# Matins Nocturn 2 reading for St. Anastasius I, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/04-27-AnastasiusIX.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Anastásius Románus fílius Máximi, Siricio vita functo, Románæ Ecclésiæ est ordinátus epíscopus; quo eam præcláre regénte, de Oriéntis pártibus hæreticórum Origenistarum sæva tempéstas simplicitatem fídei, quæ Apóstoli voce laudata est, polluere et labefactáre conata est. Sed vir ditissimæ paupertátis et apostólicæ sollicitudinis Anastásius statim nóxium perculit caput, et sibilantia hydræ ora compescuit, latitantesque in foveis suis hæréticos persecútus, suis in Occidénte lítteris damnávit, quod erat in Oriénte damnatum. Nec illi umquam cura défuit Evangélii fidem circa suos custodíre pópulos, partesque pópuli sui, per quæque spatia divérsa terrárum diffusas, quantum póterat, lítteris conveníre, ne qua profanæ interpretationis orígo subreperet, quæ devotas ánimas immissa sui caligine labefactaret.

        Ad eum, atque Venerium, Mediolanénsis ecclésiæ sacerdótem, Africana synodus epíscopum legatum destinavit, ut eídem Africanæ ecclésiæ sacris ministris máxime indigenti, subveniretur, ne in divérsis pene emortuis plebibus (in quibus nec unus quidem diáconus, vel litteratus reperiebatur) innumerábiles ánimæ perirent. Ad eosdem Africanos epíscopos epístolam misit Anastásius, patérnæ et fraternæ caritátis sollicitúdine et sinceritate eos adhortans, ut hæreticórum et schismaticorum Donatistarum insídiis et improbitatibus (quibus Africanam ecclésiam cathólicam vexábant) nullo modo dissimularent. Hujus item sancti Pontíficis auctoritáte factum est, ut Donatistæ epíscopi, seu quilibet clérici, quantum ad ecclesiástica offícia pertineret, sic in cathólicam susciperentur unitátem, quemádmodum expedire viderétur iis, quorum salúti per eórum consulebatur offícium vel exercendum, vel omittendum.

        Constítuit nullatenus transmarinum hóminem in clericatus honórem sine quinque episcopórum chirographo suscipiendum. Itémque sancívit, ut quotiescumque sancta recitarentur Evangelia, sacerdótes non sederent, sed curvi starent. Fecit in Urbe basílicam Crescentianam in regióne secúnda, via Mamertina. Duábus ordinationibus mense Decémbri, creátis presbyteris octo, diáconis quinque, epíscopis per divérsa loca decem, quiévit in pace, sepultúsque est in cœmetério suo ad Ursum Pileátum, sub Arcadio et Honório: quem (ut sanctus Hierónymus scribit) diu Roma habére non méruit, ne orbis caput sub tali Epíscopo truncaretur: imo idcírco raptus est atque translátus, ne semel latam senténtiam précibus suis fléctere conaretur; nam haud multo post ejus óbitum, Roma a Gothis capta atque diruta fuit.
      status: verified
