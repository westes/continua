# Read directly from web/www/horas/Latin/Sancti/04-27.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui ad tuéndam cathólicam fidem beátum Petrum Confessórem tuum virtúte et
    doctrína roborásti: concéde propítius; ut ejus exémplis et mónitis errántes ad
    salútem resipíscant, et fidéles in veritátis confessióne persevérent.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# No proper antiphon of his own -- standard de-Communi text, paired with the standard de-Communi commemoration versicle for common-of-a-confessor-doctor (non-Bishop, C5a -- inherits C5's own Ant2/Versum2 with no override) (not yet independently live-verified for this specific category, marked draft). Collect is the saint's own real proper (st-peter-canisius-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui ad tuéndam cathólicam fidem beátum Petrum Confessórem tuum virtúte et
    doctrína roborásti: concéde propítius; ut ejus exémplis et mónitis errántes ad
    salútem resipíscant, et fidéles in veritátis confessióne persevérent.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2-3 readings for St. Peter Canisius, Confessor,
# Doctor of the Church (Apr 27). Sourced directly from
# web/www/horas/Latin/Sancti/04-27.txt, English/Sancti/04-27.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3: Lectio7's Gospel citation (Matt 5:13-19) was a bare
# incipit ("Et réliqua"); the full pericope is now authored too
# (isGospel: true, immediately before the homily). Note on the source's
# own "on the feast of St. Martin" phrase in Lectio7's homily
# attribution: this is not a borrowed Gospel from St. Martin of Tours's
# own feast — St. Peter Canisius's Rank/Rule (`Sancti/04-27.txt`) reads
# `vide C5a` (Common of a Confessor not a Bishop), whose own
# [Evangelium] in turn reads `@Commune/C4a` (Common of a
# Confessor-Bishop/Doctor) — genuinely his own Common Gospel as a
# Doctor of the Church, not a cross-feast borrowing; "on the feast of
# St. Martin" evidently refers to the historical occasion on which St.
# Peter Canisius's own homily excerpt was originally preached, not to
# whose Mass Gospel this is. Sourced from
# `web/www/missa/Latin/Commune/C4a.txt`, English/Commune/C4a.txt
# (2026-09-05 update). The homily portion remains St. Peter Canisius's
# own homily (Lectio7's homily + Lectio8-9 combined).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Petrus Canisius, Noviomagi in Gelria eo ipso anno natus est, quo Lutherus in Germania aperta rebellione ab Ecclesia descivit, et Ignatius de Loyola, in Hispania, terrestri militia abdicata, ad prælianda prælia Domini se convertit; Deo nimirum portendente, quos ille posthac adversarios, quem sacræ militiæ ducem esset habiturus. Coloniæ Agrippinæ, quo studiorum causa concesserat, perpetuo castitatis voto se Deo obstrinxit, et paulo post Societati Jesu nomen dedit. Sacerdotio auctus, catholicam fidem contra novatorum insidias legationibus, sermonibus, scriptis libris statim defendendam suscepit. Ob præclaram sapientiam et exploratum rerum usum a Cardinali Augustano et a pontificiis Legatis magnopere expetitus, semel atque iterum concilio Tridentino interfuit; cujus étiam decreta ex auctoritate Pii quarti Pontificis maximi rite per Germaniam promulganda et in morem inducenda curavit. A Paulo quarto ad conventum Petricoviensem ire jussus, aliisque a Gregorio decimo tertio legationibus obeundis adhibitus, alacri semper et numquam fracto difficultatibus animo, gravissima, religionis negotia tractávit, ac vel inter præsentia vitæ discrimina ad felicem exitum perduxit.

        Superno caritátis igne, quem in Basilica Vaticana e penetralibus Cordis Jesu olim copiose hauserat, inflammatus, et divinæ gloriæ amplificandæ unice intentus, dici vix potest, quot per annos amplius quadraginta labores susceperit. ærumnasque pertulerit, ut complures Germaniæ civitates ac provincias vel ab hæreseos contagione defenderet, vel hæresi infectas catholicæ fidei restitueret. In Ratisbonensi et Augustano conventu imperii proceres ad jura Ecclesiæ tuenda et mores populorum emendandos excitavit: in Vormatiensi insolescentes impietatis magistros ad silentium adegit. A sancto Ignatio Germaniæ superioris provinciæ præfectus, domos et collegia multis locis condidit. Collegium Germanicum, Romæ constitutum omni ope provehere atque amplificare studuit; in academiis sacrarum humanarumque disciplinarum studia, miserandum in modum collapsa instauravit; contra Centuriatores Magdeburgenses duo volumina egregie conscripsit: et summam doctrinæ christianæ theologorum judicio et publico trium sæculorum usu ubique probatissimam, alíaque complura ad populorum institutionem valde accommodata in vulgus edidit. Quam ob rem hæreticorum malleus et alter Germaniæ apostolus appellatus, plane dignus habitus est, qui ad tutandam in Germania religionem divinitus electus putaretur.

        Inter hæc, precatione crebra et assidua rerum supernarum commentatione, lacrimis sæpe perfusus et ánimo interdum a sensibus abducto, Deo se conjungere solitus erat. A viris principibus vel sanctitate clarissimis et a quatuor summis Pontificibus magno in honore habitus, adeo de se demisse sentiebat ut se omnium minimum et diceret et haberet. Vindobonensem episcopatum semel iterum ac tertio recusavit. Moderatoribus suis obsequentissimus paratus erat ad ipsorum nutum omnia relinquere aut aggredi étiam cum valetudinis et vitæ periculo. Voluntaria sui ipsius coërcitione castitatem perpetuo sepsit. Demum Friburgi Helvetiorum, ubi plurimum pro Dei gloria et salute animarum ultimis vitæ suæ annis desudaverat, migravit ad Deum die vigesima prima Decembris anno millesimo quingentesimo nonagesimo septimo, ætatis suæ septimo supra septuagesimum. Hunc vero strenuum catholicæ veritatis propugnatorem Pius Papa nonus cælitum Beatorum honoribus adauxit; novis autem fulgentem signis Pius undecimus Pontifex maximus, anno jubilæi Sanctorum numero accensuit, simulque Doctorem universalis Ecclesiæ declaravit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 5:13-19
      text: 'In illo témpore: Dixit Jesus discípulis suis: Vos estis sal terræ. Quod si sal evanúerit, in quo saliétur? Ad níhilum valet ultra, nisi ut mittátur foras, et conculcétur ab homínibus. Vos estis lux mundi. Non potest cívitas abscóndi supra montem pósita. Neque accéndunt lucérnam, et ponunt eam sub módio, sed super candelábrum, ut lúceat ómnibus, qui in domo sunt. Sic luceat lux vestra coram homínibus, ut vídeant ópera vestra bona, et gloríficent Patrem vestrum, qui in cœlis est. Nolíte putáre, quóniam veni sólvere legem aut prophétas: non veni sólvere, sed adimplére. Amen, quippe dico vobis, donec tránseat cœlum et terra, jota unum aut unus apex non præteríbit a lege, donec ómnia fiant. Qui ergo sólverit unum de mandátis istis mínimis, et docúerit sic hómines, mínimus vocábitur in regno cœlórum: qui autem fécerit et docúerit, hic magnus vocábitur in regno cœlórum.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Peter Canisius, Notes on the Gospels, on the feast of St. Martin (on Matt 5:13-19)
      text: |-
        Amabo et colam missos a Christo Apostolos horumque successores in Evangelii semine spargendo sedulos et indefessos propagandi verbi cooperatores, qui jure testari possunt: Sic nos existimet homo ut ministros Christi et dispensatores mysteriorum Dei. Voluit enim Christus ut vigilantissimus ac fidelissimus paterfamilias per tales ministros ac legatos lucernam evangelicam igne cælitus demisso accendi et accensam non modio supponi, sed super candelabrum constitui, quæ suum splendorem longe lateque diffunderet omnesque tum Judæorum tum gentium vigentes tenebras et errores profligaret.

        Etenim evangelico Doctori sat non est, verbo lucere populo, et vocem in deserto clamantem præstare multisque in pietate juvandis lingua operam dare, ne alioquin, si verbi ministerium prætermittat, canis mutus non valens latrare a propheta dicatur. Sed et ardere illum oportet, ut opere atque caritate instructus, munus suum ornet evangelicum, Paulumque ducem sequatur. Is quippe non contentus Ephesiorum episcopo demandare: Præcipe hoc et doce: labora sicut bonus miles Christi Jesu: constanter étiam apud amicos et inimicos evangelizávit, ac episcopis apud Ephesum collectis bona dixit conscientia: Vos scitis, quomodo nihil subtraxerim utilium, quominus annuntiarem vobis, et docerem vos publice et per domos, testificans Judæis atque Gentilibus in Deum pœnitentiam et fidem in Dominum nostrum Jesum Christum.

        Talem enim pastorem decet esse in Ecclesia, qui more Pauli, omnibus omnia fiat, ut in illo reperiat æger curationem, mæstus lætitiam, desperans fiduciam, imperitus doctrinam, dubius consilium, pœnitens veniam atque solatium, et quidquid tandem ad salutem est cuique necessarium. Quocirca pulchre Christus, cum primarios mundi Ecclesiæque, doctores constituere vellet, non sat habuit discipulis dicere: Vos estis lux mundi: sed étiam illud subjecit: Non potest civitas abscondi supra montem posita, neque accendunt lucernam et ponunt eam sub modio, sed super candelabrum, ut luceat omnibus qui in domo sunt. Errant enim opinantes ecclesiastæ, quod muneri suo doctrinæ splendore magis quam vitæ integritate et caritatis ardore possint satisfacere.
      status: verified
