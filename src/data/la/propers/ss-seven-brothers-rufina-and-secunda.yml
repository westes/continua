# Matins Nocturn 2 readings for the Seven Brothers (sons of St.
# Felicity), and Ss. Rufina and Secunda, Martyrs (Jul 10) —
# SanctiM/07-10b.txt bases `@Sancti/07-10` (the whole day, no Nocturn
# 2/3 override), so this feast's own proper content is sourced from
# the Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-10.txt, English/Sancti/07-10.txt.
# Lectio4 (the seven brothers), Lectio5 (Rufina and Secunda, a
# genuinely distinct pair of martyrs), and Lectio6 (St. Augustine's
# sermon on their mother, St. Felicity) kept split. No responsory
# given in the source.
#
# Checked 2026-09-05 for a Gospel pairing: all three readings here are
# Nocturn 2 (Lectio4-6). St. Augustine's Sermon 110 is a eulogy of St.
# Felicity as a martyr-mother, not tied to any Gospel pericope -- no
# isGospel pairing applies.
#
# Update (2026-09-05, second pass): Nocturn 3 now authored too. Despite
# this saint's `common: common-of-several-martyrs`, `07-10.txt` carries
# its own proper Nocturn 3 overriding the generic "vide C3" default
# (Lectio7-9: Gospel Matt 12:46-50, "Who is my mother?", bare incipit;
# Pope St. Gregory's Homily 3 on the Gospels, Lectio7's own portion +
# Lectio8-9 combined). Gospel full text from the Missale's own
# [Evangelium], missa/Latin+English/Sancti/07-10.txt.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Septem fratres, fílii sanctæ Felicitátis, Romæ in persecutióne Marci Aurélii Antonini a Publio præfécto primum blandítiis, deínde terróribus tentati, ut Christo renuntiántes, deos veneraréntur; et, sua virtúte, et matre hortante, in fidei confessióne perseverántes, varie necáti sunt. Januarius plumbátis cæsus; Felix et Philippus fustibus contusi; Silvanus ex altíssimo loco præceps dejéctus est; Alexander, Vitalis et Martialis cápite plectúntur. Mater eórum quarto post mense eamdem martyrii palmam consecuta est: illi sexto Idus Julii spíritum Dómino reddidérunt.'
      status: verified
    - nocturn: 2
      isGospel: false
      text: 'Rufina et Secunda sorores, vírgines Romanæ, rejecto connubio Armentárii et Verini, quibus a paréntibus desponsæ fuerant, quod Jesu Christo virginitátem vovissent, Valeriáno et Gallieno imperatóribus, comprehendúntur. Quas cum nec promissis nec terróre Juníus præfectus a proposito posset abducere, Rufinam primum virgis cædi jubet; in cujus verbéribus Secunda judicem sic interpellat: Quid est, quod sorórem meam honore, me áfficis ignomínia? Jube ambas simul cædi, quæ simul Christum Deum confitemur. Quibus verbis incénsus judex imperat utramque detrudi in tenebricósum et fœtidum carcerem. Quo loco statim claríssima luce et suavíssimo odore completo, in ardénte balnei solio includúntur. Et cum inde étiam integræ evasissent, mox saxo ad collum alligato in Tiberim projectæ sunt; unde ab Angelo liberátæ, extra Urbem via Aurelia milliario décimo, cápite plectúntur. Quarum corpora, a Plautilla matrona in ejus prædio sepúlta, ac póstea in Urbem translata, in basilica Constantiniana prope baptistérium cóndita sunt.'
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 110 on Various Subjects
      text: 'Magnum spectaculum, fratres, positum est ante óculos fidei nostræ. Aure audívimus, corde vídimus optántem matrem ante se finire istam vitam fílios suos, longe contrariis votis consuetudini humanæ. Omnes enim hómines fílios suos, ex hac vita migrando, præcedere volunt, non sequi; illa autem optávit posterior mori. Non enim ammitebat fílios, sed præmittebat; nec intuebátur quam vitam finirent, sed quam inchoarent. Desinébant enim vivere, ubi quandoque fuerant morituri; et incipiébant vivere, sine fine victuri. Parum est fuísse spectatricem; miráti sumus potius hortatricem. Fœcundior virtútibus quam fœtibus: videns certántes, in quibus omnibus ipsa certabat, et in omnibus vincéntibus ipsa vincebat.'
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 12:46-50
      text: 'In illo témpore: Loquénte Jesu ad turbas, ecce, Mater ejus et fratres stabant foris, quæréntes loqui ei. Dixit autem ei quidam: Ecce, mater tua et fratres tui foris stant, quæréntes te. At ipse respóndens dicénti sibi, ait: Quæ est mater mea et qui sunt fratres mei? Et exténdens manum in discípulos suos, dixit: Ecce mater mea et fratres mei. Quicúmque enim fécerit voluntátem Patris mei, qui in cœlis est: ipse meus frater et soror et mater est.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 3 on the Gospels
      text: |-
        Sancti Evangélii, fratres caríssimi, brevis est léctio recitáta, sed magnis mysteriórum pondéribus grávida. Jesus étenim, cónditor et redémptor noster, Matrem se nosse dissímulat, et quæ ei mater sit et qui propínqui, non per cognatiónem carnis, sed per conjunctiónem spíritus designat, dicens: Quæ est mater mea, et qui sunt fratres mei? Quicúmque enim fécerit voluntátem Patris mei, qui in cælis est, ipse meus frater, et soror, et mater est. Quibus nobis verbis quid áliud innuit, nisi quod obsequéntes jussiónibus suis multos ex Gentilitáte cólligit; et Judǽam, ex cujus carne est génitus, non agnóscit?

        Sed cum is, qui voluntátem Patris fécerit, soror et frater Dómini dícitur, propter utrúmque sexum qui ad fidem collígitur, mirum non est; mirándum vero valde est, quómodo étiam mater dicátur. Fidéles enim discípulos fratres vocáre dignátus est, dicens: Ite, nuntiáte frátribus meis. Qui ergo frater Dómini fíeri ad fidem veniéndo pótuerit, quæréndum est quómodo étiam et mater esse possit.

        Sed sciéndum nobis est, quia qui Christi soror et frater est credéndo, mater effícitur prædicándo. Quasi enim parit Dóminum, quem cordi audiéntis infúderit; et mater ejus prædicándo effícitur, si per ejus vocem amor Dómini in próximi mente generátur. Ad quam rem nobis idónee confirmándam adest beáta Felícitas, cujus hódie natalícia celebrámus, quæ credéndo exstitit ancílla Christi, et prædicándo facta est mater Christi. Septem quippe fílios, sicut in gestis ejus emendatióribus légitur, sic post se tímuit vivos in carne relínquere, sicut carnáles paréntes solent metúere ne mórtuos præmíttant.
      status: verified
