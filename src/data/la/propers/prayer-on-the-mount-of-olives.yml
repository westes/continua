# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp1-2-OratioDNJC.txt (Duplex majus, Tuesday after Septuagesima). English is this project's own translation, marked draft.
lauds-hymn:
  text: |
    Venit e cœlo mediátor alto,
    Quem sacri dudum cecinore vates:
    Parce mœrori, lacrimisque amaris,
    Fília Sion.

    Áttulit mortem vetus hortus, unde
    Culpa prodivit: novus iste vitam
    Hortus en affert, ubi nocte Jesus
    Pérmanet orans.

    Vindicem placat Genitoris iram:
    Reprimit forti jacienda dextra
    Fulmina: occurrit sceleri expiando
    Sponte Redémptor.

    Sic teret duros láqueos averni,
    Et diu clausam reserabit aulam,
    Nos ad ætérni revocans beáta
    Gaudia regni.

    Laus, honor Patri, genitæque Proli,
    Cui datum nomen super omne nomen,
    Et Paracleto decus atque virtus,
    Omne per ævum.
    Amen.
  status: verified

