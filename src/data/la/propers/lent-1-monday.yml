# Matins Nocturn content for Monday of Lent week 1 — read from
# web/www/horas/{Latin,English}/Tempora/Quad1-1.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad1-1.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Augustine
# excerpt split only to fill the fixed 3-lesson slot count). Responsory1
# is a cross-reference (@Tempora/Quad1-0:Responsory1) — used here per the
# "the first one, when several collapse" convention.
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Matt 25:31-46
      text: 'In illo témpore: Dixit Jesus discípulis suis: Cum vénerit Fílius hóminis in majestáte sua, et omnes Angeli cum eo, tunc sedébit super sedem majestátis suæ: et congregabúntur ante eum omnes gentes, et separábit eos ab ínvicem, sicut pastor ségregat oves ab hædis: et státuet oves quidem a dextris suis, hædos autem a sinístris. Tunc dicet Rex his, qui a dextris ejus erunt: Veníte, benedícti Patris mei, possidéte parátum vobis regnum a constitutióne mundi. Esurívi enim, et dedístis mihi manducáre; sitívi, et dedístis mihi bíbere; hospes eram, et collegístis me; nudus, et cooperuístis me; infírmus, et visitástis me; in cárcere eram, et venístis ad me. Tunc respondébunt ei justi, dicéntes: Dómine, quando te vídimus esuriéntem, et pávimus te; sitiéntem, et dedimus tibi potum? quando autem te vídimus hóspitem, et collégimus te? aut nudum, et cooperúimus te? aut quando te vídimus infírmum, aut in cárcere, et vénimus ad te? Et respóndens Rex, dicet illis: Amen, dico vobis: quámdiu fecístis uni ex his frátribus meis mínimis, mihi fecístis. Tunc dicet et his, qui a sinístris erunt: Discédite a me, maledícti, in ignem ætérnum, qui parátus est diábolo et ángelis ejus. Esurívi enim, et non dedístis mihi manducáre; sitívi, et non dedístis mihi potum; hospes eram, et non collegístis me; nudus, et non cooperuístis me; infírmus et in cárcere, et non visitástis me. Tunc respondébunt ei et ipsi, dicéntes: Dómine, quando te vídimus esuriéntem, aut sitiéntem, aut hóspitem, aut nudum, aut infírmum, aut in cárcere, et non ministrávimus tibi? Tunc respondébit illis, dicens: Amen, dico vobis: Quámdiu non fecístis uni de minóribus his, nec mihi fecístis. Et ibunt hi in supplícium ætérnum: justi autem in vitam ætérnam.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, On Faith and Works, ch. 15
      text: |-
        Si mandátis non servátis, ad vitam veníri potest per solam fidem, quæ sine opéribus mórtua est: illud deínde quómodo verum erit, quod eis, quos ad sinístram positúrus est, dicet: Ite in ignem ætérnum, qui parátus est diábolo, et ángelis ejus: nec íncrepat, quia in eum non credidérunt; sed quia bona ópera non fecérunt? Nam profécto, ne sibi quisquam de fide, quæ sine opéribus mórtua est, promíttat ætérnam vitam; proptérea omnes gentes segregatúrum se dixit, quæ permíxtæ eisdem páscuis utebántur: ut appáreat, eos illi dictúros: Dómine, quando te vídimus illa et illa patiéntem, et non ministrávimus tibi? qui in eum credíderant, sed bona operári non curáverant, tamquam de ipsa fide mórtua ad vitam pervenirétur ætérnam.

        An forte ibunt in ignem ætérnum, qui ópera misericórdiæ non fecérunt: et non ibunt, qui aliéna rapuérunt? vel corrumpéndo in se templum Dei, in seípsos immisericórdes fuérunt: quasi ópera misericórdiæ prosint áliquid sine dilectióne, dicénte Apóstolo: Si distríbuam ómnia mea paupéribus, caritátem autem non hábeam, nihil mihi prodest? Aut díligat quisquam próximum sicut seípsum, qui non díligit seípsum? Qui enim díligit iniquitátem, odit ánimam suam.

        Neque illud dici hic póterit, in quo nonnúlli seípsos sedúcunt, ignem ætérnum dictum, non ipsam combustiónem ætérnam. Per ignem quippe, qui ætérnus erit, transitúros arbitrántur eos, quibus propter fidem mórtuam per ignem promíttunt salútem: ut vidélicet ipse ignis ætérnus sit, combústio vero eórum, hoc est, operátio ignis, non sit in eos ætérna: cum et hoc prǽvidens Dóminus senténtiam suam conclúsit ita dicens: Sic ibunt illi in combustiónem ætérnam, justi autem in vitam ætérnam. Erit ergo ætérna combústio, sicut ignis: et eos in illam itúros Véritas dicit, quorum non fidem, sed bona ópera defuísse declarávit.
      responsory: |-
        R. Ecce nunc tempus acceptábile, ecce nunc dies salútis: commendémus nosmetípsos in multa patiéntia, in jejúniis multis, * Per arma justítiæ virtútis Dei.
        V. In ómnibus exhibeámus nosmetípsos sicut Dei minístros, in multa patiéntia, in jejúniis multis.
        R. Per arma justítiæ virtútis Dei.
      status: verified
