  status: verified

# Monastic 6+6+3 per SanctiM/01-21.txt over Sancti/01-21.txt. Sancti's own
# [Ant Matutinum] is 9 proper antiphons (psalms 1/2/3/4/5/8/14/44/45).
# SanctiM interleaves 3 [AntMatutinumM] antiphons ("Christi Virgo" ;;10,
# "Jam corpus ejus" ;;45, "Stans a dextris ejus" ;;84) and re-tags the
# secular ones with the substitutions in its own [Ant Matutinum] block:
#   lines 1-5, s/5/8/ s/4/5/ s/3/4/  -> Discéde 1, Déxteram 2, Pósuit 4,
#                                       Induit 5, Mel et lac 8
#   AntMatutinumM:1                  -> Christi Virgo 10
#   lines 8-9, s/44/14/ s/45/44/     -> Christus circúmdedit 14,
#                                       Ipsi sum desponsáta 44
#   AntMatutinumM:2                  -> Jam corpus ejus 45
#   line 7, s/14/47/                 -> Cujus pulchritúdinem 47
#   AntMatutinumM:3                  -> Stans a dextris ejus 84
#   line 6, s/8/86/                  -> Ipsi soli servo fidem 86
# giving Nocturn 1 = Ps 1/2/4/5/8/10 and Nocturn 2 = Ps 14/44/45/47/84/86
# (these psalm tags are the source's own, not the generic Common-of-a-
# Virgin set). Nocturn 3 is [Ant Matutinum 3N] ("Misit Dóminus") with the
# source's `;;249;250;251` canticles, the same three Sir 39 / Isa 61-62
# canticles common-of-a-virgin-martyr.yml uses. The source has no
# [Nocturn N Versum] of its own, so the three nocturn-closing versicles
# are that Common's, unchanged. English from English/Sancti/01-21.txt and
# English/SanctiM/01-21.txt; the source's English antiphons carry no
# asterisk, so none is inserted.
matins-psalmody:
  category: common-of-a-virgin
  nocturn1:
    groups:
      - psalms:
          - 1
        antiphon: Discéde a me, * pábulum mortis, quia jam ab álio amatóre prævénta sum.
      - psalms:
          - 2
        antiphon: Déxteram meam * et collum meum cinxit lapídibus pretiósis, trádidit áuribus meis inæstimábiles margarítas.
      - psalms:
          - 4
        antiphon: Pósuit signum * in fáciem meam, ut nullum præter eum amatórem admíttam.
      - psalms:
          - 5
        antiphon: Induit me Dóminus * cýclade auro texta, et imménsis monílibus ornávit me.
      - psalms:
          - 8
        antiphon: Mel et lac * ex ejus ore suscépi, et sanguis ejus ornávit genas meas.
      - psalms:
          - 10
        antiphon: Christi Virgo * nec terróre concútitur, nec blandiméntis sedúcitur.
    versicle:
      v: Spécie tua et pulchritúdine tua.
      r: Inténde, próspere procéde, et regna.
  nocturn2:
    groups:
      - psalms:
          - 14
        antiphon: Christus circúmdedit me * vernántibus atque coruscántibus gemmis pretiósis.
      - psalms:
          - 44
        antiphon: Ipsi sum desponsáta, * cui Angeli sérviunt, cujus pulchritúdinem sol et luna mirántur.
      - psalms:
          - 45
        antiphon: Jam corpus ejus * córpori meo sociátum est, et sanguis ejus ornávit genas meas.
      - psalms:
          - 47
        antiphon: Cujus pulchritúdinem * sol et luna mirántur, ipsi soli servo fidem.
      - psalms:
          - 84
        antiphon: Stans a dextris ejus * Agnus nive candídior, Christus sibi sponsam et Mártyrem consecrávit.
      - psalms:
          - 86
        antiphon: Ipsi soli servo fidem, * ipsi me tota devotióne commítto.
    versicle:
      v: Adjuvábit eam Deus vultu suo.
      r: Deus in médio ejus, non commovébitur.
  nocturn3:
    antiphon: Misit Dóminus * Angelum suum, et liberávit me de médio ignis, et non sum æstuáta.
    canticles:
      - refs:
          - book: sir
            chapter: 39
            verses: 17-21
      - refs:
          - book: isa
            chapter: 61
            verses: 10-11
          - book: isa
            chapter: 62
            verses: 1-3
      - refs:
          - book: isa
            chapter: 62
            verses: 4-7
    versicle:
      v: Elégit eam Deus, et præelégit eam.
      r: In tabernáculo suo habitáre facit eam.

