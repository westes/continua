# Matins Nocturn 2 reading for St. Agnes, Virgin and Martyr (Jan 21) —
# SanctiM/01-21.txt inherits the whole day (`@Sancti/01-21`), overriding
# only some antiphon/versicle numbering by simple arithmetic
# substitution (renumbering, not new text) — Lectio4-6 carry through
# unchanged as this feast's own proper content, same as a pre-1955
# saint (see memory vu-matins-pre1955-saints).
# web/www/horas/Latin/Sancti/01-21.txt, English/Sancti/01-21.txt.
# Lectio4-6 (St. Ambrose's sermon on virgins, discussing Agnes) combined
# into one reading, one continuous excerpt. The source's own
# Responsory4/5/6 follow these three lessons; the last (Responsory6, the
# one with Gloria Patri that closes the nocturn's lessons) is attached to
# the combined reading, the same one-responsory-per-combined-reading
# convention the octave readings use (added 2026-10-07).
#
# Checked 2026-09-05 for a Gospel pairing: this reading (Ambrose's On
# Virgins Bk. 1, Lectio4-6) is Nocturn 2 -- a panegyric on Agnes's
# virginity and martyrdom generally, not an exegesis of any Gospel
# pericope, so no isGospel pairing applies. 01-21.txt's own [Rule]
# ("vide C6-1") has no Lectio7-9 of its own at all (Nocturn 3 inherited
# wholesale, bare, from the Common of Virgins), the same
# already-accepted "bare cross-reference, not transcribed" convention
# used elsewhere in this store (e.g. ss-cyril-and-methodius.yml) -- not
# a new finding.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Bishop of Milan, On Virgins, Bk. 1
      text: |-
        Hódie natális est Vírginis, integritátem sequámur. Natális est Mártyris, hóstias immolémus. Natális est sanctæ Agnétis, miréntur viri, non despérent párvuli, stúpeant nuptæ, imiténtur innúptæ. Sed quid dignum ea loqui póssumus, cujus ne nomen quidem vácuum laudis est? Devótio supra ætátem, virtus supra natúram: ut mihi videátur non hóminis habuísse nomen, sed oráculum Mártyris, quod indicávit, quid esset futúra. Nomen Vírginis títulus est pudóris. Appellábo Mártyrem: prædicávi satis. Prolíxa laudátio est, quæ non quǽritur, sed tenétur. Nemo est laudabílior, quam qui ab ómnibus laudári potest. Quot hómines, tot præcónes, qui Mártyrem prædícant, dum loquúntur.

        Hæc trédecim annórum martýrium fecísse tráditur. Quo detestabílior crudélitas quæ nec minúsculæ pepércit ætáti; immo magna vis fídei, quæ étiam ab illa testimónium invénit ætáte. Fuítne in illo corpúsculo vúlneri locus? Et quæ non hábuit quo ferrum recíperet, hábuit quo ferrum vínceret. Hæc inter cruéntas carníficum impávida manus, hæc stridéntium grávibus immóbilis tráctibus catenárum, nunc furéntis mucróni mílitis totum offérre corpus, mori adhuc néscia, sed paráta, vel si ad aras invíta raperétur, téndere Christo inter ignes manus, atque in ipsis sacrílegis focis trophǽum Dómini signáre victóris: nunc ferrátis colla manúsque ambas insérere néxibus. Sed nullus tam tenúia membra póterat nexus inclúdere. Novum martýrii genus! Nondum idónea pœnæ, et jam matúra victóriæ; certáre diffícilis, fácilis coronári: magistérium virtútis implévit, quæ præjudícium vehébat ætátis.

        Non sic ad thálamum nupta properáret, ut ad supplícii locum, læta succéssu, gradu festína Virgo procéssit. Flere omnes, ipsa sine fletu. Mirári pleríque, quod tam fácile vitæ suæ pródiga, quam nondum háuserat, jam quasi perfúncta donáret. Stupére univérsi, quod jam divinitátis testis exsísteret, quæ adhuc árbitra sui per ætátem esse non posset. Quanto terróre egit cárnifex ut timerétur, quantis blandítiis ut suadéret, quantórum vota, ut sibi ad núptias proveníret! At illa: Et hæc Sponsi injúria est, inquit, exspectáre placitúram. Qui me sibi prior elégit, accípiet: quid, percússor, moráris? Péreat corpus, quod amári potest óculis, quibus nolo. Stetit, orávit, cervícem infléxit. Cérneres trepidáre carníficem, quasi ipse addíctus fuísset, trémere percussóris déxteram, pallére ora aliéno timéntis perículo, cum puélla non timéret suo. Habétis ígitur in una hóstia duplex martýrium, pudóris et religiónis. Et virgo permánsit, et martýrium obtínuit.
      responsory: |-
