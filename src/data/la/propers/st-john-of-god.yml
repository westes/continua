# Read directly from web/www/horas/Latin/Sancti/03-08.txt's own [Oratio]
# and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui beátum Joánnem, tuo amóre succénsum, inter flammas innóxium incédere
    fecísti, et per eum Ecclésiam tuam nova prole fecundásti: præsta, ipsíus suffragántibus
    méritis; ut igne caritátis tuæ vítia nostra curéntur, et remédia nobis ætérna
    provéniant.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-confessor (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). st-john-of-god has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-john-of-god-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui beátum Joánnem, tuo amóre succénsum, inter flammas innóxium incédere
    fecísti, et per eum Ecclésiam tuam nova prole fecundásti: præsta, ipsíus suffragántibus
    méritis; ut igne caritátis tuæ vítia nostra curéntur, et remédia nobis ætérna
    provéniant.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2-3 readings for St. John of God, Confessor (Mar 8).
# Sourced directly from web/www/horas/Latin/Sancti/03-08.txt,
# English/Sancti/03-08.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3: Lectio7's Gospel citation (Matt 22:34-46) was a bare
# incipit ("Et réliqua"), so only the homily was authored (not marked
# isGospel), St. John Chrysostom's homily (Lectio7's homily + Lectio8-9
# combined).
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily), matching the newer
# convention set by ember-september-friday.yml/post-pentecost-16.yml.
# missa/Latin/Sancti/03-08.txt's own [Evangelium] is `@Tempora/Pent17-0`
# (17th Sunday after Pentecost) — Latin sourced from that file; English
# sourced directly from missa/English/Sancti/03-08.txt (given in full
# there, no redirect).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Joánnes de Deo, ex catholicis piisque paréntibus in oppido Montis Majoris Junióris, regni Lusitaniæ, natus, quam sublimiter in sortem Dómini fúerit eléctus, insuetus splendor super ejus domo refulgens, sonitúsque æris campani sua sponte emissus, ab ipso nativitátis témpore non obscure prænuntiárunt. A laxiori vivéndi ratióne, divina operante virtúte, revocatus, magnæ sanctitátis exhibere specimen cœpit, et ob audítam prædicatiónem verbi Dei sic ad melióra se excitátum sensit, ut jam ab ipso sanctioris vitæ rudiménto consummátum aliquid perfectumque visus sit attigisse. Bonis ómnibus in páuperes carcéribus inclusos erogatis, admirábilis pœniténtiæ suique ipsíus contemptus cuncto pópulo spectaculum factus, a plerisque, ceu demens, gráviter afflíctus, in carcerem améntibus destinátum conjícitur. At Joánnes cælésti caritate magis incénsus, gemino atque amplo valetudinario ex piórum eleemosynis in civitáte Granaténsi exstructo, jactoque novi ordinis fundaménto, Ecclésiam nova prole fœcundávit fratrum Hospitalitátis, infirmis præcláro animárum corporúmque profectu inserviéntium, et longe lateque per orbem diffusórum.

        Paupéribus ægrotis, quos propriis quandoque humeris domum deferebat, nulla re ad ánimæ corporisque salútem profícua déerit. Effusa quoque extra nosocomíum caritate indigéntibus muliéribus viduis, et præcipue virgínibus periclitántibus clam aliménta subministrabat, curamque indefessam adhibebat, ut carnis concupiscéntiam a próximis hujusmodi vítio inquinátis exterminaret. Cum autem maximum in regio Granaténsi valetudinario excitátum fuísset incendium, Joánnes impávidus prosiliit in ignem, huc illuc discurrens, quoúsque tum infirmos humeris exportatos, tum lectulos e fenestris projectos ab igne vindicávit, ac per dimidiam horam inter flammas, jam in immensum succrescéntes, versatus, exínde divínitus incólumis, univérsis civibus admirántibus exívit; in schola caritátis édocens, segniórem in eum fuísse ignem qui foris ússerat, quam qui intus accenderat.

        Multiplici asperitátum genere, demissíssima obediéntia, extrema paupertáte, orándi studio, rerum divinárum contemplatióne, ac in beátam Vírginem pietáte mirifice excelluit, et lacrimárum dono enituit. Denique gravi morbo correptus, ómnibus Ecclésiæ sacramentis rite sancteque refectus, viribus licet destitútus, propriis indútus vestibus, e léctulo surgens ac provolutus in genua, manu et corde Christum Dóminum e cruce pendentem perstringens, octavo Idus Martii anno millesimo quingentésimo quinquagesimo obiit in osculo Dómini; quem étiam mórtuus ténuit, nec dimísit, et in eádem corporis constitutióne sex circiter horas, quoúsque inde dimotus fuísset, tota civitáte inspectante, mirabíliter permansit, odórem mire fragrántem diffúndens. Quem ante et post óbitum plurimis miraculis clarum, Alexander octavus Pontifex maximus in Sanctórum númerum rétulit; et Leo décimus tertius, ex Sacrórum catholici orbis antístitum voto ac Rituum Congregatiónis consulto, cælestem ómnium hospitalium et infirmórum ubíque degéntium patronum declarávit, ipsiúsque nomen in agonizántium litaníis invocari præcepit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 22:34-46
      text: 'In illo témpore: Accessérunt ad Jesum pharisǽi: et interrogávit eum unus ex eis legis doctor, tentans eum: Magíster, quod est mandátum magnum in lege? Ait illi Jesus: Díliges Dóminum, Deum tuum, ex toto corde tuo et in tota ánima tua et in tota mente tua. Hoc est máximum et primum mandátum. Secúndum autem símile est huic: Díliges próximum tuum sicut teípsum. In his duóbus mandátis univérsa lex pendet et prophétæ. Congregátis autem pharisǽis, interrogávit eos Jesus, dicens: Quid vobis vidétur de Christo? cujus fílius est? Dicunt ei: David. Ait illis: Quómodo ergo David in spíritu vocat eum Dóminum, dicens: Dixit Dóminus Dómino meo, sede a dextris meis, donec ponam inimícos tuos scabéllum pedum tuórum? Si ergo David vocat eum Dóminum, quómodo fílius ejus est? Et nemo poterat ei respóndere verbum: neque ausus fuit quisquam ex illa die eum ámplius interrogáre.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. John Chrysostom, Homily 72 on Matthew (on Matt 22:34-46)
      text: |-
        Sadducæis confúsis, pharisæi rursus aggrediúntur; cumque quiéscere oporteret, decertare voluérunt: et legis perítiam profitentem præmittunt, non discere, sed tentare cupiéntes; ac ita intérrogant: Quodnam primum mandátum in lege sit. Nam cum primum illud sit, Diliges Dóminum Deum tuum: putántes causas sibi allatúrum ad mandátum hoc corrigéndum, aliquid addendo, quóniam Deum se faciebat, hoc modo intérrogant. Quid ígitur Christus? Ut ostendat idcirco ad hæc eos devenisse, quia nulla in eis esset caritas, sed invidiæ livore tabéscerent: Diliges, inquit, Dóminum Deum tuum: hoc primum et magnum mandátum est. Secúndum autem simile huic: Diliges próximum tuum sicut teípsum.

        Quam ob rem simile est huic? Quóniam hoc illud inducit, et ab illo rursus munítur. Quicúmque enim male agit, ódio habet lucem, et non venit ad lucem. Et rursus: Dixit insípiens in corde suo, Non est Deus. Deínde sequitur: Corrúpti sunt, et abominábiles facti sunt in stúdiis suis. Et íterum: Radix ómnium malórum avarítia est; quam quidam appeténtes, erravérunt a fide. Et, Qui díligit me, mandáta mea servábit: quorum caput et radix est: Diliges Dóminum Deum tuum, et próximum tuum sicut teípsum.

        Si ergo diligere Deum, diligere proximum est (nam si diligis me, o Petre, inquit, pasce oves meas): si étiam dilectio proximi facit ut mandata custodias: merito ait in his totam legem et prophetas pendere. Et quemadmodum in superioribus, cum de resurrectione interrogaretur, plus docuit quam tentantes petebant: sic in hoc loco de primo interrogatus mandato, secundum étiam non valde quam primum inferius, sponte attulit: secundum enim est primo simile. Ita occulte insinuavit, odio illos ad quærendum incitari. Caritas enim, inquit, non gemulatur.
      status: verified
