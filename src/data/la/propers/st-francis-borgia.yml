# Read directly from web/www/horas/Latin/Sancti/10-10.txt's own
# [Oratio] and its English counterpart. Doxology "$Qui vivis" spelled
# out per the convention in st-bibiana-collect.yml.
collect:
  text: |
    Orémus.
    Dómine Jesu Christe, veræ humilitátis et exémplar et prǽmium: quǽsumus;
    ut, sicut beátum Francíscum in terréni honóris contémptu imitatórem
    tui gloriósum effecísti, ita nos ejúsdem imitatiónis et glóriæ
    tríbuas esse consórtes.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-confessor (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). st-francis-borgia has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-francis-borgia-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Dómine Jesu Christe, veræ humilitátis et exémplar et prǽmium: quǽsumus;
    ut, sicut beátum Francíscum in terréni honóris contémptu imitatórem
    tui gloriósum effecísti, ita nos ejúsdem imitatiónis et glóriæ
    tríbuas esse consórtes.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. Francis Borgia, Confessor (Oct 10).
# Sourced directly from web/www/horas/Latin/Sancti/10-10.txt,
# English/Sancti/10-10.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 own content (a direct
# `@Commune/C1:LectioN` cross-reference) -- not transcribed, per the
# bare-cross-reference convention.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Franciscus, Gandiæ dux quartus, Joánne Borgia et Joánna Aragónia Ferdinándi Catholici nepte génitus, post puerílem ætátem inter domesticos mira innocéntia et pietáte transactam, in aula primum Cároli quinti Cæsaris, mox in Catalauniæ administratióne, admirabílior fuit christianæ virtútis et vitæ austerioris exemplis. Ad Granatense sepúlcrum Isabellam imperatricem cum detulísset, in ejus vultu, fœde commutato, mortalium ómnium caducitátem rélegens, voto se adstrinxit, rebus ómnibus, cum primum licéret, abjectis, regum Regi unice inserviéndi. Inde tantum virtútis increméntum fecit, ut, inter negotiórum turbas, religiosæ perfectiónis simillimam imáginem réferens, miraculum príncipum appellarétur.

        Mortua Eleonora de Castro cónjuge ingréssus est societátem Jesu, ut in ea latéret securius et præcluderet dignitátibus áditum, interposita voti religióne; dignus, quem et viri príncipes complures in amplecténdo severiori instituto fúerint secuti, et Cárolus quintus ipse in abdicando imperio hortatórem sibi aut ducem exstitisse non diffiterétur. In eo arctioris vitæ studio Franciscus jejuniis, catenis férreis, asperrimo cilício, cruentis longisque verberatiónibus, somno brevíssimo, corpus ad extremam usque maciem redégit, nullis præterea parcens labóribus ad sui victoriam et ad salútem animárum. Tot ítaque instructus virtútibus, a sancto Ignátio primum generalis commissarius in Hispaniis, nec multo post præpositus generalis tertius a societáte universa, licet invítus, elígitur. Quo in munere princípibus ac summis Pontificibus prudéntia ac morum sanctitáte apprime carus, præter complura vel cóndita vel aucta ubíque domicília, socios in regnum Poloniæ, in insulas Oceani, in Mexicanam et Peruánam provincias invéxit; missis quoque in alias regiónes apostolicis viris, qui prædicatióne, sudóribus, sánguine fidem catholicam Romanam propagarunt.

        De se ita demisse sentiebat, ut peccatóris nomen sibi proprium fáceret. Romanam purpuram, a summis Pontificibus sæpius oblatam, invicta humilitátis constántia recusávit. Vérrere sordes, emendicáre victum ostiatim, ægris ministrare in nosocomíis, mundi ac sui contemptor, in deliciis hábuit. Singulis diébus multas continenter horas, frequenter octo, quandoque decem, dabat cæléstium contemplatióni. Centies quotídie de genu Deum adorábat. Numquam a sacrificando abstinuit, prodebatque sese divinus quo æstuábat ardor, ejus vultu, sacram Hostiam offeréntis aut concionántis, intérdum radiante. Sanctíssimum Christi corpus in Eucharistia latens ubi asservarétur, instinctu cælésti sentiebat. Cardinali Alexandrino, ad conjungendos contra Turcas, christiános príncipes, legato comes additus a beato Pio quinto, arduum iter, fractis jam pene viribus, suscépit ex obediéntia; in qua et vitæ cursum Romæ, ut optarat, feliciter consummávit, anno ætátis suæ sexagesimo secundo, salútis vero millesimo quingentésimo septuagesimo secundo.
      status: verified
