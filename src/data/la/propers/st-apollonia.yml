# Matins Nocturn 2 reading for St. Apollonia, Virgin and Martyr (Feb 9) —
# pre-1955-but-post-1617. Plain Sancti/02-09.txt is a different, later
# saint (St. Cyril of Alexandria, added as a Doctor in 1882) who
# displaced Apollonia on the general calendar's own Feb 9 slot; her
# content survives at the suffixed sibling file (see memory
# vu-matins-pre1955-saints's "critical wrinkle").
# web/www/horas/Latin/Sancti/02-09o.txt, English/Sancti/02-09o.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Apollónia virgo Alexandrína, sub Décio imperatóre, cum ingravescénte jam ætáte ad idóla sisterétur, ut eis veneratiónem adhibéret; illis contémptis, Jesum Christum verum Deum coléndum esse prædicábat. Quam ob rem omnes ei contúsi sunt et evúlsi dentes; ac, nisi Christum detestáta deos cóleret, accénso rogo combustúros vivam mináti sunt ímpii carnífices. Quibus illa, se quamvis mortem pro Jesu Christi fide subitúram, respóndit. Itaque comprehénsa ut comburerétur, cum paulísper, quasi delíberans quid agéndum esset, stetísset, ex illórum mánibus elápsa, álacris in ignem sibi parátum, majóri Spíritus Sancti flamma intus accénsa, se injécit. Unde brevi, consúmpto córpore, puríssimus spíritus in cælum ad sempitérnam martyrii corónam evolávit.
      status: verified
