# Matins Nocturn 2-3 readings for Ss. Nereus, Achilleus, and Domitilla,
# Virgin, and Pancras, Martyrs (May 12) — SanctiM/05-12.txt inherits
# the whole day (`@Sancti/05-12`) with no Nocturn 2/3 override, so this
# feast's own proper content is sourced from the Tridentine track
# exactly as for a pre-1955 saint (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/05-12.txt, English/Sancti/05-12.txt.
#
# Nocturn 2: Lectio4 (Nereus and Achilleus, brothers, kept together),
# Lectio5 (Domitilla, a genuinely distinct martyr), and Lectio6
# (Pancras, likewise distinct) kept split.
# Nocturn 3: Lectio7's Gospel citation (John 4:46-53) is a bare incipit
# ("Et réliqua") with no full pericope text given, so — per the
# pre-1955 pass's convention of not transcribing bare incipits — only
# the homily portion was originally authored (not marked isGospel),
# combined with Lectio8-9 as one continuous excerpt of Pope St.
# Gregory the Great's sermon. No responsory given for either.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before Gregory's homily) — the day's own
# Missale [Evangelium] in web/www/missa/Latin/Sancti/05-12.txt is a
# redirect (`@Tempora/Pent20-0`) to the 20th Sunday after Pentecost's
# own Gospel, sourced from there.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Nereus et Achilleus fratres eunuchi Flaviæ Domitillæ, a beato Petro una cum ipsa ejusque matre Plautilla baptizati, cum Domitillæ persuasissent, ut virginitátem suam Deo consecraret, ab ejus sponso Aureliáno tamquam Christiáni accusati, ob præcláram fidei confessiónem in Pontiam insulam relegántur. Ubi ad quæstiónem íterum vocáti et verbéribus cæsi, mox Tarracinam perducti, a Minucio Rufo equuleo et flammis cruciati, cum constanter negarent se, a sancto Petro Apóstolo baptizatos, ullis tormentis cogi posse ut idolis immolarent, secúri percússi sunt. Quorum córpora ab Auspicio, eórum discipulo et Domitillæ educatore, Romam delata, via Ardeatina sepúlta sunt.
      status: verified
    - nocturn: 2
      isGospel: false
      text: 'Flavia Domitilla virgo Romana, Titi et Domitiáni imperatórum neptis, cum sacrum virginitátis velámen a beato Cleménte Papa accepísset, ab Aureliáno sponso, Titi Aurelii consulis fílio, deláta quod Christiana esset, a Domitiáno imperatóre in insulam Pontiam est deportata, ubi in carcere longum martyrium duxit. Demum Tarracinam deducta, íterum Christum confessa, cum semper constantior apparéret, sub Trajano imperatóre, júdicis jussu incénso ejus cubiculo, una cum Theodora et Euphrosyna virgínibus et collactaneis suis, gloriosi martyrii cursum confecit, Nonis Maji: quarum corpora, integra invénta, a Cæsario diacono sepúlta sunt.'
      status: verified
    - nocturn: 2
      isGospel: false
      text: Pancratius, in Phrygia nobili genere natus, puer quatuordecim annórum Romam venit Diocletiáno et Maximiáno imperatóribus. Ubi a Pontifice Romano baptizátus et in fide christiana eruditus, ob eamdem paulo post comprehénsus; cum diis sacrificáre constanter renuísset, virili fortitúdine datis cervicibus, illustrem martyrii corónam consecutus est. Cujus corpus Octavilla matrona noctu sústulit, et unguentis delibutum via Aurelia sepelívit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joannes 4:46-53
      text: 'In illo témpore: Erat quidam régulus, cujus fílius infirmabátur Caphárnaum. Hic cum audísset, quia Jesus adveníret a Judǽa in Galilǽam, ábiit ad eum, et rogábat eum, ut descénderet et sanáret fílium ejus: incipiébat enim mori. Dixit ergo Jesus ad eum: Nisi signa et prodígia vidéritis, non créditis. Dicit ad eum régulus: Dómine, descénde, priúsquam moriátur fílius meus. Dicit ei Jesus: Vade, fílius tuus vivit. Crédidit homo sermóni, quem dixit ei Jesus, et ibat. Jam autem eo descendénte, servi occurrérunt ei et nuntiavérunt, dicéntes, quia fílius ejus víveret. Interrogábat ergo horam ab eis, in qua mélius habúerit. Et dixérunt ei: Quia heri hora séptima relíquit eum febris. Cognóvit ergo pater, quia illa hora erat, in qua dixit ei Jesus: Fílius tuus vivit: et crédidit ipse et domus ejus tota.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 28 (preached in the Basilica of these Martyrs on their feast day, on John 4:46-53)
      text: |-
        Quid est quod regulus Dominum rogat ut ad ejus filium veniat, et tamen ire corporaliter recusat: ad servum vero centurionis non invitatur, et tamen se corporaliter ire pollicetur? Reguli filio per corporalem præsentiam non dignatur adesse, centurionis servo non dedignatur occurrere. Quid est hoc, nisi quod superbia nostra retunditur, qui in hominibus non naturam, qua ad imaginem Dei facti sunt, sed honores et divitias veneramur? Redemptor vero noster ut ostenderet, quia quæ alta sunt hominum, despicienda sunt, et quæ despecta sunt hominum, despicienda non sunt: ad filium reguli ire noluit, ad servum centurionis ire paratus fuit.

        Increpata est ergo superbia nostra, quæ nescit pensare homines propter homines. Sola, ut diximus, quæ circumstant hominibus, pensat, naturam non aspicit, honorem Dei in hominibus non agnoscit. Ecce ire non vult Filius Dei ad filium reguli: et tamen venire paratus est ad salutem servi. Certe si nos cujuspiam servus rogaret, ut ad eum ire deberemus, protinus nobis nostra superbia in cogitatione tacita responderet, dicens: Non eas, quia temetipsum degeneras, honor tuus despicitur, locus vilescit. Ecce de cælo venit, qui servo in terra occurrere non despicit: et tamen humiliari in terra contemnimus, qui de terra sumus.

        Nolite ergo intra vosmetipsos pensare quod habetis, sed quid estis. Ecce mundus qui diligitur, fugit. Sancti isti, ad quorum tumbam consistimus, florentem mundum mentis despectu calcaverunt. Erat tunc vita longa, salus continua, opulentia in rebus, fœcunditas in propagine, tranquillitas in diuturna pace: et tamen cum in seipso floreret, jam in eorum cordibus mundus aruerat. Ecce jam mundus in seipso aruit, et adhuc in cordibus nostris floret. Ubique mors, ubique luctus, ubique desolatio: undique percutimur, undique amaritudinibus replemur: et tamen cæca mente carnalis concupiscentiæ ipsas ejus amaritudines amamus, fugientem sequimur, labenti inhæremus.
      status: verified
