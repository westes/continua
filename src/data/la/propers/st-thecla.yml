# Verified against Divinum Officium (Monastic Tridentinum 1617), 2026-08.
# Pulled from the reference engine's own era-specific calendar table
# (web/www/Tabulae/Kalendaria/1570.txt + M1617.txt, own title
# "S. Theclae Virgini et Martyri") and its own source file, not the merged per-date
# files those tables' fileref points at directly -- see TODO.md.
collect:
  text: |
    Orémus.
    Da, quǽsumus, omnípotens Deus: ut, qui beátæ Theclæ Vírginis et Mártyris tuæ natalícia cólimus; et ánnua solemnitáte lætémur, et tantæ fídei proficiámus exémplo.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-virgin-martyr (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). st-thecla has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is the saint's own
# real proper (st-thecla-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Símile est regnum cælórum * hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Da, quǽsumus, omnípotens Deus: ut, qui beátæ Theclæ Vírginis et Mártyris tuæ natalícia cólimus; et ánnua solemnitáte lætémur, et tantæ fídei proficiámus exémplo.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Matins Nocturn 2 reading for St. Thecla, Virgin, Martyr (Sep 23,
# sharing the date with St. Linus — see st-linus.yml). No genuine
# SanctiM match: the only SanctiM file for this date bases
# `@Sancti/09-23` (Linus, not Thecla) — a missed pre-1955-pool
# candidate rather than a genuine SanctiM case (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/09-23cc.txt, English/Sancti/09-23cc.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Thecla virgo, ex illustribus paréntibus Iconii nata, a Paulo Apóstolo fidei præceptis instituta, miris sanctórum Patrum laudibus celebrátur. Quæ décimum octavum annum agens, Thamíride sponso relícto, cum eam paréntes, quod Christiana esset, accusassent, in ardentem rogum, qui, nisi Christo renuntiáret, ei parátus erat, prius signo crucis armata, seipsam injecit. Sed igne, plúvia quæ repénte exorta est, exstincto, Antiochíam venit; ubi, feris objecta et tauris in diversa incitátis alligata, mox conjecta in fossam plenam serpéntibus, ex ómnibus Jesu Christi grátia liberátur. Cujus ardore fidei et vitæ sanctitáte multi ad Christum convérsi sunt. Iterum in pátriam rédiens, in montem sola secessit. Deínde, multis virtútibus et miraculis insígnis, nonagenaria migrávit ad Dóminum, ac Seleucíæ sepúlta est.
      status: verified
