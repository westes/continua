# Matins Nocturn 2 reading for St. Gregory II, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/02-13-GregoriusII.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Gregórius, hujus nóminis secúndus, natióne Románus, patre Marcéllo, anno Christi septingentésimo décimo quarto, mirábili totíus cleri et pópuli concórdia, ad suprémum Ecclésiæ cathólicæ pontificátum evéctus est. Hic a puerítia divíno cúltui addíctus in Lateranénsi patriarchio, sub beáti Sergii óculis et disciplína vixerat, subdiáconi primum, tum sacellarii múnere functus. Mox bibliothecæ cura illi credita ad diaconátus tandem órdinem promótus, in regiam urbem, una cum sanctíssimo Papa Constantíno proféctus est. Ibi ab imperatóre de nonnúllis capítibus interrogátus, cum sacrárum litterárum peritissimus esset, et constantissimus rerum ecclesiasticarum defensor, optima et cathólica responsione principi satisfécit.

        Urbis mœnia contra Longobardórum excursiones áliqua ex parte reparavit. Áliquot basílicas témporum injúria collapsas restítuit. Urbana monastéria fere desérta, et monachos in prístinam formam et disciplínam redégit. Imo post mortem Honéstæ matris, paternam domum in ecclésiam et monastérium commutavit, quod multis prædiis instrúctum relíquit. Corbinianum et Bonifacium, viros apostólico spíritu plenos, in Germániam misit, ad prædicándum Gentilibus Christi Evangélium, eósque sacris episcopátus infulis decorávit, postquam innumeram paganórum multitúdinem ab iis ad Christi fidem conversam fuísse accepísset. Ut omnes óptimi pastóris partes impleret, optimis légibus ecclesiásticam disciplínam et Christianórum mores instruxit. Geminam synodum Romæ hábuit, álteram advérsus illicita conjugia, álteram advérsus Iconoclastas.

        Leónem Isaurum, sacrárum imaginum destructorem, váriis epístolis ab illa hærési removére, omníque illum officiorum génere sibi demereri stúduit; cum tamen hic ad scéleris cúmulum, optimum Pontíficem neci tradere ferro sexies, semel auro et munéribus corrúmpere, quamvis frustra, tentásset. Luitprando, cum exarcho ad excidium Urbis properanti, sanctíssimus Póntifex, Dei fretus præsídio, ad prata Nerónis occurrit, et piis mónitis regis ánimum ita mollivit, ut non jam hostis, sed pius adorator ensem et corónam Principi Apostolórum obtulerit. Cum autem imperátor destructionem machinaretur, eúmdem diro anathemate perculit, et inito cum Francis fœdere, ab ímpio molimine detérruit. Rebus demum præcláre gestis, quibus máximis quibúsque prædecessorum suórum æquiparatur, pie óbiit in Dómino, sexto Pontificátus anno, et in basílica Vaticána cónditus est.
      status: verified
