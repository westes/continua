# Matins Nocturn 2 for "5th Sunday of October" (Tempora/105-0.txt) — see
# month-week-081.yml's header for the id scheme. Responsory reuses 101's
# own Responsory4 (source's own cross-reference).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Gregory Nazianzen, Sermon 20, On the Maccabees
      text: |-
        Eleázarus primítiæ eórum qui hic ante Christum sunt passi, quemádmodum post Christum Stéphanus. Is vir et sacérdos et senex, canus capíllis, canus et prudéntia, prius quidem pro pópulo sacrificábat et orábat: nunc autem semetípsum hóstiam óbtulit Deo perfectíssimam ad totíus pópuli expiatiónem, faustum certáminis inítium, ad quod loquens páriter ac tacens cohortabátur. Obtúlit autem et fílios septem, suæ frúctus disciplínæ, hóstiam vivéntem, sanctam, beneplácitam Deo, omni legáli sacrifício splendídiorem et puríorem: quæ sunt enim filiórum, ad patrem referri, æquíssimum ac justíssimum est.

        Ibi tum generósi et magnánimi púeri, generósæ matris nóbilis proles, gloriósi veritátis propugnatóres, Antíochi tempóribus excelsióres, veri Mosáicæ legis discípuli, paternórum rítuum observantíssimi, númerus apud Hebrǽos laudábilis, et propter septenáriæ quiétis mystérium venerábilis, unum spirántes, unum spectántes, unum illud ad vitam iter agnoscéntes, ut mortem Dei causa suscíperent: non minus ánimis fratres quam corpóribus, inter se mútuæ mortis ǽmuli: o rem admirándam! torménta quasi thesáuros præripiéntes, pro magístra lege perícula subeúntes, quæ non magis illáta formidábant, quam relícta requirébant, unum illud veríti, ne týrannus a pœnis desísteret, ne quis ipsórum sine corónæ prǽmio discéderet, ne invíti fratres alii ab alio sejungeréntur, et ne, in eo discrímine cruciátibus erépti, mala victória superárent.

        Erat ibi fortis et generósa mater, puerórum simul ac Dei amans, cujus matérna víscera supra natúræ consuetúdinem dilaniabántur. Non enim filiórum, qui in torméntis erant, miserebátur, sed timóre angebátur, ne non ea suscíperent: neque magis eos, qui e vita migráverant, desiderábat, quam precabátur, ut relíqui cum illis conjungeréntur: de quibus fíliis magis quam de mórtuis erat sollícita. Horum enim dúbium erat certámen, at illórum secúrus vitæ éxitus: atque illos quidem jam Deo adjúnxerat; de his vero, quómodo eos Deus susciperet, laborábat. O virílem ánimum in córpore muliébri! o admirábile magni ánimi increméntum!
      responsory: |-
        R. Impetum inimicórum ne timuéritis: mémores estóte, quómodo salvi facti sunt patres nostri: * Et nunc clamémus in cælum et miserébitur nostri Deus noster.
        V. Mementóte mirabílium ejus, quæ fecit pharaóni et exercítui ejus in Mari Rubro.
        R. Et nunc clamémus in cælum et miserébitur nostri Deus noster.
      status: verified
