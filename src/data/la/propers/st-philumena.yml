# Matins Nocturn 2 reading for St. Philumena, Virgin and Martyr (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/09-06-Philumena.txt, [Lectio4], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Inter cétera Mártyrum sepulchra, quæ in cœmetério Priscíllæ ad viam Salariam reperiri solent, illud éxstitit quo repósitum fúerat sanctæ Philumenæ corpus, uti ex tumuli inscriptione tribus laterculis apposita perlegebatur. Licet vero invénta ibídem fúerit phiala sánguinis, et ália insculpta conspicerentur martyrii insígnia, doléndum tamen est, res ab eádem gestas, actaque ac genus martyrii quod ipsa fecit, obscúra perstitisse. Ceterum ubi primum sacrum hoc corpus, ex beneficéntia Pii séptimi inítio pontificátus ejus accéptum, cúltui fidélis pópuli propósitum fuit Mugnani in Nolana diœcési, ingens íllico famæ celebritas ac religio erga sanctam Mártyrem percrebuit, præsértim ob signa, quæ ejúsdem præsídio accessisse undique ferebátur. Hinc factum est ut complurium antístitum, cultorumque Mártyris postulationibus permótus Gregórius décimus sextus Póntifex Máximus, univérsa rei ratióne matúre perpensa, festum ejúsdem cum Offício et Missa in memorata Nolana diœcési et álibi agendum benigne permiserit.
      status: verified
