# Matins Nocturn 2 reading for St. Mark, Evangelist (Apr 25) —
# SanctiM/04-25.txt's Lectio5-6 resolve back to `@Sancti/04-25:Lectio4-5`
# (its other lessons fall back to Common of an Evangelist), so this
# saint's own proper content is sourced from the Tridentine track
# exactly as for a pre-1955 saint (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/04-25.txt, English/Sancti/04-25.txt.
# Lectio4-5 combined into one reading, one continuous excerpt from St.
# Jerome. No responsory given in the source.
#
# Verified 2026-09-05 (Gospel-pairing sweep): horas/Latin/Sancti/04-25.txt
# has Lectio6 as a bare `@Commune/C1a:Lectio4` cross-reference and no
# Lectio7-9 at all -- Nocturn 3 falls through entirely to Common of an
# Evangelist (C1a)'s own generic content, already handled by this
# store's per-Common-category pool. No proper Gospel of Mark's own to
# pair here (same situation as st-luke.yml).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Jerome, Priest, On Illustrious Men, ch. 8
      text: |-
        Marcus, discípulus et intérpres Petri, juxta quod Petrum referéntem audíerat, rogátus Romæ a frátribus, breve scripsit Evangélium. Quod cum Petrus audísset, et probávit, et Ecclésiæ legéndum sua auctoritáte dedit. Assúmpto ítaque Evangélio quod ipse confécerat, perréxit in Ægýptum, et primus Alexandríæ Christum annúntians, constítuit ecclésiam tanta doctrína et vitæ continéntia, ut omnes sectatóres Christi ad exémplum sui cógeret.

        Dénique Philo, disertíssimus Judæórum, videns Alexandríæ primam ecclésiam adhuc judaizántem, quasi in laudem gentis suæ, librum super eórum conversatióne scripsit. Et quómodo Lucas narrat Jerosólymæ credéntes ómnia habuísse commúnia: sic et ille, quod Alexandríæ sub Marco fíeri doctóre cernébat, memóriæ trádidit. Mórtuus est autem octávo Nerónis anno, et sepúltus Alexandríæ, succedénte sibi Aniáno.
      status: verified
