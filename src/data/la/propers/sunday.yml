# Nocturn 2-3, Sunday within the Octave of the Ascension (temporalId
# sunday-after-ascension). Sourced from Tempora/Pasc6-0.txt (Latin) /
# English/Tempora/Pasc6-0.txt. See advent-1.yml/easter-octave.yml for the
# general sweep method.
#
# Real structural note: this Sunday's own source file carries no
# [ResponsoryN] tags at all except Responsory8 - its own [Rank]/[Rule]
# say "ex Tempora/Pasc5-4" (Ascension Thursday itself), meaning the whole
# office, responsories included, is inherited from that day rather than
# proper to this Sunday. Resolved (not left as a cross-reference) by
# pulling the representative responsories directly from Pasc5-4.txt, the
# same pattern already used for cross-referenced responsories throughout
# this sweep.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from St. Augustine's 2nd
# Sermon on the Ascension (Sermon 175 "de Tempore") - Lectio6 itself has
# two source variants gated by a later rubric (`rubrica 1570` appends a
# short additional sentence); the fuller, pre-1570 Monastic-track text
# (both parts together) is used here per this project's standing
# preference for the older/fuller reading. Responsory: borrowed from
# Ascension Thursday's own Responsory4 ("Tempus est, ut revértar ad
# eum").
#
# Nocturn 3 (Lectio7-9): Lectio7 carries real homily prose after its bare
# Gospel incipit (John 15:26-27, 16:1-4, "Et réliqua") - St. Augustine's
# Tractate 92 on John begins within Lectio7 itself, same pattern used
# throughout this sweep. Combined Lectio7's homily portion (incipit
# dropped) with Lectio8-9, using a responsory borrowed from Ascension
# Thursday's own Responsory7 ("Ego rogábo Patrem") rather than this file's
# own Responsory8 (proper to Lectio8 alone, not the combined reading).
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings/~-after-ascension:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 175, on the Ascension
      text: |-
        Salvátor noster, dilectíssimi fratres, ascéndit in cælum: non ergo turbémur in terra. Ibi sit mens, et hic erit réquies. Ascendámus cum Christo ínterim corde: cum dies ejus promíssus advénerit, sequémur et córpore. Scire tamen debémus, fratres, quia cum Christo non ascéndit supérbia, non avarítia, non luxúria: nullum vítium nostrum ascéndit cum médico nostro. Et ídeo si post médicum desiderámus ascéndere, debémus vítia et peccáta depónere. Omnes enim quasi quibúsdam compédibus nos premunt, et peccatórum nos rétibus ligáre conténdunt: et ídeo cum Dei adjutório, secúndum quod ait Psalmísta: Dirumpámus víncula eórum: ut secúri possímus dícere Dómino: Dirupísti víncula mea, tibi sacrificábo hóstiam laudis.

        Resurréctio Dómini spes nostra est: ascénsio Dómini glorificátio nostra est. Ascensiónis hódie solémnia celebrámus. Si ergo recte, si fidéliter, si devóte, si sancte, si pie ascensiónem Dómini celebrámus, ascendámus cum illo, et sursum corda habeámus. Ascendéntes autem non extollámur, nec de nostris, quasi de própriis méritis præsumámus. Sursum autem corda habére debémus ad Dóminum. Sursum enim cor non ad Dóminum, supérbia vocátur: sursum autem cor ad Dóminum, refúgium vocátur. Vidéte, fratres, magnum miráculum. Altus est Deus: érigis te, et fugit a te: humílias te, et descéndit ad te. Quare hoc? Quia excélsus est, et humília réspicit, et alta de longe cognóscit. Humília de próximo réspicit, ut attóllat: alta, id est, supérba, de longe cognóscit, ut déprimat.

        Resurréxit enim Christus, ut spem nobis daret, quia surgit homo, qui móritur: ne moriéndo desperarémus, et vitam nostram in morte finítam putarémus, secúros nos fecit. Sollíciti enim erámus de ipsa ánima: et ille nobis resurgéndo, de carnis resurrectióne fidúciam dedit. Crede ergo, ut mundéris. Prius te opórtet crédere, ut póstea per fidem Deum mereáris aspícere. Deum enim vidére vis? Audi ipsum: Beáti mundo corde: quóniam ipsi Deum vidébunt. Prius ergo cógita de corde mundándo: quidquid ibi vides, quod dísplicet Deo, tolle. Veníre ad te vult Deus, audi ipsum dicéntem: Ego et Pater veniémus, et mansiónem apud eum faciémus.
      responsory: |-
        R. Tempus est, ut revértar ad eum, qui me misit, dicit Dóminus: nolíte contristári, nec turbétur cor vestrum: * Rogo pro vobis Patrem, ut ipse vos custódiat, allelúia, allelúia.
        V. Nisi ego abíero, Paráclitus non véniet: cum assúmptus fúero, mittam vobis eum.
        R. Rogo pro vobis Patrem, ut ipse vos custódiat, allelúia, allelúia.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joannes 15:26-27; 16:1-4
      text: 'In illo témpore: Dixit Jesus discípulis suis: Cum vénerit Paráclitus, quem ego mittam vobis a Patre, Spíritum veritátis, qui a Patre procédit, ille testimónium perhibébit de me: et vos testimónium perhibébitis, quia ab inítio mecum estis. Hæc locútus sum vobis, ut non scandalizémini. Absque synagógis fácient vos: sed venit hora, ut omnis, qui intérficit vos, arbitrétur obséquium se præstáre Deo. Et hæc fácient vobis, quia non novérunt Patrem neque me. Sed hæc locútus sum vobis: ut, cum vénerit hora eórum, reminiscámini, quia ego dixi vobis.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tractate 92 on the Gospel of John
      text: |-
        Dóminus Jesus in sermóne, quem locútus est discípulis suis post cenam, próximus passióni, tamquam itúrus, et relictúrus eos præséntia corporáli, cum ómnibus autem suis usque in consummatiónem sǽculi futúrus præséntia spiritáli, exhortátus est eos ad perferéndas persecutiónes impiórum, quos mundi nómine nuncupávit. Ex quo tamen mundo étiam ipsos discípulos se elegísse dixit: ut scirent se Dei grátia esse, quod sunt; suis autem vítiis fuísse, quod fuérunt.

        Deínde persecutóres et suos et ipsórum, Judǽos evidénter expréssit: ut omníno apparéret étiam ipsos mundi damnábilis appellatióne conclúsos, qui persequúntur sanctos. Cumque de illis díceret, quod ignorárent eum a quo missus est; et tamen odíssent et Fílium, et Patrem, hoc est, et eum qui missus est, et eum a quo missus est: (de quibus ómnibus in áliis semónibus jam disserúimus) ad hoc pervénit, ubi ait: Ut adimpleátur sermo, qui in lege eórum scriptus est: Quia ódio habuérunt me gratis.

        Deínde tamquam consequénter adjúnxit, unde modo disputáre suscépimus: Cum autem vénerit Paráclitus, quem ego mittam vobis a Patre, Spíritum veritátis, qui a Patre procédit, ille testimónium perhibébit de me: et vos testimónium perhibébitis, quia ab inítio mecum estis. Quid hoc pértinet ad illud quod díxerat: Nunc autem et vidérunt, et odérunt et me, et Patrem meum: sed ut impleátur sermo, qui in lege eórum scriptus est: Quia ódio habuérunt me gratis? An quia Paráclitus quando venit Spíritus veritátis, eos, qui vidérunt, et odérunt, testimónio manifestióre convícit? Immo vero étiam áliquos ex illis qui vidérunt, et adhuc óderant, ad fidem, quæ per dilectiónem operátur, sui manifestatióne convértit.
      responsory: |-
        R. Ego rogábo Patrem, et álium Paráclitum dabit vobis, * Ut máneat vobíscum in ætérnum, Spíritum veritátis, allelúia.
        V. Si enim non abíero, Paráclitus non véniet ad vos: si autem abíero, mittam eum ad vos.
        R. Ut máneat vobíscum in ætérnum, Spíritum veritátis, allelúia.
      status: verified
