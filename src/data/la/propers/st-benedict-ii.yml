# Matins Nocturn 2 reading for St. Benedict II, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/05-07-BenedictusII.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Benedíctus hujus nóminis secúndus, Romanus génere, patre Joánne ortus, post Leónis secúndi óbitum ad munus Apostolicum assúmptus est, anno Christi sexcentésimo octogésimo quarto, et suprémum christiánæ rei publicæ clavum novem círciter menses ténuit, dignissimus certe, qui diútius teneret, cum a primis pueritiæ annis se totum ecclesiásticis ministériis addixisset, ac sedulam divínis lítteris et sacræ psalmodiæ óperam navasset.

        Hic non uno dumtáxat nómine,verum étiam cœlestis benedictionis grátia et sanctæ conversationis exémplo Benedíctus, mansuetus, mitis et húmilis, insígnis étiam patiéntiæ,et páuperum amantíssimus, in quos larga manu réditus Ecclésiæ profúdit. Ad restaurandam quoque ac exornándam Príncipis Apostolórum basílicam, aliásque Urbis ecclésias, ánimum et manum applicuit, in quo multa aureorum míllia pie consúmpsit.

        Mirifico étiam conservandæ et propagándæ religiónis zelo flagrávit. Macarium patriarcham Antiochenum, a sexta synodo propter hærésim depositum, ad saniorem mentem redúcere summo stúdio laborávit. Scriptis étiam ad epíscopos Hispániæ lítteris, eosdem monuit ut declararent apertius et sanius, quæ de voluntáte Dei et tribus Christi substantiis ante scripserant. Constantínus vero imperátor tanto illum amóre et honóre prosecútus est, ut et capíllos suórum fíliorum, in signum observántiæ, illi obtulerit. Sancto tandem fine quiévit, et sepúltus est in Vaticáno.
      status: verified
