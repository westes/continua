# Matins Nocturn 2 reading for Bl. Eugenius III, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/07-08-EugeniusIII.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Eugenius hujus nóminis tértius, Bernárdus ántea dictus, pátria Pisanus fuit. Exacta adolescéntia, clericáli milítiæ nomen dedit, et sacerdótio póstea initiátus, ob egregias ánimi dotes inter canónicos metropolitanæ Pisanæ cooptári méruit. Sancti Bernárdi, qui tunc Pisas advenerat, exémplo illectus, eídem sese instituéndum dedit, atque in Claravalle monásticum índuit hábitum. Tanti viri disciplína ádeo profécit,ut primum Farfensi monastério ab eo præpósitus, deínde abbas cœnubii sanctórum Vincentii et Anastasii ad Aquas Sálvias ab Innocéntio secúndo Summo Pontífice eléctus fúerit. Quo in obeúndo múnere cum sanctimóniæ ac prudéntiæ miro splendóre inclaruisset, a cardinálibus post Lúcii secúndi óbitum cunctis suffrágiis Póntifex Máximus creátus est. Vix autem ab inito pontificátu, perduellium turbis Ecclésiæ Románæ principatum evertere adnitentibus, semel atque íterum ab Urbe discédere cógitur, sedataque deínde tempestáte íterum ad eam summo honóre, et bonórum gratulatione regreditur.

        Viterbii commorans, Angliæ legátos, Scótiæ, Germániæ, Hispániæ et Gálliæ excépit, beáto Petro in ejus persdna obedientiam et obséquium profitentes; itémque non nullos Armeniæ epíscopos, qui ínsuper Metropolitani ac gentis suæ nómine de gravioribus orientális ecclésiæ negótiis ejus exquisiverunt senténtiam. Proféctus in Gálliam, concilia Rhemis ac Treviris celebrávit, in quibus Eonis et Gilberti Porretani proscripsit erróres, aliáque plura sapiénter constítuit ad cleri disciplínam, et Ecclésiæ libertatem. Cœnobia deínde Claravallense ac Cisterciénse una cum sancto Bernardo invisit præcláris ubíque sanctæ conversationis exémplis relíctis. Ab eódem Bernardo salutaria monita exquisívit ad Ecclésiam administrandam, et apostólicæ Sedis jura protuenda; ille vero ei pretiósum librum de Consideratione dedit, quo Pontíficis principisque prærogativæ et offícia cœlesti sapiéntia declarantur. Litterárum quoque cultor exímius, cum theologíæ ac jurisprudéntiæ reformávit stúdia, tum academicos, uti vocant, gradus instítuit, quo adolescentium ánimos alacriores rédderet.

        Singulári pacis fovendæ cupiditáte, curas omnes inténdit, ut discórdias Pisanos inter et Lucenses compóneret. Decórem domus Dei summópere diléxit: nam et basílicam Liberianam pulchriori decorávit ornátu, et ália templa quamplura, aut refecit, aut pretiósis donis ditavit. Vaticánæ autem basílicæ quartam oblationum partem sibi de more competentem, præter decimam jam a sancto Leóne nono Apostolórum Principi attributam, elargitus est. Henrícum imperatórem, catholicorum príncipum nobile exémplar, sanctórum in album rétulit. Tandem Tibure, quo æstivos calóres vitandi causa ab Urbe concesserat, gravi morbo implicitus, mortem justórum appetiit octávo Idus Júlii anno millésimo centésimo quinquagésimo tértio, postquam in Petri cáthedra sedisset annos octo, et menses quátuor. Corpus Romam delátum, cónditum fuit in Vaticáno, una cum sancti Gregórii tértii et beáti Petri Levitæ exuviis. Sacrum porro cultum jam tunc miraculórum accedente fulgóre ei exhibitum, et in áliis quoque regiónibus, ad hæc usque témpora vigentem, Summus Póntifex Pius nonus, ex Sacrórum Rítuum Congregatiónis consúlto, ratum hábuit et confirmávit.
      status: verified
