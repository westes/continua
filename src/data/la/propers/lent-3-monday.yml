# Matins Nocturn content for Monday of Lent week 3 — read from
# web/www/horas/{Latin,English}/Tempora/Quad3-1.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad3-1.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Ambrose
# homily split only to fill the fixed 3-lesson slot count). Responsory
# is Lectio1's own (given directly in this file, not a cross-reference).
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Luc 4:23-30
      text: 'In illo témpore: Dixit Jesus pharisǽis: Utique dicétis mihi hanc similitúdinem: Médice, cura teípsum: quanta audívimus facta in Caphárnaum, fac et hic in pátria tua. Ait autem: Amen, dico vobis, quia nemo prophéta accéptus est in pátria sua. In veritáte dico vobis, multæ víduæ erant in diébus Elíæ in Israël, quando clausum est cœlum annis tribus et ménsibus sex, cum facta esset fames magna in omni terra: et ad nullam illárum missus est Elías, nisi in Sarépta Sidóniæ ad mulíerem víduam. Et multi leprósi erant in Israël sub Eliséo Prophéta: et nemo eórum mundátus est nisi Náaman Syrus. Et repléti sunt omnes in synagóga ira, hæc audiéntes. Et surrexérunt, et ejecérunt illum extra civitátem: et duxérunt illum usque ad supercílium montis, super quem cívitas illórum erat ædificáta, ut præcipitárent eum. Ipse autem tránsiens per médium illórum, ibat.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Book 4 on Luke iv
      text: |-
        Non medíocris invídia próditur, quæ cívicæ caritátis oblíta, in acérba ódia causas amóris infléctit. Simul hoc exémplo páriter et oráculo declarátur, quod frustra opem misericórdiæ cæléstis exspéctes, si aliénæ frúctibus virtútis invídeas. Aspernátor enim Dóminus invidórum est: et ab iis qui divína benefícia in áliis persequúntur, mirácula suæ potestátis avértit. Domínicæ quippe carnis actus, divinitátis exémplum est: et invisibília nobis ejus, per ea quæ sunt visibília, demonstrántur.

        Non otióse ítaque Salvátor excúsat, quod nulla in pátria sua mirácula virtútis operátus sit: ne fortássis áliquis viliórem pátriæ nobis esse debére putáret afféctum. Neque enim cives póterat non amáre, qui amáret omnes: sed ipsi se caritáte pátriæ, dum ínvident, abdicárunt. In veritáte dico vobis: multæ víduæ fuérunt in diébus Elíæ. Non quia Elíæ dies fuérunt, sed in quibus Elías operátus est: aut quia Elías dies faciébat illis, qui in ejus opéribus lucem vidébant grátiæ spiritális, et convertebántur ad Dóminum. Et ídeo aperiebátur cælum vidéntibus ætérna et divína mystéria: claudebátur, et fames erat, quando nulla erat cognoscéndæ divinitátis ubértas. Sed de hoc plénius díximus, cum de víduis scriberémus.

        Et multi leprósi erant in Judǽa tempóribus Eliséi prophétæ: et nemo eórum mundátus est, nisi Náaman Syrus. Evidénter hic sermo nos Dómini salutáris infórmat, et ad stúdium venerándæ divinitátis hortátur: quod nemo sanátus osténditur, et maculósi morbo córporis absolútus, nisi qui religióso offício stúduit sanitáti. Non enim dormiéntibus divína benefícia, sed observántibus deferúntur. Díximus in libro álio, in vídua illa, ad quam Elías diréctus est, typum Ecclésiæ præmíssum. Pópulus Ecclésiam congregávit, ut sequátur pópulus ille ex alienígenis congregátus. Pópulus ille ante leprósus, pópulus ille ante maculósus, priúsquam mýstico baptizarétur in flúmine: idem post sacraménta baptísmatis máculis córporis et mentis ablútus, jam non lepra, sed immaculáta virgo cœpit esse sine ruga.
      responsory: |-
        R. Tóllite hinc vobíscum múnera, et ite ad dóminum terræ: et cum invenéritis, adoráte eum super terram: * Deus autem meus fáciat eum vobis placábilem: et remíttat et hunc fratrem vestrum vobíscum, et eum quem tenet in vínculis.
        V. Súmite de óptimis terræ frúgibus in vasis vestris, et deférte viro múnera.
        R. Deus autem meus fáciat eum vobis placábilem: et remíttat et hunc fratrem vestrum vobíscum, et eum quem tenet in vínculis.
      status: verified
