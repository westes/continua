# Matins readings for St. Joseph the Worker (May 1). Sourced directly from
# web/www/horas/Latin/Sancti/05-01r.txt, English/Sancti/05-01r.txt.
# Nocturn 1: Lectio1-3 (Genesis) combined into one reading, with Responsory1.
# Nocturn 2: Lectio4-6 (from the Acts of Pope Pius XII) combined, with Responsory4.
# Nocturn 3: the Gospel pericope (Matt 13:54-58, full text from the scripture store)
# then the homily (Lectio7-9), with Responsory7.
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: false
      source: Genesis 1:27-28, 31; 2:1-3, 7-9, 15; 3:17-19, 23-24
      text: |-
        In princípio creávit Deus hóminem ad imáginem suam; ad imáginem Dei creávit illum: másculum et féminam creávit eos. Benedixítque illis Deus, et ait: « Créscite et multiplicámini, et repléte terram, et subícite eam. » Vidítque Deus cuncta quæ fécerat, et erant valde bona. Et factum est véspere et mane, dies sextus. Igitur perfécti sunt cæli et terra, et omnis ornátus eórum. Complevítque Deus die séptimo opus suum quod fécerat: et requiévit die séptimo ab univérso ópere quod patrárat. Et benedíxit diéi séptimo, et sanctificávit illum, quia in ipso cessáverat ab omni ópere suo, quod creávit Deus ut fáceret.

        Formávit ígitur Dóminus Deus hóminem de limo terræ, et inspirávit in fáciem ejus spiráculum vitæ, et factus est homo in ánimam vivéntem. Plantáverat autem Dóminus Deus paradísum voluptátis a princípio, in quo pósuit hóminem quem formáverat. Produxítque Dóminus Deus de humo omne lignum pulchrum visu, et ad vescéndum suáve; lignum étiam vitæ in medio paradísi lignúmque sciéntiæ boni et mali. Tulit ergo Dóminus Deus hóminem, et pósuit eum in paradíso voluptátis ut operarétur et custodíret illum.

        Dixit Dóminus Deus Adæ: Quia audísti vocem uxóris tuæ, et comedísti de ligno, ex quo præcéperam tibi ne coméderes, maledícta terra in ópere tuo: in labóribus cómedes ex ea cunctis diébus vitæ tuæ. Spinas et tríbulos germinábit tibi, et cómedes herbam terræ. In sudóre vultus tui vescéris pane, donec revertáris in terram de qua sumptus es: quia pulvis es, et in púlverem revertéris. Et emísit eum Dóminus Deus de paradíso voluptátis, ut operarétur terram de qua sumptus est. Ejecítque Adam: et collocávit ante paradísum voluptátis chérubim, et flámmeum gládium, atque versátilem, ad custodiéndam viam ligni vitæ.
      responsory: 'R. Sex diébus operáberis et fácies ómnia ópera tua, séptimo autem die sábbatum Dómini Dei tui est: * Non fácies omne opus in eo, allelúia. V. Sex enim diébus fecit Dóminus cælum et terram, et requiévit in die séptimo. R. Non fácies omne opus in eo, allelúia.'
      status: verified
    - nocturn: 2
      isGospel: false
      source: From the Acts of Pope Pius XII
      text: |-
        Ecclésia, providentíssima ómnium Mater, máximas impéndit curas ad opífices tutándos ac levándos, eorúndem consociatiónes instítuens iísque favens, quas Pius duodécimus, Póntifex Máximus, jamprídem validíssimo sancti Joseph patrocínio concréditas esse vóluit. Etenim sanctus Joseph, cum putatívus esset pater Christi, qui faber et fabri fílius appellári dignátus est, propter necessitúdinem qua junctus erat cum Jesu, abúnde spíritum illum hausit unde labor nobilitátur atque evéhitur. Consímili modo hujuscémodi opíficum consociatiónes adníti debent, ut Christus sit semper in ipsis præsens, in eórum membris horúmque famíliis, in omni dénique cœtu operário; síquidem præcípuus harum consociatiónum finis est, ut christiánam vitam in suis membris servent atque alant, Deíque regnum látius propágent, præsértim inter ejúsdem officínæ contubernáles.

        De hac autem Ecclésiæ sollicitúdine erga cœtum operárium novum idem Póntifex prǽbuit arguméntum, cum occasiónem nactus opíficum convéntus caléndis majis anni millésimi nongentésimi quinquagésimi quinti Romæ celebráti, ingéntem multitúdinem in foro ad sancti Petri Basílicam coadunátam álloquens, opíficum institutiónem summópere commendávit. Hæc enim nostris tempóribus potióres sibi víndicat partes, ut opífices, christiána doctrína rite imbúti, grassántes circa societátis constitutiónem remque œconómicam erróres devítent, et morálem órdinem a Deo præstitútum, quem Ecclésia pandit atque interpretátur, de opíficum júribus atque offíciis, probe noscant, reíque geréndæ partícipes effécti, ejúsdem procuratióni efficáciter adlabórent. Christus enim primus in orbe promulgávit atque Ecclésiæ trádidit princípia, quæ ad has diriméndas quæstiónes immutabília ac validíssima perstant.

        Quo autem humáni labóris dígnitas, et princípia quæ eándem effíciunt, áltius insidérent ánimis, Pius duodécimus festum sancti Joseph opíficis instítuit, qui omni cœ́tui operário exémplo sit ac præsídio. Ab hoc enim exémplo, qui operósas exércent artes díscere debent qua ratióne et quo spíritu sua múnia éxpleant, ut páriter primo Dei obsequéntes præcépto, terram subíciant atque œconómicæ prosperitáti cónsulant, ac simul ætérnæ vitæ prǽmia consequántur. Neque déerit próvidus Nazarethánæ Famíliæ custos sibi arte ac labóre cómpares suo munímine tégere eorundémque cǽlitus fortunáre domos. Aptíssime Summus Póntifex hoc festum celebrári jussit caléndis majis, quem diem operárii cœtus sibi ascivérunt; hinc enim spes affúlget fore, ut dies hic, sancto Joseph opífici dicátus, deínceps non ódia exácuat ac júrgia accéndat, sed síngulis recúrrens annis, omnes invítet ad ea magis magísque perficiénda, quæ cívium paci adhuc desunt, immo étiam reipúblicæ moderatóres exstímulet ad ea solérter absolvénda quæ consortiónis humánæ rectus expóstulat ordo.
      responsory: R. Non fácies calúmniam próximo tuo, nec vi ópprimes eum; * Non morábitur opus mercenárii tui apud te usque mane, allelúia. V. Dignus est enim operárius mercéde sua. R. Non morábitur opus mercenárii tui apud te usque mane, allelúia.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 13:54-58
      text: 'Et veniens in patriam suam, docebat eos in synagogis eorum, ita ut mirarentur, et dicerent: Unde huic sapientia haec, et virtutes? Nonne hic est fabri filius? nonne mater ejus dicitur Maria, et fratres ejus, Jacobus, et Joseph, et Simon, et Judas? et sorores ejus, nonne omnes apud nos sunt? unde ergo huic omnia ista? Et scandalizabantur in eo. Jesus autem dixit eis: Non est propheta sine honore, nisi in patria sua, et in domo sua. Et non fecit ibi virtutes multas propter incredulitatem illorum.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Albert the Great, Bishop, On the Gospel of Luke, Ch. 4
      text: |-
        Die sábbati intrávit in synagógam, quo omnes intentióne audiéndi convéniunt. Et ómnium in synagóga óculi erant intendéntes in eum. Hoc tamen quidam devotióne, quidam curiositáte, et quidam observántes eum fecérunt, ut cáperent eum in sermóne. Et dicébant scribæ et pharisǽi ad pópulum, qui jam fidem et devotiónem concéperat: « Nonne hic est fílius Joseph? » Despectiónis nota est demonstrátio ejus quem nomináre non sunt dignáti. Fílius Joseph: minus hic dicit evangelísta quod tam a Matthǽo quam a Marco plénius scíverat esse pósitum: « Nonne hic est fabri fílius? Nonne hic est faber, fílius Maríæ? » Hæc ómnia despectíve dicta sunt.

        Faber lignárius dícitur fuísse Joseph, arte et usu mánuum victum quærens, et non in ótio et delíciis panem mandúcans, sicut scribæ et pharisǽi fecérunt. María étiam colo et consílio mánuum victum quærébat. Et est sensus: Hic despéctæ et paupérrimæ nativitátis, non potest esse Christus Dóminus, quem unxit Deus. Et ídeo sibi non est credéndum tam rusticáno et tam vili.

        Faber tamen erat Dóminus: quia prophéta dixit de ipso: « Tu fabricátus es auróram et solem. » Símilis modus despectívus est in libro Regum, ubi Saul promóto in regnum suum dixérunt: « Quænam res áccidit fílio Cis? Num et Saul inter prophétas est? » Parva ergo locútio magnum impórtat despéctum. Dóminus autem dixit: « Amen dico vobis, quia nemo prophéta accéptus est in pátria sua. » Se autem prophétam hic dicit Dóminus. Ipse enim, cui ómnia per divinitátem nota sunt, nullam pénitus récipit inspiratiónis revelatiónem. Pátriam autem suam vocat hic stricte locum conceptiónis et nutritiónis. Suis autem convicáneis, qui invídia incitabántur ad ipsum, non fuit accéptus.
      responsory: R. Jesus erat incípiens quasi annórum trigínta, * Qui putabátur fílius Joseph, allelúia. V. Faber autem erat Joseph, sponsus Vírginis Maríæ, de qua natus est Christus. R. Qui putabátur fílius Joseph, allelúia.
      status: verified
