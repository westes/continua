# Read directly from `Sancti/11-13n.txt`'s own [Oratio] and
# `English/Sancti/11-13n.txt`'s own translation.
collect:
  text: |
    Orémus.
    Dómine Jesu Christe, qui sanctam Vírginem Francíscam Xavériam, Sacratíssimi Cordis tui
    igne succénsam, per amplíssimas mundi plagas ad ánimas tibi lucrándas deduxísti, et
    per eam novam in Ecclésia tua Vírginum famíliam suscitásti; quǽsumus; ut ipsa
    intercedénte, ejúsdem Cordis tui virtútibus induámur, atque ad ætérnum beatitúdinis
    portum perveníre mereámur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia
    sǽcula sæculórum.
    R. Amen.
  status: verified

# Ant+V/R+collect commemoration bundle, same combined-bundle shape as
# st-canute-commemoration.yml. Ant 2/Versum 2 are the standard de-Communi
# pairing for the Common of a Virgin (C6a, per [Rank]/[Rule]) -- the
# source's own file has no distinct [Ant 2]/[Versum 2] of its own (only
# hymns), so common-of-a-virgin-commemoration-antiphon.yml/lauds-versicle-
# common-of-a-virgin.yml supply it, both already verified elsewhere.
commemoration:
  text: |
    Ant. Símile est regnum cælórum * hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Dómine Jesu Christe, qui sanctam Vírginem Francíscam Xavériam, Sacratíssimi Cordis tui igne succénsam, per amplíssimas mundi plagas ad ánimas tibi lucrándas deduxísti, et per eam novam in Ecclésia tua Vírginum famíliam suscitásti; quǽsumus; ut ipsa intercedénte, ejúsdem Cordis tui virtútibus induámur, atque ad ætérnum beatitúdinis portum perveníre mereámur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Matins Nocturn 2 reading for St. Frances Xavier Cabrini, Virgin
# (Nov 13). Sourced from `Sancti/11-13n.txt` [Lectio94] and its English
# counterpart -- both real source text, marked verified.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Francísca Xavéria in óppido Sancti Angeli, diœcésis Laudénsis, orta, jam inde a pueritia Deo devótam vitæ ratiónem instítuit. Trédecim annos nata, sacratíssimo Cordi Jesu virginitátem vovit. At, non bene valens, religiónem cum postulásset, unam alterámque repúlsam passa est. Ludi magístræ múnere functam, orphanotróphio moderándo præfécit eam epíscopus, a quo étiam ad novam condéndam religiónem missionáriam incitabátur. Itaque Cotónei, apud sacéllum beátæ Vírginis de Grátiis, cum ipsa trigínta esset annórum, missionálium vírginum a Sacro Corde Jesu fundaménta jecit. Cum autem hæréret anceps, Dei nutum crédidit elóquium Leónis décimi tértii jubéntis ad oras navigáre occíduas. Océanum quater et vícies prætergréssa, in América Septentrionáli mater Italórum méruit appellári. Deo semper inténta et confísa, beátam Vírginem Maríam Congregatiónis suæ Matrem salutábat. Institútum suum mirífice propagávit, sexagínta septem dómibus ab ipsa constitútis. Demum Chicágiæ, die vigésima secúnda decémbris, anno millésimo nongentésimo décimo séptimo, cursum consummávit ejúsque exúviæ Neo-Eborácum translátæ sunt. Quam Pius undécimus beátis, Pius vero duodécimus sanctis Virgínibus accénsuit.
      status: verified
