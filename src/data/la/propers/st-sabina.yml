# Verified against Divinum Officium (Divino Afflatu), Lauds live query,
# 2026-08-29 -- the "Commemoratio S. Sabinæ Martyris" block that follows
# the Decollation of St. John the Baptist's own collect (she's never the
# day's own winner in this app's calendar, always commemorated -- see
# st-sabina.yml). Antiphon + versicle/response + full collect (own
# doxology/Amen, standing alone rather than chaining) -- see
# hours/resolve-common.ts's getDayCollects for how a sanctoral
# commemoration renders this whole bundle. The collect is collect-c7's
# own template ("Commune non Virginis Martyris" -- Sabina was a matron,
# not a virgin), not collect-c6's Virgin-and-Martyr text st-sabina.yml
# used to point at.
commemoration:
  text: |
    Ant. Date ei de fructu mánuum suárum, et laudent eam in portis ópera eius.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, qui inter cétera poténtiæ tuæ mirácula étiam in sexu frágili victóriam martýrii contulísti: concéde propítius; ut, qui beátæ Sabínæ Mártyris tuæ natalícia cólimus, per eius ad te exémpla gradiámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Matins Nocturn 2 reading for St. Sabina, Martyr (Aug 29, sharing the
# date with the Decollation of St. John the Baptist — see
# decollation-of-st-john-baptist.yml). No genuine SanctiM match: the
# only SanctiM files for this date base `@Sancti/08-29` (the
# Decollation, not Sabina) — a missed pre-1955-pool candidate rather
# than a genuine SanctiM case (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/08-29cc.txt, English/Sancti/08-29cc.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Sabina, mulier Romana, Valentini viri claríssimi uxor, a Seráphia vírgine christianæ fidei præceptis instituta, post sanctæ Vírginis martyrium, collectas ejus relíquias piis exsequiis sepelívit. Quæ propter eam causam paulo post, Hadriáno imperatóre, comprehensa, Elpidio júdici sistitur. Cui is: Tu ne illa Sabina et génere et matrimonio nobilíssima? At illa, Sum, inquit: sed Dómino meo Jesu Christo grátias ago, qui me, intercessióne Seráphiæ famulæ suæ, e dæmonum potestate liberávit. Quam varie tentatam ut propositum mutaret, cum a fidei constántia movére non posset, præfectus, pronuntiáta senténtia quod deos contemneret, cápitis damnávit. Ejus corpus a Christiánis in eodem sepúlcro cónditum est, in quo ipsa magistram fidei suæ Seráphiam posúerat.'
      status: verified
