# Nocturn 3, 19th Sunday after Pentecost. Sourced from Tempora/Pent19-0.txt.
# See post-pentecost-02.yml/post-pentecost-12.yml for sweep method note (no
# proper Nocturn 2 in the source). Lectio7 bare incipit (Matt 22:1-14, the
# marriage feast of the king's son) skipped; Lectio7-9's homily by Pope St.
# Gregory the Great is one continuous work, combined.
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Matt 22:1-14
      text: 'In illo témpore: Loquebátur Jesus princípibus sacerdótum et pharisǽis in parábolis, dicens: Símile factum est regnum cœlórum hómini regi, qui fecit núptias fílio suo. Et misit servos suos vocáre invitátos ad nuptias, et nolébant veníre. Iterum misit álios servos, dicens: Dícite invitátis: Ecce, prándium meum parávi, tauri mei et altília occísa sunt, et ómnia paráta: veníte ad núptias. Illi autem neglexérunt: et abiérunt, álius in villam suam, álius vero ad negotiatiónem suam: réliqui vero tenuérunt servos ejus, et contuméliis afféctos occidérunt. Rex autem cum audísset, iratus est: et, missis exercítibus suis, pérdidit homicídas illos et civitátem illórum succéndit. Tunc ait servis suis: Núptiæ quidem parátæ sunt, sed, qui invitáti erant, non fuérunt digni. Ite ergo ad exitus viárum et, quoscúmque invenéritis, vocáte ad núptias. Et egréssi servi ejus in vias, congregavérunt omnes, quos invenérunt, malos et bonos: et implétæ sunt núptiæ discumbéntium. Intrávit autem rex, ut vidéret discumbéntes, et vidit ibi hóminem non vestítum veste nuptiáli. Et ait illi: Amíce, quómodo huc intrásti non habens vestem nuptiálem? At ille obmútuit. Tunc dixit rex minístris: Ligátis mánibus et pédibus ejus, míttite eum in ténebras exterióres: ibi erit fletus et stridor déntium. Multi enim sunt vocáti, pauci vero elécti.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 38 on the Gospels
      text: |-
        Sæpe jam me dixísse mémini, quod plerúmque in sancto Evangélio regnum cælórum præsens Ecclésia nominátur: congregátio quippe justórum, regnum cælórum dícitur. Quia enim per prophétam Dóminus dicit: Cælum mihi sedes est; et Sálomon ait: Anima justi sedes sapiéntiæ; Paulus étiam dicit Christum Dei virtútem, et Dei sapiéntiam: líquido collígere debémus, quia si Deus sapiéntia, ánima autem justi, sedes sapiéntiæ, dum cælum dícitur sedes Dei, cælum ergo est ánima justi. Hinc per Psalmístam de sanctis prædicatóribus dícitur: Cæli enárrant glóriam Dei.

        Regnum ergo cælórum est Ecclésia justórum: quia dum eórum corda in terra nil ámbiunt, per hoc quod ad supérna suspírant, jam in eis Dóminus quasi in cæléstibus regnat. Dicátur ergo: Símile est regnum cælórum hómini regi, qui fecit núptias fílio suo. Jam intélligit cáritas vestra, quis est iste Rex, Regis fílii pater: ille nimírum, cui Psalmísta ait: Deus judícium tuum Regi da, et justítiam tuam fílio Regis. Qui fecit núptias fílio suo. Tunc enim Deus Pater Deo Fílio suo núptias fecit, quando hunc in útero Vírginis humánæ natúræ conjúnxit, quando Deum ante sǽcula fíeri vóluit hóminem in fine sæculórum.

        Sed quia ex duábus persónis fíeri solet ista nuptiális conjúnctio; absit hoc ab intelléctibus nostris, ut persónam Dei et hóminis Redemptóris nostri Jesu Christi, ex duábus persónis credámus unítam. Ex duábus quippe atque in duábus hunc natúris exsístere dícimus; sed ex duábus persónis compósitum credi, ut nefas vitámus. Apértius ergo atque secúrius dici potest, quia in hoc Pater Regi Fílio núptias fecit, quo ei per incarnatiónis mystérium sanctam Ecclésiam sociávit. Uterus autem Genitrícis Vírginis, hujus sponsi thálamus fuit. Unde et Psalmísta dicit: In sole pósuit tabernáculum suum, et ipse tamquam sponsus procédens de thálamo suo.
      responsory: |-
        R. Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.
        V. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.
        R. Plena est omnis terra glória ejus.
      status: verified
