# Read from the reference engine: web/www/horas/Latin/Sancti/05-27.txt
# [Oratio]; English from English/Sancti/05-27.txt reworded to this project's
# collect phrasing, marked draft.
collect:
  text: |
    Orémus.
    Deus, qui Ecclésiam tuam beáti Bedæ Confessóris tui atque Doctóris eruditióne claríficas: concéde propítius fámulis tuis; ejus semper illustrári sapiéntia et méritis adjuvári.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-a-confessor-doctor (non-Bishop, C5a), same as
# commemoration-st-ephraim-of-syria.yml, not independently live-verified for
# this category, so marked draft. Collect is the saint's own (collect-st-bede.yml).
commemoration:
  text: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui Ecclésiam tuam beáti Bedæ Confessóris tui atque Doctóris eruditióne claríficas: concéde propítius fámulis tuis; ejus semper illustrári sapiéntia et méritis adjuvári.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2-3 readings for St. Bede the Venerable (May 27). Sourced
# directly from web/www/horas/Latin/Sancti/05-27.txt, English/Sancti/05-27.txt.
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3: the Gospel pericope (Matt 5:13-19, full text from the
# scripture store) then Bede's own homily on it (Lectio7-8; the source gives him no Lectio9 of his own, and the Common's is deliberately not pulled in). Nocturn 1 comes
# from the Common of a Doctor.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Beda presbyter, Girvi in Britanniæ et Scotiæ finibus ortus, septennis sancto Benedicto Biscopio abbati Wiremuthensi educandus traditur. Monachus deínde factus, vitam sic instituit, ut, dum se artium et doctrinarum studiis totum impenderet, nihil umquam de regulari disciplina remitteret. Nullum fuit doctrinæ genus, in quo non esset diligentissime versatus; sed præcipua illi cura divinarum Scripturarum meditatio, quarum sententiam ut plenius assequeretur, Græci Hebraicique sermonis notitiam est adeptus. Trigesimo ætatis anno abbatis sui jussu sacerdos initiatus, statim, suasore Acca Hagulstadensi episcopo sacros explanare libros aggressus est: in quo sanctorum Patrum doctrinis adeo inhæsit, ut nihil proferret nisi illorum judicio comprobatum, eorumdem étiam fere verbis usus. Otium perosus semper, ex lectione ad orationem transibat ac vicissim ex oratione ad lectionem: in qua adeo animo inflammabatur, ut sæpe inter legendum et docendum lacrimis perfunderetur. Ne autem rerum fluxarum curis distraheretur, delatum abbatis munus constantissime detrectavit.

        Scientiæ ac pietatis laude Bedæ nomen sic brevi claruit, ut sanctus Sergius Papa de eo Romam arcessendo cogitaverit; quo difficillimis scilicet, quæ de rebus sacris exortæ erant, quæstionibus definiendis conferret operam. Emendandis fidelium moribus, fidei vindicandæ atque asserendæ libros plures conscripsit, quibus tantam sui apud omnes opinionem fecit, ut illum sanctus Bonifatius episcopus et martyr, Ecclesiæ lumen prædicaverit; Lanfrancus, Anglorum doctorem; concilium Aquisgranense, doctorem admirabilem dixerit. Quin ejus scripta eo adhuc vivente, publice in ecclesiis legebantur. Quod cum fieret, quoniam ipsum sanctum minime appellare liceret, Venerabilis titulo efferebant; qui deínde veluti proprius secutis étiam temporibus semper habitus est. Ejus autem doctrinæ eo vis efficacior erat, quod vitæ sanctimonia religiosisque virtutibus confirmabatur. Quam ob rem discipulos, quos multos et egregios imbuendos habuit, studio et exemplo non litteris modo atque scientiis, sed étiam sanctitate fecit insignes.

        Aetate demum et laboribus fractus, gravi morbo correptus est. Quo cum amplius quinquaginta dies detentus esset, consuetum orandi morem Scripturasque interpretandi non intercepit; eo namque tempore Evangelium Joannis in popularium suorum usum Anglice vertit. Cum autem in Ascensionis præludio instare sibi mortem persentiret, supremis Ecclesiæ sacramentis muniri voluit; tum, sodales amplexatus, atque humi super cilicio stratus, cum illa verba ingeminaret, Gloria Patri, et Filio, et Spiritui Sancto, obdormivit in Domino. Ejus corpus suavissimum uti fertur, spirans odorem sepultum est in monasterio Girvensi, ac postea Dunclinum cum sancti Cuthberti, reliquiis translatum. Eum tamquam Doctorem a Benedictinis aliisque religiosis familiis ac diœcesibus cultum, Leo decimus tertius Pontifex maximus ex sacrorum Rituum Congregationis consulto, universalis Ecclesiæ Doctorem declaravit, et festo ipsius die Missam et Officium de Doctoribus ab omnibus recitari decrevit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 5:13-19
      text: 'Vos estis sal terrae. Quod si sal evanuerit, in quo salietur? ad nihilum valet ultra, nisi ut mittatur foras, et conculcetur ab hominibus. Vos estis lux mundi. Non potest civitas abscondi supra montem posita, neque accedunt lucernam, et ponunt eam sub modio, sed super candelabrum, ut luceat omnibus qui in domo sunt. Sic luceat lux vestra coram hominibus: ut videant opera vestra bona, et glorificent Patrem vestrum, qui in caelis est. Nolite putare quoniam veni solvere legem, aut prophetas: non veni solvere, sed adimplere. Amen quippe dico vobis, donec transeat caelum et terra, jota unum aut unus apex non praeteribit a lege, donec omnia fiant. Qui ergo solverit unum de mandatis istis minimis, et docuerit sic homines, minimus vocabitur in regno caelorum: qui autem fecerit et docuerit, hic magnus vocabitur in regno caelorum.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bede the Venerable, Homily on the Gospel
      text: |-
        In terra, humana natura; in sale, sapientia verbis significatur. Salis enim natura, terra efficitur infructuosa; unde quasdam urbes legimus, victorum ira, sale seminatas. Et hoc convenit apostolicæ doctrinæ, ut sale sapientiæ compescat in terra humanæ carnis luxum sæculi aut fœditatem vitiorum germinare. Quod si sal evanuerit, in quo salietur? Id est, si vos, per quos condiendi sunt populi, propter metum persecutionum, aut terrorem, amiseritis regna cælorum, extra Ecclesiam positi, inimicorum opprobria sustinetis non dubium. Vos estis lux mundi: id est, vos, quia vera luce illuminati estis, lux eis qui in mundo sunt, esse debetis. Non potest civitas abscondi supra montem posita: id est, apostolica doctrina super Christum fundata, sive Ecclesia super Christum ex multis gentibus fidei unitate constructa et caritatis bitumine conglutinata; quæ sit tuta intrantibus; et laboriosa adeuntibus, habitatores custodit, et omnes inimicos secludit.

        Neque accendunt lucernam et ponunt eam sub modio, sed super candelabrum. Sub modio ergo lucernam ponit quisquis lucem doctrinæ commodis temporalibus obscurat et tegit; super candelabrum vero, qui se ita ministerio Dei subjicit, ut superior sit doctrina veritatis quam servitus corporis. Aliter Salvator accendit lucernam, qui humanæ testam naturæ flamma suæ divinitatis implevit; et hanc super candelabrum, id est Ecclesiam, posuit, quod in frontibus nostris fidem suæ incarnationis fixit. Quæ lucerna non potuit sub modio poni, id est sub mensura legis includi; nec in sola Judǽa, sed in universo illuxit orbe.

        Neither doth any man light a candle and put it under a bushel; but upon a candlestick. So he who puts the light under the bushel is he who for his own temporal ends would hide and tamper with the light of doctrine; but upon the candlestick he places it who follows the ministry of God in order that the teaching of the truth may be accounted a greater thing than the service of the body. In another aspect, the Saviour lighted the candle when He filled our mortal body with the flame of the God-head; and He placed it on a candlestick, that is the Church; for He fixed the faith of His incarnation upon our foreheads. Which light cannot be placed under a bushel; that is to say, it cannot be included within the measures of the law, nor in Judea alone, but has lightened the whole earth.
