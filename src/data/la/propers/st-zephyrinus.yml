# Matins Nocturn 2 reading for St. Zephyrinus, Pope and Martyr (Aug 26)
# — pre-1955-but-post-1617 (no SanctiM/08-26*.txt at all).
# web/www/horas/Latin/Sancti/08-26.txt, English/Sancti/08-26.txt. Single
# lesson (simplex-feast Lectio93), no responsory in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Zephyrinus Romanus Severo imperatore ad regendam Ecclesiam assumptus, sancivit, ut qui ordinandi essent, opportuno tempore et multis præsentibus clericis et laicis, de more sacris initiarentur; doctique ac spectatæ vitæ homines ad id officii munus deligerentur. Decrevit præterea, ut rem divinam facienti episcopo sacerdotes omnes astarent. Idem instituit ut patriarcha, primas, metropolitanus adversus episcopum non ferant sententiam, nisi apostolica auctoritate fulti. Vixit in pontificatu annos decem et octo, dies decem et octo. Habuit ordinationes quatuor mense Decembri, quibus creavit presbyteros tredecim, diaconos septem, episcopos per diversa loca tredecim. Antonino imperatore martyrio coronatus est, et sepultus via Appia prope cemeterium Callisti, septimo Kalendas Septembris.
      status: verified
