# Matins Nocturn 2 reading for St. Hormisdas, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/08-14-Hormisda.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Hormisdas, natióne Campanus, Justo patre Frusinate, séptimo a Symmachi óbitu die, cum jam sanctæ Románæ Ecclésiæ diáconus esset, summa ómnium consensióne ad sanctam Petri Sedem provectus est: in qua ita se gessit, et domínico gregi pascendo sedulam óperam navávit, ut non sine singulári Dei providentia ac divíno consílio eléctum fuísse perspectum sit. Hoc quippe hómine iis tempóribus Ecclésia indigebat, qui et res arduas faciéndas animose suscíperet, et susceptas ad optatum finem strénue perduceret.

        Ubi suprémum Pontíficis munus iniit, totum fere christianum orbem sub régibus barbaris vel hæréticis gementem invénit, et distractam in partes Ecclésiam. Sed octo annórum spatio, vir plane Deo plenus, perenni cura ac felíci laborum suórum eventu, eo rem addúxit, ut Orientales ecclésiæ, ab octogínta círciter annis fœdo schísmate separatæ, subscripto libello, quem is per suos legátos miserat, ad unitátem redierint; et Africæ sui epíscopi, quos in Sardíniam Vandali relegarant, fúerint restituti, et Lazorum rex ac pópulus ad Christi fidem, ejus ópera, inductus sit; ac demum Clodoveus Francorum rex ad eámdem fidem convérsus, solémni legatióne ad Sedem apostólicam, corónam áuream gemmis distinctam Hormisdæ obtulerit, ad perpétuum obediéntiæ et fídei monuméntum.

        Manichæos item discussit, eorúmque codices ante fores Constantinianæ basílicæ incéndio concremavit. Complúres epístolas scripsit ad vários, per univérsum orbem christianum, in quibus ardentissimus zelus religiónis amplificándæ, quo medullitus flagrabat, sacrárum litterárum sciéntia, cum limpidissimo et amœno stylo conjúncta, qua plúrimum valebat, singuláris rerum gerendarum peritia, præsértim cum régibus et optimatibus, qua præ céteris pollebat, aliæque heroicæ ánimi dotes, mirum in modum elucent. Ejus demum pia liberalitas in egénos et sacras ædes profusa fuit. Ac tandem suórum votorum compos, annis ac méritis gravis, et rerum gestárum glória apud Deum et hómines celeberrimus, post novem pontificátus annos, ad cœlestem pátriam migrávit, anno Christi quingentésimo vigésimo tértio, exanimi córporis exuviis Vaticánæ basílicæ relíctis.
      status: verified
