# Matins Nocturn 2 reading for St. Gregory Nazianzen, Bishop,
# Confessor, Doctor (May 9) — SanctiM/05-09.txt inherits the whole day
# (`@Sancti/05-09`) with no Nocturn 2/3 override, so this saint's own
# vita is sourced from the Tridentine track exactly as for a pre-1955
# saint (see memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/05-09.txt, English/Sancti/05-09.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Gregórius, nobilis Cappadox, ex singulari divinárum Litterárum sciéntia Theólogi cognomen consecutus, Nazianzi in Cappadocia natus, Athenis in omni disciplinárum genere una cum sancto Basilío eruditus, ad stúdia sacrárum Litterárum se convértit; in quibus se in cœnobio per aliquot annos exercuérunt, illárum senténtiam non ex proprio ingenio, sed ex majórum ratióne et auctoritate interpretantes. Qui cum doctrina et vitæ sanctitáte florérent, vocáti ad munus prædicandæ evangelicæ veritátis, plurimos Jesu Christo fílios peperérunt.

        Gregórius ígitur, aliquándo domum reversus, primum Sasimórum epíscopus creátus est, deínde Nazianzenam ecclésiam administrávit. Tum Constantinopolim ad eam regéndam ecclésiam accersítus, cum civitátem hæresum purgatam erróribus ad catholicam fidem reduxísset, quod ei summum ómnium amórem conciliare debebat, multórum parávit invidiam. Itaque, cum inter episcopos magna proptérea esset facta seditio, sponte cedens episcopatu, illud prophetæ dictum usurpávit: Si propter me commóta est ista tempéstas, dejicite me in mare, ut vos jactari desinatis. Quare Nazianzum reversus, cum illi ecclésiæ Eulálium præficiéndum curasset, totum se ad contemplatiónem et scriptiónem divinárum rerum cóntulit.

        Scripsit autem multa, et soluta oratióne et versibus, mirábili pietáte et eloquéntia; quibus doctórum hóminum sanctorúmque judício id assecutus est, ut nihil in illis, nisi ex veræ pietátis et catholicæ religiónis regula, reperiátur, nemo quidquam jure vocare possit in dubium. Consubstantialitátis Fílii fuit acerrimus propugnator. Ut autem vitæ laude nemo ei præpositus est; sic et oratiónis gravitáte omnes facile superávit. In iis scribéndi ac legéndi stúdiis ruri vitam monachi exercens, imperatóre Theodosio ad cælestem vitam senio confectus migrávit.
      status: verified
