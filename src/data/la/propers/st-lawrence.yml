octave-readings/~-octave-day-4:
  source: Ex libro Officiorum S. Ambrósii Epíscopi.
  text: |
    Lib. 1., cap. 41., in medio. Non prætereamus sanctum Laurentium, qui cum videret episcopum suum ad martyrium duci, flere cœpit non passionem illius, sed suam remansionem. Itaque his verbis appellare cœpit: Quo progrederis sine filio pater? quo sacerdos sancte sine diacono properas? Numquam sacrificium sine ministro offerre consueveras. Quid in me ergo displicuit pater? Num degenerem me probasti? Experire certe utrum idoneum ministrum elegeris. Cui commisisti Dominici sanguinis dispensationem, cui consumandorum consortium sacramentorum huic consortium tui sanguinis negas?

    Lib. 2., cap. 28., post medium. Aquo cum quærerantur thesauri Ecclesiæ, promisit se demonstraturum. Sequenti die pauperes duxit. Interrogatus ubi essent thesauri quos promiserat, ostendit pauperes, dicens: Hi sunt thesauri Ecclesiæ. Et vere thesauri, in quibus Christus est, in quibus Christi fides est. Denique Apostolus ait: Habemus thesaurum in vasis fictilibus. Quos meliores thesauros habet Christus, quam eos in quibus se esse dixit? Sic enim scriptum est: Esurivi, et dedistis mihi manducare: sitivi, et dedistis mihi bibere: hospes eram, et collegistis me. Et infra: Quod enim uni horum fecistis, mihi fecistis. Hos thesauros demonstravit Laurentius, et vicit, quod eos nec persecutor potuit auferre.

    Numquid dictum est sancto Laurentio: Non debuisti erogare thesauros Ecclesiæ, vasa sacramentorum vendere? Opus est, ut quis fide sincera et perspicaci providentia munus hoc impleat. Sane si in sua quis derivat emolumenta, crimen est: sin vero pauperibus erogat, captivum redimit, misericordia est. Nemo enim potest dicere: Cur pauper vivit? Nemo potest queri, quia captivi redempti sunt. Nemo potest accusare, quia templum Dei ædificatum est. Nemo potest indignari, quia humanis fidelium reliquiis spatia laxata sunt: nemo potest dolere, quia in sepulturis Christianorum requies defunctorum est. In his tribus generibus vasa Ecclesiæ étiam initiata confringere, conflare, vendere licet.
  responsory: |
    R. Levíta Lauréntius bonum opus operátus est, qui per signum crucis cæcos illuminávit, * Et thesáuros Ecclésiæ dedit paupéribus. V. Dispérsit, dedit paupéribus: justítia ejus manet in sǽculum sǽculi. R. Et thesáuros Ecclésiæ dedit paupéribus.
  status: verified

