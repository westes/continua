# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2026-08-17, St. Lawrence's own octave closing day
# -- "In Octava S. Laurentii Martyris ~ Duplex"). This is the live-
# verified proof for the Matins-psalmody-override mechanism
# (hours/matins-psalmody-overrides.ts) -- the general mechanism gap this
# closes: a Duplex+ weekday feast previously fell through to reusing the
# literal *Sunday* psalmody (data/hours/matins-sunday-antiphons.yml, Ps
# 20-31) unconditionally, which is wrong -- a Duplex+ weekday feast has
# its own real, different psalmody (confirmed against the live engine
# directly), not the Sunday's.
#
# Cross-checked against a second Duplex saint (St. Ignatius of Antioch,
# Common of a Martyr-Bishop, no proper content of his own, live-queried
# 2029-02-01): Nocturn 1 is *identical* (Ps 1,2,4,5,8,10); Nocturn 2 is
# nearly identical (Ps 14,20,23,63,91 match -- only one slot differs,
# Lawrence has 16 where Ignatius has 64). So the psalm *numbers* are a
# shared per-Common-category pool, not unique to Lawrence -- only the
# antiphon *text* is proper to him (each one narrates an episode of his
# own martyrdom, e.g. "Quo progréderis sine fílio, pater?"). This file is
# keyed by his own saint id (not yet a Common-category id) since only his
# own proper antiphons have been authored so far -- see this module's own
# doc comment for what extending this to a real Common-category key would
# need.
#
# Nocturn 3's first canticle spans two Sirach chapters under one heading
# in the source ("Eccli 14:22;15:3-4;15:6") -- kept as one canticle with
# two refs (matins.ts's own `canticles: { refs: [...] }[]` shape), not
# split into two, matching how the live engine presents it. New scripture
# chapters authored for this: data/scripture/{sir-14,sir-15,jer-17,sir-31}.yml
# (all sparse, only the cited verses -- same convention as sir-36.yml's
# own Sunday-canticle transcription).
#
# `category: common-of-a-martyr` links this to
# data/hours/matins-psalmody-overrides/categories/common-of-a-martyr.yml,
# the generic Common-of-a-Martyr scheme authored from St. Ignatius of
# Antioch's own live-verified Matins (2029-02-01 -- his own file has no
# proper antiphon, "vide C2" i.e. entirely from Common, confirming his
# psalmody *is* the category default). Lawrence's own file stays fully
# self-contained (own psalm numbers + antiphons, not merged with the
# category file at load time) -- the category link is documentation/
# cross-reference only, not a runtime merge, per this project's "stay on
# the ferial fallback until proper antiphon text is authored per-saint"
# decision (2026-08): a saint without an entry here still gets no
# override, never the category's generic antiphon text. Note one real
# divergence from the category default worth remembering: Lawrence's own
# Nocturn 2 has Ps 16 in the slot where the plain Common default (and
# Ignatius) has Ps 64 -- his own proper psalm selection, not a typo.
matins-psalmody:
  category: common-of-a-martyr
  nocturn1:
    groups:
      - psalms:
          - 1
        antiphon: Quo progréderis * sine fílio, pater? quo, sacérdos sancte, sine minístro próperas?
      - psalms:
          - 2
        antiphon: Noli me derelínquere, * pater sancte, quia thesáuros tuos jam expéndi, quos tradidísti mihi.
      - psalms:
          - 4
        antiphon: Non ego te désero, * fili, neque derelínquo; sed majóra tibi debéntur pro Christi fide certámina.
      - psalms:
          - 5
        antiphon: 'Beátus Lauréntius * orábat, dicens: Dómine Jesu Christe, Deus de Deo, miserére mihi servo tuo.'
      - psalms:
          - 8
        antiphon: 'Dixit Románus * ad beátum Lauréntium: Vídeo ante te júvenem pulchérrimum, festína me baptizáre.'
      - psalms:
          - 10
        antiphon: 'Beátus Lauréntius * dixit: Mea nox obscúrum non habet, sed ómnia in luce claréscunt.'
    versicle:
      v: Glória et honóre coronásti eum, Dómine.
      r: Et constituísti eum super ópera mánuum tuárum.
  nocturn2:
    groups:
      - psalms:
          - 14
        antiphon: 'Strinxérunt * córporis membra pósita super cratículam: subiciéntibus prunas insúltat Levíta Christi.'
      - psalms:
          - 16
        antiphon: Igne me examinásti, * et non est invénta in me iníquitas.
      - psalms:
          - 20
        antiphon: Interrogátus * te Dóminum conféssus sum, assátus grátias ago.
      - psalms:
          - 23
        antiphon: 'Beátus Lauréntius * clamávit et dixit: Deum meum colo, et illi solo sérvio.'
      - psalms:
          - 63
        antiphon: 'Dispérsit * dedit paupéribus: justítia ejus manet in séculum sǽculi.'
      - psalms:
          - 91
        antiphon: 'Protéctor tuus * ego sum noli timére: si transíeris per ignem, flamma non nocébit tibi, et odor ignis non erit in te.'
    versicle:
      v: Posuísti, Dómine, super caput ejus.
      r: Corónam de lápide pretióso.
  nocturn3:
    antiphon: Nisi granum fruménti * cadens, in terram mórtuum fúerit, ipsum solum manet.
    canticles:
      - refs:
          - book: sir
            chapter: 14
            verses: '22'
          - book: sir
            chapter: 15
            verses: 3-4
          - book: sir
            chapter: 15
            verses: '6'
      - refs:
          - book: jer
            chapter: 17
            verses: 7-8
      - refs:
          - book: sir
            chapter: 31
            verses: 8-11
    versicle:
      v: Magna est glória ejus in salutári tuo.
      r: Glóriam et magnum decórem impónes super eum.

