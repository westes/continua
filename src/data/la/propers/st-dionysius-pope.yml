# Matins Nocturn 2 reading for St. Dionysius, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/02-03-Dionysius.txt, [Lectio4], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Dionýsius ex monacho, post beátum Xystum Secúndum Románæ Ecclésiæ Epíscopus est constitútus. Is contra Sabellianos scripsit: et advérsus eos, qui Fílium Dei opus, aut creatúram asseverabant, plura volúmina édidit. Dionysii Alexandríni Epíscopi apud se accusáti, quasi qui Fílium Dei factum, et non substantialem Patri díceret, in Romána Synodo causam discussit, ad quem ejúsdem Synodi id indigne ferentis senténtiam perscripsit. Sed cum Alexandrínus Antístes íterum atque íterum, missis Romam suis scriptis, se purgasset, atque defendisset, maturo demum consílio est absolutus. Presbyteris Ecclésias in urbe Dionysius distríbuit, et cœmeteria, paróchias, atque diœcéses divísit. Dénique multis pro Ecclésia perfúnctus labóribus, ac fídei documéntis clarus, Aureliáno Imperatóre migrávit ad Dóminum, sepultúsque est in cœmetério Callísti via Appia, sexto Kaléndas Januárii. Hábuit mense Decémbri ordinatiónes duas, quibus creávit Presbyteros duódecim, Diáconos sex, Epíscopos per divérsa loca septem. Sedit annos úndecim, menses tres, dies quatuórdecim.'
      status: verified
