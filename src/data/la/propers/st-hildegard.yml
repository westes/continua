# Matins Nocturn 2 and 3 readings for St. Hildegard, Virgin. Sourced from
# web/www/horas/Latin/Sancti/Bavaria/09-17-Hildegardis.txt. Nocturn 2 is
# Lectio4-6 combined into one continuous vita (headed in the source "E
# Breviario Monastico Ordinis S. Benedicti"), its closing responsory the
# source's Responsory6. Nocturn 3 is the source's Lectio7-8, Augustine's
# homily on holy virginity (De sancta virginitate, chs. 25, 29, 30); the
# source's Lectio7 opens with the Common of a Virgin's own gospel incipit
# (`@Commune/C6::1-3`), which continua's Common of a Virgin already
# supplies, so only the homily is carried here. Its closing responsory is
# the source's Responsory8.
#
# No English exists in the reference engine for the Bavarian files; the
# English below is this project's own translation, marked draft.
#
# Latin: three obvious source typos corrected silently below -- "tama" ->
# "fama" (Lectio4), "Abbatíssa" -> "Abbatíssæ" (Lectio4, agreeing with
# Juttæ sanctissimæ), "cali" -> "cæli" (Responsory6). Everything else is
# verbatim.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Hildegárdis in Palatinátu inferióre, ex patre Hildebérto, matre Mechtílde, generis nobilitate ac pietatis fama conspicuis orta, ténera in ætáte miris jam visiónibus illustráta désuper, spretis mundi hujus oblectaméntis, octénnis sub regímine agnatæ suæ Juttæ, sanctissimæ Abbatíssæ, in montem sancti Disibódi consepeliénda Christo secéssit. Monásticum dein institútum proféssa, admirándis paulo post divínæ gratiæ signis innótuit. Contínuo fere acutíssimis excócta ægritudínibus, patiéntiæ exémplum ita universis exhibuit, ut tota ipsíus vita Christo confíxa cruci, quædam diútini fúerit imágo martýrii. E vivis subláta beáta Jutta, Hildegárdis licet renítens in ejus loco suffécta est. Quo in múnere sorórum necessitátibus ómnibus, eárum máxime qua consciéntia utcúmque laborábant, peramánter providéque consulébat. Cum autem ejus monastérium nímiam moniálium numerositátem ut cáperet, jam esset insuffíciens, ad álium montem, a sancto Rupérto nuncupátum, cum plúrimis ex illis contendit, ibíque sedem fixit Abbatiálem. Quadraginta circiter annos nata ígneo turbine ac lúmine prodigióso cálitus illápso mirífice illustráta, donum intelligéntiæ ac expositiónis sacrárum Scripturarum singulári Dei benefício accépit. Jussa item, voce ad ipsam e súperis emíssa, quæ de cétero vidére et audíre mererétur, sédulo scriptis mandáre, cum id detrectaret, a Númine cógitur. Scribere proin aggréssa, de posteritate omni ætérnum méruit: libros quippe confécit exímios ac plane cæléstes, ex quibus eam a Spíritu Sancto edóctam fuísse dignóscitur.

        Prophetiæ affláta spiritu, multis ad se ex divérsis et remotíssimis régiónibus confluéntibus mira omníno prædicebat, eorúmque cogitatiónes et occultióra cordium secréta inspiciébat: quosdam étiam pervérsa vel fraudulénta mente ad se accedéntes redarguébat; qui corrépti et emendáti, ad saniórem ánimum íllico redire cogebántur. Nemo ad illam umquam se cóntulit, qui ejus salutáribus mónitis instrúctus, cum vitæ melióris propósito non recésserit. Divíno intérea sápius impúlsa Spíritu, Colóniam, Trévirim, Metas, Herbípolim, Bambérgam, aliáque loca diversíssima, apostólico zelo ǽstuans ádiit, et quæ sibi divinitus fúerant reveláta, Deo præcipiénte audentíssime annuntiávit. Hæréticos verbis ac scriptis stupénda auctoritáte et grátia confutávit ac profligávit: Catharórum imprímis pestilentíssimam hæresim, qua tunc in aliquibus Germániæ provínciis fautóres suos habébat, nec non repullulascéntem Berengárii errórem doctíssimo libro sanctíssima múlier elúsit atque convícit. Illam mellífluus Doctor Ecclésiæ sanctus Bernárdus tanti fecit ejúsque divína scripta ea prosecútus est veneratione, ut ipso potíssimum agénte a detractiónibus adversántium vindicáta, étiam a Summo Pontifice Eugénio tértio, in Concílio Trevirénsi, Cardinálibus et Epíscopis multis præséntibus, pública fúerint senténtia confirmáta.

        Ecclésiæ dénique univérsæ, assiduis labóribus, et sanctissimæ vita exémplo mirum in modum consuluit; ita nempe ut Eugénius tertius, tresque subsequentes Romani Pontifices, Episcopi non pauci, Imperatóres, aliique summi Principes Gálliæ, Germániæ, Itáliæ atque sanctíssimi quivis et eruditissimi viri, in gravíssimis quibúsque negótiis, illíus consílium exquírerent, ejúsque précibus Románam Ecclésíam, Imperium, et suam quisque provinciam ac seipsum commendárent; dénique post innúmera virtútum ac sciéntiæ divínitus infúsæ insígnia, cæléstium revelatiónum et miraculórum grátia illústris, anno ætátis suæ octogésimo secúndo, cum mortis suæ horam a Deo mónita prædixísset, migrávit ad Sponsum décimo quinto Kaléndas Octobris, anno Dómini millésimo centésimo septuagésimo nono: vere ac mérito ingens vocáta sexus mulíebris, immo Germániæ Ordinis sancti Benedícti et Ecclésiæ miráculum, atque orbis univérsi oráculum. Ejus sacrum corpus in ecclésia primum sancti Rupérti juxta Bingam cónditum, dein bello tricennáli Colóniam asportátum, postrémo in Ecclésiam Eibingénsis monastérii ab ipsa fundati translátum est, ubi anno salútis millésimo octingentésimo quinquagésimo séptimo solémniter recógnitum, summa fidélium veneratióne cólitur.
      responsory: |-
        R. Apparuérunt cæléstes spíritus, qui Hildegárdem ad Agni núptias invitábant, dicéntes: * Veni, Dómina, quia te exspéctant cæli delíciæ.
        V. Veni de Líbano, sponsa; veni de Líbano; veni, coronáberis.
        R. Veni, Dómina, quia te exspéctant cæli delíciæ.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, On Holy Virginity, chs. 25, 29, 30
      text: |-
        Pérgite itaque, Sancti Dei, púeri ac puellæ, mares ac féminæ, cælibes ac nuptæ; pérgite perseverántes in finem. Laudate Dóminum dúlcius, quem cogitatis uberius; sperate felícius, cui servítis instántius; amate ardentius, cui placétis atténtius. Lumbis accinctis et lucérnis ardéntibus exspectáte Dóminum, quando veniat a núptiis. Vos afferétis ad núptias Agni cánticum novum, quod cantábitis cítharis vestris, quale nemo poterit dícere nisi vos. Sic enim vos vidit in Apocalypsi quidam, præ céteris diléctus Agno, qui discúmbere super pectus ejus sólitus erat, et bíberat et eructábat mirabilia super cæléstis Dei Verbum. Vos Agnum sequímini tenéndo perseveranter quod voluístis; ardenter tacite cum potestis, ne virginitatis bonum a vobis pereat, cum fácere nihil potestis, ut rédeat. Vidébit vos cétera multitúdo fidélium, quæ Agnum ad hoc sequi non potest; videbit, nec invidébit, et collætándo vobis, quod in se non habet, habébit in vobis.

        Præsúmite itaque, fídite, roboramini, permanéte, qui vovétis et rédditis Dómino Deo vestro vota perpétuæ continéntiæ, non propter præsens sæculum, sed propter regnum cælórum. Vos étiam, qui hoc nondum vovístis, qui potestis capere, cápite; perseveranter cúrrite, ut comprehendátis. Tóllite hostias quisque suas, et introíte in átria Dómini, non ex necessitáte, sed potestatem habéntes vestræ voluntátis. Cogitáte quidquid illud est: In muro ejus locum nominátum, meliórem multo quam filiórum atque filiárum. Cogitáte illic nomen ætérnum. Quis éxplicat quale nomen erit? Quidquid tamen erit, ætérnum erit. Hoc credéndo et sperándo et amando potuistis conjúgia, non devitáre prohíbita, sed transvoláre concéssa.
      responsory: |-
        R. O Sponsa Christi nóbilis! O mater venerábilis! intercéde pro nobis ad Dóminum, Regem Angelórum, quem semper puro corde dilexísti, in cujus ampléxibus sine fine pérmanes: * Ut remíttat nobis ómnia, quæcúmque in ipsum peccávimus.
        V. Tribuens nobis fervórem amóris sui sanctíssimi, et post hoc exsílium mansiónem cæléstis habitáculi.
        R. Ut remíttat nobis ómnia, quæcúmque in ipsum peccávimus.
      status: verified
