# Read directly from web/www/horas/Latin/Sancti/Bavaria/09-17-Hildegardis.txt's
# own [Oratio] (word-for-word the same as SanctiM/09-17M.txt's). No English
# counterpart exists in the reference engine -- the English text below is
# this project's own translation, marked draft accordingly.
collect:
  text: |
    Orémus.
    Deus, qui beátam Hildegárdem Vírginem tuam donis cæléstibus decorásti: tríbue, quæsumus;
    ut, ejus vestígiis et documéntis insisténtes, a præséntis sæculi calígine ad lucem tuam
    delectábilem transíre mereámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Ant+V/R+collect commemoration bundle, same combined-bundle shape as
# st-canute-commemoration.yml -- see hours/resolve-common.ts's
# sanctoralCommemorationPart. Ant is the Bavarian proper's own `[Ant 2]`
# ("O digníssima Christi sponsa", Sancti/Bavaria/09-17-Hildegardis.txt),
# the same antiphon her own Lauds Benedictus uses; it replaces the
# Monastic stub's "Sponsa Christi" antiphon. The source gives no versicle
# of its own, so Versum is borrowed from the Common of a Virgin's own
# de-Communi pairing (lauds-versicle-common-of-a-virgin.yml, already
# verified elsewhere). English Ant/collect are this project's own
# translation, marked draft.
commemoration:
  text: |
    Ant. O digníssima Christi sponsa! * quam lux prophetíæ illustrávit, zelus apostólicus inflammávit, divíni amóris incéndium consummávit.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, qui beátam Hildegárdem Vírginem tuam donis cæléstibus decorásti: tríbue, quæsumus; ut, ejus vestígiis et documéntis insisténtes, a præséntis sæculi calígine ad lucem tuam delectábilem transíre mereámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/Bavaria/09-17-Hildegardis.txt's
# own [Hymnus Vespera] ("Salve, nostra tu glória"). No English exists in the
# reference engine for the Bavarian files; translated here directly, marked
# draft.
vespers-hymn:
  text: |
    Salve, nostra tu glória.
    Exemplar es quæ virginum!
    Audi benigna supplices
    Tibi canéntes cánticum.

    O virgo, quæ mirábilis
    Vixísti amóris víctima,
    Et nunc beáris fúlgidis
    Cæli recépta sédibus.

    Vitæ per æquor túrbidum
    Tuos cliéntes dírige,
    Nobísque amícum cómpara,
    Cui te revínxit grátia.

    Sicut dolos intérrita
    Vicísti, et artes hóstium,
    Et robur in discrímine
    Sumens, nitébas púlchrior:

    Sic bella nos quot íngruunt
    Da, te favénte, fúndere,
    Virtútis almæ ac sémitam
    Vultu seréno cúrrere.

    Alat repóstam méntibus
    Fidem supérna cáritas;
    Mores adórnet aureos
    Intemeráta cástitas.

    Summo Parénti ac Fílio
    Tibíque, Sancte Spíritus,
    Sit laus, potéstas, glória,
    Per sempitérna sǽcula.
    Amen.
  status: verified

