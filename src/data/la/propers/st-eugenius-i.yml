# Matins Nocturn 2 reading for St. Eugenius I, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/06-02-EugeniusI.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Beáto Martíno hujus nóminis primo, tyrannica hærétici imperatóris senténtia Chersonam relegato, Theodoro exarcho instánte, Eugenius pátria Románus, qui fere a cunabulis sacro clericórum órdini se addixerat, absentis Pontíficis vices gessit, ne Románæ Ecclésiæ administratio cessasse omníno viderétur; sed hac revéra potestáte modeste uti visus est, cum probe sciret, Martíno vivénte se legitimum Pontíficem non esse, sed illíus dumtáxat quasi vices gerentem.

        Ubi vero prædíctus Christi Martyr, aërúmnis et inedia conféctus, ad beátam vitam migravisset, in cáthedra Petri, clero consentiente, ut legitimus Petri successor sedit, et in illo Apóstolici ministerii culmine talem se gessit, qualem supremi múneris ei crediti dígnitas, et ómnium Christi fidélium ejus curæ commissorum salus et utílitas postulabant; mitis enim fuit, benígnus et mansuetus, et, quod caput est, vitæ sanctimónia illústris.

        Singulárem cleri curam hábuit, quem patérno semper amóre et multis benefíciis prosecútus est. In egénos tamen mirábilis ejus beneficéntia enítuit, quibus réditus Ecclésiæ vivens et moriens liberali manu erogávit, appríme ratus, Ecclésiæ opes ad nobilióres usus applicari non posse, et ex mánibus indigentium ad æternitátis aërárium, cum incredíbili spirituális usuræ lucro, recta tradi. Transactis demum duóbus annis, et novem fere. ménsibus, sancto fine quiévit, anno Christi sexcentésimo quinquagésimo quinto, et ejus corpus in basílica sancti Petri recónditum fuit.
      status: verified
