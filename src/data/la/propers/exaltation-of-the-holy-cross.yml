# CORRECTED 2026-09-14 (user: "exaltation is not the same feast as
# finding" -- see exaltation-of-the-holy-cross.yml's own header for the
# full story). The previous version of this file (commit 7757ade)
# duplicated finding-of-the-holy-cross.yml's own antiphons verbatim,
# sourced from `SanctiM/05-03.txt` -- wrong file for this feast. The
# reference engine's own Monastic file for Sept 14,
# `../divinum-officium-reference/web/www/horas/Latin/SanctiM/09-14.txt`,
# carries its own distinct `[AntMatutinumM]` block (3 real proper
# antiphons) plus a separately-tagged `[Ant Matutinum 3N]` -- the source
# itself marks that one as the Nocturn 3 antiphon, so no guesswork on
# placement there. Nocturn 1/2 antiphons assigned in the source file's
# own listed order (AntMatutinumM:1 then :2); both fall within the psalm
# ranges continua already uses for those nocturns (tag 8 -> psalm 8,
# within nocturn1's [1,2,4,5,8,14]; tag 22 -> psalm 22, nocturn2's own
# first psalm in [22,26,75,95,96,97]), consistent with the existing
# one-shared-antiphon-per-nocturn structure. English from the parallel
# `English/SanctiM/09-14.txt`.
#
# The overall *structure* (one antiphon shared across all six psalms of
# each of Nocturn 1 and Nocturn 2, Nocturn 3 replaced by three Old
# Testament canticles) is unchanged from the previous version and is
# still correctly Monastic-sourced -- only the antiphon/versicle *text*
# was wrong. Versicles are untouched: the Monastic file's own [Versum 1]/
# [Versum 2]/[Nocturn 3 Versum] genuinely are `@Sancti/05-03` (shared with
# Finding by the source's own rule, not a duplication error).
matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 1
          - 2
          - 4
          - 5
          - 8
          - 14
        antiphon: Dulce lignum, dulces clavos, dulce pondus sustínuit, quæ sola digna fuit portáre prétium hujus sǽculi.
    versicle:
      v: Hoc signum Crucis erit in cælo.
      r: Cum Dóminus ad judicándum vénerit.
  nocturn2:
    groups:
      - psalms:
          - 22
          - 26
          - 75
          - 95
          - 96
          - 97
        antiphon: 'Virga tua, et báculus tuus: ipsa me consoláta sunt, Dómine, Deus meus.'
    versicle:
      v: Adorámus te, Christe, et benedícimus tibi.
      r: Quia per Crucem tuam redemísti mundum.
  nocturn3:
    antiphon: 'Mihi autem absit gloriári, nisi in cruce Dómini nostri Jesu Christi: per quem mihi mundus crucifíxus est, et ego mundo.'
    canticles:
      - refs:
          - book: hab
            chapter: 3
            verses: 1-6
      - refs:
          - book: hab
            chapter: 3
            verses: 7-12
      - refs:
          - book: hab
            chapter: 3
            verses: 13-19
    versicle:
      v: Omnis terra adóret te, et psallat tibi.
      r: Psalmum dicat nómini tuo, Dómine.

# Sancti/09-14.txt [Ant Laudes] (both languages), the five Lauds antiphons by position: three psalm groups, the canticle, Laudate. Psalmody is the 'Psalmi Dominica' scheme these feasts' [Rule] names (Ps 92 / 99 / 62, the Three Young Men, Ps 148-150), the same shape as apparition-of-st-michael.yml. Before this file the psalm antiphons fell to the ferial ones.
lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: 'O magnum pietátis opus: * mors mórtua tunc est, in ligno quando mórtua Vita fuit.'
    - psalms:
        - 99
      antiphon: 'Salva nos, * Christe Salvátor, per virtútem Crucis: qui salvásti Petrum in mari, miserére nobis.'
    - psalms:
        - 62
      antiphon: Ecce Crucem Dómini, * fúgite, partes advérsæ, vicit leo de tribu Juda, radix David, allelúia.
  canticle:
    id: canticum-trium-puerorum
    antiphon: Nos autem gloriári * opórtet in Cruce Dómini nostri Jesu Christi.
  laudate:
    antiphon: Per signum Crucis * de inimícis nostris líbera nos, Deus noster.

