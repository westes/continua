# Matins Nocturn 2-3 readings for the Exaltation of the Holy Cross (Sep
# 14).
#
# CORRECTED 2026-09-14 (user: "exaltation is not the same feast as
# finding" -- see exaltation-of-the-holy-cross.yml's own header). This
# file previously duplicated finding-of-the-holy-cross.yml's Nocturn 2
# reading verbatim (the legend of St. Helena finding the True Cross,
# May 3's own story) -- wrong: the reference engine's own Monastic file
# for this feast (`SanctiM/09-14.txt`) directs its own Lectio4-6 at
# `Sancti/09-14:Lectio4-6`, i.e. this feast's *own* distinct secular
# Sancti file, not Finding's. Sourced from
# web/www/horas/Latin/Sancti/09-14.txt's Lectio4-6 (Latin),
# English/Sancti/09-14.txt (English) -- the historical narrative of the
# Emperor Heraclius recovering the Cross from Chosroes, King of Persia,
# and restoring it to Calvary (614-629 AD), a genuinely different story
# from Finding's 4th-century St. Helena narrative.
#
# Nocturn 2's responsory is likewise this feast's own real, distinct
# text (SanctiM/09-14.txt's own Responsory4, "O crux benedícta...",
# English/SanctiM/09-14.txt's parallel) rather than Finding's.
#
# Nocturn 3 is unchanged and correctly still shared with Finding: the
# Monastic file's own Lectio9-12 directives resolve back to
# `Sancti/09-14:Lectio7` -- and that feast's own secular Lectio7 cites
# the *same* Gospel pericope (John 3:1-15, Nicodemus) and the same
# Augustine homily (Tractate 11 on John) that Finding's Lectio7 does --
# genuinely identical source content on both feasts, not a duplication
# error. (Lectio1-3, this feast's own proper Numbers 21:1-9 -- the
# brazen-serpent narrative that Nocturn 3's Gospel itself quotes -- is
# left to the bible-plan store as usual, same convention already used
# for Finding's own Nocturn 1.)
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Chósroas, Persárum rex, extrémis Phocæ impérii tempóribus, Ægýpto et Africa occupáta ac Jerosólyma capta multísque ibi cæsis Christianórum míllibus, Christi Dómini Crucem, quam Hélena in monte Calváriæ collocárat, in Pérsidem ábstulit. Itaque Heraclíus, qui Phocæ succésserat, multis belli incómmodis et calamitátibus afféctus, pacem petébat; quam a Chósroa, victóriis insolénte, ne iníquis quidem conditiónibus impetráre póterat. Quare in summo discrímine se assíduis jejúniis et oratiónibus exércens, opem a Deo veheménter implorábat; cujus mónitu exércitu comparáto, signa cum hoste cóntulit, ac tres duces Chósroæ cum tribus exercítibus superávit.

        Quibus cládibus fractus Chósroas, in fuga, qua traícere Tigrim parábat, Medársen fílium sócium regni desígnat. Sed eam contuméliam cum Síroës, Chósroæ major natu fílius, ferret atróciter, patri simul et fratri necem machinátur; quam paulo post utríque ex fuga retrácto áttulit, regnúmque ab Heraclío impetrávit quibúsdam accéptis conditiónibus, quarum ea prima fuit, ut Crucem Christi Dómini restitúeret. Ergo Crux, quatuórdecim annis postquam vénerat in potestátem Persárum, recépta est. Quam rédiens Jerosólymam Heraclíus solémni celebritáte suis húmeris rétulit in eum montem, quo eam Salvátor túlerat.

        Quod factum illústri miráculo commendátum est. Nam Heraclíus, ut erat auro et gemmis ornátus, insístere coáctus est in porta, quæ ad Calváriæ montem ducébat. Quo enim magis prógredi conabátur, eo magis retinéri videbátur. Cumque ea re et ipse Heraclíus et réliqui omnes obstupéscerent; Zacharías, Jerosolymórum antístes, Vide, inquit, imperátor, ne isto triumpháli ornátu, in Cruce ferénda parum Jesu Christi paupertátem et humilitátem imitére. Tum Heraclíus, abjécto amplíssimo vestítu detractísque cálceis ac plebéjo amíctu indútus, réliquum viæ fácile confécit, et in eódem Calváriæ loco Crucem státuit, unde fúerat a Persis asportáta. Itaque Exaltatiónis sanctæ Crucis solémnitas, quæ hac die quotánnis celebrabátur, illústrior habéri cœpit ob ejus rei memóriam, quod ibídem fúerit repósita ab Heraclío, ubi Salvatóri primum fúerat constitúta.
      responsory: |-
        R. O crux benedícta, * Quæ sola fuísti digna portáre Regem cælórum et Dóminum!
        V. O crux gloriósa et admirábilis o crux veneránda!
        R. Quæ sola fuísti digna portáre Regem cælórum et Dóminum!
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joannes 3:1-15
      text: 'In illo témpore: Erat homo ex pharisǽis, Nicodémus nómine, princeps Judæórum. Hic venit ad Jesum nocte et dixit ei: Rabbi, scimus, quia a Deo venísti magíster; nemo enim potest hæc signa fácere, quæ tu facis, nisi fúerit Deus cum eo. Respóndit Jesus et dixit ei: Amen, amen, dico tibi, nisi quis renátus fúerit dénuo, non potest vidére regnum Dei. Dicit ad eum Nicodémus: Quómodo potest homo nasci, cum sit senex? Numquid potest in ventrem matris suæ iteráto introíre et renásci? Respóndit Jesus: Amen, amen, dico tibi, nisi quis renátus fúerit ex aqua et Spíritu Sancto, non potest introíre in regnum Dei. Quod natum est ex carne, caro est: et quod natum est ex spíritu, spíritus est. Non míreris, quia dixi tibi: opórtet vos nasci dénuo. Spíritus, ubi vult, spirat, et vocem ejus audis, sed nescis, unde véniat aut quo vadat: sic est omnis, qui natus est ex spíritu. Respóndit Nicodémus et dixit ei: Quómodo possunt hæc fíeri? Respóndit Jesus et dixit ei: Tu es magíster in Israël, et hæc ignóras? Amen, amen, dico tibi, quia, quod scimus, lóquimur, et quod vídimus, testámur, et testimónium nostrum non accípitis. Si terréna dixi vobis et non créditis: quómodo, si díxero vobis cœléstia, credétis? Et nemo ascéndit in cœlum, nisi qui descéndit de cœlo, Fílius hóminis, qui est in cœlo. Et sicut Móyses exaltávit serpéntem in desérto: ita exaltári opórtet Fílium hóminis, ut omnis, qui credit in ipsum, non péreat, sed hábeat vitam ætérnam.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine of Hippo, Tractate 11 on John (on John 3:1-15)
      text: |-
        Nicodémus ex his erat, qui credíderant in nómine Jesu, vidéntes signa et prodígia quæ faciébat. Supérius enim hoc dixit: Cum autem esset Jerosólymis in Pascha in die festo, multi credidérunt in nómine ejus. Quare credidérunt in nómine ejus? Séquitur, et dicit: Vidéntes signa ejus, quæ faciébat. Et de Nicodémo quid dicit? Erat princeps Judæórum, nómine Nicodémus. Hic venit ad eum nocte, et ait illi: Rabbi, scimus quia a Deo venísti magíster. Et iste ergo credíderat in nómine ejus. Et ipse unde credíderat? Séquitur: Nemo enim potest hæc signa fácere, quæ tu facis, nisi fúerit Deus cum eo.

        Si ergo Nicodémus de illis multis erat, qui credíderant in nómine ejus, jam in isto Nicodémo attendámus, quare Jesus non se credébat eis. Respóndit Jesus et dixit ei: Amen, amen dico tibi, nisi quis renátus fúerit dénuo, non potest vidére regnum Dei. Ipsis ergo se credit Jesus, qui nati fúerint dénuo. Ecce illi credíderant in eum, et Jesus non se credébat eis. Tales sunt omnes catechúmeni: ipsi jam credunt in nómine Christi, sed Jesus non se credit eis. Inténdat et intélligat cáritas vestra. Si dixérimus catechúmeno: Credis in Christum? respóndet, Credo, et signat se Cruce Christi: portat in fronte, et non erubéscit de Cruce Dómini sui. Ecce credit in nómine ejus. Interrogémus eum: Mandúcas carnem Fílii hóminis, et bibis sánguinem Fílii hóminis? nescit quid dícimus, quia Jesus non se crédidit ei.
      status: verified
