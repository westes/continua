# Read directly from web/www/horas/Latin/Tempora/Quad1-5.txt's own
# [Oratio 2] and its English counterpart -- the Lauds/ordinary-hours
# collect. Distinct Vespers text ([Oratio 3]) is now modeled too, see
# ember-lent-friday-collect-vespers.yml.
collect:
  text: |
    Orémus.
    Esto, Dómine, propítius plebi tuæ: et, quam tibi facis esse devótam, benígno réfove miserátus auxílio.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Vespers collect ([Oratio 3] in the source), distinct from Lauds' own
# ([Oratio 2], see ember-lent-friday-collect.yml) — read from
# web/www/horas/{Latin,English}/Tempora/Quad1-5.txt. Retrofitted
# 2026-09-19 alongside the wider Lent-ferias campaign, same gap as
# ember-lent-wednesday-collect-vespers.yml. Lent Ember Saturday
# (Quad1-6.txt) has no [Oratio 3] of its own in the source, so no
# equivalent `ember-lent-saturday-collect-vespers.yml` file exists.
collect/~-vespers:
  text: |
    Orémus.
    Exáudi nos, miséricors Deus: et méntibus nostris grátiæ tuæ lumen osténde.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

