# Matins Nocturn content for Lent Ember Friday (Feria Sexta Quattuor
# Temporum Quadragesimæ) — Gospel pericope (John 5:1-15) sourced from
# web/www/missa/Latin/Tempora/Quad1-5.txt and missa/English/Tempora/
# Quad1-5.txt (horas/Tempora/Quad1-5.txt only gives the incipit + "Et
# réliqua"); homily sourced from horas/Latin/Tempora/Quad1-5.txt and
# horas/English/Tempora/Quad1-5.txt. No Monastic-track override exists —
# Latin/TemporaM/Quad1-5.txt is a bare `@Tempora/Quad1-5` pass-through
# (plus a Cistercian-only extra responsory, not used here).
#
# Recombined into one reading, same convention as ember-lent-wednesday.yml
# (see ember-september-friday.yml's own doc comment for the fuller
# rationale): St. Augustine's homily is one continuous text on the pool
# of Bethesda, split only to fill the fixed 3-lesson slot count.
# Responsory: unlike Wednesday, none of this day's own three (Responsory
# 1/2/3, all bare cross-references to the 1st Sunday of Lent's own
# generic Nocturn responsories, @Tempora/Quad1-0:Responsory4/5/6) is
# genuinely proper to Friday specifically — no tie-break available, so
# the "first one, when several collapse" convention (see
# ember-september-friday.yml) applies: Lectio1's own, Responsory4.
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Joann 5:1-15
      text: 'In illo témpore: Erat dies festus Judæórum, et ascéndit Jesus Jerosólymam. Est autem Jerosólymis Probática piscína, quæ cognominátur hebráice Bethsáida, quinque pórticus habens. In his jacébat multitúdo magna languéntium, cæcórum, claudórum, aridórum exspectántium aquæ motum. Angelus autem Dómini descendébat secúndum tempus in piscínam, et movebátur aqua. Et, qui prior descendísset in piscínam post motiónem aquæ, sanus fiébat, a quacúmque detinebátur infirmitáte. Erat autem quidam homo ibi, trigínta et octo annos habens in infirmitáte sua. Hunc cum vidísset Jesus jacéntem, et cognovísset, quia jam multum tempus habéret, dicit ei: Vis sanus fíeri? Respóndit ei lánguidus: Dómine, hóminem non hábeo, ut, cum turbáta fúerit aqua, mittat me in piscínam: dum vénio enim ego, álius ante me descéndit. Dicit ei Jesus: Surge, tolle grabátum tuum, et ámbula. Et statim sanus factus est homo ille: et sústulit grabátum suum, et ambulábat. Erat autem sábbatum in die illo. Dicébant ergo Judǽi illi, qui sanátus fúerat: Sábbatum est, non licet tibi tóllere grabátum tuum. Respóndit eis: Qui me sanum fecit, ille mihi dixit: Tolle grabátum tuum, et ámbula. Interrogavérunt ergo eum: Quis est ille homo, qui dixit tibi: Tolle grabátum tuum et ámbula? Is autem, qui sanus fúerat efféctus, nesciébat, quis esset. Jesus enim declinávit a turba constitúta in loco. Póstea invénit eum Jesus in templo, et dixit illi: Ecce, sanus factus es: jam noli peccáre, ne detérius tibi áliquid contíngat. Abiit ille homo, et nuntiávit Judǽis, quia Jesus esset, qui fecit eum sanum.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tract 17 on John (on the pool of Bethesda)
      text: |-
        Videámus quid volúerit significáre in illo uno, quem étiam ipse servans unitátis mystérium, de tot languéntibus unum sanáre dignátus est. Invénit in annis ejus númerum quemdam languóris: trigínta et octo annos habébat in infirmitáte. Hic númerus quómodo magis ad languórem pertíneat, quam ad sanitátem, paulo diligéntius exponéndum est. Inténtos vos volo: áderit Dóminus, ut cóngrue loquar, et sufficiénter audiátis. Quadragenárius númerus sacrátus nobis in quadam perfectióne commendátur; notum esse árbitror caritáti vestræ: testántur sæpíssime divínæ Scriptúræ: jejúnium hoc número consecrátum esse, bene nostis. Nam et Móyses quadragínta diébus jejunávit, et Elías tótidem: et ipse Dóminus noster et Salvátor Jesus Christus hunc jejúnii númerum implévit. Per Móysen significátur Lex, per Elíam significántur Prophétæ, per Dóminum significátur Evangélium. Ideo in illo monte tres apparuérunt, ubi se discípulis osténdit in claritáte vultus et vestis suæ: appáruit enim médius inter Móysen et Elíam, tamquam Evangélium testimónium habéret a Lege et Prophétis.

        Sive ergo in Lege, sive in Prophétis, sive in Evangélio, quadragenárius númerus nobis in jejúnio commendátur. Jejúnium autem magnum et generále est, abstinére ab iniquitátibus et illícitis voluptátibus sǽculi, quod est perféctum jejúnium: Ut abnegántes impietátem et sæculáres cupiditátes, temperánter et juste et pie vivámus in hoc sǽculo. Huic jejúnio quam mercédem addit Apóstolus? Séquitur et dicit: Exspectántes illam beátam spem, et manifestatiónem glóriæ beáti Dei et Salvatóris nostri Jesu Christi. In hoc ergo sǽculo quasi quadragésimam abstinéntiæ celebrámus, cum bene vívimus, cum ab iniquitátibus et ab illícitis voluptátibus abstinémus: sed quia hæc abstinéntia sine mercéde non erit, exspectámus beátam illam spem, et revelatiónem glóriæ magni Dei et Salvatóris nostri Jesu Christi. In illa spe, cum fúerit de spe facta res, acceptúri sumus mercédem denárium. Ipsa enim merces rédditur operáriis in vínea laborántibus, secúndum Evangélium, quod vos credo reminísci: neque enim ómnia commemoránda sunt tamquam rúdibus et imperítis. Denárius ergo, qui accépit nomen a número decem, rédditur, et conjúnctus quadragenário fit quinquagenárius: unde cum labóre celebrámus Quadragésimam ante Pascha; cum lætítia vero, tamquam accépta mercéde, Quinquagésimam post Pascha.

        Mementóte quod proposúerim númerum trigínta octo annórum in illo lánguido. Volo expónere, quare númerus ille trigésimus et octávus, languóris sit pótius quam sanitátis. Ergo, ut dicébam, cáritas implet Legem: ad plenitúdinem Legis in ómnibus opéribus pértinet quadragenárius númerus. In caritáte autem duo præcépta nobis commendántur: Díliges Dóminum Deum tuum ex toto corde tuo, et ex tota ánima tua, et ex tota mente tua: et díliges próximum tuum sicut teípsum. In his duóbus præcéptis tota Lex pendet, et Prophétæ. Mérito et illa vídua omnes facultátes suas, duo minúta misit in dona Dei: mérito et pro illo lánguido a latrónibus sauciáto stabulárius duos nummos accépit, unde sanarétur: mérito apud Samaritános bíduum fecit Jesus, ut eos caritáte firmáret. Binário ergo isto número cum áliquid boni significátur, máxime bipertíta cáritas commendátur. Si ergo quadragenárius númerus habet perfectiónem Legis, et Lex non implétur nisi in gémino præcépto caritátis: quid miráris, quia languébat, qui ad quadragínta, duo minus habébat?
      responsory: |-
        R. Emendémus in mélius, quæ ignoránter peccávimus: ne súbito præoccupáti die mortis, quærámus spátium pœniténtiæ, et inveníre non possímus: * Atténde, Dómine, et miserére, quia peccávimus tibi.
        V. Adjuva nos, Deus salutáris noster, et propter honórem nóminis tui, Dómine, líbera nos.
        R. Atténde, Dómine, et miserére, quia peccávimus tibi.
      status: verified
