# Matins Nocturn 2 reading for St. Agnes, Virgin and Martyr, Second Feast
# (Jan 28) — pre-1955-but-post-1617. Plain Sancti/01-28.txt is a
# different, later saint (St. Peter Nolasco) who displaced this second
# Agnes feast on the general calendar's own Jan 28 slot; her content
# survives at the suffixed sibling file (see memory
# vu-matins-pre1955-saints's "critical wrinkle").
# web/www/horas/Latin/Sancti/01-28t.txt, English/Sancti/01-28t.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Beáta Agnes, paréntibus ad ejus sepúlcrum assidue vigilántibus, quadam nocte choro vírginum comitáta cum apparuísset, sic ad eos locuta dícitur: Ne me, paréntes, mortuam lugeátis; nam una cum his virgínibus vivo apud illum in cælis, quem in terris tota mente diléxi. Cum aliquot post annos Constantia, Constantini imperatóris fília, insanábili úlceri medicinam quærens, nondum christiana ad idem sepúlcrum accessísset; obdórmiscens sibi audíre visa est vocem hanc Agnetis: Constanter age, Constántia: crede in Jesum Christum Fílium Dei, qui te sanam fáciet. Quæ sanata, paulo post una cum multis ex família imperatóris baptismum suscípiens, ibi ecclésiam nómine beátæ Agnétis ædificávit.'
      status: verified
