# Duplicated from all-saints.yml (Vespers psalmody override) — same
# cross-id reuse already established for this feast's collect
# (`propers: "all-saints"` in calendar/saints/octave-of-all-saints.yml)
# and its Matins Nocturn 1 content; the Octave Day keeps All Saints' own
# real Vespers psalmody rather than falling through to the plain ferial
# default. Not independently live-queryable on its own date (Nov 8 is
# contested with ss-four-crowned-martyrs, whose simplex rank the Octave's
# duplex-majus outranks per the kalendarium's own "In Octava Omnium
# Sanctorum" primary / "Ss. Quatuor Coronatorum" secondary listing — see
# that file's header — so a plain live query on Nov 8 doesn't surface a
# separate real answer to check against; reasoned from the collect's own
# established precedent instead).
vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: Vidi turbam magnam, * quam dinumeráre nemo póterat, ex ómnibus géntibus, stantes ante thronum.
    - psalms:
        - 111
      antiphon: Et omnes Ángeli * stabant in circúitu throni, et cecidérunt in conspéctu throni in fácies suas, et adoravérunt Deum.
    - psalms:
        - 112
      antiphon: Redemísti nos, * Dómine Deus, in sánguine tuo ex omni tribu, et lingua, et pópulo, et natióne, et fecísti nos Deo nostro regnum.
    - psalms:
        - 115
      antiphon: 'Hymnus * ómnibus Sanctis ejus: fíliis Israël, pópulo appropinquánti sibi: glória hæc est ómnibus sanctis ejus.'

