# Verified against Divinum Officium (Monastic Tridentinum 1617), 2026-08.
# Pulled from the reference engine's own era-specific calendar table
# (web/www/Tabulae/Kalendaria/1570.txt + M1617.txt, own title
# "Ss. Martyris Mauritii et Sociorum") and its own source file, not the merged per-date
# files those tables' fileref points at directly -- see TODO.md.
collect:
  text: |
    Orémus.
    Annue, quǽsumus, omnípotens Deus: ut sanctórum Mártyrum tuórum Maurítii et Sociórum ejus nos lætíficet festíva solémnitas; ut, quorum suffrágiis nítimur, eórum natalíciis gloriémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-several-martyrs (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). ss-maurice-and-companions has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is the saint's own
# real proper (ss-maurice-and-companions-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Vestri capílli cápitis * omnes numeráti sunt: nolíte timére: multis passéribus melióres estis vos.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    Annue, quǽsumus, omnípotens Deus: ut sanctórum Mártyrum tuórum Maurítii et Sociórum ejus nos lætíficet festíva solémnitas; ut, quorum suffrágiis nítimur, eórum natalíciis gloriémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Matins Nocturn 2 reading for Ss. Maurice and Companions, Martyrs of
# the Theban Legion (Sep 22). No genuine SanctiM match: the correct
# Tridentine file is the suffixed `Sancti/09-22o.txt` (the plain
# `Sancti/09-22.txt` is St. Thomas of Villanova instead), and the only
# SanctiM file for this date, `SanctiM/09-22b.txt`, is unrelated own
# content — a missed pre-1955-pool candidate rather than a genuine
# SanctiM case (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/09-22o.txt, English/Sancti/09-22o.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Cum Maximiánus imperátor, ducto in Gálliam exercitu, in fínibus Sedunórum sacrifícii causa constitísset, Thebæórum legio, ne se impiórum sacrórum societáte contamináret, a réliquis cópiis discéssit. Quare imperátor misit ad eos mílites, qui suo nómine nuntiárent ut, si salvi esse vellent, in castra ad sacrifícia redírent: qui se christiána religióne impedíri respondérunt. Quorum respónsum ille indigníssime ferens, majori iracúndia quam antea exársit. Itaque, immíssa parte exércitus in Thebǽos, décimum quemque eórum primum occídi jussit; quod martýrium sua sponte, maximéque hortatóre Maurítio, ferre maluérunt quam imperáta fácere nefárii imperatóris. Ac deínde réliquos omnes, constantíssime Christum prædicántes, décimo Kaléndas Octóbris ab univérso exércitu trucidári ímperat.'
      status: verified
