# Matins Nocturn 2 reading for St. Silvester, Abbot (Nov 26, sharing
# the date with St. Peter of Alexandria — see st-peter-of-alexandria.yml)
# — SanctiM/11-26.txt inherits the whole day (`@Sancti/11-26`) with no
# Nocturn 2/3 override, so this saint's own vita is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/11-26.txt, English/Sancti/11-26.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Silvester, Auximi in Piceno nobili genere ortus, statim puerílem ætátem litteris ac bonis móribus mirifice exornavit. Adoléscens, Bonóniam ad stúdia jurisprudéntiæ missus a patre, cum sacris litteris, a Deo mónitus, dedísset operam, parentis incurrit indignatiónem; quam æquo animo toto decennio pértulit. Ob egregiam ejus virtútem a canonicis cathedralis Auximanæ ecclésiæ socius honoris eléctus est; in quo munere pópulo oratiónibus, exemplo et conciónibus opem tulit.

        Inter funus nobilis cujusdam defuncti, in aperto tumulo formosi viri suique propinqui deforme cadáver conspíciens: Ego, inquit, sum, quod hic fuit; quod hic est, ego ero. Et mox, peracto funere, illa sibi Dómini occurrénte senténtia: Qui vult veníre post me, ábneget semetípsum, et tollat crucem suam, et sequátur me; in solitúdinem, majoris perfectiónis studio, secessit, ibique vigiliis, oratiónibus jejuniisque deditus, crudas tantum herbas in cibum sæpius adhibuit. Ut autem magis latéret hómines, varias mutavit sedes; ac demum pervenit ad montem Fanum, locum, quamvis prope Fabrianum, eo tamen témpore desértum, ibique in honórem sanctíssimi patris Benedicti templum eréxit, congregatiónisque Silvestrinórum fundaménta jecit, sub regula et habitu in visióne sibi ab eodem Sancto osténsis.

        At ínvidens sátanas variis terróribus illíus monachos turbare nitebátur, noctu monasterii jánuas hostíliter invadens. Sed vir Dei, hostis impetum ita repressit, ut monachi in sancto instituto magis confirmaréntur ac patris sanctitátem agnoscerent. Spíritu prophetíæ aliisque donis enituit. Quæ ut semper profúnda humilitate conservavit, ita contra se dæmonis invidiam concitavit; a quo præceps actus per scalas oratórii, et prope interimendus, præsentíssimo Vírginis benefício incolumitáti redditus est. Quod benefícium perpetua et singulari in illam pietáte commendavit ad ultimum usque vitæ spíritum, quem, fere nonagenarius, sanctitáte et miraculis clarus, Deo réddidit anno salútis millesimo ducentésimo sexagesimo séptimo, sexto Kalendas Decembris. Ejus Offícium ac Missam Leo décimus tertius Pontifex maximus ad universam exténdit Ecclésiam.
      status: verified
