# Matins Nocturn 2 and 3 readings for the Holy Lance and Nails (Friday of Lent 1).
# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt.
# Nocturn 2: Lectio4-6, Pope Innocent VI's decree instituting the feast, one
# continuous reading, its closing responsory the source's Responsory6. Nocturn 3:
# the Gospel (John 19:28-35, from the source's Mass Gospel via Commune/Votiva/V6)
# and then St. Augustine's Tractate 120 on John (the source takes Lectio7-8 from
# Tempora/Pent03-5: the homily of Lectio7, then Lectio8 cut at "Et qui vidit",
# closed by the source's own Lectio8 in finis), its closing responsory the
# source's Responsory8. Nocturn 1 (Zach 12-13) is not carried: continua's first
# nocturn runs the Scripture course.
#
# The English of the Augustine homily is the reference engine's English of
# Tempora/Pent03-5 (already used in octave-readings/sacred-heart-octave-day-8.yml),
# trimmed the way the Latin is; everything else is this project's own translation,
# marked draft.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope Innocent VI, Decree on the Feast of the Lance and Nails
      text: |
        In Redemptóris nostri Domini Jesu Christi sacratíssima passióne sic nos gloriári opórtet, ut ipsíus passiónis cuncta mystéria dinumerántes et mérita, síngulis etiam ejus salutáribus instruméntis gloriémur. Inter quæ illud celébriter memorándum est, quod ipse Salvátor, emísso in cruce jam spíritu, sustínuit perforári láncea latus suum, ut inde sánguinis et aquae profluéntibus undis, formarétur única, et immaculáta, ac virgo sancta mater Ecclésia, sponsa sua. O beatíssima ipsíus sacri láteris apertúra, unde nobis tot et tanta divínae pietátis dona fluxérunt! O felix láncea, quæ tot bona nobis effícere, et ad tanti triúmphi glóriam méruit superáddi!

        Hæc latus ipsum aperiéndo, sacratissimas jánuas nobis regni cœlestis apéruit. Hæc vulnerando jam mórtuum, vúlnera nostra sanávit, vitámque nobis réddidit et salútem. Hæc innoxium transfigendo, illíus sánguine culpas nostras abstersit: et demum ejúsdem sacratissimis undis irrigata, cæcitatis nostræ ténebras sústulit, et nos ipsíus divínæ pietátis fluviis mundavit. Illi étiam dulces clavi, quibus ipse Salvátor eídem cruci fuit affixus, quique non solum immaculáto respergi sánguine, et molem ferre tanti ponderis meruérunt, sed et nos étiam per ipsórum salutiferas plagas dulcedinem tantam ipsíus divínæ caritátis accépimus, ut manus nostræ a peccáti solutæ nexibus, pedesque nostri a mortis laqueis fúerint liberáti, sunt devotissime recolendi.

        Quid enim vúlnere et plagis hujúsmodi sánctius? Quid eis salúbrius, ex quibus salus nostra procéssit, et in quibus assídue se possunt curare ánimæ devotorum? Licet ígitur láncea et clavi prædicti, aliáque ipsíus passiónis salutaria instrumenta sint a cunctis fidélibus Christi ubilibet veneránda, et de ipsa étiam passióne in eádem Ecclésia solémnia annis síngulis Offícia celebrentur et fiant; dignum tamen et conveniens reputamus, si de ipsíus passiónis specialibus instrumentis, et præsértim in pártibus, in quibus instrumenta ipsa dicúntur habéri, solémne ac speciale festum celebrétur et fiat, nosque illos fidéles Christi, qui áliqua ex instrumentis ipsíus habére se gaudent, in eórum devotióne divínis Offíciis atque munéribus specialiter foveamus.
      responsory: |
        R. Dicetur ei: Quid sunt plagæ istæ in médio mánuum tuárum? Et dicet: * His plagatus sum in domo eórum qui diligebant me.
        V. Nisi videro in mánibus ejus fixuram clavorum, non credam.
        R. His plagatus sum in domo eórum qui diligebant me.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joann 19:28-35
      text: 'In illo témpore: Sciens Jesus, quia ómnia consummáta sunt, ut consummarétur Scriptúra, dixit: Sítio. Vas ergo erat pósitum acéto plenum. Illi autem spóngiam plenam acéto, hyssópo circumponéntes, obtulérunt ori ejus. Cum ergo accepísset Jesus acétum, dixit: Consummátum est. Et inclináto cápite trádidit spíritum. Judǽi ergo (quóniam Parascéve erat), ut non remanérent in cruce córpora sábbato (erat enim magnus dies ille sábbati), rogavérunt Pilátum, ut frangeréntur eórum crura et tolleréntur. Venérunt ergo mílites: et primi quidem fregérunt crura et altérius, qui crucifíxus est cum eo. Ad Jesum autem cum veníssent, ut vidérunt eum jam mórtuum, non fregérunt ejus crura, sed unus mílitum láncea latus ejus apéruit, et contínuo exívit sanguis et aqua. Et qui vidit, testimónium perhíbuit: et verum est testimónium ejus.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Tractate 120 on John, nn. 2-3
      text: |
        Ad Jesum autem cum veníssent, ut vidérunt eum jam mórtuum, non fregérunt ejus crura, sed unus mílitum láncea latus ejus apéruit, et contínuo exívit sanguis et aqua. Vigilánti verbo Evangelísta usus est, ut non díceret: latus ejus percússit, aut vulnerávit, aut quid áliud, sed apéruit, ut illic quodámmodo vitæ óstium panderétur, unde Sacraménta Ecclésiæ manavérunt, sine quibus ad vitam, quæ vera vita est, non intrátur. Ille sanguis in remissiónem fusus est peccatórum. Aqua illa salutáre témperat póculum, hæc et lavácrum præstat et potum. Hoc prænuntiábat quod Noë in látere arcæ óstium fácere jussus est, qua intrárent animália quæ non erant dilúvio peritúra, quibus præfigurabátur Ecclésia.

        Propter hoc prima múlier facta est de látere viri dormiéntis, et appelláta est vita matérque vivórum. Magnum quippe significávit bonum, ante magnum prævaricatiónis malum. Hic secúndus Adam, inclináto cápite, in cruce dormívit, ut inde formarétur ejus conjux, quæ de látere dormiéntis efflúxit. O mors unde mórtui revivíscunt! Quid isto sánguine múndius? Quid vúlnere isto salúbrius? Facta sunt enim hæc, inquit, ut Scriptúra implerétur: Os non comminuétis ex eo. Et íterum ália Scriptúra dicit: Vidébunt in quem transfixérunt.
      responsory: |
        R. Effúndam super domum David, et super habitatóres Jerúsalem spíritum grátiæ et precum: * Et aspicient ad me, quem confixerunt.
        V. Et plangent eum planctu quasi super unigénitum.
        R. Et aspicient ad me, quem confixerunt.
      status: verified
