  text: Christum láncea et clavis vulnerátum, * Veníte adorémus.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt (Duplex majus, Friday of the first week of Lent). English is this project's own translation, marked draft.
lauds-capitulum:
  text: 'Quis est autem qui vincit mundum, nisi qui credit quóniam Jesus est Fílius Dei? hic est, qui venit per aquam et sánguinem, Jesus Christus: non in aqua solum, sed in aqua et sánguine.'
  citation: 1 Joann 5:5-6
  status: verified

# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt (Duplex majus, Friday of the first week of Lent). English is this project's own translation, marked draft.
lauds-hymn:
  text: |
    Tinctam ergo Christi sánguine
    Convertite in me cuspidem,
    Ferite cor, pedes, manus
    Pœnam a nocente súmite.

    At quæso culpis débitas
    Quas jure plagas figitis,
    Cruóre divíno illitæ
    Fiant medele spíritus.

    Sit gressus ad malum impotens,
    Manus nocére desinant,
    Omnísque corde e saucio
    Profanus ardor éxeat.

    Clavis foráto et láncea,
    Jesu, tibi sit glória,
    Cum Patre, et almo Spíritu,
    Nunc, et per omne sǽculum.
    Amen.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt (Duplex majus, Friday of the first week of Lent). English is this project's own translation, marked draft.
