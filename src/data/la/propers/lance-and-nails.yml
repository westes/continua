# Collect of The Holy Lance and Nails of Our Lord Jesus Christ. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt (Duplex majus, Friday of the first week of Lent). English is this project's own translation, marked draft.
collect:
  text: |
    Orémus.
    Deus, qui in assúmptæ carnis infirmitáte Clavis affigi, et Láncea vulnerári pro mundi salúte voluísti: concéde propítius; ut qui eorúmdem Clavorum et Lanceæ solémnia venerámur in terris, de glorióso victóriæ tuæ triumpho gratulemur in cœlis:
    Qui vivis et regnas cum Deo Patre in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt (Duplex majus, Friday of the first week of Lent). English is this project's own translation, marked draft.
matins-hymn:
  text: |
    Salvete clavi et láncea,
    Squalóre nuper óbsita,
    Quæ mersa Christi córpori
    Almo rubétis sánguine.

    Vos ad scelus Judáica
    Elégerat perfída;
    Sed in minístra grátiæ
    Vos vertit e cœlo Deus.

    Nam quot sacrátis ártubus
    Sculpsístis olim vúlnera,
    E tot reclúsis fóntibus
    Dona éffluunt cœléstia.

    Clavis foráto et láncea,
    Jesu, tibi sit glória,
    Cum Patre, et almo Spíritu,
    Nunc, et per omne sǽculum.
    Amen.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt (Duplex majus, Friday of the first week of Lent). English is this project's own translation, marked draft.
