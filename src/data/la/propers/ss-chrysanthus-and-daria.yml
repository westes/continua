# Matins Nocturn 2 reading for Ss. Chrysanthus and Daria, Martyrs
# (Oct 25) — SanctiM/10-25.txt inherits the whole day (`@Sancti/10-25`)
# with no Nocturn 2/3 override, so this feast's own proper content is
# sourced from the Tridentine track exactly as for a pre-1955 saint
# (see memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/10-25.txt, English/Sancti/10-25.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Chrysanthus et Daría cónjuges, nobili genere nati, fide étiam clariores, quam Daría, maríti opera, cum baptismo susceperat; Romæ innumerábilem hóminum multitúdinem, hæc mulíerum, ille virórum, ad Christum convertérunt. Quare Celerinus præfectus comprehensos trádidit Cláudio tribuno, qui jussit a milítibus Chrysanthum vinctum cruciátibus torqueri; sed víncula ómnia resoluta sunt, mox cómpedes, in quos conjéctus fuerat, confracti. Deínde, bovis corio inclusum, in ardentíssimo sole constituunt. Tum, pédibus ac mánibus catena constrictis, in obscurum carcerem detrudunt; ubi, solutis catenis, claríssima lux locum illustrávit. Daría veri in lupánar compulsa, leónis tutela, dum in oratióne defixa est, a contumelia divinitus defensa est. Denique in arenariam, quæ est via Salaria, uterque ductus, effossa terra, lapidibus óbruti, parem martyrii corónam adepti sunt.
      status: verified
