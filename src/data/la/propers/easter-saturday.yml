# web/www/horas/English/Tempora/Pasc0-6.txt). See easter-monday-collect.yml's
# own header for sourcing/status convention.
collect:
  text: |
    Orémus.
    Concéde, quǽsumus, omnípotens Deus: ut, qui festa paschália venerándo égimus, per hæc contíngere ad gáudia ætérna mereámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft
  temporal: true

