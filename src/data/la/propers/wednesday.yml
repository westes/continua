# Wednesday's own plain ferial Matins invitatory antiphon (Psalterium/
# Special/Matutinum Special.txt's "Invit Trid_" block, `Feria IV=`).
# See matins-invitatory-antiphon-sunday.yml's header for the weekday-cycle
# mechanism this belongs to; live-verified 2026-09-06.
matins-invitatory/antiphon-~:
  text: In manu tua, Dómine, * Omnes fines terræ.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds live query.
lauds-hymn:
  text: |
    Nox, et tenébræ, et núbila,
    Confúsa mundi et túrbida:
    Lux intrat, albéscit polus:
    Christus venit: discédite.

    Calígo terræ scínditur
    Percússa solis spículo,
    Rebúsque jam color redit,
    Vultu niténtis síderis.

    Te, Christe, solum nóvimus:
    Te mente pura et simplici,
    Flendo et canéndo quǽsumus,
    Inténde nostris sénsibus.

    Sunt multa fucis íllita,
    Quæ luce purgéntur tua:
    Tu, lux Eói síderis,
    Vultu seréno illúmina.

    * Deo Patri sit glória,
    Ejúsque soli Fílio,
    Cum Spíritu Paráclito,
    Et nunc, et in perpétuum.
    Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds live query.
lauds-responsory:
  text: |
    R.br. Sana ánimam meam, * Quia peccávi tibi.
    R. Sana ánimam meam, * Quia peccávi tibi.
    V. Ego dixi: Dómine, miserére mei
    R. Quia peccávi tibi.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Sana ánimam meam, * Quia peccávi tibi.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds live query.
lauds-versicle:
  text: |-
    V. Repléti sumus mane misericórdia tua.
    R. Exsultávimus, et delectáti sumus.
  status: verified

# Sourced from Divinum Officium's Monastic block ("[HymnusM Day3 Vespera]",
# Psalterium/Special/Major Special.txt): three substitutions against the
# base "[Hymnus Day3 Vespera]" text ("mundi plagas" -> "centrum poli";
# "Dum solis accéndis rotam" -> "Solis rotam constítuens"; "Expélle noctem
# córdium:" -> "Illúmina cor hóminum,"), applied by hand here — not
# live-query-verified (see TODO.md). English has no separate Monastic
# variant in the source.
vespers-hymn:
  text: |
    Cæli Deus sanctíssime,
    Qui lúcidas centrum poli
    Candóre pingis ígneo,
    Augens decóro lúmine:

    Quarto die qui flámmeam
    Solis rotam constítuens,
    Lunæ minístras órdinem,
    Vagósque cursus síderum:

    Ut nóctibus, vel lúmini
    Diremptiónis términum,
    Primórdiis et ménsium
    Signum dares notíssimum;

    Illúmina cor hóminum,
    Abstérge sordes méntium:
    Resólve culpæ vínculum:
    Evérte moles críminum.

    * Præsta, Pater piíssime,
    Patríque compar Únice,
    Cum Spíritu Paráclito
    Regnans per omne sǽculum.
    Amen.
  status: draft
