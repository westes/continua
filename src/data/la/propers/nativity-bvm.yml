octave-readings/~-octave-day-5:
  source: Sermo Sancti Joánnis Chrysóstomi.
  text: |
    Dei Fílius non díuitem, aut locuplétem áliquam féminam sibi matrem elégit, sed beátam vírginem illa, cujus ánima virtútibus ornáta erat. Cum enim beáta María supra omnem humánam natúram castitátem seruáret, proptérea Christum Dóminum in ventre concépit. Ad hanc ígitur sanctíssimam vírginem et Dei matrem accurréntes, ejus patrocíniis utilitátem assequámur. Ítaque quacúmque estis vírgines, ad matrem Dómini confúgite. Illa enim pulchérrimam, pretiosíssimam, et incorruptíbilem possessiónem patrocínio suo vobis conservábit.

    Magnum reuéra miráculum, fratres dilectíssimi, fuit beáta semper virgo María. Quid namque illa majus aut illústrius ullo umquam témpore inuéntum est, seu aliquándo inveníri póterit? Hæc sola cælum ac terram amplitúdine superávit. Quidnam illa sánctius? Non Prophétæ, non Apóstoli, non Mártyres, non Patriárchæ, non Ángeli, non Throni, non Dominatiónes, no Séraphim, non Chérubim, non dénique áliud quídpiam inter creátas res visíbiles aut inuisíbiles, majus aut excelléntius inveníri potest. Eadem ancílla Dei est et mater: éadem virgo et génitrix.

    Hac ejus mater est, qui a Patre ante omne princípium génitus suit, que Ángeli et hómines agnóscunt Dóminum rerum ómnium. Vis ne cognóscere, quanto virgo hæc præstántior fit cæléstibus poténtis? Illæ cum timóre et tremóre assistunt, fáciem velántes suam: hæc humánum genus illi offert quem génuit. Per hanc et peccatórum véniam conséquimur. Ave ígitur mater, cælum, puélla, virgo, thronus, Ecclésiæ nostræ decus, glória et firmaméntum, assídue pro nobis precáre Jesum fílium tuum et Dóminum nostrum: ut per te misericórdiam inveníre in die judícij, et quæ repósita sunt iis qui díligunt Deum, bona cónsequi possímus, grátia et benignitáte Dómini nostri Jesu Christi: cum quo Patri simul et sancto Spirítui glória, honor, et impérium nunc et semper in sǽcula sæculórum, Amen.
  responsory: |
    R. Hódie nata est beáta Virgo María ex progénie David; * Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo. V. Nativitátem beátæ Maríæ Vírginis cum gáudio celebrémus. R. Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo.
  status: verified

