# Matins Nocturn 2 reading for the Nativity of the B.V.M. (Sep 8) —
# SanctiM/09-08.txt inherits the whole day (`@Sancti/09-08`) with no
# Nocturn 2/3 override, so this feast's own proper content is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/09-08.txt, English/Sancti/09-08.txt.
# Lectio4-6 combined into one reading, one continuous excerpt of St.
# Augustine's sermon. No responsory given in the source for these
# lessons.
#
# Checked 2026-09-05 for a Gospel pairing: this reading (Augustine's
# Sermon 18, Lectio4-6) is Nocturn 2, not Nocturn 3 -- it is a
# panegyric on Mary's nativity generally, not an exegesis of a Gospel
# pericope, so no isGospel pairing applies to it.
#
# Update (2026-09-05, second pass): Nocturn 3 now authored too --
# horas/Latin/Sancti/09-08.txt's own Lectio7-9 (Gospel Matt 1:1-16, the
# genealogy, bare incipit; St. Jerome's Commentary on Matthew Bk. 1 as
# the homily, Lectio7's own portion + Lectio8-9 combined per this
# store's recombine convention). Full Gospel pericope sourced from this
# feast's own Missale [Evangelium] (missa/Latin/Sancti/09-08.txt's own
# `@Sancti/08-16` redirect, St. Hyacinth's date reusing the same
# genealogy text), English the parallel missa/English/Sancti/08-16.txt.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 18 on the Saints
      text: |-
        Adest nobis, dilectíssimi, optátus dies beátæ ac venerábilis semper Vírginis Maríæ; ídeo cum summa exsultatióne gáudeat terra nostra, tantæ Vírginis illustráta natáli. Hæc est enim flos campi, de qua ortum est pretiósum lílium convállium, per cujus partum mutátur natúra protoplastórum, delétur et culpa. Præcísum est in ea illud Hevæ infelicitátis elógium, quo dícitur: In dolóre páries fílios tuos; quia ista in lætítia Dóminum péperit.

        Heva enim luxit, ista exsultávit: Heva lácrimas, María gáudium in ventre portávit; quia illa peccatórem, ista édidit innocéntem. Mater géneris nostri pœnam íntulit mundo, Génetrix Dómini nostri salútem íntulit mundo. Auctrix peccáti Heva, auctrix mériti María. Heva occidéndo óbfuit, María vivificándo prófuit. Illa percússit, ista sanávit. Pro inobediéntia enim obediéntia commutátur, fides pro perfídia compensátur.

        Plaudat nunc órganis María, et inter velóces artículos týmpana puérperæ cóncrepent. Cóncinant lætántes chori, et alternántibus módulis dulcísona cármina misceántur. Audíte ígitur, quemádmodum tympanístria nostra cantáverit; ait enim: Magníficat ánima mea Dóminum: et exsultávit spíritus meus in Deo, salutári meo. Quia respéxit humilitátem ancíllæ suæ: ecce enim ex hoc beátam me dicent omnes generatiónes. Quia fecit mihi magna qui potens est. Causam ígitur invalescéntis erráti, miráculum novi partus evícit; et Hevæ planctum Maríæ cantus exclúsit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 1:1-16
      text: 'Liber generatiónis Jesu Christi, fílii David, fílii Abraham. Abraham génuit Isaac. Isaac autem génuit Jacob. Jacob autem génuit Judam et fratres ejus. Judas autem génuit Phares et Zaram de Thamar. Phares autem génuit Esron. Esron autem génuit Aram. Aram autem génuit Amínadab. Amínadab autem génuit Naásson. Naásson autem génuit Salmon. Salmon autem génuit Booz de Rahab. Booz autem génuit Obed ex Ruth. Obed autem génuit Jesse. Jesse autem génuit David regem. David autem rex génuit Salomónem ex ea, quæ fuit Uriæ. Sálomon autem génuit Róboam. Róboam autem génuit Abíam. Abías autem génuit Asa. Asa autem génuit Jósaphat. Jósaphat autem génuit Joram. Joram autem génuit Ozíam. Ozías autem génuit Jóatham. Jóatham autem génuit Achaz. Achaz autem génuit Ezechíam. Ezechías autem génuit Manássen. Manásses autem génuit Amon. Amon autem génuit Josíam. Josías autem génuit Jechoníam et fratres ejus in transmigratióne Babylónis. Et post transmigratiónem Babylónis: Jechonías génuit Saláthiel. Saláthiel autem génuit Zoróbabel. Zoróbabel autem génuit Abiud. Abiud autem génuit Elíacim. Elíacim autem génuit Azor. Azor autem génuit Sadoc. Sadoc autem génuit Achim. Achim autem génuit Eliud. Eliud autem génuit Eleázar. Eleázar autem génuit Mathan. Mathan autem génuit Jacob. Jacob autem génuit Joseph, virum Maríæ, de qua natus est Jesus, qui vocátur Christus.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Priest, Commentary on Matthew, Bk. 1, at the beginning
      text: |-
        In Isaía légimus: Generatiónem ejus quis enarrábit? Non ergo putémus Evangelístam Prophétæ esse contrárium, ut quod ille impossíbile dixit effátu, hic narráre incípiat: quia ibi de generatióne Divinitátis, hic de incarnatióne est dictum. A carnálibus autem cœpit, ut per hóminem, Deum díscere incipiámus. Fílii David, fílii Abraham. Ordo præpósterus, sed necessário commutátus. Si enim primum posuísset Abraham et póstea David, rursus ei repeténdus fúerat Abraham, ut generatiónis séries texerétur.

        Ideo autem, céteris prætermíssis, horum fílium nuncupávit, quia ad hos tantum facta est de Christo repromíssio. Ad Abraham: In sémine, inquit, tuo benedicéntur omnes gentes, quod est Christus. Ad David: De fructu ventris tui ponam super sedem tuam. Judas autem génuit Phares et Zaram de Thamar. Notándum, in genealogía Salvatóris nullam sanctárum assúmi mulíerum, sed eas quas Scriptúra reprehéndit; ut, qui propter peccatóres vénerat, de peccatóribus nascens, ómnium peccáta deléret. Unde et in consequéntibus Ruth Moabítis pónitur, et Bethsabée uxor Uríæ.

        Jacob autem génuit Joseph. Hunc locum objécit nobis Juliánus Augústus de dissonántia Evangelistárum, cur Evangelísta Matthǽus Joseph díxerit fílium Jacob et Lucas eum fílium appellárit Heli; non intéllegens consuetúdinem Scripturárum, quod alter secúndum natúram, alter secúndum legem ei pater sit. Scimus enim hoc per Móysen, Deo jubénte, præcéptum, ut, si frater aut propínquus absque líberis mórtuus fúerit, álius accípiat uxórem ad suscitándum semen fratris vel propínqui sui. Joseph virum Maríæ. Cum virum audíeris, suspício tibi non súbeat nuptiárum; sed recordáre consuetúdinis Scripturárum, quod sponsi viri, et sponsæ vocéntur uxóres.
      status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2025-09-09). Matins reading for day 2 of the Nativity
# of the BVM's own octave -- collapsed into one continuous reading per project
# convention. The source's own English translation is used as-is, including
# gaps in its own punctuation (some older "oct"/"bmv"-suffixed variant files
# drop question marks entirely in places) -- not corrected here, since
# guessing where they belong isn't the same class of fix as an isolated
# single-character typo.
#
# 2026-09-09: the source's own commemoration of St. Gorgonius (also Sep 9)
# was originally appended here as a third paragraph under Augustine's own
# attribution -- wrong on two counts: it mixed an unrelated source into
# one attributed reading, and it duplicated the ordinary per-saint pooling
# mechanism's own independent pull of nocturn-readings/st-gorgonius.yml
# for the same saint. Removed; Gorgonius's own commemoration reading is
# sourced from that file alone now.
#
# 2026-09-09 (second fix): `text.la`/`text.en` also had the reference
# source's own citation line ("De Sermone sancti Augustíni Epíscopi. Serm.
# 18. de Sanctis, in med." / "From the Sermons of Saint Augustine, Bishop
# (of Hippo) Serm. 18 on the Saints") baked into the start of the reading
# body, run on directly into the sermon's own opening words with no
# separating punctuation -- redundant with the separate `source` field
# above, which already renders as this reading's label. Stripped, both
# languages. NOTE: several other files under this directory (e.g. the
# Assumption's own octave days, Christmas Day's octave day 6) show the
# same pattern -- not fixed here, out of scope for this file's own bug,
# but worth a dedicated sweep.
octave-readings/~-octave-day-2:
  source: De Sermone sancti Augustíni Epíscopi.
  text: |
    Exsultat Maria, et matrem se læta miratur, et de Spiritu sancto se peperisse gaudet; nec quia peperit innupta, terretur; sed quia genuerit, cum exsultatione miratur. Ofemina super feminas benedicta, quæ virum omnino non novit, et virum suo utero circumdedit! Circumdat virum Maria Angelo fidem dando, quia Heva perdidit virum, serpenti consentiendo. Ofelix obedientia, o insignis gratia! quæ dum fidem humiliter dedit, cæli in se opificem corporavit. Hinc promeruit gloriam, quam ipsa postmodum auxit. Ecce, ait, ex hoc beatam me dicent omnes generationes.

    Obeata Maria, quis tibi digne valeat jura gratiarum ac laudum præconia rependere, quæ singulari tuo assensu mundo succurristi perdito? Quas tibi laudes fragilitas humani generis persolvat, quæ solo tuo commercio recuperandi aditum invenit? Accipe ítaque quascumque exiles, quascumque meritis tuis impares gratiarum actiones: et cum susceperis vota, culpas nostras orando excusa. Admitte nostras preces intra sacrarium exauditionis et reporta nobis antidotum reconciliationis.
  responsory: |
    R. Hódie nata est beáta Virgo María ex progénie David; * Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo. V. Nativitátem beátæ Maríæ Vírginis cum gáudio celebrémus. R. Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo.
  status: verified

# Sourced directly from the raw reference files (web/www/horas/Latin/
# Sancti/09-10bmv.txt) -- day 3 of the Nativity of the BVM's own octave, the
# one day in this octave with a genuine Lectio override rather than a bare
# "ex Sancti/09-08" cross-reference (see nativity-bvm-octave-day-7.yml's own
# absence: day 7 has no override and correctly needs no file of its own,
# same as immaculate-conception-octave-day-4/6). Lectio7's own Gospel
# pericope (Matt 1:1-17, the genealogy) is a bare incipit ("Et réliqua," no
# full text) -- per the established "don't transcribe bare incipits" rule
# (see memory vu-matins-sanctim-saints, fourth finding), only St. Jerome's
# homily on the genealogy (Lectio7's own homily portion through Lectio9) is
# authored, isGospel: false. No English translation exists in the reference
# engine for this file at all -- English/Sancti/09-10bmv.txt is a verbatim
# duplicate of the Latin text, the same reference-engine data-bug class as
# st-anicetus/st-george (see memory vu-matins-pre1955-saints /
# vu-matins-sanctim-saints) -- so `en` is this project's own translation,
# `draft`.
# Responsory missing from this file alone among the octave's day-2/4/5/6
# siblings, which all already carry this same text -- the Nativity's own
# Responsory1 (Sancti/09-08.txt), reused across the octave's combined-
# lesson readings the same way those siblings do, not a per-lesson
# responsory (the Monastic 09-10bmv.txt source has none of its own for
# Lectio7-9, inheriting Sancti/09-08's via its own "ex Sancti/09-08" rule).
octave-readings/~-octave-day-3:
  source: De Homilia S. Hierónymi Presbýteri (in Matt. 1:1-17)
  text: |
    Et post transmigrationem Babylonis Jechonias genuit Salathiel. Si voluerimus Jechoniam in fine primæ tessaradecadis ponere, in sequenti non erunt quattuordecim, sed tredecim. Sciamus igitur Jechoniam priorem ipsum esse quem et Joacim, secundum autem filium non patrem. Quorum prior describitur; quod scriptorum vitio et longitudine temporum apud Græcos Latinosque confusus est.

    Jacob autem genuit Joseph. Hunc locum objecit nobis Julianus Augustus dissonantiæ evangelistarum, cur evangelista Matthæus Joseph dixerit filium Jacob, et Lucas eum filium appellarit Heli, non intelligens consuetudinem scripturarum, quod alter secundum naturam, alter secundum legem ei pater sit. Scimus enim hoc per Moysem deo jubente præceptum, ut si frater aut propinquus absque liberis mortuus fuerit, alius ejus frater accipiat uxorem ad suscitandum semen fratris, vel propinqui sui. Joseph virum Mariæ, cum utrum audieris, suspitio tibi non subeat nuptiarum, sed recordare consuetudinis scripturarum, quod sponsi viri, et sponsæ vocentur uxores.

    Et a transmigratione Babylonis usque ad Christum generationes quattuordecim. Numera a Jechonia usque ad Joseph, et invenies generationes tredecim. Quartadecima ergo generatio in ipsum Christum reputabitur. Christi autem generatio sic erit. Quærat diligens lector, et dicat: Cum Joseph non sit pater domini salvatoris, quid pertinet ad dominum generationis ordo deductus usque ad Joseph? Cui respondebimus primum, non esse consuetudinis scripturarum, ut mulierum in generationis ordo texatur: deinde, ex una tribu fuisse Joseph et Mariam, unde ex lege eam accipere cogebatur ut propinquam.
  responsory: |
    R. Hódie nata est beáta Virgo María ex progénie David; * Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo. V. Nativitátem beátæ Maríæ Vírginis cum gáudio celebrémus. R. Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo.
  status: verified

