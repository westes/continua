# Matins Nocturn 2 reading for St. Nicholas of Tolentino, Confessor
# (Sep 10) — pre-1955-but-post-1617 (no SanctiM/09-10*.txt at all; the
# "bmv" suffix variant at this date is unrelated/empty).
# web/www/horas/Latin/Sancti/09-10.txt, English/Sancti/09-10.txt.
# Lectio4-6 is this saint's own proper text, one continuous vita
# account, no internal break, combined into a single reading;
# Lectio7-9 are Common-of-a-Confessor (skipped). No responsory given.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Nicolaus, Tolentinas a diuturno illíus civitátis domicílio appellátus, in oppido sancti Angeli in Piceno est natus piis paréntibus; qui, liberórum desidério Bárium voti causa profecti, ibique a sancto Nicoláo de futura prole confirmáti, quem suscepérunt fílium de illíus nómine appellarunt. Is ab infántia multárum virtútum, sed abstinéntiæ in primis, specimen dedit. Nam anno vix septimo, beátum ipsum Nicolaum imitatus, complures hebdomadæ dies jejunare cœpit; eamque póstea consuetúdinem retinuit, solo pane et aqua contentus.

        Adulta ætate, jam clericali milítiæ adscriptus et canonicus factus, cum quodam die concionatórem ordinis Eremitárum sancti Augustíni de mundi contemptu dicéntem audísset, eo sermóne inflammatus, statim eumdem ordinem est ingréssus. In quo tam exactam religiosæ vitæ ratiónem coluit, ut áspero vestítu, verbéribus et férrea catena corpus domans, atque a carne et omni fere obsónio ábstinens, caritate, humilitate, patiéntia ceterisque virtútibus, aliis prælucéret.

        Orándi assiduum studium, quamvis sátanæ insídiis varie vexátus et flagellis intérdum cæsus, non intermittebat. Demum, sex ante óbitum mensibus, singulis noctibus angelicum concentum audívit; cujus suavitate cum jam paradisi gaudia prægustaret, crebro illud Apóstoli repetebat: Cupio dissolvi, et esse cum Christo. Denique óbitus sui diem frátribus prædixit, qui fuit quarto Idus Septembris. Miraculis multis étiam post mortem cláruit; quibus rite et ordine cógnitis, ab Eugenio Papa quarto in Sanctórum númerum est relatus.
      status: verified
