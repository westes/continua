nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Antonius Ægyptius, nobílibus et christiánis paréntibus natus, quibus adoléscens orbátus est, cum ingréssus ecclésiam ex Evangelio audivísset: Si vis perfectus esse, vade, et vende ómnia quæ habes, et da paupéribus; tamquam ea sibi dicta essent, sic Christo Dómino obtemperándum existimávit. Itaque, véndita re familiari, pecúniam omnem paupéribus distríbuit. Quibus solutus impedimentis, cæléstis vitæ genus in terris cólere instituit. Sed cum in periculósum illud certamen descenderet, ad fidei præsidium, quo erat armatus, adhibéndum sibi putávit subsidium reliquárum virtútum; quarum tanto studio incénsus fuit, ut, quemcúmque vidéret áliqua virtútis laude excelléntem, illum imitari studéret.

        Nihil ígitur eo continentius, nihil vigilantius erat. Patiéntia, mansuetúdine, misericórdia, humilitate, labóre, ac studio divinárum Scripturárum superábat omnes. Ab hæreticórum et schismaticórum hóminum, maxime Arianórum, congressu et colloquio sic abhorrebat, ut ne prope quidem ad eos accedéndum díceret. Humi jacebat, cum eum necessarius somnus occupasset. Jejunium autem adeo coluit, ut salem tantummodo ad panem adhibéret, sitim aqua exstingueret; neque se ante solis occásum cibo aut potu recreabat, sæpe étiam biduum cibo abstinebat; sæpíssime in oratióne pernoctábat. Cum talis tantusque Dei miles evasísset Antonius, sanctíssimum juvenem hostis humani generis variis tentatiónibus aggréditur, quas ille jejunio et oratióne vincebat. Nec vero frequens de sátana triumphus securum reddebat Antónium, qui diaboli innumerábiles artes nocéndi nóverat.

        Itaque cóntulit se in vastíssimam Ægypti solitúdinem: ubi quotídie ad christianam perfectiónem proficiens, dæmones (quorum tanto erant acriores ímpetus, quanto Antonius ad resisténdum fortior evadebat) ita contempsit, ut illis exprobraret imbecillitátem; ac sæpe discipulos suos éxcitans ad pugnándum contra diabolum, docensque quibus armis vincerétur: Mihi credite, dicebat, fratres, pertimescit sátanas piórum vigílias, oratiónes, jejunia, voluntáriam paupertátem, misericórdiam et humilitátem, maxime vero ardentem amórem in Christum Dóminum, cujus único sanctíssimæ crucis signo debilitátus áufugit. Sic autem dæmónibus erat formidolósus, ut multi per Ægyptum ab illis agitati, invocáto nómine Antonii liberaréntur: tántaque erat ejus fama sanctitátis, ut per litteras se ejus oratiónibus Constantinus Magnus et fílii commendarent. Qui aliquándo quintum et centésimum annum agens, cum innumerábiles sui institúti imitatores haberet, convocátis mónachis et ad perféctam christianæ vitæ regulam instructis, sanctitáte et miraculis clarus migrávit in cælum, décimo sexto Kalendas Februarii.
      status: verified
