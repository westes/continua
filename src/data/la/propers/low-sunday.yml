# Engine render (Monastic Tridentinum 1617, command=prayVespera, 2026-04-11); Latin and English both taken from the page. Only First Vespers is rendered by the engine (the next day always takes Low Sunday evening), so these serve both evenings.
vespers-hymn:
  text: |
    Ad cenam Agni próvidi,
    Et stolis albis cándidi,
    Post tránsitum maris Rubri,
    Christo canámus Príncipi.

    Cujus corpus sanctíssimum,
    In ara crucis tórridum,
    Cruóre ejus róseo
    Gustándo vívimus Deo.

    Protécti Paschæ véspere
    A devastánte Angelo,
    Erépti de duríssimo
    Pharaónis império.

    Jam Pascha nostrum Christus est,
    Qui immolátus agnus est:
    Sinceritátis ázyma,
    Caro ejus obláta est.

    O vere digna hóstia,
    Per quam fracta sunt tártara,
    Redémpta plebs captiváta,
    Réddita vitæ prǽmia.

    Consúrgit Christus túmulo,
    Victor redit de bárathro,
    Tyránnum trudens vínculo,
    Et Paradísum réserans.

    Quǽsumus, Auctor ómnium,
    In hoc pascháli gáudio,
    Ab omni mortis ímpetu
    Tuum defénde pópulum.

    * Glória tibi Dómine,
    Qui surrexísti a mórtuis,
    Cum Patre et Sancto Spíritu,
    In sempitérna sǽcula.
    Amen.
  status: verified

