# Read directly from web/www/horas/Latin/Sancti/05-29.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, virginitátis amátor, qui beátam Maríam Magdalénam Vírginem, tuo amóre
    succénsam, cæléstibus donis decorásti: da; ut, quam festíva celebritáte
    venerámur, puritáte et caritáte imitémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-virgin (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). st-mary-magdalene-de-pazzi has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is the saint's own
# real proper (st-mary-magdalene-de-pazzi-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Símile est regnum cælórum * hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, virginitátis amátor, qui beátam Maríam Magdalénam Vírginem, tuo amóre
    succénsam, cæléstibus donis decorásti: da; ut, quam festíva celebritáte
    venerámur, puritáte et caritáte imitémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Matins Nocturn 2 reading for St. Mary Magdalene de Pazzi, Virgin
# (May 29). Sourced directly from web/www/horas/Latin/Sancti/05-29.txt,
# English/Sancti/05-29.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in her own file (her `[Rule]` is `vide
# C6a`) -- defers to the Common of a Virgin's own Nocturn 3, not
# transcribed here.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Maria Magdalena, illustrióri Pazziórum genere Floréntiæ nata, fere ab incunabulis iter perfectiónis arrípuit. Decennis perpetuam virginitátem vovit, susceptoque habitu in monastério sanctæ Maríæ Angelórum, ordinis Carmelitárum, se ómnium virtútum exemplar exhíbuit. Adeo casta fuit, ut quidquid puritátem lǽdere potest, pénitus ignoraverit. Quinquénnium, Deo jubénte, solo pane et aqua transegit, exceptis diébus Domínicis, quibus cibis quadragesimálibus vescebátur. Corpus suum cilício, flagellis, frígore, inedia, vigiliis, nuditate, atque omni pœnárum genere cruciábat.

        Tanto igne divini amoris æstuábat, ut, ei feréndo impar, ingesta aqua pectus refrigerare cogerétur. Extra sensus frequenter rapta, diuturnas et admirábiles éxtases passa est, in quibus et arcana cæléstia penetrávit, et exímiis a Deo grátiis illustráta fuit. His autem muníta longum certamen a princípibus tenebrárum sustinuit, árida, desoláta, ab ómnibus derelícta, variisque tentatiónibus vexáta; Deo sic permittente, ut invíctæ patiéntiæ ac profundíssimæ humilitátis exémplar præbéret.

        Caritáte erga próximum singuláriter enítuit; nam sæpe noctes ducebat insomnes, vel obeúndis sorórum ministériis, vel inserviéndo infirmis occupata, quarum aliquándo úlcera lambens sanávit. Infidélium et peccatórum perditiónem amare deflens, se ad quælibet pro illórum salúte torménta parátam offerébat. Multis ante obitum annis, univérsis cæli deliciis, quibus copiose affluébat, heróica virtúte renuntians, illud frequénter in ore habébat: Pati, non mori. Tandem longa et gravíssima infirmitáte exháusta, transívit ad Sponsum die vigésima quinta Maji, anno millésimo sexcentésimo septimo, expleto anno quadragésimo primo ætátis suæ. Eam, multis in vita et post mortem miráculis claram, Clemens nonus sanctárum Vírginum número adscrípsit: cujus corpus in præséntem diem incorrúptum conservátur.
      status: verified
