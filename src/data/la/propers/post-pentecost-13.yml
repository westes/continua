# Nocturn 3, 13th Sunday after Pentecost (temporalId post-pentecost-13) -
# today's date, 2026-08-23, the date that surfaced this whole gap. Sourced
# from Tempora/Pent13-0.txt. See post-pentecost-02.yml for sweep method
# note; this Sunday has no proper Nocturn 2 in the source (same as
# post-pentecost-12 onward). Lectio7 is a bare "Et réliqua" incipit (Luke
# 17:11-19, the ten lepers) and is not authored per this project's
# convention; Lectio8-9 is one continuous homily by St. Augustine, combined.
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Luc 17:11-19
      text: 'In illo témpore: Dum iret Jesus in Jerúsalem, transíbat per médiam Samaríam et Galilǽam. Et cum ingrederétur quoddam castéllum, occurrérunt ei decem viri leprósi, qui stetérunt a longe; et levavérunt vocem dicéntes: Jesu præcéptor, miserére nostri. Quos ut vidit, dixit: Ite, osténdite vos sacerdótibus. Et factum est, dum irent, mundáti sunt. Unus autem ex illis, ut vidit quia mundátus est, regréssus est, cum magna voce magníficans Deum, et cecidit in fáciem ante pedes ejus, grátias agens: et hic erat Samaritánus. Respóndens autem Jesus, dixit: Nonne decem mundáti sunt? et novem ubi sunt? Non est invéntus, qui redíret et daret glóriam Deo, nisi hic alienígena. Et ait illi: Surge, vade; quia fides tua te salvum fecit.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Book 2, Questions on the Gospels, ch. 40
      text: |-
        De decem leprósis, quos Dóminus ita mundávit, cum ait: Ite, osténdite vos sacerdótibus; quæri potest, cur eos ad sacerdótes míserit, ut cum irent, mundaréntur. Nullum enim eórum, quibus hæc corporália benefícia prǽstitit, invenítur misísse ad sacerdótes, nisi leprósos. Nam et illum a lepra mundáverat, cui dixit: Vade, osténde te sacerdótibus, et offer pro te sacrifícium, quod præcépit Móyses, in testimónium illis. Quæréndum ígitur est, quid ipsa lepra signíficet: non enim sanáti, sed mundáti dicúntur, qui ea caruérunt. Colóris quippe vítium est, non valetúdinis, aut integritátis sénsuum atque membrórum.

        Leprósi ergo non absúrde intélligi possunt, qui sciéntiam veræ fídei non habéntes, várias doctrínas profiténtur erróris. Non enim abscóndunt imperítiam suam; sed pro summa perítia próferunt in lucem, et jactántia sermónis osténtant. Nulla porro falsa doctrína est, quæ non áliqua vera intermísceat. Vera ergo falsis inordináte permíxta, in una disputatióne vel narratióne hóminis, tamquam in uníus córporis colóre apparéntia, signíficant lepram, tamquam veris falsísque colórum variántem atque maculántem.

        Hi autem tam vitándi sunt Ecclésiæ, ut, si fíeri potest, lóngius remóti, magno clamóre Christum interpéllent; sicut isti decem stetérunt a longe, et levavérunt vocem, dicéntes: Jesu præcéptor, miserére nostri. Nam et quod præceptórem vocant, quo nómine néscio utrum quisquam Dóminum interpelláverit pro medicína corporáli; satis puto significáre, lepram falsam esse doctrínam, quam bonus præcéptor abstérgit.
      responsory: |-
        R. Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.
        V. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.
        R. Plena est omnis terra glória ejus.
      status: verified
