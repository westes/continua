# Matins Nocturn 2-3 readings for All Saints of the Benedictine Order
# (Nov 13) — a genuine Monastic-only feast: no `Sancti/11-13*.txt`
# names it at all (the general Tridentine calendar's own Nov 13 is a
# different, later saint, St. Didacus); its own content exists only at
# web/www/horas/Latin/SanctiM/11-13M.txt (a rare case where an
# English/SanctiM translation also exists, unlike most of this pass's
# genuinely Monastic-only saints — see memory vu-matins-sanctim-saints).
# Nocturn 1 (Lectio1-4) falls back to Common of Several Confessors, not
# proper text, so not authored here.
#
# Nocturn 2: Lectio5-8 (St. John Damascene's excerpt from the Life of
# Barlaam and Josaphat, praising the saints generally) combined into
# one reading, one continuous excerpt. One garbled character in the
# Latin source ("exsultࢱtio") silently corrected to "exsultátio" in
# transcription.
# Nocturn 3: Lectio9's Gospel citation (Matt 19:27-29) is a bare
# incipit ("Et réliqua") in this saint's own file, so the homily
# portion (combined with Lectio10-12 as one continuous excerpt of St.
# Bernard's own sermon on St. Benedict) was originally authored alone.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily) — the citation
# resolves (via the Rule's Common of Several Confessors, `@Commune/
# C5b`, the same Common this feast's own Nocturn 1 falls back to) to
# horas/Latin/Commune/C5b.txt's own [Evangelium], not guessed at.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. John Damascene, Life of Barlaam and Josaphat, ch. 2
      text: |-
        Beáti isti ac ter beáti, ut qui Dei amóre flagrárunt, atque ob ipsíus caritátem ómnia pro níhilo duxérunt. Síquidem lácrimas profudérunt, diéque ac nocte in luctu versáti sunt, ut perpétuam consolatiónem adisceréntur: seípsos ultro depressérunt, ut illic in altum attolleréntur. Carnes suas fame ac siti et vigíllis confecérunt, ut illic paradísis delíciæ et exsultátio ipsos excíperent.

        Spíritus Sancti tabernáculum per cordis puritátem exstitérunt, quemádmodum scriptum est: Inhabitábo in ipsis et inambulábo. Seípsis mundo crucifixérunt, ut ad Christi déxteram starent: lumbos suos in veritáte succinxérunt, atque in promptu semper lámpades habuérunt, immortális Sponsi advéntum expectántes. Nam, cum mentis óculis prǽditi essent, hórrendum illum diem semper prospiciébant, atque tum futurórum bonórum, tum futúri supplícii contemplatiónem ita in corde defíxam gerébant, ut ab ipsa nunquam divelleréntur. Atque hic laboráre studuérunt, ut sempitérnæ glóriæ cómpotes essent: perturbatiónum expértes, non secus atque Angeli fuérunt, ac nunc cum illis, quorum vitam imitáti sunt, choréas agunt.

        Beáti illi ac ter beáti, quóniam firmis mentis óculis præséntium rerum vanitátem, atque humánæ prosperitátis incertitúdinem et inconstántiam perspexérunt, eáque reíecta, sempitérna bona sibi ipsis condidérunt, ac vitam eam, quæ nunquam occídit, nec morte interrúmpitur, arripuérunt.

        Hos ígitur admirándos et sanctos viros nos quoque indígni ac despicábiles imitári studémus. Verum eórum vitæ cæléstis fastígium mínime asséqimur, sed pro infirmitátis nostræ ac míseræ facultátis módulo eórum vitam exprímus; atque ipsórum hábitum gérimus, étiam sui ópera non assequámur. Etenim, divínam hanc professiónem, peccátum propulsáre, atque incorruptiónis per divínum baptísma nobis concéssæ sóciam et opitulatrícem esse, perspéctum habémus.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 19:27-29
      text: 'In illo témpore: Dixit Petrus ad Jesum: Ecce, nos relíquimus ómnia, et secúti sumus te: quid ergo erit nobis? Jesus autem dixit illis: Amen, dico vobis, quod vos, qui secúti estis me, in regeneratióne, cum séderit Fílius hóminis in sede majestátis suæ, sedébitis et vos super sedes duódecim, judicántes duódecim tribus Israël. Et omnis, qui relíquerit domum, vel fratres, aut soróres, aut patrem, aut matrem, aut uxórem, aut fílios, aut agros, propter nomen meum, céntuplum accípiet, et vitam ætérnam possidébit.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernard of Clairvaux, Abbot, Sermon on St. Benedict (on Matt 19:27-29)
      text: |-
        Modo útique, fratres, audístis in Evangélio promitténtem Dóminum et dicéntem discípulis: Sedébitis super sedes, judicántes duódecim tribus Israël. Ecce quies sessiónis et honor judícii. Nam et ipse Dóminus ad hæc nóluit perveníre, nisi per humilitátem et labórem. Unde et morte turpíssima condemnátus est, interrogátus torméntis, et oppróbriis saturátus: útique ut inimícus induátur confusióne, ipse páriter et omnes, qui imitántur eum, et prætergrediúntur viam. Ipse est, o iníque, ipse est, qui sessúrus est in sede majestátis suæ símilis Altíssimo, et coaltíssimus ei. Hoc útique cogitavérunt Angeli sancti, qui, cadénte malígno, apostasíæ illíus non consensérunt, nobis relinquéntes exémplum, ut, quemádmodum ipsi elegérunt ministráre, sic et nos faciámus.

        Qui enim labórem fúgiunt et honórem captant, illum se nóverint imitári, qui sessiónem altitudinémque quæsívit: et si non satis terret eos illíus culpa, térreat vel vindícta. Ad hæc vitánda prudéntiam nobis reliquérunt Sancti Dei, qui profécto sedébunt; ipsi, inquam, vermículi terræ judicántes sedébunt. Nescítis, ait Apóstolus, quia et Angelos judicábimus? Ipsi útique, qui ibant et flebant, mitténtes sémina sua, veniéntes autem vénient cum exsultatióne, portántes manípulos suos. Qui seminavérunt labórem et vilitátem, metent honórem páriter et quiétem. Pro confusiónem enim sua dúplici et labóre, in terra sua duplícia possidébunt. Unde et dicébat quidam: Vide humilitátem meam et labórem meum.

        Non solum autem ipsa vita, sed et promíssio vitæ ætérnæ et expectátio justórum, lætítia est, et tanta lætítia, ut omne, quod concupíscitur, ei non váleat comparári. Hanc quoque prudéntiam nobis Apóstoli sancti seminavérunt, quando, recedéntibus his, qui sapiéntiam hujus mundi sequebántur, quæ stultítia est apud Deum, et prudéntiam carnis, quæ mortem operátur et inimíca est Deo; ipsi Dómino adhæsérunt. Mártyres vero maniféstum est fortitúdinem seminásse. Porro Confessóres sectáti sunt justítiam in omni vita sua.

        Hac doctrína nos étiam ínstruit noster cæléstis pater, dux, magíster et légifer Benedíctus, et dírigit gressus nostros in viam pacis. Porro vitæ justítia omníno róborat et ánimat nos, ut tanto magis accendámur ad agénda quæ dócuit, quanto certi sumus eum non ália docuísse quam fécerit. Sermo quidem vivus et éfficax, exemplum óperis est, plúrimum fáciens suadíbile quod dícitur, dum monstrat factíbile quod suadétur. In hunc ergo modum sánctitas confórtat, pietátis infórmat, justítia confírmat. Quantæ enim pietátis fuit, quod non solum præséntibus prófuit, sed et pro futúris sollícitus fuit? Pascit vita, pascit doctrína, pascit intercessióne. Per quam incessánter adjúti, fructificáte et vos, caríssimi, quóniam in hoc pósiti estis, ut eátis et fructum afferátis. Imitémur et hunc; quóniam ad hoc venit, ut formam nobis tráderet, et viam demonstráret.
      status: verified
