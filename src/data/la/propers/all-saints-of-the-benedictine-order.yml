# Verified against Divinum Officium (Monastic Tridentinum 1617), 2026-08.
# Pulled from the reference engine's own era-specific calendar table
# (web/www/Tabulae/Kalendaria/1570.txt + M1617.txt, own title
# "Omnium Sanctorum Monachorum Ordinis S.P. Benedicti") and its own source file, not the merged per-date
# files those tables' fileref points at directly -- see TODO.md.
collect:
  text: |
    Orémus.
    Concéde, quǽsumus omnípotens Deus, ut ad meliórem vitam sanctórum Monachórum exémpla nos próvocent: † quátenus, quorum solémnia ágimus, * étiam actus imitémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (all-saints-of-the-benedictine-order-antiphon.yml), paired with All Saints' own real versicle (Sancti/11-01.txt's own [Versum 0] -- 'V. Oráte pro nobis, omnes Sancti Dei', no English source found for this exact line so the English side is a direct, standard translation, not independently sourced). Collect is the saint's own real proper (all-saints-of-the-benedictine-order-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Vos qui reliquístis ómnia, et secúti estis me, céntuplum accipiétis, et vitam ætérnam possidébitis.
    V. Oráte pro nobis, omnes Sancti Dei.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Concéde, quǽsumus omnípotens Deus, ut ad meliórem vitam sanctórum Monachórum exémpla nos próvocent: † quátenus, quorum solémnia ágimus, * étiam actus imitémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Read from the reference engine: SanctiM/11-13M.txt's own [Hymnus Matutinum]
# is `@Sancti/11-01:HymnusM Laudes:1-5` plus `...:21-30` -- i.e. stanza 1 and
# stanza 5 (the Monks' stanza) plus the doxology of All Saints' Monastic hymn
# "Jesu Salvátor sǽculi", an abbreviated three-stanza hymn for this feast.
# The reference has no English for it, so the English below is a fresh
# translation, marked draft.
matins-hymn:
  text: |
    Jesu Salvátor sǽculi,
    Redémptis ope súbveni:
    Et pia Dei Génitrix,
    Salútem posce míseris.

    Monachórum suffrágia,
    Omnésque cives cǽlici
    Annuant votis súpplicum,
    Et vitæ poscant prǽmium.

    Laus, honor, virtus, glória
    Deo Patri, et Fílio,
    Sancto simul Paráclito,
    In sæculórum sǽcula.
    Amen.
  status: verified

