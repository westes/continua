# Matins Nocturn 2 reading for St. Gregory the Great, Pope, Confessor,
# Doctor (Mar 12) — SanctiM/03-12.txt's own Lectio5-12 all resolve back
# to `@Sancti/03-12:LectioN` (resliced for the Monastic 12-lesson
# structure), so this saint's own vita is sourced from the Tridentine
# track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/03-12.txt, English/Sancti/03-12.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. Lectio7-9's Gospel+homily (Matt 16:13-19, St. Leo's
# sermon on Peter's confession) is generic Chair-of-Peter content
# unrelated to Gregory himself, not proper to this feast, so not
# authored here — same judgment as the same lessons appearing verbatim
# under `chair-of-st-peter-at-rome.yml`'s own sourcing. No responsory
# given for Lectio4-6.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Gregórius Magnus, Románus, Gordiáni senatóris fílius, adoléscens philosophíæ óperam dedit; et prætório offício functus, patre mórtuo, sex monastéria in Sicília ædificávit, Romæ séptimum sancti Andréæ nómine in suis ǽdibus, prope basílicam sanctórum Joánnis et Pauli ad Clivum Scauri, ubi Hilarióne ac Maximiáno magístris, monáchi vitam proféssus, póstea abbas fuit. Mox diáconus cardinális creátus, Constantinópolim a Pelágio Pontífice ad Tibérium Constantínum imperatórem legátus míttitur: apud quem memorábile étiam illud effécit, quod Eutýchium patriárcham, qui scrípserat contra veram ac tractábilem córporum resurrectiónem, ita convícit, ut ejus librum imperátor in ignem injíceret. Quare Eutýchius paulo post cum in morbum incidísset, instánte morte, pellem manus suæ tenébat, multis præséntibus, dicens: Confíteor quia omnes in hac carne resurgémus.

        Romam rédiens, Pelágio pestiléntia subláto, summo ómnium consénsu Póntifex elígitur: quem honórem ne accíperet, quámdiu pótuit, recusávit; nam aliéno vestítu in spelúnca delítuit: ubi deprehénsus indício ígnæa colúmnæ, ad sanctum Petrum consecrátur. In pontificátu multa successóribus doctrínæ ac sanctitátis exémpla relíquit. Peregrínos quotídie ad mensam adhibébat: in quibus et Ángelum, et Dóminum Angelórum peregríni fácie accépit. Páuperes et urbános et extérnos, quorum númerum descríptum habébat, benígne sustentábat. Cathólicam fidem multis locis labefactátam restítuit. Nam Donatístas in Africa, Ariános in Hispánia représsit: Agnoítas Alexandría ejécit. Pállium Syágrio Augustodunénsi epíscopo dare nóluit, nisi neóphytos hæréticos expélleret ex Gállia. Gothos hǽresim Ariánam relínquere coégit. Missis in Británniam doctis et sanctis viris Augustíno et áliis mónachis, ínsulam ad Jesu Christi fidem convértit, vere a Beda presbýtero Angliæ vocátus Apóstolus. Joánnis patriárchæ Constantinopolitáni audáciam fregit, qui sibi universális Ecclésiæ epíscopi nomen arrogábat. Maurítium imperatórem, eos qui mílites fuíssent, mónachos fíeri prohibéntem, a senténtia detérruit.

        Ecclésiam ornávit sanctíssimis institútis et légibus. Apud sanctum Petrum coácta sýnodo, multa constítuit: in iis, Ut in Missa Kýrie eléison nóvies repeterétur: ut extra id tempus, quod continétur Septuagésima et Pascha, Allelúia dicerétur: ut adderétur in Cánone, Diésque nostros in tua pace dispónas. Litanías, Statiónes, et ecclesiásticum offícium auxit. Quátuor concíliis, Nicǽno, Constantinopolitáno, Ephesíno, Chalcedonénsi, tamquam quátuor Evangéliis honórem habéri vóluit. Epíscopis Sicíliæ, qui ex antíqua ecclesiárum consuetúdine Romam síngulis triénniis conveniébant, quinto quoque anno semel veníre indúlsit. Multos libros confécit: quos cum dictáret, testátus est Petrus diáconus, se Spíritum Sanctum colúmbæ spécie in ejus cápite sæpe vidísse. Admirabília sunt quæ dixit, fecit, scripsit, decrévit, præsértim infírma semper et ægra valetúdine. Qui dénique multis éditis miráculis, pontificátus anno décimo tértio, mense sexto, die décimo, quarto Idus Mártii, qui dies festus a Græcis étiam propter insígnem hujus Pontíficis sapiéntiam ac sanctitátem præcípuo honóre celebrátur, ad cæléstem beatitúdinem evocátus est. Cujus corpus sepúltum est in basílica sancti Petri, prope Secretárium.
      status: verified
