# Read directly from web/www/horas/Latin/Sancti/05-31.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Concéde nobis, quǽsumus, Dómine: ut, qui solemnitátem beatæ Maríæ Vírginis Regínæ
    nostræ celebrámus; ejus muníti præsídio, pacem in præsénti et glóriam in futúro
    cónsequi mereámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (queenship-of-the-bvm-antiphon.yml), paired with the standard BVM commemoration versicle already verified elsewhere in this app (propers/common/lauds-suffrage-bvm.yml -- 'V. Ora pro nobis sancta Dei Genitrix'). Collect is the saint's own real proper (queenship-of-the-bvm-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Beáta quæ credidísti, * quæ dicta sunt tibi a Dómino: cum Christo regnas in ætérnum. (Allelúia.)
    V. Ora pro nobis sancta Dei Génitrix.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Concéde nobis, quǽsumus, Dómine: ut, qui solemnitátem beatæ Maríæ Vírginis Regínæ
    nostræ celebrámus; ejus muníti præsídio, pacem in præsénti et glóriam in futúro
    cónsequi mereámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# the Queenship of the BVM: proper Matins hymn, Latin/Sancti/05-31.txt's [Hymnus Matutinum]. English from English/Sancti/05-31.txt.
# Before this file the saint fell to the Common's hymn.
matins-hymn:
  text: |
    Rerum suprémo in vértice
    Regína, Virgo, sísteris,
    Exuberánter ómnium
    Ditáta pulchritúdine.

    Princeps opus formósior
    Verbo creánti prǽnites,
    Prædestináta Fílium,
    Qui prótulit te, gígnere.

    Ut Christus alta ab árbore
    Rex purpurátus sánguine,
    Sic passiónis párticeps,
    Tu Mater es vivéntium.

    Tantis decóra láudibus,
    Ad nos ovántes réspice,
    Tibíque sume grátulans
    Quod fúndimus præcónium.

    Jesu, tibi sit glória,
    Qui natus es de Vírgine,
    Cum Patre et almo Spíritu
    In sempitérna sǽcula.
    Amen.
  status: verified

