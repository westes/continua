# Matins Nocturn 2 reading for St. Stephen I, Pope, Martyr (Aug 2). No
# genuine SanctiM match: the correct Tridentine file is the suffixed
# `Sancti/08-02o.txt` (the plain `Sancti/08-02.txt` is St. Alphonsus
# Liguori instead, a later saint occupying the general calendar's own
# Aug 2 slot), and the only SanctiM files for this date bases
# `@Sancti/08-02` — same "don't trust the plain file" wrinkle as the
# pre-1955 pass (memory vu-matins-pre1955-saints); a missed
# pre-1955-pool candidate rather than a genuine SanctiM case (see
# memory vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/08-02o.txt, English/Sancti/08-02o.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Stephanus Romanus pontificátum gessit Valeriáno et Gallieno imperatóribus. Instituit ut sacerdótes et diáconi nusquam sacris vestibus, nisi in ecclésia, uteréntur. Baptizatos ab hæreticis, íterum baptizari vetuit, rescribens sancto Cypriáno verbis illis: Nihil innovétur, nisi quod traditum est. Multos étiam ad Christum convértit, in iis Olympium tribunum cum uxore Exsuperia et fílio Theodúlo, item Nemesium tribunum cum tota família, óculis Lucillæ ejus fíliæ restitútis: qui omnes Jesu Christi Mártyres fuérunt. Sed, vehementius jam ingravescénte persecutióne imperatórum, Stephanus, convocato clero, ad martyrium suos hortabátur, in cryptisque Mártyrum assidue Missas et concília celebrábat. Qui, cum aliquándo raptus esset ab infidelibus ad templum Martis ut ei sacrificaret, líbere negávit se dæmónibus eum honórem velle tribúere, qui uni Deo deberétur. Quibus in verbis Martis statua terræmotu cóncidit templumque contrémuit. Quare ómnibus aufugiéntibus qui Stephanum tenébant, Pontifex ad suos revértitur in cœmetérium Lucinæ; quos, divinis præceptis ínstruens, sacraménto corporis Christi communicávit; ibique, dum Missárum solemnia pérficit; adveniéntibus íterum imperatórum satellítibus, ei in sua sede caput abscínditur. Corpus, cum eadem sede conspersa Mártyris sánguine, a clericis sepúltum est in cœmeterio Callísti, quarto Nonas Augusti. Vixit in pontificatu annos tres, menses tres, dies viginti duos. Habuit ordinatiónes duas mense Decembri, quibus creávit presbyteros sex, diaconos quinque, episcopos tres.'
      status: verified
