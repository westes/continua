# Matins Nocturn 2-3 readings for St. James the Greater, Apostle (Jul
# 25) — SanctiM/07-25.txt's own Lectio5-9 resolve back to
# `@Sancti/07-25:LectioN` (resliced; Lectio4 falls back to Common of
# an Apostle), so this saint's own proper content is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-25.txt, English/Sancti/07-25.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous
# account.
# Nocturn 3: Lectio7's Gospel citation (Matt 20:20-23) was previously a
# bare incipit ("Et réliqua") with only the homily authored, a single
# excerpt of St. John Chrysostom's homily. No responsory given for
# either reading.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily). This feast's own
# Missale Evangelium (missa/Latin/Sancti/07-25.txt) redirects to
# `@Sancti/05-06` (St. John before the Latin Gate's own Missale Gospel is
# reused verbatim for this day) — sourced from missa/Latin+English/
# Sancti/05-06.txt, not guessed at.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Jacóbus, Zebedǽi fílius, Joánnis Apóstoli germánus frater, Galilǽus, inter primos Apóstolos vocátus cum fratre, relíctis patre ac rétibus, secútus est Dóminum, et ambo ab ipso Jesu Boanérges, id est, tonítrui fílii sunt appelláti. Is unus fuit ex tribus Apóstolis, quos Salvátor máxime diléxit, et testes esse vóluit suæ transfiguratiónis, et interésse miráculo cum archisynagógi fíliam a mórtuis excitávit, et adésse cum secéssit in montem Olivéti, Patrem oratúrus, ántequam a Judǽis comprehenderétur.

        Post Jesu Christi ascénsum in cælum, in Judǽa et Samaría ejus divinitátem prǽdicans, plúrimos ad christiánam fidem perdúxit. Mox in Hispániam proféctus, ibi áliquos ad Christum convértit; ex quorum número septem póstea epíscopi a beáto Petro ordináti in Hispániam primi dirécti sunt. Deínde Jerosólymam revérsus, cum inter álios Hermógenem magum fídei veritáte imbuísset, Heródes Agríppa Cláudio imperatóre ad regnum elátus ut a Judǽis grátiam iníret, Jacóbum líbere Jesum Christum Deum confiténtem cápitis condemnávit. Quem cum is, qui eum dúxerat ad tribúnal, fórtiter martýrium subeúntem vidísset, statim se et ipse Christiánum esse proféssus est.

        Ad supplícium cum raperéntur, pétiit ille a Jacóbo véniam; quem Jacóbus osculátus, Pax, inquit, tibi sit. Itaque utérque est secúri percússus, cum paulo ante Jacóbus paralýticum sanásset. Corpus ejus póstea Compostéllam translátum est, ubi summa celebritáte cólitur, conveniéntibus eo religiónis et voti causa ex toto terrárum orbe peregrínis. Memória ipsíus natális hodiérno die, qui translatiónis dies est, ab Ecclésia celebrátur, cum ipse circa festum Paschæ, primus Apostolórum Jerosólymis profúso sánguine testimónium Jesu Christo déderit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 20:20-23
      text: 'In illo témpore: Accéssit ad Jesum mater filiórum Zebedǽi cum fíliis suis, adórans et petens áliquid ab eo. Qui dixit ei: Quid vis? Ait illi: Dic, ut sédeant hi duo fílii mei, unus ad déxteram tuam, et unus ad sinístram in regno tuo. Respóndens autem Jesus, dixit: Néscitis, quid petátis. Potéstis bíbere cálicem, quem ego bibitúrus sum? Dicunt ei: Póssumus. Ait illis: Cálicem quidem meum bibétis: sedére autem ad déxteram meam vel sinístram, non est meum dare vobis, sed quibus parátum est a Patre meo.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. John Chrysostom, Homily 66 on Matthew (on Matt 20:20-23)
      text: 'Non turbétur quisquam, si ádeo imperféctos dícimus Apóstolos fuísse; nondum enim mystérium crucis erat consummátum, nondum grátia Spíritus in corda ipsórum infúsa. Quod si virtútem ipsórum díscere cupis, quales post datam grátiam Spíritus fúerint, consídera, et vidébis omnem ab illis pervérsam affectiónem fuísse superátam. Hac enim de causa eórum modo imperféctio revelátur, ut apérte percípere possis quales súbito per grátiam effécti fuérunt. Quod ígitur nihil spiritále petébant nec de cælésti regno quidquam cogitábant, perspícuum est. Sed tamen inspiciámus étiam quómodo accédant et quid dicant. Vólumus, ínquiunt, ut, quodcúmque petiérimus, fácias nobis. Ad quod Christus, Quid vultis? respóndit: non ignórans certe, sed ut eos respondére cogat et ulcus détegat, et ita medicaméntum appónat.'
      status: verified
