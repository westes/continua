# Read directly from web/www/horas/Latin/Sancti/03-27.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Omnípotens sempitérne Deus, qui ad cultum sacrárum imáginum asseréndum, beátum
    Joánnem cælésti doctrína et admirábili spíritus fortitúdine imbuísti: concéde nobis
    ejus intercessióne et exémplo; ut, quorum cólimus imágines, virtútes imitémur et
    patrocínia sentiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# No proper antiphon of his own -- standard de-Communi text, paired with the standard de-Communi commemoration versicle for common-of-a-confessor-doctor (non-Bishop, C5a -- inherits C5's own Ant2/Versum2 with no override) (not yet independently live-verified for this specific category, marked draft). Collect is the saint's own real proper (st-john-damascene-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Omnípotens sempitérne Deus, qui ad cultum sacrárum imáginum asseréndum, beátum
