# Verified against Divinum Officium (Monastic Tridentinum 1617) — Latin
# read from the live prayTertia query's own real-date output (2025-12-08);
# its English side rendered a *different* Marian feast's text by mistake
# (same class of query glitch as All Saints/St. Damasus this pull, just
# silent instead of empty, and caught only by cross-checking against the
# raw source file directly), so the English was read from
# web/www/horas/English/Sancti/12-08.txt instead. Its own closing formula
# ("$Per eumdem", not the standard "$Per Dominum") is expanded to this
# project's standard closing form for consistency, same convention used
# throughout.
collect:
  text: |
    Orémus.
    Deus, qui per immaculátam Vírginis Conceptiónem dignum Fílio tuo habitáculum præparásti: quǽsumus; ut qui ex morte ejúsdem Fílii tui prævísa, eam ab omni labe præservásti, nos quoque mundos ejus intercessióne ad te perveníre concédas.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

