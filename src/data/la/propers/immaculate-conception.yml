octave-readings/~-octave-day-7:
  source: Ex Bulla dogmatica Pii Papæ IX; Homilía sancti Sophrónii Epíscopi
  text: |
    Omnes norunt quanto studio hæc de immaculáta Deiparæ Vírginis Conceptióne doctrina a spectatíssimis religiosis familiis et celebrióribus theologicis academíis, ac præstantíssimis divinárum rerum sciéntia doctóribus fúerit trádita, asserta ac propugnata. Omnes páriter norunt quantopere solliciti fúerint Sacrórum antistites vel in ipsis ecclesiásticis convéntibus palam publiceque profiteri, sanctíssimam Dei Genitricem Vírginem Mariam, ob prævisa Christi Dómini Redemptoris merita, numquam originali labe, et idcirco sublimiori modo redemptam. Quibus illud profecto gravíssimum et omnino maximum accedit, ipsam quoque Tridentinam synodum, cum dogmaticum de peccáto originali ederet decretum, státuit ac definívit: Omnes hómines nasci originali culpa infectos; tamen solemniter declarasse: Non esse suæ intentiónis, in decreto ipso tantáque definitiónis amplitúdine comprehéndere beátam et immaculátam Vírginem Dei Genitricem Mariam.

    Et re quidem vera hanc de immaculáta beatíssimæ Vírginis Conceptióne doctrinam quotídie magis gravíssimo Ecclésiæ sensu, magisterio, studio, sciéntia ac sapiéntia tam splendide explicatam, declaratam, confírmatam, et apud omnes catholici orbis pópulos ac natiónes mirándum in modum propagatam, in ipsa Ecclésia semper exstitisse véluti a majóribus acceptam, ac revelátæ doctrinæ charactére insígnitam, illustria venerandæ antiquitátis Ecclésiæ orientalis et occidentalis monuménta validíssime testántur.

    Quapropter enarrántes verba, quibus Deus præparáta renovandis mortálibus suæ pietátis remedia inter ipsa mundi primordia prænuntians; et deceptoris serpentis rétudit audaciam et nostri generis spem mirifice eréxit, inquiens, Inimicítias ponam inter te et mulierem, et semen tuum et semen illíus; docuére, divino hoc oraculo clare aperteque demonstrátum fuísse misericordem humani generis Redemptórem, scilicet unigénitum Dei Fílium Christum Jesum, ac designatam beatíssimam ejus Matrem Vírginem Mariam.

    Vere benedicta tu in muliéribus, quóniam Hevæ maledictiónem in benedictiónem commutásti; quóniam Adam, qui prius jacebat exsecratióne perculsus, ut per te benedicerétur effecísti. Vere benedicta tu in muliéribus, quóniam benedíctio Patris per te affulsit homínibus, eosque a veteri maledicto liberávit. Vere benedicta tu in muliéribus, quia per te progenitores tui salútem invéniunt. Vere benedicta tu in muliéribus, quóniam sine semine eum protulísti fructum, qui benedictiónem terrárum orbi elargítur. Vere benedicta tu in muliéribus, quia mulier naturali conditióne cum sis, Dei tamen Génetrix reipsa fies.

    Ne timeas Maria, invenísti enim apud Deum grátiam perire nesciam; invenísti apud Deum grátiam præ quálibet exímiam; invenísti apud Deum grátiam ómnibus votis expeténdam; invenísti apud Deum grátiam ómnium gratiárum splendidíssimam; invenísti apud Deum grátiam numquam elanguéntem. Et alii quidem iíque plures, ante te exímia sanctitáte floruérunt. Sed nemini, quemádmodum tibi, plena grátia impertita est: nemo sicut tu, ad tantum magnificéntiæ est evectus.

    Et mérito quidem; nemo enim sicut tu, ad Deum tam prope accessit; nemo sicut tu, Dei donis ditátus est; nemo sicut tu, Dei gratiæ particeps fuit. Nemo sic in se Deum complecti pótuit; nemo pótuit sic frui Dei præséntia. Et proptérea tibi clamávi, atque íterum veheménter clamábo: Ave grátia plena; Dóminus tecum: benedicta tu in muliéribus.
  responsory: |
    R. Per unum hóminem peccátum in hunc mundum intrávit, in quo omnes peccavérunt. * Ne tímeas, María, invenísti grátiam apud Deum. V. Erípuit Dóminus ánimam tuam de morte, et contra inimícum factus est protéctor tuus. R. Ne tímeas, María, invenísti grátiam apud Deum.
  status: verified

# Sourced directly from the raw reference files (web/www/horas/Latin+English/
# Sancti/12-15.txt) -- day 8, "In Octava," the Immaculate Conception's own
# octave closing day, same shape as days 2/3/5/7 (see those files' own
# headers). Not selected by the live prayMatutinum query under "Monastic
# Tridentinum 1617," included anyway per the same explicit user direction as
# the other days in this octave (2026-08). Joins an excerpt from Pope Pius
# IX's dogmatic bull "Ineffabilis Deus" (Lectio4-6 -- a different passage
# than any other day in this octave) with a homily of St. Epiphanius of
# Salamis on the Blessed Virgin (Lectio7-9, the bare Gospel incipit line
# dropped). The source file's own Lectio1-3 (a plain cross-reference to the
# feast day's own Nocturn I) are omitted, same as every other day's own
# Nocturn I.
# Responsory missing from this and this octave's other day-2/3/5/7 files --
# the feast's own Responsory1 (Sancti/12-08.txt), reused across the
# octave's combined-lesson readings the same way nativity-bvm's octave
# does; 12-09bmv.txt's own "vide Sancti/12-08" rule confirms it has no
# responsory of its own and inherits this one.
octave-readings/~-octave-day-8:
  source: Ex Bulla dogmatica Pii Papæ IX; Homilía sancti Epiphánii Epíscopi
  text: |
    Ab antíquis tempóribus Sacrórum antistites, ecclesiástici viri, regulares ordines ac vel ipsi imperatóres et reges ab hac apostolica Sede enixe efflagitarunt, ut immaculáta sanctíssimæ Dei Genitrícis Conceptio véluti catholicæ fidei dogma definirétur. Quæ postulatiónes hac nostra quoque ætate iterátæ fuérunt, ac potíssimum felicis recordatiónis Gregório décimo sexto prædecessori nostro, ac nobis ipsis oblátæ sunt tum ab epíscopis, tum a clero sæculari, tum a religiosis familiis, ac summis princípibus et fidelibus pópulis. Nos ítaque singulari animi nostri gáudio hæc ómnia probe noscéntes ac serio considerántes, vix dum, licet immeriti, arcano divinæ providéntiæ consílio ad hanc sublimem Petri Cáthedram evecti, totius Ecclésiæ gubernácula tractanda suscépimus, nihil certe antiquius habúimus, quam pro summa nostra vel a teneris annis erga sanctíssimam Dei Genitricem Vírginem Mariam veneratióne, pietáte et afféctu, ea ómnia perágere, quæ adhuc in Ecclésiæ votis esse poterant, ut beatíssimæ Vírginis honor augerétur, ejusque prærogativæ uberióri luce nitérent.

    Itaque plurimum in Dómino confisi advenisse témporum opportunitátem pro immaculáta sanctíssimæ Dei Genitrícis Vírginis Maríæ Conceptióne definienda, quam divina elóquia, veneranda traditio, perpetuus Ecclésiæ sensus, singuláris catholicórum antístitum ac fidelium conspirátio, et insígnia prædecessórum nostrórum acta et constitutiónes mirifice illustrant atque declarant; rebus ómnibus diligentíssime perpénsis et assiduis fervidisque ad Deum precibus effúsis, minime cunctándum nobis esse censúimus, supremo nostro judício immaculátam ipsíus Vírginis Conceptiónem sancire, definire, atque ita pientíssimis catholici orbis desidériis, nostræque in ipsam sanctíssimam Vírginem pietáti satisfácere, ac simul in ipsa unigénitum Fílium suum Dóminum nostrum Jesum Christum magis atque magis honorificare, cum in Fílium redundet quidquid honoris et laudis in Matrem impénditur.

    Quare postquam numquam intermísimus in humilitate et jejúnio privatas nostras et publicas Ecclésiæ preces Deo Patri per Fílium ejus offerre, ut Spíritus Sancti virtúte mentem nostram dirigere et confírmare dignarétur, implorato univérsæ cæléstis curiæ præsidio, et advocato cum gemítibus Paraclito Spiritu, eoque sic aspirante; ad honórem sanctæ et indivíduæ Trinitátis, ad decus et ornaméntum Vírginis Deiparæ, ad exaltatiónem fidei catholicæ et christianæ religiónis augméntum, auctoritate Dómini nostri Jesu Christi, beatórum Apostolórum Petri et Pauli, ac nostra, declaramus, pronuntiámus et definímus: Doctrinam quæ tenet beatíssimam Vírginem Mariam in primo instanti suæ Conceptiónis fuísse singulari omnipoténtis Dei grátia et privilegio, intuitu meritórum Christi Jesu Salvatoris humani generis, ab omni originalis culpæ labe præservatam immunem, esse a Deo revelátum, atque idcirco ab ómnibus fidelibus firmiter constanterque credéndam. Quapropter si qui secus ac a nobis definítum est, quod Deus avértat, præsumpserint corde sentire, ii nóverint ac porro sciant se proprio judício condemnatos, naufragium circa fidem passos esse, et ab unitate Ecclésiæ defecisse.

    Quid dicam, aut quid próloquar de præclára et sancta Vírgine? Solo enim Deo excepto, cunctis superior éxstitit: natúra formosior est ipsis Chérubim et Séraphim, et omni exercitu Angelico: cui prædicandæ cæléstis ac terrena lingua minime sufficit, immo vero nec Angelórum. O beáta Virgo, columba pura et sponsa cæléstis, Maria, cælum, templum, et thronus divinitátis, quæ coruscántem in cælo et in terra solem habes Christum! Nubes lucida, quæ fulgur de cælo lucidíssimum ad illuminándum mundum deduxísti Christum. Ave, grátia plena, porta cælórum, de qua in Canticis prophéta in decursu oratiónis plane et aperte prolóquitur inclámans: Hortus conclusus soror mea sponsa, hortus conclusus, fons signátus.

    Virgo est lílium immaculátum, quæ rosam immarcescíbilem génuit Christum. O sancta Deipara, ovis immaculáta quæ Verbum ex te incarnátum Agnum Christum peperisti! O Virgo sanctíssima, quæ exercitus Angelórum in stupórem dedúxisti! Stupéndum est miraculum in cælis, mulier amícta sole, gestans lucem in ulnis: stupéndum miraculum in cælis, thálamus Vírginis habens Fílium Dei: stupéndum miraculum in cælis, Dóminus Angelórum infans Vírginis effectus est. Angeli accusábant Hevam, nunc vero Mariam glória prosequúntur, quæ lapsam Hevam eréxit, et Adámum e paradiso dejectum in cælos misit. Ipsa enim est cæli et terræ mediatrix, quæ uniónem naturáliter peregit.

    Gratia sanctæ Vírginis est immensa. Hinc Gabriel in primis salutat Vírginem, dicens: Ave, grátia plena, quæ es splendidum cælum. Ave, grátia plena, multis virtútibus exornáta Virgo. Ave, grátia plena, quæ es urna aurea cóntinens manna cæleste. Ave, grátia plena, quæ sitiéntes perennis fontis dulcédine satias. Ave, sanctíssima Mater immaculáta, quæ genuísti Christum, qui est ante te. Ave, púrpura regia, quæ cæli terræque Regem induísti. Ave, liber incomprehénsus, quæ Verbum et Fílium Patris mundo legéndum exhibuisti.
  responsory: |
    R. Per unum hóminem peccátum in hunc mundum intrávit, in quo omnes peccavérunt. * Ne tímeas, María, invenísti grátiam apud Deum. V. Erípuit Dóminus ánimam tuam de morte, et contra inimícum factus est protéctor tuus. R. Ne tímeas, María, invenísti grátiam apud Deum.
