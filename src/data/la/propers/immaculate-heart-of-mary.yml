# Read directly from web/www/horas/Latin/Sancti/08-22.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Omnípotens sempitérne Deus, qui in Corde beátæ Maríæ Vírginis dignum
    Spíritus Sancti habitáculum præparásti: concéde propítius; ut ejúsdem
    immaculáti Cordis festivitátem devóta mente recoléntes, secúndum Cor tuum
    vívere valeámus.
    Per Dóminum ejúsdem Fílii tui: qui tecum vivit et regnat in unitáte Spíritus
    Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# The Immaculate Heart (Sancti/08-22.txt, `ex C11`) has no Matins hymn of its own;
# it takes the Common of the BVM's, byte-identical to matins-hymn-common-of-the-bvm.yml
# (same convention as this feast's existing lauds-/vespers-hymn files), but with
# the secular default "sídera" in stanza 1 (C11.txt's own [Hymnus Matutinum]), matching
# this feast's secular Lauds hymn, rather than the Monastic "ǽthera".
# Verified against Divinum Officium (Monastic Tridentinum 1617), Matins
# `votive=C11` live query, 2026-08 -- "Quem terra, pontus, ǽthera," the
# classic Common-of-the-BVM Matins hymn. Final stanza corrected 2026-09-10:
# the live query had baked in the *Lauds* hymn's own ending ("Glória tibi,
# Dómine... Cum Patre, et Sancto Spíritu"), not Matins' real default
# ("Jesu, tibi sit glória... Cum Patre, et almo Spíritu" -- C11.txt's own
# `[Hymnus Matutinum]`, marked with a leading `*` there and carried through
# unaffected by `[HymnusM Matutinum]`'s `sídera`->`ǽthera` substitution).
# English was already correct either way (same text either ending).
matins-hymn:
  text: |
    Quem terra, pontus, sídera
    Colunt, adórant, prædicant,
    Trinam regéntem máchinam,
    Claustrum Maríæ bájulat.

    Cui luna, sol, et ómnia
    Desérviunt per témpora,
    Perfúsa cæli grátia,
    Gestant puéllæ víscera.

    Beáta Mater múnere,
    Cujus supérnus ártifex
    Mundum pugíllo cóntinens,
    Ventris sub arca clausus est.

    Beáta cæli núntio,
    Fœcúnda sancto Spíritu,
    Desiderátus géntibus,
    Cujus per alvum fusus est.

    * Jesu, tibi sit glória,
    Qui natus es de Vírgine,
    Cum Patre, et almo Spíritu
    In sempitérna sǽcula. Amen.
  status: verified

