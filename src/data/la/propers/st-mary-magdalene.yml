# St. Mary Magdalene's own Matins hymn, Monastic track: Latin/Sancti/07-22.txt's
# [HymnusM Matutinum] ("Nardo María pístico", own doxology). The English
# stanza is the source's English of the secular hymn ("María castis
# ósculis"), shown by the engine beside this Latin; same scene, not a
# word-for-word translation, hence draft.
matins-hymn:
  text: |
    Nardo María pístico,
    Unxit beátos Dómini
    Pedes, rigándo lácrimis,
    Et detergéndo crínibus.

    Honor, decus, impérium,
    Sit Trinitáti únicæ
    Patri, Nato, Paráclito,
    Per infiníta sǽcula.
    Amen.
  status: verified

# Read from web/www/horas/Latin/Sancti/07-22.txt's own [Invit] (no
# Monastic override exists) and its English counterpart.
matins-invitatory:
  text: Laudémus Deum nostrum * In conversióne Maríæ Magdalénæ.
  status: verified

# St. Mary Magdalene's own Lauds hymn, Monastic track: Latin/Sancti/07-22.txt's
# [HymnusM Laudes]. The English is the source's English [Hymnus Laudes]
# (the secular Latin, "Summi Paréntis Unice"), which the engine also shows
# beside this Latin; it follows the same four images stanza for stanza but
# is not a translation of this exact text, hence draft.
lauds-hymn:
  text: |
    Ætérne Patris Unice,
    Nos pio vultu réspice,
    Qui Magdalénam hódie
    Vocas ad thronum glóriæ.

    In thesáuro repósita
    Regis est drachma pérdita:
    Gémmaque luce ínclyta
    De luto luci réddita.

    Jesu dulce refúgium,
    Spes una pæniténtium,
    Per peccatrícis méritum
    Peccáti solve débitum.

    Pia mater et húmilis,
    Natúræ memor frágilis,
    In hujus vitæ flúctibus
    Nos rege tuis précibus.

    Uni Deo sit glória
    Pro multifórmi grátia,
    Qui culpas et supplícia
    Remíttit, et dat prǽmia.
    Amen.
  status: verified

