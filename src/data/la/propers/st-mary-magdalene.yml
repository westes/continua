# Matins Nocturn 2-3 readings for St. Mary Magdalene, Penitent (Jul
# 22) — SanctiM/07-22.txt's own Lectio4-9 resolve back to
# `@Sancti/07-22:LectioN` (resliced), so this saint's own proper
# content is sourced from the Tridentine track exactly as for a
# pre-1955 saint (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-22.txt, English/Sancti/07-22.txt.
#
# Nocturn 2: Lectio4-6 (Pope St. Gregory the Great's homily) combined
# into one reading, one continuous excerpt.
# Nocturn 3: Lectio7's Gospel citation (Luke 7:36-50) was a bare
# incipit ("Et réliqua") with no full pericope text given; the full
# pericope is now authored too (isGospel: true, immediately before the
# homily) — this is this same day's own proper Missale [Evangelium]
# (`web/www/missa/Latin/Sancti/07-22.txt`, English/Sancti/07-22.txt),
# and is the very text `ember-september-friday.yml` reused verbatim
# from this file (its own header cites `@Sancti/07-22`) — reused here
# in turn for consistency (2026-09-05 update). The homily portion
# remains a single excerpt of St. Augustine's homily. No responsory
# given for either reading.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope St. Gregory the Great, Homily 25 on the Gospels
      text: |-
        María Magdaléne, quæ fúerat in civitáte peccátrix, amándo veritátem, lavit lácrimis máculas críminis: et vox Veritátis implétur, qua dícitur: Dimíssa sunt ei peccáta multa, quia diléxit multum. Quæ enim prius frígida peccándo remánserat, póstmodum amándo fórtiter ardébat. Quæ a monuménto Dómini, étiam discípulis recedéntibus, non recedébat. Exquirébat quem non invénerat; flebat inquiréndo, et amóris sui igne succénsa, ejus, quem ablátum crédidit, ardébat desidério. Unde cóntigit, ut eum sola tunc vidéret, quæ remánserat ut quǽreret: quia nimírum virtus boni óperis perseverántia est.

        Quæsívit ergo prius, et mínime invénit: perseverávit ut quæreret, unde et cóntigit ut inveníret: actúmque est, ut desidéria diláta créscerent, et crescéntia cáperent quod inveníssent. Hinc est enim quod de eódem sponsa Ecclésia in Cánticis canticórum dicit: In léctulo meo per noctes quæsívi quem díligit ánima mea. Diléctum namque in léctulo quærimus, quando, in præséntis vitæ aliquántula réquie, Redemptóris nostri desidério suspirámus. Per noctem quærimus: quia, etsi jam in illo mens vígilat, tamen adhuc óculus calígat.

        Sed, qui diléctum suum non invénit, restat ut surgat, civitátem circúmeat, id est, sanctam electórum Ecclésiam mente et inquisitióne percúrrat; per vicos eum et platéas quærat, id est, per angústa et lata gradiéntes aspíciat, ut, si qua inveníre in eis váleat, ejus vestígia exquírat: quia sunt nonnúlli étiam vitæ sæculáris, qui imitándum áliquid hábeant de actióne virtútis. Quæréntes autem nos vígiles invéniunt, qui custódiunt civitátem: quia sancti Patres, qui Ecclésiæ statum custódiunt, bonis nostris stúdiis occúrrunt, ut suo vel verbo vel scripto nos dóceant. Quos cum páululum pertransímus, invenímus quem dilígimus: quia Redémptor noster, etsi humilitáte homo inter hómines, divinitáte tamen super hómines fuit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 7:36-50
      text: 'In illo témpore: Rogábat Jesum quidam de pharisǽis, ut manducáret cum illo. Et ingréssus domum pharisǽi, discúbuit. Et ecce múlier, quæ erat in civitáte peccátrix, ut cognóvit, quod accubuísset in domo pharisǽi, áttulit alabástrum unguénti: et stans retro secus pedes ejus, lácrimis cœpit rigáre pedes ejus, et capíllis cápitis sui tergébat, et osculabátur pedes ejus, et unguénto ungébat. Videns autem pharisǽus, qui vocáverat eum, ait intra se, dicens: Hic si esset Prophéta, sciret útique, quæ et qualis est múlier, quæ tangit eum: quia peccátrix est. Et respóndens Jesus, dixit ad illum: Simon, hábeo tibi áliquid dícere. At ille ait: Magíster, dic. Duo debitóres erant cuidam fœneratóri: unus debébat denários quingéntos, et álius quinquagínta. Non habéntibus illis, unde rédderent, donávit utrísque. Quis ergo eum plus díligit? Respóndens Simon, dixit: Æstimo, quia is, cui plus donávit. At ille dixit ei: Recte judicásti. Et convérsus ad mulíerem, dixit Simóni: Vides hanc mulíerem? Intrávi in domum tuam, aquam pédibus meis non dedísti: hæc autem lácrimis rigávit pedes meos et capíllis suis tersit. Osculum mihi non dedísti: hæc autem, ex quo intrávit, non cessávit osculári pedes meos. Oleo caput meum non unxísti: hæc autem unguénto unxit pedes meos. Propter quod dico tibi: Remittúntur ei peccáta multa, quóniam diléxit multum. Cui autem minus dimíttitur, minus díligit. Dixit autem ad illam: Remittúntur tibi peccáta. Et cœpérunt, qui simul accumbébant, dícere intra se: Quis est hic, qui étiam peccáta dimíttit? Dixit autem ad mulíerem: Fides tua te salvam fecit: vade in pace.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Homily 23 (on Luke 7:36-50)
      text: Evangélium cum legerétur, attentíssime audístis; et res gesta narráta atque versáta est ante óculos cordis vestri. Vidístis enim, non carne, sed mente, Dóminum Jesum Christum in domo pharisǽi recumbéntem, et ab illo invitátum non fastidiéntem. Vidístis étiam in civitáte mulíerem famósam, mala útique fama, quæ erat peccátrix, non invitátam irruísse convívio ubi suus médicus recumbébat, et quæsísse pia impudéntia sanitátem; írruens, quasi importúna convívio, opportúna benefício. Nóverat enim quanto morbo laboráret; et illum ad sanándum esse idóneum, ad quem vénerat, sciébat.
      status: verified
