# St. Mary Magdalene's own Vespers hymn: Latin/Sancti/07-22.txt's
# [Hymnus Vespera] (the Monastic track takes it as-is, `[HymnusM Vespera]`
# only cuts the variable doxology after the `*`) and English/Sancti/07-22.txt.
# Confirmed against the engine's live Vespers render (Monastic Tridentinum
# 1617, 2026-07-21/22). Before this file the saint fell to the Common of a
# Holy Woman's hymn.
vespers-hymn:
  text: |
    Pater supérni lúminis,
    Cum Magdalénam réspicis,
    Flammas amóris éxcitas,
    Gelúque solvis péctoris.

    Amóre currit sáucia
    Pedes beátos úngere,
    Laváre fletu, térgere
    Comis, et ore lámbere.

    Astáre non timet cruci,
    Sepúlcro inhǽret ánxia,
    Truces nec horret mílites:
    Pellit timórem cáritas.

    O vera, Christe, cáritas,
    Tu nostra purga crímina,
    Tu corda reple grátia,
    Tu redde cæli prǽmia.

    * Patri simúlque Fílio,
    Tibíque, Sancte Spíritus,
    Sicut fuit, sit júgiter
    Sæclum per omne glória.
    Amen.
  status: verified

