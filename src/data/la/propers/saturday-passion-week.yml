# Transcribed from the reference engine's Mass propers (not the Office
# file, which carries no [Oratio] of its own for this day -- see
# web/www/horas/Latin/Tempora/Quad5-6.txt): the actual proper collect
# lives at web/www/missa/Latin/Tempora/Quad5-6.txt's [Oratio], with the
# parallel English at web/www/missa/English/Tempora/Quad5-6.txt. Marked
# `draft`, not `verified` -- see monday-passion-week-collect.yml's own
# note for why (direct Missal transcription, standard closing formula
# expanded, no live Office cross-check). (This day's own Lauds collect is
# unaffected by the Vespers-anticipation wrinkle documented in
# saturday-passion-week.yml -- only the evening's Magnificat antiphon is.)
collect:
  text: |
    Orémus.
    Profíciat, quǽsumus, Dómine, plebs tibi dicáta piæ devotiónis afféctu: ut sacris actiónibus erudíta, quanto majestáti tuæ fit grátior, tanto donis potióribus augeátur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft
  temporal: true

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2028-04-08 (a real Saturday-of-Passion-week date confirmed
# clean of any sanctoral collision -- title rendered exactly "Sabbato
# infra Hebdomadam Passionis ~ Feria major", no commemoration). Lauds
# itself is unaffected by the Vespers-anticipation wrinkle documented in
# saturday-passion-week.yml (that only touches the evening's Magnificat
# antiphon, which this batch deliberately doesn't author a file for).
benedictus-antiphon:
  text: Clarífica me, Pater, * apud temetípsum claritáte, quam hábui priúsquam mundus fíeret.
  status: verified
  temporal: true
