# Matins Nocturn 2 reading for Ss. Mark and Marcellian, Martyrs (Jun
# 18). No genuine SanctiM match: the correct Tridentine file is the
# suffixed `Sancti/06-18t.txt` (the plain `Sancti/06-18.txt` is St.
# Ephrem the Syrian instead, a different saint occupying the general
# calendar's own June 18 slot), and the only SanctiM file for this
# date, `SanctiM/06-18.txt`, bases `@Sancti/06-18` (Ephrem, not Mark
# and Marcellian) — same "don't trust the plain file" wrinkle as the
# pre-1955 pass (memory vu-matins-pre1955-saints); a missed
# pre-1955-pool candidate rather than a genuine SanctiM case (see
# memory vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/06-18t.txt, English/Sancti/06-18t.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Marcus et Marcellianus fratres Romani, propter christianam fidem a Fabiano duce comprehensi, ad stipitem alligati sunt, pedibus clavis confixis. Ad quos cum ita loqueretur judex: Resipiscite miseri, et vos ipsos ab his cruciatibus eripite: responderunt: Numquam tam jucunde epulati sumus, quam hæc libenter Jesu Christi causa perferimus, in cujus amóre nunc fixi esse cœpimus: utinam tamdiu nos hæc pati sinat, quamdiu hoc corruptibili corpore vestiti erimus. Qui diem noctemque in tormentis divinas laudes canentes, denique telis transfixi, ad martyrii gloriam pervenerunt. Quorum corpora via Ardeatina sepulta sunt.'
      status: verified
