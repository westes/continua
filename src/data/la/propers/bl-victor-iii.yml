# Matins Nocturn 2 reading for Bl. Victor III, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/10-16-VictorIII.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Victor Papa tértius, Desiderius ántea dictus, Benevénti príncipe família natus, a primis annis exímia pietáte morumque innocéntia præfúlsit. Vix exacta adolescéntia terrenas núptias aversatus, quas ei paréntes statuerant, sponsam clam déserens, erémum pétiit. Matre vero et consanguíneis id ægre ferentibus, ne a sancto propósito dimoverétur, monachi vitam ampléxus. várias successive sedes mutávit. Cavense scílicet monastérium incoluit, póstea ad cœnubium ínsulæ Tremitis divértit, et apud eremitas montis Majestatæ aliquándo delítuit. Dein cum ex gravi morbo convaluísset, Cassinum montem ascéndit, ubi propter singuláres virtútes a mónachis Abbas designatus, et a Stéphano nono confirmátus est. Ejúsdem Pontíficis nutu Constantinópolim Legátus míttitur pro restituenda Ecclésiæ Græcæ cum Apostolica Sede communióne.

        Stéphano defúncto ad Cassinense cœnubium revérsus, brevi a Nicoláo secúndo sanctæ Románæ Ecclésiæ Cardinális renuntiátus fuit, simúlque Cassinensis Abbas benedíctus. Idem Pontifex ejúsque successores eum ad præcípua ac difficillima Ecclésiæ negótia pertractanda destinarunt, quin a monachórum regímine distraheretur; nam non solum eórum aucto número sanctæ regulæ observántiam promóvit, sed cœnóbium fere ex integro restítuit. Basílicam ínsuper sancti patris Benedícti córpore claram, ádeo splendide a fundaméntis excitávit, pretiosisque lapídibus ab orientálibus étiam oris advectis, opéribus musivis, ac sacra supellectili mira arte magnoque sumptu elaborata ditavit, ut præclárum munificentiæ ejus ingeniique exstet monuméntum. Hanc basílicam Alexánder secúndus in signum suæ erga Desidérium benevolentiæ, consecrávit, adstantibus quam plúrimis Epíscopis, et Cardinálibus, inter quos digni sunt memória sanctus Petrus Damiánus et Hildebrandus, qui póstea Gregórii séptimi assúmpto nómine eídem Alexándro succéssit.

        Cum ipse sanctus Gregórius morti próximus eum tamquam dignissimum qui sibi in Apostólica Sede succederet designasset, commúni suffragio Desiderius Póntifex elígitur. At hujus humílitas tunc máxime enítuit, qui per annum fere integrum tantam dignitátem declinávit. Enixis dein prǽsulum, príncipum, ac pópuli précibus inductus, in Capuana synodo Victóris nomen et summi pontificátus insígnia accépit. Romam dedúctus, solémni ritu consecratur, ejectis inde pseudopontifice Guiberto ejúsque factionis homínibus. Exércitum sub vexillo sancti Petri ex tota fere Itália collectum contra Saracénos transmísit in Africam, ubi commísso prǽlio, illórum acies pénitus profligavit. Benevénti coacta synodo, schismaticos anathemate perculit, ac investituras, quæ in electionibus libertatem Ecclésiæ opprimebant, omníno proscripsit; pluraque ália ad ecclesiásticam disciplínam pertinéntia decrévit. Perácta synodo, letháli morbo corréptus, Cassinum a Cardinálibus et Epíscopis comitatus deférri vóluit, ubi labóribus ærumnísque pro concilianda Ecclésiæ pace conféctus, ánimam Deo réddidit sanctitáte et miráculis illústris, anno millésimo octogésimo séptimo. Sedit a suæ consecratiónis die menses quátuor et dies septem; ejúsque corpus in basílica Cassinensi summa veneratióne cólitur.
      status: verified
