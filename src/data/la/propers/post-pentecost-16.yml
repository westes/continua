# Nocturn 3, 16th Sunday after Pentecost. Sourced from Tempora/Pent16-0.txt.
# See post-pentecost-02.yml/post-pentecost-12.yml for sweep method note (no
# proper Nocturn 2 in the source). Lectio7 bare incipit (Luke 14:1-11, the
# healing of the man with dropsy) skipped; Lectio8-9 one continuous homily
# by St. Ambrose, combined.
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Luc 14:1-11
      text: 'In illo témpore: Cum intráret Jesus in domum cujúsdam príncipis pharisæórum sábbato manducáre panem, et ipsi observábant eum. Et ecce, homo quidam hydrópicus erat ante illum. Et respóndens Jesus dixit ad legisperítos et pharisǽos, dicens: Si licet sábbato curáre? At illi tacuérunt. Ipse vero apprehénsum sanávit eum ac dimísit. Et respóndens ad illos, dixit: Cujus vestrum ásinus aut bos in púteum cadet, et non contínuo éxtrahet illum die sábbati? Et non póterant ad hæc respóndere illi. Dicebat autem et ad invitátos parábolam, inténdens, quómodo primos accúbitus elígerent, dicens ad illos: Cum invitátus fúeris ad núptias, non discúmbas in primo loco, ne forte honorátior te sit invitátus ab illo, et véniens is, qui te et illum vocávit, dicat tibi: Da huic locum: et tunc incípias cum rubóre novíssimum locum tenére. Sed cum vocátus fúeris, vade, recúmbe in novíssimo loco: ut, cum vénerit, qui te invitávit, dicat tibi: Amíce, ascénde supérius. Tunc erit tibi glória coram simul discumbéntibus: quia omnis, qui se exáltat, humiliábitur: et qui se humíliat, exaltábitur.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Book 7 on Luke 14
      text: |-
        Curátur hydrópicus, in quo fluxus carnis exúberans ánimæ gravábat offícia, spíritus exstinguébat ardórem. Deínde docétur humílitas, dum in illo convívio nuptiáli appeténtia loci superióris arcétur; cleménter tamen, ut persuásio humanitátis aspertitátem coërcitiónis exclúderet, rátio profíceret ad persuasiónis efféctum, et corréctio emendáret afféctum. Huic quasi próximo límine humánitas copulátur: quæ ita Domínicæ senténtiæ definitióne distínguitur, si in páuperes et débiles conferátur: nam hospitálem esse remuneratúris, afféctus avarítiæ est.

        Postrémo jam quasi eméritæ milítiæ viro contemnendárum stipéndium præscríbitur facultátum: quod neque ille, qui stúdiis inténtus inferióribus possessiónes sibi terrénas coémit, regnum cæli possit adipísci, cum Dóminus dicat: Vende ómnia tua, et séquere me: nec ille, qui emit boves, cum Eliséus occíderit, et pópulo divíserit quos habébat: et ille qui duxit uxórem, cógitet quæ mundi sunt, non quæ Dei. Non quo conjúgium reprehendátur, sed quia ad majórem honórem vocétur intégritas: quóniam múlier innúpta et vídua cógitat quæ sunt Dómini, ut sit sancta córpore et spíritu.

        Sed ut in grátiam, ut supra cum víduis, ita nunc étiam cum conjúgibus revertámur: non refúgimus opiniónem, quam sequúntur pleríque, ut tria génera hóminum a consórtio magnæ illíus cœnæ æstimémus exclúdi: Gentílium, Judæórum, Hæreticórum. Et ídeo Apóstolus avarítiam dicit esse fugiéndam; ne impedíti more Gentíli, iniquitáte, malítia, impudicítia, avarítia, ad regnum Christi perveníre nequeámus. Omnis enim immúndus aut avárus, quod est idolórum sérvitus, non habet hereditátem in regno Christi et Dei.
      responsory: |-
        R. Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.
        V. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.
        R. Plena est omnis terra glória ejus.
      status: verified
