# Read directly from web/www/horas/Latin/Sancti/03-18.txt's own [Oratio]
# and its English counterpart.
collect:
  text: |
    Orémus.
    Da nobis, quǽsumus, omnípotens Deus, beato Cyríllo Pontífice intercedénte: te solum
    verum Deum, et quem misísti Jesum Christum ita cognóscere; ut inter oves, quæ vocem
    ejus áudiunt, perpétuo connumerári mereámur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-confessor-bishop (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). st-cyril-of-jerusalem has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-cyril-of-jerusalem-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Da nobis, quǽsumus, omnípotens Deus, beato Cyríllo Pontífice intercedénte: te solum
    verum Deum, et quem misísti Jesum Christum ita cognóscere; ut inter oves, quæ vocem
    ejus áudiunt, perpétuo connumerári mereámur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2-3 readings for St. Cyril of Jerusalem, Confessor,
# Doctor of the Church (Mar 18). Sourced directly from
# web/www/horas/Latin/Sancti/03-18.txt, English/Sancti/03-18.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3: Lectio7's Gospel citation (Matt 10:23-28) is a bare
# incipit ("Et réliqua"), so only the homily was originally authored
# (not marked isGospel) — just Lectio7's own homily portion (a
# complete, continuous excerpt from St. Athanasius). The source's own
# Lectio8-9 continue via a cross-reference to St. Athanasius's own feast
# (`@Sancti/05-02`), not transcribed here — see this file's own
# calendar-record comment.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before Athanasius's homily) — sourced
# from this day's own Missale [Evangelium] in
# web/www/missa/Latin/Sancti/03-18.txt (full text given there, not a
# redirect; same citation and text as st-athanasius.yml's own Gospel,
# authored independently here).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Cyrillus Hierosolymitanus a teneris annis divinarum scripturarum studio summopere deditus, adeo in earum scientia profecit, ut orthodoxæ fidei strenuus assertor evaserit. Monasticis institutis imbutus, perpetuæ continentiæ, omnique severiori vivendi rationi se addictum voluit. Postquam a sancto Maximo Hierosolymæ episcopo presbyter ordinatus fuit, munus verbi divini fidelibus prædicandi et catechumenos edocendi summa cum laude implevit, atque illas vere mirandas conscripsit catecheses, quibus totam ecclesiasticam doctrinam dilucide et copiose complexus, singula religionis dogmata contra fidei hostes solide propugnavit. Ita vero in his enucleate et distincte disseruit, ut non solum jam exortas hæreses, sed futuras étiam quasi præsagiens everterit, quemadmodum præstitit asserendo Corporis et Sanguinis Christi realem præsentiam in mirabili Eucharistiæ sacramento. Vita autem functo sancto Maximo, a provinciæ episcopis in illius locum suffectus est.

        In episcopatu injurias multas et calamitates, non secus ac beatus Athanasius, cui cœvus erat, ab Arianorum factionibus fidei causa perpessus fuit. Hi enim ægre ferentes Cyrillum vehementer hæresibus obsistere, ipsum calumniis aggrediuntur, et in conciliabulo depositum e sua sede deturbant. Quorum furori ut se subtraheret, Tarsum Ciliciæ aufugit, et quoad vixit Constantius, exsilii rigorem pertulit. Post illius mortem, Juliano Apostata ad imperium evecto, Hierosolymam redire potuit, ubi ardenti zelo gregi suo ab erroribus et a vitiis revocando operam navavit. Sed iterum, Valente imperatore, exsulare coactus est, donec, reddita Ecclesiæ pace per Theodosium Magnum, et Arianorum crudelitate audaciaque repressa, ab eodem imperatore tamquam fortissimus Christi athleta honoribus susceptus suæ sedi restitutus fuit. Quam strenue et sancte sublimis officii sui munia impleverit, luculenter apparet ex florenti tunc temporis Hierosolymitanæ ecclesiæ statu, quem sanctus Basilius loca sancta veneraturus, ibi aliquamdiu commoratus, describit.

        Venerandi hujus præsulis sanctitatem cælestibus signis a Deo fuísse illustratam memoriæ traditum accepimus. Inter hæc recensetur præclara crucis, solis radiis fulgentioris, apparitio, quæ episcopatus ejus initia decoravit. Hujusmodi prodigii ethnici et Christiani testes oculares fuerunt cum ipso Cyrillo qui gratiis primum in Ecclesia Deo redditis, illud per epistolam Constantio imperatori narravit. Nec minus admiratione dignum, quod Judæis templum a Tito eversum restaurare ex impio imperatoris Juliani jussu conantibus, evenit. Vehementi enim terræmotu oborto, et ingentibus flammarum globis e terra erumpentibus, omnia opera ignis consumpsit, ita ut Judæi et Julianus deterriti, ab incepto destiterint; prout scilicet indubitanter futurum Cyrillus prædixerat. Qui demum paulo ante obitum Concilio œcumenico Constantinopolitano interfuit, in quo Macedonii hæresis, et iterum Ariana condemnata est. Ac Jerúsalem inde reversus, fere septuagenarius, trigesimo quinto sui episcopatus anno sancto fine quievit. Ejus Officium ac Missam Leo decimus tertius Pontifex Maximus ab universa Ecclesia celebrari mandavit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 10:23-28
      text: 'In illo témpore: Dixit Jesus discípulis suis: Cum persequéntur vos in civitáte ista, fúgite in áliam. Amen, dico vobis, non consummábitis civitátes Israël, donec véniat Fílius hóminis. Non est discípulus super magístrum nec servus super Dominum suum. Súfficit discípulo, ut sit sicut magíster ejus: et servo, sicut dóminus ejus. Si patremfamílias Beélzebub vocavérunt; quanto magis domésticos ejus? Ne ergo timuéritis eos. Nihil enim est opértum, quod non revelábitur: et occúltum, quod non sciétur. Quod dico vobis in ténebris, dícite in lúmine: et quod in aure audítis, prædicáte super tecta. Et nolíte timére eos, qui occídunt corpus, ánimam autem non possunt occídere: sed pótius timéte eum, qui potest et ánimam et corpus pérdere in gehénnam.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Athanasius, Defence of his Own Flight (on Matt 10:23-28)
      text: 'In lege præceptum erat ut constituerentur civitates refugiorum, ut qui quomodocumque ad necem quærerentur, servari possent. In consummatione porro sæculorum cum advenisset illud ipsum Verbum Patris, quod Moysi antea locutum fuerat, rursus hoc præceptum dedit: Cum vos, inquiens, persecuti fuerint in civitate ista, fugite in aliam. Pauloque post subjicit: Cum videritis illam abominationem desolationis quæ dicta est per Danielem prophetam, consistentem in loco sancto (qui legit, intelligat), tunc qui in Judǽa sunt fugiant ad montes et qui in tecto est, ne descendat tollere aliquid de domo sua: et qui in agro est, non revertatur tollere tunicam suam.'
      status: verified
