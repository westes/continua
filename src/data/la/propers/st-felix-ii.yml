# Matins Nocturn 2 reading for St. Felix II, Pope and Martyr (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/07-29-FelixII.txt, [Lectio4], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Felix secúndus Románus, patre Anastasio, ex Románæ Ecclésiæ archidiacono in Pontíficem eléctus est, vivénte Libério. Cum autem de Felícis pontificátu, témpore Gregórii décimi tértii, non levis controversia incidísset, virique gravissimi diversum sentirent, áccidit eo ipso témpore, ut in diaconia sanctórum Mártyrum Cosmæ et Damiáni, in foro Románo, quidam thesáurum quæréntes, in arcam marmoream incíderint: in qua corpus sancti Felícis repértum est, una cum lapideo laterculo, ibídem intus posito, hisque lítteris exarato: Corpus sancti Felícis Papæ et Mártyris, qui damnávit Constantium. Cóntigit id prídie ejus diéi quo Felícis in Ecclésia natális dies agi consuéverat, quarto Kaléndas Augústi, anno Dómini millésimo quingentésimo octogésimo secúndo. Unde Felice quasi pro se testimónium reddente, festum ejus in eádem diaconia, cum majóri solemnitáte síngulis annis celebrári consuevit.'
      status: verified
