# Matins Nocturn content for the Thursday after Ash Wednesday — read from
# web/www/horas/{Latin,English}/Tempora/Quadp3-4.txt. Recombined into one
# reading (Lectio1-3 are one continuous Augustine homily split only to
# fill the fixed 3-lesson slot count — this store's established default).
# Responsory is Lectio1's own (given directly in this file, not a
# cross-reference), per the "the first one, when several collapse"
# convention.
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Matt 8:5-13
      text: 'In illo témpore: Cum introísset Jesus Caphárnaum, accéssit ad eum centúrio, rogans eum, et dicens: Dómine, puer meus jacet in domo paralýticus, et male torquétur. Et ait illi Jesus: Ego véniam, et curábo eum. Et respóndens centúrio, ait: Dómine, non sum dignus ut intres sub tectum meum: sed tantum dic verbo, et sanábitur puer meus. Nam et ego homo sum sub potestáte constitútus, habens sub me mílites, et dico huic: Vade, et vadit; et álii: Veni, et venit; et servo meo: Fac hoc, et facit. Audiens autem Jesus, mirátus est, et sequéntibus se dixit: Amen dico vobis, non invéni tantam fidem in Israël. Dico autem vobis, quod multi ab Oriénte et Occidénte vénient, et recúmbent cum Abraham, et Isaac, et Jacob in regno cælórum: fílii autem regni ejiciéntur in ténebras exterióres: ibi erit fletus et stridor déntium. Et dixit Jesus centurióni: Vade, et sicut credidísti, fiat tibi. Et sanátus est puer in illa hora.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Book 2 on the Agreement of the Evangelists, ch. 20
      text: |-
        Videámus, utrum sibi de hoc servo centuriónis Matthǽus Lucásque conséntiant. Matthǽus enim dicit: Accéssit ad eum centúrio, rogans eum, et dicens: Puer meus jacet in domo paralýticus. Cui vidétur repugnáre quod ait Lucas: Et cum audísset de Jesu, misit ad eum senióres Judæórum, rogans eum ut veníret, et sanáret servum ejus. At illi cum veníssent ad Jesum, rogábant eum sollícite, dicéntes ei: Quia dignus est ut hoc illi præstes: díligit enim gentem nostram, et synagógam ipse ædificávit nobis. Jesus autem ibat cum illis: et cum jam non longe esset a domo, misit ad eum centúrio amícos, dicens: Dómine, noli vexári: non enim dignus sum ut sub tectum meum intres.

        Si enim hoc ita gestum est, quómodo erit verum, quod Matthǽus narrat: Accéssit ad eum quidam centúrio, cum ipse non accésserit, sed amícos míserit: nisi diligénter adverténtes intellegámus Matthǽum non omnímodo deseruísse usitátum morem loquéndi? Non solum enim dícere solémus, accessísse áliquem étiam antequam pervéniat illuc, quo dícitur accessísse: unde étiam dícimus: Parum accéssit, vel multum accéssit eo, quo áppetit perveníre: verum étiam ipsam perventiónem cujus adipiscéndi causa accéditur, dícimus plerúmque factam, etsi eum, ad quem pérvenit, non vídeat ille qui pérvenit, cum per amícum pérvenit ad áliquem, cujus ei favor est necessárius. Quod ita ténuit consuetúdo, ut jam étiam vulgo perventóres appelléntur, qui poténtium quorúmlibet tamquam inaccessíbiles ánimos, per conveniéntium personárum interpositiónem, ambitiónis arte pertíngunt.

        Non ergo absúrde Matthǽus, étiam quod vulgo possit intéllegi, per álios facto accéssu centuriónis ad Dóminum, compéndio dícere vóluit: Accéssit ad eum centúrio. Verúmtamen non negligénter intuénda est étiam sancti Evangelístæ altitúdo mýsticæ locutiónis, secúndum quam scriptum est in Psalmo: Accédite ad eum, et illuminámini. Proínde quia fidem centuriónis, qua vere accéditur ad Jesum, ipse ita laudávit, ut díceret: Non invéni tantam fidem in Israël: ipsum pótius accessísse ad Christum dícere vóluit prudens Evangelísta, quam illos, per quos verba sua míserat.
      responsory: |-
        R. Dómine, puer meus jacet paralýticus in domo, et male torquétur: * Amen dico tibi, ego véniam, et curábo eum.
        V. Dómine, non sum dignus ut intres sub tectum meum: sed tantum dic verbo, et sanábitur puer meus.
        R. Amen dico tibi, ego véniam, et curábo eum.
      status: verified
