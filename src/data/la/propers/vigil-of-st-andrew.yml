# Matins Nocturn 2 reading for the Vigil of St. Andrew the Apostle
# (Nov 29) — pre-1955-but-post-1617 (no SanctiM/11-29*.txt at all).
# web/www/horas/Latin/Sancti/11-29.txt, English/Sancti/11-29.txt.
#
# Lectio1's Gospel portion (John 1:35-51, the calling of Andrew and
# the first disciples) gave only the incipit ("Et réliqua") in the
# horas file; the full pericope is this day's own Mass Gospel, sourced
# directly from web/www/missa/Latin+English/Sancti/11-29.txt's
# [Evangelium] and added 2026-09-05 (isGospel: true) immediately before
# Lectio1's own homily portion + Lectio2-3, one continuous excerpt from
# St. Augustine's Tractate 7 on John, combined into a single reading.
# No responsory given.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: true
      citation: Joann 1:35-51
      text: 'In illo témpore: Stabat Joánnes, et ex discípulis ejus duo. Et respíciens Jesum ambulántem, dicit: Ecce Agnus Dei. Et audiérunt eum duo discípuli loquéntem, et secúti sunt Jesum. Convérsus autem Jesus, et videns eos sequéntes se, dicit eis: Quid quæritis? Qui dixérunt ei: Rabbi -- quod dícitur interpretátum Magíster --, ubi hábitas? Dicit eis: Veníte et vidéte. Venérunt et vidérunt, ubi manéret, et apud eum mansérunt die illo: hora autem erat quasi décima. Erat autem Andréas, frater Simónis Petri, unus ex duóbus, qui audíerant a Joánne et secúti fúerant eum. Invénit hic primum fratrem suum Simónem, et dicit ei: Invénimus Messíam -- quod est interpretátum Christus --. Et addúxit eum ad Jesum. Intúitus autem eum Jesus, dixit: Tu es Simon, fílius Jona: tu vocáberis Cephas, quod interpretátur Petrus. In crastínum vóluit exíre in Galilæam, et invénit Philíppum. Et dicit ei Jesus: Séquere me. Erat autem Philíppus a Bethsáida, civitáte Andréæ et Petri. Invénit Philíppus Nathánaël, et dicit ei: Quem scripsit Moyses in lege, et Prophétæ, invénimus Jesum, fílium Joseph, a Názareth. Et dixit ei Nathánaël: A Názareth potest áliquid boni esse? Dicit ei Philíppus: Veni et vide. Vidit Jesus Nathánaël veniéntem ad se, et dicit de eo: Ecce vere Israëlíta, in quo dolus non est. Dicit ei Nathánaël: Unde me nosti? Respóndit Jesus et dixit ei: Priúsquam te Philíppus vocáret, cum esses sub ficu, vidi te. Respóndit ei Nathánaël et ait: Rabbi, tu es Fílius Dei, tu es Rex Israël. Respóndit Jesus et dixit ei: Quia dixi tibi: Vidi te sub ficu, credis: majus his vidébis. Et dicit ei: Amen, amen, dico vobis, vidébitis cœlum apértum, et Angelos Dei ascendéntes et descendéntes supra Fílium hóminis.'
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tractate 7 on John
      text: |-
        Quia talis erat Joannes amicus sponsi, non quærebat gloriam suam, sed testimonium perhibebat veritati: numquid voluit apud se remanere discipulos suos, ut non sequerentur Dominum? Magis ipse ostendit discipulis suis quem sequerentur: habebant enim illum tamquam agnum. Et ille: Quid me attenditis: Ego non sum agnus. Ecce Agnus Dei. De quo et superius dixerat: Ecce Agnus Dei. Et quid nobis prodest Agnus Dei? Ecce, ait, qui tollit peccatum mundi. Secuti sunt illum, hoc audito, duo qui erant cum Joanne.

        Videamus sequentia. Ecce Agnus Dei. Hoc Joannes. Et audierunt eum duo discipuli loquentem, et secuti sunt Jesum. Non sic illum sequebantur, quasi jam ut inhærerent illi: nam manifestum est, quando illi inhæserunt, quia de navi eos vocavit. In his enim duobus erat Andreas, sicut modo audistis. Andreas autem frater Petri erat. Et novimus in Evangelio quod Petrum et Andream Dominus de navi vocavit, dicens: Venite post me, et faciam vos piscatores hominum. Et ex illo jam inhæserunt illi, ut non recederent.

        Modo ergo quod illum sequuntur isti duo, non quasi non recessuri sequuntur, sed videre voluerunt ubi habitaret, et facere quod scriptum est: Limen ostiorum ejus exterat pes tuus: surge ad illum venire assidue, et erudire præceptis ejus. Ostendit eis ille ubi maneret: venerunt, et fuerunt cum illo. Quam beatum diem duxerunt, quam beatam noctem! Quis est, qui nobis dicat quæ audierint illi a Domino? Aedificemus et nosmetipsi in corde nostro, et faciamus domum, quo veniat ille, et doceat nos, et colloquatur nobis.
      status: verified
