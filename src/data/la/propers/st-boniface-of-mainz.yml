# Read directly from web/www/horas/Latin/Sancti/06-05.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui multitúdinem populórum, beáti Bonifátii Mártyris tui atque Pontíficis
    zelo, ad agnitiónem tui nóminis vocáre dignátus es: concéde propítius; ut, cujus
    solémnia cólimus, étiam patrocínia sentiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-martyr-bishop (`[Ant 2]`+`[Versum 2]`
