# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-boniface-of-mainz-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Qui odit * ánimam suam in hoc mundo, in vitam ætérnam custódit eam.
    V. Justus ut palma florébit.
    R. Sicut cedrus Líbani multiplicábitur.
    Orémus.
    Deus, qui multitúdinem populórum, beáti Bonifátii Mártyris tui atque Pontíficis
    zelo, ad agnitiónem tui nóminis vocáre dignátus es: concéde propítius; ut, cujus
    solémnia cólimus, étiam patrocínia sentiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2-3 readings for St. Boniface, Bishop and Martyr
# (June 5). Sourced directly from web/www/horas/Latin/Sancti/06-05.txt,
# English/Sancti/06-05.txt. Nocturn 2: Lectio4-6 combined into one
# reading, one continuous vita.
#
# Update (2026-09-05): Nocturn 3's Gospel pericope, previously left
# unauthored because horas/Latin/Sancti/06-05.txt's own Lectio7 gives
# only the incipit ("Et réliqua"), is now authored too (isGospel: true,
# immediately before the homily) -- the citation (Matt 5:1-12, the
# Beatitudes) comes from that same Lectio7 line, and the full text is
# sourced from missa/Latin/Sancti/06-05.txt's own [Evangelium] (the Mass
# Gospel and the Matins Nocturn 3 Gospel are the same pericope), not
# guessed at.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Bonifátius, ántea Winfrídus appellátus, apud Anglos natus est exeúnte sæculo séptimo, et ab ipsa infántia mundum aversátus, vitam monásticam in votis hábuit. Cum ejus pater ánimum sæculi illécebris permutáre frustra tentásset, monastérium ingréditu, et sub beáti Wolphárdi disciplína ómnium virtútum ac scientiárum génere imbúitur. Annum agens trigésimum sacerdótio insignítur, ac verbi divíni prædicátor assíduus, magno animárum lucro hoc in múnere versátur. Attamen, regnum Christi adaugére desíderans, contínuo flebat ingéntem multitúdinem barbarórum, qui ignorántiæ ténebris immérsi dæmoni famulabántur. Qui quidem animárum zelus cum in dies inexstinguíbili ardóre accrésceret, divíno númine per lácrimas et oratiónes exploráto, facultátem a monastérii præpósito obtínuit ad Germánicas oras proficiscéndi.

        Ex Anglia duóbus cum sóciis navem solvens, Dorestádium in Frísiæ óppidum venit. Cum autem bellum gravíssimum inter Frísonum regem Radbódum et Cárolum Martéllum exarsísset, sine fructu Evangélium prædicávit. Quaprópter in Angliam revérsus, ad suum redívit monastérium, cui invítus præfícitur. Post elápsum biénnium, ex consénsu epíscopi Vintoniénsis, munus abdicávit, et Romam proféctus est, ut apostólica auctoritáte ad Gentílium conversiónem delegarétur. Cum ad Urbem pervenísset, a Gregório secúndo benígne excípitur, pro Winfrído Bonifátius a Pontífice nominátur. In Germániam diréctus, Thuríngiæ Saxoniæque pópulis Christum annuntiávit. Cum intérea Radbódus, Frísiæ rex ac infestíssimus christiáni nóminis hostis, occubuísset, Bonifátius ad Frísones rédiit, ubi sancti Willibrórdi sócius per triénnium tanto cum fructu Evangélium prædicávit, ut, destrúctis idolórum simulácris, innúmeræ vero Deo ecclésiæ excitaréntur.

        A sancto Willibrórdo ad episcopále munus expetítus, illud detrectávit ut prómpius infidélium salúti instáret. In Germániam proféctus, plura Hassórum míllia a dæmonis superstitióne avocávit. A Gregório Pontífice Romam evocátus, post insígnem fídei professiónem epíscopus consecrátur. Exínde ad Germános redux, Hássiam et Thuríngiam ab idololatríæ relíquiis pénitus expurgávit. Tanta propter mérita Bonifátius a Gregório tértio ad dignitátem archiepiscopálem evéhitur, et tértio Romam proféctus a summo Pontífice Sedis apostólicæ legátus constitúitur. Qua insignítus auctoritáte quátuor episcopátus instítuit, et várias synodos celebrávit, inter quas concílium Leptinénse memorábile est, apud Belgas in Cameracénsi diœcési celebrátum, quo quidem témpore ad fidem in Bélgio adaugéndam egrégie cóntulit. A Zacharía Papa creátus Mogúntius archiepíscopus, ipso Pontífice jubénte, Pipínum in regem Francórum unxit. Post mortem sancti Willibrórdi Ultrajecténsem ecclésiam gubernándum suscépit, primo per Eóbanum, deínde per seípsum, dum ab ecclésia Moguntína absolútus Ultrajécti resédit. Frisónibus ad idololatríam relápsis, Evangélium prædicáre rursus aggréditur, cumque offício pastoráli occuparétur, a bárbaris et ímpiis homínibus juxta Bornam flúvium cum Eóbano coëpíscopo multísque áliis cruénta cæde perémptus martyrii palma condecorátur. Corpus sancti Bonifátii Mogúntiam translátum, et, ut ipse vivens petíerat, in Fuldénsi monastério, quod exstrúxerat, recónditum fuit, ubi multis miráculis incláruit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 5:1-12
      text: 'In illo témpore: Videns Jesus turbas, ascéndit in montem, et cum sedísset, accessérunt ad eum discípuli ejus, et apériens os suum, docébat eos, dicens: Beáti páuperes spíritu: quóniam ipsórum est regnum cœlórum. Beáti mites: quóniam ipsi possidébunt terram. Beáti, qui lugent: quóniam ipsi consolabúntur. Beáti, qui esúriunt et sítiunt justítiam: quóniam ipsi saturabúntur. Beáti misericórdes: quóniam ipsi misericórdiam consequántur. Beáti mundo corde: quóniam ipsi Deum vidébunt. Beáti pacífici: quóniam fílii Dei vocabúntur. Beáti, qui persecutiónem patiúntur propter justítiam: quóniam ipsórum est regnum cœlórum. Beáti estis, cum maledíxerint vobis et persecúti vos fúerint, et díxerint omne malum advérsum vos, mentiéntes, propter me: gaudete et exsultáte, quóniam merces vestra copiósa est in cœlis.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine of Hippo, Book I on the Lord's Sermon on the Mount, ch. 2-3
      text: |-
        Beáti mundo corde; quóniam ipsi Deum vidébunt. Quam ergo stulti sunt, qui Deum istis exterióribus óculis quærunt, cum corde videátur, sicut álibi scriptum est: Et in simplicitáte cordis quærite illum. Hoc est enim mundum cor, quod est simplex cor. Et quemádmodum lumen hoc vidéri non potest, nisi óculis mundis; ita nec Deus vidétur, nisi mundum sit illud quo vidéri potest. Beáti pacífici; quóniam ipsi fílii Dei vocabúntur. In pace perféctio est, ubi nihil repúgnat; et ídeo fílii Dei pacífici, quóniam nihil in his resístit Deo, et útique fílii similitúdinem patris habére debent.

        Pacífici autem in semetípsis sunt, qui omnes ánimi sui motus componéntes, et subjiciéntes ratióni, id est menti et spirítui, carnalésque concupiscéntias habéntes edómitas, fiunt regnum Dei. In quo ita sunt ordináta ómnia, ut id quod est in hómine præcípuum et excéllens, hoc ímperet, céteris non reluctántibus, quæ sunt nobis bestiísque commúnia; atque idípsum quod excélluit in hómine, id est mens et rátio, subjiciátur potióri, quod est ipsa véritas, unigénitus Fílius Dei. Neque enim imperáre inferióribus potest, nisi superióri se ipse subjíciat. Et hæc est pax, quæ datur in terra homínibus bonæ voluntátis; hæc vita consummáti perfectíque sapiéntis.

        De hujúsmodi regno pacatíssimo et ordinatíssimo missus est foras princeps hujus sæculi, qui pervérsis inordinatísque dominátur. Hac pace intrínsecus constitúta atque firmáta, quascúmque persecutiónes ille, qui foras missus est, forínsecus concitáverit, auget glóriam, quæ secúndum Deum est; non áliquid in illo ædifício labefáctans, sed deficiéntibus máchinis suis innotéscere fáciens, quanta fírmitas intus exstrúcta sit. Ideo séquitur: Beáti, qui persecutiónem patiúntur propter justítiam; quóniam ipsórum est regnum cælórum.
      status: verified
