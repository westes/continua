# Matins Nocturn content for Tuesday in the 4th week of Lent — read from
# web/www/horas/{Latin,English}/Tempora/Quad4-2.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad4-2.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Augustine
# homily split only to fill the fixed 3-lesson slot count). Responsory is
# Lectio1's own (given directly in this file, not a cross-reference).
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Joann 7:14-31
      text: 'In illo témpore: Jam die festo mediánte, ascéndit Jesus in templum, et docébat. Et mirabántur Judǽi, dicéntes: Quómodo hic lítteras scit, cum non didícerit? Respóndit eis Jesus et dixit: Mea doctrína non est mea, sed ejus, qui misit me. Si quis volúerit voluntátem ejus fácere, cognóscet de doctrína, utrum ex Deo sit, an ego a meípso loquar. Qui a semetípso lóquitur, glóriam própriam quærit. Qui autem quærit glóriam ejus, qui misit eum, hic verax est, et injustítia in illo non est. Nonne Móyses dedit vobis legem: et nemo ex vobis facit legem? quid me quǽritis interfícere? Respóndit turba, et dixit: Dæmónium habes: quis te quærit interfícere? Respóndit Jesus et dixit eis: Unum opus feci, et omnes mirámini. Proptérea Móyses dedit vobis circumcisiónem - non quia ex Móyse est, sed ex pátribus: - et in sábbato circumcíditis hóminem. Si circumcisiónem áccipit homo in sábbato, ut non solvátur lex Móysi: mihi indignámini, quia totum hóminem sanum feci in sábbato? Nolíte judicáre secúndum fáciem, sed justum judícium judicáte. Dicébant ergo quidam ex Jerosólymis: Nonne hic est, quem quærunt interfícere? Et ecce, palam lóquitur, et nihil ei dicunt. Numquid vere cognovérunt príncipes, quia hic est Christus? Sed hunc scimus, unde sit: Christus autem, cum vénerit, nemo scit, unde sit. Clamábat ergo Jesus in templo docens, et dicens: Et me scitis et, unde sim, scitis, et a meípso non veni, sed est verus, qui misit me, quem vos nescítis. Ego scio eum, quia ab ipso sum, et ipse me misit. Quærébant ergo eum apprehéndere: et nemo misit in illum manus, quia nondum vénerat hora ejus. De turba autem multi credidérunt in eum.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, 29th Tract on John
      text: |-
        Ille qui latébat, docébat, et palam loquebátur, et non tenebátur. Illud enim ut latéret, erat causa exémpli, hoc potestátis. Sed cum docéret, mirabántur Judǽi. Omnes quidem, quantum árbitror, mirabántur, sed non omnes convertebántur. Et unde admirátio? Quia multi nóverant ubi natus, quemádmodum fúerit educátus. Nunquam eum víderant lítteras discéntem: audiébant autem de lege disputántem, legis testimónia proferéntem, quæ nemo posset proférre, nisi legísset, nemo légeret, nisi lítteras didicísset: et ídeo mirabántur. Eórum autem admirátio, magístro facta est insinuándæ áltius veritátis occásio.

        Ex eórum quippe admiratióne et verbis, dixit Dóminus profúndum áliquid, et diligéntius ínspici et discúti dignum. Quid ergo Dóminus respóndit eis, admirántibus quómodo sciret lítteras, quas non didícerat? Mea, inquit, doctrína non est mea, sed ejus qui misit me. Hæc est profúnditas prima: vidétur enim paucis verbis quasi contrária locútus. Non enim ait: Ista doctrína non est mea: sed, Mea doctrína non est mea. Si non tua, quómodo tua? si tua, quómodo non tua? Tu enim dicis utrúmque: et mea doctrína, et non mea.

        Si ergo intueámur diligénter quod ipse in exórdio dicit sanctus Evangelísta: In princípio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum: inde pendet hujus solútio quæstiónis. Quæ est doctrína Patris, nisi Verbum Patris? Ipse ergo Christus doctrína Patris, si Verbum Patris. Sed quia Verbum, non potest esse nullíus, sed alicújus: et suam doctrínam dixit seípsum, et non suam, quia Patris est Verbum. Quid enim tam tuum quam tu? Et quid tam non tuum quam tu, si alicújus est, quod es?
      responsory: |-
        R. Quid me quǽritis interfícere, hóminem qui vera locútus sum vobis? * Si male locútus sum, testimónium pérhibe de malo: si autem bene, cur me cædis?
        V. Multa bona ópera operátus sum vobis: propter quod opus vultis me occídere?
        R. Si male locútus sum, testimónium pérhibe de malo: si autem bene, cur me cædis?
      status: verified
