# Quarta infra Hebdomadam Passionis ~ Feria major", no commemoration).
benedictus-antiphon:
  text: 'Oves meæ * vocem meam áudiunt: et ego Dóminus agnósco eas.'
  status: verified
  temporal: true

# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# live query, 2028-04-05 (same clean date as the sibling
