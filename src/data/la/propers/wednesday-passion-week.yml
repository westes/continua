# Transcribed from the reference engine's Mass propers (not the Office
# file, which carries no [Oratio] of its own for this day -- see
# web/www/horas/Latin/Tempora/Quad5-3.txt): the actual proper collect
# lives at web/www/missa/Latin/Tempora/Quad5-3.txt's [Oratio], with the
# parallel English at web/www/missa/English/Tempora/Quad5-3.txt. Marked
# `draft`, not `verified` -- see monday-passion-week-collect.yml's own
# note for why (direct Missal transcription, standard closing formula
# expanded, no live Office cross-check).
collect:
  text: |
    Orémus.
    Sanctificáto hoc jejúnio, Deus, tuórum corda fidélium miserátor illústra: et quibus devotiónis præstas afféctum, præbe supplicántibus pium benígnus audítum.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft
  temporal: true

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
