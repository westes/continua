# Nocturn 2-3, Fourth Sunday of Lent (temporalId lent-4). Sourced from
# Tempora/Quad4-0.txt (Latin) / English/Tempora/Quad4-0.txt. See
# advent-1.yml/lent-1.yml for the general sweep method.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from St. Basil the Great's
# 1st Homily on Fasting. Responsory: Lectio4's own (Responsory4, "In mare
# viæ tuæ").
#
# Nocturn 3 (Lectio7-9): Lectio7 carries real homily prose after its bare
# Gospel incipit (John 6:1-15, the multiplication of the loaves, "Et
# réliqua") - St. Augustine's Tractate 24 on John begins within Lectio7
# itself, same pattern used throughout this sweep. Combined Lectio7's
# homily portion (incipit dropped) with Lectio8-9, using Responsory7
# ("Spléndida facta est fácies Móysi") - the first responsory of the group
# the combined reading spans.
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Basil the Great, Archbishop of Caesarea, Homily 1 on Fasting
      text: |-
        Móysen per jejúnium nóvimus in montem ascendísse: neque enim áliter ausus esset vérticem fumántem adíre, atque in calíginem íngredi, nisi jejúnio munítus. Per jejúnium mandáta dígito Dei in tábulis conscrípta suscépit. Item supra montem jejúnium legis latæ conciliátor fuit: inférius vero, gula ad idololatríam pópulum dedúxit, ac contaminávit. Sedit, inquit, pópulus manducáre et bíbere, et surrexérunt lúdere. Quadragínta diérum labórem ac perseverántiam, Dei servo contínuo jejunánte ac oránte, una tantum pópuli ebríetas cassam irritámque réddidit. Quas enim tábulas Dei dígito conscríptas jejúnium accépit, has ebríetas contrívit: Prophéta sanctíssimo indígnum existimánte, vinoléntum pópulum a Deo legem accípere.

        Uno témporis moménto ob gulam pópulus ille per máxima prodígia Dei cultum edóctus, in Ægyptíacam idololatríam turpíssime devolútus est. Ex quo si utrúmque simul cónferas, vidére licet, jejúnium ad Deum dúcere, delícias vero salútem pérdere. Quid Esau inquinávit, servúmque fratris réddidit? nonne esca una, propter quam primogénita véndidit? Samuélem vero nonne per jejúnium orátio largíta est matri? Quid fortíssimum Samsónem inexpugnábilem réddidit? nonne jejúnium, cum quo in matris ventre concéptus est? Jejúnium concépit, jejúnium nutrívit, jejúnium virum effécit. Quod sane Angelus matri præcépit, monens quæcúmque ex vite procéderent, ne attíngeret, non vinum, non síceram bíberet. Jejúnium prophétas génuit, poténtes confírmat atque róborat.

        Jejúnium legislatóres sapiéntes facit: ánimæ óptima custódia, córporis sócius secúrus, fórtibus viris muniméntum et arma, athlétis et certántibus exercitátio. Hoc prætérea tentatiónes propúlsat, ad pietátem armat, cum sobrietáte hábitat, temperántiæ ópifex est: in bellis fortitúdinem affert, in pace quiétem docet: nazarǽum sanctíficat, sacerdótem pérficit: neque enim fas est sine jejúnio sacrifícium attíngere, non solum in mýstica nunc et vera Dei adoratióne, sed nec in illa, in qua sacrifícium secúndum legem in figúra offerebátur. Jejúnium Elíam magnæ visiónis spectatórem fecit: quadragínta namque diérum jejúnio cum ánimam purgásset, in spelúnca méruit, quantum fas est hómini, Deum vidére. Móyses íterum legem accípiens, íterum jejúnia secútus est. Ninivítæ, nisi cum illis et bruta jejunássent, ruínæ minas nequáquam evasíssent. In desérto autem quorúmnam membra cecidérunt? nonne illórum, qui carnes appetivére?
      responsory: |-
        R. In mare viæ tuæ, et sémitæ tuæ in aquis multis: * Deduxísti sicut oves pópulum tuum in manu Móysi et Aaron.
        V. Transtulísti illos per mare Rubrum, et transvexísti eos per aquam nímiam.
        R. Deduxísti sicut oves pópulum tuum in manu Móysi et Aaron.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joann 6:1-15
      text: 'In illo témpore: Abiit Jesus trans mare Galilǽæ, quod est Tiberíadis: et sequebátur eum multitúdo magna, quia vidébant signa, quæ faciébat super his, qui infirmabántur. Súbiit ergo in montem Jesus: et ibi sedébat cum discípulis suis. Erat autem próximum Pascha, dies festus Judæórum. Cum sublevásset ergo óculos Jesus et vidísset, quia multitúdo máxima venit ad eum, dixit ad Philíppum: Unde emémus panes, ut mandúcent hi? Hoc autem dicébat tentans eum: ipse enim sciébat, quid esset factúrus. Respóndit ei Philíppus: Ducentórum denariórum panes non suffíciunt eis, ut unusquísque módicum quid accípiat. Dicit ei unus ex discípulis ejus, Andréas, frater Simónis Petri: Est puer unus hic, qui habet quinque panes hordeáceos et duos pisces: sed hæc quid sunt inter tantos? Dixit ergo Jesus: Fácite hómines discúmbere. Erat autem fænum multum in loco. Discubuérunt ergo viri, número quasi quinque míllia. Accépit ergo Jesus panes, et cum grátias egísset, distríbuit discumbéntibus: simíliter et ex píscibus, quantum volébant. Ut autem impléti sunt, dixit discípulis suis: Collígite quæ superavérunt fragménta, ne péreant. Collegérunt ergo, et implevérunt duódecim cóphinos fragmentórum ex quinque pánibus hordeáceis, quæ superfuérunt his, qui manducáverant. Illi ergo hómines cum vidíssent, quod Jesus fécerat signum, dicébant: Quia hic est vere Prophéta, qui ventúrus est in mundum. Jesus ergo cum cognovísset, quia ventúri essent, ut ráperent eum et fácerent eum regem, fugit íterum in montem ipse solus.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tractate 24 on the Gospel of John
      text: |-
        Mirácula, quæ fecit Dóminus noster Jesus Christus, sunt quidem divína ópera, et ad intellegéndum Deum de visibílibus ádmonent humánam mentem. Quia enim ille non est talis substántia, quæ vidéri óculis possit; et mirácula ejus, quibus totum mundum regit, universámque creatúram adminístrat, assiduitáte viluérunt, ita ut pene nemo dignétur atténdere ópera Dei mira et stupénda in quólibet séminis grano: secúndum ipsam suam misericórdiam, servávit sibi quædam, quæ fáceret opportúno témpore præter usitátum cursum ordinémque natúræ; ut non majóra, sed insólita vidéndo stupérent, quibus cotidiána vilúerant.

        Majus enim miráculum est gubernátio totíus mundi, quam saturátio quinque míllium hóminum de quinque pánibus. Et tamen hoc nemo mirátur: illud mirántur hómines, non quia majus est, sed quia rarum est. Quis enim et nunc pascit univérsum mundum, nisi ille, qui de paucis granis ségetes creat? Fecit ergo quo modo Deus. Unde enim multíplicat de paucis granis ségetes, inde in mánibus suis multiplicávit quinque panes: potéstas enim erat in mánibus Christi. Panes autem illi quinque, quasi sémina erant, non quidem terræ mandáta, sed ab eo, qui terram fecit, multiplicáta.

        Hoc ergo admótum est sénsibus, quo erigerétur mens: et exhíbitum óculis, ubi exercerétur intelléctus: ut invisíbilem Deum per visibília ópera mirarémur, et erécti ad fidem, et purgáti per fidem, étiam ipsum invisíbilem vidére cuperémus, quem de rebus visibílibus invisíbilem noscerémus. Nec tamen súfficit hæc intuéri in miráculis Christi. Interrogémus ipsa mirácula, quid nobis loquántur de Christo: habent enim, si intelligántur, linguam suam. Nam quia ipse Christus Verbum Dei est: étiam factum Verbi, verbum nobis est.
      responsory: |-
        R. Spléndida facta est fácies Móysi, dum respíceret in eum Dóminus: * Vidéntes senióres claritátem vultus ejus, admirántes timuérunt valde.
        V. Cumque descendísset de monte Sínai, portábat duas tábulas testimónii, ignórans quod cornúta esset fácies ejus ex consórtio sermónis Dei.
        R. Vidéntes senióres claritátem vultus ejus, admirántes timuérunt valde.
      status: verified
