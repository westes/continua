# Read directly from web/www/horas/Latin/Sancti/08-14.txt's own
# [Oratio] and its English counterpart. Doxology "$Qui vivis" spelled
# out per the convention in st-bibiana-collect.yml.
collect:
  text: |
    Orémus.
    Deus, qui virginálem aulam beátæ Maríæ, in qua habitáres, elígere dignátus es:
    da, quǽsumus; ut, sua nos defensióne munítos, jucúndos fácias suæ interésse
    festivitáti.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  status: verified

# Matins reading for the Vigil of the Assumption (Aug 14). Sourced
# directly from web/www/horas/Latin/Sancti/08-14.txt,
# English/Sancti/08-14.txt. A Vigil's own office is a single, simpler
# nocturn of just 3 lessons (`Lectio1-3`), pooled into the nocturn: 2
# slot per the established convention (see vigil-of-st-lawrence.yml's
# own note). Lectio1's Gospel citation (Luke 11:27-28, "Blessed is the
# womb that bore thee") was a bare incipit ("Et réliqua") in the horas
# file, with no full pericope text given there and the day's own Mass
# proper inheriting its [Evangelium] from a Common (`@Commune/C11`) not
# present in this reference engine's static missa store. The full
# 2-verse pericope is short enough to complete directly: added
# 2026-09-05 (isGospel: true) immediately before the homily portion,
# Latin assembled from the horas file's own incipit plus the matching
# verses in web/www/horas/Help/vulgate.txt (the reference engine's own
# Vulgate text database), English composed as the standard
# Douay-Rheims rendering of the same two verses (not itself
# reference-engine text, so marked draft per this project's "prefer
# text over missing" policy). The untagged block's own homilist is
# St. John Chrysostom (Lectio1 + Lectio2-3 combined, one continuous
# piece); a separate `(sed rubrica tridentina)` variant swaps in a
# different homily by St. Augustine on the same Gospel verse -- not
# used here, per the untagged-block convention.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: true
      citation: Luc 11:27-28
      text: 'In illo témpore: Loquénte Jesu ad turbas, extóllens vocem quædam múlier de turba dixit illi: Beátus venter qui te portávit, et úbera quæ suxísti. At ille dixit: Quinímmo beáti, qui áudiunt verbum Dei et custódiunt illud.'
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. John Chrysostom, Homily 20 on John, ch. 2 (toward the end)
      text: |-
        Cum audíeris mulíerem illam dicéntem: Beátus venter qui te portávit, et úbera quæ tu suxísti; deínde Dóminum respondéntem: Quinímmo beáti qui áudiunt verbum Dei et custódiunt illud; ea senténtia dictum exístima, non quod Matrem neglégeret, sed nihil ei utilitátis matris nomen allatúrum osténderet, nisi bonitáte et fide præstáret. Quod si Maríæ nihil, sine virtúte, matérna cáritas erat profutúra; longe minus nobis patris, fratris, matris, fílii bónitas, nisi áliquid nostrum afferámus.

        In nullo namque álio, nisi in solis sui ipsíus virtútibus, post divínam grátiam, de salúte cuípiam sperándum est. Nam, si id profutúrum erat per se Maríæ, profuísset étiam Judǽis, quorum consanguíneus Christus secúndum carnem; profuísset civitáti, in qua natus est; profuísset frátribus. Atqui, dum fratres rerum suárum curam habuérunt, nihil eis propinquitátis nomen prófuit, sed cum réliquo mundo damnáti erant.

        Tunc autem admiratióni esse cœpérunt, quando própria claruérunt virtúte. Pátria vero nihil inde consecúta cécidit, et incéndio absúmpta est; concíves mísere interémpti periére; consanguínei secúndum carnem nil ad salútem lucráti sunt, deficiénte virtútis patrocínio. Verum Apóstoli ante omnes claríssimi evasérunt, cum se ad veram et expeténdam ejus familiaritátem consuetudinémque per obediéntiam contulérunt. Hinc intellégimus, fide semper nobis opus esse, et vita quæ virtútibus lúceat: hæc dumtáxat salvos nos fácere póterit.
      status: verified
