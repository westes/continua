# Nocturn 2-3 content for an ordinary Sunday with no saint of its own
# (post-pentecost-15 = "14th Sunday after Trinity" in this app's own
# display labeling — see calendar/day-label.ts). Live-verified against
# Divinum Officium (Monastic Tridentinum 1617, 2026-09-06, a plain Sunday
# with no feast collision — confirmed by cross-checking the same date
# against data/calendar/sanctoral-calendar.yml).
#
# Nocturn 1 for this same Sunday comes from the user's own bible-plan
# instead (data/hours/bible-plan/post-pentecost-15-sunday.yml, Tob 1-2 /
# Sir 45) — historically this Sunday's real Nocturn 1 continuous reading
# is the Book of Job (confirmed live), but the user's plan deliberately
# substitutes its own reading there. Nocturn 2 below is still the real
# historical St. Gregory commentary *on Job*, even though this app's own
# Nocturn 1 no longer reads Job that week — kept as-is (real, valuable
# patristic content proper to the ordinary-time cycle, not tied to a
# specific saint) rather than dropped for no longer lining up thematically
# with Nocturn 1. Flagged, not silently resolved — a real seam between
# the historical Moralia-in-Job commentary cycle and this app's own
# substituted Nocturn 1 plan.
#
# Combined per the user's "recombine where the source doesn't genuinely
# split" instruction: Nocturn 2's 4 lessons (Lectio 5-8) are one
# continuous excerpt from the same work (Moralia, Bk. 9, ch. 2) — no real
# source break between them, so one reading. Nocturn 3's Lectio 9 is
# genuinely two different sources in the one numbered lesson (the Gospel
# pericope itself, then the opening of St. Augustine's homily on it) —
# kept split into two readings here; the homily then continues unbroken
# through Lectio 10-12, recombined into that second reading.
#
# Responsory: this project's own established convention (see
# octave-readings.ts) is "the first one, when several collapse" — applied
# here per resulting reading: Nocturn 2's reading uses Lectio 5's
# responsory; the Gospel reading uses Lectio 9's (the only one that's
# genuinely its own, since Lectio 9 itself split across both new
# readings). The last reading (the homily, recombined from Lectio 10-12)
# uses Lectio 12's own closing "Duo Séraphim" instead of Lectio 10's —
# same convention every other post-Pentecost week's own file already
# uses (see e.g. post-pentecost-01.yml): Duo Séraphim always belongs to
# the hour's *last* reading, not "the first one, when several collapse."
# Full text, not the "Et réliqua" incipit Lectio 9 itself uses — the
# live rendering has this same Gospel read out in full a second time,
# right after the Te Deum, closing with its own "Te decet laus"
# versicle rather than the usual "Tu autem, Dómine, miserére nobis" —
# using that fuller form here rather than modeling the two Gospel
# readings (incipit-only at Lectio 9, full after Te Deum) as separate
# parts, a known simplification (see hours/matins.ts).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Gregory the Great, Moralia in Job, Book 9, ch. 2
      text: |-
        Vero scio quod ita sit, et quod non justificábitur homo compósitus Deo. Homo quippe Deo non compósitus justítiam pércipit, compósitus amíttit; quia quisquis se auctóri bonórum cómparat, bono se, quod accéperat, privat. Qui enim accépta bona sibi árrogat, suis contra Deum donis pugnat. Unde ergo despéctus erígitur, dignum est ut eréctus inde destruátur.

        Sanctus autem vir, quia omne virtútis nostræ méritum esse vítium cónspicit, si ab intérno árbitro distrícte judicétur, recte subjúngit: Si volúerit conténdere cum eo, non póterit respondére ei unum pro mille.

        In Scriptúra sancta millenárius númerus pro universitáte solet intélligi. Hinc étenim Psalmísta ait: Verbi, quod mandávit in mille generatiónes: cum profécto constet, quod ab ipso mundi exórdio usque ad Redemptiónis advéntum per Evangelístam non ámplius quam septuagínta et septem propágines numeréntur. Quid ergo in millenário número nisi ad proferéndam novam sóbolem perfécta univérsitas præscítæ generatiónis exprímitur? Hinc et per Joánnem dícitur: Et regnábunt cum eo mille annis: quia vidélicet regnum sanctæ Ecclésiæ universitátis perfectióne solidátur.

        Quia vero monas décies multiplicáta in denárium dúcitur, denárius per semetípsum ductus in centenárium dilatátur, qui rursus per denárium ductus in millenárium ténditur; cum ab uno incípimus, ut ad millenárium veniámus, quid hoc loco uníus appellatióne, nisi bene vivéndi inítium? quid millenárii númeri amplitúdine, nisi ejúsdem bonæ vitæ perféctio designátur? Cum Deo autem conténdere, est, non ei tribúere, sed sibi glóriam suæ virtútis arrogáre. Sed sanctus vir conspíciat, quia et qui summa jam dona percépit, si de accéptis extóllitur, cuncta quæ accéperat, amíttit.
      responsory: |-
        R. Indúta est caro mea putrédine, et sórdibus púlveris cutis mea áruit et contrácta est: * Meménto mei, Dómine, quóniam ventus est vita mea.
        V. Dies mei velócius transiérunt quam a texénte tela succíditur, et consúmpti sunt absque ulla spe.
        R. Meménto mei, Dómine, quóniam ventus est vita mea.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 7:11-16
      text: 'In illo témpore: Ibat Jesus in civitátem, quæ vocátur Naim: et ibant cum eo discípuli ejus et turba copiósa. Cum autem appropinquáret portæ civitátis, ecce, defúnctus efferebátur fílius únicus matris suæ: et hæc vídua erat, et turba civitátis multa cum illa. Quam cum vidísset Dóminus, misericórdia motus super eam, dixit illi: Noli flere. Et accéssit et tétigit lóculum. Hi autem, qui portábant, stetérunt. Et ait: Adoléscens, tibi dico, surge. Et resédit, qui erat mórtuus, et cœpit loqui. Et dedit illum matri suæ. Accépit autem omnes timor: et magnificábant Deum, dicéntes: Quia Prophéta magnus surréxit in nobis: et quia Deus visitávit plebem suam.'
      responsory: |-
        R. Quis mihi tríbuat, ut in inférno prótegas me et abscóndas me, donec pertránseat furor tuus, Dómine, nisi tu, qui solus es Deus? * Et constítuas mihi tempus, in quo recordéris mei?
        V. Numquid sicut dies hóminis dies tui, ut quæras iniquitátem meam; cum sit nemo, qui de manu tua possit erúere.
        R. Et constítuas mihi tempus, in quo recordéris mei?
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 44 on the Words of the Lord
      text: |-
        De júvene illo resuscitáto gavísa est mater vídua; de homínibus in spíritu quotídie suscitátis gaudet mater Ecclésia. Ille quidem mórtuus erat córpore; illi autem mente. Illíus mors visíbilis visibíliter plangebátur; illórum mors invisíbilis nec quærebátur, nec videbátur. Quæsívit ille, qui nóverat mórtuos. Ille solus nóverat mórtuos, qui póterat fácere vivos. Nisi enim ad mórtuos suscitándos venísset, Apóstolus non díceret: Surge, qui dormis, et exsúrge a mórtuis, et illuminábit te Christus.

        Tres autem mórtuos invenímus a Dómino resuscitátos visibíliter, míllia invisibíliter. Quot autem mórtuos visibíliter suscitáverit, quis novit? Non enim ómnia, quæ fecit, scripta sunt. Joánnes hoc dixit: Multa ália fecit Jesus, quæ si scripta essent, árbitror totum mundum non posse libros cápere. Multi ergo sunt álii sine dúbio suscitáti, sed non tres frustra commemoráti.

        Dóminus enim noster Jesus Christus ea quæ faciébat corporáliter, étiam spiritáliter volébat intélligi. Neque enim tantum mirácula propter mirácula faciébat; sed ut illa, quæ faciébat, mira essent vidéntibus, vera essent intelligéntibus. Quemádmodum qui videt lítteras in códice óptime scripto, et non novit légere, laudat quidem antiquárii manum, admírans ápicum pulchritúdinem; sed quid sibi velint, quid índicent illi ápices, nescit, et est óculis laudátor, mente non cógnitor.

        Alius autem et laudat artifícium, et capit intelléctum: ille útique, qui non solum vidére quod commúne est ómnibus, potest, sed étiam légere; quod qui non dídicit, non potest. Ita qui vidérunt Christi mirácula, et non intellexérunt quid sibi vellent, et quid intelligéntibus quodámmodo innúerent, miráti sunt tantum quia facta sunt; álii vero et facta miráti, et intellécta assecúti. Tales nos in schola Christi esse debémus.
      responsory: |-
        R. Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.
        V. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.
        R. Plena est omnis terra glória ejus.
      status: verified
