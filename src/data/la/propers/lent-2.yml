# Nocturn 2-3, Second Sunday of Lent (temporalId lent-2). Sourced from
# Tempora/Quad2-0.txt (Latin) / English/Tempora/Quad2-0.txt. See
# advent-1.yml/lent-1.yml for the general sweep method.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from St. Augustine's book
# Against Lying, chapter 9-10 (on Jacob's deception of Isaac). Responsory:
# Lectio4's own (Responsory4, "Dum exíret Jacob de terra sua").
#
# Nocturn 3 (Lectio7-9): Lectio7 carries real homily prose after its bare
# Gospel incipit (Matt 17:1-9, the Transfiguration, "Et réliqua") - St.
# Leo the Great's own Homily on the Transfiguration of the Lord begins
# within Lectio7 itself, same pattern used throughout this sweep. Combined
# Lectio7's homily portion (incipit dropped) with Lectio8-9, using
# Responsory7 ("Dixit Angelus ad Jacob") - the first responsory of the
# group the combined reading spans.
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Against Lying
      text: |-
        Jacob quod matre fecit auctóre, ut patrem fállere viderétur, si diligénter et fidéliter attendátur, non est mendácium, sed mystérium. Quæ si mendácia dixérimus, omnes étiam parábolæ ac figúræ significandárum quarumcúmque rerum, quæ non ad proprietátem accipiéndæ sunt, sed in eis áliud ex álio est intelligéndum, dicéntur esse mendácia: quod absit omníno. Nam qui hoc putat, trópicis étiam tam multis locutiónibus ómnibus potest hanc importáre calúmniam; ita ut et hæc ipsa, quæ appellátur metáphora, hoc est, de re própria ad rem non própriam verbi alicújus usurpáta translátio, possit ista ratióne mendácium nuncupári.

        Quæ significántur enim, útique ipsa dicúntur: putántur autem mendácia, quóniam non ea quæ vere significántur, dicta intelligúntur; sed ea, quæ falsa sunt, dicta esse credúntur. Hoc ut exémplis fiat plánius, idípsum quod Jacob fecit, atténde. Hædínis certe péllibus membra contéxit. Si causam próximam requirámus, mentítum putábimus: hoc enim fecit, ut putarétur esse qui non erat. Si autem hoc factum ad illud, propter quod significándum revéra factum est, referátur: per hædínas pelles, peccáta; per eum vero, qui eis se opéruit, ille significátus est, qui non sua, sed aliéna peccáta portávit.

        Verax ergo significátio nullo modo mendácium recte dici potest: ut autem in facto, ita et in verbo. Nam cum ei pater dixísset: Quis es tu, fili? ille respóndit: Ego sum Esau primogénitus tuus. Hoc si referátur ad duos illos géminos, mendácium vidébitur: si autem ad illud, propter quod significándum ista gesta dictáque conscrípta sunt; ille est hic intelligéndus in córpore suo, quod est ejus Ecclésia, qui de hac re loquens, ait: Cum vidéritis Abraham, et Isaac et Jacob et omnes Prophétas in regno Dei, vos autem expélli foras. Et, Vénient ab Oriénte et Occidénte, et Aquilóne et Austro, et accúmbent in regno Dei. Et, Ecce sunt novíssimi qui erant primi: et sunt primi, qui erant novíssimi. Sic enim quodámmodo minor majóris primátum frater ábstulit, atque in se tránstulit fratris.
      responsory: |-
        R. Dum exíret Jacob de terra sua, vidit glóriam Dei, et ait: Quam terríbilis est locus iste! * Non est hic áliud, nisi domus Dei, et porta cæli.
        V. Vere Deus est in loco isto, et ego nesciébam.
        R. Non est hic áliud, nisi domus Dei, et porta cæli.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 17:1-9
      text: 'In illo témpore: Assúmpsit Jesus Petrum, et Jacóbum, et Joánnem fratrem eius, et duxit illos in montem excélsum seórsum: et transfigurátus est ante eos. Et resplénduit fácies ejus sicut sol: vestiménta autem ejus facta sunt alba sicut nix. Et ecce, apparuérunt illis Móyses et Elías cum eo loquéntes. Respóndens autem Petrus, dixit ad Jesum: Dómine, bonum est nos hic esse: si vis, faciámus hic tria tabernácula, tibi unum, Móysi unum et Elíæ unum. Adhuc eo loquénte, ecce, nubes lúcida obumbrávit eos. Et ecce vox de nube, dicens: Hic est Fílius meus diléctus, in quo mihi bene complácui: ipsum audíte. Et audiéntes discípuli, cecidérunt in fáciem suam, et timuérunt valde. Et accéssit Jesus, et tétigit eos, dixítque eis: Súrgite, et nolíte timére. Levántes autem óculos suos, néminem vidérunt nisi solum Jesum. Et descendéntibus illis de monte, præcépit eis Jesus, dicens: Némini dixéritis visiónem, donec Fílius hóminis a mórtuis resúrgat.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Leo the Great, Homily on the Transfiguration of the Lord
      text: |-
        Assúmpsit Jesus Petrum, et Jacóbum, et fratrem ejus Joánnem, et conscénso cum eis seórsum monte præcélso, claritátem suæ glóriæ demonstrávit: quia licet intellexíssent in eo majestátem Dei, ipsíus tamen córporis, quo divínitas tegebátur, poténtiam nesciébant. Et ídeo próprie signantérque promíserat, quosdam de astántibus discípulis non prius gustáre mortem, quam vidérent Fílium hóminis veniéntem in regno suo, id est, in régia claritáte, quam spiritáliter ad natúram suscépti hóminis pertinéntem, his tribus viris vóluit esse conspícuam. Nam illam ipsíus Deitátis ineffábilem et inaccessíbilem visiónem, quæ in ætérnam vitam mundis corde servátur, nullo modo mortáli adhuc carne circúmdati intuéri póterant et vidére.

        Dicénte Patre: Hic est Fílius meus diléctus, in quo mihi bene complácui, ipsum audíte: nonne evidénter audítum est: Hic est Fílius meus, cui ex me et mecum esse sine témpore est? quia nec génitor génito prior, nec génitus est genitóre postérior. Hic est Fílius meus, quem a me non séparat Déitas, non dívidit potéstas, non discérnit ætérnitas. Hic est Fílius meus, non adoptívus, sed próprius: non aliúnde creátus, sed ex me génitus: nec de ália natúra mihi factus comparábilis, sed de mea esséntia mihi natus æquális.

        Hic est Fílius meus, per quem ómnia facta sunt, et sine quo factum est nihil: qui ómnia quæ fácio, simíliter facit; et quidquid óperor, inseparabíliter mecum atque indifferénter operátur. Hic est Fílius meus, qui eam, quam mecum habet æqualitátem, non rapína appétiit, nec usurpatióne præsúmpsit: sed manens in forma glóriæ meæ, ut ad reparándum genus humánum exsequerétur commúne consílium, usque ad formam servílem inclinávit incommutábilem Deitátem. Hunc ergo, in quo mihi per ómnia bene compláceo, et cujus prædicatióne maniféstor, cujus humilitáte claríficor, incunctánter audíte: quia ipse est véritas et vita, ipse virtus mea atque sapiéntia.
      responsory: |-
        R. Dixit Angelus ad Jacob: * Dimítte me, auróra est. Respóndit ei: Non dimíttam te, nisi benedíxeris mihi. Et benedíxit ei in eódem loco.
        V. Cumque surrexísset Jacob, ecce vir luctabátur cum eo usque mane: et cum vidéret quod eum superáre non posset, dixit ad eum.
        R. Dimítte me, auróra est. Respóndit ei: Non dimíttam te, nisi benedíxeris mihi. Et benedíxit ei in eódem loco.
      status: verified
