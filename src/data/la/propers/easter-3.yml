# Nocturn 2-3, Third Sunday after Easter (temporalId easter-3). Sourced
# from Tempora/Pasc2-0.txt (Latin) / English/Tempora/Pasc2-0.txt. See
# advent-1.yml/easter-octave.yml for the general sweep method.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from St. Leo the Great's
# 1st Sermon for the Lord's Ascension. Responsory: the source's own
# [Responsory4] is a cross-reference to Pasc0-3:Responsory2 ("Ego sum
# vitis vera"), reused here directly.
#
# Nocturn 3 (Lectio7-9): Lectio7 carries real homily prose after its bare
# Gospel incipit (John 10:11-16, the Good Shepherd, "Et réliqua") - Pope
# St. Gregory the Great's Homily 14 on the Gospels begins within Lectio7
# itself, same pattern used throughout this sweep. Combined Lectio7's
# homily portion (incipit dropped) with Lectio8-9, using the source's own
# [Responsory7] - again a cross-reference, to Pasc0-6:Responsory1
# ("Christus resúrgens ex mórtuis").
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Leo the Great, Sermon 1 for the Lord's Ascension
      text: |-
        Hi dies, dilectíssimi, qui inter resurrectiónem Dómini ascensionémque fluxérunt, non otióso transiére decúrsu, sed magna in eis confirmáta sacraménta, magna sunt reveláta mystéria. In iis metus diræ mortis aufértur, et non solum ánimæ, sed étiam carnis immortálitas declarátur. In iis per insufflatiónem Dómini infúnditur Apóstolis ómnibus Spíritus Sanctus: et beáto Apóstolo Petro supra céteros, post regni claves, ovílis Domínici cura mandátur.

        In iis diébus, duóbus discípulis tértius in via Dóminus comes júngitur, et ad omnem nostræ ambiguitátis calíginem detergéndam, pavéntium ac trepidántium tárditas increpátur. Flammam fídei illumináta corda concípiunt: et quæ erant tépida, reseránte Scriptúras Dómino, efficiúntur ardéntia. In fractióne quoque panis, convescéntium aperiúntur obtútus: multo felícius eórum óculis patefáctis, quibus natúræ suæ manifestáta est glorificátio, quam illórum géneris nostri príncipum, quibus prævaricatiónis suæ est ingésta confúsio.

        Inter hæc autem, alíaque mirácula, cum discípuli trépidis cogitatiónibus æstuárent, et apparuísset in médio eórum Dóminus, dixissétque, Pax vobis: ne hoc remanéret in eórum opiniónibus, quod volvebátur in córdibus (putábant enim se spíritum vidére, non carnem) redárguit cogitatiónes a veritáte discórdes: íngerit dubitántium óculis manéntia in mánibus suis et pédibus crucis signa; et ut diligéntius pertractétur, invítat. Quia ad sanánda infidélium cordium vúlnera, clavórum et lánceæ erant serváta vestígia: ut non dúbia fide, sed constantíssima sciéntia tenerétur, eam natúram in Dei Patris consessúram throno, quæ jacúerat in sepúlcro.
      responsory: |-
        R. Ego sum vitis vera, et vos pálmites: * Qui manet in me, et ego in eo, hic fert fructum multum, allelúia, allelúia.
        V. Sicut diléxit me Pater, et ego diléxi vos.
        R. Qui manet in me, et ego in eo, hic fert fructum multum, allelúia, allelúia.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joann 10:11-16
      text: 'In illo témpore: Dixit Jesus pharisǽis: Ego sum pastor bonus. Bonus pastor ánimam suam dat pro óvibus suis. Mercenárius autem et qui non est pastor, cujus non sunt oves própriæ, videt lupum veniéntem, et dimíttit oves et fugit: et lupus rapit et dispérgit oves: mercenárius autem fugit, quia mercenárius est et non pértinet ad eum de óvibus. Ego sum pastor bonus: et cognósco meas et cognóscunt me meæ. Sicut novit me Pater, et ego agnósco Patrem, et ánimam meam pono pro óvibus meis. Et álias oves hábeo, quæ non sunt ex hoc ovíli: et illas opórtet me addúcere, et vocem meam áudient, et fiet unum ovíle et unus pastor.~'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 14 on the Gospels
      text: |-
        Audístis, fratres caríssimi, ex lectióne evangélica eruditiónem vestram: audístis et perículum nostrum. Ecce enim is, qui non ex accidénti dono, sed essentiáliter bonus est, dicit: Ego sum pastor bonus. Atque ejúsdem bonitátis formam, quam nos imitémur, adjúngit, dicens: Bonus pastor ánimam suam ponit pro óvibus suis. Fecit quod mónuit: osténdit quod jussit. Bonus pastor pro óvibus suis ánimam suam pósuit, ut in sacraménto nostro corpus suum et sánguinem vérteret, et oves quas redémerat, carnis suæ aliménto satiáret.

        Osténsa nobis est de contémptu mortis via, quam sequámur: appósita est forma, cui imprimámur. Primum nobis est, exterióra nostra misericórditer óvibus ejus impéndere: postrémum vero, si necésse sit, étiam mortem nostram pro eísdem óvibus ministráre. A primo autem hoc mínimo pervenítur ad postrémum majus. Sed cum incomparabíliter longe sit mélior ánima, qua vívimus, quam terréna substántia, quam extérius possidémus: qui non dat pro óvibus substántiam suam, quando pro his datúrus est ánimam suam?

        Et sunt nonnúlli, qui dum plus terrénam substántiam quam oves díligunt, mérito nomen pastóris perdunt: de quibus prótinus súbditur: Mercenárius autem, et qui non est pastor, cujus non sunt oves própriæ, videt lupum veniéntem, et dimíttet oves, et fugit. Non pastor, sed mercenárius vocátur, qui non pro amóre íntimo oves Domínicas, sed ad temporáles mercédes pascit. Mercenárius quippe est, qui locum quidem pastóris tenet, sed lucra animárum non quærit: terrénis cómmodis ínhiat, honóre prælatiónis gaudet, temporálibus lucris páscitur, impénsa sibi ab homínibus reveréntia lætátur.
      responsory: |-
        R. Christus resúrgens ex mórtuis, jam non móritur, mors illi ultra non dominábitur: quod enim mórtuus est peccáto, mórtuus est semel: * Quod autem vivit, vivit Deo, allelúia, allelúia.
        V. Mórtuus est semel propter delícta nostra, et resurréxit propter justificatiónem nostram.
        R. Quod autem vivit, vivit Deo, allelúia, allelúia.
      status: verified
