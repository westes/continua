# Matins Nocturn 2 reading for St. Clement I, Pope, Martyr (Nov 23,
# sharing the date with St. Felicitas — see st-felicitas.yml) —
# SanctiM/11-23.txt inherits the whole day (`@Sancti/11-23`) with no
# Nocturn 2/3 override, so this saint's own vita is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/11-23.txt, English/Sancti/11-23.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Clemens, Románus, Faustíni fílius, de regióne Cǽlii montis, discípulus beáti Petri, cujus méminit Paulus scribens ad Philippénses: Etiam rogo et te, germáne compar, ádjuva illas quæ mecum laboravérunt in Evangélio, cum Cleménte et céteris adjutóribus meis, quorum nómina sunt in libro vitæ. Hic septem Urbis regiónes divísit septem notáriis, síngulas síngulis attríbuens, qui passiónes Mártyrum et res ab eis gestas, diligentíssime conquisítas, lítteris mandárent. Multa scripsit et ipse accuráte et salutáriter, quibus christiánam religiónem illustrávit.

        Cum autem doctrína ac vitæ sanctitáte multos ad Christi fidem convérteret, a Trajáno imperatóre relegátus est trans mare Pónticum in solitúdine urbis Chersónæ; in qua duo míllia Christianórum réperit, qui ab eódem Trajáno condemnáti fúerant. Qui cum in eruéndis et secándis marmóribus aquæ penúria laborárent, Clemens, facta oratióne, in vicínum collem ascéndit, in cujus jugo vidit Agnum déxtero pede fontem aquæ dulcis, qui inde scatébat, attingéntem; ubi omnes sitim explevérunt. Eóque miráculo multi infidéles, ad Christi fidem convérsi, Cleméntis étiam sanctitátem venerári cœpérunt.

        Quibus concitátus Trajánus, misit illuc qui Cleméntem, alligáta ad ejus collum ánchora, in profúndum dejícerent. Quod cum factum esset, Christiánis ad littus orántibus, mare ad tria milliária recéssit; eóque illi accedéntes, ædículam marmóream in templi formam et intus arcam lapídeam, ubi Mártyris corpus cónditum est. Ecclésia étiam in eo ínsulæ loco unde divínitus fons manárat, ejúsdem nómine dedicáta est. Vixit in pontificátu annos novem, menses sex, dies sex. Fecit ordinatiónes duas mense Decémbri, quibus creávit presbýteros decem, diáconos duos, epíscopos per divérsa loca quíndecim.
      status: verified
