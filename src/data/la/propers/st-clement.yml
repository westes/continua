# the Vespers antiphons verbatim, numbering stripped. Below duplex-majus
# (semiduplex), so hours/lauds.ts's mergeFerialNumbersWithProperAntiphons
# only takes this file's antiphon text, not its psalm numbers (those stay
# the plain ferial weekday's) -- psalm numbers below are still the
# source's own real ones (109/110/111/112/116), kept for documentation
# accuracy even though unused at this rank.
lauds-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: Oránte * sancto Cleménte, appáruit ei Agnus Dei.
    - psalms:
        - 110
      antiphon: Non meis méritis * ad vos me misit Dóminus, vestris corónis partícipem fíeri.
    - psalms:
        - 111
      antiphon: Vidi supra montem * Agnum stantem, de sub cujus pede fons vivus emánat.
  canticle:
    id: canticum-trium-puerorum
    antiphon: 'De sub cujus pede * fons vivus emánat: flúminis ímpetus lætíficat civitátem Dei.'
  laudate:
    antiphon: Omnes gentes * per gyrum credidérunt Christo Dómino.

