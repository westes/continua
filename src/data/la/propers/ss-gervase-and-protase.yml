# Matins Nocturn 2 reading for Ss. Gervase and Protase, Martyrs (June 19)
# — pre-1955-but-post-1617. Plain Sancti/06-19.txt is a different, later
# saint (St. Juliana Falconieri, canonized 1737) who displaced Gervase
# and Protase on the general calendar's own June 19 slot; their content
# survives at the suffixed sibling file (see memory
# vu-matins-pre1955-saints's "critical wrinkle").
# web/www/horas/Latin/Sancti/06-19o.txt, English/Sancti/06-19o.txt.
# Single lesson (simplex-feast Lectio93), no responsory in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Gervasius et Protasius, Vitalis et Valériæ fílii, quorum pater Ravennæ, mater Mediolani pro Christi Dómini fide martyrium subiérunt, distributo paupéribus patrimonio, domesticos servos libertáte donarunt. Quo facto Gentílium sacerdótes immane in illos conceptum ódium habebant. Quare, cum Astasius comes in bellum proficisci vellet, hanc occasiónem perdéndi pios fratres se nactos esse putavérunt. Itaque Astasio persuadent se a diis admonitos esse, nullo modo eum in bello victórem futurum, nisi Gervasio et Protasio coactis Christum negare, eosdem ad sacra diis facienda compélleret. Quod cum illi detestaréntur, Astasius imperávit Gervasium tamdiu cædi, dum inter verbera exspiraret; Protasium fustibus contusum secúri pércuti jubet. Quorum córpora Philippus Christi servus clam sústulit et in suis ædibus sepelívit: quæ póstea sanctus Ambrosius, Dei mónitu invénta, in loco sacro et insígni collocanda curávit. Passi sunt Mediolani décimo tertio Kalendas Julii.'
      status: verified
