# Read from the reference engine: web/www/horas/Latin/Sancti/07-21r.txt [Oratio];
# English from English/Sancti/07-21r.txt.
collect:
  text: |
    Orémus.
    Deus, qui ad árdua quæque pro nóminis tui glória et animárum salúte beáto Lauréntio, Confessóri tuo atque Doctóri, spíritum sapiéntiæ et fortitúdinis contulísti: da nobis in eódem spíritu et agénda cognóscere; et cógnita, ejus intercessióne, perfícere.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-a-confessor-doctor; collect is the saint's own (collect-st-lawrence-of-brindisi.yml). Not
# independently live-verified for this category, so marked draft.
commemoration:
  text: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, intra in gáudium Dómini tui.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui ad árdua quæque pro nóminis tui glória et animárum salúte beáto Lauréntio, Confessóri tuo atque Doctóri, spíritum sapiéntiæ et fortitúdinis contulísti: da nobis in eódem spíritu et agénda cognóscere; et cógnita, ejus intercessióne, perfícere.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. Lawrence of Brindisi, Confessor and Doctor of the Church. Sourced directly from
# web/www/horas/Latin/Sancti/07-21r.txt, English/Sancti/07-21r.txt.
# single lesson (Lectio94), one continuous account.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Lauréntius, Brundúsii in Apúlia natus, aduléscens Ordinem Fratrum Minórum Capuccinórum ingréssus, philosóphiam ac theológiam pénitus dídicit, complúres autem linguas et antíquas et recentióres cálluit. Sacérdos inaugurátus, prædicándi munus suscépit, quod per totam fere Itáliam aliásque Európæ regiónes indeféssus obívit. Singulári prudéntia consiliíque dono prǽditus, univérso Ordini regéndo præféctus est, et a Summis Pontifícibus sæpe adhíbitus ad gravíssimas obeúndas legatiónes. Atque ejus potíssimum ópera efféctum est, ut príncipes christiáni cópias suas consociáverint contra ingruéntes Turcárum turmas: quibúscum exércitus christiánus in Hungária congréssus, Lauréntio præeúnte cum cruce, mílites ducésque cohortánte, celebérrimam rétulit victóriam. Inter tot vero tantáque negótia, religiósi hóminis virtútes heróico modo cóluit. Quidquid supérerat témporis, oratióni impéndens, vitam interiórem cum extérna actuositáte mirífice conjúnxit. Tandem Olisipóne, quo a pópulo neapolitáno orátor ad regem Hispániæ missus fúerat, libertátis christiánæ et justítiæ strénuus assértor, quasi in ácie occúbuit anno millésimo sexcentésimo undevicésimo. Multa relíquit scripta ad fidem cathólicam advérsus hǽreses defendéndam, et ad sacras Lítteras explanándas. Eum Leo Papa décimus tértius in Sanctórum númerum rétulit, Joánnes vero Papa vigésimus tértius univérsæ Ecclésiæ Doctórem declarávit.'
      status: verified
