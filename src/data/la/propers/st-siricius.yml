# Matins Nocturn 2 reading for St. Siricius, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/10-31-Siricius.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Siricius Románus, ex presbytero tituli Pastóris, vita functo sancto Damaso Papa, cleri populique univérsi acclamatione ad apostólicam Sedem evéctus est, obnitente frustra Ursicino schismatico, gratulante vero in primis Valentiniáno imperatóre, qui magnum innocéntiæ et probitatis exémplum eum prædicávit. Ipso sui pontificátus exordio decretalem epístolam, saluberrimis institutionibus plenam, ad Himerium dedit Tarraconensem epíscopum, áliis Hispaniárum ecclésiis communicandam, ut corrupti clericórum mores emendarentur, et disciplínæ vigor instauraretur, quam in Africa quoque collabéntem, hábita Romæ synodo octogínta episcopórum, reparándam curávit.

        Innúmera sunt cétera, quæ pro fídei defensione toto sui pontificátus témpore invícte perégit. Joviniánum monachum, sanctas virginitátis hostem, et christianum Epicurum in Romána synodo anathemate confixit. Bonosum quoque Sardicensem epíscopum, Christi divinitátem et Deíparæ post partum virginitátem inficiantem damnávit. Manichæos ex Urbe ejectos imperiali lege sæculáribus pœnis coërcendos subjécit; redeuntes vero ad Ecclésiam in monastéria detrudi, ac nonnisi in vitæ éxitu ad communiónem recipi vóluit.

        Religiónis tuéndæ et amplificándæ stúdium, quod sane quam máximum declarabat, egrégie adjúvit magnus Theodosius imperátor, qui cum, sublatis Gentílium simulácris, templisque interdictis aut evdrsis, idolórum cultum omnem aboleri jussísset, christiána religio, ipso sedénte Pontífice, mirífice propagata est. Præcláris pro Ecclésia functus labóribus, editisque sanctíssimis légibus, septuagenario major obdormívit in Dómino, anno salútis trecentésimo nonagésimo octávo. Sedit in pontificátu annos círciter quatuórdecim. Ejus corpus e cœmetério Priscíllæ via Salária in títulum sanctæ Praxedis a Pascháli primo translátum est. Illíus vero nomen Benedíctus décimus quartus Póntifex Máximus, plene vindicáta ejus ab objectis criminibus innocéntia, in Románi Martyroldgii tabulas referri jussit.
      status: verified
