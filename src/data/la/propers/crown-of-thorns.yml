# Matins Nocturn 2 and 3 readings for the Crown of Thorns (Friday after Ash Wednesday).
# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp3-5-SpinisDNJC.txt.
# Nocturn 2: Lectio4-6, three passages of St. Bernard (the source cites "Serm. 2
# in Epiph. Domini" and "Serm. 41 in Cant."), combined into one reading, its
# closing responsory the source's Responsory6. Nocturn 3: the Gospel (John
# 19:1-5, the source's Mass Gospel) and then St. Bernard's homily on it (Lectio7
# after the incipit, and Lectio8), its closing responsory the source's
# Responsory8. Nocturn 1 (Lectio1-3, from Tempora/Quad5-5) is not carried:
# continua's first nocturn runs the Scripture course.
#
# Latin: "líbera" for "úbera" ("inter ubera mea", Cant 1:12, five times in Lectio5-6),
# "hsec"/"hgec" for "hæc", and "Hvore" for "livóre" are source typos, corrected
# silently. Everything else is verbatim.
# The English is this project's own translation, marked draft.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Bernard of Clairvaux, Sermon 2 on the Epiphany and Sermon 41 on the Song of Songs
      text: |
        Egredímini fíliæ Sion; vobis dícimus, fíliæ Sion, ánimæ sæculares, débiles, delicatæ; fíliæ, et non fílii, in quibus nihil est fortitúdinis, nihil est virilis ánimi. Egredímini de sensu carnis ad intelléctum mentis, de servitúte carnalis concupiscéntiæ ad libertatem spirituális intelligéntiæ. Egredímini de terra vestra, et de cognatióne vestra, et de domo patris vestri, et vidéte regem Salomónem in diadémate, quo coronávit eum mater sua, in coróna paupertátis, in coróna misériæ; síquidem coronátus est et a noverca sua coróna spinea, coróna misériæ, coronandus a família sua coróna justítiæ, quando exíbunt Ángeli, et tollent de regno ejus ómnia scandala, quando véniet ad judícium cum senioribus pópuli sui, cum pugnabit pro eo orbis terrárum advérsus insensatos. Corónat eum et Pater coróna glóriæ, sicut ait Psalmista: Glória et honóre coronásti eum Dómine. Vidéte eum fíliæ Sion in diadémate quo coronávit eum mater sua.

        Ego, fratres, ab ineúnte mea conversióne pro acervo meritórum, quæ mihi deesse sciebam, mihi fascículum collectum ex ómnibus anxietatibus et amaritudinibus Dómini mei colligare, et inter úbera mea collocare curavi. Memóriam abundántiæ suavitátis horum eructabo quoad vixero: in ætérnum non oblivíscar miseratiónes istas, quia in ipsis vivificatus sum. Mihi hic salutáris fasciculus servatus est; nemo tollet eum a me: inter úbera mea commorábitur. Hæc meditari, dixi sapiéntiam: in his justítiæ mihi perfectiónem constitui, in his plenitúdinem sciéntiæ, in his divítias salútis, in his cópias meritórum. Ex his mihi intérdum potus salutáris amaritúdinis: ex his rursum suávis linctio consolatiónis. Hæc me erigunt in advérsis, in prósperis reprimunt, et inter læta tristiaque vitæ præsentis, via régia incedenti tutum præbent utrobíque ducatum, hinc inde mala imminentia propulsando. Hæc mihi conciliant mundi Júdicem, dum treméndum potestatibus, mitem humilemque figúrant; dum non solum placabilem, sed et imitabilem repræsentant eum, qui inaccessibilis est principatibus, terríbilis apud reges terræ.

        Hæc proptérea mihi in ore frequénter, sicut vos scitis: hæc in corde semper, sicut Deus scit: hæc stylo meo ádmodum familiaria, sicut appáret: hæc mea sublimior ínterim philosophía, scire Jesum, et hunc crucifíxum. Non requiro, sicut sponsa, ubi cubet in merídie, quem lætus amplector mea inter líbera commorantem. Non requiro ubi pascat in merídie, quem intúeor Salvatórem in cruce. Illud sublimius, istud suavius: panis illud, hoc lac: hoc víscera réficit parvulórum: hoc replet úbera matrum; et ídeo inter úbera mea commorábitur. Hunc et vos, dilectíssimi, tam diléctum fascículum colligite vobis: hunc medúllis inserite cordis, hoc munite aditum pectoris, ut et vobis inter líbera commoretur. Si enim ante óculos habueritis quem portatis, pro certo vidéntes angústias Dómini, levius vestras portabitis, ipso auxiliante Ecclésiæ sponso, qui est super ómnia Deus benedíctus in sǽcula. Amen.
      responsory: |
        R. Arcam de lignis Setim deaurábis auro mundíssimo intus et foris: * Faciésque supra corónam áuream per circúitum.
        V. Pones in arca testificatiónem, quam dabo tibi.
        R. Faciésque supra corónam áuream per circúitum.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joann 19:1-5
      text: 'In illo témpore: Apprehéndit Pilátus Jesum et flagellávit. Et mílites plecténtes corónam de spinis, imposuérunt cápiti ejus: et veste purpúrea circumdedérunt eum. Et veniébant ad eum et dicébant: Ave, Rex Judæórum: et dabant ei álapas. Exívit ergo íterum Pilátus foras et dicit eis: Ecce, addúco vobis eum foras, ut cognoscátis, quia nullam invénio in eo causam. Exívit ergo Jesus portans corónam spíneam et purpúreum vestiméntum.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernard of Clairvaux, Sermon 50 on Various Subjects
      text: |
        Vidéte, fíliæ Sion, regem Salomónem. Non dicit Ecclesiasten, aut Ididam. Nam et his nomínibus appellátus est rex ille: et significat Jesum Christum, nostrum verum Salomónem, qui est Sálomon, id est, pacíficus in exsílio: Ecclesiastes, id est, concionátor in judício: Idida, id est, diléctus Dómini in regno, ibíque rex. In exsílio mansúetus, in judício justus, in regno gloriósus. In exsílio amabilis, in judício terríbilis, in regno admirábilis. In diadémate quo coronávit eum mater sua. Est autem hæc coróna misericórdiæ, et in hac imitabilis. Coronávit eum et noverca sua coróna misériæ, et in hac contemptibilis. Synagogam loquor, quæ se ei non matrem exhíbuit, sed novercam.

        Coronabit eum família sua coróna justítiæ, et in hac terríbilis: corónat eum Pater suus coróna glóriæ, et in hac desiderabilis. Vídeant ergo eum peccatóres in coróna misériæ, id est, spinea, et compungantur: vídeant eum fíliæ Sion, ánimæ affectuose, in coróna misericórdiæ, et imiténtur. Vidébunt eum ímpii in coróna justítiæ, et períbunt: vidébunt eum sancti in coróna glóriæ, et perpetualiter gaudébunt. Coronantur quidem et álii imitatóres ipsíus; sed hoc ex indústria adjúti per grátiam. Solus iste a matre coronátus est, quia solus cum ordinatis affectionibus, tamquam sponsus e thálamo, procéssit ex útero matris.
      responsory: |
        R. Christus sciens dolórem et infirmitátem, spinis coronátus, * Ipse est qui corónat vos in misericórdia et miseratiónibus.
        V. Vulnerátus propter iniquitátes nostras, attrítus propter scélera nostra, cujus livóre sanáti sumus.
        R. Ipse est qui corónat vos in misericórdia et miseratiónibus.
      status: verified
