# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp3-5-SpinisDNJC.txt (Duplex majus, Friday after Ash Wednesday). Matins psalmody: nine antiphons with the psalms the source assigns. English is this project's own translation, marked draft.
matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 1
        antiphon: Erit tamquam lignum, quod plantátum est secus decúrsus aquárum, et fructum suum dabit in témpore suo.
      - psalms:
          - 2
        antiphon: Convenérunt in unum advérsus Dóminum, et advérsus Christum ejus.
      - psalms:
          - 4
        antiphon: In tribulatióne dilatásti mihi.
    versicle:
      v: Glória et honóre coronásti eum Dómine.
      r: Et constituísti eum super ópera mánuum tuárum.
  nocturn2:
    groups:
      - psalms:
          - 5
        antiphon: Dómine, ut scuto bonæ voluntátis tuæ coronásti eum.
      - psalms:
          - 8
        antiphon: Minuísti eum paulo minus ab Ángelis, glória et honóre coronásti eum.
      - psalms:
          - 10
        antiphon: 'Peccatóres intendérunt arcum: paravérunt sagíttas suas in pháretra, ut sagíttent justum.'
    versicle:
      v: Posuísti Dómine super caput ejus.
      r: Corónam de lápide pretióso.
  nocturn3:
    groups:
      - psalms:
          - 14
        antiphon: Ingréssus sine mácula, et operátus justítiam, coronátus est in monte sancto tuo.
      - psalms:
          - 20
        antiphon: Super caput ejus corónam de lápide pretióso posuísti Dómine.
      - psalms:
          - 22
        antiphon: Advérsus eos, qui tríbulant me, impinguásti in óleo caput meum.
    versicle:
      v: Coróna áurea super caput ejus.
      r: Expréssa signo sanctitátis.

