# Collect of The Most Holy Crown of Thorns of Our Lord Jesus Christ. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp3-5-SpinisDNJC.txt (Duplex majus, Friday after Ash Wednesday). English is this project's own translation, marked draft.
collect:
  text: |
    Orémus.
    Præsta, quǽsumus omnípotens Deus: ut qui in memóriam passiónis Dómini nostri Jesu Christi corónam ejus spíneam venerámur in terris, ab ipso glória et honóre coronari mereámur in cœlis:
    Qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp3-5-SpinisDNJC.txt (Duplex majus, Friday after Ash Wednesday). English is this project's own translation, marked draft.
matins-hymn:
  text: |
    Exite Sion fíliæ,
    Regis pudicæ vírgines,
    Christi Corónam cernite,
    Quam mater ipsa texuit.

    Horret revulsis crinibus
    Spinis cruentatum caput:
    Et vultus ille decolor
    Mortem propinquam réspicit.

    Quæ terra fulcis ínvia,
    Dumis rigens et sentibus,
    Lugubre munus protulit.
    Quæ sæva messuit manus?

    Christi rubescens sánguine
    Aculeos mutat rosis,
    Palmamque vincens fructibus
    Spina est triumphis aptior.

    Culpis satæ mortálium
    Te, Christe, spinæ vulnerant
    Evelle nostras córdibus,
    Tuasque nostris insere.

    Virtus, honor, laus, glória,
    Deo Patri cum Fílio,
    Sancto simul Paráclito,
    In sæculórum sǽcula.
    Amen.
  status: verified

