# Matins Nocturn 2 reading for St. Hilarion, Abbot (Oct 21, sharing
# the date with Ss. Ursula and Companions — no reading authored for
# that feast, see memory vu_matins_sanctim_saints for the Common-only
# finding) — SanctiM/10-21.txt inherits the whole day (`@Sancti/10-21`)
# with no Nocturn 2/3 override, so this saint's own vita is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/10-21.txt, English/Sancti/10-21.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Hilarion, ortus Tabáthæ in Palæstina ex paréntibus infidelibus, Alexandríam missus studiórum causa, ibi morum et ingenii laude flóruit; ac, Jesu Christi suscepta religióne, in fide et caritate mirabíliter profecit. Frequens enim erat in ecclésia, assiduus in jejúnio et oratióne; omnes voluptátum illécebras et terrenárum rerum cupiditates contemnebat. Cum autem Antonii nomen in Ægypto celeberrimum esset, ejus vidéndi studio in solitúdinem conténdit; apud quem duobus mensibus omnem ejus vitæ ratiónem didicit. Domum reversus, mórtuis paréntibus, facultates suas paupéribus dilargitus est; necdum quintum décimum annum egréssus, rediit in solitúdinem, ubi, exstructa exígua casa, quæ vix ipsum cáperet, humi cubábat. Nec vero saccum, quo semel amíctus est, umquam aut lavit aut mutávit, cum supervacáneum esse diceret, mundítias in cilício quærere. In sanctárum Litterárum lectióne et meditatióne multus erat. Paucas ficus et succum herbárum ad victum adhibebat; nec illis ante solis occásum vescebátur. Continéntia et humilitate fuit incredibili. Quibus aliisque virtútibus varias horribilesque tentatiónes diaboli superávit, et innumerábiles dæmones in multis orbis terræ partibus ex hóminum corpóribus ejécit. Qui, octogesimum annum agens, multis ædificátis monastériis, et clarus miraculis, in morbum incidit; cujus vi cum extremo pene spíritu conflictarétur, dicebat: Egredere, quid times? egredere, ánima mea, quid dubitas? septuagínta prope annis servísti Christo, et mortem times? Quibus in verbis spíritum exhalávit.'
      status: verified
