# Verified against Divinum Officium (Monastic Tridentinum 1617) — read
# directly from the reference engine's own real-date output (2029-01-18, a
# year that date doesn't collide with a Sunday). Same convention as
# data/propers/temporal/*-collect.yml.
collect:
  text: |
    Orémus.
    Deus, qui beáto Petro Apóstolo tuo, collátis clávibus regni cæléstis, ligándi atque solvéndi pontifícium tradidísti: concéde; ut, intercessiónis ejus auxílio, a peccatórum nostrórum néxibus liberémur:
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (chair-of-st-peter-at-rome-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-an-apostle (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (chair-of-st-peter-at-rome-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Quodcúmque ligáveris super terram, erit ligátum et in cælis; et quodcúmque sólveris super terram, erit solútum et in cælis: dicit Dóminus Simóni Petro.
    V. Annuntiavérunt ópera Dei.
    R. Et facta ejus intellexérunt.
    Orémus.
    Deus, qui beáto Petro Apóstolo tuo, collátis clávibus regni cæléstis, ligándi atque solvéndi pontifícium tradidísti: concéde; ut, intercessiónis ejus auxílio, a peccatórum nostrórum néxibus liberémur:
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# the Chair of St. Peter at Rome: proper Matins hymn, "Quodcumque in orbe nexibus revinxeris" (Sancti/01-18.txt's [Hymnus Matutinum] = "@Sancti/02-22:Hymnus Vespera").
# Latin and English as rendered by the local reference engine (Monastic
# Tridentinum 1617, command=prayMatutinum, 01-18-2027); before this file the saint
# fell to the Common's Matins hymn.
matins-hymn:
  text: |
    Quodcúmque in orbe néxibus revínxeris,
    Erit revínctum, Petre, in arce síderum:
    Et quod resólvit hic potéstas trádita,
    Erit solútum cæli in alto vértice;
    In fine mundi judicábis sǽculum.

    Patri perénne sit per ævum glória,
    Tibíque laudes concinámus ínclitas,
    Ætérne Nate; sit, supérne Spíritus,
    Honor tibi decúsque: sancta júgiter
    Laudétur omne Trínitas per sǽculum.
    Amen.
  status: verified

