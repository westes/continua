# Matins Nocturn 2-3 readings for the Chair of St. Peter at Rome (Jan
# 18) — SanctiM/01-18.txt inherits the whole day (`@Sancti/01-18`);
# only Lectio4 is overridden (with unrelated Eastertide filler content,
# `@Tempora/Pasc5-0:Lectio3`, evidently a generic 12-lesson-slot filler
# rather than anything about St. Peter, so not used here) — Lectio5-8
# are not overridden and carry through as this feast's own proper
# content, same as a pre-1955 saint (see memory vu-matins-pre1955-saints).
# web/www/horas/Latin/Sancti/01-18.txt, English/Sancti/01-18.txt.
#
# Nocturn 2: Lectio4-6 (St. Leo the Great's sermon on Ss. Peter and
# Paul) combined into one reading, one continuous excerpt.
# Nocturn 3: Lectio7's Gospel pericope (Matt 16:13-19) is a full short
# passage, authored as a genuine Gospel reading; Lectio7's homily
# portion + Lectio8 (St. Hilary of Poitiers's commentary) combined into
# one reading, one continuous excerpt. No responsory given for either.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope St. Leo the Great, Sermon 1 on Ss. Peter and Paul
      text: |-
        Cum duódecim Apóstoli, accépta per Spíritum Sanctum ómnium locutióne linguárum, imbuéndum Evangélio mundum, distribútis sibi terrárum pártibus, suscepíssent, beatíssimus Petrus, princeps apostólici órdinis, ad arcem Románi destinátur impérii, ut lux veritátis, quæ in ómnium géntium revelabátur salútem, efficácius se ab ipso cápite per totum mundi corpus effúnderet. Cujus autem natiónis hómines in hac tunc urbe non essent? aut quæ usquam gentes ignorárent quod Roma didicísset?

        Hic conculcándæ philosophíæ opiniónes, hic dissolvéndæ erant terrénæ sapiéntiæ vanitátes, hic confutándi dǽmonum cultus, hic ómnium sacrilegiórum impíetas destruénda, ubi diligentíssima superstitióne habebátur colléctum quidquid usquam fúerat vanis erróribus institútum. Ad hanc ergo urbem tu, beatíssime Petre Apóstole, veníre non métuis, et, consórte glóriæ tuæ Paulo Apóstolo, aliárum adhuc ecclesiárum ordinatiónibus occupáto, silvam istam freméntium bestiárum, et turbullentíssimæ profunditátis océanum, constántior quam cum supra mare graderéris, ingréderis.

        Jam pópulos, qui ex circumcisióne credíderant, erudíeras: jam Antiochénam ecclésiam, ubi primum christiáni nóminis dignitas est orta, fundáveras: jam Pontum, Galátiam, Cappadóciam, Asiam atque Bithýniam légibus evangélicæ prædicatiónis impléveras; nec aut dúbius de provéctu óperis, aut de spátio tuæ ignárus ætátis, trophǽum crucis Christi Románis árcibus inferébas, quo te divínis præordinatiónibus anteíbant, et honor potestátis, et glória passiónis.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 16:13-19
      source: St. Hilary of Poitiers, Bishop, Commentary on Matthew 16
      text: |-
        In illo témpore: Venit Jesus in partes Cæsaréæ Philíppi, et interrogábat discipulos suos, dicens: Quem dicunt hómines esse Fílium hóminis? Et réliqua.

        Dóminus a discípulis requírit, quem se hómines esse dícerent; ut adjécit, hóminis fílium. Hæc enim confessiónis tenénda rátio est, ut sicut Dei Fílium, ita et fílium hóminis meminérimus: quia álterum sine áltero nihil spei tríbuit ad salútem. Editis ítaque, quæ diversæ de eo erant, hóminum opiniónibus, quid de se ipse séntiant quærit. Petrus respóndit: Tu es Christus Fílius Dei vivi. Sed Petrus conditiónes propositiónis expénderat. Dóminus enim díxerat: Quem me hómines esse dicunt, fílium hóminis? Et certe fílium hóminis contemplátio córporis præferébat. Sed addéndo, Quem me esse dicunt, significávit, præter id quod in se videbátur, esse áliud sentiéndum: erat enim hóminis fílius. Quod ígitur de se opinándi judícium desiderábat? Non illud arbitrámur, quod de se ipse conféssus est: sed occúltum erat de quo quærebátur, in quod se credéntium fides debébat exténdere.

        Et dignum plane conféssio Petri præmium consecúta est, quia Dei Fílium in hómine vidísset. Beátus hic est, qui ultra humánum óculos intendísse et vidísse laudátus est: non id quod ex carne et sánguine erat cóntuens, sed Dei Fílium cæléstis Patris revelatióne conspíciens; dignúsque judicátus, qui quod in Christo Dei esset, primus agnósceret. O in nuncupatióne novi nóminis felix Ecclésiæ fundaméntum, dígnaque ædificatióne illíus petra, quæ inférnas leges, et tártari portas, et ómnia mortis claustra dissólveret! O beátus cæli jánitor, cujus arbítrio claves ætérni áditus tradúntur, cujus terréstre judícium præjudicáta auctóritas sit in cælo!
      status: verified
