# Matins Nocturn 2 reading for St. Gelasius I, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/11-29-GelasiusI.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Gelasius, gente Africanus, patre Valério, in Felícis tértii locum subrogatus, pontificátum gessit annos quátuor, menses octo, duodevigínti dies. Creávit in duplici ordinatióne diáconos duos, presbyteros trigínta et duos, sexagínta septem per divérsa loca epíscopos. Vir sane singulári fídei propagándæ ac servándæ zelo ardentissimus, omni litteratura, præsértim sacra, instructissimus, et intrepidi pectoris róbore, tum ad vindicanda Ecclésiæ et Sedis apostólicæ jura, tum ad retundendam hæreticórum et schismaticorum proterviam armatus.

        Ejus cura et stúdio non clerus modo plúrimum auctus est, verum étiam univérsa Ecclésia magnis increméntis adolévit. In quo certe illíus prudéntia mirábilis fuit, cum eo témpore Anastásius, imperator hæreticus, et Theodoricus Ariánus rerum utriúsque impérii potirentur. Imminente famis perículo, líbere annona Urbem recreavit. Lupercalia, aliáque Gentílium spectacula, quæ ad hæc usque témpora, post tam multa imperatorum edícta advérsus idololatríam lata, et Romanórum Pontíficum stúdia ad eam exstirpándam adhibita, viguisse constat, Andromacho senatore, aliísque Romanis frustra licet refragantibus, pénitus abolevit.

        Ália quamplurima ad dignitátem et disciplínam Ecclésiæ spectantia prǽstitit, sancívit, et scripsit. Defensores Acacii, Euphemium præsértim Constantinopolitánum damnávit; scriptísque ad diversos nervosissimis juxta atque doctíssimis lítteris, vel eos in offício continuit, vel aberrantes redúxit. Pelagianos, Manichæos et álios hæréticos coërcuit, eorúmque libros públicis flammis tradi curávit. Præter decretales et hymnos ecclesiásticos, egrégia scripsit opuscula contra Nestórium, Arium, Pelagium et Eutycheten. Sed illud præ céteris memorándum, quod libros canónicos ab áliis, et probatos ab apocryphis, in Romána synodo septuagínta episcopórum, singulári decréto distínxit. Post multos demum labóres in regenda universalia Ecclésia exantlatos, sanctíssimus et doctissimus Póntifex pie óbiit in Dómino undécimo Kaléndas Decémbris, anno Christi quadringentésimo nonagésimo sexto, et sepúltus est in Vaticáno.
      status: verified
