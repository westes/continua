# Matins Nocturn 2 reading for St. Zosimus, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/02-09-Zosimus.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Zosimus Græcus, Abrahami fílius, post sanctum Innocéntium Románæ Ecclésiæ Episcopátum suscépit. Is Africanorum Conciliorum decrétis advérsus Pelagianam hærésim in sententiæ suæ robur adnexuit, et ad impiórum excidium gládio Petri dexteras ómnium armavit Antístitum; iis namque ab ipso probátis, per totum mundum hærésis Pelagiana damnáta est. Damnávit et Pelagium ipsum una cum Cœlestio, datis hac de re lítteris ad univérsam Ecclésiam.

        Ecclesiásticæ disciplínæ tenacíssimus fuit, compluribus ad eam ubíque sive servandam, sive restituendam destinatis gravibus epístolis. Definiit, juxta probátum Ecclésiæ morem, ut si quis ab infántia ecclesiásticis ministériis nomen dedísset, inter lectores usque ad vigésimum ætátis annum, continuáta observatione duraret. Si vero major jam, et grandævus post baptísmum, sive inter lectores, sive inter exorcistas, quinquennio tenerétur, et inde acolythus, vel subdiaconus, quátuor annis, et sic ad diaconatum (si mererétur) accéderet, in quo órdine quinque annis hærere debéret, et inde, suffragántibus votis, sacerdótium promereri posset.

        Sancívit, ut diáconi lævas linostimis pallis tegerent: potestatemque fecit, ut per paróchias paschális cereus benediceretur. Cavit prætérea, ne clerico póculum propinaretur in público, prætérquam in fidélium cellis et máxime clericórum. Qui cum sanctíssime rexísset Ecclésiam annum unum, menses quátuor, dies septem, quiévit in pace; sepultúsque est juxta corpus sancti Lauréntii mártyris via Tiburtina, séptimo Kaléndas Januárii, Honório, et Theodósio junióre imperantibus. Una ordinatióne, mense Decémbri, creávit presbyteros decem, diáconos tres, epíscopos per divérsa loca octo.
      status: verified
