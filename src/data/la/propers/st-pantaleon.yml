# Matins Nocturn 2 reading for St. Pantaleon, Martyr (July 27) —
# pre-1955-but-post-1617 (no SanctiM/07-27*.txt at all).
# web/www/horas/Latin/Sancti/07-27.txt, English/Sancti/07-27.txt. Single
# lesson (simplex-feast Lectio93), no responsory in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Pantáleon Nicomediénsis, nobilis médicus, ab Hermoláo presbytero in Jesu Christi fide eruditus, baptizátus est. Qui mox patri Eustorgio persuasit, ut Christianus fieret. Quare, cum Nicomedíæ póstea Christi Dómini fidem líbere prædicaret, et ad ejus doctrinam omnes cohortarétur, Diocletiáno imperatóre, equuleo tortus, et, admotis ad ejus corpus láminis candéntibus, cruciátus est. Quam tormentórum vim æquo et forti animo ferens, ad extremum gládio percússus, martyrii corónam adeptus est.
      status: verified
