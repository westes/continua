# Matins Nocturn 2 reading for St. Agatho, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/02-14-Agatho.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Agatho, natióne Sículus, ex doctissimo ac sanctíssimo monacho Románus Póntifex creátus est, anno Christi sexcentésimo septuagésimo octávo. Vir summa humanitate, eximio ánimi candóre, singulári morum suavitáte et comitate præditus, cunctórum amans, cunctis amabilissimus. Ita demum a natúra et grátia comparátus, ut ad suprémam illam dignitátem gerendam natus seu factus esse viderétur.

        Accéptis a Constantíno Pogonato lítteris ad Donum prædecessorem scriptis, pro convocando concílio œcumenico, ad diuturnum schisma tollendum, quo laborabat Ecclésia, et definiendas fídei controversias, quæ toto fere Oriénte maximas tempestátes atque ruínas excitarant, provinciales synodos in Occidénte habéri curávit, in quibus Monothelitarum causa discuteretur, et damnarentur erróres.

        His præmissis, Legátos suos, et concílii Románi, misit Constantinópolim cum binis lítteris ad imperatórem, in quibus prædícta hærési docte ac solide refutata, damnatisque primariis illíus sectatoribus, Sérgio scílicet, Cyro, Paulo, Pyrrho, Petro et áliis, antecessores suos ab omni erróris labe immunes hucusque fuísse expressis verbis declarávit. Agathonis ígitur auctoritáte sexta synodus universális congregáta est, in qua iidem erróres iidemque errantes damnáti fuérunt. Demum cum tres annos et quinque círciter menses sedisset, pie óbiit in Dómino, et in basílica príncipis Apostolórum sepultúræ mandatus est.
      status: verified
