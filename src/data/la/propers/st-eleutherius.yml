# Matins Nocturn 2 reading for St. Eleutherius, Pope and Martyr (May 26)
# — pre-1955-but-post-1617. Plain Sancti/05-26.txt is a different, later
# saint (St. Philip Neri, canonized 1622) who displaced Eleutherius on
# the general calendar's own May 26 slot; his content survives at the
# suffixed sibling file (see memory vu-matins-pre1955-saints's "critical
# wrinkle").
# web/www/horas/Latin/Sancti/05-26o.txt, English/Sancti/05-26o.txt.
# Single lesson (simplex-feast Lectio93), no responsory in the source.
# Note: the Latin and English texts here are noticeably not a literal
# 1:1 translation of each other (the English is considerably more
# detailed) — both are transcribed as-given from their respective source
# files rather than reconciled, same as elsewhere in this project when
# the two language tracks diverge.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Eleutherius, Nicopoli in Græcia natus, Aniceti Pontificis diaconus, Commodo imperatóre, præfuit Ecclésiæ. Huic, inítio pontificatus, supplices litteræ venérunt a Lucio Britannórum rege, ut se ac suos in Christianórum númerum reciperet. Quam ob rem Fugatium et Damianum, doctos et pios viros, misit in Britanniam, per quos rex et réliqui fidem susciperent. Hoc Pontifice, Irenæus Polycarpi discipulus, Romam veniens, ab eo benígne acceptus est. Quo témpore summa pace et quiete fruebátur Ecclésia Dei; ac per totum orbem terrárum, maxime Romæ, fides propagabátur. Vixit Eleutherius in pontificatu annos quindecim, dies viginti tres. Fecit ordinatiónes tres mense Decembri, quibus creávit presbyteros duodecim, diaconos octo, episcopos per diversa loca quindecim: sepultúsque est in Vaticano prope corpus sancti Petri.'
      status: verified
