# Matins Nocturn 2 reading for St. Bernard, Abbot, Doctor (Aug 20) —
# SanctiM/08-20.txt inherits the whole day (`@Sancti/08-20`) with no
# Nocturn 2/3 override, so this saint's own vita is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/08-20.txt, English/Sancti/08-20.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Bernárdus, Fóntanis in Burgúndia honésto loco natus, adolescéns propter egrégiam formam veheménter sollicitátus a muliéribus, numquam de senténtia coléndæ castitátis dimovéri pótuit. Quas diáboli tentatiónes ut effúgeret, duos et vigínti annos natus, monastérium Cisterciensé, unde hic ordo incépit, et quod tum sanctitáte florébat, íngredi constítuit. Quo Bernárdi consílio cógnito, fratres summópere conáti sunt eum a propósito deterrére: in quo ipse eloquéntior ac felícior fuit. Nam sic eos aliósque multos in suam perdúxit senténtiam, ut cum eo trigínta júvenes eámdem religiónem suscéperint. Mónachus jejúnio ita déditus erat, ut quóties suméndus esset cibus, tóties torméntum subíre viderétur. In vigíliis étiam et oratiónibus mirífice se exercébat: et christiánam paupertátem colens, quasi cæléstem vitam agébat in terris, ab omni caducárum rerum cura et cupiditáte aliénam.

        Elucébat in eo humílitas, misericórdia, benígnitas: contemplatióni autem sic addíctus erat, ut vix sénsibus, nisi ad offícia pietátis, uterétur: in quibus tamen prudéntiæ laude excellébat. Quo in stúdio occupátus, Genuénsem, ac Mediolanénsem, aliósque episcopátus oblátos recusávit, proféssus se tanti offícii múnere indígnum esse. Abbas factus Claravallénsis, multis in locis ædificávit monastéria, in quibus præclára Bernárdi institútio ac disciplína diu viguit. Romæ, sanctórum Vincéntii et Anastásii monastério ab Innocéntio secúndo Papa restitúto præfécit abbátem illum, qui póstea Eugénius tértius Summus Póntifex fuit, ad quem étiam librum misit de Consideratióne.

        Multa prætérea scripsit, in quibus appáret, eum doctrína pótius divínitus trádita, quam labóre comparáta, instrúctum fuísse. In summa virtútum laude exorátus a máximis princípibus de eórum componéndis controvérsiis, et de ecclesiásticis rebus constituéndis, sǽpius in Itáliam venit. Innocéntium item secúndum Pontíficem Máximum in confutándo schísmate Petri Leónis, cum apud imperatórem et Henrícum Angliæ regem, tum in concílio Pisis coácto, egrégie adjúvit. Dénique tres et sexagínta annos natus, obdormívit in Dómino, ac miráculis illústris, ab Alexándro tértio Papa inter sanctos relátus est. Pius vero octávus Póntifex Máximus ex sacrórum Rítuum Congregatiónis consílio sanctum Bernárdum universális Ecclésiæ Doctórem declarávit et confirmávit, nec non Missam et Offícium de Doctóribus ab ómnibus recitári jussit, atque indulgéntias plenárias quotánnis in perpétuum órdinis Cisterciénsium ecclésias visitántibus die hujus sancti festo concéssit.
      status: verified
