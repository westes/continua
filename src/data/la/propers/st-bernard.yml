# Verified against Divinum Officium (Monastic Tridentinum 1617) — read
# directly from the reference engine's own real-date output (2025-08-20).
collect:
  text: |
    Orémus.
    Intercéssio nos, quǽsumus, Dómine, beáti Bernárdi Abbátis comméndet: ut, quod nostris méritis non valémus, ejus patrocínio assequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (st-bernard-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-an-abbot (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-bernard-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Euge, serve bone et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, intra in gáudium Dómini tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Intercéssio nos, quǽsumus, Dómine, beáti Bernárdi Abbátis comméndet: ut, quod nostris méritis non valémus, ejus patrocínio assequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# St. Bernard: proper Lauds hymn, Latin/SanctiM/08-20.txt's [Hymnus Laudes]. The reference has no English for it, so the English is a fresh translation, marked draft.
# Before this file the saint fell to the Common's hymn.
lauds-hymn:
  text: |
    Lacte quondam profluéntes,
    Ite, montes vos procul:
    Ite, colles, fusa quondam
    Unde mellis flúmina;
    Israël, jactáre late
    Manna priscum désine.

    Ecce cujus corde sudant,
    Cujus ore prófluunt
    Dulcióres lacte fontes,
    Mellis amnes ǽmuli:
    Ore tanto, corde tanto
    Manna nullum dúlcius.

    Quæris unde duxit ortum
    Tanta lactis cópia;
    Unde favus, unde prompta
    Tanta mellis suávitas;
    Unde tantum manna fluxit,
    Unde tot dulcédines.

    Lactis imbres Virgo fudit
    Cǽlitus puérpera:
    Mellis amnes os leónis
    Excitávit mórtui:
    Manna sylvæ, cælitúmque
    Solitúdo próxima.

    Doctor o Bernárde, tantis
    Aucte cæli dótibus,
    Lactis hujus, mellis hujus,
    Funde rores désuper;
    Funde stillas, plenióre
    Jam potítus gúrgite.

    Summa summo laus Parénti,
    Summa laus et Fílio:
    Far tibi sit, sancte, manans
    Ex utróque, Spíritus;
    Ut fuit, nunc et per ævum
    Compar semper glória.
    Amen.
  status: verified

# St. Bernard: proper Vespers hymn, Latin/SanctiM/08-20.txt's [Hymnus Vespera]. The reference has no English for it, so the English is a fresh translation, marked draft.
# Before this file the saint fell to the Common's hymn.
vespers-hymn:
  text: |
    Jam Regína discúbuit,
    Sedens post Unigénitum:
    Nardus odórem tríbuit,
    Bernárdus tradens spíritum.

    Dulcis Regínæ gústui
    Fructus sui suávitas:
    Dulcis ejus olfáctui
    Nardi Bernárdi sánctitas.

    Veni sponsa de Líbano,
    Coronánda divínitus,
    Ut Bernárdus de clíbano
    Veníret Sancti Spíritus.

    Quæ est ista progrédiens
    Velut auróra rútilans?
    Quis est iste transíliens
    Colles, sanctis conjúbilans?

    Hæc glória terríbilis,
    Sicut castrórum ácies:
    Hic grátia mirábilis,
    Ut Assuéri fácies.

    Ora pro nobis Dóminum,
    Prædúlcis fumi vírgula:
    Inclína Patrem lúminum,
    Pastor, ardens ut fácula.

    Sit Trinitáti glória,
    Per quam triúmphus Vírginis
    Et Bernárdi felícitas
    Manent in cæli cúria.
    Amen.
  status: verified

