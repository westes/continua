# Matins Nocturn 2 reading for Ss. Vitus, Modestus, and Crescentia,
# Martyrs (Jun 15) — SanctiM/06-15M.txt bases `@Sancti/06-15` (the
# whole day, with no Nocturn 2/3 override) but narrows the Officium to
# St. Vitus alone, the same "Monastic office narrows a joint feast"
# pattern already seen for `ss-vincent-and-anastasius.yml`,
# `ss-cletus-and-marcellinus.yml`, `ss-alexander-eventius-theodulus-and-juvenal.yml`,
# and `ss-marcellinus-peter-and-erasmus.yml` — the full three-martyr
# text is used here per vu-prefer-text-over-missing (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/06-15.txt, English/Sancti/06-15.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Vitus admodum puer inscio patre baptizatus est: quod cum ille rescivisset, nihil prætermisit, quo filium a christiana religione removeret. Qua in voluntate permanentem, Valeriano judici verberibus castigandum tradidit. Sed nihilominus in sententia persistens, patri redditus est. Sed dum eum pater gravius punire cogitat, Vitus Angeli monitu, comitibus Modesto et Crescentia, ejus educatoribus, migrat in alienas terras: ibique eam sanctitatis laudem adeptus est, ut ejus fama ad Diocletianum perlata, ipsum imperator accerseret, ut filium suum a dæmone vexatum liberaret: Quo liberato, cum ei amplissimis præmiis ingratus imperator, ut deos coleret, persuadere non potuisset, una cum Modesto et Crescentia vinculis constrictum mittit in carcerem. Quos ubi constantiores esse comperit, demitti jubet in ingens vas liquato plumbo, ferventi resina ac pice plenum: in quo cum trium Hebræorum puerorum more divinos hymnos canerent, inde erepti leoni objiciuntur: qui prostérnens se, eorum pedes lambebat. Quare inflammatus ira imperator, quod multitudinem videbat miraculo commoveri, eos in catasta sterni jubet et ita cædi eorum membra, atque ossa divelli. Quo tempore tonitrua, fulgura, magnique terræmotus fuere, quibus templa deorum corruerunt, et multi oppressi sunt. Eorum reliquias Florentia nobilis femina, unguentis conditas, honorifice sepelivit.'
      status: verified
