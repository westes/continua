# closing-formula macro expanded from
# web/www/missa/Latin/Ordo/Prayers.txt's own [Per Dominum]/English
# equivalent), not a live Divine-Office-engine cross-check.
collect:
  text: |
    Orémus.
    Sanctífica, quǽsumus, Dómine, nostra jejúnia: et cunctárum nobis indulgéntiam propítius largíre culpárum.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft
  temporal: true

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
