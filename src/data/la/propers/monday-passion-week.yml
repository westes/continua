benedictus-antiphon:
  text: 'In die magno * festivitátis stabat Jesus, et clamábat dicens: Si quis sitit, véniat ad me, et bibat.'
  status: verified
  temporal: true

# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# live query, 2026-03-23 (same clean date as the sibling
