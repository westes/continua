# Verified against Divinum Officium (Monastic Tridentinum 1617) — read
# directly from the reference engine's own real-date output (2035-06-30).
# Same convention as data/propers/temporal/*-collect.yml.
collect:
  text: |
    Orémus.
    Deus, qui multitúdinem géntium beáti Pauli Apóstoli prædicatióne docuísti: da nobis, quǽsumus; ut, cujus natalícia cólimus, ejus apud te patrocínia sentiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (commemoration-of-st-paul-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-an-apostle (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (commemoration-of-st-paul-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Vos qui secúti estis me, sedébitis super sedes, judicántes duódecim tribus Israël, dicit Dóminus.
    V. Annuntiavérunt ópera Dei.
    R. Et facta ejus intellexérunt.
    Orémus.
    Deus, qui multitúdinem géntium beáti Pauli Apóstoli prædicatióne docuísti: da nobis, quǽsumus; ut, cujus natalícia cólimus, ejus apud te patrocínia sentiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Commemoration of St. Paul: proper Matins hymn, "Doctor egregie Paule" (Sancti/06-30.txt [HymnusM Matutinum]; the Monastic and 1570 versions take it over [Hymnus Matutinum], "Egregie Doctor Paule").
# Latin and English as rendered by the local reference engine (Monastic
# Tridentinum 1617, command=prayMatutinum, 06-30-2027); before this file the saint
# fell to the Common's Matins hymn.
matins-hymn:
  text: |
    Doctor egrégie Paule, mores ínstrue,
    Et mente polum non transférre sátage:
    Donec perféctum largiátur plénius,
    Evacuáto quod ex parte gérimus.

    Sit Trinitáti sempitérna glória,
    Honor, potéstas, atque jubilátio,
    In unitáte, cui manet impérium,
    Ex tunc et modo, per ætérna sǽcula.
    Amen.
  status: verified

