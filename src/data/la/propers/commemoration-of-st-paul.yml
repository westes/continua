# Matins Nocturn 2-3 readings for the Commemoration of St. Paul (Jun
# 30) — SanctiM/06-30.txt's own Lectio4-9 all resolve back to
# `@Sancti/06-30:LectioN` (resliced), so this feast's own proper
# content is sourced from the Tridentine track exactly as for a
# pre-1955 saint (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/06-30.txt, English/Sancti/06-30.txt.
#
# Nocturn 2: Lectio4-6 (St. Augustine's treatise On Grace and Free
# Will) combined into one reading, one continuous excerpt.
# Nocturn 3: Lectio7's Gospel citation (Matt 10:16-22) is a bare
# incipit ("Et réliqua") with no full pericope text given, so only the
# homily portion was originally authored (not marked isGospel), combined
# with Lectio8-9 as one continuous excerpt of St. John Chrysostom's
# homily.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily) — this feast's own
# [Evangelium] redirects `@Sancti/06-11:Evangelium` (St. Barnabas's own
# Mass Gospel), sourced from missa/Latin/Sancti/06-11.txt,
# English/Sancti/06-11.txt, not guessed at.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, On Grace and Free Will, ch. 6-7
      text: |-
        Apóstolus Paulus, quem certe invénimus sine ullis méritis bonis, immo cum multis méritis malis, Dei grátiam consecútum, reddéntis bona pro malis, videámus quid dicat, sua jam propinquánte passióne, scribens ad Timótheum: Ego enim jam ímmolor, inquit, et tempus resolutiónis meæ instat. Bonum certámen certávi, cursum consummávi, fidem servávi. Ista útique jam mérita sua bona commémorat; ut post bona mérita consequátur corónam, qui post mérita mala consecútus est grátiam. Dénique atténdite quid sequátur: Súperest, inquit, mihi coróna justítiæ, quam reddet mihi Dóminus in illa die justus judex. Cui rédderet corónam justus judex, si non donásset grátiam miséricors Pater? Et quómodo esset ista coróna justítiæ, nisi præcessísset grátia, quæ justíficat ímpium? Quómodo ista débita redderétur, nisi prius illa gratúita donarétur?

        Proínde considerémus ipsa mérita Apóstoli Pauli, quibus dixit corónam redditúrum júdicem justum, et videámus utrum mérita ipsíus tamquam ipsíus, id est, ex ipso ei comparáta, an dona sint Dei. Bonum, inquit, certámen certávi, cursum consummávi, fidem servávi. Primo ista bona ópera, si non ea præcessíssent cogitatiónes bonæ, nulla essent. Atténdite ítaque quid de ipsis cogitatiónibus dicat; ait enim scribens ad Corínthios: Non quia idónei sumus cogitáre áliquid a nobis, tamquam a nobismetípsis; sed sufficiéntia nostra ex Deo est. Deínde síngula inspiciámus.

        Bonum, inquit, certámen certávi. Quæro qua virtúte certáverit, utrum quæ illi ex semetípso fúerit, an quæ désuper data sit? Sed absit ut tantus doctor ignoráverit legem Dei, cujus vox est in Deuteronómio: Ne dicas in corde tuo: Fortitúdo mea et poténtia manus meæ fecit mihi virtútem magnam hanc; sed memoráberis Dómini Dei tui, quia ipse tibi dat fortitúdinem fácere virtútem. Quid autem prodest bonum certámen, nisi sequátur victória? Et quis dat victóriam, nisi ille, de quo dicit ipse: Grátias Deo, qui dat nobis victóriam per Dóminum nostrum Jesum Christum?
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 10:16-22
      text: 'In illo témpore: Dixit Jesus discípulis suis: Ecce, ego mitto vos sicut oves in médio lupórum. Estóte ergo prudéntes sicut serpéntes, et símplices sicut colúmbæ. Cavéte autem ab homínibus. Tradent enim vos in concíliis, et in synagógis suis flagellábunt vos: et ad præsides et ad reges ducémini propter me in testimónium illis et géntibus. Cum autem tradent vos, nolíte cogitáre, quómodo aut quid loquámini: dábitur enim vobis in illa hora, quid loquámini. Non enim vos estis, qui loquímini, sed Spíritus Patris vestri, qui lóquitur in vobis. Tradet autem frater fratrem in mortem, et pater fílium: et insúrgent fílii in paréntes, et morte eos affícient: et éritis ódio ómnibus propter nomen meum: qui autem perseveráverit usque in finem, hic salvus erit.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. John Chrysostom, Homily 34 on Matthew (on Matt 10:16-22)
      text: |-
        Sed dícere vidétur: Nolíte turbári, si, cum vos inter lupos mitto, tamquam oves et colúmbas esse júbeo. Nam, etsi possum contrárium quoque præstáre, et non permíttere ut grave áliquid patiámini, nec lupis tamquam oves subjécti sitis, sed effícere ut leónibus terribilióres evadátis; tamen sic éxpedit fíeri: hoc et vos quoque illustrióres fáciet, et meam declarábit virtútem. Sic enim póstea dixit Paulo: Súfficit tibi grátia mea, nam virtus mea in infirmitáte perfícitur. Ipse ígitur vos ut tales essétis feci.

        Sed inspiciámus quam prudéntiam éxigit: serpéntis certe. Nam, quemádmodum serpens totum seípsum tradit, nec mínimum curat si ipsum quoque corpus incídi necésse sit, dúmmodo caput suum íntegrum servet; eódem tu quoque modo, præter fidem cétera pérdere non cures, sive pecúnias, sive corpus, sive étiam vitam ipsam profúndere necésse sit. Fides enim caput est et radix; qua serváta, etiámsi ómnia perdas, ómnia tamen rursus majóre cum glória recuperábis. Idcírco nec símplices solum jussit esse, nec prudéntes solum; sed ambo hæc in unum míscuit, ut ea in virtútem convertántur.

        Quod si rebus ipsis id ita fíeri vidére desíderas, lege Actuum Apostolórum librum; perspícies profécto, cum sæpe Judæórum pópulus in Apóstolos insurréxerit ac dentes exacúerit, illos, colúmbæ simplicitátem imitándo et cum decénti modéstia respondéndo, iram ipsórum superásse, furórem exstinxísse, ímpetum retardásse. Nam, cum illi dícerent: Nonne præcipiéndo præcépimus vobis, ne docerétis in nómine isto? quamvis innúmera possent édere mirácula, nihil tamen ásperum neque dixérunt neque fecérunt; sed summa cum mansuetúdine respondéntes dicébant: Si justum est vos audíre magis quam Deum, judicáte. Perspexísti simplicitátem colúmbæ, vide nunc serpéntis prudéntiam: Non enim póssumus, ínquiunt, nos quæ vídimus et audívimus, non loqui.
      status: verified
