# Verified against Divinum Officium (Monastic Tridentinum 1617), 2026-08.
# Pulled from the reference engine's own era-specific calendar table
# (web/www/Tabulae/Kalendaria/1570.txt + M1617.txt, own title
# "Vigilia S. Joannis Baptistae") and its own source file, not the merged per-date
# files those tables' fileref points at directly -- see TODO.md.
collect:
  text: |
    Orémus.
    Præsta, quǽsumus, omnípotens Deus: ut família tua per viam salútis incédat; et beáti Joánnis Præcursóris hortaménta sectándo, ad eum quem prædíxit, secúra pervéniat, Dóminum nostrum Jesum Christum, Fílium tuum:
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query (2026-06-23, winner outright) -- the Benedictus antiphon.
# Own proper text, deliberately echoing the Benedictus canticle's own
# opening words ("Erexit cornu salutis nobis in domo David pueri sui") —
# a fitting antiphon for the Vigil of the saint whose own father, St.
# Zechariah, first spoke that canticle (Luke 1:69) — not shared with
# common-of-a-vigil.yml's other vigils.
benedictus-antiphon:
  text: Eréxit nobis * Dóminus cornu salútis in domo David púeri sui.
  status: verified

# Matins reading for the Vigil of St. John the Baptist (Jun 23) —
# `Sancti/06-23.txt` ("In Vigilia S. Joannis Baptistæ"). A Vigil's own
# office is a single, simpler nocturn of just 3 lessons (`Lectio1-3`),
# not the usual 9-lesson ferial/feast structure — earlier characterized
# as "Nocturn 1 only, nothing to source" (see TODO.md/memory
# vu-matins-sanctim-saints), which undersold it: `Lectio1-3` genuinely
# *is* homiletic content here (a bare Gospel incipit + a real patristic
# homily), just filling the Vigil's only lesson slot rather than the
# Nocturn-2/3 slot a full feast would use. Per direct instruction
# (2026-08), pool it in rather than treat "only 3 lessons" as "no
# content" — the specific `nocturn` number is a display detail to sort
# out later, not a reason to withhold real sourceable text.
# web/www/horas/Latin/Sancti/06-23.txt, English/Sancti/06-23.txt.
#
# Lectio1's Gospel citation (Luke 1:5-17) was a bare incipit ("Et
# réliqua") with no full pericope text given; the full pericope is now
# authored too (isGospel: true, immediately before the homily) —
# sourced from this same day's own Missale [Evangelium]
# (`web/www/missa/Latin/Sancti/06-23.txt`, English/Sancti/06-23.txt),
# not guessed at (2026-09-05 update). The homily portion remains St.
# Ambrose's commentary on Zachary and Elisabeth (Lectio1's homily +
# Lectio2-3 combined, one continuous piece).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: true
      citation: Luc 1:5-17
      text: 'Fuit in diébus Heródis, regis Judǽæ, sacérdos quidam nómine Zacharías, de vice Abía, et uxor illíus de filiábus Aaron, et nomen ejus Elísabeth. Erant autem justi ambo ante Deum, incedéntes in ómnibus mandátis et justificatiónibus Dómini sine queréla, et non erat illis fílius, eo quod esset Elísabeth stérilis, et ambo processíssent in diébus suis. Factum est autem, cum sacerdótio fungerétur in órdine vicis suæ ante Deum, secúndum consuetúdinem sacerdótii, sorte éxiit, ut incénsum póneret, ingréssus in templum Dómini: et omnis multitúdo pópuli erat orans foris hora incénsi. Appáruit autem illi Angelus Dómini, stans a dextris altáris incénsi. Et Zacharías turbátus est, videns, et timor írruit super eum. Ait autem ad illum Angelus: Ne tímeas, Zacharía, quóniam exaudíta est deprecátio tua: et uxor tua Elísabeth páriet tibi fílium, et vocábis nomen ejus Joánnem: et erit gáudium tibi et exsultátio, et multi in nativitáte ejus gaudébunt: erit enim magnus coram Dómino: et vinum, et síceram non bibet, et Spíritu Sancto replébitur adhuc ex útero matris suæ: et multos filiórum Israël convértet ad Dóminum, Deum ipsórum: et ipse præcédet ante illum in spíritu et virtúte Elíæ: ut convértat corda patrum in fílios, et incrédulos ad prudéntiam justórum, paráre Dómino plebem perféctam.'
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Commentary on Luke, Book I (on Luke 1:5-17)
      text: |-
        Docet nos Scriptúra divína non solum mores in iis qui prædicábiles sunt, sed étiam paréntes oportére laudári; ut véluti transmíssa immaculátæ puritátis heréditas, in iis quos vólumus laudáre, præcéllat. Quæ enim ália inténtio hoc loco sancti Evangelístæ, nisi ut sanctus Joánnes Baptísta nobilitétur paréntibus, miráculis, móribus, múnere, passióne? Sic étiam sancti Sámuel mater Anna laudátur; sic Isaac a paréntibus nobilitátem pietátis accépit, quam pósteris derelíquit. Sacérdos ítaque Zacharías, nec solum sacérdos, sed étiam de vice Abía, id est, nóbilis inter superióres famílias.

        Et uxor, inquit, illi de filiábus Aaron. Non solum ígitur a paréntibus, sed étiam a majóribus sancti Joánnis nobílitas propagátur, non sæculári potestáte sublímis, sed religiónis successióne venerábilis. Tales enim majóres habére débuit prænúntius Christi; ut non repénte concéptam, sed a majóribus accéptam et ipso infúsam jure natúræ, prædicáre fidem Domínici viderétur advéntus. Erant, inquit, ambo justi ante Deum, incedéntes in ómnibus mandátis et justificatiónibus Dómini sine queréla. Quid ad hoc réferunt qui, peccátis suis solátia præferéntes, sine peccátis frequéntibus hóminem putant esse non posse; et utúntur versículo, quia scriptum est in Job: Nemo mundus a sorde, nec si uníus diéi vita ejus sit in terra?

        Quibus respondéndum est, prius ut quid sit hóminem sine peccáto esse defíniant: utrum nunquam omníno peccásse, an desiísse peccáre. Si enim hoc putant sine peccáto esse, nunquam omníno peccásse; et ipse conséntio. Omnes enim peccavérunt, et egent glória Dei. Sin autem eum qui véterem errórem corréxerit, et in eam se vitæ transformáverit qualitátem, ut témperet a peccáto, negant abstinére a delíctis; non possum in eórum conveníre senténtiam, cum legámus, quia Sic Dóminus diléxit Ecclésiam, ut exhíbeat ipsam sibi gloriósam, et non habéntem máculam, aut rugam, aut áliquid ejúsmodi; sed ut sit sancta et immaculáta.
      status: verified
