      text: 'Ínterim modo fratres, ut a peccáto sanemur, Christum crucifíxum intueámur: quia sicut Móyses, inquit, exaltávit serpentem in erémo, ita exaltari opórtet Fílium hóminis; ut omnis, qui credit in eum, non pereat, sed hábeat vitam ætérnam. Quómodo, qui intuebantur illum serpentem, non peribant morsibus serpentum: sic, qui intuentur fide mortem Christi, sanantur a morsibus peccatórum. Sed illi sanabantur a morte ad vitam temporalem: hic autem ait, ut habeant vitam ætérnam. Hoc enim ínterest inter figurátam imáginem, et rem ipsam: figúra præstabat vitam temporalem; res ipsa, cujus illa figúra erat, præstat vitam ætérnam.'
