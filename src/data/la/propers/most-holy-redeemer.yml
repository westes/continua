# Matins Nocturn 2 and 3 readings for Our Most Holy Redeemer. Sourced from
# web/www/horas/Latin/Sancti/aliquibus locis/10-23-Redemptor.txt. One entry per lesson,
# each with its own responsory. Nocturn 2: St. Leo the Great, Sermon 1 on the fast of
# the tenth month. The source builds Lectio4 from Tempora/Adv4-0.txt Lectio4 and the
# part of Lectio5 before "Quod per sanctum Isaíam", and Lectio5 from Adv4-0's Lectio6
# from "Diligéndo ítaque nos Deus" to its end followed by the feast's own "Lectio5
# additio"; Lectio6 is its own. The English of Lectio4 and of the Adv4-0 part of
# Lectio5 is the reference's English/Tempora/Adv4-0.txt. Nocturn 3: the Gospel (John
# 3:13-18, the source's Mass Gospel, in the project's Douay text) and Lectio7-9, St.
# Augustine, Tractate 12 on John 3. Responsory8 is the source's include of
# Tempora/Pent01-0.txt Responsory8 (the file path in the source says "Tempore"). Lectio9
# has no responsory (the Te Deum follows). Nocturn 1 (Lectio1-3, from Adv4-3 and
# Isaiah 51) is not carried: continua's first nocturn runs the Scripture course.
#
# Latin: obvious typos corrected silently ("liberavitnos" -> "liberávit nos", "homovi
# adactus" -> "homo vi adáctus", "hasreditas" -> "hæréditas", "totam quese" ->
# "totamque se", "innoc6ntia" -> "innocéntia", "y." -> "V." in Responsory5). Everything
# else is verbatim. English is this project's own translation, marked draft, except
# as noted.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Leo the Great, Pope, Sermon 1 on the fast of the tenth month
      text: 'Si fidéliter, dilectíssimi, atque sapiénter creatiónis nostræ intelligámus exórdium, inveniémus hóminem ideo ad imáginem Dei cónditum, ut imitátor sui esset auctóris: et hanc esse naturálem nostri géneris dignitátem, si in nobis, quasi in quodam spéculo, divínæ benignitátis forma respléndeat. Ad quam quotídie nos útique réparat grátia Salvatóris, dum quod cécidit in Adam primo, erígitur in secúndo. Causa autem reparatiónis nostræ non est nisi misericórdia Dei: quem non diligerémus, nisi prius nos ipse dilígeret, et ténebras ignorántiæ nostræ, suæ veritátis luce discúteret.'
      responsory: |
        R. A dextris est mihi Dominus, ne commovear: * Propter hoc dilatatum est cor meum, et exsultavit lingua mea.
        V. Dominus pars haereditatis meae, et calicis mei.
        R. Propter hoc dilatatum est cor meum, et exsultavit lingua mea.
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Leo the Great, Pope, Sermon 1 on the fast of the tenth month
      text: 'Diligéndo ítaque nos Deus, ad imáginem suam nos réparat: et ut in nobis formam suæ bonitátis invéniat, dat unde ipsi quoque quod operátur operémur, accéndens scílicet méntium nostrárum lucérnas, et igne nos suæ caritátis inflámmans, ut non solum ipsum, sed étiam quidquid díligit, diligámus. Nam si inter hómines ea demum firma amicítia est, quam morum similitúdo sociarit, cum tamen parilitas voluntatum sæpe in reprobos tendat afféctus: quantum nobis optandum, atque nitendum est, ut in nullo ab iis, quæ Deo sunt placita, discrepemus? De quo dicit Prophéta: Quóniam ira in indignatióne ejus, et vita in voluntáte ejus, quia non áliter nobis erit dígnitas divínæ majestátis, nisi imitatio fúerit voluntátis.'
      responsory: |
        R. Apud Dominum misericordia * Et copiosa apud eum redemptio.
        V. Humiles spiritu salvabit.
        R. Et copiosa apud eum redemptio.
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Leo the Great, Pope, Sermon 1 on the fast of the tenth month
      text: 'Dicénte ítaque Dómino: Diliges Dóminum Deum tuum ex toto corde tuo, et ex tota mente tua; et diliges próximum tuum sicut teípsum, suscípiat fidélis ánima auctoris sui atque rectoris immarcescíbilem caritátem, totamque se étiam ejus subjiciat voluntáti, in cujus opéribus atque judíciis nihil vacat a veritáte justítiæ, nihil a miseratióne clementiæ. Quóniam etsi magnis quis labóribus, et multis fatigetur incommodis, bona est illi causa tolerandi, qui se advérsis vel corrigi intélligit, vel probari.'
      responsory: |
        R. Rememorati sunt, quia Deus adjútor est eorum: * Et Deus excelsus Redemptor eorum est.
        V. Et pavit eos in innocóntia cordis sui.
        R. Et Deus excelsus Redemptor eorum est.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joann 3:13-18
      text: 'In illo témpore: Dixit Jesus Nicodémo: Nemo ascéndit in cœlum, nisi qui descéndit de cœlo, Fílius hóminis, qui est in cœlo. Et sicut Moyses exaltávit serpéntem in desérto: ita exaltári opórtet Fílium hóminis, ut omnis, qui credit in ipsum, non péreat, sed hábeat vitam ætérnam. Sic enim Deus diléxit mundum, ut Fílium suum unigénitum daret: ut omnis, qui credit in eum, non pereat, sed habeat vitam ætérnam. Non enim misit Deus Fílium suum in mundum, ut júdicet mundum, sed ut salvétur mundus per ipsum. Qui credit in eum, non judicátur; qui autem non credit, jam judicátus est: quia non credit in nómine unigéniti Fílii Dei.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop, Tractate 12 on the Gospel of John, ch. 3
      text: 'Nemo ascéndit in cœlum, nisi qui de cœlo descéndit. Descéndit enim, et mórtuus est, et ipsa morte liberávit nos a morte. Morte occísus, mortem occídit. Et nostis fratres, quia mors ista per diáboli invídiam intrávit in mundum. Deus mortem non fecit, Scriptúra lóquitur: Nec lætátur, inquit, in perditióne vivórum; creávit enim, ut essent ómnia. Sed quid ibi ait? Invidia autem diáboli mors intrávit in orbem terrárum. Ad mortem a diábolo propinatam non veníret homo vi adáctus: non enim cogendi poténtiam diábolus habébat, sed persuadendi versutiam. Si non consentires, nihil invexerat diábolus; consensio tua, o homo, te perdúxit ad mortem. A mortali mortáles nati, et ex immortalibus mortáles facti. Ab Adam omnes hómines mortáles; Jesus autem Fílius Dei, Verbum Dei, per quod facta sunt ómnia, únicus, æquális Patri, mortalis factus est, quia Verbum caro factum est, et habitávit in nobis. Si ergo mortem suscépit, et mortem suspéndit in cruce, de ipsa morte liberantur mortáles. Quod in figúra factum est apud antíquos, commemoravit illud Dóminus.'
