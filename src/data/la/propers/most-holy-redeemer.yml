# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/10-23-Redemptor.txt ("Ss. Redemptoris", Duplex majus, nine lessons; no Common: every part is its own or named by an `@` include, read from the file it names). Hymn: the source includes Psalterium/Special/Matutinum Special.txt [Day3 Hymnus] lines 1-5, 11-15, 6-10 and the Nat doxology; English is the reference's own.
matins-hymn:
  text: |
    Rerum Creátor óptime,
    Rectórque noster, áspice:
    Nos a quiéte nóxia
    Mersos sopóre líbera.

    Mentes manúsque tóllimus,
    Prophéta sicut nóctibus
    Nobis geréndum prǽcipit,
    Paulúsque gestis cénsuit.

    Te, sancte Christe, póscimus,
    Ignósce culpis ómnibus:
    Ad confiténdum súrgimus,
    Morásque noctis rúmpimus.

    Jesu, tibi sit glória,
    Qui natus es de Vírgine,
    Cum Patre et almo Spíritu,
    In sempitérna sǽcula.
    Amen.
  status: verified

