# Collect. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/10-23-Redemptor.txt ("Ss. Redemptoris", Duplex majus, nine lessons; no Common: every part is its own or named by an `@` include, read from the file it names). English is this project's own translation, marked draft.
collect:
  text: |
    Orémus.
    Deus, qui Unigénitum tuum mundi Redemptorem constituísti, et per eum, devícta morte, nos misericórditer ad vitam reparásti: concéde; ut hæc benefícia recoléntes, tibi perpétua caritáte adhærére, et ejúsdem redemptiónis fructum percípere mereámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

