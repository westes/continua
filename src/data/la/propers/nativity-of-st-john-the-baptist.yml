# Matins Nocturn 2-3 readings for the Nativity of St. John the Baptist
# (Jun 24) — SanctiM/06-24.txt's own Lectio4-9 all resolve back to
# `@Sancti/06-24:LectioN` (resliced), so this feast's own proper
# content is sourced from the Tridentine track exactly as for a
# pre-1955 saint (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/06-24.txt, English/Sancti/06-24.txt.
#
# Nocturn 2: Lectio4-6 (St. Augustine's sermon) combined into one
# reading, one continuous excerpt.
# Nocturn 3: Lectio7's Gospel citation (Luke 1:57-69) quotes only the
# opening sentence before "Et réliqua", not the full pericope, so —
# per the pre-1955 pass's convention of not transcribing bare incipits
# — only the homily portion was originally authored (not marked
# isGospel), combined with Lectio8-9 as one continuous excerpt of
# St. Ambrose's commentary.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily), sourced from the
# day's own Missale [Evangelium] in web/www/missa/Latin/Sancti/06-24.txt
# (full text given there, not a redirect). That source gives the
# pericope as Luke 1:57-68 (through Zachary's Benedictus opening verse)
# — one verse short of the homily's own declared "on Luke 1:57-69" —
# but is otherwise the same pericope the homily discusses, so it is
# used as found rather than extended by guesswork.
#
# Both reading entries below carry their closing proper responsory:
# Nocturn 2's is [Responsory6] (the last of Lectio4-6); Nocturn 3's is
# [Responsory8] (the last of Lectio7-9 that has one — [Responsory9]
# doesn't exist, since Te Deum is sung after Lectio9 at this
# Duplex-1-classis rank).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 20 on the Saints
      text: |-
        Post illum sacrosánctum Dómini natális diem, nullíus hóminum nativitátem légimus celebrári, nisi solíus beáti Joánnis Baptístæ. In áliis Sanctis et eléctis Dei nóvimus illum diem coli, quo illos, post consummatiónem labórum et devíctum triumphatúmque mundum, in perpétuas æternitátes præsens hæc vita partúriit. In áliis consummáta últimi diéi mérita celebrántur: in hoc étiam prima dies, et ipsa étiam hóminis inítia consecrántur; pro hac absque dúbio causa, quia per hunc Dóminus advéntum suum, ne súbito hómines insperátum non agnóscerent, vóluit esse testátum. Joánnes autem figúra fuit véteris Testaménti, et in se formam prǽtulit legis; et ídeo Joánnes prænuntiávit Salvatórem, sicut lex grátiam præcucúrrit.

        Quod autem nondum natus de secréto matérni úteri prophetávit, et expers lucis jam testis est veritátis; hoc est intellegéndum, quod latens sub velámine et carne lítteræ, et Redemptórem mundo spíritu prædicávit, et nobis Dóminum nostrum de quodam legis útero proclamávit. Ergo quia Judǽi erravérunt a ventre, id est, a lege quæ a Christo grávida erat, erravérunt a ventre, locúti sunt falsa; ídeo hic venit in testimónium, ut testimónium perhibéret de lúmine.

        Quod autem Joánnes in cárcere constitútus ad Christum discípulos suos órdinat; lex ad Evangélium transmíttit. Quæ lex juxta typum Joánnis, quasi ignorántiæ clausa cárcere, in obscúro et in occúlto jacébat, et Judáica cæcitáte sensus intra lítteram tenebátur inclúsus. De hoc beátus Evangelísta prolóquitur: Ille erat lucérna ardens, id est, Spíritus Sancti igne succénsus, ut mundo ignorántiæ nocte possésso lumen salútis osténderet, et quasi inter densíssimas delictórum ténebras splendidíssimus justítiæ solem lucis suæ rádio demonstráret, et de seípso dicens: Ego vox clamántis in desérto.
      status: verified
      responsory: |-
        R. Innuébant patri ejus quem vellet vocári eum: et póstulans pugillárem, scripsit dicens: * Joánnes est nomen ejus.
        V. Apértum est os Zacharíæ, et prophetávit dicens.
        R. Joánnes est nomen ejus.
    - nocturn: 3
      isGospel: true
      citation: Luc 1:57-68
      text: 'Elísabeth implétum est tempus pariéndi, et péperit fílium. Et audiérunt vicíni et cognáti ejus, quia magnificávit Dóminus misericórdiam suam cum illa, et congratulabántur ei. Et factum est in die octávo, venérunt circumcídere púerum, et vocábant eum nómine patris sui Zacharíam. Et respóndens mater ejus, dixit: Nequáquam, sed vocábitur Joánnes. Et dixérunt ad illam: Quia nemo est in cognatióne tua, qui vocétur hoc nómine. Innuébant autem patri ejus, quem vellet vocári eum. Et póstulans pugillárem, scripsit, dicens: Joánnes est nomen ejus. Et miráti sunt univérsi. Apértum est autem illico os ejus et lingua ejus, et loquebátur benedícens Deum. Et factus est timor super omnes vicínos eórum: et super ómnia montána Judææ divulgabántur ómnia verba hæc: et posuérunt omnes, qui audíerant in corde suo, dicéntes: Quis, putas, puer iste erit? Etenim manus Dómini erat cum illo. Et Zacharías, pater ejus, repletus est Spíritu Sancto, et prophetávit, dicens: Benedíctus Dóminus, Deus Israël, quia visitávit et fecit redemptiónem plebis suæ.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Commentary on Luke, Bk. 2 (on Luke 1:57-69)
      text: |-
        Péperit fílium Elísabeth, et congratulabántur vicíni. Habet Sanctórum edítio lætítiam plurimórum, quia commúne est bonum; justítia enim commúnis est virtus. Et ídeo in ortu justi futúræ vitæ insígne præmíttitur, et grátia secutúræ virtútis exsultatióne vicinórum præfiguránte signátur. Pulchre autem tempus, quo fuit in útero Prophéta, descríbitur, ne Maríæ præséntia taceátur; sed tempus silétur infántiæ, eo quia infántiæ impediménta nescívit. Et ídeo in Evangélio nihil super eo légimus, nisi ortum ejus, et oráculum, exsultatiónem in útero, vocem in desérto.

        Neque enim ullam infántiæ sensit ætátem, qui supra natúram, supra ætátem in útero pósitus matris, a mensúra cœpit ætátis plenitúdinis Christi. Mire sanctus Evangelísta præmitténdum putávit, quod plúrimi infántem patris nómine Zacharíam appellándum putáverint; ut advértas matri non nomen alicújus displicuísse degéneris, sed id Sancto infúsum Spíritu, quod ab Angelo ante Zacharíæ fúerat prænuntiátum. Et quidem ille mutus intimáre vocábulum fílii nequívit uxóri; sed per prophetíam Elísabeth dídicit, quod non didícerat a maríto.

        Joánnes est, inquit, nomen ejus; hoc est, non nos ei nomen impónimus, qui jam a Deo nomen accépit. Habet vocábulum suum, quod agnóvimus, non quod elégimus. Habent hoc mérita Sanctórum, ut a Deo nomen accípiant. Sic Jacob Israël dícitur, quia Deum vidit. Sic Dóminus noster Jesus nominátus est, ántequam natus; cui non Angelus, sed Pater nomen impósuit. Vides Angelos quæ audíerint, non quæ usurpáverint, nuntiáre. Nec miréris, si nomen múlier, quod non audívit, asséruit; quando Spíritus ei Sanctus, qui Angelo mandáverat, revelávit.
      status: verified
      responsory: |-
        R. Gábriel Angelus appáruit Zacharíæ dicens: Nascétur tibi fílius, nomen ejus Joánnes vocábitur: * Et multi in nativitáte ejus gaudébunt.
        V. Erit enim magnus coram Dómino, vinum et síceram non bibet.
        R. Et multi in nativitáte ejus gaudébunt.

# Verified against Divinum Officium (Sancti/06-25oct.txt, "Die secunda infra
# Octavam Nativitatis S. Joannis Baptistae"), 2026-10-16. Lessons 4-9
# collapsed into one continuous reading per project convention (Augustine's
# sermon, the Gospel incipit, Ambrose on Luke). The source has no English
# for this day at all, so the English is a translation done for this
# project, draft, not verified against any source (same precedent as
# assumption-octave-day-2.yml). Days 3, 5, 6 and 7 read the feast's own
# lessons in the source and have no reading of their own here.
octave-readings/~-octave-day-2:
  source: Sermo sancti Augustini Episcopi et Homilia sancti Ambrosii
  text: |
    Natálem sancti Joánnis, fratres caríssimi, hódie celebrámus: quod nulli umqua Sanctórum légimus fuísse concéssum. Solíus enim Dómini, et beáti Joánnis dies nativitátis in univérso mundo celebrátur et cólitur. Hunc enim stérilis péperit, illum virgo concépit: in Elísabeth sterílitas víncitur, in beáta María conceptiónis consuetúdo mutátur. Elísabeth virum cognoscéndo, fílium génuit: María Angelo crédidit, et concépit. Hóminem concépit Elísabeth, hóminem et María: sed Elísabeth solum hóminem, María Deum et hóminem.

    Magnus ígitur Joánnes, cujus magnitúdini étiam Salvátor testimónium perhibet, dicens: Non surréxit inter natos mulíerum major Joánne Baptísta. Præcéllit céteros, éminet univérsis: antecéllit Prophétas, supergréditur Patriárchas: et quisquis de mulíere natus est, inférior est Joánne. Dicet fortásse áliquis: Si inter natos mulíerum Joánnes major est, major est Salvatóre? Absit. Joánnes enim natus mulíeris, Christus autem vírginis natus est. Ille corruptíbilis úteri sínibus effúsus est, iste impollútæ vírginis flore progénitus.

    Si ergo intellígimus mystérium, fratres mei, Joánnes homo est, Christus Deus est. Humiliétur homo, ut exaltétur Deus, secúndum illud quod de Dómino ipse Joánnes dixit: Illum opórtet créscere, me autem mínui. Ut humiliarétur homo, hódie natus est Joánnes, quo incípiunt decréscere dies: ut exaltétur Deus, eо die natus est Christus, quo incípiunt créscere dies. Magnum sacraméntum, fratres caríssimi. Ideo celebrámus natálem Joánnis sicut et Christi, quia et ipsa natívitas plena est mystério. Quo mystério, nisi humilitátis nostræ, sicut natívitas Christi plena est mystério altitúdinis nostræ?

    Elísabeth implétum est tempus pariéndi, et péperit fílium. Et audiérunt vicíni et cognáti ejus quia magnificávit Dóminus misericórdiam suam cum illa, et congratulabántur ei. Et réliqua.

    Joánnes est, inquit, nomen ejus. Non póterat Elísabeth Dómini ignoráre prænúntium, quæ prophetáuerat Christum. Et bene ádditur: Quia nemo in cognatióne ejus vocabátur hoc nómine: ut intélligas nomen non géneris esse, sed vatis. Zacharías quoque nutu interrogátor: sed quia incredúlitas ei affátum eripúerat et audítum, quod voce non póterat, manu et lítteris est locútus.

    Scripsit autem dicens: Joánnes est nomen ejus. Et hic nomen non impónitur, sed astrúitur. Meritóque contínuo resolúta est lingua ejus: quia quam vínxerat incredúlitas, fides solvit. Credámus et nos ígitur, ut loquámur; ut lingua nostra, quæ incredulitátis vínculis est ligáta, ratiónis voce solvátur.

    Scribámus spíritu mystéria, si vólumus loqui: scribámus prænúntium Christi, non in tábulis lapidéis, sed in tábulis cordis carnálibus. Etenim qui Joánem lóquitur, Christum prophétat. Loquámur Joánnem, loquámur et Christum: ut nostrum quoque os possit aperíri, quod in sacerdóte tanto, irrationális modo pécudis, fræna nutántis fídei coërcebant.
  responsory: |
    R. Fuit homo missus a Deo, cui nomen erat Joánnes: * Hic venit in testimónium, ut testimónium perhibéret de lúmine, et paráret Dómino plebem perféctam. V. Erat Joánnes in desérto prǽdicans baptísmum pœniténtiæ. R. Hic venit in testimónium, ut testimónium perhibéret de lúmine, et paráret Dómino plebem perféctam.
  status: verified

# Verified against Divinum Officium (Sancti/06-27oct.txt, "Quarta die infra
# Octavam Nativitatis S. Joannis Baptistae"), 2026-10-16. Lessons 4-9
# collapsed into one continuous reading per project convention (Basil's
# homily on Psalm 28, the Gospel incipit, Ambrose on Luke). The source's
# own English is used, with its stray bracket and tilde markers removed.
# Opening responsory is the feast's own Responsory1 (Nativity day), per the
# convention in vu-octave-reading-responsory-sweep.
octave-readings/~-octave-day-4:
  source: Sermo sancti Basilii Magni et Homilia sancti Ambrosii
  text: |
    Vox Dómini super aquas. Qualis vox? super quas aquas? Velut prophetíam accipiámus quod dictum est. Memíneris Joánnis, qui interrogátus a Judǽis: Tu quis es? quod respónsum dábimus iis, qui misérunt nos? respóndit: Ego vox clamántis in desérto. Igitur vox Dómini est Joánnes, Angelus a Deo missus ante fáciem Dómini, ut paráret Dómino plebem perféctam. Hæc ígitur vox super aquas, erat super Jordánem, in quo baptizábat prǽdicans pœniténtiæ baptísmum, et non solum in Jordáne, sed étiam in Ænon prope Salim, quia aquæ multæ erant illic.

    Igitur vox Dómini super aquas, Joánnes est super baptísmum. Illic et Deus majestátis intónuit: venit enim vox de cælo, dicens: Hic est Fílius meus diléctus, in quo mihi complácui. Tunc étiam Dóminus super aquas multas dignátus est descéndere in baptísma Joánnis, ut compléret omnem justítiam quæ in lege est. Vox Dómini in virtúte. Auferet enim debilitátes pópuli per pœniténtiæ baptísmum, per ipsum baptízans in aqua ad pœniténtiam. In virtúte est vox, dicens: Pœniténtiam ágite, appropinquávit enim regnum cælórum: et, Fácite fructus dignos pœniténtiæ.

    Vox Dómini confringéntis cedros. Potest dici, quod parans Dómino pópulum perféctum, elátas impietátes et contra cognitiónem Dei exaltátas confríngens, ac cónterens, oblíqua faciébat recta. Qui enim omnem collem ac montem humíliat, hic erat qui confringébat cedros, et Dómino viam adæquábat, per hoc quod ad pœniténtiam inducébat altum, et elátum, et supérbum cor. Unde ejus præparatiónem suscípiens Dóminus, suo advéntu confrégit oppósitas poténtias, cedros Líbani figuráte dictas. Opórtet enim Dóminum regnáre, donec ponat inimícos sub pedes suos, et cedros istas commínuat.

    Elísabeth implétum est tempus pariéndi, et péperit fílium. Et audiérunt vicíni et cognáti ejus quia magnificávit Dóminus misericórdiam suam cum illa, et congratulabántur ei. Et réliqua.

    Et Zacharías pater ejus implétus est Spíritu Sancto, et prophetábat. Vide quam bonus Deus, et fácilis indulgére peccátis; non solum abláta restítuit, sed étiam insperáta concédit. Ille dudum mutus prophétat; hæc enim grátia Dei máxima, quod eum, qui negáverat, confitétur. Nemo ergo diffídat, nemo véterum cónscius delictórum prǽmia divína despéret. Novit Dóminus mutáre senténtiam, si tu nóveris emendáre delíctum.

    Et tu puer, prophéta Altíssimi vocáberis. Pulchre, cum de Dómino prophetáret, ad prophétam sua verba convértit, ut hoc quoque benefícium esse Dómini designáret: ne cum públice enumeráret sua, quasi ingrátus tacuísse viderétur quæ agnoscébat in fílio. Sed fortásse áliqui quasi irrationábilem mentis excéssum putent, quod octo diérum allóquitur infántem. Verum, si teneámus, intelligémus profécto quod pótuit vocem patris natus audíre, qui Maríæ salutatiónem ántequam nascerétur audívit.

    Sciébat profécto álias esse aures prophétæ, quæ Spíritu Dei, non córporis ætáte reserántur. Habébat intelligéndi sensum, qui exsultándi habébat afféctum. Simul illud advérte, quam paucis Elísabeth, quam multis Zacharías prophétet: et utérque Sancto replétus Spíritu loquebátur: sed disciplína servátur, ut múlier díscere magis quæ divína sunt, stúdeat, quam docére.
  responsory: |
    R. Fuit homo missus a Deo, cui nomen erat Joánnes: * Hic venit in testimónium, ut testimónium perhibéret de lúmine, et paráret Dómino plebem perféctam. V. Erat Joánnes in desérto prǽdicans baptísmum pœniténtiæ. R. Hic venit in testimónium, ut testimónium perhibéret de lúmine, et paráret Dómino plebem perféctam.
  status: verified

# Verified against Divinum Officium (Sancti/07-01t.txt, "In Octava S.
# Joannis Baptistae", Duplex), 2026-10-16. The octave day's own 9-lesson
# office (Maximus of Turin, the Gospel incipit, Ambrose on Luke), collapsed
# into one continuous reading per project convention. The source's own
# English is used, with its tilde markers removed. In Continua this day is
# also the Most Precious Blood (Duplex I), which outranks it, so the
# octave day is normally only commemorated.
octave-readings/~-octave-day-8:
  source: Sermo sancti Maximi Episcopi et Homilia sancti Ambrosii
  text: |
    Festivitatem præsentis diei, fratres carissimi, venerandi Joannis Baptistæ genuina nativitas consecravit: qui idcirco in hoc sæculum superna dispensatione directus est, ut non solum ipse prophetali sublimaretur gloria, sed ut et omnium étiam per eum prophetarum præconia firmarentur. Nec immerito illum præcipuo honore nunc veneramur, qui speciali quadam gratia, ob hoc Redemptorem mundi novissimus prophetavit, ut ostenderet eum primus. Hic enim solus est prophetarum, qui Dominum nostrum Jesum Christum, quem alii in longa tempora futurum præscierunt, propriis oculis videre meruit, et annuntiare præsentem.

    Hic est ille, quem, inspirante Deo, præscius annuntiat Isaias, dicens: Vox clamantis in deserto, Parate viam Domini. Quam congrue fratres carissimi beatus Joannes prædicatus est vox, qui cælestis Verbi et præco mittebatur, et testis. Hic est ille, cujus per Angelum Gabrielem prænuntiatur nativitas, et nomen, et meritum. Hic est, qui judicio cælestis sententiæ cunctis mortalibus antefertur, dicente Domino: Non surrexit inter natos mulierum major Joanne Baptista. Quam pulchre dictum est, inter natos mulierum non esse majorem: quia ille omnimodis major erat Joanne, qui de Virgine nascebatur.

    Quibus perspectis, advertite dilectissimi, quantam huic reverentiam, quantum devotionis debeamus impendere: qui ut honorabilis sit, a sancto est Spiritu prophetatus, promissus ab Angelo, laudatus a Domino, et perpetua sanctæ mortis gloria consecratus. Decebat namque, ut mysticam nativitatem ejus mirabilis vita sequeretur, et sanctam perfectamque vitam mors Deo devota concluderet. Propter quod, fratres, rectissime toto hodie orbe, Christi Ecclesia primordia nativitatis ejus lætissima festivitate concelebrat, qui æterna mortalibus adesse gaudia, stupenti mundo testis fidelissimus revelavit.

    Elisabeth impletum est tempus pariendi, et peperit filium. Et audierunt vicini et cognati ejus. quia magnificavit Dominus misericordiam suam cum illa, et congratulabantur ei. Et réliqua.

    Joannes est, inquit, nomen ejus. Non poterat Elisabeth Domini ignorare prænuntium, quæ prophetaverat Christum. Bene additur: Quia nemo in cognatione ejus vocabatur hoc nomine, ut intelligas nomen non generis esse, sed vatis. Zacharias quoque nutu interrogatur: sed quia incredulitas ei affatum eripuerat et auditum; quod voce non poterat, manu et litteris est locutus.

    Scripsit enim dicens: Joannes est nomen ejus. Et hic nomen non imponitur, sed astruitur: meritoque continuo resoluta est lingua ejus: quia quam vinxerat incredulitas, fides solvit. Credamus et nos igitur, ut loquamur; ut lingua nostra, quæ incredulitatis vinculis est ligata, rationis voce solvatur.

    Scribamus spiritu mysteria, si volumus loqui: scribamus prænuntium Christi, non in tabulis lapideis, sed in tabulis cordis carnalibus. Etenim qui Joánnem loquitur, Christum prophetat. Loquamur Joánnem, loquamur et Christum: ut nostrum quoque os possit aperiri, quod in sacerdote tanto, irrationabilis modo pecudis, fræna nutantis fidei coërcebant.
  responsory: |
    R. Fuit homo missus a Deo, cui nomen erat Joánnes: * Hic venit in testimónium, ut testimónium perhibéret de lúmine, et paráret Dómino plebem perféctam. V. Erat Joánnes in desérto prǽdicans baptísmum pœniténtiæ. R. Hic venit in testimónium, ut testimónium perhibéret de lúmine, et paráret Dómino plebem perféctam.
  status: verified
