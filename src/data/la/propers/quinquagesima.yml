# Nocturn 2-3, Quinquagesima Sunday (temporalId quinquagesima). Sourced
# from Tempora/Quadp3-0.txt (Latin) / English/Tempora/Quadp3-0.txt. See
# advent-1.yml/septuagesima.yml for the general sweep method.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from St. Ambrose's book On
# the Patriarch Abraham, Book 1, chapter 2 (the Genesis/Fall-to-Abraham
# Nocturn 1 cycle continues here from Sexagesima). Responsory: Lectio4's
# own (Responsory4, "Angelus Dómini vocávit Abraham").
#
# Nocturn 3 (Lectio7-9): Lectio7 carries real homily prose after its bare
# Gospel incipit (Luke 18:31-43, the healing of the blind man near
# Jericho, "Et réliqua") - Pope St. Gregory the Great's Homily 2 on the
# Gospels begins within Lectio7 itself, same pattern used throughout this
# sweep. Combined Lectio7's homily portion (incipit dropped) with
# Lectio8-9, using Responsory7 ("Veni hódie ad fontem aquæ") - the first
# responsory of the group the combined reading spans.
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Bishop of Milan, On the Patriarch Abraham, Book 1
      text: |-
        Magnus plane vir Abraham, et multárum virtútum clarus insígnibus, quem votis suis philosophía non pótuit æquare. Dénique minus est quod illa finxit, quam quod iste gessit: majórque ambitióso eloquéntiæ mendácio simplex veritátis fides. Itaque cujúsmodi fúerit in eo viro devótio, considerémus. Ea enim virtus órdine prima est, quæ est fundaméntum ceterárum: meritóque hanc ab eo primam exégit Deus, dicens: Exi de terra tua, et de cognatióne tua, et de domo patris tui. Satis fúerat dixísse: De terra tua. Ibi enim erat exíre de cognatióne, exíre de patérna domo.

        Sed ideo áddidit síngula, ut ejus afféctum probáret: ne forte aut imprudénter cœpísse viderétur, aut fraus áliqua mandátis cæléstibus pararétur. Sed sicut coacervánda fuérunt præcépta, ne quid latéret: ita étiam proponénda præmia, ne forte desperáret. Tentátur ut fortis, incitátur ut fidélis, provocátur ut justus: meritóque exívit, quemádmodum locútus est illi Dóminus. Et exívit cum eo Lot. Hoc autem, quod pro magno inter septem sapiéntum dicta celebrátur: Séquere Deum; perfécit Abraham, factóque sapiéntum dicta prævénit, et secútus Deum exívit de terra sua.

        Sed quia ante terra ei fúerat ália, hoc est, régio Chaldæórum, de qua exívit Thare pater Abrahæ, et in Charran demigrávit: et quia secum edúxit nepótem suum, cui dictum fúerat, Exi de cognatióne tua: considerémus, ne forte hoc sit exíre de terra sua, de hujus terræ, hoc est, de córporis nostri quadam commemoratióne égredi, de qua exívit Paulus, qui dixit: Nostra autem conversátio in cælis est.
      responsory: |-
        R. Angelus Dómini vocávit Abraham, dicens: * Ne exténdas manum tuam super púerum, eo quod tímeas Dóminum.
        V. Cumque extendísset manum ut immoláret fílium, ecce Angelus Dómini de cælo clamávit, dicens.
        R. Ne exténdas manum tuam super púerum, eo quod tímeas Dóminum.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 18:31-43
      text: 'In illo témpore: Assúmpsit Jesus duódecim, et ait illis: Ecce, ascéndimus Jerosólymam, et consummabúntur ómnia, quæ scripta sunt per Prophétas de Fílio hominis. Tradétur enim Géntibus, et illudétur, et flagellábitur, et conspuétur: et postquam flagelláverint, occídent eum, et tértia die resúrget. Et ipsi nihil horum intellexérunt, et erat verbum istud abscónditum ab eis, et non intellegébant quæ dicebántur. Factum est autem, cum appropinquáret Jéricho, cæcus quidam sedébat secus viam, mendícans. Et cum audíret turbam prætereúntem, interrogábat, quid hoc esset. Dixérunt autem ei, quod Jesus Nazarénus transíret. Et clamávit, dicens: Jesu, fili David, miserére mei. Et qui præíbant, increpábant eum, ut tacéret. Ipse vero multo magis clamábat: Fili David, miserére mei. Stans autem Jesus, jussit illum addúci ad se. Et cum appropinquásset, interrogávit illum, dicens: Quid tibi vis fáciam? At ille dixit: Dómine, ut vídeam. Et Jesus dixit illi: Réspice, fides tua te salvum fecit. Et conféstim vidit, et sequebátur illum, magníficans Deum. Et omnis plebs ut vidit, dedit laudem Deo.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 2 on the Gospels
      text: |-
        Redémptor noster, prǽvidens ex passióne sua discipulórum ánimos perturbándos, eis longe ante et ejúsdem passiónis pœnam, et resurrectiónis suæ glóriam prædíxit: ut cum eum moriéntem, sicut prædíctum est, cérnerent; étiam resurrectúrum non dubitárent. Sed quia carnáles adhuc discípuli nullo modo valébant cápere verba mystérii, venítur ad miráculum. Ante eórum óculos cæcus lumen recépit: ut qui cæléstis mystérii verba non cáperent, eos ad fidem cæléstia facta solidárent.

        Sed mirácula Dómini et Salvatóris nostri sic accipiénda sunt, fratres caríssimi, ut et in veritáte credántur facta, et tamen per significatiónem nobis aliquid ínnuant. Opera quippe ejus et per poténtiam áliud osténdunt, et per mystérium áliud loquúntur. Ecce enim, quis juxta históriam cæcus iste fúerit, ignorámus: sed tamen quid per mystérium signíficet, nóvimus. Cæcum quippe est genus humánum, quod in parénte primo a paradísi gáudiis expúlsum, claritátem supérnæ lucis ignórans, damnatiónis suæ ténebras pátitur. Sed tamen per Redemptóris sui præséntiam illuminátur: ut intérnæ lucis gáudia jam per desidérium vídeat, atque in via vitæ boni óperis gressus ponat.

        Notándum vero est, quod cum Jesus Jéricho appropinquáre dícitur, cæcus illuminátur. Jéricho quippe luna interpretátur: luna autem in sacro elóquio pro deféctu carnis pónitur: quia dum ménstruis moméntis decréscit, deféctum nostræ mortalitátis desígnat. Dum ígitur Cónditor noster appropínquat Jéricho, cæcus ad lumen redit: quia dum divínitas deféctum nostræ carnis suscépit, humánum genus lumen, quod amíserat, recépit. Unde enim Deus humána pátitur, inde homo ad divína sublevátur. Qui vidélicet cæcus recte et juxta viam sedére, et mendícans esse descríbitur. Ipsa enim Véritas dicit: Ego sum via.
      responsory: |-
        R. Veni hódie ad fontem aquæ, et orávi Dóminum, dicens: * Dómine, Deus Abraham, tu prósperum fecísti desidérium meum.
        V. Igitur puélla, cui díxero, Da mihi aquam de hýdria tua, ut bibam: et illa díxerit, Bibe, dómine, et camélis tuis potum tríbuam: ipsa est, quam præparávit Dóminus fílio dómini mei.
        R. Dómine, Deus Abraham, tu prósperum fecísti desidérium meum.
      status: verified
