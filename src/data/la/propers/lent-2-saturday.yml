# Lauds collect ([Oratio 2] in the source) — read from
# web/www/horas/{Latin,English}/Tempora/Quad2-6.txt.
collect:
  text: |
    Orémus.
    Da, quǽsumus, Dómine, nostris efféctum jejúniis salutárem: ut castigátio carnis assúmpta, ad nostrárum vegetatiónem tránseat animárum.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Vespers collect ([Oratio 3] in the source), distinct from Lauds' own —
# read from web/www/horas/{Latin,English}/Tempora/Quad2-6.txt.
collect/~-vespers:
  text: |
    Orémus.
    Quǽsumus, omnípotens Deus, vota humílium réspice: atque ad defensiónem nostram, déxteram tuæ majestátis exténde.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

