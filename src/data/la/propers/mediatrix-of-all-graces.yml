# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-31-BMVMediatrix.txt (Duplex majus, nine lessons, `ex C11`). Matins psalmody: nine antiphons with the psalms the source assigns, three nocturns of three. English is this project's own translation, marked draft.
matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 8
        antiphon: Fons hortórum, * púteus aquárum vivéntium, quæ fluunt ímpetu de Líbano.
      - psalms:
          - 18
        antiphon: Manus meæ * stillavérunt myrrham, et dígiti mei pleni myrrha probatíssima.
      - psalms:
          - 23
        antiphon: Vadam ad montem * myrrhæ, et ad collem thuris.
    versicle:
      v: Sub tuum præsídium omnes confúgimus.
      r: Sancta Dei Génetrix.
  nocturn2:
    groups:
      - psalms:
          - 44
        antiphon: Hábuit grátiam * et misericórdiam coram Rege super omnes mulíeres.
      - psalms:
          - 45
        antiphon: Pete, Mater mea; * neque enim fas est ut avértam fáciem tuam.
      - psalms:
          - 86
        antiphon: Tu invoca Dóminum, * et lóquere Regi pro nobis, libera nos de morte.
    versicle:
      v: Nostras deprecatiónes ne despícias.
      r: In necessitátibus nostris.
  nocturn3:
    groups:
      - psalms:
          - 95
        antiphon: Si invéni grátiam * in óculis tuis, o Rex, dona mihi pópulum meum, pro quo óbsecro.
      - psalms:
          - 96
        antiphon: Benedícta es tu * præ ómnibus muliéribus super terram, quia subvenísti ruínæ ante conspéctum Dei nostri.
      - psalms:
          - 97
        antiphon: 'Domináre nostri * tu, et Fílius tuus: quia liberásti nos de manu inimicórum nostrórum.'
    versicle:
      v: A perículis cunctis líbera nos semper.
      r: Virgo gloriósa et benedícta.

