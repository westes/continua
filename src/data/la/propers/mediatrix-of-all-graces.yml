# Matins Nocturn 2 and 3 readings for Our Lady, Mediatrix of All Graces. Sourced from
# web/www/horas/Latin/Sancti/aliquibus locis/05-31-BMVMediatrix.txt. One entry per
# lesson, each with the source's own responsory: Lectio4 (St. Ephrem), Lectio5 (St.
# Germanus), Lectio6 (St. Bernard) in Nocturn 2; in Nocturn 3 the Gospel (John
# 19:25-27, the source gives only its incipit, so the pericope is the one already
# carried for the Seven Sorrows) and then Lectio7-9, St. Bernardine of Siena on John
# 19. Lectio9 has no responsory of its own (the Te Deum follows). Nocturn 1
# (Lectio1-3) is not carried: continua's first nocturn runs the Scripture course.
#
# Latin: obvious typos corrected silently -- "ab iso primo Adam" -> "ab ipso", "in
# exháustum" -> "inexháustum", "lápidem pretióso" -> "lápide pretióso" (Responsory2,
# not carried), "opsa nepótem" -> "ipsa nepótem", "Bernadíni" -> "Bernardíni",
# "confi rmávit" -> "confirmávit". Responsory4's closing repeat of the part after the
# asterisk is supplied (the source gives only R./V.). Everything else is verbatim.
# English is this project's own translation, marked draft; the Gospel's is the
# existing Douay text.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Ephrem the Syrian, Deacon, Prayer to the Mother of God
      text: 'Dómina mea, sanctíssima Dei Génetrix et grátia plena, pélagus inexháustum divinárum secretarúmque largitiónum ac múnerum, bonórum ómnium erogátio, ómnium post Trinitátem Dómina, post Paráclitum álius consolátor, et post Mediatórem Mediátrix totíus mundi, vide meam fidem meúmque desidérium divínitus datum. Ne despícias indígnum, neque meárum actiónum fœditátes tuam imménsam misericórdiam interrúmpant, Dei Génetrix, meum desiderabilíssimum nomen; nihil enim est fírmius trophǽum quam tuum auxílium. Tu enim abstulísti omnes lácrimas a fácie terræ; tu creatúram replésti omni génere benefícii, cæléstibus lætítiam attulísti, terréstria salvásti. Per te resurrectiónis nostræ tésseram certíssimam tenémus: per te cæléste regnum nos consecutúros esse sperámus; per te omnis glória, honor et sánctitas ab ipso primo Adam et usque ad consummatiónem sǽculi Apóstolis, Prophétis, iustis et humílibus corde, sola immaculáta, deriváta est, derivátur et derivábitur; atque in te gaudet, grátia plena, omnis creátura.'
      responsory: |
        R. Ecce, Dóminus meus ómnia mihi trádidit, * Nec quidquam est quod non in mea sit potestáte, vel non tradíderit mihi.
        V. Fecit mihi magna qui potens est, et sanctum nomen eius.
        R. Nec quidquam est quod non in mea sit potestáte, vel non tradíderit mihi.
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Germanus, Bishop of Constantinople, Sermon (Oratio 9)
      text: 'Nos, qui divinórum óperum morúmque páuperes sumus, dum per te, o María, nobis exhíbitas benignitátis divítias cérnimus, propénse dicámus: Misericórdia Dómini plena est terra. Nos, in multitúdine peccatórum a Deo extórres, per te Deum quæsívimus et invenímus, inventóque salvi facti sumus. Igitur potens ad salútem præstándam auxílium tuum, o Dei Génetrix, ac eiúsmodi, ut nullum álium mediatórem necessárium hábeat ad Deum. Plane enim nullus tuæ magnificéntiæ finis; insatiábilis opitulátio tua. Nullus múnerum tuórum númerus est. Nullus enim, nisi per te, o sanctíssima, salútem conséquitur. Nullus, nisi per te, o immaculatíssima, qui a malis liberétur. Nullus, nisi per te, o castíssima, cui donum indulgeátur. Nullus, nisi per te, o honoratíssima, cui grátiæ munus misericórdia præstétur. Quam ob rem, quis te beátam non prædicábit? Te, inquam, gloriósam, te beatificándam, te, quæ ab ipso Fílio tuo ac Deo magnália nacta sis, uti magna et admiránda: quam ob rem te laudant omnes generatiónes.'
      responsory: |
        R. Præpósita ómnibus, gubérnat créditam sibi domum et univérsa, quæ ei sunt trádita. * Absque eius império non movébit quisquam manum aut pedem in omni terra.
        V. Benedictiónem ómnium géntium dedit illi Dóminus, et testaméntum suum confirmávit super caput eius.
        R. Absque eius império non movébit quisquam manum aut pedem in omni terra.
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Bernard, Abbot, Sermon on the Nativity of the Blessed Virgin Mary, n. 6
      text: 'Intuére, o homo, consílium Dei, agnósce consílium sapiéntiæ, consílium pietátis. Cælésti rore áream rigatúrus, totum vellus prius infúdit: redemptúrus humánum genus, prétium univérsum cóntulit in Maríam. Ut quid hoc? Forte ut excusarétur Heva per fíliam, et queréla viri advérsus féminam deínceps sopirétur. Ne díxeris ultra, o Adam: Múlier, quam dedísti mihi, dedit mihi de ligno vétito; dic pótius: Múlier, quam dedísti mihi, me cibávit fructu benedícto. Piíssimum sane consílium; sed latet fórsitan áliud, nec totum hoc est. Altius ergo intuémini quanto devotiónis afféctu a nobis eam volúerit honorári, qui totíus boni plenitúdinem pósuit in María; ut proínde, si quid spei in nobis est, si quid grátiæ, si quid salútis, ab ea novérimus redundáre. Totis ergo medúllis córdium, totis præcordiórum afféctibus et votis ómnibus Maríam hanc venerémur: quia sic est volúntas eius, qui totum nos habére vóluit per Maríam. Hæc, inquam, volúntas eius est, sed pro nobis.'
      responsory: |
        R. Laudáte Dóminum, Deus nostrum, qui non deséruit sperántes in se: * Et in me, ancílla sua, adimplévit misericórdiam suam, quam promísit dómui Israel.
        V. Deus exaltávit me, ut salvos fácerem multos pópulos.
        R. Et in me, ancílla sua, adimplévit misericórdiam suam, quam promísit dómui Israel.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joann 19:25-27
      text: 'In illo témpore: Stabant juxta Crucem Jesu Mater ejus, et soror Matris ejus, María Cléophæ, et María Magdaléne. Cum vidísset ergo Jesus Matrem, et discípulum stantem, quem diligébat, dicit Matri suæ: Múlier, ecce fílius tuus. Deinde dicit discípulo: Ecce Mater tua. Et ex illa hora accépit eam discípulus in sua.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernardine of Siena, Lenten sermons on Christian religion, Sermon 51 on the Passion of the Lord, part 2, art. 1, ch. 3
      text: 'Pulsántur admiratióne ómnium legéntium sive audiéntium mentes, scílicet quo motu, quo sensu, qua possibilitáte, qua vera auctoritáte, ista dicúntur quod discípulus tránseat in fílium Vírginis, et Virgo hábeat purum hóminem fílium, quem non génuit: sic nec quod sit fílius ex Vírgine, qui de corrúptis paréntibus natus erat ex sémine. Impossibília quidem vidéntur hæc, sed nihil impossíbile apud Deum. Pietáte quidem et oratióne opus est ad ingrediéndum tale mystérium. Múlier enim beáta Virgo vocátur a Christo, quam numquam appellávit ex vócibus matrem. Múlier, et non múlier: sed super ángelos, et hómines, et mulíeres superexcédens múlier. Accépit a Fílio, quem cum ætérno Patre únicum possidébat, fílium præter ventrem, quem ante in carne habébat ipsa nepótem.'
      responsory: |
        R. Facta est María refúgium páuperi, * Adiútrix in opportunitátibus, in tribulatióne.
        V. Virgo potens sicut turris David: mille clýpei pendent ex ea, omnis armatúra fórtium.
        R. Adiútrix in opportunitátibus, in tribulatióne.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernardine of Siena, Lenten sermons on Christian religion, Sermon 51 on the Passion of the Lord, part 2, art. 1, ch. 3
      text: 'Sed in quo filiatiónis génere Ioánnes Vírginis factus est fílius, aut eius mater facta est Virgo? Non hoc natúra favet, non concéptus, non partus exséquitur, non ingréssus in úterum ut dénuo nascerétur, non adóptio pro hereditáte in temporálibus consequénda, nec ex imitatióne, aut ex proláta doctrína. Nec ista disserénda erant verbo Christi: nec facta est locútio ut sit quasi, sed sic a Christo légimus dictum: Múlier, ecce fílius tuus; ut, exclúsa omni superfluitáte verbórum, secrétum mystérii penetrémus. Mýstice ígitur intellígimus in Ioánne omnes ánimas electórum, quorum per dilectiónem beáta Virgo facta est mater: fílius enim in græco nomen amóris est. Omnis enim Christi amor in amórem Vírginis transit, ut mérito fílius, id est, amor Vírginis nuncupétur, magísque Vírginem hábeat matrem, quam illam, quæ illum ex peccáto damnátum mundo, suscépto sémine generávit.'
      responsory: |
        R. Adeámus cum fidúcia ad thronum gratiæ, * Ut misericórdiam consequámur, et grátiam inveniámus in auxílio opportúno.
        V. Ad te, Virgo, suspirámus, geméntes et flentes in hac lacrimárum valle.
        R. Ut misericórdiam consequámur, et grátiam inveniámus in auxílio opportúno.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernardine of Siena, Lenten sermons on Christian religion, Sermon 51 on the Passion of the Lord, part 2, art. 1, ch. 3
      text: 'Mutátur hæc matérnitas et filiátio ex auctoritáte verbórum Christi in cruce pendéntis. Proptérea natúra transit in grátiam, et grátia nobílitat profécto natúram; non quod una in álteram commutétur, sed quia natúra ex grátia perfícitur. Mala múlier Heva corruptióne naturæ: bona múlier María, mater grátiæ, mater misericórdiæ. Datur mater grátiæ pro matre natúræ; manet tamen mater natúra, manet étiam mater ex grátia. Erat enim Ioánni mater María Salóme in órdine succedéntis natúræ; est étiam sibi mater beáta Virgo in órdine grátiæ. Est mater Heva cunctórum per tráducem natúræ; est et Virgo María mater ómnium amántium Christum per infusiónem invisíbilis grátiæ.'
      status: verified
