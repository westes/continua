# Read directly from web/www/horas/Latin/Sancti/04-13.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui beátum Hermenegíldum Mártyrem tuum cælésti regno terrénum postpónere
    docuísti: da quǽsumus nobis; ejus exémplo cadúca despícere, atque ætérna sectári.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-martyr (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). st-hermenegild has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-hermenegild-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Qui odit * ánimam suam in hoc mundo, in vitam ætérnam custódit eam.
    V. Justus ut palma florébit.
    R. Sicut cedrus Líbani multiplicábitur.
    Orémus.
    Deus, qui beátum Hermenegíldum Mártyrem tuum cælésti regno terrénum postpónere
    docuísti: da quǽsumus nobis; ejus exémplo cadúca despícere, atque ætérna sectári.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. Hermenegild, Martyr (Apr 13).
# Sourced directly from web/www/horas/Latin/Sancti/04-13.txt,
# English/Sancti/04-13.txt (Pope St. Gregory the Great, Dialogues, Book
# III, ch. 31). Lectio4-6 combined into one reading, one continuous
# account. Nocturn 3 (Lectio7-9) is a direct `@Commune/C2:LectioN`
# cross-reference to the Common of a Martyr, not transcribed here.
#
# Verified 2026-09-05 (Gospel-pairing sweep): confirmed via
# horas/Latin/Sancti/04-13.txt -- Lectio7-9 there are literally
# `@Commune/C2:Lectio7/8/9` (Gregory's Dialogues excerpt is Nocturn 2
# only, no proper Nocturn 3 homily of Hermenegild's own). Common of a
# Martyr's own Nocturn 3 content is generic, already handled by this
# store's per-Common-category pool -- no saint-specific Gospel to pair
# here.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope St. Gregory the Great, Dialogues, Book III, ch. 31
      text: |-
        Hermenegildus rex, Leovigildi regis Visigothorum filius, ab Ariana hæresi ad fidem catholicam viro reverendissimo Leandro Hispalensi episcopo, dudum mihi in amicitiis familiariter juncto, prædicante, conversus est. Quem pater Arianus, ut ad eamdem hæresim rediret, et præmiis suadere, et minis terrere conatus est. Cumque ille constantissime responderet, numquam se veram fidem posse relinquere, quam semel agnovisset: iratus pater eum privavit regno, rebusque exspoliavit omnibus. Cumque nec sic virtutem mentis illius emollire valuisset, in arcta illum custodia concludens, collum manusque illius ferro ligavit. Cœpit ítaque Hermenegildus rex juvenis terrenum regnum despicere, et forti desiderio cæleste quærens, in ciliciis vinculatus jacens, omnipotenti Deo ad confortandum se, preces effundere; tantoque sublimius gloriam transeuntis mundi despicere, quanto et religatus agnoverat nihil fuísse, quod potuerit auferri.

        Superveniente autem Paschalis festivitatis die, intempestæ noctis silentio, ad eum perfidus pater Arianum episcopum misit, ut ex ejus manu sacrilegæ consecrationis communionem perciperet, atque per hoc ad patris gratiam redire mereretur. Sed vir Deo deditus, Ariano episcopo venienti exprobravit, ut debuit, ejusque a se perfidiam dignis increpationibus repulit: quia etsi exterius jacebat ligatus, apud se tamen in magno mentis culmine stabat securus. Ad se ítaque reverso episcopo, Arianus pater infremuit, statimque suos apparitores misit, qui constantissimum Confessorem Dei illic ubi jacebat, occiderent; quod et factum est. Nam mox ut ingressi sunt, securim cerebro ejus infigentes, vitam corporis abstulerunt: hocque in eo valuerunt perimere, quod ipsum quoque, qui peremptus est, in se constiterat despexisse. Sed pro ostendenda vera ejus gloria, superna quoque non defuere miracula. Nam cœpit in nocturno silentio psalmodiæ cantus ad corpus ejusdem Regis et Martyris audiri: atque ideo veraciter Regis, quia et Martyris.

        Quidam étiam ferunt, quod illic nocturno tempore accensæ lampades apparebant; unde et factum est, quatenus corpus illius, ut videlicet Martyris, jure a cunctis fidelibus venerari debuisset. Pater vero perfidus et parricida, commotus pœnitentia, hoc fecisse se doluit, nec tamen usque ad obtinendam salutem pœnituit. Nam quia vera esset catholica fides agnovit, sed gentis suæ timore perterritus, ad hanc pervenire non meruit. Qui, oborta ægritudine, ad extrema perductus est, et Leandro episcopo, quem prius vehementer afflixerat, Reccaredum regem filium suum, quem in sua hæresi relinquebat, commendare curavit, ut in ipso quoque talia faceret, qualia et in fratre suis exhortationibus fecisset. Qua commendatione expleta, defunctus est. Post cujus mortem Reccaredus rex non patrem perfidum, sed fratrem Martyrem sequens, ab Arianæ hæreseos pravitate conversus est, totamque Visigothorum gentem ita ad veram perduxit fidem, ut nullum in suo regno militare permitteret, qui regni Dei hostis exsistere per hæreticam pravitatem non timeret.
      status: verified
