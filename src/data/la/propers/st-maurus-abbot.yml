# Real, dedicated commemoration bundle for St. Maurus on Jan 15 -- live-
# verified against the local CGI reference engine (`../divinum-officium-
# reference`'s companion instance), Laudes, version=Tridentine - 1906,
# date=01-15-2029, votive=Hodie: the Tridentine track's own genuine proper
# "Commemoratio S. Mauri Abbatis" bundle, not a generic Common-of-an-Abbot
# substitution. This is Maurus's real historically-attested commemoration
# text under the track vu now follows for calendar/saints dating -- see
# calendar/saints/st-maurus-abbot.yml's own header for why he's a
# commemoration here rather than the day's winner. Ant/V/R differ from the
# generic common-of-an-abbot-commemoration-antiphon.yml text; both real,
# just this saint's own proper occasion instead of the shared Common.
commemoration:
  text: |
    Ant. Similábo eum viro sapiénti, qui ædificávit domum suam supra petram.
    V. Amávit eum Dóminus, et ornávit eum.
    R. Stolam glóriæ índuit eum.
    Orémus.
    Intercéssio nos, quǽsumus, Dómine, beáti Mauri Abbátis comméndet: ut, quod nostris méritis non valémus, ejus patrocínio assequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Matins Nocturn reading for St. Maurus, Abbot (Jan 15) — a genuine
# Monastic-only saint: no Sancti/01-15*.txt names him at all (that slot
# belongs to Ss. Marius/Martha/Audifax/Abachum and, off-date, St. Paul
# the Hermit — see memory vu-matins-pre1955-saints); his own proper
# vita exists only at web/www/horas/Latin/SanctiM/01-15t.txt. Lectio1-4
# of that file fall back to Common of a Confessor (`CommuneM/C5`), not
# proper text; Lectio5-8 are St. Maurus's own vita, one continuous
# account (a disciple-of-Benedict biography), combined into a single
# reading, no genuine source break.
# No English/SanctiM/01-15t.txt exists in the reference engine at all
# (the English SanctiM tree only covers a subset of dates) — English
# text below is this project's own translation of the Latin, not a
# reference-engine translation, so marked draft rather than verified
# per vu-prefer-text-over-missing. No responsory given in the source.
#
# Checked 2026-09-05 for a missing Nocturn 3 Gospel pairing. SanctiM/
# 01-15t.txt only defines Lectio1-8 itself (1-4 = CommuneM/C5:"in 2
# loco", 5-8 = the proper vita above); Lectio9-12 are left to the same
# ex-C5b Common chain named in the file's own [Rank] line ("ex C5b"),
# following the same "in 2 loco" variant used for Lectio1-4:
# CommuneM/C5b's "Lectio9 in 2 loco" -> Commune/C4:"Lectio7-9 in 4
# loco". That text (Matt 19:27-29, "Et réliqua" -- a bare incipit, no
# full pericope given, same pattern as st-raphael-archangel's Nocturn
# 3) is followed by Bede's homily "In Natali S. Benedicti" (written for
# St. Benedict's own feast, reused generically here as St. Maurus's
# Common-of-a-Confessor-Abbot Nocturn 3). Per the bare-incipit
# convention, only the homily is authored below (isGospel: false, no
# citation field); Lectio7(homily part)-8-9 in 4 loco of Commune/C4.txt
# (Latin) and English/Commune/C4.txt combined into one continuous
# excerpt, no genuine source break.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Maurus nobilis Romanus, puer a patre Eutychio Deo sub sancti Benedicti disciplína oblatus, brevi tantum divina grátia profecit, ut ipsi magistro admiratióni esset; qui illum sæpe, véluti regularis observantiæ et virtútum ómnium specimen, ceteris discípulis ad imitándum proponebat.

        Cujus adhuc adolescentis illud admirábilis obediéntiæ exemplum a sancto Gregório Papa commemorátur. Nam, cum Placidus mónachus in lacum prolapsus, aquárum ímpetu raperétur, sancti Patris jussu accurrens Maurus, et super aquas incédens, socium capíllis apprehénsum, ad terram attraxit.

        Continentiæ tantá fuit, ut per Quadragesimam bis tantum in hebdomada, et quidem parcissime cibum sumeret. Somnum stando, vel cum nimia eum lassitudo compulísset, sedendo, super aggéstum calcis et fabuli strato cilício capiébat.

        Missus in Gálliam ab eodem sancto Benedicto, célebri monasterio exstructo, cui annos quadragínta præfuit, monasticam disciplínam mirifice propagávit. Denique sanctitáte et miraculis clarus, septuagenario major migrávit in cælum, anno salútis quingentésimo sexagésimo quinto.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Bede, Homily 'In Natali S. Benedicti' (Common of a Confessor-Abbot)
      text: |-
        Duo sunt órdines electórum in judício futúri: unus judicántium cum Dómino, de quibus hoc loco mémorat, qui reliquérunt ómnia, et secúti sunt illum: alius judicandórum a Dómino, qui non quidem ómnia sua páriter reliquérunt, sed de his tamen quæ habébant, quotidiánas dare eleemósynas Christi paupéribus curábant: unde et auditúri sunt in judício: Veníte, benedícti Patris mei, possidíte præparátum vobis regnum a constitutióne mundi. Esurívi enim, et dedístis mihi manducáre: sitívi, et dedístis mihi bíbere.

        Sed et reprobórum duos ibi futúros órdines Dómino narránte comperímus: unum eórum, qui fídei christiánæ mystériis initiáti, ópera fídei exercére contémnunt, quibus in judício testátur: Discédite a me maledícti in ignem aetérnum, qui præparátus est diábolo, et ángelis ejus: esurívi enim, et non dedístis mihi manducáre. Alterum eórum, qui fidem et mystéria Christi vel numquam suscepére, vel suscéptam per apostasíam deseruére: de quibus dicit: Qui autem non credit, jam judicatus est: quia non credit in nómine unigéniti Fílii Dei.

        Verum his cum timóre et pavóre débito paulísper commemorátis, ad lætíssima pótius Dómini et Salvatóris nostri promíssa convertámus audítum. Videámus quæ tantæ grátia pietátis: non ætérnae tantúmmodo vitæ præmia suis sequácibus, sed et præséntis múnera pollicétur exímia. Et omnis, inquit, qui relíquerit domum, vel fratres, aut soróres, aut patrem, aut matrem, aut uxórem, aut fílios, aut agros, propter nomen meum, céntuplum accípiet, et vitam ætérnam possidébit. Qui enim terrénis afféctibus sive possessiónibus pro Christi discipulátu renuntiáverit, quo plus in ejus amórem profécerit, eo plures invéniet, qui se intérno suscípere afféctu, et suis gáudeant sustentáre substántiis.
      status: verified
