# web/www/horas/Latin/SanctiM/10-03b.txt's [Hymnus Laudes] ("Imménsa Christi cáritas"). The source's bracketed gender/number markers are resolved ("Apostoló[rum]" -> "Apostolórum", "Terési[a] ad Christ[um]" -> "Terésia ad Christum") and three plain typos corrected ("corána Víginem" -> "coróna Vírginem", "saécula" -> "sǽcula"). The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
lauds-hymn:
  text: |
    Imménsa Christi cáritas
    Majóra cogit ággredi
    Apostolórum et Mártyrum
    Auctam coróna Vírginem.

    Optans amóris víctima
    Ex igne adúri mýstico,
    Sponsum precátur últimas
    Flammas vorántes éxcitet.

    Æternitátis núntia
    Optáta mors jam pérvenit:
    Hæc íngemens: Te díligo!
    Terésia ad Christum émigrat.

    Cæléstibus nunc gáudiis
    Fruens, ab arce síderum,
    Quas lárgiter promíseras,
    Rosas meménto spárgere.

    Tu corde Rex mitíssime,
    Qui párvulis regnum paras,
    Nos hanc secútos ingredi
    Præsta beáta límina.

    Laus, honor, virtus, glória
    Deo Patri et Filio,
    Sancto simul Paráclito
    In sempitérna sǽcula.
    Amen.
  status: verified

