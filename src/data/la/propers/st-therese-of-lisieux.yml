# Second Vespers hymn (also the default): web/www/horas/Latin/SanctiM/10-03b.txt's [Hymnus Vespera 3] ("Luce divína rutilántis aulæ"). First Vespers' is vespers-hymn-st-therese-of-lisieux-first.yml. The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
vespers-hymn:
  text: |
    Luce divína rutilántis aulæ
    Sédibus, virgo, frúeris, secúndans
    Vota, promísso réfoves precántes
    Imbre rosárum.

    Sint rosæ nobis fídei supérnæ
    Lumen affúlgens, columénque rebus
    Spes in advérsis, et amóris almi
    Vívida virtus.

    Sint rosæ nobis tuus ille fidens
    Candor infántis Dómino, patérno
    Grata qui præbet vel acérba nostræ
    Númine vitæ.

    Præstet hoc nobis Déitas beáta
    Patris, ac Nati paritérque Sancti
    Spíritus, cujus réboat in omni
    Glória mundo.
    Amen.
  status: verified

# First Vespers hymn: web/www/horas/Latin/SanctiM/10-03b.txt's [Hymnus Vespera] ("Nomen decúsque cóncinant"; its `Terési[a]` is the source's gender-variable marker, resolved to "Terésia"). The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
vespers-hymn/~-first:
  text: |
    Nomen decúsque cóncinant
    Terésiæ almæ vírginis
    Qui sancta divi párvuli
    Credunt amántque múnera.

    Carméli summos vértices
    Patróna Mater déligit:
    Terésia illuc ádvolat,
    Sponsi premens vestígia.

    Affláta Jesu númine,
    Secréta pandit grátiæ;
    Magístra mundo símplices
    Infántium docet vias.

    Virtútis ipsa flósculos
    Olent sacráta límina,
    Quæ casta vir ut ángelus
    immíssus e cælo, colit.

    At júbilum non éxprimit
    Omnes amóris ímpetus;
    Nec septa magnos cláudere
    Ejus valent anhélitus.

    Jesu, tibi sit glória,
    Qui te revélas párvulis,
    Cum Patre et almo Spíritu,
    In sempitérna sǽcula.
    Amen.
  status: verified

