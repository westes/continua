# Read directly from web/www/horas/Latin/Sancti/10-03.txt's own
# [Oratio] and its English counterpart. Doxology "$Qui vivis" spelled
# out per the convention in st-bibiana-collect.yml.
collect:
  text: |
    Orémus.
    Dómine, qui dixísti: Nisi efficiámini sicut párvuli, non intrábitis in
    regnum cælórum: da nobis, quǽsumus: ita sanctæ Terésiæ Vírginis in
    humilitáte et simplicitáte cordis vestígia sectári, ut prǽmia
    consequámur ætérna.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  status: verified

# Her own [Ant 2] and [Versum 2] (web/www/horas/Latin/SanctiM/10-03b.txt),
# the tags used for a mere commemoration, followed by her own collect
# (st-therese-of-lisieux-collect.yml, unchanged). Updated 2026-10-07: this
# previously reused common-of-a-virgin's antiphon/versicle because only
