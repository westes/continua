# Passiontide's own Matins hymn ("Pange, lingua, gloriósi prœ́lium
# certáminis" — the Passiontide recension of Venantius Fortunatus' hymn,
# distinct from Lent's own "Ex more docti mýstico" used up to this point).
# Live-verified against both Passion Sunday itself (2026-03-22) and a
# plain Passiontide feria (2026-03-24, a Tuesday) — byte-identical, so
# this season doesn't vary its Matins hymn by weekday. This particular
# breviary recension is 5 stanzas, ending after the Incarnation/manger
# stanza — it does not continue into the "Lustra sex qui iam peracta..."
# stanzas some other uses of this hymn carry. Self-contained with its own
# closing doxology stanza baked in (a fixed, unique ending, "Glória, et
# honor Deo..." — not the shared weekday doxology).
matins-hymn:
  text: |-
    Pange, lingua, gloriósi
    Prœlium certáminis,
    Et super Crucis trophǽo
    Dic triúmphum nóbilem,
    Quáliter Redémptor orbis
    Immolátus vícerit.

    De paréntis protoplásti
    Fraude Factor cóndolens,
    Quando pomi noxiális
    Morsu in mortem córruit,
    Ipse lignum tunc notávit,
    Damna ligni ut sólveret.

    Hoc opus nostræ salútis
    Ordo depopóscerat,
    Multifórmis proditóris
    Ars ut artem fálleret,
    Et medélam ferret inde,
    Hostis unde lǽserat.

    Quando venit ergo sacri
    Plenitúdo témporis,
    Missus est ab arce Patris
    Natus, orbis Cónditor,
    Atque ventre virgináli
    Carne amíctus pródiit.

    Vagit infans inter arcta
    Cónditus præsépia:
    Membra pannis involúta
    Virgo Mater álligat:
    Et manus, pedésque, et crura
    Stricta cingit fáscia.

    Glória, et honor Deo
    Usqueqáque Altíssimo,
    Una Patri, Filióque;
    Inclyto Paráclito:
    Cui laus est et potéstas,
    Per ætérna sǽcula. Amen.
  status: verified

# Sourced from Divinum Officium's Monastic block ("[Quad5 Laudes_]",
# Psalterium/Special/Major Special.txt). Not live-query-verified (see
# TODO.md) — read directly from source.
lauds-capitulum:
  text: Veníte, mittámus lignum in panem ejus, et eradámus eum de terra vivéntium, et nomen ejus non memorétur ámplius.
  citation: Jer 11:19
  status: draft

# Sourced from Divinum Officium's Monastic block ("[HymnusM Quad5
# Laudes]", Psalterium/Special/Major Special.txt) — "Lustris sex qui jam
# peráctis", full separate Monastic text (not a substitution against the
# Roman "Lustra sex qui jam perégit" — the two differ throughout, not
# just in wording). Not live-query-verified (see TODO.md).
lauds-hymn:
  text: |
    Lustris sex qui jam peráctis,
    Tempus implens córporis,
    Se volénte natus ad hoc,
    Passióni déditus,
    Agnus in Crucis levátur
    Immolándus stípite.

    Hic acétum, fel, arúndo,
    Sputa, clavi, láncea:
    Mite corpus perforátur,
    Sanguis, unda prófluit:
    Terra, pontus, astra, mundus,
    Quo lavántur flúmine!

    Crux fidélis, inter omnes
    Arbor una nóbilis:
    Nulla silva talem profert
    Fronde, flore, gérmine:
    Dulce lignum, dulces clavos,
    Dulce pondus sústinet.

    Flecte ramos, arbor alta,
    Tensa laxa víscera,
    Et rigor lentéscat ille,
    Quem dedit natívitas:
    Ut supérni membra Regis
    Miti tendas stípite.

    Sola digna tu fuísti
    Ferre sæcli prétium,
    Atque portum præparáre
    Nauta mundo náufrago,
    Quem sacer cruor perúnxit,
    Fusus Agni córpore.

    * Glória et honor Deo
    Usquequáque altíssimo:
    Una Patri, Filióque,
    Inclyto Paráclito:
    Cui laus est et potéstas
    Per ætérna sǽcula.
    Amen.
  status: draft

# Sourced from Divinum Officium's Monastic block ("[Responsory Quad5
# Laudes_]", the non-Cistercian branch "[Responsory Quad5 Laudes]"
# resolves to — Psalterium/Special/Major Special.txt). Real Passiontide
# practice omits the Gloria Patri here too — matches the source exactly
# (see vespers-responsory-passiontide.yml). Not live-query-verified (see
# TODO.md).
lauds-responsory:
  text: |
    R.br. Érue a frámea * Deus ánimam meam.
    R. Érue a frámea * Deus ánimam meam.
    V. Et de manu canis únicam meam.
    R. Deus ánimam meam.
    R. Érue a frámea * Deus ánimam meam.
  status: draft

# Sourced from Divinum Officium's Monastic block ("[Quad5 Versum 2_]",
