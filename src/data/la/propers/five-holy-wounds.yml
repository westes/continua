      - psalms:
          - 97
        antiphon: In amaritúdine sermo meus est, et manus plagæ meæ aggraváta est super gémitum meum.
    versicle:
      v: Ipse vulnerátus est propter iniquitátes nostras.
      r: Attrítus est propter scélera nostra.

