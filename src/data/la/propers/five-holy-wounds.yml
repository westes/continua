# Collect of The Five Holy Wounds of Our Lord Jesus Christ. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad3-5-QuinqueVulneraDNJC.txt (Duplex majus, Friday of the third week of Lent). English is this project's own translation, marked draft.
collect:
  text: |
    Orémus.
    Deus, qui unigéniti Fílii tui passióne et, per quinque Vúlnera ejus, sánguinis effusióne, humánam natúram peccáto pérditam reparásti: tríbue nobis, quǽsumus; ut, qui ab eo suscépta Vúlnera venerámur in terris, ejúsdem pretiosíssimi sánguinis fructum cónsequi mereámur in cœlis.
    Per eúmdem Dóminum nostrum Jesum Christum Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Pange, lingua, in its Passiontide recension: the source's [Hymnus Vespera]/[Hymnus Matutinum] both point at Psalterium/Special/Matutinum Special [Hymnus Quad5] (Monastic: [HymnusM Quad5]); text and English copied from matins-hymn-passiontide.yml. English is this project's own translation, marked draft.
matins-hymn:
  text: |
    Pange, lingua, gloriósi
    Prœlium certáminis,
    Et super Crucis trophǽo
    Dic triúmphum nóbilem,
    Quáliter Redémptor orbis
    Immolátus vícerit.

    De paréntis protoplásti
    Fraude Factor cóndolens,
    Quando pomi noxiális
    Morsu in mortem córruit,
    Ipse lignum tunc notávit,
    Damna ligni ut sólveret.

    Hoc opus nostræ salútis
    Ordo depopóscerat,
    Multifórmis proditóris
    Ars ut artem fálleret,
    Et medélam ferret inde,
    Hostis unde lǽserat.

    Quando venit ergo sacri
    Plenitúdo témporis,
    Missus est ab arce Patris
    Natus, orbis Cónditor,
    Atque ventre virgináli
    Carne amíctus pródiit.

    Vagit infans inter arcta
    Cónditus præsépia:
    Membra pannis involúta
    Virgo Mater álligat:
    Et manus, pedésque, et crura
    Stricta cingit fáscia.

    Glória, et honor Deo
    Usqueqáque Altíssimo,
    Una Patri, Filióque;
    Inclyto Paráclito:
    Cui laus est et potéstas,
    Per ætérna sǽcula. Amen.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad3-5-QuinqueVulneraDNJC.txt (Duplex majus, Friday of the third week of Lent). English is this project's own translation, marked draft.
