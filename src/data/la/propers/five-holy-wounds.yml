# Matins Nocturn 2 and 3 readings for the Five Holy Wounds (Friday of Lent 3).
# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad3-5-QuinqueVulneraDNJC.txt.
# Nocturn 2: Lectio4-6, two passages of St. Bernard on the Passion (the source names
# them "Lib. de Pass. Dom., cap. 41" and "Serm. de Passione Domini"), combined into
# one reading, its closing responsory the source's Responsory6. Nocturn 3: the
# Gospel (John 19:28-35, the source's Mass Gospel via Commune/Votiva/V6) and then
# St. Cyril of Alexandria's homily on it (Lectio7 after the incipit, and Lectio8),
# its closing responsory the source's Responsory8. Nocturn 1 (Lectio1-3) is not
# carried: continua's first nocturn runs the Scripture course.
#
# The English is this project's own translation, marked draft.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Bernard of Clairvaux, On the Passion of the Lord
      text: |
        Captus ergo Jesus post plúrimas illusiones tam Judæórum quam Géntium, post sánguinis plures effusiones, clavis immitibus mánibus simul et pédibus perforatur, et confígitur ligno crucis Salvátor noster mitissimus Jesus. Intuere, et réspice rosam passiónis sanguineæ, quómodo rubet in indícium ardentissimæ caritátis. Contendunt pássio et cáritas: illa, ut plus ardeat; ista, ut plus rúbeat.

        Vide quómodo hoc flore rosæ florúerit optima vitis nostra, rubicúndus Jesus. Vide totum corpus, sicubi rosæ sanguineæ florem non invénias. Inspice manum unam et álteram, si florem rosæ non invénias in utráque. Inspice pedem unum et álterum: numquid non rosei? Inspice láteris apertúram, quia nec illa caret rosa, quamvis ipsa subrúbea sit, propter mixtúram aquæ, quia, sicut narrat Evangelísta, cum unus mílitum láncea latus ejus perforasset, exívit sanguis et aqua.

        Réspice Dómine sancte Pater de sanctuário tuo, et de excélso cœlorum habitáculo, et intuere hanc sacrosanctam hóstiam, quam tibi offert magnus póntifex noster, sanctus puer tuus Dóminus Jesus, pro peccátis fratrum suórum; et esto placabilis super multitúdine malítiæ nostræ. Cognósce Pater túnicam fílii tui Joseph. Heu! fera péssima devorávit eum, et conculcávit in furóre suo vestiméntum ejus: ecce quinque scissúras lamentabiles in eo relíquit.
      responsory: |
        R. Videmus Jesum propter passiónem mortis glória et honóre coronátum, * Ut pro ómnibus gustaret mortem.
        V. Decebat eum, qui multos fílios in glóriam addúxerat, auctórem salútis eórum per passiónem consummari.
        R. Ut pro ómnibus gustaret mortem.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joann 19:28-35
      text: 'In illo témpore: Sciens Jesus, quia ómnia consummáta sunt, ut consummarétur Scriptúra, dixit: Sítio. Vas ergo erat pósitum acéto plenum. Illi autem spóngiam plenam acéto, hyssópo circumponéntes, obtulérunt ori ejus. Cum ergo accepísset Jesus acétum, dixit: Consummátum est. Et inclináto cápite trádidit spíritum. Judǽi ergo (quóniam Parascéve erat), ut non remanérent in cruce córpora sábbato (erat enim magnus dies ille sábbati), rogavérunt Pilátum, ut frangeréntur eórum crura et tolleréntur. Venérunt ergo mílites: et primi quidem fregérunt crura et altérius, qui crucifíxus est cum eo. Ad Jesum autem cum veníssent, ut vidérunt eum jam mórtuum, non fregérunt ejus crura, sed unus mílitum láncea latus ejus apéruit, et contínuo exívit sanguis et aqua. Et qui vidit, testimónium perhíbuit: et verum est testimónium ejus.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Cyril of Alexandria, Commentary on John, Bk. 12
      text: |
        Cum ab immanibus Judǽis omnis in Christum expleta esset impietas, nec quidquam jam ad summam crudelitátem relíquum esset, ad extrémum caro Christi sanctíssima próprium quiddam ac naturale rursus pátitur. Multis enim ac váriis dolóribus exsiccata, siti torquétur. Graves síquidem dolóres magnam ad sitim commovendam vim habent, naturáli quodam et inexplicábili calóre húmidum consumentes, et igneis ardoribus præcórdia urentes.

        Consummátum esse ait impietatis Judaicæ modum, et impotentem sæviendi ánimum. Quid enim Judǽi intentatum reliquerunt, aut quid non extremæ crudelitátis adhibuerunt? Quod supplicii aut contumeliæ genus prætermiserunt? Quamóbrem jure, Consummátum est, ait: sed hora jam eum ad prædicándum spirítibus, qui apud ínferos erant, invitante (advenit enim ut mortuórum ac vivórum dominaretur), ipsam pro nobis mortem suscépit, commúnem hanc natúræ nostræ passiónem sustínuit in carne sua.
      responsory: |
        R. Dignus es Dómine accípere librum, et aperíre signácula ejus, quóniam occísus es, et redemísti nos Deo * In sánguine tuo.
        V. Fecísti enim nos Deo nostro regnum, et sacerdótes.
        R. In sánguine tuo.
      status: verified
