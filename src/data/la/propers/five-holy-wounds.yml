      - psalms:
          - 10
        antiphon: Quis est * qui venit de Edom, tinctis véstibus de Bosra?
      - psalms:
          - 14
        antiphon: Quare ergo * rubrum est induméntum tuum, et vestiménta tua sicut calcántium in torculári?
      - psalms:
          - 23
        antiphon: Tórcular * calcávi solus, et de géntibus non est vir mecum
    versicle:
      v: Fodérunt manus meas et pedes meos.
      r: Dinumeravérunt omnia ossa mea.
  nocturn2:
    groups:
      - psalms:
          - 21
        antiphon: Fodérunt * manus meas et pedes meos; dinumeravérunt ómnia ossa mea.
      - psalms:
          - 65
        antiphon: A planta pedis * usque ad vérticem non est in eo sánitas.
      - psalms:
          - 75
        antiphon: Vulnus, * et livor, et plaga tumens non est circumligáta, nec curáta medicámine, neque fota óleo.
    versicle:
      v: Vere languóres nostros ipse tulit.
      r: Et dolóres nostros ipse portávit.
  nocturn3:
    groups:
      - psalms:
          - 95
        antiphon: Quid sunt plagæ istæ in médio mánuum tuárum?
      - psalms:
