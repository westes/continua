# Matins Nocturn 2 reading for St. Simplicius, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/03-02-Simplicius.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Simplicius, Tiburtinus, patre Castorio, proxime post sanctum Hilarum Románæ Ecclésiæ principatum suscépit, ac difficíllimis tempóribus (cum magna ex parte christiáni orbis cathólica fides, ob cunctos fere príncipes hærési infectos, nutaret) summa vigilántia gubernávit. Leoni imperatóri petenti, ut rata haberéntur concéssa ab epíscopis synodi Chalcedonensis ecclésiæ Constantinopolitánæ privilégia, veheméntius réstitit, misso étiam eam ob causam Constantinópolim suo legáto. Eádem pastorale sollicitúdine plúrimum laborávit, ut Timótheus Ælurus Alexandrinæ ecclésiæ invasor, qui Constantinópoli líbere degens, adnitebatur quam máxime propagare hærésim, novumque Zenonis imperatóris ópera cogi concílium, pelleretur in exsílium, sicque integritáti suæ Alexandrína redderetur ecclésia. Reliquorum item perduellium pro nova synodo indicenda conatibus fórtiter óbstitit, asserens nova concilia non fácile convocanda, nisi cum áliquid in pravis sénsibus novum, aut in assertione dogmatum emersisset ambiguum.

        Damnávit íterum Petrum Moggum, alterum Alexandrinæ sedis invasorem, curavitque, ut ex urbe pelleretur, ne aliquos modicæ fídei inficeret, et ad perversitatis suæ factionem pertraheret. Timótheo Solofaciolo, legitimo ejúsdem ecclésiæ antistiti, juxta prístinum institútum, per suos legátos erróris sui condonationem expetenti, idcírco quod timóre perterritus Dioscorum ad altáre nominasset, véniam impertiit. Antiocheni epíscopi electionem ad seditiones vitandas Constantinópoli in concílii Nicæni præjudicium peractam, ea lege ratam hábuit, ut deínceps, secúndum patrum definitiones, Orientali comprovincialium episcopórum synodo, creatio Antiocheni pontíficis reservaretur. Oblatiónes ecclésiæ ita partiendas esse præcépit, ut una dumtáxat pórtio epíscopo, una itidem clero, duæ vero in ecclésiæ fabricam et peregrinos ac páuperes erogarentur. Zenonem epíscopum Hispalénsem vicária Sedis apostólicæ auctoritáte fulcivit, ne apostólicæ institutiónis decréta et sanctórum términos patrum in Hispániis transcendi permitteret.

        Státuit in Urbe hebdomadas, ut, propter baptísmum, et pœniténtiam peténtes, presbyteri quidem de regióne prima apud sanctum Paulum, de tértia apud sanctum Lauréntium, et de séptima apud sanctum Petrum manerent. Dedicávit basílicas sancti Stéphani in Cœlio monte, sancti Andréæ Apóstoli juxta sanctam Maríam, item áliam sancti Stéphani juxta sanctum Lauréntium, ac postrémo sanctæ Bibianæ Mártyris aliam intra Urbem juxta palátium Licinianum; itémque vasa complúra tum argentea, tum áurea Románæ cóntulit Ecclésiæ. Demum Zenone imperatóre, et Odoære Itáliæ rege, migrávit ad Dóminum. Hábuit ordinatiónes tres mense Decémbri, quibus creávit presbyteros quinquagínta octo, diáconos quíndecim, epíscopos per divérsa loca trigínta sex. Sacerdótium administrávit annos quíndecim, menses quinque, et dies decem.
      status: verified
