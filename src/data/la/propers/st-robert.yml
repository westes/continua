# Verified against Divinum Officium (Monastic Tridentinum 1617) — read
# directly from the reference engine's own real-date output (2043-04-29).
# Same convention as data/propers/temporal/*-collect.yml. One correction
# to the source's own English translation: it left his name in the Latin
# genitive ("blessed Robérti") rather than translating it — fixed to
# "Robert" here as an evident transcription artifact, not a deliberate
# stylistic choice (unlike the archaic English kept verbatim elsewhere in
# this project).
collect:
  text: |
    Orémus.
    Intercéssio nos, quǽsumus, Dómine, beáti Robérti Abbátis comméndet: ut, quod nostris méritis non valémus, ejus patrocínio assequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (st-robert-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-an-abbot (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-robert-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Euge, serve bone et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, intra in gáudium Dómini tui, allelúia.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Intercéssio nos, quǽsumus, Dómine, beáti Robérti Abbátis comméndet: ut, quod nostris méritis non valémus, ejus patrocínio assequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

