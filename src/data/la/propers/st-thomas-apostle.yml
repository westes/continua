# Matins Nocturn 2-3 readings for St. Thomas, Apostle (Dec 21) —
# SanctiM/12-21.txt inherits the whole day (`@Sancti/12-21`) with no
# Nocturn 2/3 override, so this feast's own proper content is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/12-21.txt, English/Sancti/12-21.txt.
#
# Nocturn 2: only Lectio4 is proper (a single, self-contained vita
# lesson); Lectio5-6 are a bare `@Commune/C1:Lectio4/5` rubric with no
# proper content, so Nocturn 2 has just this one reading.
# Nocturn 3: Lectio7's Gospel citation (John 20:24-29) was a bare
# incipit ("Et réliqua") with no full pericope text given; the full
# pericope is now authored too (isGospel: true, immediately before the
# homily) — sourced from this same day's own Missale [Evangelium]
# (`web/www/missa/Latin/Sancti/12-21.txt`, English/Sancti/12-21.txt),
# not guessed at (2026-09-05 update). The homily portion remains Pope
# St. Gregory the Great's homily on Doubting Thomas (Lectio7's homily +
# Lectio8-9 combined, one continuous piece).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Thomas Apóstolus, qui et Dídymus, Galilǽus, post accéptum Spíritum Sanctum in multas províncias proféctus est ad prædicándum Christi Evangélium: Parthis, Medis, Persis, Hyrcánis et Bactris christiánæ fídei et vitæ præcépta trádidit. Postrémo ad Indos se cónferens, eos in christiána religióne erudívit. Qui ad extrémum, vitæ doctrinǽque sanctitáte et miraculórum magnitúdine, cum céteris ómnibus sui admiratiónem et Jesu Christi amórem commovísset; illíus gentis regem, idolórum cultórem, magis ad iram accéndit: cujus senténtia condemnátus, telísque confóssus, Calamínæ apostolátus honórem martýrii coróna decorávit.'
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joann 20:24-29
      text: 'In illo témpore: Thomas, unus ex duódecim, qui dícitur Dídymus, non erat cum eis, quando venit Jesus. Dixérunt ergo ei alii discípuli: Vídimus Dóminum. Ille autem dixit eis: Nisi vídero in mánibus ejus fixúram clavórum, et mittam dígitum meum in locum clavórum, et mittam manum meam in latus ejus, non credam. Et post dies octo, íterum erant discípuli ejus intus, et Thomas cum eis. Venit Jesus jánuis clausis, et stetit in médio, et dixit: Pax vobis. Deinde dicit Thomæ: Inter dígitum tuum huc, et vide manus meas, et affer manum tuam, et mitte in latus meum: et noli esse incrédulus, sed fidélis. Respóndit Thomas et dixit ei: Dóminus meus et Deus meus. Dixit ei Jesus: Quia vidísti me, Thoma, credidísti: beáti, qui non vidérunt, et credidérunt.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 26 on the Gospels (on John 20:24-29)
      text: |-
        Quid, fratres caríssimi, quid inter hæc animadvértitis? Numquid casu gestum créditis, ut eléctus ille discípulus tunc deésset, post autem véniens audíret, áudiens dubitáret, dúbitans palpáret, palpans créderet? Non hoc casu, sed divína dispensatióne gestum est. Egit namque miro modo supérna cleméntia, ut discípulus ille dúbitans, dum in magístro suo vúlnera palpáret carnis, in nobis vúlnera sanáret infidelitátis. Plus enim nobis Thomæ infidélitas ad fidem, quam fides credéntium discipulórum prófuit; quia dum ille ad fidem palpándo redúcitur, nostra mens, omni dubitatióne postpósita, in fide solidátur.

        Sic quippe discípulum Dóminus post resurrectiónem suam dubitáre permísit, nec tamen in dubitatióne deséruit; sicut ante nativitátem suam habére Maríam sponsum vóluit, qui tamen ad ejus núptias non pervénit. Nam ita factus est discípulus dúbitans et palpans, testis veræ resurrectiónis, sicut sponsus matris fúerat custos integérrimæ virginitátis. Palpávit autem, et exclamávit: Dóminus meus, et Deus meus. Dicit ei Jesus: Quia vidísti me, credidísti. Cum Paulus Apóstolus dicat, Est autem fides sperandárum substántia rerum, arguméntum non apparéntium; profécto liquet quia fides illárum rerum arguméntum est, quæ apparére non possunt. Quæ étenim appárent, jam fidem non habent, sed agnitiónem.

        Dum ergo vidit Thomas, dum palpávit, cur ei dícitur: Quia vidísti me, credidísti? Sed áliud vidit, áliud crédidit. A mortáli quippe hómine divínitas vidéri non pótuit. Hóminem ergo vidit, et Deum conféssus est, dicens: Dóminus meus, et Deus meus. Vidéndo ergo crédidit, qui considerándo verum hóminem, hunc Deum, quem vidére non póterat, exclamávit. Lætíficat valde quod séquitur: Beáti qui non vidérunt, et credidérunt. In qua nimírum senténtia nos speciáliter signáti sumus, qui eum, quem carne non vídimus, mente retinémus. Nos signáti sumus; sed si fidem nostram opéribus séquimur. Ille étenim vere credit, qui exércet operándo quod credit.
      status: verified
