# Matins Nocturn 2 reading for St. Symphorosa and her Seven Sons,
# Martyrs (Jul 18). No genuine SanctiM match: the correct Tridentine
# file is the suffixed `Sancti/07-18o.txt` (the plain `Sancti/07-18.txt`
# is St. Camillus de Lellis instead), and the only SanctiM file for
# this date, `SanctiM/07-18M.txt`, is the final (octave) day of the
# Octave of St. Benedict (Jul 11-18) — neither matches; a missed
# pre-1955-pool candidate rather than a genuine SanctiM case (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-18o.txt, English/Sancti/07-18o.txt.
# The file's `Lectio93` is itself the full continuous account (the
# same story as `Lectio2`/`Lectio3` under a different rubric),
# authored as one reading, no genuine internal break — Symphorosa's
# own martyrdom followed immediately by her seven sons'. No responsory
# given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Symphorosa Tiburtina, Getulii Mártyris uxor, ex eo septem fílios péperit, Crescéntium, Julianum, Nemesium, Primitivum, Justinum, Stacteum, et Eugenium; qui omnes propter christianæ fidei professiónem una cum matre, Hadriáno imperatóre, comprehénsi sunt. Quorum pietas, multis variisque tentáta suppliciis, cum stábilis permanéret, mater, quæ fíliis fidei magistra fúerat, dux eisdem ad martyrium éxstitit. Nam, saxo ad collum alligato, in profluentem dejícitur: cujus corpus, conquisítum a fratre ejus Eugenio, sepelítur. Postridie ejus diéi, qui fuit décimo quinto Kalendas Augusti, septem fratres singuli ad palum alligati, varie sunt interfécti: Crescentio guttur ferro transfígitur; Juliáno pectus confóditur; Nemesio cor transverberátur; Primitivo trajícitur umbilicus; Justinus membratim secátur; Stacteus telis confígitur; Eugenius a péctore in duas partes dividitur. Ita octo hostiæ Deo gratíssimæ sunt immolátæ. Corpora in altíssimam fóveam projecta sunt via Tiburtina, nono ab Urbe lápide; quæ, póstea Romam translata, cóndita sunt in ecclésia sancti Angeli in piscina.'
      status: verified
