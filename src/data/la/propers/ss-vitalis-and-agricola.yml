# Read from the reference engine: web/www/horas/Latin/Sancti/11-04cc.txt [Oratio];
# English from English/Sancti/11-04cc.txt.
collect:
  text: |
    Orémus.
    v. Præsta, quǽsumus, omnípotens Deus: ut, qui sanctórum Mártyrum tuórum Vitális et Agrícolæ solémnia cólimus, eórum apud te intercessiónibus adjuvémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# No proper antiphon of their own -- standard de-Communi text and versicle for
# common-of-several-martyrs (same as Ss. Processus and Martinian); collect is their own.
commemoration:
  text: |
    Ant. Vestri capílli cápitis * omnes numeráti sunt: nolíte timére: multis passéribus melióres estis vos.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    v. Præsta, quǽsumus, omnípotens Deus: ut, qui sanctórum Mártyrum tuórum Vitális et Agrícolæ solémnia cólimus, eórum apud te intercessiónibus adjuvémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading, sourced directly from web/www/horas/Latin/Sancti/11-04cc.txt
# (Lectio93, one continuous account).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Vitalis et Agricola ejus dominus, in persecutióne Diocletiáni et Maximiáni, Bononiæ ob Jesu Christi prædicatiónem comprehénsi sunt. Cumque Vitalis, quo magis precibus et minis tentarétur ut senténtiam mutaret, eo magis se Christi cultórem ac servum profiterétur; vario tormentórum genere cruciatus, constanter ómnia pérferens, in oratióne spíritum Deo réddidit. Agricola vero, cum ejus supplícium dilátum esset, si forte, tormentis servi permotus, Christo vellet renuntiáre, ejus exemplo magis confirmátus est. Itaque, cruci affixus, Vitali servo consors et sócius fuit nobilis martyrii. Eórum corpora, ad Judæórum sepúlcra cum essent humata, a sancto Ambrosio invénta, in sacrum celebremque locum transláta sunt.'
      status: verified
