# Verified against Divinum Officium (Monastic Tridentinum 1617) -- read
# directly from the reference engine's own real-date output, 2026-05-14
# (Ascension Day itself). A real, pre-existing content gap:
# `getDayCollect` already looked up `${winner.id}-collect` for Ascension
# unconditionally (it's the day's own kind:'temporal' winner regardless
# of the hymnody-mechanism fix elsewhere), but this file never existed.
collect:
  text: |
    Orémus.
    Concéde, quǽsumus, omnípotens Deus: ut, qui hodiérna die Unigénitum tuum, Redemptórem nostrum, ad cælos ascendísse crédimus; ipsi quoque mente in cæléstibus habitémus.
    Per eúmdem Dóminum nostrum Jesum Christum Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Verified against the reference engine (Monastic Tridentinum 1617,
# ../divinum-officium-reference) -- read directly from Ascension Day's own
# Tempora/Pasc5-4.txt [Octava 2] section (Latin/Tempora/Pasc5-4.txt:306-317,
# English/Tempora/Pasc5-4.txt:231-238), the Lauds-slot Octava variant (same
# "middle" Octava-2 choice already made for christmas-day-octave-
# commemoration.yml). The collect is the feast's own real [Oratio], already
# authored verbatim in ascension-collect.yml -- reused here, "Per eúmdem"
# doxology included. The source's V/R has a Cistercian-rubric alternate
# ("Ascéndit Deus in jubilatióne...") noted inline; the primary
# (non-Cistercian) versicle is used here, matching this project's own
# standing preference (see christmas-day-octave-commemoration.yml's own
# header comment for the same choice).
commemoration/octave-~:
  text: |
    Ant. Ascéndo ad Patrem meum, * et Patrem vestrum: Deum meum, et Deum vestrum, allelúia.
    V. Dóminus in cælo, allelúia.
    R. Parávit sedem suam, allelúia.
    Orémus.
    Concéde, quǽsumus, omnípotens Deus: ut, qui hodiérna die Unigénitum tuum, Redemptórem nostrum, ad cælos ascendísse crédimus; ipsi quoque mente in cæléstibus habitémus.
    Per eúmdem Dóminum nostrum Jesum Christum Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Corrected 2026-09-10: this file previously contained "Jesu nostra
# redémptio" -- that IS the real Ascension hymn, but it's the Lauds/Vespers
# one (see lauds-hymn-ascension.yml/vespers-hymn-ascension.yml), not
# Matins' own. Matins' real hymn, direct from the reference source
# (Tempora/Pasc5-4.txt's own `[Hymnus Matutinum]`/`[HymnusM Matutinum]`),
# is "Ætérne Rex altíssime" -- a genuinely different text. The Monastic
# form applies four word/line-range substitutions to the secular block
# (computed by hand here, same convention used elsewhere in this store for
# regex-derived Monastic text): stanzas 1-2 rewritten wholesale, "Peccat
# caro, mundat" -> "Culpat caro, purgat" (stanza 4), "Sis ipse" -> "Tu
# esto" and "prǽmium," -> "prǽditum:" (stanza 5). Final stanza is marked
# with a leading "* " -- Divinum Officium's own marker for a hymn's
# variable doxology; see hours/resolve-common.ts's substituteDoxology and
# hours/hymn-doxology.ts. The English translation already reflects the
# Ascension-doxology ending directly (no separate unmarked default exists
# in the source's English) -- harmless here since Ascension Day and its
# whole octave always resolve to the Asc doxology anyway (`ascension` is
# in ALWAYS_OVERRIDE_TEMPORAL_IDS and `ascensiontide` maps to
# hymn-doxology-asc), so the marker's "no override" branch never actually
# fires for this file in practice.
matins-hymn:
  text: |-
    Ætérne Rex altíssime,
    Redémptor et fidélium,
    Quo mors solúta déperit,
    Datur triúmphum grátiæ.

    Scandens tribúnal déxteræ
    Patris, potéstas ómnium
    Colláta Jesu cǽlitus,
    Quæ non erat humánitus:

    Ut trina rerum máchina,
    Cæléstium, terréstrium,
    Et inferórum cóndita,
    Flectat genu jam súbdita.

    Tremunt vidéntes Angeli
    Versam vicem mortálium:
    Culpat caro, purgat caro,
    Regnat Deus Dei caro.

    Tu esto nostrum gáudium,
    Manens olýmpo prǽditum:
    Mundi regis qui fábricam,
    Mundána vincens gáudia.

    Hinc te precántes quǽsumus,
    Ignósce culpis ómnibus,
    Et corda sursum súbleva
    Ad te supérna grátia.

    Ut, cum repénte cœ́peris
    Clarére nube júdicis,
    Pœnas repéllas débitas,
    Reddas corónas pérditas.

    * Jesu, tibi sit glória,
    Qui victor in cælum redis,
    Cum Patre, et almo Spíritu,
    In sempitérna sǽcula. Amen.
  status: verified

