# Matins Nocturn content for Wednesday in the 4th week of Lent — read
# from web/www/horas/{Latin,English}/Tempora/Quad4-3.txt. Gospel incipit
# only in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad4-3.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Augustine
# homily split only to fill the fixed 3-lesson slot count). Responsory1 is
# a cross-reference (@Tempora/Quad4-0:Responsory7, the 4th Sunday of
# Lent's own) — used here per the "the first one, when several collapse"
# convention.
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Joann 9:1-38
      text: 'In illo témpore: Prætériens Jesus vidit hóminem cæcum a nativitáte: et interrogavérunt eum discípuli ejus: Rabbi, quis peccávit, hic aut paréntes ejus, ut cæcus nascerétur? Respóndit Jesus: Neque hic peccávit neque paréntes ejus: sed ut manifesténtur ópera Dei in illo. Me opórtet operári ópera ejus, qui misit me, donec dies est: venit nox, quando nemo potest operári. Quámdiu sum in mundo, lux sum mundi. Hæc cum dixísset, éxspuit in terram, et fecit lutum ex sputo, et linívit lutum super óculos ejus, et dixit ei: Vade, lava in natatória Síloë (quod interpretátur Missus). Abiit ergo, et lavit, et venit videns. Itaque vicíni, et qui víderant eum prius, quia mendícus erat, dicébant: Nonne hic est, qui sedébat et mendicábat? Alii dicébant: Quia hic est. Alii autem: Nequáquam, sed símilis est ei. Ille vero dicébat: Quia ego sum. Dicébant ergo ei: Quómodo apérti sunt tibi óculi? Respóndit: Ille homo, qui dícitur Jesus, lutum fecit, et unxit oculos meos, et dixit mihi: Vade ad natatória Síloë, et lava. Et ábii, et lavi, et vídeo. Et dixérunt ei: Ubi est ille? Ait: Néscio. Addúcunt eum ad pharisǽos, qui cæcus fúerat. Erat autem sábbatum, quando lutum fecit Jesus, et apéruit óculos ejus. Iterum ergo interrogábant eum pharisǽi, quómodo vidísset. Ille autem dixit eis: Lutum mihi posuit super oculos, et lavi, et vídeo. Dicébant ergo ex pharisǽis quidam: Non est hic homo a Deo, qui sábbatum non custódit. Alii autem dicébant: Quómodo potest homo peccátor hæc signa fácere? Et schisma erat inter eos. Dicunt ergo cæco íterum: Tu quid dicis de illo, qui apéruit óculos tuos? Ille autem dixit: Quia Prophéta est. Non credidérunt ergo Judǽi de illo, quia cæcus fuísset, et vidísset, donec vocavérunt paréntes ejus, qui víderat: et interrogavérunt eos, dicéntes: Hic est fílius vester, quem vos dícitis, quia cæcus natus est? Quómodo ergo nunc videt? Respondérunt eis paréntes ejus, et dixérunt: Scimus, quia hic est fílius noster, et quia cæcus natus est: quómodo autem nunc vídeat, nescímus: aut quis ejus apéruit óculos, nos nescímus: ipsum interrogáte, ætátem habet, ipse de se loquátur. Hæc dixérunt paréntes ejus, quóniam timébant Judǽos: jam enim conspiráverant Judǽi, ut, si quis eum confiterétur esse Christum, extra synagógam fíeret. Proptérea paréntes ejus dixérunt: Quia ætátem habet, ipsum interrogáte. Vocavérunt ergo rursum hóminem, qui fúerat cæcus, et dixérunt ei: Da glóriam Deo. Nos scimus, quia hic homo peccátor est. Dixit ergo eis ille: Si peccátor est, néscio: unum scio, quia, cæcus cum essem, modo vídeo. Dixérunt ergo illi: Quid fecit tibi? quómodo apéruit tibi óculos? Respóndit eis: Dixi vobis jam, et audístis: quid íterum vultis audíre? Numquid et vos vultis discípuli ejus fíeri? Maledixérunt ergo ei, et dixérunt: Tu discípulus illíus sis: nos autem Móysi discípuli sumus. Nos scimus, quia Móysi locútus est Deus: hunc autem nescímus, unde sit. Respóndit ille homo et dixit eis: In hoc enim mirábile est, quia vos néscitis, unde sit, et apéruit meos óculos: scimus autem, quia peccatóres Deus non audit: sed, si quis Dei cultor est et voluntátem ejus facit, hunc exáudit. A sǽculo non est audítum, quia quis apéruit óculos cæci nati. Nisi esset hic a Deo, non póterat fácere quidquam. Respondérunt et dixérunt ei: In peccátis natus es totus, et tu doces nos? Et ejecérunt eum foras. Audívit Jesus, quia ejecérunt eum foras, et cum invenísset eum, dixit ei: Tu credis in Fílium Dei? Respóndit ille et dixit: Quis est, Dómine, ut credam in eum? Et dixit ei Jesus: Et vidísti eum, et qui lóquitur tecum, ipse est. At ille ait: Credo, Dómine. (Hic genuflectitur) Et prócidens adorávit eum.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, 44th Tract on John
      text: |-
        Ea quæ fecit Dóminus noster Jesus Christus, stupénda atque miránda, et ópera, et verba sunt: ópera, quia facta sunt: verba, quia signa sunt. Si ergo quid signíficet hoc quod factum est, cogitémus: genus humánum est iste cæcus. Hæc enim cǽcitas cóntigit in primo hómine per peccátum, de quo omnes oríginem dúximus, non solum mortis, sed étiam iniquitátis. Si enim cǽcitas est infidélitas, et illuminátio fides: quem fidélem, quando venit Christus, invénit? Quandóquidem Apóstolus natus in gente prophetárum dicit: Fúimus et nos aliquándo natúra fílii iræ, sicut et céteri. Si fílii iræ, fílii vindíctæ, fílii pœnæ, fílii gehénnæ: quómodo natúra, nisi quia peccánte primo hómine vítium pro natúra inolévit? Si vítium pro natúra inolévit, secúndum mentem omnis homo cæcus natus est.

        Venit Dóminus: quid fecit? Magnum mystérium commendávit. Exspuit in terram, de salíva sua lutum fecit: quia Verbum caro factum est, et inúnxit óculos cæci. Inúnctus erat, et nondum vidébat. Misit illum ad piscínam, quæ vocátur Síloë. Pertínuit autem ad Evangelístam commendáre nobis nomen hujus piscínæ, et ait: Quod interpretátur Missus. Jam quis sit missus agnóscitis. Nisi enim ille fuísset missus, nemo nostrum esset ab iniquitáte dimíssus. Lavit ergo óculos in ea piscína, quæ interpretátur Missus; baptizátus est in Christo. Si ergo quando eum in seípso quodámmodo baptizávit, tunc illuminávit: quando inúnxit, fortásse catechúmenum fecit.

        Audístis grande mystérium. Intérroga hóminem: Christiánus es? Respóndet tibi: Non sum. Si pagánus es, aut Judǽus? Si autem díxerit, Non sum: adhuc quæris ab eo, Catechúmenus, an fidélis? Si respónderit tibi, Catechúmenus: inúnctus est, nondum lotus. Sed unde inúnctus? Quære, et respóndet. Quære ab illo, in quem credat? Eo ipso quo catechúmenus est, dicit: In Christum. Ecce modo loquor et fidélibus et catechúmenis. Quid dixi de sputo et luto? Quia Verbum caro factum est; hoc catechúmeni áudiunt: sed non eis súfficit ad quod inúncti sunt: festínent ad lavácrum, si lumen inquírunt.
      responsory: |-
        R. Spléndida facta est fácies Móysi, dum respíceret in eum Dóminus: * Vidéntes senióres claritátem vultus ejus, admirántes timuérunt valde.
        V. Cumque descendísset de monte Sínai, portábat duas tábulas testimónii, ignórans quod cornúta esset fácies ejus ex consórtio sermónis Dei.
        R. Vidéntes senióres claritátem vultus ejus, admirántes timuérunt valde.
      status: verified
