# Matins Nocturn 2-3 readings for the Chair of St. Peter at Antioch
# (Feb 22) — SanctiM/02-22.txt's own Lectio5-12 all resolve back to
# `@Sancti/02-22:LectioN` (resliced for the Monastic 12-lesson
# structure; its `[Rule]`/hymn lines separately borrow structure from
# `SanctiM/01-18`, the Roman Chair's own Monastic file, but the actual
# proper vita/homily text is this feast's own, from `Sancti/02-22.txt`)
# — sourced from the Tridentine track exactly as for a pre-1955 saint
# (see memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/02-22.txt, English/Sancti/02-22.txt.
#
# Nocturn 2: Lectio4-6 (St. Augustine's sermon on the feast) combined
# into one reading, one continuous excerpt.
# Nocturn 3: Lectio7's Gospel citation (Matt 16:13-19) is a bare
# incipit ("Et réliqua") with no full pericope text given, so only the
# homily portion was originally authored (not marked isGospel), combined
# with Lectio8-9 as one continuous excerpt of Pope St. Leo's sermon.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily) — this feast's own
# [Evangelium] redirects `@Commune/Coronatio`, sourced from
# missa/Latin/Commune/Coronatio.txt, English/Commune/Coronatio.txt, not
# guessed at.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 15 on the Saints
      text: |-
        Institútio solemnitátis hodiérnæ a senióribus nostris Cáthedræ nomen accépit, ídeo quod primus Apostolórum Petrus hódie episcopátus cáthedram suscepísse referátur. Recte ergo ecclésiæ natálem sedis illíus colunt, quam Apóstolus pro ecclesiárum salúte suscépit, dicénte Dómino: Tu es Petrus, et super hanc petram ædificábo Ecclésiam meam.

        Petrum ítaque fundaméntum Ecclésiæ Dóminus nominávit: et ídeo digne fundaméntum hoc Ecclésia colit, supra quod ecclesiástici ædifícii altitúdo consúrgit. Unde conveniénter psalmus, qui lectus est, dicit: Exáltent eum in ecclésia plebis, et in cáthedra seniórum laudent eum. Benedíctus Deus, qui beátum Petrum Apóstolum in Ecclésia exaltári præcépit: quia dignum est ut fundaméntum hoc in Ecclésia honorétur, per quod ad cælum conscénditur.

        Quod natális ergo Cáthedræ hódie cólitur, sacerdotále honorátur offícium. Sibi hoc Ecclésiæ ínvicem præstant, quia tanto necésse plus habet Ecclésia dignitatis, quanto sacerdotále offícium plus honóris. Cum solemnitátem hanc Ecclésiis mérito religiósa observátio introdúxerit, miror, cur apud quosdam infidéles hódie tam perniciósus error incréverit, ut super túmulos defunctórum cibos et vina conférant, quasi egréssæ de corpóribus ánimæ carnáles cibos requírant.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 16:13-19
      text: 'In illo témpore: Venit Jesus in partes Cæsaréæ Philíppi, et interrogábat discípulos suos, dicens: Quem dicunt hómines esse Fílium hóminis? At illi dixérunt: Alii Joánnem Baptístam, alii autem Elíam, álii vero Jeremíam, aut unum ex prophétis. Dicit illis Jesus: Vos autem quem me esse dícitis? Respóndens Simon Petrus, dixit: Tu es Christus, Fílius Dei vivi. Respóndens autem Jesus, dixit ei: Beátus es, Simon Bar Jona: quia caro et sanguis non revelávit tibi, sed Pater meus, qui in cœlis est. Et ego dico tibi, quia tu es Petrus, et super hanc petram ædificábo Ecclésiam meam, et portæ ínferi non prævalébunt advérsus eam. Et tibi dabo claves regni cœlórum. Et quodcúmque ligáveris super terram, erit ligátum et in cœlis: et quodcúmque sólveris super terram, erit solútum et in cœlis.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Leo the Great, Sermon 3, on the Anniversary of his own Election (on Matt 16:13-19)
      text: |-
        Apóstolos Dóminus, quid de se hómines opinéntur, intérrogat: et tamdiu sermo respondéntium commúnis est, quámdiu humánæ intellegéntiæ ambigúitas explicátur. At ubi quid hábeat sensus discipulórum exígitur, primus est in Dómini confessióne, qui primus est in apostólica dignitáte. Qui cum dixísset: Tu es Christus Fílius Dei vivi: respóndit ei Jesus: Beátus es Simon Bar-Jona, quia caro et sanguis non revelávit tibi, sed Pater meus, qui in cælis est. Id est, Ideo beátus es, quia Pater meus te dócuit: nec terréna opínio te feféllit, sed inspirátio cæléstis instrúxit: et non caro et sanguis, sed ille me tibi, cujus sum unigénitus Fílius, indicávit.

        Et ego, inquit, dico tibi: hoc est, sicut Pater meus tibi manifestávit divinitátem meam, ita et ego tibi notam fácio excelléntiam tuam, quia tu es Petrus: id est, cum ego sim inviolábilis petra, ego lapis anguláris, qui fácio útraque unum, ego fundaméntum præter quod nemo potest áliud pónere: tamen tu quoque petra es, quia mea virtúte solidáris, ut quæ mihi potestáte sunt própria, sint tibi mecum participatióne commúnia. Et super hanc petram ædificábo Ecclésiam meam, et portæ ínferi non prævalébunt advérsus eam. Super hanc, inquit, fortitúdinem ætérnum éxstruam templum: et Ecclésiæ meæ cælo inserénda sublímitas, in hujus fídei firmitáte consúrget.

        Hanc confessiónem portæ ínferi non tenébunt, mortis víncula non ligábunt: vox enim ista vox vitæ est. Et sicut confessóres suos in cæléstia próvehit, ita negatóres ad inférna demérgit. Propter quod dicit beatíssimo Petro: Tibi dabo claves regni cælórum: Et quæcúmque ligáveris super terram, erunt ligáta et in cælis: et quæcúmque sólveris super terram, erunt solúta et in cælis. Transívit quidem étiam in álios Apóstolos vis potestátis istíus, et ad omnes Ecclésiæ príncipes decréti hujus constitútio commeávit: sed non frustra uni commendátur, quod ómnibus intimátur. Petro enim ídeo hoc singuláriter créditur, quia cunctis Ecclésiæ rectóribus Petri forma præpónitur. Manet ergo Petri privilégium, ubicúmque ex ipsíus fertur æquitáte judícium. Nec nímia est vel sevéritas vel remíssio, ubi nihil erit ligátum, nihil solútum, nisi quod beátus Petrus aut sólverit, aut ligáverit.
      status: verified
