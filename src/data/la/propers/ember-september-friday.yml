# Matins Nocturn content for September Ember Friday (Feria VI Quattuor
# Temporum Septembris) — read directly from
# web/www/horas/Latin/Tempora/093-5.txt and English/Tempora/093-5.txt.
# No Monastic-track override exists for this day's responsories (unlike
# Wednesday/Saturday) — identical in both tracks.
#
# Update (2026-09-05): the Gospel pericope itself (Luke 7:36-50, the
# sinful woman anointing Christ's feet) is now authored too (isGospel:
# true, immediately before the homily), matching the newer convention set
# by post-pentecost-16.yml — previously left as a bare incipit per the
# "skip it" convention this file's own older comment described (still
# the case for ember-september-wednesday.yml, not yet revisited).
# web/www/missa/Latin/Tempora/093-5.txt's own [Evangelium] is `@Sancti/
# 07-22` (St. Mary Magdalene's Missale Gospel is reused verbatim for this
# day) — sourced from that file, not guessed at.
#
# Recombined into one reading 2026-09-04 (previously kept as 3 separate
# readings): the user flagged this on the live app (`/2026-09-18/matins`,
# Ember Friday as a commemoration) as reading oddly — Gregory's Homily 33
# split into 3 slots. Lectio1-3 are one continuous, unbroken homily on the
# same pericope, split only to fill the fixed 3-lesson Nocturn slot count
# — exactly the "source doesn't genuinely split" case this store's own
# established default (see post-pentecost-15.yml's own doc comment)
# recombines. The original per-lesson "genuinely distinct proper
# responsory" rationale for keeping this split (also present, unfixed so
# far, in ember-september-wednesday.yml/ember-september-saturday.yml/
# ember-advent-saturday.yml/ember-advent-wednesday.yml/
# ember-advent-friday.yml) doesn't hold up against that established
# default: post-pentecost-15.yml's own Nocturn 2 already collapses 4
# lessons with their own distinct responsories into one reading, keeping
# only the first's. Responsory here is Lectio1's own (Responsory1 =
# @Tempora/093-0:Responsory4) per that same "the first one, when several
# collapse" convention; Lectio2/3's own distinct responsories (Responsory2
# = @Tempora/093-0:Responsory5, Responsory3 = @Tempora/093-0:Responsory6)
# are dropped, same as every other collapsed-reading case in this store.
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Luc 7:36-50
      text: 'In illo témpore: Rogábat Jesum quidam de pharisǽis, ut manducáret cum illo. Et ingréssus domum pharisǽi, discúbuit. Et ecce múlier, quæ erat in civitáte peccátrix, ut cognóvit, quod accubuísset in domo pharisǽi, áttulit alabástrum unguénti: et stans retro secus pedes ejus, lácrimis cœpit rigáre pedes ejus, et capíllis cápitis sui tergébat, et osculabátur pedes ejus, et unguénto ungébat. Videns autem pharisǽus, qui vocáverat eum, ait intra se, dicens: Hic si esset Prophéta, sciret útique, quæ et qualis est múlier, quæ tangit eum: quia peccátrix est. Et respóndens Jesus, dixit ad illum: Simon, hábeo tibi áliquid dícere. At ille ait: Magíster, dic. Duo debitóres erant cuidam fœneratóri: unus debébat denários quingéntos, et álius quinquagínta. Non habéntibus illis, unde rédderent, donávit utrísque. Quis ergo eum plus díligit? Respóndens Simon, dixit: Æstimo, quia is, cui plus donávit. At ille dixit ei: Recte judicásti. Et convérsus ad mulíerem, dixit Simóni: Vides hanc mulíerem? Intrávi in domum tuam, aquam pédibus meis non dedísti: hæc autem lácrimis rigávit pedes meos et capíllis suis tersit. Osculum mihi non dedísti: hæc autem, ex quo intrávit, non cessávit osculári pedes meos. Oleo caput meum non unxísti: hæc autem unguénto unxit pedes meos. Propter quod dico tibi: Remittúntur ei peccáta multa, quóniam diléxit multum. Cui autem minus dimíttitur, minus díligit. Dixit autem ad illam: Remittúntur tibi peccáta. Et cœpérunt, qui simul accumbébant, dícere intra se: Quis est hic, qui étiam peccáta dimíttit? Dixit autem ad mulíerem: Fides tua te salvam fecit: vade in pace.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: Pope St. Gregory the Great, Homily 33 on the Gospels, on Luke 7:36-50
      text: |-
        Quem pharisǽus de falsa justítia præsúmens, nisi Judáicum pópulum; quem peccátrix múlier ad vestígia Dómini véniens et plorans, nisi convérsam gentilitátem desígnat? Quæ cum alabástro venit, unguéntum fudit, retro secus pedes Dómini stetit, lácrimis pedes rigávit, capíllis tersit, eosdémque quos infundébat et tergébat pedes osculári non désiit. Nos ergo, nos illa múlier expréssit, si toto corde ad Dóminum post peccáta redeámus, si ejus pœniténtiæ luctus imitémur. Quid namque unguénto, nisi bonæ odor opiniónis exprímitur? Unde et Paulus dicit: Christi bonus odor sumus Deo in omni loco.

        Si ergo recta ópera ágimus, quibus opiniónis bonæ odóre Ecclésiam respergámus, quid in Dómini córpore, nisi unguéntum fúndimus? Sed secus pedes Jesu múlier stetit: contra pedes enim dómini stétimus, cum in peccátis pósiti ejus itinéribus renitebámur. Sed si ad veram pœniténtiam post peccáta convértimur, jam retro secus pedes stamus; quia ejus vestígia séquimur, quem impugnabámus. Lácrimis múlier pedes ejus rigat: quod nos quoque veráciter ágimus, si quibúslibet últimis membris Dómini per compassiónis afféctum inclinámur, si sanctis ejus in tribulatióne compátimur, si eórum tristítiam, nostram putámus.

        Capíllis ergo pedes Dómini térgimus, quando sanctis ejus, quibus ex caritáte compátimur, étiam ex his quæ nobis supérfluunt, miserémur: quátenus sic mens per compassiónem dóleat, ut étiam larga manus afféctum dolóris osténdat. Rigat namque lácrimis Redemptóris pedes, sed capíllis suis non tergit, qui utcúmque proximórum dolóri compátitur, sed tamen eis ex his, quæ sibi supérfluunt, non miserétur. Plorat, et non tergit, qui verba quidem dolóris tríbuit, sed non ministrándo quæ desunt, vim dolóris mínime abscíndit. Osculátur múlier pedes, quos tergit: quod nos quoque plene ágimus, si studióse dilígimus, quos ex largitáte continémus: ne gravis nobis sit necéssitas próximi; ne ipsa nobis ejus indigéntia, quæ sustentátur, fiat onerósa: et cum manus necessária tríbuit, ánimus a dilectióne torpéscat.
      responsory: |-
        R. Sufficiébat nobis paupértas nostra, ut divítiæ computaréntur: numquam fuísset pecúnia ipsa, pro qua misísti fílium nostrum, * Báculum senectútis nostræ!
        V. Heu me, fili mi, ut quid te mísimus peregrinári, lumen oculórum nostrórum?
        R. Báculum senectútis nostræ!
      status: verified
