# Matins Nocturn 2 readings for the Finding of St. Stephen, Protomartyr
# (Aug 3) — pre-1955-but-post-1617 (no SanctiM/08-03*.txt at all).
# web/www/horas/Latin/Sancti/08-03.txt, English/Sancti/08-03.txt.
#
# Lectio1-3 (Acts 7:51-54, 55-58, 59 + 8:1-2) is one continuous
# scriptural excerpt (Stephen's own martyrdom, from Acts), no internal
# break, combined into one reading with citation. Lectio4-5 (the finding
# of the relics under Honorius) is a second continuous account, combined.
# Lectio6 (St. Augustine, City of God, Bk. 22 ch. 8) is a third, distinct
# source. Responsories are all `@Sancti/12-26` cross-references (this
# day's proper is otherwise borrowed wholesale from St. Stephen's Dec 26
# feast) — not transcribed here since that source file's own responsory
# text wasn't independently pulled for this pass.
#
# Checked 2026-09-05 for a missing Gospel pairing: confirmed via
# horas/Latin/Sancti/08-03.txt directly — the Augustine excerpt is
# Lectio6, genuinely Nocturn 2, not Gospel-tied. This feast's own
# Nocturn 3 (Lectio7-9) is itself a cross-reference to St. Stephen's
# Dec 26 feast (Matt 23:34-39 + a Jerome homily), a wholly different,
# unauthored pairing — not this file's own content. No pairing added.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      citation: Act 7:51-54; 55-58; 59; 8:1-2
      text: |-
        Dura cervice et incircumcisis córdibus et áuribus, vos semper Spiritui Sancto resístitis: sicut patres vestri, ita et vos. Quem prophetárum non sunt persecúti patres vestri? Et occidérunt eos, qui prænuntiábunt de adventu Justi, cujus vos nunc proditores et homicidæ fuistis, qui accepístis legem in dispositióne Angelórum et non custodistis. Audiéntes autem hæc, disseccabántur córdibus suis, et stridébant déntibus in eum.

        Cum autem esset plenus Spíritu Sancto, inténdens in cælum, vidit glóriam Dei, et Jesum stantem a dextris Dei. Et ait: Ecce video cælos apertos, et Fílium hóminis stantem a dextris Dei. Exclamántes autem voce magna, continuérunt aures suas, et ímpetum fecérunt unanímiter in eum. Et ejiciéntes eum extra civitátem lapidábant: et testes deposuérunt vestiménta sua secus pedes adolescentis, qui vocabátur Saulus. Et lapidábant Stephanum, invocántem et dicéntem: Dómine Jesu, suscipe spíritum meum.

        Positis autem genibus, clamávit voce magna: Dómine, ne statuas illis hoc peccátum. Et cum hoc dixísset, obdormívit in Dómino. Saulus autem erat consentiens neci ejus. Facta est autem in illa die persecútio magna in ecclésia quæ erat Jerosolymis; et omnes dispersi sunt per regiónes Judææ et Samaríæ, præter Apóstolos. Curavérunt autem Stephanum viri timorati, et fecérunt planctum magnum super eum.
      status: verified
    - nocturn: 2
      isGospel: false
      text: |-
        Sanctórum córpora Stephani Protomártyris, Gamaliélis, Nicodémi et Abibónis, quæ diu in obscúro ac sórdido loco jacúerant, Honorio imperatóre, Luciáno presbytero divínitus admónito, invénta sunt prope Jerosolymam. Cui Gamaliel cum in somnis apparuísset, gravi quadam et præclára senis spécie, locum jacéntium córporum commonstrávit, imperans ut Joánnem Jerosolymitanum antístitem adíret, agerétque cum eo ut honestius illa córpora sepelirentur.

        Quibus auditis Jerosolymórum antístes, finitimárum urbium epíscopis presbyterisque convocatis, ad locum pergit; defossos lóculos ínvenit, unde suavíssimus odor efflabátur. Cujus rei fama commóta, magna hóminum multitúdo eo convénit, multique ex variis morbis ægroti ac débiles sani et íntegri domum rediérunt. Sacrum autem sancti Stephani corpus, quod summa tunc celebritate in sanctam ecclésiam Sion illátum est, sub Theodosio junióre Constantinópolim, inde Romam, Pelagio primo summo Pontífice, translátum, in agro Verano in sepúlcro sancti Lauréntii Mártyris collocátum est.
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, City of God, Book 22, ch. 8
      text: 'Ad aquas Tibilitanas, episcopo afferénte Projecto relíquias Mártyris gloriosíssimi Stephani, ad ejus memóriam veniebat magnæ multitúdinis concursus et occúrsus. Ibi cæca mulier, ut ad episcopum portántem pígnora sacra ducerétur, orávit: flores, quos ferebat, dedit; recepit, óculis admóvit, prótinus vidit. Stupéntibus qui áderant, præibat exsultans, viam carpens et viæ ducem ulterius non requírens. Memoráti memóriam Mártyris, quæ pósita est in castello Synicénsi, quod Hipponénsi coloniæ vicinum est, ejusdem loci Lucillus epíscopus, pópulo præcedénte atque sequente, portábat; fístula, cujus molestia jamdiu laboraverat, et familiaríssimi sui médici, qui eam secaret, opperiebátur manus, illíus piæ sarcinæ vectatióne repénte sanáta est.'
      status: verified
