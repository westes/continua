# Read directly from web/www/horas/Latin/Sancti/05-18.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui hunc diem beáti Venántii Mártyris tui triúmpho consecrásti: exáudi preces
    pópuli tui et præsta: ut, qui ejus mérita venerámur, fídei constántiam imitémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-martyr (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). st-venantius has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-venantius-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Qui odit * ánimam suam in hoc mundo, in vitam ætérnam custódit eam.
    V. Justus ut palma florébit.
    R. Sicut cedrus Líbani multiplicábitur.
    Orémus.
    Deus, qui hunc diem beáti Venántii Mártyris tui triúmpho consecrásti: exáudi preces
    pópuli tui et præsta: ut, qui ejus mérita venerámur, fídei constántiam imitémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. Venantius, Martyr (May 18). Sourced
# directly from web/www/horas/Latin/Sancti/05-18.txt,
# English/Sancti/05-18.txt. Lectio4-6 combined into one reading, one
# continuous account of the martyrdom. No Lectio7-9 in his own file
# (his `[Rule]` is `vide C2a`) -- defers to the Common of a Martyr's
# own Nocturn 3, not transcribed here.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Venantius Camers, quindecim annos natus, cum christianæ religiónis accusarétur apud Antíochum, qui sub Decio imperatóre Camerino præerat, in porta civitátis præsidi se obtulit. Quem ille pollicitatiónibus ac terróribus diu tentátum, flagris cædi et vinculis astringi jussit; sed is mirabíliter ab Angelo solutus, lampadibus póstea aduritur, atque inverso ore, fumo supposito, suspénditur. Ejus constantiam in tormentis demirátus Anastasius Cornicularius, et quod eum ab Angelo íterum solutum cándida veste supra fumum ambulántem vidísset, in Christum credidit; et a beato Porphyrio presbytero cum família baptizatus, paulo post martyrii palmam cum eodem promeruit.

        At Venantius præsidi sistitur, et ab eo íterum frustra tentátus ut Christi fidem deséreret, in carcerem conjícitur; quo Attalus præco mittitur, qui ei dicat se quoque christianum fuísse et ei nómini proptérea renuntiásse, quod cognovísset inane esse fidei comméntum, quo Christiáni præséntibus se ábdicant ob vanam futurórum spem. Verum nobilis Christi athleta, callidi hostis insidias non ignorans, diaboli ministrum a se pénitus rejécit. Quare ad præsidem íterum adducto omnes contusi sunt dentes maxillæque confractæ; atque, ita cæsus, in sterquilinium dejícitur. Sed inde ab Angelo quoque ereptus, rursus stetit ante judicem; qui, Venantio adhuc loquente, e tribunali cécidit, et in ea voce, Verus est Venantii Deus, nostros deos destrúite, exclámans exspirávit.

        Quod cum præsidi nuntiátum esset, extemplo Venántium leónibus óbjici jussit; qui, naturali feritáte omissa, ad ejus se pedes abjecérunt. Interim ille pópulum Christi fidem edocébat. Quare inde amotus, íterum in carcerem traditur. Cumque postridie præsidi referret Porphyrius, se per visum noctu pópulos, quos Venantius aqua tingebat, claríssima luce fulgéntes, ipsum vero præsidem obscuríssima caligine operátum vidisse; præses, ira incénsus, eum illico cápite plecti imperat, deínde Venántium per loca vépribus et cárduis cónsita trahi usque ad vésperam. Is, cum semiánimis relíctus esset, mane se íterum præsidi præsentávit; cujus jussu statim e rupe præcipitátur. Sed inde étiam divinitus ereptus, denuo per loca aspera ad mille passus trahitur; ubi, milítibus siti æstuántibus, in próxima convalle, ex lápide, in quo et genuum formam relíquit, sicut étiam nunc in ejus ecclésia vidére licet, crucis signo a Venantio facto, aquæ manarunt. Eo miraculo plures permoti in Christum credidérunt, quos omnes præses eo loci una cum Venantio cápite feriri jussit. Fulgura et terræmotus eo témpore ita magni fuére, ut præses aufugeret; qui paucis tamen post diébus, divinam haud valens effugere justítiam, turpíssimam mortem oppétiit. Christiáni interim Venantii et aliórum córpora honorifico loco sepeliérunt: quæ Camerini, in ecclésia Venantio dicata, cóndita adhuc sunt.
      status: verified
