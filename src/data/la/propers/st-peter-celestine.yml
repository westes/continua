# Matins Nocturn 2 reading for St. Peter Celestine, Pope, Confessor
# (May 19, sharing the date with St. Pudentiana — see
# st-pudentiana.yml) — SanctiM/05-19.txt inherits the whole day
# (`@Sancti/05-19`) with no Nocturn 2/3 override, so this saint's own
# vita is sourced from the Tridentine track exactly as for a pre-1955
# saint (see memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/05-19.txt, English/Sancti/05-19.txt.
# Single lesson (Lectio4 — Lectio5-6 fall back to Common of a
# Confessor-Pope, not proper text, so not authored here). No responsory
# given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Petrus, a nomine quo Pontifex est appellatus, Cælestinus dictus, honestis catholicisque parentibus Aeserniæ in Samnitibus natus, adolescentiam vix ingressus, ut ánimum a mundi illecebris custodiret, in solitudinem secessit. Ibi contemplationibus mentem mitriens, corpus in servitutem redigens, ferream catenam ad nudam carnem adhibebat. Congregationem, quæ postea Cælestinorum dicta est, sub regula sancti Benedicti instituit. Hinc quasi lucerna supra candelabrum posita, cum abscondi nequiret, (Romana Ecclesia diu viduata pastore) in Petri cathedram ignorans et absens ascitus, magna novitatis admiratione non minus quam repentino gaudio cunctos affecit. Cum autem in pontificatus sublimitate collocatus, variis distentus curis, assuitis incumbere meditationibus vix posse cognosceret, oneri pariter et honori voluntarie cessit. Indeque priscam vitæ rationem repetens, obdormivit in Domino, ejusque pretiosam mortem crux præfulgens in aëre ante cubiculi ostium reddidit amplius gloriosam. Miraculis multis tam vivens, quam post obitum claruit; quibus rite examinatis, Clemens quintus anno postquam decessit undecimo, sanctorum numero adscripsit.
      status: verified
