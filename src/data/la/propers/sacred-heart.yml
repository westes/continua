# Read directly from the reference engine's own static file:
# web/www/horas/Latin/Tempora/Pent02-5.txt's [Oratio] / English/Tempora/Pent02-5.txt's
# [Oratio] -- Sacred Heart's real, own collect (the feast's [Officium] proper
# collect, embedded again verbatim inside that same file's own [Octava 2]
# commemoration block, confirming it as the feast's real one). That same
# file also carries a second, distinct [Oratio3]/"Protéctor in te
# sperántium" text at Second Vespers -- this is the standard post-Pentecost
# Sunday collect (a concurring Sunday's own commemoration merged into the
# CGI's rendered page, not a second real Sacred-Heart collect), so it is
# deliberately not used here; per this project's own precedent
# (vu-assumption-collect-do-inconsistency: "vu correctly uses the old
# collect uniformly throughout" when a source file carries two candidate
# collects for one feast), this file uses [Oratio] alone, consistently.
#
# Audit note: this id is registered in ALWAYS_OVERRIDE_TEMPORAL_IDS but
# had never actually been authored, so the day was silently falling back
# to Trinity-week feria content despite sacred-heart.yml's own record
# already existing.
collect:
  text: |
    Orémus.
    Deus, qui nobis in Corde Fílii tui, nostris vulneráto peccátis, infinítos dilectiónis thesáuros misericórditer largíri dignáris: concéde, quǽsumus, ut illi devótum pietátis nostræ præstántes obséquium, dignæ quoque satisfactiónis exhibeámus offícium.
    Per eúmdem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

