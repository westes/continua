magnificat-antiphon:
  text: Hódie gloriósa cæli Regína * in terris appáruit; hódie pópulo suo verba salútis et pígnora pacis áttulit; hódie Angelórum et fidélium chori immaculátam Conceptiónem celebrántes gáudio exsúltant. Allelúia.
