# Read directly from web/www/horas/Latin/Sancti/02-11.txt's own [Oratio]
# and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui per immaculátam Vírginis Conceptiónem dignum Fílio tuo habitáculum
    præparásti: súpplices a te quǽsumus; ut, ejúsdem Vírginis Apparitiónem celebrántes,
    salútem mentis et córporis consequámur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (apparition-of-the-immaculate-bvm-antiphon.yml), paired with the standard BVM commemoration versicle already verified elsewhere in this app (propers/common/lauds-suffrage-bvm.yml -- 'V. Ora pro nobis sancta Dei Genitrix'). Collect is the saint's own real proper (apparition-of-the-immaculate-bvm-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Ista est * colúmba mea, perfécta mea, immaculáta mea.
    V. Ora pro nobis sancta Dei Génitrix.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Deus, qui per immaculátam Vírginis Conceptiónem dignum Fílio tuo habitáculum
    præparásti: súpplices a te quǽsumus; ut, ejúsdem Vírginis Apparitiónem celebrántes,
    salútem mentis et córporis consequámur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# the Apparition of the Immaculate BVM: proper Matins hymn, Latin/Sancti/02-11.txt's [Hymnus Matutinum]. English from English/Sancti/02-11.txt.
# Before this file the saint fell to the Common's hymn.
matins-hymn:
  text: |
    Te dícimus præcónio,
    Intácta Mater Núminis,
    Nostris benígna láudibus
    Tuam repénde grátiam.

    Sontes Adámi pósteri
    Infécta proles gígnimur;
    Labis patérnæ néscia
    Tu sola, Virgo, créderis.

    Caput dracónis ínvidi
    Tu cónteris vestígio,
    Et sola glóriam refers
    Intaminátæ oríginis.

    O gentis humánæ decus
    Quæ tollis Hevæ oppróbrium,
    Tu nos tuére súpplices,
    Tu nos labántes érige.

    Serpéntis antíqui potens
    Astus retúnde et ímpetus,
    Ut cǽlitum perénnibus
    Per te fruámur gáudiis.

    * Jesu, tibi sit glória
    Qui natus es de Vírgine,
    Cum Patre, et almo Spíritu
    In sempitérna sǽcula.
    Amen.
  status: verified

# Read from web/www/horas/Latin/Sancti/02-11.txt, which references
# @Sancti/12-08 (Immaculate Conception) for its [Invit]; no Monastic
# override exists. English likewise inherits Sancti/12-08's own text.
matins-invitatory:
  text: 'Immaculátam Conceptiónem Vírginis Maríæ celebrémus: * Christum ejus Fílium adorémus Dóminum.'
  status: verified

# Sourced from web/www/horas/Latin/Sancti/02-11.txt's own [Capitulum
# Laudes] and English/Sancti/02-11.txt's own translation. Authoring this
# was necessary for the feast's own hymn (lauds-hymn-apparition-of-the-
# immaculate-bvm.yml) to actually be reached at all: hours/resolve-
# common.ts's resolveOfficeBundle is all-or-nothing per id -- her own
# `common: common-of-the-bvm` field means without a chapter of her own,
# the whole bundle (hymn included) fell through to that Common's generic
# text.
lauds-capitulum:
  text: Surge, amíca mea, speciósa mea, et veni, colúmba mea, in foramínibus petræ, in cavérna macériæ, osténde mihi fáciem tuam, sonet vox tua in áuribus meis.
  citation: Cant 2:13-14
  status: verified

# Sourced from web/www/horas/Latin/Sancti/02-11.txt's own [Hymnus Laudes]
# and English/Sancti/02-11.txt's own translation (the well-known Lourdes
# hymn, "Aurora soli praevia"). No Vespers hymn exists in the source for
# this feast at all (both the Latin and English files' own [Hymnus
# Vespera] blocks are empty) -- correctly falls to common-of-the-bvm's
# Vespers hymn, not a gap.
lauds-hymn:
  text: |-
    Auróra soli prǽvia,
    Felix salútis núntia,
    In noctis umbra plebs tua
    Te, Virgo, supplex ínvocat.

    Torrens nefástis flúctibus
    Cunctos trahens vorágine,
    Leni resídit ǽquore
    Cum transit Arca fœ́deris.

    Dum torret aréscens humus,
    Tu rore sola spárgeris;
    Tellúre circum rórida,
    Intácta sola pérmanes.

    Fatále virus évomens
    Attóllit anguis vérticem;
    At tu dracónis túrgidum
    Invícta cónteris caput.

    Mater benígna, réspice
    Fletus precésque súpplicum,
    Et dimicántes, tártari
    Victrix, tuére ab hóstibus.

    Jesu, tibi sit glória,
    Qui natus es de Vírgine,
    Cum Patre, et almo Spíritu,
    In sempitérna sǽcula. Amen.
  status: verified

# No distinct Lauds versicle found for this feast in the reference source
# beyond her own Matins nocturn versicle (a different slot); reusing
# common-of-the-bvm's own Lauds versicle, same pattern as her chapter/
# hymn tiers not needing anything beyond the Common where nothing proper
# was found. Authored to make the feast's own bundle (needed for her own
# hymn, see lauds-capitulum-apparition-of-the-immaculate-bvm.yml) render a real versicle instead of
# an unconditionally-rendered empty one.
lauds-versicle:
  text: |
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/02-11.txt's own [Lectio Prima] and its
# English counterpart.
prime-lectio:
  text: In me grátia omnis viæ et veritátis, in me omnis spes vitæ et virtútis. Transíte ad me, omnes qui concupíscitis me, et a generatiónibus meis implémini.
  citation: Sir 24:25-26
  status: verified

# No distinct Vespers hymn found for this feast in the reference source
# (both Latin/English [Hymnus Vespera] blocks are empty); reusing
# common-of-the-bvm's own Vespers hymn ("Ave maris stella") verbatim.
# Authored to make the feast's own bundle (needed for her own Lauds
# hymn, see lauds-capitulum-apparition-of-the-immaculate-bvm.yml -- Vespers falls back to the same
# Lauds capitulum via lookupPart (Vespers chapter, Lauds sibling)) render a real hymn
# instead of an unconditionally-rendered empty one.
vespers-hymn:
  text: |-
    Ave maris stella,
    Dei Mater alma,
    Atque semper Virgo,
    Felix cæli porta.

    Sumens illud Ave
    Gabriélis ore,
    Funda nos in pace,
    Mutans Hevæ nomen.

    Solve vincla reis,
    Profer lumen cæcis,
    Mala nostra pelle,
    Bona cuncta posce.

    Monstra te esse matrem,
    Sumat per te preces,
    Qui pro nobis natus,
    Tulit esse tuus.

    Virgo singuláris,
    Inter omnes mitis,
    Nos culpis solútos
    Mites fac et castos.

    Vitam præsta puram,
    Iter para tutum,
    Ut vidéntes Jesum,
    Semper collætémur.

    Sit laus Deo Patri,
    Summo Christo decus,
    Spirítui Sancto,
    Tribus honor unus. Amen.
  status: verified

# Second Vespers hymn: web/www/horas/Latin/Sancti/02-11.txt's own [Hymnus
# Vespera 3] ("Omnis expértem máculæ Maríam") and English/Sancti/02-11.txt's
# translation. The source's final stanza is a fixed doxology that
# SanctiM/02-11b.txt rewrites for the Monastic rite; here it is replaced by
# this app's doxology marker instead (common-of-the-bvm sets Doxology=Nat),
# same as every other BVM hymn. First Vespers has no own hymn in the
# source (the plain [Hymnus Vespera] is empty), so
# vespers-hymn-apparition-of-the-immaculate-bvm.yml stays the default; see
# hours/resolve-common.ts's withVespersVariant.
vespers-hymn/~-second:
  text: |
    Omnis expértem máculæ Maríam
    Edocet summus fídei magíster;
    Vírginis gaudens celébrat fidélis
    Terra triúmphum.

    Ipsa se præbens húmili puéllæ
    Virgo spectándam, récreat pavéntem,
    Seque concéptam sine labe, sancto
    Prǽdicat ore.

    O specus felix, decoráte divæ
    Matris aspéctu! veneránda rupes,
    Unde vitáles scatuére pleno
    Gúrgite lymphæ!

    Huc catervátim pia turba nostris,
    Huc ab extérnis peregrína terris
    Affluit supplex, et opem poténtis
    Vírginis orat.

    Excipit Mater lácrimas precántum,
    Donat optátam míseris salútem;
    Compos hinc voti pátrias ad oras
    Turba revértit.

    Súpplicum, Virgo, miseráta casus,
    Semper o nostros réfove labóres,
    Impetrans mæstis bona sempitérnæ
    Gáudia vitæ.

    * Glória tibi, Dómine,
    Qui natus es de Vírgine,
    Cum Patre, et Sancto Spíritu,
    In sempitérna sǽcula. Amen.
  status: verified

# No distinct Vespers versicle found for this feast in the reference
# source; reusing common-of-the-bvm's own Vespers versicle. Authored to
# make the feast's own bundle (needed for her own hymn, see lauds-
# capitulum-apparition-of-the-immaculate-bvm.yml -- Vespers falls back to the same Lauds capitulum
# via lookupPart (Vespers chapter, Lauds sibling)) render a real versicle instead of an
# unconditionally-rendered empty one.
vespers-versicle:
  text: |
    V. Dignáre me laudáre te, Virgo sacráta.
    R. Da mihi virtútem contra hostes tuos.
  status: verified

# Lauds' Benedictus antiphon, read from web/www/horas/Latin/Sancti/
