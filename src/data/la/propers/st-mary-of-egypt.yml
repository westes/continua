# Read directly from web/www/horas/Latin/Sancti/Urbis/04-09-MariaAegyptiaca.txt's
# own [Oratio]. No English exists for the Urbis directory; the English is this
# project's own translation, draft.
collect:
  text: |
    Orémus.
    Deus, qui beátam Maríam de caligine vitiórum ereptam, exhibuísti tibi sponsam: exáudi nos propítius et concéde; ut ejus précibus et méritis, a peccatórum nostrórum maculis emundémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# The Common of a Holy Woman's antiphon (benedictus-antiphon-common-of-a-
# holy-woman.yml) with the standard de-Communi commemoration versicle, as
# commemoration-st-anne.yml does; collect is her own (collect-st-mary-of-
# egypt.yml), unchanged. Marked draft: the antiphon/versicle pairing is not
# independently live-verified for her.
commemoration:
  text: |
    Ant. Símile est regnum cælórum * hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, qui beátam Maríam de caligine vitiórum ereptam, exhibuísti tibi sponsam: exáudi nos propítius et concéde; ut ejus précibus et méritis, a peccatórum nostrórum maculis emundémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins readings for St. Mary of Egypt (Apr 9 in the Rome-city calendar; the
# martyrology has her on Apr 2). Her own lessons are NOT in the reference
# engine: web/www/horas/Latin/Sancti/Urbis/04-09-MariaAegyptiaca.txt gives
# only the proper Oratio and the incipits of nine lessons ("María
# Ægyptíaca, quæ ...", "Quo miráculo ad se revérsa ...", "Quidam autem Abbas
# Zósymus, cum ..."). Nocturn 2 is therefore authored from the source those
# lessons abridge: the Latin Life of St. Mary of Egypt by Pseudo-Sophronius
# of Jerusalem, tr. Paul the Deacon of Naples (Migne PL 73, cols. 671-690,
# Vitae Patrum I; text via the Janner repository of the OCR scan). Three
# excerpts, not the whole Life: her account of her sin and the road to
# Jerusalem (Cap. XIII, XV start), the closing of the church door and the
# prayer before the image of the Mother of God (Cap. XV-XVII), and Zosimas
# burying her with the lion's help (Cap. XXV-XXVI). The PL 73
# scan garbles two passages (a stretch of Cap. XIII, and the inscription she
# left in the sand with the date of her death); those are filled from the
# Latin printed facing the Old English version in M. Magennis, The Old
# English Life of St Mary of Egypt (Exeter, 2002), with the PL wording kept
# wherever it is legible. That text also gives her death as "die nona, id
# est quinto idus Aprilis" (April 9; manuscripts S and C, not N), which is
# where the Rome-city date comes from. OCR errors corrected; ae/oe set as
# ligatures. English is this
# project's own translation, draft. Nocturn 3 (Luke 15:1-10 and Gregory's
# Homily 34 on it, the same Gospel and homily the Urbis file indicates) is
# reused verbatim from post-pentecost-03.yml.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Life of St. Mary of Egypt, ascribed to Sophronius of Jerusalem, tr. Paul the Deacon (PL 73, 671-690), excerpts
      text: |-
        Ego, Pater, patriam quidem Ægyptum habui: parentibus autem meis viventibus, duodecimum agens ætatis annum, affectum illorum spernens, Alexandriam veni, et quomodo quidem virginitatem meam in primis violaverim, et qualiter indesinenter et insatiabiliter vitio libidinis subjugata jacuerim, erubesco considerare. Hoc enim non breve est dicere: illud autem citius dicam, ut possis cognoscere insatiabilem vitii mei ardorem, quem habui in amorem stupri. Decem et septem et eo amplius annos, ignosce, publice populo transegi in incendio jacens luxuriæ. Non propter alicujus donum virginitatem meam perdidi; neque enim ab aliquibus dare volentibus aliquid accipiebam; hoc enim libidinis furore succensa considerabam, ut amplius ad me facerem currere, gratis implens stupri mei et sceleris desiderium. Neque vero consideres quia pro divitiis nihil accipiebam; mendicans enim vivebam, aut multoties stuppam filando. Desiderium enim, ut dixi, habebam insatiabile, ita ut indesinenter me in sterquilinio luxuriæ volutarem. Et hoc mihi erat placabile, et hoc vitam existimabam, si indesinenter naturæ injuriam peregissem. Hoc modo me vitam ducente, vidi in quodam festi tempore multitudinem Libyorum et Ægyptiorum quasi ad mare concurrentem. Reperi itaque aliquem, et interrogavi: Ubi festinant viri isti, qui currunt? Dixit autem mihi: In Jerosolymam omnes ascendunt ob sanctæ crucis exaltationem, quæ post aliquot dies solito celebratur. Dixi autem ei et ego: Putas suscipient me, si voluero ire cum ipsis? Et ille dixit: Si habes naulum, nullus te prohibebit. Dixi ei: Vere, frater, naulum vel sumptum non habeo. Vadam autem et ascendam in unam navim, quam conduxerunt. Et licet renuant, memetipsam tradam; corpus enim meum in potestate habentes, pro naulo accipient. Propterea autem cum eis volui ambulare (abba meus, ignosce) ut multos haberem cooperatores in meæ libidinis passione.

        Quando autem venit sanctæ exaltationis festivitas pretiosæ crucis, ego quidem, sicut et prius, præibam, juvenum illaqueans et capiens animas. Vidi autem primo diluculo omnes ad ecclesiam unanimiter concurrentes. Abii et ego, currens cum currentibus, et veni cum illis in atrium templi; et cum venisset hora exaltationis divinæ crucis, impingebam et impingebar, repellebarque quodammodo, festinans ingredi cum populo, coacta usque ad januam templi cum his qui ingrediebantur, cum magna laboris tribulatione appropinquans et ego infelix: quando autem ingredi volebam, illi quidem omnes sine impedimento ingrediebantur, me autem divina aliqua virtus prohibebat, non indulgens introitum. Mox igitur repulsa, ejiciebar foras; et ejecta, inveniebar sola in atrio stans. Considerans autem per muliebrem infirmitatem hoc mihi accidere, iterum aliis me immiscendo, vim mihi quodammodo faciebam introeundi, sed enim laborabam in vacuum. Ut enim limina vestigio contingebam, omnes interius recipiebantur, nullum habentes impedimentum, me autem solam non recipiebat; sed quasi militaris multitudo esset taxata ut mihi ingredienti aditum clauderet, ita me repentina aliqua prohibebat virtus, et iterum inveniebar in atrio. Hoc ter et quater passa et facere conans, nihilque proficiens, desperans de extero, et amplius nusquam progredi valens (factum quippe fuerat corpus meum a vi comprimentium valde confractum), recedens discessi, et steti in quodam angulo atrii templi; et vix aliquando, ob quam causam prohibebar videre vivificum lignum in cogitationem reduxi. Tetigit enim mentem et cordis mei oculos intellectus salutis, recogitans quia squalida actuum meorum scelera mihi introeundi aditum obserabant. Cœpi itaque flens nimium conturbari et pectus tundere, atque suspiria de profundo cordis proferens, et gemens ejulansque prospexi in loco in quo stabam, sursum imaginem sanctæ Dei genitricis stantem, et aio, ad eam intendens et indeclinanter attendens: Domina virgo, quæ Deum genuisti secundum carnem, scio quia nec condecens nec opportunum sit me sic horridam adorare imaginem tuam vel contemplari oculis tantis sordibus pollutis, quæ esse virgo dignosceris et casta, quæ corpus et animam habes immaculatam: justum est me luxuriosam a tuæ purissimæ castitatis munditia abominari et projici. Tamen quoniam, ut audivi, ob hoc effectus est Deus homo, quem ipsa digna genuisti, ut peccatores vocaret ad pœnitentiam, adjuva me solitariam et nullum habentem adjutorium, percipe confessionem meam, et mihi licentiam tribue ecclesiæ patefactum ingredi aditum, et non efficiar aliena a visione pretiosissimi ligni, in quo affixus Deus homo, quem concipiens ipsa virgo peperisti, et proprium sanguinem dedit pro mea liberatione. Jube, o Domina, et mihi indignæ ob divinæ crucis salutationem januam patefieri, et te ex te genito Christo dignissimam do fidejussorem, quia nunquam ultra meam carnem coinquinabo per horrida immistionum ludibria; sed mox ut filii tui, Virgo sancta, videro lignum, sæculo et actibus ejus, et omnibus quæ in eo sunt renuntio, et continuo egredior ubicunque ipsa ut fidejussor me duxeris. Hæc dicens, et quasi aliquam satisfactionem recipiens, fidei succensa calore, et de pietatis visceribus Dei genitricis præsumens, movi me de eodem loco, in quo stans feci orationem; et veniens, iterum ingredientibus me miscui, et ultra non erat qui me repelleret, neque qui me prohiberet appropinquare januis, quibus in templum introibant. Accepit ergo me tremor validus et extasis, et tota ex omnibus tremebunda turbabar. Itaque conjungens me ad januam, cujus mihi aditus primo claudebatur (quasi omnis virtus quæ prius ingredi me prohibebat, post autem viam ingrediendi pararet), ita absque impedimenti labore introivi, et sic intra sancta sanctorum reperta sum, et pretiosi ac vivifici crucis ligni adorare mysterium digna habita sum.

        Hæc orando, pervenit ad locum qui in similitudine fuerat designatus torrentis, et in extrema ejus parte superiore vidit splendentem solem; et aspiciens, vidit sanctæ mortuum jacens corpus, et manus, ut oportet, sic compositas, et ad Orientem jacens corpus aspiciens. Currens autem, lacrymis lavit beatissimæ pedes, non enim aliud corporis membrum audebat contingere. Lacrymans autem aliquandiu, et psalmos dicens tempori et rei congruentes, fecit sepulturæ orationem, et dicebat sibi ipse: Forsitan non complacet sanctæ hoc fieri. Hæc eo cogitante, designata scriptura erat in terra, ubi hæc legebatur: Sepeli, abba Zosima, miseræ Mariæ corpusculum. Redde terræ quod suum est, et pulveri adjice pulverem. Ora tamen pro me Dominum, transeunte mense Pharmuthi secundum Ægyptios, qui est secundum Romanos Aprilis, die nona, id est quinto idus Aprilis, nocte salutiferæ passionis, post divinæ et sacræ cœnæ communionem. Has senex litteras cum legisset, cogitabat quidem prius quisnam esset qui scripsit; illa enim, ut ipsa dixerat, litteras ignorabat. In hoc tamen valde exultans gaudebat, quia ejus sanctum didicit nomen. Cognovit ergo quia mox ut divina mysteria in Jordane participavit, eadem hora in locum illum venit ubi mox de hoc mundo transiit, et idem iter quod Zosimas per dies viginti ambulans vix consummavit laborans, unius horæ cursu Maria consumpsit, et statim migravit ad Dominum. Glorificans autem Zosimas Dominum, et lacrymis corpus ejus infundens: Tempus est, inquit, miser Zosima, quod tuum est, perfice. Sed quid faciam infelix, quia unde fodere valeam, non habeo? Deest sarculum, non est rastrum, nihilque ex omnibus habeo præ manibus. Hæc illo in corde suo dicente, vidit parvum lignum et modicum jacere: quod assumens, cœpit fodere. Valde autem durior erat terra, et multum fortissima et nequaquam valebat fodere, quia et jejunio confectus, et longi itineris fatigatione nimis erat defectus. Laborabat enim, et suspiriis nimiis urgebatur, et sudoribus madefactus, ingemuit graviter ex ipso cordis sui profundo. Et respiciens, vidit ingentis formæ leonem juxta corpus sanctæ stantem, et ejus plantas lambentem. Videns autem, contremuit præ pavore grandissimæ feræ illius, præcipue quia audierat sanctam feminam illam dicentem quia nunquam aliquam feram viderat. Signo autem se crucis confirmavit undique credens quia illæsum custodire valet eum virtus jacentis. Leo autem cœpit innuere seni, blandis eum nutibus salutans. Zosimas autem dixit leoni: Quoniam a Deo missus venisti, maxime ferarum, ut hujus Dei famulæ corpus terræ commendetur, exple opus officii, ut possit sepeliri ejus corpusculum. Ego enim senectute confectus non valeo fodere, sed nec congruum quid habeo ad hoc opus exercendum; et iterum tanti itineris longitudine properare non valeo ut afferam. Tu divino jussu hoc opus cum ungulis facito, ut commendemus terris hoc sanctum corpusculum. Continue autem, juxta senis sermonem, leo cum brachiis fecit ipse foveam, quanta ad sepeliendum sanctæ corpusculum sufficere posset. Senex vero lacrymis pedes sanctæ abluens, et multipliciter effusa prece exorans pro omnibus eam tunc et amplius pro se exorare, operuit terra corpusculum nudum, astante leone, sicut eam prius repererat, et nihil aliud habens, nisi illud scissum vestimentum, quod ei jam ante projecerat Zosimas, ex quo Maria quædam sui corporis texit membra. Deinde recedunt pariter; et leo quidem in interiora solitudinis quasi ovis mansueta abscessit; Zosimas autem reversus est, benedicens et laudans Deum, et hymnum laudis decantans Christo Domino nostro.
      status: verified
    - nocturn: 3
      isGospel: true
      text: 'In illo témpore: Erant appropinquántes ad Jesum publicáni et peccatóres, ut audírent illum. Et murmurábant pharisǽi et scribæ, dicéntes: Quia hic peccatóres recipit et mandúcat cum illis. Et ait ad illos parábolam istam, dicens: Quis ex vobis homo, qui habet centum oves: et si perdíderit unam ex illis, nonne dimíttit nonagínta novem in desérto, et vadit ad illam, quæ períerat, donec invéniat eam? Et cum invénerit eam, impónit in húmeros suos gaudens: et véniens domum, cónvocat amícos et vicínos, dicens illis: Congratulámini mihi, quia invéni ovem meam, quæ períerat? Dico vobis, quod ita gáudium erit in cœlo super uno peccatóre pœniténtiam agénte, quam super nonagínta novem justis, qui non índigent pœniténtia. Aut quæ múlier habens drachmas decem, si perdíderit drachmam unam, nonne accéndit lucérnam, et evérrit domum, et quærit diligénter, donec invéniat? Et cum invénerit, cónvocat amícas et vicínas, dicens: Congratulámini mihi, quia invéni drachmam, quam perdíderam? Ita dico vobis: gáudium erit coram Angelis Dei super uno peccatóre pœniténtiam agénte.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 34 on the Gospels
      text: 'Audístis in lectióne evangélica, fratres mei, quia peccatóres et publicáni accessérunt ad Redemptórem nostrum; et non solum ad colloquéndum, sed étiam ad convescéndum recépti sunt. Quod vidéntes pharisǽi dedignáti sunt. Ex qua re collígite quia vera justítia compassiónem habet, falsa justítia dedignatiónem. Quamvis et justi sóleant recte peccatóribus dedignári: sed áliud est quod ágitur typho supérbiæ, áliud quod zelo disciplínæ. Dedignántur étenim, sed non dedignántes: despérant, sed non desperántes: persecutiónem cómmovent, sed amántes: quia etsi foris increpatiónes per disciplínam exággerant, intus tamen dulcédinem per caritátem servant. Præpónunt sibi in ánimo ipsos plerúmque quos córrigunt: melióres exístimant eos quoque quos júdicant. Quod vidélicet agéntes, et per disciplínam súbditos, et per humilitátem custódiunt semetípsos. At contra, hi qui de falsa justítia superbíre solent, céteros quosque despíciunt, nulla infirmántibus misericórdia condescéndunt: quo se peccatóres esse non credunt, eo detérius peccatóres fiunt. De quorum profécto número pharisǽi exstíterant, qui diiudicántes Dóminum quod peccatóres suscíperet, arénti corde ipsum fontem misericórdiæ reprehendébant. Sed quia ægri erant, ita ut ægros se esse nescírent; quátenus quod erant agnóscerent, cæléstis eos médicus blandis foméntis curat, benígnum paradígma óbjicit, et in eórum corde vúlneris tumórem premit.'
      status: verified
