# Read directly from web/www/horas/Latin/Sancti/05-10o.txt's own [Oratio]
# and its English counterpart, English/Sancti/05-10o.txt.
collect:
  text: |
    Orémus.
    Da, quǽsumus, omnípotens Deus: ut, qui beatórum Mártyrum tuórum Gordiáni et Epímachi
    solémnia cólimus, eórum apud te intercessiónibus adjuvémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Ant+V/R+collect commemoration bundle, same combined-bundle shape as
# st-gorgonius-commemoration.yml/st-canute-commemoration.yml -- see
# hours/resolve-common.ts's sanctoralCommemorationPart, falling back to
# the bare collect (ss-gordian-and-epimachus-collect.yml) when this file
# didn't exist. Ant 2/Versum 2 are the standard de-Communi pairing for the
# Common of Several Martyrs (C3a, their own real common per [Rank]/[Rule])
# -- common-of-several-martyrs-commemoration-antiphon.yml/lauds-versicle-
# common-of-several-martyrs.yml, both already verified elsewhere (shared
# Common text, not proper to these saints).
commemoration:
  text: |
    Ant. Vestri capílli cápitis * omnes numeráti sunt: nolíte timére: multis passéribus melióres estis vos.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    Da, quǽsumus, omnípotens Deus: ut, qui beatórum Mártyrum tuórum Gordiáni et Epímachi solémnia cólimus, eórum apud te intercessiónibus adjuvémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Matins Nocturn 2 reading for Ss. Gordian and Epimachus, Martyrs (May 10).
# Sourced from web/www/horas/Latin/Sancti/05-10o.txt, English/Sancti/
# 05-10o.txt. The source carries only a single short lesson (Lectio93,
# headed "Commemoratio" in the English -- these two never had a full
# proper 9-lesson Matins even historically), transcribed whole as one
# Nocturn 2 reading, same "short/single source lesson" handling as
# st-gorgonius.yml. No Nocturn 3 of their own -- defers to the Common of
# Several Martyrs' own, not transcribed here.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Gordiánus judex, cum ad eum Januárius presbyter, ut condemnarétur, sub Juliáno Apostáta ductus esset, ab eódem in christiána fide instrúctus, cum uxóre et quinquagínta tribus áliis ex eádem família Romæ baptizátur. Quare præféctus, relegáto Januário, Gordiánum a Clementiáno vicário incíudi jubet in cárcerem: qui póstea eúmdem Gordiánum vinctum caténis ad se accersítum, cum a fídei propósito deterréri non posset, plumbátis diu cæsum, cápite plecti ímperat. Cujus corpus ante Apóllinis templum cánibus objéctum, noctu a Christiánis via Latína sepelítur in eádem crypta, in quam relíquiæ beáti Epimáchi Mártyris translátæ fúerant ab Alexandría: ubi is diu propter Christi confessiónem constríctus in cárcere, postrémo combústus, martýrio coronátus est.'
      status: verified
