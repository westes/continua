# Verified against Divinum Officium ("Divino Afflatu 1954"), Lauds live
# query, 2026-12-27 -- see lauds-psalmody-overrides/christmas-octave-
# sunday.yml's header. "A solis ortus cardine" -- self-contained,
# including its own final doxology stanza (no `*` marker in the source at
# all for this hymn, so no substitution mechanism applies here, unlike most
# other hours' hymns).
#
# Reviewed 2026-09-11 against the Monastic ([HymnusM Laudes],
# Sancti/12-25.txt) word substitutions -- same review as
# lauds-hymn-circumcision.yml's own header (this file's text is a direct
# copy of that one, both borrowing Christmas Day's own propers, which have
# no authored hymn file of their own yet): most substitutions are a wash
# and not adopted, "Jesu tibi sit glória"/"almo Spíritu" are kept as-is
# because they're the more specific wording, and only "Concépit alvo" ->
# "Verbo concépit" is adopted (ties the Incarnation to the Johannine
# "Verbum caro factum est" rather than a plain anatomical phrasing).
lauds-hymn:
  text: |
    A solis ortus cárdine
    Ad usque terræ límitem,
    Christum canámus Príncipem,
    Natum María Vírgine.

    Beátus auctor sǽculi
    Servíle corpus índuit:
    Ut carne carnem líberans,
    Ne pérderet quos cóndidit.

    Castæ Paréntis víscera
    Cæléstis intrat grátia:
    Venter Puéllæ báiulat
    Secréta, quæ non nóverat.

    Domus pudíci péctoris
    Templum repénte fit Dei:
    Intácta nésciens virum,
    Verbo concépit Fílium.

    Enítitur puérpera,
    Quem Gábriel prædíxerat,
    Quem ventre Matris géstiens,
    Baptísta clausum sénserat.

    Fœno iacére pértulit:
    Præsépe non abhórruit:
    Et lacte módico pastus est,
    Per quem nec ales ésurit.

    Gaudet chorus cæléstium,
    Et Angeli canunt Deo;
    Palámque fit pastóribus
    Pastor, Creátor ómnium.

    Iesu, tibi sit glória,
    Qui natus es de Vírgine,
    Cum Patre, et almo Spíritu,
    In sempitérna sǽcula.
    Amen.
  status: verified

