# Verified against Divinum Officium (Monastic Tridentinum 1617) -- read
# directly from the reference engine's own real-date output (not
# reconstructed from memory). Keyed Pentecost/offset-based
# ("post-pentecost-N") rather than Trinity-counted deliberately: this is
# content storage, kept scheme-agnostic, independent of whatever counting
# convention calendar/day-label.ts shows on screen for the same Sunday.
# Cross-checked (2026-08) against a "Divino Afflatu 1954" live query,
# 2026-12-27, and against the raw Monastic Tridentinum 1617 source file
# (web/www/horas/Latin/Tempora/Nat1-0.txt's own [Oratio]) -- identical in
# both, despite 1617 not rendering this Sunday's identity live on most
# dates under its own calendar rules; see lauds-psalmody-overrides/
# christmas-octave-sunday.yml's header for why the rest of this Sunday's
# newly-authored content (2026-08) had to come from Divino Afflatu instead.
collect:
  text: |
    Orémus.
    Omnípotens sempitérne Deus, dírige actus nostros in beneplácito tuo: ut in nómine dilécti Fílii tui mereámur bonis opéribus abundáre:
    Qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

