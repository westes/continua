# Nocturn 2-3, Sunday within the Octave of Christmas (temporalId
# christmas-octave-sunday). Sourced from Tempora/Nat1-0.txt (Latin) /
# English/Tempora/Nat1-0.txt - see christmas-octave-sunday-collect.yml's
# own header for why this Sunday's other content (2026-08) had to be
# sourced from a Divino Afflatu 1954 live query instead: the Monastic
# Tridentinum 1617 rubrics rarely let this Sunday's own identity render on
# a real date, but its underlying office (this file's own source) is real
# and shared across both tracks. See advent-1.yml for the general sweep
# method.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from St. Leo the Great's
# 9th Sermon on Christmas. Responsory: Lectio4's own, a cross-reference in
# the source to Sancti/12-25 (Christmas Day itself)'s Responsory5 ("Beáta
# Dei Génetrix María") - resolved and transcribed here directly, same
# pattern the post-Pentecost files used for their own cross-references.
#
# Nocturn 3 (Lectio7-9): Lectio7 carries real homily prose after its bare
# Gospel incipit (Luke 2:33-40, "Et réliqua") - St. Ambrose's own homily
# (Bk. 2 on Luke ii) begins within Lectio7 itself, same pattern as the
# Advent Sundays. Combined Lectio7's homily portion (incipit dropped) with
# Lectio8-9, using Lectio7's own responsory - again a cross-reference, to
# Sancti/12-25's Responsory8 ("Verbum caro factum est") - rather than the
# inline "O Regem cæli" text this file gives at its own [Responsory8] slot
# (that inline text belongs to the *next* Sunday's now-renumbered
# sequence after Lectio1 was swapped for "OctNat" per this file's own
# [Rule], not to the Lectio7-9 unit authored here).
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Leo the Great, Sermon 9 on Christmas
      text: |-
        Excédit quidem, dilectíssimi, multúmque superéminet humáni elóquii facultátem divini operis magnitúdo: et inde óritur difficultas fandi, unde adest rátio non tacendi. Quia in Christo Jesu Fílio Dei non solum ad divinam esséntiam, sed étiam ad humanam spectat natúram quod dictum est per prophétam: Generatiónem ejus quis enarrábit? Utrámque enim substántiam in unam convenísse persónam, nisi fides credat, sermo non explicat. Et ideo numquam materia déficit laudis, quia numquam sufficit copia laudatóris.

        Gaudeámus ígitur, quod ad eloquéndum tantæ misericórdiæ sacraméntum ímpares sumus; et cum salútis nostræ altitúdinem prómere non valeamus, sentiámus nobis bonum esse, quod vincimur. Nemo enim ad cognitiónem veritátis magis propinquat, quam qui intélligit in rebus divinis, étiam si multum profíciat, semper sibi superesse quod quærat. Nam qui se ad id, in quod tendit, pervenísse præsúmit, non quæsíta réperit, sed in inquisitióne déficit.

        Ne autem infirmitátis nostræ perturbemur angústiis, evangélicæ nos et prophéticæ ádjuvant voces; quibus ita accendimur, et docemur, ut nos nativitátem Dómini, qua Verbum caro factum est, non tam prætéritam recólere, quam præséntem videámur inspícere. Quod enim pastóribus pro gregum suórum custódia vigilántibus nuntiávit Angelus, étiam nostrum implévit audítum: et ideo Dominicis ovibus præsumus, quia verba divínitus édita cordis aure servámus: tamquam et in hodiérna festivitáte dicátur: Evangelizo vobis gáudium magnum, quod erit omni pópulo, quia natus est vobis hódie Salvator, qui est Christus Dóminus, in civitáte David.
      responsory: |-
        R. Beáta Dei Génetrix María, cujus víscera intácta pérmanent: * Hódie génuit Salvatórem sǽculi.
        V. Beáta, quæ crédidit: quóniam perfécta sunt ómnia, quæ dicta sunt ei a Dómino.
        R. Hódie génuit Salvatórem sǽculi.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 2:33-40
      text: 'In illo témpore: Erat Joseph et María Mater Jesu, mirántes super his quæ dicebántur de illo. Et benedíxit illis Símeon, et dixit ad Maríam Matrem ejus: Ecce, pósitus est hic in ruínam et in resurrectiónem multórum in Israël: et in signum, cui contradicétur: et tuam ipsíus ánimam pertransíbit gládius, ut reveléntur ex multis córdibus cogitatiónes. Et erat Anna prophetíssa, fília Phánuel, de tribu Aser: hæc procésserat in diébus multis, et víxerat cum viro suo annis septem a virginitáte sua. Et hæc vídua usque ad annos octogínta quátuor: quæ non discedébat de templo, jejúniis et obsecratiónibus sérviens nocte ac die. Et hæc, ipsa hora supervéniens, confitebátur Dómino, et loquebátur de illo ómnibus, qui exspectábant redemptiónem Israël. Et ut perfecérunt ómnia secúndum legem Dómini, revérsi sunt in Galilǽam in civitátem suam Názareth. Puer autem crescébat, et confortabátur, plenus sapiéntia: et grátia Dei erat in illo.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Commentary on Luke, Book 2
      text: |-
        Vides úberem in omnes grátiam, Dómini generatióne diffúsam, et prophetíam incrédulis negátam esse, non justis. Ecce et Símeon prophétat, in ruínam et resurrectiónem plurimórum venísse Dóminum Jesum Christum, ut justórum, iniquorúmque mérita discérnat; et pro nostrórum qualitáte factórum, judex verus et justus aut supplícia decérnat, aut prǽmia.

        Et tuam ipsíus ánimam pertransíbit gládius. Nec littera, nec historia docet, ex hac vita Mariam corporalis necis passióne migrasse. Non enim anima, sed corpus materiali gládio transverberátur. Et ideo prudéntiam Maríæ haud ignaram mysterii cæléstis osténdit. Vivum enim verbum Dei, et válidum, et acutius omni gládio acutíssimo, pénetrans usque ad divisiónem ánimæ et spíritus, artuum quoque et medullárum, cogitatiónes cordis et secreta scrutátur animórum, quia nuda et apérta sunt ómnia Dei Fílio, quem consciéntiæ secreta non fallunt.

        Prophetávit ítaque Simeon, prophetáverat virgo, prophetáverat copuláta conjugio; prophétare debuit étiam vidua, ne qua aut proféssio deésset, aut sexus. Et ideo Anna et stipendiis viduitátis, et móribus talis inducitur, ut digna plane fuísse credátur, quæ Redemptórem ómnium venisse nuntiáret. Cujus mérita cum álibi descripsérimus, cum víduas hortarémur, hoc loco, quóniam ad ália properámus, non putámus iteránda.
      responsory: |-
        R. Verbum caro factum est, et habitávit in nobis: * Et vídimus glóriam ejus, glóriam quasi Unigéniti a Patre, plenum grátiæ et veritátis.
        V. Omnia per ipsum facta sunt, et sine ipso factum est nihil.
        R. Et vídimus glóriam ejus, glóriam quasi Unigéniti a Patre, plenum grátiæ et veritátis.
      status: verified
