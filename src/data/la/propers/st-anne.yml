# Verified against Divinum Officium (Monastic Tridentinum 1617) — read
# directly from the reference engine's own real-date output (2028-07-26).
# Same convention as data/propers/temporal/*-collect.yml.
collect:
  text: |
    Orémus.
    Deus, qui beátæ Annæ grátiam conférre dignátus es, ut Genitrícis unigéniti Fílii tui mater éffici mererétur: concéde propítius; ut, cujus solémnia celebrámus, ejus apud te patrocíniis adjuvémur. Per eúmdem Dóminum nostrum Jesum Christum Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.

    R. Amen.
  status: verified

# Own proper antiphon (st-anne-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-a-holy-woman (`[Versum 2]`, the tag
# actually paired with `[Ant 2]` in the reference engine's Commune files
# for a mere commemoration -- confirmed against this exact category via
# an independently live-verified precedent elsewhere in this app). Collect
# is the saint's own real proper (st-anne-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Date ei de fructu mánuum suárum, et laudent eam in portis ópera ejus.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, qui beátæ Annæ grátiam conférre dignátus es, ut Genitrícis unigéniti Fílii tui mater éffici mererétur: concéde propítius; ut, cujus solémnia celebrámus, ejus apud te patrocíniis adjuvémur. Per eúmdem Dóminum nostrum Jesum Christum Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.

    R. Amen.
  status: verified

# St. Anne: proper Matins hymn, Latin/SanctiM/07-26r.txt's [Hymnus Matutinum]. English from English/SanctiM/07-26r.txt.
# Before this file the saint fell to the Common's hymn.
matins-hymn:
  text: |
    Gaude, mater Anna,
    Gaude mater sancta,
    Cum sis Dei facta
    Genetrícis Dei.

    Plaude tali natæ
    Vírgini Maríæ;
    Ejus genitóri
    Jóachim congáude

    In hac nostra terra
    Primo benedícta,
    Quæ fuit in Eva
    Quondam maledícta.

    Ergo sume laudes
    Quas damus ovántes;
    Nos ab omni sorde
    Tua prece terge.

    Sit laus Deo Patri,
    Summo Christo decus,
    Spirítui Sancto
    Tribus honor unus.
    Amen.
  status: verified

# St. Anne: proper Lauds hymn, Latin/SanctiM/07-26r.txt's [Hymnus Laudes]. The reference has no English for it, so the English is a fresh translation, marked draft.
# Before this file the saint fell to the Common's hymn.
lauds-hymn:
  text: |
    Succédit nocti lúcifer,
    Quem mox auróra séquitur,
    Solis ortum prænúntians
    Mundum lustrántis lúmine.

    Christus sol est justítiæ,
    Auróra Mater grátiæ,
    Quam, Anna, præit rútilans
    Legis propéllens ténebras.

    Anna, radix ubérrima,
    Arbor tu salutífera,
    Virgam prodúcens flóridam
    Quæ Christum nobis áttulit.

    Glória tibi Dómine,
    Qui natus es de Vírgine,
    Cum Patre et sancto Spíritu,
    In sempitérna sǽcula.
    Amen.
  status: verified

# St. Anne: proper Vespers hymn, Latin/SanctiM/07-26r.txt's [Hymnus Vespera]. The reference has no English for it, so the English is a fresh translation, marked draft.
# Before this file the saint fell to the Common's hymn.
vespers-hymn:
  text: |
    Omnis sanctórum cóncio
    Matrem colláudet Vírginis,
    De cujus puerpério,
    Salus procéssit hóminis.

    Hæc prolem devotíssime
    Pétiit a Patre lúminum,
    Et méruit digníssime
    Maríam decus vírginum.

    Ex Jóachim, quem hábuit
    Vitæ virum exímiæ,
    Anna Maríam génuit,
    Matrem Regis justítiæ.

    Stirps Jesse clara déluit
    Evæ matris oppróbrium,
    Dum Anna prolem génuit,
    Florem sanctórum ómnium.

    Glória tibi Dómine,
    Qui natus es de Vírgine,
    Cum Patre et Sancto Spíritu
    In sempitérna sǽcula.
    Amen.
  status: verified

