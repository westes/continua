# Read directly from web/www/horas/Latin/Sancti/06-18.txt's own [Oratio]
# and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui Ecclésiam tuam beáti Ephræm Confessóris tui et Doctóris mira eruditióne et
    præcláris vitæ méritis illustráre voluísti: te súpplices exorámus; ut, ipso intercedénte,
    eam advérsus erróris et pravitátis insídias perénni tua virtúte deféndas.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# No proper antiphon of his own -- standard de-Communi text, paired with the standard de-Communi commemoration versicle for common-of-a-confessor-doctor (non-Bishop, C5a), same category and same Ant2/Versum2 as st-peter-canisius-commemoration.yml/st-john-damascene-commemoration.yml (not yet independently live-verified for this specific category, marked draft). Collect is the saint's own real proper (st-ephraim-of-syria-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui Ecclésiam tuam beáti Ephræm Confessóris tui et Doctóris mira eruditióne et
    præcláris vitæ méritis illustráre voluísti: te súpplices exorámus; ut, ipso intercedénte,
    eam advérsus erróris et pravitátis insídias perénni tua virtúte deféndas.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2-3 readings for St. Ephraim of Syria, Deacon, Confessor,
# Doctor of the Church (June 18). Sourced from
# web/www/horas/Latin/Sancti/06-18.txt, English/Sancti/06-18.txt.
#
# Nocturn 2 (Lectio4-6): one continuous vita, no genuine source break --
# same combining convention st-francis-de-sales.yml/st-alphonsus-liguori.yml use.
#
# Nocturn 3: the source's own Gospel is Matt 5:13-19 ("Vos estis sal
# terræ"), the same Common-of-a-Confessor-Doctor pericope already
# transcribed for st-peter-canisius.yml/st-isidore-of-seville.yml --
# reused verbatim rather than re-translated. The homily, though, is
# genuinely Ephraim's own (Lectio7-8, "Sermo de vita et exercitatione
# monastica" -- not a cross-reference to another saint's Common the way
# most non-bishop confessors' Nocturn 3 is), so it's transcribed here
# rather than left to the generic Common pool.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Ephræm génere Syrus, Nisibéno patre natus est. Adhuc júvenis ad sanctum Jacóbum epíscopum se cóntulit, a quo baptizátus, brevi ita sanctitáte et doctrína profécit, ut in schola Nísibi, Mesopotámiæ urbe, florénte magíster fúerit constitútus. Post Jacóbi epíscopi mortem, Nísibi a Persis capta, Edéssam proféctus est; ubi primum in monte inter mónachos consédit, deínde, ut plúrimos ad se confluéntes hómines vitáret, vitam duxit eremíticam. Edesséne ecclésiæ diáconus ordinátus, et ob humilitátem sacerdótium recúsans, ómnium virtútum splendóre enítuit, et pietátem et religiónem vera sapiéntiæ professióne sibi comparáre satégit. Spem omnem in solo Deo defíxam habens, quǽvis humána ac transitória contémnens, divína ac sempitérna assídue concupiscébat.

        Cæsaréam Cappadóciæ, divíno ductus Spíritu, cum petísset, ipsum ibi os Ecclésiæ Basílium vidit, et úterque mútua consuetúdine opportúnum in modum usus est. Ad innúmeros errores refelléndos, qui, tunc témporis grassántes, Ecclésiam Dei divexábant, atque ad mystéria Dómini nostri Jesu Christi sédulo illustránda, plúrimas édidit lucubratiónes, Syro sermóne compósitas, et fere omnes in linguam Græcam versas; atque, teste sancto Hierónymo, ipse ad tantum venit claritúdinem, ut, post lectiónem Scripturárum, publíce in quibúsdam ecclésiis ejus scripta recitaréntur.

        Univérsa illíus ópera, tam spléndido doctrínæ lúmine reférta effecérunt, ut idem Sanctus, adhuc vivens, tamquam Ecclésiæ Doctor, magno honóre hábitus fúerit. Métrica quoque cántica composuit in laudem beatíssimæ Vírginis Maríæ ac Sanctórum: quam ob causam a Syris Spíritus Sancti cíthara mérito fuit appellátus. In mirífica ac pia devotióne erga eándem Vírginem immaculátam primum excélluit. Méritis plenus, Edéssæ, in Mesopotámia, décimo quarto Kaléndas Júlii, decéssit sub Valénte príncipe: eúmque, instántibus plúribus Sanctæ Románæ Ecclésiæ Cardinálibus, Patriárchis, Archiepíscopis, Epíscopis, Abbátibus, et religiósis famíliis, Benedíctus Papa décimus quintus, ex Sacrórum Rítuum Congregatiónis consúlto, universális Ecclésiæ Doctórem declarávit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 5:13-19
      text: 'In illo témpore: Dixit Jesus discípulis suis: Vos estis sal terræ. Quod si sal evanúerit, in quo saliétur? Ad níhilum valet ultra, nisi ut mittátur foras, et conculcétur ab homínibus. Vos estis lux mundi. Non potest cívitas abscóndi supra montem pósita. Neque accéndunt lucérnam, et ponunt eam sub módio, sed super candelábrum, ut lúceat ómnibus, qui in domo sunt. Sic luceat lux vestra coram homínibus, ut vídeant ópera vestra bona, et gloríficent Patrem vestrum, qui in cœlis est. Nolíte putáre, quóniam veni sólvere legem aut prophétas: non veni sólvere, sed adimplére. Amen, quippe dico vobis, donec tránseat cœlum et terra, jota unum aut unus apex non præteríbit a lege, donec ómnia fiant. Qui ergo sólverit unum de mandátis istis mínimis, et docúerit sic hómines, mínimus vocábitur in regno cœlórum: qui autem fécerit et docúerit, hic magnus vocábitur in regno cœlórum.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ephraim the Syrian, Sermon on the Monastic Life and its Practice
      text: |-
        Præclárum est bonum inchoáre atque perfícere, et gratum Deo esse et útile próximo, ipsíque summo ac dulcíssimo rectóri nostro Christo Jesu placére, qui ait: Vos estis sal terræ, et colúmna cælórum. Labor afflictiónis tuæ, dilectíssime, tamquam somnus est; porro labóris quies inenarrábilis atque inæstimábilis. Atténde ergo tibi ipsi sollícite, ne utrúmque páriter amíttas, dum néutrum plene persequáris, præséntem scílicet sempiternámque lætítiam. Stude pótius perféctam virtútem cónsequi, ornátam atque insignítam ómnibus quæ díligit Deus. Hanc si assequáris, numquam irritábis Deum, neque próximum tuum violábis.

        Porro virtus ista, única uníus speciéi dícitur, variárum virtútum in se ipsa habens pulchritúdinem. Diadéma régium absque pretiósis lapídibus candentibúsque margarítis connécti texíque non potest; ita et hæc única virtus sine variárum fulgóre virtútum constáre néquit. Est enim proféctu simíllima diadémati régio. Nam, ut illi, si lapis unus aut margaríta defúerit, in régio cápite lucére plénius néquit; ita et hæc única virtus, nisi virtútum cetérarum honóre conséritur, perfécta virtus non appellátur. Símilis item est pretiosíssimis épulis, exquisitíssimis condiméntis præparátis, sed sale caréntibus. Sicut enim pretiósi illi cibi sine sale comédi néqueunt; ita et ista virtus unifórmis, si variárum virtútum glória et honóre decorétur, absit autem Dei próximique diléctio, vilis prorsus atque contemptíbilis est.
      status: verified
