# Collect of The Commemoration of the Most Holy Passion of Our Lord Jesus Christ. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp2-2-PassionisDNJC.txt (Duplex majus, Tuesday after Sexagesima; its own Oratio and Lectio4-9, the rest "ex Commune/Votiva/V6", the votive office of the Passion). English is this project's own translation, marked draft.
collect:
  text: |
    Orémus.
    Omnípotens sempitérne Deus, qui humáno géneri, ad imitándum humilitátis exémplum, Salvatórem nostrum carnem súmere et crucem subíre fecísti: concéde propítius; ut, sicut sollémnem Commemoratiónem Passiónis ejus celebrámus, ita et patiéntiæ ipsíus habére documénta et resurrectiónis consórtia mereámur.
    Per eúmdem Dóminum nostrum Jesum Christum Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp2-2-PassionisDNJC.txt (Duplex majus, Tuesday after Sexagesima; its own Oratio and Lectio4-9, the rest "ex Commune/Votiva/V6", the votive office of the Passion). English is this project's own translation, marked draft.
matins-hymn:
  text: |
    Áspice, infami Deus ipse ligno
    Pendet, effuso madidus cruóre;
    Áspice, immiti manus alma clavo
    Finditur alte.

    Hunc, velut pravi scéleris minístrum;
    Inter indignos médium latrones,
    Cerne; crudelis fuit ista gentis
    Dira volúntas.

    Pallet heu! vultus; caput ecce lapsum
    Flectitur; clausis óculis, Redémptor
    Spíritum sacro, méritis onustum,
    Fundit ab ore.

    O cor, æs durum superas, gemendo,
    Ni scelus tergas; tua culpa Christum
    Stipiti affixit; tua culpa morti
    Súbdidit atræ.

    Sit Deo ætérnum decus omne in ævum,
    Qui pius nostri géneris Redémptor,
    Críminis labem miseris nocentem
    Sánguine tersit.
    Amen.
  status: verified

