# Verified against Divinum Officium (Monastic Tridentinum 1617), 2026-08.
# Pulled from the reference engine's own era-specific calendar table
# (web/www/Tabulae/Kalendaria/1570.txt + M1617.txt, own title
# "S. Felicitatis Martyris") and its own source file, not the merged per-date
# files those tables' fileref points at directly -- see TODO.md.
collect:
  text: |
    Orémus.
    Præsta, quǽsumus, omnípotens Deus: ut, beátæ Felicitátis Mártyris tuæ solémnia recenséntes, méritis ipsíus protegámur et précibus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-martyr (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). st-felicitas has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-felicitas-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Qui odit * ánimam suam in hoc mundo, in vitam ætérnam custódit eam.
    V. Justus ut palma florébit.
    R. Sicut cedrus Líbani multiplicábitur.
    Orémus.
    Præsta, quǽsumus, omnípotens Deus: ut, beátæ Felicitátis Mártyris tuæ solémnia recenséntes, méritis ipsíus protegámur et précibus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. Felicitas, Martyr (Nov 23, sharing
# the date with St. Clement — see st-clement.yml). No genuine SanctiM
# match: the only SanctiM file for this date bases `@Sancti/11-23`
# (Clement, not Felicitas) — a missed pre-1955-pool candidate rather
# than a genuine SanctiM case (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/11-23cc.txt, English/Sancti/11-23cc.txt.
# Single lesson (simplex-feast Lectio93), one continuous excerpt of
# Pope St. Gregory the Great's homily. No responsory given in the
# source.
#
# Verified 2026-09-05 (Gospel-pairing sweep): this is a genuine
# Simplex-rank stub (Rank: "Simplex;;1.1;;vide C7") with a single
# combined lesson (Lectio93), not a 9-lesson office with distinct
# Nocturns -- there is no Nocturn 3 slot at all here, so no Gospel
# pericope to pair.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope St. Gregory the Great, Homily 3 on the Gospels
      text: Beáta Felícitas, cujus hódie natalícia celebrámus, septem fílios sic post se tímuit vivos in carne relínquere, sicut carnáles paréntes solent metúere ne mórtuos præmíttant. In persecutiónis enim labóre deprehénsa, filiórum corda in amóre supérnæ pátriæ prædicándo roborávit; et parturívit spíritu quos carne pepérerat, ut prædicatióne páreret Deo quos carne pepérerat mundo. Numquid ergo hanc féminam Mártyrem díxerim? Sed plus quam Mártyrem; quæ, septem pignóribus ad regnum præmíssis, tot ante se mórtuos transmísit. Ad pœnam prima venit, sed pervénit octáva.
      status: verified
