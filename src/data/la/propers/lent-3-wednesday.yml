# Matins Nocturn content for Wednesday of Lent week 3 — read from
# web/www/horas/{Latin,English}/Tempora/Quad3-3.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad3-3.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Jerome
# homily split only to fill the fixed 3-lesson slot count). Responsory1
# is a cross-reference (@Tempora/Quad3-0:Responsory7) — used here per
# the "the first one, when several collapse" convention.
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Matt 15:1-20
      text: 'In illo témpore: Accessérunt ad Jesum ab Jerosólymis scribæ et pharisǽi, dicéntes: Quare discípuli tui transgrediúntur traditiónem seniórum? Non enim lavant manus suas, cum panem mandúcant. Ipse autem respóndens, ait illis: Quare et vos transgredímini mandátum Dei propter traditiónem vestram? Nam Deus dixit: Honóra patrem et matrem. Et: Qui male díxerit patri vel matri, morte moriátur. Vos autem dícitis: Quicúmque díxerit patri vel matri: munus quodcúmque est ex me, tibi próderit: et non honorificábit patrem suum aut matrem suam: et írritum fecístis mandátum Dei propter traditiónem vestram. Hypócritæ, bene prophetávit de vobis Isaías, dicens: Pópulus hic lábiis me honórat: cor autem eórum longe est a me. Sine causa autem colunt me, docéntes doctrínas et mandáta hóminum. Et convocátis ad se turbis, dixit eis: Audíte, et intellégite. Non quod intrat in os, coínquinat hóminem: sed quod procédit ex ore, hoc coínquinat hóminem. Tunc accedéntes discípuli ejus, dixérunt ei: Scis, quia pharisǽi, audíto verbo hoc, scandalizáti sunt? At ille respóndens, ait: Omnis plantátio, quam non plantávit Pater meus cœléstis, eradicábitur. Sínite illos: cæci sunt et duces cæcórum. Cæcus autem si cæco ducátum præstet, ambo in fóveam cadunt. Respóndens autem Petrus, dixit ei: Edíssere nobis parábolam istam. At ille dixit: Adhuc et vos sine intelléctu estis? Non intellégitis, quia omne, quod in os intrat, in ventrem vadit, et in secéssum emíttitur? Quæ autem procédunt de ore, de corde éxeunt, et ea coínquinant hóminem: de corde enim éxeunt cogitatiónes malæ, homicídia, adultéria, fornicatiónes, furta, falsa testimónia, blasphémiæ. Hæc sunt, quæ coínquinant hóminem. Non lotis autem mánibus manducáre, non coínquinat hóminem.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Jerome, Priest, Book 2, Commentary on Matthew, ch. 15
      text: |-
        Mira pharisæórum scribarúmque stultítia. Dei Fílium árguunt, quare hóminum traditiónes et præcépta non servet: Non enim lavant manus suas, cum panem mandúcant. Manus, id est ópera, non córporis útique, sed ánimæ lavándæ sunt, ut fiat in illis verbum Dei. Ipse autem respóndens ait illis: Quare et vos transgredímini mandátum Dei propter traditiónem vestram? Falsam calúmniam vera responsióne confútat. Cum, inquit, vos propter traditiónem hóminum præcépta Dómini negligátis: quare discípulos meos arguéndos putátis, quod seniórum jussa parvipéndant, ut Dei scita custódiant?

        Nam Deus dixit: Honóra patrem et matrem; et, Qui maledíxerit patri, vel matri, morte moriátur. Vos autem dícitis: Quicúmque díxerit patri, vel matri: Munus quodcúmque est ex me, tibi próderit: et non honorificábit patrem suum, aut matrem suam. Honor in Scriptúris non tantum in salutatiónibus et offíciis deferéndis, quantum in eleemósynis, ac múnerum oblatióne sentítur. Honóra, inquit Apóstolus, víduas, quæ vere víduæ sunt. Hic honor donum intellégitur. Et in álio loco: Presbýteri dúplici honóre honorándi sunt, máxime qui labórant in verbo et doctrína Dei. Et per hoc mandátum jubémur bovi trituránti os non cláudere: et dignus sit operárius mercéde sua.

        Præcéperat Dóminus, vel imbecillitátes, vel ætátes, vel penúrias paréntum consíderans, ut fílii honorárent, étiam in vitæ necessáriis ministrándis, paréntes suos. Hanc providentíssimam Dei legem voléntes scribæ et pharisǽi subvértere, ut impietátem sub nómine pietátis indúcerent, docuérunt péssimos fílios, ut si quis ea, quæ paréntibus offerénda sunt, Deo vovére volúerit, qui verus est pater, oblátio Dómini præponátur paréntum munéribus: vel certe ipsi paréntes, quæ Deo consecráta cernébant, ne sacrilégii crimen incúrrerent, declinántes, egestáte conficiebántur. Atque ita fiébat, ut oblátio liberórum sub occasióne templi et Dei, in sacerdótum lucra céderet.
      responsory: |-
        R. Mérito hæc pátimur, quia peccávimus in fratrem nostrum, vidéntes angústias ánimæ ejus, dum deprecarétur nos, et non audívimus: * Idcírco venit super nos tribulátio.
        V. Dixit Ruben frátribus suis: Numquid non dixi vobis, Nolíte peccáre in púerum; et non audístis me?
        R. Idcírco venit super nos tribulátio.
      status: verified
