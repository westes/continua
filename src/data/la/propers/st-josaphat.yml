# Matins Nocturn 2 and 3 reading for St. Josaphat, Bishop and Martyr. Sourced directly from
# web/www/horas/Latin/Sancti/11-14.txt, English/Sancti/11-14.txt.
# Lectio4-6 combined into one reading, one continuous vita. Nocturn 3: the Gospel pericope then the saint's own homily.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Jósaphat Kuncewítius, nobílibus et catholicis paréntibus Vladimíriæ in Volhinia natus, cum puerulus matrem de Christi passióne loquentem audíret, jaculo e látere imaginis Jesu crucifixi immisso, vulnus in corde suscépit. Dei amóre incénsus, adeo oratióni aliisque piis opéribus instare cœpit, ut provectióribus adolescéntibus exemplo et admiratióni esset. Vicennis inter claustrales sancti Basilíi alumnos monasticam regulam proféssus, mirum quos in evangelica perfectióne progréssus fécerit. Nudis pédibus, frigidíssima licet sæviénte regiónis híeme, incedébat; carnes numquam, vinum nonnisi ex obediéntia adhibuit, asperrimoque cilício ad obitum usque corpus afflixit. Castitátis florem, quem ab adolescéntia Virgini Deiparæ vóverat, inviolátum servávit. Virtútis doctrinæque ejus brevi sic fama percrébuit, ut, quamvis júnior, Bytenii monasterio præfectus sit mox Vilnénsis archimandríta, ac demum archiepíscopus Polocénsis, invitus quidem, sed Catholicis gestiéntibus, fúerit renuntiatus.

        Hac dignitate auctus, nihil de priori vivéndi ratióne remíttens, nonnisi divinum cultum et creditárum sibi óvium salútem cordi hábuit. Catholicæ unitátis ac veritátis strenuus propugnator, totis viribus adlaborávit, ut schismaticos hæreticosque ad communiónem cum beáti Petri Sede reduceret. Summum Pontificem ejusque potestátis plenitúdinem ab impudentíssimis impiórum calumniis et erróribus, qua conciónibus, qua scriptis pietáte ac doctrina refertis, defendere numquam déstitit. Episcopalem jurisdictiónem et Ecclésiæ bona a láicis usurpáta vindicávit. Incredibile dictu est quot hæreticos in sinum matris Ecclésiæ revocáverit. Uniónis vero Græcæ Ecclésiæ cum Latina Josephátum promotórem exstitisse præclaríssimum, étiam pontifícia oracula diserte testántur. Ad hæc, et templi Dei decóri instaurando, et sacrárum vírginum exstruéndis ædibus, aliisque piis opéribus juvandis, mensæ suæ proventus ultro erogávit. In páuperes adeo effúsus, ut, cum olim inópiæ cujusdam víduæ sublevandæ nihil occurreret, episcopale pallium, seu omophórion, oppignorari jusserit.

        Tot catholicæ fidei increménta perditissimórum hóminum adeo excitavérunt odia, ut, conspiratióne ínita, Christi athletam ad necem quærerent; quam sibi imminére ipse in suo ad pópulum sermóne prænuntiávit. Cum ítaque Vitépscum pastoralis visitatiónis grátia profectus esset, illi archiepiscopales invadunt ædes, obvios quosque feriunt ac cædunt. Tum vir mitíssimus quæréntibus sponte occurrit, eosque amice compellans, Filíoli, inquit, quare familiares meos cæditis? Si quid contra me habetis, ecce adsum. Hinc, ímpetu facto, eum verbéribus contundunt, telis confodiunt, ac demum, immani secúri necátum, in flumen projíciunt, die duodecima Novembris anni sexcentésimi vicesimi tertii supra millesimum, ætátis ejus quadragesimi tertii. Corpus, mirábili luce circumfusum, ex imo flúminis alveo elátum est. Sanguis Mártyris parricidis ipsis in primis prófuit, qui fere omnes, cápitis damnati, ejurato schísmate, suum scelus detestáti sunt. Cum tantus Præsul plurimis post obitum coruscaret miraculis, eum Urbanus octavus, Pontifex maximus, Beatórum honóribus decorávit. Pius nonus, tertio Kalendas Julias anni millesimi octingentesimi sexagesimi septimi, cum sæcularia Apostolórum Principum solemnia celebraréntur, coram patrum cardinalium senatu, simulque astántibus fere quingentis, patriarchis, metropolítis et epíscopis cujuscúmque ritus, qui ex toto terrárum orbe convenerant; hunc ecclesiásticæ unitátis assertórem, primum ex orientálibus, solemni ritu in Vaticana basilica Sanctórum ordini accensuit. Cujus Offícium ac Missam Leo décimus tertius, summus Pontifex, ad universam exténdit Ecclésiam.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joannes 10:11-16
      text: 'Ego sum pastor bonus. Bonus pastor animam suam dat pro ovibus suis. Mercenarius autem, et qui non est pastor, cujus non sunt oves propriae, videt lupum venientem, et dimittit oves, et fugit: et lupus rapit, et dispergit oves; mercenarius autem fugit, quia mercenarius est, et non pertinet ad eum de ovibus. Ego sum pastor bonus: et cognosco meas, et cognoscunt me meae. Sicut novit me Pater, et ego agnosco Patrem: et animam meam pono pro ovibus meis. Et alias oves habeo, quae non sunt ex hoc ovili: et illas oportet me adducere, et vocem meam audient, et fiet unum ovile et unus pastor.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. John Chrysostom, Patriarch of Constantinople, 59th on John
      text: |-
        Magnum quiddam, dilectissimi, magnum, inquam, est Ecclesiæ prælatio, et quæ multa indiget sapientia et fortitudine, qualem Christus proposuit: ut animam pro ovibus ponamus, et numquam illas deseramus: ut lupo generose resistamus. Hæc enim inter pastorem et mercenarium est differentia. Alter propriæ, contemptis ovibus: alter, sua contempta, ovium semper saluti invigilat. Pastoris ergo exemplo demonstrato, deceptores duos meminit; furem mactantem et rapientem oves; et mercenarium permittentem, neque defendentem comissas.

        Quod superiori tempore Ezechiel his verbis insectatus est: Væ pastoribus Israël: nonne pascebant semetipsos? nonne greges pascuntur a pastoribus? Sed illi contrarium faciebant, quod maximæ malitiæ genus est, et plurimorum causa malorum. Idcirco inquit: Neque quod abjectum erat, reducebant: neque quod perierat quærebant: neque confractum alligabant: neque infirmum consolidabant: quoniam se, non gregem pascebant. Idem et Paulus aliis verbis significat: Omnes quæ sua sunt, quærunt, non quæ Jesu Christi.

        Verum ab utroque se dissidere ostendit Christus: ab illis quidem, qui in aliorum perniciem veniunt, cum dicat, se propterea venisse, ut vitam haberent et abundantius haberent: ab his autem, qui oves a lupis rapi negligebant, dicendo se propter eas animam ponere, ne oves perirent. Nam cum Judæi ipsum interimere vellent non propterea destitit a doctrina, neque credentes tradidit, sed perstitit, et pertulit mortem: ideo frequenter inquit: Ego sum pastor bonus. Quæ cum nullo niti testimonio viderentur (quod enim poneret animam suam, non multo post re demonstratum est; quod autem vitam haberent et abundantius haberent, eventurum erat in futuro sæculo) alterum ab altero confirmat.
      status: verified
