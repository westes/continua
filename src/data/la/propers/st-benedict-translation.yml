# Read from the reference engine: web/www/horas/Latin/SanctiM/07-11M.txt.
# [HymnusM Vespera] (Vespers hymn, "Gemma caelestis pretiosa Regis"). The
# source prints stanza 2 as "parentes.," and "repardare"; only the stray
# full stop was removed. The reference has no English for it, so the English
# is a fresh translation, marked draft.
vespers-hymn:
  text: |
    Gemma cælestis pretiosa Regis,
    Norma justorum, via monachorum,
    Nos ab immundi, Benedicte, mundi
    Subtrahe cæno.

    Tu solum spernens, cor in astra figens
    Cogis heredes fieri parentes,
    Vas Deo plenum, repardare fractum
    Promeruisti.

    Magnus in parvis eremita membris
    Vincis ætatem, superas laborem,
    Arcta Districtæ rudimenta vitæ
    Fervidus imples.

    Strage saxorum puerum sepultum,
    Mox ut orasti, prece suscitasti:
    Sensus hinc carni, caro sanitati
    Redditur æque.

    Jure sub blandæ specie columbæ
    Nesciam fellis animam sororis
    Summa stellati penetrare cæli
    Culmina cemis.

    Ipse post clarum referens triumphum,
    Celsa devicto petis astra mundo:
    Luce flammantem radiante callem
    Pallia sternunt.

    Gloria Patri, Genitæque Proli,
    Et tibi, compar utriusque semper
    Spiritus alme, Deus unus, omni
    Tempore sæcli.
    Amen.
  status: verified

# First Vespers hymn: web/www/horas/Latin/SanctiM/07-11b.txt's own [Hymnus1
# Vespera] ("Claris conjúbila Gállia"), the Translation's own hymn for its
# first evening. Second Vespers' [HymnusM Vespera] ("Gemma cælestis") is
# vespers-hymn-st-benedict-translation.yml (the default); see
# hours/resolve-common.ts's withVespersVariant. The reference has no English
# for it, so the English is a fresh translation, marked draft.
vespers-hymn/~-first:
  text: |
    Claris conjúbila Gállia láudibus,
    Lætéris Benedicti patris óssibus:
    Felix, quæ grémio cóndita próprio
    Servas membra celébria.

    Miris Itália fúlserat áctibus;
    Gallos irrádiat córpore mórtuus;
    Signis ad túmulum crébrius émicat,
    Illústrans pátriam novam.

    Hinc vatum véterum facta resúscitat,
    Morti quod líbuit mórtuus ímperat,
    Extínctum própris óssibus éxcitat:
    O quam mira poténtia!

    Jam cælo résidens, o Pater óptime,
    Divínis fámulos ímbue régulis,
    Angústum per iter scándere lárgiens,
    Dona regna perénnia.

    Cunctórum dóminans Omnipoténtia,
    Tu, qui sede poli cónspicis ómnia,
    Psalléntum plácide súscipe cántica,
    Votis, voce precántia.
    Amen.
  status: verified

