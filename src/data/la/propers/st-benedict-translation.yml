# Own [Ant Matutinum] of SanctiM/07-11M.txt: twelve numbered antiphons on psalms
# 1/2/4/5/8/10 (Nocturn 1) and 14/20/23/95/96/97 (Nocturn 2), then one antiphon for
# the three Nocturn 3 canticles. English from English/SanctiM/07-11M.txt.
# Versicles are the Common of a Confessor's ([Nocturn N Versum] in SanctiM/03-21.txt is "@Commune/C4:Versum N").
# Canticles are the Common of a Confessor's (the source numbers them 256-258).
matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 1
        antiphon: 'Vir Dei * frátribus dixit: † Caute vos ágite, quia ad vos malígnus spíritus venit.'
      - psalms:
          - 2
        antiphon: Vix, qui mandátum * detúlerat, verba compléverat, † et páries córruens puérulum oppréssit, et ruína contrívit.
      - psalms:
          - 4
        antiphon: Tunc cellam clausit, * et oratióni instántius quam solébat, incúbuit.
      - psalms:
          - 5
        antiphon: Mira res! * Eádem hora puérulum incólumem atque ut prius valéntem ad labórem remísit.
      - psalms:
          - 8
        antiphon: Omnipoténtis * Dei fámulus, preces Jesu Christo Dómino fundens, † antíquum hostem de obsésso hómine prótinus éxpulit.
      - psalms:
          - 10
        antiphon: Imprévit Deus, * quod fidéli fámulo Benedícto promíserat, † ut ánimas custodíret.
    versicle:
      v: Amávit eum Dóminus, et ornávit eum.
      r: Stolam glóriæ índuit eum.
  nocturn2:
    groups:
      - psalms:
          - 14
        antiphon: 'Venerábilis * Benedíctus dixit: † Signa cor tuum, frater, signa cor tuum.'
      - psalms:
          - 20
        antiphon: Hódie quidem * minus est, sed die crástina abundánter habébitis.
      - psalms:
          - 23
        antiphon: Et sequénti die * ducénti farínæ módii ante fores cellæ invénti sunt.
      - psalms:
          - 95
        antiphon: Tanti mériti * apud Jesum Christum iste vir fuit, † ut corpus illíus terra proíceret, qui Benedícti grátiam non habéret.
      - psalms:
          - 96
        antiphon: Nemo * de ejus promissiónibus dubitáre potest, † qui uno eodémque moménto, pro vítreo vase pene vácuo, plenum óleo dólium réddidit.
      - psalms:
          - 97
        antiphon: Benedíctus * in eo specu, in quo prius inhabitávit, † nunc usque, si peténtium fides éxigat, miráculis corúscat.
    versicle:
      v: Os justi meditábitur sapiéntiam.
      r: Et lingua ejus loquétur judícium.
  nocturn3:
    antiphon: Monachórum * Patriárcham collaudémus cánticis, et Patrónum celebrémus gloriósum miráculis.
    canticles:
      - refs:
          - book: sir
            chapter: 14
            verses: '22'
          - book: sir
            chapter: 15
            verses: 3-4
          - book: sir
            chapter: 15
            verses: '6'
      - refs:
          - book: jer
            chapter: 17
            verses: 7-8
      - refs:
          - book: sir
            chapter: 31
            verses: 8-11
    versicle:
      v: Lex Dei ejus in corde ipsíus.
      r: Et non supplantabúntur gressus ejus.

# Own [Ant Laudes] of SanctiM/07-11M.txt (five antiphons, one per line, in order:
