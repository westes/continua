# Matins readings for the Translation of St. Benedict (Jul 11), from
# web/www/horas/Latin/SanctiM/07-11M.txt (English/SanctiM/07-11M.txt where it exists).
#
# Nocturn 1 is not authored here: the bible reading plan supplies it (sanctoral feasts carry
# no proper scripture lessons outside their Gospel). Nocturn 2: Lectio5-8, one continuous sermon of St. Bernard, combined
# into one reading with Responsory5 (the first of the group, this store's
# convention). Nocturn 3: the full Matt 19:27-29 pericope (same text as the
# Transitus's own reading) then St. Peter Damian's Sermon 9 on St. Benedict
# (same text as the Transitus), with the reference's Responsory9. The
# reference's own Lectio9-12 here is Bede's homily for Benedict Biscop, a generic
# Matt 19:27 homily that never mentions the founder; replaced deliberately.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Bernard, Abbot, Sermon on the Birthday of St. Benedict
      text: |
        Gloriósi Patris nostri Benedícti dulcíssimum nomen cum omni vobis jucunditáte amplecténdum est et honorándum; quoniam ipse Dux noster, ipse Magíster et Légifer noster est. Refíciat vos sánctitas ejus, justítia ejus, píetas ejus. Arbor fuit beátus Benedíctus, grandis atque fructífera, tanquam lignum, quod plantátum est secus decúrsus aquárum. Sic fuit plantátus secus decúrsus aquárum, quóniam fructum suum dedit in témpore suo. De fructu ejus sunt illi tria, quæ supérius tétigi: sánctitas ejus, justítia ejus, píetas ejus. Sanctitátem mirácula probant, doctrína pietátem, vita justítiam.

        Sed quómodo tibi appóno ejus mirácula? Numquid ut mirácula fácere velis? Nequáquam: sed ut miráculis ejus innitáris, vidélicet ut confídas et gáudeas, quod sub tali pósitus es pastóre, quod tantum meruísti habére Patrónum. Omníno enim valde potens est in cælis, qui tam potens éxstitit in terris: secúndum magnitúdinem grátiæ, magnitúdine glóriæ exaltátus. Nam et juxta radícum quantitátem rami prodíre noscúntur et quot radícibus arbor innítur, tot ramis, sicut ajunt, decorátur. Sic ergo, licet non habeámus nostra, consolátio magna nobis esse debent Patróni nostri mirácula.

        Doctrína vero ínstruit nos, et dírigit gressus nostros in viam pacis. Porto vitæ justítia omníno róborat et ánimat nos, ut tanto magis accendámur ad agénda quæ dócuit, quanto certi sumus, eum non ália docuísse quam fécerit. Sermo quidem vivus et efficax exémplum óperis est, plúrimum fáciens suadíbile quod dícitur, dum monstrat factíbile quod suadétur. In hunc ergo modum sánctitas confórtat, píetas infórmat, justítia confírmat.  Quantæ enim pietátis fuit, quod non solum præséntibus prófuit, sed et pro futúris sollícitus fuit? Non solum his, qui tunc errant, fructum tulit hæc arbor, sed usque hódie fructus ejus et manet et crescit.

        Diléctus plane Deo et homínibus, cujus non sola præséntia in benedictióne fuit, sicut sunt multi dilécti Deo soli, quia soli Deo jam cógniti: sed et memória ejus étiam nunc in benedictióne est. Nam et usque hódie in tríplicem amóris Dómini confessiónem, tríplici hoc fructu pascit Dómini gregem. Pascit vita, pascit doctrína, pascit et intercessióne. Per quem incessánter adjúti, fructificáte et vos, caríssimi, quóniam in hoc pósiti estis, ut eatis et fructum afferátis.
      responsory: |
        R. In aqua ex petra prodúcta, Moyses; in ferro vero, quod ex profúndo atque rédiit, Elisǽus; † in aquæ itínere, Petrus; in corvi obediéntia, Elías;
        * In luctu autem mortis inimíci, David exhibétur.
        V. Vir iste spíritu ómnium justórum plenus fuit.
        R. In luctu autem mortis inimíci, David exhibétur.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 19:27-29
      text: 'In illo témpore: Dixit Petrus ad Jesum: Ecce, nos relíquimus ómnia, et secúti sumus te: quid ergo erit nobis? Jesus autem dixit illis: Amen, dico vobis, quod vos, qui secúti estis me, in regeneratióne, cum séderit Fílius hóminis in sede majestátis suæ, sedébitis et vos super sedes duódecim, judicántes duódecim tribus Israël. Et omnis, qui relíquerit domum, vel fratres, aut soróres, aut patrem, aut matrem, aut uxórem, aut fílios, aut agros, propter nomen meum, céntuplum accípiet, et vitam ætérnam possidébit.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Peter Damian, Bishop, Sermon 9, On the Nativity of St. Benedict, Abbot (on Matt 19:27-29)
      text: |-
        Ecce nos relíquimus ómnia, et secúti sumus te. Solémne verbum, magna promíssio, opus sanctum, dignum benedictióne: relínquere ómnia, et sequi Christum. Hæc sunt verba voluntárie persuasória paupertátis, quæ monastéria genuérunt, quæ claustra mónachis, anachorétis silvas copiósius replevérunt. Hæc enim sunt, de quibus psallit Ecclésia: Propter verba labiórum tuórum ego custodívi vias duras; perceptúra requiem pro labóre, pro paupertáte divítias, pro tribulatióne mercédem. Magnum revéra est relínquere ómnia, sed majus Christum sequi, cum multos ómnia reliquísse, nec Christum secútos fuísse legámus. Hoc opus, hic labor est, hic salútis humánæ summa consístit; nec Christum póssumus sequi, nisi ómnia relinquámus, quia exsúltat ut gigas ad curréndam viam, et onerátus eum sequi non potest.

        Ecce, inquit, nos relíquimus ómnia, non solum facultátes mundi, sed et ánimi quoque cupiditátes: neque enim relínquit ómnia, qui retínuit vel seípsum; immo vero nihil prodest, sine seípso cétera reliquísse, quandóquidem nullum áliud onus est grávius hómini, quam homo ipse. Quis enim tyránnus crudélior, quæ sǽvior potéstas hómini, quam hóminis ipsíus volúntas? Séquitur: Quid ergo erit nobis? Jam ómnia relíquit Petrus, jam non solum séquitur, sed et diu secútus est; et nunc primum intérrogat, quidnam sit acceptúrus. Quid est, Petre? Nonne obediéntiam promisísti in auris auditióne, non in pacti conventióne? Sed audíte jam, quid loquátur Dóminus Deus, et atténdite spem, in qua mundo fluctuánte speráre debémus: Sedébitis, ait Dóminus, ait Véritas. Solémnis séssio, grata quies, plena sufficiéntia.

        Sed ne magnæ promissiónis dulcédinem longánimis expectátio contorquéret, mentis nostræ mobilitátem sermónem témperat dulcióri. Novit enim ipse figméntum nostrum, quóniam dilatiónis moras pusillanímitas nostra non sústinet; ideóque benignitáte sua huic quoque obviat cogitatióni, et occúrrit étiam ex hac parte, dicens: Et omnis, qui relíquerit domum, aut patrem, aut matrem, aut fratrum, aut uxórem, aut agros, aut fílios, propter nomen meum, céntuplum accípiet, et vitam ætérnam possidébit. Obstrúctum est certe os loquéntium iníqua. Jamque confundántur omnes iníqua agéntes supervácue. Habémus enim promissiónem vitæ hujus, quæ nunc est, páriter et futúræ, manifestúmque est præséntis témporis esse céntupli promissiónem, ex eo nimírum quod séquitur: Et vitam ætérnam possidébit.

        Qui ergo nondum céntuplum accepérunt, scruténtur corda sua, et univérsa mánuum suárum stúdia diligénter exáminent; nec dúbium, quin invéniant ángulum et diversórium, quod Salvátor non novit. Sed quid est céntuplum istud, nisi consolatiónes visitationésque et primítiæ Spíritus, qui super mel dulcis est, nisi testimónium consciéntiæ nostræ, nisi læta et jucundíssima justórum expectátio, nisi memória abundántiæ suavitátis Dei, et magna vere multitúdo dulcédinis ejus, quam nec expértis necésse est dícere, nec inexpértis illis verbis exprímere quiquam potest? Cui vero sic speciáliter totus evangélicæ lectiónis excúrsus assignári potest, quemádmodum Patri et Magístro nostro beáto Benedícto? Hic a puerítia mundum cum flore relíquit, et curréntem Christum cursu rapidíssimo secútus est, nec déstitit, donec consequerétur.
      responsory: |
        R. Quemádmodum Elías, cǽlitus imbres, o Pater, deduxísti oleúmque celériter efflúere fecísti,
        * Mórtuos suscitásti, aliáque innúmera perpetrásti mirácula.
        V. Idcírco memóriam tuam devóta mente celebrámus, o Benedícte.
        R. Mórtuos suscitásti, aliáque innúmera perpetrásti mirácula.
      status: verified
