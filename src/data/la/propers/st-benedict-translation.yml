# Read from the reference engine: web/www/horas/Latin/SanctiM/07-11M.txt.
# [Oratio]; 07-11b.txt (the Translation) takes it unchanged from 07-11M with
# "Solemnitátem" -> "Translatiónem". English from English/SanctiM/07-11M.txt
# reworded to this project's collect phrasing, marked draft.
collect:
  text: |
    Orémus.
    Deus, qui beatíssimum Confessórem tuum Benedíctum ómnium justórum spíritu replére dignátus es: † concéde nobis fámulis tuis, ejus Translatiónem celebrántibus; ut, ejúsdem spíritu repléti, quod te donánte promísimus fidéliter adimpleámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Antiphon and versicle as St. Benedict's own commemoration bundle
# (commemoration-st-benedict.yml); collect is the Translation's own.
commemoration:
  text: |
    Ant. Sanctíssime Conféssor Dómini, Monachórum pater et dux, Benedícte, intercéde pro nostra omniúmque salúte.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui beatíssimum Confessórem tuum Benedíctum ómnium justórum spíritu replére dignátus es: † concéde nobis fámulis tuis, ejus Translatiónem celebrántibus; ut, ejúsdem spíritu repléti, quod te donánte promísimus fidéliter adimpleámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Read from the reference engine: web/www/horas/Latin/SanctiM/07-11M.txt.
# [HymnusM Matutinum] (Matins hymn, "Signifer invictissime"); English from
# English/SanctiM/07-11M.txt's [Hymnus Matutinum].
matins-hymn:
  text: |
    Sígnifer invictíssime,
    Sacráque dux milítiæ,
    Nos, Benedícte, válido
    Precum defénde brácchio.

    His armis exsecrábilem
    Leónis vince rábiem,
    Quibus olim tetérrimam
    Pellis ab ore mérulam.

    Urtícre junctæ vépribus
    Vulnus curant vulnéribus;
    Flammáta mens divínitus
    Ignem exstínguit ígnibus.

    Crucem mittens ut lápidem
    Venéni frangit cálicem:
    Non valet mortis vásculum
    Vitæ ferre signáculum.

    Frater, quem tunc nequíssimus
    Vagum raptábat spíritus,
    Dum tua virga cǽditur,
    Stabilitáti rédditur.

    Deo Patri sit glória,
    Ejusque soli Fílio,
    Cum Spíritu Paráclito,
    Et nunc, et in perpétuum.
    Amen.
  status: verified

# Read from the reference engine: web/www/horas/Latin/SanctiM/07-11M.txt.
