matins-invitatory:
  text: Laudémus Deum nostrum * In veneratióne beati Patris nostri Benedícti.
  status: verified

# Inherited unchanged: SanctiM/07-11M.txt opens with "@SanctiM/03-21", so this part is
# St. Benedict's own (copied from lauds-capitulum-st-benedict.yml).
# --- original header follows ---
# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2033-03-21 (clean year, per st-benedict.yml's own comment)
# -- also cross-checked directly against the source's own Monastic-
# specific file (SanctiM/03-21.txt), which carries a full proper office
# for his Transitus despite the plain secular Sancti file having none.
# Own real proper chapter and own hymns at both hours; Lauds responsory
# and both hours' versicle turn out byte-identical to Common-of-a-
# Confessor-Bishop's own (reused, not duplicated separately here since
# Vespers has its own distinct responsory -- see vespers-responsory-st-
# benedict.yml). No English rendering exists in the reference engine for
# this chapter or either hymn -- own translations, marked draft.
lauds-capitulum:
  text: Ecce Conféssor magnus, quasi stella matutína in médio nébulæ, et quasi luna plena, in diébus suis lucet. Et quasi sol refúlgens, sic ille effúlsit in templo Dei.
  citation: Eccli 50:6-7
  status: verified

# Read from the reference engine: web/www/horas/Latin/SanctiM/07-11M.txt.
# [HymnusM Laudes] (Lauds hymn, "Aurora surgit aurea"). The reference has no
# English for it, so the English is a fresh translation, marked draft.
lauds-hymn:
  text: |
    Aurora surgit aurea
    Festa restaurans annua,
    Cum Benedictus arduum
    Cæli scandit palatium.

    Quanta in summis accipit,
    Qui sic in imis claruit,
    Cujus micant prodigia
    Per ampla mundi climata!

    Ejus carentum gratia
    Tellus vomit cadavera,
    Devotis unda liquida
    Sicca lambit vestigia.

    Totius orbis ambitum
    Per solis videt radium,
    Mens in auctore posita
    Subiecta cernit omnia.

    Te, Pater alme, petimus
    Pronæ mentis visceribus,
    Ut cælum des ascendere,
    Quos terrain doces spernere.

    Deo Patri sit gloria,
    Ejusque soli Filio,
    Cum Spiritu Paraclito,
    Et nunc, et in perpetuum.
    Amen.
  status: verified

