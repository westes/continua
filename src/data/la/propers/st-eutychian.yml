# Matins Nocturn 2 reading for St. Eutychian, Pope and Martyr (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/12-09-Eutychianus.txt, [Lectio4], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Eutychianus, natióne Tuscus, pátria Lunensis, Marino patre, post beáti Felícis sacerdótium Románæ Ecclésiæ Episcopátum suscépit. Constítuit fruges, fabas, et uvas super altári benedici: itémque a fidélibus nullatenus mártyrem sepeliri sine dalmatica, aut purpurato colobio. Qui cum per divérsa loca trecentos sexagínta duos mártyres sua manu sepelisset, illis et ipse sociatus, sub Numeriano Imperatóre martyrio coronátus est sexto Idus Decémbris, sepultúsque in cœmetério Callísti via Appia. Quinque ordinationibus mense Decémbri creávit Presbyteros quatuórdecim, Diáconos quinque, Epíscopos per divérsa loca novem. Vixit in Pontificátu annos octo, menses quinque, et dies áliquot.'
      status: verified
