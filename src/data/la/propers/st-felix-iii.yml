# Matins Nocturn 2 reading for St. Felix III, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/02-25-FelixIII.txt, [Lectio4]-[Lectio5], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Felix tértius, pátria Románus, natus ex nobilissima domo Anicia, et divi Gregórii Magni atavus, post Simplicium Papa ad summi pontificátus ápicem est evéctus. Hic mira ánimi constántia, tametsi Roma sub Herulis ariánis propémodum captiva viderétur, aliique Patriarchæ conciliationem Zenonis imperatóris approbassent, solus illi non communicavit. Ejúsdem de fide edíctum promulgantis, audaciam fórtiter repressit, Petrum Fullonem patriarchatu Antiocheno dejécit. Acacium Constantinopolitánum epíscopum Romam veníre cœgit, ut contra eum objectis in apostólicæ Sedis judício respónderet, ac in eúmdem senténtia excommunicationis animadvertit.

        Constítuit, ut ecclésiæ nonnisi ab epíscopis consecrarentur; semel baptizatos íterum rebaptizari sub gravibus pœnis prohibuit. Basílicam sancti Agapíti constrúxit. Anno ejus pontificátus tértio, sanctus Bárnabas Apóstolus, cum sancti Matthæi Evangélio, in Cypro Anthemio epíscopo Salaminæ appáruit; sicque prævia trina revelatióne, corpus sancti Barnabæ cum Evangélio supradicto est inventum. Duas fecit ordinatiónes mense Decémbri, quibus creávit Romæ presbyteros vigínti novem, diáconos quinque, epíscopos per divérsa loca trigínta. Quinto Kaléndas Mártii e terris excedens ad Súperos evolávit.
      status: verified
