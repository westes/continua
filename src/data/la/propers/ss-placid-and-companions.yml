# Matins Nocturn 2 reading for Ss. Placid and Companions, Martyrs (Oct
# 5) — SanctiM/10-05.txt bases `@Sancti/10-05` (the whole day, no
# Nocturn 2/3 override), so this feast's own proper content is
# sourced from the Tridentine track exactly as for a pre-1955 saint
# (see memory vu-matins-pre1955-saints, vu-matins-sanctim-saints). A
# second SanctiM variant (`SanctiM/10-05r.txt`) is its own content for
# "Ss. Maurus and Placid, disciples of St. Benedict" — not used here
# since the plain suffix already matches our target saint with real
# text.
# web/www/horas/Latin/Sancti/10-05.txt, English/Sancti/10-05.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
#
# Checked 2026-09-05 for a missing Gospel pairing: confirmed via
# horas/Latin/Sancti/10-05.txt and SanctiM/10-05.txt directly — both
# give only this single proper Lectio93 narrative ("vide C3a-1" for
# everything else), with no Lectio7-9-equivalent slot at all; the
# rest of the office (including any Nocturn 3 Gospel) falls wholesale
# to Commune/C3a-1 (Common of Several Martyrs), not proper to this
# feast. No proper Gospel pericope of this feast's own exists to pair
# against. No pairing added.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Plácidus Romæ, Tertúlllo patre in primis nóbili, natus, puer Deo oblátus et sancto Benedícto tráditus, tantum ejus disciplína et monásticæ vitæ institútis profécit, ut inter præcípuos illíus discípulos numerétur. Ab eo in Sicíliam missus, monastérium et ecclésiam in honórem sancti Joánnis Baptístæ prope Messánæ portum constrúxit, ubi cum mónachis admirábili sanctitáte vixit. Ejus viséndi causa cum eo veníssent Eutychius et Victorínus, illíus fratres, et Flávia, virgo soror, eódem témpore illuc áppulit immánis quidam piráta, Manúcha nómine; qui, capto monastério, cum Plácidum et céteros nullo modo addúcere potuísset ut Christum negárent, ipsum fratrésque illíus ac sorórem crudéliter necári jussit. Cum quibus étiam Donátus, Firmátus diáconus, Faustus aliíque trigínta mónachi, martyrii agónem felíciter consummárunt tértio Nonas Octóbris, anno salútis quingentésimo trigésimo nono.
      status: verified
