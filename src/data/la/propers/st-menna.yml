# Matins Nocturn 2 reading for St. Menna, Martyr (Nov 11, sharing the
# date with St. Martin of Tours — see st-martin-of-tours.yml). No
# genuine SanctiM match: the only SanctiM file for this date bases
# `@Sancti/11-11` (Martin, not Menna) — a missed pre-1955-pool
# candidate rather than a genuine SanctiM case (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/11-11cc.txt, English/Sancti/11-11cc.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Mennas Ægýptius, christiánus miles, in persecutióne Diocletiáni et Maximiáni imperatórum, cum pœniténtiæ causa in solitúdinem secessísset, natáli die imperatórum, quo pópulus célebri spectáculo tenebátur, in theátrum prosíliens, líbera voce Gentílium superstitiónem insectabátur. Quam ob rem comprehénsus, et, Pyrrho prǽside, in metrópoli Cottiénsium Phrýgiæ vinctus, loris crudéliter cœditur. Deínde, equúleo tortus, lampádibus ardéntibus ad corpus admótis plagísque cilício confricátis, tum per tríbulos et virgas férreas mánibus ac pédibus colligátis tractus, plumbátis étiam contúsus, demum gládio interfícitur in ignémque conjícitur. Corpus, inde a Christiánis eréptum, sepúltum est ac póstea Constantinópolim translátum.
      status: verified
