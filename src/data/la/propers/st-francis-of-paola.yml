# Matins Nocturn 2 reading for St. Francis of Paola, Confessor (Apr 2) —
# pre-1955-but-post-1617 (no SanctiM/04-02*.txt at all).
# web/www/horas/Latin/Sancti/04-02.txt, English/Sancti/04-02.txt.
# Lectio4-6 is this saint's own proper text, one continuous vita account,
# no internal break, combined into a single reading; Lectio7-9 are
# Common-of-a-Confessor (skipped). No responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Francíscus Paulæ, quod est Calábriæ óppidum, loco húmili natus est; quem paréntes, cum diu prole caruíssent, voto facto, beáti Francísci précibus suscepérunt. Is adoléscens divíno ardóre succénsus in erémum secéssit, ubi annis sex, victu ásperam, sed meditatiónibus cæléstibus suávem vitam duxit. Sed cum virtútum ejus fama lóngius manáret, multíque ad eum pietátis stúdio concúrrerent, fratérnæ caritátis causa e solitúdine egréssus, ecclésiam prope Paulam ædificávit, ibíque prima sui órdinis fundaménta jecit.

        Erat in eo mirífica loquéndi grátia: perpétuam virginitátem servávit: humilitátem sic cóluit, ut se ómnium mínimum díceret, suósque alúmnos Mínimos appellári volúerit. Rudi amíctu, nudis pédibus incédens, humi cubábat. Cibi abstinéntia fuit admirábili: semel in die post solis occásum reficiebátur, et ad panem, et aquæ potum, vix áliquid ejusmodi obsónii adhibébat, quo vesci in Quadragésima licet: quam consuetúdinem, ut fratres sui toto anni témpore retinérent, quarto eos voto adstrínxit.

        Multis miráculis servi sui sanctitátem Deus testári vóluit, quorum illud in primis célebre, quod a nautis rejéctus, Sicíliæ fretum strato super flúctibus pállio cum sócio transmísit. Multa étiam futúra prophético spíritu prædíxit. A Ludovíco undécimo Francórum rege expetítus, magnóque in honóre est hábitus. Dénique annum primum et nonagésimum agens, Turónis migrávit ad Dominum: cujus corpus dies úndecim insepúltum, ita incorrúptum permánsit, ut suávem étiam odórem effláret. Eum Leo Papa décimus in Sanctórum númerum rétulit.
      status: verified
