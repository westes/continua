# Matins Nocturn 2/3 readings for epiphany, generated from the engine render (Monastic Tridentinum 1617, 2027-01-06); Latin and English both from the page.
# Nocturn 1's scripture slot is the user's own reading plan (see DESIGN.md), so the Isaiah lessons are not authored here. Contiguous lessons of the source are folded into one reading, with the responsory of the last lesson of the group (the same convention the Rosary and Circumcision files follow).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: From the Sermons of Pope St. Leo (the Great), 2nd for Twelfth-Day.
      text: |
        Gaudéte in Dómino, dilectíssimi, íterum dico, gaudéte: quóniam brevi intervállo témporis, post solemnitátem Nativitátis Christi, festívitas declaratiónis ejus illúxit: et quem in illo die Virgo péperit, in hoc mundus agnóvit. Verbum enim caro factum, sic susceptiónis nostræ temperávit exórdia, ut natus Jesus et credéntibus maniféstus, et persequéntibus esset occúltus.

        Jam tunc ergo cæli enarravérunt glóriam Dei, et in omnem terram sonus veritátis exívit, quando et pastóribus exércitus Angelórum Salvatóris éditi annuntiátor appáruit, et Magos ad eum adorándum prǽvia stella perdúxit: ut a solis ortu usque ad occásum veri Regis generátio coruscáret, cum rerum fidem et regna Oriéntis per Magos díscerent, et Románum impérium non latéret.

        Nam et sævítia Heródis volens primórdia suspécti sibi Regis exstínguere, huic dispensatíoni nésciens serviébat: ut dum atróci inténtus facínori, ignótum sibi púerum indiscréta infántium cæde perséquitur, annuntiátum cǽlitus dominatóris ortum insígnior ubíque fama loquerétur: quam promptiórem ad narrándum, diligentiorémque faciébat et supérnæ significatiónis nóvitas, et cruentíssimi persecutóris impíetas. Tunc autem étiam Ægýpto Salvátor illátus est, ut gens antíquis erróribus dédita, jam ad vicínam salútem per occúltam grátiam signarétur: et quæ nondum ejécerat ab ánimo superstitiónem, jam hospítio recíperet veritátem.

        Agnoscámus ergo, dilectíssimi, in Magis adoratóribus Christi, vocatiónis nostræ fideíque primítias: et exsultántibus ánimis beátæ spei inítia celebrémus. Exínde enim in ætérnam hereditátem cœ́pimus introíre: exínde nobis Christum loquéntia Scripturárum arcána patuérunt, et véritas, quam Judæórum obcæcátio non récipit, ómnibus natiónibus lumen suum invéxit. Honorétur ítaque a nobis sacratíssimus dies, in quo salútis nostræ Auctor appáruit: et quem Magi infántem veneráti sunt in cunábulis, nos omnipoténtem adorémus in cælis. Ac sicut illi de thesáuris suis mýsticas Dómino múnerum spécies obtulérunt, ita et nos de córdibus nostris, quæ Deo sunt digna, promámus.
      responsory: |-
        R. Interrogábat Magos Heródes: Quod signum vidístis super natum Regem? † Stellam vídimus fulgéntem, cujus splendor illúminat mundum: * Et nos cognóvimus et vénimus adoráre Dóminum.
        V. Magi véniunt ab Oriénte inquiréntes fáciem Dómini et dicéntes.
        R. Et nos cognóvimus et vénimus adoráre Dóminum.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 2:1-12
      text: 'Cum natus esset Jesus in Béthlehem Juda in diébus Heródis regis, ecce Magi ab Oriénte venérunt Jerosólymam, dicéntes: Ubi est qui natus est Rex Judæórum? Et réliqua.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Homily by Pope St. Gregory the Great., 10th on the Gospels
      text: |
        Sicut in lectióne evangélica, fratres caríssimi, audístis, cæli Rege nato, rex terræ turbátus est: quia nimírum terréna altitúdo confúnditur, cum celsitúdo cæléstis aperítur. Sed quæréndum nobis est, quidnam sit, quod, Redemptóre nato, pastóribus in Judǽa Angelus appáruit, atque ad adorándum hunc ab Oriénte Magos non Angelus, sed stella perdúxit?

        Quia vidélicet Judǽis, tamquam ratióne uténtibus, rationále ánimal, id est, Angelus prædicáre débuit: gentíles vero, quia uti ratióne nesciébant, ad cognoscéndum Dóminum non per vocem, sed per signa perducúntur. Unde étiam per Paulum dícitur: Prophetíæ fidélibus datæ sunt, non infidélibus: signa autem infidélibus, non fidélibus. Quia et illis prophetíæ tamquam fidélibus, non infidélibus: et istis signa tamquam infidélibus, non fidélibus data sunt. Et notándum, quod Redemptórem nostrum, cum jam perféctæ esset ætátis, eísdem gentílibus Apóstoli prǽdicant, eúmque párvulum, et necdum per humáni córporis offícium loquéntem, stella géntibus denúntiat: quia nimírum ratiónis ordo poscébat, ut et loquéntem jam Dóminum loquéntes nobis prædicatóres innotéscerent, et necdum loquéntem eleménta muta prædicárent. Sed in ómnibus signis, quæ vel nascénte Dómino, vel moriénte eo monstráta sunt, considerándum nobis est, quanta fúerit in quorúmdam Judæórum corde durítia, qui hunc nec per prophetíæ donum, nec per mirácula agnovérunt. Omnia quippe eleménta auctórem suum venísse testáta sunt. Ut enim de eis quiddam usu humáno loquar: Deum hunc cæli esse cognovérunt, quia prótinus stellam misérunt. Mare cognóvit, quia sub plantis ejus se calcábile prǽbuit. Terra cognóvit, quia eo moriénte contrémuit. Sol cognóvit, quia lucis suæ rádios abscóndit. Saxa et paríetes cognovérunt, quia témpore mortis ejus scissa sunt. Inférnus agnóvit, quia hos, quos tenébat mórtuos, réddidit. Et tamen hunc, quem Dóminum ómnia insensibília eleménta sensérunt, adhuc infidélium Judæórum corda Deum esse mínime cognóscunt, et durióra saxis, scindi ad pœniténdum nolunt.
      responsory: |-
        R. Hic est dies præclárus in quo Salvátor mundi appáruit, † quem prophétæ predixérunt, Angeli annuntiavérunt: * Cujus stellam Magi vidéntes gavísi sunt, et múnera ei obtulérunt.
        V. Dies sanctificátus illúxit nobis: † veníte gentes et adoráte Dóminum.
        R. Cujus stellam Magi vidéntes gavísi sunt, et múnera ei obtulérunt.
      status: verified

# Nocturn 2-3, First Sunday after Epiphany (temporalId post-epiphany-1).
# Sourced from Tempora/Epi1-0a.txt (Latin) / English/Tempora/Epi1-0a.txt -
# NOT Epi1-0.txt, which the reference engine reassigns to the (1893/1921)
# feast of the Holy Family, a feast this project doesn't model (see
# TODO.md's temporal-cycle survey note on Holy Family as a still-open
# pre-1955 gap). Epi1-0a.txt carries the older "Dominica infra Octavam
# Epiphaniæ" office underneath - confirmed via Epi1-0b.txt, which
# cross-references Epi1-0a for its own Nocturn 1 lessons under the title
# "Dominica I post Epiphaniam". See advent-1.yml for the general sweep
# method.
#
# Real structural gap in the source itself, not a transcription choice:
# Epi1-0a.txt's own [Rule] reads "Initia cum responsory" and it carries no
# [Responsory4]-[Responsory9] tags at all (unlike every other Epiphany-season
# Sunday) - its Nocturn 2/3 responsories are drawn from the continuous
# weekly "Historia" responsory cycle rather than being proper to this
# Sunday, which isn't transcribed per-Sunday in the static source files
# (would need live-CGI queries, same class of gap as the post-Pentecost
# season's un-sourced Nocturn 2 weeks - see TODO.md). Both readings below
# are authored without a `responsory` field for this reason (the field is
# optional in the schema) rather than inventing one.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from St. Leo the Great's
# 4th Sermon on the Epiphany.
#
# Nocturn 3 (Lectio7-9): Lectio7 carries real homily prose after its bare
# Gospel incipit (Luke 2:42-51, the boy Jesus found in the Temple, "Et
# réliqua") - St. Ambrose's own homily (Bk. 2 on Luke ii) begins within
# Lectio7 itself, same pattern used throughout this sweep. Combined
# Lectio7's homily portion (incipit dropped) with Lectio8-9.
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings/post-~-1:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Leo the Great, Sermon 4 on the Epiphany
      text: |-
        Justum et rationábile, dilectíssimi, veræ pietátis obséquium est, in diébus, qui divínæ ópera misericórdiæ protestántur, toto corde gaudére, et honorífice ea, quæ ad salútem nostram gesta sunt, celebráre, vocánte nos ad hanc devotiónem ipsa recurréntium témporum lege, quæ nobis post diem, in quo coætérnus Patri Fílius Dei natus ex Vírgine est, brevi intervállo Epiphaníæ íntulit festum, ex apparitióne Dómini consecrátum.

        In quo fídei nostræ magnum præsídium providéntia divína constítuit: ut, dum solémni veneratióne recólitur adoráta in exórdiis suis Salvatóris infántia, per ipsa originália documénta probarétur veri hóminis in Christo orta natúra. Hoc enim est, quod justíficat ímpios: hoc est, quod ex peccatóribus facit sanctos, si in uno eodémque Dómino nostro Jesu Christo et vera Déitas, et vera credátur humánitas: Déitas, qua ante ómnia sǽcula in forma Dei æquális est Patri: humánitas, qua novíssimis diébus in forma servi unítus est hómini.

        Ad roborándum ergo hanc fidem, quæ contra omnes pronuntiabátur erróres, ex magna gestum est divíni pietáte consílii, ut gens in longínqua Orientális plagæ regióne consístens, quæ spectandórum síderum arte pollébat, signum nati púeri, qui supra omnem Israël esset regnatúrus, accíperet. Nova étenim cláritas apud Magos stellæ illustrióris appáruit, et intuéntium ánimos ita admiratióne sui splendóris implévit, ut nequáquam sibi créderent negligéndum, quod tanto nuntiabátur indício.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 2:42-52
      text: 'Cum factus esset Jesus annórum duódecim, ascendéntibus illis Jerosólymam secúndum consuetúdinem diéi festi, consummatísque diébus, cum redírent, remánsit puer Jesus in Jerúsalem, et non cognovérunt paréntes ejus. Existimántes autem illum esse in comitátu, venérunt iter diéi, et requirébant eum inter cognátos et notos. Et non inveniéntes, regréssi sunt in Jerúsalem, requiréntes eum. Et factum est, post tríduum invenérunt illum in templo sedéntem in médio doctórum, audiéntem illos et interrogántem eos. Stupébant autem omnes, qui eum audiébant, super prudéntia et respónsis ejus. Et vidéntes admiráti sunt. Et dixit Mater ejus ad illum: Fili, quid fecísti nobis sic? Ecce, pater tuus et ego doléntes quærebámus te. Et ait ad illos: Quid est, quod me quærebátis? Nesciebátis, quia in his, quæ Patris mei sunt, opórtet me esse? Et ipsi non intellexérunt verbum, quod locútus est ad eos. Et descéndit cum eis, et venit Názareth: et erat súbditus illis. Et Mater ejus conservábat ómnia verba hæc in corde suo. Et Jesus proficiébat sapiéntia et ætáte et grátia apud Deum et hómines.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Commentary on Luke, Book 2
      text: |-
        A duodécimo anno, ut légimus, Domínicæ súmitur disputatiónis exórdium. Hic enim prædicándæ fídei evangelizántium númerus debebátur. Nec otióse ímmemor suórum secúndum carnem paréntum, qui secúndum carnem útique sapiéntia Dei implebátur et grátia, post tríduum reperítur in templo: ut esset indício, quia post tríduum triumphális illíus passiónis, in sede cælésti, et honóre divíno, fídei nostræ se suscitátus offérret, qui mórtuus credebátur.

        Quid est quod me quærebátis? Duæ sunt in Christo generatiónes: una est patérna, matérna áltera. Patérna illa divínior; matérna vero, quæ in nostrum labórem usúmque descéndit. Et ídeo quæ supra natúram, supra ætátem, supra consuetúdinem fiunt, non humánis assignánda virtútibus, sed divínis referénda sunt potestátibus. Alibi eum ad ministérium mater impéllit, hic mater arguitur, quia adhuc quæ humána sunt, éxigat. Sed cum hic duódecim describátur annórum, illic discípulos habére dicátur; vides matrem didicísse a fílio, ne exígeret a validióre ministérium, quæ stupébat in junióre miráculum.

        Et venit Názareth, et erat súbditus illis. Quid enim magíster virtútis, nisi offícium pietátis impléret? Et mirámur, si Patri defert, qui súbditur matri? Non útique infirmitátis, sed pietátis ista subjéctio est: attóllat licet sævis emíssus látebris cóluber perfídiæ caput, et serpentínis évomat venéna pectóribus. Cum dicit se Fílius missum, majórem hæréticus appéllet Patrem, ut imperféctum Fílium dicat, qui potest habére majórem: ut aliénis auxíliis ásserat eum, qui míttitur, indigére. Numquid et humáno egébat auxílio, ut matérno servíret império?
      status: verified

# Nocturn 2-3, Second Sunday after Epiphany (temporalId post-epiphany-2).
# Sourced from Tempora/Epi2-0.txt (Latin) / English/Tempora/Epi2-0.txt.
# See advent-1.yml/post-epiphany-1.yml for the general sweep method.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from St. John Chrysostom's
