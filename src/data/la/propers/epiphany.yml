nocturn-readings/post-~-2:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. John Chrysostom, Preface to the Epistles of St. Paul
      text: |-
        Beáti Pauli Epistolárum lectiónem dum assídue auscúlto, perque hebdómadas síngulas bis sæpe, et ter et quater, quotiescúmque sanctórum Mártyrum memórias celebrámus, gáudio exsúlto, tuba illa spiritáli pérfruens, et éxcitor, ac desidério incalésco, vocem mihi amícam agnóscens, et fere præséntem ipsum intuéri, et disseréntem audíre vídeor. Sed tamen dóleo et moléste fero, quod virum hunc non omnes, sicut par est, cognóscunt: verum ita illum nonnúlli ignórant, ut ne Epistolárum quidem ejus númerum plane sciant. Hoc vero non imperítia facit: sed quod nolint beáti hujus viri scripta in mánibus habére.

        Neque enim nos, quæ scimus, si quid scimus, ab ingénii bonitáte atque acúmine scimus: sed quod erga hunc virum impénse affécti, ab illíus lectióne numquam discédimus: síquidem qui amant, ii plus quam céteri omnes eórum facta norunt, quos amant, ut qui de iis ipsis sint sollíciti. Id quod beátus hic véluti osténdens, ad Philippénses ait: Sicut est mihi justum, ut hoc de vobis ómnibus séntiam, eo quod hábeam vos in corde, et in vínculis meis, et in defensióne et confirmatióne Evangélii.

        Quaprópter si et vos quoque lectióni diligénter atténdere voluéritis, nihil áliud vobis erit requiréndum. Verax est enim Christi sermo dicéntis: Quǽrite, et inveniétis: pulsáte, et aperiétur vobis. Céterum, quandóquidem complúres ex iis, qui huc nobíscum convéniunt, et liberórum educatiónem, et uxóris curam, et famíliæ providéntiam suscepére, ob idque totos sese huic labóri dare non sústinent: at certe ipsi vos excitáte ad ea saltem capiénda, quæ álii collégerint; stúdii tantúmdem iis, quæ dicta fúerint, auscultándis, quantum pecúniis colligéndis impertiéntes. Nam etsi turpe sit, non nisi tantum stúdii a vobis exígere: optábile tamen erit, si tantum saltem tribuátis.
      responsory: |-
        R. Notas mihi fecísti, Dómine, vias vitæ: * Adimplébis me lætítia cum vultu tuo: delectatiónes in déxtera tua usque in finem.
        V. Tu es qui restítues hereditátem meam mihi.
        R. Adimplébis me lætítia cum vultu tuo: delectatiónes in déxtera tua usque in finem.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joann 2:1-11
      text: 'In illo témpore: Núptiæ factæ sunt in Cana Galilǽæ: et erat Mater Jesu ibi. Vocátus est autem et Jesus, et discípuli ejus ad núptias. Et deficiénte vino, dicit Mater Jesu ad eum: Vinum non habent. Et dicit ei Jesus: Quid mihi et tibi est, mulier? nondum venit hora mea. Dicit Mater ejus minístris: Quodcúmque díxerit vobis, fácite. Erant autem ibi lapídeæ hýdriæ sex pósitæ secúndum purificatiónem Judæórum, capiéntes síngulæ metrétas binas vel ternas. Dicit eis Jesus: Implete hýdrias aqua. Et implevérunt eas usque ad summum. Et dicit eis Jesus: Hauríte nunc, et ferte architriclíno. Et tulérunt. Ut autem gustávit architriclínus aquam vinum fáctam, et non sciébat unde esset, minístri autem sciébant, qui háuserant aquam: vocat sponsum architriclínus, et dicit ei: Omnis homo primum bonum vinum ponit: et cum inebriáti fúerint, tunc id, quod detérius est. Tu autem servásti bonum vinum usque adhuc. Hoc fecit inítium signórum Jesus in Cana Galilǽæ: et manifestávit glóriam suam, et credidérunt in eum discípuli ejus.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tractate 9 on the Gospel of John
      text: |-
        Quod Dóminus invitátus venit ad núptias, étiam excépta mýstica significatióne, confirmáre vóluit, quod ipse fecit núptias. Futúri enim erant, de quibus dixit Apóstolus, prohibéntes núbere, et dicéntes quod malum essent núptiæ, et quod diábolus eas fecísset: cum idem Dóminus dicat in Evangélio interrogátus, utrum líceat hómini dimíttere uxórem suam ex quálibet causa, non licére, excépta causa fornicatiónis. In qua responsióne, si meminístis, hoc ait: Quod Deus conjúnxit, homo non séparet.

        Et qui bene erudíti sunt in fide catholica novérunt, quod Deus fécerit nuptias: et sicut conjúnctio a Deo, ita divortium a diabolo sit. Sed proptérea in causa fornicatiónis licet uxórem dimíttere: quia ipsa esse uxor prior nóluit, quæ fidem conjugalem maríto non servávit. Nec illæ, quæ virginitátem Deo vovent, quamquam ampliórem gradum honoris et sanctitátis in Ecclésia teneant, sine nuptiis sunt: nam et ipsæ pertinent ad nuptias cum tota Ecclésia, in quibus nuptiis sponsus est Christus.

        Ac per hoc ergo Dóminus invitátus venit ad nuptias, ut conjugális cástitas firmarétur, et ostenderétur sacraméntum nuptiárum: quia et illárum nuptiárum sponsus personam Dómini figurábat cui dictum est: Servásti vinum bonum usque adhuc. Bonum enim vinum Christus servávit usque adhuc, id est, Evangélium suum.
      responsory: |-
        R. Ad te, Dómine, levávi ánimam meam: * Deus meus, in te confído, non erubéscam.
        V. Custódi ánimam meam, et éripe me.
        R. Deus meus, in te confído, non erubéscam.
      status: verified

# Nocturn 2-3, Third Sunday after Epiphany (temporalId post-epiphany-3).
# Sourced from Tempora/Epi3-0.txt (Latin) / English/Tempora/Epi3-0.txt.
# See advent-1.yml/post-epiphany-1.yml for the general sweep method.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from St. Augustine's
# Exposition of the Epistle to the Galatians. Responsory: the source's own
# [Responsory4] is a cross-reference to Epi2-0's Responsory4 ("Notas mihi
# fecísti, Dómine, vias vitæ" - already transcribed in
# post-epiphany-2.yml), reused here directly rather than left unresolved.
#
# Nocturn 3 (Lectio7-9): Lectio7 carries real homily prose after its bare
# Gospel incipit (Matt 8:1-13, the cleansing of the leper, "Et réliqua") -
# St. Jerome's Commentary on Matthew, Book 1, begins within Lectio7
# itself, same pattern used throughout this sweep. Combined Lectio7's
# homily portion (incipit dropped) with Lectio8-9, using the source's own
# [Responsory7] - again a cross-reference, to Epi2-0's Responsory7 ("Ad te,
# Dómine, levávi ánimam meam" - already transcribed in
# post-epiphany-2.yml).
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings/post-~-3:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Exposition of the Epistle to the Galatians
      text: |-
        Causa, propter quam scribit Apóstolus ad Gálatas, hæc est: ut intélligant grátiam Dei id secum ágere, ut sub lege jam non sint. Cum enim prædicáta eis esset Evangélii grátia, non defuérunt quidam ex circumcisióne, quamvis Christiáni nómine, nondum tamen tenéntes ipsum gratiæ benefícium, et adhuc voléntes esse sub onéribus legis, quæ Dóminus Deus imposúerat non justítiæ serviéntibus, sed peccáto, justam scílicet legem injústis homínibus dando ad demonstranda peccáta eórum, non auferenda. Non enim aufert peccáta, nisi grátia fidei, quæ per dilectiónem operátur.

        Sub hac ergo grátia jam Gálatas constitútos illi volébant constitúere sub onéribus legis, asseverántes nihil eis prodésse Evangélium, nisi circumcideréntur, et céteras carnáles Judáici ritus observatiónes subírent. Et ídeo Paulum Apóstolum suspéctum habére cœ́perant, a quo illis Evangélium prædicátum erat, tamquam non tenéntem disciplínam ceterórum Apostolórum, qui gentes cogébant judaizáre.

        Talis quidem quǽstio est et in Epístola ad Romános: verúmtamen vidétur áliquid interésse, quod ibi contentiónem ipsam dírimit, litémque compónit, quæ inter eos, qui ex Judǽis, et eos, qui ex Géntibus credíderant, orta erat: cum illi tamquam ex méritis óperum legis, sibi rédditum Evangélii prǽmium arbitraréntur, quod prǽmium incircumcísis tamquam imméritis nolébant dari: illi contra Judǽis se præférre gestírent, tamquam interfectóribus Dómini. In hac vero epístola ad eos scribit, qui jam commóti erant auctoritáte illórum, qui ex Judǽis erant, et ad observatiónes legis cogébant.
      responsory: |-
        R. Notas mihi fecísti, Dómine, vias vitæ: * Adimplébis me lætítia cum vultu tuo: delectatiónes in déxtera tua usque in finem.
        V. Tu es qui restítues hereditátem meam mihi.
        R. Adimplébis me lætítia cum vultu tuo: delectatiónes in déxtera tua usque in finem.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 8:1-13
      text: 'In illo témpore: Cum descendísset Jesus de monte, secútæ sunt eum turbæ multæ: et ecce, leprósus véniens adorábat eum, dicens: Dómine, si vis, potes me mundáre. Et exténdens Jesus manum, tétigit eum, dicens: Volo. Mundáre. Et conféstim mundáta est lepra ejus. Et ait illi Jesus: Vide, némini díxeris: sed vade, osténde te sacerdóti, et offer munus, quod præcépit Móyses, in testimónium illis. Cum autem introísset Caphárnaum, accéssit ad eum centúrio, rogans eum et dicens: Dómine, puer meus jacet in domo paralýticus, et male torquetur. Et ait illi Jesus: Ego véniam, et curábo eum. Et respóndens centúrio, ait: Dómine, non sum dignus, ut intres sub tectum meum: sed tantum dic verbo, et sanábitur puer meus. Nam et ego homo sum sub potestáte constitútus, habens sub me mílites, et dico huic: Vade, et vadit; et alii: Veni, et venit; et servo meo: Fac hoc, et facit. Audiens autem Jesus, mirátus est, et sequéntibus se dixit: Amen, dico vobis, non inveni tantam fidem in Israël. Dico autem vobis, quod multi ab Oriénte et Occidénte vénient, et recúmbent cum Abraham et Isaac et Jacob in regno cœlórum: fílii autem regni ejiciéntur in ténebras exterióres: ibi erit fletus et stridor déntium. Et dixit Jesus centurióni: Vade et, sicut credidísti, fiat tibi. Et sanátus est puer in illa hora.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Commentary on Matthew, Book 1
      text: |-
        De monte Dómino descendénte, occúrrunt turbæ, quia ad altióra ascéndere non valuérunt. Et primus ei occúrrit leprósus: necdum enim póterat cum lepra tam multíplicem in monte Salvatóris audíre sermónem. Et notándum, quod hic primus speciáliter curátus sit: secúndo, puer centuriónis: tértio, socrus Petri fébriens in Caphárnaum: quarto loco, qui obláti sunt ei a dæmónio vexáti: quorum spíritus verbo eiciébat, quando et omnes male habéntes curávit.

        Et ecce leprósus véniens adorábat eum, dicens. Recte post prædicatiónem atque doctrínam, signi offértur occásio, ut per virtútem miráculi, prætéritus apud audiéntes sermo firmétur. Dómine, si vis, potes me mundáre. Qui voluntátem rogat, de virtúte non dúbitat. Et exténdens Jesus manum tétigit eum, dicens: Volo, mundáre. Extendénte manum Dómino, statim lepra fugit. Simúlque consídera, quam húmilis, et sine jactántia respónsio. Ille díxerat, Si vis: Dóminus respóndit, Volo. Ille præmíserat, Potes me mundáre: Dóminus jungit, et dicit, Mundáre. Non ergo, ut pleríque Latinórum putant, jungéndum est, et legéndum, Volo mundáre: sed separátim, ut primum dicat, Volo; deínde ímperet, Mundáre.

        Et ait illi Jesus: Vide, némini díxeris. Et revéra quid erat necésse ut sermóne jactáret, quod córpore præferébat? Sed vade, osténde te sacerdóti. Várias ob causas mittit eum ad sacerdótem: primum propter humilitátem, ut sacerdótibus deférre honórem videátur. Erat enim lege præcéptum, ut, qui mundáti fúerant a lepra, offérrent múnera sacerdótibus. Deínde, ut mundátum vidéntes leprósum, aut créderent Salvatóri, aut non créderent: si créderent, salvaréntur; si non créderent, inexcusábiles forent. Et simul, ne, quod in eo sæpíssime criminabántur, legem viderétur infríngere.
      responsory: |-
        R. Ad te, Dómine, levávi ánimam meam: * Deus meus, in te confído, non erubéscam.
        V. Custódi ánimam meam, et éripe me.
        R. Deus meus, in te confído, non erubéscam.
      status: verified

# Nocturn 2-3, Fourth Sunday after Epiphany (temporalId post-epiphany-4).
# Sourced from Tempora/Epi4-0.txt (Latin) / English/Tempora/Epi4-0.txt.
# See advent-1.yml/post-epiphany-1.yml for the general sweep method.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from Pope St. Gregory the
# Great's Moralia in Job, Book 4. Responsory: the source's own
# [Responsory4] is a cross-reference to Epi2-0's Responsory4 ("Notas mihi
# fecísti, Dómine, vias vitæ"), reused here directly (same pattern as
# post-epiphany-3.yml).
#
# Nocturn 3 (Lectio7-9): Lectio7 carries real homily prose after its bare
# Gospel incipit (Matt 8:23-27, the calming of the storm, "Et réliqua") -
# St. Jerome's Commentary on Matthew, Book 1, begins within Lectio7
# itself, same pattern used throughout this sweep. Combined Lectio7's
# homily portion (incipit dropped) with Lectio8-9, using the source's own
# [Responsory7] - again a cross-reference, to Epi2-0's Responsory7 ("Ad te,
# Dómine, levávi ánimam meam").
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings/post-~-4:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope St. Gregory the Great, Moralia in Job, Book 4
      text: |-
        Replémus refectiónibus corpus, ne extenuátum defíciat; extenuámus abstinéntia, ne nos replétum premat: vegetámus hoc mótibus, ne situ immobilitátis intéreat; sed cítius hoc collocándo sístimus, ne ipsa sua vegetatióne succúmbat: adjuméntis hoc véstium tégimus, ne frigus intérimat; et quæsíta adjuménta projícimus, ne calor exúrat. Tot ígitur diversitátibus occurréntes, quid ágimus, nisi corruptibilitáti sérvimus, ut saltem multiplícitas impénsi obséquii corpus sustíneat, quod anxíetas infírmæ mutabilitátis gravat?

        Unde bene per Paulum dícitur: Vanitáti enim subjécta est creatúra non volens, sed propter eum qui subjécit eam in spe: quia et ipsa creatúra liberábitur a servitúte corruptiónis, in libertátem glóriæ filiórum Dei. Vanitáti quippe creatúra non volens súbditur: quia homo, qui ingénitæ constántiæ statum volens deséruit, pressus justæ mortalitátis póndere, nolens mutabilitátis suæ corruptióni servit. Sed creatúra hæc tunc a servitúte corruptiónis erípitur, cum ad filiórum Dei glóriam incorrúpta resurgéndo sublevátur.

        Hic ítaque elécti moléstia vincti sunt, quia adhuc corruptiónis suæ pœna deprimúntur: sed cum corruptíbili carne exúimur, quasi ab his, quibus nunc astríngimur, moléstiæ vínculis relaxámur. Præsentári namque jam Deo cúpimus, sed adhuc mortális córporis obligatióne præpedímur. Jure ergo vincti dícimur, quia adhuc incéssum nostri desidérii ad Deum líberum non habémus. Unde bene Paulus, ætérna desíderans, sed tamen adhuc corruptiónis suæ sárcinam portans, vinctus clamat: Cúpio dissólvi, et esse cum Christo. Dissólvi enim non quǽreret, nisi se proculdúbio vinctum vidéret.
      responsory: |-
        R. Notas mihi fecísti, Dómine, vias vitæ: * Adimplébis me lætítia cum vultu tuo: delectatiónes in déxtera tua usque in finem.
        V. Tu es qui restítues hereditátem meam mihi.
        R. Adimplébis me lætítia cum vultu tuo: delectatiónes in déxtera tua usque in finem.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 8:23-27
      text: 'In illo témpore: Ascendénte Jesu in navículam, secúti sunt eum discípuli ejus: et ecce, motus magnus factus est in mari, ita ut navícula operirétur flúctibus, ipse vero dormiébat. Et accessérunt ad eum discípuli ejus, et suscitavérunt eum, dicéntes: Dómine, salva nos, perímus. Et dicit eis Jesus: Quid tímidi estis, módicæ fídei? Tunc surgens, imperávit ventis et mari, et facta est tranquíllitas magna. Porro hómines miráti sunt, dicéntes: Qualis est hic, quia venti et mare obœ́diunt ei?'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Commentary on Matthew, Book 1
      text: |-
        Quintum signum fecit, quando ascéndens navem de Caphárnaum, ventis imperávit et mari. Sextum, quando in regióne Gerasenórum dedit potestátem dæmónibus in porcos. Séptimum, quando ingrédiens civitátem suam, paralýticum secúndum curávit in léctulo. Primus enim paralýticus est puer centuriónis.

        Ipse vero dormiébat: et accessérunt ad eum, et suscitavérunt eum, dicéntes: Dómine, salva nos. Hujus signi typum in Jona légimus, quando céteris periclitántibus, ipse secúrus est, et dormit, et suscitátur; et império ac sacraménto passiónis suæ líberat suscitántes. Tunc surgens imperávit ventis et mari. Ex hoc loco intellígimus, quod omnes creatúræ séntiant Creatórem. Quas enim increpávit, et quibus imperávit, sentiunt imperántem: non erróre hæreticórum qui ómnia putant animántia, sed majestáte Conditóris, quæ apud nos insensibília, illi sensibília sunt.

        Porro hómines miráti sunt, dicéntes: Qualis est hic, quia venti et mare obédiunt ei? Non discípuli, sed nautæ, et céteri, qui in navi erant, mirabántur. Sin autem quis contentióse volúerit, eos, qui mirabántur, fuísse discípulos: respondébimus, recte hómines appellátos, qui necdum nóverant poténtiam Salvatóris.
      responsory: |-
        R. Ad te, Dómine, levávi ánimam meam: * Deus meus, in te confído, non erubéscam.
        V. Custódi ánimam meam, et éripe me.
        R. Deus meus, in te confído, non erubéscam.
      status: verified

# Nocturn 2-3, Fifth Sunday after Epiphany (temporalId post-epiphany-5).
# Sourced from Tempora/Epi5-0.txt (Latin) / English/Tempora/Epi5-0.txt.
# See advent-1.yml/post-epiphany-1.yml for the general sweep method.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from St. Augustine's
# Sermon 8 on the Words of the Apostle. Responsory: the source's own
# [Responsory4] is a cross-reference to Epi2-0's Responsory4 ("Notas mihi
# fecísti, Dómine, vias vitæ"), reused here directly (same pattern as the
# earlier post-Epiphany Sundays).
#
# Nocturn 3 (Lectio7-9): Lectio7 carries real homily prose after its bare
# Gospel incipit (Matt 13:24-30, the parable of the wheat and the tares,
# "Et réliqua") - St. Augustine's own Questions on the Gospels (on Matthew
# 11) begins within Lectio7 itself, same pattern used throughout this
# sweep. Combined Lectio7's homily portion (incipit dropped) with
# Lectio8-9, using the source's own [Responsory7] - again a
# cross-reference, to Epi2-0's Responsory7 ("Ad te, Dómine, levávi ánimam
# meam").
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings/post-~-5:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 8 on the Words of the Apostle
      text: |-
        Humánus sermo, et omni acceptióne dignus, quia Christus Jesus venit in hunc mundum peccatóres salvos fácere. Atténde Evangélium: Venit enim Fílius hóminis quærére, et salváre, quod períerat. Si homo non periísset, Fílius hóminis non venísset. Ergo períerat homo: venit Deus homo, et invéntus est homo. Períerat homo per líberam voluntátem: venit Deus homo per grátiam liberatrícem.

        Quæris, quid váleat ad malum líberum arbítrium? Recóle hóminem peccántem. Quæris, quid váleat ad auxílium Deus et homo? Atténde in eo grátiam liberántem. Nusquam pótuit sic osténdi, quantum váleat volúntas hóminis usurpáta per supérbiam, ad uténdum sine adjutório Dei: malum non pótuit plus, et maniféstius éxprimi, quam in hómine primo. Ecce perit primus homo, et ubi esset, nisi venísset secúndus homo? quia et ille homo, ídeo et iste homo; et ídeo humánus sermo.

        Prorsus nusquam sic appáret benígnitas grátiæ, et liberálitas omnipoténtiæ Dei, quam in hómine mediatóre Dei et hóminum, hómine Christo Jesu. Quid enim dícimus, fratres mei? In fide cathólica nutrítis loquor, vel in pacem cathólicam lucrátis. Nóvimus et tenémus, mediatórem Dei et hóminum, hóminem Christum Jesum, in quantum homo erat, ejus esse natúræ, cujus et nos sumus. Non enim altérius natúræ caro nostra, et caro illíus: nec altérius natúræ ánima nostra, et ánima illíus. Hanc suscépit natúram, quam salvándam esse judicávit.
      responsory: |-
        R. Notas mihi fecísti, Dómine, vias vitæ: * Adimplébis me lætítia cum vultu tuo: delectatiónes in déxtera tua usque in finem.
        V. Tu es qui restítues hereditátem meam mihi.
        R. Adimplébis me lætítia cum vultu tuo: delectatiónes in déxtera tua usque in finem.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 13:24-30
      text: 'In illo témpore: Dixit Jesus turbis parábolam hanc: Símile factum est regnum cœlórum hómini, qui seminávit bonum semen in agro suo. Cum autem dormírent hómines, venit inimícus ejus, et superseminávit zizánia in médio trítici, et ábiit. Cum autem crevísset herba et fructum fecísset, tunc apparuérunt et zizánia. Accedéntes autem servi patrisfamílias, dixérunt ei: Dómine, nonne bonum semen seminásti in agro tuo? Unde ergo habet zizánia? Et ait illis: Inimícus homo hoc fecit. Servi autem dixérunt ei: Vis, imus, et collígimus ea? Et ait: Non: ne forte colligéntes zizánia eradicétis simul cum eis et tríticum. Sínite utráque créscere usque ad messem, et in témpore messis dicam messóribus: Collígite primum zizánia, et alligáte ea in fascículos ad comburéndum, tríticum autem congregáte in hórreum meum.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Questions on the Gospels (on Matthew 11)
      text: |-
        Cum negligéntius ágerent præpósiti Ecclésiæ, aut cum dormitiónem mortis accíperent Apóstoli, venit diábolus, et superseminávit eos, quos malos fílios Dóminus interpretátur. Sed quǽritur: utrum hærétici sint, an male vivéntes cathólici? Possunt enim dici fílii mali étiam hærétici, quia ex eódem Evangélii sémine, et Christi nómine procreáti, pravis opiniónibus ad falsa dógmata convertúntur.

        Sed quod dicit eos in médio trítici seminátos, quasi vidéntur illi significári, qui uníus communiónis sunt. Verúmtamen quóniam Dóminus agrum ipsum, non Ecclésiam, sed hunc mundum interpretátus est: bene intelligúntur hærétici, quia non societáte uníus Ecclésiæ, vel uníus fídei, sed societáte solíus nóminis christiáni in hoc mundo permiscéntur bonis. At illi, qui in eádem fide mali sunt, pálea pótius quam zizánia reputántur: quia pálea étiam fundaméntum ipsum habet cum fruménto, radicémque commúnem.

        In illa plane sagéna, qua concludúntur et mali et boni pisces, non absúrde mali cathólici intelligúntur. Aliud est enim mare, quod magis mundum istum signíficat: áliud sagéna, quæ uníus fídei, vel uníus Ecclésiæ communiónem vidétur osténdere. Inter hæréticos et malos cathólicos hoc ínterest, quod hærétici falsa credunt: illi autem, vera credéntes, non vivunt ita ut credunt.
      responsory: |-
        R. Ad te, Dómine, levávi ánimam meam: * Deus meus, in te confído, non erubéscam.
        V. Custódi ánimam meam, et éripe me.
        R. Deus meus, in te confído, non erubéscam.
      status: verified

# Nocturn 2-3, Sixth Sunday after Epiphany (temporalId post-epiphany-6).
# Sourced from Tempora/Epi6-0.txt (Latin) / English/Tempora/Epi6-0.txt.
# See advent-1.yml/post-epiphany-1.yml for the general sweep method.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from St. Athanasius'
# 2nd Oration against the Arians. Responsory: the source's own
# [Responsory4] is a cross-reference to Epi2-0's Responsory4 ("Notas mihi
# fecísti, Dómine, vias vitæ"), reused here directly (same pattern as the
# earlier post-Epiphany Sundays).
#
# Nocturn 3 (Lectio7-9): Lectio7 carries real homily prose after its bare
# Gospel incipit (Matt 13:31-32, the parable of the mustard seed, "Et
# réliqua") - St. Jerome's Commentary on Matthew, Book 2, begins within
# Lectio7 itself, same pattern used throughout this sweep. Combined
# Lectio7's homily portion (incipit dropped) with Lectio8-9, using the
# source's own [Responsory7] - again a cross-reference, to Epi2-0's
# Responsory7 ("Ad te, Dómine, levávi ánimam meam").
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings/post-~-6:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Athanasius, Bishop of Alexandria, 2nd Oration against the Arians
      text: |-
        Si persónam, rem, tempus apostólici dicti cognóscerent hærétici, numquam humána in Deitátem transferéntes, tam ímpie et stulte advérsus Christum sese habuíssent. Id intuéri licébit, si inítium lectiónis dénuo repetítum probe excípias. Dicit enim Apóstolus: Multifáriam, multísque modis olim Deus locútus est pátribus nostris per Prophétas: últimis autem diébus locútus est nobis in Fílio. Atque ita paulo post dicit: Perfécta ab eo nostrórum peccatórum purificatióne, ipsum sedére ad déxteram majestátis in excélsis, tanto meliórem Angelis factum, quanto præstántius nomen præ illis sortítus est. De eo ígitur témpore, quo nobis per Fílium locútus est, cum peccatórum purgátio fíeret, apostólicum dictum mentiónem facit. Quando autem nobis locútus est in Fílio, aut quando purgátio peccatórum facta, aut quando natus est homo, nisi post Prophétas, idque in últimis diébus?

        Deínde cum narrátio institúta esset de humána Verbi dispensatióne, deque últimis tempóribus: consequénter commemorávit, Deum neque superióribus ætátibus tacuísse, sed locútum esse per Prophétas: et postquam Prophétæ suo offício perfúncti sunt, et lex per Angelos pronuntiáta est, et Fílius étiam ad nos descéndit, et ad ministrándum accéssit; tunc demum necessário subíntulit: Tanto mélior Angelis factus: osténdere volens, quanto Fílius præ servo excéllit, tanto functióne officióque servórum, Fílii administratiónem meliórem fuísse.

        Functiónem ígitur discérnens Apóstolus, tum véterem, tum novam, magna dicéndi libertáte útitur, ad Judǽos scribens et loquens. Propter hoc ígitur non in univérsum ex própria comparatiónis ratióne dixit, quod major aut honorátior esset: ne quis quasi de ejúsdem géneris, et cum eo commúnibus rebus hæc verba intellígeret: sed ídeo meliórem illum dixit, ut discrímen natúræ Fílii ad res creátas indicáret.
      responsory: |-
        R. Notas mihi fecísti, Dómine, vias vitæ: * Adimplébis me lætítia cum vultu tuo: delectatiónes in déxtera tua usque in finem.
        V. Tu es qui restítues hereditátem meam mihi.
        R. Adimplébis me lætítia cum vultu tuo: delectatiónes in déxtera tua usque in finem.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 13:31-35
      text: 'In illo témpore: Dixit Jesus turbis parábolam hanc: Símile est regnum cœlórum grano sinápis, quod accípiens homo seminávit in agro suo: quod mínimum quidem est ómnibus semínibus: cum autem créverit, majus est ómnibus oléribus, ¶ et fit arbor, ita ut vólucres cœli véniant et hábitent in ramis ejus. Aliam parábolam locútus est eis: Símile est regnum cœlórum ferménto, quod accéptum múlier abscóndit in farínæ satis tribus, donec fermentátum est totum. Hæc ómnia locútus est Jesus in parábolis ad turbas: et sine parábolis non loquebátur eis: ut implerétur quod dictum erat per Prophétam dicéntem: Apériam in parábolis os meum, eructábo abscóndita a constitutióne mundi.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Commentary on Matthew, Book 2
      text: |-
        Regnum cælórum prædicátio Evangélii est, et notítia Scripturárum, quæ ducit ad vitam, et de qua dícitur ad Judǽos: Auferétur a vobis regnum Dei, et dábitur genti faciénti fructus ejus. Símile est ergo hujuscémodi regnum grano sinápis, quod accípiens homo seminávit in agro suo. Homo qui séminat in agro suo, a plerísque Salvátor intellégitur, quod in ánimis credéntium séminet: ab áliis ipse homo séminans in agro suo, hoc est in semetípso, et in corde suo.

        Quis est iste, qui séminat, nisi sensus noster et ánimus; qui suscípiens granum prædicatiónis, et fovens seméntem, humóre fídei facit in agro sui péctoris pulluláre? Prædicátio Evangélii mínima est ómnibus disciplínis. Ad primam quippe doctrínam, fidem non habet veritátis, hóminem Deum, Christum mórtuum, et scándalum crucis prǽdicans. Confer hujuscémodi doctrínam dogmátibus philosophórum, et libris eórum, et splendóri eloquéntiæ, et compositióni sermónum: et vidébis quanto minor sit céteris semínibus seméntis Evangélii.

        Sed illa cum créverint, nihil mordax, nihil vívidum, nihil vitále demónstrant: sed totum fláccidum marcidúmque et mollítum ebúllit in ólera et in herbas, quæ cito aréscunt et córruunt. Hæc autem prædicátio, quæ parva videbátur in princípio, cum vel in ánima credéntis, vel in tot mundo sata fúerit, non exsúrgit in ólera, sed crescit in árborem: ita ut vólucres cæli (quas vel ánimas credéntium, vel fortitúdines, Dei servítio mancipátas, sentíre debémus) véniant et hábitent in ramis ejus. Ramos puto evangélicæ árboris, quæ de grano sinápis créverit, dógmatum esse diversitátes, in quibus supradictárum vólucrum unaquǽque requiéscit.
      responsory: |-
        R. Ad te, Dómine, levávi ánimam meam: * Deus meus, in te confído, non erubéscam.
        V. Custódi ánimam meam, et éripe me.
        R. Deus meus, in te confído, non erubéscam.
      status: verified

# Sourced directly from the raw reference files (web/www/horas/Latin+English/Sancti/01-07.txt): the Epiphany octave's counted day 2 (Sundays not counted -- see OctaveConfig.skipsSunday). Lectio4-6 plus the Lectio7-9 continuation, bare Gospel incipit dropped, collapsed into one reading as every octave reading here is.
octave-readings/~-octave-day-2:
  source: Sermo sancti Augustíni Epíscopi; Homilía sancti Gregórii Papæ
  text: |
    Ad partum Vírginis adorándum Magi ab Oriénte venérunt. Hunc diem hódie celebrámus: huic debitum solemnitáti sermónem persolvimus. Illis dies iste primus illuxit, anniversaria nobis festivitate rediit. Illi erant primítiæ Géntium, nos pópulus Géntium. Nobis hoc lingua nuntiávit Apostolórum, stella illis tamquam lingua cælórum; et nobis iídem Apóstoli, tamquam alii cæli, enarravérunt glóriam Dei.

    Magnum sacraméntum: in præsepi jacebat, et Magos ab Oriénte ducebat. Abscondebátur in stábulo, et agnoscebátur in cælo: ut ágnitus in cælo manifestarétur in stábulo, et appellarétur Epiphanía dies iste, quod Latine manifestátio dici potest: simul ejus celsitúdinem humilitatémque commendans, ut qui in aperto cælo signis sidéreis monstrabátur magnus, in angusto diversorio quæsítus invenirétur inválidus, infantílibus in membris natus, infantilibúsque pannis involutus, adorarétur a Magis, timerétur a malis.

    Tímuit enim eum rex Herodes, eisdem sibi Magis nuntiántibus, cum adhuc quærerent párvulum, quem cognóverant cælo teste jam natum. Quid erit tribúnal judicántis, quando supérbos reges cunábula terrébant infantis? Quanto consultius reges, non sicut Heródes interfícere quærant, sed sicut Magi potius adorare delecténtur; jam præsertim eum, qui et ipsam mortem, quam cupiebat inimícus inférre, étiam pro ipsis inimícis ab inimícis sustinuit, eamque in suo corpore occisus occídit. Pie timeant reges ad Patris déxteram jam sedéntem, quem rex ímpius tímuit adhuc matris úbera lambéntem.

    Nativitáte Regis nostri cógnita, Heródes ad callida arguménta convértitur; et ne terreno regno privarétur, renuntiari sibi ubi puer inveniátur, postulat. Adorare eum velle se símulat, ut hunc, si inveníri possit, exstinguat. Sed quanta est humana malítia contra consílium divinitátis? Scriptum quippe est: Non est sapiéntia, non est prudéntia, non est consílium contra Dóminum. Nam ea, quæ appáruit stella, Magos perducit: natum Regem reperiunt, múnera déferunt: et ne redire ad Heródem debeant, in somnis admonéntur. Sicque fit, ut Jesum, quem quærit Heródes, inveníre non possit. Cujus persona qui alii, quam hypócritæ designántur, qui dum ficte quærunt, inveníre Dóminum numquam merentur?

    Sed inter hæc sciéndum, quod Priscilliánistæ hæretici nasci unumquemque hóminem sub constitutiónibus stellárum putant: et hoc in adjutórium sui erroris assumunt, quod nova stella éxiit cum Dóminus in carne appáruit; cujus fuísse fatum eamdem, quæ appáruit, stellam putant. Sed si Evangélii verba pensamus, quibus de eádem stella dícitur: Usque dum veniens staret supra, ubi erat puer: dum non puer ad stellam, sed stella ad púerum cucúrrit, si dici liceat, non stella fatum púeri, sed fatum stellæ is, qui appáruit puer fuit.

    Sed a fidelium córdibus absit, ut aliquid esse fatum dicant. Vitam quippe hóminum solus hic Cónditor, qui creávit, adminístrat. Neque enim propter stellas homo, sed stellæ propter hóminem factæ sunt: et si stella fatum hóminis dícitur, ipsis suis ministériis subesse homo perhibétur. Certe cum Jacob de útero egrédiens, prioris fratris plantam tenéret manu, prior perfecte nequáquam égredi pótuit, nisi súbsequens inchoasset: et tamen cum uno témpore, eodémque momento utrumque mater fúderit, non una utriusque vitæ qualitas fuit.
  responsory: |
    R. Tria sunt múnera pretiósa, quæ obtulérunt Magi Dómino in die ista, et habent in se divína mystéria: * In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram. V. Salútis nostræ auctórem Magi veneráti sunt in cunábulis, et de thesáuris suis mýsticas ei múnerum spécies obtulérunt. R. In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram.
  status: verified

# Sourced directly from the raw reference files (web/www/horas/Latin+English/Sancti/01-08.txt): the Epiphany octave's counted day 3 (Sundays not counted -- see OctaveConfig.skipsSunday). Lectio4-6 plus the Lectio7-9 continuation, bare Gospel incipit dropped, collapsed into one reading as every octave reading here is.
octave-readings/~-octave-day-3:
  source: Sermo sancti Augustíni Epíscopi; Homilía sancti Gregórii Papæ
  text: |
    Cum tam multi jam nati, atque defuncti essent reges Judæórum, numquid quemquam eórum adorándum Magi quæsiérunt? Non, quia nec quemquam eórum cælo loquénte didicérunt. Verúmtamen, quod prætereundum non est, hæc Magórum illuminátio magnum testimónium cæcitátis exstitit Judæórum. In terra eórum isti requirébant, quem illi in sua non agnoscebant.

    Apud eos isti infántem invenérunt, quem illi apud se negavérunt. In his terris de longinquo isti et peregrini púerum Christum nondum verba proméntem adoravérunt, ubi cives illi juvenem miracula faciéntem crucifixérunt. Isti in membris parvis Deum adoravérunt, illi in magnis factis nec tamquam hómini pepercérunt: quasi plus fúerit vidére novam stellam in ejus nativitáte fulgéntem, quam solem ejus in morte lugéntem.

    Jam vero quod éadem stella, quæ Magos perdúxit ad locum, ubi erat cum matre Vírgine Deus infans, quæ útique póterat eos ad ipsam perducere civitátem, se tamen subtraxit, nec eis prorsus appáruit, donec de civitáte, in qua Christus nascerétur, iídem ipsi interrogaréntur Judæi, et ipsi eam secúndum divinæ Scripturæ testimónium nominárent, ipsi dicerent: In Bethlehem Judæ. Sic enim scriptum est: Et tu Bethlehem terra Juda, non es minima in princípibus Juda: ex te enim éxiet Dux, qui regat pópulum meum Israël. Quid aliud hic significávit divina providéntia, nisi apud Judæos solas divinas litteras remansuras, quibus gentes instrueréntur, illi excæcarentur?

    Magi vero aurum, thus et myrrham déferunt. Aurum quippe Regi congruit, thus vero in Dei sacrifícium pónitur, myrrha autem mortuórum córpora condiúntur. Eum ergo Magi, quem adorant, étiam mysticis munéribus prædicant: auro Regem, thure Deum, myrrha mortalem. Sunt vero nonnulli hæretici, qui hunc Deum credunt, sed ubíque regnare nequáquam credunt. Hi profecto ei thus ófferunt, sed offerre étiam aurum nolunt. Et sunt nonnulli, qui hunc Regem existimant, sed Deum negant. Hi videlicet ei aurum ófferunt, sed offerre thus nolunt.

    Et sunt nonnulli, qui hunc et Deum et Regem faténtur, sed assumpsísse carnem mortalem negant. Hi nimirum ei aurum et thus ófferunt, sed offerre myrrham assumptæ mortalitátis nolunt. Nos ítaque nato Dómino offerámus aurum, ut hunc ubíque regnare fateámur: offerámus thus, ut credamus, quod is, qui in témpore appáruit, Deus ante témpora éxstitit: offerámus myrrham, ut eum, quem crédimus in sua divinitate impassibilem, credámus étiam in nostra fuísse carne mortalem.

    Quamvis in auro, thure, et myrrha intelligi et aliud potest. Auro namque sapiéntia designátur, Salomone attestante, qui ait: Thesaurus desiderábilis requiescit in ore sapiéntis. Thure autem, quod Deo incénditur, virtus oratiónis exprímitur, Psalmista testante, qui dicit: Dirigátur orátio mea sicut incensum in conspéctu tuo. Per myrrham vero carnis nostræ mortificátio figurátur. Unde sancta Ecclésia de suis operariis usque ad mortem pro Deo certántibus dicit: Manus meæ distillavérunt myrrham.
  responsory: |
    R. Tria sunt múnera pretiósa, quæ obtulérunt Magi Dómino in die ista, et habent in se divína mystéria: * In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram. V. Salútis nostræ auctórem Magi veneráti sunt in cunábulis, et de thesáuris suis mýsticas ei múnerum spécies obtulérunt. R. In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram.
  status: verified

# Sourced directly from the raw reference files (web/www/horas/Latin+English/Sancti/01-09.txt): the Epiphany octave's counted day 4 (Sundays not counted -- see OctaveConfig.skipsSunday). Lectio4-6 plus the Lectio7-9 continuation, bare Gospel incipit dropped, collapsed into one reading as every octave reading here is.
octave-readings/~-octave-day-4:
  source: Sermo sancti Leónis Papæ; Homilía sancti Gregórii Papæ
  text: |
    Celebrato próximo die, quo intemeráta virginitas humani generis edidit Salvatórem, Epiphaníæ nobis, dilectíssimi, veneranda festívitas dat perseverantiam gaudiórum: ut inter cognatárum solemnitátum vicina sacramenta, exsultatiónis vigor, et fervor fidei non tepescat. Ad ómnium enim hóminum spectat salútem, quod infántia mediatoris Dei et hóminum, jam universo declarabátur mundo, cum adhuc exíguo detinerétur oppídulo.

    Quamvis enim Israëliticam gentem, et ipsíus gentis unam familiam delegísset, de qua natúram univérsæ humanitátis assumeret: nóluit tamen intra maternæ habitatiónis angustias ortus sui latére primordia: sed mox ab ómnibus vóluit agnosci, qui dignátus est pro ómnibus nasci. Tribus ígitur Magis in regióne Oriéntis stella novæ claritátis appáruit, quæ illustrior ceteris pulchriorque sidéribus, fácile in se intuéntium óculos animosque convérteret: ut conféstim adverterétur, non esse otiosum, quod tam insólitum videbátur.

    Dedit ergo aspiciéntibus intelléctum, qui præstitit signum: et quod fecit intelligi, fecit inquiri, et se inveniéndum óbtulit requisítus. Sequúntur tres viri superni lúminis ductum, et prævii fulgoris indícium inténta contemplatióne comitántes, ad agnitiónem veritátis, gratiæ splendore ducúntur: qui humano sensu significátum sibi Regis ortum æstimavérunt in civitáte regia esse quæréndum. Sed qui servi susceperat formam, et non judicáre vénerat, sed judicári, Bethlehem præelégit nativitáti, Jerosolymam passióni.

    Magnum vero nobis aliquid Magi ínnuunt, quod in regiónem suam per aliam viam revertúntur. In eo namque quod admóniti faciunt, nobis profecto insinuant quid faciámus. Regio quippe nostra paradisus est: ad quam, Jesu cógnito, redire per viam, qua vénimus, prohibemur. A regióne étenim nostra superbiéndo, inobediendo, visibília sequéndo, cibum vétitum gustando discessimus: sed ad eam necesse est, ut flendo, obediendo, visibília contemnendo, atque appetítum carnis refrenando redeamus.

    Per aliam ergo viam ad regiónem nostram regrédimur: quóniam qui a paradisi gaudiis per delectaménta discessimus, ad hæc per laménta revocamur. Unde necesse est, fratres caríssimi, ut semper pávidi, semperque suspecti, ponámus ante óculos cordis, hinc culpas operis, illinc judícium extremæ districtiónis. Pensemus, quam districtus judex véniat, qui judícium minátur, et latet: terróres peccatóribus intentat, et tamen adhuc sústinet: et idcirco veníre citius differt, ut minus invéniat quod condemnet.

    Puniámus fletibus culpas, et cum Psalmistæ voce, præveniámus fáciem ejus in confessione. Voluptátum nos ergo fallacia nulla decipiat, nulla vana lætítia seducat. In próximo namque est judex, qui dixit: Væ vobis, qui ridetis nunc; quia lugébitis et flébitis. Hinc enim Sálomon ait: Risus dolori miscébitur: et, Extrema gaudii luctus óccupat. Hinc íterum dicit: Risum deputávi errórem, et gáudio dixi, Quid frustra decíperis? Hinc rursus ait: Cor sapiéntium ubi tristítia est: et cor stultórum ubi lætítia.
  responsory: |
    R. Tria sunt múnera pretiósa, quæ obtulérunt Magi Dómino in die ista, et habent in se divína mystéria: * In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram. V. Salútis nostræ auctórem Magi veneráti sunt in cunábulis, et de thesáuris suis mýsticas ei múnerum spécies obtulérunt. R. In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram.
  status: verified

# Sourced directly from the raw reference files (web/www/horas/Latin+English/Sancti/01-10.txt): the Epiphany octave's counted day 5 (Sundays not counted -- see OctaveConfig.skipsSunday). Lectio4-6 plus the Lectio7-9 continuation, bare Gospel incipit dropped, collapsed into one reading as every octave reading here is.
octave-readings/~-octave-day-5:
  source: Sermo sancti Máximi Epíscopi; Homilía sancti Hierónymi Presbýteri
  text: |
    In hac, dilectíssimi, celebritate, sicut relatu paternæ traditiónis instrúimur, multíplici nobis est festivitate lætándum. Ferunt enim, hódie Christum Dóminum nostrum vel stella duce a Géntibus adorátum: vel invitátum ad nuptias, aquas in vina vertisse; vel suscepto a Joánne baptismate, consecrasse fluénta Jordánis, suumque simul purificasse Baptistam.

    Sed quid potíssimum præsénti hoc factum sit die, nóverit ipse qui fecit: nos tamen crédere, nec dubitare debemus, quidquid illud est, factum esse pro nobis. Nam quod eum fulgentioris stellæ radiis incitáti adoravére Chaldæi, Deum verum Géntibus spes data est adorandi. Quod aquæ novo sunt ordine in vina mutátæ, novi nobis póculi prælibátum est sacraméntum. Quod autem baptizátus est Agnus Dei, regenerántis baptismi salutáre nobis munus est dedicátum.

    Oportet ítaque nos, fratres, ad honórem Salvatoris nostri, cujus nativitátem débita nuper cum exsultatióne transégimus, omni cum devotióne étiam hunc virtútum ejus celebrare natalem. Et quam recte tria hæc nobis uno acta in die mysteria prædicántur, qui ineffábilis Trinitátis arcanum uno Dei sub nómine confitemur! Per hæc ergo miracula Christus Dóminus Redémptor noster óculis se vóluit revelare mortalium, quátenus invisibilis ejus divinitas, quæ latebat in hómine, in opere non latéret.

    Vídimus enim stellam ejus in Oriénte. Ad confusiónem Judæórum, ut nativitátem Christi a Géntibus díscerent, óritur in Oriénte stella; quam futuram, Bálaam, cujus successores erant, vaticinio nóverant. Lege Numerórum librum. Deferúntur autem Magi stellæ indicio in Judǽam, ut sacerdótes a Magis interrogati, ubi Christus nascerétur, inexcusábiles fíerent de adventu ejus.

    At illi dixérunt ei: In Bethlehem Judææ. Librariórum hic error est. Putámus enim ab Evangelista primum éditum, sicut in ipso Hebráico légimus, Judæ, non Judææ. Quæ est enim aliárum géntium Bethlehem, ut ad distinctiónem ejus, hic Judææ ponerétur? Judæ autem idcirco scribitur, quia est et alia Bethlehem in Galilæa. Lege librum Jesu fílii Nave. Dénique et in ipso testimonio, quod de Michææ prophetía sumptum est, ita habétur: Et tu Bethlehem terra Juda.

    Et, apertis thesáuris suis, obtulérunt ei múnera, aurum, thus et myrrham. Pulcherrime munerum sacraménta Juvencus Presbyter uno versículo comprehéndit: Thus, aurum, myrrham, Regíque, hominíque, Deóque dona ferunt. Et responso accepto in somnis, ne redirent ad Herodem, per aliam viam reversi sunt in regiónem suam. Qui múnera obtulerant Dómino, consequenter responsum accipiunt, non per Angelum, sed per ipsum Dóminum: ut meritórum Joseph privilegium demonstrarétur. Revertúntur autem per aliam viam: quia infidelitáti miscéndi non erant Judæórum.
  responsory: |
    R. Tria sunt múnera pretiósa, quæ obtulérunt Magi Dómino in die ista, et habent in se divína mystéria: * In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram. V. Salútis nostræ auctórem Magi veneráti sunt in cunábulis, et de thesáuris suis mýsticas ei múnerum spécies obtulérunt. R. In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram.
