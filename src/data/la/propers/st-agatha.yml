# Matins Nocturn 2 reading for St. Agatha, Virgin and Martyr (Feb 5) —
# SanctiM/02-05.txt inherits the whole day (`@Sancti/02-05`) with no
# Nocturn 2/3 override, so this saint's own vita is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/02-05.txt, English/Sancti/02-05.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No responsory given in the source for these lessons.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Agatha virgo, in Sicília nobílibus paréntibus nata, quam Panormitáni et Catanénses civem suam esse dicunt, in persecutióne Decii imperatóris Cátanæ gloriósi martyrii corónam consecúta est. Nam cum pari pulchritúdinis et castitátis laude commendarétur, Quintiánus Sicíliæ prætor ejus amóre captus est. Sed cum, tentáta modis ómnibus ejus pudicítia, Agatham in suam senténtiam perdúcere non posset, christiánæ superstitiónis nómine comprehénsam, Aphrodísiæ cuidam mulíeri depravándam tradit. Quæ Aphrodísiæ consuetúdine cum de constántia coléndæ christiánæ fídei et servándæ virginitátis removéri non posset, núntiat illa Quintiáno se in Agatha óperam pérdere. Quare ille ad se Vírginem addúci jubet; et, Nonne, inquit, te pudet nóbili génere natam, húmilem et servílem Christianórum vitam ágere? Cui Agatha: Multo præstántior est christiána humílitas et sérvitus, regum ópibus ac supérbia.

        Quam ob rem irátus prætor hanc ei optiónem dat, velítne pótius venerári deos, an vim tormentórum subíre. At illa constans in fide, primum cólaphis cæsa míttitur in cárcerem; unde postrídie edúcta, cum in senténtia permanéret, admótis candéntibus láminis in equúleo torquétur. Tum ei mamílla abscínditur; quo in vúlnere Quintiánum appéllans Virgo, Crudélis, inquit, tyránne, non te pudet amputáre in fémina, quod ipse in matre suxísti? Mox conjécta in víncula, sequénti nocte a sene quodam, qui se Christi Apóstolum esse dicébat, sanáta est. Rursum evocáta a prætóre, et in Christi confessióne persevérans, in acutis téstulis et candéntibus carbónibus ei subjéctis volutátur.

        Quo témpore, ingénti terræmótu urbs tota contrémuit, ac duo paríetes, corruéntes, Silvínum et Falcónium íntimos prætóris familiáres oppressérunt. Quare veheméntius commóta civitáte, véritus pópuli tumúltum Quintiánus, Agatham semimórtuam clam redúci ímperat in cárcerem. Quæ sic Deum precáta: Dómine, qui me custodísti ab infántia, qui abstulísti a me amórem sæculi, qui me carníficum torméntis superiórem præstitísti, áccipe ánimam meam. Ea in oratióne migrávit in cælum, Nonis Februárii: cujus corpus a Christiánis sepelítur.
      status: verified
