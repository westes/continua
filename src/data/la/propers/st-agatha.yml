# text ("Stans beáta Agatha..."): web/www/horas/Latin/Sancti/02-05.txt's
# own [Ant 3] is a bare `@:Ant 1` cross-reference, same one-text-for-
# both-Vespers pattern as exaltation-of-the-holy-cross-magnificat-
# antiphon.yml's own header explains. (This feast's own Benedictus
# antiphon uses [Ant 2], already correct.)
magnificat-antiphon:
  text: 'Stans beáta Agatha * in médio cárceris, expánsis mánibus orábat ad Dóminum: Dómine Jesu Christe, magíster bone, grátias tibi ago, qui me fecísti víncere torménta carníficum: jube me, Dómine, ad tuam immarcescíbilem glóriam felíciter perveníre.'
  status: verified

