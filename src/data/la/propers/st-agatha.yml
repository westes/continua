# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2029-02-05 (clean year, per st-agatha.yml's own comment).
# Real proper content is narrow, same shape as Commemoration of St.
# Paul's own: only the chapter is genuinely her own (Sir 51:1-3,
# "Confitébor tibi, Dómine, Rex"); responsory, hymn, and versicle are
# all byte-identical to Common-of-a-Virgin-Martyr's own already-
# authored content -- duplicated under her own id rather than left to
# fall through (resolveOfficeBundle resolves a whole bundle per id, not
# per part). Same chapter reused for Vespers -- no separate vespers-
# capitulum-<id> file authored, per vespers.ts's
# lookupPart (Vespers chapter, Lauds sibling) fallback.
lauds-capitulum:
  text: 'Confitébor tibi, Dómine, Rex, et collaudábo te Deum Salvatórem meum. Confitébor nómini tuo: quóniam adjútor et protéctor factus es mihi, et liberásti corpus meum a perditióne.'
  citation: Eccli 51:1-3
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C6` live query, 2026-08 -- see lauds-capitulum-common-of-a-
# virgin-martyr.yml's header for why the votive-office view was used.
# "Jesu, coróna Vírginum" -- the classic Common-of-Virgins Lauds/Vespers
# hymn (same text both hours here), a single genuine recension found in
# the reference engine.
lauds-hymn:
  text: |-
    Jesu, coróna Vírginum,
    Quem Mater illa cóncipit
    Quæ sola Virgo párturit,
    Hæc vota clemens áccipe:

    Qui pascis inter lília
    Septus choréis Vírginum,
    Sponsus decórus glória
    Sponsísque reddens prǽmia.

    Quocúmque pergis, Vírgines
    Sequúntur, atque láudibus
    Post te canéntes cúrsitant,
    Hymnósque dulces pérsonant;

    Te deprecámur lárgius,
    Nostris adáuge sénsibus
    Nescíre prorsus ómnia
    Corruptiónis vúlnera.

    Laus, honor, virtus, glória
    Deo Patri et Fílio,
    Sancto simul Paráclito,
    In sæculórum sǽcula. Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C6` live query, 2026-08 -- see lauds-capitulum-common-of-a-
# virgin-martyr.yml's header for why the votive-office view was used.
lauds-responsory:
  text: |
    R.br. Spécie tua * Et pulchritúdine tua.
    R. Spécie tua * Et pulchritúdine tua.
    V. Inténde, próspere procéde, et regna.
    R. Et pulchritúdine tua.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Spécie tua * Et pulchritúdine tua.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C6` live query, 2026-08 -- same versicle as Vespers -- see
# vespers-versicle-st-agatha.yml's header.
lauds-versicle:
  text: |
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
  status: verified

