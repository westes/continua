  text: 'Paganórum * multitúdo fúgiens ad sepúlcrum Vírginis, tulérunt velum ejus contra ignem: ut comprobáret Dóminus, quod a perículis incéndii méritis beátæ Agathæ Mártyris suæ eos liberáret.'
  status: verified

# Vespers' Magnificat antiphon for St. Agatha -- genuinely identical to
