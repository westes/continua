# Matins Nocturn content for Tuesday of Lent week 1 — read from
# web/www/horas/{Latin,English}/Tempora/Quad1-2.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad1-2.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Bede homily
# split only to fill the fixed 3-lesson slot count). Responsory1 is a
# cross-reference (@Tempora/Quad1-0:Responsory4).
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Matt 21:10-17
      text: 'In illo témpore: Cum intrásset Jesus Jerosólymam, commóta est univérsa cívitas, dicens: Quis est hic? Pópuli autem dicébant: Hic est Jesus Prophéta a Názareth Galilǽæ. Et intrávit Jesus in templum Dei, et ejiciébat omnes vendéntes, et eméntes in templo; et mensas nummulariórum et cáthedras vendéntium colúmbas evértit: et dicit eis: Scriptum est: Domus mea domus oratiónis vocábitur: vos autem fecístis illam spelúncam latrónum. Et accessérunt ad eum cæci et claudi in templo: et sanávit eos. Vidéntes autem príncipes sacerdótum et scribæ mirabília, quæ fecit, et púeros clamantes in templo, et dicéntes: Hosánna fílio David: indignáti sunt, et dixérunt ei: Audis, quid isti dicunt? Jesus autem dixit eis: Utique. Numquam legístis: Quia ex ore infántium et lacténtium perfecísti laudem? Et relíctis illis, ábiit foras extra civitátem in Bethániam: ibíque mansit.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: The Venerable Bede, Priest, 11th Homily for Lent
      text: |-
        Quod maledicéndo ficum infructuósam per figúram fecit Dóminus, hoc idem mox apértius osténdit, eiciéndo ímprobos e templo. Neque enim áliquid peccávit arbor, quod esuriénte Dómino poma non hábuit, quorum necdum tempus advénerat: sed peccavére sacerdótes, qui in domo Dómini negótia sæculária gerébant, et fructum pietátis, quem debúerant, quemque in eis Dóminus esuriébat, ferre superséderant. Arefécit Dóminus árborem maledícto, ut hómines hæc vidéntes, sive audiéntes, multo magis intellégerent sese divíno condemnándos esse judício, si absque óperum fructu, de plausu tantum sibi religiósi sermónis, velut de sónitu et teguménto blandiréntur viridántium foliórum.

        Verum quia non intellexérunt, in ipsos consequénter districtiónem méritæ ultiónis exércuit: et ejécit commércia rerum humanárum de domo illa, in qua divínas tantum res agi, hóstias et oratiónes Dei offérri, verbum Dei legi, audíri, et decantári præcéptum erat. Et quidem credéndum est, quia ea tantum vendi vel emi repérerit in templo quæ ad ministérium necessária essent ejúsdem templi, juxta hoc quod álias factum légimus, cum idem templum ingrédiens, invénit in eo vendéntes et eméntes oves, et boves, et colúmbas: quia nimírum hæc ómnia non nisi ut offerréntur in domo Dómini, eos qui de longe vénerant, ab indígenis comparáre credéndum est.

        Si ergo Dóminus nec ea volébat venúmdari in templo, quæ in templo volébat offérri, vidélicet propter stúdium avarítiæ, sive fraudis, quod próprium solet esse negotiántium fácinus: quanta putas animadversióne puníret, si invenísset ibi áliquos rísui vel vanilóquio vacántes aut álii cuílibet vítio mancipátos? Si enim ea quæ álibi líbere geri póterant, Dóminus in domo sua temporália negótia geri non pátitur: quanto magis ea quæ nusquam fíeri licet, plus cæléstis iræ meréntur, si in ǽdibus Deo sacrátis agúntur? Verum quia Spíritus Sanctus in colúmba super Dóminum appáruit, recte per colúmbas Sancti Spíritus charísmata signántur. Qui autem sunt in templo Dei hódie, qui colúmbas vendunt, nisi qui in Ecclésia prétium de impositióne manus accípiunt, per quam vidélicet impositiónem Spíritus Sanctus cǽlitus datur?
      responsory: |-
        R. Emendémus in mélius, quæ ignoránter peccávimus: ne súbito præoccupáti die mortis, quærámus spátium pœniténtiæ, et inveníre non possímus: * Atténde, Dómine, et miserére, quia peccávimus tibi.
        V. Adjuva nos, Deus salutáris noster, et propter honórem nóminis tui, Dómine, líbera nos.
        R. Atténde, Dómine, et miserére, quia peccávimus tibi.
      status: verified
