# Lauds collect ([Oratio 2] in the source) — read from
# web/www/horas/{Latin,English}/Tempora/Quad1-2.txt.
collect:
  text: |
    Orémus.
    Réspice, Dómine, famíliam tuam, et præsta: ut apud te mens nostra tuo desidério fúlgeat, quæ se carnis maceratióne castígat.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Vespers collect ([Oratio 3] in the source), distinct from Lauds' own —
# read from web/www/horas/{Latin,English}/Tempora/Quad1-2.txt.
collect/~-vespers:
  text: |
    Orémus.
    Ascéndant ad te, Dómine, preces nostræ: et ab Ecclésia tua cunctam repélle nequítiam.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

