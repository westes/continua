# Matins Nocturn 2 reading for St. Leo IX, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/04-19-LeoIX.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Leo hujus nóminis nonus, ex nóbili Francorum prosapia oriundus, Dagsburgénsis comes, ac Tullénsis epíscopus, Bruno ántea dictus, ómnium Cardinálium suffrágiis, ac commúni fidélium gratulatione, ad sanctíssimam Petri sedem evéctus est, et in ea sedit annis quinque, duóbus ménsibus, diébus octo. Vir omni virtútum génere et sacra doctrína exímius, ut Apostolicum hoc munus impleret, nullis labóribus, nullis súmptibus, nullis incommodis pepércit.

        Germániam et Itáliam sǽpius, Gálliam semel visitávit. Hábuit novem concilia, Rhemis, Mogúntiæ, Vercéllis, Papiæ, Romæ, ad restaurándos Christianórum mores. Multas lítteras ad imperatores, reges, patriarchas, epíscopos, zelo ac pietáte flagrantes scripsit. Legátos ad imperatorem Constantinopolitanum, pro reductione Græcórum, semel atque íterum misit; Berengarium hæréticum semel iterumque damnávit, et Michaélem Cerulárium patriarcham, insígnem schismáticum, anathémate pérculit.

        Dum Romæ ágeret, ter in hebdómada a sacrosancta ecclésia Lateranénsi ad Vaticanam, nudis pédibus, noctu, orans et psallens pergebat. Principi Apostolórum decimam oblationum partem sibi de more competentem, pontifício diplomate cessit. Patrimónium suum próprium in erectionem monastérii impéndit: unde étiam quotánnis pecúnia submitteretur in sumptus rosæ aureæ, quam Románi Pontífices antiquo et solémni ritu benedicunt. In páuperes et peregrinos effusam liberalitátem exércuit. Sub leprosi forma et hábitu Christum aliquándo próprio lecto excépit. Dénique multis pro Ecclésia labóribus exantlátis, óbiit die décima nona Aprílis, anno millésimo quinquagésimo quarto, ante et post mortem multis miráculis clarus, ac sepúltus est in Vaticáno.
      status: verified
