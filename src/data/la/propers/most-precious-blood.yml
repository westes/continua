# New file, 2026-09-15: part of the same Prime Lectio Brevis sweep that
# built getPrimeLectioBrevis (see TODO.md's dated Work Log entry). Sourced
# directly from web/www/horas/Latin/Sancti/07-01.txt's own [Lectio Prima]
# tag and its English counterpart.
prime-lectio:
  text: 'Accípiens Móyses sánguinem vitulórum, et hircórum cum aqua et lana coccínea et hyssópo: ipsum quoque librum, et omnem pópulum aspérsit, dicens: Hic sanguis testaménti, quod mandávit ad vos Deus.'
  citation: Heb 9:19-20
  status: verified

# Sancti/07-01.txt [Capitulum Laudes] and [Responsory Breve Tertia].
terce-capitulum:
  text: |
    Fratres: Christus assístens Póntifex futurórum bonórum, per ámplius et perféctius tabernáculum non manufáctum, id est, non hujus creatiónis: neque per sánguinem hircórum aut vitulórum, sed per próprium sánguinem introívit semel in Sancta, ætérna redemptióne invénta.
    R. Deo grátias.
    V. Redemísti nos, Dómine in sánguine tuo.
    R. Ex omni tribu, et lingua, et pópulo, et natióne.
  citation: Heb 9:11-12
  status: verified

# Sancti/07-01.txt [Capitulum Sexta] and [Responsory Breve Sexta].
sext-capitulum:
  text: |
    Si sanguis hircórum, et taurórum, et cinis vítulæ aspérsus inquinátos sanctíficat ad emundatiónem carnis: quanto magis sanguis Christi, qui per Spíritum Sanctum semetípsum óbtulit immaculátum Deo, emundábit consciéntiam nostram ab opéribus mórtuis, ad serviéndum Deo vivénti?
    R. Deo grátias.
    V. Sanguis Jesu Christi Fílii Dei emúndat nos.
    R. Ab omni peccáto.
  citation: Heb 9:13-14
  status: verified

# Sancti/07-01.txt [Capitulum Nona] and [Responsory Breve Nona].
none-capitulum:
  text: |
    Accípiens Móyses sánguinem vitulórum, et hircórum cum aqua et lana coccínea et hyssópo: ipsum quoque librum, et omnem pópulum aspérsit, dicens: Hic sanguis testaménti, quod mandávit ad vos Deus.
    R. Deo grátias.
    V. Christus diléxit nos, et lavit nos in sánguine suo.
    R. Et fecit nos regnum, et sacerdótes Deo, et Patri.
  citation: Heb 9:19-20
  status: verified

# Sourced from web/www/horas/Latin/Sancti/07-01.txt's own [Hymnus
# Vespera] and English/Sancti/07-01.txt's own translation ("Festivis
# resonent compita vocibus").
vespers-hymn:
  text: |-
    Festívis résonent cómpita vócibus,
    Cives lætítiam fróntibus éxplicent,
    Tædis flammíferis órdine pródeant
    Instrúcti púeri et senes.

    Quem dura móriens Christus in árbore
    Fudit multíplici vúlnere sánguinem,
    Nos facti mémores dum cólimus, decet
    Saltem fúndere lácrimas.

    Humáno géneri pernícies gravis
    Adámi véteris crímine cóntigit:
    Adámi intégritas et píetas novi
    Vitam réddidit ómnibus.

    Clamórem válidum summus ab ǽthere
    Languéntibus Géniti si Pater áudiit,
    Placári pótius sánguine débuit,
    Et nobis véniam dare.

    Hoc quicúmque stolam sánguine próluit,
    Abstérgit máculas; et róseum decus,
    Quo fiat símilis prótinus Angelis
    Et Regi pláceat, capit.

    A recto instábilis trámite póstmodum
    Se nullus rétrahat, meta sed última
    Tangátur; tríbuet nóbile prǽmium,
    Qui cursum Deus ádjuvat.

    Nobis propítius sis, Génitor potens,
    Ut, quos unígenæ sánguine Fílii
    Emísti, et plácido Flámine récreas,
    Cæli ad cúlmina tránsferas. Amen.
  status: verified

