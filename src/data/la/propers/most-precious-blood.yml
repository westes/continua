# Read directly from web/www/horas/Latin/Sancti/07-01.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Omnípotens sempitérne Deus, qui unigénitum Fílium tuum mundi Redemptórem
    constituísti, ac ejus Sánguine placári voluísti: concéde, quǽsumus, salútis
    nostræ prétium solémni cultu ita venerári, atque a præséntis vitæ malis ejus
    virtúte deféndi in terris; ut fructu perpétuo lætémur in cælis.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat
    in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Fully proper feast -- own real [Ant 2]/[Versum 2] read directly from the reference engine's own Sancti file (Latin + English), not a Common-category substitute. Collect is the saint's own real proper (most-precious-blood-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Erit sanguis Agni * vobis in signum, dicit Dóminus; et vidébo sánguinem, et transíbo vos nec erit in vobis plaga dispérdens.
    V. Justificáti in sánguine Christi.
    R. Salvi érimus ab ira per ipsum.
    Orémus.
    Omnípotens sempitérne Deus, qui unigénitum Fílium tuum mundi Redemptórem
    constituísti, ac ejus Sánguine placári voluísti: concéde, quǽsumus, salútis
    nostræ prétium solémni cultu ita venerári, atque a præséntis vitæ malis ejus
    virtúte deféndi in terris; ut fructu perpétuo lætémur in cælis.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat
    in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Sancti/07-01.txt [Hymnus Matutinum] ("Ira justa Conditóris"), both languages; SanctiM/07-01.txt does not override it. 'Imbr[e]' in the source is a variant-letter marker, rendered 'Imbre'. Before this file the Precious Blood's Matins hymn fell to the ferial one.
matins-hymn:
  text: |
    Ira justa Conditóris,
    Imbre aquárum víndice,
    Criminósum mersit orbem
    Noë in arca sóspite:
    Mira tandem vis amóris
    Lavit orbem sánguine.

    Tam salúbri terra felix
    Irrigáta plúvia,
    Ante spinas quæ scatébat,
    Germinávit flósculos;
    Inque néctaris sapórem
    Transiére absýnthia.

    Triste prótinus venénum
    Dirus anguis pósuit,
    Et cruénta belluárum
    Désiit ferócia:
    Mitis Agni vulneráti
    Hæc fuit victória.

    O sciéntiæ supérnæ
    Altitúdo impérvia!
    O suávitas benígni
    Prædicánda péctoris!
    Servus erat morte dignus,
    Rex luit pœnam óptimus.

    Quando culpis provocámus
    Ultiónem júdicis,
    Tunc loquéntis protegámur
    Sánguinis præséntia;
    Ingruéntium malórum
    Tunc recédant ágmina.

    Te redémptus laudet orbis
    Grata servans múnera,
    O salútis sempitérnæ
    Dux et Auctor ínclite,
    Qui tenes beáta regna
    Cum Parénte et Spíritu.
    Amen.
  status: verified

# Read from web/www/horas/Latin/Sancti/07-01.txt's own [Invit] (no
# Monastic override exists) and its English counterpart.
matins-invitatory:
  text: Christum Dei Fílium, qui suo nos redémit sánguine, * Veníte, adorémus.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/07-01.txt's own [Capitulum
# Laudes] and English/Sancti/07-01.txt's own translation. Authoring this
# was necessary for the feast's own hymn (lauds-hymn-most-precious-
# blood.yml) to actually be reached at all: hours/resolve-common.ts's
# resolveOfficeBundle is all-or-nothing per id -- an id with no chapter
# of its own falls through its *whole* bundle to the Common's, hymn
# included, so a proper hymn with no matching proper chapter is silently
# unreachable dead content.
lauds-capitulum:
  text: 'Christus assístens Póntifex futurórum bonórum, per ámplius et perféctius tabernáculum non manufáctum, id est, non hujus creatiónis: neque per sánguinem hircórum aut vitulórum, sed per próprium sánguinem introívit semel in Sancta, ætérna redemptióne invénta.'
  citation: Hebr 9:11-12
  status: verified

# Sourced from web/www/horas/Latin/Sancti/07-01.txt's own [Hymnus Laudes]
# and English/Sancti/07-01.txt's own translation ("Salvete, Christi
# vulnera").
lauds-hymn:
  text: |-
    Salvéte, Christi vúlnera,
    Imménsi amoris pígnora
    Quibus perénnes rívuli
    Manant rubéntis sánguinis.

    Nitóre stellas víncitis
    Rosas odóre et bálsama,
    Prétio lapíllos Indicos,
    Mellis favos dulcédine.

    Per vos patet gratíssimum
    Nostris asýlum méntibus;
    Non huc furor minántium
    Umquam penétrat hóstium.

    Quot Jesus in prætório
    Flagélla nudus éxcipit!
    Quot scissa pellis úndique
    Stillat cruóris gúttulas!

    Frontem venústam, proh dolor!
    Coróna pungit spínea,
    Clavi retúsa cúspide
    Pedes manúsque pérforant.

    Postquam sed ille trádidit
    Amans volénsque spíritum,
    Pectus ferítur láncea,
    Geminúsque liquor éxsilit.

    Ut plena sit redémptio,
    Sub torculári stríngitur;
    Suíque Jesus ímmemor,
    Sibi nil resérvat sánguinis.

    Veníte quotquot críminum
    Funésta labes ínficit;
    In hoc salútis bálneo
    Qui se lavat, mundábitur.

    Summi ad Paréntis déxteram
    Sedénti habénda est grátia,
    Qui nos redémit sánguine,
    Sanctóque firmat Spíritu. Amen.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/07-01.txt's own [Versum 2],
