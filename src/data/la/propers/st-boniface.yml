# Matins Nocturn 2 reading for St. Boniface, Martyr (May 14). No
# genuine SanctiM match: the only SanctiM file for this date,
# `SanctiM/05-14M.txt`, is a wholly different, later saint (St.
# Pachomius, marked "1965") — a missed pre-1955-pool candidate rather
# than a genuine SanctiM case (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/05-14.txt, English/Sancti/05-14.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Bonifatius, civis Romanus, quod cum Aglaë nobili matrona impudíce versátus esset, tanto illíus intemperantiæ dolóre captus est, ut pœniténtiæ causa se ad conquirenda et sepelienda Mártyrum córpora contulerit. Itaque, relictis peregrinatiónis sociis, cum Tarsi multos propter christianæ fidei professiónem variis tormentis cruciatos vidísset; illórum víncula osculátus, eos veheméntius hortabátur, ut constanter supplícia perferrent, quod brevem labórem sempiterna requies consecutura sit. Comprehénsus ígitur, férreis ungulis excarnificátus est; cui étiam inter mánuum ungues et carnem acúti cálami sunt infixi, plumbumque liquefactum in os ejus infusum. Quibus in cruciátibus ea vox tantum Bonifatii audiebátur: Gratias tibi ago, Dómine Jesu Christe, Fili Dei. Mox in ollam ferventis picis demisso cápite conjéctus est; unde cum inviolátus exísset, ira incénsus judex eum secúri pércuti jubet. Quo témpore magnus terræmotus factus est, ita ut multi infidéles ad Christi Dómini fidem converteréntur. Eum sequénti die quæréntes socii, cum martyrio afféctum cognovíssent, quingentis solidis ejus corpus redemérunt, et condítum unguentis linteisque involutum Romam portándum curarunt. Quod factum cum ab Angelo Aglaë matrona, quæ et ipsa pœnitens se piis opéribus addixerat, cognovísset, prodiens obviam sancto corpori, ecclésiam ejus nómine ædificávit; in qua corpus sepúltum est Nonis Junii, cum ejus ánima pridie Idus Maji apud Tarsum Ciliciæ urbem migrasset in cælum, Diocletiáno et Maximiáno imperatóribus.'
      status: verified
