    V. Adorámus te, Christe, et benedícimus tibi, allelúia.
    R. Quia per Crucem tuam redemísti mundum, allelúia.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/05-03.txt's own [Lectio Prima] and its
# English counterpart.
prime-lectio:
  text: Humiliávit semetípsum factus obédiens usque ad mortem, mortem autem Crucis. Propter quod et Deus exaltávit illum, et donávit illi nomen, quod est super omne nomen.
  citation: Phil 2:8-9
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# live query, 2026-05-03 -- own proper hymn ("Vexílla Regis pródeunt,"
# one of the most widely known Latin hymns for the Holy Cross). See
# lauds-capitulum-finding-of-the-holy-cross.yml's header.
vespers-hymn:
  text: |-
    Vexílla Regis pródeunt:
    Fulget Crucis mystérium,
    Quo carne carnis Cónditor
    Suspénsus est patíbulo.

    Quo vulnerátus ínsuper
    Mucróne diro lánceæ,
    Ut nos laváret crímine,
    Manávit unda et sánguine.

    Impléta sunt quæ cóncinit
    David fidéli cármine,
    Dicens: In natiónibus
    Regnávit a ligno Deus.

    Arbor decóra et fúlgida,
    Ornáta Regis púrpura,
    Elécta digno stípite
    Tam sancta membra tángere.

    Beáta, cujus bráchiis
    Sæcli pepéndit prétium,
    Statéra facta córporis,
    Prædámque tulit tártari.

    O Crux, ave, spes única,
    In hoc Pascháli gáudio
    Auge piis justítiam,
    Reísque dona véniam.

    Te summa, Deus, Trínitas,
    Colláudet omnis spíritus:
    Quos per Crucis mystérium
    Salvas, rege per sǽcula. Amen.
  status: verified

