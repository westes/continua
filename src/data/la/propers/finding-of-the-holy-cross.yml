# Lauds' Benedictus antiphon for Finding of the Holy Cross (May 3) /
# Exaltation of the Holy Cross (Sept 14) -- read directly from
# web/www/horas/Latin/Sancti/05-03.txt's own [Ant 2] and its English
# counterpart. Also used by exaltation-of-the-holy-cross.yml, which points
# its own `propers` here directly rather than duplicating this file (her
# `ex Sancti/05-03` Rule reuses this content wholesale).
#
# Corrected 2026-09-13: this file previously held "O Crux, splendidior..."
# ([Ant 1]), which the reference engine's own antiphon-selection rule
# (horas.pl's canticum(), `$key = $num == 3 ? $vespera : $num`) actually
# assigns to First Vespers' Magnificat, not Lauds' Benedictus -- moved to
# finding-of-the-holy-cross-magnificat-antiphon.yml. `[Ant 2]` is what
# Lauds (and Second Vespers, sharing the same tag) actually use.
#
# The source's own trailing "(Allelúia.)" is stripped here: it's only
# correct when this feast's own date is in Paschaltide (Finding of the Holy
# Cross, May 3) but this same file is also reused verbatim by Exaltation of
# the Holy Cross (Sept 14, not Paschaltide). Base text here is
# season-neutral; `getBenedictusAntiphon` re-adds a Paschaltide-only
# ", allelúia" suffix via `withPaschaltideAlleluia`.
benedictus-antiphon:
  text: Super ómnia * ligna cedrórum tu sola excélsior, in qua Vita mundi pepéndit, in qua Christus triumphávit, et mors mortem superávit in ætérnum.
  status: verified

# Content read from the reference engine's live render (Monastic Tridentinum 1617, command=prayVespera): 05-03
# finding-of-the-holy-cross (OVERWRITE: stored file held the first-Vespers antiphon). See
# hours/resolve-common.ts's withVespersVariant.
magnificat-antiphon:
  text: 'Crucem sanctam súbiit, * qui inférnum confrégit: accínctus est poténtia, surréxit die tértia. Allelúia. '
  status: verified

# Content read from the reference engine's live render (Monastic Tridentinum 1617, command=prayVespera): 05-03
# finding-of-the-holy-cross (saint file = second). First Vespers variant; the default (second Vespers) file is
# the same id without "-first". See hours/resolve-common.ts's withVespersVariant.
magnificat-antiphon/~-first:
  text: 'O Crux, * splendídior cunctis astris, mundo célebris, homínibus multum amábilis, sánctior univérsis: quæ sola fuísti digna portáre taléntum mundi, dulce lignum, dulces clavos, dúlcia ferens póndera; salva præséntem catérvam in tuis hódie láudibus congregátam. Allelúia, allelúia. '
  status: verified

# Live-checked against the reference engine's own file (`../divinum-
# officium-reference`, `web/www/horas/Latin/SanctiM/05-03.txt`, Monastic
# Tridentinum 1617), not a live query. The [Rule]'s "Psalmi Dominica"
# line reads as if the plain Sunday psalm cursus applies -- the same
# misleading pattern already documented at all-saints.yml -- but the
# file's own [Ant Matutinum] block gives a real, distinct proper scheme:
# one single antiphon shared across all six psalms of each of Nocturn 1
# and Nocturn 2 (not one antiphon per psalm, per the file's own reuse of
# `@Sancti/05-03::N` for every psalm slot after the first in each block),
# and Nocturn 3 replaced outright with three Old Testament canticles
# (Habacuc 3:1-6, 3:7-12, 3:13-19 -- `Psalterium/Monastic canticles.txt`'s
# own numbered index, codes 246-248) under one more shared antiphon,
# rather than 3 psalms. Versicles inherited unchanged from the secular
# `Sancti/05-03.txt` file this Monastic one is layered over (`Versum 1`,
# `Versum 2`, `Nocturn 3 Versum`) -- same file both feasts' Lauds/Vespers
# proper texts already cite (see e.g. vespers-versicle-finding-of-the-
# holy-cross.yml). New scripture chapter verse authored for the third
# canticle: data/scripture/hab-3.yml's verse 19 (the chapter's first 18
# verses were already present from an earlier bulk import).
#
# Duplicated verbatim (only `id` differs) as saints/exaltation-of-the-
# holy-cross.yml, matching exaltation-of-the-holy-cross.yml's own header
# note that the Matins-content mechanisms have no cross-id lookup, so a
# saint whose own [Rule] is `ex Sancti/05-03` gets her own copy of this
# file rather than a shared one.
matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 1
          - 2
          - 4
          - 5
          - 8
          - 14
        antiphon: Invéntæ Crucis festa recólimus, cujus præcónium univérsum per orbem micánti lúmine fulget, allelúia.
    versicle:
      v: Hoc signum Crucis erit in cælo.
      r: Cum Dóminus ad judicándum vénerit.
  nocturn2:
    groups:
      - psalms:
          - 22
          - 26
          - 75
          - 95
          - 96
          - 97
        antiphon: Felix ille triúmphus fit salus ægris, vitæ lignum, mortis remédium, allelúia.
    versicle:
      v: Adorámus te, Christe, et benedícimus tibi.
      r: Quia per Crucem tuam redemísti mundum.
  nocturn3:
    antiphon: Adorámus te, Christe, et benedícimus tibi, quia per Crucem tuam redemísti mundum, allelúia.
    canticles:
      - refs:
          - book: hab
            chapter: 3
            verses: 1-6
      - refs:
          - book: hab
            chapter: 3
            verses: 7-12
      - refs:
          - book: hab
            chapter: 3
            verses: 13-19
    versicle:
      v: Omnis terra adóret te, et psallat tibi.
      r: Psalmum dicat nómini tuo, Dómine.

# Sancti/05-03.txt [Ant Laudes] (both languages), the five Lauds antiphons by position: three psalm groups, the canticle, Laudate. Psalmody is the 'Psalmi Dominica' scheme these feasts' [Rule] names (Ps 92 / 99 / 62, the Three Young Men, Ps 148-150), the same shape as apparition-of-st-michael.yml. Before this file the psalm antiphons fell to the ferial ones.
lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: 'O magnum pietátis opus: * mors mórtua tunc est, in ligno quando mórtua Vita fuit.'
    - psalms:
        - 99
      antiphon: 'Salva nos, * Christe Salvátor, per virtútem Crucis: qui salvásti Petrum in mari, miserére nobis.'
    - psalms:
        - 62
      antiphon: Ecce Crucem Dómini, * fúgite, partes advérsæ, vicit leo de tribu Juda, radix David, allelúia.
  canticle:
    id: canticum-trium-puerorum
    antiphon: Nos autem gloriári * opórtet in Cruce Dómini nostri Jesu Christi.
  laudate:
    antiphon: Per signum Crucis * de inimícis nostris líbera nos, Deus noster.

