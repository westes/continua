# Read directly from web/www/horas/Latin/Sancti/05-03.txt's own
# [Oratio] and its English counterpart -- fully proper text, not a
# Common template. Also used by exaltation-of-the-holy-cross.yml, which
# points its own `propers` here directly rather than duplicating this
# file (her `ex Sancti/05-03` Rule reuses this content wholesale).
collect:
  text: |
    Orémus.
    Deus, qui in præclára salutíferæ Crucis Inventióne, passiónis tuæ mirácula suscitásti:
    concéde; ut vitális ligni prétio, ætérnæ vitæ suffrágia consequámur:
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  status: verified

# Fully proper feast -- own real [Ant 2]/[Versum 2] read directly from the reference engine's own Sancti file (Latin + English), not a Common-category substitute. Collect is the saint's own real proper (finding-of-the-holy-cross-collect.yml), unchanged.
#
# KNOWN CAVEAT (2026-09-13, not fixed here): this file's own hardcoded
# "Allelúia" is only correct when whichever feast this commemoration bundle
# is rendering for (Finding of the Holy Cross, May 3, or Exaltation of the
# Holy Cross, Sept 14, via their shared `propers`) is being commemorated on
# a day actually within Paschaltide -- same bug class as the Vespers
# responsory/Benedictus antiphon leaks fixed this same session (see
# resolve-common.ts's withPaschaltideAlleluia). Left unfixed because
# `sanctoralCommemorationPart` (resolve-common.ts), this bundle's only
# caller, has no `LiturgicalDay` parameter to gate on -- would need
# threading `day` through that function and its callers, a larger change
# than this session's fix. Only actually wrong if Exaltation of the Holy
# Cross is ever displaced to a mere commemoration outside Paschaltide,
# which the app's calendar hasn't been confirmed to produce.
commemoration:
  text: |
    Ant. Super ómnia * ligna cedrórum tu sola excélsior, in qua Vita mundi pepéndit, in qua Christus triumphávit, et mors mortem superávit in ætérnum. Allelúia.
    V. Adorámus te, Christe, et benedícimus tibi.
    R. Quia per Crucem tuam redemísti mundum.
    Orémus.
    Deus, qui in præclára salutíferæ Crucis Inventióne, passiónis tuæ mirácula suscitásti:
    concéde; ut vitális ligni prétio, ætérnæ vitæ suffrágia consequámur:
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Matins
# live query, 2027-05-03 -- own proper hymn ("Pange, lingua, gloriósi
# Prœlium certáminis," the opening half of the "Pange lingua" family;
# Lauds' own "Lustris sex qui jam peráctis" is the continuation of the
# same original poem, covering the Passion itself, while this Matins
# portion covers the Fall and the Incarnation instead).
matins-hymn:
  text: |-
    Pange, lingua, gloriósi
    Prœlium certáminis,
    Et super Crucis trophǽo
    Dic triúmphum nóbilem,
    Quáliter Redémptor orbis
    Immolátus vícerit.

    De paréntis protoplásti
    Fraude Factor cóndolens,
    Quando pomi noxiális
    Morsu in mortem córruit,
    Ipse lignum tunc notávit,
    Damna ligni ut sólveret.

    Hoc opus nostræ salútis
    Ordo depopóscerat,
    Multifórmis proditóris
    Ars ut artem fálleret,
    Et medélam ferret inde,
    Hostis unde lǽserat.

    Quando venit ergo sacri
    Plenitúdo témporis,
    Missus est ab arce Patris
    Natus, orbis Cónditor,
    Atque ventre virgináli
    Carne amíctus pródiit.

    Vagit infans inter arcta
    Cónditus præsépia:
    Membra pannis involúta
    Virgo Mater álligat:
    Et manus, pedésque, et crura
    Stricta cingit fáscia.

    Glória, et honor Deo
    Usqueqáque Altíssimo,
    Una Patri, Filióque;
    Inclyto Paráclito:
    Cui laus est et potéstas,
    Per ætérna sǽcula. Amen.
  status: verified

# Read from web/www/horas/Latin/Sancti/05-03.txt's own [Invit] (no
# Monastic override exists) and its English counterpart.
matins-invitatory:
  text: Christum Regem crucifíxum, * Veníte, adorémus. (Allelúia.)
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2026-05-03 (fixed date, always within Paschaltide -- the
# Alleluias throughout this feast's texts are a genuine permanent
# feature, confirmed by the Vespers hymn's own "In hoc Pascháli gáudio"
# line, not seasonal contamination). Fully proper feast: own chapter
# (Phil 2:5-7), own distinct responsory/hymn/versicle at each hour.
# Shared with Exaltation of the Holy Cross (Sep 14, `propers: "finding-
# of-the-holy-cross"` in that saint's own file too) -- same real feast
# content, reused by design, not duplicated separately. Same chapter
# reused for Vespers -- no separate vespers-capitulum-<id> file
# authored, per vespers.ts's lookupPart (Vespers chapter, Lauds sibling) fallback.
lauds-capitulum:
  text: 'Fratres: Hoc enim sentíte in vobis, quod et in Christo Jesu: qui, cum in forma Dei esset, non rapínam arbitrátus est esse se æquálem Deo: sed semetípsum exinanívit, formam servi accípiens, in similitúdinem hóminum factus, et hábitu invéntus ut homo.'
  citation: Phil 2:5-7
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2026-05-03 -- own proper hymn ("Lustris sex qui jam
# peractis," part of the "Pange lingua gloriosi proelium" family). See
# lauds-capitulum-finding-of-the-holy-cross.yml's header.
lauds-hymn:
  text: |-
    Lustris sex qui jam peráctis,
    Tempus implens córporis,
    Se volénte natus ad hoc,
    Passióni déditus,
    Agnus in Crucis levátur
    Immolándus stípite.

    Hic acétum, fel, arúndo,
    Sputa, clavi, láncea:
    Mite corpus perforátur,
    Sanguis, unda prófluit:
    Terra, pontus, astra, mundus,
    Quo lavántur flúmine!

    Crux fidélis, inter omnes
    Arbor una nóbilis:
    Nulla silva talem profert
    Fronde, flore, gérmine:
    Dulce lignum, dulces clavos,
    Dulce pondus sústinet.

    Flecte ramos, arbor alta,
    Tensa laxa víscera,
    Et rigor lentéscat ille,
    Quem dedit natívitas:
    Ut supérni membra Regis
    Miti tendas stípite.

    Sola digna tu fuísti
    Ferre sæcli prétium,
    Atque portum præparáre
    Nauta mundo náufrago,
    Quem sacer cruor perúnxit,
    Fusus Agni córpore.

    Glória et honor Deo
    Usquequáque altíssimo:
    Una Patri, Filióque,
    Inclyto Paráclito:
    Cui laus est et potéstas
    Per ætérna sǽcula. Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
