# Matins Nocturn 2-3 readings for the Finding of the Holy Cross (May 3).
# Sourced directly from web/www/horas/Latin/Sancti/05-03.txt,
# English/Sancti/05-03.txt. (Lectio1-3, Gal 3:10-14/Phil 2:5-11/
# Col 2:9-15, is left to the bible-plan store as usual.)
#
# Nocturn 2: Lectio4-6 combined into one reading — the legend of St.
# Helena's finding of the True Cross, one continuous narrative, no
# genuine source break.
# Nocturn 3: Lectio7's Gospel citation (John 3:1-15) is a bare incipit
# ("Et réliqua") with no full pericope text given, so only the homily
# portion was originally authored (not marked isGospel), St. Augustine's
# homily on Nicodemus (Lectio7's homily + Lectio8 combined). The source
# has no Lectio9 at all for this feast (only 8 lessons total, an
# unusual but genuine structural feature of this particular office, not
# an omission here).
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily) — sourced from
# missa/Latin/Sancti/05-03.txt's own [Evangelium], English/Sancti/
# 05-03.txt, not guessed at. Identical to exaltation-of-the-holy-cross.yml's
# own Nocturn 3 Gospel (that feast's `ex Sancti/05-03` Rule reuses this
# feast's content wholesale) — the same pericope text is duplicated in
# both files, per this store's established pattern for that pairing.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Post insígnem victóriam, quam Constantínus imperátor, divínitus accépto signo Domínicæ Crucis, ex Maxéntio reportávit, Hélena Constantíni mater, in somnis admónita, conquiréndæ Crucis stúdio Jerosólymam venit; ubi marmóream Véneris státuam, in Crucis loco a Géntibus collocátam ad tolléndam Christi Dómini passiónis memóriam, post centum círciter octogínta annos, everténdam curávit. Quod item fecit ad præsépe Salvatóris et in loco resurrectiónis, inde Adónidis hinc Jovis subláto simulácro.

        Itaque loco Crucis purgáto, alte defóssæ tres cruces érutæ sunt, repertúsque seórsum ab illis Crucis Domínicæ títulus: qui cum ex tribus cui affíxus fuísset, non apparéret, eam dubitatiónem sústulit miráculum. Nam Macárius Jerosolymórum epíscopus, factis Deo précibus, síngulas cruces cuídam féminæ, gravi morbo laboránti, admóvit; cui cum réliquæ nihil profuíssent, adhíbita tértia Crux statim eam sanávit.

        Hélena, salutári Cruce invénta, magnificentíssimam ibi exstrúxit ecclésiam, in qua partem Crucis relíquit thecis argénteis inclúsam, partem Constantíno fílio détulit; quæ Romæ repósita fuit in ecclésia sanctæ Crucis in Jerúsalem, ædificáta in ædibus Sessoriánis. Clavos étiam áttulit fílio, quibus sanctíssimum Jesu Christi corpus fixum fúerat. Quo ex témpore Constantínus legem sancívit, ne crux ad supplícium cuíquam adhiberétur. Ita res, quæ ántea homínibus probro ac ludíbrio fúerat, veneratióni et glóriæ esse cœpit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joannes 3:1-15
      text: 'In illo témpore: Erat homo ex pharisǽis, Nicodémus nómine, princeps Judæórum. Hic venit ad Jesum nocte et dixit ei: Rabbi, scimus, quia a Deo venísti magíster; nemo enim potest hæc signa fácere, quæ tu facis, nisi fúerit Deus cum eo. Respóndit Jesus et dixit ei: Amen, amen, dico tibi, nisi quis renátus fúerit dénuo, non potest vidére regnum Dei. Dicit ad eum Nicodémus: Quómodo potest homo nasci, cum sit senex? Numquid potest in ventrem matris suæ iteráto introíre et renásci? Respóndit Jesus: Amen, amen, dico tibi, nisi quis renátus fúerit ex aqua et Spíritu Sancto, non potest introíre in regnum Dei. Quod natum est ex carne, caro est: et quod natum est ex spíritu, spíritus est. Non míreris, quia dixi tibi: opórtet vos nasci dénuo. Spíritus, ubi vult, spirat, et vocem ejus audis, sed nescis, unde véniat aut quo vadat: sic est omnis, qui natus est ex spíritu. Respóndit Nicodémus et dixit ei: Quómodo possunt hæc fíeri? Respóndit Jesus et dixit ei: Tu es magíster in Israël, et hæc ignóras? Amen, amen, dico tibi, quia, quod scimus, lóquimur, et quod vídimus, testámur, et testimónium nostrum non accípitis. Si terréna dixi vobis et non créditis: quómodo, si díxero vobis cœléstia, credétis? Et nemo ascéndit in cœlum, nisi qui descéndit de cœlo, Fílius hóminis, qui est in cœlo. Et sicut Móyses exaltávit serpéntem in desérto: ita exaltári opórtet Fílium hóminis, ut omnis, qui credit in ipsum, non péreat, sed hábeat vitam ætérnam.'
