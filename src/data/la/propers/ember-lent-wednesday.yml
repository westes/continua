# Read directly from web/www/horas/Latin/Tempora/Quad1-3.txt's own
# [Oratio 2] and its English counterpart -- the Lauds/ordinary-hours
# collect (Terce/Sext/None still reuse this text). Unlike September/
# Advent/Pentecost's Ember days (one shared [Oratio] for the whole day),
# Lent's Ember days give two genuinely different collect texts -- [Oratio
# 2] (Lauds) and [Oratio 3] (Vespers), per orationes.pl's own hour-indexed
# lookup ($ind = 2 at Lauds, the Vespers slot otherwise). The distinct
# Vespers text is now modeled too, see ember-lent-wednesday-collect-
# vespers.yml (retrofitted 2026-09-19 once hours/resolve-common.ts's
# getDayCollect gained a real per-hour mechanism; previously not modeled
# at all, same simplification level calendar/ember-days.ts's own doc
# comment describes for the rest of this app).
collect:
  text: |
    Orémus.
    Preces nostras, quǽsumus, Dómine, cleménter exáudi: et contra cuncta nobis adversántia déxteram tuæ majestátis exténde.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Vespers collect ([Oratio 3] in the source), distinct from Lauds' own
# ([Oratio 2], see ember-lent-wednesday-collect.yml) — read from
# web/www/horas/{Latin,English}/Tempora/Quad1-3.txt. Retrofitted
# 2026-09-19 alongside the wider Lent-ferias campaign, closing the gap
# ember-lent-wednesday-collect.yml's own header already flagged (this app
# previously had no per-hour collect-variation mechanism at all — see
# hours/resolve-common.ts's getDayCollect).
collect/~-vespers:
  text: |
    Orémus.
    Mentes nostras, quǽsumus, Dómine, lúmine tuæ claritátis illústra: ut vidére possímus quæ agénda sunt; et, quæ recta sunt, ágere valeámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Read directly from web/www/horas/Latin/Tempora/Quad1-3.txt's own
# [Ant 2] and its English counterpart, echoing Lectio1's Gospel line
# (Matt 12:39).
benedictus-antiphon:
  text: 'Generátio * hæc prava et pervérsa signum quærit: et signum non dábitur ei, nisi signum Jonæ prophétæ.'
  status: verified
  temporal: true

# Read directly from web/www/horas/Latin/Tempora/Quad1-3.txt's own
# [Ant 3] and its English counterpart, echoing Lectio1's Gospel line
# (Matt 12:40).
magnificat-antiphon:
  text: Sicut fuit Jonas * in ventre ceti tribus diébus et tribus nóctibus, ita erit Fílius hóminis in corde terræ.
  status: verified
  temporal: true

# Matins Nocturn content for Lent Ember Wednesday (Feria Quarta Quattuor
# Temporum Quadragesimæ) — Gospel pericope (Matt 12:38-50) sourced from
# web/www/missa/Latin/Tempora/Quad1-3.txt and missa/English/Tempora/
# Quad1-3.txt (horas/Tempora/Quad1-3.txt only gives the incipit + "Et
# réliqua"); homily sourced from horas/Latin/Tempora/Quad1-3.txt and
# horas/English/Tempora/Quad1-3.txt. No Monastic-track override exists —
# Latin/TemporaM/Quad1-3.txt is a bare `@Tempora/Quad1-3` pass-through
# (plus a Cistercian-only extra responsory, not used here).
#
# Recombined into one reading, same convention as September's Ember days
# (see ember-september-friday.yml's own doc comment for the fuller
# rationale): St. Ambrose's homily is one continuous text on the sign of
# Jonah, split only to fill the fixed 3-lesson slot count. Responsory:
# Lectio1/2's own (Responsory1/2) are bare cross-references to the 1st
# Sunday of Lent's own generic Nocturn responsories
# (@Tempora/Quad1-0:Responsory7/8, shared across the whole week's
# ferias, not proper to this day) — Lectio3's own Responsory3
# ("Abscóndite eleemósynam...") is genuinely proper to this day, so it's
# used here instead of the "first one, when several collapse" convention
# (which would pick a non-proper, merely-shared text over a real one).
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Matth 12:38-50
      text: 'In illo témpore: Respondérunt Jesu quidam de scribis et pharisǽis, dicéntes: Magíster, vólumus a te signum vidére. Qui respóndens, ait illis: Generátio mala et adúltera signum quærit: et signum non dábitur ei, nisi signum Jonæ Prophétæ. Sicut enim fuit Jonas in ventre ceti tribus diébus et tribus nóctibus: sic erit Fílius hóminis in corde terræ tribus diébus et tribus nóctibus. Viri Ninivítæ surgent in judício cum generatióne ista, et condemnábunt eam: quia pæniténtiam egérunt in prædicatióne Jonæ. Et ecce plus quam Jonas hic. Regína Austri surget in judício cum generatióne ista, et condemnábit eam: quia venit a fínibus terræ audire sapiéntiam Salomónis. Et ecce plus quam Sálomon hic. Cum autem immúndus spíritus exíerit ab hómine, ámbulat per loca árida, quærens réquiem, et non invénit. Tunc dicit: Revértar in domum meam, unde exívi. Et véniens invénit eam vacántem, scopis mundátam, et ornátam. Tunc vadit, et assúmit septem álios spíritus secum nequióres se, et intrántes hábitant ibi: et fiunt novíssima hóminis illíus pejóra prióribus. Sic erit et generatióni huic péssimæ. Adhuc eo loquénte ad turbas, ecce, Mater ejus et fratres stabant foris, quæréntes loqui ei. Dixit autem ei quidam: Ecce, mater tua et fratres tui foris stant, quæréntes te. At ipse respóndens dicénti sibi, ait: Quæ est mater mea, et qui sunt fratres mei? Et exténdens manum in discípulos suos, dixit: Ecce mater mea et fratres mei. Quicúmque enim fécerit voluntátem Patris mei, qui in cœlis est: ipse meus frater et soror et mater est.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Ambrose, Bishop, homily on Luke 11 (on the sign of Jonah)
      text: |-
        Judæórum plebe damnáta, Ecclésiæ mystérium evidénter exprímitur, quæ in Ninivítis per pœniténtiam, et in regína Austri per stúdium percipiéndæ sapiéntiæ, de totíus orbis fínibus congregátur, ut pacífici Salomónis verba cognóscat. Regína plane, cujus regnum est indivísum, de divérsis et distántibus pópulis in unum corpus assúrgens.

        Itaque sacraméntum illud magnum est de Christo et Ecclésia. Sed tamen hoc majus est, quia illud in figúra ante præcéssit, nunc autem plenum in veritáte mystérium est. Illic enim Sálomon typus, hic autem Christus in suo córpore est. Ex duóbus ígitur constat Ecclésia: ut aut peccáre nésciat, aut peccáre désinat. Pœniténtia enim delíctum ábolet, sapiéntia cavet.

        Céterum Jonæ signum, ut typus Domínicæ passiónis, ita étiam grávium, quæ Judǽi commíserint, testificátio peccatórum est. Simul advértere licet et majestátis oráculum, et pietátis indícium. Namque Ninivitárum exémplo et denuntiátur supplícium, et remédium demonstrátur. Unde étiam Judǽi debent non desperáre indulgéntiam, si velint ágere pœniténtiam.
      responsory: |-
        R. Abscóndite eleemósynam in sinu páuperum, et ipsa orábit pro vobis ad Dóminum: * Quia sicut aqua extínguit ignem, ita eleemósyna extínguit peccátum.
        V. Date eleemósynam, et ecce ómnia munda sunt vobis.
        R. Quia sicut aqua extínguit ignem, ita eleemósyna extínguit peccátum.
      status: verified
