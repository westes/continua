# Matins nocturn content for Easter Sunday itself (temporalId
# easter-sunday). Sourced from Tempora/Pasc0-0.txt (Latin) /
# English/Tempora/Pasc0-0.txt.
#
# Real structural note: unlike every other Sunday in this sweep, Easter's
# own [Rule] reads "1 nocturn" (Duplex I classis cum Octava Privilegiata I
# — the whole night office collapses to a single nocturn of 3 lessons,
# straight to Te Deum after Lectio3). This is NOT the same as "no Nocturn
# 2/3 content exists" — Lectio1-3 themselves carry real, genuine content
# (a Gospel incipit followed by a full patristic homily), just compressed
# into one nocturn instead of the usual three. hours/matins.ts already
# supports single-nocturn source content tagged `nocturn: 1` (see the
# Ember days' own nocturn-readings files) — this app's own `threeNocturns`
# rule (Sunday always gets 3 nocturns rendered, regardless of the
# historical single-nocturn rubric for this particular feast) reslots this
# pool across 3 rendered nocturns anyway; the `nocturn: 1` tag here only
# affects pool ordering relative to any other id contributing that day, not
# final placement.
#
# Lectio1 carries real homily prose after its bare Gospel incipit (Mark
# 16:1-7, "Et réliqua") — St. Gregory the Great's own homily (21st on the
# Gospels) begins within Lectio1 itself, same pattern used throughout this
# sweep. Combined Lectio1's homily portion (incipit dropped) with
# Lectio2-3 into one reading. Responsory: Lectio1's own (Responsory1,
# "Angelus Dómini descéndit de cælo") — the only nocturn-proper responsory
# transcribed in the source (Responsory2 exists but Responsory3 does not;
# the office runs straight to the Te Deum).
#
# Update (2026-09-05): the Gospel pericope itself (Mark 16:1-7) is now
# authored too (isGospel: true, immediately before the homily) — sourced
# from missa/Latin/Tempora/Pasc0-0.txt's own [Evangelium] (Easter
# Sunday's own Mass Gospel, the same pericope Lectio1's incipit points
# to) and its English parallel, not guessed at.
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Marc 16:1-7
      text: 'In illo témpore: María Magdaléne et María Jacóbi et Salóme emérunt arómata, ut veniéntes úngerent Jesum. Et valde mane una sabbatórum, véniunt ad monuméntum, orto jam sole. Et dicébant ad ínvicem: Quis revólvet nobis lápidem ab óstio monuménti? Et respiciéntes vidérunt revolútum lápidem. Erat quippe magnus valde. Et introëúntes in monuméntum vidérunt júvenem sedéntem in dextris, coopértum stola cándida, et obstupuérunt. Qui dicit illis: Nolíte expavéscere: Jesum quǽritis Nazarénum, crucifíxum: surréxit, non est hic, ecce locus, ubi posuérunt eum. Sed ite, dícite discípulis ejus et Petro, quia præcédit vos in Galilǽam: ibi eum vidébitis, sicut dixit vobis.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: Pope St. Gregory the Great, Homily 21 on the Gospels
      text: |-
        Audístis, fratres caríssimi, quod sanctæ mulíeres, quæ Dóminum fúerant secútæ, cum aromátibus ad monuméntum venérunt, et ei, quem vivéntem diléxerant, étiam mórtuo, stúdio humanitátis obsequúntur. Sed res gesta áliquid in sancta Ecclésia signat geréndum. Sic quippe necésse est ut audiámus quæ facta sunt, quátenus cogitémus étiam quæ nobis sint ex eórum imitatióne faciénda. Et nos ergo in eum, qui est mórtuus, credéntes, si odóre virtútum reférti, cum opinióne bonórum óperum Dóminum quǽrimus, ad monuméntum profécto illíus cum aromátibus venímus. Illæ autem mulíeres Angelos vident, quæ cum aromátibus venérunt: quia vidélicet illæ mentes supérnos cives aspíciunt, quæ cum virtútum odóribus ad Dóminum per sancta desidéria proficiscúntur.

        Notándum vero nobis est, quidnam sit, quod in dextris sedére Angelus cérnitur. Quid namque per sinístram, nisi vita præsens: quid vero per déxteram, nisi perpétua vita designátur? Unde in Cánticis canticórum scriptum est: Læva ejus sub cápite meo, et déxtera illíus amplexábitur me. Quia ergo Redémptor noster jam præséntis vitæ corruptiónem transíerat, recte Angelus qui nuntiáre perénnem ejus vitam vénerat, in déxtera sedébat. Qui stola cándida coopértus appáruit: quia festivitátis nostræ gáudia nuntiávit. Candor étenim vestis, splendórem nostræ denúntiat solemnitátis. Nostræ dicámus, an suæ? Sed ut fateámur vérius, et suæ dicámus, et nostræ. Illa quippe Redemptóris nostri resurréctio et nostra festívitas fuit, quia nos ad immortalitátem redúxit: et Angelórum festívitas éxstitit, quia nos revocándo ad cæléstia, eórum númerum implévit.

        In sua ergo ac nostra festivitáte Angelus in albis véstibus appáruit: quia dum nos per resurrectiónem Domínicam ad supérna redúcimur, cæléstis pátriæ damna reparántur. Sed quid adveniéntes féminas affátur, audiámus: Nolíte expavéscere. Ac si apérte dicat, Páveant illi, qui non amant advéntum supernórum cívium: pertiméscant, qui carnálibus desidériis pressi, ad eórum se societátem pertíngere posse despérant. Vos autem, cur pertiméscitis, quæ vestros concíves vidétis? Unde et Matthǽus Angelum apparuísse descríbens, ait: Erat aspéctus ejus sicut fulgur, et vestiménta ejus sicut nix. In fúlgure étenim terror timóris est, in nive autem blandiméntum candóris.
      responsory: |-
        R. Angelus Dómini descéndit de cælo, et accédens revólvit lápidem, et super eum sedit, et dixit muliéribus: * Nolíte timére: scio enim quia crucifíxum quǽritis: jam surréxit: veníte, et vidéte locum, ubi pósitus erat Dóminus, allelúia.
        V. Et introëúntes in monuméntum, vidérunt júvenem sedéntem in dextris, coopértum stola cándida, et obstupuérunt: qui dixit illis.
        R. Nolíte timére: scio enim quia crucifíxum quǽritis: jam surréxit: veníte, et vidéte locum, ubi pósitus erat Dóminus, allelúia.
      status: verified
