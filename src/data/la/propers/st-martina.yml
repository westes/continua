# Matins Nocturn 2 reading for St. Martina, Virgin, Martyr (Jan 30).
# Sourced directly from web/www/horas/Latin/Sancti/01-30.txt,
# English/Sancti/01-30.txt. Lectio4-6 combined into one reading, one
# continuous vita, no genuine source break. No Lectio7-9 in the source
# at all (a 6-lesson, not 9-lesson, office for this feast).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Martina virgo Romana, patre consulari, illustri genere nata, teneris, adhuc annis orbáta paréntibus, christianæ pietátis ardore succensa, divítias, quibus affluebat, mira in páuperes liberalitate distríbuit. Sub Alexandro príncipe, cum deos inánes cólere juberétur, immane fácinus summa libertáte detestátur. Quapropter íterum atque íterum affecta verbéribus, uncis, úngulis férreis, testárum fragmentis lacerata, acutíssimis gládiis membratim concisa, ádipe fervénti peruncta, demum in amphitheatro damnátur ad bestias; a quibus illǽsa divinitus evadens, in ardentem rogum injecta, incólumis pari beneficio servátur.

        Ex ejus tortóribus nonnulli, miraculi novitate correpti, Dei aspirante grátia, Christi fidem ampléxi, post cruciátus gloriósam martyrii palmam cápitis abscissióne promeruére. Ad ejusdem preces nunc terræmótibus exórtis, nunc ignibus e cælo tonante delapsis, deórum templa prostráta sunt et simulacra consumpta. Interdum ex vulnéribus lac cum sánguine erupit, splendorque nitidíssimus ac suavíssimus odor e corpore emanávit: intérdum sublimis regia in sede divinis laudibus una cum cælítibus interesse visa est.

        Hisce prodigiis ejusque in primis constantia, acriter permotus judex, caput Virgini amputari præcepit: qua perempta, auditáque de cælo voce, qua ad Súperos evocabátur, Urbs tota contrémuit, ac multi idolórum cultores ad Christi fidem convérsi sunt. Sacrum Martinæ corpus, sedénte sancto Urbano primo, martyrio afféctum, Urbano octavo Pontifice máximo, in pervetusta ejusdem ecclésia, ad Mamertinum carcerem, in Capitolini clivi radicibus, cum sanctórum Mártyrum Concordii, Epiphanii et Sociórum corpóribus repertum, eodem loco in meliórem formam redacto, atque decentius ornato, magno pópuli concursu, totius Urbis lætítia, solemni ritu ac pompa repósitum est.
      status: verified
