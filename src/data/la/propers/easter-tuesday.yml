# Matins content for Easter Tuesday (temporalId easter-tuesday, Pasc0-2 --
# "Die III infra octavam Paschæ"). Sourced from web/www/horas/Latin/
# Tempora/Pasc0-2.txt (Latin homily) / English/Tempora/Pasc0-2.txt
# (English homily); Gospel pericope from the Missal's own [Evangelium]
# (missa/Latin+English/Tempora/Pasc0-2.txt), same convention as
# easter-monday.yml.
#
# Single-nocturn source form, same structural note as easter-monday.yml.
# Lectio1's homily portion (incipit dropped) combined with Lectio2-3 into
# one continuous reading. Responsory: the source's own [Responsory1]
# ("Virtúte magna reddébant Apóstoli").
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Lucas 24:36-47
      text: 'In illo témpore: Stetit Jesus in médio discipulórum suórum et dicit eis: Pax vobis: ego sum, nolíte timére. Conturbáti vero et contérriti, existimábant se spíritum vidére. Et dixit eis: Quid turbáti estis, et cogitatiónes ascéndunt in corda vestra? Vidéte manus meas et pedes, quia ego ipse sum: palpáte et vidéte: quia spíritus carnem et ossa non habet, sicut me vidétis habére. Et cum hoc dixísset, osténdit eis manus et pedes. Adhuc autem illis non credéntibus et mirántibus præ gáudio, dixit: Habétis hic aliquid, quod manducétur? At illi obtulérunt ei partem piscis assi et favum mellis. Et cum manducásset coram eis, sumens relíquias, dedit eis. Et dixit ad eos: Hæc sunt verba, quæ locútus sum ad vos, cum adhuc essem vobíscum, quóniam necésse est impléri ómnia, quæ scripta sunt in lege Móysi et Prophétis et Psalmis de me. Tunc apéruit illis sensum, ut intellégerent Scriptúras. Et dixit eis: Quóniam sic scriptum est, et sic oportébat Christum pati, et resúrgere a mórtuis tértia die: et prædicári in nómine ejus pœniténtiam, et remissiónem peccatórum in omnes gentes.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Book 10, Commentary on Luke 24
      text: |-
        Mirum, quo modo se natúra corpórea per impenetrábile corpus infúderit invisíbili áditu, visíbili conspéctu: tangi fácilis, diffícilis æstimári. Dénique conturbáti discípuli æstimábant se spíritum vidére. Et ídeo Dóminus, ut spéciem nobis resurrectiónis osténderet: Palpáte, inquit, et vidéte, quia spíritus carnem et ossa non habet, sicut me vidétis habére. Non ergo per incorpóream natúram, sed per resurrectiónis qualitátem, impérvia usu clausa penetrávit. Nam quod tángitur, corpus est: quod palpátur, corpus est.

        In córpore autem resurgémus. Seminátur enim corpus animále, surgit corpus spiritále: sed illud subtílius, hoc crássius, útpote adhuc terrénæ labis qualitáte concrétum. Nam quómodo non corpus, in quo manébant insígnia vúlnerum, vestígia cicatrícum, quæ Dóminus palpánda óbtulit? In quo non solum fidem firmat, sed étiam devotiónem ácuit, quod vúlnera suscépta pro nobis cælo inférre máluit, abolére nóluit: ut Deo Patri nostræ prétia libertátis osténderet. Talem sibi Pater ad déxteram locat, trophǽum nostræ salútis ampléctens: tales illic Mártyres nobis cicatrícis suæ coróna monstrávit.

        Et quóniam sermo huc noster evásit, considerémus qua grátia secúndum Joánnem credíderint Apóstoli, qui gavísi sunt; secúndum Lucam quasi incréduli redarguántur: ibi Spíritum Sanctum accéperint, hic sedére in civitáte jubeántur, quoadúsque induántur virtúte ex alto. Et vidétur mihi ille quasi Apóstolus majóra et altióra tetigísse, hic sequéntia et humánis próxima: hic histórico usus circúitu, ille compéndio: quia et de illo dubitári non potest, qui testimónium pérhibet de iis, quibus ipse intérfuit, et verum est testimónium ejus: et ab hoc quoque, qui Evangelísta esse méruit, vel negligéntiæ, vel mendácii suspiciónem æquum est propulsári. Et ídeo verum putámus utrúmque, non sententiárum varietáte, nec personárum diversitáte distínctum. Nam etsi primo Lucas eos non credidísse dicat, póstea tamen credidísse demónstrat: et si prima considerémus, contrária sunt: si sequéntia, certum est conveníre.
      responsory: |-
        R. Virtúte magna reddébant Apóstoli, * Testimónium resurrectiónis Jesu Christi Dómini nostri, allelúia, allelúia.
        V. Repléti quidem Spíritu Sancto loquebántur cum fidúcia verbum Dei.
        R. Testimónium resurrectiónis Jesu Christi Dómini nostri, allelúia, allelúia.
      status: verified
