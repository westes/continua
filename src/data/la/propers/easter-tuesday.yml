# web/www/horas/English/Tempora/Pasc0-2.txt). See easter-monday-collect.yml's
# own header for sourcing/status convention.
collect:
  text: |
    Orémus.
    Deus, qui Ecclésiam tuam novo semper fœtu multíplicas: concéde fámulis tuis; ut sacraméntum vivéndo téneant, quod fide percepérunt.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft
  temporal: true

