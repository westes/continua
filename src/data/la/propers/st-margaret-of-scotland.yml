# Read directly from web/www/horas/Latin/Sancti/06-10.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui beátam Margarítam regínam exímia in páuperes caritáte mirábilem
    effecísti: da; ut, ejus intercessióne et exémplo, tua in córdibus nostris cáritas
    júgiter augeátur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-widow (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). st-margaret-of-scotland has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is the saint's own
# real proper (st-margaret-of-scotland-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Date ei de frúctu mánuum suárum, et laudent eam in portis ópera ejus.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, qui beátam Margarítam regínam exímia in páuperes caritáte mirábilem
    effecísti: da; ut, ejus intercessióne et exémplo, tua in córdibus nostris cáritas
    júgiter augeátur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

