# Nocturn 2-3, Trinity Sunday (temporalId post-pentecost-01, the Sunday
# after Pentecost - Duplex I classis, own full proper office, unlike the
# ordinary Sundays that follow it). Sourced from Tempora/Pent01-0.txt. See
# post-pentecost-02.yml for general sweep method.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from St. Fulgentius' book on
# the Faith addressed to Peter, on the Trinity. Responsory: Lectio4's own
# (the same "Percússit Saul" text reused for the Nocturn 2 slot every week
# this season, transcribed directly here rather than left as a
# cross-reference - Pent01 is itself the source the other weeks point back
# to via @Tempora/Pent01-2:ResponsoryN).
#
# Nocturn 3 has two distinct Gospel+homily pairs, since this is a major
# feast with its own extra "Commemoratio Dominicae" for the First Sunday
# after Pentecost it displaces: (a) Trinity's own Gospel (Matt 28:18-20, the
# Great Commission - Missale Tempora/Pent01-0.txt's own [Evangelium], not
# just the bare "Et réliqua" incipit the Matins source gives at Lectio7) plus
# St. Gregory Nazianzen's homily on it (Lectio7-8a, combined), using the
# "Duo Séraphim" responsory (Responsory8), reused every week; (b) the
# displaced First Sunday after Pentecost's own proper Gospel (Luke 6:36-42,
# "Estote misericordes" - sourced from Missale Tempora/Pent01-0a.txt, the
# older pre-Trinity-displacement Mass propers for this same Sunday) plus St.
# Augustine's homily on it, explicitly marked in the source as "Commemoratio
# Dominicae" (Lectio9). No responsory is proper to this final lesson in the
# source (it runs straight to the Te Deum after Responsory8's Gloria
# repeat), so none is authored here.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Fulgentius, Bishop of Ruspe, On the Faith, Addressed to Peter
      text: |-
        Fides, quam sancti Patriárchæ atque Prophétæ ante incarnatiónem Fílii Dei divínitus accepérunt, quam étiam sancti Apóstoli ab ipso Dómino in carne pósito audiérunt, et Spíritus Sancti magistério instrúcti non solum sermóne prædicavérunt, verum étiam ad instructiónem salubérrimam posterórum scriptis suis índitam reliquérunt; unum Deum prǽdicat Trinitátem, id est, Patrem, et Fílium, et Spíritum Sanctum. Sed Trínitas vera non esset, si una eadémque persóna dicerétur Pater et Fílius et Spíritus Sanctus.

        Si enim, sicut est Patris, et Fílii, et Spíritus Sancti una substántia, sic esset una persóna; nihil omníno esset in quo veráciter Trínitas dicerétur. Rursus quidem Trínitas esset vera, sed unus Deus Trínitas ipsa non esset, si quemádmodum Pater, et Fílius, et Spíritus Sanctus personárum sunt ab ínvicem proprietáte distíncti, sic fuíssent naturárum quoque diversitáte discréti. Sed quia in illo uno vero Deo Trinitáte, non solum quod unus Deus est, sed étiam quod Trínitas est, naturáliter verum est; proptérea ipse verus Deus in persónis Trínitas est, et in una natúra unus est.

        Per hanc unitátem naturálem totus Pater in Fílio et Spíritu Sancto est, totus Fílius in Patre et Spíritu Sancto est, totus quoque Spíritus Sanctus in Patre et Fílio. Nullus horum extra quémlibet ipsórum est: quia nemo álium aut præcédit æternitáte, aut excédit magnitúdine, aut súperat potestáte: quia nec Fílio nec Spíritu Sancto, quantum ad natúræ divínæ unitátem pértinet, aut antérior aut major Pater est; nec Fílii ætérnitas atque imménsitas, velut antérior aut major, Spíritus Sancti immensitátem æternitatémque aut præcédere aut excédere naturáliter potest.
      responsory: |-
        R. Percússit Saul mille, et David decem míllia: * Quia manus Dómini erat cum illo: percússit Philisthǽum, et ábstulit oppróbrium ex Israël.
        V. Nonne iste est David, de quo canébant in choro, dicéntes: Saul percússit mille, et David decem míllia?
        R. Quia manus Dómini erat cum illo: percússit Philisthǽum, et ábstulit oppróbrium ex Israël.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 28:18-20
      text: 'Data est mihi omnis potéstas in cœlo et in terra. Eúntes ergo docéte omnes gentes, baptizántes eos in nómine Patris, et Fílii, et Spíritus Sancti: docéntes eos serváre ómnia, quæcúmque mandávi vobis. Et ecce, ego vobíscum sum ómnibus diébus usque ad consummatiónem sǽculi.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Gregory Nazianzen, Patriarch of Constantinople, Treatise on the Faith
      text: |-
        Quis catholicórum ignórat Patrem vere esse Patrem, Fílium vere esse Fílium, et Spíritum Sanctum vere esse Spíritum Sanctum? sicut ipse Dóminus ad Apóstolos suos dicit: Eúntes baptizáte omnes gentes in nómine Patris, et Fílii, et Spíritus Sancti. Hæc est perfécta Trínitas in unitáte consístens, quam scílicet uníus substántiæ profitémur. Non enim nos secúndum córporum conditiónem, divisiónem in Deo fácimus; sed secúndum divínæ natúræ poténtiam, quæ in matéria non est, et nóminum persónas vere constáre crédimus, et unitátem divinitátis esse testámur.

        Nec extensiónem partis alicújus ex parte, ut quidam putavérunt, Dei Fílium dícimus: nec verbum sine re, velut sonum vocis, accípimus: sed tria nómina et tres persónas uníus esse esséntiæ, uníus majestátis atque poténtiæ crédimus. Et ídeo unum Deum confitémur: quia únitas majestátis, plúrium vocábulo deos próhibet appellári. Dénique Patrem et Fílium cathólice nominámus; duos autem Deos dícere, nec póssumus, nec debémus. Non quod Fílius Dei Deus non sit, immo verus Deus de Deo vero; sed quia non aliúnde, quam de ipso uno Patre, Dei Fílium nóvimus, perínde unum Deum dícimus. Hoc enim Prophétæ, hoc Apóstoli tradidérunt: hoc ipse Dóminus dócuit, cum dicit: Ego et Pater unum sumus. Unum ad unitátem divinitátis, ut dixi, refert; Sumus autem, persónis assígnat.
      responsory: |-
        R. Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.
        V. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.
        R. Plena est omnis terra glória ejus.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 6:36-42
      text: 'Estóte misericórdes, sicut et Pater vester miséricors est. Nolíte judicáre, et non judicabímini: nolíte condemnáre, et non condemnabímini. Dimíttite, et dimittémini. Date, et dábitur vobis: mensúram bonam et confértam et coagitátam et supereffluéntem dabunt in sinum vestrum. Eadem quippe mensúra, qua mensi fuéritis, remetiétur vobis. Dicébat autem illis et similitúdinem: Numquid potest cæcus cæcum dúcere? nonne ambo in fóveam cadunt? Non est discípulus super magistrum: perféctus autem omnis erit, si sit sicut magister ejus. Quid autem vides festúcam in óculo fratris tui, trabem autem, quæ in óculo tuo est, non consíderas? Aut quómodo potes dícere fratri tuo: Frater, sine, ejíciam festúcam de óculo tuo: ipse in oculo tuo trabem non videns? Hypócrita, ejice primum trabem de oculo tuo: et tunc perspícies, ut edúcas festúcam de óculo fratris tui.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: 'Commemoration of the First Sunday after Pentecost: St. Augustine, Bishop of Hippo, Sermon 15 on the Words of the Lord in Matthew'
      text: 'Duo sunt ópera misericórdiæ, quæ nos líberant, quæ bréviter ipse Dóminus pósuit in Evangélio: Dimíttite, et dimittétur vobis: date, et dábitur vobis. Dimíttite, et dimittétur vobis, ad ignoscéndum pértinet: Date, et dábitur vobis, ad præstándum benefícium pértinet. Quod ait de ignoscéndo, et tu vis tibi ignósci quod peccas, et habes álium, cui tu possis ignóscere. Rursus, quod pértinet ad tribuéndum benefícium, petit te mendícus, et tu es Dei mendícus. Omnes enim quando orámus, mendíci Dei sumus: ante jánuam magni Patrisfamílias stamus, immo et prostérnimur, súpplices ingemíscimus, áliquid voléntes accípere; et ipsum áliquid ipse Deus est. Quid a te petit mendícus? Panem. Et tu quid petis a Deo, nisi Christum, qui dicit: Ego sum panis vivus, qui de cælo descéndi? Ignósci vobis vultis? ignóscite: Remíttite, et remittétur vobis. Accípere vultis? date, et dábitur vobis.'
      status: verified
