# Read directly from web/www/horas/Latin/Sancti/10-17.txt's own
# [Oratio] and its English counterpart. Doxology "$Qui vivis" spelled
# out per the convention in st-bibiana-collect.yml.
collect:
  text: |
    Orémus.
    Dómine Jesu Christe, qui investigábiles divítias Cordis tui beátæ
    Margarítæ Maríæ Vírgini mirabíliter revelásti; da nobis ejus méritis
    et imitatióne; ut te in ómnibus et super ómnia diligéntes, jugem in
    eódem Corde tuo mansiónem habére mereámur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-virgin (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). st-margaret-mary-alacoque has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is the saint's own
# real proper (st-margaret-mary-alacoque-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Símile est regnum cælórum * hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Dómine Jesu Christe, qui investigábiles divítias Cordis tui beátæ
    Margarítæ Maríæ Vírgini mirabíliter revelásti; da nobis ejus méritis
    et imitatióne; ut te in ómnibus et super ómnia diligéntes, jugem in
    eódem Corde tuo mansiónem habére mereámur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  status: verified

# Matins Nocturn 2-3 readings for St. Margaret Mary Alacoque, Virgin
# (Oct 17). Sourced directly from
# web/www/horas/Latin/Sancti/10-17.txt, English/Sancti/10-17.txt.
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3: Lectio7's Gospel citation (Matt 11:25-30) is a bare
# "Et réliqua" incipit in the horas file, but the full pericope is
# this same day's own Mass Gospel -- sourced directly from
# web/www/missa/Latin+English/Sancti/10-17.txt's [Evangelium] and
# added 2026-09-05 (isGospel: true) immediately before the homily
# (Lectio7-9, three short excerpts from sermons of St. Francis de
# Sales).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Margarita Maria Alacóque, in pago diœcesis Augustodunénsis, honesto genere nata, jam inde a teneris annis futuræ sanctitátis indícia præbuit. In Deiparam Vírginem et in augustum Eucharistiæ sacraméntum amóre flagrans, adolescentula Deo virginitátem devovit, id exoptans unice ut ad christianas virtútes vitam compóneret. In deliciis habebat prolixas preces rerumque cæléstium contemplatiónem, sui contemptum, patiéntiam in adversis, corporis afflictatiónem, caritátem in próximos, præsertim egénos; summoque studio nitebátur ut sanctíssima divini Redemptoris exempla pro viribus referret.

        Ordinem Visitatiónis ingressa, statim religiosæ vitæ fulgóre nitére cœpit. Altioris dono oratiónis a Deo est decorata, aliisque gratiæ munéribus et crebris visiónibus. Harum celeberrima fuit cum ante Eucharistiam precanti Jesus semetípsum conspiciéndum obtulit, et divinum Cor in aperto péctore flammis incensum ac spinis constrictum osténdit, præcepitque ut, ob talem caritátem et ad ingratórum hóminum injurias expiandas, illa publicum Cordi suo cultum, magnis propositis cæléstis thesáuri præmiis, instituéndum curaret. Cunctanti ex humilitate seque tantæ rei ímparem profiténti amantíssimus Salvátor addit ánimum, simulque exímia sanctitáte virum, Claudium de la Colombiere, ducem et adjutórem designat; eamque spe fovet illíus summæ utilitátis, quæ póstea e divini Cordis cultu in Ecclésiam dimanávit.

        Ut jussa Redemptoris impleret Margarita omni diligéntia studebat. Nec tamen illi defuére molestiæ plures atque acres contumeliæ ab iis qui eam vano mentis errori obnoxiam esse dictitábant. Quæ ómnia æquo animo tulit, immo apponebat lucro, existimans se per oppróbria et dolóres hóstiam Deo gratam fore, et majora ad propositum suum auxília consecuturam. Religiosæ perfectiónis laude florens et per æternárum rerum contemplatiónem in dies síngulos cælésti sponso conjúnctior, ad eum evolávit, anno ætátis suæ quadragesimo tertio, reparátæ salútis millesimo sexcentésimo nonagesimo. Miraculis insignem Benedíctus décimus quintus Sanctis adscripsit; ejusque offícium Pius undecimus Pontifex maximus ad universam Ecclésiam extendit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 11:25-30
      text: 'In illo témpore: Respóndens Jesus, dixit: Confíteor tibi, Pater, Dómine cæli et terræ, quia abscondísti hæc a sapiéntibus et prudéntibus, et revelásti ea párvulis. Ita, Pater: quóniam sic fuit plácitum ante te. Omnia mihi trádita sunt a Patre meo. Et nemo novit Fílium nisi Pater: neque Patrem quis novit nisi Fílius, et cui volúerit Fílius reveláre. Veníte ad me, omnes, qui laborátis et oneráti estis, et ego refíciam vos. Tóllite jugum meum super vos, et discite a me, quia mitis sum et húmilis corde: et inveniétis réquiem animábus vestris. Jugum enim meum suave est et onus meum leve.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Francis de Sales, Sermons for Pentecost, the Third Sunday after Pentecost, and Easter Monday
      text: |-
        Nulla alia est vera sciéntia, nisi ea quæ a Spíritu Sancto datur, sed hæc humílibus tantummodo tribúitur. Nonne magnos vídimus theólogos qui mira dixérunt de virtútibus, sed ut eas non exercerent? E contra complures vídimus feminas, quæ de virtútibus dissérere nesciébant, sed virtútum ópera digne nóverant adimplére. Eas enim Spíritus Sanctus sapiéntes effécit, quia et timórem Dómini et pietátem et humilitátem habebant.

        Dóminus noster, magnus et præclaríssimus ómnium nostrárum infirmitátum medicus, antequam in hunc mundum veníret, per prophétas suos palam nuntiáverat: Quod confractum fúerit alligábo, et quod infirmum fúerit consolidábo. Et deínde suo ipse ore clamávit dicens: Veníte ad me omnes qui laborátis et oneráti estis, et ego reficiam vos. Quid ígitur mirum si ipsum ab ægrotis, a peccatóribus et publicanis circúmdatum cernimus? Nonne médici glória est ab ægrotis exquiri?

        Fert ille nostras misérias et jas nobilitat, apponit misériam Cordi suo, osténdit latus. Sed eum redamémus oportet, alioquin qui præ amóre osténdit vulnera, semel osténdet præ ira et indignatióne. Fac, o bone Jesu, ut pacem, quam offers, accipiámus, videamúsque vulnera tua, ut quandóquidem manent fides, spes, caritas, fide radicati, spe gaudéntes et caritate fervéntes, exspectémus beátam spem et advéntum tuum, ita ut in illo Te, Agnum ad déxteram non leónem ad sinistram videámus; ac pro fide visiónem, pro spe possessiónem et pro caritate imperfécta perféctam habeámus, in qua gaudébimus in sæcula sæculórum. Amen.
      status: verified
