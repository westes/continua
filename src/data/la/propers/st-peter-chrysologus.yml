# Read from the reference engine: web/www/horas/Latin/Sancti/12-04.txt [Oratio];
# English from English/Sancti/12-04.txt.
collect:
  text: |
    Orémus.
    Deus, qui beátum Petrum Chrysólogum Doctórem egrégium, divínitus præmonstrátum, ad regéndam et instruéndam Ecclésiam tuam éligi voluísti: præsta, quǽsumus; ut, quem Doctórem vitæ habúimus in terris, intercessórem habére mereámur in cælis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-a-confessor-doctor; collect is the saint's own (collect-st-peter-chrysologus.yml). Not
# independently live-verified for this category, so marked draft.
commemoration:
  text: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui beátum Petrum Chrysólogum Doctórem egrégium, divínitus præmonstrátum, ad regéndam et instruéndam Ecclésiam tuam éligi voluísti: præsta, quǽsumus; ut, quem Doctórem vitæ habúimus in terris, intercessórem habére mereámur in cælis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. Peter Chrysologus, Bishop, Confessor and Doctor of the Church. Sourced directly from
# web/www/horas/Latin/Sancti/12-04.txt, English/Sancti/12-04.txt.
# Lectio4-6 combined into one reading, one continuous vita.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Petrus, qui ob auream ejus eloquéntiam Chrysólogi cognomen adeptus est, Foro Cornelii in Æmília honestis paréntibus natus, a prima ætate ánimum ad religiónem adjíciens, Cornelio Romano, tunc ejusdem urbis Corneliénsis episcopo, operam dedit: a quo etiam, sciéntia et vitæ sanctitáte cum brevi profecísset, diaconus creátus est. Postmodum contigit, ut Ravennates ob mortem archipræsulis sui alium (ut moris erat) ab eis eléctum Romam ad sanctum Xystum Papam tertium pro confirmatióne miserint una cum legátis suis et cum prædicto Cornelio, qui eumdem levitam secum perdúxit. Interim sanctus Petrus Apóstolus, et Martyr Apollináris summo Pontifici in somnis apparuérunt, mediúmque habéntes hunc juvenem, jussérunt, ut illum, et non alium, in archiepiscopum Ravennæ crearet. Hinc Pontifex, mox ut vidit Petrum, cognóvit eum a Dómino eo præeléctum: proptérea, rejecto illo quem ipsi offerébant, hunc solum, anno Christi quadringentésimo trigesimo tertio, illi metropolitanæ præfecit ecclésiæ. Quod cum legáti Ravennatenses ægre ferrent, audíta visióne, divinæ voluntáti libenter acquiescéntes, novum archiepiscopum maxima cum reveréntia suscepérunt.

        Petrus ígitur, licet invitus, in archipræsulem consecratus, Ravennam dedúcitur; ubi a Valentiniáno imperatóre, et a Galla Placidia ejus matre, ac ab universo pópulo maxima lætítia exceptus est. Et ille ab eis id unum pétere dixit, ut quando tantum oneris pro ipsórum salúte subire non recusávit, studérent ipsi mónitis suis obtemperare, divinisque præceptis non obsistere. Duórum Sanctórum tunc ibi defunctórum córpora optimis unguentis condíta sepelívit, Barbatiáni videlicet presbyteri, et Germani Antisiodorénsis epíscopi; cujus étiam cucúllam et cilícium sibi vindicávit in hereditátem. Projectum et Marcellinum in episcopos ordinávit. In Classe fontem exstruxit magnitúdinis vere admirábilis, et templa quædam magnifica ædificávit tum beato Andreæ Apóstolo, tum aliis Sanctis. Ludos ab homínibus personátis cum variis saltatiónibus Kaléndis Januarii fíeri sólitos concióne cohibuit acerrima; ubi inter alia illud præcláre dixit: Qui jocari volúerit cum diabolo, non póterit gaudere cum Christo. Jussu sancti Leónis Papæ primi scripsit póstea ad Chalcedonénse Concílium advérsus hæresim Eutychétis. Respóndit præterea ad Eutychen ipsum et alia epistola, quæ eidem concílio in novis editiónibus præfixa, et in annales ecclesiásticos reláta fuit.

        Dum publice sermónes haberet ad pópulum, adeo vehemens erat in dicendo, ut præ nimio ardore vox illi intérdum defécerit, sicut cóntigit in concióne mulíeris hæmorrhoíssæ. Unde Ravennates commóti, tot lácrimis, clamóribus et oratiónibus locum replevérunt, ut póstea ipse grátias ágeret Deo, quod in lucrum amoris verterit damnum ejusdem sermónis. Cum tandem annos circiter decem et octo eam ecclésiam sanctíssime rexísset, labórum suórum finem adesse divinitus prænoscens, in pátriam se cóntulit; ubi sancti Cassiáni templum ingréssus, magnum diadéma aureum gemmis distinctum pretiosíssimis offerens, super altáre majus pósuit, necnon aureum cratérem, et patenam argenteam, quam tum rábidi canis morsus, tum febres sanare sæpius expertum est, aqua inde demíssa. Ex tunc Ravennates, qui eumdem secúti fuerant, dimísit, ádmonens, ut in eligéndo optimo pastore invigilárent attente. Mox Deum humíliter precátus et sanctum Cassianum patronum, ut benígne ánimam ejus exciperet, quarto Nonas Decembris plácide ex hac vita migrávit, anno Dómini circiter quadringentésimo quinquagesimo. Sacrum illíus corpus, communi totius civitátis fletu ac pietáte prope corpus ejusdem sancti Cassiáni honorifice cónditum, nostris étiam tempóribus religiose cólitur: cujus tamen brácchium, auro et gemmis ornátum Ravennam delátum, in Ursiana æde venerátur.
      status: verified
