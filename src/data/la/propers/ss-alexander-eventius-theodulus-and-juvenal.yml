# Verified against Divinum Officium (Monastic Tridentinum 1617), 2026-08.
# Pulled from the reference engine's own era-specific calendar table
# (web/www/Tabulae/Kalendaria/1570.txt + M1617.txt, own title
# "Ss. Alexandri I Papa, Eventino et Theoduli Mártyrum atque Juvenalis Confessoris") and its own source file, not the merged per-date
# files those tables' fileref points at directly -- see TODO.md.
collect:
  text: |
    Orémus.
    Præsta, quǽsumus, omnípotens Deus: ut, qui sanctórum tuórum Alexándri, Evéntii, Theodúli atque Juvenális natalícia cólimus; a cunctis malis imminéntibus, eórum intercessiónibus, liberémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-several-martyrs (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). ss-alexander-eventius-theodulus-and-juvenal has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is the saint's own
# real proper (ss-alexander-eventius-theodulus-and-juvenal-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Vestri capílli cápitis * omnes numeráti sunt: nolíte timére: multis passéribus melióres estis vos.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    Præsta, quǽsumus, omnípotens Deus: ut, qui sanctórum tuórum Alexándri, Evéntii, Theodúli atque Juvenális natalícia cólimus; a cunctis malis imminéntibus, eórum intercessiónibus, liberémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Matins Nocturn 2 reading for Ss. Alexander I, Pope, Eventius and
# Theodulus, Martyrs, and Juvenal, Bishop and Confessor (May 3) — the
# correct Tridentine file is the suffixed `Sancti/05-03r.txt` (whose
# own `Lectio93` in turn just repeats its `Lectio94`, the real proper
# text). `SanctiM/05-03rM.txt` matches this same suffix and bases
# `@Sancti/05-03r`, but narrows the feast's own Officium to the three
# martyrs alone (dropping Juvenal) — same "Monastic office narrows a
# joint feast" pattern already seen for `ss-vincent-and-anastasius.yml`
# and `ss-cletus-and-marcellinus.yml`; the full joint text (which
# genuinely covers all four, Juvenal included) is used here per
# vu-prefer-text-over-missing (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/05-03r.txt, English/Sancti/05-03r.txt.
# Single lesson (simplex-feast Lectio94), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Alexander Romanus, Hadriáno imperatóre regens Ecclésiam, magnam partem Romanæ nobilitátis ad Christum convértit. Is constítuit ut tantummodo panis et vinum in mysterio offerrétur: vinum autem aqua miscéri jussit, propter sánguinem et aquam, quæ ex Jesu Christi látere profluxérunt; et in Cánone Missæ addidit, Qui pridie quam paterétur. Idem decrevit ut aqua benedicta, sale admixto, perpetuo in ecclésia asservarétur, et in cubiculis adhiberétur ad fugándos dæmones. Sedit annos decem, menses quinque et dies viginti, vitæ sanctitáte et salutáribus institútis illustris. Martyrio coronátus est una cum Eventio et Theodúlo presbyteris, sepultúsque est via Nomentana, tertio ab Urbe lápide, eodem in loco, ubi secúri percússus fuerat; creátis diverso témpore mense Decembri presbyteris sex, diáconis duobus et epíscopis per diversa loca quinque. Eórum corpora, póstea in Urbem translata, in ecclésia sanctæ Sabinæ condita sunt. In eumdem diem incidit beáta mors sancti Juvenalis, Narniénsis epíscopi; qui, cum plurimos in ea urbe sanctitáte et doctrina Christo peperísset, clarus miraculis in pace quiévit ibique honorifice sepúltus est.'
      status: verified
