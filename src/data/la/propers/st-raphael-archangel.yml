# Read directly from web/www/horas/Latin/Sancti/10-24.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui beátum Raphaélem Archángelum Tobíæ fámulo tuo cómitem
    dedísti in via: concéde nobis fámulis tuis; ut ejúsdem semper
    protegámur custódia et muniámur auxílio.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

