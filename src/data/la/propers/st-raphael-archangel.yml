# Corrected 2026-09-10: this file previously contained "Tibi Christe
# splendor Patris" -- St. Michael's own Apparition hymn (May 8), copy-
# pasted from the wrong feast, same error as matins-hymn-st-gabriel-
# archangel.yml (see its own header for the fuller reasoning). Raphael's
# own file (Sancti/10-24.txt) has its own `[Hymnus Vespera]` -- "Christe,
# sanctórum decus Angelórum" with Raphael's own customizable middle stanza
# ("Angelus nostræ médicus salútis, Adsit e cælo Ráphaël...") -- reused
# verbatim by `[Hymnus Matutinum]`'s own `@Sancti/10-24:Hymnus Vespera`
# cross-reference. No separate Monastic recension exists. Final stanza is
# fixed -- no `*` marker anywhere in the source.
matins-hymn:
  text: |-
    Christe, sanctórum decus Angelórum,
    Gentis humánæ Sator et Redémptor,
    Cǽlitum nobis tríbuas beátas
    Scándere sedes.

    Angelus nostræ médicus salútis,
    Adsit e cælo Ráphaël, ut omnes
    Sanet ægrótos, dubiósque vitæ
    Dírigat actus.

    Virgo dux pacis Genetríxque lucis,
    Et sacer nobis chorus Angelórum
    Semper assístat, simul et micántis
    Régia cæli.

    Præstet hoc nobis Déitas beáta
    Patris, ac Nati, paritérque Sancti
    Spíritus, cujus résonat per omnem
    Glória mundum. Amen.
  status: verified

