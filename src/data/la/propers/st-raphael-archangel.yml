# Matins Nocturn 2-3 readings for St. Raphael the Archangel (Oct 24).
# Sourced directly from web/www/horas/Latin/Sancti/10-24.txt,
# English/Sancti/10-24.txt. Nocturn 2: Lectio4-6, St. Bonaventure's own
# sermon on the Holy Angels (no. 5, on St. Raphael), combined into one
# reading. Nocturn 3: the Matins lesson's own Gospel citation ends "Et
# réliqua"/"And so on" with no full pericope given there -- but same
# "chase it down via the Mass propers" pattern as all-saints.yml's own
# 2026-09-05 update: the full John 5:1-4 text is given in full at
# missa/Latin/Sancti/10-24.txt:51-54, missa/English/Sancti/10-24.txt:
# 42-45 (the Bethesda pool healing), so authored here as a real
# isGospel: true entry rather than skipped, followed by the homily
# (Lectio7-9, St. John Chrysostom).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Bonaventure, Sermon 5 on the Holy Angels
      text: |-
        Ráphaël interpretátur medicina Dei. Et debémus notare quod eductio a malo est per tria beneficia, a Raphaéle nobis colláta medicante nos. Educit ergo nos Ráphaël médicus ab infirmitáte animi, inducéndo nos ad amaritúdinem contritiónis; unde in Tobía dicit Ráphaël: Ubi introíeris domum tuam, lini super óculos ejus ex felle. Sic fecit, et vidit. Quare Ráphaël non pótuit ipse fácere? Quia Angelus non dat compunctiónem, sed osténdit viam. Per fel intellígitur amaritúdo contritiónis, quæ sanat óculos interioris mentis; Psalmus: Qui sanat contritos corde. Hoc est optimum collyrium. In Júdicum secundo dícitur quod Angelus ascéndit ad locum fléntium, et dixit pópulo: Eduxi vos de terra Ægypti, feci vobis tot et tanta bona; et flevit omnis pópulus, ita ut locus ille appellarétur locus fléntium. Caríssimi, Angeli tota die narrant nobis benefícia Dei, et reducunt ea nobis ad memóriam: Quis est qui te creávit, qui te redémit? Quid fecísti, quem offendísti? Hoc si consideráveris, nullum habes remédium nisi flere.

        Secundo Ráphaël edúcit de servitute diaboli, persuadéndo nobis memóriam passiónis Christi; in cujus figuram dictum est Tobíæ sexto: Cordis ejus particulam si super carbónes ponas, fumus ejus éxtricat omne genus dæmoniórum. Dícitur Tobíæ octavo quod pósuit Tobías particulam cordis super carbónes, et Ráphaël religávit dæmónium in desérto superioris Ægypti. Quid est hoc? Non poterat Ráphaël religare dæmónium nisi ponerétur cor super carbónes? Numquid cor piscis dabat Angelo tantam virtútem? Nequaquam! Nihil posset, nisi ibi mystérium esset. In hoc enim nobis datur intelligi quod nihil est quod ita nos líberet hódie a servitute diaboli sicut passio Christi, quæ processit ex radíce cordis sive caritátis. Cor enim fons est caloris cunctæ vitæ. Si ergo Cor Christi, hoc est passiónem quam sustinuit, procedéntem ex radíce caritátis et fonte caloris, ponas super carbónes, hoc est super inflammatam memóriam; statim dæmon religábitur, ut tibi nocére non possit.

        Tertio liberat nos a contrarietáte Dei, quam incurrimus per offensam Dei, et hoc inducéndo nos ad instantiam oratiónis; et hoc est quod dixit angelus Ráphaël Tobíæ duodecimo: Quando orabas cum lácrimis, ego óbtuli oratiónem tuam Dómino. Ipsi enim Angeli reconciliant nos Deo, quantum possunt. Accusatores nostri coram Deo sunt dæmones. Angeli autem excusant nos, quando ófferunt oratiónes nostras, ad quas devote faciendas nos inducunt; Apocalypsis octavo: Ascéndit fumus arómatum in conspéctu Dómini de manu Angeli. Arómata ista suáviter redoléntia sunt oratiónes Sanctórum. Vis placare Deum, quem offendísti? Ora devote. Offérunt Deo oratiónem tuam, ut te Deo reconcilient. Dícitur in Luca quod Christus, factus in agonía, prolixius orabat, et appáruit Angelus Dómini confortans eum. Et hoc totum factum est propter nos, quia non indiguit confortatióne sua, sed ut ostenderétur quod libenter assistunt devote orántibus, et libenter juvant eos et ipsos confortant, et oratiónes eórum Deo ófferunt.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joann 5:1-4
      text: 'In illo témpore: Erat dies festus Judæórum, et ascéndit Jesus Jerosólymam. Est autem Jerosólymis Probática piscína, quæ cognominátur hebráice Bethsaida, quinque pórticus habens. In his jacébat multitúdo magna languéntium, cæcórum, claudórum, aridórum exspectántium aquæ motum. Angelus autem Dómini descendébat secúndum tempus in piscínam, et movebátur aqua. Et, qui prior descendísset in piscínam post motiónem aquæ, sanus fiebat, a quacúmque detinebátur infirmitáte.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. John Chrysostom, Homily 35 (or 36) on John
      text: |-
        Quis hic curatiónis modus? quale mystérium subindicátur? Neque enim sine causa hæc scripta sunt; sed futura nobis quasi in figura et imagine describit, ne, si res stupenda accideret inexspéctata, auditórum multórum fidem aliquátenus labefactáret. Quænam ígitur hæc descriptio? Futurum baptisma dandum erat, plenum virtúte et grátia maxima, baptisma, quod peccáta ómnia ablúeret, quod ex mórtuis vivos redderet. Hæc ergo ut in imagine depingúntur in piscina et in aliis multis. Et primo quidem aquam dedit, quæ córporum máculas ablúeret, sordesque non veras, sed tales existimátas, ex funere nempe, ex lepra, et similes; multaque vidére est eádem de causa in veteri lege per aquam mundata.

        Sed ad propositum jam redeamus. Primo ítaque, ut diximus, córporum maculas, deínde varias infirmitátes per aquam solvi curat. Ut enim nos Deus ad baptismi grátiam propius reduceret, non jam maculas solum, sed et morbos sanat. Imagines enim quæ propius ad veritátem accedunt, et in baptismate, et in passióne, et in aliis magis conspicuæ sunt quam vetustiores. Quemádmodum enim qui prope regem sunt satéllites, remotióribus sunt honoratiores; ita et in figuris factum est. Et Angelus descéndens turbábat aquam, et sanándi vim indebat ipsi, ut discerent Judæi, Angelórum Dóminum multo magis posse ánimæ morbos omnes curare. Sed, quemádmodum hic aquárum natúra non simpliciter curábat (alioquin enim semper id fáceret), sed Angeli operatióne id fiebat; sic in nobis non aqua simpliciter operátur, sed, postquam Spíritus grátiam accéperit, tunc ómnia solvit peccáta.

        Circa hanc piscinam jacebat multitúdo magna infirmórum, cæcórum, claudórum, aridórum, aquæ motum exspectántium. Sed tunc infirmitas impediménto erat quóminus is qui vellet, sanarétur; nunc autem unusquísque potestátem accedéndi habet. Non enim Angelus est qui aquam movet, sed Angelórum Dóminus ómnia éfficit. Nec dicere póssumus: Dum ego accedo, alius ante me descéndit. Sed, si totus orbis venerit, grátia non consúmitur, neque vis vel operátio déficit, sed semper éadem manet. Ac, quemádmodum solares radii quotídie illúminant, nec absumúntur, neque, quod multis subministréntur, lucis quídpiam amittunt; sic, immo multo minus, Spíritus operátio minúitur a multitúdine accipiéntium.
      status: verified

# Lauds psalmody: the usual Duplex-majus set (92, 99, 62, Canticum Trium
# Puerorum, Laudate) with antiphons from the reference's Sancti/10-24.txt [Ant Laudes] (which is its [Ant Vespera]).
lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: Missus est * Angelus Ráphaël ad Tobíam et Saram, ut curáret eos.
    - psalms:
        - 99
      antiphon: 'Ingréssus Angelus * ad Tobíam, salutávit eum, et dixit: Gáudium sit tibi semper.'
    - psalms:
        - 62
      antiphon: 'Forti ánimo * esto, Tobía: in próximo enim est ut a Deo curéris.'
  canticle:
    id: canticum-trium-puerorum
    antiphon: Benedícite Deum cæli, * et coram ómnibus vivéntibus confitémini illi, quia fecit vobíscum misericórdiam suam.
  laudate:
    antiphon: 'Pax vobis, * nolíte timére: Deum benedícite, et cantáte illi.'

# Matins invitatory, moved here from the retired common-of-an-angel.yml
