# Transcribed directly from the reference engine's own source files
# (Latin: web/www/horas/Latin/Sancti/10-24.txt, English:
# web/www/horas/English/Sancti/10-24.txt), Monastic Tridentinum 1617
# rubric. Companion file to ../apparition-of-st-michael.yml — see that
# file's own header for the "Common-of-an-Angel doesn't exist" context.
# `10-24.txt`'s own [Rank]/[Rule] read "ex Sancti/05-08" as a whole-file
# default, but its own [Ant Matutinum] block overrides with 9 fully
# distinct proper antiphons narrating the Book of Tobias episodes —
# genuinely proper, matching this saint's own calendar-file comment
# ("Real, unique collect/antiphon/Nocturn 2-3 content"). Psalm 14's own
# antiphon carries a fixed, non-seasonal "allelúia" in its own text (not
# a Paschaltide addition — Oct 24 is never in Paschaltide).
#
# Versicles are a genuine mix, unlike the other angel feasts: Nocturn 1
# and Nocturn 3 both have their OWN proper versicle in this file (not
# inherited); only Nocturn 2's `[Nocturn 2 Versum]` explicitly redirects
# (`@Sancti/05-08:Nocturn 2 Versum_`) to Apparition of St. Michael's own
# ("Ascéndit fumus arómatum..." — see apparition-of-st-michael.yml),
# without her Paschaltide alleluia.
matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 8
        antiphon: Egréssus Tobías * invénit júvenem præcínctum, et quasi parátum ad ambulándum, et, ignórans quod Angelus esset, salutávit eum.
      - psalms:
          - 10
        antiphon: 'Angelus Ráphaël * seípsum occúltans, ait: Ego sum Azarías, magni Ananíæ fílius.'
      - psalms:
          - 14
        antiphon: Sanum ducam * fílium tuum in regiónem Medórum, et sanum tibi redúcam, allelúia.
      - psalms:
          - 18
        antiphon: 'Dixit autem Angelus: * Apprehénde bránchiam piscis, et trahe eum extra aquas.'
      - psalms:
          - 23
        antiphon: Obsecro te, * Azaría frater, ut dicas mihi, quod remédium habébunt ista, quæ de pisce serváre jussísti.
      - psalms:
          - 33
        antiphon: Lúmina fel sanat, * sed virtus cordis et jécoris diáboli expéllit potestátem.
    versicle:
      v: Data sunt Angelo incénsa multa.
      r: Ut adoléret ea ante altáre áureum, quod est ante óculos Dómini.
  nocturn2:
    groups:
      - psalms:
          - 95
        antiphon: Est hic Sara * Raguélis fília; quæ tibi conjúgio dábitur, et omnis substántia ejus.
      - psalms:
          - 96
        antiphon: Septem viros hábuit, * quos dæmónium oppréssit; tímeo ne mihi símile contíngat.
      - psalms:
          - 102
        antiphon: Per tres dies * oratióni cum uxóre tua vacábis, ut in sémine Abrahæ benedictiónem in fíliis consequáris.
    versicle:
      v: Ascéndit fumus arómatum in conspéctu Dómini.
      r: De manu Angeli.
  nocturn3:
    versicle:
      v: Apprehéndit Angelus Ráphaël dæmónium.
      r: Et religávit illud in desérto superióris Ægýpti.

