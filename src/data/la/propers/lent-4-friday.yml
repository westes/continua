# Matins Nocturn content for Friday in the 4th week of Lent — read from
# web/www/horas/{Latin,English}/Tempora/Quad4-5.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad4-5.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Augustine
# homily split only to fill the fixed 3-lesson slot count). Responsory1 is
# a cross-reference (@Tempora/Quad4-0:Responsory4, the 4th Sunday of
# Lent's own) — used here per the "the first one, when several collapse"
# convention.
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Joann 11:1-45
      text: 'In illo témpore: Erat quidam languens Lázarus a Bethánia, de castéllo Maríæ et Marthæ, soróris ejus. (María autem erat, quæ unxit Dóminum unguénto, et extérsit pedes ejus capíllis suis: cujus frater Lázarus infirmabátur.) Misérunt ergo soróres ejus ad eum, dicéntes: Dómine, ecce, quem amas infirmátur. Audiens autem Jesus, dixit eis: Infírmitas hæc non est ad mortem, sed pro glória Dei, ut glorificétur Fílius Dei per eam. Diligébat autem Jesus Martham et sorórem ejus, Maríam, et Lázarum. Ut ergo audívit, quia infirmabátur, tunc quidem mansit in eódem loco duóbus diébus. Déinde post hæc dixit discípulis suis: Eámus in Judǽam íterum. Dicunt ei discípuli: Rabbi, nunc quærébant te Judǽi lapidáre, et íterum vadis illuc? Respóndit Jesus: Nonne duódecim sunt horæ diéi? Si quis ambuláverit in die, non offéndit, quia lucem hujus mundi videt: si autem ambuláverit in nocte, offéndit, quia lux non est in eo. Hæc ait, et post hæc dixit eis: Lázarus, amícus noster, dormit: sed vado, ut a somno éxcitem eum. Dixérunt ergo discípuli ejus: Dómine, si dormit, salvus erit. Díxerat autem Jesus de morte ejus: illi autem putavérunt, quia de dormitióne somni díceret. Tunc ergo Jesus dixit eis maniféste: Lazarus mórtuus est: et gáudeo propter vos, ut credátis, quóniam non eram ibi: sed eámus ad eum. Dixit ergo Thomas, qui dícitur Dídymus, ad condiscípulos: Eámus et nos, ut moriámur cum eo. Venit itaque Jesus, et invénit eum quátuor dies jam in monuménto habéntem. (Erat autem Bethánia juxta Jerosólymam quasi stádiis quíndecim.) Multi autem ex Judǽis vénerant ad Martham et Maríam, ut consolaréntur eas de fratre suo. Martha ergo, ut audívit quia Jesus venit, occúrrit illi: María autem domi sedébat. Dixit ergo Martha ad Jesum: Dómine, si fuísses hic, frater meus non fuísset mórtuus: sed et nunc scio, quia, quæcúmque popósceris a Deo, dabit tibi Deus. Dicit illi Jesus: Resúrget frater tuus. Dicit ei Martha: Scio, quia resúrget in resurrectióne in novíssimo die. Dixit ei Jesus: Ego sum resurréctio et vita: qui credit in me, étiam si mórtuus fúerit, vivet: et omnis, qui vivit et credit in me, non moriétur in ætérnum. Credis hoc? Ait illi: Utique, Dómine, ego crédidi, quia tu es Christus, Fílius Dei vivi, qui in hunc mundum venísti. Et cum hæc dixísset, ábiit et vocávit Maríam, sorórem suam, siléntio, dicens: Magíster adest, et vocat te. Illa ut audívit, surgit cito, et venit ad eum: nondum enim vénerat Jesus in castéllum; sed erat adhuc in illo loco, ubi occúrrerat ei Martha. Judǽi ergo, qui erant cum ea in domo et consolabántur eam, cum vidíssent Maríam, quia cito surréxit et éxiit, secúti sunt eam, dicéntes: Quia vadit ad monuméntum, ut ploret ibi. María ergo, cum venísset, ubi erat Jesus, videns eum, cécidit ad pedes ejus, et dicit ei: Dómine, si fuísses hic, non esset mórtuus frater meus. Jesus ergo, ut vidit eam plorántem, et Judǽos, qui vénerant cum ea, plorántes, infrémuit spíritu, et turbávit seípsum, et dixit: Ubi posuístis eum? Dicunt ei: Dómine, veni et vide. Et lacrimátus est Jesus. Dixérunt ergo Judǽi: Ecce, quómodo amábat eum. Quidam autem ex ipsis dixérunt: Non póterat hic, qui apéruit óculos cæci nati, facere, ut hic non morerétur? Jesus ergo rursum fremens in semetípso, venit ad monuméntum. Erat autem spelúnca, et lapis superpósitus erat ei. Ait Jesus: Tóllite lápidem. Dicit ei Martha, soror ejus, qui mórtuus fúerat: Dómine, jam fetet, quatriduánus est enim. Dicit ei Jesus: Nonne dixi tibi, quóniam, si credíderis, vidébis glóriam Dei? Tulérunt ergo lápidem: Jesus autem, elevátis sursum óculis, dixit: Pater, grátias ago tibi, quóniam audísti me. Ego autem sciébam, quia semper me audis, sed propter pópulum, qui circúmstat, dixi: ut credant, quia tu me misísti. Hæc cum dixísset, voce magna clamávit: Lázare, veni foras. Et statim pródiit, qui fúerat mórtuus, ligátus pedes et manus ínstitis, et fácies illíus sudário erat ligáta. Dixit eis Jesus: Sólvite eum, et sínite abíre. Multi ergo ex Judǽis, qui vénerant ad Maríam et Martham, et víderant quæ fecit Jesus, credidérunt in eum.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, 49th Tract on John
      text: |-
        In superióri lectióne meminístis, quod Dóminus éxiit de mánibus eórum, qui lapidáre illum volúerant, et discéssit trans Jordánem, ubi Joánnes baptizábat. Ibi ergo Dómino constitúto, infirmabátur in Bethánia Lázarus: quod castéllum erat próximum Jerosólymis. María autem erat, quæ unxit Dóminum unguénto, et extérsit pedes ejus capíllis suis, cujus frater Lázarus infirmabátur. Misérunt ergo soróres ejus ad eum. Jam intellégimus quo misérunt, ubi erat Jesus: quóniam absens erat, trans Jordánem scílicet. Misérunt ad Dóminum, nuntiántes quod ægrotáret frater eárum, ut si dignarétur, veníret, et eum ab ægritúdine liberáret. Ille dístulit sanáre, ut posset resuscitáre.

        Quid ergo nuntiavérunt soróres ejus? Dómine, ecce quem amas, infirmátur. Non dixérunt: Veni: amánti enim tantúmmodo nuntiándum fuit. Non ausæ sunt dícere: Veni, et sana. Non ausæ sunt dícere: Ibi jube, et hic fiet. Cur enim non et istæ, si fides illíus centuriónis inde laudátur? Ait enim: Non sum dignus ut intres sub tectum meum; sed tantum dic verbo, et sanábitur puer meus. Nihil horum istæ, sed tantúmmodo: Dómine, ecce quem amas, infirmátur. Súfficit ut nóveris: non enim amas, et déseris.

        Dicit áliquis: Quómodo per Lázarum peccátor significabátur, et a Dómino sic amabátur? Audiat enim dicéntem: Non veni vocáre justos, sed peccatóres. Si enim peccatóres Deus non amáret, de cælo ad terram non descénderet. Audiens autem Jesus, dixit eis: Infírmitas hæc non est ad mortem, sed pro glória Dei, ut glorificétur Fílius Dei. Talis glorificátio ipsíus non ipsum auxit, sed nobis prófuit. Hoc est ergo quod ait: Non est ad mortem, sed pótius ad miráculum: quo facto créderent hómines in Christum, et vitárent veram mortem. Sane vidéte quemádmodum tamquam ex oblíquo Dóminus Deum se dixit: propter quosdam qui negant Fílium Dei Deum esse.
      responsory: |-
        R. In mare viæ tuæ, et sémitæ tuæ in aquis multis: * Deduxísti sicut oves pópulum tuum in manu Móysi et Aaron.
        V. Transtulísti illos per mare Rubrum, et transvexísti eos per aquam nímiam.
        R. Deduxísti sicut oves pópulum tuum in manu Móysi et Aaron.
      status: verified
