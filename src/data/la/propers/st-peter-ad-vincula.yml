# Matins Nocturn 2-3 readings for St. Peter's Chains (Jul... Aug 1) —
# SanctiM/08-01.txt inherits the whole day (`@Sancti/08-01`) with no
# Nocturn 2/3 override, so this feast's own proper content is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/08-01.txt, English/Sancti/08-01.txt.
#
# Nocturn 2: Lectio4-6 (the legend of the two chains) combined into
# one reading, one continuous account.
# Nocturn 3: Lectio7's Gospel citation (Matt 16:13-19) was a bare
# incipit ("Et réliqua") with no full pericope text given; the full
# pericope is now authored too (isGospel: true, immediately before the
# homily) — sourced from the Missale's own Common of a Pope/Martyr
# Gospel (`web/www/missa/Latin/Commune/Coronatio.txt`'s `[Evangelium]`,
# English/Commune/Coronatio.txt), the same text used for this same
# pericope in `chair-of-st-peter-at-rome.yml` and `st-martin-i.yml`
# (2026-09-05 update). The homily portion remains St. Augustine's
# sermon, combined with Lectio8 as one continuous excerpt. No
# responsory given for either reading.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Theodósio junióre imperánte, cum Eudócia ejus uxor Jerosólymam solvéndi voti causa venísset, ibi multis est affécta munéribus. Præ céteris insígne donum accépit férreæ caténæ, auro gemmísque ornátæ, quam illam esse affirmábant, qua Petrus Apóstolus ab Heróde vinctus fúerat. Eudócia, caténam pie veneráta, eam póstea Romam ad fíliam Eudóxiam misit; quæ illam Pontífici máximo détulit. Isque vicíssim illi monstrávit álteram caténam, qua, Neróne imperatóre, idem Apóstolus constríctus fúerat.

        Cum ígitur Póntifex Románam caténam cum ea, quæ Jerosólymis alláta fúerat, contulísset, factum est ut illæ inter se sic connecteréntur, ut non duæ, sed una caténa ab eódem artífice confécta esse viderétur. Quo miráculo tantus honor sacris illis vínculis habéri cœpit, ut proptérea hoc nómine sancti Petri ad víncula ecclésia, título Eudóxiæ, dedicáta sit in Exquíliis, ejúsque memóriæ dies festus institútus Kaléndis Augústi.

        Quo ex témpore honos, qui eo die profánis Gentílium celebritátibus tríbui sólitus erat, Petri vínculis habéri cœpit, quæ tacta ægros sanábant et dǽmones ejiciébant. Quo in génere, anno salútis humánæ nongentésimo sexagésimo nono áccidit, ut quidam comes, Ottónis imperatóris familiáris, occupátus ab immúndo spíritu, seípsum déntibus dilaniáret. Quare is jussu imperatóris ad Joánnem Pontíficem dúcitur, qui ut sacra caténa cómitis collum áttigit, erúmpens nefárius spíritus hóminem líberum reliquit; ac deínceps in Urbe sanctórum vinculórum relígio propagáta est.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 16:13-19
      text: 'In illo témpore: Venit Jesus in partes Cæsaréæ Philíppi, et interrogábat discípulos suos, dicens: Quem dicunt hómines esse Fílium hóminis? At illi dixérunt: Alii Joánnem Baptístam, alii autem Elíam, álii vero Jeremíam, aut unum ex prophétis. Dicit illis Jesus: Vos autem quem me esse dícitis? Respóndens Simon Petrus, dixit: Tu es Christus, Fílius Dei vivi. Respóndens autem Jesus, dixit ei: Beátus es, Simon Bar Jona: quia caro et sanguis non revelávit tibi, sed Pater meus, qui in cœlis est. Et ego dico tibi, quia tu es Petrus, et super hanc petram ædificábo Ecclésiam meam, et portæ ínferi non prævalébunt advérsus eam. Et tibi dabo claves regni cœlórum. Et quodcúmque ligáveris super terram, erit ligátum et in cœlis: et quodcúmque sólveris super terram, erit solútum et in cœlis.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 29 on the Saints (on Matt 16:13-19)
      text: |-
        Solus Petrus inter Apóstolos méruit audíre: Amen dico tibi, quia tu es Petrus, et super hanc petram ædificábo Ecclésiam meam; dignus certe, qui ædificándis in domo Dei pópulis lapis esset ad fundaméntum, colúmna ad sustentáculum, clavis ad regnum. De hoc ait sermo divínus: Et ponébant, inquit, infírmos suos, ut umbra saltem transeúntis Petri obumbráret eos. Si tunc opem ferre póterat umbra córporis, quanto magis nunc plenitúdo virtútis? si tunc supplicántibus próderat aura quædam pertranseúntis, quanto magis grátia nunc permanéntis? Mérito per omnes Christi ecclésias auro pretiósius habétur ferrum illud pœnálium vinculórum.

        Si tam medicábilis fuit obumbrátio visitántis, quanto magis caténa vinciéntis? Si inánis quædam spécies vácuæ imáginis habére pótuit in se vim salútis, quanto plus de córpore meruérunt attráhere salubritátis, férreo póndere sacris impréssa membris, víncula passiónis? Si ad præsídia supplicántium tam potens fuit ante martýrium, quanto magis éfficax post triúmphum? Felíces illi nexus, qui, de mánicis et compédibus in corónam mutándi, Apóstolum contingéntes, Mártyrem reddidérunt! Felícia víncula, quæ reum suum usque ad Christi crucem, non tam condemnatúra quam consecratúra, misérunt!
      status: verified
