# St. Peter's Chains: proper Matins hymn, "Quodcumque vinclis super terram strinxeris" (Sancti/08-01.txt's Matins hymn; the same text as the Chair at Antioch's Vespers hymn).
# Latin and English as rendered by the local reference engine (Monastic
# Tridentinum 1617, command=prayMatutinum, 08-01-2027); before this file the saint
# fell to the Common's Matins hymn.
matins-hymn:
  text: |
    Quodcúmque vinclis super terram strínxeris,
    Erit in astris religátum fórtiter:
    Et quod resólvis in terris arbítrio,
    Erit solútum super cæli rádium:
    In fine mundi judex eris sǽculi.

    Glória Patri per imménsa sǽcula,
    Sit tibi Nate decus et impérium,
    Honor, potéstas, Sanctóque Spirítui:
    Sit Trinitáti salus indivídua,
    Per infiníta sæculórum sǽcula.
    Amen.
  status: verified

