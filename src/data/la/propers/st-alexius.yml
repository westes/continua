# Matins Nocturn 2 reading for St. Alexius, Confessor (Jul 17). No
# genuine SanctiM match: the SanctiM files for this date,
# `SanctiM/07-17Moct.txt`/`07-17M.txt`, belong respectively to the
# Octave of St. Benedict (Jul 11-18) and to a different saint (St. Leo
# IV) — a missed pre-1955-pool candidate rather than a genuine SanctiM
# case (see memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-17.txt, English/Sancti/07-17.txt.
# Single lesson (Lectio4 — Lectio5-6 fall back to Common of a
# Confessor, not proper text, so not authored here). No responsory
# given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Aléxius, Romanórum nobilíssimus, propter exímium Jesu Christi amórem prima nocte nuptiárum peculiari Dei mónitu relínquens intactam sponsam, illustrium orbis terræ ecclesiárum peregrinatiónem suscépit. Quibus in itinéribus cum ignotus septémdecim annos fuísset, aliquándo apud Edessam, Syriæ urbem, per imáginem sanctíssimæ Maríæ Vírginis, ejus nómine divulgato, inde navi discessit. Ad portum Romanum appulsus, a patre suo tamquam alienus pauper hospítio accipitur; apud quem, ómnibus incógnitus, cum decem et septem annos vixísset, relícto scripto sui nóminis, sánguinis, ac totius vitæ cursus, migrávit in cælum, Innocentio primo summo Pontifice.
      status: verified
