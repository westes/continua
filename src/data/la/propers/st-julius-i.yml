# Matins Nocturn 2 reading for St. Julius I, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/04-12-JuliusI.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Julius Románus Rustici fílius, post beátum Marcum ad summum pontificátum evéctus, vitæ sanctitáte et stúdio asseréndæ fídei christiánæ insigniter elúxit. Grassabatur per Oriéntem arianæ hærésis impietas, multíque sanctíssimi epíscopi e suis sedibus exsuláre cogebantur, quos ille, præsértim sanctum Athanasium, humaníssime excépit, et constantíssime contra adversários deféndit. Tyriam et Antiochenam synodum, ut Nicænam abolerent fidem, ab Ariánis coactam condemnávit, et Romæ duo concilia convocavit, in quibus exsulum episcopórum querelas excépit, et innocéntiam declarávit.

        Constánti Augusto religiosissimo principi, per Occidentem imperanti, auctor fuit, ut Constantium fratrem Arianarum fautorem, in Oriénte regnantem, précibus et minis ad revocandum ab exsílio Athanasium permoveret. Dolósam fídei formulam ab Eusebianis, Aríi sectatoribus, in secúnda synodo Antiochena conceptam rejécit, et magnum Sardicense concílium ex Occidentis et Oriéntis epíscopis indíxit, missisque legátis, multa ibídem pro fide cathólica et disciplína ecclesiástica restituenda utiliter constítuit.

        Præter hæc, basílicas duas in Urbe exstrúxit, sacrisque picturis exornávit, unam juxta Forum Románum, álteram in via Flaminia. Tria ædificávit cœmeteria, unum in eádem via Flaminia, álterum in via Aurélia, tértium in Portuensi. Constítuit ne sacérdos álibi quam apud júdicem ecclesiasticum causam díceret, jussitque ut ómnia ad rem ecclesiásticam spectantia per protonotarium conficerentur instrumenta. Tribus ordinationibus mense Decémbri creávit diáconos tres, presbyteros decem et octo, epíscopos novem. Postquam Dei Ecclésiam sanctíssime rexísset annis quíndecim, ménsibus quinque, diébus septémdecim, prídie Idus Aprílis felíciter migrávit ad Dóminum, sepúltus in cœmetério Calepódii. Inde translatæ relíquiæ ad ecclésiam sanctæ Maríæ trans Tíberim ab ipso amplificatam, sub altári majóri honorífice reconditæ sunt.
      status: verified
