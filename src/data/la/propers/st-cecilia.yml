# Matins Nocturn 2 reading for St. Cecilia, Virgin, Martyr (Nov 22) —
# SanctiM/11-22.txt inherits the whole day (`@Sancti/11-22`) with no
# Nocturn 2/3 override, so this saint's own vita is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/11-22.txt, English/Sancti/11-22.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Cæcília, Virgo Romana, nobili genere nata, a prima ætate christianæ fidei præceptis instituta, virginitátem suam Deo vovit. Sed, cum póstea, contra suam voluntátem, data esset in matrimónium Valeriáno, prima nuptiárum nocte hunc cum eo sermónem hábuit: Ego, Valeriane, in Angeli tutela sum, qui virginitátem meam custódit; quare ne quid in me committas, quo ira Dei in te concitétur. Quibus verbis commótus Valerianus, illam attingere non est ausus; quin étiam addidit se in Christum creditúrum, si eum Angelum vidéret. Cui Cæcília cum sine baptismo negaret id fíeri posse, incénsus cupiditate vidéndi Angelum, se baptizari velle respóndit. Quare hortatu Vírginis ad Urbanum Papam, qui propter persecutiónem in Mártyrum sepúlcris via Appia latebat, veniens, ab eo baptizátur.

        Inde ad Cæciliam reversus, orántem et cum ea Angelum divino splendore fulgentem invénit. Quo aspectu obstupefactus, ut primum ex timóre confirmátus est, Tiburtium fratrem suum accersit; qui, a Cæcília Christi fide imbutus et ab eodem Urbano baptizatus, ipse étiam ejusdem Angeli, quem frater ejus viderat, aspectu dignátus est. Uterque autem paulo post, Almachio præfecto, constanter martyrium subiit. Qui mox Cæciliam comprehéndi imperat, ab eáque primum, ubi Tiburtii et Valeriáni facultates sint, exquirit.

        Cui, cum Virgo ómnia illórum paupéribus distributa esse respondísset, eo furóre concitátus est, ut eam, in ipsíus ædes reductam, in balneo comburi jusserit. Quo in loco cum diem noctemque ita fuísset ut ne flamma quidem illam attingeret, eo immissus est carnifex, qui ter secúri ictam, cum caput abscindere non potuísset, semivivam relíquit. Illa triduo post, sextodecimo Kalendas Octobris, Alexandro imperatóre, duplici virginitátis et martyrii palma decorata, evolávit in cælum. Cujus corpus ab ipso Urbano Papa in Callísti cœmeterio sepúltum est, in ejus ædibus ecclésia ipsíus Cæcíliæ consecrata. Ejus et Urbani ac Lucii Pontificum, Tiburtii, Valeriáni et Maximi corpora, a Paschali primo Pontifice inde transláta in Urbem, in eádem sanctæ Cæcíliæ ecclésia cóndita sunt.
      status: verified
