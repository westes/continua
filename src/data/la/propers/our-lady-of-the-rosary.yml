      source: St. Bernard, Abbot of Clairvaux, Homily on Holy Mary
      text: Ad commendatiónem grátiæ suæ et ad destructiónem humánæ sapiéntiæ, Deus de fémina sed vírgine dignátus est carnem assúmere, ut símilem símili rédderet, contrárium contrário curáret, pestíferam spinam evélleret, peccáti chirógraphum potentíssime deléret. Heva spina fuit; María rosa éxstitit. Heva spina, vulnerándo; María rosa, ómnium afféctus mulcéndo. Heva spina, infígens ómnibus mortem; María rosa, reddens salutíferam ómnibus sortem. María rosa fuit cándida per virginitátem, rubicúnda per caritátem; cándida carne, rubicúnda mente; cándida virtútem sectándo, rubicúnda vítia calcándo; cándida afféctum purificándo, rubicúnda carnem mortificándo; cándida Deum diligéndo, rubicúnda próximo compatiéndo.
