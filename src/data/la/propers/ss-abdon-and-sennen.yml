# Matins Nocturn 2 reading for Ss. Abdon and Sennen, Martyrs (Jul 30)
# — SanctiM/07-30.txt inherits the whole day (`@Sancti/07-30`) with no
# Nocturn 2/3 override, so this feast's own proper content is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-30.txt, English/Sancti/07-30.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Abdon et Sennen Persæ, Decio imperatóre, accusáti quod córpora Christianórum, quæ inhumáta projiciebántur, in suo prædio sepelissent, jussu imperatóris comprehendúntur, et diis jubéntur sacrificare. Quod cum fácere neglígerent, et Jesum Christum Deum constantíssime prædicarent, tráditos in arctam custódiam, Romam póstea rédiens Decius vinctos duxit in triumpho. Qui cum in Urbe ad simulacra attracti essent, ea detestáti conspuérunt. Quam ob rem ursis ac leónibus objecti sunt; quos feræ non audébant attingere. Demum, gládiis trucidati, colligátis pédibus tracti sunt ante solis simulacrum. Quorum corpora, clam inde asportata, Quirínus diaconus sepelívit in suis ædibus.
      status: verified
