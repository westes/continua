# Read from the reference engine: web/www/horas/Latin/Sancti/11-26.txt [Oratio];
# English from English/Sancti/11-26.txt.
collect:
  text: |
    Orémus.
    Clementíssime Deus, qui sanctum Silvéstrum Abbátem, sǽculi hujus vanitátem in apérto túmulo pie meditántem, ad erémum vocáre, et præcláris vitæ méritis decoráre dignátus es: te súpplices exorámus; ut, ejus exémplo terréna despiciéntes, tui consórtio perfruámur ætérno.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-an-abbot; collect is the saint's own (collect-st-sylvester-abbot.yml). Not
# independently live-verified for this category, so marked draft.
commemoration:
  text: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, intra in gáudium Dómini tui.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Clementíssime Deus, qui sanctum Silvéstrum Abbátem, sǽculi hujus vanitátem in apérto túmulo pie meditántem, ad erémum vocáre, et præcláris vitæ méritis decoráre dignátus es: te súpplices exorámus; ut, ejus exémplo terréna despiciéntes, tui consórtio perfruámur ætérno.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. Sylvester, Abbot. Sourced directly from
# web/www/horas/Latin/Sancti/11-26.txt, English/Sancti/11-26.txt.
# Lectio4-6 combined into one reading, one continuous vita.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Silvester, Auximi in Piceno nobili genere ortus, statim puerílem ætátem litteris ac bonis móribus mirifice exornavit. Adoléscens, Bonóniam ad stúdia jurisprudéntiæ missus a patre, cum sacris litteris, a Deo mónitus, dedísset operam, parentis incurrit indignatiónem; quam æquo animo toto decennio pértulit. Ob egregiam ejus virtútem a canonicis cathedralis Auximanæ ecclésiæ socius honoris eléctus est; in quo munere pópulo oratiónibus, exemplo et conciónibus opem tulit.

        Inter funus nobilis cujusdam defuncti, in aperto tumulo formosi viri suique propinqui deforme cadáver conspíciens: Ego, inquit, sum, quod hic fuit; quod hic est, ego ero. Et mox, peracto funere, illa sibi Dómini occurrénte senténtia: Qui vult veníre post me, ábneget semetípsum, et tollat crucem suam, et sequátur me; in solitúdinem, majoris perfectiónis studio, secessit, ibique vigiliis, oratiónibus jejuniisque deditus, crudas tantum herbas in cibum sæpius adhibuit. Ut autem magis latéret hómines, varias mutavit sedes; ac demum pervenit ad montem Fanum, locum, quamvis prope Fabrianum, eo tamen témpore desértum, ibique in honórem sanctíssimi patris Benedicti templum eréxit, congregatiónisque Silvestrinórum fundaménta jecit, sub regula et habitu in visióne sibi ab eodem Sancto osténsis.

        At ínvidens sátanas variis terróribus illíus monachos turbare nitebátur, noctu monasterii jánuas hostíliter invadens. Sed vir Dei, hostis impetum ita repressit, ut monachi in sancto instituto magis confirmaréntur ac patris sanctitátem agnoscerent. Spíritu prophetíæ aliisque donis enituit. Quæ ut semper profúnda humilitate conservavit, ita contra se dæmonis invidiam concitavit; a quo præceps actus per scalas oratórii, et prope interimendus, præsentíssimo Vírginis beneficio incolumitáti redditus est. Quod benefícium perpetua et singulari in illam pietáte commendavit ad ultimum usque vitæ spíritum, quem, fere nonagenarius, sanctitáte et miraculis clarus, Deo réddidit anno salútis millesimo ducentésimo sexagesimo septimo, sexto Kalendas Decembris. Ejus Offícium ac Missam Leo décimus tertius Pontifex maximus ad universam exténdit Ecclésiam.
      status: verified
