# Read from the reference engine: web/www/horas/Latin/Sancti/11-24.txt [Oratio];
# English from English/Sancti/11-24.txt.
collect:
  text: |
    Orémus.
    Deus, qui sanctum Joánnem Confessórem tuum atque Doctórem perféctæ sui abnegatiónis et Crucis amatórem exímium effecísti: concéde; ut, ejus imitatióni júgiter inhæréntes, glóriam assequámur ætérnam.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-a-confessor-doctor; collect is the saint's own (collect-st-john-of-the-cross.yml). Not
# independently live-verified for this category, so marked draft.
commemoration:
  text: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, intra in gáudium Dómini tui.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui sanctum Joánnem Confessórem tuum atque Doctórem perféctæ sui abnegatiónis et Crucis amatórem exímium effecísti: concéde; ut, ejus imitatióni júgiter inhæréntes, glóriam assequámur ætérnam.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. John of the Cross, Confessor and Doctor of the Church. Sourced directly from
# web/www/horas/Latin/Sancti/11-24.txt, English/Sancti/11-24.txt.
# Lectio4-6 combined into one reading, one continuous vita.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Joánnes a Cruce, Fontíberi in Hispánia piis paréntibus natus, a primis annis certo innotuit quam Deiparæ Virgini futurus esset acceptus; nam quinquennis, in púteum lapsus, ejusdem Deiparæ manu sublatus, incolumis evasit. Tanto autem patiéndi desidério flagrávit, ut novennis, spreto molliori lecto, super sarmentis cubare consueverit. Adoléscens hospítio páuperum ægrotántium Metymnæ Campi famulum sese addixit, quibus magno caritátis ardore, vilíssima quæque complectens officia, præsto aderat. Cujus exemplo excitáti ceteri, éadem caritátis múnera ardentius obibant. Verum, ad altióra vocatus, beátæ Maríæ Vírginis de Monte Carmelo institutum amplexus est; ubi, sacerdos ex obediéntia factus, severioris disciplinæ et arctioris vitæ cupidíssimus, primitivam ordinis regulam ex superioris licéntia ita proféssus est, ut, ob jugem Dominicæ passiónis memóriam, bello in se, tamquam in infensíssimum hostem indicto, vigiliis, jejuniis, férreis flagellis omnique pœnárum genere, brevi carnem cum vitiis et concupiscéntiis suis crucifixerit; dignus plane, qui a sancta Teresia inter puriores sanctioresque ánimas, Ecclésiam Dei id témporis illustrántes, recenserétur.

        Singulari vitæ austeritáte et ómnium virtútum præsidio munítus, præ assidua rerum divinárum contemplatióne, diuturnas et mirábiles éxtases frequenter patiebátur; tantoque in Deum æstuábat amóre, ut, cum divinus ignis sese intro diutius continere non posset, foras erumpere ejusque vultum irradiare visus sit. Proximórum salúti summopere intentus, tum in verbi Dei prædicatióne, tum in sacramentórum administratióne fuit assiduus. Hinc tot meritis auctus, strictiorisque disciplinæ promovendæ ardore veheménter accénsus, sanctæ Teresiæ comes divinitus datus est, ut, quam ipsa inter sorores primævam Carmeli ordinis observantiam instauráverat, eamdem et inter fratres, Joánne adjutore, restitúeret. Innumeros ítaque una cum Dei famula in divino opere promovéndo perpéssus labóres, cœnobia, quæ ejusdem sanctæ Vírginis cura per totam Hispániam erecta fuerant, nullis vitæ incommodis et periculis térritus, singula perlustrávit. In quibus aliisque quam plurimis, ejus ópera eréctis, restauratam observantiam propagando, verbo et exemplo firmávit; ut mérito primus, post sanctam Teresiam, Carmelitárum excalceatórum ordinis professor et parens habeátur.

        Virginitátem perpetuo coluit, impudentésque mulieres ejus pudicítiæ insidiari conántes, non modo répulit, sed étiam Christo lucrifecit. In divinis explicandis arcanis æque ac sancta Teresia, apostolicæ Sedis judício, divínitus instructus, libros de mystica theología, cælésti sapiéntia refertos, conscripsit. Semel interrogátus a Christo quid præmii pro tot labóribus pósceret, respóndit: Dómine, pati et contemni pro te. Imperio in dæmones, quos e corpóribus sæpe fugabat, discretióne spirituum, prophetíæ dono, miraculórum glória celebratíssimus, ea semper fuit humilitate, ut sæpius a Dómino flagitaverit eo loco mori, ubi ómnibus esset ignotus. Voti compos factus. Ubedæ, diro morbo et in crure quinque plagis sanie manántibus, ad impléndum patiéndi desidérium constantíssime tolerátis, Ecclésiæ sacramentis pie sancteque susceptis, in Christi crucifixi amplexu, quem semper in corde atque ore habuerat, post illa verba: In manus tuas comméndo spíritum meum, obdormívit in Dómino, die et hora a se prædictis, anno salútis millesimo quingentésimo nonagesimo primo, ætátis quadragesimo nono. Migrántem ejus ánimam splendidíssimus ignis globus excepit; corpus vero suavíssimum odórem spirávit, quod, etiamnum incorruptum, Segoviæ honorifice cólitur. Eum, plurimis ante et post óbitum fulgentem signis, Benedíctus décimus tertius Pontifex maximus in Sanctórum númerum retulit, et Pius undecimus ex Sacrórum Rituum Congregatiónis consulto, universalis Ecclésiæ Doctórem declarávit.
      status: verified
