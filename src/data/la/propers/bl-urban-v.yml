# Matins Nocturn 2 reading for Bl. Urban V, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/12-19-Urbanus V.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Urbánus Quintus, Póntifex Máximus, nóbili Grimoardorum gente natus, in Castro Grisaco Diœcésis Mimatensis, quum innocéntia adolescéntia floreret, monásticum hábitum sub régula sancti Benedícti índuit, ac in Massiliense cœnóbium sancti Victóris cooptandus, vota nuncupávit. In Theologíæ ac Juris disciplínis ita excélluit, ut per plures annos Tolosæ, Parísiis, Avenione, in Monte Pessulano, Decréta summa cum laude interpretaretur. Abbas dein sancti Germáni Antissiodorensis a Cleménte Sexto, póstmodum ab Innocéntio Sexto sancti Victóris Massiliensis præses renuntiátus, tam império, quam obediéntia summus et exímius, ad majóra jam parátus, dum árduis negótiis et legatiónibus pro Ecclésia fungeretur, in Petri Sedem assúmptus, Avenione ritu solémni coronátus est.

        Vix inito Pontificátu ánimum admovit ad Sedem Apostólicam in Urbem reducendam, ad mores Fidélium emendandos, ad Clericórum restaurandam disciplínam, ad Claustra reformanda, ad Cathólicam fidem propagándam. Apostolicas enim Missiónes, Frátribus Minóribus, commissas promóvit usque ad Tartaros et ultimos Orientales, multósque Hæréticos ex Albania, Valachia et Bulgaria ad Ecclésiam Cathólicam redúxit. Nihil étiam omísit ut Græcórum contumaciam vinceret, recépta semel et íterum ab Imperatóre Joánne Fídei professióne. Sacrum bellum contra Infidéles indíxit, ac Rege Cypri copiis præfécto, Alexandriam Ægýpti felíciter expugnávit.

        Ínterim Civilem Sedis Apostólicæ Principatum pene eversum, Ægidio Cardinale Albornotio egrégiam opem conferente, ita restítuit, ut sibi et successoribus suis, necessaria tandem libertáte parta, lubens et ovans, in almam Urbem, cum ingénti Romanórum gáudio redierit. Basílicas Petri et Pauli instauravit, ac sacrosanctam Lateranensem Ecclésiam incéndio pénitus absumptam magnis súmptibus restítuit. In qua cápita Príncipum Apostolórum, retroáctis tempóribus in sacéllum sancti Lauréntii transláta, recognavit, eáque solémniter pópulo románo osténsa et in Thecas inserta auro et gemmis distincta, fidélibus colenda propósuit. Monastérium in Monte Pessulano instítuit; prætérea Montis Cassini Cœnóbium in priscum decus alter quasi conditor, redintegravit. Demum ab Urbe cum ánimo íterum revertendi, ob Ecclésiæ negótia discéssit, et Aveniónem pervénit, ubi letháli morbo corréptus, pretiósam mortem oppétiit anno millésimo tercentésimo septuagésimo. Miráculis post óbitum clarus de positus est in sancti Victóris Ecclésia ubi adhuc vivens sepúlcrum sibi statuerat. Cultum, ab immemorabili témpore eídem exhibitum, post quintum ab óbitu revolutum sǽculum Pius Nonus Póntifex Máximus prævio Sacrórum Rítuum Congregatiónis consílio approbávit et confirmávit; ej usque Offícium et Missam sub ritu duplici a Clero Románo et a plúribus diœcesibus recitari celebrarique benígne indúlsit.
      status: verified
