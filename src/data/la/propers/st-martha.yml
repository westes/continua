# Matins Nocturn 2-3 readings for St. Martha, Virgin (Jul 29) —
# SanctiM/07-29.txt's own Lectio5-10 resolve back to
# `@Sancti/07-29:LectioN` (resliced; Lectio2-3 are a Cistercian-rubric
# variant of the same story, not used here), so this saint's own
# proper content is sourced from the Tridentine track exactly as for a
# pre-1955 saint (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-29.txt, English/Sancti/07-29.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous
# account.
# Nocturn 3: Lectio7's Gospel citation (Luke 10:38-42) quotes only the
# opening sentence before "Et réliqua", not the full pericope, so —
# per the pre-1955 pass's convention of not transcribing bare incipits
# — only the homily portion is authored (not marked isGospel),
# combined with Lectio8 as one continuous excerpt of St. Augustine's
# homily. No responsory given for either reading.
#
# Update (2026-09-05): the Gospel pericope itself (Luke 10:38-42) is
# now authored too (isGospel: true, immediately before the homily) —
# St. Martha's own Missale [Evangelium] carries the full text directly
# (her own feast's Gospel, Martha receiving Christ into her house),
# sourced from missa/Latin/Sancti/07-29.txt and
# missa/English/Sancti/07-29.txt.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Martha, nobílibus et copiosis paréntibus nata, sed Christi Dómini hospítio clarior, post ejus ascénsum in cælum, cum fratre, sorore, et Marcella pedíssequa, ac Maximino, uno ex septuagínta duobus discípulis Christi Dómini, qui totam illam domum baptizaverat, multisque aliis Christiánis, comprehensa a Judæis, in navem sine velo ac remigio impónitur, vastissimóque mari ad certum naufragium committitur. Sed navis, Deo gubernante, salvis ómnibus, Massiliam appulsa est.

        Eo miraculo et horum prædicatióne, primum Massilienses, mox Aquenses ac finítimæ gentes in Christum credidérunt; Lazarusque Massiliensium et Maximinus Aquensium epíscopus creatur. Magdalena vero, assueta oratióni et pédibus Dómini, ut optima parte contemplandæ cæléstis beatitúdinis, quam elégerat, fruerétur, in vastam altíssimi montis spelúncam se cóntulit; ubi trigínta annos vixit, ab omni hóminum consuetúdine disjuncta, quotidiéque per id tempus ad audiendas cæléstium laudes in altum ab Angelis elata.

        Martha autem, mirábili vitæ sanctitáte et caritate, ómnium Massiliensium ánimis in sui amórem et admiratiónem adductis, in locum a viris remotum cum aliquot honestíssimis féminis se recepit; ubi summa cum laude pietátis et prudéntiæ diu vixit, ac demum, morte sua multo ante prædicta, miraculis clara migrávit ad Dóminum, quarto Kalendas Augusti. Cujus corpus apud Tarascum magnam habet veneratiónem.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 10:38-42
      text: 'In illo témpore: Intrávit Jesus in quoddam castéllum: et múlier quædam, Martha nómine, excépit illum in domum suam: et huic erat soror nómine María, quæ étiam sedens secus pedes Dómini, audiébat verbum illíus. Martha autem satagébat circa frequens ministérium: quæ stetit, et ait: Dómine, non est tibi curæ quod soror mea relíquit me solam ministráre? dic ergo illi ut me ádjuvet. Et respóndens, dixit illi Dóminus: Martha, Martha, sollícita es, et turbáris erga plúrima. Porro unum est necessárium. María óptimam partem elégit, quæ non auferétur ab ea.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 26 on the Words of the Lord (on Luke 10:38-42)
      text: |-
        Verba Dómini nostri Jesu Christi, quæ modo ex Evangélio recitáta sunt, ádmonent nos, esse unum aliquid quo tendámus, quando in hujus sæculi multitúdine laboramus. Téndimus autem adhuc peregrinántes, nondum manéntes; adhuc in via, nondum in pátria; adhuc desiderándo, nondum fruéndo. Tamen tendámus, et sine pigrítia et sine intermissióne tendámus, ut aliquándo perveníre valeamus. Martha et Maria duæ sorores erant, ambæ non solum carne, sed étiam religióne germanæ; ambæ Dómino adhæsérunt, ambæ Dómino in carne præsénti concorditer serviérunt.

        Suscépit eum Martha, sicut solent súscipi peregrini; sed tamen suscépit famula Dóminum, ægra Salvatórem, creatura Creatórem. Suscépit autem spíritu pascenda, in carne pascéndum. Voluit enim Dóminus formam servi accípere, et, accepta forma servi, in illa pasci a servis, dignatióne, non conditione. Nam et ista dignátio fuit, se præbére pascéndum. Habebat carnem, in qua esuriret quidem, et sitiret; sed nescítis, quia in erémo esuriénti Angeli ministrábant? Ergo quod pasci vóluit, pascénti præstitit. Quid autem mirum, si et de sancto Elía præstitit víduæ, quem prius, corvo ministrante, pascebat? Numquid pascéndo defécerat, quando ad víduam mittebat? Nequaquam, sed religiosam víduam, per obsequium exhibitum servo suo, benedicere disponebat.
      status: verified
