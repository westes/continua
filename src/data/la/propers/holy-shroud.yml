# Matins Nocturn 2 and 3 readings for the Holy Shroud (Friday of Lent 2).
# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt.
# Nocturn 2: Lectio4-6, St. Ambrose on Luke 23 (the burial of Christ by Joseph and
# Nicodemus), combined into one reading, its closing responsory the source's
# Responsory6. Nocturn 3: the Gospel (Mark 15:42-46, the source's Mass Gospel) and
# then the Venerable Bede's homily on it (Lectio7 after the incipit, and Lectio8),
# its closing responsory the source's Responsory8. Nocturn 1 (Lectio1-3) is not
# carried: continua's first nocturn runs the Scripture course.
#
# Latin: "litique" corrected to "utique" (Lectio4); "m6rito", "p6terat" and the like
# (a digit 6 for an accented o) corrected silently. Everything else is verbatim.
# The English is this project's own translation, marked draft.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Commentary on Luke, Bk. 10, on ch. 23
      text: |
        Quid sibi vult quod non Apóstoli, sed Joseph et Nicodemus, ut Joánnes dicit, Christum sepeliunt? Unus justus et constans, alter qui erat magíster in Israël. Talis enim Christi est sepultúra, quæ justítiam magisteriumque hábeat. Obstruitur ígitur tergiversandi locus, et domestico Judǽi testimónio revincuntur. Nam si Apóstoli sepelissent, dícerent utique non sepúltum, quem sepúltum raptum esse dixérunt. Justus autem Christi corpus óperit sindone, ínnocens ungit unguénto. Namque hæc non otiose distincta reperimus, quia justítia vestit Ecclésiam, innocéntia grátiam subministrat.

        Vesti ergo et tu Dómini corpus glória sua, ut et ipse sis justus. Et si mórtuum credis, óperi tamen divinitátis própriæ plenitudine. Unge illud myrrha et alœ, ut bonus odor Christi sis. Bonum linteum misit Joseph ille vir justus, et fortásse illud quod Petrus vidit e cœlo ad se esse demissum, in quo erant génera quadrupedum, et ferarum, et volucrum ad similitúdinem Gentílium figurata. Mystico ígitur unguénto illo pistico consepelitur Ecclésia, quæ diversitatem populórum fídei suæ communióne sociavit.

        Hunc Joseph justum Lucas dixit, Matthǽus divitem. Et mérito dives hoc loco dícitur, ubi corpus suscipit Christi: suscipiendo enim divitem, nescivit fídei paupertátem. Dives est ergo qui justus est. Justus ígitur sindone involvit; Israëlita vero et diversos miscet virtútum odores, et alœs mittit quasi libras centum, hoc est, perfectæ fídei quantitatem. Et ligaverunt corpus Jesu juxta consuetúdinem specialem Judæórum: non utique nodis perfidiæ, sed fídei ligaturis; et posuérunt in horto, cui frequénter Ecclésia comparátur, quæ diversorum habet poma meritórum, floresque virtútum.
      responsory: |
        R. Christus passus est pro nobis, vobis relínquens exémplum, ut sequámini vestígia ejus: * Qui peccátum non fecit, nec invéntus est dolus in ore ejus.
        V. Qui cum malediceretur, non maledicebat; cum pateretur, non comminabatur.
        R. Qui peccátum non fecit, nec invéntus est dolus in ore ejus.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Marc 15:42-46
      text: 'In illo témpore: Cum jam sero esset factum (quia erat Parascéve, quod est ante sábbatum) venit Joseph ab Arimathǽa, nóbilis decúrio, qui et ipse erat exspéctans regnum Dei, et audácter introívit ad Pilátum, et pétiit corpus Jesu. Pilátus autem mirabátur, si jam obiísset. Et, accersíto centurióne, interrogávit eum, si jam mórtuus esset. Et cum cognovísset a centurióne, donávit corpus Joseph. Joseph autem mercátus síndonem, et depónens eum invólvit sindóne, et pósuit eum in monuménto, quod erat excísum de petra, et advólvit lápidem ad óstium monuménti.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: The Venerable Bede, Homily for Tuesday of Holy Week
      text: |
        Parascéve græce, latíne præparátio dícitur, quo nómine Judǽi, qui inter Græcos morabantur, sextam sábbati appellabant, eo quod in illa ea, quæ requiéi sábbati necessaria essent, præparare solerent; juxta hoc quod de manna quondam præcéptum est: Sexta autem die colligetis duplum. Quia ergo sexta die factus est homo, et tota est mundi creatúra perfécta; séptima autem conditor ab ópere suo requievit, unde et hanc, sabbatum, hoc est, réquiem vóluit appellári: recte Salvátor eádem sexta die crucifíxus humánæ restaurationis implévit arcánum; ideaque, cum accepísset acetum, dixit: Consummatum est; hoc est, sextæ diéi, quod pro mundi refectione suscepi, jam totum est opus expletum. Sábbato autem in sepulchro requiescens, resurrectiónis, quæ octáva die ventúra erat, exspectabat eventum.

        Venit, inquit, Joseph ab Arimathæa, nóbilis decurio, qui et ipse erat exspéctans regnum Dei, et audacter introívit ad Pilátum, et pétiit corpus Jesu. Magnæ quidem Joseph iste dignitátis ad sǽculum, sed majóris apud Deum mériti fuísse laudátur. Talem namque exsistere decebat eum, qui corpus Dómini sepelíret, qui et per justítiam meritórum tali ministério dignus esset, et per nobilitátem poténtiæ sæcularis facultátem posset obtinere ministrándi; non enim quilibet ignótus aut mediocris ad prǽsidem accedere, et crucifíxi corpus póterat impetrare.
      responsory: |
        R. Hæc est sindon digníssima, * In qua salútis auctor de cruce depósitus involvi dignátus est.
        V. Ut nos consepúlti cum eo, veteris hóminis exuviis depositis, innocéntiæ sindone tegeremur.
        R. In qua salútis auctor de cruce depósitus involvi dignátus est.
      status: verified
