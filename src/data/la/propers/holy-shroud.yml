# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). English is this project's own translation, marked draft.
lauds-hymn:
  text: |
    Jesu, dulcis amor meus,
    Ac si præsens sis, accedo:
    Te complector cum afféctu,
    Tuórum memor Vúlnerum.

    O quam nudum hic te cerno,
    Vulnerátum, et distentum,
    Inquinatum, involutum
    In hoc sacrato tégmine!

    Salve Caput cruentatum
    Spinis, cuius dulcis vultus
    Immutávit suum florem,
    Quem cæli tremit Curia.

    Salve Latus Salvatóris,
    Salve mitis apertura,
    Super rosam rubicunda,
    Medela salutifera.

    Manus sanctæ vos avete,
    Diris Clavis perforatæ.
    Ne repéllas me, Salvátor,
    De tuis sanctis Pédibus.
    Amen.
  status: verified

