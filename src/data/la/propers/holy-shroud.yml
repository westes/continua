# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). English is this project's own translation, marked draft.
vespers-hymn:
  text: |
    Glóriam sacræ celebremus omnes
    Sindonis: lætis recolamus hymnis.
    Et piis votis monuménta nostræ
    Certa salútis.

    Quæ refert semper veneránda Sindon,
    Sánguine impressis decoráta signis,
    Dum cruce ex alta tulit involutum
    Corpus Iesu.

    Reddit hæc sævos ánimo dolóres,
    Quos tulit casum miserátus Adæ,
    Christus humáni géneris Redémptor,
    Morte perempta.

    Saucium ferro latus, atque palmas,
    Et pedes clavis, lacerata flagris
    Membra, et infixam cápiti corónam
    Monstrat imágo.

    Quis pius siccis óculis, et absque
    Intimi cordis gémitu notata,
    Vivaque indignæ simulácra mortis
    Cérnere possit?

    Nostra cum solum tibi, Christe, culpa
    Causa tantorum fúerit malórum,
    Nostra debétur tibi vita: vitam
    Tradimus ipsam.

    Sit tibi, Fili, decus, atque virtus,
    Qui tuo mundum redimis cruóre.
    Quique cum summo Genitóre, et almo
    Flamine regnas. Amen.
  status: verified

