# Verified against Divinum Officium (Monastic Tridentinum 1617) — read
# directly from the reference engine's own real-date output (2035-06-26).
# Same convention as data/propers/temporal/*-collect.yml.
collect:
  text: |
    Orémus.
    Quǽsumus, omnípotens Deus: ut nos gemináta lætítia hodiérnæ festivitátis excípiat, quæ de beatórum Joánnis et Pauli glorificatióne procédit; quos éadem fides et pássio vere fecit esse germános.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (ss-john-and-paul-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-several-martyrs (`[Versum 2]`, the tag
# actually paired with `[Ant 2]` in the reference engine's Commune files
# for a mere commemoration -- confirmed against this exact category via
# an independently live-verified precedent elsewhere in this app). Collect
# is the saint's own real proper (ss-john-and-paul-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Isti sunt Sancti, * qui pro Christi amóre minas hóminum contempsérunt: sancti Mártyres in regno cælórum exsúltant cum Angelis. O quam pretiósa est mors Sanctórum, qui assídue assístunt ante Dóminum, et ab ínvicem non sunt separáti!
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    Quǽsumus, omnípotens Deus: ut nos gemináta lætítia hodiérnæ festivitátis excípiat, quæ de beatórum Joánnis et Pauli glorificatióne procédit; quos éadem fides et pássio vere fecit esse germános.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, Ss. John and Paul's own day (2026-06-26) -- the Benedictus
# antiphon. Corrects the previous version of this file, which had been
# sourced from the Roman/secular rite's Sancti/06-26.txt's own [Ant 1]
# instead: real but different text from what Monastic 1617 actually
# renders at Lauds, same mistake as St. Lawrence's earlier fix. These are
# the Roman martyrs John and Paul, not St. John the Baptist/Evangelist or
# St. Paul the Apostle.
benedictus-antiphon:
  text: 'Isti sunt Sancti, * qui pro Christi amóre minas hóminum contempsérunt: sancti Mártyres in regno cælórum exsúltant cum Angelis. O quam pretiósa est mors Sanctórum, qui assídue assístunt ante Dóminum, et ab ínvicem non sunt separáti!'
  status: verified

# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/06-26.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not a Common
# substitution. (This feast's own Benedictus antiphon,
# ss-john-and-paul-antiphon.yml, already correctly sourced [Ant 2].)
magnificat-antiphon:
  text: Isti sunt * duæ olívæ, et duo candelábra lucéntia ante Dóminum; habent potestátem cláudere cælum núbibus et aperíre portas ejus, quia linguæ eórum claves cæli factæ sunt.
  status: verified

# First Vespers Magnificat antiphon: web/www/horas/Latin/Sancti/06-26.txt's own [Ant 1]
# and its English counterpart. Second Vespers' [Ant 3] is
# ss-john-and-paul-magnificat-antiphon.yml (the default); see hours/resolve-common.ts's
# withVespersVariant.
magnificat-antiphon/~-first:
  text: 'Astitérunt * justi ante Dóminum, et ab invicem non sunt separáti: cálicem Dómini biberunt, et amici Dei appelláti sunt.'
  status: verified

# Sourced from web/www/horas/Latin/Sancti/06-26.txt's own [Ant Laudes]
# and English/Sancti/06-26.txt's own translation. Below duplex-majus, so
# hours/lauds.ts's mergeFerialNumbersWithProperAntiphons only takes this
# file's antiphon text, not its psalm numbers -- the numbers below are
# placeholders (the standard 92/99/62 scheme most Martyr-shaped feasts
# use), not independently confirmed for this feast, since they have no
# functional effect at this rank.
lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: 'Paulus et Joánnes * dixérunt Juliáno: Nos unum Deum cólimus, qui fecit cælum et terram.'
    - psalms:
        - 99
      antiphon: 'Paulus et Joánnes * dixérunt Terentiáno: Si tuus dóminus est Juliánus, habéto pacem cum illo: nobis álius non est, nisi Dóminus Jesus Christus.'
    - psalms:
        - 62
      antiphon: Joánnes et Paulus, * agnoscéntes tyránnidem Juliáni, facultátes suas paupéribus erogáre cœpérunt.
  canticle:
    id: canticum-trium-puerorum
    antiphon: Sancti spíritus * et ánimæ justórum, hymnum dícite Deo, allelúia.
  laudate:
    antiphon: 'Joánnes et Paulus * dixérunt ad Gallicánum: Fac votum Deo cæli, et eris victor mélius quam fuísti.'

