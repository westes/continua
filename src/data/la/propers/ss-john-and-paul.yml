# Matins Nocturn 2 reading for Ss. John and Paul, Martyrs (Jun 26) —
# SanctiM/06-26.txt inherits the whole day (`@Sancti/06-26`) with no
# Nocturn 2/3 override, so this feast's own proper content is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/06-26.txt, English/Sancti/06-26.txt.
# Lectio4-6 combined into one reading, one continuous account, no
# genuine source break.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Joánnes et Paulus fratres Románi, cum facultátibus a Constántia Constantíni fília, cui pie fidelitérque servíerant, sibi relíctis, Christi páuperes álerent; a Juliáno Apóstata in númerum familiárium suórum invitáti, líbere negavérunt se apud eum esse velle, qui a Jesu Christo defecísset. Quibus ille ad deliberándum decem dies præfínit ut nisi ad eam diem ei adhærére et Jovi sacrificáre constitúerint, sibi moriéndum esse certo sciant.

        Illi intra id tempus réliqua sua bona distribuérunt paupéribus, quo expeditióres ad Dóminum migráre possent, et plures juvárent, a quibus in ætérna tabernácula reciperéntur. Die décima Terentiánus prætóriæ cohórtis præféctus, ad eos missus cum alláta Jovis effígie ut eam veneraréntur, imperatóris mandátum eis expónit, ut nisi Jovi cultum adhíbeant, moriántur. Qui, ut erant orántes respondérunt, se pro Christi fide, quem Deum mente et ore venerabántur, non dubitánter mortem subitúros.

        At Terentiánus véritus, ne, si públice interficeréntur, pópulus commoverétur; domi, ubi tunc erant, abscíssis eórum capítibus, sexto Kaléndas Júlii secréto eos sepeliéndos curávit; rumorémque sparsit, Joánnem et Paulum in exsílium ejéctos esse. Verum eórum mors a spirítibus immúndis, qui multórum córpora vexábant, pervulgáta est; in quibus Terentiáni fílius, et ipse oppréssus a dǽmone, ad sepúlcrum Mártyrum perdúctus liberátus est. Quo miráculo et is in Christum crédidit, et ejus pater Terentiánus; a quo étiam horum beatórum Mártyrum vita scripta esse dícitur.
      status: verified
