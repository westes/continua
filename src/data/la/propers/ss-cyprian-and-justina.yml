# Matins Nocturn 2 reading for Ss. Cyprian and Justina, Martyrs (Sep 26)
# — pre-1955-but-post-1617 (no SanctiM/09-26*.txt at all; the "n" suffix
# variant at this date is a modern 20th-c. feast, not relevant).
# web/www/horas/Latin/Sancti/09-26.txt, English/Sancti/09-26.txt.
# Lectio2-3 is one continuous account, no internal break, combined into
# a single reading. No responsory given.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Cypriánus, primum magus, póstea Martyr, cum Justínam, christiánam Vírginem, quam júvenis quidam ardénter amábat, cantiónibus ac venefíciis ad ejus libídinis assénsum allícere conarétur, dæmonem consúluit quanam id re cónsequi posset. Cui dæmon respóndit nullam illi artem processúram advérsus eos, qui vere Christum cólerent. Quo respónso commótus Cypriánus, veheménter dolére cœpit vitæ superióris institútum. Itaque, relíctis mágicis ártibus, se totum ad Christi Dómini fidem convértit.

        Quam ob causam una cum Vírgine Justína comprehénsus est, et ambo cólaphis flagellísque cæsi sunt; mox in cárcerem conjécti, si forte senténtiam commutárent. Verum, inde póstea emíssi, cum in christiána religióne constantíssimi reperiréntur, in sartáginem plenam fervéntis picis, ádipis et ceræ injécti sunt. Demum Nicomedíæ secúri feriúntur. Quorum projécta córpora cum sex dies inhumáta jacuíssent noctu quidam nautæ clam ea in navem impósita Romam portavérunt. Ac primum in prædio Rufínæ nóbilis féminæ sepúlta sunt; póstea, transláta in Urbem, in basílica Constantiniána cóndita sunt prope baptistérium.
      status: verified
