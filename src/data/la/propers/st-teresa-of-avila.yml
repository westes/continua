# Read directly from web/www/horas/Latin/Sancti/10-15.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Exáudi nos, Deus, salutáris noster: ut sicut de beátæ Terésiæ Vírginis
    tuæ festivitáte gaudémus; ita cæléstis ejus doctrínæ pábulo
    nutriámur, et piæ devotiónis erudiámur afféctu.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-virgin (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). st-teresa-of-avila has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is the saint's own
# real proper (st-teresa-of-avila-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Símile est regnum cælórum * hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Exáudi nos, Deus, salutáris noster: ut sicut de beátæ Terésiæ Vírginis
    tuæ festivitáte gaudémus; ita cæléstis ejus doctrínæ pábulo
    nutriámur, et piæ devotiónis erudiámur afféctu.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/10-15.txt's own [Capitulum
# Laudes] ("@Commune/C6" -- byte-identical to common-of-a-virgin's own,
# no name substitution needed for this particular text). Authored as her
# own file (not left to the Common fallback) so her genuinely proper
# Lauds hymn (lauds-hymn-st-teresa-of-avila.yml) becomes reachable —
# hours/resolve-common.ts's resolveOfficeBundle is all-or-nothing per id,
# gated on the chapter.
lauds-capitulum:
  text: 'Fratres: Qui gloriátur, in Dómino gloriétur. Non enim qui seípsum comméndat, ille probátus est; sed quem Deus comméndat.'
  citation: 2 Cor 10:17-18
  status: verified

# Sourced from web/www/horas/Latin/Sancti/10-15.txt's own [Hymnus
# Laudes] and English/Sancti/10-15.txt's own translation.
lauds-hymn:
  text: |-
    Hæc est dies, qua cándidæ
    Instar colúmbæ, cǽlitum
    Ad sacra templa spíritus
    Se tránstulit Terésiæ.

    Sponsíque voces áudiit:
    Veni, soror, de vértice
    Carméli ad Agni núptias;
    Veni ad corónam glóriæ.

    Te, Sponse Jesu Vírginum,
    Beáti adórent órdines,
    Et nuptiáli cántico
    Laudent per omne sǽculum. Amen.
  status: verified

# No distinct Lauds versicle exists in the reference source for this
