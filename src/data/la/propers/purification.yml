# Live-verified against Divinum Officium (Monastic Tridentinum 1617,
# command=prayVespera, 2026-02-02, own day). Same four psalm numbers as
# her Common (common-of-the-bvm.yml: 109/112/121/126), but her own proper
# (Simeon-focused) antiphons throughout, not the Common's generic ones.
vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: Símeon justus * et timorátus exspectábat redemptiónem Israël, et Spíritus Sanctus erat in eo.
    - psalms:
        - 112
      antiphon: Respónsum accépit Símeon * a Spíritu Sancto, non visúrum se mortem, nisi vidéret Dóminum.
    - psalms:
        - 121
      antiphon: Accípiens Símeon * Púerum in mánibus, grátias agens benedíxit Dóminum.
    - psalms:
        - 126
      antiphon: Obtulérunt * pro eo Dómino par túrturum aut duos pullos columbárum.

# Content read from the reference engine's live render (Monastic Tridentinum 1617, command=prayVespera): 02-02
# purification. First Vespers psalm antiphons; the other evening's set is purification.yml. See
# vespers-psalmody-overrides.ts's getVespersSaintOverride.
vespers-psalmody/~-first:
  groups:
    - psalms:
        - 109
      antiphon: 'O admirábile commércium: * Creátor géneris humáni, animátum corpus sumens, de Vírgine nasci dignátus est; et procédens homo sine sémine, largítus est nobis suam Deitátem.'
    - psalms:
        - 112
      antiphon: 'Quando natus es * ineffabíliter ex Vírgine, tunc implétæ sunt Scriptúræ: sicut plúvia in vellus descendísti, ut salvum fáceres genus humánum: te laudámus, Deus noster.'
    - psalms:
        - 121
      antiphon: 'Rubum, quem víderat Móyses * incombústum, conservátam agnóvimus tuam laudábilem virginitátem: Dei Génitrix, intercéde pro nobis.'
    - psalms:
        - 126
      antiphon: 'Ecce María génuit * nobis Salvatórem, quem Joánnes videns, exclamávit, dicens: Ecce Agnus Dei, ecce qui tollit peccáta mundi.'

# Matins Nocturn 2-3 readings for the Purification of the BVM (Feb 2).
# Sourced directly from web/www/horas/Latin/Sancti/02-02.txt,
# English/Sancti/02-02.txt. (Lectio1-3, Exod 13/Lev 12, left to the
# bible-plan store as usual.)
#
# Nocturn 2: Lectio4-6 combined into one reading, St. Augustine's sermon
# on Simeon — one continuous piece.
# Nocturn 3: Lectio7's Gospel citation (Luke 2:22-32) is a bare incipit
# ("Et réliqua"), so only the homily was originally authored (not marked
# isGospel), St. Ambrose's commentary (Lectio7's homily + Lectio8-9
# combined).
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before Ambrose's homily) — sourced from
# the day's own Missale [Evangelium] in
# web/www/missa/Latin/Sancti/02-02.txt (full text given there, not a
# redirect).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine of Hippo, Sermon 13 de Tempore
      text: |-
        Sic olim prædíctum est: Mater Sion dicit: Homo et homo factus est in ea; et ipse fundávit eam Altíssimus. O omnipoténtia nascéntis! o magnificéntia de cælo ad terram descendéntis! Adhuc in útero portabátur, et ex útero matris a Joánne Baptísta salutabátur. In templo præsentabátur, et a Simeóne sene famóso, annóso, probáto, coronáto agnoscebátur. Tunc cognóvit, tunc adorávit, tunc dixit: Nunc, Dómine, dimíttis servum tuum in pace: quia vidérunt óculi mei salutáre tuum.

        Differebátur exíre de sǽculo, ut vidéret natum, per quem cónditum est sǽculum. Agnóvit Infántem senex, factus est in Púero puer. Innovátus in ætáte, qui plenus erat pietáte. Símeon senex ferébat Christum infántem, Christus regébat Simeónis senectútem. Dictum ei fúerat a Dómino, quod non gustáret mortem, nisi vidéret Christum Dómini natum. Natus est Christus, et implétum est desidérium senis in mundi ipsíus senectúte. Ipse ad senem hóminem venit, qui mundum inveterátum invénit.

        In isto quidem sǽculo diu esse nolébat, et Christum in hoc sǽculo vidére cupiébat, cantans cum prophéta et dicens: Osténde nobis, Dómine, misericórdiam tuam, et salutáre tuum da nobis. Dénique, ut novéritis ita esse istíus lætítiam, conclúsit dicens: Nunc dimíttis servum tuum in pace: quia vidérunt óculi mei salutáre tuum. Prophétæ cecinérunt Conditórem cæli et terræ in terra cum homínibus futúrum; Angelus nuntiávit Creatórem carnis et spíritus in carne ventúrum; salutávit Joánnes ex útero in útero Salvatórem; Símeon senex Deum agnóvit infántem.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 2:22-32
      text: 'In illo témpore: Postquam impléti sunt dies purgatiónis Maríæ, secúndum legem Móysi, tulérunt Jesum in Jerúsalem, ut sísterent eum Dómino, sicut scriptum est in lege Dómini: Quia omne masculínum adapériens vulvam sanctum Dómino vocábitur. Et ut darent hóstiam, secúndum quod dictum est in lege Dómini, par túrturum aut duos pullos columbárum. Et ecce, homo erat in Jerúsalem, cui nomen Símeon, et homo iste justus et timorátus, exspéctans consolatiónem Israël, et Spíritus Sanctus erat in eo. Et respónsum accéperat a Spíritu Sancto, non visúrum se mortem, nisi prius vidéret Christum Dómini. Et venit in spíritu in templum. Et cum indúcerent púerum Jesum paréntes ejus, ut fácerent secúndum consuetúdinem legis pro eo: et ipse accépit eum in ulnas suas, et benedíxit Deum, et dixit: Nunc dimíttis servum tuum, Dómine, secúndum verbum tuum in pace: Quia vidérunt óculi mei salutáre tuum: Quod parásti ante fáciem ómnium populórum: Lumen ad revelatiónem géntium et glóriam plebis tuæ Israël.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, Commentary on Luke, Book II (on Luke 2:22-32)
      text: |-
        Et ecce homo erat in Jerúsalem, cui nomen Símeon, et homo iste justus et timorátus, exspéctans consolatiónem Israël. Non solum ab Angelis, et prophétis, et a pastóribus, sed étiam a senióribus et justis generátio Dómini accépit testimónium. Omnis ætas, et utérque sexus, eventorúmque mirácula fidem ástruunt. Virgo génerat, stérilis parit, mutus lóquitur, Elísabeth prophétat, Magus adórat, útero clausus exsúltat, vídua confitétur, justus exspéctat.

        Et bene justus, qui non suam, sed pópuli grátiam requirébat, cúpiens ipse corpóreæ vínculis fragilitátis exsólvi, sed exspéctans vidére promíssum: sciébat enim quia beáti óculi qui eum vidérent. Et ipse accépit eum in ulnas suas, et benedíxit Deum, et dixit: Nunc dimítte servum tuum, Dómine, secúndum verbum tuum in pace. Vide justum, velut corpóreæ cárcere molis inclúsum, velle dissólvi, ut incípiat esse cum Christo. Dissólvi enim, et cum Christo esse, multo mélius est.

        Sed qui vult dimítti, véniat in templum, véniat in Jerúsalem, exspéctet Christum Dómini, accípiat in mánibus Verbum Dei, complectátur opéribus velut quibúsdam suæ fídei brácchiis: tunc dimittétur, ut non vídeat mortem, qui víderit Vitam. Vides úberem in omnes grátiam, Dómini generatióne diffúsam, et prophetíam incrédulis negátam esse, non justis. Ecce et Símeon prophétat, in ruínam et resurrectiónem plurimórum venísse Dóminum Jesum Christum, ut justórum iniquorúmque mérita discérnat; et pro nostrórum qualitáte factórum, judex verus et justus aut supplícia decérnat aut prǽmia.
      status: verified
