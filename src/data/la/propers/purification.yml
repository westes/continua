matins-invitatory:
  text: 'Ecce venit ad templum sanctum suum Dominátor Dóminus: * Gaude et lætáre, Sion, occúrrens Deo tuo.'
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2026-02-02 (fixed date, always winnable). Only the chapter
# is genuinely her own (Mal 3:1, "Ecce ego mitto Angelum meum");
# responsory, both hymns, and both versicles are all byte-identical to
# Common-of-the-BVM's own already-authored content -- duplicated under
# her own id rather than left to fall through (resolveOfficeBundle
# resolves a whole bundle per id, not per part). Same chapter reused for
# Vespers -- no separate vespers-capitulum-<id> file authored, per
# vespers.ts's lookupPart (Vespers chapter, Lauds sibling) fallback.
lauds-capitulum:
  text: Ecce ego mitto Angelum meum, et præparábit viam ante fáciem meam. Et statim véniet ad templum sanctum suum Dominátor, quem vos quǽritis, et Angelus Testaménti, quem vos vultis.
  citation: Mal 3:1
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C11` live query, 2026-08 -- see lauds-capitulum-common-of-the-
# bvm.yml's header. "O gloriósa Dómina" -- the same pre-Urban VIII hymn
# text already found for the Annunciation's own proper (a separate,
# individually-imported saint, not this Common) -- a real, confirmed
# overlap between the two, not a mix-up.
lauds-hymn:
  text: |-
    O gloriósa Dómina,
    Excélsa super sídera:
    Qui te creávit, próvide
    Lactásti sacro úbere.

    Quod Heva tristis ábstulit,
    Tu reddis almo gérmine:
    Intrent ut astra flébiles,
    Cæli fenéstra facta es.

    Tu Regis alti jánua,
    Et porta lucis fúlgida:
    Vitam datam per Vírginem,
    Gentes redémptæ, pláudite.

    Glória tibi Dómine,
    Qui natus es de Vírgine,
    Cum Patre et Sancto Spíritu,
    In sempitérna sǽcula. Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C11` live query, 2026-08 -- see lauds-capitulum-common-of-the-
# bvm.yml's header. Same responsory text as Vespers (unusual for this
# app's Common categories so far -- every other one so far had distinct
# Lauds/Vespers responsories).
lauds-responsory:
  text: |
    R.br. Ave María, grátia plena, * Dóminus tecum.
    R. Ave María, grátia plena, * Dóminus tecum.
    V. Benedícta tu in muliéribus, et benedíctus fructus ventris tui.
    R. Dóminus tecum.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Ave María, grátia plena, * Dóminus tecum.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C11` live query, 2026-08 -- see lauds-capitulum-common-of-the-
# bvm.yml's header. Vespers has its own distinct versicle -- see
# vespers-versicle-purification.yml.
lauds-versicle:
  text: |
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/02-02.txt's own [Lectio Prima] and its
# English counterpart.
prime-lectio:
  text: Et placébit Dómino sacrifícium Juda et Jerúsalem sicut dies sǽculi et sicut anni antíqui, dicit Dóminus omnípotens.
  citation: Mal 3:4
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# `votive=C11` live query, 2026-08 -- "Ave maris stella," the classic
# Common-of-the-BVM Vespers hymn, genuinely distinct from the Lauds hymn
# (unlike some other categories this session where the two hours shared
# one hymn text) -- see lauds-capitulum-purification.yml's header
# for the fuller gap/sourcing writeup.
vespers-hymn:
  text: |-
    Ave maris stella,
    Dei Mater alma,
    Atque semper Virgo,
    Felix cæli porta.

    Sumens illud Ave
    Gabriélis ore,
    Funda nos in pace,
    Mutans Hevæ nomen.

    Solve vincla reis,
    Profer lumen cæcis,
    Mala nostra pelle,
    Bona cuncta posce.

    Monstra te esse matrem,
    Sumat per te preces,
    Qui pro nobis natus,
    Tulit esse tuus.

    Virgo singuláris,
    Inter omnes mitis,
    Nos culpis solútos
    Mites fac et castos.

    Vitam præsta puram,
    Iter para tutum,
    Ut vidéntes Jesum,
    Semper collætémur.

    Sit laus Deo Patri,
    Summo Christo decus,
    Spirítui Sancto,
    Tribus honor unus. Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
