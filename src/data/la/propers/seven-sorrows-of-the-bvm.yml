benedictus-antiphon:
  text: Veníte, * ascendámus ad montem Dómini, et vidéte, si est dolor, sicut dolor meus.
  status: verified

# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/09-15.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not the generic
# Common-of-the-BVM fallback text this feast rendered before 2026-09-14
# (found via a "this reads like the ferial antiphon" report: it wasn't
# literally ferial, but it was a needlessly generic Common substitution
