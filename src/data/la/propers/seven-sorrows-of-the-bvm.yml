# Read directly from web/www/horas/Latin/Sancti/09-15.txt's own
# [Oratio] and its English counterpart. Doxology "$Qui vivis" spelled
# out per the convention in st-bibiana-collect.yml.
collect:
  text: |
    Orémus.
    Deus, in cujus passióne, secúndum Simeónis prophetíam, dulcíssimam
    ánimam gloriósæ Vírginis et Matris Maríæ dolóris gládius pertransívit:
    concéde propítius; ut, qui dolóres ejus venerándo recólimus, passiónis
    tuæ efféctum felícem consequámur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (seven-sorrows-of-the-bvm-antiphon.yml), paired with the standard BVM commemoration versicle already verified elsewhere in this app (propers/common/lauds-suffrage-bvm.yml -- 'V. Ora pro nobis sancta Dei Genitrix'). Collect is the saint's own real proper (seven-sorrows-of-the-bvm-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Nolíte me consideráre * quod fusca sim, quia decolorávit me sol: fílii matris meæ pugnavérunt contra me.
    V. Ora pro nobis sancta Dei Génitrix.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Deus, in cujus passióne, secúndum Simeónis prophetíam, dulcíssimam
    ánimam gloriósæ Vírginis et Matris Maríæ dolóris gládius pertransívit:
    concéde propítius; ut, qui dolóres ejus venerándo recólimus, passiónis
    tuæ efféctum felícem consequámur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  status: verified

# the Seven Sorrows of the BVM: proper Matins hymn, Latin/Sancti/09-15.txt's [Hymnus Matutinum]. English from English/Sancti/09-15.txt.
# Before this file the saint fell to the Common's hymn.
matins-hymn:
  text: |
    O quot undis lacrimárum,
    Quo dolóre vólvitur,
    Luctuósa de cruénto
    Dum revúlsum stípite,
    Cernit ulnis incubántem
    Virgo Mater Fílium!

    Os suáve, mite pectus
    Et latus dulcíssimum,
    Dexterámque vulnerátam
    Et sinístram sáuciam,
    Et rubras cruóre plantas
    Ægra tingit lácrimis.

    Centiésque milliésque
    Stringit arctis néxibus
    Pectus illud, et lacértos,
    Illa figit vúlnera:
    Sicque tota colliquéscit
    In dolóris ósculis.

    Eja, Mater, obsecrámus 
    Per tuas has lácrimas,
    Filiíque triste funus,
    Vulnerúmque púrpuram,
    Hunc tui cordis dolórem
    Conde nostris córdibus.

    Esto Patri, Filióque,
    Et coǽvo Flámini,
    Esto summæ Trinitáti 
    Sempitérna glória,
    Et perénnis laus honórque
    Hoc et omni sǽculo.
    Amen.
  status: verified

# Read from web/www/horas/Latin/Sancti/09-15.txt's own [Invit] (no
# Monastic override exists) and its English counterpart.
matins-invitatory:
  text: Stemus juxta crucem cum María Matre Jesu, * Cujus ánimam dolóris gládius pertransívit.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/09-15.txt's own [Capitulum
# Laudes] and English/Sancti/09-15.txt's own translation. Authoring this
# was necessary for the feast's own hymn (lauds-hymn-seven-sorrows-of-
# the-bvm.yml) to actually be reached at all: hours/resolve-common.ts's
# resolveOfficeBundle is all-or-nothing per id -- her own `common:
# common-of-the-bvm` field means without a chapter of her own, the whole
# bundle (hymn included) fell through to that Common's generic text.
lauds-capitulum:
  text: Cui comparábo te? vel cui assimilábo te, fília Jerúsalem? cui exæquábo te, et consolábor te, virgo fília Sion? Magna est velut mare contrítio tua.
  citation: Lam 2:13
  status: verified

# Corrected 2026-09-10: this file was missing its 4th (closing doxology)
# stanza entirely, and its English was a self-translated draft despite a
# real, complete rhymed English translation existing in the reference
# engine all along (English/Sancti/09-15.txt's own `[Hymnus Laudes]`) --
# both found while auditing hymn-doxology markers. Body sourced from
# `web/www/horas/Latin/SanctiM/09-15.txt`'s own Lauds hymn (the first 15
# lines of Sancti/09-15.txt's own `[Hymnus Laudes]`, per its own
# "@Sancti/09-15:Hymnus Laudes:1-15" reference); the 4th stanza is
# `Tempora/Quad5-5.txt`'s own `[Doxology]` block with the Monastic
# substitution SanctiM/09-15.txt applies to it ("Jesu, tibi sit glória"
# -> "Glória tibi, Dómine"). No `*` marker anywhere in this doxology
# block -- it's this feast's own fixed ending, not a seasonally-swappable
# one.
lauds-hymn:
  text: |-
    Summæ Deus cleméntiæ,
    Septem dolóres Vírginis
    Plagásque Jesu Fílii
    Fac rite nos revólvere.

    Nobis salútem cónferant
    Deíparæ tot lácrimæ
    Quibus laváre súfficis
    Totíus orbis crímina.

    Sit quinque Jesu vúlnerum
    Amára contemplátio,
    Sint et dolóres Vírginis
    Ætérna cunctis gáudia.

    Glória tibi, Dómine,
    Qui passus es pro sérvulis,
    Cum Patre et almo Spíritu,
    In sempitérna sǽcula. Amen.
  status: verified

# No distinct Lauds versicle found for this feast in the reference source
# beyond her own Matins nocturn versicle (a different slot); reusing
# common-of-the-bvm's own Lauds versicle, same pattern as her chapter/
# hymn tiers not needing anything beyond the Common where nothing proper
# was found. Authored to make the feast's own bundle (needed for her own
# hymn, see lauds-capitulum-seven-sorrows-of-the-bvm.yml) render a real versicle instead of
# an unconditionally-rendered empty one.
lauds-versicle:
  text: |
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
  status: verified

# New file, 2026-09-15: closes a real gap found live -- Prime's Lectio
# Brevis had no per-feast override mechanism at all until today (see
# hours/resolve-common.ts's getPrimeLectioBrevis), always showing the
# generic ordinary-time default even on a real Duplex+ feast with her own
# proper reading. Sourced directly from web/www/horas/Latin/Sancti/09-15.txt
# / English/Sancti/09-15.txt's own [Lectio Prima] (Lam 2:18) -- the
# Seven Sorrows' proper Prime short reading, positioned between the
# [Ant 2]/[Lectio Prima] block and [Capitulum Sexta] in the source, i.e.
# genuinely a Prime-specific proper text, not reused from elsewhere.
prime-lectio:
  text: Deduc quasi torréntem lácrimas per diem et noctem; non des réquiem tibi, neque táceat pupílla óculi tui.
  citation: Lam. 2:18
  status: verified

# Sourced from web/www/horas/Latin/Sancti/09-15.txt's own [Hymnus Laudes]
# block (SanctiM/09-15.txt's own "[HymnusM Vespera]" tag is itself just
# "@:HymnusM Laudes", i.e. "reuse whatever this file's own Lauds hymn
# resolves to" -- but the raw secular file gives this Sapphic-meter text
# as the *Vespers* hymn specifically, distinct from the Lauds hymn above).
# Corrected 2026-09-11: an earlier version of this file claimed no English
# rendering existed in the reference engine and supplied a self-translated
# draft -- wrong; English/Sancti/09-15.txt's own [Hymnus Vespera] carries a
# real, complete rhymed English translation all along (same class of miss
# as lauds-hymn-seven-sorrows-of-the-bvm.yml's own 2026-09-10 fix). Now
# sourced directly from there.
vespers-hymn:
  text: |-
    Jam toto súbitus vesper eat polo,
    Et sol attónitum præcípitet diem,
    Dum sævæ récolo ludíbrium necis,
    Divinámque catástrophen.

    Spectátrix áderas supplício, Parens,
    Malis uda, gerens cor adamántinum;
    Natus funérea péndulus in cruce
    Altos dum gémitus dabat.

    Pendens ante óculos Natus, atrócibus
    Sectus verbéribus, Natus hiántibus
    Fossus vulnéribus, quot penetrántibus
    Te confíxit acúleis!

    Eheu! Sputa, álapæ, vérbera, vúlnera,
    Clavi, fel, áloë, spóngia, láncea,
    Sitis, spina, cruor, quam vária pium
    Cor pressére tyránnide!

    Cunctis intérea stas generósior,
    Virgo, Martýribus: prodígio novo,
    In tantis móriens non móreris, Parens,
    Diris fixa dolóribus.

    Sit summæ Tríadi glória, laus, honor,
    A qua supplíciter, sollícita prece,
    Posco virgínei róboris ǽmulas
    Vires rebus in ásperis. Amen.
  status: verified

