# Sourced from web/www/horas/Latin/Sancti/09-15.txt's own [Ant Vespera]
# block (SanctiM/09-15.txt says "Psalmi Dominica" and inherits the whole
# office via "@Sancti/09-15" at its own top -- same Sunday-psalm-numbers-
# but-real-proper-antiphons shape as Immaculate Conception/Assumption).
# NOT sourced from a live "Hodie" query: that returned Nativity BVM's own
# text instead (Sept 15 falls inside Nativity's own octave, and the
# reference engine's stock default calendar apparently resolves the
# office winner there differently than vu's own calendar does) -- a real
# pitfall of trusting "today's automatic winner" queries on a date where
# vu's blended calendar diverges from the reference engine's own. Only
# the first 4 of the raw file's 5 listed antiphons are used (Monastic
# Vespers has 4 psalm slots, not 5 -- same convention already confirmed
# for nativity-of-st-john-the-baptist.yml).
vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: Quo ábiit * diléctus tuus, o pulchérrima mulíerum? quo declinávit diléctus tuus, et quærémus eum tecum?
    - psalms:
        - 112
      antiphon: Recédite a me, * amáre flebo, nolíte incúmbere, ut consolémini me.
    - psalms:
        - 121
      antiphon: Non est ei * spécies neque decor, et vídimus eum, et non erat aspéctus.
    - psalms:
        - 126
      antiphon: A planta pedis * usque ad vérticem cápitis non est in eo sánitas.

# Matins Nocturn 3 reading for the Seven Sorrows of the Blessed Virgin
# Mary (Sep 15). Sourced directly from
# web/www/horas/Latin/Sancti/09-15.txt, English/Sancti/09-15.txt --
# Lectio7-9, St. Ambrose's homily on John 19:25-27 (On Virgins, 7) and
# his own Epistle 25 to the Church of Vercelli, combined into one
# reading. Nocturn 2 (Lectio4-6) is a direct `@Tempora/Quad5-5`
# cross-reference (Friday of Passion Week), not this feast's own
# content -- not transcribed here.
#
# Update (2026-09-05): the Gospel pericope itself (John 19:25-27,
# "Stabant juxta Crucem" -- confirmed by St. Ambrose's own homily text,
# which opens by quoting and glossing this exact passage) is now
# authored too (isGospel: true, immediately before the homily), matching
# the newer convention set by post-pentecost-16.yml -- sourced from
# missa/Latin/Sancti/09-15.txt's own [Evangelium] and
# missa/English/Sancti/09-15.txt.
nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Joann 19:25-27
      text: 'In illo témpore: Stabant juxta Crucem Jesu Mater ejus, et soror Matris ejus, María Cléophæ, et María Magdaléne. Cum vidísset ergo Jesus Matrem, et discípulum stantem, quem diligébat, dicit Matri suæ: Múlier, ecce fílius tuus. Deinde dicit discípulo: Ecce Mater tua. Et ex illa hora accépit eam discípulus in sua.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, On Virgins, Bk. 7; Epistle 25 to the Church of Vercelli
      text: |-
        Stabat juxta crucem Mater, et, fugiéntibus viris, stabat intrépida. Vidéte utrum pudórem mutáre potúerit Mater Jesu, quæ ánimum non mutávit. Spectábat piis óculis Fílii vúlnera, per quæ sciébat ómnibus futúram redemptiónem. Spectábat non degéneri mater spectáculo, quæ non metúerat peremptórem. Pendébat in cruce Fílius, Mater se persecutóribus offerébat.

        María Mater Dómini ante crucem Fílii stabat. Nullus me hoc dócuit, nisi sanctus Joánnes Evangelísta. Mundum álii concússum in passióne Dómini conscripsérunt, cælum ténebris obdúctum, refugísse solem, in paradísum latrónem, sed post piam confessiónem, recéptum. Joánnes dócuit, quod álii non docuérunt, quemádmodum in cruce pósitus Matrem appelláverit. Pluris putátur quod victor suppliciórum pietátis offícia Matri exhibébat, quam quod regnum cæléste donábat. Nam si religiósum est quod latróni donátur vénia, multo uberióris pietátis est quod a Fílio Mater tanto afféctu honorátur.

        Ecce, inquit, fílius tuus: ecce mater tua. Testabátur de cruce Christus, et inter matrem atque discípulum dividébat pietátis offícia. Condébat Dóminus non solum públicum, sed étiam domésticum testaméntum: et hoc ejus testaméntum signábat Joánnes, dignus tanto testatóre testis. Bonum testaméntum, non pecúniæ, sed vitæ ætérnæ; quod non atraménto scriptum est, sed Spíritu Dei vivi, qui ait: Lingua mea cálamus scribæ velóciter scribéntis.
      status: verified
