# Matins Nocturn 2 reading for St. Anterus, Pope and Martyr (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/01-03-Antherus.txt, [Lectio4], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Antherus, natióne Græcus, patre Romulo, post sanctum Pontianum Romæ ordinátus est Epíscopus. Is gesta mártyrum diligénter a notáriis conquisivit ac in Ecclésia recondidit. Propter eam causam a Máximo Præfécto martyrio coronátus est tértio Nonas Januárii, sepultúsque in cœmetério Callísti via Appia Maximíno príncipe. Única ordinatióne, mense Decémbri, ordinávit Epíscopum Fundanæ civitátis in Campánia. Sedit in Pontificátu mensem unum, dies duódecim.
      status: verified
