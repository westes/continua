# First Vespers (Saturday evening) Magnificat antiphon: reference engine, Monastic Tridentinum 1617, prayVespera 2027-07-17 ("Vespera de sequenti"). The default (Second Vespers) file is the same id without "-first". See hours/resolve-common.ts's getMagnificatAntiphon; keys of the form month-week-MMN are the engine's Aug-Nov calendar-month Sundays (calendar/month-week-id.ts).
magnificat-antiphon/~-first:
  text: 'Dum tólleret Dóminus * Elíam per túrbinem in cælum, Eliséus clamábat: Pater mi, currus Israël et auríga ejus.'
  status: verified
  temporal: true

# Nocturn 2-3, 9th Sunday after Pentecost. Sourced from Tempora/Pent09-0.txt.
# See post-pentecost-02.yml for sweep method/responsory-reuse note.
# Nocturn 2: St. Augustine sermon on Elijah as a type of Christ - one
# continuous excerpt (Lectio4-6). Nocturn 3: Lectio7 bare incipit (Luke
# 19:41-47, Jesus weeps over Jerusalem) skipped; Lectio8-9 one continuous
# homily by Pope St. Gregory the Great, combined.
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 201 for the Season
      text: |-
        In lectiónibus quæ nobis diébus istis recitántur, fratres caríssimi, frequénter admónui, ut non sequámur lítteram occidéntem, et vivificántem spíritum relinquámus. Sic enim Apóstolus ait: Líttera enim occídit, spíritus vivíficat. Si enim hoc tantum vólumus intellégere quod sonat in líttera, aut parvam, aut prope nullam ædificatiónem de divínis lectiónibus capiémus. Illa enim ómnia quæ recitántur, typus erant et imágo futurórum. In Judǽis enim figuráta, in nobis, grátia Dei donánte, compléta sunt.

        Beátus enim Elías typum hábuit Dómini Salvatóris. Sicut enim Elías a Judǽis persecutiónem passus est; ita et verus Elías Dóminus noster ab ipsis Judǽis reprobátus est et contémptus. Elías relíquit gentem suam; et Christus deséruit synagógam. Elías ábiit in desértum; et Christus venit in mundum. Elías in desérto corvis ministrántibus pascebátur; et Christus in desérto mundi hujus Géntium fide refícitur.

        Corvi enim illi qui beáto Elíæ, jubénte Dómino, ministrábant, Géntium pópulum figurábant. Proptérea et de géntium Ecclésia dícitur: Nigra sum et formósa, fília Jerúsalem. Unde est Ecclésia nigra et formósa? Nigra per natúram, formósa per grátiam. Unde nigra? Ecce in iniquitátibus concéptus sum, et in delíctis péperit me mater mea. Unde formósa? Aspérges me hyssópo, et mundábor: lavábis me, et super nivem dealbábor.
      responsory: |-
        R. Percússit Saul mille, et David decem míllia: * Quia manus Dómini erat cum illo: percússit Philisthǽum, et ábstulit oppróbrium ex Israël.
        V. Nonne iste est David, de quo canébant in choro, dicéntes: Saul percússit mille, et David decem míllia?
        R. Quia manus Dómini erat cum illo: percússit Philisthǽum, et ábstulit oppróbrium ex Israël.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 19:41-47
      text: 'In illo témpore: Cum appropinquáret Jesus Jerúsalem, videns civitátem, flevit super illam, dicens: Quia si cognovísses et tu, et quidem in hac die tua, quæ ad pacem tibi, nunc autem abscóndita sunt ab óculis tuis. Quia vénient dies in te: et circúmdabunt te inimíci tui vallo, et circúmdabunt te: et coangustábunt te úndique: et ad terram prostérnent te, et fílios tuos, qui in te sunt, et non relínquent in te lápidem super lápidem: eo quod non cognóveris tempus visitatiónis tuæ. Et ingréssus in templum, cœpit ejícere vendéntes in illo et eméntes, dicens illis: Scriptum est: Quia domus mea domus oratiónis est. Vos autem fecístis illam speluncam latrónum. Et erat docens cotídie in templo.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 39 on the Gospels
      text: |-
        Quod a flente Dómino illa Jerosolymórum subvérsio descríbitur, quæ a Vespasiáno et Tito Románis princípibus facta est, nullus qui históriam eversiónis ejúsdem legit, ignórat. Románi étenim príncipes denuntiántur, cum dícitur: Quia vénient dies in te, et circúmdabunt te inimíci tui vallo. Hoc quoque quod ádditur: Non relínquent in te lápidem super lápidem: étiam jam ipsa ejúsdem civitátis transmigrátio testátur; quia dum nunc in eo loco constrúcta est, ubi extra portam fúerat Dóminus crucifíxus, prior illa Jerúsalem, ut dícitur, fúnditus est evérsa.

        Cui ex qua culpa eversiónis suæ pœna fúerit illáta, subjúngitur: Eo quod non cognóveris tempus visitatiónis tuæ. Creátor quippe hóminum per incarnatiónis suæ mystérium hanc visitáre dignátus est; sed ipsa timóris et amóris ílius recordáta non est. Unde étiam per prophétam in increpatióne cordis humáni aves cæli ad testimónium deducúntur, dum dícitur: Milvus in cælo cognóvit tempus suum, turtur et hirúndo et cicónia custodiérunt tempus advéntus sui; pópulus autem meus non cognóvit judícium Dómini.

        Flevit étenim prius Redémptor ruínam pérfidæ civitátis, quam ipsa sibi cívitas non cognoscébat esse ventúram. Cui a flente Dómino recte dícitur: Quia si cognovísses, et tu; subáudi, fleres; quæ modo, quæ nescis quod ímminet, exsúltas. Unde et súbditur: Et quidem in hac die tua, quæ ad pacem tibi. Cum enim carnis se voluptátibus daret, et ventúra mala non prospíceret; in die sua, quæ ad pacem esse ei póterant, habébat.
      responsory: |-
        R. Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.
        V. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.
        R. Plena est omnis terra glória ejus.
      status: verified
