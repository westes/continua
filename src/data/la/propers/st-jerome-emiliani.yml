# Read from the reference engine: web/www/horas/Latin/Sancti/07-20.txt [Oratio];
# English from English/Sancti/07-20.txt.
collect:
  text: |
    Orémus.
    Deus, misericordiárum pater, per mérita et intercessiónem beáti Hierónymi, quem órphanis adjutórem et patrem esse voluísti: concéde; ut spíritum adoptiónis, quo fílii tui nominámur et sumus, fidéliter custodiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-a-confessor; collect is the saint's own (collect-st-jerome-emiliani.yml). Not
# independently live-verified for this category, so marked draft.
commemoration:
  text: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, intra in gáudium Dómini tui.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, misericordiárum pater, per mérita et intercessiónem beáti Hierónymi, quem órphanis adjutórem et patrem esse voluísti: concéde; ut spíritum adoptiónis, quo fílii tui nominámur et sumus, fidéliter custodiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 and 3 reading for St. Jerome Emiliani, Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/07-20.txt, English/Sancti/07-20.txt.
# Lectio4-6 combined into one reading, one continuous vita. Nocturn 3: the Gospel pericope then the saint's own homily.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Hieronymus, e gente patrícia Æmiliáni Venetiis ortus, a prima adolescéntia milítiæ addictus, difficillimis reipublicæ tempóribus Casto novo ad Quarum in móntibus Tarvisinis præfícitur. Arce ab hostibus capta, ipse in teterrimum carcerem detrúditur, mánibus ac pédibus vinctus; cui omni humana ope destituto beatíssima Virgo, ejus precibus exorata, clemens adest, víncula solvit, et per médios hostes, qui vias omnes obséderant, in Tarvisii conspéctum incólumum ducit. Urbem ingréssus, ad Deíparæ aram, cui se vóverat, mánicas, compedes, catenas, quas secum detulerat, in accepti beneficii testimónium suspendit. Reversus Venetias, cœpit pietátis stúdia impensius cólere, in páuperes mire effúsus, sed puerórum præsertim misértus, qui paréntibus orbati, egeni et sórdidi per urbem vagabántur; quos in ædes a se conductas recepit de suo alendos, et christiánis móribus imbuéndos.

        Per eos dies Venetias appúlerant beátus Cajetanus et Petrus Caráfa (postmodum Paulus quartus), qui, Hierónymi spíritu novoque instituto colligéndi órphanos probato, illum in Incurabílium hospitale adduxérunt, in quo órphanos simul educaret, atque ægrotis pari caritate inservíret. Mox eorúmdem hortatu in próximam continentem profectus, Brixiæ primum, deínde Bérgomi atque Novocómi orphanotróphia eréxit: Bérgomi præsertim, ubi præter duo, pro púeris unum et pro puellis álterum, domum excipiendis, novo in illis regiónibus exemplo, muliéribus a turpi vita ad pœniténtiam conversis, apéruit. Somaschæ, in humili pago agri Bergoménsis ad Vénetæ ditiónis fines, sibi ac suis ibi sedem constítuit, formamque indúxit, congregatiónis, cui proptérea a Somascha nomen factum; quam subinde auctam et propagatam, nedum orphanórum regímini et ecclesiárum cultui, sed ad majórem christianæ reipublicæ utilitátem, adolescéntium in litteris et bonis móribus institutióni in collegiis, academíis et seminariis addictam, sanctus Pius quintus inter religiósos ordines adscripsit, ceteríque Pontifices privilegiis ornarunt.

        Orphanis colligéndis intentus, Mediolanum proficíscitur atque Ticinum; et utrobíque collectis agmínibus puerórum, tectum, victum, vestem, magistros, nobílibus viris favéntibus, próvide constítuit. Inde Somascham redux, ómnibus ómnia factus, a nullo abhorrebat opere, quod in próximi bonum cédere prævidéret. Agricolis immixtus per agros sparsis, dum se illis adjutórem in meténdis frugibus præbet, mysteria fidei explicábat; puerórum cápita porígine fœda abstergens, et patienter tractans curábat; pútridis rusticórum vulnéribus medebátur eo successu, ut grátia curatiónum donatus censerétur. In monte, qui Somaschæ imminet, repérta specu, in illam se ábdidit; ubi, se flagellis cædens, dies integros jejunus tránsigens, oratióne in plurimum noctem protracta, super nudo saxo brevem somnum carpens, sui aliorúmque noxárum pœnas luebat. In hujus specus interiori recessu ex árido sílice exstillat aqua, precibus servi Dei, ut constant tradítio est, impetrata, quæ usque in hodiérnam diem jugiter manans, et in varias regiónes delata, ægris sanitátem plerumque conciliat. Tandem, ex contagióne quæ per omnem vallem serpebat, dum ægrotántibus inservit, et vita functos propriis humeris ad sepultúram defert, contracto morbo, annos natus sex et quinquagínta, quam paulo ante prædixerat, pretiósam mortem obiit anno millesimo quingentésimo trigesimo septimo. Quem plúribus in vita et post mortem miraculis illustrem, Benedíctus décimus quartus Beatórum, Clemens vero décimus tertius Sanctórum fastis solemniter adscripsit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 19:13-21
      text: 'Tunc oblati sunt ei parvuli, ut manus eis imponeret, et oraret. Discipuli autem increpabant eos. Jesus vero ait eis: Sinite parvulos, et nolite eos prohibere ad me venire: talium est enim regnum caelorum. Et cum imposuisset eis manus, abiit inde. Et ecce unus accedens, ait illi: Magister bone, quid boni faciam ut habeam vitam aeternam? Qui dixit ei: Quid me interrogas de bono? Unus est bonus, Deus. Si autem vis ad vitam ingredi, serva mandata. Dicit illi: Quae? Jesus autem dixit: Non homicidium facies; non adulterabis; non facies furtum; non falsum testimonium dices; honora patrem tuum, et matrem tuam, et diliges proximum tuum sicut teipsum. Dicit illi adolescens: Omnia haec custodivi a juventute mea: quid adhuc mihi deest? Ait illi Jesus: Si vis perfectus esse, vade, vende quae habes, et da pauperibus, et habebis thesaurum in caelo: et veni, sequere me.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. John Chrysostom, Patriarch of Constantinople, Homily on Matthew
      text: |-
        Cur discípuli púeros abigebant? Dignitátis causa. Quid ergo ille? Ut doceat illos modeste sapere, fastumque mundanum conculcare, et suscipit, et ulnis complectitur, talibúsque regnum cælórum pollicétur; id quod étiam dixit superius. Et nos ígitur, si volumus heredes esse cælórum, hanc virtútem cum diligéntia magna sectemur. Hoc est enim philosophíæ culmen, simplicem esse cum prudéntia; hæc vita est angelica. Anima enim puéruli ómnibus animi morbis vacua est; non memóriam retinet injuriárum, sed eas inferéntes adit ut amicos, ac si nihil factum esset. Et quamvis a matre verbéribus cædátur, eam semper quærit, et ómnibus antepónit.

        Si regínam ipsi ostendas diadémate ornatam, non præfert eam matri pannis detritis vestitæ, malletque illam incultam vidére, quam regínam mirifice amíctam. Nam, quod suum, quod aliénum est, non ex paupertáte vel divítiis, sed ex amóre existimare solet; et nihil plus requirit quam necessaria, atque ut lacte repletus est, statim a mamma abscedit. Non eisdem, quibus nos, ærumnis prémitur, nec pecuniárum jactura, rebusque simílibus; nec iisdem, quibus nos, fluxis rebus lætátur, neque córporum pulchritúdinem mirátur. Ideo dicebat: Talium est enim regnum cælórum; ut ex proposito voluntátis illa operemur, quæ natúra sua púeri faciunt.

        Quia enim pharisæi non aliunde quam a nequítia et arrogántia ad agéndum ferebántur, ideo ubíque discipulos suos simplices esse jubet, illosque subíndicat, dum hos instituit. Nihil enim ita supérbiam parit, ut principátus et primi conséssus. Quóniam ígitur discípuli per totum terrárum orbem multum honoris consecuturi erant, ipsórum animos prævenit, nec sinit eos humánum quid pati, nec honórem a vulgo expétere, vel ante alios sese efferre. Nam, etiamsi hæc parva vidéntur esse, at malis ingéntibus causam præbent. Sic enim institúti pharisæi in malórum culmen ascendérunt, salutatiónes, primos conséssus et médios requiréntes; hinc in ardentem glóriæ cupiditátem, inde vero in impietátem lapsi sunt.
      status: verified
