# Verified against Divinum Officium (Monastic Tridentinum 1617), 2026-08.
# Pulled from the reference engine's own era-specific calendar table
# (web/www/Tabulae/Kalendaria/1570.txt + M1617.txt, own title
# "Ss. Euphemiae, Luciae et Geminiani Martyrum") and its own source file, not the merged per-date
# files those tables' fileref points at directly -- see TODO.md.
collect:
  text: |
    Orémus.
    Præsta, Dómine, précibus nostris cum exsultatióne provéntum: ut sanctórum Mártyrum Euphémiæ, Lúciæ et Geminiáni, quorum diem passiónis ánnua devotióne recólimus, étiam fídei constántiam subsequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (ss-euphemia-lucia-and-geminianus-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-several-martyrs (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (ss-euphemia-lucia-and-geminianus-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Gaudent in cælis * ánimæ Sanctórum, qui Christi vestígia sunt secúti: et quia pro ejus amóre sánguinem suum fudérunt, ídeo cum Christo exsúltant sine fine.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    Præsta, Dómine, précibus nostris cum exsultatióne provéntum: ut sanctórum Mártyrum Euphémiæ, Lúciæ et Geminiáni, quorum diem passiónis ánnua devotióne recólimus, étiam fídei constántiam subsequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Pulled directly from her own source file's [Ant 1]
# (Sancti/09-16cc.txt, the same fileref her collect was verified against
# -- see her own saint record's comment) -- NOT live-query-verified, and
# marked `draft` rather than `verified` for that reason: she can never
# be the day's own rendered title (always commemorated under Ss.
# Cornelius and Cyprian, see her own file's comment), so there is no
# live Lauds page to confirm this [Ant 1] text is actually what's used
# at the Benedictus specifically, rather than elsewhere (Vespers'
# Magnificat, say) -- a real, demonstrated risk: St. Alexius's own file
# likewise has a real [Ant 1] ("Similábo eum...") that his live-rendered
# Benedictus antiphon does *not* use (it draws from common-of-an-abbot
# instead, confirmed live) -- so a raw [Ant 1] read is not on its own
# sufficient proof for a *winnable* saint either, let alone one that can
# never be checked. English translated (the source's own English page
# had no rendering at all), same `draft` reasoning applies twice over.
benedictus-antiphon:
  text: 'Gaudent in cælis * ánimæ Sanctórum, qui Christi vestígia sunt secúti: et quia pro ejus amóre sánguinem suum fudérunt, ídeo cum Christo exsúltant sine fine.'
  status: draft

# Matins Nocturn 2 reading for Ss. Euphemia, Lucy, and Geminian, Martyrs
# (Sep 16) — pre-1955-but-post-1617. Plain Sancti/09-16.txt is a
# different saint pairing (Ss. Cornelius and Cyprian, sourced separately
# in ss-cornelius-and-cyprian.yml) who share this date on the general
# calendar; Euphemia/Lucy/Geminian's own content is at the suffixed
# sibling file (see memory vu-matins-pre1955-saints's "critical
# wrinkle").
# web/www/horas/Latin/Sancti/09-16cc.txt, English/Sancti/09-16cc.txt.
# Single lesson (simplex-feast Lectio93), no responsory in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Euphemia, Lúcia et Geminianus, in persecutióne Diocletiáni, non eodem loco, sed eodem die, martyrio coronáti sunt. Euphemia Virgo apud Chalcédonem, Prisco proconsule, varia tormentórum genera, virgárum, equulei, rotárum, ignis constanter passa; demum béstiis objecta, una ex iis morsum sancto corpori infigente, ceteris pedes ejus lambéntibus, immaculátum spíritum Deo réddidit. Lúcia, vidua Romana, a fílio Eutropio quod Christum multos annos coluísset accusata, in ollam pice ac plumbo ferventuem dimittitur; unde incólumis evadens, cum ferro plumboque oneráta per Urbem ducerétur, Geminianum, nóbilem virum, constántia fidei et martyrii ad Christum convértit. Quem étiam cum multis aliis ad fidem perductis, varie tortum, gloriosi martyrii, abscisso cápite, socium hábuit. Quorum córpora Maxima, mulier christiana, honorifice sepelívit.
      status: verified
