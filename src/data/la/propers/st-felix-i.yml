# Matins Nocturn 2 reading for St. Felix I, Pope, Martyr (May 30).
# No genuine SanctiM match: the only SanctiM file at this date,
# `SanctiM/05-30b.txt`, is St. Joan of Arc's — a different feast
# sharing the date, not a Felix I override — so this is a missed
# pre-1955-pool candidate (Sancti-only, no SanctiM of its own), same
# shape as the two pool passes recorded in memory
# vu-matins-pre1955-saints / vu-matins-sanctim-saints.
# web/www/horas/Latin/Sancti/05-30.txt, English/Sancti/05-30.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Felix Románus, patre Constántio, Aureliáno imperatóre præfuit Ecclésiæ. Constítuit ut Missa supra memórias et sepúlcra Mártyrum celebrarétur. Qui cum mense Decémbri habuísset ordinatiónes duas, et creásset presbýteros novem, diáconos quinque, epíscopos per divérsa loca quinque, martyrio coronátus, via Aurelia sepelítur in basílica quam a se ædificátam dedicárat. Vixit in pontificátu annos duos, menses quátuor, dies vigínti novem.
      status: verified
