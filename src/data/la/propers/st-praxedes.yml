# Matins Nocturn 2 reading for St. Praxedes, Virgin (July 21) —
# pre-1955-but-post-1617 (no SanctiM/07-21*.txt at all; the "r" suffix
# variant at this date is a different saint, St. Lawrence of Brindisi,
# not relevant). web/www/horas/Latin/Sancti/07-21.txt,
# English/Sancti/07-21.txt. Single lesson (simplex-feast Lectio93), no
# responsory in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Praxédes, virgo Romana, Pudentiánæ vírginis soror, Marco Antonino imperatóre Christiános persequente, eos facultátibus, opera, consolatióne, et omni caritátis officio prosequebátur. Nam alios domi occultábat; alios ad fidei constantiam hortabátur: aliórum córpora sepeliebat; iis, qui in carcere inclusi erant, qui in ergástulis exercebántur, nulla re déerat. Quæ, cum tantam Christianórum stragem jam ferre non posset, Deum precáta est, ut, si mori expediret, se e tantis malis eríperet. Itaque duodecimo Kalendas Augusti ad pietátis præmia vocátur in cælum. Cujus corpus a Pastore presbytero in patris et sororis Pudentiánæ sepúlcrum illátum est, quod erat in cœmeterio Priscillæ, via Salaria.'
      status: verified
