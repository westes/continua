# Matins Nocturn 2 reading for the Conversion of St. Paul (Jan 25) —
# SanctiM/01-25.txt inherits the whole day (`@Sancti/01-25`) with no
# Nocturn 2/3 override, so this feast's own proper content is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints). A second Tridentine suffix variant
# (`Sancti/01-25r.txt`) also exists for this same feast, but is a later
# rubric variant with less of its own text (its Lectio4 is itself
# `@Sancti/01-25:Lectio3`) — the plain `01-25.txt` has the fuller,
# earlier proper text and is used here.
# web/www/horas/Latin/Sancti/01-25.txt, English/Sancti/01-25.txt.
# Lectio4-6 (St. Augustine's sermon on Paul's conversion) combined into
# one reading, one continuous excerpt — Lectio7-9 fall back to Common
# of an Apostle (`Commune/C1`), not proper text, so not authored here.
# No responsory given in the source for these lessons.
#
# Checked 2026-09-05 for a missing Gospel pairing: confirmed via
# horas/Latin/Sancti/01-25.txt directly — Augustine's Sermon 14 is
# genuinely Nocturn 2, not Gospel-tied; this feast's own Nocturn 3
# (Lectio7-9) isn't proper text at all (falls to Commune/C1, an
# Apostle's Common), so there is no proper Gospel pericope of this
# feast's own to pair against. No pairing added.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 14 on the Saints
      text: |-
        Hódie de Actibus Apostolórum léctio hæc pronuntiáta est, ubi Paulus Apóstolus, ex persecutóre Christianórum, annuntiátor factus est Christi. Prostrávit enim Christus persecutórem, ut fáceret Ecclésiæ doctórem: percútiens eum, et sanans; occídens, et vivíficans: occísus agnus a lupis, et fáciens agnos de lupis. Ita enim in præclára prophetía cum Jacob Patriárcha benedíceret fíliis suis (præséntes tangens, futúra prospíciens) prædíctum erat quod in Paulo cóntigit. Erat autem Paulus, sicut ipse testátur, de tribu Bénjamin. Cum autem Jacob, benedícens fílios suos, venísset ad benedicéndum Bénjamin, ait de illo: Bénjamin lupus rapax.

        Quid ergo? lupus rapax semper? Absit; sed qui mane rapit prædam, ad vésperam dívidit escas. Hoc in Apóstolo Paulo implétum est, quia et de illo dictum erat. Jam, si placet, audiámus illum mane rapiéntem, ad vésperam escas dividéntem. Mane et véspere pósita sunt pro eo, ac si dicerétur, prius et póstea. Sic ergo accipiámus: Prius rápiet, póstea dívidet escas. Atténdite raptórem: Saulus, inquit, accéptis epístolis a princípibus sacerdótum, ibat, ut ubicúmque inveníret Christiános, ad sacerdótes attráheret et addúceret, útique puniéndos.

        Ibat spirans et anhélans cædes: hoc est, mane rápiens. Nam et quando lapidátus est Stéphanus primus Martyr pro nómine Christi, evidéntius áderat et Saulus; et sic áderat lapidántibus, ut non ei suffíceret, si tantum suis mánibus lapidáret. Ut enim esset in ómnium lapidántium mánibus, ipse ómnium vestiménta servábat; magis sǽviens omnes adjuvándo, quam suis mánibus lapidándo. Audívimus, mane rápiet: videámus ad vésperam quáliter dívidat escas. Voce Christi prostrátus de cælo, et accípiens désuper interdíctum jam sæviéndi, cécidit in fáciem suam, prius prosternéndus, póstea erigéndus; prius percutiéndus, póstea sanándus.
      status: verified
