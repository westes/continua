# Matins Nocturn 2 reading for St. Paul I, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/07-03-PaulI.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Paulus hujus nóminis primus, natióne Románus, patre Constantíno, post óbitum Stéphani tértii germáni fratris, anno Christi septingentésimo quinquagésimo séptimo in ejus locum, novo exémplo, subrogatus est. Sed hoc exímiæ illíus virtúti debebatur. Cum enim a Gregório secúndo in patriarchio Lateranénsi, una cum fratre, a primis annis ad christiános mores et omnem eruditiónem ecclesiásticam egrégie formatus fuísset, digniórem clerus non hábuit, quem perturbatissimis illis tempóribus pio fratri successorem eligeret.

        Constantínum Copronymum lítteris per legatum ad eum missis, semel atque íterum sollicitavit ut saniorem doctrínam amplecteretur; sed hæreticus et induratus princeps solliciti pastóris vocem audíre nóluit, et in cathólicos, ac præcípue in monachos sævire non cessávit: quorum plúrimi, ut a tyránno se subdiicerent, in Itáliam se receperunt; quos benígne Paulus excépit, iisque templa et monastéria, cóngruis instructa reditibus, assignavit, in quibus Græca lingua, et patrio ritu sacra peragerent.

        Exstant multæ illíus epístolæ ad Pipinum Francorum regem scriptæ, in quibus grátias agit optimo, et de Romána Ecclésia bene mérito principi, pro suscépta Ecclésiæ contra Longobardórum irruptiones defensione; eúmque raris elogiis cumulatum impense hortatur, ne umquam a cœpto desistat. Cum autem cœmeteria extra muros a Longobardis diruta fuíssent, multas inde sanctórum exúvias, ne barbaris in prædam cederent, in Urbem intulit; quarum non módicam partem in ecclésiam monastérii a se constructi in paternis ǽdibus et pingui censu ditati collocávit. Ceterum si quid ipsi témporis residui ecclesiástici regíminis cura relínqueret, id totum aléndis Christi paupéribus, ægris, víduis, ac detentis in cárcere consolandis, liberandisque oppressis aëre aliéno impéndit. Et tandem maturus cœlo pie óbiit, undécimo pontificátus anno jam inito, et in Vaticáno sepúltus est.
      status: verified
