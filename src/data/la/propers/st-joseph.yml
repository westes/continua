# Sourced from web/www/horas/Latin/Sancti/03-19.txt's own [Hymnus
# Vespera] and English/Sancti/03-19.txt's own translation.
vespers-hymn:
  text: |-
    Te, Joseph, célebrent ágmina cǽlitum,
    Te cuncti résonent christíadum chori,
    Qui clarus méritis, junctus est ínclitæ
    Casto fœ́dere Vírgini.

    Almo cum túmidam gérmine cónjugem
    Admírans, dúbio tángeris ánxius,
    Afflátu súperi Fláminis Angelus
    Concéptum Púerum docet.

    Tu natum Dóminum stringis, ad éxteras
    Ægýpti prófugum tu séqueris plagas;
    Amíssum Sólymis quæris, et ínvenis,
    Miscens gáudia flétibus.

    Post mortem réliquos sors pia cónsecrat,
    Palmámque eméritos glória súscipit:
    Tu vivens, Súperis par, frúeris Deo,
    Mira sorte beátior.

    Nobis, summa Trias, parce precántibus,
    Da Joseph méritis sídera scándere:
    Ut tandem líceat nos tibi pérpetim
    Gratum prómere cánticum. Amen.
  status: verified

# Sourced from web/www/horas/Latin/SanctiM/03-19.txt's own [Responsory
# Vespera]. No English rendering exists in the reference engine's data;
# translated here directly (echoes Sir 51:14, the wisdom canticle already
# associated with Confessor saints in this tradition).
vespers-responsory:
  text: |
    R.br. Invocávi Dóminum, * Patrem Dómini mei.
    R. Invocávi Dóminum, * Patrem Dómini mei.
    V. Ut non derelínquat me in die tribulatiónis.
    R. Patrem Dómini mei.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Invocávi Dóminum, * Patrem Dómini mei.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/03-19.txt's own [Versum 1]
# (positioned directly after [Hymnus Vespera]) and English/Sancti/03-19
# .txt's own translation.
vespers-versicle:
  text: |
    V. Constítuit eum dóminum domus suæ.
    R. Et príncipem omnis possessiónis suæ.
  status: verified

