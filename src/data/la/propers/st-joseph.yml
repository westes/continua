# Matins Nocturn 2 reading for St. Joseph, Spouse of the B.V.M.,
# Confessor (Mar 19) — SanctiM/03-19.txt's own Lectio2-9 all resolve
# back to `@Sancti/03-19:LectioN` (resliced for the Monastic 9/12-lesson
# structure with its own added responsories), so this saint's own
# proper content is sourced from the Tridentine track exactly as for a
# pre-1955 saint (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/03-19.txt, English/Sancti/03-19.txt.
# Lectio4-6 (St. Bernard's sermon comparing Joseph the Patriarch to
# Joseph the husband of Mary) combined into one reading, one continuous
# excerpt. Lectio7-9 reference `@Sancti/12-24:Lectio1-3` (Christmas
# Eve's own Nocturn 1 scripture reading) — not proper to Joseph, so not
# authored here. No responsory given for Lectio4-6.
#
# Update (2026-09-05): St. Bernard's homily is "Homily 2 super Missus
# est", his treatise on the Annunciation Gospel (Luke 1:26-38, the
# "Missus est" pericope) — that Gospel itself is now authored too
# (isGospel: true, immediately before the homily), even though it isn't
# actually proclaimed at Matins here (Lectio1-3 are Genesis readings on
# Joseph the Patriarch, not this Gospel) — it's the text the homily is
# preached on. Latin sourced from missa/Latin/Tempora/Adv3-3.txt (Ember
# Wednesday of Advent shares this same full pericope verbatim); English
# from missa/English/Sancti/03-25.txt (the Annunciation's own Mass
# Gospel, same citation "Luke 1:26-38").
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: true
      citation: Luc 1:26-38
      text: 'In illo témpore: Missus est Angelus Gábriel a Deo in civitátem Galilǽæ, cui nomen Názareth, ad Vírginem desponsátam viro, cui nomen erat Joseph, de domo David, et nomen Vírginis María. Et ingréssus Angelus ad eam, dixit: Ave, grátia plena; Dóminus tecum: benedícta tu in muliéribus. Quæ cum audísset, turbáta est in sermóne ejus: et cogitábat, qualis esset ista salutátio. Et ait Angelus ei: Ne tímeas, María, invenísti enim grátiam apud Deum: ecce, concípies in útero, et páries fílium, et vocábis nomen ejus Jesum. Hic erit magnus, et Fílius Altíssimi vocábitur, et dabit illi Dóminus Deus sedem David, patris ejus: et regnábit in domo Jacob in ætérnum, et regni ejus non erit finis. Dixit autem María ad Angelum: Quómodo fiet istud, quóniam virum non cognósco? Et respóndens Angelus, dixit ei: Spíritus Sanctus supervéniet in te, et virtus Altíssimi obumbrábit tibi. Ideóque et quod nascétur ex te Sanctum, vocábitur Fílius Dei. Et ecce, Elísabeth, cognáta tua, et ipsa concépit fílium in senectúte sua: et hic mensis sextus est illi, quæ vocátur stérilis: quia non erit impossíbile apud Deum omne verbum. Dixit autem María: Ecce ancílla Dómini, fiat mihi secúndum verbum tuum.'
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Bernard of Clairvaux, Abbot, Homily 2 on Luke 1:26 (Missus est)
      text: |-
        Quis et qualis homo fúerit beátus Joseph, cónice ex appellatióne, qua, licet dispensatória, méruit honorári ádeo, ut pater Dei et dictus et créditus sit; cónice et ex próprio vocábulo, quod augméntum non dúbitas interpretári. Simul et meménto magni illíus quondam Patriárchæ vénditi in Ægýpto; et scito ipsíus istum non solum vocábulum fuísse sortítum, sed et castimóniam adéptum, innocéntiam assecútum et grátiam.

        Síquidem ille Joseph, fratérna ex invídia vénditus et ductus in Ægýptum, Christi venditiónem præfigurávit: iste Joseph, Herodiánam invídiam fúgiens, Christum in Ægýptum portávit. Ille dómino suo fidem servans, dóminæ nóluit commiscéri: iste Dóminam suam, Dómini sui matrem, vírginem agnóscens et ipse cóntinens, fidéliter custodívit. Illi data est intellegéntia in mystériis somniórum: isti datum est cónscium fíeri atque partícipem cæléstium sacramentórum.

        Ille fruménta servávit non sibi, sed omni pópulo: iste Panem vivum e cælo servándum accépit tam sibi quam toti mundo. Non est dúbium, quin bonus et fidélis homo fúerit iste Joseph, cui Mater desponsáta est Salvatóris. Fidélis, inquam, servus, et prudens, quem constítuit Dóminus suæ Matris solátium, suæ carnis nutrítium, solum dénique in terris magni consílii coadjutórem fidelíssimum.
      status: verified
