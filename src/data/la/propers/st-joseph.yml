# Verified against Divinum Officium (Monastic Tridentinum 1617) — read
# directly from the reference engine's own real-date output (2033-03-19, a
# year that date doesn't collide with a Sunday). Same convention as
# data/propers/temporal/*-collect.yml.
collect:
  text: |
    Orémus.
    Sanctíssimæ Genitrícis tuæ sponsi, quǽsumus, Dómine, méritis adjuvémur; ut quod possibílitas nostra non óbtinet, ejus nobis intercessióne donétur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (st-joseph-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-a-confessor (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-joseph-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Euge, serve bone et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, intra in gáudium Dómini tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Sanctíssimæ Genitrícis tuæ sponsi, quǽsumus, Dómine, méritis adjuvémur; ut quod possibílitas nostra non óbtinet, ejus nobis intercessióne donétur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# St. Joseph: proper Matins hymn, Latin/Sancti/03-19.txt's [Hymnus Matutinum]. English from English/Sancti/03-19.txt.
# Before this file the saint fell to the Common's hymn.
matins-hymn:
  text: |
    Cǽlitum Joseph, decus atque nostræ
    Certa spes vitæ, columénque mundi,
    Quas tibi læti cánimus, benígnus
    Súscipe laudes.

    Te Sator rerum státuit pudícæ
    Vírginis sponsum, voluítque Verbi
    Te patrem dici, dedit et minístrum
    Esse salútis.

    Tu Redemptórem stábulo jacéntem,
    Quem chorus Vatum cécinit futúrum,
    Aspicis gaudens, humilísque natum
    Numen adóras.

    Rex Deus regum, Dominátor orbis,
    Cujus ad nutum tremit inferórum
    Turba, cui pronus famulátur æther,
    Se tibi subdit.

    Laus sit excélsæ Tríadi perénnis,
    Quæ tibi præbens súperos honóres,
    Det tuis nobis méritis beátæ
    Gáudia vitæ.
    Amen.
  status: verified

# Read from web/www/horas/Latin/Sancti/03-19.txt's own [Invit] (no
# Monastic override exists) and its English counterpart.
matins-invitatory:
  text: Christum Dei Fílium, qui putári dignátus est fílius Joseph, * Veníte adorémus.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/03-19.txt's own [Capitulum
# Laudes] and English/Sancti/03-19.txt's own translation.
lauds-capitulum:
  text: Vir fidélis multum laudábitur. Et, qui custos est Dómini sui, glorificábitur.
  citation: Prov 28:20; 27:18
  status: verified

# Sourced from web/www/horas/Latin/Sancti/03-19.txt's own [Hymnus
# Laudes] and English/Sancti/03-19.txt's own translation.
lauds-hymn:
  text: |-
    Iste, quem læti cólimus, fidéles,
    Cujus excélsos cánimus triúmphos,
    Hac die Joseph méruit perénnis
    Gáudia vitæ.

    O nimis felix, nimis o beátus,
    Cujus extrémam vígiles ad horam
    Christus et Virgo simul astitérunt
    Ore seréno.

    Hinc stygis victor, láqueo solútus
    Carnis, ad sedes plácido sopóre
    Migrat ætérnas, rutilísque cingit
    Témpora sertis.

    Ergo regnántem flagitémus omnes,
    Adsit ut nobis, veniámque nostris
    Obtinens culpis, tríbuat supérnæ
    Múnera pacis.

    Sint tibi plausus, tibi sint honóres,
    Trine, qui regnas, Deus, et corónas
    Aureas servo tríbuis fidéli
    Omne per ævum. Amen.
  status: verified

