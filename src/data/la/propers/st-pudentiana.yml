# Matins Nocturn 2 reading for St. Pudentiana, Virgin (May 19, sharing
# the date with St. Peter Celestine — see st-peter-celestine.yml). No
# genuine SanctiM match: the only SanctiM file for this date,
# `SanctiM/05-19.txt`, bases `@Sancti/05-19` (Peter Celestine, not
# Pudentiana) — same "the shared plain file isn't necessarily yours"
# wrinkle as the pre-1955 pass (memory vu-matins-pre1955-saints); a
# missed pre-1955-pool candidate rather than a genuine SanctiM case
# (see memory vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/05-19o.txt, English/Sancti/05-19o.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Pudentiana virgo, Pudentis Romani filia, parentibus orbata, cum admirabili pietate christianam religionem coleret, una cum sorore Praxede pecuniam ex vendito patrimonio redactam pauperibus distribuit, seque jejuniis et orationibus dedit. Cujus étiam opera, tota ejus familia, in qua erant nonaginta sex homines, a Pio Pontifice baptizata est. Quod autem ab Antonino imperatore sancitum erat, ne Christiani publice sacrificia facerent, Pius Pontifex in sedibus Pudentianæ cum Christianis sacra celebrabat. Quibus illa benigne acceptis, quæ ad vitam necessaria essent, suppeditabat. Itaque in his christianæ pietatis officiis migravit e vita, et in sepulcro patris ad cemeterium Priscillæ via Salaria sepulta est, decimo quarto Kalendas Junii.
      status: verified
