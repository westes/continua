# Read from the reference engine: web/www/horas/Latin/Sancti/05-26.txt [Oratio];
# English from English/Sancti/05-26.txt.
collect:
  text: |
    Orémus.
    Deus, qui beátum Philíppum Confessórem tuum Sanctórum tuórum glória sublimásti: concéde propítius; ut, cujus solemnitáte lætámur, ejus virtútum proficiámus exémplo.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-a-confessor; collect is the saint's own (collect-st-philip-neri.yml). Not
# independently live-verified for this category, so marked draft.
commemoration:
  text: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, intra in gáudium Dómini tui.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui beátum Philíppum Confessórem tuum Sanctórum tuórum glória sublimásti: concéde propítius; ut, cujus solemnitáte lætámur, ejus virtútum proficiámus exémplo.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. Philip Neri, Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/05-26.txt, English/Sancti/05-26.txt.
# Lectio4-6 combined into one reading, one continuous vita.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Philippus Nerius, piis honestisque paréntibus Floréntiæ natus, ab ipsa ineunte ætate non obscura dedit futuræ sanctitátis indicia. Adoléscens, ampla patrui hereditáte dimissa, Romam se contulit; ubi philosophía ac sacris litteris eruditus, totum se Christo dicávit. Ea fuit abstinéntia, ut sæpe jejunus triduum permanserit. Vigiliis et oratiónibus intentus, septem Urbis Ecclésias frequenter visitans, apud cœmetérium Callísti in cæléstium rerum contemplatióne pernoctare consuevit. Sacerdos ex obediéntia factus, in animárum salúte procuranda totus fuit; et in confessiónibus audiéndis ad extremum usque diem perseverans, innumeros penne fílios Christo péperit; quos verbi Dei quotidiáno pabulo, sacramentórum frequéntia, oratiónis assiduitate, aliisque piis exercitatiónibus enutriri cupiens, Oratórii congregatiónem instituit.

        Caritate Dei vulnerátus languebat jugiter, tantoque cor ejus æstuábat ardore, ut, cum intra fines suos contineri non posset, illíus sinum, confractis atque elátis duabus cóstulis, mirabíliter Dóminus ampliaverit. Sacrum vero fáciens aut ferventius orans, in áëra quandoque sublatus, mira undique luce fulgere visus fuit. Egenos et páuperes omni caritátis officio prosequebátur: dignus, qui et Angelo in spécie páuperis eleemosynam erogaret; et, dum egéntibus noctu panem deferret, in fóveam lapsus, inde páriter ab Angelo incolumis eriperétur. Humilitáti addictus, ab honóribus semper abhorruit, atque ecclesiásticas dignitates, étiam primárias, non semel ultro delatas, constantíssime recusávit.

        Prophetíæ dono fuit illustris, et in animórum sensibus penetrandis mirifice enituit. Virginitátem perpetuo illibatam servávit; idque assecutus est, ut eos qui puritátem cólerent, ex odore, qui vero secus, ex fœtóre dignosceret. Abséntibus interdum appáruit, iisque periclitántibus opem tulit. Ægrotos plurimos et morti próximos sanitáti restituit. Mortuum quoque ad vitam revocávit. Cælestium spirituum et ipsíus Deiparæ Vírginis frequenter fuit apparitióne dignátus, ac plurimórum ánimas splendore circumfusas in cælum conscéndere vidit. Denique, anno salútis millesimo quingentésimo nonagesimo quinto, octavo Kalendas Junias, in quem diem inciderat festum Corporis Christi, Sacro maxima spíritus exsultatióne peracto, ceterisque functiónibus expletis, post mediam noctem, qua prædixerat hora, octogenarius obdormívit in Dómino. Quem Gregórius décimus quintus, miraculis clarum, in Sanctórum númerum rétulit.
      status: verified
