# Matins Nocturn 2 reading for St. Paschal I, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/05-14-PaschalisI.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Paschális hujus nóminis primus, bíduo post Stéphani quinti óbitum vix exacto, communibus cleri suffragiis, ad suprémum Sedis apostólicæ ápicem, invítus licet et valde relúctans, anno Dómini nostri Jesu Christi octingentésimo décimo séptimo promótus est. Vir sane omnigena doctrína, sacra præsértim instructissimus, vitæ sanctimónia insígnis, dicendi facultáte claríssimus, singulári dénique pietáte in Deum et caritáte in próximum, ut exteriora bona hilari semper ánimo paupéribus erogabat, ita interioris ánimi opes, vigíliis, oratiónibus et jejúniis vacans, accumulabat.

        A puerítia in Lateranensis ecclésiæ patriarchio, sub óculis Pontíficum, educátus, ita in omni virtútum génere, lítteris et disciplína ecclesiástica profécit, ut primum sacris ordínibus initiátus, mox ejus virtúte perspecta, a Leóne tértio monastério sancti Stéphani præféctus fúerit; in quo et subditis sibi mónachis exémplo fuit, et peregrinos ad límina Apostolórum turmatim accedentes ita excépit, ut ómnibus necessaria suppeditaret, iisque, Christum imitatus, abjecta étiam exhibéret ministéria; quibus pietátis et caritátis offíciis dignissimus omnium habitus est, qui Domínico gregi et toti Ecclésiæ præesset.

        Nihil porro in eo desideratum est, quod ad perféctam regíminis Apóstolici sollicitúdinem pertineret; ecclésiæ Occidentalis disciplínam, quæ sub eo máxime flóruit, intáctam servávit; Orientalem vero, ab imperatóre et patriárcha iconomachis agitatam, lítteris et legatióne recreavit, et Græcis Romam confugientibus, monastérium sanctæ Praxedis, amplissimis reditibus a se instrúctum benígne concéssit. Multa étiam córpora sanctórum ex cœmeteriis, Pauli primi exémplo, ac præsértim sanctæ Cæcíliæ, ipsa monstrante et revelante, in Urbem intulit. Nova templa excitávit, restauravit, et mirífice ornávit antíqua. Xenodochia, et sacrórum vírginum cœnobia, novo censu recreavit. Exstincti demum incendii miráculo claríssimus, migrávit ad Dóminum octávo sui pontificátus anno, et in Vaticána basílica cónditus est.
      status: verified
