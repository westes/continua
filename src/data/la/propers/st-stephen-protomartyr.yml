# Matins Nocturn 2-3 readings for St. Stephen, Protomartyr (Dec 26) —
# SanctiM/12-26.txt inherits the whole day (`@Sancti/12-26`) with no
# Nocturn 2/3 override, so this feast's own proper content is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/12-26.txt, English/Sancti/12-26.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, St. Fulgentius's
# sermon contrasting yesterday's Nativity with today's martyrdom — one
# continuous piece, no genuine source break.
# Nocturn 3: Lectio7's Gospel citation (Matt 23:34-39) was a bare
# incipit ("Et réliqua") with no full pericope text given; the full
# pericope is now authored too (isGospel: true, immediately before the
# homily) — sourced from `web/www/missa/Latin/Sancti/08-03.txt` (Dec
# 26's own Missale [Evangelium] is `@Sancti/08-03`),
# English/Sancti/08-03.txt (2026-09-05 update). The homily portion
# remains St. Jerome's commentary (Lectio7's homily + Lectio8-9
# combined, one continuous piece on "Zacharias son of Barachias").
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Fulgentius of Ruspe, Sermon 3 on St. Stephen
      text: |-
        Heri celebrávimus temporálem sempitérni Regis nostri natálem: hódie celebrámus triumphálem mílitis passiónem. Heri enim Rex noster trábea carnis indútus, de aula úteri virginális egrédiens, visitáre dignátus est mundum: hódie miles de tabernáculo córporis éxiens, triumphátor migrávit ad cælum. Ille, sempitérnæ Deitátis majestáte serváta, servíle cinctórium carnis assúmens, in hujus sǽculi campum pugnatúrus intrávit; iste, depósitis corruptibílibus córporis induméntis, ad cæli palátium perénniter regnatúrus ascéndit. Ille descéndit carne velátus, iste ascéndit sánguine laureátus.

        Ascéndit iste lapidántibus Judǽis, quia ille descéndit lætántibus Angelis. Glória in excélsis Deo, heri sancti Angeli exsultántes cantavérunt: hódie Stéphanum lætántes in suum consórtium suscepérunt. Heri Dóminus exívit de útero Vírginis: hódie miles egréssus est de ergástulo carnis. Heri Christus pro nobis pannis est involútus: hódie Stéphanus stola est ab eo immortalitátis indútus. Heri præsépis angústia Christum portávit infántem: hódie imménsitas cæli suscépit Stéphanum triumphántem. Solus Dóminus descéndit, ut multos eleváret: humiliávit se Rex noster, ut suos mílites exaltáret.

        Necessárium tamen nobis est, fratres, agnóscere, quibus armis præcínctus Stéphanus sævítiam Judæórum pótuit superáre, ut ita meruísset felíciter triumpháre. Stéphanus ergo, ut nóminis sui corónam meruísset accípere, caritátem pro armis habébat, et per ipsam ubíque vincébat. Per caritátem Dei sæviéntibus Judǽis non cessit: per caritátem próximi pro lapidántibus intercéssit. Per caritátem arguébat errántes, ut corrigeréntur: per caritátem pro lapidántibus orábat, ne puniréntur. Caritátis virtúte subníxus, vicit Saulum crudéliter sæviéntem; et quem hábuit in terra persecutórem, in cælo méruit habére consórtem.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 23:34-39
      text: 'In illo témpore: Dicébat Jesus scribis et pharisǽis: Ecce, ego mitto ad vos prophétas, et sapiéntes, et scribas, et ex illis occidétis et crucifigétis, et ex eis flagellábitis in synagógis vestris, et persequémini de civitáte in civitátem: ut véniat super vos omnis sanguis justus, qui effúsus est super terram, a sánguine Abel justi usque ad sánguinem Zacharíæ, fílii Barachíæ, quem occidístis inter templum et altáre. Amen, dico vobis, vénient hæc ómnia super generatiónem istam. Jerúsalem, Jerúsalem, quæ occídis prophétas, et lápidas eos, qui ad te missi sunt, quóties vólui congregáre fílios tuos, quemádmodum gallína cóngregat pullos suos sub alas, et noluísti? Ecce, relinquétur vobis domus vestra desérta. Dico enim vobis, non me vidébitis ámodo, donec dicátis: Benedíctus, qui venit in nómine Dómini.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Commentary on Matthew, Book IV, on Matt 23:34-39
      text: |-
        Hoc quod ántea dixerámus, Impléte mensúram patrum vestrórum; ad persónam Dómini pertinére, eo quod occidéndus esset ab eis, potest et ad discípulos ejus reférri, de quibus nunc dicit: Ecce ego mitto ad vos prophétas, et sapiéntes, et scribas. Simúlque obsérva, juxta Apóstolum scribéntem ad Corínthios, vária esse dona discipulórum Christi; álios prophétas, qui ventúra prædícent; álios sapiéntes, qui novérunt quando débeant proférre sermónem; álios scribas in lege doctíssimos, ex quibus lapidátus est Stéphanus, Paulus occísus, crucifíxus Petrus, flagelláti in Actibus Apostolórum discípuli.

        Quǽrimus, quis iste sit Zacharías fílius Barachíæ: quia multos légimus Zacharías. Et ne líbera nobis tribuerétur erróris facúltas, ádditum est: Quem occidístis inter templum et altáre. In divérsis divérsa legi: et débeo singulórum opiniónes pónere. Alii Zacharíam fílium Barachíæ dicunt, qui in duódecim prophétis undécimus est, patrísque in eo nomen conséntit: sed ubi occísus sit inter templum et altáre, Scriptúra non lóquitur; máxime cum tempóribus ejus vix ruínæ templi fúerint. Alii Zacharíam patrem Joánnis intellégi volunt, ex quibúsdam apocryphórum sómniis approbántes, quod proptérea occísus sit, quia Salvatóris prædicáverit advéntum.

        Alii istum volunt esse Zacharíam, qui occísus est a Joas rege Judæ inter templum et altáre, sicut Regum narrat história. Sed observándum, quod ille Zacharías non sit fílius Barachíæ, sed fílius Jójadæ sacerdótis: unde et Scriptúra refert: Non fuit recordátus Joas patris ejus Jójadæ, quia sibi fecísset bona. Cum ergo et Zacharíam teneámus et occisiónis conséntiat locus: quǽrimus, quare Barachíæ dicátur fílius, et non Jójadæ? Barachía lingua nostra Benedíctus Dómini dícitur, et sacerdótis Jójadæ justítia Hebrǽo nómine demonstrátur. In Evangélio, quo utúntur Nazaréni, pro fílio Barachíæ, fílium Jójadæ reperímus scriptum.
      status: verified

# Sourced directly from the raw reference files (web/www/horas/Latin+English/
# Sancti/01-02.txt) -- day 8, "In Octava," St. Stephen's own octave closing
# day. Unlike the full graduated 8-day octaves (Assumption, Lawrence, etc.),
# this Christmas-week octave's own intervening days (2-7, Dec 27-31) turn
# out to carry NO Lectio override at all in the source -- every suffix file
# checked at those dates (`12-27o`, `12-28o`/`12-28r`, `12-29o`/`12-29r`,
# `12-31o`/`12-31r`; Dec 30 has no suffix file whatsoever) is a bare
# `@Sancti/MM-DD` alias with no `[LectioN]` content of its own, correctly
# left unauthored -- same "vide-only, not a gap" pattern as the fixed-date
# octaves audited earlier (see memory vu-octave-readings-by-date). Only the
# closing day carries real content: St. Augustine's own sermon on Stephen
# (Lectio4-6) + St. Jerome's homily on Matt 23:34-35 (Lectio7-9, bare
# incipit dropped).
# Responsory missing from this file -- authoring gap, not a design choice
# (same class as nativity-bvm-octave-day-3.yml's own fix). Reuses St.
# Stephen's own Responsory1 (Sancti/12-26.txt), the octave's one well-known
# opening responsory, matching the convention already established for the
# Nativity-BVM octave (every combined-lesson octave-day file there reuses
# that feast's own Responsory1 regardless of which specific historical
# Lectio number the combined text corresponds to).
octave-readings/~-octave-day-8:
  source: Sermo sancti Augustíni Epíscopi; Homilía sancti Hierónymi Presbýteri
  text: |
    Post hestérnum festivíssimum diem, quo Salvatóris nostri Christi nobis Natívitas illúxit, étiam hodiérnus dies beáti Mártyris Stéphani coróna illustrátur. Mártyris illíus mérita nulla pars orbis ignórat: passus enim est in ipso princípio Ecclésiæ, id est, in ipsa urbe Jerosólyma. Ibi enim Diáconus ministrávit: et in ipso juventútis flore decórem ætátis suæ sánguine purpurávit. Pássio ejus insígnis est, multúmque mirábilis. Hanc modo de libro Actuum Apostolórum, cum legerétur, non solum audívimus, sed étiam óculis spectávimus.

    Christus ergo caput Mártyrum prior passus est pro nobis, relínquens vobis exémplum, ut sequámini vestígia ejus. Cujus passiónis vestígia prosecútus beatíssimus Stéphanus, confiténdo Christum lapidátus a Judǽis, corónam méruit tamquam suo sibi nómine pósitam. Stéphanus enim Græce, Latíne coróna appellátur. Jam coróna nomen habébat, et ídeo palmam martýrii suo nómine præferébat.

    Qui cum lapidarétur, non solum non exspectábat de persecutóribus reportáre vindíctam, sed eis pótius a Deo véniam postulábat. Memínerat enim dixísse Dóminum: Mihi vindíctam, ego retríbuam, dicit Dóminus. Et íterum: Ne díxeris, Ulcíscar me de inimícis meis; sed exspécta Dóminum, ut tibi auxílio sit. Exspectáre nos jubet Dóminus Deus, ut in die futúræ retributiónis cum sanctis Martýribus vindicémur.

    Jerúsalem, Jerúsalem, quæ occídis prophétas. Jerúsalem, non saxa et ædifícia civitátis, sed habitatóres vocat: quam plangit patris afféctu, sicut et in álio loco légimus, quod videns eam, fléverit. In eo autem quod dicit: Quóties vólui congregáre fílios tuos: omnes retro prophétas a se missos esse testátur. Gallínæ quoque similitúdinem congregántis sub alas pullos suos, in cántico Deuteronómii légimus: Sicut áquila prótegit nidum suum, et super pullos suos desiderávit: expándens alas suas, suscépit eos, et tulit super pennas suas.

    Ecce relinquétur vobis domus vestra desérta. Hoc ipsum ex persóna Jeremíæ jam ante díxerat: Relíqui domum meam, dimísi hereditátem meam: facta est mihi heréditas mea quasi spelúnca hyǽnæ. Desértam Judæórum domum, id est, templum illud, quod fulgébat augústius, óculis comprobámus, quia habitatórem Christum pérdidit, et hereditátem prærípere géstiens, occídit herédem.

    Dico enim vobis: Non me vidébitis ámodo, donec dicátis: Benedíctus qui venit in nómine Dómini. Ad Jerúsalem lóquitur, et ad pópulum Judæórum. Versículum autem istum, quo et párvuli atque lacténtes in ingréssu Jerúsalem Dómini Salvatóris usi sunt, quando dixérunt: Benedíctus qui venit in nómine Dómini, hosánna in excélsis, sumpsit de centésimo décimo séptimo Psalmo, qui maniféste de advéntu Dómini scriptus est.
