# Verified against Divinum Officium (Monastic Tridentinum 1617) — read
# directly from the reference engine's own real-date output (2025-12-26).
# Nearly identical wording to finding-of-st-stephen-collect.yml (Aug 3,
# which cross-references this feast's text with one word substituted) --
# this is that substitution's own source text, given here in full rather
# than as a reference, per this project's one-file-per-id convention.
collect:
  text: |
    Orémus.
    Da nobis, quǽsumus, Dómine, imitári quod cólimus: ut discámus et inimícos dilígere; quia ejus natalícia celebrámus, qui novit étiam pro persecutóribus exoráre Dóminum nostrum Jesum Christum Fílium tuum:
    Qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

