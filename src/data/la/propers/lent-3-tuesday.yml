# Lauds collect ([Oratio 2] in the source) — read from
# web/www/horas/{Latin,English}/Tempora/Quad3-2.txt.
collect:
  text: |
    Orémus.
    Exáudi nos, omnípotens et miséricors Deus: et continéntiæ salutáris propítius nobis dona concéde.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Vespers collect ([Oratio 3] in the source), distinct from Lauds' own —
# read from web/www/horas/{Latin,English}/Tempora/Quad3-2.txt.
collect/~-vespers:
  text: |
    Orémus.
    Tua nos, Dómine, protectióne defénde: et ab omni semper iniquitáte custódi.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

