# Matins Nocturn 2-3 readings for St. Gabriel of Our Lady of Sorrows,
# Confessor (Feb 27). Sourced directly from
# web/www/horas/Latin/Sancti/02-27.txt, English/Sancti/02-27.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3: Lectio7's Gospel citation (Mark 10:13-21) is a bare
# incipit ("Et réliqua") in the horas file, but this same feast's own
# Missale Evangelium (web/www/missa/Latin+English/Sancti/02-27.txt)
# carries the full pericope verbatim, so it is authored in full below
# (isGospel: true, immediately before the homily), the Venerable Bede's
# homily (Lectio7's homily + Lectio8-9 combined).
#
# Update (2026-09-05): the Gospel pericope itself is now authored
# (previously left unauthored per the "bare incipit, skip it"
# convention) — sourced from the day's own Missale Gospel above, not
# guessed at.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Gabriel, Assisii in Umbria, honesto genere natus, et Franciscus ob seráphici civis memóriam vocatus, egregiam animi índolem a púero osténdit. Adoléscens, cum Spoleti litteris operam daret, inani sæculi spécie et pompa aliquantulum állici visus est. Sed miserentis Dei munere, qui eum ad perfectiónem christianæ vitæ jamdúdum invitabat, cum in morbum incidísset, sæculi vanitátem fastidire cœpit, atque immortalia dumtáxat bona appétere. Quo autem citius Deo vocanti obtemperaret, factum est, ut insignem illam beatíssimæ Vírginis Icónem, solemni pompa extra Spoletinæ ecclésiæ septa delatam intúitus, divini amoris flammam conciperet, simulque Institutum Clericórum a Passióne Jesu amplecti statúeret. Itaque non exíguas difficultates eluctatus, in recessu Morrovallénsi, lúgubrem vestem lætus induit, et Gabriel a Vírgine perdolénte maluit appellári; ad ejusdem gaudiórum et dolórum memóriam perpetuo recoléndam.

        In tirocinio, cum regulari observántia et ómnium exercitatióne virtútum cotidie magis eminéret, brevi eo pérvenit, ut absolutæ sanctimoniæ exemplar haberétur non modo a sodálibus, vel provectis, sed étiam ultra cœnobii septa, factus bonus odor Christi in omni loco. Dominicæ passiónis cultor assiduus, in ea meditanda dies noctesque insumebat. In divinam Eucharistiam, quæ ejusdem Passiónis memóriam prodit, incredibili quodam studio ferebátur; qua cum se refíceret, seraphico ardore flagrábat. Nihil autem insígnius quam ejus erga magnam Dei Parentem pietas fuit. Ipsam omni obsequii genere percólere consuevit; sed præsertim confectam afflictámque cruciátibus Jesu tam dolenter contemplari, ut vim lacrimárum profúnderet. Pérdolens Virgo quasi tota ei vitæ rátio fuit, adeptæque ab eo sanctitátis magistra; ita ut inter æquales una fúerit senténtia, ideo excitátum Dei famulum divinitus fuísse, ut cultus Maríæ perdolentis magnum exemplo ejus cáperet increméntum.

        Inter ceteras virtútes christianam humilitátem et obœdiéntiam maxime diléxit: nam inter omnes se minimum exístimans, abjectíssima quæque ministeria domus cupide affectabat, et antistitum suórum non modo jussa, sed et optáta diligentíssime perficiebat. Idem, refrenátis sensibus et vitæ asperitáte usus, illibátum retinuit florem virginitátis ac plane mundo crucifixus unice Deo vixit, intima Dómini sui fruítus consuetúdine. Ita brevem vitæ cursum tot virtútibus nobilitátum conficiens, Insulæ in Aprutio, caritátis incendio verius quam vi morbi consumptus, divinæque Matris ope recreatus, placidíssimo éxitu ad Superos evolávit, anno millesimo octingentésimo sexagesimo secundo, ætátis suæ vigesimo quarto. Eum deinceps, a Deo miraculis illustrátum, Pius Papa décimus Cælitum beatórum número accensuit. Benedíctus vero décimus quintus, Pontifex maximus, anno millesimo nongentésimo vigesimo, post cónditum Institutum a Passióne ducentésimo, in solemnitate Ascensiónis Dómini, beato júveni Sanctórum honores decrevit; et Pius undecimus ejus Offícium et Missam ad universam Ecclésiam extendit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Marc 10:13-21
      text: 'In illo témpore: Offerébant Jesu parvulos, ut tángeret illos. Discípuli autem comminabántur offeréntibus. Quos cum vidéret Jesus, indígne tulit et ait illis: Sinite párvulos veníre ad me, et ne prohibuéritis eos: tálium enim est regnum Dei. Amen, dico vobis: Quisquis non recéperit regnum Dei velut párvulus, non intrábit in illud. Et compléxans eos et impónens manus super illos, benedicébat eos. Et cum egréssus esset in viam, procúrrens quidam genu flexo ante eum, rogábat eum: Magíster bone, quid fáciam, ut vitam ætérnam percípiam? Jesus autem dixit ei: Quid me dicis bonum? Nemo bonus, nisi unus Deus. Præcépta nosti: Ne adúlteris, Ne occídas, Ne furóris, Ne falsum testimónium díxeris, Ne fraudem féceris, Hónora patrem tuum et matrem. At ille respóndens, ait illi: Magíster, hæc ómnia observávi a juventúte mea. Jesus autem intúitus eum, diléxit eum et dixit ei: Unum tibi deest: vade, quæcúmque habes, vende et da paupéribus, et habébis thesáurum in cœlo: et veni, séquere me.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: The Venerable Bede, Commentary on Mark (on Mark 10:13-21)
      text: |-
        Ait discípulis Jesus: Sínite párvulos veníre ad me, et ne prohibuéritis eos; talium enim est regnum Dei. Significanter dixit: Talium est; non: Istórum; ut osténderet, non ætátem regnare, sed mores; et his, qui similem haberent innocéntiam et simplicitátem, præmium repromitti: Apóstolo quoque in eandem senténtiam congruénte: Fratres, nolíte fíeri púeri sensibus; sed malítia párvuli estote, sensu autem ut perfecti sitis. Amen, dico vobis: quisquis non recéperit regnum Dei velut párvulus, non intrábit in illud. Sicut puer non persevérat in iracúndia, non læsus méminit, non videns pulchram mulierem delectátur, non aliud cogitat, aliud lóquitur; sic et vos, nisi talem habuéritis innocéntiam et animi puritátem, regnum cælórum non poteritis intrare. Aliter, regnum Dei, id est doctrinam Evangélii, sicut párvuli accípere jubemur; quia quómodo párvulus in discéndo non contradicit doctóribus neque ratiónes et verba componit advérsum eos resistens, sed fideliter suscipit quod docétur et cum metu obtemperat et quiescit; ita et nos, in obœdiéndo simpliciter et sine ulla rectractatióne verbis Dómini, fácere debemus. Et complexans eos, et impónens manus super illos, benedicebat eos. Complexus benedicit párvulos, ut húmiles spíritu sua benedictióne, grátia et dilectióne dignos esse significet.

        Et, cum egréssus esset in viam, procurrens quidam, genu flexo ante eum, rogábat eum: Magister bone, quid fáciam, ut vitam ætérnam percipiam? Audierat, credo, iste quæsítor vitæ ætérnæ a Dómino, tantum eos, qui parvulórum velint esse similes, dignos esse introítu regni cæléstis: atque ideo curam gerens tractátus certioris, poscit sibi non per parábolas, sed aperte, quibus óperum meritis vitam ætérnam cónsequi possit, exponi. Jesus autem dixit ei: Præcepta nosti. Hæc est puerílis innocéntiæ castitas, quæ nobis imitanda propónitur, si regnum Dei volumus intrare. At ille respondens, ait ille: Magister, hæc ómnia observávi a juventúte mea. Non est putandus homo iste vel voto tentántis (ut quidam putavére) Dóminum interrogasse, vel de sua esse vita mentitus, cum se legis mandáta custodisse dicebat; sed, simpliciter, ut víxerit esse conféssus. Quia si mendacii aut simulatiónis noxa reus tenerétur, nequáquam intuitus arcana cordis ejus, eum diligere dicerétur Jesus.

        Díligit enim Dóminus eos, qui mandáta legis, quamvis minora, custódiunt: sed nihilóminus, quod in lege minus fuerat, iis qui perfecti esse desiderant, osténdit, quia non venit solvere legem aut Prophétas, sed adimplere. Ad quam profecto adimpletiónem pertinet, quod hic consequenter adjungitur: Vade, quæcúmque habes vende et da paupéribus, et habebis thesáurum in cælo, et veni, séquere me. Quicúmque perfectus esse volúerit, debet vendere quæ habet; et non ex parte véndere, sicut Ananías et Saphira, sed totum véndere: et cum vendiderit, dare omne paupéribus, et sic sibi præparáre thesáurum in regno cælórum. Nec hoc ad perfectiónem sufficit, nisi, post contemptas divítias, Salvatórem sequátur; id est relictis malis, fáciat bona. Facílius enim sæculum contemnitur quam volúntas. Multi divítias relinquéntes, Dóminum non sequúntur. Sequitur autem Dóminum, qui imitator ejus est et per vestígia illíus graditur. Qui enim dicit se in Christo credere, debet, quómodo ille ambulávit, et ipse ambuláre.
      status: verified
