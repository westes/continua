# Read directly from web/www/horas/Latin/Sancti/01-29.txt's own [Oratio]
# and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui ad animárum salútem beátum Francíscum Confessórem tuum atque Pontíficem
    ómnibus ómnia factum esse voluísti: concéde propítius; ut caritátis tuæ dulcédine
    perfúsi, ejus dirigéntibus mónitis ac suffragántibus méritis, ætérna gáudia consequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-confessor-bishop (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). st-francis-de-sales has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-francis-de-sales-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui ad animárum salútem beátum Francíscum Confessórem tuum atque Pontíficem
    ómnibus ómnia factum esse voluísti: concéde propítius; ut caritátis tuæ dulcédine
    perfúsi, ejus dirigéntibus mónitis ac suffragántibus méritis, ætérna gáudia consequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. Francis de Sales, Bishop, Confessor,
# Doctor of the Church (Jan 29). Sourced directly from
# web/www/horas/Latin/Sancti/01-29.txt, English/Sancti/01-29.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No Lectio7-9 in the source at all (a 6-lesson, not
# 9-lesson, office for this feast).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Franciscus in oppido Salesio, unde famíliæ cognomen, piis et nobílibus paréntibus natus, a téneris annis futuræ sanctitátis indícia præbuit, morum innocéntia et gravitáte. Adoléscens liberálibus disciplinis eruditus, mox philosophíæ ac theologíæ Parisiis operam dedit; et, ne quid sibi deésset ad animi culturam, juris utriusque lauream summa cum laude Patavii obtinuit. In sacra æde Lauretana perpetuæ virginitátis votum, quo pridem Parisiis se obstrinxerat, innovávit; a cujus virtútis proposito nullis umquam dæmonum fraudibus, nullis sensuum illécebris pótuit dimoveri.

        Recusáta in Sabáudiæ senatu amplíssima dignitate, clericali milítiæ nomen dedit. Tum sacerdotio initiátus et Genevénsis ecclésiæ præposituram adeptus, ejus muneris partes adeo perfecte explevit, ut eum Granerius epíscopus vindicándis ab hæresi Calviniana Chaballicensibus aliisque Genevæ finitimis pópulis, divini verbi præcónem destinarit. Quam expeditiónem álacri animo suscípiens, asperrima quæque perpéssus est, sæpe ab hæréticis conquisítus ad necem, variisque calumniis et insídiis vexatus. Sed inter tot discrímina et agones, insuperábilis ejus constántia semper enituit; Deique ope protectus, septuagínta duo míllia hæreticórum ad catholicam fidem reduxísse dícitur, inter quos multi nobilitate et doctrina insignes numerántur.

        Mortuo Granerio, qui eum sibi coadjutórem decerni curáverat, epíscopus consecratus, sanctitátis suæ radios circumquaque diffudit, zelo ecclesiásticæ disciplinæ, pacis studio, misericórdia in páuperes, omnique virtúte conspicuus. Ad divini cultus augméntum novum ordinem sanctimoniálium instituit, a Visitatióne beátæ Vírginis nuncupátum, sub regula sancti Augustíni; cui addidit constitutiónes sapiéntia, discretióne et suavitáte mirábiles. Suis étiam scriptis cælésti doctrina refertis Ecclésiam illustrávit, quibus iter ad christianam perfectiónem tutum et planum demonstrat. Annum denique agens quinquagesimum quintum, dum e Gállia Annesium regréditur, post Sacrum in die sancti Joánnis Evangelistæ Lugduni celebrátum, gravi morbo correptus, sequénti die migrávit in cælum, anno Dómini millesimo sexcentésimo vigesimo secundo. Ejus corpus Annesium delátum, in ecclésia moniálium dicti ordinis honorifice cónditum fuit, cœpitque statis miraculis claréscere. Quibus rite probátis, ab Alexandro septimo Pontifice máximo in Sanctórum númerum relátus est, assignáta ejus festivitáti die vigesima nona Januarii; et a summo Pontifice Pio nono, ex sacrórum Rituum Congregatiónis consulto, universalis Ecclésiæ Doctor fuit declaratus.
      status: verified
