  status: verified

# New file, 2026-09-15: closes the seasonal-variant gap
# `prime-lectio-per-annum.yml`'s own header already flagged, wrongly
# attributed to "milestone 4" (that blocker was stale -- see the dated
# TODO.md entry this sweep came out of; calendar/temporal.ts's resolveSeason
# has been a complete, real implementation for a while). Sourced directly
# from web/www/horas/Latin/Psalterium/Special/Prima Special.txt's own [Quad5]
