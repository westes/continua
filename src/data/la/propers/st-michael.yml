# Matins Nocturn 2-3 readings for the Dedication of St. Michael the
# Archangel (Sep 29) — SanctiM/09-29.txt's own structure borrows from
# `SanctiM/05-08` (St. Michael's own May 8 Apparition file) but its
# Officium and Lectio5-12 resolve back to `@Sancti/09-29:LectioN`
# (resliced), so this feast's own proper content is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/09-29.txt, English/Sancti/09-29.txt.
#
# Nocturn 2: Lectio4-6 (Pope St. Gregory the Great's homily on the
# nine choirs of Angels) combined into one reading, one continuous
# excerpt.
# Nocturn 3: Lectio7's Gospel citation (Matt 18:1-10) was a bare
# incipit ("Et réliqua") with no full pericope text given; the full
# pericope is now authored too (isGospel: true, immediately before the
# homily) — sourced from `web/www/missa/Latin/Sancti/05-08.txt` (Sep
# 29's own Missale [Evangelium] is `@Sancti/05-08`, St. Michael's own
# May Apparition Gospel reused), English/Sancti/05-08.txt (2026-09-05
# update). The homily portion remains combined with Lectio8-9 as one
# continuous excerpt of St. Jerome's commentary. No responsory given
# for either reading.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope St. Gregory the Great, Homily 34 on the Gospels
      text: |-
        Novem Angelórum órdines dícimus, quia vidélicet esse, testánte sacro elóquio, scimus: Angelos, Archángelos, Virtútes, Potestátes, Principátus, Dominatiónes, Thronos, Chérubim atque Séraphim. Esse namque Angelos et Archángelos pene omnes sacri elóquii páginæ testántur. Chérubim vero atque Séraphim sæpe, ut notum est, libri prophetárum loquúntur. Quátuor quoque órdinum nómina Paulus Apóstolus ad Ephésios enúmerat, dicens: Supra omnem Principátum, et Potestátem, et Virtútem, et Dominatiónem. Qui rursus ad Colossénses scribens, ait: Sive Throni, sive Potestátes, sive Principátus, sive Dominatiónes. Dum ergo illis quátuor, quæ ad Ephésios dixit, conjungúntur Throni, quinque sunt órdines; quibus dum Angeli et Archángeli, Chérubim atque Séraphim adjúncta sunt, procul dúbio novem esse Angelórum órdines inveniúntur.

        Sciéndum vero quod Angelórum vocábulum nomen est offícii, non natúræ. Nam sancti illi cæléstis pátriæ Spíritus, semper quidem sunt Spíritus, sed semper vocári Angeli nequáquam possunt; quia tunc solum sunt Angeli, cum per eos áliqua nuntiántur. Unde et per Psalmístam dícitur: Qui facit Angelos suos spíritus; ac si paténter dicat: Qui eos, quos semper habet Spíritus, étiam, cum volúerit, Angelos facit. Hi autem qui mínima núntiant, Angeli; qui vero summa annúntiant, Archángeli vocántur. Hinc est enim quod ad Maríam Vírginem non quílibet Angelus, sed Gábriel Archángelus míttitur. Ad hoc quippe ministérium, summum Angelum veníre dignum fúerat, qui summum ómnium nuntiábat. Qui idcírco étiam privátis nomínibus censéntur, ut signétur per vocábula, étiam in operatióne quid váleant. Míchaël namque, Quis ut Deus? Gábriel autem, Fortitúdo Dei; Ráphaël vero dícitur Medicína Dei.

        Et quóties miræ virtútis áliquid ágitur, Míchaël mitti perhibétur; ut ex ipso actu et nómine detur intéllegi quia nullus potest fácere, quod fácere prǽvalet Deus. Unde et ille antíquus hostis, qui Deo esse per supérbiam símilis concupívit, dicens: In cælum conscéndam, super astra cæli exaltábo sólium meum, símilis ero Altíssimo; dum in fine mundi in sua virtúte relinquétur extrémo supplício periméndus, cum Michaéle Archángelo præliatúrus esse perhibétur, sicut per Joánnem dícitur: Factum est prǽlium cum Michaéle Archángelo. Ad Maríam quoque Gábriel míttitur, qui Dei Fortitúdo nominátur; illum quippe nuntiáre veniébat, qui ad debellándas aéreas potestátes húmilis appárere dignátus est. Ráphaël quoque interpretátur, ut díximus, Medicína Dei; quia vidélicet, dum Tobíæ óculos quasi per offícium curatiónis tétigit, cæcitátis ejus ténebras tersit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 18:1-10
      text: 'In illo témpore: Accessérunt discípuli ad Jesum, dicéntes: Quis, putas, major est in regno cœlórum? Et ádvocans Jesus párvulum, státuit eum in médio eórum et dixit: Amen, dico vobis, nisi convérsi fuéritis et efficiámini sicut párvuli, non intrábitis in regnum cœlórum. Quicúmque ergo humiliáverit se sicut párvulus iste, hic est major in regno cœlórum. Et qui suscéperit unum párvulum talem in nómine meo, me súscipit. Qui autem scandalizáverit unum de pusíllis istis, qui in me credunt, expédit ei, ut suspendátur mola asinária in collo ejus, et demergátur in profúndum maris. Væ mundo a scándalis! Necésse est enim, ut véniant scándala: verúmtamen væ hómini illi, per quem scándalum venit! Si autem manus tua vel pes tuus scandalízat te, abscíde eum et projíce abs te: bonum tibi est ad vitam ingrédi débilem vel claudum, quam duas manus vel duos pedes habéntem mitti in ignem ætérnum. Et si óculus tuus scandalízat te, érue eum et projice abs te: bonum tibi est cum uno óculo in vitam intráre, quam duos óculos habéntem mitti in gehénnam ignis. Vidéte, ne contemnátis unum ex his pusíllis: dico enim vobis, quia Angeli eórum in cœlis semper vident fáciem Patris mei, qui in cœlis est.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Priest, Commentary on Matthew, Bk. 3 (on Matt 18:1-10)
      text: |-
        Post invéntum statérem, post tribúta réddita, quid sibi vult Apostolórum repentína interrogátio, Quis, putas, major est in regno cælórum? Quia víderant pro Petro et Dómino idem tribútum rédditum, ex æqualitáte prétii arbitráti sunt Petrum ómnibus Apóstolis esse prælátum, qui in redditióne tribúti Dómino fúerat comparátus; ídeo intérrogant quis major sit in regno cælórum. Vidénsque Jesus cogitatiónes eórum, et causas erróris intéllegens, vult desidérium glóriæ, humilitátis contentióne, sanáre.

        Si autem manus tua vel pes tuus scandalízat te, abscínde eum et próice abs te. Necésse est quidem veníre scándala; væ tamen ei est hómini, qui, quod necésse est ut fiat in mundo, vítio suo facit ut per se fiat. Igitur omnis truncátur afféctus et univérsa propínquitas amputátur, ne per occasiónem pietátis unusquísque credéntium scándalis páteat. Si, inquit, ita est quis tibi conjúnctus, ut manus, pes, óculus; et est útilis atque sollícitus, et acútus ad perspiciéndum, scándalum autem tibi facit, et propter dissonántiam morum te pértrahit in gehénnam: mélius est ut et propinquitáte ejus et emoluméntis carnálibus cáreas, ne, dum vis lucri fácere cognátos et necessários, causam hábeas ruinárum.

        Dico vobis quia Angeli eórum in cælis semper vident fáciem Patris mei. Supra díxerat, per manum et pedem et óculum, omnes propinquitátes et necessitúdines, quæ scándalum fácere póterant, amputándas; austeritátem, ítaque senténtiæ subjécto præcépto témperat, dicens: Vidéte ne contemnátis unum ex pusíllis istis. Sic, inquit, præcípio severitátem, ut commiscéri cleméntiam dóceam. Quia Angeli eórum in cælis vident semper fáciem Patris. Magna dígnitas animárum, ut unaquǽque hábeat ab ortu nativitátis, in custódiam sui, Angelum delegátum. Unde légimus in Apocalýpsi Joánnis: Angelo Ephesi, et reliquárum ecclesiárum, scribe hæc. Apóstolus quoque prǽcipit velári cápita, in ecclésiis, feminárum propter Angelos.
      status: verified

