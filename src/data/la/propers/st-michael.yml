# Transcribed from the reference engine's own source files (Latin:
# web/www/horas/Latin/Sancti/09-29.txt + SanctiM/09-29.txt, English:
# web/www/horas/English/Sancti/09-29.txt), Monastic Tridentinum 1617
# rubric. Companion file to ../apparition-of-st-michael.yml — see that
# file's own header for the "Common-of-an-Angel doesn't exist" context.
#
# **Correction to this saint's own calendar-file comment** (`src/data/
# calendar/saints/st-michael.yml`, which says the two feasts' content is
# "word-for-word identical" and that only the *collect* needed checking):
# that claim holds for the Oratio (confirmed — 09-29.txt has no [Oratio]
# block), but Matins psalmody is NOT shared — 09-29.txt supplies its own
# 9 proper antiphons. Only the Versum blocks fall back to Apparition's.
#
# Monastic structure (SanctiM/09-29.txt): 12 lectiones → 6+6+3
# (N1 = Ps 8,10,14,18,23,33; N2 = Ps 89,95,96,97,98,102; N3 = canticles
# Isa 33:2-10, Isa 33:13-18, Sir 36:14-19). N2 is composed from
# Sancti/09-29 lines 7-9 interleaved with 3 [AntMatutinumM] antiphons;
# the line-7 psalm 95 antiphon ("Ángelus Archángelus...") retains its
# own built-in "allelúia, allelúia" as fixed text, not a seasonal add.
#
# Per this app's own established note (`hours/matins.ts`'s
# `getMatinsSaintOverride`/`getMatinsPsalmodyOverride`, keyed off the
# day's own resolved winner id, not the `propers` field), this file is
# required even though `st-michael.yml`'s own comment records that this
# feast's real rank (Duplex I. classis, "In dedicatione S. Michaëlis
# Archangelis") has never won outright against a stronger day in any of
# the 6 years spot-checked live — so this content may currently be
# unreachable through the app's actual calendar resolution, but is
# authored for completeness/correctness rather than left as a silent gap.
matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 8
        antiphon: Concússum est mare, * et contrémuit terra, ubi Archángelus Míchaël descendébat de cælo.
      - psalms:
          - 10
        antiphon: Laudémus Dóminum, * quem laudant Ángeli, quem Chérubim et Séraphim, Sanctus, Sanctus, Sanctus proclámant.
      - psalms:
          - 14
        antiphon: Ascéndit * fumus arómatum in conspéctu Dómini de manu Ángeli.
      - psalms:
          - 18
        antiphon: Míchaël Archángele, * veni in adjutórium pópulo Dei.
      - psalms:
          - 23
        antiphon: Míchaël * præpósitus paradísi, quem honoríficant Angelórum cives.
      - psalms:
          - 33
        antiphon: 'Gloriósus * apparuísti in conspéctu Dómini: proptérea decórem índuit te Dóminus.'
    versicle:
      v: Stetit Angelus juxta aram templi.
      r: Habens thuríbulum áureum in manu sua.
  nocturn2:
    groups:
      - psalms:
          - 89
        antiphon: Sancte Míchaël Archángele, defénde nos in prœ́lio, * ut non pereámus in treméndo judício.
      - psalms:
          - 95
        antiphon: Ángelus Archángelus Míchaël, * Dei núntius pro animábus justis, allelúia, allelúia.
      - psalms:
          - 96
        antiphon: Data sunt ei * incénsa multa, ut adoléret ea ante altáre áureum, quod est ante óculos Dómini.
      - psalms:
          - 97
        antiphon: Multa magnália * de Michaéle Archángelo, qui, fortis in prǽlio, fecit victóriam.
      - psalms:
          - 98
        antiphon: Stetit Angelus juxta aram templi, * habens thuríbulum áureum in manu sua.
      - psalms:
          - 102
        antiphon: 'Benedícite Dóminum, omnes Angeli ejus: * benedícite, minístri ejus, qui fácitis voluntátem ejus: Benedícite Dóminum.'
    versicle:
      v: Ascéndit fumus arómatum in conspéctu Dómini.
      r: De manu Angeli.
  nocturn3:
    antiphon: 'Míchaël, Gábriel, * Chérubim et Séraphim, qui non cessant clamáre quotídie, dicéntes: Dignus es, Dómine, accípere glóriam.'
    canticles:
      - refs:
          - book: isa
            chapter: 33
            verses: 2-10
      - refs:
          - book: isa
            chapter: 33
            verses: 13-18
      - refs:
          - book: sir
            chapter: 36
            verses: 14-19
    versicle:
      v: In conspéctu Angelórum psallam tibi, Deus meus.
      r: Adorábo ad templum sanctum tuum, et confitébor nómini tuo.

