# Matins Nocturn 2 reading for St. Anacletus, Pope, Martyr (Jul 13).
# No genuine SanctiM match: the only SanctiM file for this date,
# `SanctiM/07-13Moct.txt`, belongs to the Octave of St. Benedict (Jul
# 11-18 is the Monastic calendar's own octave of its patron's Mar 21
# feast) — a missed pre-1955-pool candidate rather than a genuine
# SanctiM case (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-13.txt, English/Sancti/07-13.txt.
# Lectio4 (Anacletus's own vita) and Lectio5-6 (St. Ambrose's
# exposition of Psalm 118, a genuinely distinct patristic source) kept
# split. No responsory given in the source.
#
# Checked 2026-09-05 for a Gospel pairing: both readings here are
# Nocturn 2 (Lectio4-6). St. Ambrose's Psalm 118 exposition is a psalm
# commentary applied generically to a persecuted martyr, not tied to
# any Gospel pericope -- no isGospel pairing applies.
#
# Update (2026-09-05, second pass): Nocturn 3 now authored too, from
# 07-13.txt's explicit alternate "(rubrica 1570 aut rubrica 1617)"
# Lectio7-9 -- of particular interest given this app's own
# Monastic-1617-track structural default, since the file's *default*
# modern rubric ends at Lectio94 with no Nocturn 3 at all. Gospel
# (Luke 14:26-33, "Si quis venit ad me, et non odit patrem suum") from
# obsolete/missa/Latin+English/Commune/C2c.txt (no live missa/Commune/
# C2c.txt in this reference-engine copy). Pope St. Gregory's Homily 37
# on the Gospels has no English translation anywhere in the reference
# engine for this specific Lectio7-9 split (the nearest match,
# horas/English/Commune/C2.txt, splits the same underlying homily at
# different lesson boundaries and can't be cleanly reused) -- English
# composed directly from the Latin, marked draft.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Anacletus Atheniensis, Trajano imperatore rexit Ecclesiam. Decrevit, ut episcopus a tribus episcopis, neque a paucioribus consecraretur, et clerici sacris ordinibus publice a proprio episcopo initiarentur: et ut in Missa, peracta consecratione omnes communicarent. Beati Petri sepulcrum ornavit, Pontificumque sepulturæ locum attribuit. Fecit ordinationes duas mense Decembri, quibus creavit presbyteros quinque, diaconos tres, episcopos sex. Sedit annos novem, menses tres, dies decem. Martyrio coronatus, sepultus est in Vaticano.'
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Exposition of Psalm 118, Sermon 21
      text: |-
        Principes persecuti sunt me gratis: et a verbis tuis trepidavit cor meum. Bene hoc Martyr dicit, quod injuste persecutionum tormenta sustineat: qui nihil rapuerit, nullum violentus oppresserit, nullius sanguinem fuderit, nullius torum putaverit esse violandum: qui nihil legibus debeat, et graviora latronum sustinere cogatur supplicia: qui loquatur juste, et non audiatur: qui loquatur plena salutis, et impugnetur: ut possit dicere, Cum loquebar illis, impugnabant me gratis. Gratis igitur persecutionem patitur, qui impugnatur sine crimine; impugnatur quasi noxius, cum sit in tali confessione laudabilis: impugnatur quasi veneficus, qui in nomine Domini gloriatur, cum pietas virtutum omnium fundamentum sit.

        Vere frustra impugnatur, qui apud impios et infidos impietatis arcessitur, cum fidei sit magister. Verum qui gratis impugnatur, fortis debet esse et constans, quomodo ergo subtexuit: Et a verbis tuis trepidavit cor meum? Trepidare infirmitatis est, timoris atque formidinis. Sed est étiam infirmitas ad salutem, est étiam timor sanctorum. Timete Dominum omnes sancti ejus: et, Beatus vir, qui timet Dominum. Qua ratione beatus? Quia in mandatis ejus cupit nimis.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 14:26-33
      text: 'In illo témpore: Dixit Jesus turbis: Si quis venit ad me, et non odit patrem suum, et matrem, et uxórem, et fílios, et fratres, et soróres, adhuc autem et ánimam suam, non potest meus esse discípulus. Et qui non bájulat crucem suam, et venit post me, non potest meus esse discípulus. Quis enim ex vobis volens turrim ædificáre, non prius sedens cómputat sumptus, qui necessárii sunt, si hábeat ad perficiéndum; ne, posteáquam posúerit fundaméntum, et non potúerit perfícere, omnes, qui vident, incípiant illúdere ei, dicéntes: Quia hic homo cœpit ædificáre, et non pótuit consummáre? Aut quis rex itúrus commíttere bellum advérsus álium regem, non sedens prius cógitat, si possit cum decem mílibus occúrrere ei, qui cum vigínti mílibus venit ad se? Alióquin, adhuc illo longe agénte, legatiónem mittens, rogat ea, quæ pacis sunt. Sic ergo omnis ex vobis, qui non renúntiat ómnibus, quæ póssidet, non potest meus esse discípulus.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 37 on the Gospels
      text: |-
        Si consideremus fratres carissimi, quæ et quanta sunt, quæ nobis promittuntur in cælis, vilescunt animo omnia quæ habentur in terris. Terrena namque substantia supernæ felicitati comparata, pondus est, non subsidium. Temporalis vita æternæ vitæ comparata, mors est potius dicenda quam vita, Ipse enim quotidianus defectus corruptionis quid est aliud, quam quædam prolixitas mortis? Quæ autem lingua dicere, vel quis intellectus capere sufficit, illa supernæ civitatis quanta sint gaudia; Angelorum choris interesse, cum beatissimis spiritibus gloriæ Conditoris assistere, præsentem Dei vultum cernere, incircumscriptum lumen videre, nullo mortis metu affici, incorruptionis perpetuæ munere lætari? Sed ad hæc audita inardescit animus, jamque illic cupit assistere, ubi se sperat sine fine gaudere. Sed ad magna præmia perveniri non potest, nisi per magnos labores. Unde et Paulus egregius prædicator dicit: Non coronabitur, nisi qui legitime certaverit.

        Delectet ergo mentem magnitudo præmiorum, sed non deterreat certamen laborum. Unde ad se venientibus Veritas dicit: Si quis venit ad me, et non odit patrem suum, et matrem, et uxorem, et filios, et fratres, et sorores, adhuc autem et animam suam, non potest meus esse discipulus. Sed percontari libet, quomodo parentes et carnaliter propinquos præcipimur odisse, qui jubemur et inimicos diligere? Et certe Veritas de uxore dicit: Quod Deus conjunxit, homo non separet. Et Paulus ait: Viri, diligite uxores vestras, sicut et Christus Ecclesiam. Ecce, discipulus uxorem diligendam prædicat, cum magister dicat: Qui uxorem non odit, non potest meus esse discipulus. Numquid aliud judex nuntiat, aliud præco clamat? An simul et odisse possumus, et diligere? Sed si vim præcepti perpendimus, utrumque agere per discretionem valemus: ut uxorem, et eos, qui nobis carnis cognatione conjuncti sunt, et quos proximos novimus, diligamus; et quos adversarios in via Dei patimur, odiendo et fugiendo nesciamus.

        Quasi enim per odium diligitur, qui carnaliter sapiens, dum prava nobis ingerit, non auditur. Ut autem dominus demonstraret hoc erga proximos odio non de affectione procedere, sed de charitate, addidit protinus, odisse et animam nostram. Constat ergo, quia amando debet odisse proximum, qui sic eum odit sicut semet ipsum. Tunc etenim nostram animam bene odimus, cum ejus carnalibus desideriis non acquiescimus, cum ejus appetitum frangimus, ejus voluptatibus reluctamur. Quæ ergo contempta ad melius ducitur, quasi per odium amatur. Sic nimirum exhibere proximis nostris odii discretionem debemus, ut in eis et diligamus quod sunt, et habeamus odio quod in Dei nobis itinere obsistunt.
      status: verified
