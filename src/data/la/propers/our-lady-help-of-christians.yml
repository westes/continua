    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-24-Auxilium.txt (Duplex majus, nine lessons, `ex C11`; "Proprium viz. 1888"). English is this project's own translation, marked draft.
matins-hymn:
  text: |
    Sæpe dum Christi pópulus cruéntis
    Hostis infensi premerétur armis,
    Venit adjutrix pia Virgo cœlo
    Lapsa sereno.

    Prisca sic Patrum monuménta narrant,
    Templa testantur spoliis opimis
    Clara, votivo repetita cultu
    Festa quotánnis.

    En novi grates liceat Maríæ
    Cantici lætis módulis referre
    Pro novis donis, resonante plausu
    Urbis et Orbis.

    Oh dies felix, memoránda fastis,
    Qua Petri Sedes fídei magístrum
    Triste post lustrum reducem beáta
    Sorte recépit!

    Vírgines castæ, puerique puri,
    Gestiens clerus, populusque grato
    Corde Regínæ celebráre cœli
    Múnera certent.

    Vírginum Virgo, benedícta Jesu
    Mater, hæc auge bona; fac precámur,
    Ut gregem Pastor Pius ad salutis
    Pascua ducat.

    Te per ætérnos venerémur annos,
    Trínitas, summo celebranda plausu:
    Te fide mentes, resonoque linguæ
    Carmine laudent. Amen.
  status: verified

# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-24-Auxilium.txt (Duplex majus, nine lessons, `ex C11`; "Proprium viz. 1888"). English is this project's own translation, marked draft.
lauds-hymn:
  text: |
    Te Redemptóris, Dominique nostri
    Dícimus Matrem, speciósa Virgo,
    Christianórum decus, et levámen –
    Rebus in arctis.

    Sæviant portæ licet inferórum,
    Hostis antiquus fremat, et minaces
    Ut Deo, sacrum populetur agmen,
    Suscitet iras.

    Nil truces possunt fúriæ nocére
    Méntibus castis, prece quas vocáta
    Ánnuens Virgo fovet, et superno
    Róbore firmat.

    Tanta si nobis faveat Patrona,
    Bellici cessat scéleris tumultus,
    Mille sternuntur, fugiuntve turmæ,
    Mille cohortes.

    Tollit ut sancta caput in Sione
    Turris, arx firmo fabricáta muro,
    Cívitas David, clypeis, et acri
    Mílite tuta.

    Virgo sic fortis Dómini poténti
    Déxtera, cæli cumulata donis,
    A piis longe famúlis repellit
    Dæmonis ictus.

    Te per ætérnos venerémur annos
    Trínitas, summo celebranda plausu,
    Te fide mentes, resonoque linguæ
    Carmine laudent. Amen.
  status: verified

