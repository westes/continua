# Matins Nocturn 2 and 3 readings for Our Lady, Help of Christians. Sourced from
# web/www/horas/Latin/Sancti/aliquibus locis/05-24-Auxilium.txt. One entry per lesson,
# each with its responsory: Lectio4-5 (St. Bernard, Sermon on the Twelve Stars) and
# Lectio6 (the Office's own historical lesson, "Ex publicis Monumentis") in Nocturn 2;
# in Nocturn 3 the Gospel (Luke 11:27-28, the source gives only its incipit, so the
# text is the one already carried for the Presentation) and Lectio7-9 (St. Bernard,
# Sermon on the Nativity of the Blessed Virgin Mary). The source has no responsories
# of its own for Lectio4-6 and 8 and takes the Common of the BVM's (read from
# Commune/C11.txt, Responsory4, 5, 6 and 8, English from the reference's English
# C11); Responsory7 is the source's own. Lectio9 has no responsory (the Te Deum
# follows). Nocturn 1 (Lectio1-3) is not carried: continua's first nocturn runs the
# Scripture course.
#
# Latin: obvious typos corrected silently ("tólia" -> "fólia" in Lectio8 (Adam hiding
# among the leaves), "religiónıs"/"votıs" dotless i, and in Responsory7 the garbled
# "quicúmque célebrant tuam sanctum implórant" -> "quicúmque tuum sanctum implórant",
# as in the source's own Ant 3). Everything else is verbatim. English is this
# project's own translation, marked draft, except the Gospel (existing Douay) and the
# four Common responsories.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Bernard, Abbot, Sermon on the Twelve Stars
      text: 'Veheménter quidem nobis, dilectíssimi, vir unus et múlier una nocuere: sed grátias Deo, per unum nihilóminus virum et mulíerem unam ómnia restaurántur, nec sine magno fœnore gratiárum. Et quidem sufficere póterat Christus: síquidem et nunc omnis sufficientia nostra ex eo est: sed nobis bonum non erat esse hóminem solum. Congruum magis ut adesset nostræ reparationi sexus utérque. Jam ítaque nec ipsa múlier benedícta in muliéribus vidébitur otiosa: inveniétur equidem locus ejus in hac reconciliatione.  Opus est enim mediatore ad mediatorem Christum: nec alter nobis utilior quam María. Crudelis nimium mediatrix Heva, per quam serpens antiquus pestiferum étiam ipsi viro virus infudit: sed fidélis María, quæ salútis antidotum et viris et muliéribus propinávit. Illa enim minístra seductionis, hæc propitiatiónis; illa suggéssit prævaricationem, hæc ingessit redemptiónem. Quid ad Maríam accedere trepidet humána fragilitas? Nihil austerum in ea, nihil terríbile; tota suávis est, ómnibus ófferens lac et lanam. Revolve diligentius evangelicæ historiæ sériem univérsam: et si quid forte increpatorium, si quid durum, si quod dénique signum vel levis indignatiónis occurrerit in María, de cetero suspectam hábeas, et accedere verearis.'
      responsory: |
        R. Sicut cedrus exaltáta sum in Líbano, et sicut cypréssus in monte Sion: quasi myrrha elécta, * Dedi suavitátem odóris.
        V. Et sicut cinnamómum et bálsamum aromatízans.
        R. Dedi suavitátem odóris.
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Bernard, Abbot, Sermon on the Twelve Stars
      text: 'Quod si, ut vere sunt, plena magis ómnia pietátis et grátiæ, plena mansuetúdinis et misericórdiæ, quæ ad eam pértinent, invéneris, age grátias ei, qui talem mediatrícem benigníssima miseratióne provídit, in qua nihil possit esse suspéctum. Dénique ómnibus ómnia facta est; sapiéntibus et insipiéntibus copiosíssima caritáte debitrícem se fecit. Omnibus misericórdiæ sinum áperit, ut de plenitúdine ejus accípiant univérsi, captívus redemptiónem, æger curatiónem, tristis consolatiónem, peccátor véniam, justus grátiam, Angelus lætítiam. Ipsa prætérita non díscutit mérita; sed ómnibus sese exorábilem, ómnibus clementíssimam præbet, ómnium dénique necessitátes amplíssimo quodam miserátur afféctu. Ipsa est quondam a Deo promíssa múlier serpéntis antíqui caput virtútis pede contritúra; cujus plane calcáneo in multis versútiis insidiátus est, sed sine causa. Sola enim contrívit univérsam hæréticam pravitátem. Contríti sunt insidiántes, conculcáti supplantatóres, confutáti derogatóres, et beátam eam dicunt omnes generatiónes. Jam si Ecclésia lunæ intelligénda vidétur vocábulo, habes mediatrícem evidénter expréssam: Múlier, inquit, amícta sole, et luna sub pédibus ejus. Amplectámur Maríæ vestígia, et devotíssima supplicatióne beátis illíus pédibus provolvámur. Teneámus eam, nec dimittámus, donec benedíxerit nobis: potens est enim.'
      responsory: |
        R. Quæ est ista quæ procéssit sicut sol, et formósa tamquam Jerúsalem? * Vidérunt eam fíliæ Sion, et beátam dixérunt, et regínæ laudavérunt eam.
        V. Et sicut dies verni circúmdabant eam flores rosárum et lília convállium.
        R. Vidérunt eam fíliæ Sion, et beátam dixérunt, et regínæ laudavérunt eam.
      status: verified
    - nocturn: 2
      isGospel: false
      source: From the public records
      text: 'Præsentíssimum Deiparæ auxilium ad religiónis hostes profligándos sæpe pópulus christiánus mirum in modum expértus est: ex quo factum, ut sanctissimus Póntifex Pius quintus post insignem victóriam, intercedénte beatíssima Virgine, a Christiánis de Turcárum tyránno apud Echínadas ínsulas reportátam, in litaníis Lauretánis eámdem Regínam cœlórum inter ália præcónia Auxílium Christianórum appellári constitúerit. Sed illud in primis memorábile est, atque exploráti miráculi loco habéndum, quod cum Románus Póntifex Pius séptimus, impiórum consíliis et armis ex Apostólica Petri Sede exturbátus, et arcta custódia, præsértim Savónæ per annos quinque eóque ámplius fuísset deténtus, viis ómnibus pénitus interclúsis, ne Dei Ecclésiam régere posset, nullo símilis persecutiónis in priscis annálibus exémplo, inopináto et præter ómnium exspectatiónem cóntigit, ut ingénti plausu, ac véluti univérsi orbis mánibus pontifício sólio restituerétur. Quod et secúndo áccidit, dum iterum commóto túrbine, ab Urbe discédens, sacro comitánte Cardinálium collégio, Ligúriam conténdit. Verum præsentissimo Dei benefício, cessánte procélla, qua grave minabátur excidium, Romam, plaudéntibus præ novo gaúdio populis, reversus est. Antea tamen, quod in votis habúerat, et captivitáte deténtus éxsequi nequiverat, aúrea coróna insignem Savónæ imáginem Deíparæ Virginis sub titulo Matris Misericórdiæ solémni ritu propriísque mánibus decorávit. Quam mirábilem rerum vicissitúdinem idem Póntifex Máximus Pius séptimus, totius evéntus íntime cónscius, cum intercessióne sanctíssimæ Dei Genitrícis, cujus poténtem opem, et ipse impénse imploráverat, et ab ómnibus Christi fidélibus implorári curáverat, accéptam mérito reférret, in ejúsdem Vírginis Matris honórem, sub appellatióne Auxílii Christianórum, solémne festum indixit perpétuo celebrándum die mensis Maji vigésimo quarto, faustíssimi sui in Urbem réditus anniversário, approbáto étiam Offício próprio, ut tanti beneficii distíncta et perénnis exstet memória, et gratiárum áctio.'
      responsory: |
        R. Ornátam monílibus fíliam Jerúsalem Dóminus concupívit: * Et vidéntes eam fíliæ Sion, beatíssimam prædicavérunt, dicéntes: * Unguéntum effúsum nomen tuum.
        V. Astitit regína a dextris tuis in vestítu deauráto, circúmdata varietáte.
        R. Et vidéntes eam fíliæ Sion, beatíssimam prædicavérunt, dicéntes:
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 11:27-28
      text: 'In illo témpore: Loquénte Jesu ad turbas, extóllens vocem quædam múlier de turba, dixit illi: Beátus venter, qui te portávit, et úbera, quæ suxísti. At ille dixit: Quinímmo beáti, qui áudiunt verbum Dei, et custódiunt illud.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernard, Abbot, Sermon on the Nativity of the Blessed Virgin Mary
      text: 'Intuére o homo, consílium Dei, agnósce consilium sapientiæ, consilium pietatis. Cœlésti rore áream rigatúrus, totum vellus prius infúdit; redemptúrus humánum genus, prétium univérsum cóntulit in Mariam. Altius ergo intuemini, quanto devotiónis afféctu a nobis eam volúerit honorári, qui totíus boni plenitúdinem pósuit in María: ut proínde si quid spei in nobis est, si quid grátiæ, si quid salútis, ab ea novérimus redundáre, quæ ascéndit delíciis áffluens. Totis ergo medúllis córdium, totis præcordiórum afféctibus, et votis ómnibus Mariam hanc venerémur, quia sic est volúntas ejus qui totum nos habére vóluit per Maríam. Hæc, inquam, volúntas ejus est, sed pro nobis.'
      responsory: |
        R. Felix namque es, sacra Virgo María, et omni laude digníssima: * Quia ex te ortus est sol justítiæ, Christus, Deus noster.
        V. Ora pro pópulo, intérveni pro clero, intercéde pro devóto femíneo sexu: séntiant omnes tuum juvámen, quicúmque tuum sanctum implórant auxílium.
        R. Quia ex te ortus est sol justítiæ, Christus, Deus noster.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernard, Abbot, Sermon on the Nativity of the Blessed Virgin Mary
      text: 'In ómnibus síquidem et per ómnia próvidens miseris, trepidatiónem nostram solátur, fidem éxcitat, spem róborat, diffidéntiam ábigit, érigit pusillanimitátem. Ad Patrem verebáris accédere; solo audítu térritus, ad fólia fugiebas: Jesum tibi dedit mediatórem. Quid non apud talem Patrem Filius talis obtineat? Exaudiétur útique pro reveréntia sua: Pater enim díligit Filium. Sed fórsitan et in ipso majestátem vereáre divinam, quod licet factus sit homo, mánserit tamen Deus. Advocátum habére vis et ad ipsum? Ad Mariam recúrre. Pura síquidem humánitas in María, non modo pura ab omni contaminatióne, sed et pura singularitáte natúræ. Nec dúbius díxerim, exaudiétur et ipsa pro reveréntia sua. Exaúdiet útique Matrem Filius, et exaúdiet Fílium Pater.'
      responsory: |
        R. Beátam me dicent omnes generatiónes, * Quia fecit mihi Dóminus magna qui potens est, et sanctum nomen ejus.
        V. Et misericórdia ejus a progénie in progénies timéntibus eum.
        R. Quia fecit mihi Dóminus magna qui potens est, et sanctum nomen ejus.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernard, Abbot, Sermon on the Nativity of the Blessed Virgin Mary
      text: 'Filíoli, hæc peccatórum scala, hæc mea máxima fidúcia est, hæc tota rátio spei meæ. Quid enim? Potéstne Filius aut repéllere, aut sustinére repúlsam? Non audíre, aut non audíri Filius potest? Neutrum plane. Invenisti, ait Angelus, grátiam apud Deum: felíciter. Semper hæc invéniet grátiam, et sola est grátia qua egémus: nimírum sola est grátia qua salvámur. Quid nos ália concupíscimus, fratres? Quærámus grátiam, et per Maríam quærámus, quia quod quærit invenit, et frustrári non potest. Quærámus grátiam, sed grátiam apud Deum: nam apud hómines gratia fallax. Quærant álii méritum; nos inveníre grátiam studeámus. Quid enim? Non grátiæ est quod hic sumus? Profécto misericórdiæ Dómini est, quod non sumus consúmpti nos.'
      status: verified
