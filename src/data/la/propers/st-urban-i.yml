# Matins Nocturn 2 reading for St. Urban I, Pope, Martyr (May 25). No
# genuine SanctiM match: the plain `Sancti/05-25.txt` is St. Gregory
# VII (a later saint occupying the general calendar's own May 25
# slot), and `SanctiM/05-25.txt` bases `@Sancti/05-25` accordingly —
# Urban I's own content survives only at the suffixed sibling file —
# same "don't trust the plain file" wrinkle as the pre-1955 pass
# (memory vu-matins-pre1955-saints); a missed pre-1955-pool candidate
# rather than a genuine SanctiM case (see memory
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/05-25o.txt, English/Sancti/05-25o.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Urbanus Romanus, Alexandro Sevéro imperatóre, doctrina et vitæ sanctitáte multos ad Christi fidem convértit; in illis Valerianum, beátæ Cæcíliæ sponsum, et Tiburtium, Valeriáni fratrem, qui póstea martyrium forti animo subiérunt. Hic de bonis Ecclésiæ attributis scripsit his verbis: Ipsæ res fidelium, quæ Dómino offerúntur, non debent in alios usus quam ecclesiásticos et christianórum fratrum, vel indigéntium, converti; quia vota sunt fidelium, et pretia peccatórum, ac patrimónia páuperum. Sedit annos sex, menses septem, dies quatuor: ac martyrio coronátus, sepúltus est in cœmeterio Prætextati, octavo Kalendas Junii. Ordinatiónibus quinque habitis mense Decembri, creávit presbyteros novem, diaconos quinque, episcopos per diversa loca octo.'
      status: verified
