# Matins Nocturn 2 reading for St. Vitalis, Martyr (Apr 28) — the
# correct Tridentine file is the suffixed `Sancti/04-28o.txt` (the
# plain `Sancti/04-28.txt` is St. Paul of the Cross instead, a later
# canonization occupying the same MM-DD slot) — same "check every
# suffix variant" wrinkle as the pre-1955 pass (memory
# vu-matins-pre1955-saints). `SanctiM/04-28oc.txt` matches this same
# suffix and Officium ("S. Vitalis, Martyris"), and inherits the whole
# day (`@Sancti/04-28o`, confirmed no Nocturn 2/3 override) — a genuine
# SanctiM match, sourced from the Tridentine track (see memory
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/04-28o.txt, English/Sancti/04-28o.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Vitalis miles, sanctorum Gervasii et Protasii pater, una cum Paulino judice Ravennam ingressus, cum vidisset Ursicinum medicum ob christianæ fidei confessionem ductum ad supplicium, paululum in tormentis titubare, exclamavit: Ursicine medice, qui alios curare solitus es, cave ne te mortis æternæ jaculo conficias. Qua voce confirmatus Ursicinus, martyrium fortiter subivit. Quare Paulinus incensus Vitalem comprehendi jubet, et equuleo tortum, atque in profundam foveam demersum, lapidibus obrui. Quo facto quidam Apollinis sacerdos, qui Paulinum in Vitalem incitarat, oppressus a dæmone, clamare cœpit: Tu me nimium Vitalis Christi Martyr incendis: et illo æstu jactatus, se præcipitavit in flumen.'
      status: verified
