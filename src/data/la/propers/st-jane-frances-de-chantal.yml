# Read directly from web/www/horas/Latin/Sancti/08-21.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Omnípotens et miséricors Deus, qui beátam Joánnam Francíscam, tuo amóre
    succénsam, admirábili spíritus fortitúdine per omnes vitæ sémitas in via
    perfectiónis donásti, quique per illam illustráre Ecclésiam tuam nova prole
    voluísti: ejus méritis et précibus concéde; ut, qui infirmitátis nostræ
    cónscii de tua virtúte confídimus, cæléstis grátiæ auxílio cuncta nobis
    adversántia vincámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Verified against Divinum Officium (Divino Afflatu - 1954), Lauds live
# query for 1955-08-21 (a Sunday, forcing her Duplex feast to yield and
# be commemorated rather than won -- her own Aug 21 slot doesn't fall on
# a Sunday until then) -- the "Commemoratio S. Joannæ Franciscæ ... Viduæ"
# block. Antiphon is her own Benedictus antiphon (see resolve-common.ts's
# getBenedictusAntiphon -- same "Date ei de fructu manuum suarum" text,
# labeled "ex Proprio Sanctorum" in the raw Monastic 1617 file even
# though it's the standard Common-of-a-Holy-Woman antiphon). V/R is the
# Common-of-a-Virgin pair ("Diffusa est gratia"), matching this saint's
# own common fallback to common-of-a-virgin
# (st-jane-frances-de-chantal.yml's own comment: no common-of-a-widow
# file exists in this app). Collect identical to st-jane-frances-de-
# chantal-collect.yml. See hours/resolve-common.ts's getDayCollects for
# how a sanctoral commemoration renders this whole bundle, falling back
# to just the bare collect for a saint without one of these authored.
commemoration:
  text: |
    Ant. Date ei * de frúctu mánuum suárum, et laudent eam in portis ópera ejus.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Omnípotens et miséricors Deus, qui beátam Joánnam Francíscam, tuo amóre succénsam, admirábili spíritus fortitúdine per omnes vitæ sémitas in via perfectiónis donásti, quique per illam illustráre Ecclésiam tuam nova prole voluísti: ejus méritis et précibus concéde; ut, qui infirmitátis nostræ cónscii de tua virtúte confídimus, cæléstis grátiæ auxílio cuncta nobis adversántia vincámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Matins Nocturn 2 reading for St. Jane Frances de Chantal, Widow
# (Aug 21). Sourced directly from web/www/horas/Latin/Sancti/08-21.txt,
# English/Sancti/08-21.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in her own file (her `[Rule]` is `vide
# C7a`) -- defers to the Common's own Nocturn 3, not transcribed here.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Joanna Francisca Frémiot de Chantal, Divione in Burgundia clarissimis orta natalibus, ab ineunte ætate eximiæ sanctitatis non obscuras edidit significationes. Eam enim vix quinquennem nobilem quemdam Calvinistam solida supra ætatem argumentatione perstrinxisse ferunt, collatumque ab eo munusculum flammis illico tradidisse, in hæc verba: En quomodo hæretici apud inferos comburentur, qui loquenti Christo fidem detrectant. Matre orbata, Deiparæ Virginis tutelæ se commendavit, et famulam, quæ ad mundi amórem eam alliciebat, ab se rejecit. Nihil puerile in moribus exprimens, a sæculi deliciis abhorrens, martyriumque anhelans, religioni ac pietati impense studebat. Baroni de Chantal nuptui a patre tradita, virtutibus omnibus excolendis operam dedit, liberos famulos, aliosque sibi subjectos in fidei doctrina, bonisque moribus imbuere satagens. Profusa liberalitate pauperum inopiam sublevabat, annona divinitus non raro multiplicata: quo factum est, ut nemini se umquam Christi nomine roganti stipem abnegaturam spoponderit.

        Viro in venatione interempto, perfectioris vitæ consilium iniens, continentiæ voto se obstrinxit. Viri necem non solum æquo animo tulit, sed, in publicum indultæ veniæ testimonium, occisoris filium e sacro fonte suscipere sui victrix elegit. Modica familia, tenui victu atque vestitu contenta, pretiosas vestes in pios usus convertit. Quidquid a domesticis curis supererat temporis, precibus, piis lectionibus, laborique impendebat. Numquam adduci potuit ut alteras nuptias, quamvis utiles et honorificas, iniret. Ne autem a proposito castimoniæ observandæ in posterum dimoveretur, illius voto innovato, sanctissimum Jesu Christi nomen candenti ferro pectori insculpsit. Ardentius in dies caritate fervescens, pauperes, derelictos, ægros, teterrimisque morbis infectos ad se adducendos curabat; eosque non hospitio tantum excipiebat, solabatur, fovebat, verum étiam sordidas eorumdem vestes depurgabat, laceras reficiebat, et manantibus fœtido pure ulceribus labia admovere non exhorrebat.

        A sancto Francisco Salesio, quo spiritus moderatore usa fuit, divinam voluntatem edocta, proprium parentem, socerum, filium denique ipsum, quem étiam vocationi obsistentem, sua e domo egrediens, pedibus calcare non dubitavit, invicta constantia deseruit, et sacri instituti Visitationis sanctæ Mariæ fundamenta jecit. Ejus instituti leges integerrime custodivit, et adeo paupertatis fuit amans, ut vel necessaria sibi deesse gauderet. Christianæ vero animi demissionis et obedientiæ, virtutum denique omnium perfectissimum exemplar se præbuit. Altiores in corde suo ascensiones disponens, arduissimo efficiendi semper id quod perfectius esse intelligeret, voto se obstrinxit. Denique, sacro Visitationis instituto ejus potissimum opera longe lateque diffuso, verbo, exemplo, et scriptis étiam divina sapientia refertis, ad pietatem et caritatem sororibus excitatis, meritis referta, et sacramentis rite susceptis, Molinis, anno millesimo sexcentesimo quadragesimo primo, die decima tertia Decembris, migravit ad Dominum, ejusque animam, occurrente sancto Francisco Salesio, in cælos deferri sanctus Vincentius a Paulo procul distans aspexit. Ejus corpus postea Annecium translatum fuit: eamque miraculis ante et post obitum claram Benedictus decimus quartus beatorum, Clemens vero decimus tertius Pontifex Maximus albo sanctorum adjecit.
      status: verified
