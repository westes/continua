# Lauds collect ([Oratio 2] in the source) — read from
# web/www/horas/{Latin,English}/Tempora/Quad1-4.txt.
collect:
  text: |
    Orémus.
    Devotiónem pópuli tui, quǽsumus, Dómine, benígnus inténde: ut, qui per abstinéntiam macerántur in córpore, per fructum boni óperis reficiántur in mente.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Vespers collect ([Oratio 3] in the source), distinct from Lauds' own —
# read from web/www/horas/{Latin,English}/Tempora/Quad1-4.txt.
collect/~-vespers:
  text: |
    Orémus.
    Da, quǽsumus, Dómine, pópulis christiánis: et, quæ profiténtur, agnóscere, et cæléste munus dilígere, quod frequéntant.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

