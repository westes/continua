# Matins Nocturn 2 reading for St. Eusebius of Vercelli, Bishop,
# Martyr — vu places him Dec 15 (Monastic 1617's own same-day
# redirect; see comment header in
# src/data/calendar/saints/st-eusebius-of-vercelli.yml), but his real
# proper content lives at the general Tridentine calendar's Dec 16
# (`Sancti/12-16.txt`, confirmed via grep for "Eusebii Vercellensis"
# across all Sancti files). No SanctiM file exists for him at either
# date — a missed pre-1955-pool candidate, sourced the same way as a
# pre-1955 saint (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/12-16.txt, English/Sancti/12-16.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3 (Lectio7-9) is a bare `@Commune/C2:LectioN in 2 loco`
# rubric with no proper Lectio content in either language, so no
# Nocturn 3 reading is authored here — correctly left unauthored, not
# a gap.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Eusebius, natióne Sardus, Romanæ urbis lector, post Vercellénsis epíscopus, ad hanc regéndam ecclésiam mérito est créditus divino eléctus judício: nam quem numquam ante constitúti electóres cognoverant, posthábitis civibus, simul ut vidérunt, et probavérunt; tantumque intérfuit, ut probarétur, quantum ut viderétur. Primus in Occidéntis partibus in eadem ecclésia eosdem monachos instituit esse quos clericos, ut esset in ipsis viris et contemptus rerum, et accurátio levitárum. Ariánis impietátibus ea tempestáte per Occidéntem longe lateque traductis, advérsus eas viríliter sic dimicávit, ut ejus invicta fides Libérium summum Pontificem ad vitæ solátium erigeret. Quare hic sciens in ipso fervére Spíritum Dei, cum ei significasset ut penes imperatórem una cum suis legátis patrocinium fidei susciperet, mox cum illis profectus est ad Constántium; apud quem enixius agens, quidquid legatióne petebátur, obtinuit, ut episcopórum nempe cœtus celebrarétur.

        Colléctum est Mediolani anno sequénti concílium, ad quod a Constantio invitátum Eusebium concupitúmque, ac vocátum a Liberii legatis, tantum abest, ut malignántium synagóga Arianórum contra sanctum Athanasium furéntium in suas partes adduceret, ut potius diserte statim ipse declarans, e præséntibus quosdam sibi compertos hæretica labe pollutos, Nicænam immo fidem proposúerit iis subscribéndam, ántequam cetera tractaréntur. Quod Ariánis acerbe irátis negántibus, nedum in Athanasium recusávit ipse subscribere, quin sancti Dionýsii Mártyris, qui decéptus ab ipsis subscripserat, captivatam simplicitátem ingeniosíssime liberávit. Quam ob rem illi gráviter indignántes, post multas illatas injurias, exsílio illum mulctarunt: sed sanctus vir, excusso púlvere, nec cæsaris minas veritus, nec enses obstrictos, exsílium véluti sui ministerii offícium accépit; missusque Scythópolim, famem, sitim, verbera, divérsaque supplícia perpéssus, pro fide strenue vitam contempsit, mortem non metuit, corpus carnificibus trádidit.

        Quanta in eum tunc Arianórum crudelitas fúerit ac effrons inverecúndia, ostendunt graves litteræ plenæ róboris, pietátis ac religiónis, quas e Scythópoli scripsit ad Vercellensem clerum et pópulum, aliosque finítimos; e quibus étiam est explorátum, ipsórum nec minis, inhumanáque sævítia potuísse umquam eum deterreri, nec serpentina blanda subtilitate ad eórum societátem perduci. Hinc in Cappadociam, postremoque ad superiores Ægypti Thebáidas pro constántia sua deportatus, exsilii rigores tulit ad mortem usque Constantii: post quam ad gregem suum reverti permissus, non prius redire vóluit, quam reparandis fidei jacturis ad Alexandrinam synodum sese conferret, postque médici præstántis instar, péragrans Oriéntis provincias, in fide infirmos ad integram valetúdinem restitúeret, eos instítuens in Ecclésiæ doctrina. Inde salubritate pari digresso in Illyricum, tandemque in Italiam delato, ad ejus réditum lúgubres vestes Italia mutávit: ubi postquam Psalmórum ómnium expurgatos a se commentarios Orígenis édidit, Eusebiíque Cæsareénsis, quos verterat de Græco in Latinum; demum tot egregie factis illustris ad immarcescíbilem glóriæ corónam tantis ærumnis proméritam, sub Valentiniáno et Valénte Vercellis migrávit.
      status: verified
