# Matins Nocturn 2 reading for St. Boniface IV, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/05-29-BonifatiusIV.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Bonifacius hujus nóminis quartus, Joánnis fílius, Valeriæ Marsorum natus, ex monacho sancti Sebastiani extra Urbem, et Presbytero Cardináli, sub imperatóre Phoca, ad pontificátum assúmptus est, et consecrátus die Domínico, quinto Kaléndas Septémbris, anno Dómini sexcentésimo séptimo, seditque annos sex, menses octo, dies trédecim, duábus ordinationibus peractis mense Decémbri, in quibus epíscopos vigínti quinque, diáconos octo creávit.

        Statim paternam domum in monastérium eréxit, et fundos suos in monachórum usum eídem monastério adscrípsit: sed ut longe majóri beneficio hujus institúti hómines sibi obstringeret, convocatis ad synodum Itáliæ epíscopis, sanctis légibus labentem monachórum disciplínam restítuit. Mellitus Londinensis epíscopus, qui Romam venerat, de rebus Anglicis Christi Vicárium consulturus, synodo intérfuit, illiusque decréta cum lítteris Bonifacii in Britanniam tulit.

        Ab imperatóre Phoca sanctíssimus Póntifex nobile Romæ delubrum, Pantheon scílicet, obtínuit: christiáno ritu consecratum in ecclésiam Deíparæ Vírgini et sanctis Martyribus dicatam mutávit. Ad majórem sanctitátem conciliandam, incredibilem sacrárum reliquiarum vim, ex divérsis arenariis. eductam, inferri, et juxta príncipem aram condi curávit. Dénique sub Heraclío virtúte ac méritis clarus obdormívit in Dómino, octávo Kaléndas Júnii, sepultúsque est in Vaticáno.
      status: verified
