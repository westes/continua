# Read from the reference engine: web/www/horas/Latin/Sancti/06-17r.txt [Oratio];
# English from English/Sancti/06-17r.txt.
collect:
  text: |
    Orémus.
    Deus, qui beátum Gregórium Confessórem tuum atque Pontíficem pastoráli sollicitúdine, et páuperum miseratióne claréscere voluísti: concéde propítius; ut, cujus mérita celebrámus, caritátis imitémur exémpla.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-a-confessor-bishop; collect is the saint's own (collect-st-gregory-barbarigo.yml). Not
# independently live-verified for this category, so marked draft.
commemoration:
  text: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui beátum Gregórium Confessórem tuum atque Pontíficem pastoráli sollicitúdine, et páuperum miseratióne claréscere voluísti: concéde propítius; ut, cujus mérita celebrámus, caritátis imitémur exémpla.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. Gregory Barbarigo, Bishop and Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/06-17r.txt, English/Sancti/06-17r.txt.
# single lesson (Lectio94), one continuous account.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Gregórius Barbadícus, Venétiis perantíqua família ortus, utriúsque juris láuream in Archigymnásio Patavíno magna cum laude est adéptus. Undevigésimum annum agens, cum ad Monasteriénsem pacis Convéntum proféctus esset, legáto pontifício Fábio Chísio adhortánte, ecclesiásticæ milítiæ nomen dare constítuit. Sacris initiátus, ab eódem Chísio, Alexándri séptimi nómine ad Pontificátum assúmpto, Bergomátium epíscopus primum, mox, Cardinálium Collégio cooptátus, ad sedem Patavínam elígitur. In episcopáli múnere obeúndo, sancto Cárolo Borromǽo sibi exémplo propósito, ad extrémum usque spíritum adlaborávit ut, Sacrosánctæ Tridentínæ Sýnodi mónitis et decrétis inníxus, evélleret vítia, virtútes indúceret. In utráque diœcési Seminárium amplificávit, Patavínum præsértim bibliothéca auxit ac typographía, qua libri quoque ederéntur inter pópulos próximi Oriéntis vulgándi. Catechéticam instructiónem eníxe fovit, et síngulos diœcésis pagos, docéndo et hortándo, álacer peragrávit. Caritátis opéribus ac vitæ sanctitáte refúlsit, in egénos et páuperes ádeo liberális ut domésticam quoque supelléctilem, vestes ac lectum in eórum auxílium erogáverit. Dénique, post brevem lethálem morbum, plácide obdormívit in Dómino décimo quarto kaléndas iúlias, anno millésimo sexcentésimo nonagésimo séptimo. Quem, méritis ac virtútibus clarum, Clemens décimus tértius Beatórum, Joánnes vero vigésimus tértius Sanctórum número accénsuit.
      status: verified
