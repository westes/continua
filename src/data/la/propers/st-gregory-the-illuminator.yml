# Matins Nocturn 2 reading for St. Gregory the Illuminator, Bishop and Martyr (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/10-01-Gregorius.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Gregórius, Armeniæ régibus cretus, qui primus post sanctum Bartholomæum Apostolum in illam provínciam Christi fidem invexerat, dictus proptérea pátria voce Illuminator, infans clam eréptus ad declinandam necem, qua ejus família petebatur, Cæsaréæ Cappadóciæ pie est educátus, legemque Christi edóctus baptísmum suscépit. Secesserat illuc Teridates fílius Cusaronis Armenorumregis, ab Anach Gregórii patre doldse interempti, a Persis regno spoliatus, cui Gregórius patérni scéleris bene cónscius se in servitútem trádidit, et cum eo qui jam a Romanis regnum recuperaverat, deínde in Armeniam rédiit, ubi a Teridate sǽpius tentátus, ut idólis sacrificáre vellet, cum constantíssime renuísset, innúmera pene et incredibilia tormentórum génera subíre coáctus est.

        Arcta primum custódia Gregórium inclusit Teridates; tunc manus ejus latéribus sic alligari jussit, ut exstarent cubíti, et camum ori ejus inseri, massasque excisi salis dorso ejus imponi, constrictumque loro circa pectus fórtiter stringente suspendi celsissimo loco. Mansit autem sic suspensus septem diébus, post quos, cum in sua senténtia permanéret, ex uno pede suspensus coáctus est fumum hauríre excitatum ex fimo graveolente, dum intérea fórtiter cædebatur baculis humidis. Inter hæc enixis Deum précibus exoravit pro salúte ómnium, præsértim gentis Armeniæ, atque ut sibi constántiam pro fide tribueret. Hanc rex demirátus quidem, crudelius tamen desseviit, mandavitque afférri lignórum truncos, et componi tabulas super anteriores partes pedum ejus, eásque funibus nodosis veheménter constringi, donec defltieret sanguis per summitates digitórum. Cólaphis ínsuper contusus fuit, et caput ejus artificiosæ cochleæ impositum, et admota nari ejus fistula, effusa sunt sal, nitrum et acetum simul commixta. Multa similia et pejora crudelitátis génera perpéssus est, ádeo ut rex ipse veheménter miraretur mansisse vivum, et nihili fecísse dolóres intensos.

        Cum autem quidam ex satrapis rege allocútus illi manifestasset Gregórium fílium esse Anach, interfectoris patris ejus Cusaronis, jussit illum mánibus pedibusque et collo vinctum perduci in provínciam Ararat, trudique in vérticem castri Artaxat, demittique in infimumhiatum, donecibidem moreretur. Deus vero, qui e tantis torméntis vivum illum eripuerat, ex hocpariter servávit incólumem, et post longum tempus Teridatem ipsum velut álterum Nabuchodónosor tentatióne probátum ad fídei lumen addúxit, quem Gregórius jejúnio purgátum, Deo per baptísmum reconciliavit. Ítaque facta potestáte públice prædicándi Christi Evangélium, majóris Armeniæ gentem in fide erudívit, et sacro fonte lustrávit, ecclesiasque undequaque eréxit, destrúctis superstitiónis simulácris, templisque eórum eversis, Cæsaréæ ordinátus suæ gentis archiepíscopus, impénsius Armenos divína doctrína instrúxit, atque in fide suscépta confirmávit. Quiétis tandem ac divíni otii cupidissimus, in solitúdinem se recépit, ubi jejúnio et contemplatióni déditus, méritis cumulátus in bona senectúte obdormívit in Dómino, Constantíno Magno imperatóre. Corpus illíus christiáni ex Armenia fugiéntes in Itáliam transtulerunt; caput cum caténis quibus vinctus fúerat Neápoli, bráchium vero in cathedrali Neritonensi collocátum fuit.
      status: verified
