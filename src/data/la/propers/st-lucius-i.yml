# Matins Nocturn 2 reading for st-lucius-i (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/03-04cc.txt, [Lectio4], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Lucius Románus patre Porphyrio, post sancti Cornélii consummationem, Románæ Ecclésiæ episcopátum ténuit. Sanxit, ut duo presbyteri ac tres diáconi, ecclesiástici causa testimonii, quovis loco epíscopum non desererent Pacem lapsis dandam, et pœniténtia acta, communicationis fructum negandum non esse, spíritu Dei plenus (ut sanctus Cypriánus scripsit), lítteris suis significávit. Ob Christi fidem exsílio relegátus, et post modum ad Ecclésiam suam incólumis redíre permíssus, tandem omni Ecclésiæ facultáte archidiacono suo Stéphano prius trádita, cápite truncatus est quarto Nonas Mártii, Gallo et Volusiáno princípibus. Duas hábuit ordinatiónes mense Decémbri, quibus presbyteros quátuor, epíscopos per divérsa loca septem creávit. Ejus corpus primo via Appia ad sanctum Xystum, in cœmetério Callísti sepúltum, inde a Pascháli Papa in sanctæ Cæcíliæ títulum, una cum ejúsdem vírginis et sociórum corpóribus translátum, ibi sub sancto altári collocátum fuit.
      status: verified
