# Nocturn 3, 24th (and final, when reached) Sunday after Pentecost. Sourced
# from Tempora/Pent24-0.txt. See post-pentecost-02.yml/post-pentecost-12.yml
# for sweep method note (no proper Nocturn 2 in the source). Lectio7 bare
# incipit (Matt 24:15-35, the abomination of desolation) skipped;
# Lectio7-9's homily by St. Jerome is one continuous work, combined. Per
# temporal-id.ts's resolvePostPentecost23Plus, this id is used both for the
# literal 24th week (when the season runs that long) and as the fixed final
# Sunday-of-the-year formulary in overflow years - either way, this is the
# content that slot resolves to.
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Matt 24:15-35
      text: 'In illo témpore: Dixit Jesus discípulis suis: Cum vidéritis abominatiónem desolatiónis, quæ dicta est a Daniéle Prophéta, stantem in loco sancto: qui legit, intélligat: tunc qui in Judǽa sunt, fúgiant ad montes: et qui in tecto, non descéndat tóllere áliquid de domo sua: et qui in agro, non revertátur tóllere túnicam suam. Væ autem prægnántibus et nutriéntibus in illis diébus. Oráte autem, ut non fiat fuga vestra in híeme vel sábbato. Erit enim tunc tribulátio magna, qualis non fuit ab inítio mundi usque modo, neque fiet. Et nisi breviáti fuíssent dies illi, non fíeret salva omnis caro: sed propter eléctos breviabúntur dies illi. Tunc si quis vobis díxerit: Ecce, hic est Christus, aut illic: nolíte crédere. Surgent enim pseudochrísti et pseudoprophétæ, et dabunt signa magna et prodígia, ita ut in errórem inducántur - si fíeri potest - étiam elécti. Ecce, prædíxi vobis. Si ergo díxerint vobis: Ecce, in desérto est, nolíte exíre: ecce, in penetrálibus, nolíte crédere. Sicut enim fulgur exit ab Oriénte et paret usque in Occidéntem: ita erit et advéntus Fílii hóminis. Ubicúmque fúerit corpus, illic congregabúntur et áquilæ. Statim autem post tribulatiónem diérum illórum sol obscurábitur, et luna non dabit lumen suum, et stellæ cadent de cælo, et virtútes cœlórum commovebúntur: et tunc parébit signum Fílii hóminis in cœlo: et tunc plangent omnes tribus terræ: et vidébunt Fílium hóminis veniéntem in núbibus cæli cum virtúte multa et majestáte. Et mittet Angelos suos cum tuba et voce magna: et congregábunt eléctos ejus a quátuor ventis, a summis cœlórum usque ad términos eórum. Ab árbore autem fici díscite parábolam: Cum jam ramus ejus tener fúerit et fólia nata, scitis, quia prope est æstas: ita et vos cum vidéritis hæc ómnia, scitóte, quia prope est in jánuis. Amen, dico vobis, quia non præteríbit generátio hæc, donec ómnia hæc fiant. Cœlum et terra transíbunt, verba autem mea non præteríbunt.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Priest, Book 4, Commentary on Matthew 24
      text: |-
        Quando ad intellegéntiam provocámur, mýsticum monstrátur esse quod dictum est. Légimus autem in Daniéle hoc modo: Et in dimídio hebdómadis auferétur sacrifícium et libámina; et in templo abominátio desolatiónum erit, usque ad consummatiónem témporis, et consummátio dábitur super solitúdinem. De hoc et Apóstolus lóquitur, quod homo iniquitátis, et adversárius elevándus sit contra omne quod dícitur Deus et cólitur; ita ut áudeat stare in templo Dei, et osténdere quod ipse sit Deus: cujus advéntus secúndum operatiónem sátanæ déstruat eos, et ad Dei solitúdinem rédigat, qui se suscéperint.

        Potest autem simpliciter aut de Antichristo accipi, aut de imagine Cæsaris, quam Pilátus pósuit in templo, aut de Hadriáni equestri státua, quæ in ipso sancto sanctórum loco usque in præséntem diem stetit. Abominátio quoque secúndum veterem Scripturam idolum nuncupátur; et idcirco additur, desolatiónis, quod in desolato templo atque destructo idolum positum sit.

        Abominátio desolatiónis intelligi potest et omne dogma perversum: quod cum vidérimus stare in loco sancto, hoc est in Ecclésia, et se osténdere Deum, debémus fugere de Judæa ad montes, hoc est, dimissa occidénte littera, et Judáica pravitáte, appropinquare móntibus ætérnis, de quibus illúminat mirabíliter Deus; et esse in tecto et in dómate, quo non possint igníta diaboli jácula perveníre, nec descéndere et tóllere aliquid de domo conversatiónis prístinæ, nec quærere quæ retrórsum sunt, sed magis sérere in agro spiritualium Scripturárum, ut fructus capiámus ex eo; nec tóllere álteram túnicam, quam Apóstoli habére prohibentur.
      responsory: |-
        R. Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.
        V. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.
        R. Plena est omnis terra glória ejus.
      status: verified
