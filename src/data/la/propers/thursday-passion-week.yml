# web/www/horas/Latin/Tempora/Quad5-4.txt): the actual proper collect
# lives at web/www/missa/Latin/Tempora/Quad5-4.txt's [Oratio], with the
# parallel English at web/www/missa/English/Tempora/Quad5-4.txt. Marked
# `draft`, not `verified` -- see monday-passion-week-collect.yml's own
# note for why (direct Missal transcription, standard closing formula
# expanded, no live Office cross-check).
collect:
  text: |
    Orémus.
    Præsta, quǽsumus, omnípotens Deus: ut dígnitas condiciónis humánæ, per immoderántiam sauciáta, medicinális parsimóniæ stúdio reformétur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft
  temporal: true

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
