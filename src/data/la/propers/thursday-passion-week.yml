benedictus-antiphon:
  text: 'Magíster dicit: * Tempus meum prope est, apud te fácio Pascha cum discípulis meis.'
  status: verified
  temporal: true

# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
