# Verified against Divinum Officium (Monastic Tridentinum 1617), Matins
# live query, 2027-05-03 -- own proper hymn ("Pange, lingua, gloriósi
# Prœlium certáminis," the opening half of the "Pange lingua" family;
# Lauds' own "Lustris sex qui jam peráctis" is the continuation of the
# same original poem, covering the Passion itself, while this Matins
# portion covers the Fall and the Incarnation instead).
matins-hymn:
  text: |-
    Pange, lingua, gloriósi
    Prœlium certáminis,
    Et super Crucis trophǽo
    Dic triúmphum nóbilem,
    Quáliter Redémptor orbis
    Immolátus vícerit.

    De paréntis protoplásti
    Fraude Factor cóndolens,
    Quando pomi noxiális
    Morsu in mortem córruit,
    Ipse lignum tunc notávit,
    Damna ligni ut sólveret.

    Hoc opus nostræ salútis
    Ordo depopóscerat,
    Multifórmis proditóris
    Ars ut artem fálleret,
    Et medélam ferret inde,
    Hostis unde lǽserat.

    Quando venit ergo sacri
    Plenitúdo témporis,
    Missus est ab arce Patris
    Natus, orbis Cónditor,
    Atque ventre virgináli
    Carne amíctus pródiit.

    Vagit infans inter arcta
    Cónditus præsépia:
    Membra pannis involúta
    Virgo Mater álligat:
    Et manus, pedésque, et crura
    Stricta cingit fáscia.

    Glória, et honor Deo
    Usqueqáque Altíssimo,
    Una Patri, Filióque;
    Inclyto Paráclito:
    Cui laus est et potéstas,
    Per ætérna sǽcula. Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2026-05-03 (fixed date, always within Paschaltide -- the
# Alleluias throughout this feast's texts are a genuine permanent
# feature, confirmed by the Vespers hymn's own "In hoc Pascháli gáudio"
# line, not seasonal contamination). Fully proper feast: own chapter
# (Phil 2:5-7), own distinct responsory/hymn/versicle at each hour.
# Duplicated verbatim under this `proper-to-the-finding-of-the-holy-
# cross` id (2026-08-26): Exaltation of the Holy Cross's own saint file
# sets `common: proper-to-the-finding-of-the-holy-cross` (not `propers`,
# which is a separate day-collect/antiphon lookup already pointing
# directly at `finding-of-the-holy-cross`) -- resolveOfficeBundle's own
# id (`exaltation-of-the-holy-cross`) has no override of its own, so it
# falls through to this `common` id specifically, which needed its own
# copy of the bundle. Same chapter reused for Vespers -- no separate
# vespers-capitulum-<id> file authored, per vespers.ts's
# lookupPart (Vespers chapter, Lauds sibling) fallback.
lauds-capitulum:
  text: 'Fratres: Hoc enim sentíte in vobis, quod et in Christo Jesu: qui, cum in forma Dei esset, non rapínam arbitrátus est esse se æquálem Deo: sed semetípsum exinanívit, formam servi accípiens, in similitúdinem hóminum factus, et hábitu invéntus ut homo.'
  citation: Phil 2:5-7
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2026-05-03 -- own proper hymn ("Lustris sex qui jam
# peractis," part of the "Pange lingua gloriosi proelium" family). See
# lauds-capitulum-proper-to-the-finding-of-the-holy-cross.yml's header.
lauds-hymn:
  text: |-
    Lustris sex qui jam peráctis,
    Tempus implens córporis,
    Se volénte natus ad hoc,
    Passióni déditus,
    Agnus in Crucis levátur
    Immolándus stípite.

    Hic acétum, fel, arúndo,
    Sputa, clavi, láncea:
    Mite corpus perforátur,
    Sanguis, unda prófluit:
    Terra, pontus, astra, mundus,
    Quo lavántur flúmine!

    Crux fidélis, inter omnes
    Arbor una nóbilis:
    Nulla silva talem profert
    Fronde, flore, gérmine:
    Dulce lignum, dulces clavos,
    Dulce pondus sústinet.

    Flecte ramos, arbor alta,
    Tensa laxa víscera,
    Et rigor lentéscat ille,
    Quem dedit natívitas:
    Ut supérni membra Regis
    Miti tendas stípite.

    Sola digna tu fuísti
    Ferre sæcli prétium,
    Atque portum præparáre
    Nauta mundo náufrago,
    Quem sacer cruor perúnxit,
    Fusus Agni córpore.

    Glória et honor Deo
    Usquequáque altíssimo:
    Una Patri, Filióque,
    Inclyto Paráclito:
    Cui laus est et potéstas
    Per ætérna sǽcula. Amen.
  status: verified

