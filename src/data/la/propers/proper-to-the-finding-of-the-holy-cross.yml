    R. Allelúia, allelúia.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Hoc signum Crucis erit in cælo: * Allelúia, allelúia.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2026-05-03 -- own proper versicle, cross-referencing
