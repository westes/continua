# Read from the reference engine: web/www/horas/Latin/Sancti/07-02cc.txt [Oratio];
# English from English/Sancti/07-02cc.txt.
collect:
  text: |
    Orémus.
    v. Deus, qui nos sanctórum Mártyrum tuórum Procéssi et Martiniáni gloriósis confessiónibus circúmdas et prótegis: da nobis et eórum imitatióne profícere, et intercessióne gaudére.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-several-martyrs; collect is the saint's own (collect-ss-processus-and-martinian.yml). Not
# independently live-verified for this category, so marked draft.
commemoration:
  text: |
    Ant. Vestri capílli cápitis * omnes numeráti sunt: nolíte timére: multis passéribus melióres estis vos.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    v. Deus, qui nos sanctórum Mártyrum tuórum Procéssi et Martiniáni gloriósis confessiónibus circúmdas et prótegis: da nobis et eórum imitatióne profícere, et intercessióne gaudére.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for Ss. Processus and Martinian, Martyrs. Sourced directly from
# web/www/horas/Latin/Sancti/07-02cc.txt, English/Sancti/07-02cc.txt.
# single lesson (Lectio93), one continuous account.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Quo témpore Petrus et Paulus tenebántur sub custódia Mamertíni in monte Tarpéjo, duo custódes, Procéssus et Martiniánus, cum áliis quadragínta, Apostolórum prædicatióne miraculísque commóti, se ad Jesu Christi fidem convertérunt; et, cum repénte fons e saxo ortus esset, baptizáti sunt. Qui permisérunt Apóstolis, ut, si vellent, abírent. Sed Paulínus mílitum præféctus, re cógnita, Procéssum et Martiniánum a suscépto consílio revocáre conátur. Qui, cum frustra tempus contéreret, ipsórum ora saxo contúndi dentésque commínui jubet. Mox ad Jovis státuam addúctos, cum eádem constántia veneratúros se idóla negárent, ímperat equúleo torquéri, candéntibus láminis ad eórum corpus admótis, ac cædi fústibus; quibus in cruciátibus una hæc illórum vox audiebátur: Sit nomen Dómini benedíctum. Dénique conjécti in cárcerem, paulo post extra Urbem via Aurélia secúri feriúntur. Quorum córpora Lucína in prǽdio suo sepelívit, sexto Nonas Júlii; quæ póstea, in Urbem transláta, in basílica Príncipis Apostolórum cóndita sunt.'
      status: verified
