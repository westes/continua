# Nocturn 2-3, Third Sunday of Lent (temporalId lent-3). Sourced from
# Tempora/Quad3-0.txt (Latin) / English/Tempora/Quad3-0.txt. See
# advent-1.yml/lent-1.yml for the general sweep method.
#
# Nocturn 2 (Lectio4-6): one continuous excerpt from St. Ambrose's book On
# Holy Joseph, chapter 1. Responsory: Lectio4's own (Responsory4, "Videns
# Jacob vestiménta Joseph").
#
# Nocturn 3 (Lectio7-9): Lectio7 carries real homily prose after its bare
# Gospel incipit (Luke 11:14-28, the healing of the mute demoniac, "Et
# réliqua") - the Venerable Bede's Commentary on Luke, Book 4, begins
# within Lectio7 itself, same pattern used throughout this sweep. Combined
# Lectio7's homily portion (incipit dropped) with Lectio8-9, using
# Responsory7 ("Mérito hæc pátimur") - the first responsory of the group
# the combined reading spans.
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Bishop of Milan, On Holy Joseph
      text: |-
        Sanctórum vita céteris norma vivéndi est. Ideóque digéstam plénius accépimus sériem Scripturárum; ut dum Abraham, Isaac, et Jacob, ceterósque justos legéndo cognóscimus, velut quemdam nobis innocéntiæ trámitem, virtúte eórum reserátum imitántibus vestígiis persequámur. De quibus mihi cum frequens tractátus fúerit, hódie sancti Joseph história occúrrit: in quo cum plúrima fúerint génera virtútum, præcípue tamen insígne effúlsit castimóniæ. Justum est ígitur, ut cum in Abraham didicéritis ímpigram fídei devotiónem, in Isaac sincéræ mentis puritátem, in Jacob singulárem ánimi laborúmque patiéntiam: ex illa generalitáte virtútum in ipsas spécies disciplinárum intendátis ánimum.

        Sit ígitur nobis propósitus sanctus Joseph tamquam spéculum castitátis. In ejus enim móribus, in ejus áctibus lucet pudicítia, et quidam splendet castimóniæ comes, nitor grátiæ. Unde étiam a paréntibus plus quam céteri fílii diligebátur. Sed ea res invídiæ fuit: quod siléntio prætereúndum non fuit: hinc enim arguméntum totíus históriæ procéssit: simul ut cognoscámus, perféctum virum non movéri ulciscéndi dolóris invídia, nec malórum repéndere vicem. Unde et David ait: Si réddidi retribuéntibus mihi mala.

        Quid autem esset, quod præférri Joseph mererétur céteris, si aut lædéntes læsísset, aut diligéntes dilexísset? Hoc enim pleríque fáciunt. Sed illud mirábile, si díligas inimícum tuum: quod Salvátor docet. Jure ergo mirándus, qui hoc fecit ante Evangélium, ut læsus párceret, appetítus ignósceret, vénditus non reférret injúriam, sed grátiam pro contumélia sólveret: quod post Evangélium omnes didícimus, et serváre non póssumus. Discámus ergo et Sanctórum invídiam, ut imitémur patiéntiam: et cognoscámus, illos non natúræ præstantióris fuísse, sed observantióris: nec vítia nescísse, sed emendásse. Quod si invídia étiam Sanctos adússit, quanto magis cavéndum est, ne inflámmet peccatóres?
      responsory: |-
        R. Videns Jacob vestiménta Joseph, scidit vestiménta sua cum fletu, et dixit: * Fera péssima devorávit fílium meum Joseph.
        V. Tulérunt autem fratres ejus túnicam illíus, mitténtes ad patrem: quam cum cognovísset pater, ait.
        R. Fera péssima devorávit fílium meum Joseph.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 11:14-28
      text: 'In illo témpore: Erat Jesus ejíciens dæmónium, et illud erat mutum. Et cum ejecísset dæmónium, locútus est mutus, et admirátæ sunt turbæ. Quidam autem ex eis dixérunt: In Beélzebub, príncipe dæmoniórum, éjicit dæmónia. Et álii tentántes, signum de cœlo quærébant ab eo. Ipse autem ut vidit cogitatiónes eórum, dixit eis: Omne regnum in seípsum divísum desolábitur, et domus supra domum cadet. Si autem et sátanas in seípsum divísus est, quómodo stabit regnum ejus? quia dícitis, in Beélzebub me ejícere dæmónia. Si autem ego in Beélzebub ejício dæmónia: fílii vestri in quo ejíciunt? Ideo ipsi júdices vestri erunt. Porro si in dígito Dei ejício dæmónia: profécto pervénit in vos regnum Dei. Cum fortis armátus custódit átrium suum, in pace sunt ea, quæ póssidet. Si autem fórtior eo supervéniens vícerit eum, univérsa arma ejus áuferet, in quibus confidébat, et spólia ejus distríbuet. Qui non est mecum, contra me est: et qui non cólligit mecum, dispérgit. Cum immúndus spíritus exíerit de hómine, ámbulat per loca inaquósa, quærens réquiem: et non invéniens, dicit: Revértar in domum meam, unde exívi. Et cum vénerit, invénit eam scopis mundátam, et ornátam. Tunc vadit, et assúmit septem álios spíritus secum nequióres se, et ingréssi hábitant ibi. Et fiunt novíssima hóminis illíus pejóra prióribus. Factum est autem, cum hæc díceret: extóllens vocem quædam múlier de turba, dixit illi: Beátus venter, qui te portávit, et úbera, quæ suxísti. At ille dixit: Quinímmo beáti, qui áudiunt verbum Dei, et custódiunt illud.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: The Venerable Bede, Priest of Jarrow, Commentary on Luke, Book 4
      text: |-
        Dæmoníacus iste apud Matthǽum non solum mutus, sed et cæcus fuísse narrátur: curatúsque dícitur a Dómino, ita ut loquerétur, et vidéret. Tria ergo signa simul in uno hómine perpetráta sunt: cæcus videt, mutus lóquitur, posséssus a dǽmone liberátur. Quod et tunc quidem carnáliter factum est, sed et cotídie complétur in conversióne credéntium: ut, expúlso primum dǽmone, fídei lumen aspíciant; deínde ad laudes Dei tacéntia prius ora laxéntur. Quidam autem ex eis dixérunt: in Beélzebub príncipe dæmoniórum éicit dæmónia. Non hæc áliqui de turba, sed pharisǽi calumniabántur, et scribæ, sicut álii Evangelístæ testántur.

        Turbis quippe, quæ minus erudítæ videbántur, Dómini semper facta mirántibus; illi contra, vel negáre hæc, vel quæ negáre nequíverant, sinístra interpretatióne pervértere laborábant: quasi non hæc divinitátis, sed immúndi spíritus ópera fuíssent. Et álii tentántes, signum de cælo quærébant ab eo. Vel in morem Elíæ ignem de sublími veníre cupiébant; vel in similitúdinem Samuélis témpore æstívo mugíre tonítrua, coruscáre fúlgura, imbres rúere: quasi non possent et illa calumniári, et dícere, ex occúltis et váriis aëris passiónibus accidísse. At tu, qui calumniáris ea, quæ óculis vides, manu tenes, utilitáte sentis; quid féceris de iis, quæ de cælo vénerint? Utique respondébis, et magos in Ægýpto multa signa fecísse de cælo.

        Ipse autem ut vidit cogitatiónes eórum, dixit eis: Omne regnum in seípsum divísum desolábitur, et domus supra domum cadet. Non ad dicta, sed ad cogitáta respóndit: ut vel sic compelleréntur crédere poténtiæ ejus, qui cordis vidébat occúlta. Si autem omne regnum in seípsum divísum desolátur; ergo Patris et Fílii et Spíritus Sancti regnum non est divísum; quod sine ulla contradictióne, non áliquo impúlsu desolándum, sed ætérna est stabilitáte mansúrum. Si autem sátanas in seípsum divísus est: quómodo stabit regnum ipsíus, quia dícitis, in Beélzebub ejícere me dæmónia? Hoc dicens, ex ipsórum confessióne volébat intélligi, quod in eum non credéndo, in regno diáboli esse elegíssent, quod útique advérsum se divísum stare non posset.
      responsory: |-
        R. Mérito hæc pátimur, quia peccávimus in fratrem nostrum, vidéntes angústias ánimæ ejus, dum deprecarétur nos, et non audívimus: * Idcírco venit super nos tribulátio.
        V. Dixit Ruben frátribus suis: Numquid non dixi vobis, Nolíte peccáre in púerum; et non audístis me?
        R. Idcírco venit super nos tribulatio.
      status: verified
