# Nocturn 3, 20th Sunday after Pentecost. Sourced from Tempora/Pent20-0.txt.
# See post-pentecost-02.yml/post-pentecost-12.yml for sweep method note (no
# proper Nocturn 2 in the source). Lectio7 bare incipit (John 4:46-53, the
# healing of the nobleman's son) skipped; Lectio7-9's homily by Pope St.
# Gregory the Great is one continuous work, combined.
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Joannes 4:46-53
      text: 'In illo témpore: Erat quidam régulus, cujus fílius infirmabátur Caphárnaum. Hic cum audísset, quia Jesus adveníret a Judǽa in Galilǽam, ábiit ad eum, et rogábat eum, ut descénderet et sanáret fílium ejus: incipiébat enim mori. Dixit ergo Jesus ad eum: Nisi signa et prodígia vidéritis, non créditis. Dicit ad eum régulus: Dómine, descénde, priúsquam moriátur fílius meus. Dicit ei Jesus: Vade, fílius tuus vivit. Crédidit homo sermóni, quem dixit ei Jesus, et ibat. Jam autem eo descendénte, servi occurrérunt ei et nuntiavérunt, dicéntes, quia fílius ejus víveret. Interrogábat ergo horam ab eis, in qua mélius habúerit. Et dixérunt ei: Quia heri hora séptima relíquit eum febris. Cognóvit ergo pater, quia illa hora erat, in qua dixit ei Jesus: Fílius tuus vivit: et crédidit ipse et domus ejus tota.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 28 on the Gospels
      text: |-
        Léctio sancti Evangélii, quam modo, fratres, audístis, expositióne non índiget: sed ne hanc táciti præteriísse videámur, exhortándo pótius quam exponéndo in ea áliquid loquámur. Hoc autem nobis solúmmodo de expositióne vídeo esse requiréndum, cur is, qui ad salútem fílio peténdam vénerat, audívit: Nisi signa et prodígia vidéritis, non créditis. Qui enim salútem fílio quærébat, proculdúbio credébat; neque enim ab eo quǽreret salútem, quem non créderet Salvatórem. Quare ergo dícitur: Nisi signa et prodígia vidéritis, non créditis: qui ante crédidit, quam signa vidéret?

        Sed mementóte quid pétiit; et apérte cognoscétis, quia in fide dubitávit. Popóscit namque, ut descénderet et sanáret fílium ejus. Corporálem ergo præséntiam Dómini quærébat, qui per spíritum nusquam déerat. Minus ítaque in illum crédidit, quem non putávit posse salútem dare, nisi præsens esset et córpore. Si enim perfécte credidísset, proculdúbio sciret, quia non esset locus ubi non esset Deus.

        Ex magna ergo parte diffísus est, qui virtútem non dedit majestáti, sed præséntiæ corporáli. Salútem ítaque fílio pétiit, et tamen in fide dubitávit; quia eum ad quem vénerat, et poténtem ad curándum crédidit, et tamen moriénti fílio esse abséntem putávit. Sed Dóminus, qui rogátur ut vadat, quia non desit ubi invitátur, índicat: solo jussu salútem réddidit, qui voluntáte ómnia creávit.
      responsory: |-
        R. Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.
        V. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.
        R. Plena est omnis terra glória ejus.
      status: verified
