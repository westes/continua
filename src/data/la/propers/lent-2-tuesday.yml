# Matins Nocturn content for Tuesday of Lent week 2 — read from
# web/www/horas/{Latin,English}/Tempora/Quad2-2.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad2-2.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Jerome
# excerpt split only to fill the fixed 3-lesson slot count). Responsory1
# is a cross-reference (@Tempora/Quad2-0:Responsory4).
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Matt 23:1-12
      text: 'In illo témpore: Locútus est Jesus ad turbas et ad discípulos suos, dicens: Super cáthedram Móysi sedérunt scribæ et pharisǽi. Omnia ergo, quæcúmque díxerint vobis, serváte et fácite: secúndum ópera vero eórum nolíte fácere: dicunt enim, et non fáciunt. Alligant enim ónera grávia et importabília, et impónunt in húmeros hóminum: dígito autem suo nolunt ea movére. Omnia vero ópera sua fáciunt, ut videántur ab homínibus: dilátant enim phylactéria sua, et magníficant fímbrias. Amant autem primos recúbitus in cenis, et primas cáthedras in synagógis, et salutatiónes in foro, et vocári ab homínibus Rabbi. Vos autem nolíte vocári Rabbi: unus est enim Magíster vester, omnes autem vos fratres estis. Et patrem nolíte vocáre vobis super terram, unus est enim Pater vester, qui in cœlis est. Nec vocémini magístri: quia Magíster vester unus est, Christus. Qui major est vestrum, erit miníster vester. Qui autem se exaltáverit, humiliábitur: et qui se humiliáverit, exaltábitur.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Jerome, Priest, Book 4, Commentary on Matthew, ch. 23
      text: |-
        Quid mansuétius, quid benígnius Dómino? Tentátur a pharisǽis, confringúntur insídiæ eórum, et secúndum Psalmístam: Sagíttæ parvulórum factæ sunt plagæ eórum: et nihilóminus propter sacerdótii et nóminis dignitátem hortátur pópulos, ut subiciántur eis, non ópera, sed doctrínam considerántes. Quod autem ait, Super cáthedram Móysi sedérunt scribæ et pharisǽi: per cáthedram, doctrínam Legis osténdit. Ergo et illud quod dícitur in Psalmo: In cáthedra pestiléntiæ non sedit: et, Cáthedras vendéntium colúmbas evértit: doctrínam debémus accípere.

        Alligant enim ónera grávia et importabília, et impónunt in húmeros hóminum, dígito autem suo nolunt ea movére. Hoc generáliter advérsus omnes magístros, qui grávia jubent, et minóra non fáciunt. Notándum autem, quod et húmeri, et dígitus, et ónera, et víncula quibus alligántur ónera, spirituáliter intellegénda sunt. Omnia vero ópera sua fáciunt, ut videántur ab homínibus. Quicúmque ígitur ita facit quódlibet, ut videátur ab homínibus, scriba et pharisǽus est.

        Dilátant enim phylactéria sua, et magníficant fímbrias. Amant quoque primos recúbitus in cenis, et primas cáthedras in synagógis, et salutatiónes in foro, et vocári ab homínibus Rabbi. Væ nobis míseris, ad quos pharisæórum vítia transiérunt. Dóminus cum dedísset mandáta Legis per Móysen, ad extrémum íntulit: Ligábis ea in manu tua, et erunt immóta ante óculos tuos. Et est sensus: Præcépta mea sint in manu tua, ut ópere compleántur: sint ante óculos tuos, ut die ac nocte meditéris in eis. Hoc pharisǽi male interpretántes, scribébant in membránis decálogum Móysi, id est, decem verba Legis, complicántes ea et ligántes in fronte, et quasi corónam cápiti faciéntes: ut semper ante óculos moveréntur.
      responsory: |-
        R. Dum exíret Jacob de terra sua, vidit glóriam Dei, et ait: Quam terríbilis est locus iste! * Non est hic áliud, nisi domus Dei, et porta cæli.
        V. Vere Deus est in loco isto, et ego nesciébam.
        R. Non est hic áliud, nisi domus Dei, et porta cæli.
      status: verified
