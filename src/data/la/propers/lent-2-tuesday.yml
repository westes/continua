# Lauds collect ([Oratio 2] in the source) — read from
# web/www/horas/{Latin,English}/Tempora/Quad2-2.txt.
collect:
  text: |
    Orémus.
    Pérfice, quǽsumus, Dómine, benígnus in nobis observántiæ sanctæ subsídium: ut, quæ te auctóre faciénda cognóvimus, te operánte impleámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Vespers collect ([Oratio 3] in the source), distinct from Lauds' own —
# read from web/www/horas/{Latin,English}/Tempora/Quad2-2.txt.
collect/~-vespers:
  text: |
    Orémus.
    Propitiáre, Dómine, supplicatiónibus nostris, et animárum nostrárum medére languóribus: ut, remissióne percépta, in tua semper benedictióne lætémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

