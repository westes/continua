# Read directly from web/www/horas/Latin/Sancti/10-19.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui beátum Petrum Confessórem tuum admirábilis pœniténtiæ et
    altíssimæ contemplatiónis múnere illustráre dignátus es: da nobis,
    quǽsumus; ut, ejus suffragántibus méritis, carne mortificáti,
    facílius cæléstia capiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-confessor (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). st-peter-of-alcantara has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-peter-of-alcantara-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui beátum Petrum Confessórem tuum admirábilis pœniténtiæ et
    altíssimæ contemplatiónis múnere illustráre dignátus es: da nobis,
    quǽsumus; ut, ejus suffragántibus méritis, carne mortificáti,
    facílius cæléstia capiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. Peter of Alcantara, Confessor
# (Oct 19). Sourced directly from
# web/www/horas/Latin/Sancti/10-19.txt, English/Sancti/10-19.txt.
# Lectio4-6 combined into one reading, one continuous vita. No
# Lectio7-9 own content (a direct `@Commune/C5:LectioN in 2 loco`
# cross-reference) -- not transcribed, per the bare-cross-reference
# convention.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Petrus, Alcántaræ in Hispánia nobílibus paréntibus natus, a teneris annis futuræ sanctitátis indícia prǽbuit. Décimo sexto ætátis anno ordinem Minórum ingréssus, se ómnium virtutum exemplar exhibuit. Tum munus concionatoris ex obediéntia exercens, innumeros a vitiis ad veram pœniténtiam traduxit. Primævum sancti Francisci institutum exactíssime reparáre cupiens, ope divina fretus et apostolica munítus auctoritate, angustíssimum et pauperrimum cœnobium juxta Pedrósum fundávit; quod vitæ genus asperrimum, ibi feliciter cœptum, per diversas Hispaniæ provincias usque ad Indias mirifice propagátum fuit. Sanctæ Teresiæ, cujus probaverat spíritum, in promovenda Carmelitárum reformatióne adjútor fuit. Ipsa autem, a Deo edocta quod Petri nómine nihil quisquam péteret quin prótinus exaudirétur, ejus precibus se commendare et ipsum, adhuc viventem, sanctum appellare consuevit.

        Principium obsequia, qui ipsum velut oraculum consulébant, summa humilitate declinans, Cárolo quinto imperatóri a confessiónibus esse recusávit. Paupertátis rigidíssimus custos, una tunia, qua nulla deterior esset, contentus erat. Puritátem ita coluit, ut a fratre in extremo morbo sibi inserviénte ne leviter quidem tangi passus sit. Corpus suum perpetuis vigiliis, jejuniis, flagellis, frigore, nuditate atque omni genere asperitátum in servitútem redégit; cum quo pactum iníerat ne ullam in hoc sæculo ei requiem præbéret. Caritas Dei et próximi, in ejus corde diffúsa, tantum quandoque excitábat incendium, ut e cellæ angustiis in apertum campum prosilire, aërisque refrigerio conceptum ardórem temperare cogerétur.

        Gratia contemplatiónis admirábilis in eo fuit: qua cum assidue spíritus reficerétur, intérdum áccidit ut ab omni cibo et potu plúribus diébus abstinúerit. In áëra frequenter sublatus, miro fulgóre coruscare visus est. Rápidos flúvios sicco pede trajecit. Fratres in extrema penuria, cælitus deláta alimónia, cibávit. Báculus, ab ipso terræ defixus, mox in viridem ficulneam excrevit. Cum noctu iter ágeret, densa nive cadente, dírutam domum sine tecto ingréssus est, eique nix in áëre péndula pro tecto fuit, ne illíus copia suffocarétur. Dono prophetíæ ac discretiónis spirituum imbutum fuísse sancta Teresia testátur. Denique, annum agens sexagesimum tertium, hora qua prædixerat, migrávit ad Dóminum, mirábili visióne Sanctorúmque præséntia confortatus. Quem eodem momento in cælum ferri beáta Teresia procul distans vidit; cui póstea appárens dixit: O felix pœniténtia, quæ tantam mihi promeruit glóriam!
      status: verified
