# Matins Nocturn 2-3 readings for St. Matthew, Apostle, Evangelist
# (Sep 21) — SanctiM/09-21.txt inherits the whole day (`@Sancti/09-21`)
# with no Nocturn 2/3 override, so this saint's own proper content is
# sourced from the Tridentine track exactly as for a pre-1955 saint
# (see memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/09-21.txt, English/Sancti/09-21.txt.
#
# Nocturn 2: Lectio4-5 combined into one reading, one continuous vita
# — Lectio6 falls back to Common of an Evangelist, not proper text, so
# not authored here.
# Nocturn 3: Lectio7's Gospel citation (Matt 9:9-13) was a bare incipit
# ("Et réliqua") with no full pericope text given; the full pericope
# is now authored too (isGospel: true, immediately before the homily)
# — sourced from this same day's own Missale [Evangelium]
# (`web/www/missa/Latin/Sancti/09-21.txt`, English/Sancti/09-21.txt),
# not guessed at (2026-09-05 update). The homily portion remains a
# single excerpt of St. Jerome's commentary. No responsory given for
# either reading.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Matthǽus, qui et Levi, Apóstolus et Evangelísta, Caphárnai cum ad telónium sedéret, a Christo vocátus, statim secútus est ipsum; quem étiam cum réliquis discípulis convívio excépit. Post Christi resurrectiónem, ántequam in provínciam proficiscerétur, quæ ei ad prædicándum obtígerat, primus in Judǽa, propter eos qui ex circumcisióne credíderant, Evangélium Jesu Christi Hebráice scripsit. Mox in Æthiópiam proféctus, Evangélium prædicávit, ac prædicatiónem multis miráculis confirmávit.

        Illo ígitur in primis miráculo, quo regis fíliam a mórtuis excitávit, regem patrem et uxórem ejus cum univérsa província ad Christi fidem convértit. Rege mórtuo, Hírtacus, ejus succéssor, cum Iphigeníam, régiam fíliam, vellet sibi dari in matrimónium; Matthǽum, cujus ópera illa virginitátem Deo vóverat et in sancto propósito perseverábat, ad altáre mystérium celebrántem jussit occídi. Qui undécimo caléndas octóbris munus apostólicum martýrii glória cumulávit. Cujus corpus Salérnum translátum, ac póstmodum in ecclésia ejus nómine dedicáta, Gregório séptimo summo Pontífice, cónditum, ibídem magno hóminum concúrsu ac pietáte cólitur.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 9:9-13
      text: 'In illo témpore: Vidit Jesus hóminem sedéntem in telónio, Matthǽum nómine. Et ait illi: Séquere me. Et surgens, secútus est eum. Et factum est, discumbénte eo in domo, ecce, multi publicáni et peccatóres veniéntes, discumbébant cum Jesu, et discípulis ejus. Et vidéntes pharisǽi, dicébant discípulis ejus: Quare cum publicánis et peccatóribus mandúcat Magíster vester? At Jesus áudiens, ait: Non est opus valéntibus médicus, sed male habéntibus. Eúntes autem díscite quid est: Misericórdiam volo, et non sacrifícium. Non enim veni vocáre justos, sed peccatóres.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Priest, Commentary on Matthew, Bk. 1 (on Matt 9:9-13)
      text: 'Céteri Evangelístæ, propter verecúndiam et honórem Matthǽi, noluérunt eum nómine appelláre vulgáto, sed dixérunt, Levi; dúplici quippe vocábulo fuit. Ipse autem Matthǽus (secúndum illud quod dícitur a Salomóne: Justus accusátor est sui in princípio sermónis; et in álio loco: Dic tu peccáta tua, ut justificéris) Matthǽum se et publicanum nóminat, ut osténdat legéntibus nullum debére salútem desperáre, si ad melióra convérsus sit, cum ipse de publicáno in Apóstolum sit repénte mutátus.'
      status: verified
