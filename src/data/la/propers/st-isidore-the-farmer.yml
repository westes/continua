# Read directly from `Sancti/aliquibus locis/05-15-Isidorus.txt`'s own
# [Oratio] (the same text as `Sancti/10-25n.txt`'s, whose
# `English/Sancti/10-25n.txt` translation is used here).
collect:
  text: |
    Orémus.
    Da nobis, quǽsumus, miséricors Deus, beáto Isidóro Agrícola Confessóre tuo
    intercedénte, supérbe non sápere: sed ejus méritis et exémplis plácita tibi semper
    humilitáte deservíre.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Ant+V/R+collect commemoration bundle. Ant 2 is the source's own proper
# `[Ant 2]` from `Sancti/10-25n.txt` ("Exiit qui séminat...", the Sower
# parable), not a generic Common substitution -- a real proper antiphon.
# Versicle is the standard Common of a Confessor Not a Pontiff (C5)
# de-Communi pairing (lauds-versicle-common-of-a-confessor.yml), since the
# source's own file has no distinct [Versum 2] of its own.
commemoration:
  text: |
    Ant. Exiit qui séminat * semináre semen suum, et áliud cécidit in terram bonam, et ortum fecit fructum céntuplum.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Da nobis, quǽsumus, miséricors Deus, beáto Isidóro Agrícola Confessóre tuo intercedénte, supérbe non sápere: sed ejus méritis et exémplis plácita tibi semper humilitáte deservíre.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Matins Nocturn 2 and 3 readings for St. Isidore the Farmer, Confessor.
# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-15-Isidorus.txt
# (the traditional May 15 office, Duplex, 9 lectiones). Nocturn 2 is
# Lectio4-6 combined into one continuous vita; this older, fuller vita
# replaces the short US-patronal [Lectio94] summary from `Sancti/10-25n.txt`
# the previous build used (that summary's last sentence, Pius XII's 1947
# declaration of him as patron of US farmers, is therefore no longer
# carried). Nocturn 3 is the source's gospel incipit (John 15, "Ego sum
# vitis vera") and Lectio7-9: St. Gregory's homily on it, then the
# continuation the source gives under the same heading.
#
# No English exists in the reference engine for the aliquibus-locis files
# (English/Sancti has no regional subdirectories at all); the English below
# is this project's own translation, marked draft. Latin is verbatim from
# the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Isidórus Agrícola prope Matrítum Hispániæ urbem, in qua natus fúerat, mercéde coléndis agris condúctus, brevi magnárum sibi virtútum eo in exercítio ubérrimam ségetem parávit. Admirábilis enim Christi ac sanctórum imitátor, numquam ad opus mane se conferébat, nisi prius Dei regnum studióse quæreret, ecclesiásque in ipsíus ac Deíparæ honórem dicátas visitáret. Quare cum illíus moram agri dóminus gráviter ferret, atque ex editióre loco quadam die, ut eum libérius increpáret, Agricolam operirétur, binos Angelos cándida veste dúplici boum jugo arántes, mediúmque inter illos Isidórum conspéxit. Quo miráculo vulgáto, magno deinceps honóri tam apud herum quam apud céteros hómines habéri cœpit.

        Caritáte in páuperes ádeo flagravit, ut mercédem quam labóribus parábat, egéntibus erogáret. Quin étiam cum aliquándo ad commúne cum réliquis confrátribus prándium plúrimos paúperes adduxísset, nihilque áliud, prándio scilicet finíto, quam pulménti partem sibi reservátam reperisset, illam vir Dei, fide singulári fretus, ita distribuit, ut admirabiliter aucta iis ómnibus aléndis saturandisque sufficeret. Illud étiam inter cétera mirándum, quod per æstivos calóres ad exstinguéndam in agro sitim, aquæ potum hero flagitánte, cum núllibi scatéret, Isidórus stímulo quem gerébat, humo percússa, úberem ex ea et perénnem ad hæc usque témpora fontem elícuit.

        Igitur sanctitáte clarus, cum ad últimam senectútem pervenísset, obdormívit in Dómino, et in cœmetério sancti Andréæ sepúltus, tamdiu ibi jacuit, quoad cives de ipsíus córpore honéstius in ecclésia collocándo divínitus móniti, illud in lóculo integrum atque ádeo incorrúptum invenérunt, ut ex eo suavissimus odor, qui hac étiam tempestáte perdúrat, effláret. Sacrum corpus in ecclésiam translátum, et in editiore loco situm, máximis Deus miráculis illustrávit. Quorum beneficéntiam non semel tam ipsa Matríti cívitas, quam étiam cætera Hispánia loca, ope ipsíus imploráta, persensérunt. Quem postrémo post annos fere quadringéntos fama sanctitátis ac miráculis illústrem, Gregórius décimus quintus in sanctórum númerum rétulit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Joan 15:1 et seq.
      text: 'In illo témpore: Dixit Jesus discípulis suis: Ego sum vitis vera, et Pater meus agrícola est, Et réliqua.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Gregory the Great (Reg., bk. 7, ep. 32; Tract. on the penitential psalms, at Ps. 6, as cited in the source)
      text: |-
        Per semetípsam Véritas dicit: Pater meus agricola est : et omnem pálmitem, in me non ferentem fructum, tollet eum : omnem vero, qui fert fructum, purgabit eum, ut fructum plus áfferat. Palmes enim infructuósus tollitur, quia peccátor fúnditus eradicátur. Palmes vero fructuósus purgari dicitur, quia per disciplinam reciditur ut ad uberiórem grátiam perducátur. Sic enim spicárum grana tribulis attrita , aristis et paleis mundántur : sic olívæ prelo pressæ, in ólei pinguédinem défluunt : sic botri vinearum pressi cálcibus in vinum liquéscunt.

        Qui manet in verbo, non fraudátur a regno. Aliter namque fructum fácere non póssumus, nisi in eo maneámus. Ideóque ait: Manéte in me, et ego in vobis. Ubi enim manéndum nisi in ipso ? Deficient domus, palátia córruent, destruéntur civitátes, ab imis sédibus turres evelléntur : Verbum autem Dómini manet in ætérnum. Maneámus ergo in eo, qui manet in ætérnum.

        Non sequámur vanitátem, deseréntes veritátem : nec contristémur sicut cæteri, qui spem non habent. sed sustineámus eum. Et si moram fécerit exspectémus, ne contingat nobis quod per Prophétam dícitur : Væ his qui perdidérunt sustinéntiam. Quicúmque mundánæ adversitátis fractus moléstiis, diabólicæ tentatiónis infestatióne dejéctus, a spe cœlestium promissiónum deciderit, sustinéntiæ, quam prius habúerat, mercédem amíttet : qui vero sustinébit, magnam reportábit remunerationem.
      status: verified
