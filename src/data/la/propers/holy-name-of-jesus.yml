# Read from web/www/horas/Latin/Tempora/Nat2-0.txt and its English
# counterpart's own [Oratio].
collect:
  text: |
    Orémus.
    Deus, qui unigénitum Fílium tuum constituísti humáni géneris Salvatórem, et Jesum vocári jussísti: concéde propítius; ut, cujus sanctum nomen venerámur in terris, ejus quoque aspéctu perfruámur in cælis.
    Per eúmdem Dóminum nostrum Jesum Christum Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

# Read from web/www/horas/Latin/Tempora/Nat2-0.txt's own [Hymnus
# Matutinum] ("Jesu, Rex admirábilis") and its English counterpart -- the
# second of the three-part "Jesu dulcis memoria" hymn cycle traditionally
# divided across Vespers/Matins/Lauds of this feast (see the -vespers- and
# -lauds- sibling files for the other two parts).
matins-hymn:
  text: |
    Jesu, Rex admirábilis,
    Et triumphátor nóbilis,
    Dulcédo ineffábilis,
    Totus desiderábilis.

    Quando cor nostrum vísitas,
    Tunc lucet ei véritas,
    Mundi viléscit vánitas,
    Et intus fervet cáritas.

    Jesu, dulcédo córdium,
    Fons vivus, lumen méntium,
    Excédens omne gáudium,
    Et omne desidérium.

    Jesum omnes agnóscite,
    Amórem ejus póscite:
    Jesum ardénter quǽrite,
    Quæréndo inardéscite.

    Te nostra, Jesu, vox sonet,
    Nostri te mores éxprimant,
    Te corda nostra díligant,
    Et nunc, et in perpétuum.
    Amen.
  status: verified

# Read from web/www/horas/Latin/Tempora/Nat2-0.txt's own [Invit] and its
# English counterpart.
matins-invitatory:
  text: Admirábile nomen Jesu, quod est super omne nomen, * Veníte, adorémus.
  status: verified

# Read from web/www/horas/Latin/Tempora/Nat2-0.txt's own [Capitulum
# Laudes] and its English counterpart. Also serves Vespers (see
# hours/vespers.ts's lookupPart (Vespers chapter, Lauds sibling)) -- no distinct
# `vespers-capitulum-holy-name-of-jesus` file exists in the source
# either, same pattern as every other feast authored so far.
lauds-capitulum:
  text: 'Fratres: Christus humiliávit semetípsum, factus obédiens usque ad mortem, mortem autem crucis. Propter quod et Deus exaltávit illum, et donávit illi nomen, quod est super omne nomen, ut in nómine Jesu omne genu flectátur.'
  citation: Phil 2:8-10
  status: verified

# Read from web/www/horas/Latin/Tempora/Nat2-0.txt's own [Hymnus Laudes]
# ("Jesu, decus angélicum") and its English counterpart -- the third of
# the three-part "Jesu dulcis memoria" hymn cycle (see the -matins- and
# -vespers- sibling files for the other two parts).
lauds-hymn:
  text: |
    Jesu, decus angélicum,
    In aure dulce cánticum,
    In ore mel miríficum,
    In corde nectar cǽlicum.

    Qui te gustant, esúriunt;
    Qui bibunt, adhuc sítiunt;
    Desideráre nésciunt,
    Nisi Jesum, quem díligunt.

    O Jesu mi dulcíssime,
    Spes suspirántis ánimæ!
    Te quærunt piæ lácrimæ,
    Te clamor mentis íntimæ.

    Mane nobíscum, Dómine,
    Et nos illústra lúmine;
    Pulsa mentis calígine,
    Mundum reple dulcédine.

    Jesu, flos Matris Vírginis,
    Amor nostræ dulcédinis,
    Tibi laus, honor nóminis,
    Regnum beatitúdinis.
    Amen.
  status: verified

# Read from web/www/horas/Latin/Tempora/Nat2-0.txt's own [Versum 2]
# ("@:Versum Nona: s/[\,\.] al.*/./ig" -- reuses [Versum Nona]'s own text
# with the trailing ", allelúia" stripped) and its English counterpart,
# same transform applied.
lauds-versicle:
  text: |-
    V. Adjutórium nostrum in nómine Dómini.
    R. Qui fecit cælum et terram.
  status: verified

# Sourced from web/www/horas/Latin/Tempora/Nat2-0.txt's own [Lectio Prima] and its
# English counterpart.
prime-lectio:
  text: 'Omne quodcúmque fácitis in verbo, aut in ópere: ómnia in nómine Dómini Jesu Christi fácite, grátias agéntes Deo et Patri per ipsum.'
  citation: Col 3:17
  status: verified
  temporal: true

# Read from web/www/horas/Latin/Tempora/Nat2-0.txt's own [Hymnus
# Vespera] ("Jesu, dulcis memória") and its English counterpart -- the
# first of the three-part "Jesu dulcis memoria" hymn cycle (see the
# -matins- and -lauds- sibling files for the other two parts).
vespers-hymn:
  text: |
    Jesu, dulcis memória,
    Dans vera cordis gáudia:
    Sed super mel, et ómnia,
    Ejus dulcis præséntia.

    Nil cánitur suávius,
    Nil audítur jucúndius,
    Nil cogitátur dúlcius,
    Quam Jesus Dei Fílius.

    Jesu, spes pœniténtibus,
    Quam pius es peténtibus!
    Quam bonus te quæréntibus!
    Sed quid inveniéntibus?

    Nec lingua valet dícere,
    Nec líttera exprímere:
    Expértus potest crédere,
    Quid sit Jesum dilígere.

    Sis, Jesu, nostrum gáudium,
    Qui es futúrus prǽmium:
    Sit nostra in te glória,
    Per cuncta semper sǽcula.
    Amen.
  status: verified

# Read from web/www/horas/Latin/Tempora/Nat2-0.txt's own [Versum 1] and
# its English counterpart.
vespers-versicle:
  text: |-
    V. Sit nomen Dómini benedíctum, allelúia.
    R. Ex hoc nunc et usque in sǽculum, allelúia.
  status: verified

# Read from web/www/horas/Latin/Tempora/Nat2-0.txt's own [Ant 2] (the
# antiphon slotted after [Hymnus Laudes], i.e. Lauds' own Benedictus
# antiphon) and its English counterpart. The source also carries a
# distinct [Ant 3] ("Thou shalt call his Name Jesus...") for Second
# Vespers' own Magnificat antiphon -- not modeled here, same reason as
# circumcision-benedictus-antiphon.yml's own note.
benedictus-antiphon:
  text: Dedit se, * ut liberáret pópulum, et acquíreret sibi nomen ætérnum, allelúia.
  status: verified
  temporal: true

# Read from web/www/horas/Latin/Tempora/Nat2-0.txt's own [Ant 1] (the
# antiphon slotted between the day's [Versum 1] and [Oratio], i.e. First
# Vespers' own Magnificat antiphon) and its English counterpart.
magnificat-antiphon:
  text: Fecit * mihi magna qui potens est, et sanctum Nomen ejus, allelúia.
  status: verified
  temporal: true

# Read from web/www/horas/Latin/Tempora/Nat2-0.txt's own [Ant Laudes] (5
# antiphons, a real proper set for this feast, unlike Circumcision's own
# borrowed-from-Vespers set) and its English counterpart. Slotted onto
# Lauds' own standard 5-antiphon scheme (Ps 92/99/62, the Canticle, and
# Laudate) in source order — see christ-the-king.yml's own file for the
# same structure.
lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: Oleum effúsum * nomen tuum, ídeo adolescéntulæ dilexérunt te.
    - psalms:
        - 99
      antiphon: Scitóte, * quia Dóminus ipse est Deus, cujus nomen in ætérnum.
    - psalms:
        - 62
      antiphon: Sitívit * ánima mea ad nomen sanctum tuum, Dómine.
  canticle:
    id: canticum-trium-puerorum
    antiphon: Benedíctum * nomen glóriæ tuæ sanctum, et laudábile, et superexaltátum in sǽcula.
  laudate:
    antiphon: Júvenes et vírgines, * senes cum junióribus laudáte nomen Dómini, quia exaltátum est nomen ejus solíus.

# Matins Nocturn 2-3 readings for the Most Holy Name of Jesus (Jan 2).
# Sourced directly from web/www/horas/Latin/Tempora/Nat2-0.txt,
# English/Tempora/Nat2-0.txt.
# Nocturn 2: Lectio4-6, a sermon of St. Bernard of Clairvaux on the
# Song of Songs, combined into one reading per this project's own
# condensed-Matins convention (see nearby circumcision.yml/
# immaculate-heart-of-mary.yml). Nocturn 3: Lectio7-9, also St.
# Bernard, on the Circumcision.
#
# Update (2026-09-05): the Gospel pericope itself (Luke 2:21) is now
# authored too (isGospel: true, immediately before the homily) --
# web/www/horas/Latin/Tempora/Nat2-0.txt's own Lectio7 carries the
# identical citation and incipit as circumcision.yml's own Nocturn 3
# Gospel (Jan 1's Missale Gospel, per that file's own header) -- same
# pericope, reused verbatim from there rather than re-derived.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Bernard of Clairvaux, Sermon 15 on the Song of Songs
      text: |-
        Non otióse Spíritus Sanctus nomen Sponsi óleo cómparat, cum ita dóceat sponsam ad Sponsum clamáre: Oleum effúsum nomen tuum. Oleum enim lucet, pascit et ungit. Fovet ignem, nutrit carnem, lenit dolórem: lux, cibus, medicína. Vide idem nunc et de Sponsi nómine: Lucet prædicátum, pascit recogitátum, invocátum lenit et ungit. Et percurrámus síngula. Unde putas in toto orbe tanta et tam súbita fídei lux, nisi de prædicáto nómine Jesu? Nonne in hujus nóminis luce Deus nos vocávit in admirábile lumen suum; quibus illuminátis, et in lúmine isto vidéntibus lumen, dicat mérito Paulus: Fuístis aliquándo ténebræ, nunc autem lux in Dómino?

        Hoc dénique nomen coram régibus, et géntibus, et fíliis Israël portáre jussus est idem Apóstolus; et portábat nomen tamquam lumen, et illuminábat pátriam, et clamábat ubíque: Nox præcéssit, dies autem appropinquávit. Abiciámus ergo ópera tenebrárum, et induámur arma lucis, sicut in die honéste ambulémus. Et monstrábat ómnibus lucérnam super candelábrum, annúntians in omni loco Jesum, et hunc crucifíxum. Quómodo lux ista resplénduit ac perstrínxit cunctórum intuéntium óculos, quando de ore Petri, tamquam fulgur egrédiens, claudi uníus corporáles plantas solidávit et bases, multósque spirituáliter cæcos illuminávit? Numquid non ignem sparsit, cum ait: In nómine Jesu Christi Nazaréni surge et ámbula?

        Nec tantum lux est nomen Jesu, sed est et cibus. An non tóties confortáris, quóties recordáris? Quid æque mentem cogitántis impínguat? Quid ita exercitátos réparat sensus, virtútes róborat, végetat mores bonos atque honéstos, castas fovet affectiónes? Aridus est omnis ánimæ cibus, si non óleo isto infúnditur; insípidus est, si non hoc sale condítur. Si scribas, non sapit mihi, nisi légero ibi Jesum. Si dísputes aut cónferas, non sapit mihi, nisi sonúerit ibi Jesus. Jesus mel in ore, in aure melos, in corde júbilus. Sed est et medicína. Tristátur áliquis nostrum? Véniat in cor ejus Jesus, et inde sáliat in os. Et ecce ad exórtum nóminis lumen, núbilum omne díffugit, redit serénum. Lábitur quis in crimen? currit ínsuper ad láqueum mortis desperándo? Nonne, si ínvocet nomen vitæ, conféstim respirábit ad vitam?
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 2:21
      text: 'In illo témpore: Postquam consummáti sunt dies octo, ut circumciderétur Puer: vocátum est nomen ejus Jesus, quod vocátum est ab Angelo, priúsquam in útero conciperétur.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernard of Clairvaux, Sermon 1 on the Circumcision
      text: |-
        Magnum et mirábile sacraméntum! Circumcíditur Puer, et vocátur Jesus. Quid sibi vult ista connéxio? Circumcísio nempe magis salvándi, quam Salvatóris esse vidétur; et Salvatórem circumcídere pótius decet, quam circumcídi. Sed agnósce mediatórem Dei et hóminum, qui ab ipso nativitátis suæ exórdio divínis humána sóciat, ima summis. Náscitur ex mulíere, sed cui fecunditátis fructus sic accédat, ut non décidat flos virginitátis. Pannis invólvitur; sed panni ipsi angélicis láudibus honorántur. Abscónditur in præsépio; sed próditur radiánte stella de cælo. Sic et circumcísio veritátem suscéptæ probat humanitátis; et nomen, quod est super omne nomen, glóriam índicat majestátis. Circumcíditur tamquam verus Abrahæ fílius; Jesus vocátur tamquam verus Fílius Dei.

        Mérito sane, dum circumcíditur puer, qui natus est nobis, Salvátor vocátur; quod vidélicet ex hoc jam cœperit operári salútem nostram, immaculátum illum pro nobis sánguinem fundens. Neque enim jam quǽrere est Christiánis, cur volúerit Dóminus Christus circumcídi. Propter hoc síquidem circumcísus est, propter quod natus, propter quod passus. Nihil horum propter se, sed ómnia propter eléctos. Nec in peccáto génitus, nec a peccáto circumcísus, nec mórtuus est pro peccáto suo; magis autem propter delícta nostra. Quod vocátum est, inquit, ab Angelo, priúsquam in útero conciperétur. Vocátum plane, non impósitum: nempe hoc ei nomen est ab ætérno. A natúra própria habet, ut sit Salvátor: innátum est ei nomen hoc, non índitum ab humána vel angélica creatúra.
      status: verified
