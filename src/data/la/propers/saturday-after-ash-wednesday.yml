# Lauds collect ([Oratio 2] in the source) — read from
# web/www/horas/{Latin,English}/Tempora/Quadp3-6.txt. No [Oratio 3] in
# the source for this day (unlike its five siblings this week), so no
# `-collect-vespers` file exists for this id — Vespers falls back to this
# same collect via getDayCollect's own missing-status fallback.
collect:
  text: |
    Orémus.
    Adésto, Dómine, supplicatiónibus nostris: et concéde; ut hoc solémne jejúnium, quod animábus corporibúsque curándis salúbriter institútum est, devóto servítio celebrémus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified
  temporal: true

