# Read directly from web/www/horas/Latin/Sancti/07-06.txt's own
# [Oratio] and its English counterpart. Doxology "$Qui vivis" spelled
# out per the convention in st-bibiana-collect.yml.
collect:
  text: |
    Orémus.
    Deus, cujus déxtera beátum Petrum ambulántem in fluctibus, ne mergerétur, eréxit,
    et coapóstolum ejus Paulum, tértio naufragántem, de profúndo pélagi liberávit:
    exáudi nos propítius, et concéde; ut, ambórum meritis, æternitátis glóriam
    consequámur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (octave-of-ss-peter-and-paul-antiphon.yml), paired with the standard de-Communi commemoration versicle for common-of-apostles (C1) (not yet independently live-verified for this specific category, marked draft). Collect is the saint's own real proper (octave-of-ss-peter-and-paul-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Petrus Apóstolus, * et Paulus Doctor Géntium, ipsi nos docuérunt legem tuam, Dómine.
    V. Annuntiavérunt ópera Dei.
    R. Et facta ejus intellexérunt.
    Orémus.
    Deus, cujus déxtera beátum Petrum ambulántem in fluctibus, ne mergerétur, eréxit,
    et coapóstolum ejus Paulum, tértio naufragántem, de profúndo pélagi liberávit:
    exáudi nos propítius, et concéde; ut, ambórum meritis, æternitátis glóriam
    consequámur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  status: draft

