      source: St. Bernard, Abbot, Homily 3 on "Missus est"
      text: 'Et ingréssus Ángelus ad eam, dixit: Ave grátia plena. Dóminus tecum. Quo ingréssus ad eam? Puto in sacrárium pudici cubículi, ubi illa fortassis, clauso super se ostio, orabat Patrem in abscóndito. Solent Ángeli adstare orantibus, et delectari in his, quos vident levare puras manus in oratióne. Holocáustum sanctæ devotiónis gaudent se offérre Deo in odórem suavitátis. Maríæ autem orationes, quantum placuerint in conspéctu Altíssimi, Ángelus indicávit, qui ingréssus ad eam tam reverénter salutavit.'
