# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/12-10-Domus.txt (Duplex majus, nine lessons, `ex C11`; the parts it marks `@Commune/C8` are read from Commune/C8.txt, the Common of a Dedication). The Lauds hymn is the Common of a Dedication's, copied from lauds-hymn-common-of-a-dedication.yml (Latin and English both).
lauds-hymn:
  text: |
    Anguláris fundaméntum
    Lapis Christus missus est,
    Qui paríetum compáge
    In utróque néctitur,
    Quem Sion sancta suscépit,
    In quo credens pérmanet.

    Omnis illa Deo sacra
    Et dilécta cívitas,
    Plena módulis, in laude,
    Et canóre júbilo,
    Trinum Deum unicúmque
    Cum fervóre prǽdicat.

    Hoc in templo, summe Deus,
    Exorátus ádveni,
    Et cleménti bonitáte
    Precum vota súscipe,
    Largam benedictiónem
    Hic infúnde júgiter.

    Hic promereántur omnes
    Petíta acquírere,
    Et adépta possidére,
    Cum Sanctis perénniter
    Paradísum introíre,
    Transláti in réquiem.

    Glória et honor Deo
    Usquequáque altíssimo,
    Una Patri, Filióque,
    Inclyto Paráclito,
    Cui laus est et potéstas
    Per ætérna sǽcula.
    Amen.
  status: verified

