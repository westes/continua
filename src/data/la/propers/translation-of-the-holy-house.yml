# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/12-10-Domus.txt (Duplex majus, nine lessons, `ex C11`; the parts it marks `@Commune/C8` are read from Commune/C8.txt, the Common of a Dedication). The Matins hymn is the Common of a Dedication's, copied from matins-hymn-common-of-a-dedication.yml (Latin and English both).
matins-hymn:
  text: |
    Urbs beáta Jerúsalem,
    Dicta pacis vísio,
    Quæ constrúitur in cælis
    Vivis ex lapídibus,
    Et Ángelis coronáta
    Ut sponsáta cómite.

    Nova véniens e cælo,
    Nuptiáli thálamo
    Præparáta, ut sponsáta
    Copulétur Dómino:
    Platéæ et muri ejus
    Ex auro puríssimo.

    Portæ nitent margarítis
    Ádytis paténtibus,
    Et virtúte meritórum
    Illuc introdúcitur
    Omnis qui ob Christi nomen
    Hic in mundo prémitur.

    Tunsiónibus, pressúris
    Expolíti lápides,
    Suis coaptántur locis
    Per manus artíficis,
    Disponúntur permansúri
    Sacris ædifíciis.

    Glória et honor Deo
    Usquequáque altíssimo,
    Una Patri, Filióque,
    Inclyto Paráclito,
    Cui laus est et potéstas
    Per ætérna sǽcula.
    Amen.
  status: verified

