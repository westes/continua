# Matins Nocturn 2 reading for St. Ubald, Bishop and Confessor (May
# 16). No genuine SanctiM match: the only SanctiM file for this date,
# `SanctiM/05-16b.txt`, is a wholly different saint (St. Gentius the
# Hermit, a later addition) — a missed pre-1955-pool candidate rather
# than a genuine SanctiM case (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/05-16.txt, English/Sancti/05-16.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No responsory given in the source.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Ubaldus Eugubii in Umbria nobili genere natus, a primis annis pietáte et litteris egregie est institútus; jamque adoléscens, ut uxórem duceret, sæpe tentatus, numquam tamen a proposito servandæ virginitátis recéssit. Sacerdos effectus, patrimónium suum paupéribus et ecclésiis distríbuit, et canonicórum regulárium ordinis sancti Augustíni institutum suscípiens, illud in pátriam tránstulit, atque in eo aliquámdiu sanctíssime vixit. Cujus sanctitátis opinióne evulgata, ab Honorio secundo summo Pontifice ecclésiæ Eugubinæ invítus præfícitur, et episcopalis consecratiónis munere decorátur.

        Ad suam ítaque revertens ecclésiam, cum de consueta vivéndi ratióne nihil ádmodum immutasset, in omni tamen virtútum genere eo magis eminére cœpit, quo efficacius aliórum étiam salútem verbo et exemplo procuraret, factus forma gregis ex animo. Nam victu parco, vestítu moderáto, léctulo áspero et paupérrimo, crucis mortificatiónem jugiter in suo corpore circumferebat, dum inexplébili oratiónis studio spíritum quotídie recrearet. Hinc admirábilem illam mansuetúdinem est adeptus, qua gravíssimas injurias et contumelias non modo æquanimiter tulit, verum étiam mirifico dilectiónis afféctu persecutores suos omni benignitátis testimonio complectebátur.

        Biennio, antequam ex hac vita migráret, cum diutinis afflictarétur infirmitátibus, inter acerbíssimos corporis cruciátus velut aurum in fornace purgátum, Deo grátias indesinenter agebat. Adveniénte autem sacro Pentecostes die, cum multis annis ecclésiam sibi commissam cum magna cum laude gubernasset, sanctis opéribus ac miraculis clarus quiévit in pace. Quem Cælestinus Papa tertius in Sanctórum númerum retulit. Ejus virtus præcipue in effugandis spirítibus immundis elucet. Corpus vero, per tot sæcula incorruptum, magna fidelium veneratióne in pátria colitur, quam non semel a præsénti discrimine liberávit.
      status: verified
