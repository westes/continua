# Matins Nocturn content for Monday in the 4th week of Lent — read from
# web/www/horas/{Latin,English}/Tempora/Quad4-1.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad4-1.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Augustine
# homily split only to fill the fixed 3-lesson slot count — this store's
# established default). Responsory is Lectio1's own (given directly in
# this file, not a cross-reference), per the "the first one, when several
# collapse" convention.
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Joann 2:13-25
      text: 'In illo témpore: Prope erat Pascha Judæórum, et ascéndit Jesus Jerosólymam: et invénit in templo vendéntes boves et oves et colúmbas, et nummulários sedéntes. Et cum fecísset quasi flagéllum de funículis, omnes ejécit de templo, oves quoque et boves, et nummulariórum effúdit æs et mensas subvértit. Et his, qui colúmbas vendébant, dixit: Auférte ista hinc, et nolíte fácere domum Patris mei domum negotiatiónis. Recordáti sunt vero discípuli ejus, quia scriptum est: Zelus domus tuæ comédit me. Respondérunt ergo Judǽi, et dixérunt ei: Quod signum osténdis nobis, quia hæc facis? Respóndit Jesus et dixit eis: Sólvite templum hoc, et in tribus diébus excitábo illud. Dixérunt ergo Judǽi: Quadragínta et sex annis ædificátum est templum hoc, et tu in tribus diébus excitábis illud? Ille autem dicébat de templo córporis sui. Cum ergo resurrexísset a mórtuis, recordáti sunt discípuli ejus, quia hoc dicébat, et credidérunt Scriptúræ, et sermóni, quem dixit Jesus. Cum autem esset Jerosólymis in Pascha in die festo, multi credidérunt in nómine ejus, vidéntes signa ejus, quæ faciébat. Ipse autem Jesus non credébat semetípsum eis, eo quod ipse nosset omnes, et quia opus ei non erat, ut quis testimónium perhibéret de hómine: ipse enim sciébat, quid esset in hómine.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, 10th Tract on John
      text: |-
        Quid audívimus, fratres? Ecce templum illud figúra adhuc erat, et ejécit inde Dóminus omnes qui sua quærébant, qui ad núndinas vénerant. Et quæ ibi vendébant illi? Quæ opus habébant hómines in sacrifíciis illíus témporis. Novit enim cáritas vestra, quod sacrifícia illi pópulo pro ejus carnalitáte, et corde adhuc lapídeo, tália data sunt, quibus tenerétur, ne in idóla deflúeret: et immolábant ibi sacrifícia, boves, oves et colúmbas. Nostis, quia legístis.

        Non ergo magnum peccátum, si hoc vendébant in templo, quod emebátur ut offerétur in templo: et tamen ejécit inde illos. Quid si ibi ebriósos inveníret, quid fáceret Dóminus, si vendéntes ea quæ lícita sunt, et contra justítiam non sunt (quæ enim honéste emúntur, non illícite vendúntur) éxpulit tamen, et non est passus domum oratiónis fíeri domum negotiatiónis?

        Si negotiatiónis domus non debet fíeri domus Dei, potatiónis debet fíeri? Nos autem quando ista dícimus, strident déntibus suis advérsus nos: et consolátur nos Psalmus, quem audístis: Stridérunt in me déntibus suis. Nóvimus et nos audíre unde curémur: etsi ingeminántur flagélla Christo, quia flagellátur sermo ipsíus. Congregáta sunt, inquit, in me flagélla, et nesciébant. Flagellátus est flagéllis Judæórum: flagellátur blasphémiis falsórum Christianórum: multíplicant flagélla Dómino Deo suo, et nésciunt. Faciámus nos, quantum ipse ádjuvat. Ego autem, cum mihi molésti essent, induébam me cilício, et humiliábam in jejúnio ánimam meam.
      responsory: |-
        R. Vos, qui transitúri estis Jordánem, ædificáte altáre Dómino * De lapídibus, quos ferrum non tétigit: et offérte super illud holocáusta, et hóstias pacíficas Deo vestro.
        V. Cumque intravéritis terram, quam Dóminus datúrus est vobis, ædificáte ibi altáre Dómino.
        R. De lapídibus, quos ferrum non tétigit: et offérte super illud holocáusta, et hóstias pacíficas Deo vestro.
      status: verified
