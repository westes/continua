# Read directly from web/www/horas/Latin/Sancti/12-12n.txt's own [Oratio]
# and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui sub beatíssimæ Vírginis Maríæ singulári patrocínio constitútos perpétuis
    benefíciis nos cumulári voluísti: præsta supplícibus tuis; ut, cujus hódie
    commemoratióne lætámur in terris, ejus conspéctu perfruámur in cælis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (our-lady-of-guadalupe-antiphon.yml), paired with
# the standard BVM commemoration versicle already verified elsewhere in
# this app (propers/common/lauds-suffrage-bvm.yml -- 'V. Ora pro nobis
# sancta Dei Genitrix'). Collect is the saint's own real proper
# (our-lady-of-guadalupe-collect.yml), unchanged. Same pattern as
# apparition-of-the-immaculate-bvm-commemoration.yml.
commemoration:
  text: |
    Ant. Elégi et sanctificávi locum istum; * Ut sit ibi nomen meum, et permáneant óculi
    mei, et cor meum ibi cunctis diébus.
    V. Ora pro nobis sancta Dei Génitrix.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Deus, qui sub beatíssimæ Vírginis Maríæ singulári patrocínio constitútos perpétuis
    benefíciis nos cumulári voluísti: præsta supplícibus tuis; ut, cujus hódie
    commemoratióne lætámur in terris, ejus conspéctu perfruámur in cælis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

