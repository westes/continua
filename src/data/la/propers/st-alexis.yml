# Matins Nocturn 2 reading for St. Alexis, Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/07-17.txt, English/Sancti/07-17.txt.
# single lesson (Lectio94), one continuous account.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Aléxius, Romanórum nobilíssimus, propter exímium Jesu Christi amórem prima nocte nuptiárum peculiári Dei mónitu relínquens intáctam sponsam, illústrium orbis terræ ecclesiárum peregrinatiónem suscépit. Quibus in itinéribus cum ignótus septémdecim annos fuísset, aliquándo apud Edéssam, Syriæ urbem, per imáginem sanctíssimæ Maríæ Vírginis, ejus nómine divulgáto, inde navi discéssit. Ad portum Románum appúlsus, a patre suo tamquam aliénus pauper hospítio accípitur; apud quem, ómnibus incógnitus, cum decem et septem annos vixísset, relícto scripto sui nóminis, sánguinis, ac totíus vitæ cursus, migrávit in cælum, Innocéntio primo summo Pontífice.
      status: verified
