# generic scheme this file's own psalm numbers match exactly in every
# slot across all three nocturns; only the antiphon text is proper to
# Andrew (narrating his own call by the Sea of Galilee and his own
# martyrdom on the cross), matching the same category-shares-psalm-
# numbers/saint-carries-antiphons pattern already established for
# Common-of-a-Martyr.
#
# New scripture chapters authored for the canticles:
# data/scripture/{isa-61,sap-3,sap-10}.yml (sparse, only the cited
# verses, same convention as sir-14.yml etc.).
matins-psalmody:
  category: common-of-an-apostle
  nocturn1:
    groups:
      - psalms:
          - 18
        antiphon: Vidit Dóminus * Petrum et Andréam, et vocávit eos.
      - psalms:
          - 33
        antiphon: Veníte post me, * dicit Dóminus, fáciam vos fíeri piscatóres hóminum.
      - psalms:
          - 44
        antiphon: Relíctis rétibus suis, * secúti sunt Dóminum Redemptórem.
      - psalms:
          - 46
        antiphon: Christus me misit, * ad istam provínciam, in qua non parvum pópulum aquisívi.
      - psalms:
          - 60
        antiphon: Ego si crucis * patíbulum expavéscerem, † crucis glóriam non prædicárem.
      - psalms:
          - 63
        antiphon: Dignum sibi Dóminus * computávit Mártyrem, quem vocávit Apóstolum, dum esset in mari, allelúia.
    versicle:
      v: In omnem terram exívit sonus eórum.
      r: Et in fines orbis terræ verba eórum.
  nocturn2:
    groups:
      - psalms:
          - 74
        antiphon: 'Videns Andréas * crucem, cum gáudio dicébat: † Quia amátor tui semper fui, et desiderávi te amplécti, o bona crux.'
      - psalms:
          - 95
        antiphon: Diléxit Andréam * Dóminus in odórem suavitátis.
      - psalms:
          - 96
        antiphon: Bíduo vivens * pendébat in cruce beátus Andréas pro Christi nómine, et docébat pópulum.
      - psalms:
          - 97
        antiphon: 'Non me permíttas, Dómine, * fámulum tuum a te separári: tempus est ut commendétur terræ corpus meum, et me ad te veníre jubéas.'
      - psalms:
          - 98
        antiphon: Andréas vero rogábat pópulum, * ut non impedíret passiónem ipsíus.
      - psalms:
          - 100
        antiphon: 'Accipe me ab homínibus * et redde me magístro meo: ut per te me recípiat, qui per te me redémit, allelúia.'
    versicle:
      v: Constítues eos príncipes super omnem terram.
      r: Mémores erunt nóminis tui, Dómine.
  nocturn3:
    antiphon: Unus ex duóbus, * qui secúti sunt Dóminum, erat Andréas, frater Simónis Petri, allelúia.
    canticles:
      - refs:
          - book: isa
            chapter: 61
            verses: 6-9
      - refs:
          - book: sap
            chapter: 3
            verses: 7-9
      - refs:
          - book: sap
            chapter: 10
            verses: 17-21
    versicle:
      v: Nimis honoráti sunt amíci tui, Deus.
      r: Nimis confortátus est principátus eórum.

