# Matins Nocturn 2-3 readings for St. Andrew, Apostle (Nov 30) —
# SanctiM/11-30.txt inherits the whole day (`@Sancti/11-30`) with no
# Nocturn 2/3 override, so this feast's own proper content is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/11-30.txt, English/Sancti/11-30.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita
# (including the famous "O bona crux" address to the cross).
# Nocturn 3: Lectio7's Gospel citation (Matt 4:18-22) is a bare
# incipit ("Et réliqua") with no full pericope text given, so — per
# the pre-1955 pass's convention of not transcribing bare incipits —
# only the homily portion was originally authored (not marked
# isGospel), a single excerpt of Pope St. Gregory the Great's homily.
# No responsory given for either reading.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before Gregory's homily) — sourced from
# the day's own Missale [Evangelium] in
# web/www/missa/Latin/Sancti/11-30.txt (full text given there, not a
# redirect).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Andréas Apóstolus, Bethsáidæ natus, qui est Galilǽæ vicus, frater Petri, discípulus Joánnis Baptistæ, cum eum de Christo dicéntem audísset: Ecce Agnus Dei; secútus Jesum, fratrem quoque suum ad eúndem perdúxit. Cum póstea una cum fratre piscarétur in mari Galilǽæ, ambo a prætereúnte Christo Dómino ante álios Apóstolos vocáti illis verbis: Veníte post me, fáciam vos fíeri piscatóres hóminum; nullam interponéntes moram, et relíctis rétibus, secúti sunt eum. Post cujus passiónem et resurrectiónem, Andréas, cum in Scýthiam Európæ, quæ ei província ad Christi fidem disseminándam obtígerat, venísset, deínde Epírum ac Thráciam peragrásset; doctrína et miráculis innumerábiles hómines ad Christum convértit. Post, Patras Achájæ proféctus, et in ea urbe plúrimis ad veritátem evangélicam perdúctis, Ægéam procónsulem, prædicatióni evangélicæ resisténtem, libérrime increpávit, quod, qui judex hóminum habéri vellet, Christum Deum ómnium júdicem, a dæmónibus elúsus, non agnósceret.

        Tum Ægéas irátus, Désine, inquit, Christum jactáre, cui simília verba nihil profuérunt, quóminus a Judǽis crucifigerétur. Andréam vero de Christo nihilóminus líbere prædicántem quod pro salúte humáni géneris se crucifigéndum obtulísset, ímpia oratióne interpéllat, ac demum hortátur, ut sibi cónsulens, diis velit immoláre. Cui Andréas: Ego omnipoténti Deo, qui unus et verus est, ímmolo cotídie, non taurórum carnes, nec hircórum sánguinem, sed immaculátum Agnum in altári; cujus carnem posteáquam omnis pópulus credéntium manducáverit, Agnus, qui sacrificátus est, ínteger persevérat et vivus. Quam ob rem ira accénsus Ægéas, jubet eum in cárcerem detrúdi unde pópulus Andréam fácile liberásset, nisi ipse sedásset multitúdinem, veheméntius rogans, ne se ad optatíssimam martýrii corónam properántem impedírent.

        Igitur paulo post in tribúnal prodúctum, cum Ægéas crucis extolléntem mystéria sibíque suam impietátem exprobrántem diútius ferre non posset, in crucem tolli, et Christi mortem imitári jussit. Addúctus Andréas ad locum martýrii, cum crucem vidísset, longe exclamáre cœpit: O bona crux, quæ decórem ex membris Dómini suscepísti, diu desideráta, sollícite amáta, sine intermissióne quæsíta, et aliquándo cupiénti ánimo præparáta: áccipe me ab homínibus, et redde me magístro meo; ut per te me recípiat, qui per te me redémit. Itaque cruci affíxus est: in qua bíduum vivus pendens, et Christi fidem prædicáre nunquam intermíttens, ad eum migrávit, cujus mortis similitúdinem concupíerat. Ejus ossa primum Constantíno imperatóre Constantinópolim, deínde Amálphim transláta sunt. Caput, Pio secúndo Pontífice, Romam allátum, in basílica sancti Petri collocátum est.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 4:18-22
      text: 'In illo témpore: Ambulans Jesus juxta mare Galilǽæ, vidit duos fratres, Simónem, qui vocátur Petrus, et Andréam fratrem ejus, mitténtes rete in mare — erant enim piscatóres — et ait illis: Veníte post me, et fáciam vos fíeri piscatóres hóminum. At illi contínuo, relíctis rétibus, secúti sunt eum. Et procédens inde, vidit álios duos fratres, Jacóbum Zebedǽi et Joánnem, fratrem ejus, in navi cum Zebedǽo patre eórum reficiéntes rétia sua: et vocávit eos. Illi autem statim, relíctis rétibus et patre, secúti sunt eum.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 5 on the Gospels (on Matt 4:18-22)
      text: |-
        Audístis, fratres caríssimi, quia ad uníus jussiónis vocem Petrus et Andréas relíctis rétibus secúti sunt Redemptórem. Nulla vero hunc fácere adhuc mirácula víderant, nihil ab eo de prǽmio ætérnæ retributiónis audíerant: et tamen ad unum Dómini præcéptum hoc quod possidére videbántur, oblíti sunt. Quanta nos ejus mirácula vidémus, quot flagéllis afflígimur, quantis minárum asperitátibus deterrémur, et tamen vocántem sequi contémnimus.

        In cælo jam sedet, qui de conversióne nos ádmonet; jam jugo fídei colla géntium súbdidit, jam mundi glóriam stravit, jam ruínis ejus crebrescéntibus, distrícti sui judícii diem propinquántem denúntiat: et tamen supérba mens nostra adhuc non vult hoc sponte desérere, quod cotídie perdit invíta. Quid ergo, fratres caríssimi, quid in ejus judício dictúri sumus, qui ab amóre præséntis sǽculi nec præcéptis fléctimur, nec verbéribus emendámur?
      status: verified
