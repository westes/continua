  text: |
    Christe sanctórum decus Angelórum,
    Rector humáni géneris et auctor:
    Nobis ætérnum tríbue benígnus
    Scándere cælum.

    Angelum pacis Míchaël ad istam
    Cǽlitus mitti rogitámus aulam,
    Nobis ut crebro veniénte crescant
    Próspera cuncta.

