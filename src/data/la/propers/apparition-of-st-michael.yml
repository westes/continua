# Matins Nocturn 2 reading for the Apparition of St. Michael the
# Archangel (May 8) — pre-1955-but-post-1617 (no SanctiM/05-08*.txt at
# all). web/www/horas/Latin/Sancti/05-08.txt,
# English/Sancti/05-08.txt. Lectio4-6 is one continuous narrative (the
# Monte Gargano apparition), no internal source break, combined into a
# single reading. Each of Lectio4-6 has its own responsory in the
# source; per this project's established "first one, when several
# collapse" convention (see octave-readings.ts), only Responsory4 is
# kept.
#
# Update (2026-09-05): this 9-lesson duplex-majus feast also has its
# own Nocturn 3 Gospel + homily, added below — Lectio7 (Matt 18:1-10,
# on becoming as little children) with St. Hilary of Poitiers'
# homily on it, and Lectio8-9 continuing that same homily (combined
# into one reading, same "recombine split lessons" convention as
# elsewhere). Source: web/www/horas/Latin/Sancti/05-08.txt Lectio7-9,
# English/Sancti/05-08.txt Lectio7-9.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Beátum Michaélem Archángelum sǽpius homínibus apparuísse, et sacrórum Librórum auctoritáte et véteri Sanctórum traditióne comprobátur. Quam ob rem multis in locis facti memória celebrátur. Eum, ut olim synagóga Judæórum, sic nunc custódem et patrónum Dei venerátur Ecclésia. Gelásio autem primo, Pontífice máximo, in Apúlia in vértice Gargáni montis, ad cujus radíces íncolunt Sipontíni, Archángeli Michaélis fuit illústris apparítio.

        Factum est enim, ut ex grégibus armentórum Gargáni cujúsdam taurus longe discéderet; quem diu conquisítum, in áditu spelúncæ hæréntem invenérunt. Cum vero quidam ex illis, ut taurum confígeret, sagíttam emisísset retórta sagítta in ipsum récidit sagittárium. Quæ res cum præséntes ac deínceps céteros tanto timóre affecísset, ut ad eam spelúncam própius accédere nemo audéret, Sipontíni epíscopum cónsulunt; qui, indícto trium diérum jejúnio et oratióne, rem a Deo respóndit quæri oportére.

        Post tríduum Míchaël Archángelus epíscopum monet in sua tutéla esse eum locum, eóque indício demonstrásse, velle ibi cultum Deo in sui et Angelórum memóriam adhibéri. Quare epíscopus una cum cívibus ad eam spelúncam ire pergit. Quam cum in templi cujúsdam similitúdinem conformátam vidíssent, locum illum divínis offíciis celebráre cœpérunt: qui multis póstea miráculis illustrátus est. Nec ita multo post Bonifátius Papa, Romæ in summo circo, sancti Michaélis ecclésiam dedicávit tértio Kaléndas Octóbris; quo die étiam ómnium Angelórum memóriam Ecclésia celébrat. Hodiérnus autem dies Archángeli Michaélis apparitióne consecrátus est.
      responsory: |-
        R. Hic est Míchaël Archángelus, princeps milítiæ Angelórum, * Cujus honor præstat benefícia populórum, et orátio perdúcit ad regna cælórum.
        V. Archángelus Míchaël præpósitus paradísi, quem honoríficant Angelórum cives.
        R. Cujus honor præstat benefícia populórum, et orátio perdúcit ad regna cælórum.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 18:1-10
      text: 'In illo témpore: Accessérunt discípuli ad Jesum, dicéntes: Quis, putas, major est in regno cælórum? Et réliqua.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Hilary, Bishop of Poitiers, Commentary on Matthew, ch. 18
      text: |-
        Nónnisi revérsos in natúram puerórum introíre regnum cælórum Dóminus docet: id est, per simplicitátem puerílem vítia córporum nostrórum animǽque revocánda. Púeros autem, credéntes omnes per audiéntiæ fidem nuncupávit. Hi enim patrem sequúntur, matrem amant, próximo velle malum nésciunt, curam opum négligunt; non insoléscunt, non odérunt, non mentiúntur, dictis credunt, et quod áudiunt, verum habent. Reverténdum ígitur est ad simplicitátem infántium; quia, in ea collocáti, spéciem humilitátis Domínicæ circumferémus.

        Væ huic mundo ab scándalis. Humílitas passiónis scándalum mundo est. In hoc enim máxime ignorántia detinétur humána, quod sub deformitáte crucis, ætérnæ glóriæ Dóminum nóluit accípere. Et quid mundo tam periculósum, quam non recepísse Christum? Ideo vero necésse esse ait veníre scándala; quia, ad sacraméntum reddéndæ nobis æternitátis, omnis in eo passiónis humílitas esset explénda.

        Vidéte ne contemnátis unum de pusíllis istis, qui credunt in me. Aptíssimum vínculum mútui amóris impósuit, ad eos præcípue qui vere in Dómino credidíssent. Pusillórum enim Angeli quotídie Deum vident: quia Fílius hóminis venit salváre quæ pérdita sunt. Ergo et Fílius hóminis salvat, et Deum Angeli vident, et Angeli pusillórum præsunt fidélium oratiónibus. Præésse Angelos absolúta auctóritas est. Salvatórum ígitur per Christum oratiónes Angeli quotídie Deo ófferunt. Ergo periculóse ille contémnitur, cujus desidéria ac postulatiónes ad ætérnum et invisíbilem Deum, ambitióso Angelórum famulátu ac ministério, pervehúntur.
      status: verified

# Vespers psalmody, moved here from the retired common-of-an-angel.yml
# (the reference has no Angel Common; St. Michael's own SanctiM rule says plain
# "Psalmi Dominica", Sunday's Vespers psalms 109-112, with his own proper
# antiphons).
vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: Stetit Angelus * iuxta aram templi, habens thuríbulum áureum in manu sua.
    - psalms:
        - 110
      antiphon: 'Dum præliarétur * Míchaël Archángelus cum dracóne, audíta est vox dicéntium: Salus Deo nostro, allelúia.'
    - psalms:
        - 111
      antiphon: Archángele Míchaël, * constítui te príncipem super omnes ánimas suscipiéndas.
    - psalms:
        - 112
      antiphon: Angeli, Archángeli, * Throni et Dominatiónes, Principátus et Potestátes, Virtútes cælórum, laudáte Dóminum de cælis, allelúia.
