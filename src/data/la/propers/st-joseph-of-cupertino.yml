# Matins Nocturn 2-3 readings for St. Joseph of Cupertino, Confessor
# (Sep 18). Sourced directly from web/www/horas/Latin/Sancti/09-18.txt,
# English/Sancti/09-18.txt. Nocturn 2: Lectio4-6 combined into one
# reading, one continuous vita.
#
# Update (2026-09-05): Nocturn 3's Gospel pericope was found missing --
# a live-reported gap, this saint's date (Sep 18) sitting one day before
# the other live-reported gap (Vigil of St. Matthew, Sep 20 eve). Its
# homily (Pope St. Gregory the Great, Bk. II, Homily 38 on the Gospels)
# is itself a commentary on the parable of the marriage feast, confirmed
# via horas/Latin/Sancti/09-18.txt's own Lectio7 incipit ("Et réliqua")
# resolving to Matt 22:1-14; the full pericope is sourced from
# missa/Latin/Tempora/Pent19-0.txt's own [Evangelium] (the 19th Sunday
# after Pentecost's Mass Gospel, the same parable of the king's marriage
# feast for his son -- not this saint's own Missale file, which has no
# proper [Evangelium] of its own at this date; not guessed at). This is
# NOT the same pericope as st-joseph.yml's own Nocturn 3 (Luke 1:26-38,
# the Annunciation) -- different saint, different homily, different
# Gospel.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Josephus a Cupertino, oppido in Salentinis diœcesis Neritonénsis, anno reparátæ salútis millesimo sexcentésimo tertio, piis ibidem paréntibus ortus, Deique amóre præventus, puerítiam atque adolescéntiam summa cum simplicitate morúmque innocéntia molestoque morbo, patientíssime tolerato, Deiparæ Vírginis ope liberatus, se totum pietátis opéribus ac excoléndis virtútibus dedit; utque Deo ad majora vocanti se intimius conjungeret, ordini seraphico nomen dare constítuit. Post varios eventus voti tandem compos factus, apud Minores Conventuales in cœnobio Cryptulæ, inter laicos primum ob litterárum imperítiam, deínde inter clericos divina dispositióne connumerátus est. Sacerdotio post solemnia vota initiatus, perfectius sibi vitæ institutum propósuit. Quam ob rem, mundanis quibuscúmque afféctibus terrenisque rebus pene ad vitam necessariis illico a se abdicatis, ciliciis, flagellis, catenis, omni demum asperitátum ac pœnárum genere corpus afflixit; spíritum vero sanctæ oratiónis altissimǽque contemplatiónis assiduitate dulciter enutrívit. Hinc factum est, ut caritas Dei, quæ jam erat in ejus corde a prima ætate diffúsa, miro planeque singulari modo in dies coruscáverit.

        Eluxit præcipue ardentíssima ejus caritas in extasibus ad Deum suavíssimis stupendisque raptibus, quibus frequenter afficiebátur. Mirum autem, quod, alienato a sensibus animo, statim ab éxtasi eum revocábat sola obediéntia. Hanc quippe virtútem exímio studio prosequebátur, dicere sólitus, se ab ea véluti cæcum circumduci, et mori potius velle, quam non obedire. Paupertátem vero seraphici Patriárchæ ita æmulátus est, ut, morti próximus, prælato suo assérere vere potúerit se nihil habere, quod more religiosórum resignaret. Itaque, mundo sibique mórtuus, vitam Jesu manifestábat in carne sua, quæ dum in aliquibus ex turpitúdine obscœnum flagitium sentiebat, prodigiósum de se efflábat odórem, indícium nitidíssimæ illíus puritátis, quam, immundo spíritu vehementíssimis tentatiónibus frustra obnubilare diu conante, servávit illæsam, tum arcta sensuum custódia, tum jugi corporis maceratióne, tum denique speciali protectióne puríssimæ Vírginis Maríæ, quam matrem suam appellare consuevit, ac véluti matrem dulcíssimam íntimo cordis afféctu venerabátur, eamque ab aliis venerari exoptabat, ut cum ejusdem patrocinio, sicut ipse ajebat, ómnia bona consequerentur.

        Hæc beáti Josephi sollicitúdo a sua erga próximos caritate prodíbat; tanto enim animárum zelo exardebat, ut ómnium salútem modis ómnibus instantíssime procuraret. Nec aliéni erant ab ejus caritate, qui objurgatiónibus, probris omnisque generis injuriis ipsum appéterent; nam eadem patiéntia, mansuetúdine, vultusque hilaritate talia excipiebat. At Deus, qui ponit húmiles in sublíme quique servum suum, dum viveret, cælésti sapiéntia, prophetía, cordium perscrutatióne, curatiónum grátia ceterisque donis cumulatíssime exornaverat, ejus quoque mortem iis, quibus ipse antea prædixerat, loco ac témpore, anno ætátis suæ sexagesimo primo, Auxími in Piceno pretiósam réddidit sepulcrúmque gloriosum. Illum denique, étiam post óbitum miraculis coruscántem, Benedíctus quartus décimus Beatórum, Clemens tertius décimus Sanctórum fastis adscripsit.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 22:1-14
      text: 'In illo témpore: Loquebátur Jesus princípibus sacerdótum et pharisǽis in parábolis, dicens: Símile factum est regnum cœlórum hómini regi, qui fecit núptias fílio suo. Et misit servos suos vocáre invitátos ad nuptias, et nolébant veníre. Iterum misit álios servos, dicens: Dícite invitátis: Ecce, prándium meum parávi, tauri mei et altília occísa sunt, et ómnia paráta: veníte ad núptias. Illi autem neglexérunt: et abiérunt, álius in villam suam, álius vero ad negotiatiónem suam: réliqui vero tenuérunt servos ejus, et contuméliis afféctos occidérunt. Rex autem cum audísset, iratus est: et, missis exercítibus suis, pérdidit homicídas illos et civitátem illórum succéndit. Tunc ait servis suis: Núptiæ quidem parátæ sunt, sed, qui invitáti erant, non fuérunt digni. Ite ergo ad exitus viárum et, quoscúmque invenéritis, vocáte ad núptias. Et egréssi servi ejus in vias, congregavérunt omnes, quos invenérunt, malos et bonos: et implétæ sunt núptiæ discumbéntium. Intrávit autem rex, ut vidéret discumbéntes, et vidit ibi hóminem non vestítum veste nuptiáli. Et ait illi: Amíce, quómodo huc intrásti non habens vestem nuptiálem? At ille obmútuit. Tunc dixit rex minístris: Ligátis mánibus et pédibus ejus, míttite eum in ténebras exterióres: ibi erit fletus et stridor déntium. Multi enim sunt vocáti, pauci vero elécti.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Bk. II, Homily 38 on the Gospels
      text: |-
        Quia jam, largiénte Dómino, nuptiárum domum, id est, sanctam Ecclésiam intrastis, solerter, fratres, aspicite, ne aliquid de mentis vestræ habitu rex ingrédiens reprehéndat. Cum magno enim cordis timóre pensándum est quod prótinus subditur: Intrávit autem rex, ut vidéret discumbéntes, et vidit ibi hóminem non vestítum veste nuptiali. Quid, fratres caríssimi, éxprimi per nuptialem vestem putamus? Si enim vestem nuptialem baptisma vel fidem dicimus, quis sine baptismate et fide has nuptias intrávit? Eo enim ipso foris est, qui necdum credidit. Quid ergo debémus intellígere per nuptialem vestem, nisi caritátem? Intrat enim ad nuptias, sed cum nuptiali veste non intrat, qui, in sancta Ecclésia assistens, fidem habet, sed caritátem non habet. Recte enim caritas, nuptialis vestis vocátur, quia hanc in se conditor noster hábuit, dum ad sociandæ sibi Ecclésiæ nuptias venit.

        Sola quippe dilectióne Dei actum est, ut ejus Unigénitus mentes sibi electórum hóminum uníret. Unde et Joánnes dicit: Sic enim diléxit Deus mundum, ut Fílium suum unigénitum daret pro nobis. Qui ergo per caritátem venit ad hómines, eamdem caritátem innotuit vestem esse nuptialem. Omnis ergo vestrum, qui in Ecclésia positus Deo credidit, jam ad nuptias intrávit; sed cum nuptiali veste non venit, si caritátis grátiam non custódit. Et certe, fratres, si quis ad carnales nuptias esset invitatus, vestem mutaret, congaudere se sponso et sponsæ ex ipso sui habitus decore osténderet, inter gaudéntes et festa celebrántes despectis vestibus apparére erubésceret. Nos ad Dei nuptias venímus, et cordis vestem mutare dissimulamus.

        Sciéndum vero est quia, sicut in duobus lignis, superiore vidélicet et inferióre, vestis téxitur: ita in duobus præceptis caritas habétur, in dilectióne scilicet Dei et próximi. Scriptum quippe est: Diliges Dóminum Deum tuum ex toto corde tuo et ex tota ánima tua, et próximum tuum sicut teípsum. Qua in re notándum est, quia in dilectióne próximi mensúra amóris pónitur, cum dícitur: Diliges próximum tuum sicut teípsum. Dei autem diléctio nulla mensúra constringitur, cum dícitur: Diliges Dóminum Deum tuum ex toto corde tuo, ex tota ánima tua, ex tota virtúte tua. Non enim jubétur quisque quantum diligat, sed ex quanto, cum dícitur, Ex toto; quia ille veraciter Deum díligit, qui sibi de se nihil relinquit.
      status: verified
