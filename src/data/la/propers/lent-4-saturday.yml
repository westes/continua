# Matins Nocturn content for Saturday in the 4th week of Lent — read from
# web/www/horas/{Latin,English}/Tempora/Quad4-6.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad4-6.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Augustine
# homily split only to fill the fixed 3-lesson slot count). Responsory1 is
# a cross-reference (@Tempora/Quad4-0:Responsory7 — the same text
# lent-4-wednesday.yml's own combined reading uses, reused here per the
# source's own cross-reference, not an error) per the "the first one, when
# several collapse" convention.
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Joann 8:12-20
      text: 'In illo témpore: Locútus est Jesus turbis Judæórum, dicens: Ego sum lux mundi: qui séquitur me, non ámbulat in ténebris, sed habébit lumen vitæ. Dixérunt ergo ei pharisǽi: Tu de te ipso testimónium pérhibes: testimónium tuum non est verum. Respóndit Jesus et dixit eis: Et si ego testimónium perhíbeo de meípso, verum est testimónium meum: quia scio, unde veni et quo vado: vos autem nescítis, unde vénio aut quo vado. Vos secúndum carnem judicátis: ego non júdico quemquam: et si júdico ego, judícium meum verum est, quia solus non sum: sed ego et, qui misit me, Pater. Et in lege vestra scriptum est, quia duórum hóminum testimónium verum est. Ego sum, qui testimónium perhíbeo de meípso: et testimónium pérhibet de me, qui misit me, Pater. Dicébant ergo ei: Ubi est Pater tuus? Respóndit Jesus: Neque me scitis neque Patrem meum: si me scirétis, fórsitan et Patrem meum scirétis. Hæc verba locútus est Jesus in gazophylácio, docens in templo: et nemo apprehéndit eum, quia necdum vénerat hora ejus.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, 34th Tract on John
      text: |-
        Quod ait Dóminus: Ego sum lux mundi: clarum puto esse eis, qui habent óculos, unde hujus lucis partícipes fiant: qui autem non habent óculos, nisi in sola carne, mirántur quod dictum est a Dómino Jesu Christo: Ego sum lux mundi. Et forte non desit qui dicat apud semetípsum: Numquid forte Dóminus Christus est sol iste, qui ortu et occásu péragit diem? Non enim defuérunt hærétici, qui ista sensérunt. Manichǽi solem istum óculis cárneis visíbilem, expósitum et públicum non tantum homínibus, sed étiam pecóribus ad vidéndum, Christum Dóminum esse putavérunt.

        Sed cathólicæ Ecclésiæ recta fides ímprobat tale comméntum, et diabólicam doctrínam esse cognóscit: nec solum agnóscit credéndo, sed in quibus potest convíncit étiam disputándo. Improbémus ítaque hujúsmodi errórem, quem sancta ab inítio anathematizávit Ecclésia. Non arbitrémur Dóminum Jesum Christum hunc esse solem, quem vidémus oríri ab Oriénte, occídere in Occidénte: cujus cúrsui nox succédit, cujus rádii nube obumbrántur: qui certa de loco in locum motióne cómmigrat. Non est hoc Dóminus Christus. Non est Dóminus Christus sol factus, sed per quem sol factus est. Omnia enim per ipsum facta sunt, et sine ipso factum est nihil.

        Est ergo lux, quæ fecit hanc lucem. Hanc amémus, hanc intellégere cupiámus, ipsam sitíamus, ut ad ipsam duce ipsa aliquándo veniámus: et in illa ita vivámus, ut nunquam omníno moriámur. Ista enim lux est, de qua prophetía olim præmíssa ita in Psalmo cécinit: Quóniam apud te est fons vitæ, et in lúmine tuo vidébimus lumen. Advértite quid de tali luce antíquus sanctórum hóminum Dei sermo præmíserit. Hómines, inquit, et juménta salvos fácies, Dómine: sicut multiplicáta est misericórdia tua, Deus.
      responsory: |-
        R. Spléndida facta est fácies Móysi, dum respíceret in eum Dóminus: * Vidéntes senióres claritátem vultus ejus, admirántes timuérunt valde.
        V. Cumque descendísset de monte Sínai, portábat duas tábulas testimónii, ignórans quod cornúta esset fácies ejus ex consórtio sermónis Dei.
        R. Vidéntes senióres claritátem vultus ejus, admirántes timuérunt valde.
      status: verified
