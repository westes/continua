# Matins Nocturn content for Wednesday of Lent week 2 — read from
# web/www/horas/{Latin,English}/Tempora/Quad2-3.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad2-3.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Ambrose
# excerpt split only to fill the fixed 3-lesson slot count). Responsory1
# is a cross-reference (@Tempora/Quad2-0:Responsory7).
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Matt 20:17-28
      text: 'In illo témpore: Ascéndens Jesus Jerosólymam, assúmpsit duódecim discípulos secréto, et ait illis: Ecce, ascéndimus Jerosólymam, et Fílius hóminis tradétur princípibus sacerdótum, et scribis, et condemnábunt eum morte, et tradent eum Géntibus ad illudéndum, et flagellándum, et crucifigéndum, et tértia die resúrget. Tunc accéssit ad eum mater filiórum Zebedǽi cum fíliis suis, adórans et petens áliquid ab eo. Qui dixit ei: Quid vis? Ait illi: Dic, ut sédeant hi duo fílii mei, unus ad déxteram tuam et unus ad sinístram in regno tuo. Respóndens autem Jesus, dixit: Nescítis, quid petátis. Potéstis bíbere cálicem, quem ego bibitúrus sum? Dicunt ei: Póssumus. Ait illis: Cálicem quidem meum bibétis: sedére autem ad déxteram meam vel sinístram, non est meum dare vobis, sed quibus parátum est a Patre meo. Et audiéntes decem, indignáti sunt de duóbus frátribus. Jesus autem vocávit eos ad se, et ait: Scitis, quia príncipes géntium dominántur eórum: et qui majóres sunt, potestátem exércent in eos. Non ita erit inter vos: sed quicúmque volúerit inter vos major fíeri, sit vester miníster: et qui volúerit inter vos primus esse, erit vester servus. Sicut Fílius hóminis non venit ministrári, sed ministráre, et dare ánimam suam, redemptiónem pro multis.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Book 5 to Gratian, on Faith, ch. 2
      text: |-
        Consideráte, quæ mater filiórum Zebedǽi cum fíliis et pro fíliis petat: mater est útique, cui pro filiórum honóre sollícitæ, immoderátior quidem, sed tamen ignoscénda mensúra votórum est. Atque mater ætáte longǽva, stúdio religiósa, solátio destitúta, quæ tunc témporis, quando vel juvánda, vel alénda foret válidæ prolis auxílio, abésse sibi líberos patiebátur, et voluptáti suæ mercédem sequéntium Christum prætúlerat filiórum. Qui prima voce vocáti a Dómino (ut légimus) relíctis rétibus et patre, secúti sunt eum.

        Hæc ígitur, stúdio matérnæ sedulitátis indulgéntior, obsecrábat Salvatórem, dicens: Ut sédeant hi duo fílii mei, unus ad déxteram tuam, et alter ad sinístram in regno tuo. Etsi error, pietátis tamen error est. Nésciunt enim matérna víscera patiéntiam: etsi voti avára, tamen veniábilis cupíditas, quæ non pecúniæ est ávida, sed grátiæ. Nec inverecúnda petítio, quæ non sibi, sed líberis consulébat. Matrem consideráte, matrem cogitáte.

        Considerábat Christus matris dilectiónem, quæ filiórum mercéde grandǽvam solabátur senéctam: et desidériis licet fessa matérnis, carissimórum pignórum tolerábat abséntiam. Consideráte étiam féminam, hoc est, sexum fragiliórem, quem Dóminus própria nondum confirmáverat passióne. Consideráte, inquam, Hevæ illíus primæ mulíeris herédem, transfúsa in omnes immoderátæ cupiditátis successióne labéntem: quam Dóminus adhuc próprio sánguine non redémerat, nondum inólitam afféctibus ómnium immódici contra fas honóris appeténtiam suo Christus cruóre dilúerat. Hereditário ígitur múlier delinquébat erróre.
      responsory: |-
        R. Dixit Angelus ad Jacob: * Dimítte me, auróra est. Respóndit ei: Non dimíttam te, nisi benedíxeris mihi. Et benedíxit ei in eódem loco.
        V. Cumque surrexísset Jacob, ecce vir luctabátur cum eo usque mane: et cum vidéret quod eum superáre non posset, dixit ad eum.
        R. Dimítte me, auróra est. Respóndit ei: Non dimíttam te, nisi benedíxeris mihi. Et benedíxit ei in eódem loco.
      status: verified
