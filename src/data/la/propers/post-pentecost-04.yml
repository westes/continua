# Nocturn 2-3, 4th Sunday after Pentecost. Sourced from Tempora/Pent04-0.txt.
# See post-pentecost-02.yml for sweep method/responsory-reuse note.
# Nocturn 2: St. Augustine sermon on David and Goliath as a type of Christ
# and the devil, one continuous work (Lectio4-6). Nocturn 3: Lectio7 bare
# incipit (Luke 5:1-11, the miraculous catch) skipped; Lectio8-9 one
# continuous homily by St. Ambrose, combined.
#
# Update (2026-09): the Gospel pericope itself, previously left unauthored
# per the "bare incipit, skip it" convention described above, is now
# authored too (isGospel: true, immediately before the homily) - sourced
# from the Missale's own [Evangelium] for the same Sunday (the Mass Gospel
# and the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
# Matins now shows the full Gospel, then the homily on it, matching
# post-pentecost-15's original pattern - see TODO.md's dated entry.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 197 on the Feast (circa medium)
      text: |-
        Stabant fílii Israël contra adversários quadragínta diébus. Quadragínta dies, propter quátuor témpora et quátuor partes orbis terræ, vitam præséntem signíficant, in qua contra Góliath vel exércitum ejus, id est, contra diábolum et ángelos ejus, Christianórum pópulus pugnáre non désinit. Nec tamen víncere posset, nisi verus David Christus cum báculo, id est, cum crucis mystério descendísset. Ante advéntum enim Christi, fratres caríssimi, solútus erat diábolus; véniens Christus fecit de eo, quod in Evangélio dictum est: Nemo potest intráre in domum fortis et vasa ejus dirípere, nisi prius alligáverit fortem. Venit ergo Christus et alligávit diábolum.

        Sed dicit áliquis: Si alligátus est, quare adhuc tantum prǽvalet? Verum est, fratres caríssimi, quia multum prǽvalet: sed tépidis, et negligéntibus, et Deum in veritáte non timéntibus dominátur. Alligátus est enim tamquam innéxus canis caténis et néminem potest mordére, nisi eum qui se illi mortífera securitáte conjúnxerit. Jam vidéte, fratres, quam stultus est homo ille, quem canis in caténa pósitus mordet. Tu te illi per voluntátes et cupiditátes sǽculi noli conjúngere, et ille ad te non præsúmit accédere. Latráre potest, sollicitáre potest; mordére omníno non potest, nisi voléntem. Non enim cogéndo, sed suadéndo nocet; nec extórquet a nobis consénsum, sed petit.

        Venit ergo David et invénit Judæórum pópulum contra diábolum præliántem; et cum nullus esset qui præsúmeret ad singuláre certámen accédere, ille qui figúram Christi gerébat, procéssit ad prǽlium, tulit báculum in manu sua et éxiit contra Góliath. Et in illo quidem tunc figurátum est, quod in Dómino Jesu Christo complétum est. Venit enim verus David Christus, qui contra spiritálem Góliath, id est, contra diábolum pugnatúrus crucem suam ipse portávit. Vidéte, fratres, ubi David Góliath percússerit: in fronte útique, ubi crucis signáculum non habébat. Sicut enim báculus crucis typum hábuit, ita étiam et lapis ille, de quo percússus est, Christum Dóminum figurábat.
      responsory: |-
        R. Percússit Saul mille, et David decem míllia: * Quia manus Dómini erat cum illo: percússit Philisthǽum, et ábstulit oppróbrium ex Israël.
        V. Nonne iste est David, de quo canébant in choro, dicéntes: Saul percússit mille, et David decem míllia?
        R. Quia manus Dómini erat cum illo: percússit Philisthǽum, et ábstulit oppróbrium ex Israël.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 5:1-11
      text: 'In illo témpore: Cum turbæ irrúerent in Jesum, ut audírent verbum Dei, et ipse stabat secus stagnum Genésareth. Et vidit duas naves stantes secus stagnum: piscatóres autem descénderant et lavábant rétia. Ascéndens autem in unam navim, quæ erat Simónis, rogávit eum a terra redúcere pusíllum. Et sedens docébat de navícula turbas. Ut cessávit autem loqui, dixit ad Simónem: Duc in altum, et laxáte rétia vestra in captúram. Et respóndens Simon, dixit illi: Præcéptor, per totam noctem laborántes, nihil cépimus: in verbo autem tuo laxábo rete. Et cum hoc fecíssent, conclusérunt píscium multitúdinem copiósam: rumpebátur autem rete eórum. Et annuérunt sóciis, qui erant in ália navi, ut venírent et adjuvárent eos. Et venérunt, et implevérunt ambas navículas, ita ut pæne mergeréntur. Quod cum vidéret Simon Petrus, prócidit ad génua Jesu, dicens: Exi a me, quia homo peccátor sum, Dómine. Stupor enim circumdéderat eum et omnes, qui cum illo erant, in captúra píscium, quam céperant: simíliter autem Jacóbum et Joánnem, fílios Zebedǽi, qui erant sócii Simónis. Et ait ad Simónem Jesus: Noli timére: ex hoc jam hómines eris cápiens. Et subdúctis ad terram návibus, relictis ómnibus, secuti sunt eum.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, Bishop of Milan, on Luke, Book 4, ch. 5
      text: |-
        Ubi Dóminus multis impartívit vária génera sanitátum, nec témpore, nec loco pótuit ab stúdio sanándi turba cohibéri. Vesper incúbuit, sequebántur: stagnum occúrrit, urgébant: et ídeo ascéndit in Petri navim. Hæc est illa navis, quæ adhuc secúndum Matthǽum flúctuat, secúndum Lucam replétur píscibus: ut et princípia Ecclésiæ fluctuántis, et posterióra exuberántis agnóscas. Pisces enim sunt, qui hanc enávigant vitam. Ibi adhuc discípulis Christus dormit, hic prǽcipit; dormit enim tépidis, perféctis vígilat.

        Non turbátur hæc navis, in qua prudéntia navigat, abest perfidia, fides aspirat. Quemádmodum enim turbari poterat, cui præerat is, in quo Ecclésiæ firmaméntum est? Illic ergo turbátio, ubi módica fides; hic securitas, ubi perfécta diléctio. Et si aliis imperátur ut laxent rétia sua, soli tamen Petro dícitur: Duc in altum; hoc est, in profúndum disputatiónum. Quid enim tam altum, quam altitúdinem divitiárum vidére, scire Dei Fílium, et professiónem divinæ generatiónis assúmere? Quam licet mens non queat humana plene ratiónis investigatióne comprehéndere, fidei tamen plenitúdo compléctitur.

        Nam, etsi non licet mihi scire quemádmodum natus sit, non licete tamen nescire quod natus sit. Seriem generatiónis ignoro; sed auctórem generatiónis agnosco. Non interfúimus cum ex Patre Dei Fílius nascerétur; sed interfúimus cum a Patre Dei Fílius dicerétur. Si Deo non crédimus, cui credémus? Omnia enim quæ crédimus, vel visu crédimus, vel audítu: visus sæpe fállitur, audítus in fide est.
      responsory: |-
        R. Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.
        V. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.
        R. Plena est omnis terra glória ejus.
      status: verified
