# Matins Nocturn 2 reading for Bl. Innocent V, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/06-22-InnocentiusV.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Innocéntius, ántea Petrus de Tarentasia dictus, anno supra millésimum círciter bis centésimo vigésimo quinto natus est. Dives æque ac nóbilis et elegantioris formæ a tenera ætáte in Órdine prædicatórum se suaque ómnia Deo mancipávit. Per annos ferme trigínta in cœnóbio Parisiénsi religiósis móribus sacrisque lítteris appríme excultus, sapiéntiæ ac sanctitátis culmen ascéndit. Ad theologicas disciplinas in Academía Parisiénsi tradendas, et ad régimen Provínciæ sui Órdinis semel et íterum vocátus egrégius fuit sacræ sciéntiæ Magíster, et prælatus inter fratres acceptissimus. Uberrimo animárum fructu pópulos Gálliæ verbi Dei prædicatióne informavit, sibíque haud exiguam dicendi laudem promeruit.

        A beáto Gregório Décimo Pontífice máximo Ecclésiæ Lugdunensi regendæ præpósitus, cleri populique graves ac diuturnas contentiones brevi ac felíciter sedávit. In Senatum Purpuratorum Patrum adscítus Œcumenicæ Synodo Lugdúni celebrandæ sollícite ómnia dispósuit: tum in ipsa Synodo jussu Pontíficis una cum sancto Bonaventúra majóris momenti negótia moderátus est. Ejus præsértim ópera Græcórum conjunctio cum Latinis probata est: quærelæ cleri sæcularis contra regulárem sublatæ, et Conclavis statuta ad futuras Romanórum Pontíficum electiones sancita.

        Aretii beáto Gregório Décimo vita functo, cunctis Cardinálium suffrágiis ad Petri Cáthedram evéctus est. Magnanimi decessoris consília prosecútus, impigre stúduit ut Orientales a jugo infidélium liberaret: Carolum Sicíliæ regem cum Italicis civitatibus amice compósuit: Rodulphum imperatórem Ecclésiæ Románæ ditioni ab Alpibus minitántem propulsavit: contra Saracénos, Hispániam invadentes, celeritate magna exércitum cruce signatorum instruxit: normas dedit, quibus religiósa Græcórum cum Latinis reconciliatio perficerétur, a successoribus sédulo retentas. Hæc tanta operátus brevi quinque mensium decúrsu, dum majóra adhuc ab eo sperabat Ecclésia, febri Romæ corréptus anno ætátis suæ quinquagésimo primo ad Súperos piíssime evolávit. Multis in vita et post mortem miráculis cláruit. Quamóbrem statim ab éxitu cultus ecclesiasticus beáto Pontífici præstitus fuit: quem nunquam intermissum, ex Sacrórum Rítuum Congregatiónis consúlto, Leo Papa Décimus tértius confirmávit.
      status: verified
