# Matins Nocturn 2-3 readings for St. John before the Latin Gate (May
# 6) — SanctiM/05-06.txt's own Lectio5-9 all resolve back to
# `@Sancti/05-06:LectioN` (resliced), so this feast's own proper
# content is sourced from the Tridentine track exactly as for a
# pre-1955 saint (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/05-06.txt, English/Sancti/05-06.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous
# excerpt from St. Jerome.
# Nocturn 3: Lectio7's Gospel citation (Matt 20:20-23) was previously a
# bare incipit ("Et réliqua") with only the homily authored, a single
# excerpt of St. Jerome's own commentary. No responsory given for
# either reading.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily) — sourced from this
# feast's own Missale Evangelium, given in full (missa/Latin+English/
# Sancti/05-06.txt), not guessed at. (St. James the Greater's own
# Missale Gospel — a separate feast, Jul 25 — is this same pericope
# reused verbatim via its own `@Sancti/05-06` redirect; authored there
# independently, not copy-pasted from this file.)
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Jerome, Priest, Against Jovinian, Bk. 1
      text: |-
        Joánnes Apóstolus, unus ex discípulis Dómini, qui mínimus natu tráditur fuísse inter Apóstolos, et quem fides Christi vírginem repérerat, virgo permánsit; et ídeo plus amátur a Dómino, et recúmbit super pectus Jesu; et, quod Petrus, qui uxórem habúerat, interrogáre non audet, illum rogat, ut intérroget; et post resurrectiónem, nuntiánte María Magdaléne quod Dóminus resurrexísset, utérque cucúrrit ad sepúlcrum, sed ille prævénit; cumque essent in navi, et piscaréntur in lacu Genésareth, Jesus stabat in líttore, nec sciébant Apóstoli quem vidérent; solus virgo Vírginem agnóscit, et dicit Petro: Dóminus est.

        Fuit autem Joánnes et Apóstolus, et Evangelísta, et Prophéta: Apóstolus, quia scripsit ad ecclésias ut magíster; Evangelísta, quia librum Evangélii cóndidit, quod, excépto Matthǽo, álii ex duódecim Apóstoli non fecérunt; Prophéta, vidit enim in Patmos ínsula, in qua fúerat a Domitiáno príncipe ob Dómini martýrium relegátus, Apocalýpsim, infiníta futurórum mystéria continéntem. Refert autem Tertulliánus, quod Romæ missus in fervéntis ólei dólium, púrior et vegétior exíverit, quam intráverit.

        Sed et ipsum ejus Evangélium multum distat a céteris. Matthǽus quasi de hómine íncipit scríbere: Liber generatiónis Jesu Christi, fílii David, fílii Abraham; Lucas a sacerdótio Zacharíæ; Marcus a prophetía Malachíæ et Isaíæ. Primus habet fáciem hóminis, propter genealogíam; secúndus fáciem vítuli, propter sacerdótium; tértius fáciem leónis, propter vocem clamántis in desérto, Paráte viam Dómini, rectas fácite sémitas ejus. Joánnes vero noster quasi áquila ad supérna volat, et ad ipsum Patrem pervénit, dicens: In princípio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 20:20-23
      text: 'In illo témpore: Accéssit ad Jesum mater filiórum Zebedǽi cum fíliis suis, adórans et petens áliquid ab eo. Qui dixit ei: Quid vis? Ait illi: Dic, ut sédeant hi duo fílii mei, unus ad déxteram tuam, et unus ad sinístram in regno tuo. Respóndens autem Jesus, dixit: Néscitis, quid petátis. Potéstis bíbere cálicem, quem ego bibitúrus sum? Dicunt ei: Póssumus. Ait illis: Cálicem quidem meum bibétis: sedére autem ad déxteram meam vel sinístram, non est meum dare vobis, sed quibus parátum est a Patre meo.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Priest, Commentary on Matthew, Bk. 3 (on Matt 20:20-23)
      text: 'Unde opiniónem regni habet mater filiórum Zebedǽi, ut cum Dóminus díxerit: Fílius hóminis tradétur princípibus sacerdótum et scribis, et condemnábunt eum morte, et tradent Géntibus ad illudéndum et flagellándum et crucifigéndum; et ignomíniam passiónis timéntibus discípulis nuntiáret, illa glóriam póstulet triumphántis? Hac, ut reor, ex causa, quia post ómnia díxerat Dóminus, Et tértia die resúrget; putávit eum múlier post resurrectiónem íllico regnatúrum, et hoc, quod in secúndo advéntu promíttitur, in primo esse compléndum; et, aviditáte femínea præséntia cupit, ímmemor futurórum.'
      status: verified
