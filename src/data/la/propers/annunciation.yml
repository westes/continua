# Matins Nocturn 2-3 readings for the Annunciation of the Blessed
# Virgin Mary (Mar 25). Sourced directly from
# web/www/horas/Latin/Sancti/03-25.txt, English/Sancti/03-25.txt.
# (Lectio1-3, Isa 11:1-5, left to the bible-plan store as usual.)
#
# Nocturn 2: Lectio4-6 combined into one reading, Pope St. Leo the
# Great's sermon.
# Nocturn 3: Lectio7's Gospel citation (Luke 1:26-38) is a bare incipit
# ("Et réliqua"), so only the homily was originally authored (not marked
# isGospel), St. Ambrose's homily (Lectio7's homily + Lectio8-9 combined).
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily) — this feast's own
# [Evangelium] redirects `@Commune/C10a`, which itself redirects
# `@Tempora/Adv3-3` (Advent Ember Wednesday's Mass Gospel), sourced from
# missa/Latin/Tempora/Adv3-3.txt, English/Tempora/Adv3-3.txt, not
# guessed at.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope St. Leo the Great, Sermon 2 on the Nativity
      text: |-
        Deus omnípotens et clemens, cujus natúra bónitas, cujus volúntas poténtia, cujus opus misericórdia est, statim ut nos diabólica malígnitas venéno suæ mortificávit invídiæ, prædestináta renovándis mortálibus suæ pietátis remédia, inter ipsa mundi primórdia præsignávit; denúntians serpénti futúrum semen mulíeris, quod nóxii cápitis elatiónem sua virtúte contéreret, Christum scílicet in carne ventúrum; Deum hominémque signans, qui natus ex Vírgine, violatórem humánæ propáginis incorrúpta nativitáte damnáret.

        Nam quia gloriabátur diábolus hóminem sua fraude decéptum divínis caruísse munéribus, et immortalitátis dote nudátum, duram mortis subísse senténtiam, seque in malis suis quoddam de prævaricatóris consórtio invenísse solátium; Deum quoque, justæ severitátis exigénte ratióne, erga hóminem, quem in tanto honóre condíderat, antíquam mutásse senténtiam: opus fuit, dilectíssimi, secréti dispensatióne consílii ut incommutábilis Deus, cujus volúntas non potest sua benignitáte privári, primam pietátis suæ dispositiónem sacraménto occultióre compléret; et homo diabólicæ iniquitátis versútia actus in culpam, contra Dei propósitum non períret.

        Adveniéntibus ergo tempóribus, dilectíssimi, quæ redemptióni hóminum fúerant præstitúta, ingréditur hæc ínfima Jesus Christus, Dóminus noster, de cælésti sede descéndens, et a patérna glória non recédens, novo órdine, nova nativitáte generátus: novo órdine, quia, invisíbilis in suis, visíbilis factus est in nostris; incomprehensíbilis, vóluit comprehéndi; ante témpora manens, esse cœpit ex témpore; universitátis Dóminus servílem formam, obumbráta majestátis suæ dignitáte, suscépit; impassíbilis Deus, non dedignátus est homo esse passíbilis; et immortális, mortis légibus subjacére.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 1:26-38
      text: 'In illo témpore: Missus est Angelus Gábriel a Deo in civitátem Galilǽæ, cui nomen Názareth, ad Vírginem desponsátam viro, cui nomen erat Joseph, de domo David, et nomen Vírginis María. Et ingréssus Angelus ad eam, dixit: Ave, grátia plena; Dóminus tecum: benedícta tu in muliéribus. Quæ cum audísset, turbáta est in sermóne ejus: et cogitábat, qualis esset ista salutátio. Et ait Angelus ei: Ne tímeas, María, invenísti enim grátiam apud Deum: ecce, concípies in útero, et páries fílium, et vocábis nomen ejus Jesum. Hic erit magnus, et Fílius Altíssimi vocábitur, et dabit illi Dóminus Deus sedem David, patris ejus: et regnábit in domo Jacob in ætérnum, et regni ejus non erit finis. Dixit autem María ad Angelum: Quómodo fiet istud, quóniam virum non cognósco? Et respóndens Angelus, dixit ei: Spíritus Sanctus supervéniet in te, et virtus Altíssimi obumbrábit tibi. Ideóque et quod nascétur ex te Sanctum, vocábitur Fílius Dei. Et ecce, Elísabeth, cognáta tua, et ipsa concépit fílium in senectúte sua: et hic mensis sextus est illi, quæ vocátur stérilis: quia non erit impossíbile apud Deum omne verbum. Dixit autem María: Ecce ancílla Dómini, fiat mihi secúndum verbum tuum.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, Commentary on Luke, Book II (on Luke 1:26-38)
      text: |-
        Latent quidem divína mystéria, nec fácile, juxta prophéticum dictum, quisquam hóminum potest scire consílium Dei. Sed tamen ex céteris factis, atque præcéptis Dómini Salvatóris póssumus intellégere, et hoc propensióris fuísse consílii, quod ea potíssimum elécta est, ut Dóminum páreret, quæ erat desponsáta viro. Cur autem non ántequam desponsarétur, impléta est? Fortásse ne dicerétur quod concéperat ex adultério.

        Et ingréssus ad eam Angelus. Disce vírginem móribus, disce vírginem verecúndia, disce oráculo, disce mystério. Trepidáre vírginum est, et ad omnes viri ingréssus pavére, omnes viri affátus veréri. Discant mulíeres propósitum pudóris imitári. Sola in penetrálibus, quam nemo virórum víderit, solus Angelus repérerit: sola sine cómite, sola sine teste, ne quo degénere depravarétur affátu, ab Angelo salutátur.

        Tanti namque mandáti mystérium non hóminis fuit, sed Angeli ore proméndum. Hódie primum audítur: Spíritus Sanctus supervéniet in te. Et audítur, et créditur. Dénique, Ecce, inquit, ancílla Dómini: contíngat mihi secúndum verbum tuum. Vide humilitátem, vide devotiónem. Ancíllam se dicit Dómini, quæ mater elígitur: nec repentíno exaltáta promísso est.
      status: verified
