  status: verified

# Matins Nocturn 2-3 readings for the Presentation of the Blessed Virgin
# Mary (Nov 21). Sourced directly from web/www/horas/Latin/Sancti/11-21.txt,
# English/Sancti/11-21.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading — two genuinely
# continuous excerpts (St. John Damascene on Mary's own presentation as
# a child, St. Ambrose's praise of her as a model for virgins), kept as
# one reading since both address the same theme without a hard source
# break the way a Gospel-then-homily split would need. (The source's
# own `[Lectio94]` is `@:Lectio4`, a bare cross-reference back to
# Lectio4 for a lower-rank fallback, not additional content.)
# Nocturn 3: no Lectio7-9 override in her own file at all (her `[Rule]`
# is `vide C11`), so — like our-lady-of-the-snows.yml — this defers to
# the Common of Feasts of the BVM's own Nocturn 3 (Commune/C11.txt): a
# bare Gospel incipit (Luke 11:27-28, "Et réliqua") followed by the
# Venerable Bede's homily. Identical content to
# our-lady-of-the-snows.yml's own Nocturn 3, duplicated rather than
# cross-referenced (the Matins mechanism has no cross-id lookup for
# nocturn-readings the way collect/antiphon do via `propers`).
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before Bede's homily), same text and
# same sourcing note as our-lady-of-the-snows.yml's own fix — Commune/
# C11.txt's own Missa [Evangelium] gives the full two-verse pericope,
# where its Nocturn 3 Lectio7 cuts off at "Et réliqua".
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Jóachim lectíssimam illam ac summis láudibus dignam mulíerem Annam matrimónio sibi copulávit. Verum, quemádmodum prisca illa Anna, cum sterilitátis morbo laboráret, per oratiónem ac promissiónem, Samuélem procreávit; eódem modo hæc étiam, per obsecratiónem et promissiónem, Dei Genetrícem a Deo accépit, ut ne hic quoque cuíquam ex illústribus matrónis céderet. Itaque grátia (nam hoc sonat Annæ vocábulum) Dóminam parit (id enim Maríæ nómine significátur). Vere étenim rerum ómnium conditárum Dómina facta est, cum Creatóris Mater éxstitit. In lucem autem éditur in domo probáticæ Jóachim, atque ad templum addúcitur. Ac deínde, in domo Dei plantáta atque per Spíritum sagináta, instar olívæ frugíferæ virtútum ómnium domicílium effícitur; ut quæ vidélicet ab omni hujúsce vitæ et carnis concupiscéntia mentem abstraxísset, atque ita vírginem una cum córpore ánimam conservásset, ut eam decébat, quæ Deum sinu suo exceptúra erat.

        Talis fuit Maria, ut ejus uníus vita ómnium sit disciplína. Si ígitur auctor non dísplicet, opus probémus; ut, quæcúmque sibi ejus exoptat præmium, imitétur exemplum. Quantæ in una vírgine spécies virtútum émicant! Secretum verecúndiæ, vexíllum fidei, devotiónis obséquium; virgo intra domum, comes ad ministérium, mater ad templum. O quantis illa virgínibus occúrret! quantas complexa, ad Dóminum trahet, dicens: Hæc torum fílii mei, hæc thálamos nuptiáles immaculáto servávit pudóre!

        Quid ergo éxsequar cibórum parsimóniam, officiórum redundántiam: álterum ultra natúram superfuísse, álterum pene ipsi natúræ defuísse? Illic nulla intermíssa témpora, hic congemínatos jejúnio dies. Et, si quando reficiéndi successísset volúntas, cibus plerúmque óbvius, qui mortem arcéret, non delícias ministráret. Dormíre non prius cupíditas quam necéssitas fuit; et tamen, cum quiésceret corpus, vigiláret ánimus, qui frequénter in somnis aut lecta répetit, aut somno intérrupta contínuat, aut dispósita gerit, aut geréndas prænúntiat.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luc 11:27-28
      text: 'In illo témpore: Loquénte Jesu ad turbas, extóllens vocem quædam múlier de turba, dixit illi: Beátus venter, qui te portávit, et úbera, quæ suxísti. At ille dixit: Quinímmo beáti, qui áudiunt verbum Dei, et custódiunt illud.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: The Venerable Bede, Commentary on Luke, Book IV, ch. 49 (on Luke 11:27-28)
      text: |-
        Magnæ devotiónis et fídei hæc múlier osténditur, quæ, scribis et pharisǽis Dóminum tentántibus simul et blasphemántibus, tanta ejus incarnatiónem præ ómnibus sinceritáte cognóscit, tanta fidúcia confitétur, ut et præséntium prócerum calúmniam, et futurórum confúndat hæreticórum perfídiam. Nam, sicut tunc Judǽi, Sancti Spíritus ópera blasphemándo, verum consubstantialémque Patri Dei Fílium negábant; sic hærétici póstea, negándo Maríam semper Vírginem, Sancti Spíritus operánte virtúte, nascitúro cum humánis membris Unigénito Dei, carnis suæ matériam ministrásse, verum consubstantialémque matri Fílium hóminis fatéri non debére dixérunt.

        Si caro Verbi Dei secúndum carnem nascéntis a carne Vírginis matris pronuntiátur extránea, sine causa venter qui eam portásset, úbera quæ lactássent, beatificántur. Dicit autem Apóstolus: Quia misit Deus Fílium suum, factum ex mulíere, factum sub lege. Neque audiéndi sunt, qui legéndum putant: Natum ex mulíere, factum sub lege, sed Factum ex mulíere; quia concéptus ex útero virgináli, carnem non de níhilo, non aliúnde, sed matérna traxit ex carne. Alióquin nec vere Fílius hóminis dicerétur, qui oríginem non habéret ex hómine. Et nos ígitur, his contra Eutychen dictis, extollámus vocem cum Ecclésia cathólica, cujus hæc múlier typum gessit, extollámus et mentem de médio turbárum, dicamúsque Salvatóri: Beátus venter qui te portávit, et úbera quæ suxísti. Vere enim beáta parens, quæ, sicut quidam ait, Eníxa est puérpera Regem, qui cælum terrámque tenet per sǽcula.

        Quinímmo beáti qui áudiunt verbum Dei et custódiunt. Pulchre Salvátor attestatióni mulíeris ánnuit, non eam tantúmmodo quæ Verbum Dei corporáliter generáre merúerat, sed et omnes qui idem Verbum spiritáliter audítu fídei concípere, et boni óperis custódia vel in suo vel in proximórum corde párere et quasi álere studúerint, asséverans esse beátos; quia, et éadem Dei Génetrix, et inde quidem beáta quia Verbi incarnándi minístra facta est temporális, sed inde multo beátior quia ejúsdem semper amándi custos manébat ætérna.
      status: verified
