# Read directly from web/www/horas/Latin/Sancti/11-21.txt's own [Oratio]
# and its English counterpart -- a real, proper collect, not a Common
# fallback (unlike this feast's Benedictus antiphon).
collect:
  text: |
    Orémus.
    Deus, qui beátam Maríam semper Vírginem, Spíritus Sancti habitáculum, hodiérna die in
    templo præsentári voluísti: præsta, quǽsumus; ut, ejus intercessióne, in templo glóriæ
    tuæ præsentári mereámur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (presentation-of-the-bvm-antiphon.yml), paired with the standard BVM commemoration versicle already verified elsewhere in this app (propers/common/lauds-suffrage-bvm.yml -- 'V. Ora pro nobis sancta Dei Genitrix'). Collect is the saint's own real proper (presentation-of-the-bvm-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Beáta Dei Génetrix, María, * Virgo perpétua, templum Dómini, sacrárium Spíritus Sancti, sola sine exémplo placuísti Dómino nostro Jesu Christo, allelúia.
    V. Ora pro nobis sancta Dei Génitrix.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Deus, qui beátam Maríam semper Vírginem, Spíritus Sancti habitáculum, hodiérna die in
    templo præsentári voluísti: præsta, quǽsumus; ut, ejus intercessióne, in templo glóriæ
    tuæ præsentári mereámur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Read directly from web/www/horas/Latin/Sancti/11-21.txt's own [Ant 1]
# cross-reference and its English counterpart -- `@Commune/C10:Ant 2_`
# (Common of the BVM on Saturday) with a feast-specific substitution
# applied and computed by hand here: `s/Christo:.*/Christo, allelúia./`
# (Latin) / `s/Christ;.*/Christ, alleluia./` (English) -- truncates the
# Common's own antiphon after "...Jesu Christo"/"...Jesus Christ" and
# appends ", allelúia."/", alleluia." instead of continuing with "ora
# pro pópulo..."/"pray for the people...". Effectively proper to this
# feast (the substitution isn't shared by any other saint using C10),
# so authored as its own file via `propers` rather than as a reusable
# Common template.
benedictus-antiphon:
  text: Beáta Dei Génetrix, María, * Virgo perpétua, templum Dómini, sacrárium Spíritus Sancti, sola sine exémplo placuísti Dómino nostro Jesu Christo, allelúia.
  status: verified

# Presentation of the BVM (Nov 21) Magnificat antiphon, both evenings: engine render (Monastic Tridentinum 1617, command=prayVespera, 2026-11-20 and 2026-11-21).
magnificat-antiphon:
