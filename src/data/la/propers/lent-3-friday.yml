# Matins Nocturn content for Friday of Lent week 3 — read from
# web/www/horas/{Latin,English}/Tempora/Quad3-5.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad3-5.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Augustine
# homily split only to fill the fixed 3-lesson slot count). Responsory1
# is a cross-reference (@Tempora/Quad3-0:Responsory4) — used here per
# the "the first one, when several collapse" convention.
nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Joann 4:5-42
      text: 'In illo témpore: Venit Jesus in civitátem Samaríæ, quæ dícitur Sichar: juxta prǽdium, quod dedit Jacob Joseph, fílio suo. Erat autem ibi fons Jacob. Jesus ergo fatigátus ex itínere, sedébat sic supra fontem. Hora erat quasi sexta. Venit múlier de Samaría hauríre aquam. Dicit ei Jesus: Da mihi bíbere. Discípuli enim ejus abíerant in civitátem, ut cibos émerent. Dicit ergo ei múlier illa Samaritána: Quómodo tu, Judǽus cum sis, bíbere a me poscis, quæ sum múlier Samaritána? non enim coutúntur Judǽi Samaritánis. Respóndit Jesus et dixit ei: Si scires donum Dei, et quis est, qui dicit tibi: Da mihi bibere: tu fórsitan petísses ab eo, et dedísset tibi aquam vivam. Dicit ei múlier: Dómine, neque in quo háurias habes, et púteus altus est: unde ergo habes aquam vivam? Numquid tu major es patre nostro Jacob, qui dedit nobis púteum, et ipse ex eo bibit et fílii ejus et pécora ejus? Respóndit Jesus et dixit ei: Omnis, qui bibit ex aqua hac, sítiet íterum: qui autem bíberit ex aqua, quam ego dabo ei, non sítiet in ætérnum: sed aqua, quam ego dabo ei, fiet in eo fons aquæ saliéntis in vitam ætérnam. Dicit ad eum mulier: Dómine, da mihi hanc aquam, ut non sítiam neque véniam huc hauríre. Dicit ei Jesus: Vade, voca virum tuum, et veni huc. Respóndit múlier, et dixit: Non hábeo virum. Dicit ei Jesus: Bene dixísti, quia non hábeo virum: quinque enim viros habuísti, et nunc, quem habes, non est tuus vir: hoc vere dixísti. Dicit ei múlier: Dómine, vídeo, quia Prophéta es tu. Patres nostri in monte hoc adoravérunt, et vos dícitis, quia Jerosólymis est locus, ubi adoráre opórtet. Dicit ei Jesus: Múlier, crede mihi, quia venit hora, quando neque in monte hoc, neque in Jerosólymis adorábitis Patrem. Vos adorátis, quod nescítis: nos adorámus, quod scimus, quia salus ex Judǽis est. Sed venit hora, et nunc est, quando veri adoratóres adorábunt Patrem in spíritu et veritáte. Nam et Pater tales quærit, qui adórent eum. Spíritus est Deus: et eos, qui adórant eum, in spíritu et veritáte opórtet adoráre. Dicit ei mulier: Scio, quia Messías venit (qui dícitur Christus). Cum ergo vénerit ille, nobis annuntiábit ómnia. Dicit ei Jesus: Ego sum, qui loquor tecum. Et contínuo venérunt discípuli ejus: et mirabántur, quia cum mulíere loquebátur. Nemo tamen dixit: Quid quæris, aut quid loquéris cum ea? Reliquit ergo hýdriam suam múlier, et ábiit in civitátem, et dicit illis homínibus: Veníte, et vidéte hóminem, qui dixit mihi ómnia, quæcúmque feci: numquid ipse est Christus? Exiérunt ergo de civitáte, et veniébant ad eum. Intérea rogábant eum discípuli, dicéntes: Rabbi, mandúca. Ille autem dicit eis: Ego cibum habeo manducáre, quem vos nescítis. Dicébant ergo discípuli ad ínvicem: Numquid áliquis áttulit ei manducáre? Dicit eis Jesus: Meus cibus est, ut fáciam voluntátem ejus, qui misit me, ut perfíciam opus ejus. Nonne vos dícitis, quod adhuc quátuor menses sunt, et messis venit? Ecce, dico vobis: Leváte óculos vestros, et vidéte regiónes, quia albæ sunt jam ad messem. Et qui metit, mercédem áccipit, et cóngregat fructum in vitam ætérnam: ut, et qui séminat, simul gáudeat, et qui metit. In hoc enim est verbum verum: quia álius est qui séminat, et álius est qui metit. Ego misi vos métere quod vos non laborástis: alii laboravérunt, et vos in labóres eórum introístis. Ex civitáte autem illa multi credidérunt in eum Samaritanórum, propter verbum mulíeris testimónium perhibéntis: Quia dixit mihi ómnia, quæcúmque feci. Cum veníssent ergo ad illum Samaritáni, rogavérunt eum, ut ibi manéret. Et mansit ibi duos dies. Et multo plures credidérunt in eum propter sermónem ejus. Et mulíeri dicébant: Quia jam non propter tuam loquélam crédimus: ipsi enim audívimus, et scimus, quia hic est vere Salvátor mundi.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, 15th Tract on John
      text: |-
        Jam incípiunt mystéria. Non enim frustra fatigátur Jesus: non enim frustra fatigátur virtus Dei: non enim frustra fatigátur, per quem fatigáti recreántur: non enim frustra fatigátur, quo deserénte fatigámur, quo præsénte firmámur. Fatigátur tamen Jesus, et fatigátur ab itínere, et sedet, et juxta púteum sedet, et hora sexta fatigátus sedet. Omnia ista ínnuunt áliquid, indicáre volunt áliquid: ut pulsémus, hortántur. Ipse ergo apériat et nobis et vobis, qui dignátus est ita hortári, ut díceret: Pulsáte, et aperiétur vobis.

        Tibi fatigátus est ab itínere Jesus. Invenímus virtútem Jesum, et invenímus infírmum Jesum: fortem, et infírmum. Fortem, quia in princípio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum: hoc erat in princípio apud Deum. Vis vidére quam iste Fílius Dei fortis sit? Omnia per ipsum facta sunt, et sine ipso factum est nihil: et sine labóre facta sunt. Quid ergo illo fórtius, per quem sine labóre facta sunt ómnia? Infírmum vis nosse? Verbum caro factum est, et habitávit in nobis. Fortitúdo Christi te creávit: infírmitas Christi te recreávit. Fortitúdo Christi fecit, ut quod non erat, esset: infírmitas Christi fecit, ut quod erat, non períret. Cóndidit nos fortitúdine sua, quæsívit nos infirmitáte sua.

        Nutrit ergo ipse infírmus infírmos, tamquam gallína pullos suos: huic enim se símilem fecit. Quóties vólui, inquit ad Jerúsalem, congregáre fílios tuos sub alas tamquam gallína pullos suos, et noluísti? Vidétis autem, fratres, quemádmodum gallína infirmétur cum pullis suis. Nulla enim ália avis, quod sit mater, agnóscitur. Vidémus nidificáre pásseres quóslibet ante óculos nostros: hirúndines, cicónias, colúmbas cotídie vidémus nidificáre: quos, nisi quando in nidis vidémus, paréntes esse non agnóscimus. Gallína vero sic infirmátur in pullis suis, ut étiam si ipsi pulli non sequántur, fílios non vídeas, matrem tamen intéllegas.
      responsory: |-
        R. Videns Jacob vestiménta Joseph, scidit vestiménta sua cum fletu, et dixit: * Fera péssima devorávit fílium meum Joseph.
        V. Tulérunt autem fratres ejus túnicam illíus, mitténtes ad patrem: quam cum cognovísset pater, ait.
        R. Fera péssima devorávit fílium meum Joseph.
      status: verified
