# All Saints' Lauds hymn, the older pre-Urban VIII text: Latin/Sancti/11-01.txt's
# [HymnusM Laudes] ("Jesu Salvator saeculi"), which the Monastic and 1570
# versions take in place of [Hymnus Laudes] ("Salutis aeternae dator", the
# Urban VIII revision) -- see tryoldhymn in the reference's specials.pl. The
# English below, from English/Sancti/11-01.txt, translates this text. An
# earlier version of this file carried "Salutis aeternae dator" and a header
# claiming the reverse.
lauds-hymn:
  text: |
    Jesu Salvátor sǽculi,
    Redémptis ope súbveni:
    Et pia Dei Génitrix,
    Salútem posce míseris.

    Cœtus omnes angélici,
    Patriarchárum cúnei,
    Et Prophetárum mérita
    Nobis precéntur véniam.

    Baptísta Christi prǽvius,
    Et Cláviger æthéreus,
    Cum céteris Apóstolis,
    Nos solvant nexu críminis.

    Chorus sacrátus Mártyrum,
    Conféssio Sacerdótum,
    Et virginális cástitas
    Nos a peccátis ábluant.

    Monachórum suffrágia,
    Omnésque cives cǽlici
    Annuant votis súpplicum,
    Et vitæ poscant prǽmium.

    Laus, honor, virtus, glória
    Deo Patri, et Fílio,
    Sancto simul Paráclito,
    In sæculórum sǽcula.
    Amen.
  status: verified

