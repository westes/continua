# Further Matins readings for the All Saints octave days that have them in the reference
# source (Sancti/11-0Xoct.txt, Lectio4-9): Bede (or Bernard, Chrysostom) sermon, then Augustine's
# homily on the Gospel (Matt 5:1-12). Generously kept alongside the Ezekiel reading (DESIGN.md:
# every active octave gets its own reading), see octave-readings.ts getOctaveReadings.
octave-readings/~-octave-day-2-homily:
  source: 'Sermo sancti Bedæ Venerabilis Presbyteri, Sermo 18 de Sanctis'
  text: |
    Quam laxo sinu de prælio revertentes civitas cælestis excipit, de hoste prostrato trophæa ferentibus occurrit. Cum triumphantibus viris et feminæ veniunt, quæ cum sæculo sexum quoque vicerunt, et geminata gloria militiæ, virgines cum pueris teneros annos virtutibus transeuntes: sed et cetera fidelium turba aulæ perpetuæ regiam intrabit, qui sinceritatem fidei inconcussis præceptorum cælestium disciplinis unita pace observaverunt.

    Ergo agite nunc fratres, aggrediamur iter vitæ, revertamur ad civitatem cælestem, in qua scripti sumus, et cives decreti. Non sumus hospites, sed cives Sanctorum et domestici Dei, étiam illius hæredes, cohæredes autem Christi. Hujus nobis urbis januas aperiet fortitudo, et fiducia latum præbebit ingressum. Consideremus ergo inclytam urbis illius felicitatem, in quantum considerare possibile est: ut enim vere est, comprehendere nullus sermo sufficiet.

    Dicitur de ea in quodam loco sic: Quod aufugiet ibi dolor, et tristitia, et gemitus. Quid hac vita beatius, ubi non est paupertatis metus, non ægritudinis imbecillitas? Nemo lædetur, irascetur nemo, nemo invidet, cupiditas nulla exardescit: nullum ibi desiderium honoris pulsat, aut potestatis ambitio. Nullus ibi diaboli metus, insidiæ dæmonum nullæ, terror gehennæ procul: mors neque corporis neque animæ erit, sed immortalitatis munere vita jucunda.
  status: verified

octave-readings/~-octave-day-2-gospel-homily:
  source: 'Homilia sancti Augustini Episcopi, Lib. 1 de Sermone Domini in monte, cap. 1 et 2 (Matt 5:1-12)'
  text: |
    Nec aliunde omnino incipere oportuit beatitudinem, quam a paupertate spiritus, siquidem perventura est ad summam sapientiam. Initium autem sapientiæ timor Domini: quoniam et e contrario, Initium omnis peccati superbia scribitur. Superbi autem appetunt et diligunt regna terrarum. Beati mites: quoniam ipsi hæreditate possidebunt terram: illam credo terram, de qua in Psalmo dicitur: Spes mea es tu, portio mea in terra viventium. Significat enim quamdam soliditatem et stabilitatem hæreditatis perpetuæ, ubi anima per bonum affectum, tamquam loco suo requiescit, sicut corpus in terra: et inde cibo suo alitur, sicut corpus ex terra: ipsa est requies et vita Sanctorum. Mites autem sunt, qui cedunt improbitatibus, et non resistunt malo, sed vincunt in bono malum.

    Beati lugentes quoniam ipsi consolabuntur. Luctus est tristitia de amissione carorum: conversi autem ad Deum, ea, quæ in hoc mundo cara amplectebantur, amittunt. Non enim gaudent his rebus, quibus ante gaudebant: et donec fiat in illis amor æternorum, nonnulla mæstitia sauciantur. Consolabuntur ergo Spiritu sancto, qui maxime propterea Paraclitus nominatur, id est, Consolator: ut temporalia amittentes, æterna lætitia perfruantur.

    Beati qui esuriunt et sitiunt justitiam: quoniam ipsi saturabuntur. Jam istos amatores dicit veri et inconcussi boni. Illo ergo cibo saturabuntur, de quo ipse Dominus dicit: Meus cibus est, ut faciam voluntatem Patris mei, quod est justitia: et illa aqua, de qua quisquis biberit, ut idem dicit, fiet in eo fons aquæ salientis in vitam ætérnam. Beati misericordes: quoniam ipsorum miserebitur Deus. Beatos esse dicit, qui subveniunt miseris: quod eis ita rependitur, ut de miseria liberentur.
  status: verified

octave-readings/~-octave-day-3-homily:
  source: 'Sermo sancti Bedæ Venerabilis Presbyteri, Sermo 18 de Sanctis'
  text: |
    Nulla erit tunc usquam discordia, sed cuncta consona, cuncta convenientia, quia omnium erit Sanctorum una concordia, pax cuncta et lætitia continet. Tranquilla sunt omnia et quieta: jugis splendor, non iste qui nunc est, sed tanto clarior, quanto felicior: quia civitas, ut legitur, illa non egebit lumine solis, sed Dominus omnipotens illuminabit eam, et lucerna ejus est Agnus. Ibi Sancti fulgebunt ut stellæ in perpetuas æternitates, et sicut splendor firmamenti, qui erudiunt multos.

    Quapropter nox ibi nulla, nullæ tenebræ, concursus nubium nullus, nec frigoris aut ardoris asperitas ulla: sed talis quædam erit rerum temperies, qualem nec oculus vidit, nec auris audivit, nec in cor hominis ascendit, nisi illorum qui ea perfrui digni inveniuntur, quorum nomina scripta sunt in libro vitæ, qui et laverunt stolas suas in sanguine Agni, et sunt ante sedem Dei, serviuntque ei die ac nocte. Non est senectus ibi, nec senectutis miseria, dum omnes occurrunt in virum perfectum, in mensuram ætatis plenitudinis Christi.

    Verum super hæc omnia est, consociari Angelorum et Archangelorum cœtibus: Thronis étiam et Dominationibus, Principatibus et Potestatibus, omniumque cælestium supernarum Virtutum contuberniis perfrui, et intueri agmina Sanctorum splendidius sideribus micantia, Patriarcharum fide fulgentia, Prophetarum spe lætantia, Apostolorum in duodecim tribubus Israël orbem judicantia, Mártyrum purpureis victoriæ coronis lucentia, Virginum quoque choros candentia serta gestantes inspicere.
  status: verified

octave-readings/~-octave-day-3-gospel-homily:
  source: 'Homilia sancti Augustini Episcopi, Lib. 1 de Sermone Domini in monte, cap. 2 et 3 (Matt 5:1-12)'
  text: |
    Beati mundo corde: quoniam ipsi Deum videbunt. Quam ergo stulti sunt, qui Deum istis exterioribus oculis quærunt, cum corde videatur, sicut alibi scriptum est: Et in simplicitate cordis quærite illum. Hoc est enim mundum cor, quod est simplex cor: et quemadmodum lumen hoc videri non potest, nisi oculis mundis, ita nec Deus videtur, nisi mundum sit illud quo videri potest. Beati pacifici: quoniam ipsi filii Dei vocabuntur. In pace perfectio est, ubi nihil repugnat: et ideo filii Dei pacifici, quoniam nihil in his resistit Deo, et utique filii similitudinem patris habere debent.

    Pacifici autem in semetipsis sunt, qui omnes animi sui motus componentes et subjicientes rationi, id est, menti et spiritui, carnalesque concupiscentias habentes edomitas, fiunt regnum Dei: in quo ita sunt ordinata omnia, ut id quod est in homine præcipuum et excellens, hoc imperet ceteris non reluctantibus, quæ sunt nobis bestiisque communia; atque idipsum quod excellit in homine, id est, mens et ratio, subjiciatur potiori, quod est ipsa Veritas, unigenitus Filius Dei. Neque enim imperare inferioribus potest, nisi superiori se ipse subjiciat. Et hæc est pax quæ datur in terra hominibus bonæ voluntatis: hæc vita consummati perfectique sapientis.

    De hujusmodi regno pacatissimo et ordinatissimo missus est foras princeps hujus sæculi, qui perversis inordinatisque dominatur. Hac pace intrinsecus constituta atque firmata, quascumque persecutiones ille qui foras missus est, forinsecus concitaverit, auget gloriam quæ secundum Deum est; non aliquid in illo ædificio labefactans, sed deficientibus machinis suis innotescere faciens, quanta firmitas intus exstructa sit. Ideo sequitur: Beati, qui persecutionem patiuntur propter justitiam: quoniam ipsorum est regnum cælorum.
  status: verified

octave-readings/~-octave-day-5-homily:
  source: 'Sermo sancti Bedæ Venerabilis Presbyteri, Sermo 18 de Sanctis'
  text: |
    Ad hanc igitur operum salutarium delectet nos pervenire palmam. Libenter ac prompte certemus, omnes in agone justitiæ Deo et Christo spectante curramus; et qui sæculo et mundo majores esse jam cœpimus, cursum nostrum nulla sæculi cupiditate tardemus. Si expeditos, si celeres in operis agone currentes dies nos ultimus invenerit, nusquam Dominus meritis nostris deerit remunerator.

    Qui coronam in persecutione purpuream pro passione donabit, ipse in pace vincentibus pro justitiæ meritis dabit et candidam. Nam nec Abraham, nec Isaac, nec Jacob occisi sunt; et tamen fidei et justitiæ meritis honorati inter patriarchas primi esse meruerunt: ad quorum congregatur convivium quisquis fidelis, et justus, et laudabilis invenitur. Memores esse debemus, voluntatem non nostram, sed Dei facere debere: quia qui fecerit ejus voluntatem, manet in æternum, quomodo et ille manet in æternum.

    Quapropter, carissimi, mente integra, fide firma, virtute robusta, caritate perfecta, parati ad omnem voluntatem Dei simus, conservantes fortiter Dominica mandata, in simplicitate innocentiam, in caritate concordiam, modestiam in humilitate, diligentiam in administratione, vigilantiam in adjuvandis laborantibus, misericordiam in fovendis pauperibus, in defendenda veritate constantiam, in disciplinæ severitate censuram, ne aliquid ad exemplum bonorum factorum desit in nobis. Hæc sunt enim vestigia quæ nobis Sancti quique revertentes in patriam reliquerunt, ut illorum semitis inhærentes, sequeremur et gaudia.
  status: verified

octave-readings/~-octave-day-5-gospel-homily:
  source: 'Homilia sancti Augustini Episcopi, Lib. 1 de Sermone Domini in monte, cap. 3 et 4 (Matt 5:1-12)'
  text: |
    Itaque in hoc tertio gradu, in quo scientia est, lugetur amissio summi boni, quia inhæretur extremis. In quarto autem gradu labor est: ubi vehementer incumbitur, ut sese animus avellat ab eis quibus pestifera dulcedine innexus est. Hic ergo esuritur et sititur justitia, et multum necessaria est fortitudo: quia non relinquitur sine dolore, quod cum delectatione retinetur. Quinto autem gradu perseverantibus in labore datur evadendi consilium: quia, nisi quisque adjuvetur a superiore, nullo modo sibi est idoneus, ut sese tantis miseriarum implicamentis expediat. Est autem justum consilium, ut qui se a potentiori adjuvari vult, adjuvet et infirmiorem, in quo est ipse potentior. Itaque, Beati misericordes: quia ipsorum miserebitur Deus.

    Sexto gradu est cordis munditia de bona conscientia bonorum operum, valens ad contemplandum summum illud bonum, quod solo puro et sereno intellectu cerni potest. Postremo est septima ipsa sapientia, id est, contemplatio veritatis, pacificans totum hominem, et suscipiens similitudinem Dei, quæ ita concluditur: Beati pacifici: quoniam ipsi filii Dei vocabuntur. Octava tamquam ad caput redit, quia consummatum perfectumque ostendit et probat. Itaque in prima et in octava nominatum est regnum cælorum: Beati pauperes spiritu: quoniam ipsorum est regnum cælorum; et, Beati qui persecutionem patiuntur propter justitiam: quoniam ipsorum est regnum cælorum.

    Cum jam dicitur: Quis nos separabit a caritate Christi? Tribulatio, an angustia, an persecutio, an fames, an nuditas, an periculum, an gladius? Septem sunt ergo, quæ perficiunt: nam octava clarificat, et quod perfectum est, demonstrat, ut per hos gradus perficiantur et ceteri, tamquam a capite rursum exordiens. Videtur ergo mihi étiam septiformis operatio Spiritus sancti, de qua Isaias loquitur, his gradibus sententiisque congruere. Sed interest ordinis: nam ibi enumeratio ab excellentioribus cœpit, hic vero ab inferioribus. Ibi namque incipit a sapientia Dei, et desinit ad timorem Dei: sed initium sapientiæ timor Domini est.
  status: verified

octave-readings/~-octave-day-6-homily:
  source: 'Sermo sancti Bernardi Abbatis, Sermo 2 et 5 de Festo Omnium Sanctorum'
  text: |
    Quia Sanctorum omnium festivam hodie, dilectissimi, omnique dignissimam devotione memoriam celebramus, operæ pretium puto, de communi eorum felicitate, in qua beata jam requie perfruuntur, et futura quam præstolantur consummatione adjuvante Spiritu sancto, sermonem facere caritati vestræ. Fidelis quippe sermo, et omni acceptione dignus: ut quos solemni veneratione prosequimur, étiam simili conversatione sequamur: quos beatissimos prædicamus, ad eorum beatitudinem tota aviditate curramus: quorum delectamur præconiis, sublevemur eorum patrociniis.

    Ad quid ergo Sanctis laus nostra? ad quid glorificatio nostra? ad quid nostra hæc ipsa solemnitas? Quo eis terrenos honores, quos juxta veracem Filii promissionem honorificat Pater cælestis? Quo eis præconia nostra? Pleni sunt. Prorsus ita est, dilectissimi: bonorum nostrorum Sancti non egent, nec quidquam eis nostra devotione præstatur. Plane, quod eorum memoriam veneramur, nostra interest, non ipsorum. Vultis scire quantum interest nostra? Ego in me (fateor) ex hac recordatione sentio desiderium vehemens inflammari, et desiderium triplex.

    Vulgo dicitur: Quod non videt oculus, cor non dolet. Oculus meus, memoria mea: et cogitare de Sanctis, quodammodo eos videre est. Sic nempe portio nostra in terra viventium; nec modica sane portio, si tamen, ut decet, memoriam affectio comitetur: sic, inquam, conversatio nostra in cælis est. Verumtamen non sic nostra, sicut illorum. Ipsorum enim substantia ibi est, nostra autem desideria: ipsi per præsentiam, nos per memoriam ibi sumus.
  status: verified

octave-readings/~-octave-day-6-gospel-homily:
  source: 'Homilia sancti Augustini Episcopi, Lib. 1 de Sermone Domini in monte, cap. 4 (Matt 5:1-12)'
  text: |
    Quapropter, si gradatim tamquam ascendentes numeremus, primus ibi est timor Dei, secunda pietas, tertia scientia, quarta fortitudo, quintum consilium, sextus intellectus, septima sapientia. Timor Dei congruit humilibus, de quibus hic dicitur: Beati pauperes spiritu: quoniam ipsorum est regnum cælorum; id est, non inflati, non superbi, de quibus Apostolus dicit: Noli altum sapere, sed time; id est, noli extolli. Pietas congruit mitibus. Qui enim pie quærit, honorat sanctam Scripturam, et non reprehendit quod nondum intelligit, et propterea non resistit; quod est mitem esse. Unde hic dicitur: Beati mites: quoniam ipsi hereditate possidebunt terram.

    Scientia congruit lugentibus, qui jam cognoverunt in Scripturis, quibus malis vincti teneantur, quæ tamquam bona et utilia ignorantes appetierunt; de quibus hic dicitur: Beati qui lugent nunc. Fortitudo congruit esurientibus et sitientibus: laborant enim desiderantes gaudium de veris bonis, et amórem a terrenis et corporalibus avertere cupientes; de quibus hic dicitur: Beati qui esuriunt et sitiunt justitiam. Consilium congruit misericordibus: hoc enim unum remedium est de tantis malis evadendi, ut dimittamus, sicut nobis dimitti volumus: et adjuvemus, in quo possumus, alios, sicut et nos, in quo non possumus, cupimus adjuvari; de quibus hic dicitur: Beati misericordes: quoniam ipsorum miserebitur Deus.

    Intellectus congruit mundis corde, tamquam purgato oculo, quo cerni possit, quod corporeus oculus non vidit, nec auris audivit, nec in cor hominis ascendit; de quibus hic dicitur: Beati mundo corde: quoniam ipsi Deum videbunt. Sapientia congruit pacificis, in quibus jam ordinata sunt omnia, nullusque motus adversus rationem rebellis est, sed cuncta obtemperant spiritui hominis cum et ipse obtemperet Deo; de quibus hic dicitur: Beati pacifici. Unum autem præmium, quod est regnum cælorum, pro his gradibus varie nominatum est.
  status: verified

octave-readings/~-octave-day-7-homily:
  source: 'Sermo sancti Joannis Chrysostomi, De Martyribus, quod aut imitandi sunt, aut non laudandi'
  text: |
    Qui Sanctorum merita religiosa caritate miratur, quique justorum glorias frequenti laude colloquitur, eorum mores sanctos atque justitiam imitetur: quoniam quem delectat Sancti alicujus meritum, delectare debet par circa cultum Dei obsequium. Quare aut imitari debet, si laudat: aut laudare non debet, si imitari detrectat: ut qui alium laudat, laudabilem se reddat: et qui Sanctorum merita admiratur, mirabilis ipse vitæ sanctitate reddatur. Nam si propterea justos fidelesque diligimus, quod in ipsis justitiam fidemque suspicimus, possumus nos quoque esse quod sunt, si faciamus ipsi quod faciunt.

    Neque enim difficile nobis est, quod ab ipsis geritur, imitari, cum sine præcedenti exemplo ab antiquis talia gesta conspicimus: ut non ipsi aliorum æmuli redderentur, sed æmulandæ virtutis seipsos nobis præberent exemplum: ut dum nos ex ipsis, et ex nobis alii proficiunt, sic Christus in suis semper servis in Ecclesia sancta laudetur. Unde ab origine mundi innocens Abel occiditur, Enoch Deo placens transfertur, justus Noë invenitur, Abraham fidelis probatur, Moyses mansuetus dignoscitur, Jesus castus, David lenis, Elias acceptus, Daniel sanctus, tres pueri victores redduntur.

    Apostoli discipuli Christi, credentium magistri habentur: e quibus eruditi Confessores fortissimi pugnant, Martyres perfecti triumphant, et christiani semper exercitus diabolum Deo armati debellant. In istis semper pares virtutes, dissimiles pugnæ, gloriosæ victoriæ. Unde tu Christiane delicatus es miles, si putas te posse sine pugna vincere, sine certamine triumphare. Exsere vires, fortiter dimica, atrociter in prælio isto concerta. Considera pactum, conditionem attende, militiam nosce: pactum quod spopondisti; conditionem qua accessisti: militiam cui nomen dedisti.
  status: verified

octave-readings/~-octave-day-7-gospel-homily:
  source: 'Homilia sancti Augustini Episcopi, Lib. 1 de Sermone Domini in monte, cap. 4 (Matt 5:1-12)'
  text: |
    In primo gradu, sicut oportebat, positum est regnum cælorum, quod est perfectæ summæque sapientiæ animæ rationalis. Sic ítaque dictum est: Beati pauperes spiritu: quoniam ipsorum est regnum cælorum; tamquam diceretur: Initium sapientiæ timor Domini. Mitibus hereditas data est, tamquam testamentum patris cum pietate quærentibus. Beati mites: quoniam ipsi hereditate possidebunt terram. Lugentibus consolatio, tamquam scientibus quid amiserint, et quibus mersi sunt. Beati qui lugent nunc: quoniam ipsi consolabuntur. Esurientibus et sitientibus saturitas, tamquam refectio laborantibus fortiterque certantibus ad salutem. Beati qui esuriunt et sitiunt justitiam, quoniam ipsi saturabuntur.

    Misericordibus misericordia tamquam vero et optimo consilio utentibus, ut hoc eis exhibeatur a potentiore, quod invalidioribus ipsi exhibent. Beati misericordes: quoniam ipsorum miserebitur Deus. Mundis corde facultas est videndi Deum, tamquam purum oculum ad intelligenda æterna gerentibus. Beati mundo corde: quoniam ipsi Deum videbunt. Pacificis Dei similitudo est, tamquam perfecte sapientibus, formatisque ad imaginem Dei per regenerationem renovati hominis. Beati pacifici: quoniam ipsi filii Dei vocabuntur. Et ista quidem in hac vita possunt compleri, sicut completa esse in Apostolis credimus. Nam illa omnimoda et in angelicam formam mutatio, quæ post hanc vitam promittitur, nullis verbis exponi potest.

    Beati ergo, qui persecutionem patiuntur propter justitiam: quoniam ipsorum est regnum cælorum. Hæc octava sententia, quæ ad caput redit, perfectumque hominem declarat, significatur fortasse et circumcisione octava die in veteri testamento; et Domini resurrectione post sabbatum, qui est utique octavus, idemque primus dies; et celebratione octavarum feriarum, quas in regeneratione novi hominis celebramus; et numero ipso Pentecostes: nam septenario numero septies multiplicato, quo fiunt quadraginta novem, quasi octavus additur, ut quinquaginta compleantur. Et tamquam redeatur ad caput, quo die missus est Spiritus sanctus, eo in regnum cælorum ducimur, et hereditatem accipimus, et consolamur, et pascimur, et misericordiam consequimur, et mundamur, et pacificamur. Atque ita perfecti omnes extrinsecus illatas molestias pro veritate et justitia sustinemus.
  status: verified

