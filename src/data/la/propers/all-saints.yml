# Verified against Divinum Officium (web/www/horas/Latin+English/Sancti/
# 11-01.txt) directly -- the live prayTertia query's English side didn't
# render an Oratio translation for this date for reasons not fully
# understood (the Latin side rendered correctly; every other saint this
# pull has queried the same way), so the raw source files were read
# directly instead this one time. The closing formula ("$Per Dominum" in
# the raw file) is expanded to the standard form used throughout this
# project, matching every other Duplex-rank collect.
collect:
  text: |
    Orémus.
    Omnípotens sempitérne Deus, qui nos ómnium Sanctórum tuórum mérita sub una tribuísti celebritáte venerári: quǽsumus; ut desiderátam nobis tuæ propitiatiónis abundántiam, multiplicátis intercessóribus, largiáris.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Own proper antiphon (all-saints-antiphon.yml), paired with All Saints' own real versicle (Sancti/11-01.txt's own [Versum 0] -- 'V. Oráte pro nobis, omnes Sancti Dei', no English source found for this exact line so the English side is a direct, standard translation, not independently sourced). Collect is the saint's own real proper (all-saints-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Te gloriósus Apostolórum chorus, te Prophetárum laudábilis númerus, te Mártyrum candidátus laudat exércitus, te omnes Sancti et elécti voce confiténtur unánimes, beáta Trínitas, unus Deus.
    V. Oráte pro nobis, omnes Sancti Dei.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Omnípotens sempitérne Deus, qui nos ómnium Sanctórum tuórum mérita sub una tribuísti celebritáte venerári: quǽsumus; ut desiderátam nobis tuæ propitiatiónis abundántiam, multiplicátis intercessóribus, largiáris.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Commemoratio Octavæ Omnium Sanctorum -- said at Lauds/Vespers on a day
# within All Saints' octave (Nov 1-8) where All Saints itself doesn't win
# the day outright. Live-verified directly against the reference engine
# (local officium.pl, Divino Afflatu - 1954, prayLaudes/prayVesperae,
# Nov 4/5 2026 -- St. Charles Borromeo/Sts. Vitalis and Agricola, both
# Duplex, beat the octave's own Semiduplex threshold that week): the real
# commemoration genuinely differs by hour -- Lauds uses the "Te gloriósus
# Apostolórum chorus..." antiphon (same text as all-saints-antiphon.yml)
# with V/R "Exsultábunt Sancti in glória. / Lætabúntur in cubílibus
# suis.", while Vespers uses the distinct "Ángeli, Archángeli..." antiphon
# (All Saints' own First Vespers antiphon) with V/R "Lætámini in Dómino,
# et exsultáte justi. / Et gloriámini omnes recti corde." -- notably
# *neither* is the "Oráte pro nobis, omnes Sancti Dei" versicle
# all-saints-commemoration.yml uses (that one belongs to All Saints' own
# primary office when it wins outright, not to this commemoration). Both
# hours share the same collect. Per the already-flagged simplification
# noted on hours/resolve-common.ts's getDayCollects and matching
# christmas-day-octave-commemoration.yml's own precedent (that one picked
# its Second Vespers text as the single canonical version for both hours;
# assumption-octave-commemoration.yml picked its Lauds text) -- this file
# picks the Lauds version as the single canonical block.
commemoration/octave-~:
  text: |
    Ant. Te gloriósus Apostolórum chorus, te Prophetárum laudábilis númerus, te Mártyrum candidátus laudat exércitus, te omnes Sancti et elécti voce confiténtur unánimes, beáta Trínitas, unus Deus.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    Omnípotens sempitérne Deus, qui nos ómnium Sanctórum tuórum mérita sub una tribuísti celebritáte venerári: quǽsumus; ut desiderátam nobis tuæ propitiatiónis abundántiam, multiplicátis intercessóribus, largiáris.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# All Saints' Matins hymn: the older pre-Urban VIII text, same as Vespers'
# (vespers-hymn-all-saints.yml) -- Latin/Sancti/11-01.txt's [HymnusM Matutinum]
# is "@Sancti/11-01:HymnusM Vespera" ("Christe Redemptor omnium"), and the
# Monastic and 1570 versions take [HymnusM ...] over [Hymnus ...]. Until
# 2026-10 this file kept "Placare, Christe, servulis" (the Urban VIII
# revision) as a deliberate split from Vespers; it now follows the standing
# preference for the older recension.
matins-hymn:
  text: |
    Christe Redémptor ómnium,
    Consérva tuos fámulos,
    Beátæ semper Vírginis
    Placátus sanctis précibus.

    Beáta quoque ágmina
    Cæléstium Spirítuum,
    Prætérita, præséntia,
    Futúra mala péllite.

    Vates ætérni Júdicis,
    Apostolíque Dómini,
    Supplíciter expóscimus
    Salvári vestris précibus.

    Mártyres Dei ínclyti,
    Confessorésque lúcidi,
    Vestris oratiónibus
    Nos ferte in cæléstibus.

    Chorus sanctárum Vírginum,
    Monachorúmque ómnium,
    Simul cum Sanctis ómnibus,
    Consórtes Christi fácite.

    Gentem auférte pérfidam
    Credéntium de fínibus,
    Ut Christo laudes débitas
    Persolvámus alácriter.

    * Glória Patri ingénito,
    Ejúsque Unigénito,
    Una cum Sancto Spíritu,
    In sempitérna sǽcula.
    Amen.
  status: verified

# Read from web/www/horas/Latin/Sancti/11-01.txt's own [Invit] (the
# Monastic SanctiM/11-01.txt has no override of its own, so the secular
# Sancti text is what actually governs here) and English/Sancti/11-01.txt.
matins-invitatory:
  text: 'Regem regum Dóminum veníte adorémus: * Quia ipse est coróna Sanctórum ómnium.'
  status: verified

