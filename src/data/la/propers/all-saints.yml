# Restructured from secular 3+3+3 to Monastic 6+6+3 per SanctiM/11-01.txt.
# The secular Sancti/11-01.txt has 9 antiphons (psalms 1/4/8, 14/23/31,
# 33/60/96 -- the 3+3+3 this file previously used). SanctiM/11-01.txt
# interleaves 3 [AntMatutinumM] antiphons (psalms 5, 30, 83) into the secular
# set, yielding 12 psalms: N1 = Ps 1/4/5/8/14/23, N2 = Ps 30/31/33/60/83/96,
# N3 = canticles 259/254/255 (Sap 3:1-6, 3:7-9, 10:17-21) under the [Ant
# Matutinum 3N] antiphon. English for the AntMatutinumM antiphons from
# English/SanctiM/11-01.txt; N3 antiphon English from same file; N3 versicle
# unchanged. Secular antiphon text (N1 psalms 1/4/8/14/23, N2 psalms 31/33/
# 60/96) unchanged from the prior live-verified version of this file.
matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 1
        antiphon: Novit Dóminus * viam iustórum, qui in lege ejus meditántur die ac nocte.
      - psalms:
          - 4
        antiphon: Mirificávit * Dóminus Sanctos suos, et exaudívit eos clamántes ad se.
      - psalms:
          - 5
        antiphon: 'Læténtur * omnes, qui sperant in te, Dómine: in ætérnum exsultábunt: et habitábis in eis, et gloriabúntur in te omnes qui díligent nomen tuum.'
        status: verified
      - psalms:
          - 8
        antiphon: 'Admirábile est * nomen tuum, Dómine: quia glória et honóre coronásti Sanctos tuos, et constituísti eos super ópera mánuum tuárum.'
      - psalms:
          - 14
        antiphon: Dómine, * qui operáti sunt justítiam, habitábunt in tabernáculo tuo, et requiéscent in monte sancto tuo.
      - psalms:
          - 23
        antiphon: Hæc est generátio * quæréntium Dóminum, quæréntium fáciem Dei Iacob.
    versicle:
      v: Lætámini in Dómino, et exsultáte justi.
      r: Et gloriámini omnes recti corde.
  nocturn2:
    groups:
      - psalms:
          - 30
        antiphon: 'Dilígite * Dóminum, omnes sancti ejus: quóniam veritátem requíret Dóminus.'
        status: verified
      - psalms:
          - 31
        antiphon: Lætámini in Dómino, * et exsultáte justi, et gloriámini omnes recti corde.
      - psalms:
          - 33
        antiphon: 'Timéte Dóminum * omnes Sancti ejus, quóniam nihil deest timéntibus eum: ecce óculi Dómini super justos, et aures ejus ad preces eórum.'
      - psalms:
          - 60
        antiphon: Dómine, spes Sanctórum * et turris fortitúdinis eórum, dedísti hereditátem timéntibus nomen tuum, et habitábunt in tabernáculo tuo in sǽcula.
      - psalms:
          - 83
        antiphon: 'Dómine, * Deus virtútum, beati omnes, qui sperant in te: non privábis bonis eos, qui ámbulant in æquitáte: in sǽcula sæculórum laudábunt te.'
        status: verified
      - psalms:
          - 96
        antiphon: Qui dilígitis Dóminum, * lætámini in Dómino, et confitémini memóriæ sanctitátis ejus.
    versicle:
      v: Exsúltent justi in conspéctu Dei.
      r: Et delecténtur in lætítia.
  nocturn3:
    antiphon: 'Laudem dícite * Deo nostro omnes Sancti ejus: et qui timétis eum pusílli et magni: quóniam regnávit Dóminus Deus noster omnípotens. Gaudeámus, et exsultémus: et demus glóriam ei.'
    canticles:
      - refs:
          - book: sap
            chapter: 3
            verses: 1-6
      - refs:
          - book: sap
            chapter: 3
            verses: 7-9
      - refs:
          - book: sap
            chapter: 10
            verses: 17-21
    versicle:
      v: Justi autem in perpétuum vivent.
      r: Et apud Dóminum est merces eórum.

