# Transcribed directly from the reference engine's own Office file
# (web/www/horas/Latin/Tempora/Pasc0-5.txt's [Oratio], English parallel in
# web/www/horas/English/Tempora/Pasc0-5.txt). See easter-monday-collect.yml's
# own header for sourcing/status convention.
collect:
  text: |
    Orémus.
    Omnípotens sempitérne Deus, qui paschále sacraméntum in reconciliatiónis humánæ fœ́dere contulísti: da méntibus nostris; ut quod professióne celebrámus, imitémur efféctu.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft
  temporal: true

