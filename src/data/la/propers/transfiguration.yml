# Verified against Divinum Officium (Monastic Tridentinum 1617), Matins
# live query, 2026-08-06 -- byte-identical to the Vespers hymn
# ("Quicúmque Christum quǽritis"). See lauds-capitulum-
# transfiguration.yml's header. English final stanza corrected 2026-09-10:
# the live query had baked in the plain `[Epi]` doxology's English
# ("Jesu, to thee our praise we pay..."), mismatched against the Latin,
# which already correctly shows the Monastic `[EpiT]` text ("Glória tibi,
# Dómine, Qui apparuísti hódie..."). Corrected to `[EpiT]`'s own English
# (Psalterium/Doxologies.txt), matching vespers-hymn-transfiguration.yml.
matins-hymn:
  text: |-
    Quicúmque Christum quǽritis,
    Oculos in altum tóllite:
    Illic licébit vísere
    Signum perénnis glóriæ.

    Illústre quiddam cérnimus,
    Quod nésciat finem pati,
    Sublíme, celsum, intérminum,
    Antíquius cælo et chao.

    Hic ille Rex est géntium
    Populíque Rex judáici,
    Promíssus Abrahæ patri
    Ejúsque in ævum sémini.

    Hunc, et prophétis téstibus
    Iisdémque signatóribus,
    Testátor et Pater jubet
    Audíre nos et crédere.

    * Glória tibi, Dómine,
    Qui apparuísti hódie,
    Cum Patre, et Sancto Spíritu,
    In sempitérna sǽcula. Amen.
  status: verified

