# Read directly from web/www/horas/Latin/Sancti/11-16.txt's own
# [Oratio] and its English counterpart. Doxology "$Per Dominum"
# spelled out per the convention in st-bibiana-collect.yml.
collect:
  text: |
    Orémus.
    Deus, qui in corde beátæ Gertrúdis Vírginis jucúndam tibi mansiónem
    præparásti: ipsíus méritis et intercessióne; cordis nostri máculas
    cleménter abstérge, et ejúsdem tríbue gaudére consórtio.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et
    regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-virgin (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). st-gertrude has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is the saint's own
# real proper (st-gertrude-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Símile est regnum cælórum * hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, qui in corde beátæ Gertrúdis Vírginis jucúndam tibi mansiónem
    præparásti: ipsíus méritis et intercessióne; cordis nostri máculas
    cleménter abstérge, et ejúsdem tríbue gaudére consórtio.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et
    regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# St. Gertrude: proper Matins hymn, Latin/SanctiM/11-16.txt's [Hymnus Matutinum]. The reference has no English for it, so the English is a fresh translation, marked draft.
# Before this file the saint fell to the Common's hymn.
matins-hymn:
  text: |
    Mira noctúrnis, modulánte lingua,
    Gesta Gertrúdis celebrémus horis,
    Quæ sacris instans précibus perégit
    Témpora noctis.

    Illíus votis Deus obsecúndans,
    Mox repentínas plúvias profúdit,
    Moxque suspénsos grávidis coércet
    Núbibus imbres.

    Arva jam dudum glácie rigébant,
    Corde cum mœsto míserans colónos,
    Férvidis Virgo lácrimis resólvit
    Frígora brumæ.

    Ne seges largo vitiétur imbre,
    Sédulis cælum précibus serénat,
    Et graves læsi gemebúnda placat
    Núminis iras.

    Ignéis mentes pénetrat sagíttis,
    Lánguidis confert ánimis medélam,
    Atque succéndit sceleráta castis
    Péctora flammis.

    Vírginum sponsum superúmque Regem
    Vírginum sanctæ célebrent choréæ,
    Et sacram supplex Tríadem per ævum
    Orbis adóret.
    Amen.
  status: verified

# Sourced from web/www/horas/Latin/SanctiM/11-16.txt's own [Capitulum
# Laudes]. No English rendering exists in the reference engine's data;
# using the standard Douay-Rheims wording for Cant 3:4.
lauds-capitulum:
  text: 'Invéni quem díligit ánima mea: ténui eum, nec dimíttam, donec introdúcam illum in domum matris meæ, et in cubículum genetrícis meæ.'
  citation: Cant 3:4
  status: verified

# Sourced from web/www/horas/Latin/SanctiM/11-16.txt's own [Hymnus
# Laudes]. No English rendering exists in the reference engine's data;
# translated here directly.
lauds-hymn:
  text: |
    Ad sacros virgo thálamos anhélans
    Núptias cælo celebráre gestit,
    Et piis votis nímium morántem
    Próvocat horam.

    Ægra cum languet, maniféstus adstat
    Cǽlitum turma comitánte Christus,
    Atque divíni récreat jacéntem
    Lúmine vultus.

    Surge, conclámat, soror atque sponsa,
    En tibi pando penetrále cordis,
    Ut triumpháli reseráta scandas
    Sídera curru.

    Ista vox omnes pénetrat medúllas
    Atque compáges ánimi resólvit:
    Spíritus liber volat in reclúsa
    Víscera Christi.

    Régios Agni thálamos peténtem
    Júbilans stipat súperum coróna,
    Atque compléxus et amíca cantat
    Óscula Sponsi.

    Vírginum Sponsum, superúmque regem
    Vírginum sanctæ célebrent choréæ,
    Et sacram supplex Tríadem per ævum
    Orbis adóret. Amen.
  status: verified

