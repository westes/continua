# Sourced from web/www/horas/Latin/SanctiM/11-16.txt's own [Ant Laudes]
# block (5 antiphons run together, one per line, older un-numbered format
# -- same as st-benedict.yml's own file). No English rendering exists in
# the reference engine's data for these at all; translated here directly.
# Below duplex-majus (semiduplex), so hours/lauds.ts's
# mergeFerialNumbersWithProperAntiphons only takes this file's antiphon
# text, not its psalm numbers -- the numbers below are placeholders
# (the standard 92/99/62 scheme most Virgin-shaped feasts use), not
# independently confirmed for this feast, since they have no functional
# effect at this rank.
lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: Lauda * et lætáre, fília Sion, quia ecce ego vénio, et habitábo in médio tui, dicit Dóminus.
    - psalms:
        - 99
      antiphon: O beáta ánima, * quæ méruit esse sedes sapiéntiæ, cujus delíciæ sunt esse cum fíliis hóminum!
    - psalms:
        - 62
      antiphon: Ánnulis septem subarrhávit me * Dóminus meus Jesus Christus, et tamquam sponsam decorávit me coróna.
  canticle:
    id: canticum-trium-puerorum
    antiphon: 'Hábuit Gertrúdis * potestátem cláudere cælum núbibus, et aperíre portas ejus: quia lingua ejus clavis cæli facta est.'
  laudate:
    antiphon: Ancílla fidélis * et sponsa elécta intrávit in cor et gáudium Dómini sui, cujus amóre languébat.

# Sourced from web/www/horas/Latin/SanctiM/11-16.txt's own [Ant Vespera]
# block (the first/default one -- a second, rubric-conditional block
# follows it in the source, not used here). No English rendering exists
# in the reference engine's data at all; translated here directly.
# Distinct from her own Lauds antiphons. Below duplex-majus, so hours/
# vespers.ts's mergeFerialNumbersWithProperAntiphons only takes this
# file's antiphon text, not its psalm numbers.
vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: Casta colúmba * nidíficans in cavérna macériæ sacri láteris Jesu Christi, mel suavíssimum de petra sugébat.
    - psalms:
        - 112
      antiphon: Loquebátur Christus * ad diléctam Gertrúdem fácie ad fáciem, sicut solet loqui homo ad amícum suum.
    - psalms:
        - 121
      antiphon: 'Beátæ Gertrúdis verba * divíni erant amóris jácula: lámpades ejus, lámpades ignis atque flammárum.'
    - psalms:
        - 126
      antiphon: Diléctæ ánimam * e cárcere córporis exeúntem accépit Christus in ulnas suas, et cor suum illi amánter apéruit.

# Matins Nocturn 2 reading for St. Gertrude (Nov 16). Sourced directly
# from web/www/horas/Latin/Sancti/11-16.txt, English/Sancti/11-16.txt.
# Lectio4-6 combined into one reading, one continuous vita. No
# [Lectio7] in the source -- no own Nocturn 3.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Gertrúdis, Islébii in Saxónia nobili genere nata, quinquénnis in monastério Rodardénsi, ordinis sancti Benedicti, virginitátem suam ac seipsam Jesu Christo óbtulit. Quo ex témpore a mundanis rebus prorsus aliena, virtútique sedulo intenta, cæléstis vitæ genus instituit. Ad humaniórum litterárum notítiam, rerum divinárum cognitiónem adjunxit; quarum meditatióne vehementius ad virtútem incensa, brevi christianam perfectiónem adepta est. De Christo ejusque vitæ mystériis sæpenúmero pio cum animi sensu loquebátur, unamque Dei glóriam cogitans, ad illam vota sua ómnia et actiónes referebat. Quamvis autem multis exímiis natúræ et gratiæ donis a Deo aucta esset, ita tamen sibi ipsa vilescebat, ut, inter præcipua divinæ bonitátis miracula, hoc item memoráret, quod se indigníssimam misericorditer sustinéret.

        Trigesimum ætátis annum agens, primum Rodardénsis monasterii, ubi religiosam vitam est professa, deínde Elpediáni præses electa, quadragínta annórum spátio, ea caritate, prudéntia, et regularis disciplinæ studio munus obívit, ut cœnobium religiosæ perfectiónis domicílium viderétur. Utrobíque vero, licet esset ómnium mater et magistra, ómnium tamen minima haberi volebat, ac demissióne pari ministram se exhibebat. Quo liberius Deo vacaret, vigiliis, abstinéntia aliisque cruciátibus corpus afflixit; semperque sui símilis, morum innocéntiam, mansuetúdinem ac patiéntiam prætulit singularem. Proximórum salúti omni ope studuit, piæque curæ copiósum fructum rétulit. Divini amoris vi frequéntes patiebátur éxstases, altissimǽque contemplatiónis et divinæ uniónis donum obtinuit.

        Ut meritum acceptíssimæ sibi sponsæ Christus osténderet, in corde Gertrudis jucundam sibi esse mansiónem testátus est. Deiparam Vírginem, véluti matrem et curatricem a Jesu acceptam, pietáte præcipua prosequebátur, ab eáque multa accépit beneficia. Erga diviníssimum Eucharistiæ sacraméntum et passiónem Dómini tanto amóre cum grati animi sensu afficiebátur, ut intérdum ubéribus lácrimis perfunderétur. Justórum ánimas, piacularibus flammis addictas, quotidiánis subsidiis et precibus juvábat. Multa ad confovéndam pietátem scripsit. Divinárum étiam revelatiónum et prophetíæ dono cláruit. Dénique, flagrantíssimo Dei amóre potius quam morbo languéscens, anno Dómini millesimo ducentésimo nonagesimo secundo vita decessit. Miraculis vivens et post mortem a Deo illustráta est.
      status: verified
