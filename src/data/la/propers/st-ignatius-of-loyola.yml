# Read directly from web/www/horas/Latin/Sancti/07-31.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui ad majórem tui nóminis glóriam propagándam, novo per beátum
    Ignátium subsídio militántem Ecclésiam roborásti: concéde; ut, ejus auxílio
    et imitatióne certántes in terris, coronári cum ipso mereámur in cælis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Standard de-Communi commemoration for common-of-a-confessor (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). st-ignatius-of-loyola has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-ignatius-of-loyola-collect.yml), unchanged.
commemoration:
  text: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui ad majórem tui nóminis glóriam propagándam, novo per beátum
    Ignátium subsídio militántem Ecclésiam roborásti: concéde; ut, ejus auxílio
    et imitatióne certántes in terris, coronári cum ipso mereámur in cælis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. Ignatius of Loyola, Confessor
# (July 31). Sourced directly from web/www/horas/Latin/Sancti/07-31.txt,
# English/Sancti/07-31.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in his own file (a direct
# `@Commune/C1a:LectioN` cross-reference) -- not transcribed, per the
# bare-cross-reference convention.
#
# Verified 2026-09-05 (Gospel-pairing sweep): confirmed genuinely absent.
# Sancti/07-31.txt's own Lectio7-9 are a bare `@Commune/C1a:Lectio7-9`
# redirection (Common of a Confessor Not a Bishop) with no saint-specific
# citation or homily text of their own in this file -- there is no proper
# Gospel+homily for St. Ignatius to author here; Nocturn 3 correctly falls
# through to the Common of a Confessor's own generic content, already
# handled by this store's per-Common-category pool.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Ignatius, natióne Hispanus, nobili genere Loyolæ in Cantabria natus, primo catholici regis aulam, deínde milítiam secutus est. In propugnatióne Pampelonénsi accepto vulnere gráviter decumbens, ex fortuita piórum librórum lectióne, ad Christi Sanctorúmque sectanda vestígia mirabíliter exársit. Ad montem Serrátum profectus, ante aram beátæ Vírginis suspénsis armis, noctem éxcubans, sacræ milítiæ tirocinium pósuit. Inde, ut erat indútus sacco, traditis antea mendíco pretiósis vestibus, Manresam secessit; ubi, emendicato pane et aqua víctitans, exceptisque diébus Dominicis, jejunans, aspera catena cilicióque carnem domans, humi cubans, et férreis se flagellis cruentans, per annum commorátus est, claris adeo illustratiónibus a Deo recreatus, ut póstea dicere sólitus sit: Si sacræ Litteræ non exstarent, se tamen pro fide mori parátum ex iis solum, quæ sibi Manresæ patefécerat Dóminus. Quo témpore, homo litterárum plane rudis, admirábilem illum compósuit exercitiórum librum, Sedis apostolicæ judício et ómnium utilitate comprobátum.

        Ut vero se ad animárum lucra rite formaret, subsidium litterárum, a grammatica inter púeros exorsus, adhibére státuit. Cumque nihil interim omitteret de studio alienæ salútis, mirum est quas ubíque locórum ærúmnas ac ludibria devoráverit, asperrima quæque, et víncula et verbera pene ad mortem usque perpéssus. Lutetiæ Parisiórum adjunctis sibi ex illa academía variárum natiónum sociis novem, qui omnes artium magistériis et theologíæ gradibus insignes erant, ibidem in monte Mártyrum prima ordinis fundaménta jecit, quem póstea Romæ instítuens, ad tria consueta quarto addito de Missiónibus voto, Sedi apostolicæ arctius adstrinxit; et Paulus tertius primo recepit confirmavítque, mox alii Pontifices ac Tridentina synodus probavére. Ipse autem, misso ad prædicándum Indis Evangélium sancto Francisco Xaverio, aliisque in alias mundi plagas ad religiónem propagandam disseminatis, éthnicæ superstitióni hæresique bellum indixit; eo successu continuátum, ut constans fúerit ómnium sensus, étiam pontificio confirmátus oraculo, Deum, sicut alios aliis tempóribus sanctos viros, ita Luthéro ejusdemque témporis hæreticis Ignatium et institutam ab eo societátem objecisse.

        Sed in primis inter Catholicos instaurare pietátem curæ fuit. Templórum nitor, catechismi traditio, conciónum ac sacramentórum frequéntia ab ipso increméntum accepére. Ipse, apertis ubíque locórum ad juventútem erudiéndam in litteris ac pietáte gymnasiis, eréctis Romæ Germanórum collegio, male nuptárum et periclitántium puellárum cœnobiis, utriusque sexus tam orphanórum quam catechumenórum dómibus, aliisque pietátis opéribus, indeféssus lucrandis Deo ánimis instábat. In dæmones mirum exercuit impérium. Vultum ejus cælésti luce radiántem sanctus Philippus Nerius aliique conspexere. Denique, ætátis anno sexagesimo quinto, ad Dómini sui amplexum, cujus majórem glóriam in ore semper habúerat, semper in ómnibus quæsíerat, emigrávit. Quem Gregórius décimus quintus, magnis in Ecclésiam meritis et miraculis illustrem, Sanctórum fastis adscripsit.
      status: verified
