# Matins Nocturn 2 reading for Bl. Benedict XI, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/07-07-BenedictusXI.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Benedíctus undécimus, ex honésta Boccassinorum família Tarvísii natus, anno setatis décimo quarto Prædicatórum institútum ampléxus est; in quo humánis divinisque stúdiis quatuórdecim annis impense vacávit, totidemque summa cum eruditionis laude privátim ac públice dócuit. Sanctitátis et prudéntiæ fama conspícuus, per vários gradus et dignitates órdinis ad suprémum ejus magisterium evéctus est; quo in múnere céteris exémplo prælucens, disciplínam mirífice fovit, ac brevi témpore órdinem ipsum amplificávit. Illíus ópera Bonifacius octávus in pacificandis Galliárum et Británniæ régibus felíciter usus, lustrandis commíssis sibi provínciis in Gallia peregrinantem sanctæ Románæ Ecclésiæ cardinálem presbyterum creávit, atque ad XJrbem accitum in Pannóniam legatum designávit, ubi tres príncipes de regni illíus successióne contendentes mira dexteritate compósuit.

        Pacata Hungária Romam revérsus, Bonifacio Anágniæ circumvdnto inter hóstium minas et invasiones fórtiter ástitit, hæsitque indivulse, réliquis ferme ómnibus ab eo fugientibus. Mox eódem Pontífice humánis rebus exempto, in Petri Sedem mira Patrum consensióne sufféctus est. In eo dignitátis fastigio, ab omni fastu prorsus aliénus, demissionem ádeo cóluit, ut addíctam ad se matrem adhuc superstitem paulo splendídius, ut decére videbátur, ornatam, a se dimiserit tamquam non suam: mox vero nativo, atque humilidre cultu vestitam peramanter amplexatus, honorífice hábuit. Violatæ in prædecessore suo pontificiæ dignitátis auctores anathemate mulctavit; ab illo autem severius habitos, pristinis honóribus restitutos in véniam et grátiam recépit. Pacandis Itáliæ provínciis, Guelphorum et Gibellinorum, Alborum et Nigrorum factiónibus misérrime divexatis, Nicoláum cardinálem Pratensem órdinis Prædicatórum a látere legatum creávit, eumdémque in Angliam, Scótiam, et Hiberniam ad conciliandos reges et príncipes ire jussit.

        Pacis studiosíssimus eam naviter promóvit tum in Germania, cui intestinis dissidiis laboranti præsto fuit, tum in Sicília, quam subláto interdicto communioni restítuit. Sed et Galliárum regni cum Apostólica Sede concórdiam paulo ántea gravissime læsam felíciter instauravit. In Oriéntem étiam, aliásque schismaticorum províncias apostólicæ mentis curas porrexit, et Martíno archiepíscopo Antibardnsi disciplínæ ecclesiásticæ restaurationem impense commendávit. Serviæ regem Orosium ad ejurandum schisma lítteris amantissimis excitávit. Syriæ demum ac Palæstínæ recuperandæ intentum, aliáque ad religiónis increméntum cogitantem atque molientem commúnis necéssitas prævénit. Mórtuus est Perúsiæ, anno millésimo trecentésimo quarto, nono pontificátus mense nondum expléto,humilique,ut ipse jusserat, loco, apud fratres suos Prædicatóres cónditus est, miráculis statim post óbitum clarus. Cultum ab immemorabili témpore ei delátum Clemens duodécimus approbávit, utque ejus festum cum Offício et Missa sub ritu duplici in univérso Prædicatórum órdine, atque a clero Tarvisino et Perusino celebraretur, indúlsit.
      status: verified
