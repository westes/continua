matins-invitatory:
  text: Laudémus Deum nostrum * In sanctis opéribus beátæ Elísabeth.
  status: verified

# St. Elizabeth of Portugal: proper Lauds hymn, Latin/Sancti/07-08.txt's [Hymnus Laudes]. English from English/Sancti/07-08.txt.
# Before this file the saint fell to the Common's hymn.
lauds-hymn:
  text: |
    Opes decúsque régium relíqueras,
    Elísabeth, Dei dicáta númini:
    Recépta nunc beáris inter Angelos;
    Libens ab hóstium tuére nos dolis.

    Præi, viámque, dux salútis, índica:
    Sequémur: O sit una mens fidélium,
    Odor bonus sit omnis áctio, tuis
    Id ínnuit rosis opérta cáritas.

    Beáta cáritas, in arce síderum
    Potens locáre nos per omne sǽculum:
    Patríque, Filióque summa glória,
    Tibíque laus perénnis, alme Spíritus. 
    Amen.
  status: verified

# Live-verified against Divinum Officium (Monastic Tridentinum 1617,
# command=prayTertia), 2026-07-08, own day -- her real proper Terce
# antiphon, distinct from the raw source file's own [Ant 1] tag (which
# turned out to be unrelated content, per TODO.md's note on this). Sext/
# None live-queried empty (no proper antiphon at those hours).
terce-antiphon:
  text: Clamávi, et exaudívit me.
  status: verified

# St. Elizabeth of Portugal: proper Vespers hymn, Latin/Sancti/07-08.txt's [Hymnus Vespera]. English from English/Sancti/07-08.txt.
# Before this file the saint fell to the Common's hymn.
vespers-hymn:
  text: |
    Domáre cordis ímpetus Elísabeth
    Fortis, inópsque Deo
    Servíre, regno prǽtulit.

    En fúlgidis recépta cæli sédibus,
    Sidereǽque domus
    Ditáta sanctis gáudiis,

    Nunc regnat inter cǽlites beátior,
    Et premit astra, docens
    Quæ vera sint regni bona.

    Patri potéstas, Filióque glória,
    Perpetuúmque decus
    Tibi sit alme Spíritus.
    Amen.
  status: verified

