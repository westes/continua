# Read directly from web/www/horas/Latin/Sancti/08-31.txt's own
# [Oratio] and its English counterpart.
collect:
  text: |
    Orémus.
    Deus, qui in liberándis fidélibus tuis ab impiórum captivitáte beátum
    Raymúndum Confessórem tuum mirábilem effecísti: ejus nobis intercessióne
    concéde; ut, a peccatórum vínculis absolúti, quæ tibi sunt plácita, líberis
    méntibus exsequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Corrected (2026-08): originally used Commune/C5.txt's own `[Ant 1]`
# ("Similábo eum"), but cross-checking two other already live-verified
# commemorations (st-clare-commemoration.yml, ss-felix-and-adauctus-
# commemoration.yml) shows the real commemoration antiphon is `[Ant 2]`,
# not `[Ant 1]` -- and specifically the Monastic-rubric variant of it
# where one exists (`horas/Latin-gabc/Commune/C5.txt`'s own "(sed rubrica
# monastica)" block: "Serve bone et fidélis... intra in gáudium Dómini Dei
# tui", distinct from the secular "Euge, serve bone... Dómini tui"). Not
# independently live-verified for Raymond/this category specifically --
# marked `draft`, not `verified`, pending that confirmation, per this
# app's own "prefer draft over missing" convention. Collect is his own
# real proper (st-raymond-nonnatus-collect.yml), unchanged and verified.
commemoration:
  text: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui in liberándis fidélibus tuis ab impiórum captivitáte beátum Raymúndum Confessórem tuum mirábilem effecísti: ejus nobis intercessióne concéde; ut, a peccatórum vínculis absolúti, quæ tibi sunt plácita, líberis méntibus exsequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Matins Nocturn 2 reading for St. Raymond Nonnatus, Confessor
# (Aug 31). Sourced directly from web/www/horas/Latin/Sancti/08-31.txt,
# English/Sancti/08-31.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in his own file (only an
# `[Evangelium]` cross-reference) -- defers to the Common's own
# Nocturn 3, not transcribed here.
nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Raymundus, Nonnatus cognomento dictus, quia præter communem naturæ legem e mortuæ matris dissecto latere in lucem eductus fuit, Portelli in Catalaunia piis et nobilibus parentibus ortus, ab ipsa infantia futuræ sanctitatis indicia dedit. Nam puerilia oblectamenta, mundique illecebras respuens, ita pietati operam dabat, ut omnes in puero adultam virtutem admirarentur. Cresconte vero ætate, litterarum studiis incubuit: sed mox jubente patre vitam ruri agens, sacellum sancti Nicolai in Portelli finibus situm crebro adibat, ut sacram Deiparæ imaginem, quæ in eo summa fidelium veneratione étiam nunc colitur, visitaret. Ibi effusus in preces, ipsam Dei parentem, ut se in filium adoptare viamque salutis ac scientiam sanctorum edocere dignaretur, enixe deprecabatur.

        Nec defuit votis ejus benignissima Virgo. Ab ipsa enim intellexit gratissimum sibi fore, si religionem sub titulo de Mercede, seu de Misericordia redemptionis captivorum, ea suggerante nuper fundatam, ingrederetur. Qua monitione percepta, Barcinonem statim profectus, illud tam præcellentis erga proximum caritatis institutum amplexus est. Regulari igitur militiæ adscriptus, virginitatem, quam pridem beatæ Virgini consecraverat, perpetuo coluit, ceterisque virtutibus enituit, caritate præsertim erga Christianos, qui sub potestate paganorum miseram in captivitate vitam degebant. Hos ut redimeret, in Africam missus, cum jam multos a servitute liberasset, ne, consumpta pecunia, aliis item in proximo abnegandæ fidei discrimine constitutis deesset, se ipsum pignori dedit; sed cum ardentissimo salutis animarum desiderio succensus, plures Mahometanos suis concionibus ad Christum converteret, in arctam custodiam a barbaris conjectus, variisque suppliciis cruciatus, mox labiis perforatis et sera ferrea clausis, crudele martyrium diu sustinuit.

        Ob hæc et alia fortiter gesta sanctitatis ejus fama longe lateque diffúsa est. Qua permotus Gregorius nonus, in amplissimum sanctæ Romanæ Ecclesiæ Cardinalium collegium Raymundum adscripsit: sed vir Dei in ea dignitate ab omni pompa abhorrens, religiosæ humilitatis tenacissimus semper fuit. Romam vero pergens, statim ac Cardonam pervenit, extremo morbo confectus, ecclesiasticis sacramentis muniri summis precibus postulavit. Cumque morbus ingravesceret, et sacerdos diutius tardaret, Angelorum ministerio, sub specie religiosorum sui ordinis apparentium, salutari viatico refectus fuit. Quo sumpto, et gratiis Deo peractis, migravit ad Dominum Dominica ultima Augusti, anno millesimo ducentesimo quadragesimo.
      status: verified
