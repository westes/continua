# Second Vespers Magnificat antiphon for `common-of-a-dedication`
# (Commune Dedicationis Ecclesiae, Latin/Commune/C8.txt's own [Ant 3] --
# the "O quam metuendus est locus iste" Jacob's-ladder text, Genesis
# 28:17). Ant 2 in this same file matches the already-authored
# benedictus-antiphon-common-of-a-dedication.yml's "Zacchæe" text
# exactly, confirming the Vespers1(Ant1)/Lauds(Ant2)/Vespers2(Ant3) read
# for this Common. Read directly from source, not independently
# live-queried (this Common's only current user, Ss. Peter and Paul's
# basilicas, sits in a crowded November stretch where every date tried
# lost the evening to a neighboring feast).
magnificat-antiphon:
  text: 'O quam metuéndus est * locus iste: vere non est hic áliud, nisi domus Dei, et porta cæli.'
  status: verified

# First Vespers Magnificat antiphon for this Common: Latin/Commune/C8.txt's own
# [Ant 1] (and its English counterpart), where it differs from [Ant 3]. Second
# Vespers' [Ant 3] is magnificat-antiphon-common-of-a-dedication.yml (the default); see
# hours/resolve-common.ts's withVespersVariant.
magnificat-antiphon/~-first:
  text: 'Sanctificávit Dóminus * tabernáculum suum: quia hæc est domus Dei, in qua invocábitur nomen ejus, de quo scriptum est: Et erit nomen meum ibi, dicit Dóminus.'
  status: verified

# Generic Common-of-a-Dedication Matins psalmody, live-verified against
# Divinum Officium (Monastic Tridentinum 1617, command=prayMatutinum,
# 2026-11-09 -- the Dedication of the Basilica of the Most Holy Saviour
# (the Lateran), `propers: null` in her own vu file, so this is genuinely
# this category's generic scheme, not proper content). Rank Duplex,
# clears the Duplex+ three-nocturn gate. Currently only one saint/feast
# on the vu calendar uses this Common, so this file is both the category
# default and, in practice, this feast's own content.
#
# Reference-engine votive number: C8 ("Dedicationis Ecclesiae"), per
# `horas.dialog`'s own `[votives]` index (see `common-of-a-virgin-
# martyr.yml`'s header for why `votive=` isn't itself usable live for
# Matins psalmody).
#
# All six Nocturn 1/2 antiphons are temple/house-of-God imagery (drawn
# from Pss 5, 10, 23, 28, 45, 47, 83, 86, 87, 90, 95, 98); Nocturn 3 is
# Jacob's ladder ("Vidit Jacob scalam") with a canticle set from Tobit,
# Isaiah, and Jeremiah -- distinct scripture from every other Common in
# this pool.
matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 5
        antiphon: Introíbo * in domum tuam, Dómine, † et adorábo ad templum sanctum tuum.
      - psalms:
          - 10
        antiphon: Dóminus * in templo sancto suo, † Dóminus in cælo sedes ejus.
      - psalms:
          - 23
        antiphon: Tóllite portas, * príncipes vestras, et elevámini, portæ æternáles.
      - psalms:
          - 28
        antiphon: Adoráte * Dóminum in aula sancta ejus.
      - psalms:
          - 45
        antiphon: Erit mihi Dóminus * in Deum, et lapis iste vocábitur domus Dei.
      - psalms:
          - 47
        antiphon: Ædificávit * Móyses altáre Dómino Deo.
    versicle:
      v: Domum tuam, Dómine, decet sanctitúdo.
      r: In longitúdinem diérum.
  nocturn2:
    groups:
      - psalms:
          - 83
        antiphon: Beáti, * qui hábitant in domo tua, Dómine; † in sǽcula sæculórum laudábunt te.
      - psalms:
          - 86
        antiphon: Non est hic áliud, * nisi domus Dei, et porta cæli.
      - psalms:
          - 87
        antiphon: Templum Dómini * sanctum est, Dei structúra est, Dei ædificátio est.
      - psalms:
          - 90
        antiphon: Qui hábitat * in adjutório Altíssimi, in protectióne Dei cæli commorábitur.
      - psalms:
          - 95
        antiphon: Eréxit Jacob * lápidem in títulum, fundens óleum désuper.
      - psalms:
          - 98
        antiphon: Benedícta * glória Dómini, de loco sancto suo, allelúia.
    versicle:
      v: Domus mea.
      r: Domus oratiónis vocábitur.
  nocturn3:
    antiphon: 'Vidit Jacob scalam, * súmmitas ejus cælos tangébat, et descendéntes Angelos, et dixit: Vere locus iste sanctus est.'
    canticles:
      - refs:
          - book: tob
            chapter: 13
            verses: 10-17
      - refs:
          - book: isa
            chapter: 2
            verses: 2-3
      - refs:
          - book: jer
            chapter: 7
            verses: 2-7
    versicle:
      v: Hæc est domus Dómini fírmiter ædificáta.
      r: Bene fundáta est supra firmam petram.

# Generic Common-of-a-Dedication (of a Church) Lauds psalmody, live-
# verified against Divinum Officium (Monastic Tridentinum 1617, command=
# prayLaudes, votive=C8, 2026-09-05 — all 7 weekdays checked, 11-09 through
# 11-15-2026). Genuinely its own scheme, unlike most Commons: proper psalms
# 50/5/35 (not the usual 92/99/62), same "own numbers, not the standard
# duplex-majus set" pattern already noted in this Common's own Vespers file
# (109/110/111/147).
#
# The canticle slot is unusual again, in a different way: its *antiphon* is
# this Common's own fixed text ("Bene fundáta est...", confirmed identical
# on every weekday tested), but the underlying canticle *text* is not
# proper to Dedication at all -- it's simply whichever plain ferial
# weekday canticle the day already uses (Isaiah Mon, Ezechias Tue, Anna
# Wed, Moses/Exodus Thu, Habacuc Fri, Moses/Deuteronomy split Sat, Three
# Young Men Sun) -- all 7 already authored, hours/lauds-canticles.ts. This
# supersedes the earlier (2026-08-28) note on this file's Vespers sibling
# claiming a "Canticum Ieremiæ" was needed and never transcribed -- that
# was a live-verify session that captured a plain ferial Thursday's output
# instead of actually passing votive=C8; no such canticle appears anywhere
# in the real Dedication scheme on any weekday. `canticle.id` is
# intentionally omitted here -- see hours/lauds.ts's resolvePsalmody and
# hours/lauds-psalmody-overrides.ts's own doc comment for the fallback.
lauds-psalmody:
  groups:
    - psalms:
        - 50
      antiphon: Domum tuam, Dómine, * decet sanctitúdo in longitúdinem diérum.
    - psalms:
        - 5
      antiphon: Domus mea, * domus oratiónis vocábitur.
    - psalms:
        - 35
      antiphon: Hæc est domus Dómini * fírmiter ædificáta, bene fundáta est supra firmam petram.
  canticle:
    antiphon: Bene fundáta est * domus Dómini supra firmam petram.
  laudate:
    antiphon: Lápides pretiósi * omnes muri tui, et turres Ierúsalem gemmis ædificabúntur.

# Generic Common-of-a-Dedication (of a Church) Vespers psalmody, live-
# verified against Divinum Officium (Monastic Tridentinum 1617, command=
# prayVespera, votive=C8, 2026-08-28). Genuinely its own scheme, unlike
# every other Common authored so far: 109/110/111/147 (Ps 147, not the
# expected next-in-sequence 112, for the 4th slot).
#
# Lauds' own category file (lauds-psalmody-overrides/categories/common-of-
# a-dedication.yml) is now authored too. An earlier note here claimed
# Lauds needed an untranscribed "Canticum Ieremiæ" and was left open --
# that was based on a mis-targeted live query (a plain ferial Thursday's
# output, not actually votive=C8); a fresh 7-weekday live-verify
# (2026-09-05) found no such canticle anywhere in the real scheme, see
# that file's own header comment for the corrected detail.
vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: Domum tuam, Dómine, * decet sanctitúdo in longitúdinem diérum.
    - psalms:
        - 110
      antiphon: Domus mea, * domus oratiónis vocábitur.
    - psalms:
        - 111
      antiphon: Hæc est domus Dómini * fírmiter ædificáta, bene fundáta est supra firmam petram.
    - psalms:
        - 147
      antiphon: Lápides pretiósi * omnes muri tui, et turres Ierúsalem gemmis ædificabúntur.
