# Verified against the reference engine's own source data files:
# web/www/horas/Latin/Commune/C8.txt ("In Anniversario Dedicationis
# Ecclesiae") and its English counterpart, 2026-08. Not a name-templated
# Common — a Dedication-of-a-Church collect has no "{N}" to substitute,
# so this file is used directly via a saint's own `propers`, not through
# the collectCommon/collectName mechanism the other collect-c*.yml files
# use.
collect/c8:
  text: |
    Orémus.
    Deus, qui nobis per síngulos annos hujus sancti templi tui consecratiónis réparas diem, et sacris semper mystériis repræséntas incólumes: exáudi preces pópuli tui, et præsta; ut quisquis hoc templum benefíciis petitúrus ingréditur, cuncta se impetrásse lætétur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Commune Dedicationis Ecclesiae (C8), [Ant 2] -- read directly from the reference engine (Latin/Commune/C8.txt, English/Commune/C8.txt); this Common had no lauds-versicle file yet either, see the new lauds-versicle-common-of-a-dedication.yml (Versum 2 there aliases Versum 1).
commemoration-antiphon:
  text: |
    Zachǽe, * festínans descénde, quia hódie in domo tua opórtet me manére. At ille festínans descéndit, et suscépit illum gaudens in domum suam. Hódie huic dómui salus a Deo facta est, allelúia.
  status: verified

# Matins hymn: the reference engine's Commune/C8 [HymnusM Matutinum] is '@Commune/C8:HymnusM Vespera', i.e. the Vespers hymn verbatim. Copy of vespers-hymn-common-of-a-dedication.yml.
# Vespers hymn. Engine render (Monastic Tridentinum 1617, command=prayVespera, 2026-11-09, the Dedication of the Basilica of the Most Holy Savior; the Nov 18 Dedication of the Basilicas of Ss. Peter and Paul, also ex C8, takes the same Common). Before this file the Common of a Dedication had no Lauds/Vespers bundle and both feasts fell through to the ferial chapter, responsory and hymn.
matins-hymn:
  text: |
    Urbs beáta Jerúsalem,
    Dicta pacis vísio,
    Quæ constrúitur in cælis
    Vivis ex lapídibus,
    Et Ángelis coronáta
    Ut sponsáta cómite.

    Nova véniens e cælo,
    Nuptiáli thálamo
    Præparáta, ut sponsáta
    Copulétur Dómino:
    Platéæ et muri ejus
    Ex auro puríssimo.

    Portæ nitent margarítis
    Ádytis paténtibus,
    Et virtúte meritórum
    Illuc introdúcitur
    Omnis qui ob Christi nomen
    Hic in mundo prémitur.

    Tunsiónibus, pressúris
    Expolíti lápides,
    Suis coaptántur locis
    Per manus artíficis,
    Disponúntur permansúri
    Sacris ædifíciis.

    Glória et honor Deo
    Usquequáque altíssimo,
    Una Patri, Filióque,
    Inclyto Paráclito,
    Cui laus est et potéstas
    Per ætérna sǽcula.
    Amen.
  status: verified

# The Common of the Dedication of a Church's own invitatory antiphon
# ("Domum Dei decet sanctitúdo" / "Holiness becometh the house of God"),
# read from the reference engine's own Commune/C8.txt [Invit] line (both
# languages). Any winning dedication feast with no proper invitatory
# antiphon of its own authored falls to this Common tier
# (hours/matins.ts's resolveMatinsInvitatoryText).
matins-invitatory:
  text: 'Domum Dei decet sanctitúdo: * Sponsum ejus Christum adorémus in ea.'
  status: verified

# Chapter (Rev 21:2), the same at Lauds and Vespers. Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2026-11-09, the Dedication of the Basilica of the Most Holy Savior; the Nov 18 Dedication of the Basilicas of Ss. Peter and Paul, also ex C8, takes the same Common). Before this file the Common of a Dedication had no Lauds/Vespers bundle and both feasts fell through to the ferial chapter, responsory and hymn.
lauds-capitulum:
  text: |
    Vidi civitátem sanctam, Jerúsalem novam, descendéntem de cælo a Deo, parátam sicut sponsam ornátam viro suo.
    R. Deo grátias.
  status: verified

# Lauds hymn. Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2026-11-09, the Dedication of the Basilica of the Most Holy Savior; the Nov 18 Dedication of the Basilicas of Ss. Peter and Paul, also ex C8, takes the same Common). Before this file the Common of a Dedication had no Lauds/Vespers bundle and both feasts fell through to the ferial chapter, responsory and hymn.
lauds-hymn:
  text: |
    Anguláris fundaméntum
    Lapis Christus missus est,
    Qui paríetum compáge
    In utróque néctitur,
    Quem Sion sancta suscépit,
    In quo credens pérmanet.

    Omnis illa Deo sacra
    Et dilécta cívitas,
    Plena módulis, in laude,
    Et canóre júbilo,
    Trinum Deum unicúmque
    Cum fervóre prǽdicat.

    Hoc in templo, summe Deus,
    Exorátus ádveni,
    Et cleménti bonitáte
    Precum vota súscipe,
    Largam benedictiónem
    Hic infúnde júgiter.

    Hic promereántur omnes
    Petíta acquírere,
    Et adépta possidére,
    Cum Sanctis perénniter
    Paradísum introíre,
    Transláti in réquiem.

    Glória et honor Deo
    Usquequáque altíssimo,
    Una Patri, Filióque,
    Inclyto Paráclito,
    Cui laus est et potéstas
    Per ætérna sǽcula.
    Amen.
  status: verified

# Lauds short responsory. Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2026-11-09, the Dedication of the Basilica of the Most Holy Savior; the Nov 18 Dedication of the Basilicas of Ss. Peter and Paul, also ex C8, takes the same Common). Before this file the Common of a Dedication had no Lauds/Vespers bundle and both feasts fell through to the ferial chapter, responsory and hymn.
