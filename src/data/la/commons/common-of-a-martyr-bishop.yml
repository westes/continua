# Verified against the reference engine's own source data files:
# web/www/horas/Latin/Commune/C2.txt ("Commune Unius Martyris Pontificis")
# and its English counterpart, 2026-08. A Common-collect template — `{N}`
# stands for the saint's own name, substituted by getDayCollect
# (hours/resolve-common.ts) via SaintRecord.collectCommon/collectName.
collect/c2:
  text: |
    Orémus.
    Infirmitátem nostram réspice, omnípotens Deus: et, quia pondus própriæ actiónis gravat, beáti {N} Mártyris tui atque Pontíficis intercéssio gloriósa nos prótegat.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Verified against the reference engine's own source data files:
# web/www/horas/Latin/Commune/C2-1.txt and its English counterpart,
# 2026-08. A Common-collect template — `{N}` stands for the saint's own
# name, substituted by getDayCollect (hours/resolve-common.ts) via
# SaintRecord.collectCommon/collectName.
collect/c2-1:
  text: |
    Orémus.
    Deus, qui nos beáti {N} Mártyris tui atque Pontíficis ánnua solemnitáte lætíficas: concéde propítius; ut, cujus natalítia cólimus, de ejúsdem étiam protectióne gaudeámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Verified against the reference engine's own source data files:
# web/www/horas/Latin/Commune/C2b.txt ("Commune unius Summi Pontificis et
# Martyris") and its English counterpart, 2026-08. A Common-collect
# template — `{N}` stands for the saint's own name, substituted by
# getDayCollect (hours/resolve-common.ts) via
# SaintRecord.collectCommon/collectName. Also used, verbatim, by C2b-1
# (collect-c2-1's own "Summorum Pontificum" variant is this file
# unchanged, per its own source cross-reference) — no separate file for
# that id, saints needing it just point collectCommon here directly.
collect/c2b:
  text: |
    Orémus.
    Gregem tuum, Pastor ætérne, placátus inténde: et, per beátum {N} Mártyrem tuum atque Summum Pontíficem, perpétua protectióne custódi; quem totíus Ecclésiæ præstitísti esse pastórem.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Commune Martyris Pontificis (C2), [Ant 2] -- read directly from the reference engine (Latin/Commune/C2.txt, English/Commune/C2.txt), same source as the already-verified lauds-versicle-common-of-a-martyr-bishop.yml's Versum 2 pairing.
commemoration-antiphon:
  text: |
    Qui odit * ánimam suam in hoc mundo, in vitam ætérnam custódit eam.
  status: verified

# Authored 2026-09-10, same content gap and fix as matins-hymn-common-of-
# a-martyr.yml (see its own header) -- Divinum Officium's `Commune/C2b.txt`
# (Martyr-Bishop) inherits `Commune/C2.txt`'s hymns wholesale, same as the
# psalmody tier already aliases these two categories (see
# matins-psalmody-overrides/categories/common-of-a-martyr.yml's own
# `aliases: [common-of-a-martyr-bishop]`) -- but no equivalent alias
# mechanism exists for hymn propers, so this is duplicated verbatim rather
# than aliased. Byte-identical text/status to matins-hymn-common-of-a-
# martyr.yml.
matins-hymn:
  text: |-
    Deus tuórum mílitum
    Sors, et córona, prǽmium,
    Laudes canéntes Mártyris
    Absólve nexu críminis.

    Hic nempe mundi gáudia,
    Et blandiménta nóxia
    Cadúca rite députans,
    Pervénit ad cæléstia.

    Pœnas cucúrrit fórtiter,
    Et sústulit viríliter,
    Pro te effúndens sánguinem,
    Ætérna dona póssidet.

    Ob hoc precátu súpplici
    Te póscimus, piíssime;
    In hoc triúmpho Mártyris
    Dimítte noxam sérvulis.

    * Laus et perénnis glória
    Deo Patri, et Fílio,
    Sancto simul Paráclito,
    In sempitérna sǽcula. Amen.
  status: verified

# Same Common-of-a-Martyr invitatory antiphon as
# matins-invitatory-common-of-a-martyr.yml — see that file's header for
# full sourcing detail.
matins-invitatory:
  text: Regem Mártyrum Dóminum, * Veníte, adorémus.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C2b` live query, 2026-08 -- used instead of a real saint's own
# day for the same reason recorded in vespers-hymn-common-of-a-martyr-
# bishop.yml's header (every real Common-of-a-Martyr-Bishop saint either
# has proper content of his own -- St. Lawrence, St. Stephen -- or never
# reaches the rank needed to keep his own hour un-outranked -- St.
# Zephyrinus, St. Callistus). Byte-identical to `votive=C2`/`C2a` (plain
# Common of a Martyr), confirming TODO.md's earlier finding that these
# categories share real content, not just their Matins psalmody. Same
# chapter reused for Vespers -- no separate vespers-capitulum-<id> file
# authored, per vespers.ts's lookupPart (Vespers chapter, Lauds sibling) fallback (see
# its own doc comment) -- same convention as Common-of-a-Confessor-Not-
# Bishop's identical Lauds/Vespers chapter.
lauds-capitulum:
  text: 'Beátus vir, qui suffert tentatiónem: quóniam cum probátus fúerit, accípiet corónam vitæ, quam repromísit Deus diligéntibus se.'
  citation: Jac 1:12
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C2b` live query, 2026-08 -- see lauds-capitulum-common-of-a-
# martyr-bishop.yml's header for why the votive-office view was used.
# "Martyr Dei, qui únicum" -- the classic Common-of-a-Martyr Lauds hymn,
# a single genuine recension (no Urban VIII variant text found for this
# one in the reference engine, unlike Iste Confessor's).
lauds-hymn:
  text: |-
    Martyr Dei, qui únicum
    Patris sequéndo Fílium,
    Victis triúmphas hóstibus,
    Victor fruens cæléstibus.

    Tui precátus múnere
    Nostrum reátum dílue,
    Arcens mali contágium,
    Vitæ rémovens tǽdium.

    Solúta sunt jam víncula
    Tui sacráti córporis:
    Nos solve vinclis sǽculi,
    Amóre Fílii Dei.

    * Deo Patri sit glória,
    Ejúsque soli Fílio,
    Cum Spíritu Paráclito,
    Et nunc, et in perpétuum. Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C2b` live query, 2026-08 -- see lauds-capitulum-common-of-a-
# martyr-bishop.yml's header for why the votive-office view was used.
lauds-responsory:
  text: |
    R.br. Glória et honóre * Coronásti eum, Dómine.
    R. Glória et honóre * Coronásti eum, Dómine.
    V. Et constituísti eum super ópera mánuum tuárum.
    R. Coronásti eum, Dómine.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Glória et honóre * Coronásti eum, Dómine.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C2b` live query, 2026-08 -- see lauds-capitulum-common-of-a-
# martyr-bishop.yml's header for why the votive-office view was used.
# Same versicle as Vespers -- see vespers-versicle-common-of-a-martyr-
# bishop.yml's header.
lauds-versicle:
  text: |
    V. Justus ut palma florébit.
    R. Sicut cedrus Líbani multiplicábitur.
  status: verified

# New file, 2026-09-15: the Common-category tier of Prime's Lectio
# Brevis override (see hours/resolve-common.ts's getPrimeLectioBrevis) --
# a saint with no proper Lectio Prima of her own, but who belongs to a
# Common category, uses that category's own text rather than falling all
# the way to the generic per-annum default. Sourced directly from
# web/www/horas/Latin/Commune/C2.txt's own [Lectio Prima] tag and its
# English counterpart.
prime-lectio:
  text: Justus cor suum trádidit ad vigilándum dilúculo ad Dóminum, qui fecit illum, et in conspéctu Altíssimi deprecábitur.
  citation: Sir 39:6
  status: verified

# Verified -- bishop/non-bishop distinction in the martyr Common affects
# only the collect, not these Scripture capitula. Content identical to
# terce-capitulum-common-of-a-martyr.yml (Jas 1:12).
terce-capitulum:
  text: |
    Beátus vir, qui suffert tentatiónem: quóniam cum probátus fúerit, accípiet corónam vitæ, quam repromísit Deus diligéntibus se.
    R. Deo grátias.
    V. Glória et honóre coronásti eum, Dómine.
    R. Et constituísti eum super ópera mánuum tuárum.
  citation: Jac 1:12
  status: verified

# Verified -- bishop/non-bishop distinction in the martyr Common affects
# only the collect, not these Scripture capitula. Content identical to
# sext-capitulum-common-of-a-martyr.yml (Sir 15:3).
sext-capitulum:
  text: |
    Cibávit illum pane vitæ et intelléctus, et aqua sapiéntiæ salutáris potávit illum Dóminus Deus noster.
    R. Deo grátias.
    V. Posuísti, Dómine, super caput ejus.
    R. Corónam de lápide pretióso.
  citation: Sir 15:3
  status: verified

# Verified -- bishop/non-bishop distinction in the martyr Common affects
# only the collect, not these Scripture capitula. Content identical to
# none-capitulum-common-of-a-martyr.yml (Sir 39:6).
none-capitulum:
  text: |
    Justus cor suum trádidit ad vigilándum dilúculo ad Dóminum, qui fecit illum, et in conspéctu Altíssimi deprecábitur.
    R. Deo grátias.
    V. Magna est glória ejus in salutári tuo.
    R. Glóriam et magnum decórem impónes super eum.
  citation: Sir 39:6
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
