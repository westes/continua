# Generic Common-of-a-Holy-Woman Matins psalmody, live-verified against
# Divinum Officium (Monastic Tridentinum 1617, command=prayMatutinum,
# 2026-07-26 -- St. Anne, whose own SanctiM file (`07-26.txt`, the file
# actually selected under our rubric -- the richer `07-26r.txt` sibling
# with its own real proper antiphons is gated `rubrica 1930`, not ours)
# carries no `[Ant Matutinum]` block of her own, so her output *is* this
# category's generic scheme, not a saint-specific deviation).
#
# Nocturn 1 and Nocturn 2's six antiphons, all six psalm numbers, and
# both nocturns' closing versicles are byte-identical to
# `common-of-a-virgin-martyr.yml`'s own (confirmed by direct text
# comparison, not assumed from the shared Song-of-Songs imagery) -- same
# psalm numbers [8,18,23,44,45,47] then [84,86,95,96,97,98] (the latter
# six adopted from that already-verified file rather than this pass's own
# extraction, which mis-paired one nocturn's antiphons against the live
# page's psalm-number labels on a first pass -- the antiphon *text* below
# was independently confirmed byte-identical either way). Nocturn 3's
# canticle citations (Sir 39:17-21, Isa 61:10-11;62:1-3, Isa 62:4-7) and
# closing versicle are likewise byte-identical to Virgin-Martyr's own.
#
# Genuinely different from Virgin-Martyr, and the reason this is its own
# file rather than an alias: Nocturn 3's own antiphon is "Invénta bona
# margaríta" (the pearl-of-great-price parable, Matt 13:45-46) in place
# of Virgin-Martyr's "Média nocte" (the wise-virgins/bridegroom
# antiphon) -- fitting imagery for a holy woman not specifically framed
# as a bride-of-Christ virgin. No English translation exists in the
# reference engine's own data for this one antiphon (the "pearl" text
# found nearby on the page is the unrelated Gospel-lesson excerpt, Matt
# 13's own parable, not a translation of this antiphon) -- translated
# directly here, flagged as such rather than left missing per this
# project's own "prefer text over missing" convention.
matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 8
        antiphon: O quam pulchra * est casta generátio cum claritáte!
      - psalms:
          - 18
        antiphon: Læva ejus * sub cápite meo, et déxtera illíus amplexábitur me.
      - psalms:
          - 23
        antiphon: Revértere, * revértere, Sunamítis; revértere, ut intueámur te.
      - psalms:
          - 44
        antiphon: Spécie tua * et pulchritúdine tua inténde, próspere procéde, et regna.
      - psalms:
          - 45
        antiphon: 'Adjuvábit eam * Deus vultu suo: Deus in médio ejus, non commovébitur.'
      - psalms:
          - 47
        antiphon: Aquæ multæ * non potuérunt exstínguere caritátem.
    versicle:
      v: Spécie tua et pulchritúdine tua.
      r: Inténde, próspere procéde, et regna.
  nocturn2:
    groups:
      - psalms:
          - 84
        antiphon: Nigra sum, * sed formósa, fíliæ Jerúsalem; ídeo diléxit me Rex, et introdúxit me in cubículum suum.
      - psalms:
          - 86
        antiphon: 'Trahe me post te, * in odórem currémus unguentórum tuórum: óleum effúsum nomen tuum.'
      - psalms:
          - 95
        antiphon: Veni, Sponsa Christi, * áccipe corónam, quam tibi Dóminus præparávit in ætérnum.
      - psalms:
          - 96
        antiphon: Unguéntum effúsum * nomen tuum; ideo adolescéntulæ dilexérunt te nimis.
      - psalms:
          - 97
        antiphon: Pulchra es * et decóra fília Jerúsalem, terríbilis ut castrórum ácies ordináta.
      - psalms:
          - 98
        antiphon: Accínxit * fortitúdine lumbos suos, et roborávit bráchium suum; ideóque lucérna ejus non exstinguétur in sempitérnum.
    versicle:
      v: Adjuvábit eam Deus vultu suo.
      r: Deus in médio ejus, non commovébitur.
  nocturn3:
    antiphon: Invénta bona margaríta * dedit ómnia sua, et comparávit eam.
    canticles:
      - refs:
          - book: sir
            chapter: 39
            verses: 17-21
      - refs:
          - book: isa
            chapter: 61
            verses: 10-11
          - book: isa
            chapter: 62
            verses: 1-3
      - refs:
          - book: isa
            chapter: 62
            verses: 4-7
    versicle:
      v: Elégit eam Deus, et præelégit eam.
      r: In tabernáculo suo habitáre facit eam.

# Generic Common-of-a-Holy-Woman (Not-Virgin) Lauds psalmody, live-
# verified against Divinum Officium (Monastic Tridentinum 1617,
# command=prayLaudes, votive=C7). Psalm numbers (92, 99, 62, Canticum
# Trium Puerorum) are the same fixed Duplex-majus+ set used by every
# Common (see hours/lauds-psalmody-overrides.ts's own doc comment) --
# only these antiphons are specific to this Common.
#
# `aliases` registers `common-of-a-widow` under this same scheme --
# votive=C7 is the shared source for both ids' existing matins-hymn-*.yml
# office-bundle files (see matins-hymn-common-of-a-widow.yml's own
# header).
#
# Also registers `common-of-several-women-martyrs`: Ss. Perpetua and
# Felicity's own reference-engine file says "vide C7b", and `votive=C7b`
# returned these exact same psalm numbers and group/canticle/Laudate
# antiphons (2026-08-28) -- C7b's only real difference from plain C7 is
# its own proper Benedictus antiphon ("Istárum est enim regnum
# cælórum..."), which belongs to a separate mechanism
# (getBenedictusAntiphon/`common`), not this psalmody table.
lauds-psalmody:
  aliases:
    - common-of-a-widow
    - common-of-several-women-martyrs
  groups:
    - psalms:
        - 92
      antiphon: Dum esset Rex * in accúbitu suo, nardus mea dedit odórem suavitátis.
    - psalms:
        - 99
      antiphon: 'In odórem * unguentórum tuórum cúrrimus: adolescéntulæ dilexérunt te nimis.'
    - psalms:
        - 62
      antiphon: 'Iam hiems tránsiit, * imber ábiit et recéssit: surge, amíca mea, et veni.'
  canticle:
    id: canticum-trium-puerorum
    antiphon: Veni, elécta mea, * et ponam in te thronum meum, allelúia.
  laudate:
    antiphon: Ista est speciósa * inter fílias Ierúsalem.

