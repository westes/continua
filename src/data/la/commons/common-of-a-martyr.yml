# Verified against the reference engine's own source data files:
# web/www/horas/Latin/Commune/C2a.txt and its English counterpart,
# 2026-08. A Common-collect template — `{N}` stands for the saint's own
# name, substituted by getDayCollect (hours/resolve-common.ts) via
# SaintRecord.collectCommon/collectName.
collect/c2a:
  text: |
    Orémus.
    Præsta, quǽsumus, omnípotens Deus: ut, qui beáti {N} Mártyris tui natalítia cólimus, intercessióne ejus in tui nóminis amóre roborémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Verified against the reference engine's own source data files:
# web/www/horas/Latin/Commune/C2a-1.txt and its English counterpart,
# 2026-08. A Common-collect template — `{N}` stands for the saint's own
# name, substituted by getDayCollect (hours/resolve-common.ts) via
# SaintRecord.collectCommon/collectName.
collect/c2a-1:
  text: |
    Orémus.
    Præsta, quǽsumus, omnípotens Deus: ut, intercedénte beáto {N} Mártyre tuo, et a cunctis adversitátibus liberémur in córpore, et a pravis cogitatiónibus mundémur in mente.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Verified against the reference engine's own source data files:
# web/www/horas/Latin/Commune/C7.txt ("Commune Unius non Virginis
# Martyris") — its own [Oratio] is `@Commune/C6::s/Vírginis et //`, i.e.
# collect-c6's own text with "Vírginis et " stripped (a matron/widow
# martyr, not a virgin) — resolved here by hand rather than building
# general sed-directive support for one saint (st-sabina). A
# Common-collect template — `{N}` stands for the saint's own name,
# substituted by getDayCollect (hours/resolve-common.ts) via
# SaintRecord.collectCommon/collectName.
collect/c7:
  text: |
    Orémus.
    Deus, qui inter cétera poténtiæ tuæ mirácula étiam in sexu frágili victóriam martýrii contulísti: concéde propítius; ut, qui beátæ {N} Mártyris tuæ natalícia cólimus, per ejus ad te exémpla gradiámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Commune Martyris non Pontificis (C2a) is a bare alias of C2 (no own [Ant 2]/[Versum 2] override in Latin/Commune/C2a.txt) -- same Ant 2 as the Martyr-Bishop Common, matching the already-shared lauds-versicle-common-of-a-martyr.yml text.
commemoration-antiphon:
  text: |
    Qui odit * ánimam suam in hoc mundo, in vitam ætérnam custódit eam.
  status: verified

# Authored 2026-09-10, closing a real content gap found while auditing
# hymn-doxology markers: `hours/matins.ts`'s `resolveMatinsHymn` looks up
# `matins-hymn-common-of-a-martyr.yml` for any winning Martyr-Common saint
# with no proper Matins hymn of his own, but this file never existed --
# any such saint silently fell straight through to the plain ferial Matins
# hymn instead. Divinum Officium's own `Commune/C2.txt` `[Hymnus
# Matutinum]` is a straight `@:Hymnus Vespera` cross-reference -- Matins
# reuses the same "Deus tuórum mílitum" hymn as Vespers verbatim (see
# vespers-hymn-common-of-a-martyr.yml, byte-identical text/status). Final
# stanza marked with a leading "* " -- Divinum Officium's own marker for a
# hymn's variable doxology; see hours/resolve-common.ts's substituteDoxology
# and hours/hymn-doxology.ts.
matins-hymn:
  text: |-
    Deus tuórum mílitum
    Sors, et córona, prǽmium,
    Laudes canéntes Mártyris
    Absólve nexu críminis.

    Hic nempe mundi gáudia,
    Et blandiménta nóxia
    Cadúca rite députans,
    Pervénit ad cæléstia.

    Pœnas cucúrrit fórtiter,
    Et sústulit viríliter,
    Pro te effúndens sánguinem,
    Ætérna dona póssidet.

    Ob hoc precátu súpplici
    Te póscimus, piíssime;
    In hoc triúmpho Mártyris
    Dimítte noxam sérvulis.

    * Laus et perénnis glória
    Deo Patri, et Fílio,
    Sancto simul Paráclito,
    In sempitérna sǽcula. Amen.
  status: verified

# The Common-of-a-Martyr's own invitatory antiphon ("Regem Mártyrum
# Dóminum" / "The Lord, the King of Martyrs"), read from the reference
# engine's own Commune/C2.txt [Invit] line (both languages) — C3 (Several
# Martyrs) inherits this verbatim (`[Invit]` line is a literal
# `@Commune/C2` redirect, no own text), matching this Common's own
# Matins psalmody precedent (matins-psalmody-overrides.ts's own
# Common-of-a-Martyr-Bishop-redirects-to-Common-of-a-Martyr note).
# Duplicated under common-of-a-martyr and common-of-a-martyr-bishop
# (both real SaintRecord.common ids in use) rather than aliased, per this
# project's established convention. Any winning martyr with no proper
# invitatory antiphon of his own authored falls to this Common tier
# (hours/matins.ts's resolveMatinsInvitatoryText).
matins-invitatory:
  text: Regem Mártyrum Dóminum, * Veníte, adorémus.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C2` live query, 2026-08 -- used instead of a real saint's own
# day for the same reason recorded in vespers-hymn-common-of-a-martyr-
# bishop.yml's header (every real Common-of-a-Martyr-Bishop saint either
# has proper content of his own -- St. Lawrence, St. Stephen -- or never
