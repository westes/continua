# Generic Common-of-a-Martyr Matins psalmody, live-verified against
# Divinum Officium (Monastic Tridentinum 1617, command=prayMatutinum,
# 2029-02-01 -- St. Ignatius of Antioch, Common of a Martyr-Bishop, whose
# own rule file is "vide C2" i.e. entirely from this Common, no proper
# antiphon of his own -- so his output *is* this category's generic
# scheme, not a saint-specific deviation). Also confirmed
# (data/hours/CommuneM/C2a.txt in the reference engine) that
# Common-of-a-Martyr-Bishop's own Matins psalmody redirects outright to
# this same Common-of-a-Martyr file -- the two categories share one
# scheme, not two.
#
# `aliases` registers `common-of-a-martyr-bishop` under this same scheme
# per the redirect confirmed above, rather than duplicating this file --
# checked all 3 Duplex+ Common-of-a-Martyr-Bishop saints on the calendar
# (Ignatius, Callistus I, Boniface of Mainz) and none has a proper
# antiphon of his own, so this alias is how each of them gets real
# psalmody at all (`hours/matins-psalmody-overrides.ts`'s tiered
# lookup falls through proper -> Common -> ferial; this is their Common
# tier).
#
# Recorded so the next Common-of-a-Martyr(-Bishop) saint's own proper
# file doesn't have to re-derive/re-verify these same shared psalm
# numbers and versicles from scratch, and as the reference point for
# what "differs from Common" means when authoring one (see
# matins-psalmody-overrides/saints/st-lawrence.yml's own note on its one
# genuine deviation, Ps 16 vs this file's Ps 64 in Nocturn 2).
matins-psalmody:
  aliases:
    - common-of-a-martyr-bishop
  nocturn1:
    groups:
      - psalms:
          - 1
        antiphon: In lege Dómini * fuit volúntas ejus die ac nocte.
      - psalms:
          - 2
        antiphon: Prǽdicans * præcéptum Dómini constitútus est in monte sancto ejus.
      - psalms:
          - 4
        antiphon: Fílii hóminum * scitóte quia Dóminus sanctum suum mirificávit.
      - psalms:
          - 5
        antiphon: Scuto bonæ voluntátis * tuæ coronásti eum Dómine.
      - psalms:
          - 8
        antiphon: In univérsa terra * glória et honóre coronásti eum.
      - psalms:
          - 10
        antiphon: 'Justus Dóminus, * et justítiam diléxit: æquitátem vidit vultus ejus.'
    versicle:
      v: Glória et honóre coronásti eum, Dómine.
      r: Et constituísti eum super ópera mánuum tuárum.
  nocturn2:
    groups:
      - psalms:
          - 14
        antiphon: 'Habitábit * in tabernáculo tuo: requiéscet in monte sancto tuo.'
      - psalms:
          - 20
        antiphon: Posuísti, Dómine, * super caput ejus corónam de lápide pretióso.
      - psalms:
          - 23
        antiphon: Hic accípiet * benedictiónem a Dómino, et misericórdiam a Deo salutári suo; qui hæc est generátio quæréntium Dóminum.
      - psalms:
          - 63
        antiphon: Lætábitur justus * in Dómino et sperábit in eo, et laudabúntur omnes recti corde.
      - psalms:
          - 64
        antiphon: Beátus * quem elegísti Dómine, habitábit in átriis tuis.
      - psalms:
          - 91
        antiphon: 'Justus ut palma florébit: sicut cedrus Líbani multiplicábitur.'
    versicle:
      v: Posuísti, Dómine, super caput ejus.
      r: Corónam de lápide pretióso.
  nocturn3:
    antiphon: Qui vult veníre post me, * ábnegat semetípsum, et tollet crucem suam, et sequátur me.
    canticles:
      - refs:
          - book: sir
            chapter: 14
            verses: '22'
          - book: sir
            chapter: 15
            verses: 3-4
          - book: sir
            chapter: 15
            verses: '6'
      - refs:
          - book: jer
            chapter: 17
            verses: 7-8
      - refs:
          - book: sir
            chapter: 31
            verses: 8-11
    versicle:
      v: Magna est glória ejus in salutári tuo.
      r: Glóriam et magnum decórem impónes super eum.

# Generic Common-of-a-Martyr Lauds psalmody, live-verified against
# Divinum Officium (Monastic Tridentinum 1617, command=prayLaudes,
# votive=C2). Psalm numbers (92, 99, 62, Canticum Trium Puerorum) are the
# same fixed Duplex-majus+ set used by every Common (see
# hours/lauds-psalmody-overrides.ts's own doc comment) -- only these
# antiphons are Martyr-specific.
#
# `aliases` registers `common-of-a-martyr-bishop` under this same scheme
# -- votive=C2b at Lauds is byte-identical to C2 for these same slots
# (matches matins-psalmody-overrides/categories/common-of-a-martyr.yml's
# own finding that the two categories share one Matins scheme too).
lauds-psalmody:
  aliases:
    - common-of-a-martyr-bishop
  groups:
    - psalms:
        - 92
      antiphon: Qui me conféssus fúerit * coram homínibus, confitébor et ego eum coram Patre meo.
    - psalms:
        - 99
      antiphon: Qui séquitur me, * non ámbulat in ténebris, sed habébit lumen vitæ, dicit Dóminus.
    - psalms:
        - 62
      antiphon: 'Qui mihi minístrat, * me sequátur: et ubi ego sum, illic sit et miníster meus.'
  canticle:
    id: canticum-trium-puerorum
    antiphon: Si quis mihi ministráverit, * honorificábit eum Pater meus, qui est in cælis, dicit Dóminus.
  laudate:
    antiphon: Volo Pater, * ut ubi ego sum, illic sit et miníster meus.

# Generic Common-of-a-Martyr Vespers psalmody, live-verified against
# Divinum Officium (Monastic Tridentinum 1617, command=prayVespera,
# votive=C2, 2026-08-28).
#
# `aliases` registers `common-of-a-martyr-bishop` under this same scheme
# -- `votive=C2b` at Vespers returned byte-identical psalms/antiphons to
# `votive=C2` for these same four slots (only the Magnificat antiphon
# differs, handled separately, not this psalmody table).
vespers-psalmody:
  aliases:
    - common-of-a-martyr-bishop
  groups:
    - psalms:
        - 109
      antiphon: Qui me conféssus fúerit * coram homínibus, confitébor et ego eum coram Patre meo.
    - psalms:
        - 111
      antiphon: Qui séquitur me, * non ámbulat in ténebris, sed habébit lumen vitæ, dicit Dóminus.
    - psalms:
        - 112
      antiphon: 'Qui mihi minístrat, * me sequátur: et ubi ego sum, illic sit et miníster meus.'
    - psalms:
        - 115
      antiphon: Volo Pater, * ut ubi ego sum, illic sit et miníster meus.
