# Second Vespers Magnificat antiphon for `common-of-an-evangelist`
# (Commune Evangelistarum, Latin/Commune/C1a.txt) -- C1a.txt is
# "@Commune/C1" with only Lectio1-9 overridden (its own Matins-lesson
# content, Ezechiel + St. Gregory); every antiphon section, including
# [Ant 3], is inherited unchanged from C1 (Commune Apostolorum). Same
# text as magnificat-antiphon-common-of-an-apostle.yml, registered under
# its own id per this codebase's standing convention for shared Common
# content rather than aliased (see e.g. benedictus-antiphon-common-of-a-
# confessor-not-bishop.yml's own header for the same pattern).
magnificat-antiphon:
  text: 'Estóte fortes * in bello, et pugnáte cum antíquo serpénte: et accipiétis regnum ætérnum, allelúia.'
  status: verified

# First Vespers Magnificat antiphon for this Common: Latin/Commune/C1.txt's own
# [Ant 1] (and its English counterpart), where it differs from [Ant 3]. Second
# Vespers' [Ant 3] is magnificat-antiphon-common-of-an-evangelist.yml (the default); see
# hours/resolve-common.ts's withVespersVariant.
magnificat-antiphon/~-first:
  text: Tradent enim vos * in concíliis, et in synagógis suis flagellábunt vos, et ante reges et prǽsides ducémini propter me in testimónium illis, et Géntibus.
  status: verified
