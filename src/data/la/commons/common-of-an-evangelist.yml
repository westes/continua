# The Common of an Evangelist's Matins hymn: Commune/C1a.txt's own
# [Hymnus Matutinum] is the Apostles' hymn (matins-hymn-common-of-an-apostle.yml)
# with three Latin substitutions -- "Palmas et hymnos débitos" -> "Laudes
# canéntes débitas", "tyránnum cónterit" -> "triúmphat príncipem", and stanza 4
# reordered ("In his volúntas Spíritus, / Exsúltat in his Fílius"). The English
# is the Apostles' unchanged, as in the reference (it has no Evangelist
# English of its own for this hymn).
matins-hymn:
  text: |-
    Ætérna Christi múnera,
    Apostolórum glóriam,
    Laudes canéntes débitas
    Lætis canámus méntibus.

    Ecclesiárum Príncipes,
    Belli triumpháles duces,
    Cæléstis aulæ mílites,
    Et vera mundi lúmina.

    Devóta Sanctórum fides,
    Invícta spes credéntium,
    Perfécta Christi cáritas
    Mundi triúmphat príncipem.

    In his Patérna glória,
    In his volúntas Spíritus,
    Exsúltat in his Fílius,
    Cælum replétur gáudio.

    * Patri, simúlque Fílio,
    Tibíque Sancte Spíritus,
    Sicut fuit, sit júgiter
    Sæclum per omne glória. Amen.
  status: verified

# Evangelists (Sancti 'ex C1a'/'ex C1') inherit Commune/C1's invitatory.
matins-invitatory:
  text: Regem Apostolórum Dóminum, * Veníte, adorémus.
  status: verified

# Same text as prime-antiphon-common-of-apostles (Commune C1a (Evangelists) takes the Apostles' minor-hour
# antiphons and chapters in the reference); duplicated here so the Common's own
# id resolves, per the one-`common`-per-saint rule (see
# prime-antiphon-common-of-apostles.yml's header for provenance).
# Verified against Divinum Officium (Monastic Tridentinum 1617), Prime.
# Extracted (2026-08) from the identical content independently authored
# for 8 duplex-majus+ Apostle/Evangelist feasts and confirmed byte-for-
# byte identical via diff: st-matthias, st-barnabas, st-james-the-greater,
# st-thomas-apostle, ss-simon-and-jude, st-luke, st-matthew, st-bartholomew
# (each saint's own live-query date recorded in git history, not repeated
# here). See SaintRecord.common (calendar/feasts.ts) for how
# saints reach this file, and TODO.md for the saints still missing it.
prime-antiphon:
  text: Hoc est præcéptum meum, * ut diligátis ínvicem, sicut diléxi vos.
  status: verified

# Same text as prime-antiphon-common-of-apostles-paschaltide (Commune C1a (Evangelists) takes the Apostles' minor-hour
# antiphons and chapters in the reference); duplicated here so the Common's own
# id resolves, per the one-`common`-per-saint rule (see
# prime-antiphon-common-of-apostles.yml's header for provenance).
# Verified against the reference engine's own source data files (not a
# live query): web/www/horas/Latin/Commune/C1p.txt and English/Commune/
# C1p.txt ("Commune Apostolorum tempore Paschali"), 2026-08. Cross-checked
# against st-mark's already-authored, live-queried content (2026-04-25) --
# identical except this source's own asterisk falls one word earlier
# ("Sancti tui, * Dómine..." not "Sancti tui, Dómine, * ...") -- trusted
# over the live-rendered incipit split, per resolveMinorHourAntiphon's own
# Paschaltide-variant fallback (hours/resolve-common.ts) and
# SaintRecord.common (calendar/feasts.ts). See TODO.md for which
# saints (st-mark, st-john-before-the-latin-gate, ss-philip-and-james)
# reach this file and why only Apostles/Martyr-Bishop/Several-Martyrs
# commons have a Paschaltide variant at all.
prime-antiphon/~-paschaltide:
  text: 'Sancti tui, * Dómine, florébunt sicut lílium, allelúia: et sicut odor bálsami erunt ante te, allelúia.'
  status: verified

# Sourced from web/www/horas/Latin/Commune/C1.txt's own [Lectio Prima] and its
# English counterpart.
# Evangelists (Mark, Luke) are `ex C1a`, and C1a is @Commune/C1.
prime-lectio:
  text: Ibant Apóstoli gaudéntes a conspéctu concílii, quóniam digni hábiti sunt pro nómine Jesu contuméliam pati.
  citation: Act 5:41
  status: verified

