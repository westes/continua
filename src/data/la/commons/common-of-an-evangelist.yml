# web/www/horas/Latin/Commune/C1p.txt and English/Commune/C1p.txt, 2026-08
# -- see prime-antiphon-common-of-apostles-paschaltide.yml's header (C1p's
# own [Capitulum Laudes]/[Versum 1] sections -- Terce's chapter equals
# Lauds' in the Monastic tradition).
terce-capitulum/~-paschaltide:
  text: |
    Stabunt justi in magna constántia advérsus eos qui se angustiavérunt et qui abstulérunt labóres eórum.
    R. Deo grátias.
    V. Sancti et justi in Dómino gaudéte, allelúia.
    R. Vos elégit Deus in hereditátem sibi, allelúia.
  citation: Sap 5:1
  status: verified

