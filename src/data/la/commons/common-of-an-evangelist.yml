# Extracted (2026-08) — see prime-antiphon-common-of-apostles.yml's header
# for the full provenance note (same 8-saint group, confirmed via diff).
terce-capitulum:
  text: |
    Fratres: Jam non estis hóspites et ádvenæ: sed estis cives Sanctórum et doméstici Dei: superædificáti super fundaméntum Apostolórum, et Prophetárum, ipso summo angulári lápide Christo Jesu.
    R. Deo grátias.
    V. In omnem terram exívit sonus eórum.
    R. Et in fines orbis terræ verba eórum.
  citation: Eph 2:19-20
  status: verified

# Same text as terce-capitulum-common-of-apostles-paschaltide (Commune C1a (Evangelists) takes the Apostles' minor-hour
# antiphons and chapters in the reference); duplicated here so the Common's own
