# Verified against Divinum Officium (Monastic Tridentinum 1617), Matins
# `votive=C7` live query, 2026-08 -- a genuinely shorter form than
# Common-of-a-Virgin(-Martyr)'s own Matins hymn: just its closing two
# stanzas (doxology included), not the full five-stanza "Vírginis
# Proles." Confirmed identical across `C7`/`C7a`/`C7b` (the same three
# sub-variants already seen for this category at Lauds/Vespers).
matins-hymn:
  text: |
    Hujus obténtu, Deus alme, nostris
    Parce jam culpis, vítia remíttens,
    Quo tibi puri resonémus almum
    Péctoris hymnum.

    Glória Patri genitǽque Proli,
    Et tibi compar utriúsque semper
    Spíritus alme, Deus unus, omni
    Témpore sæcli. Amen.
  status: verified

# Common-of-a-Widow's invitatory: the reference engine's Sancti files for widows (Bridget 10-08, Jane Frances de Chantal 08-21 via C7a) take Commune/C7's name-template antiphon, same text as matins-invitatory-common-of-a-holy-woman.yml. Each saint supplies SaintRecord.invitatoryName for the {N}. Found missing 2026-10-08 (Bridget fell to the ferial antiphon).
matins-invitatory:
  text: Laudémus Deum nostrum * In confessióne beátæ {N}.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds,
# St. Anne's own real day (2026-07-26, clean/un-outranked) -- genuinely
# distinct from Common-of-a-Virgin(-Martyr): different chapter and hymn,
# though the responsory pattern and versicle are byte-identical to that
# category's own (see lauds-responsory-common-of-a-widow.yml and
# lauds-versicle-common-of-a-widow.yml). Same chapter reused for
# Vespers -- no separate vespers-capitulum-<id> file authored, per
# vespers.ts's lookupPart (Vespers chapter, Lauds sibling) fallback.
#
# Also live-verified (St. Monica, May 4) that `common-of-a-widow`'s real
# content is identical to this -- duplicated verbatim under that id too,
# same no-alias-mechanism reasoning as `common-of-a-confessor`'s own
# header. `common` for both categories' saints already points
# to `common-of-a-virgin` (a separate, established choice for the minor
# hours specifically, not touched here).
lauds-capitulum:
  text: Mulíerem fortem quis invéniet? Procul et de últimis fínibus prétium ejus. Confídit in ea cor viri sui, et spóliis non indigébit.
  citation: Prov 31:10-11
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds,
# St. Anne's own real day (2026-07-26) -- see lauds-capitulum-common-of-
# a-holy-woman.yml's header. "Fortem viríli péctore" -- the classic
# Common-of-a-Holy-Woman hymn, same text both hours here.
lauds-hymn:
  text: |-
    Fortem viríli péctore
    Laudémus omnes féminam,
    Quæ sanctitátis glória
    Ubíque fulget ínclita.

    Hæc Christi amóre sáucia,
    Dum mundi amórem nóxium
    Horréscit, ad cæléstia
    Iter perégit árduum.

    Carnem domans jejúniis,
    Dulcíque mentem pábulo
    Oratiónis nútriens,
    Cæli potítur gáudiis.

    Rex Christe, virtus fórtium,
    Qui magna solus éfficis,
    Hujus precátu, quǽsumus,
    Audi benígnus súpplices.

    * Deo Patri sit glória,
    Ejúsque soli Fílio,
    Cum Spíritu Paráclito,
    Nunc, et per omne sǽculum. Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds,
# St. Anne's own real day (2026-07-26) -- byte-identical to Common-of-a-
