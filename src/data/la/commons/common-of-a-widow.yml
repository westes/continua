    R. Deo grátias.
    V. Spécie tua et pulchritúdine tua.
    R. Inténde, próspere procéde, et regna.
  citation: Prov 31:10-11
  status: verified

# Commune/C7a.txt [Capitulum Sexta] (a widow takes C7a; several women martyrs take C7b->C7). Terce takes the Lauds chapter and None takes Lectio Prima per the engine. The V/R pair after the chapter is the responsory breve inherited from Commune/C6. Replaced a copy of the Virgin's chapter (2 Cor 10:17 etc.), which the reference does not use for this Common.
sext-capitulum:
  text: |
    Manum suam apéruit ínopi, et palmas suas exténdit ad páuperem. Non timébit dómui suæ a frigóribus nivis.
    R. Deo grátias.
    V. Adjuvábit eam Deus vultu suo.
    R. Deus in médio ejus, non commovébitur.
  citation: Prov 31:20-21
  status: verified

# Commune/C7a.txt [Capitulum Nona] (a widow takes C7a; several women martyrs take C7b->C7). Terce takes the Lauds chapter and None takes Lectio Prima per the engine. The V/R pair after the chapter is the responsory breve inherited from Commune/C6. Replaced a copy of the Virgin's chapter (2 Cor 10:17 etc.), which the reference does not use for this Common.
none-capitulum:
  text: |
    Multæ fíliæ congregavérunt divítias: tu supergréssa es univérsas. Fallax grátia, et vana est pulchritúdo: múlier timens Dóminum, ipsa laudábitur.
    R. Deo grátias.
    V. Elégit eam Deus, et præelégit eam.
    R. In tabernáculo suo habitáre facit eam.
  citation: Prov 31:29-30
  status: verified

