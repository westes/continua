    V. Inténde, próspere procéde, et regna.
    R. Et pulchritúdine tua.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Spécie tua * Et pulchritúdine tua.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds,
# St. Anne's own real day (2026-07-26) -- byte-identical to Common-of-a-
# Virgin(-Martyr)'s own versicle -- see vespers-versicle-common-of-a-
# holy-woman.yml's header.
lauds-versicle:
  text: |
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
  status: verified

# New file, 2026-09-15: the Common-category tier of Prime's Lectio
# Brevis override (see hours/resolve-common.ts's getPrimeLectioBrevis) --
# a saint with no proper Lectio Prima of her own, but who belongs to a
# Common category, uses that category's own text rather than falling all
# the way to the generic per-annum default. Sourced directly from
# web/www/horas/Latin/Commune/C7.txt's own [Lectio Prima] tag and its
# English counterpart.
prime-lectio:
  text: Laudábit usque ad mortem ánima mea Dóminum, quóniam éruis sustinéntes te, et líberas eos de manu angústiæ, Dómine, Deus noster.
  citation: Sir 51:8; 51:12
  status: verified

# Commune/C7a.txt [Capitulum Laudes] (a widow takes C7a; several women martyrs take C7b->C7). Terce takes the Lauds chapter and None takes Lectio Prima per the engine. The V/R pair after the chapter is the responsory breve inherited from Commune/C6. Replaced a copy of the Virgin's chapter (2 Cor 10:17 etc.), which the reference does not use for this Common.
