# Raphael (10-24, 'ex Sancti/05-08') inherits St. Michael's archangel invitatory; Michael/Gabriel/Guardian Angels have their own files.
matins-invitatory:
  text: Regem Archangelórum Dóminum, * Veníte, adorémus.
  status: verified

# Generic Common-of-an-Angel Lauds psalmody. Unlike every other Common
# here, there is no dedicated numbered "Cx" Common file for Angels in the
# Monastic reference engine at all (checked the full CommuneM directory
# listing) -- St. Michael's own SanctiM rule instead says plain "Psalmi
# Dominica" (Sunday's own psalmody) and carries his own proper antiphons
# directly. Live-verified (2026-08-28) that Guardian Angels (Oct 2, no
# proper text of her own) reuses Michael's own antiphons byte-for-byte at
# both Lauds and Vespers -- i.e. Michael's proper *is* the de facto
# generic Angel scheme any other Angel-Common saint without proper text
# of their own falls back to. St. Gabriel and St. Raphael each have their
# own genuinely distinct proper antiphons (not this generic scheme, and
# not each other's) -- not modeled here since a per-feast Lauds override
# would be the correct home for those, not this category.
#
# Psalm numbers here (92, 99, 62, Canticum Trium Puerorum) are still the
# usual fixed Duplex-majus+ set, confirmed against Michael's own live
# Lauds -- only Vespers substitutes "Psalmi Dominica" (109-112) instead,
# see the Vespers category file's own note.
lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: Stetit Angelus * iuxta aram templi, habens thuríbulum áureum in manu sua.
    - psalms:
        - 99
      antiphon: 'Dum præliarétur * Míchaël Archángelus cum dracóne, audíta est vox dicéntium: Salus Deo nostro, allelúia.'
    - psalms:
        - 62
      antiphon: Archángele Míchaël, * constítui te príncipem super omnes ánimas suscipiéndas.
  canticle:
    id: canticum-trium-puerorum
    antiphon: Angeli Dómini, * Dóminum benedícite in ætérnum.
  laudate:
    antiphon: Angeli, Archángeli, * Throni et Dominatiónes, Principátus et Potestátes, Virtútes cælórum, laudáte Dóminum de cælis, allelúia.

# Generic Common-of-an-Angel Vespers psalmody. Unlike every other Common
# here, there is no dedicated numbered "Cx" Common file for Angels in the
# Monastic reference engine (checked the full CommuneM directory listing)
# -- St. Michael's own SanctiM rule instead says plain "Psalmi Dominica",
# i.e. Sunday's own Vespers psalm numbers (109-112, not a Common-specific
# set), carrying his own proper antiphons directly.
#
# Correction (2026-09-08): an earlier note here claimed Guardian Angels
# "reuses Michael's own antiphons byte-for-byte" -- checking the raw
# source file directly (Sancti/10-02.txt's own [Ant Vespera]) showed that
# was wrong; she has her own genuinely distinct proper antiphons, same as
# St. Gabriel and St. Raphael, all three now modeled as their own
# `saints/*.yml` overrides rather than falling back to this category at
# all. This Michael-sourced scheme remains the actual fallback for any
# *other* Angel-Common saint without proper text of their own, but that
# set is now empirically unverified beyond Michael himself -- treat the
# "de facto generic Angel scheme" framing as a hypothesis, not a
# confirmed fact, until another such saint is actually checked.
vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: Stetit Angelus * iuxta aram templi, habens thuríbulum áureum in manu sua.
    - psalms:
        - 110
      antiphon: 'Dum præliarétur * Míchaël Archángelus cum dracóne, audíta est vox dicéntium: Salus Deo nostro, allelúia.'
    - psalms:
        - 111
      antiphon: Archángele Míchaël, * constítui te príncipem super omnes ánimas suscipiéndas.
    - psalms:
        - 112
      antiphon: Angeli, Archángeli, * Throni et Dominatiónes, Principátus et Potestátes, Virtútes cælórum, laudáte Dóminum de cælis, allelúia.
