vespers-responsory:
  text: |
    R.br. Ave María, grátia plena, * Dóminus tecum.
    R. Ave María, grátia plena, * Dóminus tecum.
    V. Benedícta tu in muliéribus, et benedíctus fructus ventris tui.
    R. Dóminus tecum.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Ave María, grátia plena, * Dóminus tecum.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# `votive=C11` live query, 2026-08 -- distinct from the Lauds versicle
# (see lauds-versicle-common-of-the-bvm.yml).
vespers-versicle:
  text: |
    V. Dignáre me laudáre te, Virgo sacráta.
    R. Da mihi virtútem contra hostes tuos.
  status: verified

# Corrected 2026-08-31: originally read from C11.txt's [Ant 1] ("Sancta
# Maria succurre miseris"), but that's this Common's *First Vespers*
# antiphon, not the Lauds Benedictus one -- discovered while sourcing
# magnificat-antiphon-common-of-the-bvm.yml, which made clear this file's
# layout is Vespers1(Ant1) -> Matins -> Lauds(Ant2) -> minor hours ->
# Vespers2(Ant3), the same pattern confirmed live for several sibling
# Commons (see e.g. magnificat-antiphon-common-of-several-martyrs.yml's
# own header). The real Lauds text is C11's own [Ant 2]. Not
# independently live-queried for this specific Common. Reusable by any
# BVM feast keyed to `common: common-of-the-bvm`
# (SaintRecord.common) that has no proper Benedictus antiphon
# of its own -- e.g. our-lady-of-the-snows.yml.
benedictus-antiphon:
  text: 'Beáta es, * María, quæ credidísti: perficiéntur in te, quæ dicta sunt tibi a Dómino, allelúia.'
  status: verified

# Second Vespers Magnificat antiphon for `common-of-the-bvm` (In Festis
# Beatae Mariae Virginis, Latin/Commune/C11.txt's own [Ant 3]) --
# fittingly the Magnificat's own opening line ("Beatam me dicent omnes
# generationes"). Discovered while sourcing this file that
# benedictus-antiphon-common-of-the-bvm.yml had been reading the wrong
# tag ([Ant 1], this Common's First Vespers antiphon, "Sancta Maria
# succurre miseris") instead of [Ant 2] (the real Lauds Benedictus
# antiphon, "Beata es Maria quae credidisti") -- corrected there in the
# same pass; see this file's own header note.
magnificat-antiphon:
  text: Beátam me dicent * omnes generatiónes, quia ancíllam húmilem respéxit Deus.
  status: verified

# First Vespers Magnificat antiphon for this Common: Latin/Commune/C11.txt's own
# [Ant 1] (and its English counterpart), where it differs from [Ant 3]. Second
# Vespers' [Ant 3] is magnificat-antiphon-common-of-the-bvm.yml (the default); see
# hours/resolve-common.ts's withVespersVariant.
magnificat-antiphon/~-first:
  text: 'Sancta María, * succúrre míseris, juva pusillánimes, réfove flébiles, ora pro pópulo, intérveni pro clero, intercéde pro devóto femíneo sexu: séntiant omnes tuum juvámen, quicúmque célebrant tuam sanctam festivitátem.'
  status: verified

# Generic Common-of-the-BVM Matins psalmody, live-verified against
# Divinum Officium (Monastic Tridentinum 1617, command=prayMatutinum,
# 2026-08-05 -- Our Lady of the Snows, whose own file is `propers: null`
# -- confirmed against her own saint-file comment as a real Common-only
# case, no proper of her own -- so her output *is* this category's
# generic scheme). Rank Duplex majus, clears the Duplex+ three-nocturn
# gate.
#
# Reference-engine votive number: C11 ("Beatae Mariae Virginis"), per
# `horas.dialog`'s own `[votives]` index -- see
# `common-of-a-virgin-martyr.yml`'s own header for why the CGI's
# `votive=` parameter isn't itself usable to pull this live (it doesn't
# swap Matins nocturn psalmody, only the Invitatory/Lauds/Vespers) --
# a real Duplex+ saint's own calendar date remains the only reliable path.
#
# All 6 Nocturn 1/2 antiphons are Marian (Song of Songs bridal imagery
# plus proper Marian phrases like "Sicut myrrha elécta" and "Gaude, María
# Virgo"); Nocturn 3's antiphon+canticle is the "Hortus conclúsus" (Song
# of Songs 4) text, genuinely distinct content from both
# Common-of-a-Virgin-Martyr and Common-of-a-Virgin's own Nocturn 3.
matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 8
        antiphon: Benedícta tu * in muliéribus, et benedíctus fructus ventris tui.
      - psalms:
          - 18
        antiphon: Sicut myrrha * elécta, odórem dedísti suavitátis, sancta Dei Génitrix.
      - psalms:
          - 23
        antiphon: Ante torum * hujus Vírginis frequentáte nobis dúlcia cántica drámatis.
      - psalms:
          - 44
        antiphon: Spécie tua * et pulchritúdine tua inténde, próspere procéde, et regna.
      - psalms:
          - 45
        antiphon: 'Adjuvábit eam * Deus vultu suo: Deus in médio ejus, non commovébitur.'
      - psalms:
          - 47
        antiphon: 'Favus distíllans * lábia tua, Sponsa, mel et lac sub lingua tua: † et odor vestimentórum tuórum sicut odor thuris.'
    versicle:
      v: Spécie tua et pulchritúdine tua.
      r: Inténde, próspere procéde, et regna.
  nocturn2:
    groups:
      - psalms:
          - 84
        antiphon: Fons hortórum, * púteus aquárum vivéntium, † quæ fluunt ímpetu de Líbano.
      - psalms:
          - 86
        antiphon: Sicut lætántium * ómnium nostrum habitátio est in te, sancta Dei Génitrix.
      - psalms:
          - 95
        antiphon: 'Gaude, María Virgo: * cunctas hǽreses sola interemísti in univérso mundo.'
      - psalms:
          - 96
        antiphon: 'Dignáre me * laudáre te, Virgo sacráta: da mihi virtútem contra hostes tuos.'
      - psalms:
          - 97
        antiphon: 'Post partum, * Virgo, invioláta permansísti: Dei Génitrix, intercéde pro nobis.'
      - psalms:
          - 98
        antiphon: Descéndi * in hortum nucum, ut vidérem poma convállium, † et inspícerem, si floruísset vinea, et germinássent mala púnica, allelúia.
    versicle:
      v: Adjuvábit eam Deus vultu suo.
      r: Deus in médio ejus, non commovébitur.
  nocturn3:
    antiphon: 'Hortus conclúsus * es Dei Génitrix, hortus conclúsus, fons signátus: † surge própera, amíca mea, et veni.'
    canticles:
      - refs:
          - book: sir
            chapter: 39
            verses: 17-21
      - refs:
          - book: isa
            chapter: 61
            verses: 10-11
          - book: isa
            chapter: 62
            verses: 1-3
      - refs:
          - book: isa
            chapter: 62
            verses: 4-7
    versicle:
      v: Elégit eam Deus, et præelégit eam.
      r: In tabernáculo suo habitáre facit eam.

# Generic Common-of-the-BVM Lauds psalmody, live-verified against
# Divinum Officium (Monastic Tridentinum 1617, command=prayLaudes,
# votive=C11). Psalm numbers (92, 99, 62, Canticum Trium Puerorum) are
# the same fixed Duplex-majus+ set used by every Common (see
# hours/lauds-psalmody-overrides.ts's own doc comment) -- only these
# antiphons are specific to this Common.
lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: Dum esset Rex * in accúbitu suo, nardus mea dedit odórem suavitátis.
    - psalms:
        - 99
      antiphon: Læva eius * sub cápite meo, et déxtera illíus amplexábitur me.
    - psalms:
        - 62
      antiphon: Nigra sum, * sed formósa, fíliæ Ierúsalem; ídeo diléxit me Rex, et introdúxit me in cubículum suum.
  canticle:
    id: canticum-trium-puerorum
    antiphon: 'Iam hiems tránsiit, * imber ábiit et recéssit: surge, amíca mea, et veni.'
  laudate:
    antiphon: Speciósa * facta es et suávis in delíciis tuis, sancta Dei Génetrix.

