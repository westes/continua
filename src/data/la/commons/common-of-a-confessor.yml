# live-verified as a genuine full redirect (psalms, antiphons, AND
# versicles all byte-identical, unlike the Bishop case above): St. Maurus
# (2026-01-15, Duplex II. classis) and St. Gall (2026-10-16, Duplex) for
# Abbot; St. Francis of Assisi (2026-10-04, Duplex) and St. Jerome
# (2026-09-30, Duplex) for Confessor-non-Bishop — all four reproduce this
# file's content exactly, confirming vu's own separately-named ids
# collapse to one Matins scheme in the reference engine (Reference votive
# numbers C5/C5b both point here per `horas.dialog`'s `[votives]` index).
#
# `common-of-several-confessors` also aliased here (2026-08-27),
# live-verified against Ss. John of God and Camillus de Lellis
# (2027-03-08, Duplex, SanctiM `vide C5c` = "Plurium Confessorum non
# Pontificum" — the plural/several form of this same Common) — psalms,
# antiphons, Nocturn 3 canticle citation (Sir 14:22;15:3-4;15:6, byte-
# identical to this file's own), and all three versicles reproduce this
# file's content exactly. The Rule of St. Benedict imposes no "several
# confessors" nuance the reference engine's own C5c doesn't already fold
# into the plain C5 scheme, so no separate file was warranted.
matins-psalmody:
  aliases:
    - common-of-an-abbot
    - common-of-a-confessor-not-bishop
    - common-of-several-confessors
  nocturn1:
    groups:
      - psalms:
          - 1
        antiphon: 'Beátus vir, * qui in lege Dómini meditátur: volúntas ejus pérmanet die ac nocte, et ómnia quæcúmque fáciet, semper prosperabúntur.'
      - psalms:
          - 2
        antiphon: Beátus iste Sanctus, * qui confísus est in Dómino, prædicávit præcéptum Dómini, constitútus est in monte sancto ejus.
      - psalms:
          - 4
        antiphon: Invocántem * exaudívit Dóminus Sanctum suum; Dóminus exaudívit eum, et constítuit eum in pace.
      - psalms:
          - 5
        antiphon: Læténtur omnes * qui sperant in te, Dómine; quóniam tu benedixísti justo, scuto bonæ voluntátis tuæ coronásti eum.
      - psalms:
          - 8
        antiphon: Dómine, Dóminus noster, * quam admirábile est nomen tuum in univérsa terra! quia glória et honóre coronásti Sanctum tuum, et constituísti eum super ópera mánuum tuárum.
      - psalms:
          - 10
        antiphon: 'Justus Dóminus * et justítiam diléxit: æquitátem vidit vultus ejus.'
    versicle:
      v: Amávit eum Dóminus, et ornávit eum.
      r: Stolam glóriæ índuit eum.
  nocturn2:
    groups:
      - psalms:
          - 14
        antiphon: Dómine, * iste Sanctus habitábit in tabernáculo tuo, operátus est justítiam, requiéscet in monte sancto tuo.
      - psalms:
          - 20
        antiphon: 'Vitam pétiit * a te, et tribuísti ei, Dómine: glóriam et magnum decórem imposuísti super eum; posuísti in cápite ejus corónam de lápide pretióso.'
      - psalms:
          - 23
        antiphon: 'Hic accípiet * benedictiónem a Dómino, et misericórdiam a Deo salutári suo: quia hæc est generátio quæréntium Dóminum.'
      - psalms:
          - 95
        antiphon: Cognóvit eum Dóminus * in benedictiónibus suis, et invénit grátiam coram óculis Dómini.
      - psalms:
          - 96
        antiphon: In fide * et lenitáte ípsius Sanctum fecit illum Dóminus, et osténdit illi glóriam suam.
      - psalms:
          - 97
        antiphon: 'Justus * germinábit sicut lílium: et florébit in ætérnum ante Dóminum.'
    versicle:
      v: Os justi meditábitur sapiéntiam.
      r: Et lingua ejus loquétur judícium.
  nocturn3:
    antiphon: Sint lumbi vestri * præcíncti et lucérnæ ardéntes in mánibus vestris.
    canticles:
      - refs:
          - book: sir
            chapter: 14
            verses: '22'
          - book: sir
            chapter: 15
            verses: 3-4
          - book: sir
            chapter: 15
            verses: '6'
      - refs:
          - book: jer
            chapter: 17
            verses: 7-8
      - refs:
          - book: sir
            chapter: 31
            verses: 8-11
    versicle:
      v: Lex Dei ejus in corde ipsíus.
      r: Et non supplantabúntur gressus ejus.
