# Verified against the reference engine's own source data files:
# web/www/horas/Latin/Commune/C5.txt ("Commune Confessoris non
# pontificis") and its English counterpart, 2026-08. A Common-collect
# template — `{N}` stands for the saint's own name, substituted by
# getDayCollect (hours/resolve-common.ts) via
# SaintRecord.collectCommon/collectName.
collect/c5:
  text: |
    Orémus.
    Deus, qui nos beáti {N} Confessóris tui ánnua solemnitáte lætíficas: concéde propítius; ut cujus natalítia cólimus, étiam actiónes imitémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Commune Confessoris non Pontificis (C5) carries its own [Ant 2] in Latin/Commune/C5.txt, identical to C4's -- same text already verified elsewhere (magnificat-antiphon-common-of-a-confessor.yml uses C5's Ant 3, this is its Ant 2 sibling), matching the shared lauds-versicle-common-of-a-confessor.yml.
commemoration-antiphon:
  text: |
    Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
  status: verified

# Same Common-of-a-Confessor Matins hymn as
# matins-hymn-common-of-a-confessor-not-bishop.yml ("Iste Conféssor Dómini
# sacrátus") — see that file's header comment for full sourcing detail
# (Monastic-track textual variant, original English translation).
matins-hymn:
  text: |-
    Iste Conféssor Dómini sacrátus,
    Festa plebs cujus celébrat per orbem,
    Hódie lætus méruit secréta
    Scándere cæli.

    Qui pius, prudens, húmilis, pudícus,
    Sóbrius, castus fuit et quiétus,
    Vita dum præsens vegetávit ejus
    Córporis artus.

    Ob sacrum cujus túmulum frequénter
    Membra languéntum modo sanitáti,
    Quólibet morbo fúerint graváta,
    Restituúntur.

    Unde nunc noster chorus in honórem
    Ipsius, hymnum canit hunc libénter:
    Ut piis ejus méritis juvémur
    Omne per ævum.

    Sit salus illi, decus atque virtus,
    Qui supra cæli résidens cacúmen,
    Tótius mundi máchinam gubérnat
    Trinus et unus. Amen.
  status: verified

# The Common-of-a-Confessor's own invitatory antiphon ("Regem Confessórum
# Dóminum" / "The Lord, the King of Confessors"), read from the reference
# engine's own Commune/C4.txt [Invit] line (both languages) — C4a
# (Doctor) and C4b (Pope-Confessor) both inherit this verbatim (`@Commune/
# C4`, no own [Invit]), and C5 (Confessor Not a Bishop) does too, matching
# this Common category's existing hymn precedent (matins-hymn-common-of-a-
# confessor.yml and its -bishop/-not-bishop/-doctor/-pope siblings all
# share one text the same way). Duplicated under all 5 confessor ids
# rather than aliased, per this project's established convention for this
# category. Any winning confessor with no proper invitatory antiphon of
# his own authored falls to this Common tier
# (hours/matins.ts's resolveMatinsInvitatoryText).
matins-invitatory:
  text: Regem Confessórum Dóminum, * Veníte, adorémus.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query -- St. Louis's own day (2026-08-25) and St. Nicholas of
# Tolentino's own day (2026-09-10, `propers: null`) cross-checked
# byte-identical, confirming this is genuine shared Common content, not
# either saint's own proper. Was falling all the way through to the
# plain ferial default before this (see resolve-common.ts's
# resolveOfficeBundle) -- Lauds' chapter/responsory/hymn/versicle bundle
# was previously gated at duplex-majus+ like the psalmody-override table
# it piggybacked eligibility on, wrongly excluding every lower-ranked
# Common-of-a-Confessor-Not-Bishop saint (e.g. St. Louis, Simplex) from
# their own Common's real content.
#
# Duplicated verbatim under this plain `common-of-a-confessor` id
# (2026-08-26): 37 saints in this app's own data use `common-of-a-
# confessor` rather than `common-of-a-confessor-not-bishop` for this
# bundle, even though several of their own file comments cite "vide C5"
# ("Common of a Confessor Not a Bishop") directly -- confirmed via a
# live St. Joseph (Mar 19) query that this plain id's real content is
# byte-identical to C5's. Not relabeled to the `-not-bishop` id across
# those 37 files because `matins-hymn-common-of-a-confessor.yml` and
# `benedictus-antiphon-common-of-a-confessor.yml` already establish this
# same plain id as the real, working one for those saints' Matins/
# Benedictus content -- duplicating here matches that existing
# convention instead of fighting it.
lauds-capitulum:
  text: Beátus vir, qui invéntus est sine mácula, et qui post aurum non ábiit, nec sperávit in pecúnia et thesáuris. Quis est hic, et laudábimus eum? fecit enim mirabília in vita sua.
  citation: Sir 31:8-9
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query -- St. Louis's own day (2026-08-25) and St. Nicholas of
# Tolentino's own day (2026-09-10, `propers: null`) cross-checked
# byte-identical -- see lauds-capitulum-common-of-a-confessor-not-
# bishop.yml's header for the fuller note on this bundle's gap. "Jesu
# coróna célsior" -- self-contained, including its own final doxology
# stanza; distinct from the Common-of-a-Confessor-Bishop's own Lauds hymn
# ("Jesu Redémptor ómnium") -- the reference engine's votive-office
# dropdown separates the two categories as C4 ("Confessoris Pontificis")
# and C5 ("Confessoris non Pontificis"), each with its own full Office
# bundle, not (as CommuneM/C4a.txt's file-inheritance structure might
# suggest at a skim) one category layered as a thin override of the
# other -- C4a.txt is actually "Doctoris Pontificis", unrelated to this
# category despite the superficially similar filename.
lauds-hymn:
  text: |
    Jesu coróna célsior,
    Et véritas sublímior,
    Qui confiténti sérvulo
    Reddis perénne prǽmium:

    Da supplicánti cœ́tui,
    Obténtu hujus óptimi,
    Remissiónem críminum
    Rumpéndo nexum vínculi.

    Anni recúrso témpore,
    Dies illúxit lúmine,
    Quo Sanctus hic de córpore
    Polum migrávit prǽpotens.

    Hic vana terræ gáudia
    Et luculénta prǽdia,
    Pollúta sorde députans,
    Ovans tenet cæléstia.

    Te, Christe Rex piíssime,
    Hic confiténdo júgiter,
    Calcávit hostem fórtiter,
    Supérbum ac satéllitem.

    Virtútum actu et fide,
    Confessiónis órdine,
    Jejúna membra déferens,
    Dapes supérnas óbtinet.

    Proínde te, piíssime,
    Precámur omnes súpplices,
    Ut hujus almi grátia
    Nobis remíttas débita.

    Glória Patri Dómino,
    Glória Unigénito,
    Una cum Sancto Spíritu,
    In sempitérna sǽcula.
    Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
