# Verified against Divinum Officium (Monastic Tridentinum 1617), Matins
# `votive=C6` live query, 2026-08 -- "Vírginis Proles," the classic
# Common-of-Virgins Matins hymn. Same votive-office-view reasoning as
# this session's earlier Lauds/Vespers entries.
matins-hymn:
  text: |-
    Vírginis Proles, Opiféxque Matris,
    Virgo quem gessit, peperítque Virgo:
    Vírginis festum cánimus trophǽum
    Accipe votum.

    Hæc tua Virgo dúplici beáta
    Sorte, dum gestit frágilem domáre
    Córporis sexum, dómuit cruéntum
    Corpóre sæclum.

    Unde nec mortem, nec amíca mortis
    Sæva pœnárum génera pavéscens,
    Sánguine fuso méruit sacrátum
    Scándere cælum.

    Hujus obténtu, Deus alme, nostris
    Parce jam culpis, vítia remíttens,
    Quo tibi puri resonémus almum
    Péctoris hymnum.

    Glória Patri genitǽque Proli,
    Et tibi compar utriúsque semper
    Spíritus alme, Deus unus, omni
    Témpore sæcli. Amen.
  status: verified

