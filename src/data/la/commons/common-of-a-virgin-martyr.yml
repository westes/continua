# Generic Common-of-a-Virgin-Martyr Matins psalmody, live-verified against
# Divinum Officium (Monastic Tridentinum 1617, command=prayMatutinum,
# 2026-10-07 -- St. Justina, Virgin and Martyr, whose own Rule is a plain
# calendar reassignment with no proper Matins content of her own --
# `propers: null` confirmed correct by her own file's header comment -- so
# her output *is* this category's generic scheme, not a saint-specific
# deviation). Rank Duplex, clears the Duplex+ three-nocturn gate.
#
# Reference-engine votive number: C6 ("Unius Virginis Martyris"), per
# `../divinum-officium-reference/web/www/horas/horas.dialog`'s own
# `[votives]`/`[communes]` index -- recorded here as the authoritative
# mapping for the next saint in this category, but note the CGI's
# `votive=` parameter does NOT actually swap Matins nocturn psalmody (it
# does affect the Invitatory antiphon, and Lauds/Vespers) -- confirmed by
# querying `votive=C6`/`votive=C7` back-to-back and getting byte-identical
# ferial Nocturn 1/2 antiphons both times. A real Duplex+ saint's own
# calendar date is the only reliable way to pull this content live; the
# votive number is still useful as a cross-reference into the reference
# engine's own on-disk `CommuneM/C6.txt` et al.
#
# All 6 Nocturn 1/2 antiphons draw on the Song of Songs (bridal imagery);
# Nocturn 3's canticle is Sirach 39 + Isaiah 61-62 (garment-of-salvation/
# bridal-adornment imagery), distinct from Common-of-a-Confessor's Sirach/
# Jeremiah canticle set.
#
# `aliases` also registers `common-of-a-virgin` (2026-08-28), corrected
# from an earlier note here claiming it was a separate, unverified
# scheme under its own votive number (C6a, "Unius Virginis tantum").
# Reading `CommuneM/C6a.txt` directly settles it: the whole file is a
# top-level inherit from `@CommuneM/C6` (this file) with no `[Ant
# Matutinum]`/`[Ant Matutinum 3N]` override of its own anywhere -- C6a
# only overrides Officium(secular)/Oratio/Hymn/Responsory1/Capitulum/
# Lectio-Prima, none of which is Matins nocturn psalmody. Confirmed live
# against St. Scholastica (2029-02-10, `common: common-of-a-virgin`,
# `vide C6a` in her own `[Rank]`): her rendered psalm numbers and all
# three nocturn-closing versicles are byte-identical to this file's own
# (8,18,23,44,45,47 / 84,86,95,96,97,98 / same Nocturn 3 canticle refs
# and versicle) -- only her antiphon *text* differs, and that's because
# she carries real proper antiphons of her own (see
# `saints/st-scholastica.yml`), not because the Common itself differs.
matins-psalmody:
  aliases:
    - common-of-a-virgin
  nocturn1:
    groups:
      - psalms:
          - 8
        antiphon: O quam pulchra * est casta generátio cum claritáte!
      - psalms:
          - 18
        antiphon: Ante torum * hujus Vírginis frequentáte nobis dúlcia cántica drámatis.
      - psalms:
          - 23
        antiphon: Revértere, * revértere, Sunamítis; revértere, ut intueámur te.
      - psalms:
          - 44
        antiphon: Spécie tua * et pulchritúdine tua inténde, próspere procéde, et regna.
      - psalms:
          - 45
        antiphon: 'Adjuvábit eam * Deus vultu suo: Deus in médio ejus, non commovébitur.'
      - psalms:
          - 47
        antiphon: Aquæ multæ * non potuérunt exstínguere caritátem.
    versicle:
      v: Spécie tua et pulchritúdine tua.
      r: Inténde, próspere procéde, et regna.
  nocturn2:
    groups:
      - psalms:
          - 84
        antiphon: Nigra sum, * sed formósa, fíliæ Jerúsalem; ídeo diléxit me Rex, et introdúxit me in cubículum suum.
      - psalms:
          - 86
        antiphon: 'Trahe me post te, * in odórem currémus unguentórum tuórum: óleum effúsum nomen tuum.'
      - psalms:
          - 95
        antiphon: Veni, Sponsa Christi, * áccipe corónam, quam tibi Dóminus præparávit in ætérnum.
      - psalms:
          - 96
        antiphon: Unguéntum effúsum * nomen tuum; ideo adolescéntulæ dilexérunt te nimis.
      - psalms:
          - 97
        antiphon: Pulchra es * et decóra fília Jerúsalem, terríbilis ut castrórum ácies ordináta.
      - psalms:
          - 98
        antiphon: Accínxit * fortitúdine lumbos suos, et roborávit bráchium suum; ideóque lucérna ejus non exstinguétur in sempitérnum.
    versicle:
      v: Adjuvábit eam Deus vultu suo.
      r: Deus in médio ejus, non commovébitur.
  nocturn3:
    antiphon: 'Média nocte * clamor factus est: Ecce sponsus venit: exíte óbviam ei.'
    canticles:
      - refs:
          - book: sir
            chapter: 39
            verses: 17-21
      - refs:
          - book: isa
            chapter: 61
            verses: 10-11
          - book: isa
            chapter: 62
            verses: 1-3
      - refs:
          - book: isa
            chapter: 62
            verses: 4-7
    versicle:
      v: Elégit eam Deus, et præelégit eam.
      r: In tabernáculo suo habitáre facit eam.
