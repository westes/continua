# several-martyrs.yml's header for why the votive-office view was used.
lauds-responsory:
  text: |
    R.br. Lætámini in Dómino, * Et exsultáte justi.
    R. Lætámini in Dómino, * Et exsultáte justi.
    V. Et gloriámini omnes recti corde.
    R. Et exsultáte justi.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Lætámini in Dómino, * Et exsultáte justi.
  status: verified

# Commune C3b (Summorum Pontificum Martyrum) inherits C3 wholesale for this
