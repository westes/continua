# Verified against the reference engine's own source data files:
# web/www/horas/Latin/Commune/C3b.txt ("Commune plurium Summorum
# Pontificum Martyrum") and its English counterpart, 2026-08. A
# Common-collect template for TWO saints named together — `{N}` appears
# twice, substituted with each of their own names by getDayCollect
# (hours/resolve-common.ts). Source's own text has a stray leading "v. "
# before the prayer (a formatting artifact, not real content) — dropped
# here, same as this project's usual "Orémus."-omission convention.
collect/c3b:
  text: |
    Orémus.
    Gregem tuum, Pastor ætérne, placátus inténde: et per beátos {N} et {N} Mártyres tuos atque Summos Pontífices perpétua protectióne custódi; quos totíus Ecclésiæ præstitísti esse pastóres.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Commune C3b (Summorum Pontificum Martyrum) inherits C3 wholesale for this
# part (`@Commune/C3`); same text as common-of-several-martyrs-commemoration-antiphon.yml.
# Commune Plurimorum Martyrum (C3), [Ant 2] -- read directly from the reference engine (Latin/Commune/C3.txt, English/Commune/C3.txt), pairing with the already-verified lauds-versicle-common-of-pope-martyrs.yml's Versum 2.
commemoration-antiphon:
  text: |
    Vestri capílli cápitis * omnes numeráti sunt: nolíte timére: multis passéribus melióres estis vos.
  status: verified

# Commune C3b (Summorum Pontificum Martyrum) inherits C3 wholesale for this
# part (`@Commune/C3`); same text as matins-hymn-common-of-several-martyrs.yml.
# Verified against Divinum Officium (Monastic Tridentinum 1617), Matins
# `votive=C3` live query, 2026-08 -- "Ætérna Christi múnera," the
# classic Common-of-Several-Martyrs Matins hymn. Same votive-office-view
# reasoning as this session's earlier Lauds/Vespers entries (this
# Common's real saints are scattered with no cheap guarantee of an
# un-outranked day).
matins-hymn:
  text: |-
    Ætérna Christi múnera,
    Et Mártyrum victórias,
    Laudes canéntes débitas,
    Lætis canámus méntibus.

    Terróre victo sǽculi,
    Pœnísque spretis córporis,
    Mortis sacræ compéndio
    Vitam beátam póssident.

    Tradúntur igni Mártyres,
    Et bestiárum déntibus;
    Armáta sævit úngulis
    Tortóris insáni manus.

    Nudáta pendent víscera,
    Sanguis sacrátus fúnditur;
    Sed pérmanent immóbiles,
    Vitæ perénnis grátia.

    Te nunc, Redémptor, quǽsumus,
    Ut mártyrum consórtio
    Jungas precántes sérvulos
    In sempitérna sǽcula. Amen.
  status: verified

# Commune C3b (Summorum Pontificum Martyrum) inherits C3 wholesale for this
# part (`@Commune/C3`); same text as matins-invitatory-common-of-several-martyrs.yml.
# Same Common-of-a-Martyr invitatory antiphon as
# matins-invitatory-common-of-a-martyr.yml — Commune/C3.txt's own
# [Invit] is a literal `@Commune/C2` redirect (no distinct text of its
# own for Several Martyrs).
matins-invitatory:
  text: Regem Mártyrum Dóminum, * Veníte, adorémus.
  status: verified

# Commune C3b (Summorum Pontificum Martyrum) inherits C3 wholesale for this
# part (`@Commune/C3`); same text as lauds-capitulum-common-of-several-martyrs.yml.
# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C3` live query, 2026-08 -- same votive-office-view reasoning as
# vespers-hymn-common-of-a-martyr-bishop.yml's header (this Common's real
# saints are scattered across the calendar with no cheap guarantee of an
# un-outranked day, so the votive view gets the category's true content
# directly instead). Byte-identical to `votive=C3a`/`C3b`, confirming the
# Missal-collect split TODO.md records (plain groups of martyrs vs.
# Pope-martyr groups getting a distinct, more triumphal collect) doesn't
# carry through to this Office bundle -- both variants share one real
# chapter/responsory/hymn/versicle here. Same chapter reused for Vespers
# -- no separate vespers-capitulum-<id> file authored, per vespers.ts's
# lookupPart (Vespers chapter, Lauds sibling) fallback.
lauds-capitulum:
  text: 'Justórum ánimæ in manu Dei sunt, et non tanget illos torméntum mortis. Visi sunt óculis insipiéntium mori: illi autem sunt in pace.'
  citation: Sap 3:1-3
  status: verified

# Commune C3b (Summorum Pontificum Martyrum) inherits C3 wholesale for this
# part (`@Commune/C3`); same text as lauds-hymn-common-of-several-martyrs.yml.
# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C3` live query, 2026-08 -- see lauds-capitulum-common-of-
# several-martyrs.yml's header for why the votive-office view was used.
# "Rex glorióse Mártyrum" -- the classic Common-of-Several-Martyrs Lauds
# hymn, a single genuine recension found in the reference engine.
lauds-hymn:
  text: |-
    Rex glorióse Mártyrum,
    Coróna confiténtium,
    Qui respuéntes térrea
    Perdúcis ad cæléstia:

    Aurem benígnam prótinus
    Appóne nostris vócibus:
    Trophǽa sacra pángimus:
    Ignósce quod delíquimus.

    Tu vincis in Martýribus,
    Parcéndo Confessóribus:
    Tu vince nostra crímina,
    Donándo indulgéntiam.

    * Deo Patri sit glória,
    Ejúsque soli Fílio,
    Cum Spíritu Paráclito,
    Et nunc et in perpétuum. Amen.
  status: verified

# Commune C3b (Summorum Pontificum Martyrum) inherits C3 wholesale for this
