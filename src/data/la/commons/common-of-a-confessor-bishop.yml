# Verified against the reference engine's own source data files:
# web/www/horas/Latin/Commune/C4.txt ("Commune unius Confessoris
# Pontificis") and its English counterpart, 2026-08. A Common-collect
# template — `{N}` stands for the saint's own name, substituted by
# getDayCollect (hours/resolve-common.ts) via
# SaintRecord.collectCommon/collectName. Source's own text has a stray
# leading "v. " before the prayer (a formatting artifact, not real
# content) — dropped here, same as this project's usual
# "Orémus."-omission convention.
collect/c4:
  text: |
    Orémus.
    Da, quǽsumus, omnípotens Deus: ut beáti {N} Confessóris tui atque Pontíficis veneránda solémnitas, et devotiónem nobis áugeat et salútem.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Commune Confessoris Pontificis (C4), [Ant 2] -- identical text already verified elsewhere in this Common (benedictus-antiphon-common-of-a-confessor-bishop.yml), confirmed against Latin/Commune/C4.txt, English/Commune/C4.txt.
commemoration-antiphon:
  text: |
    Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
  status: verified

# Same Common-of-a-Confessor Matins hymn as
# matins-hymn-common-of-a-confessor-not-bishop.yml ("Iste Conféssor Dómini
# sacrátus") — see that file's header comment for full sourcing detail
# (Monastic-track textual variant, original English translation).
matins-hymn:
  text: |-
    Iste Conféssor Dómini sacrátus,
    Festa plebs cujus celébrat per orbem,
    Hódie lætus méruit secréta
    Scándere cæli.

    Qui pius, prudens, húmilis, pudícus,
    Sóbrius, castus fuit et quiétus,
    Vita dum præsens vegetávit ejus
    Córporis artus.

    Ob sacrum cujus túmulum frequénter
    Membra languéntum modo sanitáti,
    Quólibet morbo fúerint graváta,
    Restituúntur.

    Unde nunc noster chorus in honórem
    Ipsius, hymnum canit hunc libénter:
    Ut piis ejus méritis juvémur
    Omne per ævum.

    Sit salus illi, decus atque virtus,
    Qui supra cæli résidens cacúmen,
    Tótius mundi máchinam gubérnat
    Trinus et unus. Amen.
  status: verified

# Same Common-of-a-Confessor invitatory antiphon as
# matins-invitatory-common-of-a-confessor.yml — see that file's header
# for full sourcing detail (Commune/C4.txt's own [Invit], inherited
# verbatim by C4a/C4b/C5 alike).
matins-invitatory:
  text: Regem Confessórum Dóminum, * Veníte, adorémus.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C4` live query, 2026-08 -- same votive-office-view reasoning as
# vespers-hymn-common-of-a-martyr-bishop.yml's header. Same chapter reused
# for Vespers -- no separate vespers-capitulum-<id> file authored, per
# vespers.ts's lookupPart (Vespers chapter, Lauds sibling) fallback.
lauds-capitulum:
  text: 'Ecce sacérdos magnus, qui in diébus suis plácuit Deo, et invéntus est justus: et in témpore iracúndiæ factus est reconciliátio.'
  citation: Sir 44:16-17
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C4` live query, 2026-08 -- see lauds-capitulum-common-of-a-
# confessor-bishop.yml's header for why the votive-office view was used.
# "Jesu Redémptor ómnium" -- a genuinely distinct Lauds hymn from Common-
# of-a-Confessor-Not-Bishop's own "Jesu coróna célsior" (TODO.md's own
# earlier finding, from the votive-office naming: C4 = "Confessoris
# Pontificis," C5 = "Confessoris non Pontificis," two real separate
# categories, not a naming coincidence).
lauds-hymn:
  text: |-
    Jesu Redémptor ómnium,
    Perpes coróna Prǽsulum,
    In hac die cleméntius
    Nostris favéto précibus.

    Tui sacri qua nóminis
    Conféssor almus cláruit:
    Hujus celébrat ánnua
    Devóta plebs solémnia.

    Qui rite mundi gáudia
    Hujus cadúca réspuens,
    Cum Ángelis cæléstibus
    Lætus potítur prǽmiis.

    Hujus benígnus ánnue
    Nobis sequi vestígia:
    Hujus precátu, sérvulis
    Dimítte noxam críminis.

    * Sit Christe, Rex piíssime,
    Tibi, Patríque glória,
    Cum Spíritu Paráclito,
    Et nunc, et in perpétuum. Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C4` live query, 2026-08 -- see lauds-capitulum-common-of-a-
# confessor-bishop.yml's header for why the votive-office view was used.
lauds-responsory:
  text: |
    R.br. Amávit eum Dóminus, * Et ornávit eum.
    R. Amávit eum Dóminus, * Et ornávit eum.
    V. Stolam glóriæ índuit eum.
    R. Et ornávit eum.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Amávit eum Dóminus, * Et ornávit eum.
  status: verified

