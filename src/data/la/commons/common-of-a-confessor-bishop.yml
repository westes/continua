# Generic Common-of-a-Confessor-Bishop Matins psalmody, live-verified
# against Divinum Officium (Monastic Tridentinum 1617, command=
# prayMatutinum, 2035-06-14 -- St. Basil the Great, whose own [Rule]
# says "vide C4a" (Doctor) but whose live-rendered Matins is byte-
# identical to the plain Common template here, per this app's own
# st-basil-the-great.yml note -- so his output *is* this category's
# generic scheme, not a saint-specific deviation).
#
# Same psalm numbers and antiphon text in all three nocturns as
# common-of-a-confessor.yml (Common of a Confessor Not a Bishop) --
# checked side by side, word for word identical. The only real
# difference is the three nocturn-closing versicles, which swap the
# plain-confessor imagery for priestly/episcopal imagery (e.g. "Tu es
# sacérdos in ætérnum * secúndum órdinem Melchísedech" in Nocturn 3).
# Kept as its own full file rather than an alias (unlike
# Common-of-a-Martyr-Bishop -> Common-of-a-Martyr, a genuine total
# redirect with zero differences) because this scheme's own mechanism
# doesn't support "same groups, different versicles" as a partial
# override -- see matins-psalmody-overrides.ts's own doc comment on
# category files being standalone, not diffed/merged.
#
# `aliases` also registers `common-of-a-confessor-doctor` and
# `common-of-a-confessor-pope` here (2026-08-28), both genuine full
# redirects (unlike the Confessor/Confessor-Bishop split above, these
# really are zero-difference, versicles included):
#
# - Confessor-Doctor (`C4a`): `CommuneM/C4a.txt` whole-file inherits
#   `@CommuneM/C4` (this file) with no `[AntMatutinumM]`/`[Ant
#   Matutinum]`/versicle override anywhere -- its own `[Ant 1]`/`[Ant 3]`
#   blocks are Lauds antiphon tags (same bare naming as `Commune/C4.txt`'s
#   own `[Ant 3]`/`[Ant 3 summi Pontificis]` pair, confirmed Lauds-only by
#   cross-reference), not Matins Nocturn 3. Live-verified against St.
#   Ambrose (2026-12-07, `vide C4a`, real Duplex day): every antiphon,
#   psalm number, AND all three versicles (`Amávit eum Dóminus...` /
#   `Elégit eum Dóminus sacerdótem sibi...` / `Tu es sacérdos in
#   ætérnum...`) reproduce this file exactly. Independently corroborated
#   by St. Basil the Great's own case above (also `vide C4a`, also
#   byte-identical) -- two saints, same finding.
# - Confessor-Pope (`C4b`): `CommuneM/C4b.txt` whole-file inherits
#   `@CommuneM/C4` and only overrides Oratio variants, Lectio9-12
#   (redirected to `@SanctiM/03-12`, St. Gregory the Great's own
#   lessons -- irrelevant to this psalmody-only module), and a Lauds
#   `[Ant 3]` cross-reference into secular `Commune/C4:Ant 3 summi
#   Pontificis` -- again no Matins-nocturn-psalmody override at all.
#   Not live-verifiable against a real Monastic-calendar saint: all
#   three vu saints carrying this Common (`st-leo-ii`, `st-pius-v`,
#   `st-pius-x`) turn out to have no `SanctiM/*.txt` file at all -- none
#   of them are observed under the Monastic-1617 track vu's structure
#   otherwise follows, only under the secular/Divino-Afflatu tracks vu's
#   calendar also draws from (per this repo's own design notes). Aliased on
#   the strength of the source redirect chain alone, consistent with the
#   convention already established in all three of those saints' own
#   files, which already fall back to this same Common for their
#   Benedictus/minor-hours content for the identical reason (no
#   Pope-specific content exists to fall back to instead).
matins-psalmody:
  aliases:
    - common-of-a-confessor-doctor
    - common-of-a-confessor-pope
  nocturn1:
    groups:
      - psalms:
          - 1
        antiphon: 'Beátus vir, * qui in lege Dómini meditátur: volúntas ejus pérmanet die ac nocte, et ómnia quæcúmque fáciet, semper prosperabúntur.'
      - psalms:
          - 2
        antiphon: Beátus iste Sanctus, * qui confísus est in Dómino, prædicávit præcéptum Dómini, constitútus est in monte sancto ejus.
      - psalms:
          - 4
        antiphon: Invocántem * exaudívit Dóminus Sanctum suum; Dóminus exaudívit eum, et constítuit eum in pace.
      - psalms:
          - 5
        antiphon: Læténtur omnes * qui sperant in te, Dómine; quóniam tu benedixísti justo, scuto bonæ voluntátis tuæ coronásti eum.
      - psalms:
          - 8
        antiphon: Dómine, Dóminus noster, * quam admirábile est nomen tuum in univérsa terra! quia glória et honóre coronásti Sanctum tuum, et constituísti eum super ópera mánuum tuárum.
      - psalms:
          - 10
        antiphon: 'Justus Dóminus * et justítiam diléxit: æquitátem vidit vultus ejus.'
    versicle:
      v: Amávit eum Dóminus, et ornávit eum.
      r: Stolam glóriæ índuit eum.
  nocturn2:
    groups:
      - psalms:
          - 14
        antiphon: Dómine, * iste Sanctus habitábit in tabernáculo tuo, operátus est justítiam, requiéscet in monte sancto tuo.
      - psalms:
          - 20
        antiphon: 'Vitam pétiit * a te, et tribuísti ei, Dómine: glóriam et magnum decórem imposuísti super eum; posuísti in cápite ejus corónam de lápide pretióso.'
      - psalms:
          - 23
        antiphon: 'Hic accípiet * benedictiónem a Dómino, et misericórdiam a Deo salutári suo: quia hæc est generátio quæréntium Dóminum.'
      - psalms:
          - 95
        antiphon: Cognóvit eum Dóminus * in benedictiónibus suis, et invénit grátiam coram óculis Dómini.
      - psalms:
          - 96
        antiphon: In fide * et lenitáte ípsius Sanctum fecit illum Dóminus, et osténdit illi glóriam suam.
      - psalms:
          - 97
        antiphon: 'Justus * germinábit sicut lílium: et florébit in ætérnum ante Dóminum.'
    versicle:
      v: Elégit eum Dóminus sacerdótem sibi.
      r: Ad sacrificándum ei hóstiam laudis.
  nocturn3:
    antiphon: Sint lumbi vestri * præcíncti et lucérnæ ardéntes in mánibus vestris.
    canticles:
      - refs:
          - book: sir
            chapter: 14
            verses: '22'
          - book: sir
            chapter: 15
            verses: 3-4
          - book: sir
            chapter: 15
            verses: '6'
      - refs:
          - book: jer
            chapter: 17
            verses: 7-8
      - refs:
          - book: sir
            chapter: 31
            verses: 8-11
    versicle:
      v: Tu es sacérdos in ætérnum.
      r: Secúndum órdinem Melchísedech.

# Generic Common-of-a-Confessor-Bishop Lauds psalmody, live-verified
# against Divinum Officium (Monastic Tridentinum 1617, command=prayLaudes,
# votive=C4). Psalm numbers (92, 99, 62, Canticum Trium Puerorum) are the
# same fixed Duplex-majus+ set used by every Common (see
# hours/lauds-psalmody-overrides.ts's own doc comment) -- only these
# antiphons are specific to this Common.
#
# `aliases` registers `common-of-a-confessor-doctor` and
# `common-of-a-confessor-pope` under this same scheme -- votive=C4a/C4b
# at Lauds are both byte-identical to C4 for these same slots (the only
# difference shows up in the Magnificat antiphon and collect, handled
# separately, not this psalmody table; confirmed for C4b 2026-09-03,
# live query against the reference engine, closing a real gap -- St.
# Pius X/St. Leo II/St. Pius V were falling through to the plain
# ferial default).
lauds-psalmody:
  aliases:
    - common-of-a-confessor-doctor
    - common-of-a-confessor-pope
  groups:
    - psalms:
        - 92
      antiphon: Ecce sacérdos magnus, * qui in diébus suis plácuit Deo, et invéntus est iustus.
    - psalms:
        - 99
      antiphon: Non est invéntus * símilis illi, qui conserváret legem Excélsi.
