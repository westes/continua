# Verified against the reference engine's own source data files:
# web/www/horas/Latin/Commune/C6a.txt ("Commune Virginum tantum"), 2026-08
# -- its own [Oratio] is `@Commune/C7a:: s/N\./N. Vírginis tuæ/`, a
# reference to C7a's own collect with an edit applied (inserting
# "Vírginis tuæ" after the name) -- resolved here by hand rather than
# building general sed-directive support for one saint (st-praxedes).
# English adapted the same way from C7a's own translation; not directly
# sourced, so status: draft.
collect/c6a:
  text: |
    Orémus.
    Exáudi nos, Deus, salutáris noster: ut sicut de beátæ {N} Vírginis tuæ festivitáte gaudémus; ita piæ devotiónis erudiámur afféctu.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: draft

# Commune Virginum tantum (C6a) is a bare alias of C6 (no own [Ant 2]/[Versum 2] override in Latin/Commune/C6a.txt) -- same text as the Virgin Martyr Common, matching the shared lauds-versicle-common-of-a-virgin.yml.
commemoration-antiphon:
  text: |
    Símile est regnum cælórum * hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Matins
# `votive=C6` live query, 2026-08 -- "Vírginis Proles," the classic
# Common-of-Virgins Matins hymn. Same votive-office-view reasoning as
# this session's earlier Lauds/Vespers entries.
matins-hymn:
  text: |-
    Vírginis Proles, Opiféxque Matris,
    Virgo quem gessit, peperítque Virgo:
    Vírginis festum cánimus trophǽum
    Accipe votum.

    Hæc tua Virgo dúplici beáta
    Sorte, dum gestit frágilem domáre
    Córporis sexum, dómuit cruéntum
    Corpóre sæclum.

    Unde nec mortem, nec amíca mortis
    Sæva pœnárum génera pavéscens,
    Sánguine fuso méruit sacrátum
    Scándere cælum.

    Hujus obténtu, Deus alme, nostris
    Parce jam culpis, vítia remíttens,
    Quo tibi puri resonémus almum
    Péctoris hymnum.

    Glória Patri genitǽque Proli,
    Et tibi compar utriúsque semper
    Spíritus alme, Deus unus, omni
    Témpore sæcli. Amen.
  status: verified

# The Common-of-a-Virgin's own invitatory antiphon ("Regem Vírginum
# Dóminum" / "The Lord, the King of Virgins"), read from the reference
# engine's own Commune/C6.txt [Invit] line (both languages) — C6a
# (Virgin-Martyr) inherits this verbatim (`@Commune/C6`, no own [Invit]),
# matching this Common's own Matins hymn precedent
# (matins-hymn-common-of-a-virgin.yml / matins-hymn-common-of-a-virgin-
# martyr.yml already share one text the same way). Duplicated under both
# ids rather than aliased, per this project's established convention.
# Any winning virgin with no proper invitatory antiphon of her own
# authored falls to this Common tier
# (hours/matins.ts's resolveMatinsInvitatoryText).
matins-invitatory:
  text: Regem Vírginum Dóminum, * Veníte, adorémus.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C6` live query, 2026-08 -- same votive-office-view reasoning as
# vespers-hymn-common-of-a-martyr-bishop.yml's header (real saints in
# this category have their evening/Lauds contaminated by neighboring
# days' anticipation or their own fame — Ss. Agatha/Agnes/Cecilia/Lucy
# all have real proper content of their own — so the votive view gets a
# clean, unambiguous read of the category's real content). Same chapter
# reused for Vespers -- no separate vespers-capitulum-<id> file
# authored, per vespers.ts's lookupPart (Vespers chapter, Lauds sibling) fallback.
#
# Duplicated verbatim under this plain `common-of-a-virgin` id (2026-08-26):
# live-verified (St. Praxedes, Jul 21) that this content is real and
# byte-identical to Common-of-a-Virgin-Martyr's own -- matches TODO.md's
# earlier established finding for the minor-hour Common (the already-
# authored `benedictus-antiphon-common-of-a-virgin.yml` reflects the same
# fact). Duplicated rather than an alias redirect for the same no-alias-
# mechanism reason recorded in lauds-capitulum-common-of-a-confessor.yml.
lauds-capitulum:
  text: 'Fratres: Qui gloriátur, in Dómino gloriétur. Non enim qui seípsum comméndat, ille probátus est; sed quem Deus comméndat.'
  citation: 2 Cor 10:17-18
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C6` live query, 2026-08 -- see lauds-capitulum-common-of-a-
# virgin-martyr.yml's header for why the votive-office view was used.
# "Jesu, coróna Vírginum" -- the classic Common-of-Virgins Lauds/Vespers
# hymn (same text both hours here), a single genuine recension found in
# the reference engine.
lauds-hymn:
  text: |-
    Jesu, coróna Vírginum,
    Quem Mater illa cóncipit
    Quæ sola Virgo párturit,
    Hæc vota clemens áccipe:

    Qui pascis inter lília
    Septus choréis Vírginum,
    Sponsus decórus glória
    Sponsísque reddens prǽmia.

    Quocúmque pergis, Vírgines
    Sequúntur, atque láudibus
    Post te canéntes cúrsitant,
    Hymnósque dulces pérsonant;

    Te deprecámur lárgius,
    Nostris adáuge sénsibus
    Nescíre prorsus ómnia
    Corruptiónis vúlnera.

    * Laus, honor, virtus, glória
    Deo Patri et Fílio,
    Sancto simul Paráclito,
    In sæculórum sǽcula. Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C6` live query, 2026-08 -- see lauds-capitulum-common-of-a-
# virgin-martyr.yml's header for why the votive-office view was used.
lauds-responsory:
  text: |
    R.br. Spécie tua * Et pulchritúdine tua.
    R. Spécie tua * Et pulchritúdine tua.
    V. Inténde, próspere procéde, et regna.
    R. Et pulchritúdine tua.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Spécie tua * Et pulchritúdine tua.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
