# Generic Common-of-Several-Martyrs Matins psalmody, live-verified
# against Divinum Officium (Monastic Tridentinum 1617,
# command=prayMatutinum, 2029-01-20 -- Ss. Fabian and Sebastian,
# Martyrs, whose own rule is entirely Common, no proper antiphon of
# their own -- so their own output *is* this category's generic
# scheme). Confirmed genuinely distinct from `common-of-a-martyr.yml`'s
# scheme (a single martyr), not a duplicate: different psalm numbers in
# both nocturns (Nocturn 1: 1,2,10,14,15,23 here vs 1,2,4,5,8,10 there;
# Nocturn 2: 32,33,45,60,63,78 here vs 14,20,23,63,64,91 there) and a
# different Nocturn 3 canticle source (Wisdom 3/10 here vs Sirach 14/15
# + Jeremiah 17 + Sirach 31 there).
#
# One wrinkle: the reference engine's own English track has no
# translation for two antiphons here -- Nocturn 1's Psalm 10 antiphon
# ("Oculi Dómini...") and Nocturn 3's ("Beáti, qui persecutiónem...",
# the standard "Blessed are they that suffer persecution" Beatitude
# text, Matt 5:10) -- its rendered "English" column just repeats the
# Latin for both. The English given below for those two is an original
# translation (matching this project's other Douay-adjacent psalm-
# antiphon phrasing, e.g. Ps 10:5's own "His eyes look on the poor
# man"), not reused reference-engine text.
#
# 40 saints/groups on the calendar carry this `common` id -- the
# largest single Common category by population -- so this file unlocks
# real (non-ferial-fallback) Matins psalmody for all of them at once,
# even before any of them has its own proper `saints/*.yml` entry.
matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 1
        antiphon: Secus decúrsus aquárum * plantávit víneam justórum, et in lege Dómini fuit volúntas eórum.
      - psalms:
          - 2
        antiphon: 'Tamquam aurum * in fornáce probávit eléctos Dóminus: et quasi holocáusta accépit eos in ætérnum.'
      - psalms:
          - 10
        antiphon: Oculi Dómini * respexérunt in páuperes, † cum peccatóres arcus suos in eos inténderent.
      - psalms:
          - 14
        antiphon: Dabo Sanctis meis * locum nominátum in regno Patris mei, dicit Dóminus.
      - psalms:
          - 15
        antiphon: Sanctis, qui in terra sunt ejus, * mirificávit omnes voluntátes meas inter illos.
      - psalms:
          - 23
        antiphon: Sancti qui sperant in Dómino, * habébunt fortitúdinem, assúment pennas ut áquilæ, volábunt, et non defícient.
    versicle:
      v: Lætámini in Dómino, et exsultáte justi.
      r: Et gloriámini omnes recti corde.
  nocturn2:
    groups:
      - psalms:
          - 32
        antiphon: Justi autem * in perpétuum vivent, et apud Dóminum est merces eórum.
      - psalms:
          - 33
        antiphon: 'Tradidérunt * córpora sua in mortem, ne servírent idólis: ídeo coronáti póssident palmam.'
      - psalms:
          - 45
        antiphon: 'Ecce merces * Sanctórum copiósa est apud Deum: ipsi vero mórtui sunt pro Christo, et vivent in ætérnum.'
      - psalms:
          - 60
        antiphon: Istórum est enim * regnum cælórum, qui contempsérunt vitam mundi, et pervenérunt ad premia regni, et lavérunt stolas suas in sanguine Agni.
      - psalms:
          - 63
        antiphon: Sanguis sanctórum mártyrum * pro Christo effúsus est in terra; ideo adépti sunt munera sempitérna.
      - psalms:
          - 78
        antiphon: Víndica Domine * sánguinem Sanctórum tuórum, qui effúsus est super terram.
    versicle:
      v: Exsúltent justi in conspéctu Dei.
      r: Et delecténtur in lætítia.
  nocturn3:
    antiphon: Beáti, * qui persecutiónem patiúntur propter justítiam, quóniam ipsórum est regnum cælórum.
    canticles:
      - refs:
          - book: sap
            chapter: 3
            verses: 1-6
      - refs:
          - book: sap
            chapter: 3
            verses: 7-9
      - refs:
          - book: sap
            chapter: 10
            verses: 17-21
    versicle:
      v: Justi autem in perpétuum vivent.
      r: Et apud Dóminum est merces eórum.
  aliases:
    - common-of-pope-martyrs

# Generic Common-of-Several-Martyrs Lauds psalmody, live-verified against
# Divinum Officium (Monastic Tridentinum 1617, command=prayLaudes,
# votive=C3). Psalm numbers (92, 99, 62, Canticum Trium Puerorum) are the
# same fixed Duplex-majus+ set used by every Common (see
# hours/lauds-psalmody-overrides.ts's own doc comment) -- only these
# antiphons (all plural "Sancti"/"Martyres") are specific to this Common.
lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: Omnes Sancti, * quanta passi sunt torménta, ut secúri pervenírent ad palmam martýrii.
    - psalms:
        - 99
      antiphon: Cum palma * ad regna pervenérunt Sancti, corónas decóris meruérunt de manu Dei.
    - psalms:
        - 62
      antiphon: 'Córpora Sanctórum * in pace sepúlta sunt: et vivent nómina eórum in ætérnum.'
  canticle:
    id: canticum-trium-puerorum
    antiphon: Mártyres Dómini * Dóminum benedícite in ætérnum.
  laudate:
    antiphon: Mártyrum chorus * laudáte Dóminum de cælis, allelúia.
  aliases:
    - common-of-pope-martyrs

# Generic Common-of-Several-Martyrs Vespers psalmody, live-verified
# against Divinum Officium (Monastic Tridentinum 1617, command=
# prayVespera, votive=C3, 2026-08-28). Same four psalm numbers as
# Common-of-a-Martyr (109, 111, 112, 115) -- only the antiphons (all
# plural "Sancti") differ, so this is deliberately its own category file
# rather than an alias of common-of-a-martyr.
vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: Isti sunt Sancti, * qui pro testaménto Dei sua córpora tradidérunt, et in sánguine Agni lavérunt stolas suas.
    - psalms:
        - 111
      antiphon: Sancti per fidem * vicérunt regna, operáti sunt iustítiam, adépti sunt repromissiónes.
    - psalms:
        - 112
      antiphon: 'Sanctórum velut áquilæ * iuvéntus renovábitur: florébunt sicut lílium in civitáte Dómini.'
    - psalms:
        - 115
      antiphon: In cæléstibus regnis * Sanctórum habitátio est, et in ætérnum réquies eórum.
  aliases:
    - common-of-pope-martyrs

