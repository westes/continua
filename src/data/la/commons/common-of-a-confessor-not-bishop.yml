  aliases:
    - common-of-a-confessor
    - common-of-an-abbot
    - common-of-several-confessors
  groups:
    - psalms:
        - 92
      antiphon: Dómine, quinque talénta * tradidísti mihi, ecce ália quinque superlucrátus sum.
    - psalms:
        - 99
      antiphon: Euge, serve bone * in módico fidélis, intra in gáudium Dómini tui.
    - psalms:
        - 62
      antiphon: Fidélis servus * et prudens, quem constítuit Dóminus super famíliam suam.
  canticle:
    id: canticum-trium-puerorum
    antiphon: Beátus ille servus, * quem, cum vénerit Dóminus eius et pulsáverit iánuam, invénerit vigilántem.
  laudate:
    antiphon: Serve bone * et fidélis, intra in gáudium Dómini tui.

# Generic Common-of-a-Confessor-Not-Bishop Vespers psalmody, live-
# verified against Divinum Officium (Monastic Tridentinum 1617, command=
# prayVespera, votive=C5, 2026-08-28).
#
# `aliases` registers `common-of-a-confessor`, `common-of-an-abbot`, and
# `common-of-several-confessors` under this same scheme -- all four ids'
# existing vespers-hymn-*.yml office-bundle files already cite the
# identical `votive=C5` source (see resolve-common.ts's resolveOfficeBundle
# header notes), so this is one scheme shared by four ids, not four.
vespers-psalmody:
  aliases:
    - common-of-a-confessor
    - common-of-an-abbot
    - common-of-several-confessors
  groups:
    - psalms:
        - 109
      antiphon: Dómine, quinque talénta * tradidísti mihi, ecce ália quinque superlucrátus sum.
    - psalms:
        - 110
      antiphon: Euge, serve bone * in módico fidélis, intra in gáudium Dómini tui.
    - psalms:
        - 111
      antiphon: Fidélis servus * et prudens, quem constítuit Dóminus super famíliam suam.
    - psalms:
        - 112
      antiphon: Serve bone * et fidélis, intra in gáudium Dómini tui.
