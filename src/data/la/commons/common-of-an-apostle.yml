# Commune Apostolorum (C1), [Ant 2] -- read directly from the reference engine (Latin/Commune/C1.txt, English/Commune/C1.txt), pairing with the already-verified lauds-versicle-common-of-an-apostle.yml's Versum 2.
commemoration-antiphon:
  text: |
    Vos qui reliquístis * ómnia, et secúti estis me, céntuplum accipiétis, et vitam ætérnam possidébitis.
  status: verified

# The Common-of-an-Apostle's own Matins hymn ("Ætérna Christi múnera" /
# "Th' eternal gifts of Christ the King"), read from the reference engine's
# own Commune/C1.txt [Hymnus Matutinum] block (both Latin and English
# present and complete there). Any winning apostle with no proper Matins
# hymn of his own authored falls to this Common tier (hours/matins.ts's
# resolveMatinsHymn) — e.g. St. Bartholomew (2026-08-24, live-verified):
# Monastic 1617 gives him no [Hymnus Matutinum] override of his own, so
# this Common's own text genuinely renders.
matins-hymn:
  text: |-
    Ætérna Christi múnera,
    Apostolórum glóriam,
    Palmas et hymnos débitos
    Lætis canámus méntibus.

    Ecclesiárum Príncipes,
    Belli triumpháles duces,
    Cæléstis aulæ mílites,
    Et vera mundi lúmina.

    Devóta Sanctórum fides,
    Invícta spes credéntium,
    Perfécta Christi cáritas
    Mundi tyránnum cónterit.

    In his Patérna glória,
    In his triúmphat Fílius,
    In his volúntas Spíritus,
    Cælum replétur gáudio.

    * Patri, simúlque Fílio,
    Tibíque Sancte Spíritus,
    Sicut fuit, sit júgiter
    Sæclum per omne glória. Amen.
  status: verified

# The Common-of-an-Apostle's own invitatory antiphon ("Regem Apostolórum
# Dóminum" / "The Lord, the King of Apostles"), read from the reference
# engine's own Commune/C1.txt [Invit] line (both languages). Any winning
# apostle with no proper invitatory antiphon of his own authored falls to
# this Common tier (hours/matins.ts's resolveMatinsInvitatoryText) — e.g.
# St. Bartholomew (2026-08-24, live-verified).
matins-invitatory:
  text: Regem Apostolórum Dóminum, * Veníte, adorémus.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C1` live query, 2026-08 -- same votive-office-view reasoning as
# vespers-hymn-common-of-a-martyr-bishop.yml's header (real saints in
# this small category -- Commemoration of St. Paul, Beheading of St.
# John the Baptist, Dedication of the Basilicas of Ss. Peter and Paul --
# have their own distinct standing and no clean un-outranked day to
# sample from). Same chapter reused for Vespers -- no separate vespers-
# capitulum-<id> file authored, per vespers.ts's lookupPart (Vespers chapter, Lauds sibling)
# fallback.
lauds-capitulum:
  text: 'Fratres: Jam non estis hóspites et ádvenæ: sed estis cives Sanctórum et doméstici Dei: superædificáti super fundaméntum Apostolórum, et Prophetárum, ipso summo angulári lápide Christo Jesu.'
  citation: Eph 2:19-20
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C1` live query, 2026-08 -- see lauds-capitulum-common-of-an-
# apostle.yml's header for why the votive-office view was used.
# "Exsúltet cælum láudibus" -- the classic Common-of-Apostles hymn, same
# text both hours here, a single genuine recension found in the
# reference engine.
lauds-hymn:
  text: |-
    Exsúltet cælum láudibus,
    Resúltet terra gáudiis:
    Apostolórum glóriam
    Sacra canunt solémnia.

    Vos sæcli justi júdices,
    Et vera mundi lúmina,
    Votis precámur córdium,
    Audíte preces súpplicum.

    Qui cælum verbo cláuditis,
    Serásque ejus sólvitis:
    Nos a peccátis ómnibus
    Sólvite jussu, quǽsumus.

    Quorum præcépto súbditur,
    Salus, et languor ómnium:
    Sanáte ægros móribus,
    Nos reddéntes virtútibus.

    Ut, cum Judex advénerit
    Christus in fine sǽculi,
    Nos sempitérni gáudii
    Fáciat esse cómpotes.

    * Deo Patri sit glória,
    Ejúsque soli Fílio,
    Cum Spíritu Paráclito,
    Et nunc, et in perpétuum. Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C1` live query, 2026-08 -- see lauds-capitulum-common-of-an-
# apostle.yml's header for why the votive-office view was used.
lauds-responsory:
  text: |
    R.br. In omnem terram * Exívit sonus eórum.
    R. In omnem terram * Exívit sonus eórum.
    V. Et in fines orbis terræ verba eórum.
    R. Exívit sonus eórum.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. In omnem terram * Exívit sonus eórum.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C1` live query, 2026-08 -- see lauds-capitulum-common-of-an-
# apostle.yml's header for why the votive-office view was used.
lauds-versicle:
  text: |
    V. Annuntiavérunt ópera Dei.
    R. Et facta ejus intellexérunt.
  status: verified

