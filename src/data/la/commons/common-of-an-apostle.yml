# 2026-08-24 -- St. Bartholomew, whose own Nocturn 1 opens with the
# generic "In omnem terram" antiphon rather than a proper one of his own,
# i.e. this Common's own default scheme). Cross-checked against St.
# Andrew's own proper Matins (2026-11-30): identical psalm numbers in
# every slot across all three nocturns, only the antiphon text differs
# (his own proper text narrating his call and martyrdom) -- confirming
# the psalm *numbers* here are the shared Common-of-an-Apostle pool, same
# pattern already established for Common-of-a-Martyr (see that category
# file's own doc comment).
#
# `aliases` also registers `common-of-apostles` (plural, vu's separate id
# for feasts of two-or-more Apostles together) under this same scheme
# (2026-08) — live-verified against the Octave of Ss. Peter and Paul
# (2026-07-06, Duplex): psalms, antiphons, and versicles all
# byte-identical to this file, a genuine full redirect (reference votive
# number C1 covers both per `horas.dialog`'s `[votives]` index, which
# doesn't distinguish singular from plural Apostle commons).
#
# `common-of-an-evangelist` also aliased here (2026-08-27), live-verified
# against St. Luke (2026-10-18, Duplex II. classis, clean/un-outranked):
# every psalm number, every antiphon (La+En), every canticle citation
# (Isa 61:6-9, Sap 3:7-9, Sap 10:17-21), and all three closing versicles
# reproduce this file's content exactly. Matches the reference index's
# own adjacency (`horas.dialog`'s `[votives]`: "Apostolorum/C1,
# Evangelistarum/C1a" back-to-back) -- C1a shares C1's Matins scheme
# outright, same relationship already found between Confessor/Abbot/
# Confessor-not-Bishop and Several-Confessors above. (St. Mark, the
# other candidate tried first, was ruled out as a source purely on
# methodological grounds -- his fixed April 25 date sits inside
# Paschaltide most years, which would have contaminated the "generic"
# antiphon text with seasonal "allelúia" insertions not part of the
# Common's own permanent text; Luke's October date carries no such risk
# and independently confirms the antiphons already believed alleluia-free
# outside psalms 74/95-98's own genuinely-alleluia-bearing text.)
matins-psalmody:
  aliases:
    - common-of-apostles
    - common-of-an-evangelist
  nocturn1:
    groups:
      - psalms:
          - 18
        antiphon: In omnem terram * exívit sonus eórum, et in fines orbis terræ verba eórum.
      - psalms:
          - 33
        antiphon: Clamavérunt justi, * et Dóminus exaudívit eos.
      - psalms:
          - 44
        antiphon: 'Constítues eos * príncipes super omnem terram: mémores erunt nóminis tui, Dómine.'
      - psalms:
          - 46
        antiphon: Príncipes populórum * congregáti sunt cum Deo Ábraham.
      - psalms:
          - 60
        antiphon: Dedísti hereditátem * timéntibus nomen tuum, Dómine.
      - psalms:
          - 63
        antiphon: Annuntiavérunt * ópera Dei, et facta ejus intellexérunt.
    versicle:
      v: In omnem terram exívit sonus eórum.
      r: Et in fines orbis terræ verba eórum.
  nocturn2:
    groups:
      - psalms:
          - 74
        antiphon: Exaltabúntur * córnua justi, allelúia.
      - psalms:
          - 95
        antiphon: Annuntiavérunt * inter gentes glóriam Dómini, in ómnibus pópulis mirabília ejus.
      - psalms:
          - 96
        antiphon: Lux orta est * justo, allelúia, rectis corde lætítia, allelúia.
      - psalms:
          - 97
        antiphon: Déxtera Dómini * salvávit eos, et bráchium sanctum ejus, allelúia.
      - psalms:
          - 98
        antiphon: Custodiébant * testimónia ejus, et præcépta ejus, allelúia.
      - psalms:
          - 100
        antiphon: Perambulábant * in innocéntia cordis sui, in medio domus tuæ.
    versicle:
      v: Constítues eos príncipes super omnem terram.
      r: Mémores erunt nóminis tui, Dómine.
  nocturn3:
    antiphon: Gaudéte * et exsultáte, quia nómina vestra scripta sunt in cælis, dicit Dóminus.
    canticles:
      - refs:
          - book: isa
            chapter: 61
            verses: 6-9
      - refs:
          - book: sap
            chapter: 3
            verses: 7-9
      - refs:
          - book: sap
            chapter: 10
            verses: 17-21
    versicle:
      v: Nimis honoráti sunt amíci tui, Deus.
      r: Nimis confortátus est principátus eórum.

# Generic Common-of-an-Apostle(s) Lauds psalmody, live-verified against
# Divinum Officium (Monastic Tridentinum 1617, command=prayLaudes,
# votive=C1). Psalm numbers (92, 99, 62, Canticum Trium Puerorum) are the
# same fixed Duplex-majus+ set used by every Common (see
# hours/lauds-psalmody-overrides.ts's own doc comment) -- only these
# antiphons are Apostles-specific.
#
# `aliases` registers `common-of-apostles` (the plural id used for a
# group of Apostles, e.g. Ss. Philip and James) under this same scheme --
# both ids' existing lauds-capitulum-*.yml office-bundle files already
# cite the identical `votive=C1` source, so this is one scheme, not two.
#
# Also registers `common-of-an-evangelist`: St. Mark's and St. Luke's own
# reference-engine rule files both say "ex C1a", and `votive=C1a` returned
# byte-identical Lauds/Vespers psalmody to plain `votive=C1` (2026-08-28)
# -- an Evangelist-not-Apostle genuinely reuses the Apostles' own scheme
# in the Monastic tradition, not a separate Evangelist Common.
lauds-psalmody:
  aliases:
    - common-of-apostles
    - common-of-an-evangelist
  groups:
    - psalms:
        - 92
      antiphon: Hoc est præcéptum meum, * ut diligátis ínvicem, sicut diléxi vos.
    - psalms:
        - 99
      antiphon: Maiórem caritátem * nemo habet, ut ánimam suam ponat quis pro amícis suis.
    - psalms:
        - 62
      antiphon: Vos amíci mei estis, * si fecéritis quæ præcípio vobis, dicit Dóminus.
  canticle:
    id: canticum-trium-puerorum
    antiphon: 'Beáti pacífici, * beáti mundo corde: quóniam ipsi Deum vidébunt.'
  laudate:
    antiphon: In patiéntia vestra * possidébitis ánimas vestras.

# Common-of-an-Apostle(s)'s own Paschaltide-variant Lauds psalmody --
# wholesale different text (doubled/tripled allelúia, not just a single
# mechanical suffix), live-verified against Divinum Officium (Monastic
# Tridentinum 1617, command=prayLaudes) via St. Mark's own day
# (2026-04-25, which falls inside Paschaltide), since he has no proper
# Lauds antiphons of his own and so renders this Common's text directly.
# Registers the same aliases as common-of-an-apostle.yml itself
# (common-of-apostles, common-of-an-evangelist) -- one scheme, not three.
# Same psalm numbers as the non-Paschaltide default (92/99/62, Canticum
# Trium Puerorum).
lauds-psalmody/~-paschaltide:
  aliases:
    - common-of-apostles-paschaltide
    - common-of-an-evangelist-paschaltide
  groups:
    - psalms:
        - 92
      antiphon: 'Sancti tui, * Dómine, florébunt sicut lílium, allelúia: et sicut odor bálsami erunt ante te, allelúia.'
    - psalms:
        - 99
      antiphon: 'In cæléstibus regnis * Sanctórum habitátio est, allelúia: et in ætérnum réquies eórum, allelúia.'
    - psalms:
        - 62
      antiphon: In velaménto * clamábant Sancti tui, Dómine, allelúia, allelúia, allelúia.
  canticle:
    antiphon: Spíritus et ánimæ * justórum hymnum dícite Deo nostro, allelúia, allelúia.
  laudate:
    antiphon: Fulgébunt justi * sicut sol in conspéctu Dei, allelúia.

# Generic Common-of-an-Apostle(s) Vespers psalmody, live-verified against
# Divinum Officium (Monastic Tridentinum 1617, command=prayVespera,
# votive=C1, 2026-08-28).
#
# `aliases` registers `common-of-apostles` (the plural id used for a
# group of Apostles, e.g. Ss. Philip and James) under this same scheme --
# both ids' existing vespers-hymn-*.yml office-bundle files already cite
# the identical `votive=C1` source, so this is one scheme, not two.
#
# Also registers `common-of-an-evangelist`: St. Mark's and St. Luke's own
# reference-engine rule files both say "ex C1a", and `votive=C1a` returned
# byte-identical Lauds/Vespers psalmody to plain `votive=C1` (2026-08-28)
# -- an Evangelist-not-Apostle genuinely reuses the Apostles' own scheme
# in the Monastic tradition, not a separate Evangelist Common.
vespers-psalmody:
  aliases:
    - common-of-apostles
    - common-of-an-evangelist
  groups:
    - psalms:
        - 109
      antiphon: 'Iurávit Dóminus, * et non pœnitébit eum: Tu es sacérdos in ætérnum.'
    - psalms:
        - 112
      antiphon: Cóllocet eum * Dóminus cum princípibus pópuli sui.
    - psalms:
        - 115
      antiphon: 'Dirupísti, Dómine, * víncula mea: tibi sacrificábo hóstiam laudis.'
    - psalms:
        - 138
      antiphon: Confortátus est * principátus eórum, et honoráti sunt amíci tui, Deus.

