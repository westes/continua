# Verified against the reference engine's own source data files:
# web/www/horas/Latin/Commune/C4a.txt ("Commune Doctoris Pontificis") and
# its English counterpart, 2026-08. A Common-collect template — `{N}`
# stands for the saint's own name, substituted by getDayCollect
# (hours/resolve-common.ts) via SaintRecord.collectCommon/collectName.
collect/c4a:
  text: |
    Orémus.
    Deus, qui pópulo tuo ætérnæ salútis beátum {N} minístrum tribuísti: præsta, quǽsumus; ut, quem Doctórem vitæ habúimus in terris, intercessórem habére mereámur in cælis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  status: verified

# Same Common-of-a-Confessor Matins hymn as
# matins-hymn-common-of-a-confessor-not-bishop.yml ("Iste Conféssor Dómini
# sacrátus") — see that file's header comment for full sourcing detail
# (Monastic-track textual variant, original English translation).
matins-hymn:
  text: |-
    Iste Conféssor Dómini sacrátus,
    Festa plebs cujus celébrat per orbem,
    Hódie lætus méruit secréta
    Scándere cæli.

    Qui pius, prudens, húmilis, pudícus,
    Sóbrius, castus fuit et quiétus,
    Vita dum præsens vegetávit ejus
    Córporis artus.

    Ob sacrum cujus túmulum frequénter
    Membra languéntum modo sanitáti,
    Quólibet morbo fúerint graváta,
    Restituúntur.

    Unde nunc noster chorus in honórem
    Ipsius, hymnum canit hunc libénter:
    Ut piis ejus méritis juvémur
    Omne per ævum.

    Sit salus illi, decus atque virtus,
    Qui supra cæli résidens cacúmen,
    Tótius mundi máchinam gubérnat
    Trinus et unus. Amen.
  status: verified

# Same Common-of-a-Confessor invitatory antiphon as
# matins-invitatory-common-of-a-confessor.yml — see that file's header
# for full sourcing detail (Commune/C4.txt's own [Invit], inherited
# verbatim by C4a/C4b/C5 alike; C4a is the Doctor Common specifically).
matins-invitatory:
  text: Regem Confessórum Dóminum, * Veníte, adorémus.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C4a` ("Confessoris Pontificis" Doctor variant) live query,
# 2026-08 -- byte-identical to plain `votive=C4` (Common-of-a-Confessor-
# Bishop), so duplicated verbatim under this `common-of-a-confessor-
# doctor` id rather than an alias redirect, same reasoning as common-of-
# a-confessor's own header -- matches the already-existing `matins-hymn-
# common-of-a-confessor-doctor.yml` precedent. Same votive-office-view
# reasoning as vespers-hymn-common-of-a-martyr-bishop.yml's header. Same
# chapter reused
# for Vespers -- no separate vespers-capitulum-<id> file authored, per
# vespers.ts's lookupPart (Vespers chapter, Lauds sibling) fallback.
lauds-capitulum:
  text: 'Ecce sacérdos magnus, qui in diébus suis plácuit Deo, et invéntus est justus: et in témpore iracúndiæ factus est reconciliátio.'
  citation: Sir 44:16-17
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C4` live query, 2026-08 -- see lauds-capitulum-common-of-a-
# confessor-bishop.yml's header for why the votive-office view was used.
# "Jesu Redémptor ómnium" -- a genuinely distinct Lauds hymn from Common-
# of-a-Confessor-Not-Bishop's own "Jesu coróna célsior" (TODO.md's own
# earlier finding, from the votive-office naming: C4 = "Confessoris
# Pontificis," C5 = "Confessoris non Pontificis," two real separate
# categories, not a naming coincidence).
lauds-hymn:
  text: |-
    Jesu Redémptor ómnium,
    Perpes coróna Prǽsulum,
    In hac die cleméntius
    Nostris favéto précibus.

    Tui sacri qua nóminis
    Conféssor almus cláruit:
    Hujus celébrat ánnua
    Devóta plebs solémnia.

    Qui rite mundi gáudia
    Hujus cadúca réspuens,
    Cum Ángelis cæléstibus
    Lætus potítur prǽmiis.

    Hujus benígnus ánnue
    Nobis sequi vestígia:
    Hujus precátu, sérvulis
    Dimítte noxam críminis.

    * Sit Christe, Rex piíssime,
    Tibi, Patríque glória,
    Cum Spíritu Paráclito,
    Et nunc, et in perpétuum. Amen.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C4` live query, 2026-08 -- see lauds-capitulum-common-of-a-
# confessor-bishop.yml's header for why the votive-office view was used.
lauds-responsory:
  text: |
    R.br. Amávit eum Dóminus, * Et ornávit eum.
    R. Amávit eum Dóminus, * Et ornávit eum.
    V. Stolam glóriæ índuit eum.
    R. Et ornávit eum.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Amávit eum Dóminus, * Et ornávit eum.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C4` live query, 2026-08 -- same versicle as Vespers (see
# vespers-versicle-common-of-a-confessor-doctor.yml).
lauds-versicle:
  text: |
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
  status: verified

# C4a.txt inherits from C4 and defines no [Lectio Prima] of its own,
# so the doctor Common uses C4's text (Sir 45:19-20), identical to
# prime-lectio-prima-common-of-a-confessor-bishop.yml.
prime-lectio:
  text: Fungi sacerdótio, et habére laudem in nómine ipsíus, et offérre illi incénsum dignum in odórem suavitátis.
  citation: Sir 45:19-20
  status: verified

# Verified -- C5a references C4a, which shares the C4 (confessor-bishop)
# capitulum at Terce/Sext/None. Content identical to
# terce-capitulum-common-of-a-confessor-bishop.yml (Sir 44:16-17).
terce-capitulum:
  text: |
    Ecce sacérdos magnus, qui in diébus suis plácuit Deo, et invéntus est justus: et in témpore iracúndiæ factus est reconciliátio.
    R. Deo grátias.
    V. Amávit eum Dóminus, et ornávit eum.
    R. Stolam glóriæ índuit eum.
  citation: Sir 44:16-17
  status: verified

# Verified -- C5a references C4a, which shares the C4 (confessor-bishop)
# capitulum at Sext. Content identical to
# sext-capitulum-common-of-a-confessor-bishop.yml (Sir 44:20, 44:22).
sext-capitulum:
  text: |
    Non est invéntus símilis illi, qui conserváret legem Excélsi: ídeo jurejurándo fecit illum Dóminus créscere in plebem suam.
    R. Deo grátias.
    V. Elégit eum Dóminus sacerdótem sibi.
    R. Ad sacrificándum ei hóstiam laudis.
  citation: Sir 44:20; 44:22
  status: verified

# Verified -- C5a references C4a, which shares the C4 (confessor-bishop)
# capitulum at None. Content identical to
# none-capitulum-common-of-a-confessor-bishop.yml (Sir 45:19-20).
none-capitulum:
  text: |
    Fungi sacerdótio, et habére laudem in nómine ipsíus, et offérre illi incénsum dignum in odórem suavitátis.
    R. Deo grátias.
    V. Tu es sacérdos in ætérnum.
    R. Secúndum órdinem Melchísedech.
  citation: Sir 45:19-20
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
