# Content read from the reference engine's live render (Monastic Tridentinum 1617, command=prayVespera):
# Common-level: 01-27 st-john-chrysostom, 03-07 st-thomas-aquinas, 06-14 st-basil-the-great, 07-14
# st-bonaventure, 12-07 st-ambrose. First Vespers variant; the default (second Vespers) file is the same id
# without "-first". See hours/resolve-common.ts's withVespersVariant.
vespers-versicle/~-first:
  text: |
    V. Amávit eum Dóminus, et ornávit eum.
    R. Stolam glóriæ índuit eum.
  status: verified

# Verified against Divinum Officium (Monastic Tridentinum 1617) -- C5a
# (Commune Doctoris non Pontificis) references C4a's Benedictus antiphon,
# which is byte-identical to the confessor-bishop Benedictus. Content
# sourced from benedictus-antiphon-common-of-a-confessor-bishop.yml.
benedictus-antiphon:
  text: Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
  status: verified

# Second Vespers Magnificat antiphon for `common-of-a-confessor-doctor`
# (C5a, Commune Doctoris non Pontificis) -- Ant 3 is @:Ant 1, which
# itself is @Commune/C4a. C4a's Ant 1: "O Doctor óptime...". The "N."
# is the standard liturgical saint-name placeholder, rendered as-is.
# Sourced directly from Latin/Commune/C4a.txt; English is a translation.
magnificat-antiphon:
  text: O Doctor óptime, * Ecclésiæ sanctæ lumen, beáte N., divínæ legis amátor, deprecáre pro nobis Fílium Dei.
  status: verified

# Paschaltide Second Vespers Magnificat of a Doctor who is a Bishop: the engine renders the Confessor Bishop's "Amávit eum Dóminus" instead of "O Doctor óptime" (St. Gregory Nazianzen, May 9, 2028; Monastic Tridentinum 1617). First Vespers is not rendered for it, so hours/resolve-common.ts keeps the ordinary First-Vespers text.
# The paschal tier is tried by getMagnificatAntiphon for Second Vespers only.
magnificat-antiphon/~-paschaltide:
  text: 'Amávit eum Dóminus, * et ornávit eum: stolam glóriæ índuit eum, et ad portas paradísi coronávit eum, allelúia.'
  status: verified
