# The Office of the Dead's fixed texts: the "Requiem gloria" said in place of
# the Gloria Patri after every psalm and canticle, and the special closing
# (Conclusio specialis) that ends each hour instead of Benedicamus Domino.
requiem-gloria-patri:
  text: |-
    Réquiem ætérnam * dona eis, Dómine.
    Et lux perpétua * lúceat eis.
  status: verified

requiem-conclusio:
  text: |-
    V. Réquiem ætérnam dona eis, Dómine.
    R. Et lux perpétua lúceat eis.
    V. Requiéscant in pace.
    R. Amen.
  status: verified

requiem-martyrology-versicle:
  text: |-
    V. In memória ætérna erunt justi.
    R. Ab auditióne mala non timébunt.
  status: verified

requiem-collect-deus-veniae:
  text: 'Deus, véniæ largítor et humánæ salútis amátor: quǽsumus cleméntiam tuam; ut ánimas ómnium fidélium qui ex hoc sǽculo transiérunt, beáta María semper Vírgine intercedénte cum ómnibus Sanctis tuis, ad perpétuæ beatitúdinis consórtium perveníre concédas. Per Christum Dóminum nostrum. Amen.'
  status: verified

requiem-collect-fidelium:
  text: 'Fidélium, Deus, ómnium Cónditor et Redémptor, animábus famulórum famularúmque tuárum remissiónem cunctórum tríbue peccatórum: ut indulgéntiam, quam semper optavérunt, piis supplicatiónibus consequántur: Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.'
  status: verified

requiem-compline-versicles:
  text: |-
    V. A porta ínferi.
    R. Erue, Dómine, ánimas eórum.
    V. Requiéscant in pace.
    R. Amen.
    V. Dómine, exáudi oratiónem meam.
    R. Et clamor meus ad te véniat.
  status: verified
